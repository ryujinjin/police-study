헌법에서 명시적 으로 입법위임을 하고 있거나 우리 헌법의 해석상 입법의무가 발생하는 경우가 아니라도, 자유권규약이 명시적으로 입법을 요구하고 있거나 그 해석상 국가의 기본권보장의무가 인정되는 경우에는 곧바로 국가의 입법의무가 도출된다.","‘국제통화기금협정’ 제9조 제3항(사법절차의 면제) 및 제8항 (직원 및 피용자의 면제와 특권)은 국회의 동의를 얻어 체결된 것으로서, 헌법 제6조 제1항에 따라 국내법적, 법률적 효력을 가지는 바, 가입국의 재판권 면제에 관한 것이므로 성질상 국내에 바로 적용될 수 있는 법규범으로서 위헌법률심판의 대상이 된다.","‘세계무역기구설립을위한마라케쉬협정’은 적법하게 체결되어 공포된 조약이므로 국내법과 같은 효력을 갖는 것이지만, 그로 인하여 새로운 범죄를 구성하거나 범죄자에 대한 처벌이 가중 되는 것은 법률에 의하지 아니한 형사처벌이다.",2,0,""],["2024-2","헌법",3,"정당에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","정당은 개인과 국가를 잇는 중간매체로서, 정당의 중개인적 역할로 말미암아 국민의 정치적 의사는 선거를 통하지 아니 하고도 국가기관 의사결정에 영향력을 미칠 수 있다.","정당이 헌법재판소 정당해산결정에 따라 해산된 경우 그 결정 취지에서 그 소속 비례대표지방의회의원의 의원직 상실이 곧바로 도출된다고 할 수 없다.","헌법이 특별히 정당설립의 자유와 복수정당제를 보장하고, 정당의 해산을 엄격한 요건 아래 인정하면서 정당을 특별히 보호한다고 하여도, 정당은 국민의 자발적 조직으로서, 그 법적 성격은 일반적으로 사적･정치적 결사 내지는 법인격 없는 사단 이므로, 정당이 공권력의 행사 주체로서 국가기관의 지위가 있는 것은 아니다.","임기 만료에 따른 국회의원선거에 참여하여 의석을 얻지 못하고 유효투표 총수의 100분의 2 이상을 득표하지 못할 때 정당 등록을 취소하더라도 정당설립의 자유는 침해되지 않는다. (일반공채･101경비단)",3,0,""],["2024-2","헌법",4,"헌법에서 처음 명문으로 규정한 시기가 같은 개별 기본권끼리 묶이지 않은 것은?","1948년 헌법: 양심의 자유 - 근로자의 이익분배균점권 - 공무원 파면청구권","1962년 헌법: 인간으로서의 존엄과 가치 - 직업선택의 자유 - 인간다운 생활을 할 권리","1980년 헌법: 행복추구권 - 사생활의 비밀과 자유 - 환경권","1987년 헌법: 사상의 자유 - 형사피해자의 재판절차상 진술권 - 범죄피해자구조청구권",3,0,""],["2024-2","헌법",5,"기본권주체성에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","카자흐스탄 국적의 고려인은 외국국적동포로서 ‘인간의 권리’뿐 아니라 ‘국민의 권리’에 대해서도 기본권주체성이 있다.","18세 이상으로서 선거인명부작성기준일 현재 영주의 체류자격 취득일 후 3년이 지난 외국인으로서 해당 지방자치단체의 외국인 등록대장에 올라 있는 사람에게 그 구역에서 선거하는 지방자치 단체 의회의원과 장의 피선거권을 부여하므로 외국인도 피선거권의 주체가 될 수 있다.","공법인이나 이에 준하는 지위를 가진 자라 하더라도 공무를 수행하거나 고권적 행위를 하는 경우가 아닌 사경제 주체로서 활동하는 경우나 조직법상 국가로부터 독립한 고유 업무를 수행하는 경우, 그리고 다른 공권력 주체와의 관계에서 지배 복종관계가 성립되어 일반 사인처럼 그 지배하에 있는 경우 등에는 기본권 주체가 될 수 있다.","법인인 서울대학교와 인천대학교를 제외하고 국립대학교는 ｢정부조직법｣ 제4조 부속기관의 일종인 교육훈련기관으로서 영조물에 불과하므로 대학의 자율권과 관련하여 기본권 주체가 될 수 없다.",2,0,""],["2024-2","헌법",6,"법률에 근거한 기본권 제한에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","법률에서 명시적으로 규정된 제재보다 더 가벼운 것을 하위 규칙에서 규정하더라도 만일 그것이 기본권 제한적 효과를 지니게 된다면, 이는 행정법적 법률유보원칙에 어긋나는지와 상관없이 헌법 제37조 제2항에 따라 엄격한 법률적 근거를 지녀야 한다.","법률 위임의 구체성･명확성의 요구 정도는 규제대상의 종류와 성격에 따라서 달라지는데, 기본권침해 영역에서는 급부행정 영역에서보다는 구체성 요구가 강화되고, 다양한 사실관계를 규율하거나 사실관계가 수시로 변화될 것이 예상되면 위임의 명확성 요건이 완화되어야 한다.","법률의 위임규정 자체가 그 의미 내용을 정확하게 알 수 있는 용어를 사용하여 위임 한계를 분명히 밝히는데도 하위법령이 그 문언적 의미의 한계를 벗어나거나, 위임규정에서 사용하는 용어의 의미를 넘어 그 범위를 확장 혹은 축소함으로써 위임 내용을 구체화하는 단계를 벗어나 새로운 입법으로 평가할 수 있다면 이는 위임 한계를 일탈한 것으로 허용되지 않는다.","법률에서 일부 내용을 하위법령에 위임할 때, 해당 법률에서 사용된 추상적 용어가 하위법령에서 규정될 내용과는 별도로 독자적인 규율 내용을 정하려는 것이라도 포괄위임금지원칙 위반 여부와 별도로 명확성원칙이 문제될 수 없다.",3,0,""],["2024-2","헌법",7,"일반적 행동자유권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","일반적 행동자유권의 보호영역에는 가치 있는 행동만 포함된다.","일반적 행동자유권에는 적극적으로 자유롭게 행동을 하는 것은 물론 소극적으로 행동을 하지 않을 자유, 즉 부작위의 자유도 포함된다.","무상 또는 일회적･일시적으로 가르치는 행위는 일반적 행동 자유권에 속한다.","행복추구권에는 일반적 행동자유권과 개성의 자유로운 발현권이 함축되어 있다.",0,0,""],["2024-2","헌법",8,"적법절차에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","세무대학의 폐지를 목적으로 하는 법률안을 의결하는 경우 입법절차에 있어서 당연히 이해관계자들의 의견을 조사하는 등 청문절차를 거쳐야 하므로, 별도의 청문절차를 거치지 않은 것만 으로도 헌법 제12조 적법절차에 위반된다.","행정절차상 강제처분에 의해 신체의 자유가 제한되는 경우 강제 처분의 집행기관으로부터 독립된 중립적인 기관이 이를 통제 하도록 하는 것은 적법절차원칙의 내용에 해당하지 않는다.","형사재판에 계속 중인 사람에 대하여 출국을 금지할 수 있다고 규정한 ｢출입국관리법｣ 조항에 따른 출국금지결정은 성질상 신속성과 밀행성을 요하므로 출국금지 대상자에게 사전통지를 하거나 청문을 실시하지 않더라도, 출국금지 후 즉시 서면으로 통지하도록 하고 있고, 출국금지결정에 대해 사후적으로 다툴 수 있는 기회를 제공하므로 적법절차원칙에 위배된다고 보기 어렵다.","수사기관 등이 전기통신사업자에게 이용자의 성명 등 통신자료의 열람이나 제출을 요청할 수 있도록 한 ｢전기통신사업법｣ 조항은, 효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 정보주체인 이용자에게 그 내역을 통지하도록 하는 것이 적절하지 않기 때문에 사후통지절차를 두지 않더라도 적법절차원칙에 위배되지 않는다.",2,0,""],["2024-2","헌법",9,"거주･이전의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","아프가니스탄 등 전쟁이나 테러위험이 있는 해외 위난지역에서 여권 사용을 제한하거나 방문 또는 체류를 금지한 외교통상부 고시는 거주･이전의 자유를 침해한다.","입국의 자유는 인간의 존엄과 가치 및 행복추구권과 밀접한 관련이 있는 인간의 권리에 속하므로, 입국의 자유에 대한 외국인의 기본권주체성은 인정된다.","국민의 거주･이전의 자유는 국외에서 체류지와 거주지를 자유 롭게 정할 수 있는 ‘해외여행 및 해외이주의 자유’와 외국에서 체류하거나 거주하려고 대한민국을 떠날 수 있는 ‘출국의 자유’를 포함하지만, 외국체류나 거주를 중단하고 다시 대한민국으로 돌아 올 수 있는 ‘입국의 자유’는 포함하지 않는다.","누구든지 주민등록 여부와 무관하게 거주지를 자유롭게 이전할 수 있어서, 주민등록 여부가 거주･이전의 자유와 직접적인 관계가 있다고 보기도 어렵고, 영내 기거하는 현역병은 ｢병역법｣으로 말미암아 거주･이전의 자유를 제한받게 된다. 따라서 군인이 영내에 거주할 때 그가 속한 세대의 거주지에 주민등록을 하게 할지라도 그의 거주･이전의 자유는 제한되지 않는다.",3,0,""],["2024-2","헌법",10,"직업의 자유에 포함되는 것만을 나열한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","‘기업의 설립과 경영의 자유를 의미하는 기업의 자유’와 ‘원하는 직장을 제공하여 줄 것을 청구할 권리’","‘다른 기업과의 경쟁에서 국가의 간섭이나 방해를 받지 않고 기업활동을 할 수 있는 경쟁의 자유’와 ‘누구든지 자기가 선택한 직업에 종사하여 이를 영위하고 언제든지 임의로 그것을 바꿀 수 있는 자유’","‘여러 개의 직업을 선택하여 동시에 함께 행사할 수 있는 겸직의 자유’와 ‘사용자의 처분에 따른 직장 상실로부터 직접 보호하여 줄 것을 청구할 권리’","‘한번 선택한 직장의 존속 보호를 청구할 권리’와 ‘자신이 원하는 직업이나 직종에 종사하는 데 필요한 전문지식을 습득하기 위한 직업교육장을 임의로 선택할 수 있는 직업교육장 선택의 자유’",1,0,""],["2024-2","헌법",11,"사생활의 비밀과 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","어린이집에 폐쇄회로 텔레비전(CCTV)을 원칙적으로 설치 하도록 정한 ｢영유아보호법｣ 조항은 보호자 전원이 반대하지 않는 한 어린이집에 의무적으로 CCTV를 설치하도록 정하고 있으므로 어린이집 보육교사(원장 포함) 및 영유아의 사생활의 비밀과 자유를 침해한다.","대체복무요원 생활관 내부의 공용공간에 CCTV를 설치하여 촬영하는 행위는 군부대와 달리 대체복무요원들의 모든 사적 활동의 동선을 촬영하여, 개인의 행동과 심리에 심각한 제약을 느끼게 하므로 대체복무요원들의 사생활의 비밀과 자유를 침해한다.","교도소장이 수형자의 정신과진료 현장과 정신과 화상진료 현장에 각각 간호직교도관을 입회시킨 것은, 수형자에게 사생활 노출 염려로 솔직한 증세를 의사에게 전달하지 못하게 함으로써 해당 수형자의 사생활의 비밀과 자유를 침해한다.","헌법 제17조가 보호하고자 하는 기본권은 ‘사생활영역’의 자유로운 형성과 비밀유지라고 할 것이며, 공적인 영역의 활동은 다른 기본권에 의한 보호는 별론으로 하고 사생활의 비밀과 자유가 보호하는 것은 아니라고 할 것이다.",3,0,""],["2024-2","헌법",12,"양심의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","헌법상 보호되는 양심은 어떤 일의 옳고 그름을 판단할 때 그렇게 행동하지 아니하고는 자신의 인격적인 존재가치가 허물어지고 말 것이라는 강력하고 진지한 마음의 소리로서 절박하고 추상적인 양심을 말한다.","양심은 그 대상이나 내용 또는 동기에 따라서 판단될 수 있고, 특히 양심상 결정이 이성적･합리적인가, 타당한가 또는 법질서나 사회규범･도덕률과 일치하는가 하는 관점은 양심의 존재를 판단 하는 기준이 될 수 있다.","양심은 민주적 다수의 사고나 가치관과 일치하는 것이 아니라, 개인적 현상으로서 지극히 주관적인 것이다.","국가는 국민의 기본권을 확인하고 보장할 의무가 있으므로, 어떤 사람이 양심적 병역거부를 주장하면 그 사람이 자신의 ‘양심’을 외부로 표명하여 증명하여야 하는 것이 아니라, 국가가 그 사람의 병역거부가 양심에 따른 것인지를 확인하여야 한다.",2,0,""],["2024-2","헌법",13,"종교의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","출력수(작업에 종사하는 수형자)를 대상으로 원칙적으로 월 3∼4회의 종교집회를 실시하는 반면, 미결수용자와 미지정 수형자에 대해서는 원칙적으로 매월 1회, 그것도 공간의 협소함과 관리 인력의 부족을 이유로 수용동별로 돌아가며 종교집회를 실시하여 실제 연간 1회 정도의종교집회 참석 기회를부여한 구치소장의 종교집회참석 제한 처우는미결수용자및미지정수형자의종교의자유를침해한것이다.","구치소에 종교행사 공간이 1개뿐이고, 종교행사는 종교, 수형자와 미결수용자, 성별, 수용동 별로 진행되며, 미결수용자는 공범이나 동일사건 관련자가 있는 경우 이를 분리하여 참석하게 해야 하는 점을 고려하더라도, 구치소 내 미결수용자를 대상으로 한 개신교 종교행사를 4주에 1회, 일요일이 아닌 요일에 실시한 구치소장의 종교행사 처우는 미결수용자의 종교의 자유를 침해한다.","2009. 6. 1.부터 2009. 10. 8.까지 구치소 내에서 실시하는 종교의식 또는 행사에 일률적으로 미결수용자의 참석을 금지한 구치소장의 종교행사 등 참석불허 처우는, 미결수용자의 기본권을 덜 침해하는 수단이 존재함에도 불구하고 이를 전혀 고려하지 아니하였으므로 과잉금지원칙을 위반하여 미결수용자의 종교의 자유를 침해하였다.","금치처분을 받은 사람은 최장 30일 이내의 기간 동안 종교의식 또는 행사에 참석할 수 없으나 종교상담을 통해 종교활동은 할 수 있어서, 금치기간 중 30일 이내 공동행사 참가를 정지하는 ｢형의 집행 및 수용자의 처우에 관한 법률｣ 조항은 수용자의 종교의 자유를 침해하지 아니한다.",1,0,""],["2024-2","헌법",14,"선거운동과 정치적 표현의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","｢농업협동조합법｣･｢수산업협동조합법｣에 의하여 설립된 조합 (이하 ‘협동조합’)의 상근직원에 대하여 선거운동을 금지하는 구 ｢공직선거법｣ 조항의 해당 부분은 정치적 의사표현 중 당선 또는 낙선을 위한 직접적인 활동만을 금지할 뿐이므로 협동 조합 상근직원의 선거운동의 자유를 침해하지 않는다.","지방공사 상근직원의 선거운동을 금지하고, 이를 위반한 자를 처벌하는 ｢공직선거법｣ 조항의 해당 부분은 지방공사 상근 직원에 대하여 ‘그 지위를 이용하여’ 또는 ‘그 직무 범위 내 에서’ 하는 선거운동을 금지하는 방법만으로는 선거의 공정성이 충분히 담보될 수 없어 지방공사 상근직원의 선거운동의 자유를 침해하지 아니한다.","안성시시설관리공단(이하 ‘공단’)의 상근직원이, 당원이 아닌 자에게도 투표권을 부여하는 당내경선에서 경선운동을 할 수 없도록 금지･처벌하는 ｢공직선거법｣ 조항의 해당 부분은 당내 경선의 공정성과 형평성 확보에 기여하여 공단 상근직원의 정치적 표현의 자유를 침해하지 않는다.","광주광역시 광산구 시설관리공단(이하 ‘공단’)의 상근직원이, 당원이 아닌 자에게도 투표권을 부여하는 당내경선에서 경선 운동을 할 수 없도록 금지･처벌하는 ｢공직선거법｣ 조항의 해당 부분은, 공단의 상근직원은 공단의 경영에 관여하거나 실질적인 영향력을 미칠 수 있는 권한을 가지고 있고, 경선운동으로 인한 부작용과 폐해가 커서 공단 상근직원의 정치적 표현의 자유를 침해하지 아니한다.",0,0,""],["2024-2","헌법",15,"공무담임권에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 헌법재판소 판례에 의함) ㉠ 지방자치단체 공무원이 연구기관이나 교육기관 등에서 연수하기 위한 휴직기간은 2년 이내로 한다고 규정한 ｢지방공무원법｣ 조항은 연수휴직 기간의 상한을 제한하는 내용으로, 공직취임의 기회를 배제하거나 공무원 신분을 박탈하는 것과 관련이 없으므로, 휴직조항으로 인하여 법학전문대학원에 진학하려는 9급 지방공무원의 공무담임권이 침해될 가능성을 인정하기 어렵다. ㉡ 농업협동조합장이 지방의회의원선거 후보자가 되려면 지방의회 의원의 임기만료일 전 90일까지 그 직에서 해임되도록 규정한 구 ｢지방의회의원선거법｣ 조항은, 특정 계층의 여과된 이익과 전문가적 경험을 지방자치에서 조화있게 반영시키려는 것으로서 농업협동조합장의 공무담임권을 침해하지 않는다. ㉢ 회계책임자가 ｢공직선거법｣이나 ｢정치자금법｣ 소정의 조항을 위반하여 300만 원 이상의 벌금형을 선고받아 확정된 경우, 후보자의 당선이 무효로 되도록 규정한 ｢공직선거법｣ 조항은 후보자의 관리･감독책임 없음을 입증하여 면책될 가능성조차 부여하지 않아, 책임주의 원칙에 위배되어 국회의원 당선자의 공무담임권을 침해한다. ㉣ 아동･청소년대상 성범죄는 재범 위험성이 높고 시간이 지나도 공무수행을 맡기기에 충분할 만큼 국민의 신뢰가 회복되기 어려우므로, 아동･청소년이용음란물임을 알면서 이를 소지한 죄로 형을 선고받아 그 형이 확정된 사람은 일반직공무원으로 임용될 수 없도록 규정한 ｢국가공무원법｣ 및 ｢지방공무원법｣ 조항은 그 형이 확정된 사람의 공무담임권을 침해하지 않는다.","1개","2개","3개","4개",0,0,""],["2024-2","헌법",16,"재판을 받을 권리에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 하는 ｢형사소송법｣ 조항은 불이익변경금지원칙을 적용하지 않아 과잉금지원칙에 위반되어 피고인의 공정한 재판을 받을 권리를 침해한다.","기피신청이 소송의 지연을 목적으로 함이 명백한 경우에는 그러한 신청을 받은 법원 또는 법관이 스스로 신속하게 신청을 기각할 수 있도록 하는 ｢형사소송법｣ 조항은, 소송절차의 지연을 목적으로 한 기피신청의 남용을 방지하여 형사소송절차의 신속성의 실현이라는 공익을 달성하기 위한 것으로 헌법 제27조 제1항, 제37조 제2항에 위반된다고 할 수 없다.","교정시설의 장이 미결수용자에게 교정시설 내 규율위반에 대해 징벌을 부과한 뒤 그 규율위반 내용 및 징벌처분 결과 등을 관할 법원에 양형 참고자료로 통보한 것은, 법관이 양형에 참고할 수 있는 자료로 작용할 수 있어 미결수용자의 공정한 재판을 받을 권리를 제한한다.","영상물에 수록된 ‘19세 미만 성폭력범죄 피해자’의 진술에 관하여 조사 과정에 동석하였던 신뢰관계인의 법정진술에 의하여 그 성립의 진정함이 인정된 경우에도 증거능력을 인정 할 수 있도록 정한 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 조항 중 해당 부분은, 피고인의 형사절차상 권리의 보장과 미성년 피해자의 보호 사이의 조화를 도모한 것으로 피고인의 공정한 재판을 받을 권리를 침해하지 않는다.",1,0,""],["2024-2","헌법",17,"대학의 자율성에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 헌법재판소 판례에 의함) ㉠ 학칙의 제정 또는 개정에 관한 사항 등 대학평의원회의 심의 사항을 규정한 ｢고등교육법｣ 조항은 연구와 교육 등 대학의 중심적 기능에 관한 자율적 의사결정을 방해한다고 볼 수 있어, 국･공립대학 교수회 및 교수들의 대학의 자율권을 침해한다. ㉡ 대학의 학문과 연구 활동에서 중요한 역할을 담당하는 교원 에게 그와 관련된 영역에서 주도적인 역할을 인정하는 것은 대학의 자율성의 본질에 부합하고 필요하며, 그것은 교육과 연구에 관한 사항은 모두 교원이 전적으로 결정할 수 있어야 한다는 의미이다. ㉢ 서울대학교 2023학년도 저소득학생 특별전형의 모집인원을 모두 수능위주전형으로 선발하도록 정한 ‘서울대학교 2023학년도 대학 신입학생 입학전형 시행계획’은 저소득학생 특별전형에 응시하고자 하는 수험생들의 기회를 불합리하게 박탈하였고, 이는 대학의 자율성의 범위 내에 있는 것으로 볼 수 없다. ㉣ ‘대통령긴급조치 제9호’는 학생의 모든 집회･시위와 정치관여 행위를 금지하고, 위반자에 대하여는 주무부장관이 학생의 제적을 명하고 소속 학교의 휴업, 휴교, 폐쇄조치를 할 수 있도록 규정하여, 학생의 집회･시위의 자유, 학문의 자유와 대학의 자율성 내지 대학자치의 원칙을 본질적으로 침해한다.","1개","2개","3개","4개",0,0,""],["2024-2","헌법",18,"인간다운 생활을 할 권리에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","지방자치단체장을 ｢공무원연금법｣상 퇴직급여 및 퇴직수당의 지급 대상에서 제외하고 있는 구 ｢공무원연금법｣ 조항은, 근무 형태 및 보수체계에 있어서 다른 일반 공무원과 차이가 없음 에도 차별을 두는 것으로 지방자치단체장의 인간다운 생활을 할 권리를 침해한다.","외국인만으로 구성된 가구 중 영주권자 및 결혼이민자만을 긴급 재난지원금 지급대상에 포함시키고 난민인정자를 제외한 관계 부처합동 ‘긴급재난지원금 가구구성 및 이의신청 처리기준(2차)’ 중 해당 부분은, ‘영주권자 및 결혼이민자’와 ‘난민인정자’ 간 합리적 차별이라 할 것이므로 난민인정자의 인간다운 생활을 할 권리를 침해하지 아니한다.","｢산업재해보상보험법｣상 유족급여를 수령할 수 있는 소정의 유족의 범위에 ‘직계혈족의 배우자’를 포함시키고 있지 않은 동법 조항은, 입법형성의 한계를 일탈하여 청구인의 인간다운 생활을 할 권리를 침해하고 있다고 보기는 어렵다.","｢공무원연금법｣에 따른 퇴직연금일시금을 받은 사람에게 기초 연금을 지급하지 아니하도록 한 ｢기초연금법｣ 및 동법 시행령 조항은 퇴직연금일시금의 액수 및 수령시점, 현존 여부 등을 고려하지 않은 채 퇴직연금일시금을 받은 사람을 무조건 기초 연금 지급대상에서 제외하고 있으므로, 퇴직연금일시금 수령자의 인간다운 생활을 할 권리를 침해한다.",2,0,""],["2024-2","헌법",19,"혼인과 가족생활에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","태아의 성별고지 행위는 그 자체로 태아를 포함하여 누구에게도 해가 되는 행위가 아니지만, 보다 풍요롭고 행복한 가족생활을 영위하도록 하기 위해 진료과정에서 알게 된 태아에 대한 성별 정보는 낙태방지를 위하여 임신 32주 이전에는 고지하지 못하도록 금지하여야 할 이유가 있다.","당사자 사이에 혼인의사의 합의가 없음을 원인으로 하는 혼인 무효판결에 의한 가족관계등록부 정정신청으로 해당 가족관계 등록부가 정정된 때, ‘그 혼인무효사유가 한쪽 당사자나 제3자의 범죄행위로 인한 경우’에 한정하여 등록부 재작성 신청권을 부여한 ‘가족관계등록부의 재작성에 관한 사무처리지침’ 조항은 혼인과 가족생활을 스스로 결정하고 형성할 수 있는 자유를 제한한다.","국가에게 혼인과 가족생활의 보호자로서 부모의 자녀양육을 지원할 헌법상 과제가 부여되어 있다 하더라도, 그로부터 곧바로 헌법이 국가에게 자녀를 양육하는 모든 병역의무 이행자들의 출퇴근 복무를 보장하여 자녀가 있는 대체복무요원들까지 합숙 복무의 예외를 인정하여야 할 명시적인 입법의무를 부여하였다고 할 수는 없다.","‘혼인 중 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고’를 허용하도록 규정하지 아니한 ｢가족관계의 등록 등에 관한 법률｣ 조항은 과잉금지원칙을 위배하여 생부인 청구인들의 가족생활의 자유를 침해한다.",2,0,""],["2024-2","헌법",20,"국방의무에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","민주국가에서 병역의무는 납세의무와 더불어 국가라는 정치적 공동체의 존립･유지를 위하여 국가 구성원인 국민에게 그 부담이 돌아갈 수밖에 없는 것으로서, 병역의무 부과를 통해서 국가방위를 도모하는 것은 국가공동체에 필연적으로 내재하는 헌법적 가치이다.","남자만을 징병검사의 대상이 되는 병역의무자로 정한 것은 현저히 자의적인 차별취급이라 보기 어려워 평등권을 침해 하지 않는다.","병역의무를 부과하게 되면 그 의무자의 기본권은 여러 가지 면 에서 제약을 받으므로, 법률에 의한 병역의무 형성에도 헌법적 한계가 없다고 할 수 없고 헌법의 일반원칙, 기본권보장 정신에 의한 한계를 준수하여야 한다.","국가정보원이 주관하는 신규채용경쟁시험에서 ‘남자는 병역을 필한 자’로 제한하여, 현역군인 신분자의 시험응시기회를 제한 하는데, 이는 병역의무를 이행하느라 받는 불이익이므로 헌법 제39조 제2항에서 금지하는 ‘불이익한 처우’에 해당한다.",3,0,""],["2024-2","형사법",1,"죄형법정주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제62조의2 제1항에 따라 형의 집행유예 시 부과할 수 있는 보호관찰은 형벌이 아니라 보안처분의 성격을 갖는 것 으로서 재판 시의 규정에 의하여 보호관찰을 받을 것을 명할 수 있다고 해석하는 것은 형벌불소급의 원칙에 반하지 않는다.","｢도로교통법｣ 제43조(무면허운전 등의 금지)를 위반하여 운전 면허를 받지 아니하고 자동차를 운전하는 행위를 대상으로 하는 ｢교통사고처리 특례법｣ 제3조 제2항 단서 제7호를 운전면허 취소사실을 알지 못하고 자동차를 운전하는 경우도 포함하는 것으로 해석하는 것은 유추해석금지의 원칙에 반하지 않는다.","｢가정폭력범죄의 처벌 등에 관한 특례법｣이 정한 보호처분 중 하나인 사회봉사명령은 보안처분의 성격을 가지나, 이는 가정폭력 범죄행위에 대하여 형사처벌 대신 부과되는 것으로서 원칙적으로 형벌불소급의 원칙에 따라 행위시법을 적용함이 상당하다.","｢군형법｣ 제64조 제3항 상관명예훼손죄에 대해 ｢형법｣ 제310조 (위법성의 조각)와 같은 규정을 별도로 두지 않았다고 하더라도 법규범의 체계, 입법 의도와 목적 등에 비추어 정당하다고 평가 되는 한도 내에서 그와 유사한 사안에 관한 법규범을 적용할 수 있다고 할 것이므로 ｢형법｣ 제310조는 ｢군형법｣ 제64조 제3항의 행위에 대해 유추적용된다고 보아야 한다.",1,0,""],["2024-2","형사법",2,"｢형법｣의 적용범위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","법무사 등록증 대여를 처벌하는 ｢법무사법｣ 제72조 제1항에 더하여 2017. 12. 12. 동법 제72조 제2항의 몰수･추징 조항이 뒤늦게 신설되었다면, 2014. 1.경부터 2018. 4. 9.경까지 법무사 등록증 대여 금지를 위반하여 취득한 이익 전부를 추징하더라도 형벌법규의 소급효 금지 원칙에 반하지 않는다.","유사수신약정 체결 및 출자금 수수 행위가 대한민국 영역 내에서 이루어진 이상, 비록 인터넷 홈페이지를 개설한 장소나 출자금을 최종적으로 수령한 장소가 대한민국 영역 외라 하더라도 성명･ 국적 불상의 회사 운영자들에게 ｢형법｣ 제2조(국내범), 제8조 (총칙의 적용)에 따라 대한민국의 형벌법규인 ｢유사수신행위법｣이 적용된다.","미합중국 군대의 군속 중 통상적으로 대한민국에 거주하고 있는 자는 SOFA 협정이 적용되는 군속의 개념에서 배제 되므로, 10년 넘게 대한민국에 머물면서 한국인 아내와 결혼 하여 가정을 마련하고 직장 생활을 하는 등 생활근거지를 대한민국에 두고 있었던 미합중국 국적의 甲이 저지른 범죄에 대해 대한민국의 형사재판권을행사할 수 있다.","대한민국 영역 밖에서 ｢형법｣ 제287조의 미성년자 약취･유인 죄를 범한 외국인에게도 대한민국 ｢형법｣이 적용된다.",0,0,""],["2024-2","형사법",3,"인과관계에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","“卜”자형 삼거리에서 제한 속도를 위반하여 과속운전을 한 직진 차량 운전자가 대향차선에서 신호를 위반하여 좌회전을 하는 차량과 교차로 통과시 서로 충돌하여 사고가 발생하였다면, 다른 특별한 사정이 없는 한 제한 속도를 위반하여 과속운전한 운전자의 잘못과 교통사고의 발생 사이에 상당인과관계가 있다고 볼 수 없다.","한국철도공사의 야간 업무에 사용되는 조명탑을 노동조합원 甲이 위법하게 점거하여 위력에 의한 업무방해죄가 성립하였고, 다른 노동조합원 乙 등이 그 조명탑 아래에서 지지 발언을 하며 음식물을 제공하는 행위를 하였지만, 乙 등의 행위가 표현의 자유･일반적 행동의 자유나 단결권의 보호 영역을 벗어 났다고 볼 수 없다면 乙 등의 조력행위와 甲의 업무방해죄의 실현 사이에 인과관계를 인정하기 어려우므로 乙 등에게 업무 방해방조죄가 성립하지 않는다. (일반공채･101경비단･경찰행정 경채)","의료과오사건에서 수술을 마친 후 의사가 복막염에 대한 진단과 처치를 지연하는 등의 과실로 환자가 제때 필요한 조치를 받지 못해 사망하였다고 할지라도 환자가 의사의 입원 지시 및 금식 지시를 무시하고 귀가한 사정이 있다면 의사의 과실과 환자 사망 사이의 인과관계는 단절된다.","거동범에 해당하는 진정부작위범과는 달리 부진정부작위범은 결과범에 해당하므로, 사회적으로 기대되는 작위의무를 다하 였으면 결과가 발생하지 않았을 것이라는 관계가 인정될 때 그 부작위와 결과 사이에 인과관계가 인정된다.",2,0,""],["2024-2","형사법",4,"다음 사례에 관한 설명으로 가장 적절한 것은? 甲은 남편 A가 매일 술을 마시고 들어와서 행패를 부리는 등 A와의 불화로 갈등을 겪는 중이었다. 이에 甲은 새벽에 문이 열리는 소리가 들리고 누군가 집안으로 들어오자, A에 대한 상해의 고의로 컵을 집어 던졌다. 그러자 사람이 ‘어이쿠’하며 쓰러지는 소리가 나서 불을 켜보니, A가 아니라 칼을 든 B가 컵에 머리를 맞고 쓰러져 있었다. B는 강도를 하기 위하여 甲의 집으로 들어오던 중이었다.","위 사례는 구체적 사실의 착오 중 객체의 착오에 해당하는 사례로 구체적 부합설에 따를 경우, 甲의 행위는 A에 대한 상해미수와 B에 대한 과실치상의 죄가 성립하고 양 죄는 상상적 경합관계에 있다.","위 사례는 주관적 정당화요소가 결여된 사례로 이러한 때에는 행위반가치는 존재하지만 결과반가치는 존재하지 않아 불능 미수범 규정을 유추적용하자는 견해에 따를 경우, 甲의 행위는 상해죄의 불능미수가 된다.","위 사례는 우연방위에 해당하는 사례로 위법성조각사유에 주관적 정당화요소가 필요하지 않다는 판례에 따를 경우, 甲의 행위는 상해죄의 기수가 된다.","위 사례는 오상방위에 해당하는 사례로 엄격책임설에 따를 경우, 甲이 B를 A로 오인함에 있어서 정당한 이유가 있다면 책임이 조각되어 甲의 행위는 무죄가 된다.",1,0,""],["2024-2","형사법",5,"정당행위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행위의 긴급성과 보충성은 수단의 상당성을 판단할 때 고려요소의 하나로 참작하여야 하며, 다른 실효성 있는 적법한 수단이 없는 경우를 의미하는 것이지 일체의 법률적인 적법한 수단이 존재하지 않을 것을 의미하는 것은 아니라고 보아야 한다.","구｢군인사법｣에 따른 얼차려의 결정권자가 아닌 상사 계급의 甲이 경계근무 태만이나 청소 불량 등을 이유로 부대원들에게 속칭 원산폭격을 시키거나 양손을 깍지 낀 상태에서 팔굽혀 펴기를 50～60회 정도 하게 하는 등 얼차려 지침상 허용되지 않는 얼차려를 지시하는 행위는 정당행위로 볼 수 없다.","CCTV 설치･운영에 근로자들의 동의 절차나 노사협의회의 협의를 거치지 않았다는 이유로 노동조합원 甲 등이 회사에서 설치하여 작동 중인 CCTV 카메라 51대 중 근로자들의 작업 모습이 찍히는 12대를 골라 검정색 비닐봉지를 씌워 임시적 으로 촬영을 방해한 경우 정당행위의 성립요건 중 수단과 방법의 상당성을 인정할 수 없다.","아파트 입주자대표회의 회장이자 회의 소집권자인 甲이 자신이 소집하지 않은 입주자대표회의 소집공고문을 공휴일 야간에 발견하였고 공고문에서 정한 입주자대표회의 개최일이 다음 날 이어서시기적으로다른적절한방법을찾기어려웠다면위공고문을 뜯어내 제거한 행위는 정당행위에 해당한다고 볼 수 있다.",2,0,""],["2024-2","형사법",6,"｢형법｣ 제16조(법률의 착오)에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 형을 감경 또는 면제할 수 있다.","사인 甲이 현행범을 체포하면서 자신의 집 창고에 24시간 이상 감금하여도 ｢형사소송법｣상 허용된다고 위법성조각사유의 허용 한계를 오인하는 행위는 금지착오의 유형에 해당하지 않는다.","오인에 정당한 이유가 있는지 여부를 판단하는 과정에서 위법성 인식에 필요한 노력의 정도는 행위 당시의 구체적 상황에 행위자 대신에 법률가나 관련 분야의 전문가가 아닌 사회 평균인을 두고 이 평균인의 관점에서 판단해야 하며, 행위자가 속한 사회집단에 따라 달리 평가되면 안된다.","甲이 니코틴 용액 제조의 경우에도 담배제조업 허가를 받아야 하는지를 담배 담당 주무부서에 문의하여 답변을 받아 허가 사항임을 충분히 인식하였고, 자신이 제조한 것과 같은 니코틴 용액을 제조한 A 주식회사의 무허가 담배제조로 인한 담배 사업법위반죄에 관하여 검사의 불기소결정이 ｢담배사업법｣ 개정 이전에 있었던 경우, ｢담배사업법｣이 금지하는 무허가 담배제조행위의 위법성을 인식하지 못한 데 정당한 사유가 있다고 보기 어렵다.",3,0,""],["2024-2","형사법",7,"결과적 가중범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","부진정결과적 가중범에서 고의로 중한 결과를 발생하게 한 행위가 별도의 구성요건에 해당하고 그 고의범에 대하여 결과적 가중범에 정한 형보다 더 무겁게 처벌하는 규정이 없는 경우 에는 그 고의범과 결과적 가중범이 상상적 경합관계에 있다.","재물을 강취한 후 피해자를 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 강도살인죄와 현주건조물방화 치사죄는 상상적 경합관계에 있다.","결과적 가중범은 그 중한 결과가 고의적인 기본범죄에 전형적으로 내포된 잠재적인 위험의 실현이라는 점에서 일반의 과실범의 결과 야기보다 행위반가치가 크다.","적법하게 직무를 집행하는 공무원에 대하여 위험한 물건을 휴대하여 고의로 상해를 가한 경우에 특수공무집행방해치상죄만 성립할 뿐 이와 별도로 특수상해죄를 구성하지 않는다.",0,0,""],["2024-2","형사법",8,"부작위범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","보험계약 체결 당시 이미 발생한 교통사고 등으로 생긴 ‘요추, 경추, 사지’ 부분의 질환과 관련하여 입·통원치료를 받고 있었을 뿐 아니라 그러한 기왕증으로 인해 유사한 상해나 질병으로 보통의 경우보다 입원치료를 더 받게 될 개연성이 농후하다는 사정을 인식하고 있었음에도 자신의 과거 병력과 치료이력을 모두 묵비한 채 보험계약을 체결하였다면 부작위에 의한 기망에 해당한다.","경찰공무원이 지명수배 중인 범인을 발견하고도 직무상 의무에 따른 적절한 조치를 취하지 아니하고 오히려 범인을 도피하게 하는 행위를 하였다면, 그 직무위배의 위법상태는 범인도피행위 속에 포함되어 있다고 보아야 할 것이므로, 이와 같은 경우에는 작위범인 범인도피죄만이 성립하고 부작위범인 직무유기죄는 따로 성립하지 아니한다.","甲이 휴대폰 녹음기능을 작동시킨 상태로 A의 휴대폰에 전화를 걸어 약 8분간의 전화통화를 마친 후 바로 전화를 끊지 않고 A가 먼저 전화 끊기를 기다리던 중 B의 목소리가 들려오자 A가 실수로 통화종료 버튼을 누르지 아니한 상태를 이용하여 A와 B가 나누는 대화를 몰래 청취･녹음하였다면 甲의 행위는 부작위에 의한 통신비밀보호법위반죄에 해당한다.","공사업자 甲이 A의 토지 위에 자신의 공사를 위해 쌓아 두었던 건축자재를 공사 완료 후 단순히 치우지 않은 것에 불과하다면, 이러한 행위가 A의 추가 공사 업무에 대한 적극적인 방해행위와 동등한 형법적 가치를 가진다고 볼 수 없다.",2,0,""],["2024-2","형사법",9,"다음 설명 중 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 甲은 乙이 A를 살해할 것을 예상하고 이를 도와주기 위해 칼을 빌려주었지만, 乙이 실행의 착수에 나아가지 않은 경우 甲은 살인예비죄의 방조범이 성립한다. ㉡ 甲이 타인의 사망을 보험사고로 하는 생명보험계약을 체결 함에 있어 제3자가 피보험자인 것처럼 가장하여 체결하는 과정에서 고의로 보험사고를 일으키려는 의도를 가지고 보험계약을 체결하는 경우 甲의 행위는 보험사기의 예비 행위에 해당한다. ㉢ 甲이 A(23세)를 강제추행할 목적으로 범행 장소를 답사 하는 등 예비행위를 한 경우 강제추행의 예비죄로 처벌된다. ㉣ 甲이 A를 살해하기 위하여 치사량에 필요한 독극물 100g을 모으던 중 양심의 가책을 느껴 자의로 중지한 경우 甲은 살인예비죄의 중지미수가 성립한다.","㉠㉡","㉠㉢㉣","㉡㉢㉣","㉠㉡㉢㉣",3,0,""],["2024-2","형사법",10,"공동정범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공모공동정범에 있어서 공모자들이 그 공모한 범행을 수행하는 도중에 부수적인 다른 범죄가 파생되리라고 충분히 예상할 수 있는데도 그러한 가능성을 외면한 채 이를 방지하기에 족한 합리적인 조치를 취하지 아니하고 공모한 범행에 나아갔다가 결국 예상되던 범행들이 발생하였다면 당초의 공모자들 사이에 그 범행 전부에 대하여 공모는 물론 기능적 행위지배가 존재한다.","공동가공의 의사는 타인의 범행을 인식하면서도 이를 제지하지 아니하고 용인하는 것만으로도 충분하고, 반드시 공동의 의사로 특정한 범죄행위를 하기 위해 일체가 되어 서로 다른 사람의 행위를 이용하여 자기 의사를 실행에 옮기는 것을 내용으로 할 필요는 없다.","범인도피죄에 있어서 공범자의 범인도피행위 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 경우에는 범인도피죄의 공동정범이 성립한다.","회사직원이 영업비밀을 경쟁업체에 유출하거나 스스로의 이익을 위하여 이용할 목적으로 무단으로 반출한 후에 위 직원과 접촉 하여 영업비밀을 취득하려고 한 자는 업무상배임죄의 공동정범이 될 수 없다.",1,0,""],["2024-2","형사법",11,"｢형법｣ 제19조(독립행위의 경합)와 제263조(동시범)에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","2인 이상이 상호의사의 연락이 없이 동시에 범죄구성요건에 해당하는 행위를 하였을 때에는 원칙적으로 각인에 대하여 그 죄를 논하여야 하나, 상호의사의 연락이 있어 공동정범이 성립한다면, 독립행위경합 등의 문제는 아예 제기될 여지가 없다.","독립행위가 경합하더라도 결과 발생의 원인이 분명한 경우, 결과와 인과관계가 인정되는 행위를 한 행위자는 의도한 범죄의 기수범이 되고, 결과와 인과관계가 판명되지 않는 행위를 한 행위자는 그 죄의 미수범 또는 무죄가 된다.","｢형법｣ 제263조의 동시범은 상해와 폭행죄에 관한 특별규정 으로서 동 규정은 그 보호법익을 달리하는 강간치상죄에는 적용할 수 없다.","｢형법｣ 제263조의 동시범은 ‘상해의 결과’를 발생하게 한 경우에 적용되기 때문에 시간적 차이가 있는 독립된 상해행위나 폭행 행위가 경합하여 사망의 결과가 일어나고 그 사망의 원인된 행위가 판명되지 않은 경우에는 동 규정을 적용할 수 없다.",3,0,""],["2024-2","형사법",12,"공범과 신분에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 허위공문서작성죄 및 그 행사죄는 ‘공무원’만이 그 주체가 될 수 있는 신분범이라 할 것이므로, 신분상 공무원이 아님이 분명한 피고인들을 허위공문서작성죄 및 그 행사죄로 처벌 하려면 그에 관한 특별규정이 있어야 한다. ㉡ ｢형법｣ 제152조 제1항과 제2항은 위증을 한 범인이 형사 사건의 피고인 등을 ‘모해할 목적’을 가지고 있었는가 아니면 그러한 목적이 없었는가 하는 범인의 특수한 상태의 차이에 따라 범인에게 과할 형의 경중을 구별하고 있으므로, 이는 바로 ｢형법｣ 제33조 단서의 “신분 때문에 형의 경중이 달라 지는 경우”에 해당한다. ㉢ 업무상의 임무라는 신분관계가 없는 자가 신분관계 있는 자와 공모하여 업무상배임죄를 범한 경우, 신분관계가 없는 공범에 대하여는 ｢형법｣ 제33조 본문에 따라 업무상배임죄의 공동 정범이 성립하고 업무상배임죄에서 정한 형으로 처단한다. ㉣ 치과의사가 환자의 대량유치를 위해 치과기공사들에게 내원 환자들에게 진료행위를 하도록 지시하여 그들이 각 단독 으로 진료행위를 한 경우 치과의사는 무면허의료행위의 교사범이 성립한다. ㉤ 변호사가 변호사 아닌 자에게 고용되어 법률사무소의 개설· 운영에 관여하여 변호사법위반죄가 문제된 경우, 변호사의 행위가 ｢형법｣ 총칙상의 공모, 교사 또는 방조에 해당된다고 하더라도 변호사를 변호사 아닌 자의 공범으로 처벌할 수 없다.","㉠㉢㉤","㉡㉣㉤","㉠㉡㉢㉣","㉠㉡㉣㉤",3,0,""],["2024-2","형사법",13,"죄수에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 피해자의 주거에 침입하여 강간하려다 미수에 그침과 동시에 자기의 형사사건의 수사 또는 재판과 관련하여 수사 단서를 제공하고 진술한 것에 대한 보복 목적으로 그를 폭행한 경우, 특정범죄 가중처벌 등에 관한 법률위반(보복범죄등)죄 및 성폭력범죄의 처벌 등에 관한 특례법위반(주거침입강간등)죄가 각 성립하고 두 죄가 상상적 경합관계에 있다.","절도 범인으로부터 장물보관을 의뢰받은 甲이 그 정을 알면서 이를 인도받아 보관하고 있다가 A로부터 금원을 차용하면서 보관 중이던 장물을 담보로 제공한 경우, 장물보관죄와 횡령 죄가 각 성립하고 두 죄는 실체적 경합관계에 있다.","甲이 보이스피싱 사기 범죄단체에 가입한 후 사기범죄의 피해자 들로부터 돈을 편취하는 등 그 구성원으로서 활동한 경우, 범죄 단체 가입행위 또는 범죄단체 구성원으로서 활동하는 행위와 사기행위는 법조경합 중 흡수관계에 있으므로 목적된 범죄인 사기죄만 성립한다.","甲이 2010. 11. 15. X회사 사무실에서 부부인 피해자 A와 B에게 ‘토지를 매수하여 분필한 후 이를 분양해서 원금 및 수익금을 지급하겠다.’면서 기망한 후 공동재산인 건물을 매도하여 돈을 마련한 피해자들로부터 A의 예금계좌에서 1억 원, B의 예금 계좌에서 4억 원을 송금받아 편취한 경우, 각 피해자의 피해 법익의 동일성에 대하여 예금계좌에 예치된 금전에 관한 권리 등 민사상 권리 귀속관계 등을 고려하여 판단할 때 이를 포괄 일죄로 볼 수 없다.",0,0,""],["2024-2","형사법",14,"형벌론에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","과료는 판결확정일로부터 30일내에 납입하여야 하며, 과료를 납입하지 아니한 자는 1일 이상 30일 미만의 기간 노역장에 유치하여 작업에 복무하게 한다.","행위자에게 유죄의 재판을 아니할 때에도 몰수의 요건이 있는 때에는 몰수만을 선고할 수 있지만, 우리 법제상 공소의 제기 없이 별도로 몰수만을 선고할 수 있는 제도는 마련되어 있지 않다.","｢마약류 관리에 관한 법률｣ 제67조에 의한 몰수나 추징은 범죄 행위로 인한 이득의 박탈을 목적으로 하는 것이므로, 그 범행 으로 인하여 이득을 취득한 바 없다면 법원은 그 가액의 추징을 명할 수 없다.","甲이 수사기관에 자진 출석하여 처음 조사를 받으면서는 돈을 차용하였을 뿐이라며 범죄사실을 부인하다가 제2회 조사를 받으 면서 비로소 업무와 관련하여 돈을 수수하였다고 자백한 행위에 대하여 자수감경을 할 수 없다.",2,0,""],["2024-2","형사법",15,"명예훼손죄에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 전파가능성이 있다는 이유로 공연성을 인정하는 것은 문언의 통상적 의미를 벗어나 피고인에게 불리한 확장해석으로 죄형 법정주의에서 금지하는 유추해석에 해당한다. ㉡ 사실적시의내용이사회일반의일부 이익에만관련된사항이라도 다른 일반인과 공동생활에 관계된 사항이라면 공익성을 지니고, 나아가 개인에 관한 사항이더라도 공공의 이익과 관련되어 있고 사회적인 관심을 획득하거나 획득할 수 있는 경우라면 직접적으로 국가·사회 일반의 이익이나 특정한 사회집단에 관한 것이 아니라는 이유만으로 ｢형법｣ 제310조의 적용을 배제할 것은 아니다. ㉢ 객관적으로 피해자의 사회적 평가를 저하시키는 사실에 관한 발언이 보도, 소문이나 제3자의 말을 인용하는 방법으로 단정 적인 표현이 아닌 전문 또는 추측의 형태로 표현된 경우, 표현 전체의 취지로 보아 사실이 존재할 수 있다는 것을 ‘암시’하는 방식으로 이루어졌다면 사실을 적시한 것으로 볼 수 없다. ㉣ 정보통신망 이용촉진 및 정보보호 등에 관한 법률위반(명예훼손) 죄의 ‘비방할 목적’이란 공공의 이익을 위한 것과는 행위자의 주관적 의도의 방향에서 서로 상반되는 관계에 있으므로, 적시한 사실이 공공의 이익에 관한것인 경우에는특별한사정이없는 한 비방할 목적은 부인된다. ㉤ 명예훼손죄의 공연성에 관해 확립된 법리로 정착된 이른바 전파가능성 이론은 ｢정보통신망 이용촉진 및 정보보호 등에 관한 법률｣상 정보통신망을 이용한 명예훼손뿐만 아니라 ｢공직선거법｣상 후보자비방죄 등의 공연성 판단에도 동일 하게 적용된다.","㉠㉢㉣","㉡㉢㉤","㉡㉣㉤","㉡㉢㉣㉤",2,0,""],["2024-2","형사법",16,"성범죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","준강간죄에서 피해자가 술에 취해 수면상태에 빠지는 등 의식을 상실한 패싱아웃(passing out) 상태뿐만 아니라 범행 당시 알코올이 기억형성의 실패만을 야기한 알코올 블랙아웃 (black out) 상태인 경우에도 기억장애 외에 인지기능이나 의식 상태의 장애에 이르렀다고 인정된다.","강제추행죄의 폭행 또는 협박이 추행보다 시간적으로 앞서 그 수단으로 행해진 이른바 폭행·협박 선행형의 경우에는 상대방의 항거를 곤란하게 하는 정도의 폭행 또는 협박이어야 한다.","강간치사상죄에 있어서 사상의 결과는 간음행위 그 자체로 부터 발생한 경우나 강간의 수단으로 사용한 폭행으로부터 발생한 경우는 포함되지만, 강간에 수반하는 행위에서 발생한 경우는 포함되지 않는다.","성폭력범죄의 처벌 등에 관한 특례법위반(주거침입강간)죄는 주거침입죄를 범한 후에 사람을 강간하는 등의 행위를 하여야 하는 일종의 신분범이고, 선후가 바뀌어 강간죄 등을 범한 자가 그 피해자의 주거에 침입한 경우에는 이에 해당하지 않고 강간죄 등과 주거침입죄 등의 실체적 경합범이 된다.",3,0,""],["2024-2","형사법",17,"주거침입죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","다가구용 단독주택이나 아파트와 같은 공동주택 내부의 엘리 베이터, 공용 계단, 복도 등 공용 부분도 주거침입죄의 객체인 ‘사람의 주거’에 해당한다.","주거침입죄의 침입에 해당하는지는 거주자의 의사에 반하는지를 기준으로 판단하는 것이 원칙이며, 출입 당시 객관적·외형적으로 드러난 행위태양은 사실상의 평온상태를 해치는 행위태양인지를 평가할때고려할요소중하나이지만주된평가요소가될수없다.","다른 사람의 주택에 무단 침입한 범죄사실로 이미 유죄판결을 받은 사람이 그 판결이 확정된 후에도 퇴거하지 않은 채 계속 하여 당해 주택에 거주한 경우, 위 판결 확정 이후의 행위는 별도의 주거침입죄를 구성한다.","행위자 자신이 다른 사람과 공동으로 거주하거나 관리 또는 점유하는 주거 등에 임의로 출입하더라도 주거침입죄를 구성 하지 않지만, 다른 사람과 공동으로 주거에 거주하거나 건조물을 관리하던 사람이 공동생활관계에서 이탈하거나 주거 등에 대한 사실상의 지배·관리를 상실한 경우 등 특별한 사정이 있는 경우에 주거침입죄가 성립할 수 있다.",1,0,""],["2024-2","형사법",18,"업무방해죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","의료인이나 의료법인이 아닌 자가 의료기관을 개설하여 운영하는 행위뿐만 아니라 무자격자에 의해 개설된 의료기관에 고용된 의료인이 환자를 진료하는 행위 또한 당연히 반사회성을 띠는 행위이므로 업무방해죄의 보호대상이 되는 업무에 해당하지 않는다.","컴퓨터 등 정보처리장치에 정보를 입력하는 등의 행위가 그 입력된 정보 등을 바탕으로 업무를 담당하는 사람의 오인, 착각 또는 부지를 일으킬 목적으로 행해진 경우에는 그 행위가 업무를 담당하는 사람을 직접적인 대상으로 이루어진 것이 아니라고 하여도 위계에 의한 업무방해죄가 성립한다.","｢형법｣상 업무방해죄에서 말하는 ‘위력’은 폭력·협박은 물론 사회적·경제적·정치적 지위와 권세에 의한 압박 등도 이에 포함 되지만, 적어도 그러한 위력으로 인하여 피해자의 자유의사를 제압하기에 충분하다고 평가될 정도의 세력에는 이르러야 한다.","피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 되었다고 하더라도 그러한 폭행행위는 이른바 ‘불가벌적 수반행위’에 해당하므로 업무방해죄에 대하여 흡수관계에 있다고 볼 수 없다.",0,0,""],["2024-2","형사법",19,"재산죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제333조 후단의 강도죄(이른바 강제이득죄)의 요건인 재산상의 이익이란 재물을 포함한 모든 재산상의 이익을 말하는 것으로서 적극적 이익(적극적인 재산의 증가)이든 소극적 이익 (소극적인 부채의 감소)이든 묻지 않는다.","甲이 상대방으로부터 금품이나 재산상 이익을 받을 것을 약속 하고 성행위를 하는 경우 그 행위의 대가는 사기죄의 객체인 경제적 이익에 해당하지 않는다.","甲이 피해자를 폭행·협박하여 매출전표에 허위 서명하게 하고 이를 교부받아 소지한 경우 甲이 신용카드회사에 매출전표를 제출하여도 신용카드회사가 신용카드 가맹점 규약 또는 약관의 규정을 들어 그 금액의 지급을 거절할 수 있으므로 甲은 ‘재산상 이익’을 취득하였다고 볼 수 없다.","사기로 편취한 재물 또는 재산상의 이익의 가액을 구체적으로 산정할 수 없는 경우에는 편취한 재물 또는 재산상 이익의 가액이 5억 원 이상 또는 50억 원 이상인 것이 범죄구성요건의 일부로 되어 있고 그 가액에 따라 그 죄에 대한 형벌도 가중 하는 특정경제범죄 가중처벌 등에 관한 법률위반(사기)죄로 처벌할 수 없다.",3,0,""],["2024-2","형사법",20,"횡령의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","동업재산은 동업자의 합유에 속하는 것이므로 동업관계가 존속 하는 한 동업자의 한 사람이 동업재산을 보관 중 임의로 횡령한 경우에는 지분비율에 따라 임의로 횡령한 금액 중 자신의 지분 비율을 초과한 부분에 대하여 횡령죄의 죄책을 부담한다.","사기범행의 공범이 아닌 계좌명의인이 개설한 예금계좌가 전기통신금융사기 범행에 이용되어 그 계좌에 피해자가 사기 피해금을 송금·이체한 경우에는 계좌명의인은 피해자를 위하여 사기피해금을 보관하는 지위에 있다고 보아야 하므로, 계좌 명의인이 그 돈을 영득할 의사로 인출하면 피해자에 대한 횡령죄가 성립한다.","사기범행에 이용되리라는 사정을 알고서도 자신 명의 계좌의 접근매체를 양도함으로써 사기범행을 방조한 종범이 사기이용 계좌로 송금된 피해자의 돈을 임의로 인출한 경우 사기의 피해자에 대하여 별도의 횡령죄를 구성하지 않는다.","금전의 수수를 수반하는 사무처리를 위임받은 사람이 그 행위에 기하여 위임자를 위하여 제3자로부터 수령한 금전은, 위임을 받은 사람이 위 금전을 그 위임의 취지대로 사용하지 아니하고 마음 대로 자신의 위임자에 대한 채권에 상계충당하는 것은 상계정산 하기로 하였다는 특별한 약정이 없는 한 당초 위임한 취지에 반하 므로 횡령죄를 구성한다.",0,0,""],["2024-2","형사법",21,"장물의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","단순히 보수를 받고 본범을 위하여 장물을 일시 사용하거나 그와 같이 사용할 목적으로 장물을 건네받은 것만으로도 장물 취득죄가 성립한다.","장물인 정을 모르고 보관하던 중 장물인 정을 알게되었으면서도 계속 보관함으로써 피해자의 정당한 반환청구권 행사를 어렵게 하고 위법한 재산상태를 유지시키는 때에는 장물보관죄가 성립한다.","장물인 정을 알면서, 장물을 취득·양도·운반·보관하려는 당사자 사이에 서서 서로를 연결하여 장물의 취득·양도·운반·보관행위를 중개하거나 편의를 도모하였더라도 그 알선에 의하여 당사자 사이에 실제로 장물의 취득·양도·운반·보관에 관한 계약이 성립 하지 아니하였거나 장물의 점유가 현실적으로 이전되지 아니한 경우라면, 장물알선죄는 성립하지 않는다.","업무상과실·중과실장물죄는 일반의 과실에 대하여 형을 가중하여 처벌하는 가중적 구성요건이다.",1,0,""],["2024-2","형사법",22,"재산에 대한 죄에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 날치기와같이강력적으로재물을절취하는행위는때로는피해자를 전도시키거나부상케하는경우가있고, 그와같은결과가피해자의 반항억압을목적으로함이없이점유탈취의과정에서우연히가해진 경우라도이는강도치상죄로의율함이타당하다. ㉡ 甲이 술집 운영자 A로부터 술값의 지급을 요구받자 A를 유인· 폭행하고 도주함으로써 술값의 지급을 면하여 재산상 이익을 취득한 경우에는 ｢형법｣ 제335조의 준강도죄가 성립한다. ㉢ ｢형법｣ 제370조(경계침범)에서 말하는 경계는 반드시 법률상의 정당한 경계를 말하는 것이 아니고 비록 법률상의 정당한 경계에 부합되지 아니하는 경계라고 하더라도 이해관계인들의 명시적 또는 묵시적 합의에 의하여 정하여진 것이면 이는 이 법조에서 말하는 경계라고 할 것이다. ㉣ 甲이 A에 대한 채무를 담보하기 위하여 자기 소유의 건물과 기계·기구를 A의 근저당권의 목적물로 제공한 경우에 甲이 담보유지의무를 위반하여 A의 근저당권의 목적이 된 건물을 철거 및 멸실등기하고, 기계·기구를 양도한 행위만으로는 물건을 손괴 또는 은닉하여 A의 권리행사를 방해한 행위로서 권리행사방해죄가 성립한다고 볼 수 없다. ㉤ 사업비용을 대납하는 것을 조건으로 甲 소유의 건물 5층에 임시로 거주하고 있는 A가 그 비용을 입금하지 않자 甲이 A의 가족을 내쫓을목적으로 5층현관문에 설치된, 甲 소유의 디지털 도어락의 비밀번호를 변경할 것을 乙(甲의 아들)에게 지시하여 도어락의 비밀번호를 乙이 변경한 경우에 乙에게는 권리행사방해죄가 성립할 수 없고, 甲의 권리행사방해교사죄도 성립할 수 없다.","㉠㉡㉣","㉠㉡㉤","㉠㉢㉣","㉢㉣㉤",0,0,""],["2024-2","형사법",23,"문서죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","인터넷을 통하여 열람·출력한 등기사항전부증명서 하단의 열람 일시 부분을 단순히 수정 테이프로 지우고 복사해 두었다가 이를 타인에게 교부한 행위는 등기사항전부증명서가 나타내는 권리·사실 관계와 다른 새로운 증명력을 가진 문서를 만든 것으로 볼 수 없으므로 공문서변조 및 변조공문서행사죄를 구성하지 않는다.","유효기간이 경과한 홍콩 교통국장 명의의 국제운전면허증에 첨부된 사진을 바꾸어 붙여 이를 행사하는 경우 그 상대방이 유효기간을 쉽게 알 수 없도록 되어 있거나 진정하게 작성된 것으로서 명의자 로부터 국제운전면허를 받은 것으로 오신하기에 충분한 정도의 형식과 외관을 갖추고 있다면 사문서위조죄에 해당한다.","사문서의 작성명의인이 이미 사망한 자인 경우에는 그 문서의 작성일자가 명의인의 생존 중의 일자로 된 경우가 아니면 사문서 위조죄나 그 행사죄를 구성하지 않는 것이며, 이는 자격모용 사문서작성죄나 그 행사죄에 있어서도 마찬가지이다.","｢형법｣ 제238조의 공기호는 해당 부호를 공무원 또는 공무소가 사용하는 것만으로 족하므로 온라인 구매사이트에서 검찰 업무 표장의 이미지가 들어간 주차표지판 등을 주문하여 자신의 승용차에 부착하고 다닌 경우에는 해당 부호를 공무원 또는 공무소가 사용하는 것이 분명한 이상 그 부호를 통하여 증명을 하는 사항이 구체적으로 특정되어 있지 않더라도 공기호위조 및 위조공기호행사죄에 해당한다.",1,0,""],["2024-2","형사법",24,"공무원의 직무상 범죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","직무유기죄에 있어서 그 직무를 유기한 때라 함은 직장의 무단 이탈, 직무의 의식적인 포기 등과 같이 그것이 국가의 기능을 저해 하며 국민에게 피해를 야기시킬 가능성이 있는 경우를 말하는 것 이므로 병가 중인 자는 직무유기죄의 주체가 될 수 없다.","｢형법｣ 제123조의 직권남용죄에 있어서 직권남용 행위의 상대방이 일반 사인인 경우에는 그가 권리에 대응하여 어떠한 일을 한 것이 의무 없는 일인지 여부는 관계 법령 등의 내용에 따라 개별적으로 판단하여야 한다.","｢형법｣ 제126조의 피의사실공표죄는 검찰, 경찰 그 밖에 범죄 수사에 관한 직무를 수행하는 자 또는 이를 감독하거나 보조하는 자가 그 직무를 수행하면서 알게 된 피의사실을 공소제기 전에 공표한 경우에 성립한다.","인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 ｢형법｣ 제124조 제1항의 직권남용감금죄가 성립한다.",1,0,""],["2024-2","형사법",25,"뇌물죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무원이 아닌 사람(‘비공무원’)과 공무원이 공모하여 금품을 수수한 경우에 각 수수자가 수수한 금품별로 직무 관련성 유무가 다르더라도, 각 금품마다 직무와의 관련성을 따질 것이 아니라 그 수수한 금품 전부가 불가분적으로 직무행위에 대한 대가로서의 성질을 가지므로 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 공동정범이 성립한다.","비공무원이 공무원과 공동가공의 의사와 이를 기초로 한 기능적 행위지배를 통하여 공무원의 직무에 관하여 뇌물을 수수하는 범죄를 실행하였다면 공무원이 직접 뇌물을 받은 것과 동일하게 평가할 수 있으므로 공무원과 비공무원에게 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 공동정범이 성립한다.","공무원인 수뢰자가 먼저 뇌물을 요구하여 증뢰자가 제공하는 돈을 받았다면, 그 액수가 수뢰자의 예상보다 너무 많아서 후에 이를 반환하였다고 하더라도 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 성립에는 영향이 없다.","금품이나 이익 전부에 관하여 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 공동정범이 성립한 이후에 뇌물이 실제로 공동 정범인 공무원 또는 비공무원 중 누구에게 귀속되었는지는 이미 성립한 뇌물수수죄에 영향을 미치지 않는다.",0,0,""],["2024-2","형사법",26,"공무집행방해죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무집행방해죄는 공무원의 적법한 공무집행을 전제로 하는데, 추상적인 권한에 속하는 공무원의 어떠한 공무집행이 적법한지 여부는 행위 당시의 구체적 상황에 기하여 객관적 합리적으로 판단하여야 하고 사후적으로 순수한 객관적 기준에서 판단할 것은 아니다.","행정청에 대한 일방적 통고로 효과가 완성되는 ‘신고’의 경우 에는 신고인이 신고서에 허위사실을 기재하거나 허위의 소명 자료를 제출하였더라도, 그것만으로는 담당 공무원의 구체적 이고 현실적인 직무집행이 방해받았다고 볼 수 없어 특별한 사정이 없는 한 허위 신고가 위계에 의한 공무집행방해죄를 구성한다고 볼 수 없다.","피고인들이 불법적인 농성을 계속하다가 관할 구청이 행정대집행 으로 농성 장소에 있던 물건을 치웠음에도 피고인들이 이에 대한 항의의 일환으로 집회를 개최하려고 하자, 또다시 같은 장소를 점거하고 물건을 다시 비치하는 것을 막기 위해 출동하여 농성 장소를 미리 둘러싼 경찰관들이 농성 장소 진입을 소극적으로 제지하는 과정에서 피고인들이 경찰관들을 밀치는 등 유형력을 행사한 행위는 공무집행방해죄를 구성한다.","시청 청사 내 주민생활복지과 사무실에서 소란을 피우던 甲을 소속 공무원 A가 제지하며 밖으로 데리고 나가려 하자 甲이 A를 폭행한 경우, 민원 상담을 시도한 순간부터 민원 상담 시도를 종료한 순간까지만 소속 공무원의 직무 범위인 민원 업무에 해당 하는 것이므로 甲을 사무실에서 퇴거시키는 등의 후속 조치는 직무 범위에 포함되지 않는다고 할 것이므로 공무집행방해죄를 구성하지 않는다.",3,0,""],["2024-2","형사법",27,"위증 및 무고의 죄에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 헌법 제12조 제2항에 정한 불이익 진술의 강요금지 원칙을 구체화한자기부죄거부특권에관한 것이거나기타 증언거부사유가 있음에도 증인이 증언거부권을 고지받지 못함으로 인하여 그 증언거부권을 행사하는 데 사실상 장애가 초래되었다고 볼 수 있는 경우에는 위증죄의 성립을 부정하여야 할 것이다. ㉡ 무고죄에 있어서 ‘허위의 사실’이라 함은 그 신고된 사실로 인하여 상대방이 형사처분이나 징계처분 등을 받게 될 위험이 있는 것이어야 하고, 독립하여 형사처분 등의 대상이 되지 아니하고 단지 신고사실의 정황을 과장하는 데 불과하거나 전체적으로 보아 범죄사실의 성립 여부에 직접 영향을 줄 정도에 이르지 아니하는 내용에 관계되는 것이라면 무고죄가 성립하지 아니한다. ㉢ ｢형법｣ 제153조 소정의 위증죄를 범한 자가 자백, 자수를 한 경우의 형의 감면규정은 재판 확정 전의 자백을 형의 필요적 감경 또는 면제사유로 한다는 것이며, 또 위 자백의 절차에 관하여는 공술한 사건을 다루는 기관에 대한 자발적인 고백은 포함되나, 위증사건의 피고인 또는 피의자로서 법원이나 수사 기관의 신문에 의한 고백은 위 자백의 개념에 포함되지 않는다. ㉣ 고소인이 고소장을 접수하더라도 수사기관의 고소인 출석 요구에 응하지 않음으로써 그 단계에서 수사중지를 의도하고 있었고, 더 나아가 피고소인들에 대한 출석요구와 피의자신문 등의 수사권까지 발동될 것은 의욕하지 않았다고 하더라도 고소장을 수사기관에 제출한 이상 무고죄는 성립한다.","㉠㉡","㉠㉡㉣","㉠㉢㉣","㉡㉢㉣",1,0,""],["2024-2","형사법",28,"｢형사소송법｣ 제197조의3(시정조치요구 등), 제197조의4(수사의 경합) 및 ｢검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정｣에 대한 설명으로 가장 적절하지 않은 것은?","검사는 사법경찰관리의 수사과정에서 법령위반, 인권침해 또는 현저한 수사권 남용이 의심되는 사실의 신고가 있거나 그러한 사실을 인식하게 된 경우에는 사법경찰관에게 사건기록 등본의 송부를 요구할 수 있다.","위의 ①에 따라 검사로부터 사건기록 등본의 송부 요구를 받은 사법경찰관은 지체 없이 검사에게 사건기록 등본을 송부하여야 하며, 이 경우 사법경찰관은 요구를 받은 날부터 7일 이내에 사건기록 등본을 검사에게 송부해야 한다.","검사는 사법경찰관과 동일한 범죄사실을 수사하게 된 때에는 사법경찰관에게 사건을 송치할 것을 요구할 수 있으며, 이 때에는 그 내용과 이유를 구체적으로 적은 서면으로 해야 한다.","수사의 경합에 따라 사건송치를 요구받은 사법경찰관은 지체 없이 검사에게 사건을 송치하여야 하며, 검사가 영장을 청구하기 전에 동일한 범죄사실에 관하여 사법경찰관이 영장을 신청한 경우 사법경찰관은 해당 영장에 기재된 범죄사실을 계속 수사할 수 없다.",3,2,"'검사가 사법경찰관과 동일한 범죄사실을 수사하게 된 때'(제197조의4 수사의 경합)를 전제로 한 문항입니다. 검사 직접수사 폐지로 그 전제가 사라져 현행법 기준 정답을 단정할 수 없습니다."],["2024-2","형사법",29,"피의자신문에 관한 설명으로 옳은 것을 모두 고른 것은? ㉠ 검사 또는 사법경찰관은 피의자를 신문하기 전에 진술을 하지 아니할 수 있다는 것, 진술을 거부할 권리를 포기하고 행한 진술은 법정에서 유죄의 증거로 사용될 수 있다는 것, 신문을 받을 때에는 변호인을 참여하게 하는 등 변호인의 조력을 받을 수 있다는 것을 고지하여야 한다. ㉡ 검사 또는 사법경찰관은 피의자의 연령·성별·국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 경우 피의자와 신뢰관계에 있는 자를 동석하게 하여야 하며, 신뢰관계인이 동석하지 않은 상태에서 행한 진술은 임의성이 인정되더라도 유죄인정의 증거로 사용할 수 없다. ㉢ 검사또는사법경찰관은오후9시부터오전6시까지사이에조사를 해서는 안되지만, 공소시효가 임박하거나 피의자를 체포한 후 48시간 이내에 구속영장의 청구 또는 신청 여부를 판단하기 위해 불가피한 경우에는 심야조사를 할 수 있다. ㉣ 피의자의 진술을 영상녹화하는 경우 미리 영상녹화사실을 알려주어야 하며, 조사의 개시부터 종료까지의 전 과정 및 객관적 정황을 영상녹화하여야 하고, 영상녹화가 완료된 때에는 피의자또는변호인의요구가없더라도피의자또는변호인앞에서 영상녹화물을 재생하여 시청하게 한 후 지체 없이 그 원본을 봉인하고 피의자로 하여금 기명날인 또는 서명하게 하여야 한다.","㉠㉢","㉠㉣","㉡㉢","㉠㉡㉢㉣",0,0,""],["2024-2","형사법",30,"체포에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","체포영장에 의하여 체포된 자가 그 후 석방되었더라도, 동일한 범죄사실에 관하여 다시 체포영장을 청구하는 취지 및 이유를 기재한 후 체포영장을 다시 청구할 수 있다.","체포된 피의자는 관할 법원에 체포의 적부심사를 청구할 수 있으며, 청구를 받은 법원은 그 청구가 이유 있다고 인정한 경우에는 심사 청구 후 피의자에 대하여 공소제기가 있는 경우 에도 결정으로 체포된 피의자의 석방을 명하여야 한다.","사법경찰관은 체포영장에 의해 피의자를 체포하는 경우에는 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정하여 영장 없이 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 발견을 위한 수색을 할 수 있다. 이 경우에는 사후에 지체 없이 수색영장을 받아야 한다.","현행범인으로 체포하기 위하여는 행위의 가벌성, 범죄의 현행성･ 시간적 접착성, 범인･범죄의 명백성 외에 체포의 필요성, 즉 도망 또는 증거인멸의 염려가 있어야 하며, 이러한 현행범인 체포의 요건을 갖추었는지는 체포 당시의 상황을 기초로 판단하여야 하고, 이에 관한 수사주체의 판단에는 상당한 재량의 여지가 있다.",2,0,""],["2024-2","형사법",31,"구속에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구속기간의 만료로 피고인에 대한 구속의 효력이 상실된 후 항소법원이 피고인에 대한 판결을 선고하면서 피고인을 구속한 경우, 이는 ｢형사소송법｣ 제208조(재구속의 제한)의 규정에 위배 되는 재구속 또는 이중구속에 해당하지 않는다.","피의자가 체포 또는 구인된 경우 경찰 수사과정에서의 구속 기간 또는 검찰 수사과정에서의 구속기간은 피의자를 체포 또는 구인한 날부터 기산하며, 구속기간의 초일은 시간을 계산함이 없이 1일로 산정한다.","구속의 사유가 없거나 소멸된 때에는 피고인, 피고인의 변호인･ 법정대리인･배우자･직계친족･형제자매･가족･동거인 또는 고용주는 법원에 구속된 피고인의 구속취소를 청구할 수 있다.","구속 전 피의자심문을 하는 경우 법원이 구속영장청구서･수사 관계서류 및 증거물을 접수한 날부터 구속영장을 발부하여 검찰청에 반환한 날까지의 기간은 사법경찰관 및 검사의 피의자에 대한 구속기간에 산입하지 않는다.",2,1,"②의 '검찰 수사과정 구속기간' 서술은 검찰 수사 단계 폐지로 현행 조문(제202조 사법경찰관 10일 → 제203조 검사 인치 후 10일, 제205조 1차 10일 연장)으로 바꿔 읽어야 합니다."],["2024-2","형사법",32,"압수･수색에 관한 설명 중 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 압수･수색의 처분을 받는 자가 여럿인 경우에는 모두에게 개별적으로 영장을 제시해야 하며, 이 경우 피의자에게는 개별적으로 해당 영장의 사본을 교부해야 하는데, 피의자에게 영장을 제시하거나 영장의 사본을 교부할 때에는 사건관계인의 개인정보가 피의자의 방어권 보장을 위해 필요한 정도를 넘어 불필요하게 노출되지 않도록 유의해야 한다. ㉡ 압수･수색영장의 범죄 혐의사실과 관계있는 범죄라는 것은 압수･수색영장에 기재한 혐의사실과 객관적 관련성이 있고 압수･수색영장 대상자와 피의자 사이에 인적 관련성이 있는 범죄를 의미하는데, 이러한 인적 관련성은 압수･수색영장에 기재된 대상자의 공동정범이나 교사범 등 공범이나 간접 정범에 대한 피고사건에 대해서만 인정되는 것이지, 필요적 공범에 대한 피고사건에 대해서 인정되는 것은 아니다. ㉢ 현행범 체포현장이나 범죄현장에서 소지자 등이 임의로 제출 하는 물건은 영장 없이 압수할 수 있으며, 다만 이 경우 검사나 사법경찰관은 사후에 지체 없이 영장을 받아야 한다. ㉣ 수사기관에 의해 참여권을 고지받은 피압수자가 압수･수색 현장에 출입한 상태에서 수사기관이 정보저장매체에 기억된 정보 중에서 키워드 또는 확장자 검색 등을 통해 범죄 혐의 사실과 관련 있는 정보를 선별한 다음 정보저장매체와 동일 하게 비트열 방식으로 복제하여 생성한 파일을 제출받아 압수한 경우, 수사기관이 수사기관 사무실에서 위와 같이 압수된 이미지 파일을 탐색·복제·출력하는 과정에서도 피의자 등 에게 참여의 기회를 보장하여야 한다.","㉠(O) ㉡(O) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(O)",1,0,""],["2024-2","형사법",33,"｢통신비밀보호법｣상의 통신제한조치에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 전기통신의 감청은 ‘감청’의 개념 규정에 비추어 전기통신이 이루어지고 있는 상황에서 실시간으로 전기통신의 내용을 지득･채록하는 경우와 전기통신의 송･수신을 직접적으로 방해하는 경우를 의미하는 것이므로, 이미 수신이 완료된 전기통신에 관하여 남아있는 기록이나 내용을 열어보는 등의 행위는 포함하지 않는다. ㉡ 범죄수사를 위한 통신제한조치의 기간은 1개월을 초과하지 못하고, 그 기간 중 통신제한조치의 목적이 달성되었을 경우에는 즉시 종료하여야 한다. ㉢ 사법경찰관은 ｢통신비밀보호법｣ 제8조에 따른 긴급통신제한 조치를 한 경우에 집행에 착수한 때부터 36시간 이내에 법원의 허가를 받지 못한 경우에는 해당 조치를 즉시 중지 하고 해당 조치로 취득한 자료를 폐기하여야 한다. ㉣ 사법경찰관은 통신제한조치를 집행한 사건에 관하여 검사가 공소를 제기하거나 제기하지 아니하는 처분(기소중지 또는 참고인중지 결정은 포함한다)의 통보를 받은 때에는 그 통보를 받은 날부터 30일 이내에 감청의 대상이 된 전기통신의 가입자 에게 통신제한조치를 집행한 사실과 집행기관 및 그 기간 등을 서면으로 통지하여야 한다. ㉤ ｢통신비밀보호법｣ 제3조 제1항을 위반한 불법감청에 의하여 녹음된 전화통화의 내용은 ｢통신비밀보호법｣ 제4조에 의하여 원칙적으로 증거능력이 없으나, 피고인이나 변호인이 이를 증거로 함에 동의하였다면 증거능력이 인정된다.","㉠㉢","㉡㉤","㉠㉡㉤","㉠㉢㉣",0,0,""],["2024-2","형사법",34,"증명에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","상해죄의 피해자가 제출하는 상해진단서는 일반적으로 의사가 당해 피해자의 진술을 토대로 상해의 원인을 파악한 후 의학적 전문지식을 동원하여 관찰·판단한 상해의 부위와 정도 등을 기재한 것으로서, 거기에 기재된 상해가 곧 피고인의 범죄행위로 인하여 발생한 것이라는 사실을 직접 증명하는 증거가 되기에 충분하다.","공연히 사실을 적시하여 사람의 명예를 훼손한 행위가 ｢형법｣ 제310조의 규정에 따라서 위법성이 조각되어 처벌대상이 되지 않기 위하여는 그것이 진실한 사실로서 오로지 공공의 이익에 관한 때에 해당된다는 점을 행위자가 증명하여야 한다.","목적과 용도를 정하여 위탁한 금전을 수탁자가 임의로 소비하면 횡령죄를 구성할 수 있으나, 이 경우 피해자 등이 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도가 무엇인지는 엄격한 증명의 대상이다.","교사범에 있어서의 교사사실은 범죄사실을 구성하는 것으로서 이를 인정하기 위하여는 엄격한 증명이 요구되지만, 피고인이 교사사실을 부인하고 있는 경우에는 사물의 성질상 그와 상당한 관련성이 있는 간접사실을 증명하는 방법에 의하여 이를 입증할 수 있다.",0,0,""],["2024-2","형사법",35,"위법수집증거배제법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피고인이 자신의 휴대전화 카메라를 이용하여 총 9회에 걸쳐 성적 욕망 또는 수치심을 유발할 수 있는 피해자 4명의 신체를 그들의 의사에 반하여 촬영하였다는 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)죄의 공소사실과 관련하여, 수사기관이 피고인을 현행범으로 체포할 당시 임의제출 형식 으로 압수한 휴대전화의 증거능력이 문제 된 경우, 휴대전화 제출에 관하여 검사가 임의성의 의문점을 없애는 증명을 다하지 못하였다면 휴대전화 및 그에 저장된 전자정보는 위법수집증거에 해당하여 증거능력이 없다.","수사기관은 복제본에 담긴 전자정보를 탐색하여 혐의사실과 관련된 정보를 선별하여 출력하거나 다른 저장매체에 저장하는 등으로 압수를 완료하면 혐의사실과 관련 없는 전자정보(이하 ‘무관정보’라 한다)를 삭제·폐기하여야 하므로, 무관정보가 남아 있는 복제본은 더 이상 수사기관의 탐색, 복제 또는 출력 대상이 될 수 없다.","수사기관이 이른바 전화사기죄 범행의 혐의자를 긴급체포하면서 그가 보관하고 있던 다른 사람의 주민등록증, 운전면허증 등을 압수한 경우, 이는 ｢형사소송법｣ 제217조 제1항에서 규정한 위 범죄사실의 수사에 필요한 범위 내의 적법한 압수로서 이를 위 혐의자의 점유이탈물횡령죄 범행에 대한 증거로 사용할 수 있다.","사법경찰관이 피고인 아닌 자의 주거지·근무지를 방문한 곳에서 진술서 작성을 요구하여 제출받은 경우 등 그 진술서가 경찰서 에서 작성한 것이 아니라 작성자가 원하는 장소를 방문하여 받은 것이라면, 위 진술서는 ｢형사소송법｣ 제312조 제5항이 적용되지 않아 ｢형사소송법｣ 제244조의4(수사과정의 기록)에서 정한 절차를 준수하지 않더라도 증거능력이 인정된다.",3,0,""],["2024-2","형사법",36,"자백에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분은 피고인 또는 변호인이 내용을 부인하는 이상 증거능력이 없다.","상업장부나 항해일지, 진료일지 등의 문서가 우연히 피고인에 의해 작성되었고 그 문서의 내용 중 피고인의 범죄사실의 존재를 추론해 낼 수 있는 공소사실에 일부 부합되는 사실의 기재가 있다고하더라도, 피고인이범죄사실을자백하는문서라고볼수없다.","자동차등록증에 차량의 소유자가 피고인으로 등록·기재된 것은 피고인이 그 차량을 운전하였다는 사실의 자백 부분에 대한 보강증거가 될 수 있지만, 피고인의 무면허운전이라는 전체 범죄 사실의 보강증거가 될 수는 없다.","피고인이 증거로 동의한 압수조서 중 ‘압수경위’란에 피고인의 범행 장면(휴대전화기로 여성의 치마 속 몰래 촬영)을 현장에서 목격한 사법경찰관리가 이를 묘사한 진술내용이 포함된 경우, 이러한 내용은 지하철역 에스컬레이터에서 휴대전화기의 카메라를 이용하여 여성 피해자의 치마 속을 몰래 촬영하였다는 피고인의 자백에 대한 보강증거가 될 수 있다.",2,0,""],["2024-2","형사법",37,"전문법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피고인이 아닌 자의 진술을 기재한 서류가 비록 수사기관이 아닌 자에 의하여 작성되었다고 하더라도, 수사가 시작된 이후 수사 기관의 관여나 영향 아래 작성된 경우로서 서류를 작성한 자의 신분이나 지위, 서류를 작성한 경위와 목적, 작성 시기와 장소 및 진술을 받는 방식 등에 비추어 실질적으로 고찰할 때 그 서류가 수사과정 외에서 작성된 것이라고 보기 어렵다면, 이를 ｢형사 소송법｣ 제313조 제1항의 ‘전 2조의 규정 이외에 피고인이 아닌 자의 진술을 기재한 서류’에 해당한다고 할 수 없다.","｢형사소송법｣ 제314조에서 ‘특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 증명’은 단지 그러할 개연성이 있다는 정도 로는 부족하고, 법정에서의 반대신문 등을 통한 검증을 굳이 거치지 않더라도 진술의 신빙성을 충분히 담보할 수 있어 실질적 직접 심리주의와 전문법칙에 대한 예외로 평가할 수 있는 정도에 이르러야 한다.","乙로부터 “甲이 도둑질하는 것을 보았다.”라는 발언을 들은 A가 법정에서 증언하는 경우, 그 증언 내용은 乙의 甲에 대한 명예 훼손 사건에 관한 전문증거로서 전문법칙이 적용된다.","체포·구속인접견부는 유치된 피의자가 죄증을 인멸하거나 도주를 기도하는 등 유치장의 안전과 질서를 위태롭게 하는 것을 방지 하기 위한 목적으로 작성되는 서류로 보일 뿐이어서 ｢형사소송법｣ 제315조 제2호, 제3호에 규정된 당연히 증거능력이 있는 서류로 볼 수 없다.",2,0,""],["2024-2","형사법",38,"전문증거에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 참고인을 조사하는 과정에서 ｢형사소송법｣ 제221조 제1항에 따라 작성한 영상녹화물은 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수 없다.","甲은 악덕 사채업자 A와 채무변제 문제로 시비가 붙자 홧김에 A를 살해한 혐의로 기소되었는데, 甲의 친구 B는 공판에서 “甲이 나에게 ‘악덕 사채업자는 죽어도 싸다. 내가 A를 없애 버렸다’고 말한 적이 있습니다.”라고 증언하였다면, 甲의 진술이 ‘특히 신빙 할 수 있는 상태에서 행하여졌음’이 증명된 때에 한하여 B의 진술을 증거로 할 수 있다.","사법경찰관이 작성한 실황조서가 사고발생 직후 사고장소에서 긴급을 요하여 판사의 영장없이 시행된 것으로서 ｢형사소송법｣ 제216조 제3항에 의한 검증에 따라 작성된 것이라면 사후에 지체없이 영장을 받지 않는 한 유죄의 증거로 삼을 수 없다.","참고인의 진술을 내용으로 하는 조사자 증언은 그 참고인이 법정에 출석하여 조사 당시의 진술을 부인하는 취지로 증언 하였더라도, 그 진술이 ‘특히 신빙할 수 있는 상태에서 행하여 졌음’이 증명되면 증거능력이 인정된다.",3,0,""],["2024-2","형사법",39,"탄핵증거에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","공소사실에 부합하는 증거인 피해자의 진술을 탄핵하는 증거로 삼은 변호인 제출의 신용카드 사용내역승인서 사본이 비록 공판 과정에서 그 입증취지가 구체적으로 명시되고 제시까지 되었다고 하더라도 증거목록에 기재되지 않았고 증거결정이 있지 아니 하였다면, 탄핵증거로서의 증거조사는 이루어졌다고 볼 수 없다.","사법경찰리 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없을 뿐만 아니라, 그것이 임의로 작성된 것이라도 피고인의 법정에서의 진술을 탄핵 하기 위한 반대증거로 사용할 수 없다.","검사가 A에 대하여 참고인조사를 한 후 그 진술조서를 증거로 제출하였는데, A가 공판정에 나와 참고인진술조서에 기재된 내용과 모순되는 진술을 하면서 그 조서의 진정성립을 부인하는 경우, 그 참고인진술조서는 A의 위 법정진술에 대한 탄핵증거로 사용될 수 있다.","탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 할 것이지만, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 할 필요는 없다.",2,0,""],["2024-2","형사법",40,"다음 사례에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 甲은 A(여, 23세)를 강간하기로 마음을 먹었다. 甲은 일반인의 출입이 허용되고, 문이 열려 있는 상가 건물의 1층 출입문을 통해 통상적인 출입방법으로 A를 뒤따라 들어갔다. 甲은 그곳에서 엘리베이터를 기다리는 A를 폭행･협박하여 A의 반항을 억압한 후 지하 1층 계단으로 끌고 가 강간행위를 실행하였다. 甲은 강간 행위의 실행 도중 강도의 범의를 일으켜 범행현장에 있던 A 소유의 핸드백을 빼앗고 그 자리에서 강간행위를 계속한 후 핸드백을 가지고 도주하였다. 곧바로 A는 남동생 B에게 도움을 요청하면서 피해 내용을 문자메시지로 보냈다. 甲은 몇 달 후 수사기관에 의해 긴급체포되었는데 외국인으로 한국어가 몹시 서툴렀다. 사법경찰관은 피의자 甲을 신문하면서 피의자의 요청에 따라 신뢰관계 있는 사람을 동석하게 하여 피의자신문조서를 작성하였다. 甲은 위 범죄혐의로 기소되었고, 검사는 B로부터 피해 내용이 담긴 문자메시지를 촬영한 사진을 적법하게 임의제출받아 증거로 제출하였다.","甲이 A를 뒤따라 상가 건물 1층에 들어간 행위는 범죄를 목적 으로 한 출입으로 건조물침입죄의 침입행위에 해당한다.","위 사례의 경우, 甲에게는 강간죄와 강도죄의 경합범이 성립한다.","사법경찰관은 甲에 대한 피의자신문조서를 작성하면서 동석한 신뢰관계 있는 사람이 甲을 대신하여 진술하도록 하여서는 아니 되지만, 만약 동석한 사람이 甲을 대신하여 진술한 부분을 사법 경찰관이 조서에 기재하였다면 그 부분은 피의자의 진술을 기재한 것에 해당한다.","A와 B가 법정에 출석하여 A는 사진 속 문자메시지의 내용이 자신이 작성해 보낸 것과 동일함을 확인하고, B는 A가 보낸 문자메시지를 촬영한 사진이 맞다고 확인한 경우, 문자메시지를 촬영한 사진은 증거로 사용할 수 있다.",3,0,""],["2024-2","경찰학",1,"다음에서 설명하는 경찰의 분류에 관한 내용과 가장 관계가 깊은 것은? 보통경찰기관이 사회공공의 안녕과 질서를 유지하기 위하여 강제력을 수단으로 즉시강제, ｢경범죄 처벌법｣ 또는 ｢도로교통법｣ 위반자에 대한 통고처분 등 법집행을 행하는 경찰활동","고등경찰","예방경찰","질서경찰","협의의 행정경찰",2,0,""],["2024-2","경찰학",2,"실질적 의미의 경찰과 형식적 의미의 경찰개념에 관한 설명 으로 가장 적절하지 않은 것은?","실질적 의미의 경찰은 조직보다는 작용 중심으로 경찰개념을 파악하는 것으로, 일반행정기관이 공공의 안녕과 질서 유지를 위해 일반통치권에 근거하여 국민에게 명령･강제하는 권력적 작용은 실질적 의미의 경찰로 보아야 한다.","형식적 의미의 경찰개념에 따른 경찰활동의 범위는 국가마다 상이하고, 한 국가 내에서도 시간 변화에 따라 달라질 수 있다.","업무의 독자성 여부로 구분되는 협의의 행정경찰은 실질적 의미의 경찰에 해당하고, 형식적 의미의 경찰에는 해당하지 않는다.","보통경찰기관의 범죄 예방, 정보 수집･작성･배포 활동은 실질적 의미의 경찰뿐만 아니라 형식적 의미의 경찰에도 해당하지 않는다.",3,0,""],["2024-2","경찰학",3,"문제해결과정인 ‘SARA 모형’에 관한 설명으로 가장 적절하지 않은 것은?","조사단계(Scanning)는 지역에서 반복적으로 발생하고 있는 문제를 파악하는 데에서 출발하여 문제라고 여겨지는 개인과 관련된 사건을 분류하고, 정확하고 유용한 용어를 활용하여 이러한 문제를 조사한다.","분석단계(Analysis)는 지역사회와 경찰이 협력하는 등의 방법 으로 문제의 원인을 파악하고, 분석하는 단계이다.","대응단계(Response)는 경찰이 보유한 자원과 역량만으로는 한계가 있기 때문에 경찰관은 지역사회 내의 여러 다른 기관들과 협력을 통한 대응방안을 추구한다.","평가단계(Assessment)는 대응의 적절성을 평가하며, 효과평가와 결과평가의 두 단계로 이루어진다.",3,0,""],["2024-2","경찰학",4,"경찰행정의 특수성에 관한 설명으로 가장 적절하지 않은 것은?","경찰은 각종 위험의 제거를 그 주요 기능으로 하고 있고, 그 수단 으로서 명령･강제 등 경찰권을 발동할 수 있으며 필요한 경우 실력행사를 위하여 무기와 장구를 휴대하는데 이러한 특성을 위험성이라 한다.","경찰조직은 예측하기 어려운 다양한 사안에 대해 고도의 민첩성을 갖추고 타 부서 혹은 직원들과의 유기적인 공조체제를 갖추어 돌발적으로 발생하는 범죄사건과 사고에 즉시 대응하여 합리적인 방법으로해결할수있도록해야하는데이러한특성을조직성이라한다.","경찰 업무는 대부분 즉시 해결하지 못하면 그 피해의 회복이 영원히 불가능하거나 현저하게 어려운 경우가 많은 바, 돌발적 으로 발생하는 경찰행정 수요에 즉시 대응하기 위해 기동장비 확보, 초동대처시간 단축을 위해 훈련을 해야 하는데 이러한 특성을 기동성이라 한다.","경찰은 본질적으로 사회공공의 안녕과 질서를 유지하기 위하여 국민에게 명령･강제하는 권력작용의 특성을 보이는데 이러한 특성을 권력성이라 한다.",1,0,""],["2024-2","경찰학",5,"｢경찰관 직무집행법｣에 실정법상 경찰의 직무가 규정되어 있다. 이러한 직무의 범위는 사회환경 또는 범죄양상의 변화 등으로 인해서 확장될 수 있다. 다음 중 ｢경찰관 직무집행법｣ 제2조에 명시적으로 규정된 직무 중에서 가장 최근에 신설된 것은 무엇인가?","경비, 주요인사 경호 및 대간첩･대테러 작전 수행","외국 정부기관 및 국제기구와의 국제협력","교통 단속과 교통 위해의 방지","범죄피해자 보호 (일반공채･101경비단･경찰행정 경채)",3,0,""],["2024-2","경찰학",6,"경찰의 관할에 관한 설명으로 가장 적절하지 않은 것은?","사물관할이란 경찰이 처리할 수 있고 처리해야 하는 사무내용의 범위를 말하는 것으로 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣과 ｢경찰관 직무집행법｣에 규정되어 있다.","재판장은 법정에서의 질서유지를 위하여 필요하다고 인정할 때에는 개정 전에 한하여 관할 경찰서장에게 경찰공무원의 파견을 요구할 수 있다.","국회의원은 현행범인인 경우를 제외하고는 회기 중 국회의 동의 없이 체포 또는 구금되지 아니한다. 그리고 국회의원이 회기 전에 체포 또는 구금된 때에는 현행범인이 아닌 한 국회의 요구가 있으면 회기 중 석방된다.","지역관할과 인적관할은 광의의 경찰권이 발동될 수 있는 지역적 범위와 인적 범위를 말하고, 광의의 경찰권은 협의의 경찰권, 수사권, 비권력적 활동 권한을 포함하는 개념이다.",1,0,""],["2024-2","경찰학",7,"경찰의 기본이념에 관한 설명으로 가장 적절하지 않은 것은?","법치주의: 자치경찰제도를 도입하여 중앙정부의 경찰권을 자치 단체에 위임하고, 국가경찰위원회 및 시･도자치경찰위원회 제도, 행정정보공개제도 등을 통해 경찰에 대한 민주적 통제와 참여 장치를 마련한다.","정치적 중립주의: 공무원은 국민 전체의 봉사자이며 국민에 대하여 책임을 진다. 경찰공무원을 비롯한 공무원의 신분과 정치적 중립성은 제도적으로 보장된다.","민주주의: 국민의 자유와 권리를 보호하고 공공의 안녕과 질서를 유지하는 경찰의 임무수행은 국민을 위하여 행하는 것이며, 경찰권은 국민에게서 부여받은 것이다.","인권 존중주의: 경찰은 직무를 수행할 때 헌법과 법률에 따라 국민의 자유와 권리 및 모든 개인이 가지는 불가침의 기본적 인권을 보호한다.",0,0,""],["2024-2","경찰학",8,"하이덴하이머(Heidenheimer)의 경찰부패에 관한 설명으로 가장 적절하지 않은 것은?","백색부패는 선의의 목적으로 행해지는 부패행위를 말한다.","회색부패는 사회 전체에 명백하고 심각한 해를 끼치는 부패이며 흑색부패로 악화될 수 있다.","업무와 관련된 대가성 있는 뇌물을 받는 경우는 흑색부패에 해당한다.","관직중심적 부패는 관료들이 직무를 수행하는 과정에서 사적 이익의 추구를 위하여 권한을 악용하여 조직의 규범을 일탈하는 행위를 말한다.",1,0,""],["2024-2","경찰학",9,"다음에서 설명하는 경찰문화를 극복하기 위한 방안으로 가장 적절하지 않은 것은? 경찰청에서 새로운 성과평가 제도를 시행하겠다고 발표하자, A순경은 ‘나랑 상관없어. 이런 건 전시행정이야’라고 비웃었다. 평소 그는 기존의 사회체계에 대한 신뢰가 없으며 개선시키겠다는 의지도 없는 사람이다.","의사결정과정에 일선 경찰관들의 참여를 확대시킨다.","업무량과 성과에 대한 적절한 보상을 강조하며, 관리층이 적극적 으로 개입하고 통제하는 임무를 맡아야 한다.","상사와 부하의 신뢰를 회복하기 위해 노력한다.","상급자의 일방적 지시와 명령을 줄이고 상의하달의 의사소통 과정을 개선한다.",1,0,""],["2024-2","경찰학",10,"｢경찰청 공무원 행동강령｣ 제17조(경조사의 통지 제한)에 따르면 공무원은 직무관련자나 직무관련공무원에게 경조사를 알려서는 아니 된다. 다음 중 그 예외로 규정하지 않은 것은?","친족(｢민법｣ 제767조에 따른 친족)에게 알리는 경우","현재 근무하고 있거나 과거에 근무하였던 기관의 소속 직원에게 알리는 경우","공무원 자신의 배우자가 소속된 친목단체 회원에게 알리는 경우","신문, 방송 등을 통하여 알리는 경우",2,0,""],["2024-2","경찰학",11,"범죄예방 환경설계(CPTED: Crime Prevention Through Environmental Design)에 관한 설명으로 가장 적절하지 않은 것은?","접근통제(Access control) 전략의 주요 기능은 보행로, 조경 등을 통해 일정 공간으로 유도함과 동시에 허가받지 않은 사람들의 진･출입을 차단하여 목표물로의 접근을 막고 대상물의 강화를 통해 범죄자에게 심리적 부담과 위험을 인지시키는 것이다.","영역성(Territoriality) 전략의 물리적 디자인은 사용자들이 소유권과 점유권의 개념을 발전시키고 잠재적 범죄자들은 영역성의 영향을 인지하게 되어 정당한 사용자들의 권리와 재산권에 대한 관념을 강화하는 개념이다.","자연적 감시(Natural surveillance) 전략은 공공장소의 활발한 사용을 유도하여 일상활동의 활성화를 위해 거리에 더 많은 눈(more eyes)을 통해 자연스러운 감시 기능을 강화하여 범죄 위험을 감소시키고 주민들의 안전감을 향상시키는 것이다.","유지관리(Maintenance) 전략은 어떤 시설물이나 공공장소를 처음 디자인하거나 이를 개선한 의도대로 범죄예방 기능을 지속적으로 발휘하도록 하여, 공간을 의도한 목적에 맞게 지속적으로 사용하도록 하는 것이다.",2,0,""],["2024-2","경찰학",12,"사회학적 범죄학 이론 중에서 사회구조원인론으로 분류하기에 가장 적절하지 않은 이론을 설명한 것은?","사람들을 ‘잠재적 범죄자’로 간주하고 사회적 결속과 유대의 약화로 인해 비행이 발생한다고 주장한다.","하류계층 청소년들은 ‘지위좌절’이라는 갈등의 형태를 경험 하면서 중류계층의 가치관에 대한 적대적 반응을 갖게 되고, 목표달성의 어려움을 극복하기 위해 자신들만의 하위문화를 만들게 된다고 주장한다.","사회규범의 붕괴로 무규범 상태가 되고 이러한 무규범 상태에서 범죄가 발생한다고 주장한다.","산업화 및 도시화 과정에서 그 지역의 사회조직이 극도로 해체 되었기 때문에 범죄와 비행이 발생한다고 주장한다.",0,0,""],["2024-2","경찰학",13,"지역사회 경찰활동에 관한 설명으로 옳은 것을 모두 고른 것은? ㉠ 이웃지향적 경찰활동(NOP)은 경찰과 지역주민 사이에 좋은 관계를 유지하고 경찰활동을 널리 지역주민에게 이해시키고, 범죄예방활동에 지역주민을 적극적으로 참여시켜 협력해 주도록 하는 경찰활동을 말한다. ㉡ 문제지향적 경찰활동(POP)은 반복된 사건을 야기하는 근본적인 원인을 해결해야 한다고 주장하며, 현장 경찰관에게 자유재량을 부여하고, 범죄분석자료를 제공, 대중정보와 비평을 적극적으로 수용한다. ㉢ 전략지향적 경찰활동(SOP)은 치안유지를 위한 각 기관들의 정보 취합과 활용 그리고 지역사회 참여를 업무 처리 방식의 틀로 사용하고, 사건 분석을 위해 지리정보시스템을 활용하여 분석 기법을 사용한 법집행 위주의 경찰활동이다. ㉣ 증거기반 경찰활동(evidence-based policing)은 경찰정책과 의사결정에 있어서 과학적･의학적 증거에 기반하여 증거의 개발, 검토, 활용을 위해 경찰관 및 직원이 연구기관과 함께 활동하는 접근방법이다.","㉠㉡","㉠㉢","㉡㉣","㉢㉣",2,0,""],["2024-2","경찰학",14,"미군정시기 경찰에 관한 설명으로 가장 적절하지 않은 것은?","예비검속법, 치안유지법 등이 폐지되는 등 법적 정비가 이루어졌다.","1945년 ‘법무국 검사에 관한 훈령 제3호’가 발령되어 ‘수사는 경찰, 기소는 검사’ 체제가 도입되어 경찰의 독자적 수사권이 인정되었다.","1946년 경무국을 경무부로 승격시키고, 기존 경무국의 과(課)를 국(局)으로 승격시켰다.","‘태평양미군총사령부포고 제1호’를 통해 미군정을 실시하였으며, 일제강점기 시대의 경찰 인력을 현직에서 청산함으로써 경찰의 인적 구성원을 대거 쇄신하였다.",3,0,""],["2024-2","경찰학",15,"외국경찰제도에 관한 설명으로 가장 적절한 것은?","일본의 사법경찰(직원)은 1차적 수사기관으로 인정받고 있어, 수사를 개시･진행･종결까지 독자적으로 한 이후 검사에게 송치 하는 것이 원칙이다.","프랑스에서는 수사의 주체가 수사판사 또는 검사이고, 국립경찰 소속 사법경찰뿐만 아니라 사법경찰활동을 하는 군경찰도 수사 판사 또는 검사의 수사지휘를 받아야 한다.","독일에서는 주별로 법률이 독자적으로 제정･운영되고 있어 주 경찰 중심으로 일반적 경찰권을 행사하나, 수사권에 있어서는 통일적 업무수행을 위해 연방(범죄)수사청이 주 소속 수사경찰을 지휘･감독한다.","미국경찰에는 기본적으로 지방경찰, 주 경찰, 연방경찰이 존재 하며, 이 중 광범위한 경찰권을 행사하여 법집행의 범위가 가장 넓은 것은 주 경찰이다.",1,0,""],["2024-2","경찰학",16,"행정법상 비례의 원칙에 관한 설명으로 가장 적절하지 않은 것은?","비례의 원칙이란 행정작용에 있어서 행정목적과 행정수단 사이에는 합리적인 비례관계가 있어야 한다는 원칙을 말한다.","비례의 원칙은 헌법 제37조 제2항, ｢행정기본법｣ 제10조, ｢경찰관 직무집행법｣ 제1조 제2항에서 근거를 찾을 수 있다.","적합성의 원칙은, 행정조치는 설정된 목적 달성을 위해 필요 최소한의 한도 내에서 이루어져야 한다는 것으로, 협의의 비례 원칙이라고도 한다.","행정조치를 취함에 따른 불이익이 그것에 의해 달성되는 이익 보다 심히 큰 경우에는 그 행정조치를 취해서는 아니된다는 원칙을 상당성의 원칙이라 한다.",2,0,""],["2024-2","경찰학",17,"｢법령 등 공포에 관한 법률｣에 대한 설명으로 가장 적절 하지 않은 것은?","｢법령 등 공포에 관한 법률｣상 법률, 대통령령, 총리령 및 부령은 특별한 규정이 없으면 공포한 날부터 20일이 경과함으로써 효력을 발생한다.","｢국회법｣ 제98조 제3항 전단에 따라 하는 국회의장의 법률 공포는 서울특별시에서 발행되는 둘 이상의 일간신문에 게재함 으로써 한다.","법령 등의 공포일 또는 공고일은 해당 법령 등을 게재한 관보 또는 신문이 발행된 날로 한다.","헌법개정･법률･조약･대통령령･총리령 및 부령의 공포와 헌법 개정안･예산 및 예산 외 국고부담계약의 공고는 관보에 게재 함으로써 한다.",0,0,""],["2024-2","경찰학",18,"다음 중 행정행위의 무효로 볼 수 있는 경우가 아닌 것은? (다툼이 있는 경우 판례에 의함)","음주운전을 단속한 경찰관 명의로 행한 운전면허정지처분의 효력","임용권자의 과실에 의한 임용결격자에 대한 경찰공무원 임용 행위의 효력","행정처분의 처분 방식에 관한 ｢행정절차법｣ 제24조 제1항을 위반한 처분의 효력","임면권자가 아닌 국가정보원장이 5급 이상의 국가정보원직원에 대하여 한 의원면직처분의 효력",3,0,""],["2024-2","경찰학",19,"행정행위의 부관에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있더라도 부관을 붙일 수 없다.","기한은 법률행위 효력의 발생 또는 소멸을 장래의 불확실한 사실의 성부에 의존하게 하는 법률행위의 부관이다.","장래의 사실이더라도 그것이 장래 반드시 실현되는 사실이면 실현 되는 시기가 비록 확정되지 않더라도 이는 조건으로 보아야 한다.","행정청이 종교단체에 대하여 기본재산전환인가를 함에 있어 인가조건을 부가하고 그 불이행시 인가를 취소할 수 있도록 한 경우, 그 인가조건의 의미를 철회권의 유보로 본다.",3,0,""],["2024-2","경찰학",20,"｢행정절차법｣상 처분에 관한 설명으로 가장 적절한 것은?","의견제출기한에 따른 기한은 의견제출에 필요한 기간을 10일 이상으로 고려하여 정하여야 한다.","행정청이 정당한 처리기간 내에 처리하지 아니하였을 때에도 신청인은 해당 행정청 또는 그 감독 행정청에 신속한 처리를 요청할 수 없다.","행정청에 처분을 구하는 신청은 구두 또는 문서로 하여야 한다. 다만, 다른 법령등에 특별한 규정이 있는 경우와 행정청이 미리 다른 방법을 정한 경우에는 그러하지 아니하다.","행정청이 인허가 등의 취소처분을 하는 경우 공청회를 개최한다.",0,0,""],["2024-2","경찰학",21,"｢공공기관의 정보공개에 관한 법률｣상 정보공개의 절차에 관한 설명으로 가장 적절하지 않은 것은?","정보의 공개를 청구하는 자는 해당 정보를 보유하거나 관리하고 있는 공공기관에 정보공개 청구서를 제출하거나 말로써 정보의 공개를 청구할 수 있다.","공공기관은 전자적 형태로 보유･관리하는 정보에 대하여 청구인이 전자적 형태로 공개하여 줄 것을 요청하는 경우에는 그 정보의 성질상 현저히 곤란한 경우를 제외하고는 청구인의 요청에 따라야 한다.","정보의 공개 및 우송 등에 드는 비용은 실비의 범위에서 공공 기관이 부담한다.","공공기관은 ｢공공기관의 정보공개에 관한 법률｣ 제11조에 따라 정보의 공개 결정을 한 경우에는, 청구인이 사본 또는 복제물의 교부를 원하는 경우에는 이를 교부하여야 한다.",2,0,""],["2024-2","경찰학",22,"｢질서위반행위규제법｣에 관한 설명으로 가장 적절하지 않은 것은?","질서위반행위의 성립과 과태료 처분은 행위 시의 법률에 따른다.","심신장애로 인하여 행위의 옳고 그름을 판단할 능력이 없거나 그 판단에 따른 행위를 할 능력이 없는 자의 질서위반행위는 과태료를 감경한다.","이 법은 대한민국 영역 밖에서 질서위반행위를 한 대한민국의 국민에게 적용한다.","법률에 따르지 아니하고는 어떤 행위도 질서위반행위로 과태료를 부과하지 아니한다.",1,0,""],["2024-2","경찰학",23,"경찰공무원의 분류 및 관계에 관한 설명으로 가장 적절하지 않은 것은?","｢경찰공무원 임용령｣과 ｢경찰공무원 임용령 시행규칙｣에서는 경과별 직무의 종류를 규정하고 있으며, 수사경과･안보수사경과･ 항공경과･정보통신경과에 속하지 아니하는 직무를 일반경과의 직무로 구분하고 있다.","｢국적법｣ 제11조의2 제1항에 따른 복수국적자는 ｢경찰공무원법｣에 규정된 임용의 결격사유에 해당한다.","｢경찰공무원법｣에 따르면 경정 이하의 경찰공무원은 경찰청장 또는 해양경찰청장이 임용한다. 다만, 경정으로의 신규채용, 승진임용 및 면직은 경찰청장 또는 해양경찰청장의 제청으로 국무총리를 거쳐 대통령이 한다.","｢경찰공무원 임용령｣에 따르면 임용권자 또는 임용제청권자는 시보임용경찰공무원의 생활기록이 극히 불량할 경우 정규임용 심사위원회의 심사를 거쳐 면직시킬 수 있으나, 징계사유에 해당하는 경우에는 그러하지 아니한다.",3,0,""],["2024-2","경찰학",24,"다음 경찰과 관련한 대화 중 가장 적절하지 않은 설명을 하고 있는 사람은?","민희: “우리 지역에 파출소 하나만 생기면 밤길이 안전할 거 같은데, 파출소 설치의 승인권자는 경찰청장이라고 하네.”","지율: “경찰청장, 국가수사본부장, 국가경찰위원회 위원, 시･도 자치경찰위원회 위원 모두 연임이 불가능해. 단, 시･도자치경찰 위원회 보궐위원의 경우 전임자의 남은 임기가 1년 미만인 경우 한 차례만 연임할 수 있어.”","수연: “우리 동네에 요즘 가정폭력사건이 자주 발생하네. ｢국가 경찰과 자치경찰의 조직 및 운영에 관한 법률｣을 보면 가정 폭력의 예방은 자치경찰사무에 해당하여 시･도자치경찰위원회의 소관사무이지만, 가정폭력범죄의 수사사무는 국가경찰사무로 규정되어 있어.”","윤우: “한국의 자치경찰제도는 법률에서 자치경찰사무와 국가 경찰사무를 구분하고 있지만, 자치경찰사무를 담당하는 경찰관의 신분은 기존 그대로 국가공무원이더라고. 단, 제주특별자치도 자치경찰단 소속의 자치경찰공무원은 지방공무원이야.”",2,0,""],["2024-2","경찰학",25,"경찰통제에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? ㉠ 경찰이 보유･관리하는 정보는 국민의 알권리 보장 등을 위하여 ｢공공기관의 정보공개에 관한 법률｣에서 정하는 바에 따라 적극적으로 공개하는 것이 기본 원칙이다. ㉡ 국회에 의한 입법통제 방식에는 사전통제 방식과 사후통제 방식이 존재한다. ㉢ 행정부에 의한 통제유형에는 중앙행정심판위원회에 의한 통제, 국정조사･감사권 등이 포함된다. ㉣ ｢경찰감찰규칙｣에서는 조사대상자가 영상녹화를 요청하는 경우에 감찰관이 재량적으로 판단할 수 있도록 하고 있다.","없음","1개","2개","3개",2,0,""],["2024-2","경찰학",26,"｢112신고의 운영 및 처리에 관한 법률｣과 같은 법 시행령상 112신고의 접수･처리 등에 관한 설명으로 가장 적절하지 않은 것은?","경찰청장, 시･도경찰청장 및 경찰서장(이하 “경찰청장등”이라 한다)은 112신고를 받으면 ｢경찰관 직무집행법｣ 제2조에 따른 경찰사무의 구분이나 현장 출동이 필요한 지역의 관할의 관계를 고려하여 해당 112신고를 신속하게 접수하여 처리하여야 한다.","경찰청장등은 112신고를 처리하는 과정에서 재난･재해, 범죄 또는 그 밖의 위급한 상황이 발생하여 사람의 생명･신체를 위험 하게 할 것으로 인정할 때에는 일정한 구역을 정하여 그 구역에 있는 사람에게 그 구역 밖으로 피난할 것을 명할 수 있다.","112치안종합상황실은 경찰청, 시･도경찰청 및 경찰서에 설치한다.","112신고 접수 및 처리와 관련된 112시스템 입력자료는 3년간 보존한다. 다만, 단순 민원･상담 등 경찰청장이 정하는 경미한 내용의 112신고의 경우에는 1년으로 한다.",0,0,""],["2024-2","경찰학",27,"｢경찰관 직무집행법｣상 경찰장비와 장구에 관한 설명으로 가장 적절하지 않은 것은?","“경찰장비”란 무기, 경찰장구, 경찰착용기록장치, 최루제와 그 발사 장치, 살수차, 감식기구, 해안 감시기구, 통신기기, 차량･선박･항공기 등 경찰이 직무를 수행할 때 필요한 장치와 기구를 말한다.","“경찰착용기록장치”란 경찰관이 신체에 착용 또는 휴대하여 직무 수행 과정을 근거리에서 영상･음성으로 기록할 수 있는 기록장치 또는 그 밖에 이와 유사한 기능을 갖춘 기계장치를 말한다.","경찰청장, 시･도경찰청장 및 경찰서장은 경찰착용기록장치로 기록한 영상･음성을 저장하고 데이터베이스로 관리하는 영상 음성기록정보 관리체계를 구축･운영하여야 한다.","경찰관은 경찰장비를 함부로 개조하거나 경찰장비에 임의의 장비를 부착하여 일반적인 사용법과 달리 사용함으로써 다른 사람의 생명･신체에 위해를 끼쳐서는 아니 된다.",2,0,""],["2024-2","경찰학",28,"｢국가배상법｣상 손해배상에 관한 설명으로 가장 적절한 것은?","군인･군무원･경찰공무원 또는 예비군대원이 전투･훈련 등 직무 집행과 관련하여 전사･순직하거나 공상을 입은 경우에 본인이나 그 유족이 다른 법령에 따라 재해보상금･유족연금･상이연금 등의 보상을 지급받을 수 있을 때에도 ｢국가배상법｣ 및 ｢행정기본법｣에 따른 손해배상을 청구할 수 있다.","생명･신체에 대한 침해와 물건의 멸실･훼손으로 인한 손해 외의 손해는 불법행위와 상당한 인과관계가 있는 범위에서 배상한다.","국가나 지방자치단체에 대한 배상신청사건을 심의하기 위하여 행정안전부에 본부심의회를 둔다. 다만, 군인이나 군무원이 타인에게 입힌 손해에 대한 배상신청사건을 심의하기 위하여 국방부에 특별심의회를 둔다.","결정서의 송달에 관하여는 ｢행정소송법｣의 송달에 관한 규정을 준용한다.",1,0,""],["2024-2","경찰학",29,"정책결정자가 문제상황에 대해 완전한 정보를 갖고 있으며 고도의 합리성을 기반으로 최선의 대안을 결정하는 모델은 무엇인가?","합리 모델(Rational model)","만족 모델(Satisfying model)","엘리트 모델(Elite model)","쓰레기통 모델(Garbage can model)",0,0,""],["2024-2","경찰학",30,"다음에서 설명하는 조직편성원리에 관한 내용과 가장 관계가 깊은 것은? 한 사람이 직접적으로 감독할 수 있는 부하의 수는 업무의 성질, 고용기술, 작업성과 기준에 달려 있으며, 모든 조직은 일반적 으로 상관보다 부하가 더 많다. 이러한 이유 때문에 경찰 조직은 사다리 모양보다는 피라미드 모양을 취하고 있다.","조직의 경직화를 초래하여 환경변화에 따른 새로운 기술의 신속한 도입이 어렵다.","부하들을 직접 감독하지 않는 참모 및 계선조직이 부하들에게 유익한 자문을 하는 것을 허용하지 않는다.","경과 제도를 통한 특정업무의 세분화 및 시간과 경비를 절약 할 수 있다.","구조조정의 문제와 깊은 관련성이 있다.",3,0,""],["2024-2","경찰학",31,"직업공무원제도에 관한 설명으로 가장 적절한 것은?","개방형 충원체제로 넓은 시야를 가진 유능한 인재의 등용 및 분야별 전문인력을 확보하는 데 용이하다.","공무원의 일체감과 단결심 및 공직에 헌신하려는 정신을 강화 하는 데 불리한 제도이다.","연령제한이 필수적이나 직위분류제를 원칙으로 한다는 점에서 실적주의와 공통점이 있다.","공무원들의 성실한 직무수행과 장기근속을 유도하기 위한 제도와 원칙들을 토대로 한다.",3,0,""],["2024-2","경찰학",32,"예산제도에 관한 설명으로 가장 적절하지 않은 것은?","영기준예산제도는 정부지출의 전체적인 성과파악이 곤란하고 예산운영의 신축성 부족 등이 단점으로 평가되고 있다.","성과주의예산제도는 정부가 무슨 일을 하느냐에 중점을 두는 제도로 관리지향성을 지닌다.","품목별예산제도는 정부지출 대상이 되는 물품, 품목 등을 기준 으로 한 예산제도로서 예산의 남용이나 오용을 방지하는 데 도움이 된다.","계획예산제도는 의사결정을 일관성 있게 합리화하려는 제도 이지만 하향적(top-down)인 방식으로 집권화되어 있기 때문에 조직구성원들의 참여를 저해한다는 한계가 있다.",0,0,""],["2024-2","경찰학",33,"｢경찰장비관리규칙｣에 관한 설명으로 옳고 그름의 표시 (O, X)가 바르게 된 것은? ㉠ 경찰기관의 장은 무기를 휴대한 자 중에서 형사사건의 수사 대상이 된 자가 있을 때에는 무기 소지 적격 심의위원회 (이하 “심의위원회”라 한다)의 심의를 거쳐 대여한 무기･ 탄약을 회수할 수 있다. 다만, 심의위원회를 개최할 시간적 여유가 없거나 사고 방지 등을 위해 신속한 회수가 필요 하다고 인정되는 경우에는 대여한 무기･탄약을 즉시 회수할 수 있으며, 회수한 날부터 7일 이내에 심의위원회를 개최 하여 회수의 타당성을 심의하고 계속 회수 여부를 결정한다. ㉡ 심의위원회는 위원장 1명을 포함하여 총 5명 이상 7명 이내의 위원으로 구성하되 민간위원 1명 이상이 위원으로 참여하여야 한다. ㉢ 경찰기관의 장은 무기를 휴대한 자 중에서 정신건강상 문제가 우려되어 치료가 필요한 자의 경우 대여한 무기･ 탄약을 즉시 회수해야 한다. ㉣ 집중무기고란 경찰탄약을 집중 보관 및 관리하기 위해 각 경찰기관에 설치된 시설을 말한다.","㉠(O) ㉡(O) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(O) ㉢(X) ㉣(O)",0,0,""],["2024-2","경찰학",34,"｢언론중재 및 피해구제 등에 관한 법률｣에 대한 설명으로 가장 적절하지 않은 것은?","언론, 인터넷뉴스서비스 및 인터넷 멀티미디어 방송(이하 “언론등”이라 한다)은 타인의 생명, 자유, 신체, 건강, 명예, 사생활의 비밀과 자유, 초상, 성명, 음성, 대화, 저작물 및 사적 문서, 그 밖의 인격적 가치 등에 관한 권리를 침해하여서는 아니 된다.","반론보도청구에는 언론사, 인터넷뉴스서비스사업자 및 인터넷 멀티미디어 방송사업자(이하 “언론사등”이라 한다)의 고의･과실 이나 위법성을 필요로 하지 아니하며, 보도 내용의 진실여부와 상관없이 그 청구를 할 수 있다.","언론등에 의하여 범죄혐의가 있거나 형사상의 조치를 받았다고 보도 또는 공표된 자는 그에 대한 형사절차가 무죄판결 또는 이와 동등한 형태로 종결되었을 때에는 그 사실을 안 날부터 3개월 이내에 언론사등에 이 사실에 관한 추후보도의 게재를 청구할 수 있다.","언론사등이 정정보도청구를 수용할 때에는 지체없이 피해자 또는 그 대리인과 정정보도의 내용･크기 등에 관하여 협의한 후, 그 협의가 있은 날부터 7일 내에 정정보도문을 방송하거나 게재 하여야 한다. 다만, 신문 및 잡지 등 정기간행물의 경우 이미 편집 및 제작이 완료되어 부득이할 때에는 게재하지 않을 수 있다.",3,0,""],["2024-2","경찰학",35,"｢경범죄 처벌법｣에 관한 설명으로 가장 적절하지 않은 것은?","인터넷 중고거래 사이트를 통해 비대면으로 웃돈을 받고 유명 가수의 콘서트 티켓을 되판 사람은 이 법상 암표매매로 처벌된다.","있지 아니한 범죄나 재해 사실을 공무원에게 거짓으로 신고한 사람은 주거가 분명하여도 현행범으로 체포할 수 있다.","피해자가 있는 범칙행위를 한 사람은 범칙자에 해당하지 아니한다.","주거 또는 신원이 확실하지 아니한 사람에게는 통고처분을 하지 아니한다.",0,0,""],["2024-2","경찰학",36,"향정신성의약품 중 LSD에 관한 설명으로 옳은 것은 모두 몇 개인가? ㉠ 근육강화 호르몬 분비효과가 있으며, 소다수 등에 타서 타인 에게 복용하게 하여 성범죄 등에 악용한다. ㉡ 곡물의 곰팡이, 보리 맥각에서 추출한 물질을 인공적으로 합성시켜 만들어낸 것으로 무색･무취･무미하다. ㉢ 미량을 우편, 종이 등의 표면에 묻혔다가 뜯어서 입에 넣는 방법으로 복용하기도 한다. ㉣ 강한 중추신경 억제성 진해작용이 있으며 코데인 대용으로 시판되고 있다. ㉤ 일부 남용자들은 실제로 사용하지 않는데도 환각현상을 경험 하는 ‘플래쉬백 현상’을 일으키기도 한다.","1개","2개","3개","4개",2,0,""],["2024-2","경찰학",37,"｢특정중대범죄 피의자 등 신상정보 공개에 관한 법률｣에 대한 설명으로 옳은 것은 모두 몇 개인가? ㉠ 검사와 사법경찰관은 이 법상 신상정보 공개 요건을 모두 갖춘 특정중대범죄사건의 피의자의 얼굴, 성명 및 나이를 공개할 수 있다. 다만, 피의자가 미성년자인 경우에는 공개 하지 아니할 수 있다. ㉡ 검사와 사법경찰관은 이 법상 신상정보 공개를 결정할 때에는 범죄의 중대성, 범행 후 정황, 피해자 보호 필요성, 피해자 (피해자가 사망한 경우 피해자의 유족을 포함한다)의 의사 등을 종합적으로 고려하여야 한다. ㉢ 법무부장관은 이 법상 신상정보 공개 여부에 관한 사항을 심의하기 위하여 신상정보공개심의위원회를 둘 수 있다. ㉣ 수사 및 재판 단계에서 신상정보의 공개에 대하여는 다른 법률의 규정이 있는 경우 그 법률에 따른다.","없음","1개","2개","3개",1,0,""],["2024-2","경찰학",38,"다음 중 ｢도로교통법｣ 제32조(정차 및 주차의 금지)에 규정된 장소를 모두 고른 것은? (다만, 이 법이나 이 법에 따른 명령 또는 경찰공무원의 지시를 따르는 경우와 위험방지를 위하여 일시정지하는 경우는 고려하지 않는다) ㉠ 터널 안 및 다리 위 ㉡ 교차로의 가장자리나 도로의 모퉁이로부터 5미터 이내인 곳 ㉢ 시장등이 제12조 제1항에 따라 지정한 어린이 보호구역 ㉣ 교차로･횡단보도･건널목이나 보도와 차도가 구분된 도로의 보도(｢주차장법｣에 따라 차도와 보도에 걸쳐서 설치된 노상 주차장은 제외한다) ㉤ 도로공사를 하고 있는 경우에는 그 공사 구역의 양쪽 가장 자리로부터 5미터 이내인 곳","㉠㉡㉢","㉠㉣㉤","㉡㉢㉣","㉢㉣㉤",2,0,""],["2024-2","경찰학",39,"｢집회 및 시위에 관한 법률｣과 같은 법 시행령에 규정된 확성기등의 소음기준 및 측정방법에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","확성기등의 소음은 관할 경찰서장(현장 경찰공무원)과 주최자가 임명한 자가 함께 측정한다.","등가소음도와 최고소음도를 측정하는 데 있어서 대상 지역을 주거지역･학교･종합병원, 공공도서관, 그 밖의 지역으로 구분 하고 시간대를 주간과 야간으로만 구분하여 각기 차별적인 등가 소음도와 최고소음도 기준을 적용한다.","등가소음도는 10분간(소음 발생 시간이 10분 이내인 경우에는 그 발생 시간 동안을 말한다) 측정한다. 다만, 주거지역, 학교, 종합 병원, 공공도서관의 경우에는 등가소음도를 5분간(소음 발생 시간이 5분 이내인 경우에는 그 발생 시간 동안을 말한다) 측정한다.","확성기등 사용을 제한하는 규정 도입 취지에 따라 신고대상 집회･시위가 아닌 경우뿐만 아니라 1인 시위의 경우에도 소음 제한 규정을 동일하게 적용한다.",2,0,""],["2024-2","경찰학",40,"국제경찰공조에 관한 설명으로 가장 적절한 것은?","국제형사사법공조와 범죄인 인도는 동일한 법률에 근거하고 있다.","｢국제형사사법공조법｣에는 증거 수집, 압수･수색 또는 검증이 공조의 범위로 포함되어 있다.","국제형사경찰기구(인터폴)의 회원국은 자국 내 설치된 국가중앙 사무국을 통해 다른 나라의 국가중앙사무국과 국제범죄정보 및 자료를 교환하며, 임의적 협조라기보다는 강제적 협조의 성격을 가진다.","국제형사경찰기구는 국제형사공조기구로 분류되며, 예외적인 사안에서는 국제형사경찰기구 소속 수사관이 범인을 체포하거나 구속할 수도 있다.",1,0,""],["2025-1","헌법",1,"역대 헌법에 관한 설명으로 가장 적절한 것은?","1948년 제헌헌법은 선거권자의 연령을 “20세”로 규정하였다.","1954년 제2차 개정헌법은 처음으로 지방자치를 규정하였다.","1960년 제3차 개정헌법은 헌법기관으로서 “중앙선거위원회”를 규정하였다.","1962년 제5차 개정헌법은 지방자치단체의 장을 주민이 직접 선거하도록 규정하였다.",2,0,""],["2025-1","헌법",2,"정당에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","정당은 공법상 법인으로서 공권력행사의 주체에 해당하지만, 국립대학이나공영방송과마찬가지로헌법소원심판을청구할수있다.","대한민국국적이없는외국인도18세이상이면정당원이될수 있다.","｢정치자금법｣상 “보조금”이라 함은 정당의 보호‧육성을 위하여 국가가 정당에 지급하는 금전이나 유가증권을 말한다.","｢정치자금법｣에 따라 회계보고된 자료의 열람기간을 공고일부터 3월간으로 제한한 ｢정치자금법｣ 조항은 정치자금을 둘러싼 분쟁 등의 장기화 방지 및 행정부담의 경감을 위한 것으로서, 열람을 신청한 청구인의 알권리를 침해하지 않는다.",2,0,""],["2025-1","헌법",3,"법치국가원리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","조세에 관한 법규‧제도는 신축적으로 변할 수밖에 없다는 점에서 납세의무자로서는 구법질서에 의거한 신뢰를 바탕으로 적극적 으로 새로운 법률관계를 형성하였다든지 하는 특별한 사정이 없는 한, 현재의 세법이 변함없이 유지되리라고 기대하거나 신뢰할 수는 없다.","수신료 징수업무를 지정받은 자가 수신료를 징수하는 때 그 고유 업무와 관련된 고지행위와 결합하여 이를 행해서는 안 된다고 규정한 ｢방송법 시행령｣ 조항으로 인하여, 한국방송공사가 징수할 수 있는 수신료의 금액이나 범위의 변경은 없고 오로지 그 징수 방법이 기존 전기요금과 통합하여 납부통지하던 것에서 이를 분리 하여 납부통지하는 것으로 변경될 뿐, 위 조항이 신뢰보호원칙에 위배된다고 볼 수 없다.","입법자가 형식적 법률로 스스로 규율하여야 하는 사항이 어떤 것인가는 일률적으로 획정할 수 없고 구체적 사례에서 관련된 이익 내지 가치의 중요성, 규제 내지 침해의 정도와 방법 등을 고려하여 개별적으로 결정할 수 있을 뿐이나, 적어도 헌법상 보장된 국민의 자유나 권리를 제한할 때에는 그 제한의 본질적인 사항에 관한 한 입법자가 법률로써 스스로 규율하여야 할 것이다.","주택 임대차와 관련한 임차인의 보호 및 주택의 이용에 관한 정책은 입법자가 정책적으로 결정하여야 할 사항으로 원칙적 으로 광범위한 입법형성의 자유가 인정되므로, 특단의 사정이 없는 한 구법상의 기대이익을 존중하여야 할 입법자의 의무가 있는 것은 아니라고 할 것이어서 신뢰보호원칙에 위배되는지 여부는 문제되지 않는다.",3,0,""],["2025-1","헌법",4,"국제법존중주의에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","‘유엔 시민적‧정치적 권리 규약 위원회’가 ｢국가보안법｣의 폐지나 개정을 권고하였다는 이유만으로 이적행위조항과 이적표현물 소지조항이 국제법존중주의에 위배되는 것은 아니다.","“세계인권선언”은 인권 및 기본적 자유의 보편적인 존중과 준수의 촉진을 위하여 모든 국민과 모든 나라가 달성하여야할 공통의 기준으로 선언하는 의미가 있으므로, 그 선언내용인 각 조항은 바로 보편적인 법적 구속력을 가지거나 국제법적 효력을 갖는다.","국제노동기구의 ‘결사의 자유위원회’나 국제연합의 ‘경제적‧ 사회적 및 문화적 권리위원회’ 및 경제협력개발기구(OECD)의 ‘노동조합자문위원회’가 우리나라에 대하여 가능한 한 빨리 모든 영역의 공무원들에게 노동3권을 보장할 것을 권고하고 있으므로, 이를 위헌심사 척도로 삼을 수 있다.","개인통보에 대한 ‘시민적 및 정치적 권리에 관한 국제규약’의 조약상 기구인 자유권규약위원회의 견해(Views)는 사법적인 판결이나 결정과 같은 법적 구속력이 인정된다고 볼 것이다.",0,0,""],["2025-1","헌법",5,"자기책임의 원리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","종업원 등이 저지른 행위의 결과에 대한 영업주 개인의 독자적인 책임에 관하여 전혀 규정하지 않은 채, 단순히 개인 영업주가 고용한 종업원 등이 업무에 관하여 범죄행위를 하였다는 이유 만으로 영업주 개인에 대하여 형벌을 과하는 것은, 아무런 비난 받을 만한 행위를 하지 않은 사람에 대해서까지 다른 사람의 범죄행위를 이유로 처벌하는 것으로서 책임주의원칙에 반한다.","법인의 종업원 등이 법인의 업무에 관하여 범죄행위를 하면 그 법인에게도 동일한 벌금형을 과하도록 규정한 구 ｢증권거래법｣ 조항은, 종업원 등이 저지른 행위의 결과에 대한 법인의 독자적인 책임에 관하여 전혀 규정하지 않은 채, 단순히 법인이 고용한 종업원 등이 업무에 관하여 범죄행위를 하였다는 이유만으로 법인에 대하여 형사처벌을 과하고 있어 책임주의원칙에 반한다.","‘자동차운전전문학원을 졸업하고 운전면허를 받은 사람 중 교통 사고를 일으킨 비율이 대통령령이 정하는 비율을 초과하는 때’에는 운전전문학원의 등록을 취소하거나 1년 이내의 운영정지를 명할 수 있도록 한 ｢도로교통법｣ 조항은, 운전전문학원의 귀책사유를 불문 하고 수료생이 일으킨 교통사고를 자동적으로 운전전문학원의 법적 책임으로 연관시키는 것으로, 운전전문학원이 주체적으로 행해야 하는 자기책임의 범위를 벗어난 것이다.","법인의 대표자가 법인의 업무에 관하여 일정한 범죄행위를 할 경우 그 법인도 함께 처벌하는 구 ｢외국환거래법｣상 양벌규정은 법인의 독자적인 책임에 관하여 전혀 규정하지 않은 채, 단순히 법인의 대표자가 업무에 관하여 범죄행위를 하였다는 이유만으로 법인에 대하여 형사처벌을 과하고 있어 책임주의원칙에 반한다.",3,0,""],["2025-1","헌법",6,"평등원칙에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","2000년 7월 1일 이전에 결정‧고시된 도시계획시설결정의 실효에 관한 기산일을 2000년 7월 1일로 정한 ｢국토의 계획 및 이용에 관한 법률｣ 부칙 해당 부분은 2000년 7월 1일 이후에 고시된 도시계획시설결정의 실효기간은 고시일로부터 20년인 데 비하여, 그 전에 고시된 도시계획시설결정의 실효기간은 고시일로부터 20년이 초과되는 결과를 가져오는데 이러한 차별에는 합리적인 이유가 없으므로 평등원칙에 반한다.","성폭력범죄를 저질러 벌금형이 확정된 체육지도자의 자격을 필요적으로 취소하도록 개정된 ｢국민체육진흥법｣ 조항을 개정법 시행 후 발생하는 자격취소사유부터 적용하도록 한 같은 법 부칙 제4조 중 해당 부분은 개정법 시행일을 기준으로 하여 성폭력범죄로 이미 벌금형이 확정된 체육지도자와 그렇지 않은 체육지도자를 합리적인 이유 없이 달리 취급하는 것이므로 평등 원칙에 위반된다.","｢사회보호법｣을 폐지하면서도 폐지법률 시행 이전에 이미 보호 감호 판결이 확정되어 있는 자에 대하여는 종전 ｢사회보호법｣에 따라 보호감호 처분이 집행되도록 하였고, 그때까지 판결이 확정 되지 않은 자에 대하여는 종전 ｢사회보호법｣이 적용되지 않도록 한 ｢사회보호법｣ 부칙 제2조는 합리적 근거가 있다 할 것이므로 평등 원칙에 반한다고 할 수 없다.","｢공유재산 및 물품 관리법｣ 제6조 제1항을 위반하여 행정재산을 사용하거나 수익한 자를 형사처벌하는 ｢공유재산 및 물품 관리법｣ 제99조는 사유재산을 점유한 자의 경우와 달리 형사적 제재를 가하는 것으로서 합리적 이유가 없으므로 평등원칙에 위배된다.",2,0,""],["2025-1","헌법",7,"죄형법정주의 명확성원칙에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 헌법재판소 판례에 의함) ㉠ 자산유동화계획에 의하지 아니하고 여유자금을 투자한 자를 처벌하는 ｢자산유동화에 관한 법률｣ 제40조 제2호 중 ‘제22조의 규정에 위반하여 자산유동화계획에 의하지 아니하고 여유자금을 투자한 자’ 부분은 죄형법정주의의 명확성원칙에 반하지 않는다. ㉡ 허위재무제표작성죄와 허위감사보고서작성죄에 대하여 배수 벌금을 규정하면서도, ‘그 위반행위로 얻은 이익 또는 회피한 손실액이 없거나 산정하기 곤란한 경우’에 관한 벌금 상한액을 규정하지 아니한 ｢주식회사 등의 외부감사에 관한 법률｣ 제39조 제1항 중 ‘그 위반행위로 얻은 이익 또는 회피한 손실액의 2배 이상 5배 이하의 벌금’에 관한 부분은 죄형법정주의의 명확성원칙에 위배된다. ㉢ 대통령령에서 정하여질 구체적인 소음 기준의 내용으로 규정한 ‘타인에게 심각한 피해를 주는 소음’의 의미가 명확하지 않으므로 ｢집회 및 시위에 관한 법률｣ 제14조 제1항은 죄형법정주의의 명확성원칙에 위배된다. ㉣ 당선되거나 되게 하거나 되지 못하게 할 목적으로 공연히 사실을 적시하여 후보자가 되고자 하는 자를 비방한 자를 처벌하는 ｢공직선거법｣ 제251조 중 ‘비방’ 부분은 죄형법정주의의 명확성 원칙에 위배된다.","1개","2개","3개","4개",0,0,""],["2025-1","헌법",8,"영장주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","헌법상 영장주의의 본질은 강제처분을 함에 있어 중립적인 법관이 구체적 판단을 거쳐야 한다는 점에 있는바, 수사기관이 전기통신 사업자에게 통신사실 확인자료 제공을 요청함에 있어 관할 지방 법원 또는 지원의 허가를 받도록 한 ｢통신비밀보호법｣상 조항은 헌법상 영장주의에 위배되지 아니한다.","수사기관 등이 전기통신사업자에게 이용자의 성명 등 통신자료의 제공을 요청할 수 있도록 규정한 ｢전기통신사업법｣상 조항은, 전기통신사업자에게 통신자료 제공요청에 응하거나 협조하여야 할 의무를 부과하지 않으며, 달리 전기통신사업자의 통신자료 제공을 강제할 수 있는 수단을 마련하고 있지 아니하여 임의수사에 해당하고, 이를 통한 수사기관 등의 통신자료 취득에는 영장주의가 적용되지 아니한다.","헌법 제16조 후문은 영장주의에 대한 예외를 명문화하고 있지 않지만, 헌법 제16조의 영장주의에 대해서도 그 예외를 인정 하되, 그 장소에 범죄혐의 등을 입증할 자료나 피의자가 존재할 개연성이 소명되고, 사전에 영장을 발부받기 어려운 긴급한 사정이 있는 경우에만 제한적으로 허용될 수 있다고 보는 것이 타당하다.","각급선거관리위원회 위원‧직원의 선거범죄 조사에 있어서 피조사자에게 자료제출의무를 부과하고, 허위자료를 제출하는 경우 형사처벌하는 구 ｢공직선거법｣ 조항에 의한 자료제출요구는 그 성질상 물리적 강제력을 수반하는 강제처분이므로 영장주의가 적용된다.",3,0,""],["2025-1","헌법",9,"거주‧이전의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","지방자치단체의 장 선거에서 선거일 현재 계속하여 90일 이상 당해 지방자치단체의 관할구역 안에 주민등록이 되어 있을 것을 입후보의 요건으로 하는 ｢공직선거및선거부정방지법｣ 조항은, 입후보자가 그 체류지와 거주지의 자유로운 결정과 선택에 사실상 제약을 받게 되므로 입후보자의 거주‧이전의 자유를 침해한다.","거주지를 기준으로 중‧고등학교 입학을 제한하는 ｢교육법시행령｣ 조항은, 학부모가 원하는 경우 언제든지 자유로이 거주지를 이전할 수 있으므로 그와 같은 생활상의 불이익만으로는 거주 이전의 자유를 제한한다고는 할 수 없고, 설혹 거주이전의 자유를 다소 제한한다고 하더라도 거주이전의 자유를 침해하는 것이 라고는 할 수 없다.","헌법 제14조의 거주‧이전의 자유는 대한민국 영토 안에서 국가의 간섭이나 방해를 받지 않고 생활의 근거지와 거주지를 임의로 선택할 수 있는 자유를 뜻하는 것이지, 자신이 소속된 국적을 버리거나 변경할 자유, 즉 국적이탈의 자유가 포함되는 것은 아니다.","복수국적자에 대하여 병역준비역에 편입된 때부터 3개월 이내에 대한민국 국적을 이탈하지 않으면 병역의무를 해소한 후에야 이를 가능하도록 한 ｢국적법｣ 조항은 과잉금지원칙에 위배되지 않아 국적이탈의 자유를 침해하지 않는다.",1,0,""],["2025-1","헌법",10,"사생활의 비밀과 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","헌법 제17조가 보호하고자 하는 기본권은 ‘사생활영역’의 자유 로운 형성과 비밀유지라고 할 것이며, 공적인 영역의 활동이라 하더라도 사생활의 비밀과 자유의 보호대상에 포함된다.","공직자의 공무집행과 직접적인 관련이 없는 개인적인 사생활에 관한 사실이라면 공적인 관심 사안에 해당할 수 없고, 비록 공직자의 자질‧도덕성‧청렴성에 관한 사실이라도 그 내용이 개인적인 사생활에 관한 것이라면 사생활의 영역에 있는 것이므로, 이러한 사실은 공직자 등의 사회적 활동에 대한 비판 내지 평가의 한 자료가 될 수 없다.","자신의 인격권이나 명예권을 보호하기 위하여 대외적으로 해명을 하는 행위는 표현의 자유에 속하는 영역일 뿐 이미 사생활의 자유에 의하여 보호되는 범주를 벗어난 행위이므로, 그 행위가 선거에 영향을 미치게 하기 위한 것이라는 이유로 이를 하지 못하게 된다 하더라도 사생활의 자유를 침해하지 아니한다.","4급 이상 공무원들의 병역 면제사유인 질병명을 관보와 인터넷을 통해 공개하도록 하는 법률조항은 병무행정에 관한 비리근절과 병역부담평등에 대한 사회적 요구를 반영한 것으로서, 신고 의무자인 공무원의 사생활의 비밀을 침해하는 것은 아니다.",2,0,""],["2025-1","헌법",11,"통신의 비밀과 자유에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 헌법재판소 판례에 의함) ㉠ 방송통신심의위원회가 2019. 2. 11. 주식회사 ○○ 외 9개 정보통신서비스제공자 등에 대하여 895개 웹사이트에 대한 접속차단의 시정을 요구한 행위는, 그 차단 과정에서 정보통신 서비스이용자들이 접속하고자 하는 웹사이트를 알 수 있는 SNI 등의 접속정보가 정보통신서비스제공자에게 공개되어, 정보통신서비스이용자들의 통신의 비밀과 자유를 제한한다. ㉡ 자기또는다른사람의성적욕망을유발하거나만족시킬목적으로 통신매체를 통하여 성적 수치심이나 혐오감을 일으키는 말 등을 상대방에게도달하게한사람을처벌하는｢성폭력범죄의처벌등에 관한 특례법｣ 제13조는 통신의 상대방에 대하여 통신매체를 이용한 음란표현행위를 하는 것을 금지하는 것이므로 통신의 자유를 제한한다. ㉢ ｢전기통신사업법｣ 제30조 본문 중 ‘누구든지 전기통신사업자 가운데 이동통신사업자가 제공하는 전기통신역무를 타인의 통신용으로 제공하여서는 아니 된다’ 부분이 통신수단을 자유로이 이용하여 타인과 의사소통하려는 이동통신서비스 이용자의 권리나 통신수단에 의하여 이루어지는 이용자와 타인 간의 의사소통과정의 비밀을 제한한다거나 이용자의 발언내용을 제한한다고 보기 어렵다. ㉣ ‘패킷감청’의 방식으로 이루어지는 인터넷회선 감청은 현대 사회에 가장 널리 이용되는 의사소통 수단인 인터넷 통신망을 통해 송‧수신하는 전기통신에 대한 감청을 범죄수사를 위한 통신제한조치의 하나로 정하고 있으므로, 일차적으로 헌법 제18조가 보장하는 통신의 비밀과 자유를 제한한다. ㉤ 온라인서비스제공자가 자신이 관리하는 정보통신망에서 아동‧청소년이용음란물을 발견하기 위하여 대통령령으로 정하는 조치를 취하지 아니하거나 발견된 아동‧청소년이용 음란물을 즉시 삭제하고, 전송을 방지 또는 중단하는 기술적인 조치를 취하지 아니한 경우 처벌하는 ｢아동‧청소년의 성보호에 관한법률｣ 제17조제1항은서비스이용자의통신의비밀을침해한다.","1개","2개","3개","4개",1,0,""],["2025-1","헌법",12,"양심의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","대체복무요원의 복무기간을 ‘36개월’로 정한 ｢대체역의 편입 및 복무 등에 관한 법률｣ 조항은, 대체복무요원의 복무강도가 통상의 현역병과 큰 차이가 나지 않도록 정해졌음에도 대체복무기간을 육군 현역병의 실제 복무기간인 18개월의 2배로 정한 것으로 과잉 금지원칙을 위반하여 대체복무요원의 양심의 자유를 침해한다.","현상황에서순수민간단체가주관하는사회봉사를수행하고자하는자를 위한 적절한 대체복무제도를 통해 병역자원을 효율적으로관리하고 병역의무의형평성을유지하는것이가능하므로, 이러한 제도를 대체 복무의 형태로 인정하지 아니한 입법자의 판단은 수긍할 수 없다.","이적표현물의 소지‧취득행위만으로도 그 표현물의 이적내용이 전파될 가능성을 배제하기 어려우며, 최근 늘어나고 있는 전자 매체 형식의 표현물들은 실시간으로 다수에게 반포가 가능하고, 이적표현물이 소지‧취득한 사람의 의사와 무관하게 전파, 유통될 가능성도 배제할 수 없으므로, 이적행위를 할 목적으로 문서, 도화 기타의 표현물을 제작‧소지‧반포‧취득한 자를 처벌하는 ｢국가보안법｣ 조항은 과잉금지원칙에 위배되어 양심의 자유를 침해하지 않는다.","서면사과를강제하지않고도얼마든지학교폭력가해학생을교정할수 있는 방법이 있으므로, 가해학생에게 서면사과를 하도록 규정한 구 ｢학교폭력예방 및 대책에 관한 법률｣ 조항은 가해학생의 양심의 자유와 인격권을 침해한다.",2,0,""],["2025-1","헌법",13,"집회의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","감염병을예방하기위하여집회를제한하거나금지하는 구 ｢감염병의 예방 및 관리에 관한 법률｣ 제49조 제1항 제2호의 규율 대상은 일정한내용과 형식을 갖춘 ‘행사자체’로서 ‘여러 사람의 집합’이므로, 동 조항에 의하여 집회의 내용 자체가 제한된다.","집회또는시위를하기위하여인천애(愛)뜰중잔디마당과그경계내 부지에대한사용허가신청을한경우인천광역시장이이를허가할수 없도록 제한하는 ｢인천애(愛)뜰의 사용 및 관리에 관한 조례｣ 조항은 잔디마당에서 집회 또는 시위를 하려고 하는 경우 시장이 그 사용허가를 할 수 없도록 전면적‧일률적으로 불허하고, ‘예외적 허용’의 가능성을 열어 두고 있지 않아, 헌법 제21조 제2항에서 금지하는 허가제를 규정하였다고 보기 어렵다.","근로자의날을관공서의공휴일에포함시키지않은｢관공서의공휴일에 관한 규정｣ 제2조 본문은, 근로자의 날에 출근을 하게 되어 다른 근로자들과 의사교환을 하고 기념행사 및 집회에 참석하는등집단적 소통의기회를갖지못하게하므로, 공무원의집회의 자유를 침해한다.","누구든지선거기간중선거에영향을미치게하기위하여그밖의집회나 모임을 개최할 수 없도록 하는 ｢공직선거법｣ 제103조 제3항은, 선거 기간에 예외적으로 집회를 허용하는 것이 불가능하므로, 과잉금지 원칙에 반하지 않아 일반 유권자의 집회의 자유를 침해하지 않는다.",1,0,""],["2025-1","헌법",14,"재판청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","기피신청에 대한 결정이 확정되기 전에 기피신청을 당한 법관으로 하여금 소송절차를 정지하지 않고 종국판결을 선고할 수 있도록 하는 ｢민사소송법｣ 제48조 단서 중 ‘종국판결을 선고하거나’에 관한 부분은 공정한 재판을 받을 권리를 침해하지 않는다.","전자문서 등재사실을 통지한 날부터 1주 이내에 확인하지 아니 하는 때에는 통지한 날부터 1주가 지난 날에 송달된 것으로 보는 ｢민사소송 등에서의 전자문서 이용 등에 관한 법률｣ 제11조 제4항 단서는 재판청구권을 침해한 것이라 할 수 없다.","검사의 불기소처분에 대한 항고권자를 고소인‧고발인으로 한정한 ｢검찰청법｣ 제10조 제1항 전문은 고소하지 않은 범죄피해자가 검찰항고를 하지 못하게 하므로 재판청구권을 제한한다.","피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 다른 종류의 형을 선고하지 못하도록 하는 ｢형사소송법｣ 제457조의2 제1항은 공정한 재판을 받을 권리를 침해하지 아니한다.",2,0,""],["2025-1","헌법",15,"재산권보장에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","골프장 입장행위에 대하여 1명 1회 입장마다 1만 2천 원의 개별 소비세를 골프장 경영자에게 부과하는 ｢개별소비세법｣ 해당 조항은 과잉금지원칙에 반하여 재산권을 침해한다고 볼 수 없다.","임대사업자가 종전 규정에 의한 세제혜택에 대한 기대를 가졌거나, 종전과 같은 유형의 임대사업자의 지위를 장래에도 유지할 것을 기대하였다 하더라도 이는 단순한 기대이익에 불과하므로, 장기 일반민간임대주택 중 아파트를 임대하는 민간매입임대주택과 단기 민간임대주택의 임대의무기간이 종료한 날 그 등록이 말소되도록 하는 ｢민간임대주택에 관한 특별법｣ 해당 조항으로 인해 재산권이 제한된다고 볼 수는 없다.","의료급여기관이 ｢의료법｣ 제33조 제2항을 위반하였다는 사실을 수사기관의 수사 결과로 확인한 경우 시장‧군수‧구청장으로 하여금 해당 의료급여기관이 청구한 의료급여비용의 지급을 보류할 수 있도록 규정한 ｢의료급여법｣ 해당 조항 중 ‘의료법 제33조 제2항’에 관한 부분은 의료기관을 개설하여 의료급여기관으로 운영하는 의료기관 개설자의 재산권을 제한한다.","대지사용권을 가지지 아니한 구분소유자가 있을 때 그 전유부분의 철거청구권자에게 구분소유권의 매도청구권을 부여한 ｢집합건물의 소유및관리에관한법률｣ 제7조는구분소유자의재산권을침해한다.",3,0,""],["2025-1","헌법",16,"공무담임권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","｢군인사법｣ 제10조 제2항 제6호의4 나목 중 ｢아동복지법｣ 제17조 제2호 가운데 ‘아동에게 성적 수치심을 주는 성희롱 등의 성적 학대 행위로 형을 선고받아 그 형이 확정된 사람은 부사관으로 임용될 수 없도록 한 것’에 관한 부분은 공무담임권을 침해하지 않는다.","과거 3년 이내의 당원 경력을 법관 임용 결격사유로 정한 ｢법원 조직법｣ 제43조 제1항 제5호 중 ‘당원의 신분을 상실한 날부터 3년이 경과되지 아니한 사람’에 관한 부분은 과잉금지원칙에 반하여 공무담임권을 침해한다.","교육부 및 그 소속기관에서 근무하는 교육연구사 선발에 수석 교사가 응시할 수 없도록 응시 자격을 제한한 교육부장관의 ‘2017년도 교육전문직 선발 계획 공고’와 ‘2017년도 교육부 및 소속기관근무교육전문직선발계획’은공무담임권을침해하지않는다.","관련 자격증 소지자에게 관세직 국가공무원 공개경쟁채용시험에서 일정한가산점을부여하는구｢공무원임용시험령｣ 제31조제2항에따른 별표11 가운데1. 행정직군및기술직군의직급별가산비율중6‧7급의 변호사, 공인회계사, 관세사에 대한 가산비율 5% 부분 및 별표 12 가운데 관세직렬에 관한 부분은 공무담임권을 침해하지 아니한다.",0,0,""],["2025-1","헌법",17,"교육을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","한국대학교육협의회가 2018. 8. 30. 공표한 ‘2021학년도 대학입학 전형기본사항’ Ⅱ. 3. 다. (6) 재외국민과 외국인 특별전형 중 ‘지원자격에 따른 부모 및 학생의 세부 지원자격’ 가운데 ‘해외근무자의 배우자의 체류’에 관한 부분은 신뢰보호원칙에 반하여 학생인 청구인의 균등하게 교육받을 권리를 침해한다.","서울대학교 2023학년도 저소득학생 특별전형의 모집인원을 모두 수능위주전형으로 선발하도록 정한, ‘서울대학교 2023학년도 대학 신입학생 입학전형 시행계획’ 중 ‘2023학년도 모집단위와 모집인원’ 가운데 해당 부분은 저소득학생 특별전형에 응시하고자 하는 수험생들의 균등하게 교육을 받을 권리를 침해하지 않는다.","고등학교 퇴학일부터 검정고시 공고일까지의 기간이 6개월 이상이 되지 않은 사람은 고졸검정고시에 응시할 수 없도록 규정한 ｢초‧중등교육법 시행규칙｣ 제35조 제6항 제2호 본문 중 ‘고등학교’에 관한 부분은 고등학교를 자진퇴학한 청구인들의 교육을 받을 권리를 침해한다고 볼 수 없다.","학교는 헌법 제31조 제1항, 제2항에서 규정하고 있는 모든 국민의 교육을 받을 권리와 아동에게 의무교육을 받게 할 의무라는 중대한 가치를 실현하고 도시 및 주거환경의 수준 및 국민의 삶의 질을 향상시키기 위한 필수적인 기반시설로서, 국가는 국민의 교육을받을권리라는기본권을보호하기위하여학교교지를적절하게 확보하여야 할 의무가 있다.",0,0,""],["2025-1","헌법",18,"근로의 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","최저임금 산입을 위하여 임금지급 주기에 관한 취업규칙을 변경하는 경우 노동조합 또는 근로자 과반수의 동의를 받을 필요 없도록 규정한 ｢최저임금법｣ 제6조의2 중 ‘제6조 제4항 제2호 및 제3호 나목에 따라 산입되는 임금’에 관한 부분은 노동조합 및 근로자의 단체교섭권을 침해한다고 볼 수 없다.","헌법상 근로의 권리에, 열악한 근로환경을 갖춘 사업장을 이탈하여 다른 사업장으로 이직함으로써 사적(私的)으로 근로환경을 개선 하거나 해결하는 방법을 보장하는 것도 포함된다고 할 것이므로, 외국인근로자의 사업장 변경 횟수를 제한하는 ｢외국인근로자의 고용 등에 관한 법률｣ 제25조 제4항은 근로의 권리를 제한한다.","근로조건의 보장은 기본적으로 근로자의 생활보장 및 인간의 존엄성을 보장해주는 기초적인 근로의 권리의 내용이지만, 이는 일방적으로 근로자를 두텁게 보호하는 것만으로 달성되는 것이 아니라, 사용자의 효율적인 기업경영 및 기업의 생산성이라는 측면과 조화를 이룰 때 달성이 가능하고, 이것이 헌법 제32조 제3항이 근로조건의 기준을 법률로 정하도록 한 취지이다.","근로자4명이하사용사업장에적용될｢근로기준법｣ 조항을정하고있는 ｢근로기준법시행령｣ 제7조, 구｢근로기준법시행령｣ [별표1]이 부당 해고제한조항과 노동위원회 구제절차를 4인 이하 사업장에 적용되는 조항으로 나열하지 않은 것은 근로의 권리를 침해하지 아니한다.",1,0,""],["2025-1","헌법",19,"인간다운 생활을 할 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","공영방송은 사회‧문화‧경제적 약자나 소외계층이 마땅히 누려야 할 문화에 대한 접근기회를 보장하여 인간다운 생활을 할 권리를 실현하는기능을수행하므로우리헌법상그존립가치와책무가크다.","재요양을 받는 경우에 재요양 당시의 임금을 기준으로 휴업급여를 산정하도록 한 구 ｢산업재해보상보험법｣ 제56조 제1항과 재요양 당시 임금이 없으면 최저임금액을 기준으로 휴업급여를 지급 하도록 한 ｢산업재해보상보험법｣ 제56조 제2항은 근로자의 인간다운 생활을 할 권리를 침해한다.","자동차사고 피해가족 중 유자녀에 대한 대출을 규정한 구 ｢자동차 손해배상 보장법 시행령｣ 제18조 제1항 제2호 중 ‘유자녀의 경우에는 생계유지 및 학업을 위한 자금의 대출’ 부분은 유자녀가 자신에 대한 양육비용을 국가에게 상환할 채무를 부담하기로 약속하고 자금을 지원받는 것이므로 유자녀의 아동으로서의 인간다운 생활을 할 권리를 침해하지 않는다.","공무원에게 재해보상을 위하여 실시되는 급여의 종류로 휴업급여 또는 상병보상연금 규정을 두고 있지 않은 ｢공무원 재해보상법｣ 제8조는 공무원의 인간다운 생활을 할 권리를 침해하지 않는다.",1,0,""],["2025-1","헌법",20,"환경권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","LPG를 연료로 사용할 수 있는 자동차 또는 그 사용자의 범위를 제한하고 있는 ｢액화석유가스의 안전관리 및 사업법 시행규칙｣ 제40조는 LPG를 운송연료로 사용할 수 있는 자동차 또는 그 사용자의 범위를 제한하는 규정일 뿐이므로 청구인들의 환경권을 제한한다고 볼 수 없다.","일상생활에서 접하게 되는 토양에서 유해중금속 등의 화학물질을 제거‧방지하여 건강한 환경에서 생활할 권리는 환경권의 한 내용을 구성한다.","｢동물보호법｣, ｢장사 등에 관한 법률｣, ‘동물장묘업의 시설설치 및 검사기준’ 등 관계규정에서 동물장묘시설의 설치제한 지역을 상세하게 규정하고, 매연, 소음, 분진, 악취 등 오염원 배출을 규제하기위한 상세한 시설 및 검사기준을 두고 있는 등의 사정을 고려할 때, 구 ｢동물보호법｣ 해당 조항이 동물장묘업 등록에 관하여 ｢장사 등에 관한 법률｣ 제17조 외에 다른 지역적 제한사유를 규정하지 않 았다는 사정만으로 해당 지역에 거주하는 청구인들의 환경권을 침해한다고 볼 수는 없다.","｢기후위기 대응을 위한 탄소중립‧녹색성장 기본법 시행령｣ 제3조 제1항은 같은 법 제8조 제1항의 위임을 받아 2030년 중장기 감축목표의 구체적인 비율의 수치를 정한 것으로서, 과소보호 금지원칙에 반하여 기본권 보호의무를 위반하였으므로 청구인들의 환경권을 침해하였다.",3,0,""],["2025-1","형사법",1,"죄형법정주의에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정 하더라도 피고인에게 불리한 법률을 소급하여 적용한 것으로 볼 수는 없다.","형벌법규는 문언에 따라 엄격하게 해석‧적용하여야 하므로, 형벌법규의 해석에 있어서 가능한 문언의 의미 내에서 당해 규정의 입법 취지와 목적 등을 고려한 법률체계적 연관성에 따라 그 문언의 논리적 의미를 분명히 밝히는 체계적‧논리적 해석방법은 유추해석에 해당하여 허용되지 않는다.","소추조건에 관한 규정을 유추적용하여 행위자의 가벌성의 범위가 확대되었다고 하더라도, 이는 범죄의 성립요건에 관한 내용이 아니므로 유추해석금지의 원칙에 위반된다고 할 수 없다.","죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상 으로 삼는 경우, 신설된 포괄일죄에 해당하는 행위가 그 법의 시행 이전과 이후에 걸쳐서 이루어졌다면 시행 이전의 행위에 대하여도 신설된 법규를 적용하여 처벌할 수 있다.",0,0,""],["2025-1","형사법",2,"형법의 적용범위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 않게 된 경우, 입법자가 법률의 변경 이후에도 종전 법률 위반행위에 대한 형사 처벌을 유지한다는 내용의 경과규정을 따로 두더라도 ｢형법｣ 제1조 제2항이 적용된다.","우리나라 사람이 외국에서 도박을 한 경우, ｢형법｣ 제3조는 형법의 적용 범위에 관한 속인주의를 규정하고 있으므로 도박죄를 처벌하지 않는 외국 카지노에서의 도박이라는 사정만으로 그 위법성이 조각된다고 할 수 없다.","｢형법｣ 제7조의 ‘외국에서 형의 전부 또는 일부가 집행된 사람’ 에는 ‘외국 법원의 유죄판결에 의하여 벌금형의 전부 또는 일부가 실제로 집행된 사람’이 포함된다.","해당 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경되어 ｢형법｣ 제1조 제2항의 적용여부가 문제된 경우, 해당 형벌법규에 따른 범죄 성립의 요건과 구조, 형벌법규와 변경된 법령과의 관계, 법령 변경의 내용‧경위‧ 보호목적‧입법 취지 등을 종합적으로 고려하여, 법령의 변경이 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접적으로 관련된 형사법적 관점의 변화를 주된 근거로 한다고 해석할 수 있을 때 ｢형법｣ 제1조 제2항을 적용할 수 있다.",0,0,""],["2025-1","형사법",3,"법인의 범죄능력과 양벌규정에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제8조 본문은 “본법 총칙은 타법령에 정한 죄에 적용한다”고 규정하고 있으므로, ｢형법｣에 법인에 대한 별도의 처벌규정이 없는 한, 개별 법령의 양벌규정을 근거로 법인을 처벌할 수는 없다.","지방자치단체 소속 공무원이 지방자치단체 고유의 자치사무를 수행하던 중 범죄를 저지르고 해당 범죄에 대하여 그 행위자를 벌하는 외에 법인을 처벌하는 양벌규정이 있는 경우, 지방자치 단체는 양벌규정의 적용대상이 되는 법인에 해당한다.","회사합병이 있는 경우 피합병회사의 권리‧의무는 사법상의 관계나 공법상의 관계를 불문하고 모두 합병으로 인하여 존속하는 회사에 승계되는 것이 원칙이므로, 합병으로 인하여 소멸한 법인이 그 종업원 등의 위법행위에 대해 양벌규정에 따라 부담하던 형사 책임은 합병으로 인하여 존속하는 법인에 승계된다.","배임죄에 있어서 타인의 사무를 처리할 의무의 주체가 법인이 되는 경우, 법인은 배임죄의 주체가 될 수 있다.",1,0,""],["2025-1","형사법",4,"구성요건적 착오에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 친구 A를 친구 B로 착각하고 B에 대한 살해의 고의로 A를칼로찔러살해한경우, 甲의행위는A에대한살인죄를구성한다.","甲이 친구 A를 살해할 의사로 A의 음료에 독을 투입해 놓아 두었는데 이를 모르는 A의 딸 B가 이를 마시게 되어 사망한 경우, 甲의 행위는 B에 대한 살인죄를 구성한다.","甲이 친구 A를 살해하려고 하였으나 자신의 아버지 B를 A로 착각하여 살해한 경우, 甲의 행위는 존속살해죄를 구성한다.","甲은 친구 A를 살해할 의도로 A의 머리를 쇠파이프로 가격하여 정신을 잃게 하였는데, A가 죽은 것으로 오인한 甲이 증거를 인멸할 목적으로 A를 바다로 던졌고 이로 인해 A가 익사한 경우, 甲의 일련의 행위는 A에 대한 살인죄를 구성한다.",2,0,""],["2025-1","형사법",5,"과실범과 결과적 가중범에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 甲이 A의 얼굴을 주먹으로 수회 때리는 등 무차별적으로 폭행 하여 상해를 가하자 A가 甲의 계속된 폭행을 피하려고 도로를 건너 도주하다가 차량에 치여 사망한 경우, 甲의 위 상해행위와 A의 사망 사이에는 상당인과관계가 인정되지 않는다. ㉡ 수련병원의 전문의 甲과 전공의 乙이 수직적 분업관계에 있는 경우, 乙에게 전적으로 위임된 것이 아닌 이상 甲은 자신이 주로 담당하는 환자에 대하여 乙이 하는 의료행위의 내용이 적절한 것인지 여부를 확인하고 감독하여야 할 업무상 주의의무가 있고, 만약 이와 같은 업무상 주의의무를 소홀히 하여 환자에게 위해가 발생하였다면 甲은 그에 대한 과실 책임을 면할 수 없다. ㉢ 의사 甲이 할로테인을 사용한 전신마취에 의하여 난소종양 절제수술을 함에 앞서 혈청의 생화학적 반응에 의한 간기능 검사로 환자의 간 상태를 정확히 파악하지 아니한 채 개복 수술을 시행하여 환자 A가 급성전격성간염으로 인하여 사망한 경우, 혈청에 의한 간기능검사를 시행하지 않은 甲의 과실과 A의 사망 간에 인과관계가 있다고 하려면 甲이 수술 전에 A에 대한 간기능검사를 하였더라면 A가 사망하지 않았을 것임이 입증되어야 한다. ㉣ 골프경기의 경기보조원은 그 업무의 내용상 골프채의 운반‧ 이동‧취급 및 경기에 관한 조언 등으로 골프경기 참가자를 돕는 역할을 수행하는 데 그치는 것이지, 경기 진행 도중 경기 참가자의 행동으로 다른 사람에게 상해의 결과가 발생할 위험성을 고려하여 사고의 위험을 미연에 방지해야 할 업무상 주의의무까지 부담하는 것은 아니다.","㉠㉡","㉠㉣","㉡㉢","㉢㉣",2,0,""],["2025-1","형사법",6,"부작위범에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","부작위에 의한 방조는 있을 수 있지만, 부작위범 사이의 공동 정범은 있을 수 없다.","부진정 부작위범의 경우 작위의무는 법령, 법률행위, 선행행위로 부터 도출되며, 신의성실의 원칙이나 사회상규 혹은 조리로부터 작위의무가 도출될 수는 없다.","타인과의 신뢰관계에서 일정한 임무에 따라 사무를 처리할 법적 의무가 있는 자가 그 상황에서 당연히 할 것이 법적으로 요구 되는 행위를 하지 않은 경우, 업무상배임의 실행의 착수를 인정 하기 위해서는 그러한 부작위 자체가 존재하는 것으로 족하고 구성요건적 결과 발생의 위험이 구체화한 상황에서의 부작위가 있을 것까지는 요하지 않는다.","형법이 금지하고 있는 법익침해의 결과발생을 방지할 법적인 작위의무를 지고 있는 자가 그 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음에도 불구하고 그 결과의 발생을 용인하고 이를 방관한 채 그 의무를 이행하지 않은 경우, 그 부작위가 작위에 의한 법익침해와 동등한 형법적 가치가 있는 것이어서 그 범죄의 실행행위로 평가될 만한 것이라면, 작위에 의한 실행 행위와 동일하게 부작위범으로 처벌할 수 있다.",3,0,""],["2025-1","형사법",7,"위법성 조각사유에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 어떠한 행위가 ｢형법｣ 제20조의 ‘사회상규에 위배되지 아니 하는 행위’인지를 평가함에 있어 ‘목적의 정당성’과 ‘수단의 상당성’ 요건은 행위의 측면에서 사회상규의 판단 기준이 되고 보호이익과 침해이익 사이의 법익균형은 결과의 측면에서 이를 판단하기 위한 기준이 되지만, 행위의 긴급성과 보충성은 수단의상당성을판단할때고려요소의하나가될뿐 그 자체로서 독립적인 요건이 되는 것은 아니다. ㉡ 甲은 자신의 토지에 인접하여 있는 A 소유의 상가건물에 ｢건축법｣상 위법요소가 존재함에도 A가 그와 같은 위법요소를 방치 내지 조장하고 있을 뿐만 아니라 해당 건물의 건축허가에 관한 관할관청의 행정행위에 하자가 존재한다는 이유로, 상가의 통행로로 이용되고 있는 자신의 토지에 철주와 철망을 설치하고 포장된 아스팔트를 걷어냄으로써 통행로로 이용하지 못하게 하였는데, 이는 자신의 소유권을 방해하는 사람들에 대한 방해배제의 청구권을 보전하기 위한 자구행위로 볼 수 있다. ㉢ A가 뒤에서 甲을 칼로 찌르려고 하던 찰나에 그 사실을 모르던 甲이 계속 따라오는 A에게 짜증이 나 상해의 고의로 A를 주먹 으로 가격하여 상해를 가한 경우, 위법성 조각사유를 인정함에 있어 주관적 정당화요소가 필요하다는 견해에 따르면 甲에게는 방위의사가 없어 결과불법은 인정되지만 행위불법이 결여되어 상해죄의 불능미수가 된다고 본다. ㉣ 침해행위가 일단 기수에 이른 때에는 자기 또는 타인의 법익에 대한 침해상황이 아직 종료되지 않았다고 하더라도 정당방위 에서의 ‘침해의 현재성’을 인정할 수 없다.","㉠(O) ㉡(O) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(X) ㉢(X) ㉣(X)","㉠(X) ㉡(O) ㉢(O) ㉣(O)",2,0,""],["2025-1","형사법",8,"착오와 기대가능성에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제16조의 ‘정당한 이유’가 있는지 여부는 행위자에게 자기 행위의 위법의 가능성에 대해 심사숙고하거나 조회할 수 있는 계기가 있어 자신의 지적 능력을 다하여 이를 회피하기 위한 진지한 노력을 다하였더라면 스스로의 행위에 대하여 위법성을 인식할 수 있는 가능성이 있었음에도 이를 다하지 못한 결과 자기 행위의 위법성을 인식하지 못한 것인지 여부에 따라 판단하여야 하고, 이러한 위법성의 인식에 필요한 노력의 정도를 행위자 개인의 인식능력이나 행위자가 속한 사회집단에 따라 달리 평가하여서는 안 된다.","자신의 강도상해 범행을 일관되게 부인하였으나 유죄판결이 확정된 피고인이 별건으로 기소된 공범의 형사사건에서 유죄가 확정된 자신의 범행사실을 부인하는 증언을 한 경우, 피고인 에게 사실대로 진술할 기대가능성이 없으므로 위증죄는 성립 하지 않는다.","법률 위반행위 중간에 일시적으로 판례에 따라 그 행위가 처벌 대상이 되지 않는 것으로 해석된 적이 있었다면, 자신의 행위가 처벌되지 않는 것으로 믿은 데에 정당한 이유가 있다고 할 수 있다.","甲이 경찰관 A의 직무집행에 저항하기 위하여 A를 폭행한다는 사실 자체는 인식하였지만 법적 평가를 잘못하여 A의 적법한 직무집행이 위법하다고 오인한 경우, 甲에게 위법성 조각사유의 전제사실에 대한 착오가 있었다고 볼 수는 없다.",3,0,""],["2025-1","형사법",9,"미수범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","준강간의 고의로 실행에 착수하였는데 피해자가 실제 항거불능 상태에 있지 않아 구성요건적 결과 발생이 처음부터 불가능 하였으나, 그러한 결과 발생의 위험성이 인정되는 경우, 이러한 행위는 준강간죄의 불능미수에 해당한다.","甲이 A에게 위조한 예금통장 사본 등을 보여주면서 외국회사에서 투자금을 받았다고 거짓말하며 자금 대여를 요청하였으나, A와 함께 그 입금 여부를 확인하기 위해 은행에 가던 중 범행이 발각될 것이 두려워 은행 입구에서 차용을 포기하고 돌아간 경우, 이를 자의에 의한 사기죄의 중지미수로 볼 수는 없다.","불능범과 구별되는 불능미수의 성립요건인 ‘위험성’은 행위자가 행위 당시에 인식한 사정을 놓고 일반인이 객관적으로 판단하여 결과 발생의 가능성이 있는지 여부를 따져야 한다.","｢형법｣ 제27조에서 규정하고 있는 불능미수는 실행의 수단이나 대상의 착오로 처음부터 구성요건이 충족될 가능성이 없는 경우 이므로, 실행의 착수로 볼 수 있는 행위가 있어야 하는 것은 아니다.",3,0,""],["2025-1","형사법",10,"공동정범에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제30조에서 정한 ‘2인 이상이 공동하여 죄를 범한 때’ 에는 고의범만 포함되고, 과실범은 포함되지 않는다.","자기 자신을 무고하기로 제3자와 공모하고 이에 따라 무고행위에 가담한 경우, 자기 자신에게는 무고죄의 구성요건에 해당하지 않아 범죄가 성립할 수 없는 행위를 실현한 것일지라도 무고죄의 공동정범이 성립한다.","공모자 중 구성요건행위를 직접 분담하여 실행하지 아니한 사람도 공동가공의 의사와 그 공동의사에 의한 기능적 행위지배를 통한 범죄실행이라는 주관적‧객관적 요건을 충족한다면 공모공동정범 으로서의 죄책을 지므로, 배임증재의 공모공동정범이 다른 공모 공동정범에 의하여 수재자에게 재물 또는 재산상 이익이 제공되는 방법을 구체적으로 몰랐다고 하더라도 공모관계를 부정할 수 없다.","업무상 배임죄의 실행으로 인하여 이익을 얻게 되는 수익자 또는 그와 밀접한 관련이 있는 제3자를 배임의 실행행위자에 대한 공동정범으로 인정하기 위하여는, 실행행위자의 행위가 피해자 본인에 대한 배임행위에 해당한다는 점을 인식하는 것으로 족하고, 실행행위자의 배임행위를 교사하거나 또는 배임행위의 전 과정에 관여하는 등으로 배임행위에 적극 가담할 것을 필요로 하지 않는다.",2,0,""],["2025-1","형사법",11,"교사범과 방조범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공범독립성설에 따르면 교사행위에 대하여 피교사자가 범죄의 실행을 승낙하였지만 실행행위에 나아가지 아니한 경우, 교사자의 미수범 성립을 부정한다.","정범의 실행행위가 구성요건에 해당하고 위법‧유책한 경우에 공범이 성립될 수 있다고 보는 극단적 종속형식에 따르면 책임 무능력자의 위법행위를 교사‧방조한 경우에는 교사범이나 방조범이 성립될 수 없다.","교사행위에 의하여 피교사자가 범죄 실행을 결의하게 된 이상 피교사자에게 다른 원인이 있어 범죄를 실행한 경우에도 교사범의 성립에는 영향이 없다.","방조범은 정범의 실행행위 중에 이를 방조하는 경우뿐만 아니라, 실행 착수 전에 장래의 실행행위를 예상하고 이를 용이하게 하는 행위를하여그정범이실행행위로나아간경우에도성립할수있다.",0,0,""],["2025-1","형사법",12,"죄수론에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 된 경우, 그 폭행행위는 불가벌적 수반행위에 해당하므로 업무방해죄에 대하여 흡수관계에 있다.","사기범행에 이용되리라는 사정을 알고서도 자신 명의 계좌의 접근매체를 양도함으로써 사기범행을 방조한 종범이 사기이용 계좌로 송금된 피해자의 돈을 임의로 인출한 경우, 사기방조죄와 별도로 횡령죄에 해당한다.","부동산 관리를 하는 업무자가 건물주로부터 월세임대차계약 체결업무를 위임받고도 임차인들을 속여 전세임대차계약을 체결하고 그 보증금을 편취한 경우, 사기죄와 별도로 업무상 배임죄에 해당한다.","절도범인으로부터 그 정을 알면서 자기앞수표를 교부받아 이를 음식대금으로 지급하고 거스름돈을 환불받은 경우, 새로운 법익 침해가 발생하였기에 장물취득죄와 별도로 사기죄에 해당한다.",2,0,""],["2025-1","형사법",13,"몰수와 추징에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","휴대전화의 동영상 촬영기능을 이용하여 피해자를 촬영한 행위 자체가 범죄에 해당하는 경우, 휴대전화는 ‘범죄행위에 제공된 물건’이지만, 촬영되어 저장된 동영상은 휴대전화에 저장된 전자 기록으로서 ‘범죄행위로 인하여 생긴 물건’이 아니므로 법원이 휴대전화를 몰수하지 않고 동영상만을 몰수할 수는 없다.","도박공간을 개설한 자가 도박에 직접 참가하여 얻은 수익을 도박공간개설로 얻은 범죄수익으로 몰수하거나 추징할 수는 없다.","정보통신망을 통하여 음란한 화상 또는 영상을 배포하고 도박 사이트를 홍보한 경우, 그 범죄행위에 이용된 웹사이트를 매각하여 취득한 대가는 ｢형법｣ 제48조 제1항 제2호, 제2항이 규정한 추징의 대상에 해당한다.","수뢰자가 뇌물을 그대로 보관하다가 증뢰자에게 반환한 때에는 몰수나 추징의 상대방은 증뢰자가 되고, 몰수할 수 없는 때에 추징하여야 할 가액은 범인이 그 물건을 보유하고 있다가 몰수의 선고를 받았더라면 잃었을 이득상당액을 의미한다고 보아야 하므로, 다른 특별한 사정이 없는 한 그 가액산정은 반환 시의 가격을 기준으로 하여야 한다.",1,0,""],["2025-1","형사법",14,"협박에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 X주식회사가 특정 신문들에 광고를 편중했다는 이유로 기자회견을 열어 X회사에 대하여 불매운동을 하겠다고 하면서 특정 신문들에 대한 광고를 중단할 것과 다른 신문들에 대해서도 특정 신문들과 동등하게 광고를 집행할 것을 요구하여 이에 겁을 먹은 X회사의 의사결정권자에게 자사 인터넷 홈페이지에 ‘X회사는 앞으로 특정 언론사에 편중하지 않고 동등한 광고 집행을 하겠다’는 내용의 팝업창을 띄우게 한 경우, 甲의 행위는 강요죄나 공갈죄의 수단으로서의 협박에 해당한다.","채권추심회사의 지사장 甲이 자신의 횡령행위에 대한 민‧형사상 책임을 모면하기 위하여 회사 본사에 ‘회사의 내부비리 등을 관계 기관에 고발하겠다’는 취지의 서면을 보내는 한편, 위 회사의 임원 에게 전화를 걸어 위 서면의 내용과 같은 취지로 발언한 경우, 甲의 행위는 협박죄를 구성한다.","甲은 혼자 술을 마시던 중 X정당이 국회에서 예산안을 강행 처리하였다는 것에 화가 나서 공중전화를 이용하여 경찰서에 여러 차례 전화를 걸어 전화를 받은 각 경찰관에게 경찰서 관할 구역 내에 있는 X정당의 당사를 폭파하겠다는 말을 한 경우, 甲의 행위는 협박죄를 구성한다.","甲은 A의 장모가 있는 자리에서 서류를 보이면서 “자신의 요구를 들어주지 않으면 서류를 세무서로 보내 세무조사를 받게 하여 A를 망하게 하겠다”라고 말하여 A의 장모로 하여금 A에게 위와 같은 사실을 전하게 하고, 그 다음날 A의 처에게 전화를 하여 “며칠 있으면 국세청에서 조사가 나올 것이니 그렇게 아시오”라고 말한 경우, 甲의 행위는 협박죄를 구성한다.",2,0,""],["2025-1","형사법",15,"명예에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 A의 집 뒷길에서 甲의 남편 B 및 A의 친척 C가 듣는 가운데 마을 사람들이 들을 수 있을 정도의 큰 소리로 A에게 “저것이 징역 살다온 전과자다”라고 말한 경우, 공연성이 인정된다.","성명불상자가 인터넷 ○○일보 자유게시판에 “오늘 A 이틀 연속.. 어쩌구한 △△일보 기자 면상”이라는 제목으로 A가 작성한 기사들의 제목과 A의 사진, 이름이 나온 기자 정보란을 캡처한 게시물을 작성‧게시하자 甲이 그 게시물에 “꼰대로 돌아가자면 어린놈의 색이가”라는댓글을작성한경우, 甲에게는모욕죄가성립하지않는다.","재단법인 이사장 A가 전임 이사장 B에 대하여 재임 기간 중 재단 법인의 재산을 횡령하였다고 고소하였다가 무고죄로 유죄판결을 받자, 甲이 A의 퇴진을 요구하는 시위를 하면서 A가 유죄판결을 받은 사실 등을 적시한 경우, 甲의 행위가 자신이 속한 집단을 위한 목적이나 동기가 다소 내포되어 있다 할지라도 객관적으로 공공의 이익을 위한 것임이 인정된다면 위법성이 조각되어 甲에게는 명예훼손죄가 성립하지 않는다.","甲은 대학교 동창인 A가 SNS에서 자신의 팔로우를 해제한 것에 불만을 가지고 있던 중 A가 친구들과 촬영한 사진이 포함된 글을 작성‧게시한 것을 보고 거기에 “와 인성 저런데 친구는 있으시네요, 잘 봤습니다, 안녕히 계세요”라는 내용의 댓글을 게시하였다가 곧 삭제하였으나 A가 SNS의 댓글 미리알림 기능을 통해 이를 알게 된 경우, 甲에게는 모욕죄가 성립한다.",3,0,""],["2025-1","형사법",16,"성폭력범죄에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 甲은 유부녀 A의 옛 애인인 B 행세를 하여 A와 1회 성관계를 가진 후 A에게 전화하여 ‘B와의
