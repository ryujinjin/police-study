  function renderOx() {
    var root = $('#view-ox');
    clear(root);
    if (!OX.length) { root.appendChild(emptyBlock('OX 지문이 없어요', '데이터를 확인해 주세요.', null, null)); return; }
    var mode = state.settings.oxMode || 'unit';

    /* 모드 선택 */
    var bar = el('div', 'quizbar');
    var seg = el('div', 'seg');
    [['unit', '단원별'], ['random', '랜덤']].forEach(function (o) {
      var b = el('button', null, o[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(mode === o[0]));
      b.addEventListener('click', function () {
        if (mode === o[0]) return;
        state.settings.oxMode = o[0];
        ui.oxUnit = '';
        ui.ox = null;
        saveState();
        startOx();
        renderOx();
      });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    if (mode === 'unit' && ui.oxUnit) {
      bar.appendChild(btn('btn btn-line btn-sm', '↩ 단원 선택', function () {
        ui.oxUnit = '';
        ui.ox = null;
        renderOx();
        window.scrollTo(0, 0);
      }));
    }
    bar.appendChild(btn('btn btn-line btn-sm', '↻ 처음부터', function () {
      startOx();
      renderOx();
      window.scrollTo(0, 0);
    }));
    root.appendChild(bar);

    if (mode === 'unit' && !ui.oxUnit) { renderOxUnitPicker(root); return; }

    if (!ui.ox || ui.ox.subject !== ui.subject ||
        (ui.ox.mode !== 'custom' && (ui.ox.mode !== mode ||
          (mode === 'unit' && ui.ox.unit !== ui.oxUnit)))) startOx();
    var q = ui.ox;

    if (q.done) { renderOxResult(root); return; }

    var item = OX_BY_ID[q.ids[q.idx]];
    if (!item) { startOx(); renderOx(); return; }
    var r = q.resp[item.id];
    var answered = !!r;
    var ok = answered && (r.pick === item.answer);

    var meta = el('div', 'qmeta');
    var left = el('div');
    left.appendChild(el('span', 'pill', item.subjectName));
    if (mode === 'random' && item.unit) left.appendChild(el('span', 'pill unit', item.unit));
    if (item.badge) left.appendChild(el('span', 'pill new2026', '🆕 ' + item.badge));
    meta.appendChild(left);
    meta.appendChild(el('span', 'qm-r', (q.idx + 1) + ' / ' + q.ids.length + ' · 통과 ' + q.combo));
    root.appendChild(meta);
    root.appendChild(progressBar(pct(oxAnswered(q), q.ids.length), ''));

    var bb = oxBuddy(q, answered, ok);
    root.appendChild(buddyEl(bb, { pop: answered && q.anim, float: (answered && q.lastDelta) ? (q.lastDelta > 0 ? '+' + q.lastDelta + 'P' : q.lastDelta + 'P') : '' }));

    /* 지문 카드 */
    var card = el('section', 'card sec oxcard');
    var cbadges = el('div', 'oxbadges');
    if (mode === 'unit' && item.unit) cbadges.appendChild(el('span', 'pill unit', item.unit));
    if (item.badge) cbadges.appendChild(el('span', 'pill new2026', '🆕 ' + item.badge));
    if (cbadges.firstChild) card.appendChild(cbadges);
    card.appendChild(el('p', 'oxstmt', item.stmt));

    var btns = el('div', 'oxbtns');
    [['O', true], ['X', false]].forEach(function (o) {
      var b = el('button', 'oxbtn ' + (o[1] ? 'o' : 'x'));
      b.type = 'button';
      b.setAttribute('aria-label', o[1] ? '이 지문은 옳다 (O)' : '이 지문은 틀렸다 (X)');
      b.appendChild(el('span', 'mark', o[0]));
      b.appendChild(el('span', 'lab', o[1] ? '옳은 지문' : '틀린 지문'));
      if (answered) {
        b.disabled = true;
        if (r.pick === o[1]) b.className += ' picked ' + (o[1] ? 'o' : 'x');
        else b.className += ' dimmed';
      } else {
        b.addEventListener('click', function () { answerOx(o[1]); });
      }
      btns.appendChild(b);
    });
    card.appendChild(btns);
    root.appendChild(card);

    /* 피드백 */
    if (answered) {
      var fb = el('section', 'oxfb');
      var vd = el('div', 'oxverdict ' + (ok ? 'ok' : 'no'));
      vd.appendChild(el('span', null, ok ? '⭕ 정답이에요' : '❌ 아쉬워요 · 정답은 ' + (item.answer ? 'O' : 'X')));
      if (q.lastDelta) vd.appendChild(el('span', 'pts', (q.lastDelta > 0 ? '+' : '') + q.lastDelta + 'P'));
      fb.appendChild(vd);

      if (ok) {
        var praise = PRAISE[(q.idx + q.combo) % PRAISE.length];
        fb.appendChild(el('p', 'oxpraise', praise));
      } else {
        fb.appendChild(sourceBox([{ q: item.quote, c: item.cite }], '판례·조문 근거'));
      }
      root.appendChild(fb);
      enhanceSrcBox('#view-ox .srcbox');
      if (answered) {
        window.setTimeout(function () {
          var sb = document.querySelector(ok ? '#view-ox .oxpraise' : '#view-ox .srcwrap');
          if (sb && sb.scrollIntoView) {
            try { sb.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { sb.scrollIntoView(); }
          }
        }, 60);
      }
    }

    /* 이전 / 다음 */
    root.appendChild(el('div', 'navspacer'));
    root.appendChild(navRow(
      '◀ 이전', q.idx <= 0,
      function () {
        if (q.idx <= 0) return;
        q.idx -= 1; q.anim = false; q.lastDelta = 0; q.lastPenalty = 0;
        renderOx(); window.scrollTo(0, 0);
      },
      (q.idx + 1) + ' / ' + q.ids.length,
      q.idx + 1 >= q.ids.length ? '결과 보기' : '다음 ▶',
      function () {
        if (q.idx + 1 >= q.ids.length) q.done = true;
        else q.idx += 1;
        q.anim = false; q.lastDelta = 0; q.lastPenalty = 0;
        renderOx(); window.scrollTo(0, 0);
      }
    ));
  }

  /* 회색 박스: 판례 원문·조문 원문 + 번호 */
  function parseNote(note) {
    var s = String(note || '').replace(/^[OX-]\s*—\s*/, '').trim();
    var m = s.match(/^「([\s\S]+)」\s*\(([^()]+)\)\s*$/);
    if (m) return { q: m[1].trim(), c: m[2].trim() };
    var m2 = s.match(/^근거\s+(.+)$/);
    if (m2) return { q: '', c: m2[1].trim() };
    return { q: s, c: '' };
  }

  function enhanceSrcBox(sel) {
    Array.prototype.forEach.call(document.querySelectorAll(sel), function (box) {
      if (box.getAttribute('data-scroll')) return;
      box.setAttribute('data-scroll', '1');
      var wrap = box.parentNode;
      var hint = wrap ? wrap.querySelector('.srchint') : null;
      function upd() {
        var over = (box.scrollHeight - box.clientHeight) > 8;
        var atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 6;
        box.classList.toggle('more', over && !atEnd);
        if (hint) hint.hidden = !over;
      }
      upd();
      box.addEventListener('scroll', upd, { passive: true });
      window.addEventListener('resize', upd);
    });
  }

  function sourceBox(rows, label) {
    var wrap = el('div', 'srcwrap');
    if (label) wrap.appendChild(el('span', 'srclabel', label));
    var hint = el('span', 'srchint', '↕ 박스 안에서 넘겨 해설 전체를 볼 수 있어요');
    hint.hidden = true;
    wrap.appendChild(hint);
    var box = el('div', 'srcbox');
    rows.forEach(function (row) {
      if (!row || (!row.q && !row.c)) return;
      var line = el('div', 'sbrow');
      if (row.mark) line.appendChild(el('span', 'sbmark ' + (row.mark === 'O' ? 'o' : 'x'), row.mark));
      var main = el('div', 'sbmain');
      if (row.q) main.appendChild(el('p', 'sbq', row.plain ? row.q : '「' + row.q + '」'));
      if (row.c) main.appendChild(el('span', 'sbcite', row.c));
      else if (row.q && !row.plain) main.appendChild(el('span', 'sbcite soft', '공개 기출해설 요지'));
      line.appendChild(main);
      box.appendChild(line);
    });
    if (!box.firstChild) return el('div', 'sbempty');
    wrap.appendChild(box);
    return wrap;
  }

  function navRow(prevLabel, prevDisabled, onPrev, count, nextLabel, onNext) {
    var nav = el('div', 'qnav');
    var prev = btn('btn btn-line', prevLabel, onPrev, { 'aria-label': '이전' });
    if (prevDisabled) { prev.setAttribute('disabled', 'disabled'); prev.setAttribute('aria-disabled', 'true'); }
    var next = btn('btn btn-primary', nextLabel, onNext, { 'aria-label': nextLabel });
    nav.appendChild(prev);
    nav.appendChild(el('div', 'qnav-count', count));
    nav.appendChild(next);
    return nav;
  }

  function answerOx(pick) {
    var q = ui.ox;
    if (!q || q.done) return;
    var item = OX_BY_ID[q.ids[q.idx]];
    if (!item || q.resp[item.id]) return;
    ensureDay();
    q.resp[item.id] = { pick: pick };
    var ok = (pick === item.answer);

    var st = state.oxstats[item.id] || { ok: 0, bad: 0 };
    if (ok) st.ok = (st.ok || 0) + 1; else st.bad = (st.bad || 0) + 1;
    state.oxstats[item.id] = st;
    if (!state.day.ox[item.id]) state.day.ox[item.id] = Date.now();

    var delta = 0, penalty = 0;
    if (ok) {
      q.combo = (q.combo || 0) + 1;
      q.best = Math.max(q.best || 0, q.combo);
      q.wrongStreak = 0;
      delete state.oxwrong[item.id];
      delta = addPoints(P_OX_OK);
    } else {
      q.combo = 0;
      q.wrongStreak = (q.wrongStreak || 0) + 1;
      var w = state.oxwrong[item.id] || { n: 0 };
      w.n = (w.n || 0) + 1; w.ts = Date.now();
      state.oxwrong[item.id] = w;
      if (q.wrongStreak >= 2) { penalty = addPoints(P_BAD); delta = penalty; }
    }
    q.lastDelta = delta;
    q.lastPenalty = penalty;
    q.anim = true;
    (function (ref) { window.setTimeout(function () { if (ui.ox === ref) ref.anim = false; }, 900); })(q);

    checkMission();
    saveState();
    checkPromotion();
    renderChips();
    renderOx();
    renderBadges();
    var vd = $('#view-ox .oxverdict');
    if (vd && vd.scrollIntoView) {
      var vr = vd.getBoundingClientRect();
      if (vr.top < 70 || vr.bottom > window.innerHeight - 70) {
        try { vd.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { vd.scrollIntoView(); }
      }
    }
  }

  function renderOxResult(root) {
    var q = ui.ox;
    var answered = oxAnswered(q);
    var okN = 0, badN = 0;
    q.ids.forEach(function (id) {
      var r = q.resp[id];
      if (!r) return;
      if (r.pick === OX_BY_ID[id].answer) okN += 1; else badN += 1;
    });
    var rate = answered ? Math.round((okN / answered) * 100) : 0;

    var card = el('section', 'card sec score');
    card.appendChild(el('div', 'eyebrow', 'PATROL REPORT'));
    var fig = el('img', 'score-fig');
    fig.src = rate >= 80 ? BODY_IMG.good : BODY_IMG.cheer;
    fig.alt = '';
    fig.decoding = 'async';
    card.appendChild(fig);
    var big = el('div', 'pct', String(rate));
    big.appendChild(el('small', null, '%'));
    card.appendChild(big);
    card.appendChild(el('div', 'st', '검문 ' + answered + ' / 전체 ' + q.ids.length + ' · 통과 ' + okN + ' · 적발 ' + badN));
    card.appendChild(el('p', 'msg', answered === 0
      ? '아직 검문한 지문이 없어요. O·X로 판단하거나 이전·다음으로 넘겨 보세요.'
      : rate === 100 ? '전부 통과했어요. 이 구역은 마무리해도 좋아요.'
        : rate >= 80 ? '좋아요. 적발된 지문만 다시 보면 됩니다.'
          : rate >= 60 ? '절반은 넘겼어요. 해설을 한 번 더 읽어 보세요.'
            : '적발된 지문이 오답 수사파일에 저장됐어요. 해설부터 보면 빨라요.'));
    root.appendChild(card);

    var acts = el('div', 'sec');
    if (badN) {
      var wrongIds = q.ids.filter(function (id) {
        var r = q.resp[id];
        return r && r.pick !== OX_BY_ID[id].answer;
      });
      acts.appendChild(btn('btn btn-primary', '이번에 적발된 ' + wrongIds.length + '지문 다시 검문', function () {
        ui.ox = {
          subject: ui.subject, mode: 'custom', order: q.order, ids: wrongIds.slice(), idx: 0, resp: {},
          combo: 0, best: 0, wrongStreak: 0, anim: false, lastDelta: 0, lastPenalty: 0, done: false
        };
        renderOx();
        window.scrollTo(0, 0);
      }));
      acts.lastChild.style.marginBottom = '9px';
    }
    acts.appendChild(btn('btn btn-ghost', '같은 범위 새로 검문', function () {
      startOx(); renderOx(); window.scrollTo(0, 0);
    }));
    acts.lastChild.style.marginBottom = '9px';
    acts.appendChild(btn('btn btn-line', '오답 수사파일 보기', function () { go('wrong'); }));
    root.appendChild(acts);
  }


  /* =========================================================
     7. 경찰 뉴스·이슈 (면접 대비)
     ========================================================= */
  function newsSeen() {
    ensureDay();
    var n = 0;
    Object.keys(state.day.news || {}).forEach(function (id) {
      if (NEWS_BY_ID[id]) n += 1;
    });
    return n;
  }

  function newsIsRead(id) {
    ensureDay();
    return !!state.day.news[id];
  }

  function toggleNewsRead(id) {
    ensureDay();
    var n = NEWS_BY_ID[id];
    if (!n) return;
    if (state.day.news[id]) {
      delete state.day.news[id];
    } else {
      state.day.news[id] = Date.now();
      var got = addPoints(P_NEWS);
      if (got > 0) toast('뉴스 1건 정리 +' + got + 'P');
    }
    checkMission();
    saveState();
    checkPromotion();
    renderBadges();
    renderAll();
  }

  function newsDateLabel(d) {
    var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[1] + '.' + m[2] + '.' + m[3]) : (d || '');
  }

  function newsCard(n) {
    var art = el('article', 'news' + (newsIsRead(n.id) ? ' read' : ''));
    if (n.image) {
      var fig = el('a', 'news-thumb');
      fig.href = n.url || '#';
      fig.target = '_blank';
      fig.rel = 'noopener noreferrer';
      var im = el('img');
      im.src = n.image;
      im.alt = n.title ? (n.title + ' 관련 사진') : '기사 사진';
      im.loading = 'lazy';
      im.decoding = 'async';
      im.addEventListener('error', function () {
        if (fig.parentNode) fig.parentNode.removeChild(fig);
      });
      fig.appendChild(im);
      if (n.credit) {
        var cr = el('span', 'news-credit', n.credit);
        fig.appendChild(cr);
      }
      art.appendChild(fig);
    }
    var body = el('div', 'news-body');
    var top = el('div', 'news-top');
    top.appendChild(el('span', 'ncat', n.category));
    var metaTxt = [newsDateLabel(n.date), n.press].filter(Boolean).join(' · ');
    if (metaTxt) top.appendChild(el('span', 'nmeta', metaTxt));
    if (newsIsRead(n.id)) top.appendChild(el('span', 'nread-tag', '읽음'));
    body.appendChild(top);
    body.appendChild(el('h3', 'ntitle', n.title));
    if (n.summary) body.appendChild(el('p', 'nsum', n.summary));
    if (n.point) {
      var pt = el('div', 'npoint');
      pt.appendChild(el('b', null, '면접 포인트'));
      pt.appendChild(el('span', null, n.point));
      body.appendChild(pt);
    }
    var foot = el('div', 'nfoot');
    if (n.url) {
      var a = el('a', 'nlink');
      a.href = n.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '기사 원문 보기 ↗';
      a.addEventListener('click', function () {
        if (!newsIsRead(n.id)) {
          window.setTimeout(function () { toggleNewsRead(n.id); }, 60);
        }
      });
      foot.appendChild(a);
    }
    var rb = el('button', 'nread-btn' + (newsIsRead(n.id) ? ' on' : ''));
    rb.type = 'button';
    rb.textContent = newsIsRead(n.id) ? '읽음 ✓' : '읽음 표시';
    rb.setAttribute('aria-pressed', newsIsRead(n.id) ? 'true' : 'false');
    rb.addEventListener('click', function () { toggleNewsRead(n.id); });
    foot.appendChild(rb);
    body.appendChild(foot);
    art.appendChild(body);
    return art;
  }

  function renderNews() {
    var root = $('#view-news');
    clear(root);

    var head = el('section', 'card news-head');
    var h = el('div', 'mission-hero');
    h.appendChild(el('span', 'flag', '📰'));
    h.appendChild(el('h3', null, '경찰 뉴스·이슈'));
    h.appendChild(el('span', 'badge', NEWS.length + '건'));
    head.appendChild(h);
    head.appendChild(el('p', 'muted', '면접에서 물어볼 만한 최신 경찰 이슈를 카테고리·요약·면접 포인트로 정리했어요. 카드를 눌러 원문을 확인하고 「읽음 표시」를 누르면 오늘의 임무에 반영됩니다.'));
    if (NEWS_UPDATED) head.appendChild(el('p', 'tiny', '마지막 업데이트 ' + NEWS_UPDATED + ' · 출처는 각 기사 원문'));
    root.appendChild(head);

    if (!NEWS.length) {
      root.appendChild(emptyBlock('아직 뉴스가 없어요', '뉴스 데이터를 확인해 주세요.', null, null));
      return;
    }

    var chips = el('div', 'newschips');
    NEWS_CATS.forEach(function (c) {
      var b = el('button', 'nchip');
      b.type = 'button';
      b.textContent = c + (c === '전체' ? ' ' + NEWS.length : '');
      b.setAttribute('aria-pressed', ui.newsCat === c ? 'true' : 'false');
      b.addEventListener('click', function () {
        ui.newsCat = c;
        renderNews();
      });
      chips.appendChild(b);
    });
    root.appendChild(chips);

    var list = NEWS.filter(function (n) { return ui.newsCat === '전체' || n.category === ui.newsCat; });
    var wrap = el('div', 'newslist');
    list.forEach(function (n) { wrap.appendChild(newsCard(n)); });
    root.appendChild(wrap);

    var foot = el('p', 'tiny sec');
    foot.style.textAlign = 'center';
    foot.textContent = '기사 요약은 원문을 바탕으로 정리했어요. 시험 직전에는 원문 링크로 최신 내용을 다시 확인하세요.';
    root.appendChild(foot);
  }

  /* =========================================================
     8. 오답 수사파일
     ========================================================= */
  function renderWrong() {
    var root = $('#view-wrong');
    clear(root);

    var oxw = oxWrongIn(ui.subject);

    var head = el('section', 'card');
    head.appendChild(el('p', 'eyebrow', 'CASE FILE'));
    head.appendChild(el('h3', null, '오답 수사파일 · ' + SUBJ_NAME[ui.subject]));
    head.appendChild(el('p', 'muted', 'OX에서 적발된 지문 ' + oxw.length + '건 · 단원별로 다시 검문할 수 있어요'));

    var acts = el('div', 'row');
    acts.style.marginTop = '12px';
    acts.appendChild(btn('btn btn-primary', 'OX 적발 재검문 (' + oxw.length + ')', function () {
      var ids = oxw.map(function (o) { return o.id; });
      ui.ox = {
        subject: ui.subject, mode: 'custom', order: 'seq', ids: ids, idx: 0, resp: {}, combo: 0, best: 0,
        wrongStreak: 0, anim: false, lastDelta: 0, lastPenalty: 0, done: ids.length === 0
      };
      go('ox');
    }, oxw.length ? null : { disabled: 'disabled' }));
    head.appendChild(acts);
    root.appendChild(head);

    if (!oxw.length) {
      root.appendChild(emptyBlock('아직 수사파일이 비어 있어요',
        'OX에서 틀린 지문이 과목·단원별로 여기에 모입니다.',
        'OX 검문하러 가기', function () { go('ox'); }));
      return;
    }

    if (oxw.length) {
      var secO = el('section', 'card sec');
      secO.appendChild(el('h3', null, 'OX 적발 지문'));
      groupBySubject(oxw).forEach(function (g) {
        secO.appendChild(buildWrongGroup(g.name, g.items.map(function (item) {
          var row = el('div', 'wn-item wn-stack');
          var main = el('button', 'wn-main wn-card');
          main.type = 'button';
          main.appendChild(el('p', 'wn-q', item.stmt));
          var w = state.oxwrong[item.id] || { n: 1 };
          main.appendChild(el('div', 'wn-meta', '적발 ' + (w.n || 1) + '회 · 정답 ' + (item.answer ? 'O' : 'X') + ' · ' + (item.unit || '')));
          main.addEventListener('click', function () {
            ui.ox = {
              subject: ui.subject, mode: 'custom', order: 'seq', ids: [item.id], idx: 0, resp: {}, combo: 0, best: 0,
              wrongStreak: 0, anim: false, lastDelta: 0, lastPenalty: 0, done: false
            };
            go('ox');
          });
          row.appendChild(main);
          var foot = el('div', 'wn-foot');
          foot.appendChild(el('span', 'wn-hint', '지문을 누르면 바로 재검문'));
          var acts2 = el('div', 'wn-acts');
          acts2.appendChild(btn('wn-x', '✕', function () {
            delete state.oxwrong[item.id];
            saveState();
            toast('수사파일에서 뺐어요');
            renderAll();
          }, { 'aria-label': '수사파일에서 빼기' }));
          foot.appendChild(acts2);
          row.appendChild(foot);
          return row;
        })));
      });
      root.appendChild(secO);
    }
  }

  function buildWrongGroup(name, rows) {
    var g = el('div', 'wn-group');
    g.appendChild(el('h3', null, name));
    rows.forEach(function (r) { g.appendChild(r); });
    return g;
  }

  function groupBySubject(items) {
    var out = [];
    SUBJECTS.forEach(function (s) {
      var list = items.filter(function (x) { return x.subjectId === s.id; });
      if (list.length) out.push({ name: s.name, items: list });
    });
    return out;
  }

  function emptyBlock(title, body, actionLabel, action) {
    var box = el('section', 'card empty sec');
    box.appendChild(el('div', 'eico', '🗂️'));
    box.appendChild(el('h3', null, title));
    box.appendChild(el('p', null, body));
    if (actionLabel && action) box.appendChild(btn('btn btn-ghost', actionLabel, action));
    return box;
  }

  /* =========================================================
     9. 설정 시트 · 초기화
     ========================================================= */
  function openSheet() {
    var body = $('#sheetBody');
    clear(body);

    var d = dayStats();
    var pts = Math.max(0, state.pts || 0);
    var lvl = rankIndexFor(pts);
    var rk = RANKS[lvl];
    var nx = RANKS[lvl + 1] || null;

    var rankCard = el('section', 'card');
    rankCard.appendChild(el('h3', null, '계급과 근무평정'));
    rankCard.appendChild(kv('현재 계급', rk.name + ' · ' + fmt(pts) + 'P'));
    rankCard.appendChild(kv('다음 승진', nx ? (nx.name + ' · ' + fmt(nx.pts) + 'P까지 ' + fmt(nx.pts - pts) + 'P 남음') : '없음 · 최고 계급'));
    rankCard.appendChild(kv('오늘의 임무', 'OX 검문 ' + Math.min(d.ox, GOAL_OX) + '/' + GOAL_OX +
      ' · 뉴스 읽기 ' + Math.min(d.news, GOAL_NEWS) + '/' + GOAL_NEWS + (d.bonus ? ' · 완수' : '')));
    rankCard.appendChild(kv('포인트 규칙', 'OX 정답 +' + P_OX_OK + 'P · 뉴스 읽기 +' + P_NEWS +
      'P · 2연속 오답부터 문항당 ' + P_BAD + 'P · 오늘의 임무 완수 +' + P_BONUS + 'P'));
    body.appendChild(rankCard);

    var sum = el('section', 'card sec');
    sum.appendChild(el('h3', null, '수사 기록'));
    sum.appendChild(kv('OX 검문', '검문 ' + oxSeen('all') + '지문 · 정답률 ' + oxRate('all').rate + '% · 적발 ' + oxWrongIn('all').length + '건 / 전체 ' + OX.length + '지문'));
    sum.appendChild(kv('경찰 뉴스', '읽은 기사 ' + newsSeen() + ' / ' + NEWS.length + '건 · ' + (NEWS_UPDATED ? '업데이트 ' + NEWS_UPDATED : '정기 갱신')));
    sum.appendChild(kv('저장 위치', '이 브라우저(localStorage)에만 저장 · 서버 전송 없음'));
    var reset = btn('btn btn-line', '수사 기록 초기화', function () { openResetModal(); });
    reset.style.marginTop = '13px';
    sum.appendChild(reset);
    body.appendChild(sum);

    var info = el('section', 'card sec');
    info.appendChild(el('h3', null, '시험 정보'));
    var eb = META.exam_basis || {};
    if (eb.subjects) info.appendChild(kv('문항 구성', eb.subjects));
    if (eb.ratios) info.appendChild(kv('과목 비중', eb.ratios));
    if (eb.pass_rule) info.appendChild(kv('합격 기준', eb.pass_rule));
    if (eb.note) info.appendChild(kv('일정', eb.note));
    body.appendChild(info);

    var crit = el('section', 'card sec');
    crit.appendChild(el('h3', null, '2026.10.2. 개정 핵심'));
    crit.appendChild(el('p', 'muted', META.critical_notice || ''));
    body.appendChild(crit);

    var oxsec = el('section', 'card sec');
    oxsec.appendChild(el('h3', null, 'OX 지문 구성'));
    SUBJECTS.forEach(function (s) {
      oxsec.appendChild(kv(s.name, oxIn(s.id).length + '지문'));
    });
    oxsec.appendChild(el('p', 'muted', '2022년 1차 ~ 2026년 2차 기출 4,000선지 가운데 단독 O/X 지문으로 쓸 수 있는 것을 추려 담았습니다. 정답 O와 X를 절반씩 섞었고, 2026. 10. 2. 형사사법 개정 지문은 🆕 배지로 표시합니다. 근거는 판례 판시사항·판결요지 또는 조문 원문입니다.'));
    body.appendChild(oxsec);

    var laws = el('section', 'card sec');
    laws.appendChild(el('h3', null, '반영 법령'));
    var ul = el('ul', 'lawlist');
    (META.law_versions || []).forEach(function (l) { ul.appendChild(el('li', null, l)); });
    laws.appendChild(ul);
    body.appendChild(laws);

    if (EXCLUDED.length) {
      var exd = el('details', 'card sec');
      var s2 = el('summary');
      s2.appendChild(el('span', null, '이번 범위에서 뺀 항목 ' + EXCLUDED.length));
      exd.appendChild(s2);
      var db2 = el('div', 'dbody');
      EXCLUDED.forEach(function (x, i2) {
        var p = el('p', 'muted');
        p.style.margin = i2 ? '10px 0 0' : '0';
        p.appendChild(el('b', null, x.item + ' — '));
        p.appendChild(document.createTextNode(x.reason || ''));
        db2.appendChild(p);
      });
      exd.appendChild(db2);
      body.appendChild(exd);
    }

    var about = el('section', 'card sec');
    about.appendChild(el('h3', null, '이 앱'));
    about.appendChild(kv('구성', '단일 HTML 파일 · 외부 CDN 없음 · 오프라인 동작'));
    about.appendChild(kv('데이터', (META.title || '경찰공채 학습 데이터') + ' · ' + (META.generated_at || '')));
    about.appendChild(kv('검증 기준', META.verified_against || '-'));
    about.appendChild(kv('추가 방법', '홈 화면에 추가하면 앱처럼 전체 화면으로 열려요'));
    body.appendChild(about);

    $('#sheetOverlay').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    $('#sheetOverlay').hidden = true;
    document.body.style.overflow = '';
  }

  function openResetModal() {
    $('#modalBody').textContent = '검문 기록, 오답 수사파일, 포인트와 계급이 모두 지워집니다. 되돌릴 수 없어요.';
    $('#modalOverlay').hidden = false;
  }
  function closeResetModal() { $('#modalOverlay').hidden = true; }

  function doReset() {
    try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch (e) {}
    state = freshState();
    ensureDay();
    ui.subject = 'all';
    ui.ox = null;
    ui.buddy = null;
    ui.newsCat = '전체';
    saveState();
    closeResetModal();
    closeSheet();
    renderAll();
    toast('수사 기록을 초기화했어요');
  }

  /* =========================================================
     10. 이벤트 · 시작
     ========================================================= */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { go(t.getAttribute('data-tab')); });
  });

  $('#btnSettings').addEventListener('click', openSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetOverlay').addEventListener('click', function (e) {
    if (e.target === $('#sheetOverlay')) closeSheet();
  });
  $('#modalCancel').addEventListener('click', closeResetModal);
  $('#modalOk').addEventListener('click', doReset);
  $('#modalOverlay').addEventListener('click', function (e) {
    if (e.target === $('#modalOverlay')) closeResetModal();
  });

  var promoOverlay = $('#promoOverlay');
  if (promoOverlay) {
    promoOverlay.addEventListener('click', function (e) {
      if (e.target === promoOverlay) closePromo();
    });
  }
  var promoOk = $('#promoOk');
  if (promoOk) promoOk.addEventListener('click', closePromo);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (promoOverlay && !promoOverlay.hidden) closePromo();
    else if (!$('#modalOverlay').hidden) closeResetModal();
    else if (!$('#sheetOverlay').hidden) closeSheet();
  });

  var chipbar = $('#chipbar');
  window.addEventListener('scroll', function () {
    chipbar.classList.toggle('stuck', window.scrollY > 4);
  }, { passive: true });

  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
    applyTheme();
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
    else if (mq.addListener) mq.addListener(applyTheme);
  } catch (e) {}

  var bs = $('#brandSub');
  if (bs) bs.textContent = 'OX ' + fmt(OX.length) + '지문 · 경찰 뉴스 ' + NEWS.length + '건';

  quoteTimer = window.setInterval(function () {
    if (document.hidden) return;
    if (ui.tab !== 'home') return;
    nextQuote();
  }, 6000);
  window.addEventListener('pagehide', function () {
    if (quoteTimer) clearInterval(quoteTimer);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var before = state.day ? state.day.d : null;
    ensureDay();
    saveState();
    if (before !== state.day.d) renderAll();
  });

  ensureDay();
  saveState();
  renderAll();

  ['char-thumbsup-face.png', 'char-cheer-face.png'].forEach(function (f) {
    var im = new Image();
    im.src = './assets/' + f;
  });
})();
</script>
</body>
</html>
