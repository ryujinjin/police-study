  function gActiveBar() {
    var bar = el('div', 'gactive');
    bar.appendChild(el('span', 'gactive-t', ui.quiz.label || '실전 기출'));
    bar.appendChild(btn('btn btn-line btn-sm', '회차 선택', function () {
      ui.gsel = null;
      ui.quiz = null;
      renderQuiz();
      window.scrollTo(0, 0);
    }));
    return bar;
  }

  function renderQuiz() {
    var root = $('#view-quiz');
    clear(root);
    if (GQ.length) root.appendChild(gSwitch());
    if (ui.src === 'gyeolchul' && GQ.length && !ui.gsel) { root.appendChild(gPicker()); return; }
    if (!ui.quiz) {
      if (ui.gsel) {
        startQuiz('gyeolchul', gIds(ui.gsel.session, ui.gsel.subject), {
          label: (GSESS_LABEL[ui.gsel.session] || ui.gsel.session) + ' · ' + ui.gsel.subject
        });
      } else if (ui.src !== 'gyeolchul') {
        startQuiz('normal');
      }
    }
    if (!ui.quiz) { root.appendChild(gPicker()); return; }
    var q = ui.quiz;
    if (q.src === 'gyeolchul') root.appendChild(gActiveBar());

    /* 상단 컨트롤 */
    var bar = el('div', 'quizbar');
    var seg = el('div', 'seg');
    [['seq', '순서대로'], ['shuffle', '랜덤']].forEach(function (o) {
      var b = el('button', null, o[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(q.order === o[0]));
      b.addEventListener('click', function () {
        if (q.order === o[0]) return;
        q.order = o[0];
        state.settings.order = o[0];
        saveState();
        if (!q.done && !answeredN(q)) {
          /* 아직 푼 문항이 없으면 같은 범위로 다시 섞기 */
          startQuiz(q.mode, q.ids.slice(), { label: q.label });
        } else {
          q.order = o[0];
        }
        renderQuiz();
      });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    var again = btn('btn btn-line btn-sm', '↻ 처음부터', function () {
      startQuiz(q.mode, q.ids.slice(), { label: q.label });
      renderQuiz();
      window.scrollTo(0, 0);
    });
    bar.appendChild(again);
    root.appendChild(bar);

    if (!q.ids.length) {
      root.appendChild(emptyBlock(
        q.mode === 'wrong' ? '오답으로 저장된 문제가 없어요' : '이 과목에 문항이 없어요',
        q.mode === 'wrong' ? '사지선다를 풀다가 틀리면 자동으로 여기에 모입니다.' : '다른 과목을 선택해 보세요.',
        q.mode === 'wrong' ? '새 문제 풀기' : null,
        function () { startQuiz('normal'); renderQuiz(); }
      ));
      return;
    }

    if (q.done) { renderQuizResult(root); return; }

    var item = Q_BY_ID[q.ids[q.idx]];
    if (!item) { startQuiz(q.mode, q.ids.slice(), { label: q.label }); renderQuiz(); return; }
    var resp = q.responses[item.id];
    var answered = resp != null;
    var excluded = item.isG && item.law === 2;
    var ok = answered && !excluded && resp.p === item.answer_index;

    /* 진행 */
    var meta = el('div', 'qmeta');
    var left = el('div');
    left.appendChild(el('span', 'pill', item.subjectName));
    if (q.mode === 'wrong') left.appendChild(el('span', 'pill unsure', ' 오답 복습'));
    meta.appendChild(left);
    meta.appendChild(el('span', 'qm-r', (q.idx + 1) + ' / ' + q.ids.length + ' · 정답 ' + q.correct));
    root.appendChild(meta);
    root.appendChild(progressBar(pct(answeredN(q), q.ids.length), ''));

    /* 캐릭터 버디 */
    var bb = quizBuddy(q, answered, ok);
    root.appendChild(buddyEl(bb, { pop: answered && q.anim }));

    /* 문제 */
    var qcard = el('section', 'card sec');
    var qm = el('div', 'badges');
    if (item.isG) {
      qm.appendChild(el('span', 'pill', GSESS_LABEL[item.session] || '기출'));
      qm.appendChild(el('span', 'pill diff', item.subjectName + ' ' + item.number + '번'));
      if (item.law) qm.appendChild(el('span', 'pill law' + (item.law === 2 ? ' out' : ''), LAW_LABEL[item.law]));
    } else {
      var rb = revBadge(item);
      if (rb) qm.appendChild(el('span', 'pill rev', '🆕 ' + rb));
      qm.appendChild(el('span', 'pill', '난이도 ' + (item.difficulty || '중')));
      qm.appendChild(el('span', 'pill diff', '문항 ' + (q.idx + 1)));
    }
    qcard.appendChild(qm);
    qcard.appendChild(el('p', 'qtext', item.question));
    if (item.box) {
      var bx = el('div', 'qbox');
      bx.textContent = item.box;
      qcard.appendChild(bx);
    }

    var choices = el('div', 'choices');
    item.choices.forEach(function (text, i) {
      var b = el('button', 'choice');
      b.type = 'button';
      b.appendChild(el('span', 'cnum', CIRCLED[i]));
      b.appendChild(el('span', 'ctext', text));
      if (answered) {
        b.disabled = true;
        if (i === item.answer_index) b.className = 'choice correct';
        else if (i === resp.p) b.className = 'choice wrong';
        else b.className = 'choice dim';
      } else {
        b.addEventListener('click', function () { answerQuiz(i); });
      }
      choices.appendChild(b);
    });
    qcard.appendChild(choices);
    root.appendChild(qcard);

    if (answered) {
      var ex = el('section', 'explain');
      var v = el('div', 'verdict ' + (ok ? 'ok' : (excluded ? 'skip' : 'no')));
      if (excluded) {
        v.textContent = '채점 제외 문항이에요 · 개정 전 법령 기준';
      } else if (item.answer_index < 0) {
        v.textContent = '공식 정답이 없는 문항이에요';
      } else {
        v.textContent = ok ? '정답이에요 ✓' : '아쉬워요 ✗ 정답은 ' + CIRCLED[item.answer_index] + '번';
      }
      ex.appendChild(v);
      if (item.law && item.lawNote) {
        var lb = el('div', 'lawbox' + (item.law === 2 ? ' out' : ''));
        lb.appendChild(el('strong', null, item.law === 2 ? '2026. 10. 2. 개정 — 채점 제외' : '2026. 10. 2. 개정 — 확인 필요'));
        lb.appendChild(el('p', null, item.lawNote));
        ex.appendChild(lb);
      }

      /* 응답 리액션 */
      var dq = Math.min(GOAL_QUIZ, dayStats().quiz);
      if (!excluded) {
      var rx = el('div', 'reaction ' + (ok ? 'good' : 'cheer'));
      var rxa = el('div', 'rx-av');
      rxa.appendChild(faceImg(ok ? 'good' : 'cheer', 32));
      rx.appendChild(rxa);
      var rxt = el('div', 'buddy-text');
      var badLine = (q.wrongStreak >= 2)
        ? (q.lastPenalty < 0 ? (q.wrongStreak + '연속 오답 … ' + q.lastPenalty + 'P') : (q.wrongStreak + '연속 오답 … 포인트는 0P에서 멈춰요'))
        : '아쉬워요, 해설 한 번 보자';
      rxt.appendChild(el('p', 'rx-line', ok
        ? ('정답! +' + P_QUIZ + 'P' + (q.combo >= 2 ? ' · ' + q.combo + '콤보 🔥' : ''))
        : badLine));
      rxt.appendChild(el('p', 'rx-sub', ok
        ? ('오늘 사지선다 ' + dq + '/' + GOAL_QUIZ + ' · 보유 ' + fmt(state.pts || 0) + 'P')
        : ('오답노트에 담았어요 · 보유 ' + fmt(state.pts || 0) + 'P')));
      rx.appendChild(rxt);
      if (q.lastDelta) {
        rx.appendChild(el('span', 'float-pt' + (q.lastDelta < 0 ? ' minus' : ''),
          (q.lastDelta > 0 ? '+' : '') + q.lastDelta + 'P'));
      }
      ex.appendChild(rx);
      }

      ex.appendChild(el('h4', null, '해설'));
      ex.appendChild(el('p', 'body', item.explanation || ''));

      if ((item.choice_notes || []).length) {
        ex.appendChild(el('h4', null, '선지별 근거'));
        var ul = el('ul', 'notes');
        (item.choice_notes || []).forEach(function (note, i) {
          var li = el('li');
          var tv = (item.choice_truth && typeof item.choice_truth[i] === 'boolean') ? item.choice_truth[i] : (i === item.answer_index);
          li.appendChild(el('span', 'ox ' + (tv ? 'o' : 'x'), tv ? 'O' : 'X'));
          li.appendChild(el('span', null, stripNote(note)));
          ul.appendChild(li);
        });
        ex.appendChild(ul);
      }

      if (item.source) ex.appendChild(el('p', 'src', '출처 · ' + item.source));
      if (item.verified_note) ex.appendChild(el('p', 'verify', '검증 · ' + item.verified_note));
      root.appendChild(ex);

      var after = el('div', 'after');
      if (ok && state.wrong[item.id]) {
        after.appendChild(btn('btn btn-good', '오답노트에서 빼기', function () {
          delete state.wrong[item.id];
          saveState();
          toast('오답노트에서 뺐어요');
          renderChips();
          renderQuiz();
          renderBadges();
        }));
      }
      if (after.firstChild) { after.style.marginBottom = '9px'; root.appendChild(after); }
    }
    root.appendChild(quizNav(q));
  }

  function quizNav(q) {
    var last = q.idx + 1 >= q.ids.length;
    var nav = el('div', 'qnav');
    var prev = btn('btn btn-line', '◀ 이전', function () {
      if (q.idx <= 0) return;
      q.idx -= 1;
      q.anim = false;
      q.lastDelta = 0;
      q.lastPenalty = 0;
      renderQuiz();
      window.scrollTo(0, 0);
    }, { 'aria-label': '이전 문제' });
    if (q.idx <= 0) {
      prev.setAttribute('disabled', 'disabled');
      prev.setAttribute('aria-disabled', 'true');
    }
    var next = btn('btn btn-primary', last ? '결과 보기' : '다음 ▶', function () {
      if (last) {
        q.done = true;
      } else {
        q.idx += 1;
      }
      q.anim = false;
      q.lastDelta = 0;
      q.lastPenalty = 0;
      renderQuiz();
      window.scrollTo(0, 0);
    }, { 'aria-label': last ? '결과 보기' : '다음 문제' });
    nav.appendChild(prev);
    nav.appendChild(el('div', 'qnav-count', (q.idx + 1) + ' / ' + q.ids.length));
    nav.appendChild(next);
    return nav;
  }

  function stripNote(note) {
    return String(note).replace(/^[①②③④]\s*[OX]\s*[:：]?\s*/, '');
  }

  function answerQuiz(i) {
    var q = ui.quiz;
    if (!q || q.done) return;
    var item = Q_BY_ID[q.ids[q.idx]];
    if (!item) return;
    if (q.responses[item.id] != null) return;   /* 이미 푼 문항은 중복 집계하지 않음 */
    ensureDay();
    q.responses[item.id] = { p: i };
    var excluded = item.isG && item.law === 2;
    var ok = !excluded && (i === item.answer_index);
    if (excluded) {
      q.anim = true;
      q.lastDelta = 0;
      q.lastPenalty = 0;
      renderQuiz();
      return;
    }
    q.counted = (q.counted || 0) + 1;

    var st = state.stats[item.id] || { ok: 0, bad: 0 };
    if (ok) st.ok = (st.ok || 0) + 1; else st.bad = (st.bad || 0) + 1;
    state.stats[item.id] = st;

    if (!state.day.quiz[item.id]) state.day.quiz[item.id] = Date.now();

    var delta = 0, penalty = 0;
    if (ok) {
      q.correct += 1;
      q.combo = (q.combo || 0) + 1;
      q.wrongStreak = 0;
      var at = q.sessionWrong.indexOf(item.id);
      if (at >= 0) q.sessionWrong.splice(at, 1);
      delta = addPoints(P_QUIZ);
    } else {
      q.combo = 0;
      q.wrongStreak = (q.wrongStreak || 0) + 1;
      var w = state.wrong[item.id] || { n: 0 };
      w.n = (w.n || 0) + 1;
      w.ts = Date.now();
      state.wrong[item.id] = w;
      if (q.sessionWrong.indexOf(item.id) < 0) q.sessionWrong.push(item.id);
      if (q.wrongStreak >= 2) {
        penalty = addPoints(P_BAD);
        delta = penalty;
      }
    }
    q.lastDelta = delta;
    q.lastPenalty = penalty;
    q.anim = true;
    (function (ref) {
      window.setTimeout(function () { if (ui.quiz === ref) ref.anim = false; }, 900);
    })(q);

    checkMission();
    saveState();
    checkPromotion();

    renderChips();
    renderQuiz();
    renderBadges();
    var verdict = $('#view-quiz .verdict');
    if (verdict && verdict.scrollIntoView) {
      var vr = verdict.getBoundingClientRect();
      if (vr.top < 70 || vr.bottom > window.innerHeight - 70) {
        try { verdict.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { verdict.scrollIntoView(); }
      }
    }
  }

  function renderQuizResult(root) {
    var q = ui.quiz;
    var answeredTotal = answeredN(q);
    var graded = q.ids.filter(function (id) {
      var it = Q_BY_ID[id];
      return q.responses[id] != null && !(it && it.isG && it.law === 2);
    }).length;
    var total = graded || 1;
    var excludedN = answeredTotal - graded;
    var skipped = q.ids.length - answeredTotal;
    var p = pct(q.correct, total);
    var card = el('section', 'card sec score');
    card.appendChild(el('div', 'eyebrow', 'QUIZ RESULT'));

    var fig = el('img', 'score-fig');
    fig.src = p >= 80 ? BODY_IMG.good : BODY_IMG.cheer;
    fig.alt = '';
    fig.decoding = 'async';
    card.appendChild(fig);

    var big = el('div', 'pct', String(p));
    big.appendChild(el('small', null, '%'));
    card.appendChild(big);
    card.appendChild(el('div', 'st', '푼 문항 ' + answeredTotal + ' / 전체 ' + q.ids.length + ' · 정답 ' + q.correct + ' / ' + graded + '문항'));
    if (skipped || excludedN) {
      var subline = [];
      if (skipped) subline.push('안 푼 문항 ' + skipped);
      if (excludedN) subline.push('채점 제외 ' + excludedN);
      card.appendChild(el('p', 'st-sub', subline.join(' · ')));
    }

    var msg = '한 번 더 돌리면 훨씬 오래 남아요.';
    if (!answeredTotal) msg = '아직 푼 문항이 없어요. 문제를 풀거나 이전·다음으로 넘겨 보세요.';
    else if (p === 100) msg = '전부 정답이에요. 이 범위는 마무리해도 좋아요.';
    else if (p >= 80) msg = '합격선 감각이에요. 틀린 문항만 눌러 정리해요.';
    else if (p >= 60) msg = '절반은 넘겼어요. 선지별 근거를 한 번 더 읽어 보세요.';
    else msg = '틀린 문항이 오답노트에 저장됐어요. 해설부터 다시 보면 빨라요.';
    card.appendChild(el('p', 'msg', msg));
    root.appendChild(card);

    var acts = el('div', 'sec');
    var sessionWrongIds = q.sessionWrong.filter(function (id) {
      return !!Q_BY_ID[id];
    });
    if (sessionWrongIds.length) {
      acts.appendChild(btn('btn btn-primary', '이번에 틀린 ' + sessionWrongIds.length + '문항 다시 풀기', function () {
        startQuiz('normal', sessionWrongIds);
        renderQuiz();
        window.scrollTo(0, 0);
      }));
      acts.lastChild.style.marginBottom = '9px';
    }
    acts.appendChild(btn('btn btn-ghost', '같은 범위 새로 풀기', function () {
      startQuiz(q.mode, q.ids.slice(), { label: q.label });
      renderQuiz();
      window.scrollTo(0, 0);
    }));
    acts.lastChild.style.marginBottom = '9px';
    acts.appendChild(btn('btn btn-line', '오답노트 보기', function () { go('wrong'); }));
    root.appendChild(acts);
  }

  /* =========================================================
     8. 오답노트
     ========================================================= */
  function renderWrong() {
    var root = $('#view-wrong');
    clear(root);

    var wq = wrongIn(ui.subject);
    var uc = unsureIn(ui.subject);

    var head = el('section', 'card');
    head.appendChild(el('p', 'eyebrow', 'REVIEW'));
    head.appendChild(el('h3', null, '오답노트 · ' + SUBJ_NAME[ui.subject]));
    head.appendChild(el('p', 'muted', '사지선다 오답 ' + wq.length + '문항 · 헷갈린 카드 ' + uc.length + '장'));
    var acts = el('div', 'row');
    acts.style.marginTop = '12px';
    acts.appendChild(btn('btn btn-primary', '오답 퀴즈 (' + wq.length + ')', function () {
      startQuiz('wrong');
      go('quiz');
    }, wq.length ? null : { disabled: 'disabled' }));
    acts.appendChild(btn('btn btn-ghost', '헷갈린 카드 (' + uc.length + ')', function () {
      ui.cardFilter = 'unsure';
      ui.cardIndex = 0;
      ui.flipped = false;
      go('cards');
    }, uc.length ? null : { disabled: 'disabled' }));
    head.appendChild(acts);
    root.appendChild(head);

    if (!wq.length && !uc.length) {
      root.appendChild(emptyBlock(
        '아직 오답이 없어요',
        '사지선다에서 틀린 문제와 암기카드에서 「헷갈려요」로 표시한 카드가 여기에 과목별로 모입니다.',
        '사지선다 풀러 가기',
        function () { startQuiz('normal'); go('quiz'); }
      ));
      return;
    }

    if (wq.length) {
      var secQ = el('section', 'card sec');
      secQ.appendChild(el('h3', null, '사지선다 오답'));
      groupBySubject(wq).forEach(function (g) {
        secQ.appendChild(buildWrongGroup(g.name, g.items.map(function (item) {
          return wrongRow(item, function () {
            delete state.wrong[item.id];
            saveState();
            toast('오답노트에서 뺐어요');
            renderAll();
          });
        })));
      });
      root.appendChild(secQ);
    }

    if (uc.length) {
      var secC = el('section', 'card sec');
      secC.appendChild(el('h3', null, '헷갈린 암기카드'));
      groupBySubject(uc).forEach(function (g) {
        var rows = g.items.map(function (card) {
          var row = el('div', 'wn-item wn-stack');
          var main = el('button', 'wn-main wn-card');
          main.type = 'button';
          main.appendChild(el('p', 'wn-q', card.front));
          main.appendChild(el('div', 'wn-meta', (card.tags || []).slice(0, 3).join(' · ')));
          main.addEventListener('click', function () {
            ui.subject = card.subjectId;
            state.settings.subject = card.subjectId;
            ui.cardFilter = 'unsure';
            ui.cardIndex = 0;
            ui.flipped = false;
            saveState();
            go('cards');
          });
          row.appendChild(main);

          var foot = el('div', 'wn-foot');
          foot.appendChild(el('span', 'wn-hint', '카드를 누르면 바로 복습'));
          var acts2 = el('div', 'wn-acts');
          var done = btn('btn btn-good btn-sm', '외웠어요', function () {
            state.known[card.id] = Date.now();
            delete state.unsure[card.id];
            saveState();
            toast('외웠어요 ✓ 목록에서 뺐어요');
            renderAll();
          });
          acts2.appendChild(done);
          var x = btn('wn-x', '✕', function () {
            delete state.unsure[card.id];
            saveState();
            toast('헷갈림 표시를 해제했어요');
            renderAll();
          }, { 'aria-label': '헷갈림 표시 해제' });
          acts2.appendChild(x);
          foot.appendChild(acts2);
          row.appendChild(foot);
          return row;
        });
        secC.appendChild(buildWrongGroup(g.name, rows));
      });
      root.appendChild(secC);
    }
  }

  function buildWrongGroup(name, rows) {
    var g = el('div', 'wn-group');
    g.appendChild(el('h3', null, name));
    rows.forEach(function (r) { g.appendChild(r); });
    return g;
  }

  function groupBySubject(items) {
    var out = [];
    SUBJECTS.forEach(function (s) {
      var list = items.filter(function (x) { return x.subjectId === s.id; });
      if (list.length) out.push({ name: s.name, items: list });
    });
    return out;
  }

  function wrongRow(item, onRemove) {
    var row = el('div', 'wn-item');
    var main = el('div', 'wn-main');
    main.appendChild(el('p', 'wn-q', item.question));
    if (item.box) {
      var wbx = el('p', 'wn-box');
      wbx.textContent = item.box;
      main.appendChild(wbx);
    }
    var w = state.wrong[item.id] || { n: 1 };
    main.appendChild(el('div', 'wn-meta', '내 오답 ' + (w.n || 1) + '회 · 정답 ' + CIRCLED[item.answer_index]));
    row.appendChild(main);
    row.appendChild(btn('wn-x', '✕', onRemove, { 'aria-label': '오답노트에서 빼기' }));
    return row;
  }

  function emptyBlock(title, body, actionLabel, action) {
    var box = el('section', 'card empty sec');
    box.appendChild(el('div', 'eico', '🗂️'));
    box.appendChild(el('h3', null, title));
    box.appendChild(el('p', null, body));
    if (actionLabel && action) box.appendChild(btn('btn btn-ghost', actionLabel, action));
    return box;
  }

  /* =========================================================
     9. 설정 시트 · 초기화
     ========================================================= */
  function openSheet() {
    var body = $('#sheetBody');
    clear(body);

    var d = dayStats();
    var pts = Math.max(0, state.pts || 0);
    var lvl = rankIndexFor(pts);
    var rk = RANKS[lvl];
    var nx = RANKS[lvl + 1] || null;

    var rankCard = el('section', 'card');
    rankCard.appendChild(el('h3', null, '계급과 포인트'));
    rankCard.appendChild(kv('현재 계급', rk.name + ' · ' + fmt(pts) + 'P'));
    rankCard.appendChild(kv('다음 계급', nx ? (nx.name + ' · ' + fmt(nx.pts) + 'P까지 ' + fmt(nx.pts - pts) + 'P 남음') : '없음 · 최고 계급'));
    rankCard.appendChild(kv('오늘 할당량', '암기 ' + Math.min(d.cards, GOAL_CARDS) + '/' + GOAL_CARDS +
      ' · 사지선다 ' + Math.min(d.quiz, GOAL_QUIZ) + '/' + GOAL_QUIZ + (d.bonus ? ' · 보너스 완료' : '')));
    rankCard.appendChild(kv('포인트 규칙', '암기카드 외웠어요 +' + P_CARD + 'P(카드당 1일 1회) · 사지선다 정답 +' + P_QUIZ +
      'P · 2연속 오답부터 문항당 ' + P_BAD + 'P · 하루 할당량 완료 +' + P_BONUS + 'P'));
    body.appendChild(rankCard);

    var sum = el('section', 'card sec');
    sum.appendChild(el('h3', null, '학습 기록'));
    sum.appendChild(kv('암기카드', '외움 ' + countKnown('all') + '장 · 헷갈림 ' + countUnsure('all') + '장 / 전체 ' + CARDS.length + '장'));
    var rate = answerRate('all');
    sum.appendChild(kv('사지선다', '푼 문제 ' + solvedCount('all') + '문항 · 정답률 ' + rate.rate + '% · 오답 ' + wrongIn('all').length + '문항'));
    sum.appendChild(kv('저장 위치', '이 브라우저(localStorage)에만 저장 · 서버 전송 없음'));
    var reset = btn('btn btn-line', '학습 기록 초기화', function () { openResetModal(); });
    reset.style.marginTop = '13px';
    sum.appendChild(reset);
    body.appendChild(sum);

    var info = el('section', 'card sec');
    info.appendChild(el('h3', null, '시험 정보'));
    var eb = META.exam_basis || {};
    if (eb.subjects) info.appendChild(kv('문항 구성', eb.subjects));
    if (eb.ratios) info.appendChild(kv('과목 비중', eb.ratios));
    if (eb.pass_rule) info.appendChild(kv('합격 기준', eb.pass_rule));
    if (eb.note) info.appendChild(kv('일정', eb.note));
    body.appendChild(info);

    var crit = el('section', 'card sec');
    crit.appendChild(el('h3', null, '2026.10.2. 개정 핵심'));
    crit.appendChild(el('p', 'muted', META.critical_notice || ''));
    body.appendChild(crit);

    if (GQ.length) {
      var gsec = el('section', 'card sec');
      gsec.appendChild(el('h3', null, '실전 기출 데이터'));
      var gsolved = GQ.filter(function (x) { return !!state.stats[x.id]; }).length;
      var gexcl = GQ.filter(function (x) { return x.law === 2; }).length;
      var gnotice = GQ.filter(function (x) { return x.law === 1; }).length;
      gsec.appendChild(kv('수록 범위', '2022년 1차 ~ 2026년 2차 10회분 · 1,000문항(헌법 200 · 형사법 400 · 경찰학 400)'));
      gsec.appendChild(kv('내 진도', '푼 문항 ' + gsolved + ' / ' + GQ.length));
      gsec.appendChild(kv('정답 출처', '경찰청이 공개한 문제지·정답과 대조(2026년 2차는 가답안 기준)'));
      gsec.appendChild(kv('개정 표시', '채점 제외 ' + gexcl + '문항 · 개정 안내 ' + gnotice + '문항'));
      gsec.appendChild(el('p', 'muted', '모든 회차는 2026. 10. 2. 형사사법 개정 전에 시행된 시험입니다. 수사·공소 절차를 다룬 문항은 현행법과 달라질 수 있어 「채점 제외」·「개정 안내」 배지를 달았습니다.'));
      body.appendChild(gsec);
    }

    var laws = el('section', 'card sec');
    laws.appendChild(el('h3', null, '반영 법령'));
    var ul = el('ul', 'lawlist');
    (META.law_versions || []).forEach(function (l) { ul.appendChild(el('li', null, l)); });
    laws.appendChild(ul);
    body.appendChild(laws);

    if (EXCLUDED.length) {
      var exd = el('details', 'card sec');
      var s2 = el('summary');
      s2.appendChild(el('span', null, '이번 범위에서 뺀 항목 ' + EXCLUDED.length));
      exd.appendChild(s2);
      var db2 = el('div', 'dbody');
      EXCLUDED.forEach(function (x, i2) {
        var p = el('p', 'muted');
        p.style.margin = i2 ? '10px 0 0' : '0';
        p.appendChild(el('b', null, x.item + ' — '));
        p.appendChild(document.createTextNode(x.reason || ''));
        db2.appendChild(p);
      });
      exd.appendChild(db2);
      body.appendChild(exd);
    }

    var about = el('section', 'card sec');
    about.appendChild(el('h3', null, '이 앱'));
    about.appendChild(kv('구성', '단일 HTML 파일 · 외부 CDN 없음 · 오프라인 동작'));
    about.appendChild(kv('데이터', (META.title || '경찰공채 학습 데이터') + ' · ' + (META.generated_at || '')));
    about.appendChild(kv('검증 기준', META.verified_against || '-'));
    about.appendChild(kv('추가 방법', '홈 화면에 추가하면 앱처럼 전체 화면으로 열려요'));
    body.appendChild(about);

    $('#sheetOverlay').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    $('#sheetOverlay').hidden = true;
    document.body.style.overflow = '';
  }

  function openResetModal() {
    $('#modalBody').textContent = '외운 카드, 헷갈려요 표시, 오답노트, 퀴즈 기록과 포인트·계급이 모두 지워집니다. 되돌릴 수 없어요.';
    $('#modalOverlay').hidden = false;
  }
  function closeResetModal() { $('#modalOverlay').hidden = true; }

  function doReset() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = freshState();
    ensureDay();
    ui.subject = 'all';
    ui.cardFilter = 'all';
    ui.cardIndex = 0;
    ui.flipped = false;
    ui.quiz = null;
    ui.buddy = null;
    saveState();
    closeResetModal();
    closeSheet();
    renderAll();
    toast('학습 기록을 초기화했어요');
  }

  /* =========================================================
     10. 이벤트 · 시작
     ========================================================= */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { go(t.getAttribute('data-tab')); });
  });

  $('#btnSettings').addEventListener('click', openSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetOverlay').addEventListener('click', function (e) {
    if (e.target === $('#sheetOverlay')) closeSheet();
  });
  $('#modalCancel').addEventListener('click', closeResetModal);
  $('#modalOk').addEventListener('click', doReset);
  $('#modalOverlay').addEventListener('click', function (e) {
    if (e.target === $('#modalOverlay')) closeResetModal();
  });

  var promoOverlay = $('#promoOverlay');
  if (promoOverlay) {
    promoOverlay.addEventListener('click', function (e) {
      if (e.target === promoOverlay) closePromo();
    });
  }
  var promoOk = $('#promoOk');
  if (promoOk) promoOk.addEventListener('click', closePromo);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (promoOverlay && !promoOverlay.hidden) closePromo();
    else if (!$('#modalOverlay').hidden) closeResetModal();
    else if (!$('#sheetOverlay').hidden) closeSheet();
  });

  /* 칩바 스크롤 그림자 */
  var chipbar = $('#chipbar');
  window.addEventListener('scroll', function () {
    var on = window.scrollY > 4;
    chipbar.classList.toggle('stuck', on);
  }, { passive: true });

  /* 다크 모드 표식(일부 색 보정용) */
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
    applyTheme();
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
    else if (mq.addListener) mq.addListener(applyTheme);
  } catch (e) {}

  /* 브랜드 부제 */
  var bs = $('#brandSub');
  if (bs) bs.textContent = SUBJECTS.map(function (s) { return s.name; }).join(' · ') + ' · 카드 ' + CARDS.length + ' · 문항 ' + QUESTIONS.length;

  /* 명언 6초 롤링 */
  quoteTimer = window.setInterval(function () {
    if (document.hidden) return;
    if (ui.tab !== 'home') return;
    nextQuote();
  }, 6000);
  window.addEventListener('pagehide', function () {
    if (quoteTimer) clearInterval(quoteTimer);
  });

  /* 날짜가 바뀌면 하루 할당량 새로 시작 */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var before = state.day ? state.day.d : null;
    ensureDay();
    saveState();
    if (before !== state.day.d) renderAll();
  });

  ensureDay();
  saveState();
  renderAll();

  /* 리액션용 캐릭터 얼굴은 미리 받아 두어 전환이 끊기지 않게 */
  ['char-thumbsup-face.png', 'char-cheer-face.png'].forEach(function (f) {
    var im = new Image();
    im.src = './assets/' + f;
  });
})();
</script>
</body>
</html>
