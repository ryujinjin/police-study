제5항 위반 1년 이상 6년 이하 징역 또는 500만원 이상 3천만원 이하 벌금 ② 혈중알코올농도 0.2퍼센트 이상 2년 이상 6년 이하 징역 또는 1천만원 이상 3천만원 이하 벌금 ③ 0.03퍼센트 이상 0.2퍼센트 미만 1년 이상 5년 이하 징역 또는 500만원 이상 2천만원 이하 벌금. 제3항: 첫 위반 중 0.2퍼센트 이상은 2년 이상 5년 이하 징역 또는 1천만원 이상 2천만원 이하 벌금.","source":"도로교통법 제44조·제148조의2","verified_note":"law.go.kr 도로교통법 원문 대조(2026-11-21)","tags":["도로교통법","음주운전"]},{"id":"P20","front":"어린이보호구역의 속도 제한, 개인형 이동장치의定義, 교통사고 시 조치 의무는?","back":"제12조 제1항: 시장등은 유치원·초등학교·특수학교, 어린이집, 학원 등 시설·장소 주변도로의 일정 구간을 어린이 보호구역으로 지정하여 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있다. 제2조 제19호의2: 개인형 이동장치는 원동기장치자전거 중 시속 25킬로미터 이상으로 운행할 경우 전동기가 작동하지 아니하고 차체 중량이 30킬로그램 미만인 것. 제54조: 교통사고가 나면 운전자등은 즉시 정차하여 사상자 구호 등 필요한 조치를 하고 피해자에게 인적 사항을 제공하며, 경찰공무원 또는 가장 가까운 국가경찰관서에 사고 장소·사상자 수·부상 정도 등을 지체 없이 신고하여야 한다.","source":"도로교통법 제2조·제12조·제54조","verified_note":"law.go.kr 도로교통법 원문 대조(2026-11-21)","tags":["도로교통법","어린이보호구역","PM"]},{"id":"P21","front":"스토킹처벌법의 스토킹행위·스토킹범죄 정의, 긴급응급조치와 잠정조치, 법정형은?","back":"제2조: '스토킹행위'란 상대방의 의사에 반하여 정당한 이유 없이 접근·따라다니기, 주거등 부근에서 기다리거나 지켜보기, 우편·전화·정보통신망 등으로 물건·글·말·음향·영상 도달, 물건 등을 두는 행위, 주거등 부근 물건 훼손, 개인정보·위치정보 제공·배포·게시, 상대방인 것처럼 가장하는 행위로 상대방에게 불안감·공포심을 일으키는 것. '스토킹범죄'는 지속적 또는 반복적으로 스토킹행위를 하는 것. 제4조: 사법경찰관은 100미터 이내 접근 금지, 전기통신을 이용한 접근 금지를 할 수 있고(긴급응급조치), 제5조에 따라 검사가 48시간 이내 사후승인을 청구하며 기간은 1개월을 초과할 수 없다. 제9조 잠정조치: 서면 경고, 100미터 이내 접근 금지, 전기통신 접근 금지, 전자장치 부착, 국가경찰관서 유치장·구치소 유치(병과 가능). 기간은 접근 금지·전기통신 접근 금지·전자장치 부착이 3개월(2회에 한정하여 각 3개월 연장 가능), 유치장·구치소 유치가 1개월이다. 제18조: 스토킹범죄는 3년 이하 징역 또는 3천만원 이하 벌금, 흉기 등 위험한 물건을 휴대·이용하면 5년 이하 징역 또는 5천만원 이하 벌금.","source":"스토킹범죄의 처벌 등에 관한 법률 제2조·제4조·제5조·제9조·제18조","verified_note":"law.go.kr 스토킹처벌법(법률 제21998호, 시행 2026.10.2.) 원문 대조(2026-11-21). 제18조 제3항(반의사불벌)은 2023.7.11. 삭제됨을 확인.","tags":["스토킹처벌법","잠정조치"]}],"questions":[{"id":"PQ01","question":"경찰관 직무집행법 제3조에 따른 불심검문에 관한 설명으로 옳은 것은?","choices":["동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다.","동행을 요구받은 사람은 그 요구를 거절할 수 없다.","흉기를 가지고 있는지 조사할 수 없다.","동행한 사람을 3시간을 초과하여 경찰관서에 머물게 할 수 없다."],"answer_index":0,"explanation":"제3조 제6항은 경찰관은 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정한다.","choice_notes":["① O: 조문 그대로이다.","② X: 제2항 후단은 요구를 거절할 수 있다고 규정한다.","③ X: 제3항이 흉기 소지 조사를 허용한다.","④ X: 3시간이 아니라 6시간이다."],"source":"경찰관 직무집행법 제3조","verified_note":"law.go.kr 경찰관 직무집행법 제3조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ02","question":"경찰관 직무집행법 제4조의 보호조치에 관한 설명으로 옳은 것은?","choices":["경찰관서에서 보호하는 기간은 24시간, 위험물 임시영치 기간은 10일을 초과할 수 없다.","위험물 임시영치 기간은 30일을 초과할 수 없다.","경찰관서에서 보호하는 기간은 48시간을 초과할 수 없다.","본인이 구호를 거절하는 경우에도 보호조치를 하여야 한다."],"answer_index":0,"explanation":"제4조 제7항은 구호대상자를 경찰관서에서 보호하는 기간은 24시간을 초과할 수 없고, 물건을 임시로 영치하는 기간은 10일을 초과할 수 없다고 규정한다.","choice_notes":["① O: 조문 그대로이다.","② X: 10일이다.","③ X: 24시간이다.","④ X: 제1항 제3호 단서는 본인이 구호를 거절하면 제외한다."],"source":"경찰관 직무집행법 제4조","verified_note":"law.go.kr 경찰관 직무집행법 제4조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ03","question":"경찰관 직무집행법 제11조의2에 따른 손실보상 청구권의 시효는?","choices":["손실이 있음을 안 날부터 5년, 손실이 발생한 날부터 10년","손실이 발생한 날부터 3년","손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년","손실이 있음을 안 날부터 1년, 손실이 발생한 날부터 3년"],"answer_index":2,"explanation":"제11조의2 제2항은 보상 청구권이 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효의 완성으로 소멸한다고 규정한다.","choice_notes":["① X: 5년·10년이 아니다.","② X: 주관적 기산점(안 날)과 객관적 기산점(발생한 날)이 모두 규정되어 있다.","③ O: 조문 그대로이다.","④ X: 기간이 다르다."],"source":"경찰관 직무집행법 제11조의2 제2항","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ04","question":"경찰관 직무집행법 제10조의4에 따라 범인 등이 무기·흉기 등 위험한 물건을 지니고 계속 항거할 때 무기 사용이 허용되기 위한 명령 횟수는?","choices":["3회 이상","1회 이상","2회 이상","5회 이상"],"answer_index":0,"explanation":"제10조의4 제1항 제2호 라목은 범인이나 소요를 일으킨 사람이 무기·흉기 등 위험한 물건을 지니고 경찰관으로부터 '3회 이상' 물건을 버리라는 명령이나 항복하라는 명령을 받고도 따르지 아니하면서 계속 항거할 때를 규정한다.","choice_notes":["① O: 3회 이상.","② X: 1회로는 부족하다.","③ X: 2회로는 부족하다.","④ X: 5회가 아니다."],"source":"경찰관 직무집행법 제10조의4","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ05","question":"국가경찰위원회의 구성으로 옳은 것은?","choices":["위원장 1명을 포함한 7명 중 위원장과 5명은 비상임, 1명은 상임","위원장 1명을 포함한 7명 중 위원장과 1명은 상임, 5명은 비상임","위원장 1명을 포함한 5명 전원 비상임","위원장 1명을 포함한 9명 중 3명은 상임"],"answer_index":0,"explanation":"제7조 제2항은 국가경찰위원회를 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장 및 5명의 위원은 비상임으로 하고 1명의 위원은 상임으로 한다고 규정한다.","choice_notes":["① O: 국가경찰위원회의 구성이다.","② X: 이는 시·도자치경찰위원회의 구성이다.","③ X: 5명이 아니다.","④ X: 9명은 헌법재판소·중앙선관위 구성이다."],"source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제7조 제2항","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","difficulty":"상"},{"id":"PQ06","question":"시·도자치경찰위원회 위원의 임명에 관한 설명으로 옳지 않은 것은?","choices":["국가경찰위원회가 추천하는 1명을 시·도지사가 임명한다.","경찰청장이 지명하는 2명을 시·도지사가 임명한다.","해당 시·도 교육감이 추천하는 1명을 시·도지사가 임명한다.","시·도의회가 추천하는 2명을 시·도지사가 임명한다."],"answer_index":1,"explanation":"제20조 제1항의 추천 주체는 시·도의회 2명, 국가경찰위원회 1명, 교육감 1명, 시·도자치경찰위원회 위원추천위원회 2명, 시·도지사 지명 1명이다. 경찰청장이 지명하는 2명은 없다.","choice_notes":["① X: 국가경찰위원회 추천 1명.","② O: 경찰청장 지명 규정이 없다.","③ X: 교육감 추천 1명.","④ X: 시·도의회 추천 2명."],"source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제20조 제1항","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","difficulty":"상"},{"id":"PQ07","question":"경찰청장의 임기와 임명절차에 관한 설명으로 옳은 것은?","choices":["임기 2년, 중임할 수 없다.","임기 2년, 횟수 제한 없이 연임할 수 있다.","임기 4년, 중임할 수 없다.","임기 3년, 1차에 한하여 중임할 수 있다."],"answer_index":0,"explanation":"제14조 제4항은 경찰청장의 임기를 2년으로 하고 중임할 수 없다고 규정한다. 임명은 국가경찰위원회의 동의를 받아 행정안전부장관의 제청으로 국무총리를 거쳐 대통령이 하며 국회 인사청문을 거친다.","choice_notes":["① O: 2년·중임 불가.","② X: 중임할 수 없다.","③ X: 임기는 2년이다.","④ X: 중임이 허용되지 않는다."],"source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제14조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ08","question":"국가수사본부장에 관한 설명으로 옳지 않은 것은?","choices":["임기는 3년이며 연임할 수 있다.","임기가 끝나면 당연히 퇴직한다.","임기는 2년으로 하며 중임할 수 없다.","치안정감으로 보한다."],"answer_index":0,"explanation":"제16조는 국가수사본부장을 치안정감으로 보하고, 임기를 2년으로 하며 중임할 수 없고, 임기가 끝나면 당연히 퇴직한다고 규정한다. ①가 틀린 설명이다.","choice_notes":["① O: 임기 2년·중임 불가이다.","② X: 제16조 제4항.","③ X: 제16조 제3항.","④ X: 제16조 제1항."],"source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제16조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ09","question":"경찰공무원법상 시보임용에 관한 설명으로 옳은 것은?","choices":["경정 이하 신규채용 시 6개월간 시보로 임용한다.","경정 이하 신규채용 시 1년간 시보로 임용하고, 그 기간이 만료된 다음 날 정규 경찰공무원으로 임용한다.","시보임용기간 중에는 근무성적이 불량하여도 면직할 수 없다.","징계에 의한 정직·감봉 기간도 시보임용기간에 산입한다."],"answer_index":1,"explanation":"제13조 제1항은 경정 이하의 경찰공무원을 신규 채용할 때에는 1년간 시보로 임용하고, 그 기간이 만료된 다음 날에 정규 경찰공무원으로 임용한다고 규정한다.","choice_notes":["① X: 6개월이 아니라 1년이다.","② O: 조문 그대로이다.","③ X: 제13조 제3항은 근무성적·교육훈련성적이 불량하면 면직시킬 수 있다고 규정한다.","④ X: 제13조 제2항은 정직·감봉 기간을 산입하지 않는다."],"source":"경찰공무원법 제13조","verified_note":"law.go.kr 경찰공무원법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"PQ10","question":"경찰공무원의 정년에 관한 설명으로 옳은 것은?","choices":["정년이 1월~6월 사이에 있으면 12월 31일에 당연퇴직한다.","연령정년은 65세이다.","계급정년은 모든 계급에 동일하게 10년이다.","연령정년은 60세이고, 계급정년은 치안감 4년·경무관 6년·총경 11년·경정 14년이다."],"answer_index":3,"explanation":"제30조 제1항은 연령정년을 60세로, 계급정년을 치안감 4년·경무관 6년·총경 11년·경정 14년으로 규정한다.","choice_notes":["① X: 1월~6월은 6월 30일, 7월~12월은 12월 31일에 당연퇴직한다.","② X: 60세이다.","③ X: 계급별로 다르다.","④ O: 조문 그대로이다."],"source":"경찰공무원법 제30조","verified_note":"law.go.kr 경찰공무원법 원문 대조(2026-11-21)","difficulty":"상"},{"id":"PQ11","question":"경찰공무원법 제16조의 근속승진 기간으로 옳은 것은?","choices":["순경→경장 4년, 경장→경사 5년, 경사→경위 6년 6개월, 경위→경감 8년","순경→경장 5년, 경장→경사 6년","순경→경장 2년, 경장→경사 3년","모든 계급 3년"],"answer_index":0,"explanation":"제16조 제1항은 순경을 경장으로 4년 이상, 경장을 경사로 5년 이상, 경사를 경위로 6년 6개월 이상, 경위를 경감으로 8년 이상 근속한 사람을 각각 근속승진임용할 수 있다고 규정한다.","choice_notes":["① O: 조문 그대로이다.","② X: 기간이 다르다.","③ X: 기간이 다르다.","④ X: 계급별로 다르다."],"source":"경찰공무원법 제16조","verified_note":"law.go.kr 경찰공무원법 원문 대조(2026-11-21)","difficulty":"상"},{"id":"PQ12","question":"도로교통법상 술에 취한 상태의 운전 금지 기준(혈중알코올농도)은?","choices":["0.03퍼센트 이상","0.01퍼센트 이상","0.08퍼센트 이상","0.05퍼센트 이상"],"answer_index":0,"explanation":"도로교통법 제44조 제4항은 운전이 금지되는 술에 취한 상태의 기준을 운전자의 혈중알코올농도가 0.03퍼센트 이상인 경우로 규정한다.","choice_notes":["① O: 0.03퍼센트 이상.","② X: 0.01퍼센트 기준은 없다.","③ X: 0.08퍼센트는 이 조문의 형사처벌 기준이 아니다.","④ X: 0.05퍼센트는 기준이 아니다."],"source":"도로교통법 제44조 제4항","verified_note":"law.go.kr 도로교통법 원문 대조(2026-11-21)","difficulty":"하"},{"id":"PQ13","question":"도로교통법 제12조 제1항에 따라 어린이 보호구역에서 제한할 수 있는 통행속도는?","choices":["시속 50킬로미터 이내","시속 40킬로미터 이내","시속 20킬로미터 이내","시속 30킬로미터 이내"],"answer_index":3,"explanation":"제12조 제1항은 시장등이 어린이 보호구역을 지정하여 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있다고 규정한다.","choice_notes":["① X: 50킬로미터가 아니다.","② X: 40킬로미터가 아니다.","③ X: 20킬로미터가 아니다.","④ O: 30킬로미터 이내."],"source":"도로교통법 제12조 제1항","verified_note":"law.go.kr 도로교통법 원문 대조(2026-11-21)","difficulty":"하"},{"id":"PQ14","question":"스토킹처벌법 제18조의 법정형에 관한 설명으로 옳은 것은?","choices":["스토킹범죄는 3년 이하 징역 또는 3천만원 이하 벌금이고, 흉기 등 위험한 물건을 휴대·이용하면 5년 이하 징역 또는 5천만원 이하 벌금이다.","스토킹범죄는 반의사불벌죄이므로 피해자가 원하지 않으면 처벌할 수 없다.","흉기를 이용한 스토킹범죄는 3년 이하 징역이다.","스토킹범죄는 1년 이하 징역 또는 1천만원 이하 벌금이다."],"answer_index":0,"explanation":"제18조 제1항은 스토킹범죄를 저지른 사람을 3년 이하의 징역 또는 3천만원 이하의 벌금에, 제2항은 흉기 또는 그 밖의 위험한 물건을 휴대하거나 이용하여 스토킹범죄를 저지른 사람을 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다고 규정한다.","choice_notes":["① O: 조문 그대로이다.","② X: 반의사불벌 규정(제18조 제3항)은 2023.7.11. 삭제되었다.","③ X: 5년 이하 징역이다.","④ X: 형량이 낮다."],"source":"스토킹범죄의 처벌 등에 관한 법률 제18조","verified_note":"law.go.kr 스토킹처벌법 원문 대조(2026-11-21). 제3항 '삭제 <2023.7.11.>' 확인","difficulty":"중"},{"id":"PQ15","question":"스토킹처벌법 제9조의 잠정조치 기간에 관한 설명으로 옳은 것은?","choices":["접근 금지 등 잠정조치는 3개월, 유치장 유치는 1개월을 초과할 수 없고, 접근 금지 등은 2회에 한정하여 각 3개월 연장할 수 있다.","잠정조치는 연장할 수 없다.","접근 금지 등 잠정조치는 1개월, 유치장 유치는 3개월을 초과할 수 없다.","잠정조치는 병과할 수 없다."],"answer_index":0,"explanation":"제9조 제7항은 제1항 제2호·제3호·제3호의2에 따른 잠정조치 기간은 3개월, 같은 항 제4호(유치)에 따른 기간은 1개월을 초과할 수 없고, 법원은 피해자 보호를 위하여 제2호·제3호·제3호의2의 잠정조치에 대하여 두 차례에 한정하여 각 3개월의 범위에서 연장할 수 있다고 규정한다.","choice_notes":["① O: 조문 그대로이다.","② X: 2회 연장이 가능하다.","③ X: 기간이 뒤바뀌었다.","④ X: 제9조 제2항은 잠정조치를 병과할 수 있다고 규정한다."],"source":"스토킹범죄의 처벌 등에 관한 법률 제9조","verified_note":"law.go.kr 스토킹처벌법 원문 대조(2026-11-21)","difficulty":"상"}]}],"excluded_or_held":[{"item":"2024~2026년 순경 공채 기출문제 원문 대조","reason":"경찰청 인터넷 원서접수 사이트(gosi.police.go.kr) 자료실의 문제·정답 공개 자료는 접근 절차(공고·자료실)가 필요하여 이번 작업에서 원문을 확보하지 못했다. 대신 '최신 개정 법령·판례를 정확히 반영한 문항' 요건에 따라 조문·판례 원문으로 검증한 문항만 수록했다. 기출 원문 대조는 별도 확보 후 추가 검증이 필요하다."},{"item":"2026.10.2. 이전 법령 기준의 수사·영장·기소 파트 기출 문항","reason":"2026.8.4. 형사소송법 개정   /* =========================================================
     1. 저장 상태

  function freshState() {
    return {
      v: 1,
      known: {},     // cardId: ts
      unsure: {},    // cardId: ts
      wrong: {},     // questionId: { n, ts }
      stats: {},     // questionId: { ok, bad }
      pts: 0,        // 보유 포인트
      rankSeen: 0,   // 이미 축하한 최고 계급 index
      day: null,     // { d, cards:{}, quiz:{}, bonus, earn }
      settings: { subject: 'all', order: 'seq' }
    };
  }

  function prune(s) {
    Object.keys(s.known).forEach(function (id) { if (!CARD_BY_ID[id]) delete s.known[id]; });
    Object.keys(s.unsure).forEach(function (id) { if (!CARD_BY_ID[id]) delete s.unsure[id]; });
    Object.keys(s.wrong).forEach(function (id) { if (!Q_BY_ID[id]) delete s.wrong[id]; });
    Object.keys(s.stats).forEach(function (id) { if (!Q_BY_ID[id]) delete s.stats[id]; });
    Object.keys(s.known).forEach(function (id) { if (s.unsure[id]) delete s.unsure[id]; });
  }

  function loadState() {
    var s = freshState();
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          ['known', 'unsure', 'wrong', 'stats'].forEach(function (k) {
            if (p[k] && typeof p[k] === 'object' && !Array.isArray(p[k])) s[k] = p[k];
          });
          if (typeof p.pts === 'number' && isFinite(p.pts) && p.pts >= 0) s.pts = Math.floor(p.pts);
          if (typeof p.rankSeen === 'number' && isFinite(p.rankSeen) && p.rankSeen >= 0) {
            s.rankSeen = Math.min(RANKS.length - 1, Math.floor(p.rankSeen));
          }
          if (p.day && typeof p.day === 'object' && typeof p.day.d === 'string') {
            s.day = {
              d: p.day.d,
              cards: (p.day.cards && typeof p.day.cards === 'object') ? p.day.cards : {},
              quiz: (p.day.quiz && typeof p.day.quiz === 'object') ? p.day.quiz : {},
              bonus: !!p.day.bonus,
              earn: (typeof p.day.earn === 'number' && isFinite(p.day.earn)) ? p.day.earn : 0
            };
          }
          if (p.settings && typeof p.settings === 'object') {
            if (typeof p.settings.subject === 'string') s.settings.subject = p.settings.subject;
            if (p.settings.order === 'shuffle' || p.settings.order === 'seq') s.settings.order = p.settings.order;
          }
        }
      }
    } catch (e) { /* 저장소를 쓸 수 없으면 메모리에서만 동작 */ }
    prune(s);
    return s;
  }

  function saveState() {

  /* =========================================================

  function $(sel) { return document.querySelector(sel); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function btn(cls, label, onClick, attrs) {
    var b = el('button', cls);
    b.type = 'button';
    if (label) b.textContent = label;
    if (onClick) b.addEventListener('click', onClick);
    if (attrs) Object.keys(attrs).forEach(function (k) { b.setAttribute(k, attrs[k]); });
    return b;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  function fmt(n) {
    return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function cardsIn(subjectId) {
    return CARDS.filter(function (c) { return subjectId === 'all' || c.subjectId === subjectId; });
  }
  function questionsIn(subjectId) {
    return QUESTIONS.filter(function (q) { return subjectId === 'all' || q.subjectId === subjectId; });
  }
  function countKnown(subjectId) {
    return cardsIn(subjectId).filter(function (c) { return !!state.known[c.id]; }).length;
  }
  function countUnsure(subjectId) {
    return cardsIn(subjectId).filter(function (c) { return !!state.unsure[c.id]; }).length;
  }
  function wrongIn(subjectId) {
    return questionsIn(subjectId).filter(function (q) { return !!state.wrong[q.id]; });
  }
  function unsureIn(subjectId) {
    return cardsIn(subjectId).filter(function (c) { return !!state.unsure[c.id]; });
  }
  function solvedCount(subjectId) {
    return questionsIn(subjectId).filter(function (q) { return !!state.stats[q.id]; }).length;
  }
  function answerRate(subjectId) {
    var ok = 0, bad = 0;
    questionsIn(subjectId).forEach(function (q) {
      var st = state.stats[q.id];
      if (st) { ok += st.ok || 0; bad += st.bad || 0; }
    });
    var total = ok + bad;
    return { ok: ok, bad: bad, total: total, rate: total ? Math.round((ok / total) * 100) : 0 };
  }

  function revBadge(card) {
    var tags = card.tags || [];
    for (var i = 0; i < tags.length; i++) {
      if (REV_LABEL[tags[i]]) return REV_LABEL[tags[i]];
    }
    return null;
  }

  function progressBar(ratio, cls) {
    var bar = el('div', 'bar' + (cls ? ' ' + cls : ''));
    var fill = el('i');
    fill.style.width = Math.max(0, Math.min(100, ratio)) + '%';
    bar.appendChild(fill);
    return bar;
  }

  function insigniaHTML(rank) {
    var s = '';
    for (var i = 0; i < (rank.star || 0); i++) s += SVG_STAR;
    for (var j = 0; j < (rank.flower || 0); j++) s += SVG_FLOWER;
    return s;
  }

  /* =========================================================
     3. 포인트 · 계급 · 하루 할당량
     ========================================================= */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function freshDay() {
    return { d: todayKey(), cards: {}, quiz: {}, bonus: false, earn: 0 };
  }

  function ensureDay() {
    if (!state.day || state.day.d !== todayKey()) state.day = freshDay();
    if (!state.day.cards || typeof state.day.cards !== 'object') state.day.cards = {};
    if (!state.day.quiz || typeof state.day.quiz !== 'object') state.day.quiz = {};
    if (typeof state.day.earn !== 'number' || !isFinite(state.day.earn)) state.day.earn = 0;
  }

  function addPoints(n) {
    ensureDay();
    var before = Math.max(0, state.pts || 0);
    var after = Math.max(0, before + n);
    var delta = after - before;
    state.pts = after;
    state.day.earn = (state.day.earn || 0) + delta;
    return delta;
  }

  function rankIndexFor(pts) {
    var i = 0;
    for (var k = 0; k < RANKS.length; k++) {
      if (pts >= RANKS[k].pts) i = k;
    }
    return i;
  }

  function dayStats() {
    ensureDay();
    return {
      cards: Object.keys(state.day.cards).length,
      quiz: Object.keys(state.day.quiz).length,
      bonus: !!state.day.bonus,
      earn: state.day.earn || 0
    };
  }

  function checkMission() {
    var d = dayStats();
    if (d.bonus || d.cards < GOAL_CARDS || d.quiz < GOAL_QUIZ) return false;
    state.day.bonus = true;
    var got = addPoints(P_BONUS);
    saveState();
    toast('오늘 할당량 완료! +' + got + 'P 🎉');
    return true;
  }

  function showPromo(level) {
    var box = $('#promoOverlay');
    if (!box || level < 1) return;
    var rk = RANKS[level];
    var nx = RANKS[level + 1] || null;
    var pts = Math.max(0, state.pts || 0);

    var title = $('#promoTitle');
    if (title) title.textContent = RANKS[level - 1].name + ' → ' + rk.name;

    var ins = $('#promoInsignia');

    box.hidden = false;
    document.body.style.overflow = 'hidden';

    if (box) box.hidden = true;
    document.body.style.overflow = '';

  function checkPromotion() {
    var i = rankIndexFor(Math.max(0, state.pts || 0));

      saveState();
      setTimeout(function () { showPromo(i); }, 420);

  function greetLine() {
    var h = new Date().getHours();
    if (h < 5) return '이 시간까지 공부 중이야? 한 장만 더 하고 자자';
    if (h < 11) return '좋은 아침! 오늘 10분부터 가볍게 시작해';
    if (h < 17) return '점심 먹고 한 장, 딱 좋은 타이밍이야';
    if (h < 22) return '오늘 하루도 수고했어, 10분만 더!';

  function go(tab) {
    if (['home', 'cards', 'quiz', 'wrong'].indexOf(tab) < 0) tab = 'home';

    if (tab === 'quiz' && (!ui.quiz || ui.quiz.subject !== ui.subject)) startQuiz('normal');

    window.scrollTo(0, 0);

  function setSubject(id) {
    if (id !== 'all' && !SUBJ_NAME[id]) return;
    ui.subject = id;
    state.settings.subject = id;
    ui.cardIndex = 0;
    ui.flipped = false;
    ui.buddy = null;
    if (ui.quiz && ui.quiz.subject !== id) startQuiz(ui.quiz.mode === 'wrong' ? 'wrong' : 'normal');
    saveState();
    renderAll();
  }

  function renderAll() {
    ensureDay();
    renderChips();
    ['home', 'cards', 'quiz', 'wrong'].forEach(function (v) {
      var node = $('#view-' + v);
      if (node) node.hidden = (ui.tab !== v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === ui.tab));
    });
    if (ui.tab === 'home') renderHome();
    if (ui.tab === 'cards') renderCards();
    if (ui.tab === 'quiz') renderQuiz();
    if (ui.tab === 'wrong') renderWrong();
    renderBadges();

  function buildHero() {
    var pts = Math.max(0, state.pts || 0);
    var lvl = rankIndexFor(pts);
    var rk = RANKS[lvl];
    var nx = RANKS[lvl + 1] || null;
    var d = dayStats();

    var hero = el('section', 'card hero');
    var top = el('div', 'hero-top');
    var copy = el('div', 'hero-copy');

    copy.appendChild(el('p', 'eyebrow', '나의 계급'));

    var rl = el('div', 'rank-line');
    rl.appendChild(el('span', 'rank-name', rk.name));
    var ins = el('span', 'insignia');
    ins.innerHTML = insigniaHTML(rk);
    rl.appendChild(ins);
    copy.appendChild(rl);

    copy.appendChild(el('p', 'hero-greet', greetLine()));

    var ps = el('div', 'pscore');
    ps.appendChild(el('b', null, fmt(pts)));
    ps.appendChild(el('span', null, 'P'));
    if (d.earn) {
      ps.appendChild(el('span', 'earn', '오늘 ' + (d.earn > 0 ? '+' : '') + fmt(d.earn) + 'P'));
    }
    copy.appendChild(ps);

    var ratio, nextLabel;
    if (nx) {
      var base = rk.pts, span = nx.pts - base;
      ratio = Math.max(0, Math.min(100, ((pts - base) / span) * 100));
      nextLabel = '다음 ' + nx.name + '까지 ' + fmt(nx.pts - pts) + 'P';
    } else {
      ratio = 100;
      nextLabel = '최고 계급이에요. 이제 실전만 남았어요!';
    }
    var bar = el('div', 'rank-bar');
    var fill = el('i');
    fill.style.width = ratio + '%';
    bar.appendChild(fill);
    copy.appendChild(bar);
    copy.appendChild(el('p', 'rank-next', nextLabel));

    top.appendChild(copy);

    var fig = el('div', 'hero-fig');
    var img = el('img');
    img.src = BODY_IMG.base;
    img.alt = '경찰 제복을 입고 경례하는 캐릭터';
    img.width = 74;
    img.height = 146;
    img.decoding = 'async';
    fig.appendChild(img);
    top.appendChild(fig);

    hero.appendChild(top);
    return hero;
  }

  function buildMission() {
    var d = dayStats();
    var cN = Math.min(GOAL_CARDS, d.cards);
    var qN = Math.min(GOAL_QUIZ, d.quiz);
    var done = d.cards >= GOAL_CARDS && d.quiz >= GOAL_QUIZ;

    var card = el('section', 'card sec mission' + (done ? ' done' : ''));
    var head = el('div', 'mhead');
    head.appendChild(el('h3', null, '오늘의 할당량'));
    head.appendChild(el('span', 'bonus', done ? '완료 +' + P_BONUS + 'P' : '다 채우면 +' + P_BONUS + 'P'));
    card.appendChild(head);

    card.appendChild(progressRow('암기카드', cN + ' / ' + GOAL_CARDS + '장', (cN / GOAL_CARDS) * 100,
      cN >= GOAL_CARDS ? '오늘 몫 완료 ✓' : '남은 ' + (GOAL_CARDS - cN) + '장', cN >= GOAL_CARDS ? 'good' : ''));
    card.appendChild(progressRow('사지선다', qN + ' / ' + GOAL_QUIZ + '문항', (qN / GOAL_QUIZ) * 100,
      qN >= GOAL_QUIZ ? '오늘 몫 완료 ✓' : '남은 ' + (GOAL_QUIZ - qN) + '문항', qN >= GOAL_QUIZ ? 'good' : ''));

    card.appendChild(el('p', 'mission-foot', done
      ? '오늘 할당량 완료! 보너스 ' + P_BONUS + 'P 받았어요 🎉'
      : '둘 다 채우면 +' + P_BONUS + 'P · 지금 ' + fmt(state.pts || 0) + 'P'));
    return card;
  }

  function progressRow(title, value, ratio, sub, cls) {
    var w = el('div', 'prow');
    var head = el('div', 'prow-head');
    head.appendChild(el('span', 'prow-title', title));
    head.appendChild(el('span', 'prow-val', value));
    w.appendChild(head);
    w.appendChild(progressBar(ratio, cls));
    w.appendChild(el('div', 'prow-sub', sub));
    return w;
  }

  function kv(k, v) {
    var row = el('div', 'kv');
    row.appendChild(el('span', 'k', k));
    row.appendChild(el('span', 'v', v));
    return row;
  }

  /* =========================================================
     6. 암기카드
     ========================================================= */
  function deckCards() {
    return CARDS.filter(function (c) {
      if (ui.subject !== 'all' && c.subjectId !== ui.subject) return false;
      var known = !!state.known[c.id], unsure = !!state.unsure[c.id];
      if (ui.cardFilter === 'todo') return !known;
      if (ui.cardFilter === 'unsure') return unsure;
      if (ui.cardFilter === 'known') return known;
      return true;
    });
  }

  function cardsBuddy() {
    if (ui.buddy) return ui.buddy;
    var d = dayStats();
    return {
      kind: 'base',
      line: CARD_LINES[ui.cardIndex % CARD_LINES.length],
      sub: '오늘 암기 ' + Math.min(d.cards, GOAL_CARDS) + '/' + GOAL_CARDS + ' · 보유 ' + fmt(state.pts || 0) + 'P'
    };
  }

  var buddyTimer = null;
  function setCardBuddy(info) {
    ui.buddy = info;
    if (buddyTimer) { clearTimeout(buddyTimer); buddyTimer = null; }
    buddyTimer = window.setTimeout(function () {
      buddyTimer = null;
      ui.buddy = null;
      if (ui.tab === 'cards') {
        var slot = $('#buddySlot');
        if (slot) {
          clear(slot);
          slot.appendChild(buddyEl(cardsBuddy(), {}));
        }
      }
    }, 3000);
  }

  function renderCards() {
    var root = $('#view-cards');
    clear(root);

    var all = cardsIn(ui.subject);
    var knownN = countKnown(ui.subject);
    var deck = deckCards();
    if (ui.cardIndex >= deck.length) ui.cardIndex = 0;

    /* 캐릭터 버디 */
    var slot = el('div');
    slot.id = 'buddySlot';
    slot.appendChild(buddyEl(cardsBuddy(), { pop: !!ui.buddy && !!ui.buddy.pop, float: ui.buddy && ui.buddy.float }));
    root.appendChild(slot);

    /* 필터 */
    var filters = el('div', 'deckbar');
    FILTERS.forEach(function (f) {
      var n = 0;
      all.forEach(function (c) {
        var known = !!state.known[c.id], unsure = !!state.unsure[c.id];
        if (f.id === 'all') n++;
        else if (f.id === 'todo' && !known) n++;
        else if (f.id === 'unsure' && unsure) n++;
        else if (f.id === 'known' && known) n++;
      });
      var b = el('button', 'fchip', f.name + ' ' + n);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(ui.cardFilter === f.id));
      b.addEventListener('click', function () {
        ui.cardFilter = f.id;
        ui.cardIndex = 0;
        ui.flipped = false;
        renderCards();
      });
      filters.appendChild(b);
    });
    root.appendChild(filters);

    var meta = el('div', 'deck-meta');
    meta.appendChild(el('span', 'dm-l', SUBJ_NAME[ui.subject] + ' · 남은 ' + (all.length - knownN) + '장'));
    meta.appendChild(el('span', 'dm-r', deck.length ? (ui.cardIndex + 1) + ' / ' + deck.length : '0 / 0'));
    root.appendChild(meta);
    root.appendChild(progressBar(all.length ? pct(knownN, all.length) : 0, 'good'));

    if (!deck.length) {
      root.appendChild(emptyBlock(
        ui.cardFilter === 'unsure' ? '헷갈려요로 표시한 카드가 없어요'
          : ui.cardFilter === 'known' ? '아직 외움 표시한 카드가 없어요'
            : ui.cardFilter === 'todo' ? '이 과목 카드를 다 외웠어요 🎉'
              : '표시할 카드가 없어요',
        ui.cardFilter === 'all' ? '과목을 바꾸거나 다른 필터를 눌러 보세요.' : '다른 필터로 바꾸면 카드가 보여요.',
        '전체 카드 보기',
        function () { ui.cardFilter = 'all'; ui.cardIndex = 0; ui.flipped = false; renderCards(); }
      ));
      return;
    }

    var card = deck[ui.cardIndex];
    root.appendChild(buildFlashcard(card));

    /* 표시 버튼 */
    var isKnown = !!state.known[card.id], isUnsure = !!state.unsure[card.id];
    var marks = el('div', 'mark-row');
    var mb = btn('btn btn-warn', '헷갈려요 (다시 보기)', function () { markCard(card.id, 'unsure'); },
      { 'aria-pressed': String(isUnsure) });
    if (isUnsure) mb.textContent = '헷갈려요 ✓ (다시 보기)';
    var kb = btn('btn btn-good', '외웠어요', function () { markCard(card.id, 'known'); },
      { 'aria-pressed': String(isKnown) });
    if (isKnown) kb.textContent = '외웠어요 ✓';
    marks.appendChild(mb);
    marks.appendChild(kb);
    root.appendChild(marks);

    /* 이전 / 다음 */
    var nav = el('div', 'nav-row');
    var prev = btn('btn btn-line', '‹ 이전', function () {
      ui.cardIndex = (ui.cardIndex - 1 + deck.length) % deck.length;
      ui.flipped = false;
      renderCards();
    }, { 'aria-label': '이전 카드' });
    var next = btn('btn btn-line', '다음 ›', function () {
      ui.cardIndex = (ui.cardIndex + 1) % deck.length;
      ui.flipped = false;
      renderCards();
    }, { 'aria-label': '다음 카드' });
    nav.appendChild(prev);
    nav.appendChild(el('div', 'nav-count', (ui.cardIndex + 1) + ' / ' + deck.length));
    nav.appendChild(next);
    root.appendChild(nav);

    if (ui.cardFilter !== 'all' && ui.cardFilter !== 'todo') {
      var tip = el('p', 'tiny');
      tip.style.marginTop = '10px';
      tip.style.textAlign = 'center';
      tip.textContent = ui.cardFilter === 'unsure' ? '「외웠어요」를 누르면 이 목록에서 빠집니다.' : '「헷갈려요」를 누르면 다시 볼 목록에 담깁니다.';
      root.appendChild(tip);
    }
  }

  function buildFlashcard(card) {
    var wrap = el('div', 'flash' + (ui.flipped ? ' flipped' : ''));
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', ui.flipped ? '카드 뒷면, 정답과 출처. 탭하면 앞면' : '카드 앞면, 질문. 탭하면 정답');

    var inner = el('div', 'flash-inner');

    /* 앞면 */
    var front = el('div', 'face front');
    front.setAttribute('aria-hidden', ui.flipped ? 'true' : 'false');
    var fb = el('div', 'badges');
    fb.appendChild(el('span', 'pill', card.subjectName));
    var rev = revBadge(card);
    if (rev) fb.appendChild(el('span', 'pill rev', '🆕 ' + rev));
    if (state.known[card.id]) fb.appendChild(el('span', 'pill known', '✓ 외움'));
    if (state.unsure[card.id]) fb.appendChild(el('span', 'pill unsure', '⚑ 헷갈림'));
    front.appendChild(fb);
    front.appendChild(el('p', 'q', card.front));
    front.appendChild(el('p', 'hint', '카드를 탭하면 정답이 보여요'));
    inner.appendChild(front);

    /* 뒷면 */
    var back = el('div', 'face back');
    back.setAttribute('aria-hidden', ui.flipped ? 'false' : 'true');
    back.appendChild(el('p', 'face-label', '정답 · 조문 / 판례 요지'));
    back.appendChild(el('p', 'answer', card.back));
    var tags = (card.tags || []).filter(function (t) { return !REV_LABEL[t]; });
    if (tags.length) {
      var tb = el('div', 'tagbox');
      tb.appendChild(el('span', 'tg-label', '암기 포인트'));
      tags.forEach(function (t) { tb.appendChild(el('span', 'tag', t)); });
      back.appendChild(tb);
    }
    back.appendChild(el('p', 'src', '출처 · ' + (card.source || '-')));
    if (card.verified_note) back.appendChild(el('p', 'verify', '검증 · ' + card.verified_note));
    inner.appendChild(back);

    wrap.appendChild(inner);

    function flip() {
      ui.flipped = !ui.flipped;
      wrap.classList.toggle('flipped', ui.flipped);
      wrap.setAttribute('aria-label', ui.flipped ? '카드 뒷면, 정답과 출처. 탭하면 앞면' : '카드 앞면, 질문. 탭하면 정답');
      front.setAttribute('aria-hidden', ui.flipped ? 'true' : 'false');
      back.setAttribute('aria-hidden', ui.flipped ? 'false' : 'true');
    }
    wrap.addEventListener('click', flip);
    wrap.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
    return wrap;
  }

  function markCard(id, status) {
    ensureDay();
    var cur = state.known[id] ? 'known' : (state.unsure[id] ? 'unsure' : null);
    var reaction = null;

    if (cur === status) {
      delete state.known[id];
      delete state.unsure[id];
      toast('표시를 해제했어요');
      reaction = { kind: 'base', line: '표시를 해제했어', sub: '다시 정리해도 괜찮아' };
    } else if (status === 'known') {
      state.known[id] = Date.now();
      delete state.unsure[id];
      var first = !state.day.cards[id];
      var delta = 0;
      if (first) {
        state.day.cards[id] = Date.now();
        delta = addPoints(P_CARD);
      }
      saveState();
      var d1 = dayStats();
      reaction = first
        ? { kind: 'good', line: '외웠어요! +' + delta + 'P', pop: true, float: '+' + delta + 'P',
            sub: '오늘 암기 ' + Math.min(d1.cards, GOAL_CARDS) + '/' + GOAL_CARDS + (d1.cards >= GOAL_CARDS ? ' · 오늘 몫 완료!' : '') }
        : { kind: 'good', line: '또 봤네, 좋아!', pop: true,
            sub: '오늘 이미 받은 카드라 포인트는 그대로 · ' + fmt(state.pts || 0) + 'P' };
      toast(first ? '외웠어요 ✓ +' + delta + 'P' : '외웠어요 ✓');
      checkMission();
      saveState();
      checkPromotion();
    } else {
      state.unsure[id] = Date.now();
      delete state.known[id];
      toast('헷갈려요 ⚑ 다시 볼 목록에 담았어요');
      reaction = { kind: 'cheer', line: '괜찮아, 한 번 더 보면 돼', pop: true,
        sub: '헷갈려요 목록에 담아뒀어 · 오늘 암기 ' + Math.min(dayStats().cards, GOAL_CARDS) + '/' + GOAL_CARDS };
      saveState();
    }

    /* 표시 후 다음 카드로 */
    var deck = deckCards();
    if (!deck.length) {
      ui.cardIndex = 0;
    } else {
      var still = deck.some(function (c) { return c.id === id; });
      if (still) {
        ui.cardIndex = (ui.cardIndex + 1) % deck.length;
      } else if (ui.cardIndex >= deck.length) {
        ui.cardIndex = 0;
      }
    }
    ui.flipped = false;
    setCardBuddy(reaction);
    renderChips();
    renderCards();
    renderBadges();
    if (ui.tab === 'wrong') renderWrong();
  }

  /* =========================================================
     7. 사지선다
     ========================================================= */
  function startQuiz(mode, idList) {
    var m = (mode === 'wrong') ? 'wrong' : 'normal';
    var pool;
    if (Array.isArray(idList)) {
      pool = idList.map(function (id) { return Q_BY_ID[id]; }).filter(Boolean);
    } else {
      pool = questionsIn(ui.subject);
      if (m === 'wrong') pool = pool.filter(function (q) { return !!state.wrong[q.id]; });
    }
    var ids = pool.map(function (q) { return q.id; });
    if (state.settings.order === 'shuffle') ids = shuffle(ids);
    ui.quiz = {
      subject: ui.subject,
      mode: m,
      order: state.settings.order,
      ids: ids,
      idx: 0,
      answer: null,
      correct: 0,
      done: ids.length === 0,
      sessionWrong: [],
      combo: 0,
      wrongStreak: 0,
      anim: false,
      lastDelta: 0,
      lastPenalty: 0
    };
  }

  function quizBuddy(q, answered, ok) {
    var d = dayStats();
    var qn = Math.min(GOAL_QUIZ, d.quiz);
    if (!answered) {
      return {
        kind: 'base',
        line: QUIZ_LINES[q.idx % QUIZ_LINES.length],
        sub: '정답 +' + P_QUIZ + 'P · 연속 오답 2번부터 ' + P_BAD + 'P'
      };
    }
    if (ok) {
      return {
        kind: 'good',
        line: '좋아, 해설도 확인!',
        sub: (q.combo >= 2 ? q.combo + '콤보 🔥 · ' : '') + '오늘 사지선다 ' + qn + '/' + GOAL_QUIZ
      };
    }
    return {
      kind: 'cheer',
      line: '해설 보면서 정리하자',
      sub: '오늘 사지선다 ' + qn + '/' + GOAL_QUIZ + ' · 오답노트에 담았어'
    };
  }

  function renderQuiz() {
    var root = $('#view-quiz');
    clear(root);
    if (!ui.quiz) startQuiz('normal');
    var q = ui.quiz;

    /* 상단 컨트롤 */
    var bar = el('div', 'quizbar');
    var seg = el('div', 'seg');
    [['seq', '순서대로'], ['shuffle', '랜덤']].forEach(function (o) {
      var b = el('button', null, o[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(q.order === o[0]));
      b.addEventListener('click', function () {
        if (q.order === o[0]) return;
        q.order = o[0];
        state.settings.order = o[0];
        saveState();
        if (!q.done && q.answer === null) {
          /* 진행 중이면 같은 범위로 다시 섞기 */
          startQuiz(q.mode);
        } else {
          q.order = o[0];
        }
        renderQuiz();
      });
      seg.appendChild(b);
    });
    bar.appendChild(seg);
    var again = btn('btn btn-line btn-sm', '↻ 처음부터', function () {
      startQuiz(q.mode);
      renderQuiz();
      window.scrollTo(0, 0);
    });
    bar.appendChild(again);
    root.appendChild(bar);

    if (!q.ids.length) {
      root.appendChild(emptyBlock(
        q.mode === 'wrong' ? '오답으로 저장된 문제가 없어요' : '이 과목에 문항이 없어요',
        q.mode === 'wrong' ? '사지선다를 풀다가 틀리면 자동으로 여기에 모입니다.' : '다른 과목을 선택해 보세요.',
        q.mode === 'wrong' ? '새 문제 풀기' : null,
        function () { startQuiz('normal'); renderQuiz(); }
      ));
      return;
    }

    if (q.done) { renderQuizResult(root); return; }

    var item = Q_BY_ID[q.ids[q.idx]];
    if (!item) { startQuiz(q.mode); renderQuiz(); return; }
    var answered = q.answer !== null;
    var ok = answered && q.answer === item.answer_index;

    /* 진행 */
    var meta = el('div', 'qmeta');
    var left = el('div');
    left.appendChild(el('span', 'pill', item.subjectName));
    if (q.mode === 'wrong') left.appendChild(el('span', 'pill unsure', ' 오답 복습'));
    meta.appendChild(left);
    meta.appendChild(el('span', 'qm-r', (q.idx + 1) + ' / ' + q.ids.length + ' · 정답 ' + q.correct));
    root.appendChild(meta);
    root.appendChild(progressBar(pct(q.idx + (answered ? 1 : 0), q.ids.length), ''));

    /* 캐릭터 버디 */
    var bb = quizBuddy(q, answered, ok);
    root.appendChild(buddyEl(bb, { pop: answered && q.anim }));

    /* 문제 */
    var qcard = el('section', 'card sec');
    var qm = el('div', 'badges');
    qm.appendChild(el('span', 'pill', '난이도 ' + (item.difficulty || '중')));
    qm.appendChild(el('span', 'pill diff', '문항 ' + (q.idx + 1)));
    qcard.appendChild(qm);
    qcard.appendChild(el('p', 'qtext', item.question));

    var choices = el('div', 'choices');
    item.choices.forEach(function (text, i) {
      var b = el('button', 'choice');
      b.type = 'button';
      b.appendChild(el('span', 'cnum', CIRCLED[i]));
      b.appendChild(el('span', 'ctext', text));
      if (answered) {
        b.disabled = true;
        if (i === item.answer_index) b.className = 'choice correct';
        else if (i === q.answer) b.className = 'choice wrong';
        else b.className = 'choice dim';
      } else {
        b.addEventListener('click', function () { answerQuiz(i); });
      }
      choices.appendChild(b);
    });
    qcard.appendChild(choices);
    root.appendChild(qcard);

    if (answered) {
      var ex = el('section', 'explain');
      var v = el('div', 'verdict ' + (ok ? 'ok' : 'no'));
      v.textContent = ok ? '정답이에요 ✓' : '아쉬워요 ✗ 정답은 ' + CIRCLED[item.answer_index] + '번';
      ex.appendChild(v);

      /* 응답 리액션 */
      var dq = Math.min(GOAL_QUIZ, dayStats().quiz);
      var rx = el('div', 'reaction ' + (ok ? 'good' : 'cheer'));
      var rxa = el('div', 'rx-av');
      rxa.appendChild(faceImg(ok ? 'good' : 'cheer', 32));
      rx.appendChild(rxa);
      var rxt = el('div', 'buddy-text');
      var badLine = (q.wrongStreak >= 2)
        ? (q.lastPenalty < 0 ? (q.wrongStreak + '연속 오답 … ' + P_BAD + 'P') : (q.wrongStreak + '연속 오답 … 포인트는 0P에서 멈춰요'))
        : '아쉬워요, 해설 한 번 보자';
      rxt.appendChild(el('p', 'rx-line', ok
        ? ('정답! +' + P_QUIZ + 'P' + (q.combo >= 2 ? ' · ' + q.combo + '콤보 🔥' : ''))
        : badLine));
      rxt.appendChild(el('p', 'rx-sub', ok
        ? ('오늘 사지선다 ' + dq + '/' + GOAL_QUIZ + ' · 보유 ' + fmt(state.pts || 0) + 'P')
        : ('오답노트에 담았어요 · 보유 ' + fmt(state.pts || 0) + 'P')));
      rx.appendChild(rxt);
      if (q.lastDelta) {
        rx.appendChild(el('span', 'float-pt' + (q.lastDelta < 0 ? ' minus' : ''),
          (q.lastDelta > 0 ? '+' : '') + q.lastDelta + 'P'));
      }
      ex.appendChild(rx);

      ex.appendChild(el('h4', null, '해설'));
      ex.appendChild(el('p', 'body', item.explanation || ''));

      ex.appendChild(el('h4', null, '선지별 근거'));
      var ul = el('ul', 'notes');
      (item.choice_notes || []).forEach(function (note, i) {
        var li = el('li');
        li.appendChild(el('span', 'ox ' + (i === item.answer_index ? 'o' : 'x'), i === item.answer_index ? 'O' : 'X'));
        li.appendChild(el('span', null, stripNote(note)));
        ul.appendChild(li);
      });
      ex.appendChild(ul);

      if (item.source) ex.appendChild(el('p', 'src', '출처 · ' + item.source));
      if (item.verified_note) ex.appendChild(el('p', 'verify', '검증 · ' + item.verified_note));
      root.appendChild(ex);

      var after = el('div', 'after');
      if (ok && state.wrong[item.id]) {
        after.appendChild(btn('btn btn-good', '오답노트에서 빼기', function () {
          delete state.wrong[item.id];
          saveState();
          toast('오답노트에서 뺐어요');
          renderChips();
          renderQuiz();
          renderBadges();
        }));
      }
      var next = btn('btn btn-primary', (q.idx + 1 >= q.ids.length ? '결과 보기' : '다음 문제 ›'), function () {
        if (q.idx + 1 >= q.ids.length) {
          q.done = true;
        } else {
          q.idx += 1;
          q.answer = null;
        }
        q.anim = false;
        q.lastDelta = 0;
        q.lastPenalty = 0;
        renderQuiz();
        window.scrollTo(0, 0);
      });
      if (after.firstChild) next.style.marginTop = '9px';
      after.appendChild(next);
      root.appendChild(after);
    }
  }

  function stripNote(note) {
    return String(note).replace(/^[①②③④]\s*[OX]\s*[:：]?\s*/, '');
  }

  function answerQuiz(i) {
    var q = ui.quiz;
    if (!q || q.answer !== null || q.done) return;
    var item = Q_BY_ID[q.ids[q.idx]];
    if (!item) return;
    ensureDay();
    q.answer = i;
    var ok = (i === item.answer_index);

    var st = state.stats[item.id] || { ok: 0, bad: 0 };
    if (ok) st.ok = (st.ok || 0) + 1; else st.bad = (st.bad || 0) + 1;
    state.stats[item.id] = st;

    if (!state.day.quiz[item.id]) state.day.quiz[item.id] = Date.now();

    var delta = 0, penalty = 0;
    if (ok) {
      q.correct += 1;
      q.combo = (q.combo || 0) + 1;
      q.wrongStreak = 0;
      var at = q.sessionWrong.indexOf(item.id);
      if (at >= 0) q.sessionWrong.splice(at, 1);
      delta = addPoints(P_QUIZ);
    } else {
      q.combo = 0;
      q.wrongStreak = (q.wrongStreak || 0) + 1;
      var w = state.wrong[item.id] || { n: 0 };
      w.n = (w.n || 0) + 1;
      w.ts = Date.now();
      state.wrong[item.id] = w;
      if (q.sessionWrong.indexOf(item.id) < 0) q.sessionWrong.push(item.id);
      if (q.wrongStreak >= 2) {
        penalty = addPoints(P_BAD);
        delta = penalty;
      }
    }
    q.lastDelta = delta;
    q.lastPenalty = penalty;
    q.anim = true;
    (function (ref) {
      window.setTimeout(function () { if (ui.quiz === ref) ref.anim = false; }, 900);
    })(q);

    checkMission();
    saveState();
    checkPromotion();

    renderChips();
    renderQuiz();
    renderBadges();
    var verdict = $('#view-quiz .verdict');
    if (verdict && verdict.scrollIntoView) {
      var vr = verdict.getBoundingClientRect();
      if (vr.top < 70 || vr.bottom > window.innerHeight - 70) {
        try { verdict.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { verdict.scrollIntoView(); }
      }
    }
  }

  function renderQuizResult(root) {
    var q = ui.quiz;
    var total = q.ids.length;
    var p = pct(q.correct, total);
    var card = el('section', 'card sec score');
    card.appendChild(el('div', 'eyebrow', 'QUIZ RESULT'));

    var fig = el('img', 'score-fig');
    fig.src = p >= 80 ? BODY_IMG.good : BODY_IMG.cheer;
    fig.alt = '';
    fig.decoding = 'async';
    card.appendChild(fig);

    var big = el('div', 'pct', String(p));
    big.appendChild(el('small', null, '%'));
    card.appendChild(big);
    card.appendChild(el('div', 'st', '정답 ' + q.correct + ' / ' + total + '문항'));

    var msg = '한 번 더 돌리면 훨씬 오래 남아요.';
    if (p === 100) msg = '전부 정답이에요. 이 범위는 마무리해도 좋아요.';
    else if (p >= 80) msg = '합격선 감각이에요. 틀린 문항만 눌러 정리해요.';
    else if (p >= 60) msg = '절반은 넘겼어요. 선지별 근거를 한 번 더 읽어 보세요.';
    else msg = '틀린 문항이 오답노트에 저장됐어요. 해설부터 다시 보면 빨라요.';
    card.appendChild(el('p', 'msg', msg));
    root.appendChild(card);

    var acts = el('div', 'sec');
    var sessionWrongIds = q.sessionWrong.filter(function (id) {
      return questionsIn(ui.subject).some(function (x) { return x.id === id; });
    });
    if (sessionWrongIds.length) {
      acts.appendChild(btn('btn btn-primary', '이번에 틀린 ' + sessionWrongIds.length + '문항 다시 풀기', function () {
        startQuiz('normal', sessionWrongIds);
        renderQuiz();
        window.scrollTo(0, 0);
      }));
      acts.lastChild.style.marginBottom = '9px';
    }
    acts.appendChild(btn('btn btn-ghost', '같은 범위 새로 풀기', function () {
      startQuiz(q.mode);
      renderQuiz();
      window.scrollTo(0, 0);
    }));
    acts.lastChild.style.marginBottom = '9px';
    acts.appendChild(btn('btn btn-line', '오답노트 보기', function () { go('wrong'); }));
    root.appendChild(acts);
  }

  /* =========================================================
     8. 오답노트
     ========================================================= */
  function renderWrong() {
    var root = $('#view-wrong');
    clear(root);

    var wq = wrongIn(ui.subject);
    var uc = unsureIn(ui.subject);

    var head = el('section', 'card');
    head.appendChild(el('p', 'eyebrow', 'REVIEW'));
    head.appendChild(el('h3', null, '오답노트 · ' + SUBJ_NAME[ui.subject]));
    head.appendChild(el('p', 'muted', '사지선다 오답 ' + wq.length + '문항 · 헷갈린 카드 ' + uc.length + '장'));
    var acts = el('div', 'row');
    acts.style.marginTop = '12px';
    acts.appendChild(btn('btn btn-primary', '오답 퀴즈 (' + wq.length + ')', function () {
      startQuiz('wrong');
      go('quiz');
    }, wq.length ? null : { disabled: 'disabled' }));
    acts.appendChild(btn('btn btn-ghost', '헷갈린 카드 (' + uc.length + ')', function () {
      ui.cardFilter = 'unsure';
      ui.cardIndex = 0;
      ui.flipped = false;
      go('cards');
    }, uc.length ? null : { disabled: 'disabled' }));
    head.appendChild(acts);
    root.appendChild(head);

    if (!wq.length && !uc.length) {
      root.appendChild(emptyBlock(
        '아직 오답이 없어요',
        '사지선다에서 틀린 문제와 암기카드에서 「헷갈려요」로 표시한 카드가 여기에 과목별로 모입니다.',
        '사지선다 풀러 가기',
        function () { startQuiz('normal'); go('quiz'); }
      ));
      return;
    }

    if (wq.length) {
      var secQ = el('section', 'card sec');
      secQ.appendChild(el('h3', null, '사지선다 오답'));
      groupBySubject(wq).forEach(function (g) {
        secQ.appendChild(buildWrongGroup(g.name, g.items.map(function (item) {
          return wrongRow(item, function () {
            delete state.wrong[item.id];
            saveState();
            toast('오답노트에서 뺐어요');
            renderAll();
          });
        })));
      });
      root.appendChild(secQ);
    }

    if (uc.length) {
      var secC = el('section', 'card sec');
      secC.appendChild(el('h3', null, '헷갈린 암기카드'));
      groupBySubject(uc).forEach(function (g) {
        var rows = g.items.map(function (card) {
          var row = el('div', 'wn-item wn-stack');
          var main = el('button', 'wn-main wn-card');
          main.type = 'button';
          main.appendChild(el('p', 'wn-q', card.front));
          main.appendChild(el('div', 'wn-meta', (card.tags || []).slice(0, 3).join(' · ')));
          main.addEventListener('click', function () {
            ui.subject = card.subjectId;
            state.settings.subject = card.subjectId;
            ui.cardFilter = 'unsure';
            ui.cardIndex = 0;
            ui.flipped = false;
            saveState();
            go('cards');
          });
          row.appendChild(main);

          var foot = el('div', 'wn-foot');
          foot.appendChild(el('span', 'wn-hint', '카드를 누르면 바로 복습'));
          var acts2 = el('div', 'wn-acts');
          var done = btn('btn btn-good btn-sm', '외웠어요', function () {
            state.known[card.id] = Date.now();
            delete state.unsure[card.id];
            saveState();
            toast('외웠어요 ✓ 목록에서 뺐어요');
            renderAll();
          });
          acts2.appendChild(done);
          var x = btn('wn-x', '✕', function () {
            delete state.unsure[card.id];
            saveState();
            toast('헷갈림 표시를 해제했어요');
            renderAll();
          }, { 'aria-label': '헷갈림 표시 해제' });
          acts2.appendChild(x);
          foot.appendChild(acts2);
          row.appendChild(foot);
          return row;
        });
        secC.appendChild(buildWrongGroup(g.name, rows));
      });
      root.appendChild(secC);
    }
  }

  function buildWrongGroup(name, rows) {
    var g = el('div', 'wn-group');
    g.appendChild(el('h3', null, name));
    rows.forEach(function (r) { g.appendChild(r); });
    return g;
  }

  function groupBySubject(items) {
    var out = [];
    SUBJECTS.forEach(function (s) {
      var list = items.filter(function (x) { return x.subjectId === s.id; });
      if (list.length) out.push({ name: s.name, items: list });
    });
    return out;
  }

  function wrongRow(item, onRemove) {
    var row = el('div', 'wn-item');
    var main = el('div', 'wn-main');
    main.appendChild(el('p', 'wn-q', item.question));
    var w = state.wrong[item.id] || { n: 1 };
    main.appendChild(el('div', 'wn-meta', '내 오답 ' + (w.n || 1) + '회 · 정답 ' + CIRCLED[item.answer_index]));
    row.appendChild(main);
    row.appendChild(btn('wn-x', '✕', onRemove, { 'aria-label': '오답노트에서 빼기' }));
    return row;
  }

  function emptyBlock(title, body, actionLabel, action) {
    var box = el('section', 'card empty sec');
    box.appendChild(el('div', 'eico', '🗂️'));
    box.appendChild(el('h3', null, title));
    box.appendChild(el('p', null, body));

    return box;

  function openSheet() {
    var body = $('#sheetBody');
    clear(body);

    var d = dayStats();
    var pts = Math.max(0, state.pts || 0);
    var lvl = rankIndexFor(pts);
    var rk = RANKS[lvl];
    var nx = RANKS[lvl + 1] || null;

    var rankCard = el('section', 'card');
    rankCard.appendChild(el('h3', null, '계급과 포인트'));
    rankCard.appendChild(kv('현재 계급', rk.name + ' · ' + fmt(pts) + 'P'));
    rankCard.appendChild(kv('다음 계급', nx ? (nx.name + ' · ' + fmt(nx.pts) + 'P까지 ' + fmt(nx.pts - pts) + 'P 남음') : '없음 · 최고 계급'));
    rankCard.appendChild(kv('오늘 할당량', '암기 ' + Math.min(d.cards, GOAL_CARDS) + '/' + GOAL_CARDS +
      ' · 사지선다 ' + Math.min(d.quiz, GOAL_QUIZ) + '/' + GOAL_QUIZ + (d.bonus ? ' · 보너스 완료' : '')));
    rankCard.appendChild(kv('포인트 규칙', '암기카드 외웠어요 +' + P_CARD + 'P(카드당 1일 1회) · 사지선다 정답 +' + P_QUIZ +
      'P · 2연속 오답부터 문항당 ' + P_BAD + 'P · 하루 할당량 완료 +' + P_BONUS + 'P'));
    body.appendChild(rankCard);

    var sum = el('section', 'card sec');
    sum.appendChild(el('h3', null, '학습 기록'));
    sum.appendChild(kv('암기카드', '외움 ' + countKnown('all') + '장 · 헷갈림 ' + countUnsure('all') + '장 / 전체 ' + CARDS.length + '장'));
    var rate = answerRate('all');
    sum.appendChild(kv('사지선다', '푼 문제 ' + solvedCount('all') + '문항 · 정답률 ' + rate.rate + '% · 오답 ' + wrongIn('all').length + '문항'));
    sum.appendChild(kv('저장 위치', '이 브라우저(localStorage)에만 저장 · 서버 전송 없음'));

    about.appendChild(kv('데이터', (META.title || '경찰공채 학습 데이터') + ' · ' + (META.generated_at || '')));
    about.appendChild(kv('검증 기준', META.verified_against || '-'));
    about.appendChild(kv('추가 방법', '홈 화면에 추가하면 앱처럼 전체 화면으로 열려요'));

  function closeSheet() {
    $('#sheetOverlay').hidden = true;
    document.body.style.overflow = '';
  }

  function openResetModal() {
    $('#modalBody').textContent = '외운 카드, 헷갈려요 표시, 오답노트, 퀴즈 기록과 포인트·계급이 모두 지워집니다. 되돌릴 수 없어요.';
    $('#modalOverlay').hidden = false;
  }
  function closeResetModal() { $('#modalOverlay').hidden = true; }

  function doReset() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = freshState();
    ensureDay();
    ui.subject = 'all';
    ui.cardFilter = 'all';
    ui.cardIndex = 0;
    ui.flipped = false;
    ui.quiz = null;
    ui.buddy = null;
    saveState();
    closeResetModal();
    closeSheet();
    renderAll();
    toast('학습 기록을 초기화했어요');
  }

  /* =========================================================
     10. 이벤트 · 시작
     ========================================================= */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { go(t.getAttribute('data-tab')); });
  });

  $('#btnSettings').addEventListener('click', openSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetOverlay').addEventListener('click', function (e) {
    if (e.target === $('#sheetOverlay')) closeSheet();
  });
  $('#modalCancel').addEventListener('click', closeResetModal);
  $('#modalOk').addEventListener('click', doReset);
  $('#modalOverlay').addEventListener('click', function (e) {
    if (e.target === $('#modalOverlay')) closeResetModal();
  });

  var promoOverlay = $('#promoOverlay');
  if (promoOverlay) {
    promoOverlay.addEventListener('click', function (e) {
      if (e.target === promoOverlay) closePromo();
    });
  }
  var promoOk = $('#promoOk');
  if (promoOk) promoOk.addEventListener('click', closePromo);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (promoOverlay && !promoOverlay.hidden) closePromo();
    else if (!$('#modalOverlay').hidden) closeResetModal();
    else if (!$('#sheetOverlay').hidden) closeSheet();
  });

  /* 칩바 스크롤 그림자 */
  var chipbar = $('#chipbar');
  window.addEventListener('scroll', function () {
    var on = window.scrollY > 4;
    chipbar.classList.toggle('stuck', on);
  }, { passive: true });

  /* 다크 모드 표식(일부 색 보정용) */
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() { document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light'); }
    applyTheme();
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
    else if (mq.addListener) mq.addListener(applyTheme);
  } catch (e) {}

  /* 브랜드 부제 */
  var bs = $('#brandSub');
  if (bs) bs.textContent = SUBJECTS.map(function (s) { return s.name; }).join(' · ') + ' · 카드 ' + CARDS.length + ' · 문항 ' + QUESTIONS.length;

  /* 명언 6초 롤링 */
  quoteTimer = window.setInterval(function () {
    if (document.hidden) return;
    if (ui.tab !== 'home') return;
    nextQuote();
  }, 6000);
  window.addEventListener('pagehide', function () {
    if (quoteTimer) clearInterval(quoteTimer);
  });

  /* 날짜가 바뀌면 하루 할당량 새로 시작 */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var before = state.day ? state.day.d : null;
    ensureDay();
    saveState();
    if (before !== state.day.d) renderAll();
  });

  ensureDay();
  saveState();
  renderAll();
})();
</script>
</body>
</html>
