ce":"형법 제59조·제60조·제62조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제59조·제60조·제62조","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"FQ08","question":"형의 시효에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["시효는 형을 선고하는 재판이 확정된 후 그 집행을 받지 아니하고 5년 미만의 자격정지, 벌금, 몰수 또는 추징의 경우 3년이 지나면 완성되고, 구류·과료의 경우에도 같다.","시효는 형을 선고하는 재판이 확정된 후 그 집행을 받지 아니하고 구류 또는 과료의 경우 3년이 지나면 완성되며, 이 기간은 형의 집행을 면할 목적으로 국외에 있는 기간 동안에도 진행된다.","시효는 형을 선고하는 재판이 확정된 후 그 집행을 받지 아니하고 무기의 징역 또는 금고의 경우 15년이 지나면 완성되고, 사형의 경우에는 20년이 지나면 완성된다.","시효는 형을 선고하는 재판이 확정된 후 그 집행을 받지 아니하고 10년 이상의 징역 또는 금고의 경우 15년, 3년 이상의 징역이나 금고의 경우 10년이 지나면 완성된다."],"answer_index":3,"explanation":"제78조는 무기의 징역·금고 20년, 10년 이상의 징역·금고 15년, 3년 이상의 징역·금고 또는 10년 이상의 자격정지 10년, 3년 미만의 징역·금고 또는 5년 이상의 자격정지 7년, 5년 미만의 자격정지·벌금·몰수·추징 5년, 구류·과료 1년으로 규정한다.","choice_notes":["5년 미만의 자격정지, 벌금, 몰수 또는 추징의 시효는 5년이다.","구류 또는 과료의 시효는 1년이다.","무기의 징역·금고의 시효는 20년이다.","제78조 제3호의 문언과 일치한다."],"source":"형법 제78조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제78조(2023.8.8. 개정으로 사형 항목 삭제 확인)","difficulty":"중","choice_truth":[false,false,false,true]},{"id":"FQ09","question":"재산범죄의 법정형에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["장물을 취득·양도·운반 또는 보관한 자는 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처하고, 그 행위를 알선한 자도 같은 형에 처하며, 장물인 정을 알지 못한 때에도 처벌된다.","사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처하고, 제3자로 하여금 재물을 교부받게 한 때에도 같다.","사람을 공갈하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 10년 이하의 징역 또는 2천만원 이하의 벌금에 처하고, 제3자로 하여금 이를 취득하게 한 때에도 같다.","업무상의 임무에 위배하여 횡령·배임의 죄를 범한 자는 10년 이하의 징역 또는 3천만원 이하의 벌금에 처하고, 업무상이 아닌 횡령·배임은 5년 이하의 징역 또는 1천500만원 이하의 벌금에 처한다."],"answer_index":0,"explanation":"제347조의 사기죄는 2025. 12. 23. 개정으로 '20년 이하의 징역 또는 5천만원 이하의 벌금'으로 상향되었다. 공갈은 10년 이하 징역 또는 2천만원 이하 벌금, 업무상 횡령·배임은 10년 이하 징역 또는 3천만원 이하 벌금, 장물은 7년 이하 징역 또는 1천500만원 이하 벌금이다.","choice_notes":["제362조 제1항의 장물죄는 '7년 이하'의 징역 또는 1천500만원 이하의 벌금이다.","제347조 제1항의 현행 법정형과 일치한다.","제350조 제1항의 법정형과 일치한다.","제356조의 법정형과 일치한다."],"source":"형법 제347조·제350조·제355조·제356조·제362조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제347조·제350조·제355조·제356조·제362조(제347조 '<개정 2025.12.23.>' 확인)","difficulty":"중","tags":["최신개정"],"choice_truth":[false,true,true,true]},{"id":"FQ10","question":"공무원의 직무에 관한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["재판·검사직무·경찰 기타 인신구속에 관한 직무를 행하는 자가 그 직권을 남용하여 사람을 체포 또는 감금한 때에는 7년 이하의 징역과 10년 이하의 자격정지에 처하고, 그 미수범도 처벌한다.","검사직무·경찰 그 밖에 범죄수사에 관한 직무를 수행하는 자 또는 이를 감독하거나 보조하는 자가 그 직무를 수행하면서 알게 된 피의사실을 공소제기 전에 공표한 경우에는 5년 이하의 징역 또는 3년 이하의 자격정지에 처한다.","공무원이 정당한 이유 없이 그 직무수행을 거부하거나 그 직무를 유기한 때에는 1년 이하의 징역이나 금고 또는 3년 이하의 자격정지에 처하고, 이 죄는 부작위에 의하여 성립한다.","형사사건의 재판에 관여하는 법관 등이 타인에게 위법 또는 부당하게 이익을 주거나 권익을 해할 목적으로 법령의 적용 요건이 충족되지 아니함을 알면서도 이를 적용하는 등의 행위를 한 경우에는 10년 이하의 징역과 10년 이하의 자격정지에 처한다."],"answer_index":1,"explanation":"제126조(피의사실공표)는 2026. 9. 29. 개정으로 '3년 이하의 징역 또는 5년 이하의 자격정지'로 정해져 있다. 징역과 자격정지의 기간이 뒤바뀐 ②가 가장 적절하지 않다.","choice_notes":["제124조 제1항·제2항의 문언과 일치한다.","제126조는 '3년 이하의 징역 또는 5년 이하의 자격정지'이다. 두 기간이 뒤바뀌었다.","제122조의 문언과 일치한다.","제123조의2(법왜곡)의 문언과 일치한다."],"source":"형법 제122조·제123조의2·제124조·제126조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제122조·제123조의2(본조신설 2026.3.12.)·제124조·제126조(제124조·제126조 '<개정 2026.9.29.>' 확인)","difficulty":"상","tags":["2026개정"],"choice_truth":[true,false,true,true]},{"id":"FQ11","question":"살인죄와 존속살해죄에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["헌법재판소는 2022헌바95 결정(2026. 10. 22.)에서 형법 제250조 제2항 중 '자기의 직계존속을 살해한 자' 부분을 위헌으로 선고하고 즉시 그 효력을 상실하게 하였다.","존속살해죄의 '직계존속'에는 배우자의 직계존속이 포함되지 아니하고, 그 법정형도 보통살인죄와 같아 존속이라는 사정이 가중처벌의 근거가 되지 아니한다.","사람을 살해한 자는 사형, 무기 또는 5년 이상의 징역에 처하고, 자기 또는 배우자의 직계존속을 살해한 자는 사형, 무기 또는 7년 이상의 징역에 처한다.","자기 또는 배우자의 직계존속을 살해한 자에게도 보통살인죄와 같은 사형, 무기 또는 5년 이상의 징역이 적용되고, 존속이라는 사정은 양형에서만 고려되어 법정형에는 영향을 주지 아니한다."],"answer_index":2,"explanation":"제250조 제1항은 보통살인을 사형·무기 또는 5년 이상의 징역으로, 제2항은 자기 또는 배우자의 직계존속 살해를 사형·무기 또는 7년 이상의 징역으로 규정한다. 헌법재판소 2022헌바95 결정(2026. 10. 22., 8:1)은 제2항 중 '자기의 직계존속을 살해한 자' 부분을 합헌으로 결정하였다.","choice_notes":["2022헌바95 결정은 합헌(8:1) 결정이다.","제2항은 '자기 또는 배우자의 직계존속'을 대상으로 하고, 법정형도 보통살인보다 무겁다.","제250조 제1항의 문언과 일치한다.","제250조 제2항의 법정형은 '7년 이상'의 징역이다."],"source":"형법 제250조, 헌법재판소 2022헌바95 결정(2026. 10. 22.)","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제250조; ccourt.go.kr 최근 주요결정 2022헌바95(주문·의견수) 대조(2026-11-22)","difficulty":"중","choice_truth":[false,false,true,false]},{"id":"FQ12","question":"절도·강도에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["야간에 사람의 주거, 관리하는 건조물, 선박, 항공기 또는 점유하는 방실에 침입하여 타인의 재물을 절취한 자는 10년 이하의 징역에 처하며, 이 죄는 야간이라는 시간적 요건과 주거 등에의 침입이라는 장소적 요건을 함께 갖춘다.","야간에 문이나 담 그 밖의 건조물의 일부를 손괴하고 위 장소에 침입하여 타인의 재물을 절취한 자, 흉기를 휴대하거나 2명 이상이 합동하여 절취한 자는 1년 이상 10년 이하의 징역에 처한다.","폭행 또는 협박으로 타인의 재물을 강취하거나 기타 재산상의 이익을 취득하거나 제3자로 하여금 이를 취득하게 한 자는 3년 이상의 유기징역에 처하고, 강도죄의 객체에는 재산상의 이익도 포함된다.","절도가 재물의 탈환에 항거하거나 체포를 면탈할 목적으로 폭행 또는 협박한 때에는 준강도로서 제334조의 예에 따르고, 제333조(강도)의 예는 따르지 아니한다."],"answer_index":3,"explanation":"제335조(준강도)는 절도가 재물의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행·협박한 때에 '제333조 및 제334조의 예에 따른다'고 규정한다. 강도의 예를 배제한 ④가 가장 적절하지 않다.","choice_notes":["제330조의 문언과 일치한다.","제331조 제1항·제2항의 문언과 일치한다.","제333조의 문언과 일치한다.","제335조는 제333조와 제334조의 예에 모두 따르도록 하고 있다."],"source":"형법 제330조·제331조·제333조·제335조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제330조·제331조·제333조·제335조","difficulty":"중","choice_truth":[true,true,true,false]},{"id":"FQ13","question":"2026. 10. 2. 시행 형사소송법상 수사 주체에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["검사는 중요 범죄에 대하여 직접 수사를 개시할 수 있고, 사법경찰관이 수사한 사건을 송치받지 아니하고 스스로 수사하여 공소를 제기할 수 있으며, 사법경찰관에게 수사의 중지를 명할 수 있다.","검사와 사법경찰관은 수사, 공소제기 및 공소유지에 관하여 서로 협력하여야 하고, 검사는 공소제기 및 공소유지를 책임지며 사법경찰관은 수사를 책임진다. 이 협력을 위하여 준수하여야 하는 일반적 수사준칙에 관한 사항은 대통령령으로 정한다.","검사는 국민의 인권을 옹호하기 위하여 사법경찰관의 수사에 관한 영장의 청구, 보완수사요구, 재수사요구 등 이 법률에서 정하는 직무를 수행하며, 사법경찰관은 검사에게 법률적 판단이나 증거수집의 적절성에 관한 의견을 요청할 수 있다.","종전에 검사가 직접 수사할 수 있었던 중요 범죄에 대하여도 현행법상 수사는 사법경찰관이 담당하고, 검사는 공소제기와 공소유지를 위하여 필요한 영장의 청구와 보완수사요구 등의 직무를 수행한다."],"answer_index":0,"explanation":"개정 형사소송법은 제195조에서 검사는 공소제기·공소유지를, 사법경찰관은 수사를 책임지도록 하고, 종전 제196조(검사의 수사)를 삭제하여 검사의 직접수사권을 폐지하였다. 검사는 영장 청구·보완수사요구·재수사요구 등의 직무를 수행하므로 ①가 가장 적절하지 않다.","choice_notes":["제196조가 삭제되어 검사의 직접수사권은 폐지되었다. 검사는 영장 청구·보완수사요구·재수사요구 등으로 수사에 관여한다.","제195조 제1항의 문언과 일치한다.","제195조 제2항의 문언과 일치한다.","제195조 제3항의 문언과 일치한다."],"source":"형사소송법 제195조·제196조(삭제)","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제195조·제196조(삭제 확인)","difficulty":"상","tags":["2026개정"],"choice_truth":[false,true,true,true]},{"id":"FQ14","question":"2026. 10. 2. 시행 형사사법 개편에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠ O, ㉡ O, ㉢ X, ㉣ X","㉠ O, ㉡ O, ㉢ O, ㉣ X","㉠ O, ㉡ X, ㉢ O, ㉣ O","㉠ X, ㉡ O, ㉢ O, ㉣ X"],"answer_index":1,"explanation":"2026. 10. 2.부터 검찰청법이 폐지되고 공소청법·중대범죄수사청 조직 및 운영에 관한 법률이 시행되었으며, 형사소송법 제196조가 삭제되고 제195조가 수사 주체를 새로 정하였다. 검사는 여전히 영장 청구·보완수사요구·재수사요구 등의 직무를 수행하므로 ㉣이 틀렸다.","choice_notes":["㉢은 제195조 제1항과 일치한다.","㉠·㉡·㉢이 모두 현행법과 일치하고 ㉣만 틀렸다.","㉡은 사실과 다르다. 검찰청법 폐지와 공소청법 시행은 2026. 10. 2.에 이루어졌다.","㉠은 법률 제22009호에 따라 삭제된 것이 맞다."],"source":"형사소송법 제195조·제196조(삭제), 공소청법","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제195조·제196조; law.go.kr 법령 검색에서 '공소청' 소관 법령 확인(2026-11-22)","difficulty":"상","box":"㉠ 종전 형사소송법 제196조(검사의 수사)는 삭제되었다.\n㉡ 검찰청법이 폐지되고 공소청법이 시행되어 검찰청은 공소청으로 대체되었다.\n㉢ 사법경찰관이 수사를 책임지고, 검사는 공소제기 및 공소유지를 책임진다.\n㉣ 검사는 사법경찰관의 수사에 대하여 보완수사요구를 할 수 없고, 영장을 청구할 수도 없다.","tags":["2026개정"],"choice_truth":[false,true,false,false]},{"id":"FQ15","question":"사법경찰관리와 피의자 출석요구에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠, ㉢, ㉣","㉡, ㉢, ㉣","㉠, ㉡, ㉢","㉠, ㉡, ㉣"],"answer_index":2,"explanation":"제197조는 경위 이상을 사법경찰관, 경사·경장·순경을 사법경찰리로 규정하고, 제200조는 '사법경찰관은 수사에 필요한 때에는 피의자의 출석을 요구하여 진술을 들을 수 있다'고 개정되었다. 피의자 출석요구의 주체가 사법경찰관이므로 ㉣이 틀렸다.","choice_notes":["㉣이 조문과 반대이다.","㉠은 제197조 제1항에 명시되어 있으므로 빠져서는 안 된다.","㉠·㉡·㉢ 모두 현행 조문과 일치한다.","㉣은 제200조의 주체를 거꾸로 서술하였다."],"source":"형사소송법 제197조·제200조","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제197조·제200조('개정 2026. 8. 4.' 확인)","difficulty":"중","box":"㉠ 경위 계급 이상의 경찰공무원은 사법경찰관으로서 범죄의 혐의가 있다고 사료하는 때에는 범인, 범죄사실과 증거를 수사한다.\n㉡ 경사, 경장, 순경은 사법경찰리로서 수사의 보조를 하여야 한다.\n㉢ 사법경찰관은 수사에 필요한 때에는 피의자의 출석을 요구하여 진술을 들을 수 있다.\n㉣ 사법경찰관은 피의자의 출석을 요구할 수 없고, 검사만이 피의자에게 출석을 요구하여 진술을 들을 수 있다.","tags":["2026개정"],"choice_truth":[false,false,true,false]},{"id":"FQ16","question":"2026. 10. 2. 시행 형사소송법상 구속기간에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["검사가 사법경찰관으로부터 피의자를 인치받은 때에는 20일 이내에 공소를 제기하지 아니하면 석방하여야 하고, 그 기간은 10일씩 두 차례 연장할 수 있다.","지방법원판사는 검사의 신청에 의하여 10일을 초과하지 아니하는 범위에서 구속기간의 연장을 두 차례에 한정하여 허가할 수 있고, 그 연장은 사법경찰관의 구속기간에도 미친다.","구속기간의 연장은 사법경찰관의 신청에 의하여 지방법원판사가 허가하고, 연장된 기간에도 공소를 제기하지 아니하면 피의자를 즉시 석방하여야 한다.","사법경찰관이 피의자를 구속한 때에는 10일 이내에 피의자를 검사에게 인치하지 아니하면 석방하여야 하고, 검사가 인치받은 때에는 10일 이내에 공소를 제기하지 아니하면 석방하여야 한다."],"answer_index":3,"explanation":"제202조는 사법경찰관이 10일 이내에 검사에게 인치하지 아니하면 석방하도록 하고, 제203조는 검사가 인치받은 때부터 10일 이내에 공소를 제기하지 아니하면 석방하도록 한다. 제205조는 검사의 신청에 의하여 10일을 초과하지 않는 범위에서 '1차에 한정하여' 연장을 허가할 수 있다.","choice_notes":["제203조의 기간은 10일이다.","제205조 제1항은 연장을 '1차에 한정하여' 허가할 수 있다고 규정한다.","제205조 제1항의 연장 신청 주체는 검사이다.","제202조의 문언과 일치한다."],"source":"형사소송법 제202조·제203조·제205조","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제202조·제203조·제205조(전문개정 2026. 8. 4.)","difficulty":"중","tags":["2026개정"],"choice_truth":[false,false,false,true]},{"id":"FQ17","question":"영장에 의한 강제처분에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["검사는 범죄수사에 필요한 때에는 스스로 지방법원판사에게 압수·수색·검증영장을 청구하여 직접 집행할 수 있고, 사법경찰관의 신청이 없더라도 영장을 청구할 수 있다.","사법경찰관은 피의자가 죄를 범하였다고 의심할 만한 상당한 이유가 있고 정당한 이유 없이 출석요구에 응하지 아니하거나 응하지 아니할 우려가 있는 때에는 검사에게 신청하여 검사의 청구로 관할 지방법원 판사의 체포영장을 발부받아 체포할 수 있다.","체포한 피의자를 구속하고자 할 때에는 체포한 때부터 48시간 이내에 구속영장을 청구하여야 하고, 그 기간 내에 청구하지 아니하는 때에는 피의자를 즉시 석방하여야 한다.","사법경찰관은 범죄수사에 필요한 때에는 피의자가 죄를 범하였다고 의심할 만한 정황이 있고 사건과 관계가 있다고 인정되는 것에 한정하여 검사에게 신청하여 검사의 청구로 지방법원판사가 발부한 영장에 의하여 압수·수색 또는 검증을 할 수 있다."],"answer_index":0,"explanation":"종전 제215조 제1항(검사의 압수·수색·검증)은 2026. 8. 4. 개정으로 삭제되어, 사법경찰관이 검사에게 신청하고 검사의 청구로 판사가 발부하는 구조만 남았다. 검사가 스스로 영장을 청구하여 직접 집행할 수 있다는 ①가 가장 적절하지 않다.","choice_notes":["제215조 제1항은 2026. 8. 4. 삭제되었다. 검사가 스스로 영장을 청구하여 집행하는 규정은 현행법에 없다.","제200조의2 제1항의 문언과 일치한다.","제200조의2 제5항의 문언과 일치한다.","제215조 제2항의 문언과 일치한다."],"source":"형사소송법 제200조의2·제201조·제215조","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제200조의2·제201조·제215조(제215조 제1항 '삭제 2026. 8. 4.' 확인)","difficulty":"상","tags":["2026개정"],"choice_truth":[false,true,true,true]},{"id":"FQ18","question":"고소·고발에 의한 사건의 처리기한에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["고소·고발 사건의 수사기한은 법률이 아닌 대통령령인 수사준칙으로 정하고, 그 기한을 넘긴 수사는 효력이 없어 사건을 송치할 수 없다.","사법경찰관이 고소 또는 고발에 의하여 범죄를 수사할 때에는 고소 또는 고발을 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정하여야 하며, 이 기한은 수사준칙이 아닌 법률이 정한 것이다.","검사는 고소 또는 고발에 의하여 사법경찰관이 수사한 사건을 송치받은 날부터 6개월 이내에 공소제기 여부를 결정하고, 그 기간은 3개월씩 연장할 수 있다.","사법경찰관은 고소 또는 고발을 수리한 날부터 3개월 이내에 수사만 완료하면 되고, 송치 여부의 결정은 수사가 끝난 후 고소인과 협의하여 별도로 정하여도 된다."],"answer_index":1,"explanation":"제238조는 사법경찰관이 고소·고발을 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정하도록 하고, 제257조는 검사가 송치·송부된 날부터 3개월 이내에 공소제기 여부를 결정하도록 한다.","choice_notes":["기한은 형사소송법 제238조·제257조에 규정되어 있다.","제238조의 문언과 일치한다.","제257조의 기간은 3개월이다.","제238조는 3개월 이내에 '수사를 완료하여 송치 여부를 결정'하도록 하고 있어, 결정을 미룰 수 없다."],"source":"형사소송법 제238조·제257조","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제238조·제257조(전문개정 2026. 8. 4.)","difficulty":"중","tags":["2026개정"],"choice_truth":[false,true,false,false]},{"id":"FQ19","question":"불송치 통지와 이의신청에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["사법경찰관은 불송치 결정을 한 경우 그 송부한 날부터 7일 이내에 서면으로 고소인 등에게 사건을 검사에게 송치하지 아니하는 취지와 그 이유를 통지하여야 한다.","사법경찰관은 불송치 통지를 할 때 불송치 등의 결정서와 이의신청에 대한 안내 및 서식을 함께 보내야 하고, 수사과정에서 생성한 문서와 기록 및 입수한 자료 등의 목록도 검사에게 함께 송부하여야 한다.","고소인 등의 이의신청은 통지를 받은 날부터 30일 이내에 하여야 하고, 정당한 사유가 있어도 그 기간을 연장할 수 없으며, 이의신청이 있으면 사법경찰관은 사건을 검사에게 송치하지 아니할 수 있다.","사법경찰관은 범죄의 혐의가 있다고 인정되는 경우에는 지체 없이 사건을 검사에게 송치하고 관계 서류와 증거물을 검사에게 송부하여야 하며, 수사과정에서 생성한 문서와 기록 및 입수한 자료 등의 목록도 함께 송부하여야 한다."],"answer_index":2,"explanation":"제245조의7 제3항은 이의신청을 통지를 받은 날부터 3개월 이내에 하도록 하고, 정당한 사유가 있는 때에는 송부일부터 6개월의 범위에서 기간을 연장할 수 있다. 30일로 정하고 연장을 부정한 ③가 가장 적절하지 않다.","choice_notes":["제245조의6의 문언과 일치한다.","제245조의6 후단과 제245조의5 제2항의 문언과 일치한다.","제245조의7 제3항은 3개월 이내로 정하고, 6개월의 범위에서 연장을 허용한다.","제245조의5 제1항 제1호의 문언과 일치한다."],"source":"형사소송법 제245조의5·제245조의6·제245조의7","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제245조의5~제245조의7(제245조의7 제2항·제3항 신설 2026. 8. 4. 확인)","difficulty":"상","tags":["2026개정"],"choice_truth":[true,true,false,true]},{"id":"FQ20","question":"증거의 증거능력에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["적법한 절차에 따르지 아니하고 수집한 증거는 증거로 할 수 없고, 수사기관이 강제처분의 절차를 위반하여 수집한 증거도 마찬가지로 증거능력이 없다.","자백이 고문·폭행·협박·신체구속의 부당한 장기화 또는 기망 기타의 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있으면 유죄의 증거로 할 수 없다.","자백이 피고인에게 불리한 유일한 증거인 때에는 유죄의 증거로 할 수 없고, 자백에 대한 보강증거가 있어야 유죄를 인정할 수 있으며, 이는 공판정에서의 자백과 조서에 기재된 자백에 모두 적용된다.","사법경찰관이 작성한 피의자신문조서는 그 작성 절차가 적법하기만 하면, 피고인이나 변호인이 공판준비·공판기일에서 그 내용을 부인하여도 증거로 할 수 있다."],"answer_index":3,"explanation":"제312조 제3항은 사법경찰관 작성 피의자신문조서를 적법한 절차와 방식으로 작성되고 공판준비·공판기일에서 피고인 또는 변호인이 그 내용을 인정할 때에 한하여 증거로 할 수 있다고 규정한다. 부인하여도 증거로 할 수 있다는 ④가 가장 적절하지 않다.","choice_notes":["제308조의2의 문언과 일치한다.","제309조의 문언과 일치한다.","제310조(자백의 보강법칙)의 문언과 일치한다.","제312조 제3항은 피고인 또는 변호인의 내용 인정을 요건으로 하므로, 부인하면 증거로 할 수 없다."],"source":"형사소송법 제308조의2·제309조·제310조·제312조 제3항","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제308조의2·제309조·제310조·제312조(2026. 10. 2. 시행본)","difficulty":"중","choice_truth":[true,true,true,false]}]},{"id":"police_studies","name":"경찰학","description":"경찰행정법 35%, 기초이론 30%, 경찰행정학 15%, 분야별 경찰활동 15%, 역사·비교경찰 5%. 경찰관 직무집행법·경찰법·경찰공무원법·도로교통법·스토킹처벌법의 숫자를 중심으로 정리한다.","flashcards":[{"id":"P01","front":"경찰관 직무집행법의 목적과 직권 행사의 한계는?","back":"제1조 제1항: 국민의 자유와 권리 및 모든 개인이 가지는 불가침의 기본적 인권을 보호하고 사회공공의 질서를 유지하기 위한 경찰관(경찰공무원만 해당)의 직무 수행에 필요한 사항을 규정함을 목적으로 한다. 제2항: 이 법에 규정된 경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.","source":"경찰관 직무집행법 제1조","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 제1조 원문 대조(2026-11-21)","tags":["직무집행법","비례원칙"]},{"id":"P02","front":"경찰관 직무집행법 제2조가 정한 경찰관의 직무 범위(각 호)를 모두 말하면?","back":"① 국민의 생명·신체 및 재산의 보호 ② 범죄의 예방·진압 및 수사 ②의2 범죄피해자 보호 ③ 경비, 주요 인사 경호 및 대간첩·대테러 작전 수행 ④ 공공안녕에 대한 위험의 예방과 대응을 위한 정보의 수집·작성 및 배포 ⑤ 교통 단속과 교통 위해의 방지 ⑥ 외국 정부기관 및 국제기구와의 국제협력 ⑦ 그 밖에 공공의 안녕과 질서 유지. (제1호·제2호·제2호의2·제3호~제7호로 모두 8개 항목)","source":"경찰관 직무집행법 제2조","verified_note":"law.go.kr 경찰관 직무집행법 제2조 원문 대조(2026-11-21)","tags":["직무집행법","직무범위"]},{"id":"P03","front":"불심검문의 대상·동행 요구·흉기 조사·동행 시간은?","back":"제3조 제1항: ① 수상한 행동이나 주위 사정을 합리적으로 판단하여 죄를 범하였거나 범하려 하고 있다고 의심할 만한 상당한 이유가 있는 사람 ② 이미 행하여진 범죄나 행하여지려고 하는 범죄행위에 관한 사실을 안다고 인정되는 사람을 정지시켜 질문할 수 있다. 제2항: 질문이 불리하거나 교통에 방해가 되면 가까운 경찰서·지구대·파출소·출장소로 동행을 요구할 수 있고, 요구받은 사람은 거절할 수 있다. 제3항: 흉기를 가지고 있는지 조사할 수 있다. 제6항: 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다.","source":"경찰관 직무집행법 제3조","verified_note":"law.go.kr 경찰관 직무집행법 제3조 원문 대조(2026-11-21). 동행 시간은 '6시간'임을 확인.","tags":["직무집행법","불심검문"]},{"id":"P04","front":"보호조치 대상·기간과 위험물 임시영치 기간은?","back":"제4조 제1항: 수상한 행동 등 주위 사정을 합리적으로 판단하여 ① 정신착란 또는 술에 취하여 자신·다른 사람의 생명·신체·재산에 위해를 끼칠 우려가 있는 사람 ② 자살을 시도하는 사람 ③ 미아·병자·부상자 등으로 적당한 보호자가 없고 응급구호가 필요하다고 인정되는 사람(본인이 구호를 거절하면 제외)이 명백하고 응급구호가 필요하다고 믿을 만한 상당한 이유가 있으면 보건의료기관·공공구호기관에 긴급구호를 요청하거나 경찰관서에 보호하는 등 조치할 수 있다. 제7항: 경찰관서 보호기간은 24시간을 초과할 수 없고, 위험물 임시영치는 10일을 초과할 수 없다.","source":"경찰관 직무집행법 제4조","verified_note":"law.go.kr 경찰관 직무집행법 제4조 원문 대조(2026-11-21)","tags":["직무집행법","보호조치"]},{"id":"P05","front":"위험 발생 방지·범죄의 예방과 제지·위험 방지를 위한 출입의 요건은?","back":"제5조 제1항: 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 천재·사변·인공구조물의 파손·붕괴·교통사고·위험물의 폭발·위험한 동물의 출현·극도의 혼잡 등 위험한 사태가 있을 때 경고, 이동 제한·대피, 퇴거·접근 금지, 필요한 조치 명령·직접 조치를 할 수 있다. 제6조: 범죄행위가 목전에 행하여지려고 하면 경고하고, 생명·신체에 위해 또는 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 제지할 수 있다. 제7조: 제5조·제6조의 위험한 사태로 위해가 임박한 때 부득이하면 필요한 한도에서 타인의 토지·건물·배·차에 출입할 수 있다.","source":"경찰관 직무집행법 제5조~제7조","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21)","tags":["직무집행법","위험방지"]},{"id":"P06","front":"경찰관 직무집행법상 손실보상의 요건과 청구권 시효는?","back":"제11조의2 제1항: 국가는 경찰관의 적법한 직무집행으로 인하여 ① 손실발생의 원인에 대하여 책임이 없는 자가 생명·신체·재산상 손실을 입은 경우(자발적 협조·물건 제공 포함) ② 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 손실을 입은 경우에 정당한 보상을 하여야 한다. 제2항: 보상 청구권은 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효로 소멸한다. 제3항: 손실보상심의위원회를 둔다.","source":"경찰관 직무집행법 제11조의2","verified_note":"law.go.kr 경찰관 직무집행법 제11조의2 원문 대조(2026-11-21)","tags":["직무집행법","손실보상"]},{"id":"P07","front":"경찰장비·경찰장구·분사기 사용의 법적 근거와 정의는?","back":"제10조: 경찰관은 직무수행 중 경찰장비를 사용할 수 있고, 위해성 경찰장비는 필요한 안전교육·안전검사를 받은 후 사용하여야 하며 필요한 최소한도에서 사용. '경찰장비'란 무기, 경찰장구, 경찰착용기록장치, 최루제와 그 발사장치, 살수차, 감식기구, 해안 감시기구, 통신기기, 차량·선박·항공기 등. 제10조의2: 경찰장구는 수갑, 포승, 경찰봉, 방패 등. 제10조의3: 분사기·최루탄은 현장책임자가 판단하여 필요한 최소한의 범위에서 사용(범인 체포·도주 방지, 불법집회·시위로 인한 현저한 위해 발생 억제).","source":"경찰관 직무집행법 제10조·제10조의2·제10조의3","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21)","tags":["직무집행법","경찰장비"]},{"id":"P08","front":"무기 사용이 허용되는 요건과 '3회 이상 명령' 규정은?","back":"제10조의4 제1항: 범인의 체포, 도주 방지, 자신·다른 사람의 생명·신체 방어·보호, 공무집행에 대한 항거 제지를 위하여 필요하다고 인정되는 상당한 이유가 있을 때 사태를 합리적으로 판단하여 필요한 한도에서 무기를 사용할 수 있다. 다만 ① 형법상 정당방위·긴급피난에 해당할 때 ② 다음 각 목의 어느 하나에 해당하여 무기를 사용하지 아니하고는 다른 수단이 없다고 인정되는 상당한 이유가 있을 때를 제외하고는 사람에게 위해를 끼쳐서는 아니 된다. 그 각 목에는 사형·무기 또는 장기 3년 이상의 죄를 범한 사람이 항거·도주하려 할 때, 영장 집행 과정에서 항거·도주하려 할 때, 제3자가 도주시키려 항거할 때, 범인·소요를 일으킨 사람이 무기·흉기 등 위험한 물건을 지니고 '3회 이상' 물건을 버리라는 명령이나 항복하라는 명령을 받고도 따르지 아니하면서 계속 항거할 때가 포함된다.","source":"경찰관 직무집행법 제10조의4","verified_note":"law.go.kr 경찰관 직무집행법 제10조의4 원문 대조(2026-11-21)","tags":["직무집행법","무기사용"]},{"id":"P09","front":"경찰착용기록장치(바디캠)의 사용 사유와 고지·보관 의무는?","back":"제10조의5(2024.1.30. 신설): ① 피의자 체포·구속(형소법 제200조의2·제200조의3·제201조·제212조) ② 범죄 수사를 위하여 범행 중이거나 직전·직후이고 증거보전의 필요성·긴급성이 모두 갖추어진 경우 ③ 제5조 제1항의 위험한 사태 ④ 기록대상자의 요청·동의 ⑤ 제4조 제1항의 응급구호 ⑥ 제6조의 범죄 예방·제지 ⑦ 해양경비법상 검문검색·추적·나포 ⑧ 수난구호 ⑨ 그 밖에 대통령령이 정하는 경우에 필요한 최소한의 범위에서 사용할 수 있다. 제10조의6: 촬영 사실을 불빛·소리·안내판 등으로 표시·고지하여야 하고, 기록은 지체 없이 관리체계에 전송·저장하며 임의로 편집·복사·삭제하여서는 아니 된다.","source":"경찰관 직무집행법 제10조의5·제10조의6","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21). 본조신설 2024.1.30. 표기 확인","tags":["직무집행법","바디캠","최신"]},{"id":"P10","front":"경찰관 직무집행법 위반의 벌칙은?","back":"제12조: 이 법에 규정된 경찰관의 의무를 위반하거나 직권을 남용하여 다른 사람에게 해를 끼친 사람은 1년 이하의 징역이나 금고 또는 300만원 이하의 벌금에 처한다.","source":"경찰관 직무집행법 제12조","verified_note":"law.go.kr 경찰관 직무집행법 제12조 원문 대조(2026-11-21)","tags":["직무집행법","벌칙"]},{"id":"P11","front":"경찰법상 경찰의 임무 8가지와 자치경찰사무의 수사사무 6종은?","back":"제3조 임무: ① 국민의 생명·신체 및 재산의 보호 ② 범죄의 예방·진압 및 수사 ③ 범죄피해자 보호 ④ 경비·요인경호 및 대간첩·대테러 작전 수행 ⑤ 공공안녕에 대한 위험의 예방과 대응을 위한 정보의 수집·작성 및 배포 ⑥ 교통의 단속과 위해의 방지 ⑦ 외국 정부기관 및 국제기구와의 국제협력 ⑧ 그 밖에 공공의 안녕과 질서유지. 제4조 제1항 제2호 라목의 자치경찰 수사사무: ① 학교폭력 등 소년범죄 ② 가정폭력·아동학대 범죄 ③ 교통사고 및 교통 관련 범죄 ④ 형법 제245조 공연음란 및 성폭력처벌법 제12조(성적 목적 다중이용장소 침입) ⑤ 경범죄·기초질서 관련 범죄 ⑥ 가출인 및 실종아동등 관련 수색·범죄.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제3조·제4조","verified_note":"law.go.kr 경찰법(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-21)","tags":["경찰법","임무","자치경찰"]},{"id":"P12","front":"국가경찰위원회의 구성·임기·결격사유는?","back":"제7조: 행정안전부에 두고, 위원장 1명을 포함한 7명의 위원으로 구성하되 위원장 및 5명은 비상임, 1명은 상임(정무직). 제8조: 위원은 행정안전부장관의 제청으로 국무총리를 거쳐 대통령이 임명하고, 위원 중 2명은 법관의 자격이 있는 사람이어야 하며, 특정 성이 10분의 6을 초과하지 않도록 노력. 제9조: 임기 3년, 연임할 수 없다. 제11조 제2항: 회의는 재적위원 과반수 출석과 출석위원 과반수 찬성으로 의결.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제7조~제11조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","tags":["경찰법","국가경찰위원회"]},{"id":"P13","front":"경찰청장과 국가수사본부장의 임기·임명절차는?","back":"제14조: 경찰청장은 치안총감으로 보하고, 국가경찰위원회의 동의를 받아 행정안전부장관의 제청으로 국무총리를 거쳐 대통령이 임명하며 국회 인사청문을 거친다. 임기는 2년으로 하고 중임할 수 없다. 제16조: 국가수사본부장은 치안정감으로 보하고, 임기는 2년으로 하며 중임할 수 없고, 임기가 끝나면 당연히 퇴직한다.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제14조·제16조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","tags":["경찰법","경찰청장","국가수사본부장"]},{"id":"P14","front":"시·도자치경찰위원회의 구성과 위원 추천 주체는?","back":"제19조: 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임, 5명은 비상임. 제20조 제1항: ① 시·도의회가 추천하는 2명 ② 국가경찰위원회가 추천하는 1명 ③ 해당 시·도 교육감이 추천하는 1명 ④ 시·도자치경찰위원회 위원추천위원회가 추천하는 2명 ⑤ 시·도지사가 지명하는 1명을 시·도지사가 임명한다. 제23조: 위원장과 위원의 임기는 3년, 연임할 수 없다.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제19조·제20조·제23조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21). 국가경찰위원회(위원장+5 비상임+1 상임)와 구성이 다름을 확인.","tags":["경찰법","자치경찰위원회"]},{"id":"P15","front":"시·도경찰청장의 지휘·감독 체계와 경찰청장의 비상사태 직접 지휘 요건은?","back":"제28조 제3항: 시·도경찰청장은 국가경찰사무에 대해서는 경찰청장의, 자치경찰사무에 대해서는 시·도자치경찰위원회의 지휘·감독을 받고, 수사에 관한 사무에 대해서는 국가수사본부장의 지휘·감독을 받는다. 제32조 제1항: ① 전시·사변, 천재지변 등 국가 비상사태, 대규모 테러·소요사태 ② 다수의 시·도에 동일하게 적용되는 치안정책 시행 필요 ③ 해당 시·도 경찰력으로는 국민의 생명·신체·재산 보호가 어려워 지원·조정이 필요한 경우에 자치경찰사무 수행 경찰공무원을 직접 지휘·명령할 수 있다(제3호는 미리 국가경찰위원회 의결, 긴급 시 우선 조치 후 지체 없이 의결).","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제28조·제32조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","tags":["경찰법","지휘체계"]},{"id":"P16","front":"경찰공무원의 임용권자와 시보임용 기간·산입 제외 기간은?","back":"경찰공무원법 제7조: 총경 이상은 경찰청장·해양경찰청장의 추천을 받아 행정안전부장관·해양수산부장관의 제청으로 국무총리를 거쳐 대통령이 임용(총경의 전보·휴직·직위해제·강등·정직·복직은 경찰청장 등이 함). 경정 이하는 경찰청장·해양경찰청장이 임용하되, 경정으로의 신규채용·승진임용·면직은 대통령이 한다. 제13조: 경정 이하 신규채용 시 1년간 시보로 임용하고 그 기간이 만료된 다음 날 정규 경찰공무원으로 임용. 휴직기간, 직위해제기간, 징계에 의한 정직·감봉처분을 받은 기간은 시보임용기간에 산입하지 않는다.","source":"경찰공무원법 제7조·제13조","verified_note":"law.go.kr 경찰공무원법(법률 제20646호, 시행 2025.1.7.) 원문 대조(2026-11-21)","tags":["경찰공무원법","임용","시보"]},{"id":"P17","front":"경찰공무원의 정년과 근속승진 기간은?","back":"제30조: 연령정년 60세. 계급정년은 치안감 4년, 경무관 6년, 총경 11년, 경정 14년. 정년이 된 날이 1월~6월 사이면 6월 30일, 7월~12월 사이면 12월 31일에 당연퇴직. 제16조 근속승진: 순경→경장 4년 이상, 경장→경사 5년 이상, 경사→경위 6년 6개월 이상, 경위→경감 8년 이상 근속자.","source":"경찰공무원법 제16조·제30조","verified_note":"law.go.kr 경찰공무원법 원문 대조(2026-11-21)","tags":["경찰공무원법","정년","근속승진"]},{"id":"P18","front":"경찰공무원 징계위원회의 관할은?","back":"제32조: 경무관 이상 경찰공무원에 대한 징계의결은 국가공무원법에 따라 국무총리 소속으로 설치된 징계위원회에서 한다. 총경 이하 경찰공무원에 대한 징계의결을 하기 위하여 대통령령으로 정하는 경찰기관 및 해양경찰관서에 경찰공무원 징계위원회를 둔다.","source":"경찰공무원법 제32조","verified_note":"law.go.kr 경찰공무원법 제32조 원문 대조(2026-11-21)","tags":["경찰공무원법","징계"]},{"id":"P19","front":"도로교통법상 음주운전 기준과 재범 가중 처벌은?","back":"제44조 제4항: 운전이 금지되는 술에 취한 상태의 기준은 혈중알코올농도 0.03퍼센트 이상. 제5항: 음주측정을 곤란하게 할 목적으로 추가로 술을 마시거나 혈중알코올농도에 영향을 줄 수 있는 물품을 사용하는 행위(음주측정방해행위) 금지. 제148조의2 제1항: 음주운전으로 벌금 이상의 형이 확정된 날부터 10년 내 다시 위반하면 ① 제44조 제2항·제5항 위반 1년 이상 6년 이하 징역 또는 500만원 이상 3천만원 이하 벌금 ② 혈중알코올농도 0.2퍼센트 이상 2년 이상 6년 이하 징역 또는 1천만원 이상 3천만원 이하 벌금 ③ 0.03퍼센트 이상 0.2퍼센트 미만 1년 이상 5년 이하 징역 또는 500만원 이상 2천만원 이하 벌금. 제3항: 첫 위반 중 0.2퍼센트 이상은 2년 이상 5년 이하 징역 또는 1천만원 이상 2천만원 이하 벌금.","source":"도로교통법 제44조·제148조의2","verified_note":"law.go.kr 도로교통법 원문 대조(2026-11-21)","tags":["도로교통법","음주운전"]},{"id":"P20","front":"어린이보호구역의 속도 제한, 개인형 이동장치의定義, 교통사고 시 조치 의무는?","back":"제12조 제1항: 시장등은 유치원·초등학교·특수학교, 어린이집, 학원 등 시설·장소 주변도로의 일정 구간을 어린이 보호구역으로 지정하여 자동차등과 노면전차의 통행속도를 시속 30킬로미터 이내로 제한할 수 있다. 제2조 제19호의2: 개인형 이동장치는 원동기장치자전거 중 시속 25킬로미터 이상으로 운행할 경우 전동기가 작동하지 아니하고 차체 중량이 30킬로그램 미만인 것. 제54조: 교통사고가 나면 운전자등은 즉시 정차하여 사상자 구호 등 필요한 조치를 하고 피해자에게 인적 사항을 제공하며, 경찰공무원 또는 가장 가까운 국가경찰관서에 사고 장소·사상자 수·부상 정도 등을 지체 없이 신고하여야 한다.","source":"도로교통법 제2조·제12조·제54조","verified_note":"law.go.kr 도로교통법 원문 대조(2026-11-21)","tags":["도로교통법","어린이보호구역","PM"]},{"id":"P21","front":"스토킹처벌법의 스토킹행위·스토킹범죄 정의, 긴급응급조치와 잠정조치, 법정형은?","back":"제2조: '스토킹행위'란 상대방의 의사에 반하여 정당한 이유 없이 접근·따라다니기, 주거등 부근에서 기다리거나 지켜보기, 우편·전화·정보통신망 등으로 물건·글·말·음향·영상 도달, 물건 등을 두는 행위, 주거등 부근 물건 훼손, 개인정보·위치정보 제공·배포·게시, 상대방인 것처럼 가장하는 행위로 상대방에게 불안감·공포심을 일으키는 것. '스토킹범죄'는 지속적 또는 반복적으로 스토킹행위를 하는 것. 제4조: 사법경찰관은 100미터 이내 접근 금지, 전기통신을 이용한 접근 금지를 할 수 있고(긴급응급조치), 제5조에 따라 검사가 48시간 이내 사후승인을 청구하며 기간은 1개월을 초과할 수 없다. 제9조 잠정조치: 서면 경고, 100미터 이내 접근 금지, 전기통신 접근 금지, 전자장치 부착, 국가경찰관서 유치장·구치소 유치(병과 가능). 기간은 접근 금지·전기통신 접근 금지·전자장치 부착이 3개월(2회에 한정하여 각 3개월 연장 가능), 유치장·구치소 유치가 1개월이다. 제18조: 스토킹범죄는 3년 이하 징역 또는 3천만원 이하 벌금, 흉기 등 위험한 물건을 휴대·이용하면 5년 이하 징역 또는 5천만원 이하 벌금.","source":"스토킹범죄의 처벌 등에 관한 법률 제2조·제4조·제5조·제9조·제18조","verified_note":"law.go.kr 스토킹처벌법(법률 제21998호, 시행 2026.10.2.) 원문 대조(2026-11-21). 제18조 제3항(반의사불벌)은 2023.7.11. 삭제됨을 확인.","tags":["스토킹처벌법","잠정조치"]}],"questions":[{"id":"PQ01","question":"경찰관 직무집행법의 목적과 직무 범위에 관한 설명으로 가장 적절하지 않은 것은?","choices":["이 법에서 '경찰관'이란 경찰공무원 외에 청원경찰과 제주특별자치도의 자치경찰공무원을 포함한다.","국민의 자유와 권리 및 모든 개인이 가지는 불가침의 기본적 인권을 보호하고 사회공공의 질서를 유지하기 위한 경찰관의 직무 수행에 필요한 사항을 규정함을 목적으로 한다.","이 법에 규정된 경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.","경찰관의 직무에는 범죄의 예방·진압 및 수사, 범죄피해자 보호, 경비·주요 인사 경호 및 대간첩·대테러 작전 수행 등이 포함된다."],"answer_index":0,"explanation":"제1조 제1항은 이 법의 적용대상인 경찰관을 '경찰공무원만 해당한다'고 괄호로 명시하고 있다. 청원경찰이나 자치경찰공무원을 포함한다는 ①가 가장 적절하지 않다.","choice_notes":["제1조 제1항은 '경찰관(경찰공무원만 해당한다)'이라고 규정하고 있다.","제1조 제1항의 문언과 일치한다.","제1조 제2항의 문언과 일치한다.","제2조 각 호의 직무 범위와 일치한다."],"source":"경찰관 직무집행법 제1조·제2조","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제1조·제2조","difficulty":"하","choice_truth":[false,true,true,true]},{"id":"PQ02","question":"경찰관 직무집행법상 불심검문에 관한 설명으로 가장 적절한 것은?","choices":["동행을 요구받은 사람은 그 요구를 거절할 수 없다.","경찰관은 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다.","경찰관은 질문을 할 때 그 사람이 흉기를 가지고 있는지 조사할 수 없고, 소속과 성명을 밝힐 필요도 없다.","동행한 사람의 가족에게 동행 장소를 알리는 것은 동행한 본인이 요청한 경우에만 하여야 한다."],"answer_index":1,"explanation":"제3조 제6항은 경찰관이 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정한다. 동행 요구는 거절할 수 있고(제2항), 흉기 소지 조사가 허용되며(제3항), 신분 표시·동행 장소 고지(제4항)와 가족 등에 대한 통지(제5항)는 경찰관의 의무이다.","choice_notes":["제3조 제2항 후단은 동행 요구를 거절할 수 있다고 규정한다.","제3조 제6항의 문언과 일치한다.","제3조 제3항은 흉기 소지 조사를 허용하고, 제4항은 증표 제시와 소속·성명 고지를 의무로 한다.","제3조 제5항은 경찰관이 가족 등에게 알리거나 본인에게 연락할 기회를 주어야 한다고 규정하여, 본인의 요청을 요건으로 하지 않는다."],"source":"경찰관 직무집행법 제3조","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제3조","difficulty":"중","choice_truth":[false,true,false,false]},{"id":"PQ03","question":"경찰관 직무집행법상 보호조치 등에 관한 설명으로 가장 적절하지 않은 것은?","choices":["미아·병자·부상자 등으로서 적당한 보호자가 없으며 응급구호가 필요하다고 인정되는 사람도 구호대상자에 해당하나, 본인이 구호를 거절하는 경우는 제외한다.","경찰관은 보호조치를 하였을 때에는 지체 없이 구호대상자의 가족·친지 또는 그 밖의 연고자에게 그 사실을 알려야 한다.","경찰관서에서 보호하는 기간은 48시간을 초과할 수 없고, 위험을 일으킬 수 있는 물건의 임시영치 기간은 30일을 초과할 수 없다.","술에 취하여 자신 또는 다른 사람의 생명·신체·재산에 위해를 끼칠 우려가 있는 사람은 구호대상자가 될 수 있다."],"answer_index":2,"explanation":"제4조 제7항은 구호대상자를 경찰관서에서 보호하는 기간은 24시간을, 물건을 임시로 영치하는 기간은 10일을 초과할 수 없다고 규정한다. ③가 가장 적절하지 않다.","choice_notes":["제4조 제1항 제3호와 단서의 문언과 일치한다.","제4조 제4항의 문언과 일치한다.","제4조 제7항의 기간은 보호 24시간, 임시영치 10일이다.","제4조 제1항 제1호의 문언과 일치한다."],"source":"경찰관 직무집행법 제4조","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제4조","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"PQ04","question":"경찰관 직무집행법상 위험 발생의 방지와 범죄의 예방·제지에 관한 설명으로 가장 적절한 것은?","choices":["경찰관서의 장은 대간첩 작전이나 소요사태의 진압을 위하여 필요하다고 인정되는 상당한 이유가 있을 때에도 경찰관서·무기고 등 국가중요시설에 대한 접근이나 통행을 제한할 수 없다.","경찰관은 제5조 제1항의 조치를 하였을 때 소속 경찰관서의 장에게 보고하지 아니할 수 있다.","경찰관은 천재·사변 등 위험한 사태가 있을 때 긴급한 경우에도 위해를 입을 우려가 있는 사람의 이동을 제한하거나 대피시킬 수 없다.","경찰관은 위험한 상황의 원인을 제공한 사람을 그 장소에서 퇴거시키거나 그 장소에의 접근을 금지시킬 수 있다."],"answer_index":3,"explanation":"제5조 제1항 제3호는 위험한 상황의 원인을 제공한 사람을 그 장소에서 퇴거시키거나 접근을 금지시킬 수 있다고 규정한다. 이동 제한·대피(제2호), 국가중요시설 접근 제한(제2항), 조치 후 보고 의무(제3항)가 함께 정해져 있다.","choice_notes":["제5조 제2항은 대간첩 작전이나 소요사태 진압을 위하여 국가중요시설에 대한 접근·통행을 제한하거나 금지할 수 있다고 규정한다.","제5조 제3항은 조치를 하였을 때 지체 없이 소속 경찰관서의 장에게 보고하여야 한다고 규정한다.","제5조 제1항 제2호는 긴급한 경우 위해를 입을 우려가 있는 사람의 이동을 제한하거나 대피시킬 수 있도록 한다.","제5조 제1항 제3호의 문언과 일치한다."],"source":"경찰관 직무집행법 제5조·제6조","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제5조·제6조","difficulty":"중","choice_truth":[false,false,false,true]},{"id":"PQ05","question":"경찰장비와 무기의 사용에 관한 설명으로 가장 적절하지 않은 것은?","choices":["범인 등이 무기·흉기 등 위험한 물건을 지니고 경찰관으로부터 1회 이상 물건을 버리라는 명령을 받고도 따르지 아니하면서 계속 항거할 때에는 무기를 사용할 수 있다.","사람의 생명이나 신체에 위해를 끼칠 수 있는 경찰장비를 사용할 때에는 필요한 안전교육과 안전검사를 받은 후 사용하여야 한다.","경찰관은 범인의 체포, 자신이나 다른 사람의 생명·신체의 방어 및 보호, 공무집행에 대한 항거의 제지를 위하여 필요하다고 인정되는 상당한 이유가 있을 때에는 그 사태를 합리적으로 판단하여 필요한 한도에서 무기를 사용할 수 있다.","무기 사용에 관하여 형법에 규정된 정당방위와 긴급피난에 해당할 때를 제외하고는 사람에게 위해를 끼쳐서는 아니 된다."],"answer_index":0,"explanation":"제10조의4 제1항 제2호 라목은 무기·흉기 등 위험한 물건을 지니고 경찰관으로부터 '3회 이상' 물건을 버리라는 명령이나 항복하라는 명령을 받고도 따르지 아니하면서 계속 항거할 때를 무기 사용의 요건으로 정하고 있다. '1회 이상'이라고 한 ①가 가장 적절하지 않다.","choice_notes":["제10조의4 제1항 제2호 라목은 '3회 이상'의 명령을 요건으로 한다.","제10조 제1항 단서의 문언과 일치한다.","제10조의4 제1항 본문의 문언과 일치한다.","제10조의4 제1항 제1호의 문언과 일치한다."],"source":"경찰관 직무집행법 제10조·제10조의4","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제10조·제10조의4","difficulty":"중","choice_truth":[false,true,true,true]},{"id":"PQ06","question":"경찰착용기록장치의 사용에 관한 설명으로 가장 적절한 것은?","choices":["경찰관은 피의자를 체포 또는 구속하는 경우 외에는 어떠한 경우에도 경찰착용기록장치를 사용할 수 없다.","경찰관이 경찰착용기록장치로 사람 또는 그 사람과 관련된 사물의 영상을 촬영하는 때에는 불빛·소리·안내판 등으로 촬영 사실을 표시하고 알려야 한다.","기록을 마친 영상음성기록은 개별 경찰관이 직무상 필요하면 임의로 편집·복사하거나 삭제할 수 있다.","경찰착용기록장치는 경찰관이 신체에 착용하는 것만을 말하고, 휴대하는 기록장치는 포함되지 않는다."],"answer_index":1,"explanation":"제10조의6 제1항은 경찰착용기록장치로 영상을 촬영하는 때에 불빛·소리·안내판 등으로 촬영 사실을 표시하고 알려야 한다고 규정한다. 기록장치에는 휴대형도 포함되고(제10조의5 제2항), 사용 사유는 체포·구속 외에도 여러 가지가 있으며(같은 조 제1항), 임의 편집·복사·삭제는 금지된다(제10조의6 제3항).","choice_notes":["제10조의5 제1항은 체포·구속 외에 범죄 수사, 위험한 사태, 기록대상자의 동의, 구호 대상자 발견 등 여러 사유를 정하고 있다.","제10조의6 제1항의 문언과 일치한다.","제10조의6 제3항은 영상음성기록을 임의로 편집·복사하거나 삭제하여서는 아니 된다고 규정한다.","제10조의5 제2항은 '신체에 착용 또는 휴대'하는 기록장치를 말한다."],"source":"경찰관 직무집행법 제10조의5·제10조의6","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제10조의5·제10조의6(본조신설 2024.1.30.)","difficulty":"중","choice_truth":[false,true,false,false]},{"id":"PQ07","question":"경찰관 직무집행법상 손실보상에 관한 설명으로 가장 적절하지 않은 것은?","choices":["손실발생의 원인에 대하여 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 생명·신체 또는 재산상의 손실을 입은 경우에도 보상의 대상이 된다.","보상을 청구할 수 있는 권리는 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효의 완성으로 소멸한다.","경찰관의 직무집행이 위법한 경우에도 이 조의 손실보상 규정에 따라 보상을 청구할 수 있다.","국가는 경찰관의 적법한 직무집행으로 인하여 손실발생의 원인에 대하여 책임이 없는 자가 생명·신체 또는 재산상의 손실을 입은 경우 정당한 보상을 하여야 한다."],"answer_index":2,"explanation":"제11조의2 제1항은 '경찰관의 적법한 직무집행'으로 인한 손실을 보상 대상으로 한다. 위법한 직무집행으로 인한 손실은 국가배상의 문제이므로 ③가 가장 적절하지 않다.","choice_notes":["제11조의2 제1항 제2호의 문언과 일치한다.","제11조의2 제2항의 문언과 일치한다.","제11조의2 제1항은 '적법한 직무집행'을 전제로 한다.","제11조의2 제1항 제1호의 문언과 일치한다."],"source":"경찰관 직무집행법 제11조의2","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 원문 대조(2026-11-22) 제11조의2","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"PQ08","question":"국가경찰위원회에 관한 설명으로 가장 적절한 것은?","choices":["국가경찰위원회는 경찰청에 두고, 그 사무도 경찰청에서 수행한다.","국가경찰위원회는 위원장 1명을 포함한 9명의 위원으로 구성한다.","위원의 임기는 3년으로 하며 1차에 한하여 연임할 수 있다.","위원 중 2명은 법관의 자격이 있는 사람이어야 한다."],"answer_index":3,"explanation":"제7조 제2항은 위원장 1명을 포함한 7명(위원장 및 5명 비상임, 1명 상임)으로 구성하도록 하고, 제8조 제3항은 위원 중 2명이 법관의 자격이 있는 사람이어야 한다고 규정한다. 위원의 임기는 3년이며 연임할 수 없다(제9조 제1항).","choice_notes":["제7조 제1항은 국가경찰위원회를 '행정안전부'에 둔다고 규정한다. 사무만 경찰청이 수행한다.","제7조 제2항은 7명으로 구성한다고 규정한다.","제9조 제1항은 임기 3년, 연임 불가를 규정한다.","제8조 제3항의 문언과 일치한다."],"source":"경찰법 제7조·제8조·제9조","verified_note":"law.go.kr 국가경찰과 자치경찰의 조직 및 운영에 관한 법률(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제7조~제9조","difficulty":"중","choice_truth":[false,false,false,true]},{"id":"PQ09","question":"경찰청장과 국가수사본부장에 관한 설명으로 가장 적절하지 않은 것은?","choices":["경찰청장은 수사에 관한 사무의 경우 개별 사건의 수사에 대하여 언제든지 구체적으로 지휘·감독할 수 있다.","경찰청장은 치안총감으로 보하고, 임기는 2년으로 하며 중임할 수 없다.","경찰청장은 국가경찰위원회의 동의를 받아 행정안전부장관의 제청으로 국무총리를 거쳐 대통령이 임명하며, 국회의 인사청문을 거쳐야 한다.","국가수사본부장은 치안정감으로 보하고, 임기는 2년으로 하며 중임할 수 없고 임기가 끝나면 당연히 퇴직한다."],"answer_index":0,"explanation":"제14조 제6항은 경찰청장이 개별 사건의 수사에 대하여 구체적으로 지휘·감독할 수 없다고 하면서, 국민의 생명·신체·재산 등에 중대한 위험이 있는 긴급하고 중요한 사건에서 통합적 현장 대응이 필요한 상당한 이유가 있을 때에 국가수사본부장을 통하여 예외적으로 할 수 있도록 한다. ①가 가장 적절하지 않다.","choice_notes":["제14조 제6항 본문은 개별 사건 수사에 대한 구체적 지휘·감독을 금지하고, 같은 항 단서의 요건이 있을 때에만 국가수사본부장을 통하여 예외적으로 허용한다.","제14조 제1항·제4항의 문언과 일치한다.","제14조 제2항의 문언과 일치한다.","제16조 제1항·제3항·제4항의 문언과 일치한다."],"source":"경찰법 제14조·제16조","verified_note":"law.go.kr 국가경찰과 자치경찰의 조직 및 운영에 관한 법률(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제14조·제16조","difficulty":"중","choice_truth":[false,true,true,true]},{"id":"PQ10","question":"시·도자치경찰위원회의 구성과 위원 임명에 관한 설명으로 가장 적절하지 않은 것은?","choices":["위원장과 위원의 임기는 3년으로 하며 연임할 수 없다.","시·도자치경찰위원회는 합의제 행정기관이지만, 그 권한에 속하는 업무는 시·도지사의 지휘를 받아 수행한다.","시·도자치경찰위원회는 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임으로 하고 5명의 위원은 비상임으로 한다.","위원은 시·도의회가 추천하는 2명, 국가경찰위원회가 추천하는 1명, 해당 시·도 교육감이 추천하는 1명, 위원추천위원회가 추천하는 2명, 시·도지사가 지명하는 1명을 시·도지사가 임명한다."],"answer_index":1,"explanation":"제18조 제2항은 시·도자치경찰위원회를 합의제 행정기관으로서 '그 권한에 속하는 업무를 독립적으로 수행한다'고 규정한다. 시·도지사의 지휘를 받는다는 ②가 가장 적절하지 않다.","choice_notes":["제23조 제1항의 문언과 일치한다.","제18조 제2항은 권한에 속하는 업무를 '독립적으로 수행'한다고 규정한다.","제19조 제1항의 문언과 일치한다.","제20조 제1항 각 호의 추천·지명 주체와 일치한다."],"source":"경찰법 제18조~제20조·제23조","verified_note":"law.go.kr 국가경찰과 자치경찰의 조직 및 운영에 관한 법률(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제18조·제19조·제20조·제23조","difficulty":"중","choice_truth":[true,false,true,true]},{"id":"PQ11","question":"시·도자치경찰위원회의 의결과 경찰청장의 지휘·명령에 관한 설명으로 가장 적절하지 않은 것은?","choices":["시·도지사는 위원회의 의결이 적정하지 아니하다고 판단할 때 재의를 요구할 수 있고, 위원장은 재의요구를 받은 날부터 7일 이내에 회의를 소집하여 재의결하여야 한다.","재의결은 재적위원 과반수의 출석과 출석위원 3분의 2 이상의 찬성으로 전과 같은 의결을 하면 확정된다.","경찰청장은 비상사태 등으로 자치경찰사무 담당 경찰공무원을 직접 지휘·명령한 경우 국가경찰위원회에 보고할 필요가 없고, 시·도자치경찰위원회에 통보할 필요도 없다.","시·도자치경찰위원회의 회의는 재적위원 과반수의 출석과 출석위원 과반수의 찬성으로 의결한다."],"answer_index":2,"explanation":"제32조 제2항은 경찰청장이 자치경찰사무 담당 경찰공무원을 직접 지휘·명령하려는 경우 그 사유와 내용을 시·도자치경찰위원회에 구체적으로 제시하여 통보하도록 하고, 제4항은 국가경찰위원회에 즉시 보고하도록 한다. 보고·통보가 필요 없다는 ③가 가장 적절하지 않다.","choice_notes":["제25조 제3항·제5항의 문언과 일치한다.","제25조 제5항 후단의 문언과 일치한다.","제32조 제2항은 시·도자치경찰위원회에 대한 통보를, 제4항은 국가경찰위원회에 대한 보고를 각각 요구한다.","제25조 제2항의 문언과 일치한다."],"source":"경찰법 제25조·제32조","verified_note":"law.go.kr 국가경찰과 자치경찰의 조직 및 운영에 관한 법률(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제25조·제32조","difficulty":"상","choice_truth":[true,true,false,true]},{"id":"PQ12","question":"경찰공무원의 시보임용과 근속승진에 관한 설명으로 가장 적절한 것은?","choices":["시보임용기간에는 휴직기간과 징계에 의한 정직처분을 받은 기간도 모두 산입한다.","경정 이하의 경찰공무원을 신규 채용할 때에는 6개월간 시보로 임용하고, 그 기간이 만료된 다음 날에 정규 경찰공무원으로 임용한다.","순경을 경장으로 근속승진임용하려면 해당 계급에서 5년 이상 근속하여야 한다.","경위를 경감으로 근속승진임용하려는 경우 해당 계급에서 8년 이상 근속한 사람을 임용할 수 있다."],"answer_index":3,"explanation":"제16조 제1항은 순경→경장 4년, 경장→경사 5년, 경사→경위 6년 6개월, 경위→경감 8년 이상의 근속을 근속승진 요건으로 정하고 있다. 시보임용기간은 1년이고(제13조 제1항), 휴직·직위해제·정직·감봉 기간은 산입하지 않는다(같은 조 제2항).","choice_notes":["제13조 제2항은 휴직기간, 직위해제기간, 정직·감봉처분 기간을 시보임용기간에 산입하지 않는다고 규정한다.","제13조 제1항의 시보임용기간은 '1년'이다.","순경→경장 근속승진 요건은 4년 이상이다.","제16조 제1항 제4호의 문언과 일치한다."],"source":"경찰공무원법 제13조·제16조","verified_note":"law.go.kr 경찰공무원법(법률 제20646호, 시행 2025.1.7.) 원문 대조(2026-11-22) 제13조·제16조","difficulty":"중","choice_truth":[false,false,false,true]},{"id":"PQ13","question":"경찰공무원의 정년에 관한 설명으로 가장 적절하지 않은 것은?","choices":["전시·사변이나 이에 준하는 비상사태에서는 2년의 범위에서 계급정년을 연장할 수 있고, 이 경우 모든 계급에 대하여 대통령의 승인만 받으면 된다.","경찰공무원의 연령정년은 60세이다.","계급정년은 치안감 4년, 경무관 6년, 총경 11년, 경정 14년이다.","경찰공무원은 그 정년이 된 날이 1월에서 6월 사이에 있으면 6월 30일에, 7월에서 12월 사이에 있으면 12월 31일에 당연퇴직한다."],"answer_index":0,"explanation":"제30조 제4항은 경무관 이상의 계급정년 연장에 대하여는 행정안전부장관(또는 해양수산부장관)과 국무총리를 거쳐 대통령의 승인을 받도록 하고, 총경·경정에 대하여는 국무총리를 거쳐 대통령의 승인을 받도록 한다. 절차를 달리 정한 ①가 가장 적절하지 않다.","choice_notes":["제30조 제4항은 경무관 이상과 총경·경정의 승인 절차를 구분하고 있다.","제30조 제1항 제1호의 문언과 일치한다.","제30조 제1항 제2호의 문언과 일치한다.","제30조 제5항의 문언과 일치한다."],"source":"경찰공무원법 제30조","verified_note":"law.go.kr 경찰공무원법(법률 제20646호, 시행 2025.1.7.) 원문 대조(2026-11-22) 제30조","difficulty":"중","choice_truth":[false,true,true,true]},{"id":"PQ14","question":"경찰법상 경찰의 임무와 사무 구분에 관한 설명으로 가장 적절하지 않은 것은?","choices":["자치경찰사무 중 수사사무에는 학교폭력 등 소년범죄, 가정폭력·아동학대 범죄, 교통사고 및 교통 관련 범죄, 경범죄 및 기초질서 관련 범죄가 포함된다.","국가경찰사무와 자치경찰사무의 구분은 대통령령으로 정하는 기준에 따라 경찰청장이 고시로 정한다.","경찰의 임무에는 범죄의 예방·진압 및 수사, 범죄피해자 보호, 경비·요인경호 및 대간첩·대테러 작전 수행 등이 포함된다.","자치경찰사무에는 지역 내 주민의 생활안전 활동, 지역 내 교통활동, 지역 내 다중운집 행사 관련 혼잡 교통 및 안전 관리에 관한 사무가 포함된다."],"answer_index":1,"explanation":"제4조 제2항은 자치경찰사무 중 생활안전·교통·다중운집 행사 관련 사무의 구체적 사항과 범위를 '대통령령으로 정하는 기준에 따라 시·도 조례'로 정하도록 하고, 수사사무는 대통령령으로 정하도록 한다. 경찰청장의 고시로 정한다는 ②가 가장 적절하지 않다.","choice_notes":["제4조 제1항 제2호 라목의 수사사무와 일치한다.","제4조 제2항은 시·도 조례로, 제3항은 대통령령으로 정하도록 하고 있다.","제3조 각 호의 임무와 일치한다.","제4조 제1항 제2호 가목~다목의 사무와 일치한다."],"source":"경찰법 제3조·제4조","verified_note":"law.go.kr 국가경찰과 자치경찰의 조직 및 운영에 관한 법률(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제3조·제4조","difficulty":"중","choice_truth":[true,false,true,true]},{"id":"PQ15","question":"스토킹범죄의 처벌 등에 관한 법률상 긴급응급조치와 잠정조치에 관한 설명으로 가장 적절한 것은?","choices":["잠정조치 중 국가경찰관서의 유치장에의 유치는 그 기간을 3개월까지 연장할 수 있다.","스토킹범죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없는 반의사불벌죄이다.","긴급응급조치는 사법경찰관이 직권으로 또는 상대방 등의 요청에 의하여 할 수 있고, 그 기간은 1개월을 초과할 수 없다.","긴급응급조치에 대한 사후승인은 사법경찰관이 직접 지방법원 판사에게 청구한다."],"answer_index":2,"explanation":"제4조 제1항은 사법경찰관이 직권 또는 상대방 등의 요청에 의하여 긴급응급조치를 할 수 있게 하고, 제5조 제5항은 그 기간이 1개월을 초과할 수 없다고 규정한다. 반의사불벌 규정은 2023. 7. 11. 삭제되었고, 사후승인은 검사가 청구하며(제5조 제1항·제2항), 유치의 기간은 1개월이다(제9조 제7항).","choice_notes":["제9조 제7항은 접근 금지 등의 잠정조치는 3개월, 유치는 1개월을 초과할 수 없다고 규정한다.","제18조 제3항은 2023. 7. 11. 삭제되어 반의사불벌죄가 아니다.","제4조 제1항과 제5조 제5항의 문언과 일치한다.","제5조 제1항·제2항에 따라 사법경찰관은 검사에게 신청하고, 검사가 판사에게 사후승인을 청구한다."],"source":"스토킹범죄의 처벌 등에 관한 법률 제4조·제5조·제9조·제18조","verified_note":"law.go.kr 스토킹범죄의 처벌 등에 관한 법률(법률 제21998호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제4조·제5조·제9조·제18조(제18조 제3항 삭제 2023.7.11. 확인)","difficulty":"상","choice_truth":[false,false,true,false]}]}],"excluded_or_held":[{"item":"2022~2026년 순경 공채 기출 1,000문항(실전 기출 모드)","reason":"2026-11-22에 받은 기출 문제지 30개 PDF(3과목 × 10회분)와 경찰청 공개 정답을 대조해 수록했다. 2026년 2차는 가답안 기준이며, 6문항은 개정으로 전제가 바뀌어 채점에서 제외했다."},{"item":"2026.10.2. 개정 전 법령을 전제로 한 수사·공소 파트 기출 16문항","reason":"채점 제외 6문항(검사의 직접수사·사건송치 요구, 수사준칙 기한 등)과 개정 안내 10문항(용어·근거 조문 확인 필요)으로 나눠 기출 화면에 배지로 표시했다. 증거법·판례 중심 문항은 현행법에서도 그대로 유효하다."},{"item":"스토킹처벌법 피해자보호명령(제17조의5~제17조의12, 제20조 제2항 제2호) 및 관련 조항","reason":"2026.4.21. 신설분의 시행일이 2027.4.22.로, 2027년 3월 시험 시점에는 아직 시행 전이다. 시험 범위 혼동을 막기 위해 제외했다."},{"item":"도로교통법 2026.10.13. 개정 조항 중 2027.4.14.·2027.10.14. 시행분(음주운전 방지장치 조건부 면허 확대 일부, 수시 적성검사 등)","reason":"2027년 3월 시험 시점에 시행 전인 조항이므로 제외했다. 제80조의2(공포일 시행)와 현행 조문만 반영했다."},{"item":"경찰관 직무집행법 제6조의2(접경지역), 제8조의4(개인정보 국외 이전)","reason":"조문은 확인했으나 시행일(2026.6.30., 2026.7.7.)과 출제 가능성이 낮아 핵심 카드에서는 제외하고 이 목록에만 남긴다. 필요 시 추가 가능."},{"item":"형법 제297조(강간)의 구체적 법정형, 제329조(절도)의 법정형","reason":"이번 조회에서 조문 원문을 직접 확보하지 않아 수치를 단정하지 않았다. 대신 원문을 확인한 제298조·제330조·제331조·제333조·제335조로 구성했다."},{"item":"2027년 순경 공채 시험 일정·선발 인원","reason":"2026-11-21 기준 공고 전이다. 확인된 2026년 일정(1차 3.14., 2차 8.22.)만 참고로 두고 2027년 날짜는 추정하지 않았다."}],"gyeolchul":{"note":"2022년 1차 ~ 2026년 2차 순경 공채 실제 기출 1,000문항(헌법 200·형사법 400·경찰학 400). 문제 텍스트는 경찰청 공개 문제지 PDF에서 추출했고, 정답은 경찰청 공개 정답(최종정답 우선, 2026년 2차는 가답안)과 대조했습니다. 모든 회차는 2026. 10. 2. 형사사법 개정 전에 시행된 시험이므로 수사·공소 절차 문항은 law 필드로 표시했습니다.","sessions":[["2026-2","2026년 2차","2026. 8. 22. 시행 · 정답: 경찰청 공개 가답안(2026. 8. 22.)"],["2026-1","2026년 1차","2026. 3. 14. 시행 · 정답: 경찰청 공개 최종정답"],["2025-2","2025년 2차","2025. 8. 30. 시행 · 정답: 경찰청 공개 최종정답"],["2025-1","2025년 1차","2025. 3. 15. 시행 · 정답: 경찰청 공개 최종정답"],["2024-2","2024년 2차","2024년 하반기 시행 · 정답: 경찰청 공개 가답안"],["2024-1","2024년 1차","2024. 3. 16. 시행 · 정답: 경찰청 공개 최종정답"],["2023-2","2023년 2차","2023. 8. 19. 시행 · 정답: 경찰청 공개 최종정답"],["2023-1","2023년 1차","2023. 3. 25. 시행 · 정답: 경찰청 공개 최종정답"],["2022-2","2022년 2차","2022. 8. 20. 시행 · 정답: 경찰청 공개 최종정답"],["2022-1","2022년 1차","2022. 3. 26. 시행 · 정답: 경찰청 공개 최종정답"]],"fmt":["session","subject","number","stem","c1","c2","c3","c4","ans","law","note"],"questions":[["2022-1","헌법",1,"헌법개정에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법개정은 국회재적의원 과반수 또는 대통령의 발의로 제안 되며, 제안된 헌법개정안은 대통령이 20일 이상의 기간 이를 공고하여야 한다.","우리 헌법의 각 개별규정 가운데 무엇이 헌법제정규정이고 무엇이 헌법개정규정인지를 구분하는 것이 가능하지 아니할 뿐 아니라, 각 개별규정에 그 효력상의 차이를 인정하여야 할 형식적인 이유를 찾을 수 없다.","제7차 헌법개정에서는 대통령이 제안한 헌법개정안은 국민투표로 확정되며, 국회의원이 제안한 헌법개정안은 국회의 의결을 거쳐 통일주체국민회의의 의결로 확정되도록 하였다.","헌법개정안이 국회에서 의결된 후 60일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻으면헌법개정은확정되며, 국회의장은즉시이를공포하여야한다.",3,0,""],["2022-1","헌법",2,"민주적 기본질서에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","현행 헌법에서 직접 ‘자유민주적 기본질서’를 명시하고 있는 것은 헌법전문(前文)과 제4조의 통일조항이다.","정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 정부는 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법재판소의 심판에 의하여 해산된다.","정당해산 사유로서의 ‘민주적 기본질서의 위배’란, 민주적 기본 질서에 대한 단순한 위반이나 저촉만으로도 족하며, 반드시 민주사회의 불가결한 요소인 정당의 존립을 제약해야 할 만큼 그 정당의 목적이나 활동이 민주적 기본질서에 대하여 실질적인 해악을 끼칠 수 있는 구체적 위험성을 초래하는 경우까지 포함 하는 것은 아니다.","헌법에서 채택하고 있는 사회국가의 원리는 자유민주적 기본 질서의 범위내에서 이루어져야 하고, 국민 개인의 자유와 창의를 보완하는 범위내에서 이루어지는 내재적 한계를 지니고 있다.",2,0,""],["2022-1","헌법",3,"법치주의에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","실종기간이 구법 시행기간 중에 만료되는 때에도 그 실종이 개정 민법 시행일 후에 선고된 때에는 상속에 관하여 개정 민법 의 규정을 적용하도록 한 민법 부칙의 조항은 재산권 보장에 관한 신뢰보호원칙에 위배된다고 볼 수 없다.","공소시효제도가 헌법 제12조 제1항 및 제13조 제1항에 정한 죄형법정주의의 보호범위에 바로 속하지 않는다면, 소급입법의 헌법적 한계는 법적 안정성과 신뢰보호원칙을 포함하는 법치 주의의 원칙에 따른 기준으로 판단하여야 한다.","신뢰보호원칙은 객관적 요소로서 법질서의 신뢰성 항구성 법적 투명성과 법적 평화를 의미하고, 이와 내적인 상호 연관 관계에 있는 법적 안정성은 한번 제정된 법규범은 원칙적으로 존속력을 갖고 자신의 행위기준으로 작용하리라는 개인의 주관적 기대이다.","임차인의 계약갱신요구권 행사 기간을 10년으로 규정한 상가 건물 임대차보호법 의 개정법 조항을 개정법 시행 후 갱신되는 임대차에 대하여도 적용하도록 규정한 동법 부칙의 규정은 신뢰 보호원칙에 위배되어 임대인의 재산권을 침해한다고 볼 수 없다.",2,0,""],["2022-1","헌법",4,"선거제도에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","대통령선거에서 대통령후보자가 1인일 때에는 그 득표수가 선거권자 총수의 3분의 1 이상이 아니면 대통령으로 당선될 수 없다.","공직선거법 상 선거일 현재 1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람 및 그 형의 집행유예를 선고 받고 유예기간 중에 있는 사람은 선거권이 없다.","지방자치단체의 장 선거권을 지방의회의원 선거권, 나아가 국회 의원 선거권 및 대통령 선거권과 구별하여 하나는 법률상의 권리로, 나머지는 헌법상의 권리로 이원화하는 것은 허용될 수 없으므로 지방자치단체의 장 선거권 역시 다른 선거권과 마찬가지로 헌법 제24조에 의해 보호되는 기본권으로 인정하여야 한다.","방송광고, 후보자 등의 방송연설, 방송시설주관 후보자연설의 방송, 선거방송토론위원회 주관 대담 토론회의 방송에서 한국 수화언어 또는 자막의 방영을 재량사항으로 규정한 공직선거법 조항이 자의적으로 비청각장애인과 청각장애인인 청구인을 달리 취급하여 청구인의 평등권을 침해한다고 보기는 어렵다.",1,0,""],["2022-1","헌법",5,"기본권의 주체에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","불법체류 중인 외국인들이라 하더라도, 불법체류라는 것은 관련 법령에 의하여 체류자격이 인정되지 않는다는 것일 뿐이므로, ‘인간의 권리’로서 외국인에게도 주체성이 인정되는 일정한 기본권에 관하여불법체류여부에따라그인정여부가달라지는것은 아니다.","근로의 권리의 구체적인 내용에 따라, 국가에 대하여 고용증진을 위한 사회적 경제적 정책을 요구할 수 있는 권리는 사회권적 기본권으로서 국민에 대하여만 인정해야 하지만, 자본주의 경제 질서하에서 근로자가 기본적 생활수단을 확보하고 인간의 존엄성을 보장받기 위하여 최소한의 근로조건을 요구할 수 있는 권리는 자유권적 기본권의 성격도 아울러 가지므로 이러한 경우 외국인 근로자에게도 그 기본권 주체성을 인정함이 타당하다.","청구인은 공법상 재단법인인 방송문화진흥회가 최다출자자인 방송사업자로서 방송법 등 관련 규정에 의하여 공법상의 의무를 부담하고 있으므로, 그 설립목적이 언론의 자유의 핵심 영역인 방송 사업이라고 하더라도 이러한 업무수행과 관련해서는 기본권 주체가 될 수 없다.","대통령도 국민의 한사람으로서 제한적으로나마 기본권의 주체가 될 수 있는바, 대통령은 소속 정당을 위하여 정당활동을 할 수 있는 사인으로서의 지위와 국민 모두에 대한 봉사자로서 공익 실현의 의무가 있는 헌법기관으로서의 지위를 동시에 갖는데 최소한 전자의 지위와 관련하여는 기본권 주체성을 갖는다고 할 수 있다.",2,0,""],["2022-1","헌법",6,"기본권의 제한에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형법 제304조 중 “혼인을 빙자하여 음행의 상습없는 부녀를 기망하여 간음한 자” 부분은 형벌규정을 통하여 추구하고자 하는 목적 자체가 헌법에 의하여 허용되지 않는 것으로서 그 정당성이 인정되지 않는다.","배우자 있는 자의 간통행위 및 그와의 상간행위를 2년 이하의 징역에 처하도록 규정한 형법 제241조는 선량한 성풍속 및 일부일처제에 기초한 혼인제도를 보호하고 부부간 정조의무를 지키게 하기 위한 것으로 그 입법목적의 정당성은 인정된다.","운전면허를 받은 사람이 다른 사람의 자동차등을 훔친 경우에는 운전면허를 필요적으로 취소하도록 한 구 도로교통법 조항 중 ‘다른 사람의 자동차등을 훔친 경우’ 부분은 다른 사람의 자동차 등을 훔친 범죄행위에 대한 행정적 제재를 강화하여 자동차등의 운행과정에서 야기될 수 있는 교통상의 위험과 장해를 방지함 으로써 안전하고 원활한 교통을 확보하고자 하는 것으로서 그 입법목적이 정당하다.","형법 제269조 제1항의 자기낙태죄 조항은 태아의 생명을 보호하기 위한 것으로서 그 입법목적은 정당하지만, 낙태를 방지하기 위하여 임신한 여성의 낙태를 형사처벌하는 것은 이러한 입법 목적을 달성하는 데 적절하고 실효성 있는 수단이라고 할 수 없다.",3,0,""],["2022-1","헌법",7,"인간의 존엄과 가치에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","친생부인의 소의 제척기간을 규정한 민법 규정 중 “부(夫)가 그 사유가 있음을 안 날부터 2년내” 부분은 부(夫)가 가정생활과 신분관계에서 누려야 할 인격권을 침해한다.","수용자를 교정시설에 수용할 때마다 전자영상 검사기를 이용하여 수용자의 항문 부위에 대한 신체검사를 하는 것이 수용자의 인격권을 침해하는 것은 아니다.","외부 민사재판에 출정할 때 운동화를 착용하게 해달라는 수형자인 청구인의 신청에 대하여 이를 불허한 피청구인 교도소장의 행위는 청구인의 인격권을 침해한다고 볼 수 없다.","선거기사심의위원회가 불공정한 선거기사를 보도하였다고 인정한 언론사에 대하여 언론중재위원회를 통하여 사과문을 게재할 것을 명하도록 하는 공직선거법 조항 중 ‘사과문 게재’ 부분과, 해당 언론사가 사과문 게재 명령을 지체 없이 이행하지 않을 경우 형사처벌하는 구 공직선거법 규정 중 해당 부분은 언론사의 인격권을 침해한다.",0,0,""],["2022-1","헌법",8,"일반적 행동자유권에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 헌법 제10조 전문의 행복추구권에는 일반적 행동자유권이 포함되는바, 이는 적극적으로 자유롭게 행동을 하는 것은 물론 소극적으로 행동을 하지 않을 자유도 포함하는 권리로 포괄적인 의미의 자유권이다. ㉡ 육군 장교가 민간법원에서 약식명령을 받아 확정되면 자진 신고할 의무를 규정한, ‘2020년도 장교 진급 지시’의 해당 부분 중‘민간법원에서약식명령을 받아 확정된 사실이있는 자’에 관한 부분은 청구인인 육군 장교의 일반적 행동의 자유를 침해한다. ㉢ 일반적 행동자유권의 보호영역에는 가치 있는 행동뿐만 아니라 개인의 생활방식과 취미에 관한 사항도 포함되며, 여기에는 위험한 스포츠를 즐길 권리와 같은 위험한 생활방식으로 살아갈 권리도 포함된다. 따라서 운전 중 휴대용 전화를 사용할 자유는 헌법 제10조의 행복추구권에서 나오는 일반적 행동 자유권의 보호영역에 속한다. ㉣ 의료분쟁 조정신청의 대상인 의료사고가 사망에 해당하는 경우 한국의료분쟁조정중재원의 원장은 지체 없이 조정절차를 개시해야 한다고 규정한 의료사고 피해구제 및 의료분쟁 조정 등에 관한 법률 제27조 제9항 전문 중 ‘사망’에 관한 부분이 청구인의 일반적 행동의 자유를 침해한다고 할 수 없다.","㉠㉡","㉠㉢㉣","㉡㉢㉣","㉠㉡㉢㉣",1,0,""],["2022-1","헌법",9,"표현의 자유에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","‘익명표현’은 표현의 자유를 행사하는 하나의 방법으로서 그 자체로 규제되어야 하는 것은 아니고, 부정적 효과가 발생 하는 것이 예상되는 경우에 한하여 규제될 필요가 있다.","헌법 제21조 제4항 전문은 “언론 출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니 된다.”라고 규정하고 있는바, 이는 헌법상 표현의 자유의 보호영역에 대한 한계를 설정한 것이라고 보아야 한다.","‘음란표현’은 헌법상 언론 출판의 자유의 보호영역 밖에 있다고 보아야 한다.","인터넷언론사에 대하여 선거일 전 90일부터 선거일까지 후보자 명의의 칼럼이나 저술을 게재하는 보도를 제한하는 구 인터넷 선거보도 심의기준 등에 관한 규정 은 인터넷 선거보도의 공정성과 선거의 공정성을 확보하려는 것이므로 후보자인 청구인의 표현의 자유를 침해하지 않는다.",0,0,""],["2022-1","헌법",10,"헌법상 신체의 자유에 관한 규정 중 가장 적절하지 않은 것은?","누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니한다. 체포 또는 구속을 당한 자의 가족 등 법률이 정하는 자에게는 그 이유와 일시 장소가 지체없이 통지되어야 한다.","체포 구속 압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다. 다만, 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다.","모든 국민은 신체의 자유를 가진다. 누구든지 법률과 적법절차에 의하지 아니하고는 체포 구속 압수 수색을 받지 아니하며, 법률에 의하지 아니하고는 심문 처벌 보안처분 또는 강제노역을 받지 아니한다.","피고인의 자백이 고문 폭행 협박 구속의 부당한 장기화 또는 기망 기타의 방법에 의하여 자의로 진술된 것이 아니라고 인정될 때 또는 정식재판에 있어서 피고인의 자백이 그에게 불리한 유일한 증거일 때에는 이를 유죄의 증거로 삼거나 이를 이유로 처벌 할 수 없다.",2,0,""],["2022-1","헌법",11,"개인정보자기결정권에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","아동 청소년 성매수죄로 유죄가 확정된 자는 신상정보 등록대 상자가 되도록 규정한 성폭력범죄의 처벌 등에 관한 특례법 제42조 제1항 중 “구 아동 청소년의 성보호에 관한 법률 제2조 제2호 가운데 제10조 제1항의 범죄로 유죄판결이 확정된 자는 신상정보 등록대상자가 된다.”는 부분은 청구인의 개인정보자기 결정권을 침해하지 않는다.","성적목적공공장소침입죄로 형을 선고받아 유죄판결이 확정된 자는 신상정보 등록대상자가 된다고 규정한 성폭력범죄의 처벌 등에 관한 특례법 제42조 제1항 중 “제12조의 범죄로 유죄판결이 확정된 자”에 관한 부분은 청구인의 개인정보자기결정권을 침해 하지 않는다.","통신매체이용음란죄로 유죄판결이 확정된 자는 신상정보 등록 대상자가 된다고 규정한 성폭력범죄의 처벌 등에 관한 특례법 제42조 제1항 중 “제13조의 범죄로 유죄판결이 확정된 자는 신상정보 등록대상자가 된다.”는 부분은 청구인의 개인정보자기 결정권을 침해한다.","가상의 아동 청소년이용음란물배포죄로 유죄판결이 확정된 자는 신상정보 등록대상자가 되도록 규정한 성폭력범죄의 처벌 등에 관한 특례법 제42조 제1항 중 구 아동 청소년의 성보호에 관한 법률 제8조 제4항의 아동 청소년이용음란물 가운데 “아동 청소년으로 인식될 수 있는 사람이나 표현물이 등장하는 것”에 관한 부분으로 유죄판결이 확정된 자에 관한 부분은 청구인의 개인정보자기결정권을 침해한다.",3,0,""],["2022-1","헌법",12,"대학의 자치에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","대학 본연의 기능인 학술의 연구나 교수, 학생선발 지도 등과 관련된 교무 학사행정의 영역에서는 대학구성원의 결정이 우선 한다고 볼 수 있으나, 대학의 재정, 시설 및 인사 등의 영역에서는 학교법인이 기본적인 윤곽을 결정하게 되므로, 대학구성원에게는 이러한 영역에 대한 참여권이 인정될 여지가 없다.","헌법 제31조 제4항이 규정하는 교육의 자주성 및 대학의 자율성은 헌법 제22조 제1항이 보장하는 학문의 자유의 확실한 보장을 위해 꼭 필요한 것으로서 대학에 부여된 헌법상 기본권인 대학의 자율권이므로, 국립대학인 청구인도 이러한 대학의 자율권의 주체로서 헌법소원심판의 청구인능력이 인정된다.","대학의 자율성 즉, 대학의 자치란 대학이 그 본연의 임무인 연구와 교수를 외부의 간섭 없이 수행하기 위하여 인사 학사 시설 재정 등의 사항을 자주적으로 결정하여 운영하는 것을 말한다. 따라서 연구 교수활동의 담당자인 교수가 그 핵심주체라 할 것이나, 연구 교수활동의 범위를 좁게 한정할 이유가 없으므로 학생, 직원 등도 포함될 수 있다.","이사회와 재경위원회에 일정 비율 이상의 외부인사를 포함하는 내용 등을 담고 있는 구 국립대학법인 서울대학교 설립 운영에 관한 법률 규정의 이른바 ‘외부인사 참여 조항’이 대학의 자율의 본질적인 부분을 침해하였다고 볼 수 없다.",0,0,""],["2022-1","헌법",13,"다음 사례에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 청구인 A는 경장으로 근무 중인 사람으로서 공무원보수규정 의 해당 부분이 경찰공무원 임용령 시행규칙 상의 ‘계급환산기준표’ 및 ‘호봉획정을 위한 공무원경력의 상당계급기준표’에 따라 경찰 공무원인 자신의 1호봉 봉급월액을 청구인의 계급에 상당하는 군인 계급인 중사의 1호봉 봉급월액에 비해 낮게 규정함으로써 자신의 기본권을 침해한다고 주장하면서 2007년 4월 16일 그 위헌확인을 구하는 헌법소원심판을 청구하였다.","청구인 A는 공무원보수규정 의 해당 부분이 자신의 평등권, 재산권, 직업선택의 자유 및 행복추구권 등을 침해한다고 주장 하는바, 이는 기본권 충돌에 해당한다.","경찰공무원과 군인은 공무원보수규정 상의 봉급표에 있어서 본질적으로 동일 유사한 지위에 있다고 볼 수 없으므로 청구인 A의 평등권 침해는 문제되지 않는다.","직업의 자유에 ‘해당 직업에 합당한 보수를 받을 권리’까지 포함 되어 있다고 보아야 하므로, 경장의 1호봉 봉급월액을 중사의 1호봉 봉급월액보다 적게 규정한 것은 청구인 A의 직업수행의 자유를 침해한 것이다.","공무원의 보수청구권은, 법률 및 법률의 위임을 받은 하위법령에 의해 그 구체적 내용이 형성되면 재산적 가치가 있는 공법상의 권리가 되어 재산권의 내용에 포함되지만, 법령에 의하여 구체적 내용이 형성되기 전의 권리, 즉 공무원이 국가 또는 지방자치 단체에 대하여 어느 수준의 보수를 청구할 수 있는 권리는 단순한 기대이익에 불과하여 재산권의 내용에 포함된다고 볼 수 없으므로 공무원보수규정 의 해당 부분은 청구인 A의 재산권을 침해 하지 않는다.",3,0,""],["2022-1","헌법",14,"통신의 자유에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","통신비밀보호법 상 ‘통신’이라 함은 우편물 및 전기통신을 말한다.","전기통신역무제공에 관한 계약을 체결하는 경우 전기통신사업자로 하여금 가입자에게 본인임을 확인할 수 있는 증서 등을 제시 하도록 요구하고 부정가입방지시스템 등을 이용하여 본인인지 여부를 확인하도록 한 전기통신사업법 조항 및 전기통신사업법 시행령 조항은 이동통신서비스에 가입하려는 청구인들의 통신의 비밀을 제한한다.","통신비밀보호법 조항 중 ‘인터넷회선을 통하여 송 수신하는 전기통신’에 관한 부분은 인터넷회선 감청의 특성을 고려하여 그 집행 단계나 집행 이후에 수사기관의 권한 남용을 통제하고 관련 기본권의 침해를 최소화하기 위한 제도적 조치가 제대로 마련되어 있지 않은 상태에서, 범죄수사 목적을 이유로 인터넷 회선 감청을 통신제한조치 허가 대상 중 하나로 정하고 있으므로 청구인의 기본권을 침해한다.","미결수용자가 교정시설 내에서 규율위반행위 등을 이유로 금치 처분을 받은 경우 금치기간 중 서신수수, 접견, 전화통화를 제한 하는 형의 집행 및 수용자의 처우에 관한 법률 조항 중 미결 수용자에게 적용되는 부분은 미결수용자인 청구인의 통신의 자유를 침해하지 않는다.",1,0,""],["2022-1","헌법",15,"인간다운 생활을 할 권리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국가가 인간다운 생활을 보장하기 위한 헌법적 의무를 다하였는 지의 여부가 사법적 심사의 대상이 된 경우에는, 국가가 최저 생활보장에 관한 입법을 전혀 하지 아니하였다든가 그 내용이 현저히 불합리하여 헌법상 용인될 수 있는 재량의 범위를 명백히 일탈한 경우에 한하여 헌법에 위반된다.","65세 미만의 일정한 노인성 질병이 있는 사람의 장애인 활동 지원급여 신청자격을 제한하는 장애인활동 지원에 관한 법률 제5조 제2호 본문 중 ‘ 노인장기요양보험법 제2조 제1호에 따른 노인 등’ 가운데 ‘65세 미만의 자로서 치매 뇌혈관성질환 등 대통령령으로 정하는 노인성 질병을 가진 자’에 관한 부분은 합리적 이유가 있다고 할 것이므로 평등원칙에 위반되지 않는다.","업무상 질병으로 인한 업무상 재해에 있어 업무와 재해 사이의 상당인과관계에 대한 입증책임을 이를 주장하는 근로자나 그 유족에게 부담시키는 산업재해보상보험법 규정이 근로자나 그 유족의 사회보장수급권을 침해한다고 볼 수 없다.","공무원연금법 에 따른 퇴직연금일시금을 지급받은 사람 및 그 배우자를 기초연금 수급권자의 범위에서 제외하는 것은 한정된 재원으로 노인의 생활안정과 복리향상이라는 기초연금법 의 목적을 달성하기 위한 것으로서 합리성이 인정되므로 인간다운 생활을 할 권리를 침해한다고 볼 수 없다.",1,0,""],["2022-1","헌법",16,"근로의 권리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","근로의 권리는 국가의 개입 간섭을 받지 않고 자유로이 근로를 할 자유와, 국가에 대하여 근로의 기회를 제공하는 정책을 수립해 줄 것을 요구할 수 있는 권리 등을 기본적인 내용으로 하고 있고, 이 때 근로의 권리는 근로자를 개인의 차원에서 보호하기 위한 권리로서 개인인 근로자가 근로의 권리의 주체가 되는 것이고, 노동조합은 그 주체가 될 수 없다.","일용근로자로서 3개월을 계속 근무하지 아니한 자를 해고예고 제도의 적용제외사유로 규정하고 있는 근로기준법 규정은 일용근로자인 청구인의 근로의 권리를 침해하지 않는다.","청원경찰의 복무에 관하여 국가공무원법 의 해당 조항을 준용 함으로써 노동운동을 금지하는 청원경찰법 의 해당 조항 중 국가공무원법 의 해당 조항 가운데 ‘노동운동’ 부분을 준용하는 부분은 국가기관이나 지방자치단체 이외의 곳에서 근무하는 청원경찰인 청구인들의 근로3권을 침해한다.","공항 항만 등 국가중요시설의 경비업무를 담당하는 특수경비원 에게 경비업무의 정상적인 운영을 저해하는 일체의 쟁의행위를 금지하는 경비업법 의 해당 조항은 특수경비원의 단체행동권을 박탈하여 근로3권을 규정하고 있는 헌법 제33조 제1항에 위배된다.",3,0,""],["2022-1","헌법",17,"환경권에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공직선거법 이 정온한 생활환경이 보장되어야 할 주거지역에서 출근 또는 등교 이전 및 퇴근 또는 하교 이후 시간대에 확성 장치의 최고출력 내지 소음을 제한하는 등 사용시간과 사용지역에 따른 수인한도 내에서 확성장치의 최고출력 내지 소음 규제기준에 관한 규정을 두지 아니한 것은 청구인의 건강하고 쾌적한 환경에서 생활할 권리를 침해한다.","독서실과 같이 정온을 요하는 사업장의 실내소음 규제기준을 만들어야 할 입법의무가 헌법의 해석상 곧바로 도출된다고 보기는 어렵다.","환경권의 내용과 행사는 법률에 의해 구체적으로 정해지는 것 이기는 하나(헌법 제35조 제2항), 이 헌법조항의 취지는 특별히 명문으로 헌법에서 정한 환경권을 입법자가 그 취지에 부합하도록 법률로써 내용을 구체화하도록 한 것이지 환경권이 완전히 무의미 하게 되는데도 그에 대한 입법을 전혀 하지 아니하거나, 어떠한 내용이든 법률로써 정하기만 하면 된다는 것은 아니다.","국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 대한 보호의무를 다하지 않았는지 여부를 헌법재판소가 심사할 때에는 국가가 이를 보호하기 위하여 적어도 적절하고 효율적인 최소한의 보호조치를 취하였는가 하는 이른바 ‘과잉입법금지원칙’ 내지 ‘비례의 원칙’의 위반 여부를 기준으로 삼아야 한다.",3,0,""],["2022-1","헌법",18,"재판청구권에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법은 “군인 또는 군무원이 아닌 국민은 대한민국의 영역안에서는 중대한 군사상 기밀 초병 초소 유독음식물공급 포로 군용물에 관한 죄중 법률이 정한 경우와 비상계엄이 선포된 경우를 제외 하고는 군사법원의 재판을 받지 아니한다.”고 규정하고 있다.","소환된 증인 또는 그 친족 등이 보복을 당할 우려가 있는 경우, 재판장은 피고인을 퇴정시키고 증인신문을 행할 수 있도록 규정한 특정범죄신고자 등 보호법 조항은 피고인의 형사소송법 상의 반대신문권을 제한하고 있어 피고인의 공정한 재판을 받을 권리를 침해한다.","법관기피신청이 소송의 지연을 목적으로 함이 명백한 경우에 신청을 받은 법원 또는 법관은 결정으로 이를 기각할 수 있도록 규정한 형사소송법 제20조 제1항이 헌법상 보장되는 공정한 재판을 받을 권리를 침해하는 것은 아니다.","형사재판에 계속 중인 사람에 대하여 출국을 금지할 수 있다고 규정한 출입국관리법 제4조 제1항 제1호는 유죄를 근거로 형사재판에 계속 중인 사람에게 사회적 비난 내지 응보적 의미의 제재를 가하려는 것이라고 보기 어려우므로 무죄추정의 원칙에 위배된다고 볼 수 없다.",1,0,""],["2022-1","헌법",19,"형사보상에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형사보상의 청구에 대한 보상의 결정에 대하여는 불복을 신청 할 수 없도록 단심재판으로 규정한 형사보상법 조항은 형사 보상인용결정의 안정성을 유지하고, 신속한 형사보상절차의 확립을 통해 형사보상에 관한 국가예산 수립의 안정성을 확보하며, 나아가 상급법원의 부담을 경감하고자 하는 데 그 목적이 있으므로 청구인들의 형사보상청구권을 침해하지 않는다.","형사보상의 청구를 무죄재판이 확정된 때로부터 1년 이내에 하도록 규정하고 있는 형사보상법 조항은 입법재량의 한계를 일탈하여 청구인의 형사보상청구권을 침해한다.","형사보상 및 명예회복에 관한 법률 에 따르면 본인이 수사 또는 심판을 그르칠 목적으로 거짓 자백을 하거나 다른 유죄의 증거를 만듦으로써 기소, 미결구금 또는 유죄재판을 받게 된 것으로 인정된 경우에는 법원은 재량으로 보상청구의 전부 또는 일부를 기각할 수 있다.","국가의 형사사법행위가 고의 과실로 인한 것으로 인정되는 경우 에는 국가배상청구 등 별개의 절차에 의하여 인과관계 있는 모든 손해를 배상받을 수 있으므로, 형사보상절차로써 인과관계 있는 모든 손해를 보상하지 않는다고 하여 반드시 부당하다고 할 수는 없다.",0,0,""],["2022-1","헌법",20,"공무담임권에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무담임권은 국가 등에게 능력주의를 존중하는 공정한 공직자 선발을 요구할 수 있는 권리라는 점에서 직업선택의 자유보다는 그 기본권의 효과가 현실적 구체적이므로, 공직을 직업으로 선택하는 경우에 있어서 직업선택의 자유는 공무담임권을 통해서 그 기본권보호를 받게 된다고 할 수 있으므로 공무담임권을 침해하는지 여부를 심사하는 이상 이와 별도로 직업선택의 자유 침해 여부를 심사할 필요는 없다.","공무담임권의 보호영역에는 일반적으로 공직취임의 기회보장, 신분박탈, 직무의 정지가 포함될 뿐이고 ‘승진시험의 응시제한’이나 이를 통한 승진기회의 보장 문제는 공직신분의 유지나 업무수행 에는 영향을 주지 않는 단순한 내부 승진인사에 관한 문제에 불과하여 공무담임권의 보호영역에 포함된다고 보기 어렵다.","서울교통공사는 공익적인 업무를 수행하기 위한 지방공사이나 서울특별시와 독립적인 공법인으로서 경영의 자율성이 보장되고, 서울교통공사의 직원의 신분도 지방공무원법 이 아닌 지방 공기업법 과 정관에서 정한 바에 따르는 등, 서울교통공사의 직원이라는 직위가 헌법 제25조가 보장하는 공무담임권의 보호 영역인 ‘공무’의 범위에는 해당하지 않는다.","금고 이상의 형의 선고유예를 받고 그 기간 중에 있는 자를 임용결격사유로 삼고, 위 사유에 해당하는 자가 임용되더라도 이를 당연무효로 하는 구 국가공무원법 조항은 입법자의 재량을 일탈하여 청구인의 공무담임권을 침해한다.",3,0,""],["2022-1","형사법",1,"죄형법정주의에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 법규범의 문언은 어느 정도 가치개념을 포함한 일반적 규범적 개념을 사용하지 않을 수 없는 것이기 때문에 기본적 으로 최소한이 아닌 최대한의 명확성을 요구한다. ㉡ 유추해석금지의 원칙은 형벌법규의 구성요건과 가벌성에 관한 규정에 준용되므로 형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하고 있는 경우에 그 행정법규의 규정을 해석하는 데에도 마찬가지로 적용된다. ㉢ 대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정한 경우, 소급효금지의 원칙에 위반된다. ㉣ 알 수 없는 경위로 가상자산을 이체받은 자가 가상자산을 사용 처분한 경우 이를 형사처벌하는 명문의 규정이 없다고 하더라도 착오송금 시 횡령죄 성립을 긍정한 판례를 유추하여 신의칙을 근거로 배임죄로 처벌하는 것은 죄형법정주의에 반하지 않는다. ㉤ 형법 제258조의2 특수상해죄의 신설로 형법 제262조, 제261조의 특수폭행치상죄에 대하여 그 문언상 특수상해죄의 예에 의하여 처벌하는 것이 가능하게 되었다는 이유만으로 형법 제258조의2 제1항의 예에 따라 처벌할 수 있다고 하는 것은 죄형법정주의에 반한다.","㉠㉡㉢","㉠㉢㉣","㉠㉢㉤","㉡㉣㉤",1,0,""],["2022-1","형사법",2,"형법 의 시간적 적용범위에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","구법에 규정된 형이 ‘3년 이하의 징역’이고 신법에 규정된 형이 ‘5년 이하의 징역 또는 1천만원 이하의 벌금’이라면 벌금형이 병과되었다는 점에서 형이 경하게 변경된 것이므로 형법 제1조 제2항에 따라 신법을 적용하여야 한다.","법률이념의 변경에 의한 것이 아니라 다른 사정의 변천에 따라 그때 그때의 특수한 필요에 대처하기 위하여 법령이 개폐된 경우라 하더라도 형법 제1조 제2항이 적용된다.","법원이 인정하는 범죄사실이 공소사실과 차이가 없이 동일한 경우에는 비록 검사가 재판시법인 신법의 적용을 구하였더라도 그 범행에 대한 형의 경중의 차이가 없으면 공소장변경절차를 거치지 않아도 구법을 적용할 수 있다.","포괄일죄에 관한 기존 처벌법규에 대하여 그 표현이나 형량과 관련한 개정을 하는 경우가 아니라 애초에 죄가 되지 아니하던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우에는 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여도 신설된 법규를 적용하여 처벌할 수 있다.",2,0,""],["2022-1","형사법",3,"(가)와 (나)에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함) (가) 일정한 기간 내에 잘못된 상태를 바로 잡으라는 행정청의 지시를 이행하지 않았다는 것을 구성요건으로 하는 범죄 (나) 형법 제250조 제1항의 살인죄와 같이 그 규정 형식으로 보아 작위를 내용으로 하는 범죄를 부작위에 의하여 범하는 범죄","(가)와 (나)의 구별에 있어 형식설에 의할 경우, 형법 제103조 제1항의 전시군수계약불이행죄와 형법 제116조의 다중불해산죄는 (가)의 경우에 해당한다.","유기죄에서의 보호의무를 법률상 계약상 보호의무로 국한하는 입장에 따르면 (나)에서의 보호의무는 유기죄의 보호의무보다 넓게 된다.","(나)는 고의에 의해서는 물론 과실범 처벌규정이 있는 한 과실에 의해서도 성립가능하다.","(나)의 요건으로 행위정형의 동가치성을 요구하는 것은 형사 처벌을 확장하는 기능을 한다.",3,0,""],["2022-1","형사법",4,"고의에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 행정상의 단속을 주안으로 하는 법규라 하더라도 명문규정이 있거나 해석상 과실범도 벌할 뜻이 명확한 경우를 제외하고는 형법의 원칙에 따라 고의가 있어야 벌할 수 있다. ㉡ 형법 제167조 제1항의 일반물건방화죄에서 ‘공공의 위험 발생’은 고의의 인식 대상이 아니다. ㉢ 형법 제136조 제1항의 공무집행방해죄에 있어서의 범의는 상대방이 직무를 집행하는 공무원이라는 사실과 이에 대하여 폭행 또는 협박을 한다는 인식, 그리고 그 직무집행을 방해할 의사를 내용으로 한다. ㉣ 방조범은 2중의 고의를 필요로 하므로 정범이 정하는 범죄의 일시, 장소, 객체 등을 구체적으로 인식하여야 하며, 나아가 정범이 누구인지 확정적으로 인식해야 한다. ㉤ 친족상도례가 적용되기 위하여는 친족관계가 객관적으로 존재하여야 하나, 행위자가 이를 인식할 필요는 없다.","㉠㉡㉢","㉠㉣㉤","㉡㉢㉣","㉢㉣㉤",2,0,""],["2022-1","형사법",5,"甲은 乙에게 A를 살해하라고 교사하였다. 甲의 청부를 받아 들인 乙은 A라고 생각되는 사람이 골목길에 들어서는 것을 보고 그가 집에 들어가려는 순간을 기다려 총을 쏘았다. 사망을 확인하기 위하여 다가가서 보니 죽은 사람은 A가 아니라 A와 꼭 닮은 동생 B였다. 이 사례에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","乙의 착오를 객체의 착오로 보고 구체적 부합설을 따르는 견해에 의하면 乙에게는 살인미수죄와 과실치사죄의 상상적 경합이 인정된다.","만일 乙이 A가 오는 것을 보고 총을 쏘았으나 빗나가서 그 옆에 있던 C 소유의 자전거에 맞고 자전거의 일부가 손괴된 경우, 乙의 행위는 발생사실인 과실재물손괴죄로 처벌된다.","乙의 착오를 객체의 착오로 보고 이에 기반을 둔 甲의 착오도 객체의 착오로 보는 경우, 구체적 부합설을 따르는 견해에 의하면 甲에게는 살인미수죄와 과실치사죄의 상상적 경합이 인정된다.","乙의 착오를 객체의 착오로 보고 이에 기반을 둔 甲의 착오를 방법의 착오로 보는 경우, 법정적 부합설을 따르는 견해에 의하면 甲은 살인죄의 교사범으로 처벌된다.",3,0,""],["2022-1","형사법",6,"甲은 층간소음문제로 평소 다툼이 있던 아파트 위층에 앙갚음을 할 마음으로 돌을 던져 유리창을 깨트렸다. 그런데 위층에 살던 A는 빚 독촉에 시달리다 자살하기로 마음먹고 창문을 닫은 채 연탄불을 피운 결과, 연탄가스에 중독되어 쓰러져 있던 상태였다. 유리창을 깨트린 甲의 행위로 인하여 A는 구조되었다. 이 사례에서 甲이 무죄라는 견해에 관한 설명으로 가장 적절하지 않은 것은?","범죄성립에있어서결과반가치만을고려하는입장에서주장될수있다.","객관적으로 존재하는 정당화요건은 기수범 처벌에 대한 감경 가능성으로만 고려될 수 있다.","객관적정당화사정의존재가행위자에게유리하게작용하는경우이다.","주관적 정당화사정이 있는 경우와 없는 경우를 동일하게 취급 한다는 비판이 가능하다.",1,0,""],["2022-1","형사법",7,"다음은 위법성조각사유에 관한 어떤 규정을 설명한 것이다. 이 규정을 적용할 때 甲을 벌하지 아니하는 경우에 해당하는 것은? (다툼이 있는 경우 판례에 의함) 이 규정은 사회상규라는 초법규적 위법성조각사유를 일반적 포괄적 위법성조각사유로 명문화해 놓은 것으로서, 다른 위법성 조각사유에 대한 일반적 보충적 성격을 지니고 있는 것으로 볼 수 있다.","A가 칼을 들고 찌르자 甲이 그 칼을 뺏어 반격을 가한 결과 A에게 상해를 입힌 경우","甲이 자신의 차를 가로막고 서서 통행을 방해하는 A를 향해 차를 조금씩 전진시키고 A가 뒤로 물러나면 다시 차를 전진 시키는 방식의 운행을 반복한 경우","甲과 A가 공모하여 교통사고를 가장해 보험금을 편취할 목적으로 A에게 상해를 입힌 경우","甲이 방송국 시사프로그램을 시청한 후 방송국 홈페이지의 시청자 의견란에 “그렇게 소중한 자식을 범법행위의 변명의 방패로 쓰시다니 정말 대단하십니다.”는 등의 표현이 담긴 글을 게시한 경우",3,0,""],["2022-1","형사법",8,"범죄의 성립에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","성장교육과정을 통하여 형성된 내재적인 관념 내지 확신으로 인하여 행위자 스스로의 의사결정이 사실상 강제된 상태에서 행한 행위도 형법 제12조에 정한 강요된 행위에 해당한다.","자신의 행위가 위법함을 인식하지 못한 이유가 단순한 법률의 부지로 인한 경우라 하더라도 그 오인에 정당한 이유가 있는 경우에 한하여 책임이 조각된다.","음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 교통사고를 일으킨 경우는 음주시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 과실에 의한 원인에 있어서 자유로운 행위에 해당한다.","법률의 착오와 관련하여 위법성의 인식에 필요한 노력의 정도는 행위자 개인의 인식능력이 기준이 되는 것이므로, 행위자가 어떤 사회집단에 소속되어 있는가는 고려할 필요가 없다.",2,0,""],["2022-1","형사법",9,"예비와 미수에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 미수범이란 행위를 종료했더라도 결과가 발생하지 아니한 경우를 말하는 것이므로 결과가 발생한 경우에는 미수범이 성립할 여지가 없다. ㉡ 강도치상죄와는 달리 강도상해죄는 강도가 미수에 그쳤다면 상해가 발생하였어도 강도상해죄의 미수에 해당한다. ㉢ 대법원은 예비죄의 실행행위성을 긍정하는 입장에 서 있으 므로 예비죄의 공동정범뿐만 아니라 예비죄에 대한 종범의 성립도 긍정한다. ㉣ 저작권 침해 게시물을 인터넷 웹사이트 서버 등에 업로드 하여 공중의 구성원이 개별적으로 선택한 시간과 장소에서 접근할 수 있도록 이용에 제공하였더라도 공중에게 침해 게시물을 실제로 송신하지 않았다면 저작권법상 공중송신권 침해는 기수에 이르지 않는다. ㉤ 교사를 받은 자가 범죄의 실행 자체를 승낙하지 아니하거나 실행을 승낙하고 실행의 착수에 이르지 않은 경우, 교사자는 예비 음모에 준하여 처벌된다.","1개","2개","3개","4개",0,0,""],["2022-1","형사법",10,"동시범에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 시간적 차이가 있는 독립행위가 경합한 경우, 그 결과발생의 원인된 행위가 판명되지 아니한 때에 형법 제263조가 적용 되는 경우를 제외하고는 형법 제19조가 적용된다. ㉡ 독립행위가 경합하여 상해의 결과를 발생하게 한 경우에 있어서 원인된 행위가 판명되지 아니한 때에는 각 행위자를 미수범으로 처벌한다. ㉢ 형법 제263조의 동시범은 강간치상죄에는 적용할 수 없다. ㉣ A가 甲으로부터 폭행을 당하고 얼마 후 함께 A를 폭행하자는 甲의 연락을 받고 달려 온 乙로부터 다시 폭행을 당하고 사망하였으나 사망의 원인행위가 판명되지 않았다면, 형법 제263조가 적용되어 甲과 乙은 폭행치사죄의 공동정범의 예에 의하여 처벌된다.","1개","2개","3개","4개",1,0,""],["2022-1","형사법",11,"정범 및 공범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공모공동정범에 있어서 공모자가 공모에 주도적으로 참여하여 다른 공모자의 실행에 영향을 미친 때에는 범행을 저지하기 위하여 적극적으로 노력하는 등 실행에 미친 영향력을 제거하지 아니하는 한 공모관계에서 이탈하였다고 할 수 없다.","피교사자가 교사자의 교사행위 당시에는 일응 범행을 승낙하지 아니한 것으로 보여진다 하더라도 이후 그 교사행위에 의하여 범행을결의한것으로인정되는이상교사범의성립에는영향이없다.","甲이 책임무능력자를 이용하여 범행한 사례에 있어서 공범의 종속 정도와 관련하여 제한종속형식설을 취하는 경우, 공범의 우위성에 따라 甲에게는 교사범이 성립하므로 간접정범이 성립할 여지가 없다.","어느 행위로 인하여 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다.",2,0,""],["2022-1","형사법",12,"공범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는 형법 제33조 (공범과 신분) 단서가 형법 제31조(교사범) 제1항에 우선하여 적용된다.","교사범이 성립하기 위해 교사범의 교사가 정범의 범행에 대한 유일한 조건일 필요는 없다.","종범은 정범의 실행행위 중에 이를 방조하는 경우는 물론이고 실행의 착수 전에 장래의 실행행위를 예상하고 이를 용이하게 하는 행위를 하여 방조한 경우에도 성립할 수 있고, 이 경우 정범이 실행에 착수하지 않았다 하더라도 종범 성립에는 영향이 없다.","형법상 방조행위는 정범의 실행행위를 용이하게 하는 직접, 간접의 모든 행위를 가리키는 것으로서 작위에 의한 경우뿐만 아니라 부작위에 의하여도 성립된다.",2,0,""],["2022-1","형사법",13,"죄수에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","예금주인 현금카드 소유자를 협박하여 그 카드를 갈취한 다음 피해자의 승낙에 의하여 현금카드를 사용할 권한을 부여받아 이를 이용하여 현금자동지급기에서 현금을 인출한 행위는 공갈죄와는 별도로 절도죄를 구성한다.","음주로 인한 특정범죄 가중처벌 등에 관한 법률 위반(위험운전 치사상)죄는 중한 형태의 도로교통법 위반(음주운전)죄를 기본 범죄로 하는 결과적 가중범으로 그 행위유형과 보호법익을 이미 모두 포함하고 있으므로, 특정범죄 가중처벌 등에 관한 법률 위반(위험운전치사상)죄가 성립하면 도로교통법 위반(음주운전) 죄는 이에 흡수되어 따로 성립하지 아니한다.","공무원이 직무관련자에게 제3자와 계약을 체결하도록 요구하여 계약 체결을 하게 한 행위가 제3자뇌물수수죄의 구성요건과 직권남용권리행사방해죄의 구성요건에 모두 해당하는 경우에는 제3자뇌물수수죄와 직권남용권리행사방해죄가 각각 성립하고 두 죄는 상상적 경합관계에 있다.","업무방해죄와 폭행죄의 관계에 있어 피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 된 경우, 그러한 폭행행위는 이른바 불가벌적 수반행위에 해당하여 업무방해죄에 대하여 흡수관계에 있다.",2,0,""],["2022-1","형사법",14,"상해와 폭행의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형법은 태아를 임산부 신체의 일부로 보거나, 낙태행위가 임산부의 태아양육, 출산 기능의 침해라는 측면에서 임산부에 대한 상해죄를 구성하는 것으로 보지는 않는다고 해석된다.","다방 종업원 숙소에 이르러 종업원들 중 1인이 자신을 만나주지 않는다는 이유로 시정된 탁구장문과 주방문을 부수고 주방으로 들어가 방문을 열어주지 않으면 모두 죽여버린다고 폭언하면서 시정된 방문을 단순히 수회 발로 찬 甲의 행위도 종업원들의 신체에 대한 유형력의 행사로 볼 수 있어 폭행죄에 해당한다.","식당의 운영자인 甲이 식당 밖에서 당겨 열도록 표시되어 있는 출입문을 열고 음식 배달차 밖으로 나가던 중 이웃 가게 손님 으로 마침 위 식당 출입문 앞쪽 길가에 서 있던 A의 오른발 뒤꿈치 부위를 위 출입문 모서리 부분으로 충격하여 상해를 입게 한 행위는 업무상과실치상죄의 성립을 인정할 수 없다.","甲이 상습으로 A를 폭행하고, 어머니 B를 존속폭행하였다는 내용으로 기소된 사안에서, 甲에게 폭행 범행을 반복하여 저지르는 습벽이 있고 이러한 습벽에 의하여 단순폭행, 존속 폭행 범행을 저지른 사실이 인정된다면 단순폭행, 존속폭행의 각 죄별로 상습성을 판단할 것이 아니라 포괄하여 그 중 법정형이 가장 중한 상습존속폭행죄만 성립할 여지가 있다.",1,0,""],["2022-1","형사법",15,"다음에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲은 A가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 A를 간음하였으나 A가 실제로는 심신상실 또는 항거불능의 상태에 있지 않은 경우에는 준강간죄의 장애미수가 성립한다.","성적자기결정권에는 자신이 하고자 하는 성행위를 결정할 권리라는 적극적 측면과 함께 원치 않는 성행위를 거부할 권리라는 소극적 측면이 함께 존재하는데, 위계에 의한 간음죄를 비롯한 강간과 추행의죄는소극적성적자기결정권을침해하는것을내용으로한다.","술에 취한 甲이 간음할 목적으로 초등학교 5학년 여학생인 A의 소매를 갑자기 잡아끌면서 “우리 집에 같이 자러 가자.”고 한 행위는 간음목적 약취행위의 수단으로서 폭행에 해당한다.","입찰방해죄는 위계 또는 위력 기타의 방법으로 입찰의 공정을 해하는 경우에 성립하는 위태범으로서 결과의 불공정이 현실적 으로 나타나는 것을 필요로 하지 않는다.",0,0,""],["2022-1","형사법",16,"강간과 추행의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","위계에 의한 간음죄에 해당하는지 여부를 판단할 때에는 구체적인 범행 상황에 놓인 피해자의 입장과 관점이 충분히 고려되어야 하고, 일반적 평균적 판단능력을 갖춘 성인 또는 충분한 보호와 교육을 받은 또래의 시각에서 인과관계를 쉽사리 부정하여서는 안 된다.","강제추행죄는 상대방에 대하여 폭행 또는 협박을 가하여 항거를 곤란하게 한 뒤에 추행행위를 하는 경우뿐만 아니라 폭행행위 자체가 추행행위라고 인정되는 경우도 포함되며, 이 경우의 폭행은 반드시 상대방의 의사를 억압할 정도의 것이어야 한다.","강간죄에서의 폭행 협박과 간음 사이에는 인과관계가 있어야 하나, 폭행 협박이 반드시 간음행위보다 선행되어야 하는 것은 아니다.","구 성폭력범죄의 처벌 등에 관한 특례법 제11조의 ‘공중밀집 장소에서의 추행’이 기수에 이르기 위하여는 행위자의 행위로 인하여 대상자가 성적 수치심이나 혐오감을 반드시 실제로 느껴야 하는 것은 아니고, 객관적으로 일반인에게 성적 수치심이나 혐오감을 일으키게 할 만한 행위로서 선량한 성적 도덕관념에 반하는 행위를 실행하는 것으로 충분하다.",1,0,""],["2022-1","형사법",17,"명예에 관한 죄에 대한 아래 ㉠부터 ㉤까지의 설명 중 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 인터넷 댓글에 의하여 모욕을 당한 피해자의 인터넷 아이디(ID) 만을 알 수 있을 뿐 그 밖의 주위사정을 종합해보더라도 그와 같은 인터넷 아이디를 가진 사람이 동 피해자임을 알아차릴 수 없는 경우라면 명예훼손죄 또는 모욕죄가 성립하지 않는다. ㉡ 어떠한 표현이 상대방의 인격적 가치에 대한 사회적 평가를 저하시킬 만한 것이 아니라면 설령 그 표현이 다소 무례한 방법으로 표시되었다 하더라도 이를 두고 모욕죄의 구성요건에 해당한다고 볼 수 없다. ㉢ 모욕죄는 피해자의 외부적 명예를 저하시킬 만한 추상적 판단이나 경멸적 감정을 공연히 표시함으로써 성립하는 것으로, 피해자의 외부적 명예가 현실적으로 침해되거나 적어도 구체적 현실적으로 침해될 위험이 발생하여야 한다. ㉣ 형법 제307조 명예훼손죄에 있어서의 사실의 적시는 가치 판단이나 평가를 내용으로 하는 의견표현에 대치되는 개념 으로서 시간적으로나 공간적으로 구체적인 과거 또는 현재의 사실관계에 관한 보고나 진술을 뜻한다. ㉤ 정보통신망을 이용한 명예훼손의 경우에는 게재행위의 종료 만으로 범죄행위가 종료하는 것은 아니고 원래 게시물이 삭제되어 정보의 송 수신이 불가능해지는 시점을 범죄의 종료시기로 보아야 한다.","㉠(O) ㉡(X) ㉢(O) ㉣(X) ㉤(O)","㉠(O) ㉡(O) ㉢(X) ㉣(O) ㉤(X)","㉠(X) ㉡(X) ㉢(O) ㉣(X) ㉤(X)","㉠(O) ㉡(O) ㉢(X) ㉣(O) ㉤(O)",1,0,""],["2022-1","형사법",18,"주거침입죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","건조물의 이용에 기여하는 인접의 부속 토지라고 하더라도 인적 또는 물적 설비 등에 의한 구획 내지 통제가 없어 통상의 보행 으로 그 경계를 쉽사리 넘을 수 있는 정도라고 한다면, 이는 다른 특별한 사정이 없는 한 주거침입죄의 객체에 속하지 아니한다.","공동거주자 중 주거 내에 현재하는 거주자의 현실적인 승낙을 받아 통상적인 출입방법에 따라 들어갔다면, 설령 그것이 부재 중인 다른 거주자의 의사에 반하는 것으로 추정되더라도 주거 침입죄의 보호법익인 사실상 주거의 평온을 깨트렸다고 볼 수 없다.","공동주거의 경우 여러 사람이 하나의 생활공간에서 거주하는 성질에 비추어 공동거주자 각자는 다른 거주자와의 관계로 인하여 주거에서 누리는 사실상 주거의 평온이라는 법익이 일정 부분 제약될 수밖에 없고, 공동거주자는 공동주거관계를 형성 하면서 이러한 사정을 서로 용인하였다고 보아야 한다.","공동거주자 중 한 사람인 A가 정당한 이유 없이 다른 공동 거주자가 공동생활의 장소에 출입하는 것을 금지한 경우, 다른 공동거주자인 甲이 이에 대항하여 공동생활의 장소에 들어갔더라도 주거침입죄는 성립하지 않고, 다만 甲이 그 장소에 출입하기 위하여 출입문의 잠금장치를 손괴하는 등 다소간의 물리력을 행사한 경우에는 주거침입죄가 성립할 수 있다.",3,0,""],["2022-1","형사법",19,"절도의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","어떠한 물건을 점유자의 의사에 반하여 취거하는 행위가 결과 적으로 소유자의 이익으로 된다는 사정 또는 소유자의 추정적 승낙이 있다고 볼 만한 사정이 있다고 하더라도, 다른 특별한 사정이 없는 한 그러한 사유만으로 불법영득의 의사가 없다고 할 수는 없다.","주간에 절도의 목적으로 타인의 주거에 침입하였다고 하여도 아직 절취할 물건의 물색행위를 시작하기 전이라면 절도죄의 실행에 착수한 것으로 볼 수 없는 것이어서 절도미수죄는 성립하지 않는다.","입목을 절취하기 위하여 이를 캐낸 때에는 그 시점에서 아직 소유자의 입목에 대한 점유가 침해되어 범인의 사실적 지배하에 놓였다고는 볼 수 없고 이를 운반하거나 반출하는 등의 행위가 있어야 그 점유를 취득하게 되는 것이므로, 이 때 절도죄는 기수에 이르렀다고 할 것이다.","상습절도등의 범행을 한자가 추가로 자동차등불법사용의범행을 한 경우에 그것이 절도 습벽의 발현이라고 보이는 이상 자동차등 불법사용의 범행은 상습절도 등의 죄에 흡수되어 1죄만이 성립한다.",2,0,""],["2022-1","형사법",20,"재산죄에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 채무자가 채권자에 대하여 소비대차 등으로 인한 채무를 부담하고 이를 담보하기 위하여 장래에 부동산의 소유권을 이전하기로 하는 내용의 대물변제예약에서, 약정의 내용에 좇은 이행을 하여야 할 채무는 특별한 사정이 없는 한 ‘타인의 사무’에 해당하는 것이 원칙이다. ㉡ 횡령죄의 본질이 신임관계에 기초하여 위탁된 타인의 물건을 위법하게 영득하는 데 있음에 비추어 볼 때 위탁신임관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정함이 타당하다. ㉢ 강제집행절차를 통한 소송사기는 집행절차의 개시신청을 한 때 또는 진행 중인 집행절차에 배당신청을 한 때에 실행에 착수하였다고 볼 것이다. ㉣ 횡령죄는 타인의 재물에 대한 재산범죄로서 재물의 소유권 등 본권을 보호법익으로 하는 범죄이다. 따라서 횡령죄의 객체가 타인의 재물에 속하는 이상 구체적으로 누구의 소유인지는 횡령죄의 성립 여부에 영향이 없다. ㉤ 침해행정 영역에서 일반 국민이 담당 공무원을 기망하여 권력작용에 의한 재산권 제한을 면하는 경우에는 부과권자의 직접적인 권력작용을 사기죄의 보호법익인 재산권과 동일 하게 평가할 수 없는 것이므로 사기죄는 성립할 수 없다.","1개","2개","3개","4개",0,0,""],["2022-1","형사법",21,"재산죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형법 제331조(특수절도) 제2항에서 규정한 흉기는 본래 살상용 파괴용으로 만들어진 것이거나 이에 준할 정도의 위험성을 가진 것으로 봄이 상당하다.","형법 제330조에 규정된 야간주거침입절도죄 및 형법 제331조 제1항에 규정된 특수절도(야간손괴침입절도)죄를 제외하고 일반적으로 주거침입은 절도죄의 구성요건이 아니므로 절도범인이 범행수단으로 주거침입을 한 경우에 주거침입행위는 절도죄에 흡수되지 아니하고 별개로 주거침입죄를 구성하여 절도죄와는 상상적 경합의 관계에 있다.","甲이 술집 운영자 A로부터 술값의 지급을 요구받자 A를 유인 폭행하고 도주함으로써 술값의 지급을 면하여 재산상 이익을 취득하였다면, 형법 제335조에서 규정하는 준강도죄에는 해당 하지 않는다.","횡령죄에서 보관자가 자기 또는 제3자의 이익을 위한 것이 아니라 소유자의 이익을 위하여 이를 처분한 경우에는 특별한 사정이 없는 한 불법영득의 의사를 인정할 수 없다.",1,0,""],["2022-1","형사법",22,"재물과 재산상의 이익에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","비트코인은 경제적인 가치를 디지털로 표상하여 전자적으로 이전, 저장과 거래가 가능하도록 한 가상자산의 일종으로 사기죄의 객체인 재산상 이익에 해당한다.","甲이 乙의 돈을 절취한 다음 다른 금전과 섞거나 교환하지 않고 쇼핑백 등에 넣어 자신의 집에 숨겨두었는데, 丙이 乙의 지시로 甲에게 겁을 주어 쇼핑백 등에 들어 있던 절취된 돈을 교부받아 갈취하였다면, 위 돈은 타인인 甲의 재물이라고 볼 수 없다.","형법 제333조(강도)에서의 ‘재산상 이익’은 반드시 사법상 유효한 재산상의 이득만을 의미하는 것은 아니나, 단지 외견상 재산상의 이득을 얻을 것이라고 인정할 수 있는 사실관계만 으로는 재산상의 이익을 인정할 수 없다.","배임죄에 있어서 재산상의 손해를 가한 때라 함은 현실적인 손해를 가한 경우뿐만 아니라 재산상 실해 발생의 위험을 초래한 경우도 포함된다.",2,0,""],["2022-1","형사법",23,"공공의 신용에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우 그 공문서 본래의 용도에 따른 사용이 아니라 하더라도 형법 제230조의 공문서부정행사죄가 성립된다.","문서가 위조된 것임을 이미 알고 있는 공범자 등에게 행사하는 경우에는 위조문서행사죄가 성립할 수 없으나, 간접정범을 통한 위조문서행사범행에 있어 도구로 이용된 자라고 하더라도 문서가 위조된 것임을 알지 못하는 자에게 행사한 경우에는 위조문서행사죄가 성립한다.","인터넷을 통하여 열람 출력한 등기사항전부증명서 하단의 열람 일시 부분을 수정 테이프로 지우고 복사한 행위는 공문서 변조에 해당한다.","위조된 외국의 화폐, 지폐 또는 은행권이 강제통용력을 가지지 않고, 그 화폐 등이 국내에서 사실상 거래 대가의 지급수단이 되고 있지 않는 경우에는 그 화폐 등을 행사하더라도 위조통화행사죄를 구성하지 않는다고 할 것이므로, 형법 제234조에서 정한 위조 사문서행사죄 또는 위조사도화행사죄로 의율할 수 있다.",0,0,""],["2022-1","형사법",24,"문서에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","형법은 사문서의 경우 무형위조만을 처벌하면서 예외적으로 유형위조를 처벌하는 태도를 취하고 있다.","공무원인 의사가 공무소의 명의로 허위의 진단서를 작성한 경우 허위공문서작성죄와 허위진단서작성죄가 성립하고 두 죄는 상상적 경합관계에 있다.","공문서와 달리 사문서에 있어서는 권한 있는 사람의 허위작성을 예외적으로만 처벌하는 형법의 태도를 고려할 때, 형법 제232조의2에서 정하는 사전자기록등위작죄에서의 ‘위작’에 시스템의 설치 운영 주체로부터 각자의 직무 범위에서 개개의 단위정보의 입력 권한을 부여받은 사람이 그 권한을 남용하여 허위의 정보를 입력함으로써 시스템 설치 운영 주체의 의사에 반하는전자기록을생성하는경우는포함되지않는다고보아야한다.","A회사의 대표이사 甲이 B회사의 대표이사 乙로부터 포괄적 위임을 받아 두 회사의 대표이사 업무를 처리하면서 두 회사 명의로 허위 내용의 영수증과 세금계산서를 작성한 사안에서, B회사 명의 부분은 乙의 개별적 구체적 위임 또는 승낙 없는 행위로서 사문서위조 및 위조사문서행사죄가 성립하지만, A회사 명의 부분은 이미 퇴직한 종전의 대표이사를 승낙 없이 대표 이사로 표시하였더라도 이에 해당하지 않는다.",3,0,""],["2022-1","형사법",25,"사회적 법익에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","민사조정법 상의 조정절차에서 작성되는 조정조서는 공정증서원본 불실기재죄에서의 공정증서원본에 해당한다.","단순히 자신의 신용력을 증명하기 위하여 타인에게 보일 목적으로 통화를 위조한 경우에는 통화위조죄가 성립하지 않는다.","공무원의 문서작성을 보조하는 직무에 종사하는 공무원이 허위 공문서를 기안하여 결재를 거치지 않고 임의로 작성권자의 직인 등을 부정 사용함으로써 공문서를 완성한 경우 공문서위조죄가 성립한다.","불을 놓아 무주물을 불태워 공공의 위험을 발생하게 한 경우에는 형법 제167조 제2항의 자기소유일반물건방화죄가 성립한다.",0,0,""],["2022-1","형사법",26,"무고죄에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 자기 자신을 무고하기로 제3자와 공모하고 이에 따라 무고 행위에 가담한 경우 무고죄의 공동정범으로 처벌할 수 없다. ㉡ 신고사실의 일부에 허위의 사실이 포함되어 있다고 하더라도 그 허위부분이 범죄의 성부에 영향을 미치는 중요한 부분이 아니고 단지 신고한 사실을 과장한 것에 불과한 경우에는 무고죄에 해당하지 아니하지만, 그 일부 허위인 사실이 국가의 심판작용을 그르치거나 부당하게 처벌을 받지 아니할 개인의 법적 안정성을 침해할 우려가 있을 정도로 고소사실 전체의 성질을 변경시키는 때에는 무고죄가 성립될 수 있다. ㉢ 신고자가 진실이라고 확신하고 신고하였을 때에는 무고죄가 성립하지 않는다고 할 것이고, ‘진실이라고 확신한다’ 함에는 신고자가 알고 있는 객관적 사실관계에 의하여 신고사실이 허위라거나 허위일 가능성이 있다는 인식을 하면서도 이를 무시한 채 무조건 자신의 주장이 옳다고 생각하는 경우까지 포함되는 것은 아니다. ㉣ 무고죄에 있어서의 신고는 자발적인 것이어야 하고 수사기관 등의 추문에 대하여 허위의 진술을 하는 것은 무고죄를 구성 하지 않는 것이므로, 당초 고소장에 기재하지 않은 사실을 수사기관에서 고소보충조서를 받을 때 자진하여 진술하였다 하더라도 이 진술 부분까지 신고한 것으로 볼 수는 없다. ㉤ 타인에게 형사처분을 받게 할 목적으로 ‘허위의 사실’을 신고한 행위가 무고죄를 구성하기 위해서는 신고된 사실 자체가 형사처분의 대상이 될 수 있어야 하므로, 허위로 신고한 사실이 신고 당시에는 형사처분의 대상이 될 수 있었으나 이후 그러한 사실이 형사처분의 대상이 되지 않는 것으로 대법원 판례가 변경된 경우 무고죄는 성립하지 않는다.","㉠㉡","㉡㉢","㉢㉣","㉣㉤",3,0,""],["2022-1","형사법",27,"국가의 기능에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","범인도피죄는 타인을 도피하게 하는 경우에 성립할 수 있고 여기에서 타인에는 공범도 포함되므로, 공범 중 1인이 그 범행에 관한 수사절차에서 참고인 또는 피의자로 조사받으면서 자기의 범행을 구성하는 사실관계에 관하여 허위로 진술하고 허위 자료를 제출하는 행위가 다른 공범을 도피하게 하는 결과가 되는 경우 범인도피죄가 성립할 수 있다.","피의자 등이 적극적으로 허위의 증거를 조작하여 제출하고 그 증거 조작의 결과 수사기관이 그 진위에 관하여 나름대로 충실한 수사를 하더라도 제출된 증거가 허위임을 발견하지 못할 정도에 이르렀다면, 이는 위계에 의하여 수사기관의 수사행위를 적극적 으로 방해한 것으로서 위계공무집행방해죄가 성립된다.","사실의 증명을 위해 작성된 문서가 그 사실에 관한 내용이나 작성명의 등에 아무런 허위가 없다면 증거위조죄에서의 ‘증거 위조’에 해당한다고 볼 수 없는 것이고, 설령 사실증명에 관한 문서가 형사사건 또는 징계사건에서 허위의 주장에 관한 증거로 제출되어 그 주장을 뒷받침하게 되더라도 마찬가지이다.","경찰공무원이 지명수배 중인 범인을 발견하고도 직무상 의무에 따른 적절한 조치를 취하지 아니하고 오히려 범인을 도피하게 하는 행위를 한 경우, 범인도피죄만이 성립하고 직무유기죄는 따로 성립하지 아니한다.",0,0,""],["2022-1","형사법",28,"수사기관의 강제처분에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","통신비밀보호법 에 규정된 통신제한조치상의 ‘전기통신의 감청’은 ‘감청’의 개념 규정에 비추어 이미 수신이 완료된 전기통신에 관하여 남아 있는 기록이나 내용을 열어보는 등의 행위는 포함하지 않는다.","공무원에게 금품을 제공한 혐의로 발부된 통신사실 확인자료제공 요청 허가서에 대상자로 기재되어 있는 피고인 甲이 피고인 乙의 뇌물수수 범행의 증뢰자라면, 위 허가서에 의하여 제공받은 甲과 乙의통화내역을乙의수뢰사실의증명을위한증거로사용할수있다.","임의제출물의 압수는 압수물에 대한 수사기관의 점유취득이 제출자의 의사에 따라 이루어지므로, 임의제출된 정보저장매체 에서 압수의 대상이 되는 전자정보의 범위를 초과하여 수사기관이 임의로 전자정보를 탐색 복제 출력하는 것은 원칙적으로 위법한 압수 수색에 해당한다고 할 수 없다.","수사기관이 범죄증거를 수집할 목적으로 피의자의 동의 없이 피의자의 소변을 채취하기 위해서는 법원으로부터 감정허가장을 받아 형사소송법 제221조의4 제1항, 제173조 제1항에서 정한 ‘감정에 필요한 처분’으로 할 수 있지만, 형사소송법 제219조, 제106조 제1항, 제109조에 따른 압수 수색의 방법으로도 할 수 있다.",2,0,""],["2022-1","형사법",29,"영장의 집행에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 압수 수색에 착수하면서 그 장소의 관리책임자에게 영장을 제시하였더라도, 물건을 소지하고 있는 다른 사람으로 부터 이를 압수하고자 하는 때에는 그 사람에게 따로 영장을 제시하여야 한다.","체포된 피의자에 대한 수사기관의 구속영장의 제시와 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다 하더라도, 구속영장이 그 유효기간 내에 집행되었다면 위 기간 동안의 체포 내지 구금 상태를 위법하다고 할 수 없다.","압수 수색영장을 집행함에 있어 ‘급속을 요하는 때’에는 집행의 일시와 장소를 피의자 등에게 통지하지 않아도 되는데, 여기서 ‘급속을 요하는 때’라고 함은 압수 수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수 수색의 실효를 거두기 어려울 경우를 의미한다.","구속영장을 집행함에 있어 사법경찰관이 구속영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피고인에 대하여 공소 사실의 요지와 영장이 발부되었음을 고하고 집행할 수 있다.",1,0,""],["2022-1","형사법",30,"수사의 종결에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사법경찰관은 사건을 수사한 경우에는 혐의없음, 죄가안됨, 공소권없음, 각하와 같은 불송치 결정을 할 수 있지만 기소 유예는 할 수 없다.","검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정 제53조 및 제54조에 의하면 사법경찰관은 수사종결 후 그 내용을 고소인등과 피의자에게 통지해야 하는데, 특히 수사중지 결정 통지를 받은 사람은 해당 사법경찰관이 소속된 경찰관서의 장에게 이의를 제기할 수 있다.","검사가 수사를 종결하고 공소제기한 이후 형사소송법 제215조에 따라 수소법원 이외의 지방법원 판사에게 청구하여 발부받은 영장에 의하여 압수 수색을 하였다면 이는 위법한 압수 수색에 해당한다.","검사의 무혐의 불기소처분에 대해 재정신청을 받은 법원은 당해 불기소처분이 위법하다 하더라도 기록에 나타난 제반 사정을 고려하여 기소유예의 불기소처분을 할 만한 사건이라고 인정되는 경우에는 재정신청을 기각할 수 있다.",1,1,"불송치 유형·재정신청 부분은 유지되지만, '지체 없이 서면 송부' 부분이 고소·고발 사건 3개월 기준(제238조)으로 변경되어 지문 표현을 확인해야 합니다."],["2022-1","형사법",31,"검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정 상 사법경찰관의 사건송치에 관한 설명으로 가장 적절 하지 않은 것은?","사법경찰관이 사건을 수사한 결과, 불송치 결정 중 죄가안됨에 해당하여 형법 제10조 제1항에 따라 피의자를 벌할 수 없는 경우에는 해당 사건을 검사에게 이송한다.","검사는 사법경찰관의 불송치 결정이 위법 또는 부당한 경우에는 관계 서류와 증거물을 송부받은 날로부터 90일 이내에 재수사를 요청할 수 있는데, 만약 불송치 결정에 영향을 줄 수 있는 명백히 새로운 증거 또는 사실이 발견된 경우에는 90일이 지난 후에도 재수사를 요청할 수 있다.","사법경찰관은 수사결과에 따라 범죄의 혐의가 있다고 인정되는 경우에는 지체 없이 검사에게 사건을 송치하고 관계 서류와 증거물을 검사에게 송부하여야 하는데, 이 때 보완수사가 필요하다고 인정되는 경우에도 검사는 직접 보완수사할 수 없으며 사법경찰관에 대한 보완수사요구만 가능하다.","사법경찰관이 재수사 중인 사건에 대해 형사소송법 제245조의7 제1항에 따른 고소인 등의 이의신청이 있는 경우에는 사법경찰관은 재수사를 중단해야 하며, 같은 조 제2항에 따라 해당 사건을 지체 없이 검사에게 송치하고 관계 서류와 증거물을 송부해야 한다.",2,2,"수사준칙상 사건송치·재수사 요청 구조를 묻는 문항입니다. 2026.10.2. 형사소송법(제238조, 제245조의5~7)과 수사준칙(대통령령 제36704호) 개정으로 기한·절차가 바뀌어 그대로 채점할 수 없습니다."],["2022-1","형사법",32,"함정수사에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관과 직접 관련이 있는 유인자가 피유인자와의 개인적인 친밀관계를 이용하여 피유인자의 동정심이나 감정에 호소하거나, 금전적 심리적 압박이나 위협 등을 가하거나, 거절하기 힘든 유혹을 하거나, 또는 범행방법을 구체적으로 제시하고 범행에 사용될 금전까지 제공하는 등으로 과도하게 개입함으로써 피유인자로 하여금 범의를 일으키게 하는 것은, 위법한 함정 수사에 해당하여 허용되지 않는다.","본래 범의를 가지지 아니한 자에 대하여 수사기관이 사술이나 계략 등을 써서 범의를 유발케 하여 범죄인을 검거하는 함정 수사는 위법함을 면할 수 없고, 이러한 함정수사에 기한 공소 제기는 그 절차가 법률의 규정에 위반하여 무효인 때에 해당한다.","범의를 가진 자에 대하여 단순히 범행의 기회를 제공하거나 범행을 용이하게 하는 것에 불과한 수사방법도 경우에 따라 허용될 수 있다.","아동 청소년의 성보호에 관한 법률 에 의하면 사법경찰관리는 아동 청소년을 대상으로 하는 디지털 성범죄에 대해 신분 비공개수사는 가능하지만, 신분위장수사는 위법한 함정수사로서 허용되지 않는다.",3,0,""],["2022-1","형사법",33,"다음은 체포 구속에 관한 설명이다. ㉠부터 ㉤까지의 설명 중 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 검사는 긴급체포한 피의자를 구속영장 청구 없이 석방한 경우에는 석방한 날로부터 30일 이내에 긴급체포서 사본과 함께 법정기재사항이 기재된 서면으로 법원에 통지하여야 하고, 만약 사후에 석방통지가 법에 따라 이루어지지 않은 사정이 있다면 그와 같은 사정만으로도 긴급체포 중에 작성된 피의자신문조서의 증거능력은 소급하여 부정된다. ㉡ 구속영장 발부에 의하여 적법하게 구금된 피의자가 피의자 신문을 위한 출석요구에 응하지 아니하면서 수사기관 조사실에 출석을 거부한다면 수사기관은 그 구속영장의 효력에 의하여 피의자를 조사실로 구인할 수 있는데, 이 경우 피의자신문 절차도 강제수사의 한 방법으로 진행되어야 하므로 수사기관은 피의자를 신문하기 전에 진술거부권이 있음을 고지하여야 한다. ㉢ 검사의 구속영장 청구 전 피의자 대면조사는 강제수사가 아니므로 피의자는 검사의 출석 요구에 응할 의무가 없다. ㉣ 영장실질심사는 필요적 변호사건이므로 심문할 피의자에게 변호인이 없는 때에는 지방법원판사는 직권으로 변호인을 선정하여야 한다. 이 경우 변호인 선정의 효력은 구속영장 청구가 기각된 경우에도 제1심까지 효력이 있다. ㉤ 공동피의자의 순차적인 체포 구속적부심사청구가 수사방해를 목적으로 하고 있음이 명백한 때에는 법원은 피의자에 대한 심문 없이 결정으로 청구를 기각할 수 있으며, 이와 같은 결정에 대해서는 피의자가 항고할 수 없다.","㉠(O) ㉡(O) ㉢(X) ㉣(O) ㉤(X)","㉠(O) ㉡(X) ㉢(O) ㉣(O) ㉤(X)","㉠(X) ㉡(O) ㉢(O) ㉣(X) ㉤(O)","㉠(X) ㉡(X) ㉢(O) ㉣(X) ㉤(O)",3,1,"㉠의 '검사가 긴급체포 피의자를 석방한 경우 통지' 서술은 검사 수사권 폐지로 실무 전제가 바뀌었습니다(조문 구조는 유지)."],["2022-1","형사법",34,"증거에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 간접증거만으로 유죄를 인정하는 경우에는 여러 간접사실로 보아 피고인이 범행한 것으로 보기에 충분할 만큼 압도적 으로 우월한 증명이 있어야 한다. ㉡ 피고인이 수표를 발행하였으나 예금부족 또는 거래정지처분 으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 증거물의 예에 의하여 증거능력을 판단하여야 한다. ㉢ 타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정하여지는바, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거가 아니라 본래증거이다. ㉣ 형사소송법 제150조 증언거부사유의 소명, 제184조 제3항 증거보전청구사유의 소명, 제221조의2 제3항 증인신문청구 사유의 소명은 증명의 정도에 이르지 않더라도 입증이 허용된다. ㉤ 공판기일 외의 증인신문 검증에 대하여는 공판조서의 배타적 증명력이 인정되지 않는다.","1개","2개","3개","4개",3,0,""],["2022-1","형사법",35,"증명에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","증거능력이 없는 증거는 유죄의 직접적인 증거로 삼을 수 없으나, 구성요건 사실을 추인하게 하는 간접사실이나 구성요건 사실을 입증하는 직접증거의 증명력을 보강하는 보조사실의 인정자료 로는 사용할 수 있다.","형법 제307조 제2항 허위사실 적시 명예훼손죄에서 허위사실의 인식과 달리 허위사실 자체는 엄격한 증명의 대상이 된다.","예비군법 제15조 제9항 제1호에서 정한 정당한 사유가 없다는 사실은 범죄구성요건이므로 검사가 증명하여야 하지만, 양심적 예비군훈련거부를 주장하는 피고인은 자신의 예비군훈련 거부가 그에 따라 행동하지 않고서는 인격적 존재가치가 파멸되고 말 것 이라는 절박하고 구체적인 양심에 따른 것이며 그 양심이 깊고 확고하며 진실한 것이라는 사실의 존재를 수긍할 만한 소명자료를 제시하고, 검사는 제시된 자료의 신빙성을 탄핵하는 방법으로 진정한 양심의 부존재를 증명할 수 있다.","합리적 의심이란 요증사실과 양립할 수 없는 사실의 개연성에 대한 합리성 있는 의문을 의미하는 것으로서, 관념적인 의심 이나 추상적인 가능성에 기초한 의심도 포함된다.",2,0,""],["2022-1","형사법",36,"자백배제법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피고인의 자백이 고문, 폭행, 협박, 신체구속의 부당한 장기화 또는 기망 기타의 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에는 이를 유죄의 증거로 하지 못한다.","임의성이 인정되지 아니하여 증거능력이 없는 진술증거는 피고인이 증거로 함에 동의하더라도 증거로 삼을 수 없으나, 임의성이 의심되는 자백은 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로는 사용할 수 있다.","피고인이 피의자신문조서에 기재된 피고인의 진술 및 공판기일 에서의 피고인의 진술의 임의성을 다투면서 그것이 허위자백 이라고 다투는 경우, 법원은 제반 사정을 참작하여 자유로운 심증으로 임의성 여부를 판단하면 된다.","피고인이나 그 변호인이 검사 작성의 당해 피고인에 대한 피의자 신문조서의 임의성을 인정하는 진술을 하였다가 이를 번복하는 경우에, 증거조사를 마친 조서의 임의성을 다투는 주장이 받아 들여지게 되면, 그 조서는 증거배제결정을 통하여 유죄 인정의 자료에서 제외되어야 한다.",1,0,""],["2022-1","형사법",37,"위법수집증거배제법칙에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","검사가 공소외 甲을 구속 기소한 후 다시 소환하여 피고인 등 공범과의 활동에 관한 신문을 하면서 피의자신문조서가 아닌 일반적인 진술조서의 형식으로 조서를 작성한 경우, 이 진술 조서의 내용이 피의자신문조서와 실질적으로 같고 진술의 임의성이 인정되는 경우라도, 甲에게 미리 진술거부권을 고지하지 않은 때에는 그 진술은 위법수집증거에 해당하므로 피고인에 대한 유죄의 증거로 사용할 수 없다.","법관의 서명날인란에 서명만 있고 날인이 없는 영장은 형사 소송법 이 정한 요건을 갖추지 못하여 적법하게 발부되었다고 볼 수 없으므로, 비록 판사의 의사에 기초하여 진정하게 영장이 발부되었다는 점이 외관상 분명하고 의도적으로 적법절차의 실질적인 내용을 침해한다거나 영장주의를 회피할 의도를 가지고 이 영장에 따른 압수 수색을 하였다고 보기 어렵다 하더라도, 이 영장에 따라 압수한 파일 출력물과 이에 기초하여 획득한 2차적증거인피의자신문조서도유죄인정의증거로사용할수없다.","유흥주점 업주인 피고인이 성매매업을 하면서 금품을 수수하였다고 하여 기소된 사안에서, 경찰이 피고인 아닌 甲, 乙을 사실상 강제연행하여 불법체포한 상태에서 받은 자술서 및 진술조서가 위법수사로 얻은 진술증거에 해당하더라도, 이를 피고인에 대한 유죄 인정의 증거로 삼을 수 있다.","피고인이 발송한 이메일에 대한 압수 수색영장을 집행하면서 수사기관이 甲 회사에 팩스로 영장 사본을 송신하였다면, 비록 영장 원본을 제시하거나 압수조서와 압수물 목록을 작성하여 피압수 수색 당사자에게 교부하지 않았더라도, 이 같은 방법으로 압수된 피고인의 이메일은 위법수집증거의 증거능력을 인정할 수 있는 예외적인 경우에 해당하므로 증거능력이 부정되지 않는다.",0,0,""],["2022-1","형사법",38,"전문법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형사소송법 은 헌법이 요구하는 적법 절차를 구현하기 위하여 사건의 실체에 대한 심증 형성은 법관의 면전에서 본래증거에 대한 반대신문이 보장된 증거조사를 통하여 이루어져야 한다는 실질적 직접심리주의와 전문법칙을 채택하고 있다.","전문진술이 기재된 조서는 형사소송법 제312조 또는 제314조의 규정에 의하여 각 그 증거능력이 인정될 수 있는 경우에 해당 하여야 함은 물론 형사소송법 제316조의 규정에 따른 요건을 갖추어야 예외적으로 증거능력이 있다.","정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적 으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음 하는 대체물에 해당하므로 형사소송법 제310조의2에서 정한 전문법칙이 적용된다.","형사소송법 은 재전문진술이나 재전문진술을 기재한 조서에 대하여는 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 하는 데 동의하지 아니하는 한 형사 소송법 제310조의2의 규정에 의하여 이를 증거로 할 수 없다.",2,0,""],["2022-1","형사법",39,"증거동의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피고인이 공소사실을 부인하고 있는 상황에서 검사가 신청한 증인의 법정진술이 전문증거로서 증거능력이 없는 경우, 피고인 또는 변호인에게 의견을 묻는 등의 적절한 방법으로 그러한 사정에 대하여 고지가 이루어지지 않은 채 증인신문이 진행되 었다면, 피고인이 그 증거조사 결과에 대하여 별 의견이 없다고 진술하였더라도 증인의 법정증언을 증거로 삼는 데에 동의한 것으로 볼 수 없다.","피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 증거로 함에 동의하였더라도 이는 특별한 사정이 없는 한 효력이 없다.","증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 이를 취소 또는 철회하더라도 이미 취득한 증거능력은 상실되지 않는다.","피고인의 변호인이 증거 부동의 의견을 밝힌 고발장을 첨부 문서로 포함하고 있는 검찰주사보 작성의 수사보고가 수사 기관이 첨부한 자료를 통하여 얻은 인식 판단 추론이거나 자료의 단순한 요약에 불과하더라도, 피고인이 증거에 동의하여 증거조사가 행하여졌다면 그 수사보고에 대한 증거동의의 효력은 첨부된 고발장에도 당연히 미친다고 볼 것이므로 이를 유죄의 증거로 삼을 수 있다.",3,0,""],["2022-1","형사법",40,"성폭력범죄가 빈발하는 지역을 순찰하던 경찰관 P1과 P2는 심야에 주취자가 소란을 피우고 있다는 A의 신고를 받고 출동하여, 신고 지역 인근 A소유의 빌라 주차장에서 술에 취한 상태에서 큰소리로 전화를 걸고 있는 甲을 발견하고 불심검문을 실시하였다. 이에 甲은 P2에게 자신의 운전 면허증을 교부하였고, P2가 甲의 신분조회를 위하여 순찰차로 걸어간 사이에 甲은 위 불심검문에 항의하면서 P1에게 욕설을 하였다. 이 욕설은 P1 이외에 인근 주민들도 들었을 정도로 큰소리였으므로 P1은 甲을 모욕죄의 현행범으로 체포하겠다고 고지한 후 甲의 어깨를 붙잡았고, P2는 허리를 붙잡으며 체포를 시도하였다. 그런데 甲은 이에 강하게 반항하면서 P1 및 P2를 순차로 폭행하였고 이 과정에서 P1에게 상해를 가하였다. 이에 관한 ㉠부터 ㉣까지의 설명 중 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ P1과 P2가 형사소송법 제200조의5 및 제213조의2에 따른 체포절차를 준수하였다 하더라도 위 현행범 체포는 위법 하다고 할 수 있다. ㉡ 甲에 대한 형법 제136조 제1항 공무집행방해죄 및 제257조 제1항 상해죄는 정당방위로 위법성이 조각된다. ㉢ 만약 甲에게 공무집행방해죄가 인정된다면, 2개의 공무집행 방해죄가 성립되며 각 공무집행방해죄의 관계는 상상적 경합관계이다. ㉣ 만약 P1과 P2가 甲에 대한 불심검문 과정에서 신분증을 제시하지 않았다면, 제반사정을 종합적으로 고려하여 甲이 P1과 P2가 경찰관이고 검문하는 이유가 범죄행위에 관한 것임을 충분히 알고 있었다고 보이는 경우라 하더라도 위법한 불심검문에 해당한다.","㉠(X) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(O) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(O) ㉢(O) ㉣(X)",2,0,""],["2022-1","경찰학",1,"다음 설명 중 가장 적절한 것은?","1919년 3 1운동을 계기로 헌병경찰제도에서 보통경찰제도로의 전환은 이루어졌으나, 일본에서 제정된 정치범처벌법 을 우리 나라에 적용하는 등 일제의 탄압적 지배체제가 강화되었다.","미군정기에 고등경찰제도가 폐지되었으며, 경찰에 정보업무를 담당하는 정보과와 경제사범단속을 위한 경제경찰이 신설되었다.","1953년 경찰작용의 기본법인 경찰관직무집행법 이 제정되어 경감 이상의 계급정년제가 도입되었고, 1969년 경찰공무원법 이 제정되어 경정 및 경장 계급이 신설되었다.","대한민국 정부 수립 이후 1974년 내무부 치안국이 치안본부로 개편되었고, 2006년 제주특별자치도 ‘자치경찰단’이 창설되었다.",3,0,""],["2022-1","경찰학",2,"경찰의 관할에 관한 설명 중 가장 적절하지 않은 것은?","국회법 상 경위(警衛)나 경찰공무원은 국회 안에 현행범인이 있을 때에는 체포한 후 국회의장의 지시를 받아야 한다. 다만, 회의장 안에서는 국회의장의 명령 없이 국회의원을 체포할 수 없다.","법원조직법 상 재판장은 법정에서의 질서유지를 위하여 필요 하다고 인정할 때에는 개정 전후에 상관없이 관할 경찰서장에게 경찰공무원의 파견을 요구할 수 있으며, 이에 따라 파견된 경찰 공무원은 법정 내외의 질서유지에 관하여 재판장의 지휘를 받는다.","헌법상 대통령은 내란 또는 외환의 죄를 범한 경우를 제외하고는 재직중 형사상의 소추를 받지 아니한다.","‘사물관할’이란 경찰권이 발동될 수 있는 지역적 범위를 말하고, 대한민국의 영역 내 모든 범위에 적용되는 것이 원칙이다.",3,0,""],["2022-1","경찰학",3,"실질적 의미의 경찰개념의 역사적 발전과정에 관한 설명 중 가장 적절하지 않은 것은?","요한 쉬테판 퓌터(Johann Stephan Pütter)가 자신의 저서인 『독일공법제도』에서 주장한 “경찰의 직무는 임박한 위험을 방지하는 것이다. 복리증진은 경찰의 본래 직무가 아니다.”라는 내용은 경찰국가 시대를 거치면서 확장된 경찰의 개념을 제한하기 위한 노력의 일환으로 볼 수 있다.","크로이츠베르크 판결(1882)은 승전기념비의 전망을 확보할 목적으로 주변 건축물의 고도를 제한하기 위해 베를린 경찰청장이 제정한 법규명령은 독일의 제국경찰법 상 개별적 수권조항에 위반되어 무효라고 하였다.","독일의 경우, 15세기부터 17세기에 이르기까지 경찰은 공동체의 질서정연한 상태 또는 공동체의 질서정연한 상태를 창설하고 유지하기 위한 활동으로 이해되었고, 이러한 공동체의 질서정연한 상태를 창설 유지하기 위하여 신민(臣民)의 거의 모든 생활영역이 포괄적으로 규제될 수 있었다.","1931년 제정된 프로이센 경찰행정법 제14조 제1항은 “경찰 행정청은 현행법의 범위 내에서 공공의 안녕 또는 공공의 질서를 위협하는 위험으로부터 공중이나 개인을 보호하기 위하여 필요한 조치를 의무에 적합한 재량에 따라 취하여야 한다.”라고 규정하여 크로이츠베르크 판결(1882)에 의해 발전된 실질적 의미의 경찰 개념을 성문화시켰다.",1,0,""],["2022-1","경찰학",4,"경찰의 임무를 공공의 안녕과 공공의 질서에 대한 위험의 방지라고 정의할 때, 위험에 관한 설명 중 가장 적절하지 않은 것은?","구체적 위험은 개별사례에서 실제로 또는 최소한 경찰관의 사전적 시점에서 사실관계를 합리적으로 평가하였을 때, 가까운 장래에 공공의 안녕이나 공공의 질서에 대한 손해가 발생할 충분한 개연성이 있는 상황과 관련이 있다.","오상위험에 근거한 경찰의 위험방지조치가 위법한 경우에는 경찰관 개인에게는 민 형사상 책임이 문제되고 국가에게는 손해배상책임이 발생할 수 있다.","외관적 위험은 경찰관이 의무에 합당한 사려 깊은 상황판단을 하였음에도 위험을 잘못 긍정하는 경우이다.","위험의 혐의만 존재하는 경우에 위험의 존재가 명백해지기 전까지는 예비적 조치로서 위험의 존재 여부를 조사할 권한은 없다.",3,0,""],["2022-1","경찰학",5,"경찰의 부패에 관한 설명 중 가장 적절하지 않은 것은?","‘Dirty Harry 문제’는 도덕적으로 선한 목적을 위해 윤리적, 정치적, 혹은 법적으로 더러운 수단을 동원하는 것이 적절한가와 관련된 딜레마적 상황이다.","구조화된 조직적 부패는 서로가 문제점을 알면서도 눈감아주는 침묵의 규범 형성의 가능성을 높인다.","셔먼(1985)의 미끄러운 경사(slippery slope) 개념은 작은 호의를 받는 것에 익숙해진 경찰관들이 결국 부패에 연루될 수 있음을 경고한다.","전체사회가설은 신임경찰관이 조직의 부패 전통 내에서 고참 동료들에 의해 사회화됨으로써 부패의 길로 들어선다는 입장이다.",3,0,""],["2022-1","경찰학",6,"경찰청 공무원 행동강령 에 관한 설명 중 가장 적절하지 않은 것은?","공무원은 범죄수사규칙 제30조에 따른 경찰관서 내 수사 지휘에 대한 이의제기와 관련하여 행동강령책임관에게 상담을 요청할 수 있다.","공무원이 상담, 절차 및 규정 안내, 각종 증명서 발급, 기타 이에 준하는 단순 민원업무를 수행하는 경우를 제외하고, 직무 관련자와 100만원 이상의 금전거래가 있는 경우에는 소속관서 행동강령책임관에게 해당 사실을 별지 제3호서식에 따라 서면 (전자문서를 포함)으로 신고하여야 한다.","공무원은 동창회 등 친목단체에 직무관련자가 있어 부득이 골프를 하는 경우에는 소속관서 행동강령책임관에게 사전에 신고하여야 하며 사전에 신고하기 어려운 특별한 사유가 있는 경우에는 사후에 즉시 신고하여야 한다.","공무원은 직무관련자나 직무관련공무원에게 경조사를 알려서는 아니 되나, 공무원 자신이 소속된 종교단체 친목단체 등의 회원에게 알리는 경우에는 경조사를 알릴 수 있다.",1,0,""],["2022-1","경찰학",7,"언론중재 및 피해구제 등에 관한 법률 에 관한 설명 중 가장 적절하지 않은 것은?","‘정정보도’란 언론의 보도 내용의 전부 또는 일부가 진실하지 아니한 경우 이를 진실에 부합되게 고쳐서 보도하는 것을 말한다.","언론중재 및 피해구제 등에 관한 법률 제16조 제1항, 제2항에
