성관계 사실을 폭로하겠다, 제3자가 성관계 당시 모텔 사진을 가지고 있다, 사진을 찍은 자가 성관계를 원하고, 그에게는 수명의 부하들이 있다’라는 등 A의 항거를 현저히 곤란하게 할 정도로 협박하여 A를 간음 하였으나 간음 당시에는 일체의 폭행이나 협박이 없었던 경우, 甲의 행위는 강간죄를 구성하지 않는다. ㉡ 미용업체인 X회사를 운영하는 甲은 그 회사의 가맹점에서 근무하는 A(여, 27세)를 비롯한 직원들과 노래방에서 회식을 하던 중 A를 자신의 옆자리에 앉힌 후 갑자기 A의 볼에 입을 맞추고, 이에 A가 ‘하지 마세요’라고 하였음에도 계속하여 오른손으로 A의 오른쪽 허벅지를 쓰다듬은 경우, 피해자가 즉시 항의하거나 반발하는 등의 거부의사를 밝히는 대신 그 자리에 가만히 있었을지라도 甲의 행위는 강제추행죄를 구성한다. ㉢ 甲은 사람 및 차량의 왕래가 빈번한 도로에서 A(여, 48세)에게 성적인 성질을 가지지 아니한 욕설을 하면서 어떠한 신체의 접촉도 없이 단지 자신의 바지를 벗어 성기를 보여준 경우, 甲의 행위는 강제추행죄를 구성한다. ㉣ 甲은 자신의 주거지 방안에서 4촌 관계인 A(여, 15세)의 학교 과제를 도와주던 중 A의 왼손을 잡아 자신의 성기 쪽으로 끌어당겼고 이를 거부하고 자리를 이탈하려는 A의 의사에 반하여 A를 양팔로 끌어안은 다음 침대에 쓰러뜨린 후 A의 가슴을 만진 경우, 甲의 행위는 성폭력범죄의 처벌 등에 관한 특례법 위반(친족관계에의한강제추행)죄를 구성한다.","㉠㉡","㉠㉣","㉡㉢","㉡㉣",3,0,""],["2025-1","형사법",17,"업무방해죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","업무방해죄의 위력이란 사람의 자유의사를 제압‧혼란케 할 만한 일체의 세력으로, 유형적이든 무형적이든 묻지 아니하므로, 폭력‧ 협박은 물론 사회적‧경제적‧정치적 지위와 권세에 의한 압박 등도 이에 포함되고, 현실적으로 피해자의 자유의사가 제압될 것을 요하지는 않는다.","업무의 개시나 수행과정에 실체상 또는 절차상 하자가 있더라도 사회생활상 도저히 용인할 수 없는 정도로 반사회성을 띠는 데까지 이르거나 법적 보호라는 측면에서 그와 동등한 평가를 받을 수밖에 없는 경우에 이르지 아니한 이상 업무방해죄의 보호대상이 되는 업무에 해당한다.","업무방해죄의 성립에는 업무방해의 결과가 실제로 발생할 것을 요하지 않지만 업무방해의 결과를 초래할 위험은 발생하여야 한다.","위력에 의한 행위의 결과 실질적으로 상대방의 업무에 지장이 초래되었다면 그것이 행위자가 가지는 정당한 권한을 행사한 것으로 볼 수 있는 경우라도 업무방해죄가 성립한다.",3,0,""],["2025-1","형사법",18,"주거침입의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 모텔에 투숙한 다음 날 객실에서 소란을 피우자 모텔주인 A가 112신고를 하고 12시가 퇴실시간임을 안내하였음에도, “여기는 범죄현장이다. 국과수를 불러달라. 내가 피해자인데 내가 왜 나가냐? 니들이 경찰이냐?” 등 횡설수설하며 퇴거에 불응하면서 퇴실시간이 3시간 정도 지난 경우, 甲의 행위는 퇴거불응죄를 구성한다.","지방의회 본회의 방청 중 회의 진행을 방해하고 퇴거 요구에 불응한 사건과 회의장에서 인화물질로 몸에 불을 붙이려다 미수에 그친 사건으로 지방의회 출입제한 조치를 받은 甲이 며칠 뒤 의회 1층 출입구 앞에서 출입을 제지하는 방호요원들을 밀치면서 의회 청사 로비로 들어간 경우, 甲의 행위는 건조물침입죄를 구성한다.","甲이 ‘A에게 100m 이내로 접근하지 말 것’ 등을 명하는 법원의 접근금지가처분 결정이 있는 등 甲이 A를 방문하는 것을 A가 싫어하는 것을 알고 있음에도 임의로 A가 근무하는 사무실 안으로 들어간 경우, 甲의 행위는 건조물침입죄를 구성하지 않는다.","甲은 아내인 A와의 불화로 인해 A와 공동생활을 영위하던 아파트에서 짐 일부를 챙겨 나왔는데, 그 후 자신의 부모인 乙, 丙과 함께 아파트에 찾아가 출입문을 열 것을 요구하였으나 A는 외출한 상태로 A의 동생인 B가 출입문에 설치된 체인형 걸쇠를 걸어 문을 열어 주지 않자 공동하여 걸쇠를 손괴한 후 아파트에 들어간 경우, 이는 폭력행위 등 처벌에 관한 법률 위반(공동주거침입)죄를 구성하지 않는다.",2,0,""],["2025-1","형사법",19,"절도의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","단순히 타인의 점유만을 침해하였다고 하여 절도죄가 성립하는 것은 아니나, 재물의 소유권 또는 이에 준하는 본권을 침해하는 의사가 있으면 되고 반드시 영구적으로 보유할 의사가 필요한 것은 아니며, 그것이 물건 그 자체를 영득할 의사인지 물건의 가치만을 영득할 의사인지를 불문한다.","甲이 내연관계에 있던 A와 아파트에서 동거하다가, A의 사망으로 A의 상속인인 B와 C 소유에 속하게 된 부동산 등기권리증 등 서류들이 들어 있는 가방을 위 아파트에서 가지고 나온 경우, B와 C가 위 아파트에서 전혀 거주한 사실이 없었고, A의 사망 후 甲이 가방을 위 아파트로부터 가지고 가기까지 B와 C가 甲에게 위 아파트 또는 위 가방의 인도 등을 요구한 일이 전혀 없었더라도 甲의행위는B와C의가방에대한점유를침해하여절도죄를구성한다.","야간에 불이 꺼져 있는 상점의 출입문을 손으로 열어보려고 하였으나 출입문의 하단에 부착되어 있던 잠금 고리가 잠겨져 있어 열리지 않았는데, 출입문을 발로 걷어차자 잠금 고리의 아래쪽 부착 부분이 출입문에서 떨어져 출입문과의 사이가 뜨게 되면서 출입문이 열려 상점 안으로 침입하여 재물을 절취한 경우, 이는 ｢형법｣ 제331조 제1항에 정한 문이나 담 그 밖의 건조물의 일부를 손괴한 것에 해당하여 특수절도죄를 구성한다.","A가 운영하는 모텔 객실에 甲이 낮에 몰래 들어가 침입한 다음 머물러 있다가 그곳에 설치되어 있던 컴퓨터를 같은 날 야간에 절취한 경우, 甲의 행위는 ｢형법｣ 제330조의 야간주거침입 절도죄를 구성하지 않는다.",1,0,""],["2025-1","형사법",20,"사기죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","전문건설업을 부정 등록한 무자격 건설업자 甲이 전문공사를 하도급받을 수 없었음에도 건설회사 담당자에게 이러한 사실을 숨기고 하도급 계약을 체결한 후 각 계약들에 따른 공사대금을 지급받은 경우, 해당 공사에 하자나 시공 상의 결함이 밝혀진 사실이 없고 도급받은 보수공사 또한 모두 정상적으로 준공된 것으로 보이는 사정 등이 있더라도, 甲의 행위는 사기죄에서의 기망행위로 인한 재물의 편취에 해당한다.","약사가 아닌 자가 약국을 개설하고 마치 ｢약사법｣에 의하여 적법하게 개설된 요양기관인 것처럼 국민건강보험공단에 요양 급여비용의 지급을 청구하여 국민건강보험공단으로부터 요양 급여비용을 지급받은 경우, 사기죄를 구성한다.","사기죄에 있어서 기망으로 인한 재물교부의 대가가 일부 지급된 경우, 편취액은 피해자로부터 교부된 재물의 가치로부터 그 대가를 공제한 차액이 아니라 교부받은 재물 전부이다.","甲이 변호사를 선임한 적이 없음에도 소송비용액확정신청을 하면서 소송비용액계산서의 비용항목에 사실과 다르게 변호사 비용을 기재하였으나 이와 관련하여 소명자료 등을 조작하거나 허위의 소명자료를 제출하지 않은 경우, 甲의 행위를 사기죄의 기망행위라고 단정할 수 없다.",0,0,""],["2025-1","형사법",21,"횡령과 배임의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","횡령죄의 본질이 신임관계에 기초하여 위탁된 타인의 물건을 위법하게 영득하는 데 있음에 비추어 볼 때 위탁관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정된다.","업무상배임죄에 있어서 ‘재산상 이익 취득’과 ‘재산상 손해 발생’은 대등한 범죄성립요건이므로, 임무위배행위로 인하여 여러 재산상 이익과손해가발생하였다면재산상이익과손해사이에서로대응하는 관계에있는등일정한관련성이없더라도업무상배임죄가성립한다.","수분양권 매도인이 수분양권 매매계약에 따라 매수인에게 수분양권을 이전할 의무는 특별한 사정이 없는 한 자신의 사무에 해당할 뿐이므로, 매수인에 대한 관계에서 배임죄의 ‘타인의 사무를 처리하는 자’라고 할 수 없다.","주권이발행되지 않은상태에서 주권불소지 제도, 일괄예탁 제도 등에 근거하여 예탁결제원에 예탁된 것으로 취급되어 계좌 간 대체 기재의방식에의하여양도되는주식은횡령죄의객체가될수없다.",1,0,""],["2025-1","형사법",22,"재산죄에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 법인의 대표기관이 아닌 대리인이나 지배인이 대표기관과 공모 없이 한 행위라도 그 직무권한 범위 내에서 직무에 관하여 타인이 점유하는 법인의 물건을 취거한 경우, 이는 권리행사 방해죄가 규정하는 ‘자기의 물건을 취거한 경우’에 해당한다. ㉡ 타인의 사무를 처리하는 자가 여러 사람으로부터 각각 부정한 청탁을 받고 그들로부터 각각 금품을 수수한 경우, 만약 그 청탁이 동종의 것이라고 한다면 단일하고 계속된 범의 아래 이루어진 범행으로 볼 수 있어 그 전체를 배임수재죄의 포괄 일죄로 볼 수 있다. ㉢ 지입차주가 지입회사로부터 할부로 지입회사 소유의 자동차를 매수하면서 해당 자동차에 관하여 지입계약을 체결한 경우, 할부대금을 완납하기 전까지는 지입차량을 지입차주의 실질적 재산이라고 보기 어려우므로, 지입계약이 체결되었다는 사실만으로 곧바로 지입회사 운영자가 지입차주와의 관계에서 ‘타인의 사무를 처리하는 자’의 지위에 있는 것은 아니다. ㉣ 여론 형성에 상당한 영향을 미치는 언론사 논설주간인 甲이 개인적 친분관계나 거래관계가 없던 X회사의 대표이사 乙로 부터 X회사 및 乙에 대한 우호적인 여론 형성에 도움을 달라는 취지로 수천만 원 상당의 유럽 여행 비용을 제공받은 경우, 이는 배임수재죄에서 말하는 ‘부정한 청탁’에 해당한다. ㉤ 건물의 임차인인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하였는데도 A에게 채권양도 통지를 하지 않고 A로부터 임대차보증금을수령한후 개인적인용도로 처분한 경우, 특별한 사정이 없는 한 B에 대한 횡령죄는 성립하지 않는다.","1개","2개","3개","4개",3,0,""],["2025-1","형사법",23,"문서에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제233조의 허위진단서작성죄가 성립하기 위하여서는 진단서의 내용이 객관적으로 진실에 반할 뿐 아니라 작성자가 진단서 작성 당시 그 내용이 허위라는 점을 인식하고 있어야 하고,주관적으로 진찰을 소홀히 한다든가 착오를 일으켜 오진한 결과로 진실에 반한 진단서를 작성하였다면 허위진단서 작성에 대한 인식이 있다고 할 수 없으므로 허위진단서작성죄가 성립하지 않는다.","사문서위조 및 동행사죄의 객체인 ‘사실증명에 관한 타인의 문서’는 권리‧의무에 관한 문서 이외의 문서로서 거래상 중요한 사실을 증명하는 문서를 의미하고, 여기에는 법률관계에 간접적 으로만 연관된 의사표시 또는 권리‧의무의 변동에 사실상으로만 영향을 줄 수 있는 의사표시를 내용으로 하는 문서는 포함되지 않는다.","甲은 특정 후보자에 대한 지지선언 형식의 기자회견을 위하여 서명부 양식을 작성하여 최소 목표치인 1만 명으로부터 서명을 받기 위해 노력했으나 별다른 성과가 없자 315명의 허무인 명의로 서명부 21장을 임의로 작성한 경우, 이 서명부는 사문서 위조의 객체가 되는 ‘문서’에 해당한다.","공무원이 공문서를 작성하는 과정에서 법령 등을 잘못 적용하거나 적용하여야 할 법령 등을 적용하지 아니한 잘못이 있다면 그 적용의 전제가 된 사실관계에 관하여 거짓된 기재가 없더라도 허위공문서작성죄가 성립한다.",0,0,""],["2025-1","형사법",24,"사회적 법익에 대한 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 방화의 의사로 뿌린 휘발유가 인화성이 강한 상태로 사람이 현존하는 주택 주변과 A의 몸에 적지 않게 살포되어 있는 사정을 알면서도 라이터를 켜 불꽃을 일으킴으로써 A의 몸에 불이 붙은 경우, 외부적 사정에 의하여 불이 방화 목적물인 주택 자체에 옮겨 붙지는 아니하였다면 현존건조물방화죄의 실행의 착수를 인정할 수 없다.","교통방해를 유발한 집회에 참가한 경우 참가 당시 이미 다른 참가자들에 의해 교통의 흐름이 차단된 상태였다면, 비록 교통 방해를 유발한 다른 참가자들과 암묵적‧순차적으로 공모하여 교통방해의 위법상태를 지속시켰다고 평가할 수 있더라도 일반교통방해죄가 성립하지 않는다.","｢형법｣ 제188조에 규정된 교통방해에 의한 치사상죄는 결과적 가중범이므로, 교통방해 행위가 피해자의 사상이라는 결과를 발생하게 한 유일하거나 직접적인 원인이 된 경우에만 상당 인과관계를 인정할 수 있다.","甲이 피해자들을 기망하여 중고차량을 불법으로 판매해 금원을 편취할 목적으로 무등록 중고차 매매상사를 조직‧운영하고, 乙, 丙, 丁 등과 사기범행을 수행한다는 공동목적 아래 정해진 역할분담에 따라 행동하는 등 사기범행을 반복적으로 실행하는 체계를 갖춘 결합체를 이루었다면, 그 결합체는 ｢형법｣ 제114조의 ‘범죄를 목적으로 하는 집단’에 해당한다.",3,0,""],["2025-1","형사법",25,"공무원의 직무에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무원이 아닌 사람과 공무원이 공모하여 금품을 수수한 경우, 각수수자가수수한금품별로직무관련성유무를달리볼수있다면, 각금품마다직무와의관련성을따져뇌물성여부를인정하여야한다.","공무원이 자신의 직무권한에 속하는 사항에 관하여 실무 담당자로 하여금 그 직무집행을 보조하는 사실행위를 하도록 한 경우, 원칙적으로 직권남용권리행사방해죄에서 말하는 ‘의무 없는 일을 하게 한 때’에 해당한다.","｢형법｣ 제122조의 직무유기죄에서 ‘직무를 유기한다는 것’은 공무원이 법령, 내규 등에 따른 추상적 성실의무를 게을리하는 일체의 경우를 말하는 것이 아니라 직장의 무단이탈, 직무의 의식적인 포기 등과 같이 국가의 기능을 저해하고 국민에게 피해를 야기할 구체적인 가능성이 있는 경우만을 가리킨다.","부하직원으로부터 오락실을 단속하여 증거물로 오락기의 변조 기판을 압수하여 사무실에 보관 중임을 보고받아 알고 있는 경찰서 과장 甲이 그 직무상의 의무에 따라 위 압수물을 인계 하여 범죄 혐의의 입증에 사용하도록 하는 등의 적절한 조치를 취하지 않고, 오히려 부하직원에게 압수물을 돌려주라고 지시하여 오락실 업주에게 이를 돌려준 경우, 작위범인 증거인멸죄만이 성립하고 부작위범인 직무유기죄는 따로 성립하지 않는다.",1,0,""],["2025-1","형사법",26,"공무방해에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","피의자 등이 수사기관에 대하여 허위사실을 진술하거나 피의사실 인정에필요한증거를감추고허위의증거를제출한경우, 수사기관이 충분한 수사를 하지 아니한 채 이와 같은 허위의 진술과 증거만으로 증거의수집‧조사를마쳤다면위계에의한공무집행방해죄가성립된다.","X정당 국회의원 보좌관인 甲과 乙이 소관 업무 회의를 위해 회의장에 출석하는 소속 위원들을 들여보내기 위하여 출입문을 위법하게 막고 있는 국회 경위들을 밀어내는 과정에서 옷을 잡아당기거나 밀치는 등의 행위를 한 경우, 甲과 乙의 행위는 공무집행방해죄에 해당하지 않는다.","위계에 의한 공무집행방해죄에서 ‘공무원의 직무집행’이란 법령의 위임에 따른 공무원의 적법한 직무집행인 이상 공권력의 행사를 내용으로 하는 권력적 작용으로, 사경제주체로서의 활동을 비롯한 비권력적 작용은 포함되지 않는다.","미결수용자의 변호인이 교도관에게 변호인 접견을 신청하는 경우 미결수용자의 형사사건에 관하여 변호인이 구체적으로 어떠한 변호 활동을 하는지, 실제 변호를 할 의사가 있는지 여부 등은 교도관의 심사대상이 되지 않지만, 접견변호사들이 미결수용자의 개인적인 업무나 심부름을 위해 접견신청행위를 한 이상, 이는 위계에 의한 공무집행방해죄에 해당한다.",1,0,""],["2025-1","형사법",27,"위증과 증거인멸의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제155조 제1항의 증거위조죄에서 ‘타인의 형사사건’이란 증거위조 행위 시에 아직 수사절차가 개시되기 전이라도 장차 형사사건이 될 수 있는 것까지 포함하고, 그 형사사건이 기소되지 않거나 무죄가 선고되더라도 증거위조죄의 성립에 영향이 없다.","소송절차가 분리된 공범인 공동피고인이 증언거부권을 고지 받았음에도 자기의 범죄사실에 대하여 증언거부권을 행사하지 않고 허위로 진술한 경우, 위증죄가 성립하지 않는다.","｢형법｣ 제155조 제1항의 증거위조죄에서 ‘증거’란 타인의 형사사건 또는 징계사건에 관하여 수사기관이나 법원 또는 징계기관이 국가의 형벌권 또는 징계권의 유무를 확인하는 데 관계있다고 인정되는 자료로, 범죄 또는 징계사유의 성립 여부에 관한 것이 아닌 형 또는 징계의 경중에 관계있는 정상을 인정하는 데 도움이 될 자료는 여기에 포함되지 않는다.","법률에 의하여 선서한 증인이 타인의 형사사건에 관하여 위증을 하면 ｢형법｣ 제152조 제1항의 위증죄가 성립되나, 자기의 형사 사건에 관하여 타인을 교사하여 위증죄를 범하게 하는 것은 방어권을 인정하는 취지에서 증거인멸교사죄가 성립되지 않는다.",0,0,""],["2025-1","형사법",28,"수사의 단서에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣ 및 ｢검사와 사법경찰관의 상호협력과 일반적 수사 준칙에 관한 규정｣에 의하면 검사가 변사자를 검시한 경우에는 검시조서를 작성하여 사법경찰관에게 송부해야 하고, 사법경찰관이 검사의 명에 따라 변사자를 검증한 경우에는 검증조서를 작성하여 검사에게 송부해야 한다.","법원이 선임한 부재자 재산관리인은 법률에 따라 선임된 부재자의 법정대리인이므로 관리대상 재산에 관한 범죄행위에 대하여 독립하여 고소권을 가지고 법정대리인의 고소권은 ｢형사소송법｣상 당연히 인정되는 것이므로, 고소권의 행사에 있어 법원의 허가는 요하지 않는다.","반의사불벌죄의 피해자는 피의자에게 자신을 대리하여 수사기관에 자신의 처벌불원의사를 표시할 수 있는 권한을 수여할 수 있으므로, 피해자가 피의자에게 처벌불원 취지의 합의서를 작성해주어 피의자가 그 합의서를 수사기관에 제출하였다면 피해자가 수사 기관에 처벌불원의사를 표시하지 않았다고 단정할 수 없다.","법인에 대한 양벌규정이 있는 필요적 고발(즉시고발)사건의 고발장에 피고발인을 A 주식회사라고 명시한 다음, 이어서 위 A 주식회사의 등록번호와 대표자인 B의 성명‧주민등록번호‧ 주소를 기재하고 있을 뿐이라면, 이와 같은 고발장의 표시가 B를 피고발자로 표시한 것이라고 볼 수는 없다.",1,0,""],["2025-1","형사법",29,"체포와 구속의 절차에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","경찰관이 성폭력범죄로 체포영장이 발부된 피의자에 대해 체포절차에 착수하였으나 피의자가 저항하는 과정에서 경찰관에게 상해를 가하였고, 이에 대해 경찰관이 별도 범죄인 특수공무집행방해치상의 현행범으로 피의자를 체포한 경우라도 집행완료에 이르지 못한 성폭력범죄의 체포영장은 사후에 그 피의자에게 제시하여야 한다.","수사기관이 외국인을 체포하거나 구속하면서 지체 없이 영사 통보권 등이 있음을 고지하지 않았다면 체포나 구속 절차는 국내법과 같은 효력을 가지는 ｢영사관계에 관한 비엔나협약｣을 위반한 것으로 위법하다.","현행범으로 체포된 피의자에 대한 구속영장의 제시와 집행이 비록 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다고 하더라도 구속영장에 명시된 유효기간 내에 집행되었다면 지체된 기간 동안의 체포 내지 구금상태를 위법하다고 할 수는 없다.","경찰관이현행범인을체포하는경우피의자에대하여피의사실의요지, 체포의 이유와 변호인을 선임할 수 있음을 말하고 변명할 기회를 주어야하는데, 이와같은고지는체포의집행요건이므로일반인이이미 체포한현행범인을경찰관이단지인도받는경우에는 필요하지 않다.",1,0,""],["2025-1","형사법",30,"긴급체포 후 ｢형사소송법｣ 제217조 제1항에 따른 영장 없는 압수‧수색이 체포현장이 아닌 곳에서 야간에 이루어지는 경우에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (단, 긴급체포 및 영장 없는 압수‧수색이 적법하기 위한 기타 요건은 충족된 것을 전제로 함) ㉠ ｢형사소송법｣ 제125조는 압수‧수색영장에야간집행을 할수 있는 기재가 없으면 그 영장을 집행하기 위하여 일출 전, 일몰 후에는 타인의 주거에 들어가지 못한다고 규정한다. ㉡ 판례는 피고인에 대한 긴급체포 사유, 압수‧수색의 시각과 경위, 사후 영장의 발부 내역 등에 비추어 보더라도 압수‧ 수색영장의 야간집행을 제한하는 명문의 규정이 존재하는 이상 이러한 경우의 압수가 적법할 수는 없다는 입장이다. ㉢ ｢형사소송법｣은 제216조의 규정에 의해 영장 없이 압수‧수색을 하는 경우에 급속을 요하는 때에는 압수‧수색영장의 야간집행 제한에 관한 규정이 적용되지 않는다는 특례규정을 두고 있다. ㉣ ｢형사소송법｣ 제217조 제1항에 따라 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수‧수색영장을 청구해야 하며, 그 영장의 청구는 압수한 때가 아닌 긴급체포한 때로부터 48시간 이내에 하여야 한다.","㉠(O) ㉡(O) ㉢(O) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(X) ㉢(X) ㉣(O)",1,0,""],["2025-1","형사법",31,"정보저장매체의 압수‧수색에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","수사기관은 특정 범죄혐의와 관련하여 정보저장매체에 저장된 전자정보를 압수하는 경우, 정보저장매체 자체를 임의제출받은 경우라면 영장에 의한 압수‧수색의 경우와 다르게 임의제출의 효력에 의하여 정보저장매체 자체나 그 전체내용의 복제본을 수사기관에 반출하는 방식으로 압수‧수색을 할 수 있음이 원칙이다.","수사기관이 전자정보를 담은 매체를 피의자로부터 임의제출받아 압수하면서 거기에 담긴 정보 중 무엇을 제출하는지 명확히 확인하지 않은 경우, 임의제출의 동기가 된 범죄혐의사실과 관련되고 이를 증명할 수 있는 분명한 가치가 있는 정보만으로 압수의 대상이 한정되므로, 범죄사실의 정황증거로 사용될 수 있는 정보는 그에 포함될 수 없다.","피의자가 소유‧관리하는 정보저장매체를 피해자가 임의제출하는 경우, 피해자가 범죄혐의사실과 연관관계가 인정되는 범위를 넘는 전자정보까지 일괄하여 임의제출한다는 의사를 밝혔더라도 특별한 사정이 없는 한, 그 임의제출을 통해 수사기관이 영장 없이 적법하게 압수할 수 있는 전자정보의 범위는 범죄혐의사실과 관련된 전자정보에 한정된다.","증거은닉범이 본범으로부터 증거은닉을 교사받아 소지‧보관하고 있던 본범 소유‧관리의 정보저장매체를 피의자의 지위에서 수사기관에 임의제출하였고, 본범이 그 매체 내 전자정보의 탐색‧복제‧출력 시 사생활의 비밀과 자유를 침해받지 않을 실질적인 이익을 갖는다고 평가될 수 있는 경우, 그러한 실질적 이익을 갖는 본범에게 참여권이 보장되어야 한다.",2,0,""],["2025-1","형사법",32,"압수‧수색영장의 집행에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣이 압수‧수색영장을 집행하는 경우에 피압수자에게 반드시 압수‧수색영장을 제시하도록 규정한 것은 영장주의 원칙을 절차적으로 보장하고, 개인의 사생활과 재산권의 침해를 최소화 하는 한편, 준항고 등 피압수자의 불복신청의 기회를 실질적으로 보장하기 위한 것이다.","수사기관이 피의자의 휴대전화를 압수할 당시 피의자에게 영장을 제시하였고피의자는영장의구체적인확인을요구하였지만수사기관이 영장의 범죄사실 기재 부분을 보여주지 않은 경우, 이후 피의자의 변호인이 피의자에 대한 조사에 참여하면서 영장을 구체적으로 확인하였다면 영장의 제시는 적법하게 이루어졌다고 볼 수 있다.","｢금융실명거래및비밀보장에관한법률｣ 제4조에따른금융계좌추적용 압수‧수색영장의 집행에 있어서 수사기관이 금융기관으로부터 금융거래자료를 수신하기에 앞서 금융기관에 영장 원본을 사전에 제시하지 않았다면 원칙적으로 적법한 집행 방법이라고 볼 수 없다.","｢형사소송법｣ 제122조 단서에서 ‘급속을 요하는 때’라고 함은 압수‧수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수‧수색의 실효를 거두기 어려울 경우라고 해석함이 옳다.",1,0,""],["2025-1","형사법",33,"｢형사소송법｣과 ｢검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정｣에 따른 수사의 종결에 관한 설명으로 가장 적절하지 않은 것은?","사법경찰관(특별사법경찰관은 제외한다)이 고발사건을 수사하였으나 해당 사건의 공소시효가 완성되었다고 판단하여 불송치 결정을 하는 경우에는 그 이유를 명시한 서면과 함께 관계 서류와 증거물을 지체 없이 검사에게 송부하여야 한다.","사법경찰관이 고발사건에 대해 불송치 결정을 하는 경우, 사법 경찰관은 사건을 검사에게 송치하지 아니하는 취지와 그 이유를 서면으로고발인에게통지해야하지만, 이러한통지를받은 고발인은 해당 사법경찰관의 소속 관서의 장에게 이의를 신청할 수 없다.","검사가 송치받은 사건에 대해 보완수사가 필요하다고 인정하여 사법경찰관에게 보완수사를 요구하는 경우, 1인이 범한 수죄 중에서 수사기록에 명백히 현출되어 있지 않은 사건은 보완수사 요구의 대상인 관련사건에 포함되지 않는다.","사법경찰관이 사건을 송치하지 아니한 것이 위법 또는 부당하다는 이유로 검사가 사법경찰관에게 재수사를 요청하여 재수사 중인 사건에 대해 해당 사건의 고소인이 이의신청을 한 경우, 사법 경찰관은 재수사의 계속 진행 여부를 결정할 수 있다.",3,2,"수사의 종결(불송치 통지·이의신청)을 묻는 문항입니다. 2026.10.2.부터 고소·고발 사건은 3개월 내 송치 여부 결정(제238조), 불송치 통지는 7일 내(제245조의6), 이의신청은 3개월 내(제245조의7③)로 바뀌었습니다."],["2025-1","형사법",34,"증명의 방법 등에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","어떤 소송절차가 진행된 내용이 공판조서에 기재되지 않았다고 하여 당연히 그 소송절차가 당해 공판기일에 행하여지지 않은 것으로 추정되는 것은 아니고 공판조서에 기재되지 않은 소송 절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있고, 이는 엄격한 증명의 대상이 된다.","친고죄에서의고소유무에대한사실은자유로운증명의대상이된다.","몰수‧추징의 대상이 되는지 여부나 추징액의 인정은 범죄구성 요건사실에 관한 것이 아니어서 엄격한 증명은 필요 없지만 역시 증거에 의하여 인정되어야 한다.","양형의 조건에 관하여 규정한 ｢형법｣ 제51조의 사항은 널리 형의 양정에 관한 법원의 재량사항에 속한다고 해석되므로, 법원은 범죄의 구성요건이나 법률상 규정된 형의 가중‧감면의 사유가 되는 경우를 제외하고는, 법률이 규정한 증거로서의 자격이나 증거조사방식에 구애됨이 없이 상당한 방법으로 조사하여 양형의 조건이 되는 사항을 인정할 수 있다.",0,0,""],["2025-1","형사법",35,"증명책임과 증거의 증명력 등에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형사재판에 있어서 이와 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이나, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건의 확정판결에서의 사실판단을 그대로 채택하기 어렵다고 인정될 경우에는 이를 배척할 수 있다.","임의제출물을 압수한 경우 압수물이 ｢형사소송법｣ 제218조에 따라 실제로 임의제출된 것인지에 관하여 다툼이 있을 때에는 임의제출의 임의성을 의심할 만한 합리적이고 구체적인 사실을 피고인이 증명할 것이 아니라 검사가 그 임의성의 의문점을 없애는 증명을 해야 한다.","검사가 공판기일에 증인으로 신청하여 신문할 사람을 특별한 사정 없이 미리 수사기관에 소환하여 면담하는 절차를 거친 후 증인이 법정에서 피고인에게 불리한 내용의 진술을 한 경우, 검사가 증인신문 전 면담 과정에서 증인에 대한 회유나 압박, 답변 유도나 암시 등으로 증인의 법정진술에 영향을 미치지 않았다는 점이 담보되어야 증인의 법정진술을 신빙할 수 있다.","공연히 사실을 적시하여 사람의 명예를 훼손한 행위가 ｢형법｣ 제310조의 규정에 따라서 위법성이 조각되어 처벌대상이 되지 않기 위하여는 그것이 진실한 사실로서 오로지 공공의 이익에 관한 때에 해당된다는 점을 행위자가 증명하여야 하는 것이고, 이 때에는 전문증거에 대한 증거능력의 제한을 규정한 ｢형사소송법｣ 제310조의2가 적용된다.",3,0,""],["2025-1","형사법",36,"증거동의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣ 제318조 제1항은 “검사와 피고인이 증거로 할 수 있음을 동의한 서류 또는 물건은 진정한 것으로 인정한 때에는 증거로 할 수 있다”고 규정하고 있을 뿐 진정한 것으로 인정하는 방법을 제한하고 있지 아니하므로, 증거동의가 있는 서류 또는 물건은 법원이 제반 사정을 참작하여 진정한 것으로 인정하면 증거로 할 수 있다.","개개의 증거에 대하여 개별적인 증거조사방식을 거치지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 이루어진 것이라 하여도 증거동의로서의 효력을 부정할 이유가 되지 못한다.","증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다.","변호인은 피고인을 대리하여 증거동의에 관한 의견을 낼 수 있을 뿐만 아니라 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수 있다.",3,0,""],["2025-1","형사법",37,"위법수집증거배제법칙과 자백배제법칙에 관한 설명으로 옳은것만을모두고른것은? (다툼이있는경우판례에 의함) ㉠ ｢형사소송법｣ 제216조 제3항에 따라 범행 중 또는 범행 직후의 범죄 장소에서 영장 없이 압수한 물건에 대하여 사후에 압수‧수색영장을 청구하였다가 영장을 발부받지 못한 때에는 수사기관은 압수한 물건을 즉시 반환하여야 하고, 즉시 반환 하지 아니한 압수물은 유죄의 증거로 사용할 수 없으며, 피고인 이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다. ㉡ 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술 거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거 능력이 부인되어야 한다. ㉢ 긴급체포 당시의 상황으로 보아서도 그 요건의 충족 여부에 관한 검사나 사법경찰관의 판단이 경험칙에 비추어 현저히 합리성을 잃은 경우에는 그 체포는 위법한 체포라 할 것이고, 그 체포에 의한 유치 중에 작성된 진술조서는 위법하게 수집된 증거로서 특별한 사정이 없는 한 이를 유죄의 증거로 할 수 없다. ㉣ 피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다. ㉤ ｢형사소송법｣ 제218조를 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 임의로 제출받은 물건을 영장 없이 압수한 경우 그 ‘압수물’ 및 ‘압수물을 찍은 사진’은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다.","㉠, ㉡, ㉣","㉠, ㉢, ㉤","㉡, ㉢, ㉣, ㉤","㉠, ㉡, ㉢, ㉣, ㉤",3,0,""],["2025-1","형사법",38,"전문법칙과 그 예외 등에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ ｢형사소송법｣ 제312조 제3항에서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되 어 있다는 것을 의미한다. ㉡ 피의자의 진술을 기재한 서류 내지 문서가 수사기관의 수사 과정에서 작성된 것이라면 그 서류나 문서의 형식과 관계없이 피의자신문조서와 달리 볼 이유가 없으므로, 수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분은 피고인 또는 변호인이 내용을 부인하는 이상 증거능력이 없다. ㉢ ｢형사소송법｣ 제312조 제5항의 적용대상인 ‘수사과정에서 작성한 진술서’란 수사가 시작된 이후에 수사기관의 관여 아래 작성된 것이거나, 개시된 수사와 관련하여 수사과정에 제출할 목적으로 작성한 것으로, 작성 시기와 경위 등 여러 사정에 비추어 그 실질이 이에 해당하는 이상 명칭이나 작성된 장소 여부를 불문한다. ㉣ ｢형사소송법｣은 재전문진술이나 재전문진술을 기재한 조서에 대하여는 달리 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 하는 데 동의하지 아니하는 한 ｢형사소송법｣ 제310조의2의 규정에 의하여 이를 증거로 할 수 없다. ㉤ 피고인이 수표를 발행하였으나 예금부족 또는 거래정지 처분으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 어떠한 사실을 직접 경험한 사람의 진술에 갈음하는 대체물이므로, 이에 대하여는 ｢형사소송법｣ 제310조의2에서 정한 전문법칙이 적용된다.","1개","2개","3개","4개",2,0,""],["2025-1","형사법",39,"자백보강법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","즉결심판절차에 있어서는 ｢형사소송법｣ 제310조의 규정은 적용하지 아니한다.","피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 ｢형사소송법｣ 제310조의 피고인의 자백에는 포함 되지 아니하므로 이는 피고인의 자백의 보강증거로 될 수 있다.","｢형사소송법｣ 제310조 소정의 ‘피고인의 자백’에 공범인 공동 피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다.","자백에 대한 보강증거는 범죄사실의 전부 또는 중요부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라 직접증거가 아닌 간접증거나 정황증거도 보강 증거가 될 수 있으며, 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다.",1,0,""],["2025-1","형사법",40,"다음 사례에 관한 설명으로 옳지 않은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) 甲은 2024. 5. 1. A에게 甲의 소유인 X토지를 1억 원에 매도하고 같은 날 계약금 1천만 원을, 2024. 5. 10. 중도금 3천만 원을 각각 A로부터 수령하였다. 그런데 甲의 친구인 乙은 丙이 X토지를 탐낸다는 것을 알고 2024. 5. 11. 甲을 부추겨 甲으로 하여금 웃돈을 받고 X토지를 丙에게 팔 것을 마음먹게 하였다. 그에 따라 甲은 2024. 5. 12. 丙에게 X토지를 1억 5천만 원에 매도 하고 같은 날 丙으로부터 대금 전액을 교부받고 나서 곧바로 丙 앞으로 그 소유권이전등기를 마쳐주었다. A는 잔금 지급일인 2024. 5. 15. 甲이 X토지의 소유권을 丙에게 넘겨버린 사실을 명확하게 알게 되었는데, 특별한 사정이 없음에도 피해 신고를 미루어오던 중 2024. 12. 1.에 이르러서야 경찰에 甲을 배임죄로 고소하였다. ㉠ 甲이 丙에게 X토지를 매도하고 그 소유권이전등기를 마쳐준 행위는 A와의 신임관계를 저버리는 것으로서 배임죄의 구성요건에 해당한다. ㉡ X토지는 甲이 배임행위로 인하여 영득한 것이므로 丙이 甲의 배임행위를 알면서도 그 소유권이전등기를 넘겨받은 경우라면, 丙에게 장물취득죄가 성립한다. ㉢ 甲과 乙이 각각 배임죄와 배임교사죄로 함께 기소되어 공범관계에 있는 공동피고인이 된 경우, 甲에 대하여 사법 경찰관이 작성한 피의자신문조서는 甲의 법정진술에 의하여 성립의 진정이 인정되는 등 ｢형사소송법｣ 제312조 제4항의 요건을 갖춘 경우라도 乙이 공판기일에서 그 조서의 내용을 부인하면 이를 乙에 대한 유죄 인정의 증거로 사용할 수 없다. ㉣ 만약 甲과 A가 2000년 이후로 따로 살고 있는 4촌 형제 관계라면, 甲에 대한 A의 위 고소는 부적법하다.","㉡","㉠, ㉢","㉡, ㉣","㉢, ㉣",0,0,""],["2025-1","경찰학",1,"국가경찰과 자치경찰에 관한 이론으로 가장 적절한 것은?","자치경찰은 국가경찰과 비교하여 조직 운영상의 개혁이 용이한 편이다.","국가경찰은 자치경찰과 비교하여 지방세력의 간섭으로 정실에 빠질 우려가 있다.","국가경찰은 자치경찰과 비교하여 다른 행정부문과의 긴밀한 협조·조정이 어렵다.","국가경찰은 자치경찰과 비교하여 신속한 업무수행으로 인해 인권과 민주성이 보장되어 주민들의 지지를 받기 쉽다.",0,0,""],["2025-1","경찰학",2,"다음의 판결과 내용에 관한 설명으로 가장 적절하지 않은 것은?","블랑코 판결은 공무원에 의해 발생한 손해는 국가에 배상책임이 있다고 인정하며 행정개입청구권을 최초로 인정하였다.","미란다 판결은 변호인선임권, 진술거부권 등을 피의자에게 고지하지 않은 상태에서 이루어진 자백의 경우에 임의성과 관계없이 증거 능력을 부정하였다.","에스코베도 판결은 피고인 에스코베도와 변호인과의 접견교통권을 침해하여 획득한 자백의 증거능력을 부정하였다.","크로이츠베르크 판결은 경찰관청이 일반수권 규정에 근거하여 법규명령을 발할 수 있는 분야는 위험방지 분야에 한정된다고 판시하였다.",0,0,""],["2025-1","경찰학",3,"경찰의 기본이념에 관한 설명으로 가장 적절하지 않은 것은?","헌법상 공무원의 신분과 정치적 중립성은 법률이 정하는 바에 의하여 보장된다.","｢경찰공무원법｣은 경찰공무원이 특정 정당이나 특정인의 선거 운동을 하거나 선거 관련 대책회의에 관여하는 행위를 정치활동에 관여하는 행위로 보지 않는다.","｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣과 ｢경찰관 직무집행법｣은 불가침의 기본적 인권보호를 명문화하고 있다.","｢경찰관 직무집행법｣상 경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.",1,0,""],["2025-1","경찰학",4,"경찰의 관할에 관한 설명으로 가장 적절한 것은?","국회의장은 필요할 때에는 경위나 경찰공무원으로 하여금 방청인의 신체를 검사하게 할 수 있다.","국회의 경호업무는 국회의장의 지휘를 받아 수행하되, 경위는 회의장 건물 밖에서, 경찰공무원은 회의장 건물 안에서 경호한다.","국회의장은 국회의 경호를 위하여 필요할 때에는 국회사무처의 동의를 받아 일정한 기간을 정하여 경찰공무원의 파견을 요구 할 수 있다.","재판장은 법정에서의 질서유지를 위하여 필요하다고 인정할 때에는 개정 전후에 상관없이 시‧도경찰청장에게 경찰공무원의 파견을 요구할 수 있다.",0,0,""],["2025-1","경찰학",5,"현대적 범죄예방이론에 관한 설명으로 가장 적절한 것은?","깨진 유리창 이론에 따르면 사소한 무질서라도 그대로 방치할 경우 주민들의 범죄에 대한 두려움이 증가하거나 범죄와 무질서가 더욱 심각해질 수 있다고 보기 때문에 낙인효과를 최소화하기 위한 무관용 경찰활동이 필요하다.","일상활동이론에 의하면 범죄자가 범행을 결정하는 데 고려하는 4가지 요소(VIVA 모델)에는 대상의 가치(Value), 이동의 용이성 (Inertia), 가시성(Visibility), 보호자의 부재(Absence)가 있다.","환경설계를 통한 범죄예방(CPTED) 전략은 제프리(C. R. Jeffery)의 범죄통제모델 3가지 중 범죄억제모델에 해당한다.","상황적 범죄예방이론의 경우 범죄를 예방하는 장치 또는 수단을 통해 범죄 기회를 줄여도, 풍선효과에 따라 범죄가 다른 곳으로 전이되어 결국 전체 범죄는 감소하지 않는다는 비판이 제기된다.",3,0,""],["2025-1","경찰학",6,"다음 사례에 해당하는 ‘위험의 인식’에 관한 설명으로 가장 적절한 것은? 전날 악몽을 꾼 경찰관 A는 경찰관 B와 순찰 중에 주택에서 은은한 클래식 음악이 들리자 위험한 상황이라고 판단하고, 자신을 제지하는 경찰관 B를 밀친 후 혼자 현관문을 부수고 들어갔는데 실제로는 임신부가 태교음악을 듣고 있었다.","경찰관 A의 경우 의무에 합당한 사려 깊은 판단을 하였고 실제로 위험의 발생 가능성은 있으나, 현관문을 부수고 진입한 행위는 위험의 존재 여부를 확인하기 위한 예비적 조치로는 적합하지 않다.","경찰에게 있어 위험의 개념은 사실에 기인하여 향후 발생할 사건에 관한 주관적 추정을 포함하므로, 경찰관 B는 ‘외관적 위험’이 발생하였음에도 개입하지 않아 합리적인 상황 판단을 하지 못한 경우이다.","경찰관 A의 행위는 위험의 외관이나 혐의가 정당화되지 아니 함에도 불구하고 잘못된 주관적 판단에 따라 위험의 존재를 잘못 추정한 위법한 경찰개입이므로, 경찰관 A에게는 민‧형사상 책임이발생할수있으며국가역시국가배상책임이발생될수있다.","해당 사례는 결과적으로 위험이 존재하지 않았고 경찰개입 시점에도 경찰상 위험이 없다고 판단되므로, 부순 현관문에 대해서는 원칙적으로 국가는 손실보상책임이 있다.",2,0,""],["2025-1","경찰학",7,"다음은 브랜팅햄(P. J. Brantingham)과 파우스트(F. L. Faust)의 3가지 범죄예방 접근법에 관한 내용이다. <보기 1>과 <보기 2>의 연결이 가장 적절한 것은? <보기 1> 주요대상 가. 범죄자 나. 우범자 다. 일반대중 <보기 2> 예방전략 및 내용 ㉠ 상습범 대책을 수립하거나 재범을 방지하는 전략 ㉡ 잠재적 범죄자를 초기에 발견하여 개입하는 전략 ㉢ 물리적·사회적 환경 중에서 범죄의 기회를 제공하는 원인 또는 조건을 찾아 개입하는 전략 ㉣ 지역사회 교정프로그램 ㉤ CCTV·비상벨 설치","가 - ㉠, ㉣","나 - ㉢, ㉤","다 - ㉡, ㉣","다 - ㉡, ㉤",0,0,""],["2025-1","경찰학",8,"사이크스와 맛짜(Sykes & Matza)의 중화기술이론에 관한 설명으로 가장 적절하지 않은 것은?","사회구조원인론 중에서도 사회학습이론에 해당하는 중화기술 이론은 인간에게 내면화되어 있는 합법적 규범이나 가치관을 중화시킴으로써 범죄에 이르게 된다는 이론을 말한다.","친구에게 돈을 빌려주었는데 돈을 갚지 않자 벌을 받아야 하는 사람이라고 정당화하며 폭력을 행사한 경우 ‘피해자의 부정’에 해당한다.","돈을 훔친 자신의 행위에 대해 “그들은 돈이 많으니 괜찮아” 라고 합리화하는 것은 ‘피해의 부정’에 해당한다.","중화기술이론은 비행청소년이 범행 전후를 기준으로 언제 중화를 하는지 설명이 어렵고, 설령 비행행위 이전에 중화를 한다고 주장하여도 이후 비행으로 나아가는 청소년과 그렇지 않은 청소년 간의 개인적 차이를 설명하지 못한다는 비판이 제기되고 있다.",0,0,""],["2025-1","경찰학",9,"‘지역사회 경찰활동(Community Policing)’에 관한 설명으로 가장 적절하지 않은 것은?","‘지역사회 경찰활동’은 이미 발생한 범죄를 사후 진압 및 검거 하는 역할에서 벗어나 사전적 예방과 지역사회 문제를 해결하는 문제해결자로서의 경찰 역할을 강조한다.","‘이웃 지향적 경찰활동’은 범죄 발생 원인에 대해 비공식적 사회통제의 약화 및 경제적 궁핍이 소외를 정당화하기 때문 이라고 보아, 경찰과 주민과의 의사소통 라인을 개방하고 서로를 위해 감시하는 민간순찰을 강조한다.","‘전략 지향적 경찰활동’은 전통적 관행과 절차를 배제하여 범죄 요인이나 사회 무질서의 원인을 제거하기 위해 경찰자원을 재분배하고 범죄나 무질서를 예방하는 경찰활동을 말한다.","‘정보기반 경찰활동’은 경찰의 효과성 향상을 위한 전략으로 범죄자 정보 및 분석기법을 활용한 법집행 위주의 경찰활동을 말한다.",2,0,""],["2025-1","경찰학",10,"순찰에 관한 설명으로 가장 적절하지 않은 것은?","순찰은 노선에 따라 정선순찰, 난선순찰, 요점순찰, 구역순찰 등으로 구분할 수 있다.","캔자스(Kansas)시 예방순찰실험의 경우 도보순찰을 증가시켜도 실제 범죄는 감소하지 않아 도보순찰과 범죄율의 연관성에 대해 부정하는 결과가 도출되었다.","플린트(Flint)시 도보순찰실험의 경우 도보순찰을 증가시켜도 실제 범죄는 감소하지 않았으나 오히려 시민들은 안전하다고 느꼈다.","해일(C. D. Hale)과 워커(S. Walker)는 순찰의 기능에 대민서비스 제공을 공통적으로 포함시켰다.",1,0,""],["2025-1","경찰학",11,"｢경찰청 적극행정 면책제도 운영규정｣에 관한 설명으로 가장 적절하지 않은 것은?","“적극행정”이란 경찰청 및 그 소속기관의 공무원 또는 산하 단체의 임‧직원이 국가 또는 공공의 이익을 증진하기 위해 성실하고 능동적으로 업무를 처리하는 행위를 말한다.","“사전컨설팅 감사”란 불합리한 제도 등으로 인해 적극적인 업무 수행이 어려운 경우, 해당 업무의 수행에 앞서 업무 처리 방향 등에 대하여 미리 감사의견을 듣고 이를 업무처리에 반영하여 적극 행정을 추진하는 것을 말한다.","사전컨설팅 감사는 현지 확인 등 실지감사를 원칙으로 하되, 부득이한 사유가 발생할 경우 서면감사로 할 수 있다.","행정심판, 소송, 수사 또는 타 기관에서 감사 중인 사항, 타 법령에서 정하고 있는 재심의 절차를 거친 사항 등은 사전 컨설팅 감사 대상에서 제외한다.",2,0,""],["2025-1","경찰학",12,"경찰의 윤리에 관한 설명으로 옳은 것은 모두 몇 개인가? ㉠ 셔먼(Sherman)의 미끄러지기 쉬운 경사로 이론은 사소한 부패가 습관화되면 나중에는 커다란 부패로 이어진다는 이론이다. ㉡ 클라이니히(Kleinig)는 내부고발의 윤리적 정당화 요건에 대해 내부고발자는 특별한 경우를 제외하고는 외부에 공표한 후 자신의 이견을 표시하기 위한 내부적 채널을 모두 사용하 여야 한다고 주장하였다. ㉢ 회의주의는 불특정대상에 대하여 합리적인 근거를 바탕으로 의심하고 비판하며 개선의 의지가 있다는 점에서 냉소주의와 차이가 있다. ㉣ 사회계약설을 토대로 코헨(Cohen)과 펠드버그(Feldberg)가 제시하는 경찰활동의 기준에 따르면, 오토바이로 도주하는 절도범이 전신주를 들이받자, 이를 발견한 경찰관이 도망가지 못하도록 총을 발사해 절도범을 사망하게 한 경우는 ‘공공의 신뢰 확보’에 위배된다.","0개","1개","2개","3개",1,0,""],["2025-1","경찰학",13,"법치행정의 원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행정작용은 법률에 위배되어서는 아니 되며, 국민의 권리를 제한하거나 의무를 부과하는 경우와 그 밖에 국민생활에 중요한 영향을 미치는 경우에는 법률에 근거하여야 한다.","법률유보의 원칙에서 요구되는 법적 근거는 행정의 조직법적 근거이다.","법률유보의 원칙은 ‘법률에 의한’ 규율만을 뜻하는 것이 아니라 ‘법률에 근거한’ 규율을 요청하는 것이다.","경찰행정은 법에 따라 행하여져야 하며, 경찰행정권에 의하여 국민의 권익이 침해된 경우에는 이에 대한 구제제도가 보장되어야 한다.",1,0,""],["2025-1","경찰학",14,"행정입법에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국무총리 또는 행정각부의 장은 소관사무에 관하여 법률이나 대통령령의 위임 또는 직권으로 총리령 또는 부령을 발할 수 있다.","｢도로교통법시행규칙｣ 제53조 제1항이 정한 [별표 16]의 운전 면허행정처분기준은 부령의 형식으로 되어 있으나, 행정청 내부의 사무처리준칙을 규정한 것에 지나지 아니하므로 대외적으로 국민이나 법원을 기속하는 효력이 없다.","법규명령의 위임의 근거가 되는 법률에 대하여 위헌결정이 선고 되더라도 그 위임규정에 근거하여 제정된 법규명령은 원칙적으로 효력을 유지한다.","국민의 권리 제한 또는 의무 부과와 직접 관련되는 대통령령, 총리령 및 부령은 긴급히 시행하여야 할 특별한 사유가 있는 경우를 제외하고는 공포일부터 적어도 30일이 경과한 날부터 시행되도록 하여야 한다.",2,0,""],["2025-1","경찰학",15,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣상 시·도 자치경찰위원회에 대한 설명으로 가장 적절하지 않은 것은?","시‧도자치경찰위원회는 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임으로 하고, 5명의 위원은 비상임으로 한다.","시‧도자치경찰위원회 위원장은 위원 중에서 시‧도지사가 임명하고, 상임위원은 시‧도자치경찰위원회의 의결을 거쳐 위원 중에서 위원장의 제청으로 시‧도지사가 임명한다.","시‧도자치경찰위원회 위원장과 위원의 임기는 3년으로 하며, 연임할 수 없다. 다만, 보궐위원의 임기는 전임자 임기의 남은 기간으로 하되, 전임자의 남은 임기가 1년 미만인 경우에는 한 차례만 연임할 수 있다.","시‧도자치경찰위원회의 위원장은 재의요구를 받은 날부터 7일 이내에 회의를 소집하여 재의결하여야 한다. 이 경우 재적위원 과반수의 출석과 출석위원 과반수 이상의 찬성으로 전과 같은 의결을 하면 그 의결사항은 확정된다.",3,0,""],["2025-1","경찰학",16,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣에 대한 설명으로 가장 적절하지 않은 것은?","경찰공무원은 상관의 지휘‧감독을 받아 직무를 수행하고, 그 직무수행에 관하여 서로 협력하여야 한다.","국가는 지방자치단체가 이관받은 사무를 원활히 수행할 수 있도록 인력, 장비 등에 소요되는 비용에 대하여 재정적 지원을 하여야 한다.","경찰공무원은 구체적 사건수사와 관련된 상관의 지휘‧감독의 정당성에 대하여 이견이 있더라도 이의를 제기할 수 없다.","국가와 지방자치단체는 국민의 생명‧신체 및 재산을 보호하고 공공의 안녕과 질서유지에 필요한 시책을 수립‧시행하여야 한다.",2,0,""],["2025-1","경찰학",17,"｢경찰관 직무집행법｣ 및 ｢경찰착용기록장치 운영 등에 관한 규정｣에 대한 설명으로 가장 적절하지 않은 것은?","경찰착용기록장치로 기록한 영상음성기록의 보관기간은 해당 기록을 법 제10조의6 제3항에 따라 영상음성기록정보 데이터 베이스에 전송‧저장한 날부터 30일(해당 영상음성기록이 수사 중인 범죄와 관련된 경우 등 경찰청장 또는 해양경찰청장이 정하는 사항에 해당하는 경우에는 90일)로 한다.","경찰청장 및 해양경찰청장은 경찰착용기록장치로 기록한 영상‧ 음성을 저장하고 데이터베이스로 관리하는 영상음성기록정보 관리체계를 구축‧운영하여야 한다.","경찰청장 또는 해양경찰청장은 경찰착용기록장치를 사용하는 경찰관을 대상으로 경찰착용기록장치 조작 방법, 사용 지침, 개인정보 보호 등에 관한 내용이 포함된 교육을 실시해야 한다.","경찰착용기록장치로 기록을 마친 영상음성기록은 10일 이내로 영상음성기록정보 관리체계를 이용하여 영상음성기록정보 데이터베이스에 전송‧저장할 수 있으며, 영상음성기록을 임의로 편집‧복사하거나 삭제하여서는 아니 된다.",3,0,""],["2025-1","경찰학",18,"｢경찰관 직무집행법｣ 및 동법 시행령상 손실보상에 관한 설명으로 가장 적절하지 않은 것은?","국가는 경찰관의 적법한 직무집행으로 인하여 손실발생의 원인에 대하여 책임이 없는 자가 생명‧신체 또는 재산상의 손실을 입은 경우 또는 손실발생의 원인에 대하여 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 생명‧신체 또는 재산상의 손실을 입은 경우에 정당한 보상을 하여야 한다.","경찰청장, 해양경찰청장, 시‧도경찰청장 또는 지방해양경찰청장은 손실보상심의위원회의 심의‧의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수하여야 한다.","손실보상금이 지급된 경우 손실보상심의위원회는 국가경찰위원회 또는 해양경찰위원회에 심사자료와 결과를 반기별로 보고하여야 한다. 이 경우 국가경찰위원회 또는 해양경찰위원회는 손실보상의 적법성 및 적정성 확인을 위하여 필요한 자료의 제출을 요구할 수 있다.","손실보상심의위원회의 위원은 소속 경찰관과 판사‧검사 또는 변호사로 5년 이상 근무한 사람, ｢고등교육법｣ 제2조에 따른 학교에서 법학, 행정학 및 경찰학을 가르치는 조교수 이상으로 5년 이상 재직한 사람, 경찰 업무와 손실보상에 관하여 학식과 경험이 풍부한 사람 중에서 위촉하거나 임명한다.",3,0,""],["2025-1","경찰학",19,"｢질서위반행위규제법｣에 관한 설명으로 가장 적절한 것은?","행정청의 과태료 처분이나 법원의 과태료 재판이 확정된 후 법률이 변경되어 그 행위가 질서위반행위에 해당하지 아니하게 된 때에는 변경된 법률에 특별한 규정이 없는 한 과태료를 감경한다.","자신의 행위가 위법하지 아니한 것으로 오인하고 행한 질서 위반행위는 그 오인에 정당한 이유가 있는 때에 한하여 과태료를 감경한다.","행정청이 질서위반행위에 대하여 과태료를 부과하고자 하는 때에는 미리 당사자에게 대통령령으로 정하는 사항을 통지하고, 30일 이상의 기간을 정하여 의견을 제출할 기회를 주어야 한다.","행정청의 과태료 부과에 불복하는 당사자는 과태료 부과 통지를 받은 날부터 60일 이내에 해당 행정청에 서면으로 이의제기를 할 수 있다.",3,0,""],["2025-1","경찰학",20,"공정력에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","처분은권한이있는기관이취소또는철회하거나기간의경과등으로 소멸되기 전까지는 유효한 것으로 통용된다. 다만, 무효인 처분은 처음부터 그 효력이 발생하지 아니한다.","연령미달의 결격자인 피고인이 소외인의 이름으로 운전면허시험에 응시, 합격하여 교부받은 운전면허는 취소되지 않는 한 유효 하므로 피고인의 운전행위는 무면허운전에 해당하지 아니한다.","행정처분이 위법임을 이유로 배상을 청구하는 경우에는 미리 그 행정처분의 취소판결이 있어야만 그 행정처분의 위법임을 이유로 피고에게 배상을 청구할 수 있다.","과세처분이 당연무효라고 볼 수 없는 한 과세처분에 취소할 수 있는 위법사유가 있다 하더라도 그 과세처분은 행정행위의 공정력 또는 집행력에 의하여 그것이 적법하게 취소되기 전까지는 유효하다 할 것이므로, 민사소송절차에서 그 과세처분의 효력을 부인할 수 없다.",2,0,""],["2025-1","경찰학",21,"무효에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","하자 있는 행정처분이 당연무효가 되기 위하여는 그 하자가 법규의 중요한 부분을 위반한 중대한 것으로서 객관적으로 명백한 것이어야 하며, 하자가 중대하고 명백한 것인지 여부를 판별함에 있어서는 그 법규의 목적, 의미‧기능 등을 목적론적으로 고찰함과 동시에 구체적 사안 자체의 특수성에 관하여도 합리적 으로 고찰함을 요한다.","경찰공무원에 대한 징계위원회의 심의과정에 감경사유에 해당하는 공적 사항이 제시되지 아니한 경우에는 그 징계양정이 결과적으로 적정한지와 상관없이 이는 관계 법령이 정한 징계 절차를 지키지 아니한 것으로서 당연무효이다.","임용 당시 공무원임용 결격사유가 있었다면 비록 국가의 과실에 의하여 임용결격자임을 밝혀 내지 못하였다고 하더라도 그 임용 행위는 당연무효이다.","적법한 건축물에 대한 철거명령은 그 하자가 중대하고 명백하여 당연무효이고, 그 후행행위인 건축물철거 대집행계고처분 역시 당연무효이다.",1,0,""],["2025-1","경찰학",22,"｢행정기본법｣상 행정상 강제에 관한 설명으로 가장 적절 하지 않은 것은?","행정상 직접강제란 의무자가 행정상 의무를 이행하지 아니하는 경우 행정청이 의무자의 신체나 재산에 실력을 행사하여 그 행정상 의무의 이행이 있었던 것과 같은 상태를 실현하는 것이다.","행정상 강제징수란 의무자가 행정상 의무 중 금전급부의무를 이행하지 아니하는 경우 행정청이 의무자의 재산에 실력을 행사 하여 그 행정상 의무가 실현된 것과 같은 상태를 실현하는 것이다.","행정상 즉시강제란 현재의 급박한 행정상의 장해를 제거하기 위한 경우로서 행정청이 미리 행정상 의무 이행을 명할 시간적 여유가 없는 경우 또는 그 성질상 행정상 의무의 이행을 명하는 것만으로는 행정목적 달성이 곤란한 경우에 행정청이 곧바로 국민의 신체 또는 재산에 실력을 행사하여 행정목적을 달성하는 것이다.","이행강제금의 부과란 의무자가 행정상 의무를 이행하지 아니하는 경우 행정청이 적절한 이행기간을 부여하고, 그 기한까지 행정상 의무를 이행하지 아니하면 금전급부의무를 부과하는 것으로서, 행정상 의무를 이행하지 않더라도 반복하여 부과할 수 없다.",3,0,""],["2025-1","경찰학",23,"｢개인정보 보호법｣상 ‘개인정보 보호 원칙’에 관한 설명으로 가장 적절하지 않은 것은?","개인정보처리자는 개인정보의 처리 목적을 명확하게 하여야 하고 그 목적에 필요한 범위에서 최소한의 개인정보만을 적법 하고 정당하게 수집하여야 한다.","개인정보처리자는 개인정보의 처리 목적에 필요한 범위에서 개인정보의 완전성, 확장성 및 신속성이 보장되도록 하여야 한다.","개인정보처리자는 개인정보를 익명 또는 가명으로 처리하여도 개인정보 수집목적을 달성할 수 있는 경우 익명처리가 가능한 경우에는 익명에 의하여, 익명처리로 목적을 달성할 수 없는 경우에는 가명에 의하여 처리될 수 있도록 하여야 한다.","개인정보처리자는 개인정보의 처리 방법 및 종류 등에 따라 정보주체의 권리가 침해받을 가능성과 그 위험 정도를 고려하여 개인정보를 안전하게 관리하여야 한다.",1,0,""],["2025-1","경찰학",24,"｢행정절차법｣에 관한 설명으로 가장 적절하지 않은 것은?","이 법은 행정절차에 관한 공통적인 사항을 규정하여 국민의 행정 참여를 도모함으로써 행정의 공정성‧투명성 및 신뢰성을 확보하고 국민의 권익을 보호함을 목적으로 한다.","행정청의 관할이 분명하지 아니한 경우에는 해당 행정청을 공통으로 감독하는 상급 행정청이 그 관할을 결정하며, 공통으로 감독하는 상급 행정청이 없는 경우에는 각 상급 행정청이 협의하여 그 관할을 결정한다.","송달은 우편 또는 정보통신망을 이용한 방법으로만 하되, 송달받을 자의 주소·거소·영업소·사무소 또는 전자우편주소로 한다.","행정청이 처분을 할 때에는 다른 법령등에 특별한 규정이 있는 경우를 제외하고는 문서로 하여야 하며, 당사자등의 동의가 있거나 당사자가전자문서로처분을신청한경우에는전자문서로할수있다.",2,0,""],["2025-1","경찰학",25,"｢행정심판법｣상 재결에 관한 설명으로 가장 적절하지 않은 것은?","행정심판위원회는 사정재결을 할 때에는 청구인에 대하여 상당한 구제방법을 취하거나 상당한 구제방법을 취할 것을 청구인과 피청구인에게 명한다.","행정심판위원회는 무효등확인심판의 청구가 이유가 있다고 인정하면 처분의 효력 유무 또는 처분의 존재 여부를 확인한다.","행정심판위원회는 의무이행심판의 청구가 이유가 있다고 인정 하면 지체 없이 신청에 따른 처분을 하거나 처분을 할 것을 피청구인에게 명한다.","행정심판위원회는 심판청구가 이유가 있다고 인정하는 경우에도 이를 인용하는 것이 공공복리에 크게 위배된다고 인정하면 그 심판청구를 기각하는 재결을 할 수 있다.",0,0,""],["2025-1","경찰학",26,"｢행정소송법｣상 행정소송의 종류에 관한 설명이다. 아래 ㉠～㉣에 들어갈 내용으로 가장 적절한 것은? ( ㉠ )소송: 행정청의 처분등이나 부작위에 대하여 제기하는 소송 ( ㉡ )소송: 국가 또는 공공단체의 기관이 법률에 위반되는 행위를 한 때에 직접 자기의 법률상 이익과 관계없이 그 시정을 구하기 위하여 제기하는 소송 ( ㉢ )소송: 행정청의 처분등을 원인으로 하는 법률관계에 관한 소송 그 밖에 공법상의 법률관계에 관한 소송으로서 그 법률 관계의 한쪽 ( ㉣ )를 피고로 하는 소송 ㉠ ㉡ ㉢ ㉣","항고 민중 당사자 대표자","부작위 항고 기관 대표자","항고 민중 당사자 당사자","항고 기관 민중 당사자",2,0,""],["2025-1","경찰학",27,"동기부여이론에 관한 설명으로 가장 적절하지 않은 것은?","매슬로(Maslow)는 다원적 인간욕구의 존재를 인정하고 가장 기본적인 욕구는 생리적 욕구라고 하였다.","브룸(Vroom)은 동기유발은 욕구충족이 아니라 과업에 대한 기대감, 수단성, 유의성에 의해 결정된다고 주장하였다.","앨더퍼(Alderfer)는 매슬로의 욕구계층이론을 수정하여 생존욕구, 관계욕구, 성장욕구로 구분하였다.","맥그리거(McGregor)는 전통적 조직이론의 인간관을 위생요인, 새로운 조직이론의 인간관을 동기요인으로 구분하였다.",3,0,""],["2025-1","경찰학",28,"경찰조직편성의원리에관한설명으로가장적절하지않은 것은?","계층제 원리 – 권한과 책임의 배분을 통해 신중한 업무처리가 가능하며, 수직적 분화와 집권화 현상이 나타나 구성원의 동기부여를 향상시킨다.","통솔범위의 원리 – 업무의 종류가 단순할수록 통솔의 범위는 넓어지며, 계층의 수가 많아질수록 통솔의 범위가 좁아진다.","분업의 원리 – 분업의 원리는 업무를 그 종류와 성질별로 구분 하여 구성원에게 가능한 한 한가지의 주된 업무를 분담시킴으로써 조직 관리상의 능률을 향상시키려는 것을 말한다.","조정과 통합의 원리 – 구성원의 노력과 행동을 질서있게 배열 하고 통일시키는 작용을 함으로써 경찰행정의 목표를 효율적 으로 달성할 수 있게 한다.",0,0,""],["2025-1","경찰학",29,"｢경찰공무원법｣ 및 ｢경찰공무원 임용령｣상 경찰공무원 채용에 관한 설명으로 가장 적절하지 않은 것은?","채용후보자 등록을 하지 아니한 사람은 경찰공무원으로 임용될 의사가 없는 것으로 본다.","경찰청장 또는 해양경찰청장은 채용후보자 명부의 유효기간을 연장하기로 결정한 경우에는 그 사실을 공고하여야 한다.","경찰청장 또는 해양경찰청장은 경찰공무원의 신규채용시험에서 대통령령으로 정하는 부정행위를 한 사람에 대하여 부정행위자에 대한 제재로서 해당 시험의 정지‧무효 또는 합격 취소 처분을 할 때에는 미리 그 처분의 내용과 사유를 당사자에게 통지하여 소명할 기회를 주어야 한다.","경찰공무원의 신규채용시험은 계급별로 실시한다. 다만, 결원 보충을 원활히 하기 위하여 필요하다고 인정될 때에는 직무 분야별‧근무예정지역 또는 근무예정기관별로 구분하여 실시할 수 있다.",2,0,""],["2025-1","경찰학",30,"｢위해성 경찰장비의 사용기준 등에 관한 규정｣에 대한 설명 으로 가장 적절한 것은?","경찰관은 범인의 체포 또는 도주방지, 타인 또는 경찰관의 생명‧ 신체에 대한 방호, 공무집행에 대한 항거의 억제를 위하여 필요한 때에는 최소한의 범위안에서 가스발사총을 사용할 수 있다. 이 경우 경찰관은 1미터이내의 거리에서 상대방의 얼굴을 향하여 이를 발사하여서는 아니된다.","경찰관은 전극침 발사장치가 있는 전자충격기를 사용하는 경우 상대방의 신체 및 얼굴을 향하여 전극침을 발사할 수 있다.","경찰장구에는 수갑‧포승‧호송용포승‧경찰봉‧호신용경봉‧방패‧전자 방패‧근접분사기 및 가스분사기가 있다.","기타장비에는 가스차·살수차·특수진압차·물포·석궁·다목적발사기· 전자충격기 및 크레모아가 있다.",0,0,""],["2025-1","경찰학",31,"｢보안업무규정｣상 비밀보호에 관한 설명으로 가장 적절하지 않은 것은?","Ⅰ급비밀은 누설될 경우 국가안전보장에 막대한 지장을 끼칠 우려가 있는 비밀을 말한다.","비밀은 해당 등급의 비밀취급 인가를 받은 사람만 취급할 수 있으며, 암호자재는 해당 등급의 비밀 소통용 암호자재취급 인가를 받은 사람만 취급할 수 있다.","비밀을 휴대하고 출장 중인 사람은 비밀을 안전하게 보호하기 위하여 국내 경찰기관 또는 재외공관에 보관을 위탁할 수 있으며, 위탁받은 기관은 그 비밀을 보관하여야 한다.","각급기관의장은연2회비밀소유현황을조사하여국가정보원장에게 통보하여야 한다.",0,0,""],["2025-1","경찰학",32,"｢경찰 인권보호 규칙｣상 경찰청 및 시·도경찰청 인권위원회에 관한 설명으로 가장 적절하지 않은 것은?","경찰 활동 전반에 걸친 민주적 통제를 구현하여 경찰력 오‧남용을 예방하고, 경찰 행정의 인권지향성을 높여 인권을 존중하는 경찰 활동을 정립하기 위해 경찰청장 및 시‧도경찰청장의 자문기구로서 각각 경찰청 인권위원회, 시‧도경찰청 인권위원회를 설치하여 운영한다.","위원회의 당연직 위원은 경찰청은 감사관, 시‧도경찰청은 청문감사인권담당관으로 한다.","위원장과 위촉 위원의 임기는 위촉된 날로부터 2년으로 하며 위원장과 위촉 위원은 한 차례만 연임할 수 있다.","회의에 출석한  경우 운전자는 경찰공무원의 측정에 응하여야 한다.","운전이 금지되는 술에 취한 상태의 기준은 운전자의 혈중알코올 농도가 0.03퍼센트 이상인 경우로 한다.","개인형 이동장치의 운전자는 대통령령으로 정하는 승차정원을 초과하여 동승자를 태우고 개인형 이동장치를 운전하여서는 아니 된다.",3,0,""],["2025-1","경찰학",38,"｢집회 및 시위에 관한 법률｣에 대한 설명이다. ㉠～㉢에 들어갈 내용으로 가장 적절한 것은? “옥외집회”란 ( ㉠ )이 없거나 사방이 폐쇄되지 아니한 장소 에서 여는 집회를 말한다. “( ㉡ )”란 자기 이름으로 자기 책임 아래 집회나 시위를 여는 사람이나 단체를 말한다. “( ㉢ )”(이)란 국가경찰관서를 말한다. ㉠ ㉡ ㉢","천장 주최자 경찰기관","천장 주최자 경찰관서","지붕 주최자 경찰관서","지붕 주관자 경찰기관",1,0,""],["2025-1","경찰학",39,"자랑스러운 경찰의 표상에 관하여 인물과 내용에 대한 설명으로 가장 적절하지 않은 것은?","차일혁: 구례 화엄사 등 문화재를 수호한 인물로 ‘보관문화훈장’을 수여 받음","김학재: 1998년 강도강간 신고출동 현장에서 피의자로부터 좌측 흉부를 칼로 피습당한 상태에서도 격투를 벌여 범인검거 후 순직하였으며, 2018년 ‘경찰영웅’으로 선정됨","안종삼: 예비검속 된 보도연맹원들에 대한 총살명령에 대해 ‘내가 죽더라도 방면하겠으니 국가를 위해 충성해 달라’고 말한 후 전원 방면함","최중락: 1968년 무장공비 침투사건 당시 자하문검문소에서 무장 공비를 온몸으로 막아내고 청와대를 사수하였으며, 호국 경찰의 표상이 됨",3,0,""],["2025-1","경찰학",40,"대한민국 경찰의 법제도 연혁에 관한 설명으로 가장 적절 하지 않은 것은?","자치경찰제의 도입, 다양한 치안서비스 제공, 국민부담 경감 등을 위하여 2020년에 ｢경찰법｣을 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣로 법제명을 변경하는 등 전부개정하였다.","｢경찰법｣은 내무부 치안국을 경찰청으로 개편하기 위하여 1991년에 제정하였다.","｢경찰공무원법｣은 경찰직무의 특수성에 비추어 경찰질서의 확립과 경찰인사의 합리화를 위하여 기존 ｢국가공무원법｣에 포함되어 있는 경찰인사에 관한 규정을 분리하여 별도로 독립된 법으로 1969년에 제정하였다.","｢경찰관 직무집행법｣은 경찰관이 국민에 대한 생명·신체·재산의 보호, 범죄의 예방, 공안의 유지, 기타 법령집행등의 직무를 충실히 수행하도록 필요한 사항을 정하기 위하여 1953년에 제정하였다.",1,0,""],["2025-2","헌법",1,"역대헌법상경제질서에관한설명으로가장적절하지않은 것은?","1948년 제헌헌법에서는 대한민국의 경제질서는 모든 국민에게 생활의 기본적 수요를 충족할 수 있게 하는 사회정의의 실현과 균형 있는 국민경제의 발전을 기함을 기본으로 삼고, 각인의 경제상 자유는 이 한계내에서 보장된다고 하였다.","1962년 제5차 개정헌법에서는 경제질서의 원칙에 관하여 개인의 경제상의 자유와 창의를 존중함을 기본으로 하였다.","1980년 제8차 개정헌법에서는 농지의 소작제도를 헌법에서 직접 금지하면서도, 농업생산성의 제고와 농지의 합리적인 이용을 위한 임대차 및 위탁경영은 법률이 정하는 바에 의하여 인정 된다고 하였다.","현행 헌법은 국가가 국민 모두의 생산 및 생활의 기반이 되는 국토의 효율적이고 균형 있는 이용･개발과 보전을 위하여 법률이 정하는 바에 의하여 그에 관한 필요한 제한과 의무를 과할 수 있게 하고 있다.",2,0,""],["2025-2","헌법",2,"헌법전문(前文)에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","헌법전문은 “3‧1운동으로 건립된 대한민국임시정부의 법통을 계승”한다고 선언하고 있다. 이는 대한민국이 일제에 항거한 독립운동가의 공헌과 희생을 바탕으로 이룩된 것임을 선언한 것이고, 그렇다면 국가는 일제로부터 조국의 자주독립을 위하여 공헌한 독립유공자와 그 유족에 대하여는 응분의 예우를 하여야 할 헌법적 의무를 지닌다.","헌법전문이 대한민국 임시정부의 법통 계승을 천명하기는 하였으나 대한민국이 사실상 조선인을 보호해 줄 조국이 없던 상황 하에서 발생한 피해에 대해서 경제적 지원을 해야 하는지 여부 등의 문제는 기본적으로 국가의 재정부담 능력이나 전체적인 사회보장 수준등에따라결정하여야할광범위한입법형성의영역에속한다.","대한민국 국적을 갖고 있지 아니한 국외강제동원 희생자의 유족을 위로금 지급 대상에서 제외한 ｢대일항쟁기 강제동원 피해조사 및 국외강제동원 희생자 등 지원에 관한 특별법｣ 조항이 ‘정의·인도와 동포애로써 민족의 단결을 공고히’ 할 것을 규정한 헌법전문의 정신에 위반된다고 볼 수 없다.","헌법전문, 제10조, 제30조의 종합적 해석상 국가는 태평양전쟁 전후 국내 강제동원희생자에 대하여도 그 지원에 관한 법률을 제정하여야 할 헌법상 의무가 인정됨에도 불구하고 이를 위한 입법조치를 취하지 않고 있는 것은 국가책무의 우선순위나 공평의 관점에서도 입법재량의 한계를 넘는 입법의무불이행으로서 헌법에 위반된다.",3,0,""],["2025-2","헌법",3,"재외국민 보호에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","재외선거인은 대의기관을 선출할 권리가 있는 국민으로서 대의기관의 의사결정에 대해 승인할 권리가 있으므로, 국민 투표권자에는 재외선거인이 포함된다고 보아야 한다.","｢영유아보육법｣상 보육료‧양육수당은 대한민국 국민으로서 일정기간 계속 거주를 하는 자이면 그 거주의 목적이 무엇인지, 향후 생활의 근거가 대한민국인지 외국인지 여부 등을 불문하고 지급되어야 하는 것이므로, 단지 외국의 영주권을 취득한 재외 국민이라는 이유로 일반 국민들과 달리 취급할 아무런 이유가 없다.","｢재외동포기본법｣상 국가는 재외동포정책을 수립하는 경우 국내에 체류하고 있는 외국인에 대한 정책과 조화를 이룰 수 있도록 노력하여야 한다.","｢재외국민보호를 위한 영사조력법｣상 영사조력은 국내에서 발생하는 유사 상황 시 정부가 국민에게 제공하는 보호의 수준을 초과하여 제공될 수 있다. (일반공채･101경비단)",3,0,""],["2025-2","헌법",4,"외국인의 기본권 주체성에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","신체의 자유, 주거의 자유, 변호인의 조력을 받을 권리, 재판 청구권 등은 성질상 인간의 권리에 해당한다고 볼 수 있으므로, 위 기본권들에 관하여는 외국인 근로자들의 기본권 주체성이 인정된다. 따라서 ‘국가인권위원회의 공정한 조사를 받을 권리’ 또한 헌법상 인정되는 기본권이라고 할 수 있으므로 외국인 근로자에게도 인정된다.","근로의 권리가 “일할 자리에 관한 권리”만이 아니라 “일할 환경에 관한 권리”도 함께 내포하고 있는바, 후자는 인간의 존엄성에 대한 침해를 방어하기 위한 사회권적 기본권의 성격도 갖고 있어 국가에 대하여 고용증진을 위한 사회적･경제적 정책을 요구할 수 있는 권리와 건강한 작업환경, 일에 대한 정당한 보수, 합리적인 근로조건의 보장 등을 요구할 수 있는 권리 등을 포함한다고 할 것이므로 외국인 근로자라고 하여 이 부분에까지 기본권 주체성을 부인할 수는 없다.","평등권은 원칙적으로 인간의 권리로서 외국인에게도 인정되나 참정권 등에 대한 성질상의 제한 및 상호주의에 따른 제한이 있을 수 있다. 중국국적동포인 청구인들이 주장하는 바는 대한민국 국민과의 관계가 아닌, 외국 국적의 동포들 사이에 ｢재외동포의 출입국과 법적 지위에 관한 법률｣의 수혜대상에서 차별하는 것이 평등권 침해라는 것으로서, 성질상 위와 같은 제한을 받는 것이 아니고 상호주의가 문제되는 것도 아니므로, 청구인들에게 기본권주체성을 인정함에 아무런 문제가 없다.","강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 ｢출입국관리법｣ 조항은 행정의 편의성과 획일성만을 강조한 것으로, 피보호자의 신체의 자유를 과도하게 제한하는 것인 점에서 입법목적의 정당성과 수단의 적합성을 충족하지 못하여 피보호자인 외국인 불법체류자의 신체의 자유를 침해한다.",2,0,""],["2025-2","헌법",5,"평등원칙에 관한 설명으로 가장 적절한 것은?(다툼이 있는 경우 헌법재판소 판례에 의함)","우편을 이용한 접근의 금지를 피해자보호명령에 포함시키지 아니한 구 ｢가정폭력범죄의 처벌 등에 관한 특례법｣ 조항은 전기통신을 이용한 접근과 비교하여 볼 때 우편을 이용한 접근이 피해자의 안전에 위협이 되지 않는다거나 그러한 접근금지가 피해자 보호에 실효성이 없다는 사정은 발견되지 않으므로, 전기통신을 이용한 접근금지를 규정하고 있는 것과 달리 우편을 이용한 접근금지에 대하여 규정하지 아니한 것은 합리적 이유 없는 차별로서 평등원칙에 위반된다.","구 ｢건설근로자의 고용개선 등에 관한 법률｣ 제14조 제2항 중 구 ｢산업재해보상보험법｣ 제63조 제1항 가운데 ‘그 근로자가 사망할 당시 대한민국 국민이 아닌 자로서 외국에서 거주하고 있던 유족은 제외한다’를 준용하는 부분은 합리적 이유 없이 외국거주 외국인유족을 대한민국 국민인 유족 및 국내거주 외국인 유족과 차별하는 것이므로 평등원칙에 위반된다.","국립묘지 안장 대상자의 배우자는 직접 국가를 위해 희생·공헌한 사람은 아니지만 안장 대상자의 공헌과 희생에 직·간접적으로 조력하고 그로 인한 어려움을 함께 공유한 사람이므로, 안장 대상자의 배우자의 이러한 기여는 안장 대상자 사망 후에 재혼을 한다고 하여 소급적으로 소멸되는 것이 아니다. 따라서 안장 대상자의 사망 후 배우자가 재혼하였다는 이유만으로 그 기여를 전혀고려하지않고 일률적으로국립묘지합장대상에서 제외한것은 재혼한 배우자를 불합리하게 차별한 것으로서 평등원칙에 위배된다.","근로자가 산업재해보상보험의 보험료를 부담하지 않는 것과 달리, ｢고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률｣ 제49조의3 제2항 본문이 특수형태근로종사자에 대하여 산업재해 보상보험 보험료의 2분의 1을 부담시키는 것은 합리적인 이유 없이 특수형태근로종사자를 불리하게 대우하는 것으로서 평등원칙에 위반된다.",1,0,""],["2025-2","헌법",6,"체계정당성의 원리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","자백간주로 인한 피고 패소판결을 항소의 대상에서 제외하는 규정을 두지 않은 ｢민사소송법｣ 조항은 신의성실의 원칙을 규정한 조항들과 상호 배치되거나 모순된다고 할 수 있으므로 체계정당성의 원리에 위배된다.","체계정당성의 원리는 동일 규범 내에서 또는 상이한 규범간에 그 규범의 구조나 내용 또는 규범의 근거가 되는 원칙면에서 상호 배치되거나 모순되어서는 안 된다는 하나의 헌법적 요청이며, 국가공권력에 대한 통제와 이를 통한 국민의 자유와 권리의 보장을 이념으로 하는 법치주의원리로부터 도출된다.","500만 원 이상 5천만 원 미만 가액의 ｢마약류 관리에 관한 법률｣ 제2조 제3호 나목의 향정신성의약품을 소지한 경우 무기 또는 3년 이상의 징역에 처하도록 규정한 ｢특정범죄 가중처벌 등에 관한 법률｣ 조항이 현저히 형벌체계상의 균형성을 잃은 자의적인 입법이라고 할 수 없으므로 평등원칙에 위배되지 아니한다.","체계정당성 위반은 비례의 원칙이나 평등의 원칙 등 일정한 헌법의 규정이나 원칙을 위반하여야만 비로소 위헌이 되며, 체계정당성의 위반을 정당화할 합리적인 사유의 존재에 대하여는 입법재량이 인정된다.",0,0,""],["2025-2","헌법",7,"진술거부권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","정치자금의 수입·지출에 관한 내역을 회계장부에 허위 기재 하거나 관할 선거관리위원회에 허위 보고한 정당의 회계책임자를 형사처벌하는 구 ｢정치자금에관한법률｣ 조항들은 원칙적으로 국가가 부담하고 있는 ‘정치자금 부정수수죄’에 관한 증명 책임을 범죄자에게 전가하는 결과를 가져옴으로써, 진술거부권이 보장 하고 있는 피의자와 검사 사이의 무기평등의 원칙 내지는 탄핵주의 형사 사법제도의 이념을 부당하게 침해하므로, ‘불법 정치자금의 수입과 지출에 관한 기재·보고’에 적용되는 범위 내에서는 헌법에 위반된다.","명의신탁이 증여로 의제되는 경우 명의신탁의 당사자에게 ‘증여세의 과세가액 및 과세표준을 납세지관할세무서장에게 신고할 의무’를 부과하는 구 ｢상속세 및 증여세법｣ 조항이 형사상 불리한 진술을 강요하는 것이라고 볼 수 없으므로, 이들 조항으로 인하여 헌법 제12조 제2항에 규정된 청구인의 진술거부권이 제한된다고 볼 수 없다.","대체유류에는 적법하게 제조되어 ｢석유 및 석유대체연료 사업법｣상 처벌대상이 되지 않는 석유대체연료를 포함하는 것이므로 ‘대체 유류’를 제조하였다고 신고하는 것이 곧 ｢석유 및 석유대체연료 사업법｣을 위반하였음을 시인하는 것과 마찬가지라고 할 수 없고, 신고의무 이행시 진행되는 과세절차가 곧바로 ｢석유 및 석유대체연료 사업법｣ 위반죄 처벌을 위한 자료의 수집·획득 절차로 이행되는 것도 아니다. 따라서 교통·에너지·환경세의 과세물품 및 수량을 신고하도록 한 ｢교통·에너지·환경세법｣ 제7조 제1항은 형사상 불이익한 사실의 진술을 강요한 것으로 볼 수 없으므로 진술거부권을 제한하지 아니한다.","헌법 제12조 제2항에서 규정하는 진술거부권에 있어서의 ‘진술’이란 형사상 자신에게 불이익이 될 수 있는 진술로서 범죄의 성립과 양형에서의 불리한 사실 등을 말하는 것이고, 그 진술내용이 자기의 형사책임에 관련되는 것일 것을 전제로 한다.",0,0,""],["2025-2","헌법",8,"결사의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","국가나 지방자치단체가 공익적 기능을 직접 수행하거나 별개의 단체를 설립하여 이를 위탁한다면 입법목적을 달성하면서도 지역별 협회의 결사의 자유를 덜 제한할 수 있음에도 불구하고, 운송사업자로 구성된 협회로 하여금 연합회에 강제로 가입하게 하고 임의로 탈퇴할 수 없도록 하는 ｢화물자동차 운수사업법｣ 제50조 제1항 후문 중 ‘운송사업자로 구성된 협회’에 관한 부분은 과잉금지원칙에 위배되어 결사의 자유를 침해한다.","지역농협 이사 선거의 경우 전화(문자메시지를 포함한다)·컴퓨터 통신(전자우편을 포함한다)을 이용한 지지 호소의 선거운동방법을 금지하고, 이를 위반한 자를 처벌하는 구 ｢농업협동조합법｣ 조항은 과잉금지원칙을 위반하여 청구인들의 결사의 자유, 표현의 자유를 침해하여 헌법에 위반된다.","결사의 자유에는 ‘단체활동의 자유’도 포함되는데, 단체활동의 자유는 단체 외부에 대한 활동뿐만 아니라 단체의 조직, 의사 형성의 절차 등의 단체의 내부적 생활을 스스로 결정하고 형성할 권리인 ‘단체 내부 활동의 자유’를 포함한다.","｢참전유공자예우 및 단체설립에 관한 법률｣ 제19조 단서에서 “대한민국고엽제전우회의 회원으로 가입한 사람은 월남전참전 자회의 회원이 될 수 없다.”고 규정한 것은 양 법인의 중복가입에 따라 발생할 수 있는 두 단체 사이의 마찰, 중복지원으로 인한 예산낭비, 중복가입자의 이해상반행위를 방지하기 위한 것이 므로 청구인의 결사의 자유를 전면적으로 제한하는 것은 아니다.",0,0,""],["2025-2","헌법",9,"재산권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","기초생활수급자 또는 ｢임대차보호법｣상 소액임차인의 청구권을 면책제외채권에 포함시키지 아니한 ｢채무자 회생 및 파산에 관한 법률｣ 제625조 제2항은 개인회생제도의 목적 달성을 위한 불가피한 규율에 해당하므로 과잉금지원칙을 위반하여 청구인의 재산권을 침해하지 않는다.","지방의회의원에 취임한 퇴역연금 수급자는 다른 일반 공무원과 마찬가지로 다시 소득활동을 계속하게 되었으므로 실질이 ‘퇴직’한 것으로 볼 수 없고 그 보수인 의정비는 퇴역연금을 대체하기에 충분하므로 연금을 통해 보호할 필요성이 있는 ‘사회적 위험’이 발생한 자라고 볼 수 없으므로, 퇴역연금 수급자가 지방의회 의원에 취임한 경우, 퇴역연금 전부의 지급을 정지하도록 규정한 구 ｢군인연금법｣ 제27조 제1항 제2호 중 ‘지방의회의원’에 관한 부분은 과잉금지원칙에 반하여 지방의회의원에 취임한 퇴역연금 수급자의 재산권을 침해하지 않는다.","건물을 신축하고 그 신축한 건물의 취득일부터 5년 이내에 해당 건물을 양도하는 경우로서 환산가액을 그 취득가액으로 하는 경우에는 해당 건물 환산가액의 100분의 5에 해당하는 금액을 양도소득 결정세액에 더하도록 정한 구 ｢소득세법｣ 제114조의2 제1항은 재산권 제한의 정도가 부당한 조세회피의 방지라는 공익에 비하여 중하다고 볼 수 없으므로 과잉금지원칙을 위반 하여 재산권을 침해하지 않는다.","납세의무자가 법정신고기한까지 ｢지방세법｣에 따라 산출한 세액을 신고하지 아니한 경우에는 산출세액의 100분의 20에 상당하는 금액을 가산세로 부과하도록 한 구 ｢지방세기본법｣ 조항은 납세의무자의 성실신고를 유도하여 신고납세제도의 실효성을 확보하고, 납세의무의 확정을 위해 투입될 과세관청의 행정력을 절감하며 납세의무 위반을 미연에 방지하기 위한 것이므로 과잉금지원칙에 위배되어 청구인의 재산권을 침해하지 않는다.",1,0,""],["2025-2","헌법",10,"재판청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","행정소송에 관하여 변론을 종결할 때까지만 청구의 취지 또는 원인을 변경할 수 있도록 하는 ｢행정소송법｣ 제8조 제2항 가운데 ｢민사소송법｣ 제262조 제1항 본문 중 ‘변론을 종결할 때까지’ 부분을 준용하는 부분은 재판청구권을 침해한다고 볼 수 없다.","이의신청에 대한 재결서를 받은 날부터 60일 이내에 행정소송을 제기하도록 한 ｢공익사업을 위한 토지 등의 취득 및 보상에 관한 법률｣ 제85조 제1항 전문 중 ‘관계인은 이의신청을 거쳤을 때에는 이의신청에 대한 재결서를 받은 날부터 60일 이내에 행정소송을 제기할 수 있다.’ 부분은 입법재량의 한계를 벗어 나지 않았다고 할 것이므로 재판청구권을 침해하지 아니한다.","신주발행무효확인의 제소기간을 신주발행일로부터 6개월 이내로 제한한 ｢상법｣ 제429조 중 ‘신주를 발행한 날로부터 6월’ 부분은 신주발행에 관련된 법률관계의 조속한 확정과 안정을 도모하기 위함이므로 입법부에 주어진 합리적인 재량의 한계를 일탈하여 재판청구권을 침해한 것이라 할 수 없다.","별건으로 공소제기 후 확정되어 검사가 보관하고 있는 서류에 대하여 법원의 열람·등사 허용 결정이 있었음에도 검사가 청구인에 대한 형사사건과의 관련성을 부정하면서 해당 서류의 열람·등사를 허용하지 아니한 행위는 청구인의 신속·공정한 재판을 받을 권리 및 변호인의 조력을 받을 권리를 침해하지 아니한다.",3,0,""],["2025-2","헌법",11,"혼인과 가족생활에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","혼인 종료 후 300일 이내에 출생한 자를 전남편의 친생자로 추정하는 ｢민법｣ 조항은 자녀의 출생과 동시에 안정된 법적 지위를 갖추게 함으로써 법적 보호의 공백을 방지하는 기능을 수행한다는 점에서 합리성이 인정되므로, 입법재량의 한계를 준수한 것으로서 모가 가정생활과 신분관계에서 누려야 할 인격권, 혼인과 가족생활에 관한 기본권을 침해하지 아니한다.","1990년 개정 ｢민법｣의 시행일인 1991. 1. 1.부터 그 이전에 성립된 계모자 사이의 법정혈족관계를 소멸시키도록 한 ｢민법｣ 조항은 개인의 존엄과 양성평등에 반하는 전래의 가족제도를 개선하기 위한 입법이므로 가족제도를 보장하는 헌법 제36조 제1항에 위반된다고 볼 수 없다.","헌법 제36조 제1항은 혼인과 가족에 관련되는 공법 및 사법의 모든 영역에 영향을 미치는 헌법원리 내지 원칙규범으로서의 성격도 가지는데, 이는 적극적으로는 적절한 조치를 통해서 혼인과 가족을 지원하고 제삼자에 의한 침해 앞에서 혼인과 가족을 보호해야 할 국가의 과제를 포함하며, 소극적으로는 불이익을 야기하는 제한조치를 통해서 혼인과 가족을 차별하는 것을 금지해야 할 국가의 의무를 포함한다.","종합부동산세의 과세방법을 ‘인별합산’이 아니라 ‘세대별 합산’ 으로 규정한 ｢종합부동산세법｣ 조항은 혼인한 자 또는 가족과 함께 세대를 구성한 자를 비례의 원칙에 반하여 개인별로 과세되는 독신자, 사실혼 관계의 부부, 세대원이 아닌 주택 등의 소유자 등에 비하여 불리하게 차별하여 취급하고 있으므로, 헌법 제36조 제1항에 위반된다.",0,0,""],["2025-2","헌법",12,"기본권의 보호에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","‘외교관계에관한비엔나협약’에 의해 외국의 대사관저에 강제 집행을 할 수 없다는 이유로 집달관이 임대인인 청구인들의 강제집행의 신청의 접수를 거부하여 강제집행이 불가능하게 된 경우, 국가가 청구인들에게 손실을 보상하는 법률을 제정하여야 할 헌법상의 명시적인 입법위임이 인정되며, 헌법의 해석으로도 그러한 법률을 제정함으로써 청구인들의 기본권을 보호하여야 할 입법자의 행위의무 내지 보호의무가 발생한다.","헌법재판소는 권력분립의 관점에서 소위 “과소보호금지원칙”을, 즉 국가가 국민의 기본권 보호를 위하여 적어도 적절하고 효율적인 최소한의 보호조치를 취했는가를 기준으로 국가의 기본권 보호의무 이행을 심사하여야 하지만, 입법부작위나 불완전한 입법에 의한 기본권의 침해는 입법자의 보호의무에 대한 명백한 위반이 있는 경우에만 인정되는 것은 아니다.","국가의 기본권 보호의무란 사인인 제3자에 의한 생명이나 신체에 대한 침해로부터 이를 보호하여야 할 국가의 의무를 말하는 것으로, 국가가 직접 주방용오물분쇄기의 사용을 금지 하여 개인의 기본권을 제한하는 경우에는 국가의 기본권 보호 의무 위반 여부가 문제된다.","구 ｢동물보호법｣ 제33조 제3항 제5호에서 동물장묘업 등록에 관하여 ｢장사 등에 관한 법률｣ 제17조 외에 다른 지역적 제한 사유를 규정하지 않았다는 사정만으로 청구인들의 환경권을 보호하기 위한 입법자의 의무를 과소하게 이행하였다고 평가할 수는 없다.",3,0,""],["2025-2","헌법",13,"변호인의 조력을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","청구인이 국가안전기획부 면회실에서 그의 변호인과 접견할 때, 국가안전기획부 소속직원인 수사관이 참여하여 대화 내용을 듣거나 기록한 것은 헌법 제12조 제4항이 규정한 변호인의 조력을 받을 권리를 침해한 것으로서 헌법에 위배된다.","검찰수사관인 피청구인이 피의자신문에 참여한 변호인인 청구인에게 피의자 후방에 앉으라고 요구한 행위와 관련하여 변호인의 피의자신문참여권이 헌법상 기본권에 해당한다고 보더라도, 청구인은 적극적으로 피의자에게 진술거부권 행사를 조력하는 등 피의자신문참여권을 행사함에 있어 어떠한 지장도 받지 않았 으므로 후방착석요구행위의 목적의 정당성과 수단의 적절성을 인정할 수 있다.","변호인과의 자유로운 접견은 신체구속을 당한 사람에게 보장된 변호인의 조력을 받을 권리의 가장 중요한 내용이어서 국가안전 보장‧질서유지‧공공복리 등 어떠한 명분으로도 제한될 수 있는 성질의 것이 아니며, 변호인의 조력을 받을 권리의 출발점은 변호인선임권에 있고, 이는 변호인의 조력을 받을 권리의 가장 기초적인 구성부분으로서 법률로써도 제한할 수 없다.","청구인이 구속된 후 6월 1일에 청구인의 국선변호인이 선정되었고 그 국선변호인은 6월 5일에 청구인에 대한 접견을 신청하였는데, 접견을 희망한 6월 6일이 현충일로 공휴일이라는 이유로 접견이 거부되었고 이로부터 이틀 후인 6월 8일에 청구인과 변호인의 접견이 실시된 것은 청구인의 변호인의 조력을 받을 권리를 침해하였다고 볼 수 없다.",1,0,""],["2025-2","헌법",14,"인간의 존엄과 가치에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 헌법재판소 판례에 의함) ㉠ 교정시설의 1인당 수용면적이 수형자의 인간으로서의 기본 욕구에 따른 생활조차 어렵게 할 만큼 지나치게 협소하다면, 이는 그 자체로 국가형벌권 행사의 한계를 넘어 수형자의 인간의 존엄과 가치를 침해하는 것이다. ㉡ 사람은 자신의 의사에 반하여 얼굴을 비롯하여 일반적으로 특정인임을 식별할 수 있는 신체적 특징에 관하여 함부로 촬영당하지 아니할 권리를 가지고 있으므로, 사법경찰관이 보도자료 배포 직후 기자들의 취재 요청에 응하여 사기혐의로 구속된 청구인이 경찰서 조사실에서 양손에 수갑을 찬 채 조사받는 모습을 촬영할 수 있도록 허용한 행위는 헌법 제10조로부터 도출되는 초상권을 포함한 일반적 인격권을 제한한다고 할 것이다. ㉢ 태아의 성별은 태아의 부모의 의사나 의지와는 무관하게 자연적으로 결정되어지는 것이므로, 태아의 부모가 태아의 성별 정보를 출산 이전에 미리 확인할 자유가 있어 얻을 수 있는 이익이란, 장래 가족의 일원이 될 태아의 성별에 대하여 미리 알고 싶은 인간의 본능에 가까운 호기심의 충족과 태아의 성별에 따른 출산 이후의 양육 준비를 미리 할 수 있다는 사실상 이익에 불과하므로, 태아의 성별에 대하여 이를 고지하는 것을 금지하는 구 ｢의료법｣으로 인하여 태아의 부(父)인 청구인의 헌법상 보장된 기본권이 침해될 여지는 없다. ㉣ 배아생성자는 배아에 대해 자신의 유전자정보가 담긴 신체의 일부를 제공하고, 또 배아가 모체에 성공적으로 착상하여 인간으로 출생할 경우 생물학적 부모로서의 지위를 갖게 되므로, 배아의 관리 또는 처분에 대한 결정권을 가진다. 이러한 배아생성자의 배아에 대한 결정권은 헌법상 명문으로 규정되어 있지는 아니하지만, 헌법 제10조로부터 도출되는 일반적 인격권의 한 유형으로서의 헌법상 권리라 할 것이다.","㉠㉢","㉡㉣","㉠㉡㉢","㉠㉡㉣",3,0,""],["2025-2","헌법",15,"종교의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","신앙의 자유는 그 자체가 내심의 자유의 핵심이므로 법률로써도 이를 침해할 수 없는 반면, 종교적 행위의 자유와 종교적 집회･ 결사의 자유는 신앙의 자유와는 달리 절대적 자유가 아니므로 질서유지, 공공복리 등을 위하여 제한할 수 있다.","국가 또는 지방자치단체외의 자가 양로시설을 설치하고자 하는 경우 신고하도록 규정하고 이를 위반한 경우 처벌하는 ｢노인복지법｣ 조항은 종교적 활동의 자유나 일반적 행동의 자유, 법인운영의 자유에 대한 제한의 정도가 노인들의 쾌적하고 안전한 주거환경을 보장한다는 공익에 비하여 결코 가볍지 않으므로 과잉금지원칙에 위배되어 헌법상 기본권을 침해한다.","피청구인 A구치소장이 구치소 내 미결수용자를 대상으로 B종교 행사를 4주에 1회, 일요일이 아닌 요일에 실시한 행위는 해당 구치소에 종교행사 공간이 1개뿐이고, 종교행사는 종교, 수형자와 미결수용자, 성별, 수용동 별로 진행되며, 미결수용자는 공범이나 동일사건 관련자가 있는 경우 이를 분리하여 참석하게 해야 하는 점 등을 고려하면 청구인의 종교의 자유를 과도하게 제한 하였다고 보기 어렵다.","종교단체가 종교적 행사를 위하여 종교집회장 내에 납골시설을 설치하여 운영하는 것은 종교행사의 자유와 관련된 것이라고 할 것이고, 그러한 납골시설의 설치를 금지하는 것은 종교행사의 자유를 제한하는 결과로 된다.",1,0,""],["2025-2","헌법",16,"개인정보자기결정권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","주민등록증 발급신청서에 열 손가락 지문을 날인하도록 한 구 ｢주민등록법 시행령｣ 제36조 제3항에 의한 별지 제30호 서식 중 열 손가락의 지문을 찍도록 한 부분은 ｢주민등록법｣ 제24조 제7항의 위임규정에 근거하여 주민등록증발급신청서의 서식을 정하면서 보다 정확한 신원확인이 가능하도록 하기 위하여 열 손가락의 지문을 날인하도록 하고 있으므로 개인정보자기 결정권을 침해한다고 볼 수 없다.","감염병 전파 차단을 위한 개인정보 수집의 수권조항인 구 ｢감염병의 예방 및 관리에 관한 법률｣ 제76조의2 제1항 제1호는 정보수집의 목적 및 대상이 제한되어 있고, 관련 규정에서 절차적 통제장치를 마련하여 정보의 남용 가능성을 통제하고 있으므로 과잉금지 원칙에 반하여 청구인의 개인정보자기결정권을 침해하지 않는다.","정보주체의 배우자나 직계혈족이 정보주체의 위임 없이도 정보 주체의 가족관계 상세증명서의 교부 청구를 할 수 있도록 하는 ｢가족관계의 등록 등에 관한 법률｣ 제14조 제1항 본문 중 ‘배우자, 직계혈족은 제15조 제1항 제1호에 규정된 가족관계증명서에 대한 상세증명서의 교부를 청구할 수 있다.’고 한 부분은 정보 주체의 현재의 혼인의 배우자 및 직계혈족의 이익 보호에만 지나치게 치우친 방법이므로, 달성하려는 입법목적과 그로 인해 제한되는 개인정보자기결정권 사이에 적절한 균형을 달성하지 못해 청구인의 개인정보자기결정권을 침해한다.","｢가족관계의 등록 등에 관한 법률｣ 제14조 제1항 본문 중 ‘직계혈족이 제15조에 규정된 증명서 가운데 가족관계증명서 및 기본증명서의 교부를 청구’하는 부분은 가정폭력 피해자인 청구인의 개인정보가 가정폭력 가해자인 전 배우자에게 무단으로 유출될 수 있는 가능성을 열어놓아 청구인의 개인정보자기결정권을 침해한다.",2,0,""],["2025-2","헌법",17,"직업의 자유에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 헌법재판소 판례에 의함) ㉠ ｢식품 등의 표시‧광고에 관한 법률｣ 제8조 제1항 제1호는 ‘질병의 예방·치료에 효능이 있는 것으로 인식할 우려가 있는 표시 또는 광고’를 금지하는데, 이때 ‘질병’의 범위에 비만, 체지방 불균형 등이 포함되는지 여부가 불분명하고, ‘예방· 치료에 효능이 있는 것’의 의미도 불분명하여 금지되는 표시· 광고의 내용이 무엇인지 충분히 알 수 없으므로 명확성원칙에 위배되어 청구인의 직업의 자유를 침해한다. ㉡ 안경사 면허를 가진 자연인에게만 안경업소의 개설 등을 할 수 있도록 한 구 ｢의료기사 등에 관한 법률｣ 조항은 과잉금지원칙에 반하지 아니하여 자연인 안경사와 법인의 직업의 자유를 침해하지 아니한다. ㉢ ｢공인중개사법｣을 위반하여 300만 원 이상의 벌금형을 받고 3년이 지나지 아니한 자가 임원으로 있는 중개법인의 등록을 필요적으로 취소하도록 규정한 ｢공인중개사법｣ 조항은 명확성원칙에 위반되어 중개법인의 직업의 자유를 침해하지 않는다. ㉣ 농협·축협 조합장이 금고 이상의 형을 선고받고 그 형이 확정되지 아니한 경우에도 이사가 그 직무를 대행하도록 규정한 ｢농업협동조합법｣ 조항은 과잉금지원칙에 반하여 조합장인 청구인들의 직업수행의 자유를 침해한다. ㉤ 어린이집 원장 또는 보육교사가 아동학대관련범죄로 처벌을 받은 경우 행정청이 재량으로 그 자격을 취소할 수 있도록 정한 ｢영유아보육법｣ 조항은 행정청에게 자격취소에 관한 재량을 임의적으로 부여하고 있으며, 재량권 행사의 당부를 법원에서 사후적으로 판단받을 절차가 마련되어 있지 않다는 점을 고려하면 과잉금지원칙에 반하여 직업선택의 자유를 침해한다.","1개","2개","3개","4개",1,0,""],["2025-2","헌법",18,"언론･출판의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","국가형벌권의 행사를 형법으로 규정하고자 할 때는 최소한의 행위에 국한되어야 하는 점, 단순한 추상적 판단이나 경멸적 감정의 표현행위에 대하여는 시민사회의 자기 교정기능에 맡기거나 민사적 책임을 지우는 것으로 규제할 수 있는 점 등을 종합하여 볼 때, ｢형법｣ 제311조 모욕죄 조항은 과잉금지원칙에 위반하여 표현의 자유를 침해한다.","장교가 군무와 관련된 고충사항을 집단으로 진정 또는 서명하는 행위를 하는 것을 금지하고 있는 ｢군인의 지위 및 복무에 관한 기본법｣ 제31조 제1항 제5호 중 ‘장교’에 관한 부분은 과잉금지 원칙을 위반하여 청구인의 표현의 자유를 침해한다.","선거운동의 자유는 널리 선거과정에서 자유로이 의사를 표현할 자유의 일환이므로 표현의 자유의 한 태양이기도 한데, 이러한 정치적 표현의 자유는 선거과정에서의 선거운동을 통하여 국민이 정치적 의견을 자유로이 발표, 교환함으로써 비로소 그 기능을 다하게 된다 할 것이므로 선거운동의 자유는 헌법이 정한 언론· 출판·집회·결사의 자유 및 보장규정에 의한 보호를 받는다.","구 ｢옥외광고물등관리법시행령｣ 제13조(광고물 등의 일반적 표시방법) 제9항 본문이 교통수단이용 광고물의 표시와 관련 하여 자동차 소유자 자신에 관한 광고는 허용하면서 타인에 관한 광고를 금지하는 것은 표현내용에 따른 과도한 규제에 해당하여 표현의 자유를 침해한다.",2,0,""],["2025-2","헌법",19,"사회보장수급권에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","산재피해 근로자에게 인정되는 산재보험수급권은 헌법상의 권리이며, 개인에게 국가에 대한 사회보장·사회복지 또는 재해예방 등과 관련된 적극적 급부청구권도 인정된다.","공무원연금의 재원은 개인이 부담하는 기여금과 국가 등이 부담 하는 부담금 등으로 형성되므로 한정적일 수밖에 없으나, 연금의 안정적 재정 운용을 명목으로 재직기간 합산에 일정한 제한을 둔 것은 입법목적은 정당하다고 해도 그 수단까지 적절한 것은 아니다.","｢사립학교법｣상 명예퇴직수당은 교원이 정년까지 근무할 경우에 받게 될 장래 임금의 보전이나 퇴직 이후의 생활안정을 보장 하는 사회보장적 급여가 아니라 장기근속 교원의 조기 퇴직을 유도하기 위한 특별장려금이라고 할 것이다.","실업급여의 지급목적, 경제활동인구의 연령별 비율, 보험재정 상태등을모두고려하여‘65세이후고용된자’의경우｢고용보험법｣상 고용안정·직업능력개발사업의 지원대상에 포함시키면서도 실업 급여를 적용하지 않도록 한 것은 65세 이후 고용된 후 이직한 청구인의 평등권을 침해하는 것이다.",2,0,""],["2025-2","헌법",20,"근로3권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","노동조합이 그 설립 당시부터 노동조합으로서 자주성 등을 갖추고 있는지를 심사하여 이를 갖추지 못한 단체의 설립신고서를 반려하도록 하는 것은 과잉금지원칙에 위반되어 근로자의 단결권을 침해한다고 볼 수 없다.","헌법 제33조 제1항에서 ‘단체협약체결권’을 명시하여 규정하고 있지 않다고 하더라도 근로조건의 향상을 위한 근로자 및 그 단체의 본질적인 활동의 자유인 ‘단체교섭권’에는 단체협약 체결권이 포함되어 있다고 보아야 한다.","일반적으로 근로자가 노동조합의 조합원이 될 것을 고용조건 으로 하는 단체협약상의 규정을 유니언 샵(Union Shop) 협정 이라고 하는데, 이는 노동조합이 그 조직을 유지·강화하기 위하여 조합원지위의 취득과 유지를 강제하는 단체협약상의 제도로서, 노동조합의 대표적인 조직강제 수단의 하나에 해당한다.","하나의 사업 또는 사업장에 복수 노동조합이 존재하는 경우 ‘교섭대표노동조합’을 정하여 교섭을 요구하도록 하는 조항인 ｢노동조합 및 노동관계조정법｣ 제29조의2 제1항 본문은 교섭 대표노동조합이 사용자와 잠정적으로 합의한 단체협약안에 대한 확정절차에 소수 노동조합이 참여할 수 있는 규정을 두고 있지 않으므로 과잉금지원칙을 위반하여 청구인들의 단체교섭권을 침해한다.",3,0,""],["2025-2","형사법",1,"죄형법정주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법재판소의 위헌법률심판에 따라 위헌으로 결정된 법률조항은 그 결정이 있는 날부터 효력을 상실하는 것이 원칙이므로 형벌에 관한 법률조항의 위헌결정은 예외적으로도 소급효가 인정되지 않는다.","형벌법규는 문언에 따라 엄격하게 해석‧적용하여야 하고 피고인에게 불리하게 확장해석하거나 유추해석할 수 없으나, 문언의 통상적인 의미를 벗어나지 않는 한 그 법률의 입법 취지와 목적, 입법의 연혁 등을 고려한 목적론적 해석이 배제되는 것은 아니다.","법규범이 명확한지 여부는 그 법규범이 수범자에게 법규의 의미내용을 알 수 있도록 공정한 고지를 하여 예측가능성을 주고 있는지 여부 및 그 법규범이 법을 해석‧집행하는 기관에게 충분한 의미 내용을 규율하여 자의적인 법해석이나 법집행이 배제되는지 여부에 따라 판단할 수 있다.","법률의 시행령이 형사처벌에 관한 사항을 규정하면서 법률의 명시적인 위임 범위를 벗어나 처벌의 대상을 확장하는 것은 죄형법정주의의 원칙에 어긋나므로, 그러한 시행령은 위임입법의 한계를 벗어난 것으로서 무효이다.",0,0,""],["2025-2","형사법",2,"범죄의 종류에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 다수설에 의함)","신분범 중 진정신분범이란 신분자만 범죄 주체가 될 수 있는 범죄를 말하며, 횡령죄, 유기죄, 수뢰죄, 존속살해죄 등이 있다.","경향범이란 범죄성립에 고의 이외에 행위자의 일정한 내심의 경향이 필요한 범죄를 말하며, 경향범인 강제추행죄의 성립을 위해서는 고의 이외에 성욕을 자극, 흥분, 만족시키려는 주관적 동기나 목적이 필요하다.","결과범과 거동범은 범죄성립에 있어서 구성요건적 결과발생 여부를 기준으로 구분되므로 결과범은 행위와 결과 사이에 인과관계가 요구되나 거동범은 범죄행위 외에 결과발생을 요하지 않으므로 인과관계는 문제되지 않는다.","구체적 위험범은 법익침해의 위험이 일반적으로 존재함으로써 범죄의 성립을 인정하는 경우이고, 추상적 위험범은 법익침해의 현실적 위험이 발생할 것을 요건으로 하여 범죄의 성립을 인정하는 경우이다.",2,0,""],["2025-2","형사법",3,"부작위범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","선행행위로 인한 부진정부작위범의 작위의무와 관련하여 객관적으로 의무에 위반한 위법한 선행행위만이 부진정부작위범의 작위 의무의 근거가 된다.","｢형법｣이 금지하고 있는 법익침해의 결과발생을 방지할 법적인 작위의무를 지고 있는 자가 그 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있는데도 결과발생을 용인하고 방관한 채 의무를 이행하지 아니한 것이 범죄의 실행행위로 평가될 만한 것이라면 부작위범으로 처벌할 수 있다.","부작위범 사이의 공동정범은 다수의 부작위범에게 공통된 의무가 부여되어있고, 그의무를공통으로이행할수있을때에만성립한다.","부진정부작위범에 있어서 부작위를 실행의 착수로 볼 수 있기 위해서는 구성요건적 결과 발생의 위험이 구체화한 상황에서 부작위가 이루어져야 한다.",0,0,""],["2025-2","형사법",4,"인과관계에 관한 설명으로 가장 적절하지 않은 것은?(다툼이 있는 경우 판례에 의함)","甲이 乙을 2회에 걸쳐 두 손으로 힘껏 밀어 땅바닥에 넘어뜨리는 폭행을 가함으로써 그 충격으로 인한 쇼크성 심장마비로 사망케 하였다면 비록 乙에게 그 당시 심관성동맥경화 및 심근섬유화 증세등의 심장질환의 지병이 있었고 음주로 만취된 상태였으며 그것이 乙의 사망에 영향을 주었다고 해서 甲의 폭행과 乙의 사망간에 상당인과관계가 없다고 할 수 없다.","피고인의 행위가 결과발생에 유력한 원인이라 할지라도 결과 발생에 시간적으로 근접한 제3자의 또 다른 공동 원인행위가 있다면 피고인의 행위와 결과 사이의 인과관계는 부정된다. (일반공채･101경비단･경찰행정 경채)","의사가 설명의무를 위반한 채 의료행위를 하였다가 환자에게 상해 또는 사망의 결과가 발생한 경우 의사에게 업무상 과실로 인한 형사책임을 지우기 위해서는 의사의 설명의무 위반과 환자의 상해 또는 사망 사이에 상당인과관계가 존재하여야 한다.","甲은 자신이 경영하는 속셈학원의 강사로 乙을 채용하고 학습 교재를 설명하겠다는 구실로 유인하여 호텔 객실에 감금한 후 강간하려 하자, 乙이 완강히 반항하던 중 甲이 대실시간 연장을 위해 전화하는 사이에 객실 창문을 통해 탈출하려다가 지상에 추락하여 사망한 경우, 甲의 강간미수행위와 乙의 사망 사이에 상당인과관계가 있다.",1,0,""],["2025-2","형사법",5,"결과적 가중범에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 결과적 가중범은 기본범죄에 내재된 전형적 위험성이 발현 되었다는 점에서 가중처벌의 근거를 찾을 수 있으므로 기본범죄의 실행에 착수한 사람이 실행행위를 완료하지 않았더라도 이로 인하여 형이 무거워지는 요인이 되는 결과가 생겼다면 기본범죄에 내재된 위험이 현실화되었다는 점에서 이를 결과적 가중범의 기수범으로 처벌하는 것은 당연하다. ㉡ 특수공무집행방해치상죄는 단체 또는 다중의 위력을 보이거나 위험한 물건을 휴대하고 직무를 집행하는 공무원에 대하여 폭행‧협박을 하여 공무원을 사상에 이르게 한 경우에 성립하는 결과적가중범으로서 행위자가 그 결과를 의도할 필요는 없고 그 결과의 발생을 예견할 수 있으면 족하다. ㉢ 甲이 乙을 폭행하여 재물을 강취하려하자 극도의 흥분과 공포심을 느낀 乙이 이를 피하려다 상해를 입은 경우, 甲이 상해의 결과를 예견할 수 있었더라도 甲의 폭행과 乙의 상해 사이에는 상당인과관계가 없으므로 甲을 강도치상죄로 처벌 할 수 없다. ㉣ 강제추행치상죄에서 상해의 결과는 강제추행의 수단으로 사용한 폭행이나 추행행위 그 자체 또는 강제추행에 수반하는 행위로부터 발생한 것이어야 하므로 상해를 가한 부분을 고의범인 상해죄로 처벌하면서 이를 다시 결과적 가중범인 강제추행치상죄의 상해로 인정하여 처벌할 수 없다.","㉡","㉠㉡","㉠㉡㉣","㉠㉢㉣",2,0,""],["2025-2","형사법",6,"다음 사례에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 乙은 자신을 공격해오는 甲을 피하기 위해 인근 주택의 대문을 부수고 안으로 들어갔다. 이때 집주인 丙은 乙을 강도로 오인하고 다시 집 밖으로 밀쳐내어 乙에게 상해를 입혔다. 이때 근처를 지나가던 丁은 평소 자신과 사이가 좋지 않은 甲을 보자 ‘이 기회에 손을 좀 봐줘야겠다’는 생각으로 甲에게 달려가 주먹을 날려 상해를 입혔다. 이에 겁에 질린 甲은 乙에 대한 공격을 포기하고 달아났다.","乙이 대문을 손괴한 행위는 甲의 부당한 공격을 방위하기 위한 행위로서 ｢형법｣ 제21조 정당방위에 해당한다.","위법성인식을 고의와 독립된 책임요소로 보는 견해에 의하면, 丙의 오인에 정당한 이유가 있다면 丙이 乙에게 상해를 입힌 행위는 상해의 고의가 인정되나 책임이 조각된다.","丙의 착오를 구성요건적 착오와 유사하게 보는 견해에 의하면, 구성요건 착오 규정을 적용하여 책임고의가 탈락하며, 丙의 오인에 정당한 이유가 없는 경우 과실치상의 죄책을 진다.","丁이 甲에게 상해를 입힌 행위는 결과적으로 乙을 보호한 행위로서 결과불법이 탈락되어 위법성이 조각된다.",1,0,""],["2025-2","형사법",7,"정당행위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제20조의 ‘사회상규에 위배되지 아니하는 행위’는 구성 요건에 해당하는 행위가 형식적으로 위법하더라도 사회가 내리는 공적 평가에 의하여 용인될 수 있다면 그 행위를 실질적으로 위법한 것으로는 평가할 수 없다는 일반적 위법성조각사유이다.","정당행위의 요건인 긴급성과 보충성은 수단의 상당성을 판단할 때 고려해야 될 하나의 요소로 참작할 뿐 이를 넘어 독립적인 요건으로 요구할 것은 아니며, 그 내용 역시 ‘일체의 법률적인 적법한 수단이 존재하지 않을 것’을 의미한다.","어떠한 행위가 범죄구성요건에 해당하지만 정당행위라는 이유로 위법성이 조각된다는 것은 그 행위가 적극적으로 용인, 권장된다는 의미가 아니라 단지 특정한 상황하에서 그 행위가 범죄행위로서 처벌대상이 될 정도의 위법성을 갖추지 못하였다는 것을 의미한다.","어떠한 행위가 정당행위에 해당하는지는 구체적인 사정 아래서 합목적적, 합리적으로 고찰하여 개별적으로 판단되어야 하며, ‘목적의 정당성’과 ‘수단의 상당성’ 요건은 행위의 측면에서 사회상규에 위배되는지의 판단 기준이 된다.",1,0,""],["2025-2","형사법",8,"책임의 근거와 본질에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 다수설에 의함)","도의적 책임론에 의하면 자유의사가 없는 자는 책임무능력자로서 형벌을 부과할 수 없으며, 자유의사를 가진 책임능력자에게 과해지는 형벌과 자유의사가 없는 책임무능력자에게 과해지는 보안처분은 질적으로 구별된다.","사회적 책임론에 의하면 책임은 환경과 소질에 의해 결정되는 ‘행위자의 반사회적 성격’에 있는 것으로 책임능력은 형벌능력을 의미하고, 형벌과 보안처분은 사회방위의 수단인 점에서 동일하지만 양적 차이가 있을 뿐이다.","인격적 책임론에 의하면 책임을 평가적 가치관계로 이해하여 구체적 사정 아래에서 행위자가 적법행위를 할 수 있었음에도 불구하고 그렇게 하지 않았을 때 비로소 책임비난이 가능하므로 적법행위의 기대가능성이 책임의 중심적 요소이며 비난가능성이 책임의 본질이 된다.","예방적 책임론에 의하면 행위자에 대한 비난가능성만으로 책임을 결정하는 것이 아니라 일반예방이나 특별예방이라는 형벌의 목적도 함께 고려하여 책임을 결정해야 하므로 책임비난이 가능한 경우에도 예방의 필요성이 없으면 책임을 부정할 수 있다.",2,0,""],["2025-2","형사법",9,"미수에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","불능미수는 행위자에게 범죄의사가 있고 실행의 착수라고 볼 수 있는 행위가 있지만 실행의 수단이나 대상의 착오로 처음부터 구성요건이 충족될 가능성이 없는 경우이다. 다만 결과적으로 구성요건의 충족은 불가능하지만, 그 행위의 위험성이 있으면 불능미수로 처벌한다.","소매치기가 피해자의 주머니에 손을 넣어 금품을 절취하려 한 경우 비록 그 주머니속에 금품이 들어있지 않았었다 하더라도 절도라는 결과 발생의 위험성을 충분히 내포하고 있으므로 이는 절도미수에 해당한다.","공동정범자 중 1인이 자의로 자기가 다른 공범의 범행을 중지하게 하지 아니한 채 자기만의 범의를 철회‧포기한 경우 중지미수에 해당하지 않는다.","소송비용 명목의 돈을 편취하기 위해 소송비용의 지급을 구하는 손해배상금 청구의 소를 제기하였다가 담당 판사로부터 소송비용의 확정은 소송비용액 확정절차를 통하여 하라는 권유를 받고 위 소를 취하한 경우, 사기죄와 관련하여 결과 발생의 가능성은 부정되나 소의 제기를 통한 실행의 착수와 결과 발생의 위험성이 인정되므로 사기죄의 불능미수에 해당한다.",3,0,""],["2025-2","형사법",10,"공동정범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제30조에서 정한 ‘2인 이상이 공동하여 죄를 범한 때’의 ‘죄’에는 고의범뿐만 아니라 과실범도 포함되는 것이므로 과실범의 경우에도 공동정범이 성립할 수 있으나, 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없었다면 ‘공동하여’ 죄를 범하였다고 볼 수 없으므로, 과실범의 공동정범이 성립한다고 볼 수 없다.","2인 이상이 범죄에 공동 가공하는 공범관계에서 공모는 법률상 어떤 정형을 요구하는 것이 아니고, 2인 이상이 공모하여 어느 범죄에 공동 가공하여 그 범죄를 실현하려는 의사의 결합만 있으면 되는 것으로서, 비록 전체의 모의과정이 없었다고 하더라도 수인 사이에 순차적으로 또는 암묵적으로 상통하여 그 의사의 결합이 이루어지면 공모관계가 성립한다.","공모공동정범에 있어서 그 공모자중의 1인이 다른 공모자가 실행행위에 이르기 전에 그 공모관계에서 이탈한 때에는 그 이후의 다른 공모자의 행위에 관하여 공동정범으로서의 책임은 지지 않지만, 이때 그 이탈의 표시는 반드시 명시적이어야 한다.","甲이포괄일죄의 관계에 있는범행의 일부를 실행한후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 甲은 다른 공범들의 범죄실행을 저지하지 않은 이상 관여하지 않은 부분에 대하여도 죄책을 부담한다.",2,0,""],["2025-2","형사법",11,"간접정범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","강제추행죄는 정범 자신이 직접 범죄를 실행하여야 하는 자수범 이라고 볼 수 없으므로 간접정범의 형태로도 범할 수 있다.","공무원 아닌 자가 관공서에 허위 내용의 증명원을 제출하여 그 내용이 허위인 정을 모르는 담당공무원으로부터 그 증명원 내용과 같은 증명서를 발급받은 경우, 공문서위조죄의 간접정범이 성립한다.","인신구속에 관한 직무를 행하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속 영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 ｢형법｣ 제124조 제1항의 직권남용감금죄가 성립한다.","자기에게 유리한 판결을 얻기 위하여 소송상의 주장이 사실과 다름이객관적으로명백하거나증거가조작되어있다는정을인식하지 못하는 제3자를 이용하여 그로 하여금 소송의 당사자가 되게 하고 법원을 기망하여 소송 상대방의 재물 또는 재산상 이익을 취득 하였다면 간접정범의 형태에 의한 소송사기죄가 성립한다.",1,0,""],["2025-2","형사법",12,"죄수에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","단일하고도 계속된 범의 아래 일정 기간 반복하여 뇌물수수 행위와 부정한 행위가 행하여졌고 그 뇌물수수 행위와 부정한 행위 사이에 인과관계가 인정되며 피해법익도 동일하다면, 최후의 부정한 행위 이후에 저질러진 뇌물수수 행위도 최후의 부정한 행위 이전의 뇌물수수 행위 및 부정한 행위와 함께 수뢰후부정처사죄의 포괄일죄가 성립한다.","甲이 乙에게 접근하거나 전화를 건 행위가 스토킹범죄를 구성 하는 스토킹행위에 해당하고, 구 ｢스토킹범죄의 처벌 등에 관한 법률(2023. 7. 11. 법률 제19518호로 개정되기 전의 것)｣ 제9조 제1항 제2호, 제3호의 잠정조치를 위반한 행위에도 해당하는 경우, 甲의 행위는 사회관념상 1개의 행위로 성립하는 수 개의 죄에 해당하므로 상상적 경합관계에 있다.","수 개의 등록상표에 대하여 상표권 침해행위가 계속하여 이루어진 경우에는 등록상표마다 포괄하여 1개의 범죄가 성립하지만 하나의 유사상표 사용행위로 수 개의 등록상표를 동시에 침해하였다면 각각의 상표법 위반죄는 상상적 경합의 관계에 있다.","‘수출입거래를가장한신용장개설방법에의한사기죄’와‘분식회계에 의한 재무제표 및 감사보고서 등을 이용한 사기죄’는 범행 방법이 동일하지 않더라도 그 피해자가 동일하므로 포괄일죄가 성립한다.",3,0,""],["2025-2","형사법",13,"선고유예･집행유예･가석방에 관한 설명으로 가장 적절한 것은?","가석방된 자는 가석방기간 중 보호관찰을 받지만 가석방을 허가한 행정관청이 필요 없다고 인정한 때에는 그러하지 아니하다.","가석방 기간 중 고의로 지은 죄로 자격상실 이상의 형을 선고 받아 그 판결이 확정된 경우에 가석방 처분은 효력을 잃는다.","형의 선고유예를 받은 자가 유예기간 중 벌금 이상의 형에 처한 판결이 확정되거나 자격정지 이상의 형에 처한 전과가 발견된 때에는 유예한 형을 선고한다.","집행유예의 선고를 받은 자가 유예기간 중 고의로 범한 죄로 자격정지 이상의 실형을 선고받아 그 판결이 확정된 때에는 집행유예의 선고는 효력을 잃는다.",0,0,""],["2025-2","형사법",14,"상해와 폭행의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 동일한 일시, 장소에서 동일한 목적을 가지고 이발용 면도칼을 휘둘러 乙과 丙에게 상해를 입힌 경우, 甲의 행위는 피해자별로 각각 별개의 상해죄가 성립하는 것이 아니라, 1개의 행위가 수개의 죄에 해당하는 경우라고 보아야 한다.","폭행죄는 피해자의 명시한 의사에 반하여 공소를 제기할 수 없는 반의사불벌죄로서 처벌불원의 의사표시는 의사능력이 있는 피해자가 단독으로 할 수 있는 것이고, 피해자가 사망한 후 그 상속인이 피해자를 대신하여 처벌불원의 의사표시를 할 수는 없다고 보아야 한다.","상해죄 및 폭행죄의 상습범에 관한 ｢형법｣ 제264조에서 말하는 ‘상습’이란 동 규정에 열거된 상해 내지 폭행행위의 습벽을 말하는 것이므로, 동규정에열거되지아니한다른유형의범죄까지 고려하여 상습성의 유무를 결정하여서는 아니 된다.","甲이 乙에게 중상해를 교사하였는데 乙이 이를 넘어 살인을 실행한 경우, 일반적으로 甲은 중상해죄의 죄책을 지게 되는 것이지만, 이 경우에 甲에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다.",0,0,""],["2025-2","형사법",15,"과실치사상죄에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 산후조리원의 신생아 집단관리 책임자 甲이 산후조리원에 입소한 신생아가 계속하여 잦은 설사 등의 이상증세를 보임에도 불구하고 의사의 진찰을 받도록 하지 않아 신생아가 사망한 경우, 甲에게 업무상 과실치사죄가 인정된다. ㉡ 임대한 방실의 부엌으로 통하는 문과 벽사이에 0.4센티미터 정도의 틈이 있다면 이는 문 전체를 다시 제작하여 붙이지 않더라도 다른 목재로 부착보수하는 정도로서 그 틈을 막을 수 있는 경우, 이는 임차인의 통상의 수선관리의무에 속한 것이라 못할바 아니므로 위 문틈으로 스며든 연탄가스에 중독되는 사고가 발생했다 하더라도 위 사고는 임대인의 과실로 인한 것이라고 볼 수 없다. ㉢ 건물 소유자가 안전배려나 안전관리 사무에 계속적으로 종사하거나 그러한 계속적 사무를 담당하는 지위를 가지지 않은 채, 단지 건물을 비정기적으로 수리하거나 건물의 일부분을 임대한 경우라도 건물 소유자의 위와 같은 행위가 업무상 과실치상죄의 ‘업무’에 해당한다고 보아야 한다. ㉣ 의사 A가 자신의 진료를 보조하는 간호사 甲과 乙에게 수술직후의 환자에 대해 1시간 간격으로 4회 활력징후를 측정하라는 지시를 하였으나, 이를 미이행하여 환자에게 발생한 출혈을 조기에 발견하지 못해 과다출혈로 사망한 경우, 甲과 乙에게 업무상과실이 인정된다.","1개","2개","3개","4개",2,0,""],["2025-2","형사법",16,"협박과 강요의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","협박이라 함은, 상대방에게 공포심을 일으킬 목적으로 해악을 고지하는 일체의 행위를 의미하는 것으로서, 고지하는 해악의 내용이 경미하여 상대방이 전혀 개의치 않을 정도인 경우에는 협박에 해당하지 않는다.","강요죄는 폭행 또는 협박으로 사람의 권리행사를 방해하거나 의무 없는 일을 하게 하는 범죄이다. 여기에서 ‘폭행’은 간접적인 유형력의 행사도 포함하며, 사람에 대한 간접적인 유형력의 행사를 강요죄의 폭행으로 평가하기 위해서는 피고인이 유형력을 행사한 의도와 방법, 피고인의 행위와 피해자의 근접성, 유형력이 행사된 객체와 피해자의 관계 등을 종합적으로 고려해야 한다.","협박죄에 있어서의 해악을 고지하는 방법으로는 통상 언어에 의하는 것이나 경우에 따라서는 한마디 말도 없이 거동에 의하여서도 고지할 수 있다.","협박죄는 미수범을 처벌하는 규정을 두고 있지만 상대방이 현실 적으로 공포심을 느꼈을 때 비로소 협박죄의 기수범을 인정하는 위험범으로 해석해야 한다.",3,0,""],["2025-2","형사법",17,"유기와 학대의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","유기죄에 있어서는 행위자가 요부조자에 대한 보호책임의 발생원인이 된 사실이 존재한다는 것을 인식하고 이에 기한 부조의무를 해태한다는 의식이 있음을 요한다.","친권자인 甲이 아동 乙을 양육하면서 집안 내부에 먹다 남은 음식물 쓰레기, 소주병, 담배꽁초가 방치된 비위생적인 환경에서 乙에게 제대로 세탁하지 않아 음식물이 묻어있는 옷을 입히고, 목욕을 주기적으로 시키지 않아 몸에서 악취를 풍기게 하는 등의 행위를 한 경우, 비록 甲이 乙의 생존에 필요한 최소한의 보호와 애정표현을 했다는 사정이 있더라도 방임에 해당한다.","｢형법｣ 제275조 제1항의 유기치사‧치상죄는 결과적 가중범이므로, 위 죄가 성립하려면 유기행위와 사상의 결과 사이에 상당인과 관계가 있어야 하며 행위 시에 결과의 발생을 예견할 수 있어야 한다. 다만 유기행위가 피해자의 사상이라는 결과를 발생하게 한 유일하거나 직접적인 원인이 된 경우뿐만 아니라, 그 행위와 결과 사이에 제3자의 행위가 일부 기여하였다고 할지라도 유기행위로 초래된 위험이 그대로 또는 그 일부가 사상이라는 결과로 현실화된 경우라면 상당인과관계를 인정할 수 있다.","｢형법｣ 제273조 제1항에서 말하는 ‘학대’라 함은 육체적으로 고통을 주거나 정신적인 차별대우를 포함하는 행위로서, 단순히 상대방의 인격에 대한 반인륜적 침해행위가 있으면 그 즉시 범죄가 완성되는 즉시범이다.",3,0,""],["2025-2","형사법",18,"명예와 업무･경매의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제307조 제2항 허위사실 적시 명예훼손죄에 있어서의 범의는 그 구성요건사실 즉 적시한 사실이 허위인 점과 그 사실이 사람의 사회적 평가를 저하시킬 만한 것이라는 점을 인식하는 것을 말하고 특히 비방의 목적이 있음을 요하지 않는다.","｢형법｣ 제311조 모욕죄는 사람의 인격적 가치에 대한 사회적 평가를 의미하는 ‘외부적 명예’를 보호법익으로 하는 범죄로서, 여기서 ‘모욕’이란 사실을 적시하지 아니하고 사람의 외부적 명예를 침해할 만한 추상적 판단이나 경멸적 감정을 표현하는 것을 의미한다. 이에 어떠한 표현이 상대방의 인격을 허물어 뜨릴 정도로 모멸감을 주는 혐오스러운 욕설이 아니라 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 정도와 같은 경미한 수준의 추상적 표현이나 욕설이 사용된 경우 등이라면 특별한 사정이 없는 한 외부적 명예를 침해할 만한 표현으로 볼 수 없어 모욕죄가 성립하지 않는다.","甲이 어떠한 방법으로 변조된 게임프로그램을 실행하여 게임 서버에 접속하였는지에 관하여 전혀 특정하지 아니한 채 변조된 게임프로그램을 게시·유포하였다는 사실만으로는 위계로써 乙게임회사의 업무를 방해한 것으로 볼 수 없다.","입찰참가자들 사이의 담합행위가 입찰방해죄로 되기 위하여는 입찰참가자들 일부가 아닌 전원 사이에 담합이 이루어져야 하는 것이고, 나아가 그것이 입찰의 공정을 해하는 것으로 평가되는 이상 입찰방해죄는 성립한다.",3,0,""],["2025-2","형사법",19,"사생활의 평온에 관한 죄에 대한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 甲이 乙의 주택에 무단 침입한 범죄사실로 이미 유죄판결을 받은 후, 판결 확정 후에도 퇴거하지 않은 채 계속하여 乙의 주택에 거주한 경우, 판결확정 이후의 甲의 행위에 대해 별도의 주거침입죄가 성립한다. ㉡ 주거침입죄의 범의는 반드시 신체의 전부가 타인의 주거 안으로 들어간다는 인식이 있어야만 하는 것이 아니라 신체의 일부라도 타인의 주거 안으로 들어간다는 인식이 있으면 족하다. ㉢ ｢형법｣ 제316조 제2항 소정의 전자기록등내용탐지죄는 봉함 기타 비밀장치한 전자기록 등 특수매체기록을 기술적 수단을 이용하여 그 내용을 알아낸 자를 처벌하는 규정이나, 봉함 기타 비밀장치가 되어 있지 아니한 전자기록 등 특수매체 기록도 기술적 수단을 동원하여 그 내용을 알아낸 경우, 전자기록등내용탐지죄가 성립한다. ㉣ 업무시간 중 출입자격 등의 제한 없이 일반적으로 개방되어 있는 장소에 들어간 경우, 관리자의 명시적 출입금지 의사 및 조치가 없었던 이상 그 출입행위가 결과적으로 관리자의 추정적 의사에 반하였다는 사정만으로는 사실상의 평온상태를 해치는 행위 태양으로 출입하였다고 평가할 수 없다.","1개","2개","3개","4개",2,0,""],["2025-2","형사법",20,"사기죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","상품의 선전, 광고의 경우라도 거래에 있어서 중요한 사항에 관하여 구체적 사실을 거래상의 신의성실의 의무에 비추어 비난받을 정도의 방법으로 허위로 고지한 경우에는 사기죄의 기망행위에 해당한다.","소비대차 거래에서 대주가 차주의 신용 상태를 인식하고 있어 장래의 변제 지체 또는 변제불능에 대한 위험을 예상하고 있었거나 충분히 예상할 수 있는 경우, 차주가 차용 당시 구체적인 변제의사, 변제능력, 차용 조건 등과 관련하여 소비 대차 여부를 결정지을 수 있는 중요 사항에 관해 허위 사실을 말했다는 등의 다른 사정이 없었다면, 차주가 그 후 제대로 변제하지 못했다는 사실만을 가지고 변제능력에 관하여 대주를 기망했다거나 차주에게 편취의 범의가 있었다고 단정할 수 없다.","피기망자와 재산상의 피해자가 같은 사람이 아닌 경우에는 피기망자가 피해자를 위하여 그 재산을 처분할 수 있는 권능을 갖거나 그 지위에 있어야 하지만, 이는 반드시 사법상의 위임이나 대리권의 범위와 일치해야 하는 것은 아니고, 피해자의 의사에 따라 재산을 처분할 수 있는 서류 등이 교부된 경우에는 피기망자의 처분행위가 설사 피해자의 진정한 의도와 어긋나는 경우라도 이와 같은 권능을 갖거나 그 지위에 있는 것으로 보아야 한다.","甲이 특정 권원에 기하여 민사소송을 진행하던 중 법원에 조작된 증거를 제출하면서 종전에 주장하던 특정 권원과 별개의 허위의 권원을 추가로 주장한 경우, 법원이 종전의 특정 권원을 인정하여 甲에게 승소판결을 선고하였다면 甲의 이러한 행위는 특별한 사정이 없는 한 소송사기의 실행의 착수에 해당하지 않는다.",3,0,""],["2025-2","형사법",21,"횡령죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","횡령죄에서 재물의 보관은 재물에 대한 사실상 또는 법률상 지배력 있는 상태를 의미하므로, 소유권의 취득에 등록이 필요한 타인 소유의 차량을 인도받아 보관하고 있는 사람이 이를 사실상 처분하면 횡령죄가 성립하며, 보관 위임자나 보관자가 차량의 등록명의자일 필요는 없다.","甲이 A로부터 A 소유의 차량을 인도받아 사용하고 있는 경우, 당사자 사이에서 소유권을 등록명의자가 아닌 甲이 보유하기로 약정하였다는 등의 특별한 사정이 있는 경우에는 그 내부관계에서 甲이 소유권을 보유하게 되나, 이때에도 대외적 관계에서는 여전히 A가 소유권을 보유하고 있으므로 A가 甲에게 해당 차량의 반환을 요구하였음에도 甲이 이를 거부하였다면 횡령죄가 성립한다.","甲이 A로부터 액면금 10억 원의 수표 1매를 현금으로 교환해 주면 1천만 원의 대가를 주겠다는 제안을 받고, 위 수표가 B 등이 사기범행을 통해 취득한 범죄수익이라는 사실을 알면서도 교부 받아 그 일부를 현금으로 교환한 후, 아직 교환되지 못한 수표 및 교환된현금을임의로사용한경우甲에게는횡령죄가성립하지않는다.","병원에서 의약품 선정‧구매 업무를 담당하는 약국장이 병원을 대신하여 제약회사로부터 의약품 제공의 대가로 기부금 명목의 돈을 받아 보관하던 중 임의소비한 경우, 업무상 횡령죄가 성립한다.",1,0,""],["2025-2","형사법",22,"손괴의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","재물손괴죄는 다른 사람의 재물을 손괴 또는 은닉하거나 그 밖의 방법으로 그 효용을 해한 경우에 성립하는 범죄로, 행위자에게 불법영득의사가 있어야 한다.","어느 문서에 대한 종래의 사용상태가 문서 소유자의 의사에 반하여 또는 문서 소유자의 의사와 무관하게 이루어진 경우에 단순히 종래의 사용상태를 제거하거나 변경시키는 것에 불과하고, 손괴, 은닉하는 등으로 새로이 문서 소유자의 문서 사용에 지장을 초래하지 않는 경우에는 문서손괴죄가 성립하지 않는다.","A가 홍보를 위해 광고판(배너와 거치대)을 1층 로비에 설치해 두었는데, 甲이 乙에게 지시하여 乙이 A의 광고판을 그 장소 에서 제거하여 컨테이너로 된 창고로 옮겨 놓아 A가 사용할 수 없도록 한 경우, 해당 광고판을 물질적인 형태의 변경이나 멸실, 감손을 초래하지 않은 채 그대로 옮겼다면 광고판의 효용 자체를 해한 것은 아니어서 재물손괴죄가 성립하지 않는다.","甲이 A가 B로부터 매수한 토지의 경계 부분에 매수 전 자신이 식재하였던 수목 5그루를 전기톱을 이용하여 절단한 경우, 수목을 식재할 당시 토지 소유권자 B로부터 그에 관한 명시적 또는 묵시적 승낙‧동의‧허락 등을 받았더라도 수목의 소유권은 A에게 귀속되므로 특수재물손괴죄가 성립한다.",1,0,""],["2025-2","형사법",23,"방화의 죄에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ ｢형법｣ 제164조 전단의 현주건조물 등 방화죄는 공중의 생명, 신체, 재산 등에 대한 위험을 예방하기 위하여 공공의 안전을 제1차적인 보호법익으로 하고, 제2차적으로는 개인의 재산권을 보호법익으로 한다. ㉡ 현주건조물 등 방화죄, 현주건조물 등 방화치사상죄, 공용 건조물 등 방화죄의 미수범은 처벌한다. ㉢ ｢형법｣ 제165조의 공용건조물 등 방화죄는 불을 놓아 공용(公用) 으로 사용하거나 공익을 위해 사용하는 건조물 등을 불태워 공공의 위험이 발생한 정도에 이르러야 성립하는 범죄이다. ㉣ ｢형법｣ 제164조 내지 제176조에서 정하는 방화의 죄에서는 자기의 소유 물건이라도 그것이 압류되거나 보험의 목적물이 된 때에는 타인의 물건으로 간주한다.","㉠㉡","㉡㉢","㉡㉣","㉢㉣",1,0,""],["2025-2","형사법",24,"문서에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제233조 소정의 허위진단서작성죄의 대상은 공무원이 아닌 의사가 사문서로서 진단서를 작성한 경우에 한정되고, 공무원인 의사가 공무소의 명의로 허위진단서를 작성한 경우에는 허위공문서작성죄만 성립하고, 허위진단서작성죄는 별도로 성립하지 않는다.","교통사고 가해자가 사고발생 후 즉시 피해자 구호조치를 하지 않고, 사고현장으로부터 약 600미터 정도 도주한 후 다시 사고현장으로 돌아와 경찰관에게 자신이 사고야기자임을 밝힌바, 이를 들은 경찰관이 교통사고 후의 행동이 기재된 가해자 및 피해자의 관련자 진술서만을 첨부하고 교통사고 실황조사서의 사고원인기재란 중 사고도주 표시란에는 아무런 표시를 하지 않은 경우에는 허위공문서작성에 해당한다.","경찰관이 피의자 4명을 현행범으로 체포하면서 체포사유 등을 고지하지 않았음에도, 동 내용을 고지 후 체포했다는 내용의 허위의 현행범인체포서 4장과 체포사유 등을 고지하였다는 내용의 허위의 확인서 4장을 각 작성한 경우에 직무유기죄가 성립하는 이상, 별도로 허위공문서작성죄는 성립하지 않는다.","｢형법｣은 공문서의 경우 유형위조만을 처벌하면서 예외적으로 무형위조를 처벌하고 있는 반면, 사문서의 경우에는 유형위조뿐만 아니라 별도의 처벌규정을 두어 무형위조를 함께 처벌하고 있다.",0,0,""],["2025-2","형사법",25,"뇌물죄에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 뇌물죄에서 말하는 ‘직무’에는 법령에 정하여진 직무뿐만 아니라 그와 관련 있는 직무, 과거에 담당하였거나 장래에 담당할 직무 외에 사무분장에 따라 현실적으로 담당하지 않는 직무라도 법령상 일반적인 직무 권한에 속하는 직무 등 공무원이 그 직위에 따라 공무로 담당할 일체의 직무를 포함한다. ㉡ 뇌물죄에서 수뢰자가 증뢰자에게 돈을 받은 사실은 시인하면서도 뇌물로 받은 것이 아니라 빌린 것이라고 주장하는 경우, 수뢰자가 그 돈을 실제로 빌린 것인지는 수뢰자가 증뢰자에게서 돈을 수수한동기, 전달경위및방법, 수뢰자와증뢰자의관계등증거에 의하여 나타나는 객관적 사정을 모두 종합하여 판단하여야 한다. ㉢ 공무원이 얻은 어떤 이익이 직무와 대가관계가 있는 부당한 이익으로서 뇌물에 해당하는지 여부는 그 공무원의 직무내용‧ 직무와 이익제공자와의 관계 등 모든 사정을 참작하여 결정하면 족하고, 공무원이 그 이익을 수수하는 것으로 인하여 사회일반 으로부터 직무집행의 공정성을 의심받게 되는 등의 부수적인 사정까지 포함하는 것은 아니다. ㉣ 공무원인 甲이 乙로부터 ‘선물할 사람이 있으면 새우젓을 보내주겠다’라는 말을 듣고 이를 승낙한 뒤 새우젓을 보내고자 하는 사람들의 명단을 乙에게 보내주고 乙로 하여금 명단의 사람들에게 甲의 이름을 적어 마치 甲이 선물하는 것처럼 새우젓을 택배로 발송하게 하고 그 대금을 지급하지 않은 경우, 甲에게는 제3자뇌물제공죄가 성립한다.","㉠(O) ㉡(O) ㉢(X) ㉣(X)","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(O)",0,0,""],["2025-2","형사법",26,"공무방해의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 민사소송을 제기함에 있어 피고 乙의 주소를 허위로 기재하여 법원공무원으로 하여금 변론기일소환장 등을 허위주소로 송달케 한 경우, 甲의 행위는 법원공무원의 구체적이고 현실적인 직무집행을 방해한 것으로 볼 수 있으므로 위계에 의한 공무 집행방해죄가 인정된다.","공무집행방해죄에서 ‘직무를 집행하는’이란 공무원이 직무수행에 직접 필요한 행위를 현실적으로 행하고 있는 때만을 가리키는 것으로서, 불법주차차량에 불법주차스티커를 붙였다가 이를 다시 떼어낸 직후에 있는 주차단속공무원을 폭행한 경우, 공무집행방해죄가 인정되지 않는다.","甲이 ｢국민기초생활 보장법｣상 ‘자활근로자’로 선정되어 주민 자치센터 사회복지담당 공무원의 복지도우미로 근무하던 乙을 협박하여 그 직무집행을 방해한 경우, 甲에게 공무집행방해죄가 인정된다.","변호사 甲이 접견을 핑계로 수용자 乙을 위하여 휴대전화와 증권거래용 단말기를 구치소 내로 몰래 반입하고, 수용자 乙에게 이를 이용하게 한 경우, 변호사 甲에게 위계에 의한 공무집행방해죄가 인정된다.",3,0,""],["2025-2","형사법",27,"무고죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","객관적으로 고소사실에 대한 공소시효가 완성되었더라도 고소를 제기하면서 마치 공소시효가 완성되지 아니한 것처럼 고소한 경우에는 국가기관의 직무를 그르칠 염려가 있으므로 무고죄를 구성한다.","허위로 신고한 사실이 무고행위 당시 형사처분의 대상이 될 수 있었던 경우에는 무고죄가 기수에 이르고, 이후 그러한 사실이 형사범죄가 되지 않는 것으로 판례가 변경되었더라도 특별한 사정이 없는 한 이미 성립한 무고죄에는 영향을 미치지 않는다.","무고죄에 있어서 허위사실의 신고라 함은 신고사실이 객관적 사실에 반한다는 것을 확정적이나 미필적으로 인식하고 신고 하는 것을 말하는 것으로서, 설령 고소사실이 객관적 사실에 반하는 허위의 것이라 할지라도 그 허위성에 대한 인식이 없을 때에는 무고에 대한 고의가 없다.","｢형법｣ 제157조, 제153조는 무고죄를 범한 자가 그 신고한 사건의 재판 또는 징계처분이 확정되기 전에 자백 또는 자수한 때에는 그 형을 감경 또는 면제하도록 정하고 있는바, ｢형법｣ 제153조에서 정한 ‘재판이 확정되기 전’이라 함은 피고소인에 대한 공소 제기 또는 재판절차가 개시되는 것을 전제로 하며, 피고소인에 대해서 불기소결정이 내려진 경우는 포함되지 않는다.",3,0,""],["2025-2","형사법",28,"수사의 단서 및 조건에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 자전거도로에서 자전거를 운행하던 중 전방주시의무를 게을리하여 보행자인 피해자 A를 들이받아 중상해를 입게 하였다는 교통사고처리 특례법 위반(치상)의 공소사실로 기소 되었고, 위 사고로 의식불명이 된 A에 대하여 성년후견이 개시되어 성년후견인으로 A의 법률상 배우자 B가 선임되었다면 A의 성년후견인인 B가 A를 대신하여 처벌불원의사를 형성하거나 결정할 수 있다.","피해자가 경찰청 인터넷 홈페이지에 ‘피고인을 철저히 조사해 달라’는 취지의 민원을 접수하는 형태로 피고인에 대한 조사를 촉구하는 의사표시를 한 것은 ｢형사소송법｣에 따른 적법한 고소로 보기 어렵다.","경찰관은 불심검문 대상자에게 질문을 하기 위하여 범행의 경중, 범행과의 관련성, 상황의 긴박성, 혐의의 정도, 질문의 필요성 등에 비추어 목적 달성에 필요한 최소한의 범위 내에서 사회 통념상 용인될 수 있는 상당한 방법으로 대상자를 정지시킬 수 있고 질문에 수반하여 흉기의 소지 여부도 조사할 수 있다.","친고죄나 세무공무원 등의 고발이 있어야 논할 수 있는 죄에 있어서 고소 또는 고발은 이른바 소추조건에 불과하고 당해 범죄의 성립 요건이나 수사의 조건은 아니므로, 위와 같은 범죄에 관하여 고소나 고발이 있기 전에 수사를 하였다고 하더라도, 그 수사가 장차 고소나 고발이 있을 가능성이 없는 상태하에서 행해졌다는 등의 특단의 사정이 없는 한, 고소나 고발이 있기 전에 수사를 하였다는 이유만으로 그 수사가 위법하다고 볼 수는 없다.",0,0,""],["2025-2","형사법",29,"임의동행에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사법경찰관 P가 만취 상태로 시동이 걸린 차량 운전석에 앉아 있는 甲을 발견하여 음주측정을 위해 하차를 요구하였고, 甲이 차량을 운전하지 않았다고 다투자 P가 지구대로 가서 차량 블랙박스를 확인하자며 음주운전 여부 확인을 위한 임의동행을 요구하였으나, 甲이 차량에서 내리자마자 도주하여 이에 P가 甲을 추격하여 도주를 제지한 것은 ｢도로교통법｣상의 정당한 직무집행에 해당한다.","사법경찰관 P는 甲의 마약류 투약 혐의가 상당하다고 판단하여 甲에게 경찰서로 임의동행을 요구하였고, 동행장소인 경찰서에서 甲에게 마약류 투약 혐의를 밝힐 수 있는 소변과 모발의 임의 제출을 요구한 경우, 甲에 대한 임의동행은 ｢형사소송법｣ 제199조 제1항에 따른 임의동행에 해당하지 아니한다.","수사관의 피의자에 대한 임의동행은 수사관이 동행에 앞서 피의자에게 동행을 거부할 수 있음을 알려주었거나 동행하는 경우에도 언제든지 자유롭게 동행 과정에서 이탈 또는 동행 장소에서 퇴거할 수 있었음이 인정되는 등 오로지 피의자의 자발적인 의사에 의하여 이루어졌음이 객관적인 사정에 의하여 명백하게 입증된 경우에 한하여, 그 적법성이 인정된다.","｢경찰관직무집행법｣ 제3조 제2항에 따라 임의동행한 경우 같은 조 제6항에 당해인을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정하고 있다고 하여 그 규정이 임의동행한 자를 6시간 동안 경찰관서에 구금하는 것을 허용하는 것은 아니다.",1,0,""],["2025-2","형사법",30,"피의자신문 및 진술거부권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","조사대상자의 진술 내용이 단순히 제3자의 범죄에 관한 경우가 아니라 자신과 제3자에게 공동으로 관련된 범죄에 관한 것이거나 제3자의 피의사실뿐만 아니라 자신의 피의사실에 관한 것이기도 하여 실질이 피의자신문조서의 성격을 가지는 경우에 수사기관은 진술을 듣기 전에 미리 진술거부권을 고지하여야 한다.","수사기관에 의한 진술거부권 고지의 대상이 되는 피의자의 지위는 수사기관이 조사대상자에 대하여 범죄의 혐의가 있다고 보아 실질적으로 수사를 개시하는 행위를 한 때에 인정되는 것으로 봄이 타당하며, 따라서 이러한 피의자의 지위에 있지 아니한 자에 대하여는 진술거부권이 고지되지 아니하였다 하더라도 그 진술의 증거능력은 인정된다.","｢검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정｣ 제13조 제1항에 의하면 검사 또는 사법경찰관은 피의자신문에 참여한 변호인이 피의자의 옆자리 등 실질적인 조력을 할 수 있는 위치에 앉도록 해야 하고, 정당한 사유가 없으면 피의자에 대한 법적인 조언‧상담을 보장해야 하나 이 때 변호인의 메모는 허용되지 아니한다.","검사 또는 사법경찰관은 피의자를 신문하는 경우 피의자가 신체적 또는 정신적 장애로 사물을 변별하거나 의사를 결정･ 전달할 능력이 미약한 때에는 피의자‧법정대리인의 신청이 없는 경우에도 직권으로 피의자와 신뢰관계에 있는 자를 동석하게 할 수 있다.",2,1,"수사준칙 제13조(변호인 참여)를 인용한 문항입니다. 2026.10.2. 수사준칙 개정 반영 여부를 확인해야 합니다."],["2025-2","형사법",31,"현행범인의 체포에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","현행범인 체포의 요건을 갖추었는지는 체포 이후 범인으로 인정되었는지 여부로 판단하여야 하고, 이에 관한 검사나 사법경찰관 등 수사주체의 판단에는 재량의 여지가 없다.","누구든지 현행범인 체포를 위해 필요한 때에는 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 수색을 할 수 있지만 긴급한 사정이 있는 때에 한정한다.","검사 또는 사법경찰관리 아닌 자가 현행범인을 체포한 때에는 즉시 검사 또는 사법경찰관리에게 인도하여야 하며, 여기서 ‘즉시’라고 함은 반드시 체포시점과 시간적으로 밀착된 시점이어야 하는 것을 의미한다.","현행범인은 누구든지 영장 없이 체포할 수 있고, 검사 또는 사법경찰관은 피의자 등이 유류한 물건이나 소유자·소지자 또는 보관자가 임의로 제출한 물건을 영장 없이 압수할 수 있으므로, 현행범 체포현장에서도 소지자 등이 임의로 제출하는 물건은 ｢형사소송법｣ 제218조에 따라 영장 없이 압수하는 것이 허용 되고, 이 경우 검사나 사법경찰관은 별도로 사후에 영장을 받을 필요가 없다.",3,0,""],["2025-2","형사법",32,"구속 전 피의자심문제도에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣ 제200조의2(영장에 의한 체포)‧제200조의3(긴급체포) 또는 제212조(현행범인의 체포)에 따라 체포된 피의자에 대하여 구속영장을 청구받은 판사는 특별한 사정이 없는 한 구속영장이 청구된 때로부터 48시간 이내에 피의자를 심문하여야 한다.","체포된 피의자에 대한 구속 전 피의자심문절차에서 별다른 사유 없이 심문절차가 지연됨으로써 구속영장이 발부되지 않은 상태로 피의자의 신체의 자유가 장기간 제한되어 실질적으로 불법구금에 해당한다고 볼 정도에 이른 것이 아닌 경우, 단지 심문기일을 속행하였다는 사정만으로 구속영장의 적법성과 효력에 어떠한 영향을 미친다고 볼 수 없다.","판사는 피의자가 심문기일에의 출석을 거부하거나 질병 그 밖의 사유로 출석이 현저하게 곤란하고, 피의자를 심문 법정에 인치할 수 없다고 인정되는 때에는 가능한 한 빠른 일시로 심문기일을 변경하여야 한다.","검사는 증거인멸 또는 피의자나 공범관계에 있는 자가 도망할 염려가 있는 때에는 지방법원 판사에게 제출된 구속영장청구서 및 그에 첨부된 고소‧고발장, 피의자의 진술을 기재한 서류와 피의자가 제출한 서류의 열람 제한에 관한 의견을 제출할 수 있고, 지방법원 판사는 검사의 의견이 상당하다고 인정하는 때에는 그 전부 또는 일부의 열람을 제한할 수 있다.",1,0,""],["2025-2","형사법",33,"접견교통권에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","변호인과의 접견교통권은 법령에 의한 제한이 없는 한 수사기관의 처분으로는제한할수없고법원의결정으로만이를제한할수있다.","수사기관이 甲을 구속영장에 구금할 수 있는 장소로 기재되어 있는 장소가 아닌 다른 장소에 계속해서 구금하고 있었다면, 甲에 대한 이러한 사실상의 구금장소의 임의적 변경은 접견교통권의 행사에 중대한 장애를 초래하는 것은 아니므로 위법하다고 할 수는 없다.","변호인의 조력을 받을 권리를 실질적으로 보장하기 위하여는 변호인과의 접견교통권의 인정이 당연한 전제가 되므로, 임의동행의 형식으로 수사기관에 연행된 피의자에게는 변호인 또는 변호인이 되려는 자와의 접견교통권은 당연히 인정되지만, 임의동행의 형식으로 연행된 피내사자의 경우에는 인정되지 아니한다.","변호인 또는 변호인이 되려는 자의 접견교통권은 신체구속제도 본래의 목적을 침해하지 아니하는 범위 내에서 행사되어야 하는 것이 원칙이다.",3,0,""],["2025-2","형사법",34,"다음 사례에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함) 사법경찰관 P는 마약을 판매한 혐의로 甲을 긴급체포한 후, 甲의 휴대전화를 체포현장에서 외부로 반출하는 방식으로 압수·수색하였다. 긴급체포 이후 甲에 대한 피의자신문을 할 때 진술거부권을 고지 하지 않았으나, 甲이 자발적으로 범행의 전모를 자백하는 내용의 진술을 하자 그 내용으로 피의자신문조서를 작성한 후 이를 토대로 압수‧수색영장을 발부 받아 마약을 압수하였다. P는 반출한 甲의 휴대전화를 탐색하는 과정에서 성범죄 동영상을 발견하고, 마약을 광고한 SNS 메시지와 함께 압수하였다. 이후 甲은 마약류관리법 위반죄와 성폭력처벌법 위반죄로 기소되었고, SNS 메시지와 성범죄 동영상이 증거로 제출되었다.","P는 甲을 긴급체포한 때로부터 48시간 이내에 휴대전화에 대하여 압수‧수색 영장을 청구하여야 하며, 압수‧수색영장을 발부받지 못하였다면 SNS 메시지는 증거능력이 인정될 수 없다.","甲에 대한 피의자신문조서는 甲의 진술에 임의성이 인정되는 경우라도 증거능력이 인정되지 않는다.","P가 甲으로부터 압수한 후 법원에 증거로 제출된 마약은 특별한 사정이 없는 한 위법수집증거에 해당한다.","甲의 마약류관리법 위반 사건과 성범죄 동영상이 구체적‧개별적 연관 관계가 없다 하더라도 휴대전화에서 신속히 압수‧수색하여 촬영물의 유통가능성을 적시에 차단해 피해자를 보호할 필요성이 크다는 점에서 해당 동영상은 위법수집증거에 해당하지 않는다.",3,0,""],["2025-2","형사법",35,"증명에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","개별적으로 소수의 사람에게 모욕적인 발언을 하였더라도 그 상대방이 불특정 또는 다수인에게 해당 내용을 전파할 가능성이 객관적으로 인정되는 경우에는 공연성을 인정할 수 있지만, 특정한 소수에게만 발언하였다는 점은 공연성이 부정되는 유력한 사정이 될 수 있으므로, 그와 같은 사정하에서의 전파가능성에 관해서는 검사의 엄격한 증명이 필수적이다.","목적과 용도를 정하여 위탁한 금전은 정해진 목적, 용도에 사용할 때까지는 이에 대한 소유권이 위탁자에게 유보되어 있는 것으로서 수탁자가 임의로 소비하면 횡령죄를 구성할 수 있으나, 피해자가 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도가 무엇인지는 엄격한 증명의 대상이 된다.","｢물가안정에 관한 법률｣ 제7조는 “사업자로 하여금 ‘폭리를 목적’으로 물품을 매점하거나 판매를 기피하는 행위로서 기획 재정부장관이 물가의 안정을 해칠 우려가 있다고 인정하여 매점매석행위로 지정한 행위를 하여서는 아니 된다.”고 규정하고 있고, 여기에서 말하는 ‘폭리의 목적’은 고의와는 별도로 요구 되는 초과주관적 위법요소로서 엄격한 증명의 대상이 아니다.","반의사불벌죄에서 피고인 또는 피의자의 처벌을 희망하지 않는다는 의사표시 또는 처벌희망 의사표시 철회의 유무나 그 효력 여부에 관한 사실은 엄격한 증명의 대상이 아니라 증거 능력이 없는 증거나 법률이 규정한 증거조사방법을 거치지 아니한 증거에 의한 증명, 이른바 자유로운 증명의 대상이다.",2,0,""],["2025-2","형사법",36,"다음 사례에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) 사법경찰관 P는 甲의 사기 혐의를 수사하는 과정에서 K메신저 계정에 대한 압수·수색 영장을 발부받아 K메신저 회사 데이터 센터에서 영장을 집행하였다. 압수·수색영장의 압수할 물건에는 ‘甲이 2025. 5. 12.부터 2025. 5. 21.까지 K메신저 사용자들과 주고받은 대화 내용 및 사진 정보 일체’라고 기재되어 있었다. K메신저 회사의 데이터센터 담당자 A는 압수·수색영장 집행에 응하여 영장에 기재된 기간의 모든 메신저 대화 내용 및 사진 등을 P에게 제출하였다. 이후 P는 취득한 전자정보를 수사기관 사무실로 가져와 사기 관련 전자정보를 선별하여 압수하였고, 해당 전자정보는 법원에 증거로 제출되었다. ㉠ P는 A에게 압수·수색영장 사본을 교부해야 한다. ㉡ 피압수자는 A이므로 P가 사기 관련 전자정보를 선별하는 과정에서 甲에게 참여권을 보장하지 않았다 하더라도 위법 하지 않다. ㉢ P는 압수목록에 구체적인 개별 파일을 특정할 필요 없이 포괄적으로 압축된 압축파일명만을 기재한 후 甲에게 지체 없이 교부해야 한다. ㉣ 법원에 제출된 전자정보를 증거로 사용하기 위해서는 甲의 K메신저 계정에 저장된 전자정보와 법원에 증거로 제출된 전자정보의 동일성과 무결성이 인정되어야 한다.","1개","2개","3개","4개",0,0,""],["2025-2","형사법",37,"위법수집증거배제법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 헌법과 ｢형사소송법｣이 정한 절차에 따르지 아니한 1차적 증거 수집과 이를 기초로 한 2차적 증거 수집 사이 인과관계의 희석이나 단절 여부를 중심으로 2차적 증거 수집과 관련된 모든 사정을 전체적‧종합적으로 고려하여 예외적인 경우에는 2차적 증거도 유죄 인정의 증거로 사용할 수 있다.","위법한 강제연행 상태에서 호흡측정의 방법에 의한 음주측정을 한 다음, 그 강제연행 상태로부터 완전히 벗어났다고 볼 수 없는 상황에서 피의자가 호흡측정 결과에 대한 탄핵을 하기 위하여 스스로 혈액채취 방법에 의한 측정을 할 것을 요구하여 혈액 채취가 이루어진 경우, 그러한 혈액채취에 의한 측정 결과는 피의자에 대한 불법체포와 증거수집 사이의 인과관계가 단절된 것으로 보아 유죄의 인정증거로 사용할 수 있다.","피고인이 자신의 휴대전화 카메라를 이용하여 총 9회에 걸쳐 성적 욕망 또는 수치심을 유발할 수 있는 피해자 4명의 신체를 그들의 의사에 반하여 촬영하여 수사기관에 현행범으로 체포 되면서 체포 당시 임의제출 형식으로 휴대전화가 압수된 경우, 휴대전화 제출에 관해 검사가 임의성의 의문점을 없애는 증명을 다하지 못하면 휴대전화 및 그에 저장된 전자정보는 위법수집증거에 해당하여 증거능력이 없다.","검찰관이 피고인을 뇌물수수 혐의로 기소한 후, 형사사법공조 절차를 거치지 아니한 채 과테말라공화국에 현지출장하여 그곳 호텔에서 뇌물공여자를 상대로 참고인 진술조서를 작성한 경우, 검찰관의 뇌물공여자에 대한 참고인조사가 증거수집을 위한 수사행위에 해당하고 조사의 방식이나 절차에 강제력이나 위력은 물론 어떠한 비자발적 요소도 개입될 여지가 없었음이 기록상 분명한 이상 해당 참고인 진술조서는 위법수집증거에 해당하지 않는다.",1,0,""],["2025-2","형사법",38,"전문법칙의 예외에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","살인사건 목격자 A에 대한 참고인 진술조서가 증거로 제출된 경우 증인으로 출석한 A가 진술조서에 대해 적법한 절차에 따라 작성된 사실을 인정하면서도 실질적 진정성립을 부인한다면 A에 대한 반대신문의 기회보장과 특신상태가 증명이 된 때에 한하여 증거로 할 수 있다.","피고인 甲의 자백이 기재된 공판조서가 甲의 피고사건과는 별개인 乙의 피고사건에서 피고인 乙의 범행을 입증할 증거로 사용될 경우 전문증거라 하더라도 ｢형사소송법｣ 제315조 제3호에 정한 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’로서 당연히 증거능력이 인정된다.","사법경찰관이 작성한 피고인 甲의 범행현장의 검증조서에 살인 범행에 부합하는 甲의 자백진술과 범행을 재연하는 사진이 첨부되어 있는 경우 甲이 공판정에서 검증조서에 기재된 자백과 범행을 재연하는 부분에 대하여 내용을 부인하는 경우에는 증거로 할 수 없다.","진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 자기에게 맡겨진 사무를 처리한 내역을 그때그때 계속적, 기계적으로 기재한 문서는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 전문증거라 하더라도 당연히 증거능력이 인정된다.",0,0,""],["2025-2","형사법",39,"다음 사례에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 甲은 강도를 계획하고, 친구 A에게 전화해 “사냥용 엽총을 빌려줄 수 있느냐”고 물어 보았다. A는 甲의 부탁을 거절하면서 甲 몰래 통화 내용을 녹음하였다. 이후 甲은 강도를 실행에 옮겼고 甲의 범행 장면은 은행에 적법하게 설치된 CCTV에 녹화되었다. 사법경찰관 P는 A의 통화 녹음 파일과 범행 장면이 녹화된 CCTV 영상 부분을 적법하게 압수하였고, 이후 해당 전자정보는 甲의 강도죄 재판에 증거로 제출되었다.","A가 甲 몰래 녹음한 통화 녹음 파일은 甲의 동의 없이 녹음 하였으므로 증거로 사용될 수 없다.","녹음 파일에 저장된 “사냥용 엽총을 빌려줄 수 있느냐”라는 甲의 진술은 강도죄 피고사건의 정황증거로서 그와 같은 진술이 존재하는 것 자체가 증명의 대상이 되는 경우에는 전문증거가 아니다.","甲의 강도 범행 장면이 녹화된 CCTV 영상은 행동적 진술을 담고 있으므로 전문증거에 해당하나, ｢형사소송법｣ 제315조에 의해당연히증거능력이있는서류에해당하여증거능력이인정된다.","CCTV 영상에 대해 甲이 그 성립의 진정 및 내용을 부인하는 경우에는 CCTV 관리자의 진술에 의하여 성립의 진정함이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에 한하여 증거로 할 수 있다.",1,0,""],["2025-2","형사법",40,"다음 사례에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 甲은 S주식회사 전산실에 몰래 침입하여 컴퓨터 하드디스크에 저장된 신제품 설계도면을 자신의 USB에 몰래 복사해서 가지고 나왔다. 이후 甲은 신제품 설계도면을 乙에게 비트코인(Bitcoin)을 받고 팔았다. 며칠 후 甲은 친구 A를 만나 “내가 설계도면을 훔쳐 乙에게 팔아서 비트코인을 많이 보유하고 있다.”라고 말하 였다. 사법경찰관 P는 위 사건을 수사하는 과정에서 甲의 휴대 전화를 압수‧수색하고, A를 참고인으로 조사하여 A가 甲으로부터 들은 위 진술 내용이 기재된 진술조서를 적법하게 작성하였다.","甲이 S주식회사에 침입하여 설계도면을 USB에 복사하여 가지고 나온 행위는 절도죄에 해당한다.","甲이 설계도면을 乙에게 팔아서 취득한 비트코인은 ｢형법｣ 제48조 제1항에서 정한 몰수의 대상에 해당한다.","압수‧수색 영장의 압수할 물건에 정보처리장치 또는 정보저장매체에 저장되어 있는 전자정보만 기재되어 있는 경우에는 특별한 사정이 없으면 휴대전화에 저장된 전자정보는 압수할 수 없다.","甲이 공판정에서 A에 대한 진술조서에 대해 부동의 하더라도 ｢형사소송법｣ 제312조 제4항의 규정에 따른 참고인 진술조서의 증거능력 요건을 갖춘 때에는 증거로 할 수 있다.",2,0,""],["2025-2","경찰학",1,"경찰의 분류에 관한 설명으로 가장 적절하지 않은 것은?","예방경찰과 진압경찰은 경찰권 발동 시점에 따라 구분한 것이다.","행정경찰과사법경찰은경찰활동의목적및임무에따라구분한것이다.","보안경찰과 협의의 행정경찰은 행정경찰을 업무의 독자성에 따라 구분한 것이다.","질서경찰과 봉사경찰은 실질적 의미의 경찰을 경찰활동의 질과 내용에 따라 구분한 것이다.",3,0,""],["2025-2","경찰학",2,"형식적 의미의 경찰과 실질적 의미의 경찰에 관한 설명으로 가장 적절한 것은?","실질적 의미의 경찰은 조직중심적인 개념이고, 형식적 의미의 경찰은 작용중심적인 개념이다.","｢국회법｣에 따라 국회 회의장 건물 안에서 의장의 지휘를 받아 경호업무를 수행하는 경위(警衛)는 실질적 의미의 경찰에 해당한다.","｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣에 따른 정보경찰의 활동은 형식적 의미의 경찰에 해당한다.","｢형사소송법｣에 따라 범죄를 수사하는 사법경찰의 활동은 실질적 의미의 경찰에 해당한다.",2,0,""],["2025-2","경찰학",3,"영미법계와 대륙법계 경찰개념에 관한 설명으로 가장 적절 하지 않은 것은?","우리나라의 경찰개념은 대륙법계와 영미법계의 경찰개념을 모두 반영하고 있다.","1953년 12월에 제정된 ｢경찰관 직무집행법｣ 제1조는 ‘국민의 생명‧ 신체 및 재산의 보호’를 경찰의 직무로 규정하여 치안유지를 중심으로 하는 대륙법계의 행정경찰적 개념이 강조되었다.","우리나라는 영미법계 경찰개념의 영향으로 범죄수사를 경찰의 사물관할로 인정하고 있다.","대륙법계에서는 영미법계와 비교하여 경찰통제를 위한 방법으로 행정소송이나 국가배상 등의 사법적 통제가 주로 발달하였다.",1,0,""],["2025-2","경찰학",4,"경찰의 임무를 ‘공공의 안녕과 공공의 질서에 대한 위험의 방지’라고정의할때, 이에 관한 설명으로가장적절하지않은것은?","공공의 안녕은 국민의 생명‧신체 및 재산보호를 포함하는 상위 개념이다.","공공의 안녕의 요소 중 법질서의 불가침성은 사법(私法)규범을 제외한 공법(公法)규범을 대상으로 한다.","공공의질서란시대에따라변화하는상대적이고유동적인개념이다.","공공의 질서란 당시의 지배적인 윤리와 가치관을 기준으로 판단할 때 그것을 준수하는 것이 시민으로서 원만한 공동체 생활을 위한 필수적인 전제조건이 되고, 공공사회에서 개인의 행동에 대한 불문규범의 총체가 되는 것을 의미한다.",1,0,""],["2025-2","경찰학",5,"경찰 기본이념에 관한 설명으로 가장 적절하지 않은 것은?","인권존중주의는 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣ 에는 관련된 규정이 없으나, 헌법 제10조와 제37조 제1항 등을 통하여 당연히 유추된다.","｢경찰공무원법｣은 경찰공무원이 정당이나 정치단체의 결성 또는 가입을지원하거나방해하는행위를정치활동에관여하는행위로본다.","｢행정기본법｣ 제1조(목적)를 통하여 경영주의를 도출할 수 있다.","｢부패방지 및 국민권익위원회의 설치와 운영에 관한 법률｣상 ‘국민감사청구제도’는 경찰의 대외적 민주화 방안이다.",0,0,""],["2025-2","경찰학",6,"국가경찰제도와 비교하여 자치경찰제도가 가지는 특징에 관한 설명이다. 옳은 것으로 묶인 것은? ㉠ 조직의 관료화로 인해 국민에 대한 봉사의식이 저하될 수 있다. ㉡ 지역주민의 경찰활동 참여를 활성화 할 수 있다. ㉢ 능률성보다 민주성이 확보된다. ㉣ 전국적으로 균등한 치안서비스를 제공할 수 있다.","㉠㉡","㉠㉣","㉡㉢","㉢㉣ (일반공채･101경비단･경찰행정 경채)",2,0,""],["2025-2","경찰학",7,"다음은 경찰의 전문직업화에 관한 설명이다. 이에 해당하는 전문직업화의 문제점으로 가장 적절한 것은? 일반적으로 전문직은 장기간의 교육을 통해 역량이 함양되며 그로 인한 비용도 발생된다. 이러한 이유로 교육적‧경제적으로 불리한 위치에 있는 집단은 경찰직군으로 진입하는 기회가 박탈되는 문제가 있다.","권위주의","차별","부권주의","사적인 이익을 위한 이용",1,0,""],["2025-2","경찰학",8,"｢경찰청 공무원 행동강령｣에 관한 설명으로 가장 적절하지 않은 것은?","공무원은 상급자가 자기 또는 타인의 부당한 이익을 위하여 공정한 직무수행을 현저하게 해치는 지시를 하였을 때에는 소속 기관의 장과 상담하여야 한다.","공무원은 자신의 직무권한을 행사하거나 지위‧직책 등에서 유래 되는 사실상 영향력을 행사하여 직무관련자 또는 직무관련공무원 으로부터 사적 노무를 제공받거나 요구 또는 약속해서는 아니 된다. 다만, 다른 법령 또는 사회상규에 따라 허용되는 경우에는 그러 하지 아니하다.","공무원은 다른 공무원에게 또는 그 공무원의 배우자나 직계 존속‧비속에게 수수 금지 금품등을 제공하거나 그 제공의 약속 또는 의사표시를 해서는 아니 된다.","공무원이 대가를 받고 수행하는 외부강의등은 월 3회를 초과할 수 없다. 국가나 지방자치단체에서 요청하거나 겸직 허가를 받고 수행하는 외부강의등은 그 횟수에 포함하지 아니한다. 그럼에도 불구하고 월 3회를 초과하여 대가를 받고 외부강의등을 하려는 경우에는 미리 소속 기관의 장의 승인을 받아야 한다.",0,0,""],["2025-2","경찰학",9,"｢부정청탁 및 금품등 수수의 금지에 관한 법률｣에 대한 설명 으로 가장 적절하지 않은 것은?","소속기관장은 부정청탁이 있었던 사실을 알게 된 경우 부정청탁을 받은 공직자등에 대하여 직무 참여 일시중지, 직무 대리자의 지정, 전보의 조치 등을 하여야 한다.","공직자등은 자신의 직무와 관련된 외부강의등의 대가로서 대통령령으로 정하는 금액을 초과하는 사례금을 받은 경우에는 대통령령으로 정하는 바에 따라 소속기관장에게 신고하고, 제공자에게 그 초과금액을 지체 없이 반환하여야 한다.","증여를 제외한 사적 거래로 인한 채무의 이행 등 정당한 권원에 의하여 제공되는 금품등은 이 법 제8조에서 규정하는 수수가 금지된 금품 등에 해당하지 않는다.","공직자등의 직무와 관련된 공식적인 행사에서 주최자가 참석자에게 통상적인 범위에서 일률적으로 제공하는 교통, 숙박, 음식물 등의 금품등은 이 법 제8조에서 규정하는 수수가 금지된 금품 등에 해당하지 않는다.",0,0,""],["2025-2","경찰학",10,"｢경찰청 적극행정 면책제도 운영규정｣에 관한 설명으로 가장 적절하지 않은 것은?","이 규정에 의한 면책은 경찰청 및 그 소속기관의 공무원 또는 산하단체의 임‧직원 등에게 적용된다.","적극행정 면책심사의 신청은 감사 대상자만 가능하며, 면책사유에 해당하는 증빙자료를 구비하여 감사 책임자에게 면책심사를 신청할 수 있다.","적극행정 면책신청에 대한 심사를 위하여 경찰청에 적극행정 면책심사위원회를 둔다.","적극행정 면책심사위원회는 위원장 1명을 포함하여 5명 이상 7명 이내로 성별을 고려하여 구성하며 위원장은 감사관으로 한다.",1,0,""],["2025-2","경찰학",11,"범죄예방에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? <보기> ㉠ 브랜팅햄(B
