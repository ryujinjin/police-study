의도하는 공익보다 크지 아니할 것","cite":"행정기본법 제10조","badge":"","topic":"","from":"GY-2023-2-P-15","seq":null},{"id":"P-OX-065","subject":"경찰학","unit":"경찰행정법","stmt":"범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회 단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우 (22.1차)","answer":true,"quote":"다음 각 호의 어느 하나에 해당하는 경우에는 범죄인을 인도하여서는 아니 된다. 1. 대한민국 또는 청구국의 법률에 따라 인도범죄에 관한 공소시효 또는 형의 시효가 완성된 경우 2. 인도범죄에 관하여 대한민국 법원에서 재판이 계속(係屬) 중이거나 재판이 확정된 경우 3. 범죄인이 인도범죄를 범하였다고 의심할 만한 상당한 이유가 없는 경우. 다만, 인도범죄에 관하여 청구국에서 유죄의 재판이 있는 경우는 제외한다. 4. 범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우 [전문개정 2010.3.31]","cite":"범죄인 인도법 제7조","badge":"","topic":"","from":"GY-2022-1-P-26","seq":null},{"id":"P-OX-225","subject":"경찰학","unit":"경찰행정법","stmt":"국가수사본부장이 직무를 집행하면서 헌법이나 법률을 위배하였을 때에는 국회는 대통령에게 해임을 건의할 수 있다. (23.2차)","answer":false,"quote":"⑤ 국가수사본부장이 직무를 집행하면서 헌법이나 법률을 위배하였을 때에는 국회는 탄핵 소추를 의결할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제16조 제5항","badge":"","topic":"","from":"GY-2023-2-P-18","seq":null},{"id":"P-OX-098","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 법 제16조 제2항에 따라 당사자가 제출한 의견에 상당한 이유가 있는 경우에는 과태료를 부과하지 아니하거나 통지한 내용을 변경할 수 있다. (23.1차)","answer":true,"quote":"③ 행정청은 제2항에 따라 당사자가 제출한 의견에 상당한 이유가 있는 경우에는 과태료를 부과하지 아니하거나 통지한 내용을 변경할 수 있다.","cite":"질서위반행위규제법 제16조 제3항","badge":"","topic":"","from":"GY-2023-1-P-23","seq":null},{"id":"P-OX-142","subject":"경찰학","unit":"경찰행정법","stmt":"행정청이 종교단체에 대하여 기본재산전환인가를 함에 있어 인가조건을 부가하고 그 불이행시 인가를 취소할 수 있도록 한 경우, 그 인가조건의 의미를 철회권의 유보로 본다. (24.2차)","answer":true,"quote":"행정청이 종교단체에 대하여 기본재산전환인가를 함에 있어 인가조건을 부가하고 그 불이행시 인가를 취소할 수 있도록 한 경우, 인가조건의 의미는 철회권을 유보한 것이라고 본 사례.","cite":"대법원 2003다6422","badge":"","topic":"","from":"GY-2024-2-P-19","seq":null},{"id":"P-OX-197","subject":"경찰학","unit":"경찰행정법","stmt":"국가경찰위원회 위원장은 경찰관이 경찰관 직무집행법 제2조 (직무의 범위) 각 호에 따른 직무의 수행으로 인하여 민 형사상 책임과 관련된 소송을 수행할 경우 변호인 선임 등 소송 수행에 필요한 지원을 하여야 한다. (22.1차)","answer":false,"quote":"경찰청장과 해양경찰청장은 경찰관이 제2조 각 호에 따른 직무의 수행으로 인하여 민ㆍ형사상 책임과 관련된 소송을 수행할 경우 변호인 선임 등 소송 수행에 필요한 지원을 할 수 있다.","cite":"경찰관 직무집행법 제11조의4","badge":"","topic":"","from":"GY-2022-1-P-37","seq":null},{"id":"P-OX-149","subject":"경찰학","unit":"경찰행정법","stmt":"경찰이 보유･관리하는 정보는 국민의 알권리 보장 등을 위하여 ｢공공기관의 정보공개에 관한 법률｣에서 정하는 바에 따라 적극적으로 공개하는 것이 기본 원칙이다. (24.2차)","answer":true,"quote":"공공기관이 보유·관리하는 정보는 국민의 알권리 보장 등을 위하여 이 법에서 정하는 바에 따라 적극적으로 공개하여야 한다. [전문개정 2013.8.6.]","cite":"공공기관의 정보공개에 관한 법률 제3조","badge":"","topic":"","from":"GY-2024-2-P-25","seq":null},{"id":"P-OX-227","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰관 직무집행법｣ 제2조 직무의 범위에 “테러경보 발령･대테러 작전 수행”을 명시하고 있다. (23.2차)","answer":false,"quote":"직무 범위에 든 것은 「경비, 주요 인사 경호 및 대간첩·대테러 작전 수행」이고, 테러경보 발령은 대테러센터장의 일이다.","cite":"경찰관 직무집행법 제2조","badge":"","topic":"","from":"GY-2023-2-P-23","seq":null},{"id":"P-OX-176","subject":"경찰학","unit":"경찰행정법","stmt":"부령의 위임을 받아 중앙행정기관(｢정부조직법｣ 및 그 밖의 법률에 따라 설치된 중앙행정기관을 말한다)의 장이 정한 예규는 ｢행정기본법｣상의 ‘법령등’에 해당된다. (26.1차)","answer":true,"quote":"1. \"법령등\"이란 다음 각 목의 것을 말한다. 가. 법령: 다음의 어느 하나에 해당하는 것 1) 법률 및 대통령령·총리령·부령 2) 국회규칙·대법원규칙·헌법재판소규칙·중앙선거관리위원회규칙 및 감사원규칙 3) 1) 또는 2)의 위임을 받아 중앙행정기관(「정부조직법」 및 그 밖의 법률에 따라 설치된 중앙행정기관을 말한다. 이하 같다)의 장이 정한 훈령·예규 및 고시 등 행정규칙 나. 자치법규: 지방자치단체의 조례 및 규칙","cite":"행정기본법 제2조","badge":"","topic":"","from":"GY-2026-1-P-18","seq":null},{"id":"P-OX-072","subject":"경찰학","unit":"경찰행정법","stmt":"행정지도가 말로 이루어지는 경우에 상대방이 행정지도의 취지 및 내용과 신분의 사항을 적은 서면의 교부를 요구하면 그 행정지도를 하는 자는 직무 수행에 특별한 지장이 없으면 이를 교부하여야 한다. (22.1차)","answer":true,"quote":"② 행정지도가 말로 이루어지는 경우에 상대방이 제1항의 사항을 적은 서면의 교부를 요구하면 그 행정지도를 하는 자는 직무 수행에 특별한 지장이 없으면 이를 교부하여야 한다. [전문개정 2012.10.22.]","cite":"행정절차법 제49조 제2항","badge":"","topic":"","from":"GY-2022-1-P-30","seq":null},{"id":"P-OX-151","subject":"경찰학","unit":"경찰행정법","stmt":"“경찰장비”란 무기, 경찰장구, 경찰착용기록장치, 최루제와 그 발사 장치, 살수차, 감식기구, 해안 감시기구, 통신기기, 차량･선박･항공기 등 경찰이 직무를 수행할 때 필요한 장치와 기구를 말한다. (24.2차)","answer":true,"quote":"② 제1항 본문에서 “경찰장비”란 무기, 경찰장구(警察裝具), 최루제(催淚劑)와 그 발사장치, 살수차, 감식기구(鑑識機具), 해안 감시기구, 통신기기, 차량ㆍ선박ㆍ항공기 등 경찰이 직무를 수행할 때 필요한 장치와 기구를 말한다.","cite":"경찰관 직무집행법 제10조 제2항","badge":"","topic":"","from":"GY-2024-2-P-27","seq":null},{"id":"P-OX-106","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 보호조치를 하였을 때에는 지체 없이 구호대상자의 가족, 친지 또는 그 밖의 연고자에게 그 사실을 알려야 하며, 연고자가 발견되지 아니할 때에는 구호대상자를 적당한 공공 보건의료기관이나 공공구호기관에 즉시 인계하여야 한다. (23.1차)","answer":true,"quote":"3. 미아, 병자, 부상자 등으로서 적당한 보호자가 없으며 응급구호가 필요하다고 인정되는 사람. 다만, 본인이 구호를 거절하는 경우는 제외한다. ② 제1항에 따라 긴급구호를 요청받은 보건의료기관이나 공공구호기관은 정당한 이유 없이 긴급구호를 거절할 수 없다. ③ 경찰관은 제1항의 조치를 하는 경우에 구호대상자가 휴대하고 있는 무기ㆍ흉기 등 위험을 일으킬 수 있는 것으로 인정되는 물건을 경찰관서에 임시로 영치(領置)하여 놓을 수 있다. ④ 경찰관은 제1항의 조치를 하였을 때에는 지체 없이 구호대상자의 가족, 친지 또는 그 밖의 연고자에게 그 사실을 알려야 하며, 연고자가 발견되지 아니할 때에는 구호대상자를 적당한 공공보건의료기관이나 공공구호기관에 즉시 인계하여야 한다. ⑤ 경찰관은 제4항에 따라 구호대상자를 공공보건의료기관이나 공공구호기관에 인계하였을 때에는 즉시 그 사실을 소속 경찰서장이나 해양경찰서장에게 보고하여야 한다. ⑥ 제5항에 따라 보고를 받은 소속 경찰서장이나 해양경찰서장은 대통령령으로 정하는 바에 따라 구호대상자를 인계한 사실을 지체 없이 해당 공공보건의료기관 또는 공공구호기관의 장 및 그 감독행정청에 통보하여야 한다. ⑦ 제1항에 따라 구호대상자를 경찰관서에서 보호하는 기간은 24시간을 초과할 수 없고, 제3항에 따라 물건을 경찰관서에 임시로 영치하는 기간은 10일을 초과할 수 없다.","cite":"경찰관 직무집행법 제4조","badge":"","topic":"","from":"GY-2023-1-P-27","seq":null},{"id":"P-OX-071","subject":"경찰학","unit":"경찰행정법","stmt":"행정기관은 행정지도의 상대방이 행정지도에 따르지 아니하였 다는 것을 이유로 불이익한 조치를 하여서는 아니 된다. (22.1차)","answer":true,"quote":"② 행정기관은 행정지도의 상대방이 행정지도에 따르지 아니하였다는 것을 이유로 불이익한 조치를 하여서는 아니 된다. [전문개정 2012.10.22.]","cite":"행정절차법 제48조 제2항","badge":"","topic":"","from":"GY-2022-1-P-30","seq":null},{"id":"P-OX-077","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관서의 장은 직무 수행에 필요하다고 인정되는 상당한 이유가 있을 때에는 국가기관이나 공사(公私) 단체 등에 직무 수행에 관련된 사실을 조회할 수 있다. 다만, 긴급한 경우에는 소속 경찰관으로 하여금 현장에 나가 해당 기관 또는 단체의 장의 협조를 받아 그 사실을 확인하게 할 수 있다. (22.1차)","answer":true,"quote":"① 경찰관서의 장은 직무 수행에 필요하다고 인정되는 상당한 이유가 있을 때에는 국가기관이나 공사(公私) 단체 등에 직무 수행에 관련된 사실을 조회할 수 있다. 다만, 긴급한 경우에는 소속 경찰관으로 하여금 현장에 나가 해당 기관 또는 단체의 장의 협조를 받아 그 사실을 확인하게 할 수 있다.","cite":"경찰관 직무집행법 제8조 제1항","badge":"","topic":"","from":"GY-2022-1-P-37","seq":null},{"id":"P-OX-085","subject":"경찰학","unit":"경찰행정법","stmt":"소청심사위원회에서 해임처분을 취소 또는 변경하고자 할 경우 에는 재적 위원 3분의 2 이상의 출석과 출석 위원 3분의 2 이상의 합의가 있어야 한다. (22.2차)","answer":true,"quote":"일반 소청은 출석 위원 과반수로 정하지만, 파면·해임·강등·정직을 취소·변경하려면 재적 3분의 2 출석과 출석 3분의 2 합의가 필요하다.","cite":"국가공무원법 제14조","badge":"","topic":"","from":"GY-2022-2-P-15","seq":null},{"id":"P-OX-187","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 미아를 인수할 보호자 확인, 유실물을 인수할 권리자 확인, 사고로 인한 사상자 확인, 행정처분을 위한 교통사고 조사에 필요한 사실확인의 직무를 수행하기 위하여 필요하면 관계인에게 출석하여야 하는 사유‧일시 및 장소를 명확히 적은 출석 요구서를 보내 경찰관서에 출석할 것을 요구할 수 있다. (26.1차)","answer":true,"quote":"② 경찰관은 다음 각 호의 직무를 수행하기 위하여 필요하면 관계인에게 출석하여야 하는 사유ㆍ일시 및 장소를 명확히 적은 출석 요구서를 보내 경찰관서에 출석할 것을 요구할 수 있다. 1. 미아를 인수할 보호자 확인 2. 유실물을 인수할 권리자 확인 3. 사고로 인한 사상자(死傷者) 확인 4. 행정처분을 위한 교통사고 조사에 필요한 사실 확인","cite":"경찰관 직무집행법 제8조 제2항","badge":"","topic":"","from":"GY-2026-1-P-26","seq":null},{"id":"P-OX-159","subject":"경찰학","unit":"경찰행정법","stmt":"국가는 지방자치단체가 이관받은 사무를 원활히 수행할 수 있도록 인력, 장비 등에 소요되는 비용에 대하여 재정적 지원을 하여야 한다. (25.1차)","answer":true,"quote":"국가는 지방자치단체가 이관받은 사무를 원활히 수행할 수 있도록 인력, 장비 등에 소요되는 비용에 대하여 재정적 지원을 하여야 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제34조","badge":"","topic":"","from":"GY-2025-1-P-16","seq":null},{"id":"P-OX-160","subject":"경찰학","unit":"경찰행정법","stmt":"국가와 지방자치단체는 국민의 생명‧신체 및 재산을 보호하고 공공의 안녕과 질서유지에 필요한 시책을 수립‧시행하여야 한다. (25.1차)","answer":true,"quote":"국가와 지방자치단체는 국민의 생명·신체 및 재산을 보호하고 공공의 안녕과 질서유지에 필요한 시책을 수립·시행하여야 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제2조","badge":"","topic":"","from":"GY-2025-1-P-16","seq":null},{"id":"P-OX-208","subject":"경찰학","unit":"경찰행정법","stmt":"총경의 전보, 휴직, 직위해제, 강등, 정직 및 복직은 행정안전부 장관 또는 해양수산부장관이 임용한다. (23.1차)","answer":false,"quote":"총경의 전보·휴직·직위해제·강등·정직·복직은 행정안전부장관이 아니라 경찰청장(해양경찰청장)이 한다.","cite":"경찰공무원법 제7조","badge":"","topic":"","from":"GY-2023-1-P-16","seq":null},{"id":"P-OX-202","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관 직무집행법 상 경찰관의 제지에 관한 부분은 눈앞의 급박한 경찰상 장해를 제거하여야 할 필요가 있고 의무를 명할 시간적 여유가 없거나 의무를 명하는 방법으로는 그 목적을 달성하기 어려운 상황에서 의무이행을 전제로 하지 않고 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 비권력적 사실행위에 관한 근거조항이다. (22.2차)","answer":false,"quote":"위 조항 중 경찰관의 제지에 관한 부분은 범죄 예방을 위한 경찰 행정상 즉시강제, 즉 눈앞의 급박한 경찰상 장해를 제거할 필요가 있고 의무를 명할 시간적 여유가 없거나 의무를 명하는 방법으로는 그 목적을 달성하기 어려운 상황에서 의무불이행을 전제로 하지 않고 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 권력적 사실행위에 관한 근거조항이다.","cite":"대법원 2016도19417","badge":"","topic":"","from":"GY-2022-2-P-16","seq":null},{"id":"P-OX-076","subject":"경찰학","unit":"경찰행정법","stmt":"손실보상금은 일시불로 지급하되, 예산 부족 등의 사유로 일시금으로 지급할 수 없는 특별한 사정이 있는 경우에는 청구인의 동의를 받아 분할하여 지급할 수 있다. (22.1차)","answer":true,"quote":"보상금은 현금 일시불이 원칙이고, 예산 부족 등 특별한 사정이 있으면 청구인의 동의를 받아 나누어 줄 수 있다.","cite":"경찰관 직무집행법 제10조","badge":"","topic":"","from":"GY-2022-1-P-34","seq":null},{"id":"P-OX-229","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰관 직무집행법｣은 제1조 제2항에서 “경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.”라고 선언하여 경찰비례의 원칙을 명시적으로 규정하고 있는데, 이는 경찰행정 영역에서의 헌법상 과소보호 금지원칙을 표현한 것이다. (23.2차)","answer":false,"quote":"특히 경찰관 직무집행법은 제1조 제2항 에서 “경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.”라고 선언하여 경찰비례의 원칙을 명시적으로 규정하고 있는데, 이는 경찰행정 영역에서의 헌법상 과잉금지원칙을 표현한 것으로서, 공공의 안녕과 질서유지라는 공익목적과 이를 실현하기 위하여 개인의 권리나 재산을 침해하는 수단 사이에는 합리적인 비례관계가 있어야 한다는 의미를 갖는다.","cite":"대법원 2018다288631","badge":"","topic":"","from":"GY-2023-2-P-24","seq":null},{"id":"P-OX-155","subject":"경찰학","unit":"경찰행정법","stmt":"국무총리 또는 행정각부의 장은 소관사무에 관하여 법률이나 대통령령의 위임 또는 직권으로 총리령 또는 부령을 발할 수 있다. (25.1차)","answer":true,"quote":"국무총리 또는 행정각부의 장은 소관사무에 관하여 법률이나 대통령령의 위임 또는 직권으로 총리령 또는 부령을 발할 수 있다.","cite":"헌법 제95조","badge":"","topic":"","from":"GY-2025-1-P-14","seq":null},{"id":"P-OX-226","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰관 직무집행법｣에 따르면 위해성 경찰장비의 종류 및 그 사용기준, 안전교육･안전검사의 기준 등은 행정안전부령으로 정한다. (23.2차)","answer":false,"quote":"⑥ 위해성 경찰장비의 종류 및 그 사용기준, 안전교육ㆍ안전검사의 기준 등은 대통령령으로 정한다.","cite":"경찰관 직무집행법 제10조 제6항","badge":"","topic":"","from":"GY-2023-2-P-23","seq":null},{"id":"P-OX-272","subject":"경찰학","unit":"경찰행정법","stmt":"인권존중주의는 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣ 에는 관련된 규정이 없으나, 헌법 제10조와 제37조 제1항 등을 통하여 당연히 유추된다. (25.2차)","answer":false,"quote":"경찰은 직무를 수행할 때 헌법과 법률에 따라 국민의 자유와 권리, 기본적 인권을 보호해야 한다고 법률에 직접 정해져 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제5조","badge":"","topic":"","from":"GY-2025-2-P-05","seq":null},{"id":"P-OX-212","subject":"경찰학","unit":"경찰행정법","stmt":"법 제20조 제1항에 따른 이의제기가 있는 경우에는 행정청의 과태료 부과처분은 그 효력을 상실하지 않는다. (23.1차)","answer":false,"quote":"② 제1항에 따른 이의제기가 있는 경우에는 행정청의 과태료 부과처분은 그 효력을 상실한다.","cite":"질서위반행위규제법 제20조 제2항","badge":"","topic":"","from":"GY-2023-1-P-23","seq":null},{"id":"P-OX-265","subject":"경찰학","unit":"경찰행정법","stmt":"행정처분이 위법임을 이유로 배상을 청구하는 경우에는 미리 그 행정처분의 취소판결이 있어야만 그 행정처분의 위법임을 이유로 피고에게 배상을 청구할 수 있다. (25.1차)","answer":false,"quote":"위법한 행정대집행이 완료되면 그 처분의 무효확인 또는 취소를 구할 소의 이익은 없다 하더라도, 미리 그 행정처분의 취소판결이 있어야만, 그 행정처분의 위법임을 이유로 한 손해배상 청구를 할 수 있는 것은 아니다.","cite":"대법원 72다337","badge":"","topic":"","from":"GY-2025-1-P-20","seq":null},{"id":"P-OX-223","subject":"경찰학","unit":"경찰행정법","stmt":"행정에 관한 나이는 다른 법령등에 특별한 규정이 있는 경우 에도 출생일을 산입하지 않고 만(滿) 나이로 계산하고, 연수 (年數)로 표시하되, 1세에 이르지 아니한 경우에는 월수(月數)로 표시할 수 있다. (23.2차)","answer":false,"quote":"행정상 나이는 다른 법령에 특별한 규정이 있으면 그에 따르고, 없을 때 출생일을 산입해 만 나이로 계산한다.","cite":"행정기본법 제7조의2","badge":"","topic":"","from":"GY-2023-2-P-15","seq":null},{"id":"P-OX-268","subject":"경찰학","unit":"경찰행정법","stmt":"개인정보처리자는 개인정보의 처리 목적에 필요한 범위에서 개인정보의 완전성, 확장성 및 신속성이 보장되도록 하여야 한다. (25.1차)","answer":false,"quote":"③ 개인정보처리자는 개인정보의 처리 목적에 필요한 범위에서 개인정보의 정확성, 완전성 및 최신성이 보장되도록 하여야 한다.","cite":"개인정보 보호법 제3조 제3항","badge":"","topic":"","from":"GY-2025-1-P-23","seq":null},{"id":"P-OX-199","subject":"경찰학","unit":"경찰행정법","stmt":"위원장 및 1명의 위원은 상임위원으로 하고 나머지 5명의 위원은 비상임으로 한다. (22.2차)","answer":false,"quote":"① 시·도자치경찰위원회는 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임으로 하고, 5명의 위원은 비상임으로 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제19조 제1항","badge":"","topic":"","from":"GY-2022-2-P-03","seq":null},{"id":"P-OX-278","subject":"경찰학","unit":"경찰행정법","stmt":"행정의 자기구속원칙은 ｢행정기본법｣ 제8조에 명문의 규정이 있다. (26.1차)","answer":false,"quote":"행정기본법 제8조는 법치행정의 원칙이고, 자기구속원칙은 명문 규정 없이 평등원칙·신뢰보호원칙에서 도출된다.","cite":"행정기본법 제8조 · 행정기본법 제9조","badge":"","topic":"","from":"GY-2026-1-P-14","seq":null},{"id":"P-OX-074","subject":"경찰학","unit":"경찰행정법","stmt":"과태료는 행정청의 과태료 부과처분이나 법원의 과태료 재판이 확정된 후 5년간 징수하지 아니하거나 집행하지 아니하면 시효로 인하여 소멸한다. (22.1차)","answer":true,"quote":"① 과태료는 행정청의 과태료 부과처분이나 법원의 과태료 재판이 확정된 후 5년간 징수하지 아니하거나 집행하지 아니하면 시효로 인하여 소멸한다.","cite":"질서위반행위규제법 제15조 제1항","badge":"","topic":"","from":"GY-2022-1-P-31","seq":null},{"id":"P-OX-209","subject":"경찰학","unit":"경찰행정법","stmt":"제73조의3 제1항에 따라 직위를 부여하지 아니한 경우에 그 사유가 소멸되면 임용권자는 7일 이내에 직위를 부여할 수 있다. (23.1차)","answer":false,"quote":"직위해제 사유가 없어지면 임용권자는 지체 없이 직위를 부여해야 하며, 7일 기한도 재량도 아니다.","cite":"국가공무원법 제73조의3","badge":"","topic":"","from":"GY-2023-1-P-17","seq":null},{"id":"P-OX-134","subject":"경찰학","unit":"경찰행정법","stmt":"의사결정 과정에 있는 사항으로서 공개될 경우 업무의 공정한 수행에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 정보는 공개하지 않을 수 있다. (24.1차)","answer":true,"quote":"① 공공기관이 보유·관리하는 정보는 공개 대상이 된다. 다만, 다음 각 호의 어느 하나에 해당하는 정보는 공개하지 아니할 수 있다. 1. 다른 법률 또는 법률에서 위임한 명령(국회규칙·대법원규칙·헌법재판소규칙·중앙선거관리위원회규칙·대통령령 및 조례로 한정한다)에 따라 비밀이나 비공개 사항으로 규정된 정보 2. 국가안전보장·국방·통일·외교관계 등에 관한 사항으로서 공개될 경우 국가의 중대한 이익을 현저히 해칠 우려가 있다고 인정되는 정보 3. 공개될 경우 국민의 생명·신체 및 재산의 보호에 현저한 지장을 초래할 우려가 있다고 인정되는 정보 4. 진행 중인 재판에 관련된 정보와 범죄의 예방, 수사, 공소의 제기 및 유지, 형의 집행, 교정(矯正), 보안처분에 관한 사항으로서 공개될 경우 그 직무수행을 현저히 곤란하게 하거나 형사피고인의 공정한 재판을 받을 권리를 침해한다고 인정할 만한 상당한 이유가 있는 정보 5. 감사·감독·검사·시험·규제·입찰계약·기술개발·인사관리에 관한 사항이나 의사결정 과정 또는 내부검토 과정에 있는 사항 등으로서 공개될 경우 업무의 공정한 수행이나 연구·개발에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 정보. 다만, 의사결정 과정 또는 내부검토 과정을 이유로 비공개할 경우에는 의사결정 과정 및 내부검토 과정이 종료되면 제10조에 따른 청구인에게 이를 통지하여야 한다. 6. 해당 정보에 포함되어 있는 성명·주민등록번호 등 개인에 관한 사항으로서 공개될 경우 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보. 다만, 다음 각 목에 열거한 개인에 관한 정보는 제외한다. 가. 법령에서 정하는 바에 따라 열람할 수 있는 정보 나. 공공기관이 공표를 목적으로 작성하거나 취득한 정보로서 사생활의 비밀 또는 자유를 부당하게 침해하지 아니하는 정보 다. 공공기관이 작성하거나 취득한 정보로서 공개하는 것이 공익이나 개인의 권리 구제를 위하여 필요하다고 인정되는 정보 라. 직무를 수행한 공무원의 성명·직위 마. 공개하는 것이 공익을 위하여 필요한 경우로서 법령에 따라 국가 또는 지방자치단체가 업무의 일부를 위탁 또는 위촉한 개인의 성명·직업 7. 법인·단체 또는 개인(이하 \"법인등\"이라 한다)의 경영상·영업상 비밀에 관한 사항으로서 공개될 경우 법인등의 정당한 이익을 현저히 해칠 우려가 있다고 인정되는 정보. 다만, 다음 각 목에 열거한 정보는 제외한다. 가. 사업활동에 의하여 발생하는 위해(危害)로부터 사람의 생명·신체 또는 건강을 보호하기 위하여 공개할 필요가 있는 정보 나. 위법·부당한 사업활동으로부터 국민의 재산 또는 생활을 보호하기 위하여 공개할 필요가 있는 정보 8. 공개될 경우 부동산 투기, 매점매석 등으로 특정인에게 이익 또는 불이익을 줄 우려가 있다고 인정되는 정보","cite":"공공기관의 정보공개에 관한 법률 제9조 제1항","badge":"","topic":"","from":"GY-2024-1-P-23","seq":null},{"id":"P-OX-120","subject":"경찰학","unit":"경찰행정법","stmt":"정보주체는 자신의 개인정보 처리와 관련하여 개인정보의 처리 정지, 정정･삭제 및 파기를 요구할 권리를 가진다. (23.2차)","answer":true,"quote":"정보주체는 자신의 개인정보 처리와 관련하여 다음 각 호의 권리를 가진다. 1. 개인정보의 처리에 관한 정보를 제공받을 권리 2. 개인정보의 처리에 관한 동의 여부, 동의 범위 등을 선택하고 결정할 권리 3. 개인정보의 처리 여부를 확인하고 개인정보에 대하여 열람(사본의 발급을 포함한다. 이하 같다)을 요구할 권리 4. 개인정보의 처리 정지, 정정·삭제 및 파기를 요구할 권리 5. 개인정보의 처리로 인하여 발생한 피해를 신속하고 공정한 절차에 따라 구제받을 권리","cite":"개인정보 보호법 제4조","badge":"","topic":"","from":"GY-2023-2-P-25","seq":null},{"id":"P-OX-224","subject":"경찰학","unit":"경찰행정법","stmt":"국유재산의 관리청이 그 무단점유자에 대하여 하는 변상금부과 처분은 순전히 사경제 주체로서 행하는 사법상의 법률행위이다. (23.2차)","answer":false,"quote":"동조 제2항 은 변상금의 체납시 국세징수법에 의하여 강제징수토록 하고 있는 점 등에 비추어 보면 국유재산의 관리청이 그 무단점유자에 대하여 하는 변상금부과처분은 순전히 사경제 주체로서 행하는 사법상의 법률행위라 할 수 없고 이는 관리청이 공권력을 가진 우월적 지위에서 행한 것으로서 행정소송의 대상이 되는 행정처분이라고 보아야 한다.","cite":"대법원 87누1046","badge":"","topic":"","from":"GY-2023-2-P-17","seq":null},{"id":"P-OX-194","subject":"경찰학","unit":"경찰행정법","stmt":"행정지도의 상대방은 해당 행정지도의 방식 내용 등에 관하여 행정기관에 의견제출을 할 수 없다. (22.1차)","answer":false,"quote":"행정지도의 상대방은 해당 행정지도의 방식·내용 등에 관하여 행정기관에 의견제출을 할 수 있다. [전문개정 2012.10.22.]","cite":"행정절차법 제50조","badge":"","topic":"","from":"GY-2022-1-P-30","seq":null},{"id":"P-OX-245","subject":"경찰학","unit":"경찰행정법","stmt":"장래의 사실이더라도 그것이 장래 반드시 실현되는 사실이면 실현 되는 시기가 비록 확정되지 않더라도 이는 조건으로 보아야 한다. (24.2차)","answer":false,"quote":"반면 장래의 사실이더라도 그것이 장래 반드시 실현되는 사실이면 실현되는 시기가 비록 확정되지 않더라도 이는 기한으로 보아야 한다.","cite":"대법원 2018다201702","badge":"","topic":"","from":"GY-2024-2-P-19","seq":null},{"id":"P-OX-084","subject":"경찰학","unit":"경찰행정법","stmt":"징계의결이 요구된 경정 丁에게 국무총리 표창을 받은 공적이 있는 경우에 징계위원회는 징계를 감경할 수 있지만, 그 표창이 丁에게 수여된 표창이 아니라 丁이 속한 OO경찰서에 수여된 단체표창이라면 감경할 수 없다. (22.2차)","answer":true,"quote":"다만 징계양정에서 임의적 감경사유가 되는 국무총리 이상의 표창은 징계대상자가 받은 것이어야 함은 관련 법령의 문언상 명백하고, 징계대상자가 위와 같은 표창을 받은 공적을 징계양정의 임의적 감경사유로 삼은 것은 징계의결이 요구된 사람이 국가 또는 사회에 공헌한 행적을 징계양정에 참작하려는 데 그 취지가 있으므로 징계대상자가 아니라 그가 속한 기관이나 단체에 수여된 국무총리 단체표창은 징계대상자에 대한 징계양정의 임의적 감경사유에 해당하지 않는다.","cite":"대법원 2012두13245","badge":"","topic":"","from":"GY-2022-2-P-13","seq":null},{"id":"P-OX-124","subject":"경찰학","unit":"경찰행정법","stmt":"시･도지사는 시･도자치경찰위원회의 의결이 적정하지 아니하다고 판단할 때에는 재의를 요구할 수 있다. (24.1차)","answer":true,"quote":"③ 시·도지사는 제1항에 관한 시·도자치경찰위원회의 의결이 적정하지 아니하다고 판단할 때에는 재의를 요구할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제25조 제3항","badge":"","topic":"","from":"GY-2024-1-P-16","seq":null},{"id":"P-OX-139","subject":"경찰학","unit":"경찰행정법","stmt":"행정심판위원회는 처분, 처분의 집행 또는 절차의 속행 때문에 중대한 손해가 생기는 것을 예방할 필요성이 긴급하다고 인정할 때에는 직권으로 또는 당사자의 신청에 의하여 처분의 효력, 처분의 집행 또는 절차의 속행의 전부 또는 일부의 정지를 결정 할 수 있다. (24.1차)","answer":true,"quote":"② 위원회는 처분, 처분의 집행 또는 절차의 속행 때문에 중대한 손해가 생기는 것을 예방할 필요성이 긴급하다고 인정할 때에는 직권으로 또는 당사자의 신청에 의하여 처분의 효력, 처분의 집행 또는 절차의 속행의 전부 또는 일부의 정지(이하 \"집행정지\"라 한다)를 결정할 수 있다. 다만, 처분의 효력정지는 처분의 집행 또는 절차의 속행을 정지함으로써 그 목적을 달성할 수 있을 때에는 허용되지 아니한다.","cite":"행정심판법 제30조 제2항","badge":"","topic":"","from":"GY-2024-1-P-27","seq":null},{"id":"P-OX-238","subject":"경찰학","unit":"경찰행정법","stmt":"개인정보처리자는 통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 가명정보를 처리하는 경우에 정보주체에게 이를 알리고 동의를 받아야 한다. (24.1차)","answer":false,"quote":"통계작성·과학적 연구·공익적 기록보존 등을 위한 가명정보 처리는 정보주체의 동의 없이 할 수 있다.","cite":"개인정보 보호법 제28조의2","badge":"","topic":"","from":"GY-2024-1-P-22","seq":null},{"id":"P-OX-115","subject":"경찰학","unit":"경찰행정법","stmt":"국가수사본부장의 임기는 2년으로 하며, 중임할 수 없다. (23.2차)","answer":true,"quote":"③ 국가수사본부장의 임기는 2년으로 하며, 중임할 수 없다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제16조 제3항","badge":"","topic":"","from":"GY-2023-2-P-18","seq":null},{"id":"P-OX-259","subject":"경찰학","unit":"경찰행정법","stmt":"법규명령의 위임의 근거가 되는 법률에 대하여 위헌결정이 선고 되더라도 그 위임규정에 근거하여 제정된 법규명령은 원칙적으로 효력을 유지한다. (25.1차)","answer":false,"quote":"법규명령의 위임의 근거가 되는 법률에 대하여 위헌결정이 선고되면 그 위임규정에 근거하여 제정된 법규명령도 원칙적으로 효력을 상실한다고 할 것이나, 구 국가보위에관한특별조치법(1981. 12. 17.","cite":"대법원 96다52359","badge":"","topic":"","from":"GY-2025-1-P-14","seq":null},{"id":"P-OX-075","subject":"경찰학","unit":"경찰행정법","stmt":"손실보상을 청구할 수 있는 권리는 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효의 완성으로 소멸한다. (22.1차)","answer":true,"quote":"② 제1항에 따른 보상을 청구할 수 있는 권리는 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효의 완성으로 소멸한다.","cite":"경찰관 직무집행법 제11조의2 제2항","badge":"","topic":"","from":"GY-2022-1-P-34","seq":null},{"id":"P-OX-283","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 신청에 구비서류의 미비 등 흠이 있는 경우에 보완에 필요한 상당한 기간을 정하여 7일 이내에 신청인에게 보완을 요구하여야 한다. (26.1차)","answer":false,"quote":"신청에 흠이 있으면 보완에 필요한 상당한 기간을 정해 지체 없이 보완을 요구해야 하고, 7일이라는 기한은 없다.","cite":"행정절차법 제17조","badge":"","topic":"","from":"GY-2026-1-P-23","seq":null},{"id":"P-OX-257","subject":"경찰학","unit":"경찰행정법","stmt":"국회의장은 국회의 경호를 위하여 필요할 때에는 국회사무처의 동의를 받아 일정한 기간을 정하여 경찰공무원의 파견을 요구 할 수 있다. (25.1차)","answer":false,"quote":"② 의장은 국회의 경호를 위하여 필요할 때에는 국회운영위원회의 동의를 받아 일정한 기간을 정하여 정부에 국가경찰공무원의 파견을 요구할 수 있다.","cite":"국회법 제144조 제2항","badge":"","topic":"","from":"GY-2025-1-P-04","seq":null},{"id":"P-OX-254","subject":"경찰학","unit":"경찰행정법","stmt":"결정서의 송달에 관하여는 ｢행정소송법｣의 송달에 관한 규정을 준용한다. (24.2차)","answer":false,"quote":"② 제1항의 송달에 관하여는 「민사소송법」의 송달에 관한 규정을 준용한다. [전문개정 2008.3.14.]","cite":"국가배상법 제14조 제2항","badge":"","topic":"","from":"GY-2024-2-P-28","seq":null},{"id":"P-OX-126","subject":"경찰학","unit":"경찰행정법","stmt":"술에 취한 상태로 인하여 자기 또는 타인의 생명·신체와 재산에 위해를 미칠 우려가 있는 피구호자에 대한 보호조치는 경찰 행정상 즉시강제에 해당하므로, 그 조치가 불가피한 최소한도 내에서만 행사되도록 발동･행사 요건을 신중하고 엄격하게 해석하여야 한다. (24.1차)","answer":true,"quote":"경찰관직무집행법 제4조 제1항 제1호 (이하 ‘이 사건 조항’이라 한다)에서 규정하는 술에 취한 상태로 인하여 자기 또는 타인의 생명·신체와 재산에 위해를 미칠 우려가 있는 피구호자에 대한 보호조치는 경찰 행정상 즉시강제에 해당하므로, 그 조치가 불가피한 최소한도 내에서만 행사되도록 발동·행사 요건을 신중하고 엄격하게 해석하여야 한다.","cite":"대법원 2012도11162","badge":"","topic":"","from":"GY-2024-1-P-17","seq":null},{"id":"P-OX-090","subject":"경찰학","unit":"경찰행정법","stmt":"국가수사본부장은 신분비공개수사가 종료된 즉시 대통령령으로 정하는 바에 따라 국가경찰위원회에 수사 관련 자료를 보고하여야 하며, 국가수사본부장은 대통령령으로 정하는 바에 따라 국회 소관 상임위원회에 신분비공개수사 관련 자료를 반기별로 보고하여야 한다. (22.2차)","answer":true,"quote":"국가수사본부장은 신분비공개수사가 끝나면 즉시 국가경찰위원회에, 국회 소관 상임위원회에는 반기별로 자료를 보고한다.","cite":"아동·청소년의 성보호에 관한 법률 제25조의6","badge":"","topic":"","from":"GY-2022-2-P-35","seq":null},{"id":"P-OX-102","subject":"경찰학","unit":"경찰행정법","stmt":"“정보”란 공공기관이 직무상 작성 또는 취득하여 관리하고 있는 문서(전자문서를 포함한다) 및 전자매체를 비롯한 모든 형태의 매체 등에 기록된 사항을 말한다. (23.1차)","answer":true,"quote":"이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"정보\"란 공공기관이 직무상 작성 또는 취득하여 관리하고 있는 문서(전자문서를 포함한다. 이하 같다)·도면·사진·필름·테이프·슬라이드 및 그 밖에 이에 준하는 매체 등에 기록된 사항을 말한다. 2. \"공개\"란 공공기관이 이 법에 따라 정보를 열람하게 하거나 그 사본·복제물을 제공하는 것 또는 「전자정부법」 제2조제10호에 따른 정보통신망(이하 \"정보통신망\"이라 한다)을 통하여 정보를 제공하는 것 등을 말한다. 3. \"공공기관\"이란 다음 각 목의 기관을 말한다. 가. 국가기관 1) 국회, 법원, 헌법재판소, 중앙선거관리위원회 2) 중앙행정기관(대통령 소속 기관과 국무총리 소속 기관을 포함한다) 및 그 소속 기관 3) 「행정기관 소속 위원회의 설치·운영에 관한 법률」에 따른 위원회 나. 지방자치단체 다. 「공공기관의 운영에 관한 법률」 제2조에 따른 공공기관 라. 그 밖에 대통령령으로 정하는 기관 [전문개정 2013.8.6.]","cite":"공공기관의 정보공개에 관한 법률 제2조","badge":"","topic":"","from":"GY-2023-1-P-24","seq":null},{"id":"P-OX-137","subject":"경찰학","unit":"경찰행정법","stmt":"공무원에게 부과된 직무상 의무의 내용이 전적으로 또는 부수적으로 사회구성원 개인의 구체적 안전과 이익을 보호하기 위하여 설정된 것이라면, 공무원이 그와 같은 직무상 의무를 위반함으로써 개인이 입게 된 손해는 상당인과관계가 인정되는 범위 안에서 국가가 그에 대한 배상책임을 부담하여야 한다. (24.1차)","answer":true,"quote":"공무원에게 부과된 직무상 의무의 내용이 단순히 공공 일반의 이익을 위한 것이거나 행정기관 내부의 질서를 규율하기 위한 것이 아니고 전적으로 또는 부수적으로 사회구성원 개인의 안전과 이익을 보호하기 위하여 설정된 것이라면, 공무원이 그와 같은 직무상 의무를 위반함으로 인하여 피해자가 입은 손해에 대하여는 상당인과관계가 인정되는 범위 내에서 국가가 배상책임을 지는 것이고, 이때 상당인과관계의 유무를 판단함에 있어서는 일반적인 결과 발생의 개연성은 물론 직무상 의무를 부과하는 법령 기타 행동규범의 목적이나 가해행위의 태양 및 피해의 정도 등을 종합적으로 고려하여야 하며, 이는 지방자치단체와 그 소속 공무원에 대하여도 마찬가지이다.","cite":"대법원 2005다48994","badge":"","topic":"","from":"GY-2024-1-P-25","seq":null},{"id":"P-OX-125","subject":"경찰학","unit":"경찰행정법","stmt":"위원은 시･도의회가 추천하는 2명, 국가경찰위원회가 추천하는 1명, 해당 시･도 교육감이 추천하는 1명, 시･도자치경찰위원회 위원추천위원회가 추천하는 2명, 시･도지사가 지명하는 1명의 사람을 시･도지사가 임명한다. (24.1차)","answer":true,"quote":"① 시·도자치경찰위원회 위원은 다음 각 호의 사람을 시·도지사가 임명한다. 1. 시·도의회가 추천하는 2명 2. 국가경찰위원회가 추천하는 1명 3. 해당 시·도 교육감이 추천하는 1명 4. 시·도자치경찰위원회 위원추천위원회가 추천하는 2명 5. 시·도지사가 지명하는 1명","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제20조 제1항","badge":"","topic":"","from":"GY-2024-1-P-16","seq":null},{"id":"P-OX-206","subject":"경찰학","unit":"경찰행정법","stmt":"정보처리 기술을 활용하여 기존의 다양한 정보를 가공해서 만들어 낸 새로운 정보에 관한 독점적 권리를 가지는 사람을 “정보주체”라 한다. (22.2차)","answer":false,"quote":"정보주체는 처리되는 정보로 알아볼 수 있는 사람, 곧 그 정보의 주체이고, 새 정보에 독점적 권리를 갖는 사람이라는 정의는 없다.","cite":"개인정보 보호법 제2조","badge":"","topic":"","from":"GY-2022-2-P-21","seq":null},{"id":"P-OX-213","subject":"경찰학","unit":"경찰행정법","stmt":"청구인은 이의신청 절차를 거치지 아니하고 행정심판을 청구 할 수 없다. (23.1차)","answer":false,"quote":"② 청구인은 제18조에 따른 이의신청 절차를 거치지 아니하고 행정심판을 청구할 수 있다.","cite":"공공기관의 정보공개에 관한 법률 제19조 제2항","badge":"","topic":"","from":"GY-2023-1-P-24","seq":null},{"id":"P-OX-267","subject":"경찰학","unit":"경찰행정법","stmt":"이행강제금의 부과란 의무자가 행정상 의무를 이행하지 아니하는 경우 행정청이 적절한 이행기간을 부여하고, 그 기한까지 행정상 의무를 이행하지 아니하면 금전급부의무를 부과하는 것으로서, 행정상 의무를 이행하지 않더라도 반복하여 부과할 수 없다. (25.1차)","answer":false,"quote":"3. 그 밖에 행정목적을 달성하는 데 필요하다고 인정되는 사유 ③ 행정청은 이행강제금을 부과하기 전에 미리 의무자에게 적절한 이행기간을 정하여 그 기한까지 행정상 의무를 이행하지 아니하면 이행강제금을 부과한다는 뜻을 문서로 계고(戒告)하여야 한다. ④ 행정청은 의무자가 제3항에 따른 계고에서 정한 기한까지 행정상 의무를 이행하지 아니한 경우 이행강제금의 부과 금액·사유·시기를 문서로 명확하게 적어 의무자에게 통지하여야 한다. ⑤ 행정청은 의무자가 행정상 의무를 이행할 때까지 이행강제금을 반복하여 부과할 수 있다. 다만, 의무자가 의무를 이행하면 새로운 이행강제금의 부과를 즉시 중지하되, 이미 부과한 이행강제금은 징수하여야 한다. ⑥ 행정청은 이행강제금을 부과받은 자가 납부기한까지 이행강제금을 내지 아니하면 국세강제징수의 예 또는 「지방행정제재·부과금의 징수 등에 관한 법률」에 따라 징수한다.","cite":"행정기본법 제31조","badge":"","topic":"","from":"GY-2025-1-P-22","seq":null},{"id":"P-OX-103","subject":"경찰학","unit":"경찰행정법","stmt":"다른 법령등에서 청문을 하도록 규정하고 있는 경우 (23.1차)","answer":true,"quote":"1. 다른 법령등에서 청문을 하도록 규정하고 있는 경우","cite":"행정절차법 제22조","badge":"","topic":"","from":"GY-2023-1-P-25","seq":null},{"id":"P-OX-108","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관이 술에 취한 상태에서 자동차를 운전한 것으로 보이는 피고인을 ｢경찰관 직무집행법｣에 따른 보호조치 대상자로 보아 경찰관서로 데려온 직후 음주측정을 요구하였는데 피고인이 불응하여 음주측정불응죄로 기소된 사안에서, 위법한 보호조치 상태를 이용하여 음주측정 요구가 이루어졌다는 등의 특별한 사정이 없는 한 피고인의 행위는 음주측정불응죄에 해당한다. (23.1차)","answer":true,"quote":"경찰관이 술에 취한 상태에서 자동차를 운전한 것으로 보이는 피고인을 경찰관직무집행법 제4조 제1항 에 따른 보호조치 대상자로 보아 경찰관서로 데려온 직후 음주측정을 요구하였는데 피고인이 불응하여 구 도로교통법상 음주측정불응죄로 기소된 사안에서, 위법한 보호조치 상태를 이용하여 음주측정 요구가 이루어졌다는 등의 특별한 사정이 없는 한 피고인의 행위는 음주측정불응죄에 해당한다고 보아야 하는데도, 이와 달리 본 원심판결에 법리오해 등의 위법이 있다고 한 사례","cite":"대법원 2011도4328","badge":"","topic":"","from":"GY-2023-1-P-39","seq":null},{"id":"P-OX-246","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있더라도 부관을 붙일 수 없다. (24.2차)","answer":false,"quote":"② 행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있는 경우에 부관을 붙일 수 있다.","cite":"행정기본법 제17조 제2항","badge":"","topic":"","from":"GY-2024-2-P-19","seq":null},{"id":"P-OX-200","subject":"경찰학","unit":"경찰행정법","stmt":"위원 2명이 회의를 요구하는 경우 임시회의를 개최할 수 있다. (22.2차)","answer":false,"quote":"① 시·도자치경찰위원회의 회의는 정기적으로 개최하여야 한다. 다만 위원장이 필요하다고 인정하는 경우, 위원 2명 이상이 요구하는 경우 및 시·도지사가 필요하다고 인정하는 경우에는 임시회의를 개최할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제26조 제1항","badge":"","topic":"","from":"GY-2022-2-P-03","seq":null},{"id":"P-OX-165","subject":"경찰학","unit":"경찰행정법","stmt":"｢부패방지 및 국민권익위원회의 설치와 운영에 관한 법률｣상 ‘국민감사청구제도’는 경찰의 대외적 민주화 방안이다. (25.2차)","answer":true,"quote":"국민감사청구는 국민이 밖에서 감사를 요구해 행정을 감시하게 하는 제도라 대외적 민주화 방안이다.","cite":"부패방지 및 국민권익위원회의 설치와 운영에 관한 법률 제72조","badge":"","topic":"","from":"GY-2025-2-P-05","seq":null},{"id":"P-OX-091","subject":"경찰학","unit":"경찰행정법","stmt":"임용권자는 직무수행 능력이 부족하거나 근무성적이 극히 나쁜 자에게 직위를 부여하지 아니할 수 있다. (23.1차)","answer":true,"quote":"① 임용권자는 다음 각 호의 어느 하나에 해당하는 자에게는 직위를 부여하지 아니할 수 있다. <개정 2008.3.28., 2010.3.22., 2014.1.7., 2015.5.18.> 1. 삭제 <1973.2.5.> 2. 직무수행 능력이 부족하거나 근무성적이 극히 나쁜 자 3. 파면·해임·강등 또는 정직에 해당하는 징계 의결이 요구 중인 자 4. 형사 사건으로 기소된 자(약식명령이 청구된 자는 제외한다) 5. 고위공무원단에 속하는 일반직공무원으로서 제70조의2제1항제2호부터 제5호까지의 사유로 적격심사를 요구받은 자 6. 금품비위, 성범죄 등 대통령령으로 정하는 비위행위로 인하여 감사원 및 검찰·경찰 등 수사기관에서 조사나 수사 중인 자로서 비위의 정도가 중대하고 이로 인하여 정상적인 업무수행을 기대하기 현저히 어려운 자","cite":"국가공무원법 제73조의3 제1항","badge":"","topic":"","from":"GY-2023-1-P-17","seq":null},{"id":"P-OX-129","subject":"경찰학","unit":"경찰행정법","stmt":"행정응원을 요청받은 행정청은 행정응원으로 인하여 고유의 직무 수행이 현저히 지장받을 것으로 인정되는 명백한 이유가 있는 경우에는 응원을 거부할 수 있다. (24.1차)","answer":true,"quote":"② 제1항에 따라 행정응원을 요청받은 행정청은 다음 각 호의 어느 하나에 해당하는 경우에는 응원을 거부할 수 있다. 1. 다른 행정청이 보다 능률적이거나 경제적으로 응원할 수 있는 명백한 이유가 있는 경우 2. 행정응원으로 인하여 고유의 직무 수행이 현저히 지장받을 것으로 인정되는 명백한 이유가 있는 경우","cite":"행정절차법 제8조 제2항","badge":"","topic":"","from":"GY-2024-1-P-21","seq":null},{"id":"P-OX-094","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있는 경우에 부관을 붙일 수 있다. (23.1차)","answer":true,"quote":"② 행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있는 경우에 부관을 붙일 수 있다.","cite":"행정기본법 제17조 제2항","badge":"","topic":"","from":"GY-2023-1-P-21","seq":null},{"id":"P-OX-132","subject":"경찰학","unit":"경찰행정법","stmt":"피의자신문조서 등 조서에 기재된 피의자 등의 인적사항 이외의 진술내용 역시 개인의 사생활의 비밀 또는 자유를 침해할 우려가 인정되는 경우에는 비공개대상정보에 해당한다. (24.1차)","answer":true,"quote":"따라서 불기소처분 기록이나 내사기록 중 피의자신문조서 등 조서에 기재된 피의자 등의 인적사항 이외의 진술내용 역시 개인의 사생활의 비밀 또는 자유를 침해할 우려가 인정되는 경우에는 위 비공개대상정보에 해당한다.","cite":"대법원 2017두44558","badge":"","topic":"","from":"GY-2024-1-P-23","seq":null},{"id":"P-OX-145","subject":"경찰학","unit":"경찰행정법","stmt":"공공기관은 ｢공공기관의 정보공개에 관한 법률｣ 제11조에 따라 정보의 공개 결정을 한 경우에는, 청구인이 사본 또는 복제물의 교부를 원하는 경우에는 이를 교부하여야 한다. (24.2차)","answer":true,"quote":"② 공공기관은 청구인이 사본 또는 복제물의 교부를 원하는 경우에는 이를 교부하여야 한다. 다만, 공개 대상 정보의 양이 너무 많아 정상적인 업무수행에 현저한 지장을 초래할 우려가 있는 경우에는 정보의 사본·복제물을 일정 기간별로 나누어 제공하거나 열람과 병행하여 제공할 수 있다.","cite":"공공기관의 정보공개에 관한 법률 제13조 제2항","badge":"","topic":"","from":"GY-2024-2-P-21","seq":null},{"id":"P-OX-262","subject":"경찰학","unit":"경찰행정법","stmt":"경찰착용기록장치로 기록을 마친 영상음성기록은 10일 이내로 영상음성기록정보 관리체계를 이용하여 영상음성기록정보 데이터베이스에 전송‧저장할 수 있으며, 영상음성기록을 임의로 편집‧복사하거나 삭제하여서는 아니 된다. (25.1차)","answer":false,"quote":"기록을 마친 영상은 10일 이내가 아니라 지체 없이 데이터베이스에 전송·저장해야 하는 의무이고, 임의 편집·복사·삭제는 금지된다.","cite":"경찰관 직무집행법 제10조의6","badge":"","topic":"","from":"GY-2025-1-P-17","seq":null},{"id":"P-OX-186","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 범인의 체포, 범인의 도주 방지, 자신이나 다른 사람의 생명‧신체의 방어 및 보호, 공무집행에 대한 항거의 제지를 위하여 필요하다고 인정되는 상당한 이유가 있을 때에는 그 사태를 합리적으로 판단하여 필요한 한도에서 무기를 사용할 수 있다. (26.1차)","answer":true,"quote":"① 경찰관은 범인의 체포, 범인의 도주 방지, 자신이나 다른 사람의 생명ㆍ신체의 방어 및 보호, 공무집행에 대한 항거의 제지를 위하여 필요하다고 인정되는 상당한 이유가 있을 때에는 그 사태를 합리적으로 판단하여 필요한 한도에서 무기를 사용할 수 있다. 다만, 다음 각 호의 어느 하나에 해당할 때를 제외하고는 사람에게 위해를 끼쳐서는 아니 된다.","cite":"경찰관 직무집행법 제10조의4 제1항","badge":"","topic":"","from":"GY-2026-1-P-26","seq":null},{"id":"P-OX-235","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관의 경고나 제지는 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에 이를 예방하기 위하여 이루어지는 조치로서, 범죄행위가 계속되는 중 그 진압을 위해서는 행하여질 수 없다. (24.1차)","answer":false,"quote":"경고·제지는 범죄 실행 전의 예방에 그치지 않고, 범죄가 계속되는 중에 그 진압을 위해서도 할 수 있다.","cite":"대법원 2013도643","badge":"","topic":"","from":"GY-2024-1-P-17","seq":null},{"id":"P-OX-181","subject":"경찰학","unit":"경찰행정법","stmt":"파산선고를 받고 복권되지 아니한 사람은 경찰공무원으로 임용 될 수 없다. (26.1차)","answer":true,"quote":"파산선고를 받고 복권되지 않은 사람은 결격이고, 복권되면 결격이 풀려 임용될 수 있다.","cite":"경찰공무원법 제8조","badge":"","topic":"","from":"GY-2026-1-P-21","seq":null},{"id":"P-OX-196","subject":"경찰학","unit":"경찰행정법","stmt":"손실보상금 지급 청구서를 받은 경찰청장등은 손실보상심의위 원회의 심의 의결에 따라 손실보상 여부 및 손실보상금액을 결정하되 손실보상 청구가 요건과 절차를 갖추지 못한 경우 (다만, 그 잘못된 부분을 시정할 수 있는 경우는 제외한다) 그 청구를 기각하는 결정을 하여야 한다. (22.1차)","answer":false,"quote":"요건과 절차를 갖추지 못한 청구는 각하해야 하고, 기각은 심의 결과 보상하지 않기로 할 때 하는 결정이다.","cite":"경찰관 직무집행법 제10조","badge":"","topic":"","from":"GY-2022-1-P-34","seq":null},{"id":"P-OX-255","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰공무원법｣은 경찰공무원이 특정 정당이나 특정인의 선거 운동을 하거나 선거 관련 대책회의에 관여하는 행위를 정치활동에 관여하는 행위로 보지 않는다. (25.1차)","answer":false,"quote":"특정 정당·특정인의 선거운동이나 선거 관련 대책회의 관여는 경찰공무원법이 금지하는 정치관여 행위로 명시되어 있다.","cite":"경찰공무원법 제23조","badge":"","topic":"","from":"GY-2025-1-P-03","seq":null},{"id":"P-OX-127","subject":"경찰학","unit":"경찰행정법","stmt":"경찰청장은 위해성 경찰장비를 새로 도입하려는 경우에는 대통령령으로 정하는 바에 따라 안전성 검사를 실시하여 그 안전성 검사의 결과보고서를 국회 소관 상임위원회에 제출하여야 한다. 이 경우 안전성 검사에는 외부 전문가를 참여시켜야 한다. (24.1차)","answer":true,"quote":"⑤ 경찰청장은 위해성 경찰장비를 새로 도입하려는 경우에는 대통령령으로 정하는 바에 따라 안전성 검사를 실시하여 그 안전성 검사의 결과보고서를 국회 소관 상임위원회에 제출하여야 한다. 이 경우 안전성 검사에는 외부 전문가를 참여시켜야 한다.","cite":"경찰관 직무집행법 제10조 제5항","badge":"","topic":"","from":"GY-2024-1-P-18","seq":null},{"id":"P-OX-081","subject":"경찰학","unit":"경찰행정법","stmt":"부정청탁 및 금품등 수수의 금지에 관한 법률 상 국가공무원법 또는 지방공무원법 에 따른 공무원과 그 밖에 다른 법률에 따라 그 자격 임용 교육훈련 복무 보수 신분보장 등에 있어서 공무원으로 인정된 사람은 ‘공직자등’ 개념에 포함된다. (22.2차)","answer":true,"quote":"이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"공공기관\"이란 다음 각 목의 어느 하나에 해당하는 기관·단체를 말한다. 가. 국회, 법원, 헌법재판소, 선거관리위원회, 감사원, 국가인권위원회, 중앙행정기관(대통령 소속 기관과 국무총리 소속 기관을 포함한다)과 그 소속 기관 및 지방자치단체 나. 「공직자윤리법」 제3조의2에 따른 공직유관단체 다. 「공공기관의 운영에 관한 법률」 제4조에 따른 기관 라. 「초·중등교육법」, 「고등교육법」, 「유아교육법」 및 그 밖의 다른 법령에 따라 설치된 각급 학교 및 「사립학교법」에 따른 학교법인 마. 「언론중재 및 피해구제 등에 관한 법률」 제2조제12호에 따른 언론사 2. \"공직자등\"이란 다음 각 목의 어느 하나에 해당하는 공직자 또는 공적 업무 종사자를 말한다. 가. 「국가공무원법」 또는 「지방공무원법」에 따른 공무원과 그 밖에 다른 법률에 따라 그 자격·임용·교육훈련·복무·보수·신분보장 등에 있어서 공무원으로 인정된 사람 나. 제1호나목 및 다목에 따른 공직유관단체 및 기관의 장과 그 임직원 다. 제1호라목에 따른 각급 학교의 장과 교직원 및 학교법인의 임직원 라. 제1호마목에 따른 언론사의 대표자와 그 임직원 3. \"금품등\"이란 다음 각 목의 어느 하나에 해당하는 것을 말한다. 가. 금전, 유가증권, 부동산, 물품, 숙박권, 회원권, 입장권, 할인권, 초대권, 관람권, 부동산 등의 사용권 등 일체의 재산적 이익 나. 음식물·주류·골프 등의 접대·향응 또는 교통·숙박 등의 편의 제공 다. 채무 면제, 취업 제공, 이권(利權) 부여 등 그 밖의 유형·무형의 경제적 이익 4. \"소속기관장\"이란 공직자등이 소속된 공공기관의 장을 말한다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제2조","badge":"","topic":"","from":"GY-2022-2-P-06","seq":null},{"id":"P-OX-249","subject":"경찰학","unit":"경찰행정법","stmt":"행정청이 인허가 등의 취소처분을 하는 경우 공청회를 개최한다. (24.2차)","answer":false,"quote":"3. 다음 각 목의 처분 시 제21조제1항제6호에 따른 의견제출기한 내에 당사자등의 신청이 있는 경우 가. 인허가 등의 취소 나. 신분·자격의 박탈 다. 법인이나 조합 등의 설립허가의 취소 ② 행정청이 처분을 할 때 다음 각 호의 어느 하나에 해당하는 경우에는 공청회를 개최한다.","cite":"행정절차법 제22조","badge":"","topic":"","from":"GY-2024-2-P-20","seq":null},{"id":"P-OX-082","subject":"경찰학","unit":"경찰행정법","stmt":"구 경찰법 이 국가경찰과 자치경찰의 조직 및 운영에 관한 법률 로 개정됨에 따라 자치경찰사무를 관장하게 하기 위하여 특별시장 광역시장 특별자치시장 도지사 특별자치도지사 소속 으로 시 도자치경찰위원회를 두었다. (22.2차)","answer":true,"quote":"① 자치경찰사무를 관장하게 하기 위하여 특별시장·광역시장·특별자치시장·도지사·특별자치도지사(이하 \"시·도지사\"라 한다) 소속으로 시·도자치경찰위원회를 둔다. 다만, 제13조 후단에 따라 시·도에 2개의 시·도경찰청을 두는 경우 시·도지사 소속으로 2개의 시·도자치경찰위원회를 둘 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제18조 제1항","badge":"","topic":"","from":"GY-2022-2-P-11","seq":null},{"id":"P-OX-096","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰관 직무집행법｣ 제6조 “경찰관은 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명･ 신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지할 수 있다” 규정은 행정상 즉시강제에 해당한다. (23.1차)","answer":true,"quote":"경찰관은 범죄행위가 목전(目前)에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명ㆍ신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지할 수 있다.","cite":"경찰관 직무집행법 제6조","badge":"","topic":"","from":"GY-2023-1-P-22","seq":null},{"id":"P-OX-163","subject":"경찰학","unit":"경찰행정법","stmt":"개인정보처리자는 개인정보의 처리 방법 및 종류 등에 따라 정보주체의 권리가 침해받을 가능성과 그 위험 정도를 고려하여 개인정보를 안전하게 관리하여야 한다. (25.1차)","answer":true,"quote":"④ 개인정보처리자는 개인정보의 처리 방법 및 종류 등에 따라 정보주체의 권리가 침해받을 가능성과 그 위험 정도를 고려하여 개인정보를 안전하게 관리하여야 한다.","cite":"개인정보 보호법 제3조 제4항","badge":"","topic":"","from":"GY-2025-1-P-23","seq":null},{"id":"P-OX-261","subject":"경찰학","unit":"경찰행정법","stmt":"경찰공무원은 구체적 사건수사와 관련된 상관의 지휘‧감독의 정당성에 대하여 이견이 있더라도 이의를 제기할 수 없다. (25.1차)","answer":false,"quote":"② 경찰공무원은 구체적 사건수사와 관련된 제1항의 지휘·감독의 적법성 또는 정당성에 대하여 이견이 있을 때에는 이의를 제기할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제6조 제2항","badge":"","topic":"","from":"GY-2025-1-P-16","seq":null},{"id":"P-OX-099","subject":"경찰학","unit":"경찰행정법","stmt":"당사자가 법 제18조 제1항에 따라 감경된 과태료를 납부한 경우에는 해당 질서위반행위에 대한 과태료 부과 및 징수절차는 종료한다. (23.1차)","answer":true,"quote":"② 당사자가 제1항에 따라 감경된 과태료를 납부한 경우에는 해당 질서위반행위에 대한 과태료 부과 및 징수절차는 종료한다.","cite":"질서위반행위규제법 제18조 제2항","badge":"","topic":"","from":"GY-2023-1-P-23","seq":null},{"id":"P-OX-168","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 신청에 구비서류의 미비 등 흠이 있는 경우에는 보완에 필요한 상당한 기간을 정하여 지체 없이 신청인에게 보완을 요구하여야 한다. (25.2차)","answer":true,"quote":"⑤ 행정청은 신청에 구비서류의 미비 등 흠이 있는 경우에는 보완에 필요한 상당한 기간을 정하여 지체 없이 신청인에게 보완을 요구하여야 한다.","cite":"행정절차법 제17조 제5항","badge":"","topic":"","from":"GY-2025-2-P-23","seq":null},{"id":"P-OX-221","subject":"경찰학","unit":"경찰행정법","stmt":"공익 또는 제3자의 이익을 현저히 해칠 우려가 있는 경우에도 행정청은 권한 행사의 기회가 있음에도 불구하고 장기간 권한을 행사하지 아니하여 국민이 그 권한이 행사되지 아니할 것으로 믿을 만한 정당한 사유가 있는 경우에는 그 권한을 행사해서는 아니 된다. (23.2차)","answer":false,"quote":"② 행정청은 권한 행사의 기회가 있음에도 불구하고 장기간 권한을 행사하지 아니하여 국민이 그 권한이 행사되지 아니할 것으로 믿을 만한 정당한 사유가 있는 경우에는 그 권한을 행사해서는 아니 된다. 다만, 공익 또는 제3자의 이익을 현저히 해칠 우려가 있는 경우는 예외로 한다.","cite":"행정기본법 제12조 제2항","badge":"","topic":"","from":"GY-2023-2-P-15","seq":null},{"id":"P-OX-241","subject":"경찰학","unit":"경찰행정법","stmt":"이의신청에 대한 결과를 통지받은 후 행정심판 또는 행정소송을 제기하려는 자는 그 결과를 통지받은 날부터 60일 이내에 행정심판 또는 행정소송을 제기하여야 한다. (24.1차)","answer":false,"quote":"이의신청 결과를 통지받은 날부터 90일 안에 행정심판이나 행정소송을 낼 수 있다.","cite":"행정기본법 제36조","badge":"","topic":"","from":"GY-2024-1-P-26","seq":null},{"id":"P-OX-087","subject":"경찰학","unit":"경찰행정법","stmt":"살아 있는 개인에 관한 정보로서 해당 정보만으로는 특정 개인을 알아볼 수 없더라도 다른 정보와 쉽게 결합하여 알아볼 수 있는 정보를 “개인정보”라 한다. (22.2차)","answer":true,"quote":"1. \"개인정보\"란 살아 있는 개인에 관한 정보로서 성명, 주민등록번호 및 영상 등을 통하여 개인을 알아볼 수 있는 정보(해당 정보만으로는 특정 개인을 알아볼 수 없더라도 다른 정보와 쉽게 결합하여 알아볼 수 있는 것을 포함한다)를 말한다.","cite":"개인정보 보호법 제2조","badge":"","topic":"","from":"GY-2022-2-P-21","seq":null},{"id":"P-OX-114","subject":"경찰학","unit":"경찰행정법","stmt":"국가수사본부장을 경찰청 외부를 대상으로 모집하여 임용하는 경우 정당의 당원이거나 당적을 이탈한 날부터 3년이 지나지 아니한 사람은 국가수사본부장이 될 수 없다. (23.2차)","answer":true,"quote":"⑦ 국가수사본부장을 경찰청 외부를 대상으로 모집하여 임용하는 경우 다음 각 호의 어느 하나에 해당하는 사람은 국가수사본부장이 될 수 없다. 1. 「경찰공무원법」 제8조제2항 각 호의 결격사유에 해당하는 사람 2. 정당의 당원이거나 당적을 이탈한 날부터 3년이 지나지 아니한 사람 3. 선거에 의하여 취임하는 공직에 있거나 그 공직에서 퇴직한 날부터 3년이 지나지 아니한 사람 4. 제6항제1호에 해당하는 공무원 또는 제6항제2호의 판사·검사의 직에서 퇴직한 날로부터 1년이 지나지 아니한 사람 5. 제6항제3호에 해당하는 사람으로서 국가기관등에서 퇴직한 날로부터 1년이 지나지 아니한 사람","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제16조 제7항","badge":"","topic":"","from":"GY-2023-2-P-18","seq":null},{"id":"P-OX-152","subject":"경찰학","unit":"경찰행정법","stmt":"생명･신체에 대한 침해와 물건의 멸실･훼손으로 인한 손해 외의 손해는 불법행위와 상당한 인과관계가 있는 범위에서 배상한다. (24.2차)","answer":true,"quote":"④ 생명·신체에 대한 침해와 물건의 멸실·훼손으로 인한 손해 외의 손해는 불법행위와 상당한 인과관계가 있는 범위에서 배상한다.","cite":"국가배상법 제3조 제4항","badge":"","topic":"","from":"GY-2024-2-P-28","seq":null},{"id":"P-OX-269","subject":"경찰학","unit":"경찰행정법","stmt":"송달은 우편 또는 정보통신망을 이용한 방법으로만 하되, 송달받을 자의 주소·거소·영업소·사무소 또는 전자우편주소로 한다. (25.1차)","answer":false,"quote":"① 송달은 우편, 교부 또는 정보통신망 이용 등의 방법으로 하되, 송달받을 자(대표자 또는 대리인을 포함한다. 이하 같다)의 주소·거소(居所)·영업소·사무소 또는 전자우편주소(이하 \"주소등\"이라 한다)로 한다. 다만, 송달받을 자가 동의하는 경우에는 그를 만나는 장소에서 송달할 수 있다. ② 교부에 의한 송달은 수령확인서를 받고 문서를 교부함으로써 하며, 송달하는 장소에서 송달받을 자를 만나지 못한 경우에는 그 사무원·피용자(被用者) 또는 동거인으로서 사리를 분별할 지능이 있는 사람에게 문서를 교부할 수 있다. ③ 정보통신망을 이용한 송달은 송달받을 자가 동의하는 경우에만 한다. 이 경우 송달받을 자는 송달받을 전자우편주소 등을 지정하여야 한다. ④ 다음 각 호의 어느 하나에 해당하는 경우에는 송달받을 자가 알기 쉽도록 관보, 공보, 게시판, 일간신문 중 하나 이상에 공고하고 인터넷에도 공고하여야 한다.","cite":"행정절차법 제14조 제1항","badge":"","topic":"","from":"GY-2025-1-P-24","seq":null},{"id":"P-OX-243","subject":"경찰학","unit":"경찰행정법","stmt":"재판장은 법정에서의 질서유지를 위하여 필요하다고 인정할 때에는 개정 전에 한하여 관할 경찰서장에게 경찰공무원의 파견을 요구할 수 있다. (24.2차)","answer":false,"quote":"① 재판장은 법정에서의 질서유지를 위하여 필요하다고 인정할 때에는 개정 전후에 상관없이 관할 경찰서장에게 국가경찰공무원의 파견을 요구할 수 있다.","cite":"법원조직법 제60조 제1항","badge":"","topic":"","from":"GY-2024-2-P-06","seq":null},{"id":"P-OX-148","subject":"경찰학","unit":"경찰행정법","stmt":"법률에 따르지 아니하고는 어떤 행위도 질서위반행위로 과태료를 부과하지 아니한다. (24.2차)","answer":true,"quote":"법률에 따르지 아니하고는 어떤 행위도 질서위반행위로 과태료를 부과하지 아니한다.","cite":"질서위반행위규제법 제6조","badge":"","topic":"","from":"GY-2024-2-P-22","seq":null},{"id":"P-OX-270","subject":"경찰학","unit":"경찰행정법","stmt":"행정심판위원회는 사정재결을 할 때에는 청구인에 대하여 상당한 구제방법을 취하거나 상당한 구제방법을 취할 것을 청구인과 피청구인에게 명한다. (25.1차)","answer":false,"quote":"② 위원회는 제1항에 따른 재결을 할 때에는 청구인에 대하여 상당한 구제방법을 취하거나 상당한 구제방법을 취할 것을 피청구인에게 명할 수 있다.","cite":"행정심판법 제44조 제2항","badge":"","topic":"","from":"GY-2025-1-P-25","seq":null},{"id":"P-OX-156","subject":"경찰학","unit":"경찰행정법","stmt":"시‧도자치경찰위원회는 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임으로 하고, 5명의 위원은 비상임으로 한다. (25.1차)","answer":true,"quote":"① 시·도자치경찰위원회는 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임으로 하고, 5명의 위원은 비상임으로 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제19조 제1항","badge":"","topic":"","from":"GY-2025-1-P-15","seq":null},{"id":"P-OX-205","subject":"경찰학","unit":"경찰행정법","stmt":"행정조사기본법 상 조사대상자의 자발적 협조를 얻어 조사를 실시하는 경우에는 법령의 근거를 요하지 아니하며 조직법상의 권한 범위 밖에서도 가능하다. (22.2차)","answer":false,"quote":"자발적 협조를 얻는 조사는 법령 근거가 없어도 되지만, 그 기관의 조직법상 권한 범위 안에서만 할 수 있다.","cite":"행정조사기본법 제5조","badge":"","topic":"","from":"GY-2022-2-P-18","seq":null},{"id":"P-OX-089","subject":"경찰학","unit":"경찰행정법","stmt":"시 도자치경찰위원회는 자치경찰사무 담당 경찰공무원에 대한 징계를 요구할 수 있다. (22.2차)","answer":true,"quote":"시·도자치경찰위원회는 자치경찰사무 담당 공무원의 주요 비위에 대한 감찰요구와 함께 징계요구를 할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제24조","badge":"","topic":"","from":"GY-2022-2-P-32","seq":null},{"id":"P-OX-140","subject":"경찰학","unit":"경찰행정법","stmt":"사물관할이란 경찰이 처리할 수 있고 처리해야 하는 사무내용의 범위를 말하는 것으로 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣과 ｢경찰관 직무집행법｣에 규정되어 있다. (24.2차)","answer":true,"quote":"사물관할은 경찰이 처리할 사무의 범위로, 경찰의 임무를 정한 조문과 경찰관의 직무 범위를 정한 조문에 규정되어 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제3조 · 경찰관 직무집행법 제2조","badge":"","topic":"","from":"GY-2024-2-P-06","seq":null},{"id":"P-OX-166","subject":"경찰학","unit":"경찰행정법","stmt":"｢행정기본법｣ 제1조(목적)를 통하여 경영주의를 도출할 수 있다. (25.2차)","answer":true,"quote":"행정기본법 제1조가 행정의 적정성과 효율성 향상을 목적으로 들고 있어, 효율성을 중시하는 경영주의를 이끌어 낼 수 있다.","cite":"행정기본법 제1조","badge":"","topic":"","from":"GY-2025-2-P-05","seq":null},{"id":"P-OX-144","subject":"경찰학","unit":"경찰행정법","stmt":"정보의 공개를 청구하는 자는 해당 정보를 보유하거나 관리하고 있는 공공기관에 정보공개 청구서를 제출하거나 말로써 정보의 공개를 청구할 수 있다. (24.2차)","answer":true,"quote":"① 정보의 공개를 청구하는 자(이하 \"청구인\"이라 한다)는 해당 정보를 보유하거나 관리하고 있는 공공기관에 다음 각 호의 사항을 적은 정보공개 청구서를 제출하거나 말로써 정보의 공개를 청구할 수 있다. 1. 청구인의 성명·주민등록번호·주소 및 연락처(전화번호·전자우편주소 등을 말한다) 2. 공개를 청구하는 정보의 내용 및 공개방법","cite":"공공기관의 정보공개에 관한 법률 제10조 제1항","badge":"","topic":"","from":"GY-2024-2-P-21","seq":null},{"id":"P-OX-239","subject":"경찰학","unit":"경찰행정법","stmt":"직무를 수행한 공무원의 성명･직위 등 ｢개인정보 보호법｣ 제2조 제1호에 따른 개인정보로서 공개될 경우 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보는 공개하지 않을 수 있다. (24.1차)","answer":false,"quote":"① 공공기관이 보유·관리하는 정보는 공개 대상이 된다. 다만, 다음 각 호의 어느 하나에 해당하는 정보는 공개하지 아니할 수 있다. 1. 다른 법률 또는 법률에서 위임한 명령(국회규칙·대법원규칙·헌법재판소규칙·중앙선거관리위원회규칙·대통령령 및 조례로 한정한다)에 따라 비밀이나 비공개 사항으로 규정된 정보 2. 국가안전보장·국방·통일·외교관계 등에 관한 사항으로서 공개될 경우 국가의 중대한 이익을 현저히 해칠 우려가 있다고 인정되는 정보 3. 공개될 경우 국민의 생명·신체 및 재산의 보호에 현저한 지장을 초래할 우려가 있다고 인정되는 정보 4. 진행 중인 재판에 관련된 정보와 범죄의 예방, 수사, 공소의 제기 및 유지, 형의 집행, 교정(矯正), 보안처분에 관한 사항으로서 공개될 경우 그 직무수행을 현저히 곤란하게 하거나 형사피고인의 공정한 재판을 받을 권리를 침해한다고 인정할 만한 상당한 이유가 있는 정보 5. 감사·감독·검사·시험·규제·입찰계약·기술개발·인사관리에 관한 사항이나 의사결정 과정 또는 내부검토 과정에 있는 사항 등으로서 공개될 경우 업무의 공정한 수행이나 연구·개발에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 정보. 다만, 의사결정 과정 또는 내부검토 과정을 이유로 비공개할 경우에는 의사결정 과정 및 내부검토 과정이 종료되면 제10조에 따른 청구인에게 이를 통지하여야 한다. 6. 해당 정보에 포함되어 있는 성명·주민등록번호 등 개인에 관한 사항으로서 공개될 경우 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보. 다만, 다음 각 목에 열거한 개인에 관한 정보는 제외한다. 가. 법령에서 정하는 바에 따라 열람할 수 있는 정보 나. 공공기관이 공표를 목적으로 작성하거나 취득한 정보로서 사생활의 비밀 또는 자유를 부당하게 침해하지 아니하는 정보 다. 공공기관이 작성하거나 취득한 정보로서 공개하는 것이 공익이나 개인의 권리 구제를 위하여 필요하다고 인정되는 정보 라. 직무를 수행한 공무원의 성명·직위 마. 공개하는 것이 공익을 위하여 필요한 경우로서 법령에 따라 국가 또는 지방자치단체가 업무의 일부를 위탁 또는 위촉한 개인의 성명·직업 7. 법인·단체 또는 개인(이하 \"법인등\"이라 한다)의 경영상·영업상 비밀에 관한 사항으로서 공개될 경우 법인등의 정당한 이익을 현저히 해칠 우려가 있다고 인정되는 정보. 다만, 다음 각 목에 열거한 정보는 제외한다. 가. 사업활동에 의하여 발생하는 위해(危害)로부터 사람의 생명·신체 또는 건강을 보호하기 위하여 공개할 필요가 있는 정보 나. 위법·부당한 사업활동으로부터 국민의 재산 또는 생활을 보호하기 위하여 공개할 필요가 있는 정보 8. 공개될 경우 부동산 투기, 매점매석 등으로 특정인에게 이익 또는 불이익을 줄 우려가 있다고 인정되는 정보","cite":"공공기관의 정보공개에 관한 법률 제9조 제1항","badge":"","topic":"","from":"GY-2024-1-P-23","seq":null},{"id":"P-OX-113","subject":"경찰학","unit":"경찰행정법","stmt":"국가수사본부장은 치안정감으로 보한다. (23.2차)","answer":true,"quote":"① 경찰청에 국가수사본부를 두며, 국가수사본부장은 치안정감으로 보한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제16조 제1항","badge":"","topic":"","from":"GY-2023-2-P-18","seq":null},{"id":"P-OX-281","subject":"경찰학","unit":"경찰행정법","stmt":"시‧도자치경찰위원회 위원의 임기는 3년이며, 국가경찰위원회 위원장이 임명한다. (26.1차)","answer":false,"quote":"시·도자치경찰위원회 위원 임기는 3년이 맞지만, 임명권자는 국가경찰위원회 위원장이 아니라 시·도지사다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제20조","badge":"","topic":"","from":"GY-2026-1-P-20","seq":null},{"id":"P-OX-171","subject":"경찰학","unit":"경찰행정법","stmt":"음주운전으로 적발된 주취운전자가 도로 밖으로 차량을 이동 하겠다며 단속경찰관으로부터 보관중이던 차량열쇠를 반환받아 몰래 차량을 운전하여 가던 중 사고를 일으킨 경우, 국가배상 책임을 인정한다. (25.2차)","answer":true,"quote":"음주운전으로 적발된 주취운전자가 도로 밖으로 차량을 이동하겠다며 단속경찰관으로부터 보관중이던 차량열쇠를 반환받아 몰래 차량을 운전하여 가던 중 사고를 일으킨 경우, 국가배상책임을 인정한 사례.","cite":"대법원 97다54482","badge":"","topic":"","from":"GY-2025-2-P-26","seq":null},{"id":"P-OX-210","subject":"경찰학","unit":"경찰행정법","stmt":"부관은 해당 처분의 목적에 위배되지 아니하고, 실질적 관련이 없을 것을 요건으로 한다. (23.1차)","answer":false,"quote":"부관은 처분 목적에 위배되지 않고, 처분과 실질적 관련이 있으며, 필요한 최소한이어야 한다.","cite":"행정기본법 제17조","badge":"","topic":"","from":"GY-2023-1-P-21","seq":null},{"id":"P-OX-203","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관 직무집행법 상 경찰관의 제지 조치의 위법 여부는 사후적으로 순수한 객관적 기준에서 판단해야 하고 제지 조치 당시의 구체적 상황을 기초로 판단하는 것은 아니다. (22.2차)","answer":false,"quote":"다만 경찰관의 제지 조치가 적법한지는 제지 조치 당시의 구체적 상황을 기초로 판단하여야 하고 사후적으로 순수한 객관적 기준에서 판단할 것은 아니다.","cite":"대법원 2016도19417","badge":"","topic":"","from":"GY-2022-2-P-16","seq":null},{"id":"P-OX-211","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰관 직무집행법｣ 제4조 제1항 제1호에서 규정하는 술에 취한 상태로 인하여 자기 또는 타인의 생명･신체와 재산에 위해를 미칠 우려가 있는 피구호자에 대한 보호조치는 행정상 강제 집행에 해당한다. (23.1차)","answer":false,"quote":"술 취한 사람의 보호조치도 앞선 의무 없이 곧바로 하는 즉시강제이고, 강제집행은 부과된 의무의 불이행을 전제로 한다.","cite":"경찰관 직무집행법 제4조 · 행정기본법 제30조","badge":"","topic":"","from":"GY-2023-1-P-22","seq":null},{"id":"P-OX-190","subject":"경찰학","unit":"경찰행정법","stmt":"공무원이 아닌 위원에 대해서는 국가공무원법 제55조 및 제57조를 준용한다. (22.1차)","answer":false,"quote":"⑤ 공무원이 아닌 위원에 대해서는 「지방공무원법」 제52조 및 제57조를 준용한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제20조 제5항","badge":"","topic":"","from":"GY-2022-1-P-27","seq":null},{"id":"P-OX-247","subject":"경찰학","unit":"경찰행정법","stmt":"행정청에 처분을 구하는 신청은 구두 또는 문서로 하여야 한다. 다만, 다른 법령등에 특별한 규정이 있는 경우와 행정청이 미리 다른 방법을 정한 경우에는 그러하지 아니하다. (24.2차)","answer":false,"quote":"① 행정청에 처분을 구하는 신청은 문서로 하여야 한다. 다만, 다른 법령등에 특별한 규정이 있는 경우와 행정청이 미리 다른 방법을 정하여 공시한 경우에는 그러하지 아니하다.","cite":"행정절차법 제17조 제1항","badge":"","topic":"","from":"GY-2024-2-P-20","seq":null},{"id":"P-OX-112","subject":"경찰학","unit":"경찰행정법","stmt":"국립 교육대학 학생에 대한 퇴학처분은 행정처분이다. (23.2차)","answer":true,"quote":"행정소송의 대상이 되는 행정처분이란 행정청이 행하는 구체적 사실에 관한 법집행으로서의 공권력의 행사 또는 그 거부와 그 밖에 이에 준하는 행정작용을 말하는 것인바, 국립 교육대학 학생에 대한 퇴학처분은, 국가가 설립·경영하는 교육기관인 동 대학의 교무를 통할하고 학생을 지도하는 지위에 있는 학장이 교육목적실현과 학교의 내부질서유지를 위해 학칙 위반자인 재학생에 대한 구체적 법집행으로서 국가공권력의 하나인 징계권을 발동하여 학생으로서의 신분을 일방적으로 박탈하는 국가의 교육행정에 관한 의사를 외부에 표시한 것이므로, 행정처분임이 명백하다.","cite":"대법원 91누2144","badge":"","topic":"","from":"GY-2023-2-P-17","seq":null},{"id":"P-OX-273","subject":"경찰학","unit":"경찰행정법","stmt":"보상금심사위원회 위원의 과반수는 경찰관이 아닌 사람으로 해야 한다. (25.2차)","answer":false,"quote":"보상금심사위원회는 위원장 포함 5명 이내를 소속 경찰공무원 중에서 임명하며, 위원 과반수를 경찰관이 아닌 사람으로 하는 것은 손실보상심의위원회다.","cite":"경찰관 직무집행법 제11조의3","badge":"","topic":"","from":"GY-2025-2-P-21","seq":null},{"id":"P-OX-260","subject":"경찰학","unit":"경찰행정법","stmt":"시‧도자치경찰위원회의 위원장은 재의요구를 받은 날부터 7일 이내에 회의를 소집하여 재의결하여야 한다. 이 경우 재적위원 과반수의 출석과 출석위원 과반수 이상의 찬성으로 전과 같은 의결을 하면 그 의결사항은 확정된다. (25.1차)","answer":false,"quote":"⑤ 시·도자치경찰위원회의 위원장은 재의요구를 받은 날부터 7일 이내에 회의를 소집하여 재의결하여야 한다. 이 경우 재적위원 과반수의 출석과 출석위원 3분의 2 이상의 찬성으로 전과 같은 의결을 하면 그 의결사항은 확정된다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제25조 제5항","badge":"","topic":"","from":"GY-2025-1-P-15","seq":null},{"id":"P-OX-192","subject":"경찰학","unit":"경찰행정법","stmt":"공공기관은 부득이한 사유로 공공기관의 정보공개에 관한 법률 제11조 제1항에 따른 기간 이내에 공개 여부를 결정할 수 없을 때에는 그 기간이 끝난 날부터 기산하여 10일의 범위에서 공개 여부 결정기간을 연장할 수 있다. 이 경우 공공기관은 연장된 사실과 연장 사유를 청구인에게 지체 없이 구두로 통지하여야 한다. (22.1차)","answer":false,"quote":"② 공공기관은 부득이한 사유로 제1항에 따른 기간 이내에 공개 여부를 결정할 수 없을 때에는 그 기간이 끝나는 날의 다음 날부터 기산(起算)하여 10일의 범위에서 공개 여부 결정기간을 연장할 수 있다. 이 경우 공공기관은 연장된 사실과 연장 사유를 청구인에게 지체 없이 문서로 통지하여야 한다.","cite":"공공기관의 정보공개에 관한 법률 제11조 제2항","badge":"","topic":"","from":"GY-2022-1-P-29","seq":null},{"id":"P-OX-271","subject":"경찰학","unit":"경찰행정법","stmt":"경찰청장 또는 해양경찰청장은 경찰공무원의 신규채용시험에서 대통령령으로 정하는 부정행위를 한 사람에 대하여 부정행위자에 대한 제재로서 해당 시험의 정지‧무효 또는 합격 취소 처분을 할 때에는 미리 그 처분의 내용과 사유를 당사자에게 통지하여 소명할 기회를 주어야 한다. (25.1차)","answer":false,"quote":"부정행위자 처분 가운데 시험의 정지는 사전통지·소명 기회 대상에서 빠지고, 무효·합격 취소만 미리 알려 소명할 기회를 준다.","cite":"경찰공무원법 제11조","badge":"","topic":"","from":"GY-2025-1-P-29","seq":null},{"id":"P-OX-215","subject":"경찰학","unit":"경찰행정법","stmt":"위원회는 지체 없이 당사자에게 재결서의 등본을 송달하여야 하며, 재결서가 청구인에게 발송되었을 때에 그 효력이 생긴다. (23.1차)","answer":false,"quote":"당사자에게는 재결서 정본을 송달하고, 재결은 청구인에게 송달되었을 때 효력이 생긴다 — 등본은 참가인에게 보낸다.","cite":"행정심판법 제48조","badge":"","topic":"","from":"GY-2023-1-P-26","seq":null},{"id":"P-OX-128","subject":"경찰학","unit":"경찰행정법","stmt":"경찰행정상 즉시강제는 눈앞의 급박한 경찰상 장해를 제거하여야 할 필요가 있고 의무를 명할 시간적 여유가 없거나 의무를 명하는 방법으로는 그 목적을 달성하기 어려운 상황에서 의무불이행을 전제로 하지 않고 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 권력적 사실행위이다. (24.1차)","answer":true,"quote":"위 조항 중 경찰관의 제지에 관한 부분은 범죄 예방을 위한 경찰 행정상 즉시강제, 즉 눈앞의 급박한 경찰상 장해를 제거할 필요가 있고 의무를 명할 시간적 여유가 없거나 의무를 명하는 방법으로는 그 목적을 달성하기 어려운 상황에서 의무불이행을 전제로 하지 않고 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 권력적 사실행위에 관한 근거조항이다.","cite":"대법원 2016도19417","badge":"","topic":"","from":"GY-2024-1-P-20","seq":null},{"id":"P-OX-217","subject":"경찰학","unit":"경찰행정법","stmt":"구호대상자를 경찰관서에서 보호하는 기간은 48시간을 초과할 수 없고, 물건을 공공보건의료기관이나 공공구호기관에 임시로 영치하는 기간은 10일을 초과할 수 없다. (23.1차)","answer":false,"quote":"경찰관서 보호는 24시간, 물건의 임시 영치는 10일을 넘을 수 없고, 영치하는 곳도 의료·구호기관이 아닌 경찰관서다.","cite":"경찰관 직무집행법 제4조","badge":"","topic":"","from":"GY-2023-1-P-27","seq":null},{"id":"P-OX-244","subject":"경찰학","unit":"경찰행정법","stmt":"기한은 법률행위 효력의 발생 또는 소멸을 장래의 불확실한 사실의 성부에 의존하게 하는 법률행위의 부관이다. (24.2차)","answer":false,"quote":"조건은 법률행위 효력의 발생 또는 소멸을 장래의 불확실한 사실의 성부에 의존하게 하는 법률행위의 부관이다.","cite":"대법원 2018다201702","badge":"","topic":"","from":"GY-2024-2-P-19","seq":null},{"id":"P-OX-167","subject":"경찰학","unit":"경찰행정법","stmt":"경찰청장, 해양경찰청장, 시‧도경찰청장, 지방해양경찰청장, 경찰서장 또는 해양경찰서장은 보상금심사위원회의 심사‧의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수한다. (25.2차)","answer":true,"quote":"⑤ 경찰청장, 시ㆍ도경찰청장 또는 경찰서장은 제2항에 따른 보상금심사위원회의 심사ㆍ의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수한다.","cite":"경찰관 직무집행법 제11조의3 제5항","badge":"","topic":"","from":"GY-2025-2-P-21","seq":null},{"id":"P-OX-277","subject":"경찰학","unit":"경찰행정법","stmt":"고위공직자는 그 직위에 임용되거나 임기를 개시하기 전 3년 이내에 민간 부문에서 업무활동을 한 경우, 그 활동내역을 그 직위에 임용되거나 임기를 개시한 날부터 30일 이내에 소속부서장에게 제출하여야 한다. (26.1차)","answer":false,"quote":"임용 전 3년 안의 민간 업무활동 내역은 임용·임기 개시일부터 30일 안에 소속부서장이 아니라 소속기관장에게 낸다.","cite":"공직자의 이해충돌 방지법 제8조","badge":"","topic":"","from":"GY-2026-1-P-07","seq":null},{"id":"P-OX-110","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 법률로 정하는 바에 따라 완전히 자동화된 시스템 (인공지능 기술을 적용한 시스템을 포함)으로 처분을 할 수 있으나, 처분에 재량이 있는 경우는 그러하지 아니하다. (23.2차)","answer":true,"quote":"행정청은 법률로 정하는 바에 따라 완전히 자동화된 시스템(인공지능 기술을 적용한 시스템을 포함한다)으로 처분을 할 수 있다. 다만, 처분에 재량이 있는 경우는 그러하지 아니하다.","cite":"행정기본법 제20조","badge":"","topic":"","from":"GY-2023-2-P-15","seq":null},{"id":"P-OX-174","subject":"경찰학","unit":"경찰행정법","stmt":"국민권익위원회는 이 법에 따른 부정청탁 등에 관한 유형, 판단기준 및 그 예방 조치 등에 관한 기준의 작성 및 보급 업무를 관장한다. (26.1차)","answer":true,"quote":"국민권익위원회는 이 법에 따른 다음 각 호의 사항에 관한 업무를 관장한다. 1. 부정청탁의 금지 및 금품등의 수수 금지·제한 등에 관한 제도개선 및 교육·홍보계획의 수립 및 시행 2. 부정청탁 등에 관한 유형, 판단기준 및 그 예방 조치 등에 관한 기준의 작성 및 보급 3. 부정청탁 등에 대한 신고 등의 안내·상담·접수·처리 등 4. 신고자 등에 대한 보호 및 보상 5. 제1호부터 제4호까지의 업무 수행에 필요한 실태조사 및 자료의 수집·관리·분석 등","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제12조","badge":"","topic":"","from":"GY-2026-1-P-06","seq":null},{"id":"P-OX-236","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 범죄･재난･공공갈등 등 공공안녕과 공공질서에 대한 위험의 예방과 대응을 위한 정보의 수집･작성･배포와 이에 수반되는 사실의 확인을 할 수 있다. (24.1차)","answer":false,"quote":"① 경찰관은 범죄ㆍ재난ㆍ공공갈등 등 공공안녕에 대한 위험의 예방과 대응을 위한 정보의 수집ㆍ작성ㆍ배포와 이에 수반되는 사실의 확인을 할 수 있다.","cite":"경찰관 직무집행법 제8조의2 제1항","badge":"","topic":"","from":"GY-2024-1-P-19","seq":null},{"id":"P-OX-066","subject":"경찰학","unit":"경찰행정법","stmt":"위원 중 1명은 인권문제에 관하여 전문적인 지식과 경험이 있는 사람이 임명될 수 있도록 노력하여야 한다. (22.1차)","answer":true,"quote":"③ 위원 중 1명은 인권문제에 관하여 전문적인 지식과 경험이 있는 사람이 임명될 수 있도록 노력하여야 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제19조 제3항","badge":"","topic":"","from":"GY-2022-1-P-27","seq":null},{"id":"P-OX-097","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 당사자가 납부기한까지 과태료를 납부하지 아니한 때에는 납부기한을 경과한 날부터 체납된 과태료에 대하여 100분의 3에 상당하는 가산금을 징수한다. (23.1차)","answer":true,"quote":"① 행정청은 당사자가 납부기한까지 과태료를 납부하지 아니한 때에는 납부기한을 경과한 날부터 체납된 과태료에 대하여 100분의 5에 상당하는 가산금을 징수한다.","cite":"질서위반행위규제법 제24조 제1항","badge":"","topic":"","from":"GY-2023-1-P-23","seq":null},{"id":"P-OX-111","subject":"경찰학","unit":"경찰행정법","stmt":"원천징수의무자가 비록 과세관청과 같은 행정청이라 하더라도 그의 원천징수행위는 법령에서 규정된 징수 및 납부의무를 이행하기 위한 것에 불과한 것이지, 공권력의 행사로서의 행정 처분을 한 경우에 해당되지 아니한다. (23.2차)","answer":true,"quote":"원천징수하는 소득세에 있어서는 납세의무자의 신고나 과세관청의 부과결정이 없이 법령이 정하는 바에 따라 그 세액이 자동적으로 확정되고, 원천징수의무자는 소득세법 제142조 및 제143조 의 규정에 의하여 이와 같이 자동적으로 확정되는 세액을 수급자로부터 징수하여 과세관청에 납부하여야 할 의무를 부담하고 있으므로, 원천징수의무자가 비록 과세관청과 같은 행정청이더라도 그의 원천징수행위는 법령에서 규정된 징수 및 납부의무를 이행하기 위한 것에 불과한 것이지, 공권력의 행사로서의 행정처분을 한 경우에 해당되지 아니한다.","cite":"대법원 89누4789","badge":"","topic":"","from":"GY-2023-2-P-17","seq":null},{"id":"P-OX-121","subject":"경찰학","unit":"경찰행정법","stmt":"대통령의 처분 또는 부작위에 대하여는 다른 법률에서 행정심판을 청구할 수 있도록 정한 경우 외에는 행정심판을 청구할 수 없다. (23.2차)","answer":true,"quote":"② 대통령의 처분 또는 부작위에 대하여는 다른 법률에서 행정심판을 청구할 수 있도록 정한 경우 외에는 행정심판을 청구할 수 없다.","cite":"행정심판법 제3조 제2항","badge":"","topic":"","from":"GY-2023-2-P-26","seq":null},{"id":"P-OX-117","subject":"경찰학","unit":"경찰행정법","stmt":"경찰서장이 범칙행위에 대하여 통고처분을 한 이상 통고처분에서 정한 범칙금 납부기간까지는 원칙적으로 경찰서장은 즉결심판을 청구할 수 없다. (23.2차)","answer":true,"quote":"따라서 경찰서장이 범칙행위에 대하여 통고처분을 한 이상, 범칙자의 위와 같은 절차적 지위를 보장하기 위하여 통고처분에서 정한 범칙금 납부기간까지는 원칙적으로 경찰서장은 즉결심판을 청구할 수 없고, 검사도 동일한 범칙행위에 대하여 공소를 제기할 수 없다고 보아야 한다.","cite":"대법원 2017도13409","badge":"","topic":"","from":"GY-2023-2-P-22","seq":null},{"id":"P-OX-101","subject":"경찰학","unit":"경찰행정법","stmt":"공공기관은 부득이한 사유로 법 제11조 제1항에 따른 기간 이내에 공개 여부를 결정할 수 없을 때에는 그 기간이 끝나는 날의 다음 날부터 기산(起算)하여 10일의 범위에서 공개 여부 결정 기간을 연장할 수 있다. 이 경우 공공기관은 연장된 사실과 연장 사유를 청구인에게 지체 없이 문서로 통지하여야 한다. (23.1차)","answer":true,"quote":"② 공공기관은 부득이한 사유로 제1항에 따른 기간 이내에 공개 여부를 결정할 수 없을 때에는 그 기간이 끝나는 날의 다음 날부터 기산(起算)하여 10일의 범위에서 공개 여부 결정기간을 연장할 수 있다. 이 경우 공공기관은 연장된 사실과 연장 사유를 청구인에게 지체 없이 문서로 통지하여야 한다.","cite":"공공기관의 정보공개에 관한 법률 제11조 제2항","badge":"","topic":"","from":"GY-2023-1-P-24","seq":null},{"id":"P-OX-092","subject":"경찰학","unit":"경찰행정법","stmt":"임용권자는 제1항 제2호에 따라 직위해제된 자에게 3개월의 범위에서 대기를 명한다. (23.1차)","answer":true,"quote":"③ 임용권자는 제1항제2호에 따라 직위해제된 자에게 3개월의 범위에서 대기를 명한다. <개정 2008.3.28.>","cite":"국가공무원법 제73조의3 제3항","badge":"","topic":"","from":"GY-2023-1-P-17","seq":null},{"id":"P-OX-070","subject":"경찰학","unit":"경찰행정법","stmt":"행정지도는 그 목적 달성에 필요한 최소한도에 그쳐야 하며, 행정지도의 상대방의 의사에 반하여 부당하게 강요하여서는 아니 된다. (22.1차)","answer":true,"quote":"① 행정지도는 그 목적 달성에 필요한 최소한도에 그쳐야 하며, 행정지도의 상대방의 의사에 반하여 부당하게 강요하여서는 아니 된다.","cite":"행정절차법 제48조 제1항","badge":"","topic":"","from":"GY-2022-1-P-30","seq":null},{"id":"P-OX-080","subject":"경찰학","unit":"경찰행정법","stmt":"경찰의 직에서 퇴직한 날로부터 3년이 지나지 아니한 사람은 위원이 될 수 없다. (22.2차)","answer":true,"quote":"⑤ 다음 각 호의 어느 하나에 해당하는 사람은 위원이 될 수 없으며, 위원이 다음 각 호의 어느 하나에 해당하는 경우에는 당연퇴직한다. 1. 정당의 당원이거나 당적을 이탈한 날부터 3년이 지나지 아니한 사람 2. 선거에 의하여 취임하는 공직에 있거나 그 공직에서 퇴직한 날부터 3년이 지나지 아니한 사람 3. 경찰, 검찰, 국가정보원 직원 또는 군인의 직에 있거나 그 직에서 퇴직한 날부터 3년이 지나지 아니한 사람 4. 「국가공무원법」 제33조 각 호의 어느 하나에 해당하는 사람. 다만, 「국가공무원법」 제33조제2호 및 제5호에 해당하는 경우에는 같은 법 제69조제1호 단서에 따른다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제8조 제5항","badge":"","topic":"","from":"GY-2022-2-P-03","seq":null},{"id":"P-OX-073","subject":"경찰학","unit":"경찰행정법","stmt":"행정청의 과태료 처분이나 법원의 과태료 재판이 확정된 후 법률이 변경되어 그 행위가 질서위반행위에 해당하지 아니하게 된 때에는 변경된 법률에 특별한 규정이 없는 한 과태료의 징수 또는 집행을 면제한다. (22.1차)","answer":true,"quote":"③ 행정청의 과태료 처분이나 법원의 과태료 재판이 확정된 후 법률이 변경되어 그 행위가 질서위반행위에 해당하지 아니하게 된 때에는 변경된 법률에 특별한 규정이 없는 한 과태료의 징수 또는 집행을 면제한다.","cite":"질서위반행위규제법 제3조 제3항","badge":"","topic":"","from":"GY-2022-1-P-31","seq":null},{"id":"P-OX-158","subject":"경찰학","unit":"경찰행정법","stmt":"경찰공무원은 상관의 지휘‧감독을 받아 직무를 수행하고, 그 직무수행에 관하여 서로 협력하여야 한다. (25.1차)","answer":true,"quote":"① 경찰공무원은 상관의 지휘·감독을 받아 직무를 수행하고, 그 직무수행에 관하여 서로 협력하여야 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제6조 제1항","badge":"","topic":"","from":"GY-2025-1-P-16","seq":null},{"id":"P-OX-220","subject":"경찰학","unit":"경찰행정법","stmt":"시･도자치경찰위원회 위원장과 위원의 임기는 3년으로 하되, 위원만 한 차례 연임할 수 있다. (23.2차)","answer":false,"quote":"① 시·도자치경찰위원회 위원장과 위원의 임기는 3년으로 하며, 연임할 수 없다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제23조 제1항","badge":"","topic":"","from":"GY-2023-2-P-03","seq":null},{"id":"P-OX-193","subject":"경찰학","unit":"경찰행정법","stmt":"정보의 공개 및 우송 등에 드는 비용은 실비의 범위에서 공공 기관이 부담한다. (22.1차)","answer":false,"quote":"① 정보의 공개 및 우송 등에 드는 비용은 실비(實費)의 범위에서 청구인이 부담한다.","cite":"공공기관의 정보공개에 관한 법률 제17조 제1항","badge":"","topic":"","from":"GY-2022-1-P-29","seq":null},{"id":"P-OX-230","subject":"경찰학","unit":"경찰행정법","stmt":"“익명처리”란 개인정보의 전부를 삭제하거나 일부를 대체하는 등의 방법으로 추가 정보가 없이는 특정 개인을 알아볼 수 없도록 처리하는 것을 말한다. (23.2차)","answer":false,"quote":"추가 정보 없이는 특정 개인을 알아볼 수 없게 처리하는 것은 가명처리이고, 방법도 개인정보 일부 삭제나 일부·전부 대체다.","cite":"개인정보 보호법 제2조","badge":"","topic":"","from":"GY-2023-2-P-25","seq":null},{"id":"P-OX-088","subject":"경찰학","unit":"경찰행정법","stmt":"일정한 공간에 지속적으로 설치되어 사람 또는 사물의 영상 등을 촬영하거나 이를 유 무선망을 통하여 전송하는 장치로서 네트워크 카메라와 같은 장치를 “영상정보처리기기”라 한다. (22.2차)","answer":true,"quote":"7. \"영상정보처리기기\"란 일정한 공간에 지속적으로 설치되어 사람 또는 사물의 영상 등을 촬영하거나 이를 유·무선망을 통하여 전송하는 장치로서 대통령령으로 정하는 장치를 말한다.","cite":"개인정보 보호법 제2조","badge":"","topic":"","from":"GY-2022-2-P-21","seq":null},{"id":"P-OX-285","subject":"경찰학","unit":"경찰행정법","stmt":"그 정상을 참작하여 형을 감경 하거나 면제하여야 한다. (26.1차)","answer":false,"quote":"다음 각 호의 범죄가 행하여지려고 하거나 행하여지고 있어 타인의 생명ㆍ신체에 대한 위해 발생의 우려가 명백하고 긴급한 상황에서, 경찰관이 그 위해를 예방하거나 진압하기 위한 행위 또는 범인의 검거 과정에서 경찰관을 향한 직접적인 유형력 행사에 대응하는 행위를 하여 그로 인하여 타인에게 피해가 발생한 경우, 그 경찰관의 직무수행이 불가피한 것이고 필요한 최소한의 범위에서 이루어졌으며 해당 경찰관에게 고의 또는 중대한 과실이 없는 때에는 그 정상을 참작하여 형을 감경하거나 면제할 수 있다. 1. 「형법」 제2편제24장 살인의 죄, 제25장 상해와 폭행의 죄, 제32장 강간과 추행의 죄 중 강간에 관한 범죄, 제38장 절도와 강도의 죄 중 강도에 관한 범죄 및 이에 대하여 다른 법률에 따라 가중처벌하는 범죄 2. 「가정폭력범죄의 처벌 등에 관한 특례법」에 따른 가정폭력범죄, 「아동학대범죄의 처벌 등에 관한 특례법」에 따른 아동학대범죄","cite":"경찰관 직무집행법 제11조의5","badge":"","topic":"","from":"GY-2026-1-P-27","seq":null},{"id":"P-OX-201","subject":"경찰학","unit":"경찰행정법","stmt":"경찰공무원 임용 당시 임용결격사유가 있었더라도 국가의 과실에 의해 임용결격자임을 밝혀내지 못했다면, 그 임용행위는 당연무효로 볼 수 없다. (22.2차)","answer":false,"quote":"임용당시 공무원임용결격사유가 있었다면 비록 국가의 과실에 의하여 임용결격자임을 밝혀내지 못하였다 하더라도 그 임용행위는 당연무효로 보아야 한다.","cite":"대법원 86누459","badge":"","topic":"","from":"GY-2022-2-P-13","seq":null},{"id":"P-OX-252","subject":"경찰학","unit":"경찰행정법","stmt":"국가나 지방자치단체에 대한 배상신청사건을 심의하기 위하여 행정안전부에 본부심의회를 둔다. 다만, 군인이나 군무원이 타인에게 입힌 손해에 대한 배상신청사건을 심의하기 위하여 국방부에 특별심의회를 둔다. (24.2차)","answer":false,"quote":"① 국가나 지방자치단체에 대한 배상신청사건을 심의하기 위하여 법무부에 본부심의회를 둔다. 다만, 군인이나 군무원이 타인에게 입힌 손해에 대한 배상신청사건을 심의하기 위하여 국방부에 특별심의회를 둔다.","cite":"국가배상법 제10조 제1항","badge":"","topic":"","from":"GY-2024-2-P-28","seq":null},{"id":"P-OX-216","subject":"경찰학","unit":"경찰행정법","stmt":"긴급구호를 요청받은 공공보건의료기관이나 공공구호기관은 정당한 이유 없이 긴급구호를 거절할 수 있다. (23.1차)","answer":false,"quote":"3. 미아, 병자, 부상자 등으로서 적당한 보호자가 없으며 응급구호가 필요하다고 인정되는 사람. 다만, 본인이 구호를 거절하는 경우는 제외한다. ② 제1항에 따라 긴급구호를 요청받은 보건의료기관이나 공공구호기관은 정당한 이유 없이 긴급구호를 거절할 수 없다. ③ 경찰관은 제1항의 조치를 하는 경우에 구호대상자가 휴대하고 있는 무기ㆍ흉기 등 위험을 일으킬 수 있는 것으로 인정되는 물건을 경찰관서에 임시로 영치(領置)하여 놓을 수 있다. ④ 경찰관은 제1항의 조치를 하였을 때에는 지체 없이 구호대상자의 가족, 친지 또는 그 밖의 연고자에게 그 사실을 알려야 하며, 연고자가 발견되지 아니할 때에는 구호대상자를 적당한 공공보건의료기관이나 공공구호기관에 즉시 인계하여야 한다. ⑤ 경찰관은 제4항에 따라 구호대상자를 공공보건의료기관이나 공공구호기관에 인계하였을 때에는 즉시 그 사실을 소속 경찰서장이나 해양경찰서장에게 보고하여야 한다. ⑥ 제5항에 따라 보고를 받은 소속 경찰서장이나 해양경찰서장은 대통령령으로 정하는 바에 따라 구호대상자를 인계한 사실을 지체 없이 해당 공공보건의료기관 또는 공공구호기관의 장 및 그 감독행정청에 통보하여야 한다. ⑦ 제1항에 따라 구호대상자를 경찰관서에서 보호하는 기간은 24시간을 초과할 수 없고, 제3항에 따라 물건을 경찰관서에 임시로 영치하는 기간은 10일을 초과할 수 없다.","cite":"경찰관 직무집행법 제4조","badge":"","topic":"","from":"GY-2023-1-P-27","seq":null},{"id":"P-OX-172","subject":"경찰학","unit":"경찰행정법","stmt":"심판청구는 처분의 효력이나 그 집행 또는 절차의 속행에 영향을 주지 아니한다. (25.2차)","answer":true,"quote":"① 심판청구는 처분의 효력이나 그 집행 또는 절차의 속행(續行)에 영향을 주지 아니한다.","cite":"행정심판법 제30조 제1항","badge":"","topic":"","from":"GY-2025-2-P-27","seq":null},{"id":"P-OX-164","subject":"경찰학","unit":"경찰행정법","stmt":"이 법은 행정절차에 관한 공통적인 사항을 규정하여 국민의 행정 참여를 도모함으로써 행정의 공정성‧투명성 및 신뢰성을 확보하고 국민의 권익을 보호함을 목적으로 한다. (25.1차)","answer":true,"quote":"이 법은 행정절차에 관한 공통적인 사항을 규정하여 국민의 행정 참여를 도모함으로써 행정의 공정성·투명성 및 신뢰성을 확보하고 국민의 권익을 보호함을 목적으로 한다. [전문개정 2012.10.22.]","cite":"행정절차법 제1조","badge":"","topic":"","from":"GY-2025-1-P-24","seq":null},{"id":"P-OX-169","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 청문‧공청회 또는 의견제출을 거쳤을 때에는 신속히 처분하여 해당 처분이 지연되지 아니하도록 하여야 한다. (25.2차)","answer":true,"quote":"⑤ 행정청은 청문·공청회 또는 의견제출을 거쳤을 때에는 신속히 처분하여 해당 처분이 지연되지 아니하도록 하여야 한다.","cite":"행정절차법 제22조 제5항","badge":"","topic":"","from":"GY-2025-2-P-23","seq":null},{"id":"P-OX-138","subject":"경찰학","unit":"경찰행정법","stmt":"행정청의 처분에 이의가 있는 당사자는 처분을 받은 날부터 30일 이내에 해당 행정청에 이의신청을 할 수 있다. (24.1차)","answer":true,"quote":"① 행정청의 처분(「행정심판법」 제3조에 따라 같은 법에 따른 행정심판의 대상이 되는 처분을 말한다. 이하 이 조에서 같다)에 이의가 있는 당사자는 처분을 받은 날부터 30일 이내에 해당 행정청에 이의신청을 할 수 있다.","cite":"행정기본법 제36조 제1항","badge":"","topic":"","from":"GY-2024-1-P-26","seq":null},{"id":"P-OX-177","subject":"경찰학","unit":"경찰행정법","stmt":"헌법이 법률로 정하도록 규정한 국회 입법전속사항은 원칙적으로 직접 법규명령으로 정할 수 없다. (26.1차)","answer":true,"quote":"헌법이 법률로 정하라고 한 국회 전속 입법사항은 법률의 구체적 위임 없이 법규명령으로 곧바로 정할 수 없다.","cite":"헌법 제40조 · 헌법 제75조","badge":"","topic":"","from":"GY-2026-1-P-18","seq":null},{"id":"P-OX-237","subject":"경찰학","unit":"경찰행정법","stmt":"행정응원을 위하여 파견된 직원은 다른 법령 등에 특별한 규정이 있는 경우를 제외하고는 원 소속 행정청의 지휘･감독을 받는다. (24.1차)","answer":false,"quote":"⑤ 행정응원을 위하여 파견된 직원은 응원을 요청한 행정청의 지휘·감독을 받는다. 다만, 해당 직원의 복무에 관하여 다른 법령등에 특별한 규정이 있는 경우에는 그에 따른다.","cite":"행정절차법 제8조 제5항","badge":"","topic":"","from":"GY-2024-1-P-21","seq":null},{"id":"P-OX-116","subject":"경찰학","unit":"경찰행정법","stmt":"경찰청장과 해양경찰청장은 경찰관이 ｢경찰관 직무집행법｣ 제2조 각 호에 따른 직무의 수행으로 인하여 민･형사상 책임과 관련된 소송을 수행할 경우 변호인 선임 등 소송 수행에 필요한 지원을 할 수 있다. (23.2차)","answer":true,"quote":"경찰청장과 해양경찰청장은 경찰관이 제2조 각 호에 따른 직무의 수행으로 인하여 민ㆍ형사상 책임과 관련된 소송을 수행할 경우 변호인 선임 등 소송 수행에 필요한 지원을 할 수 있다.","cite":"경찰관 직무집행법 제11조의4","badge":"","topic":"","from":"GY-2023-2-P-20","seq":null},{"id":"P-OX-207","subject":"경찰학","unit":"경찰행정법","stmt":"외국인이 피해자인 경우 국가배상청구권은 해당 국가와 상호 보증이 있을 때에만 인정되므로, 그 상호 보증은 외국의 법령, 판례 및 관례 등에 의한 발생요건을 비교하여 인정되는 것이 아니라 반드시 당사국과의 조약이 체결되어 있어야 한다. (22.2차)","answer":false,"quote":"그리고 상호보증은 외국의 법령, 판례 및 관례 등에 의하여 발생요건을 비교하여 인정되면 충분하고 반드시 당사국과의 조약이 체결되어 있을 필요는 없으며, 당해 외국에서 구체적으로 우리나라 국민에게 국가배상청구를 인정한 사례가 없더라도 실제로 인정될 것이라고 기대할 수 있는 상태이면 충분하다.","cite":"대법원 2013다208388","badge":"","topic":"","from":"GY-2022-2-P-25","seq":null},{"id":"P-OX-131","subject":"경찰학","unit":"경찰행정법","stmt":"개인정보처리자는 법령상 의무를 준수하기 위하여 불가피한 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위에서 이용할 수 있다. (24.1차)","answer":true,"quote":"① 개인정보처리자는 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위에서 이용할 수 있다. 1. 정보주체의 동의를 받은 경우 2. 법률에 특별한 규정이 있거나 법령상 의무를 준수하기 위하여 불가피한 경우 3. 공공기관이 법령 등에서 정하는 소관 업무의 수행을 위하여 불가피한 경우 4. 정보주체와의 계약의 체결 및 이행을 위하여 불가피하게 필요한 경우 5. 정보주체 또는 그 법정대리인이 의사표시를 할 수 없는 상태에 있거나 주소불명 등으로 사전 동의를 받을 수 없는 경우로서 명백히 정보주체 또는 제3자의 급박한 생명, 신체, 재산의 이익을 위하여 필요하다고 인정되는 경우 6. 개인정보처리자의 정당한 이익을 달성하기 위하여 필요한 경우로서 명백하게 정보주체의 권리보다 우선하는 경우. 이 경우 개인정보처리자의 정당한 이익과 상당한 관련이 있고 합리적인 범위를 초과하지 아니하는 경우에 한한다.","cite":"개인정보 보호법 제15조 제1항","badge":"","topic":"","from":"GY-2024-1-P-22","seq":null},{"id":"P-OX-067","subject":"경찰학","unit":"경찰행정법","stmt":"위원은 정치적 중립을 지켜야 하며, 권한을 남용하여서는 아니 된다. (22.1차)","answer":true,"quote":"④ 위원은 정치적 중립을 지켜야 하며, 권한을 남용하여서는 아니 된다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제20조 제4항","badge":"","topic":"","from":"GY-2022-1-P-27","seq":null},{"id":"P-OX-157","subject":"경찰학","unit":"경찰행정법","stmt":"시‧도자치경찰위원회 위원장은 위원 중에서 시‧도지사가 임명하고, 상임위원은 시‧도자치경찰위원회의 의결을 거쳐 위원 중에서 위원장의 제청으로 시‧도지사가 임명한다. (25.1차)","answer":true,"quote":"③ 시·도자치경찰위원회 위원장은 위원 중에서 시·도지사가 임명하고, 상임위원은 시·도자치경찰위원회의 의결을 거쳐 위원 중에서 위원장의 제청으로 시·도지사가 임명한다. 이 경우 위원장과 상임위원은 지방자치단체의 공무원으로 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제20조 제3항","badge":"","topic":"","from":"GY-2025-1-P-15","seq":null},{"id":"P-OX-118","subject":"경찰학","unit":"경찰행정법","stmt":"경찰 병력이 행정대집행 직후 “A자동차 희생자 추모와 해고자 복직을 위한 범국민대책위원회”(이하 ‘A차 대책위’라 함)가 또다시 같은 장소를 점거하고 물건을 다시 비치하는 것을 막기 위해 당해 사건 장소를 미리 둘러싼 뒤 ‘A차 대책위’가 같은 장소에서 기자회견 명목의 집회를 개최하려는 것을 불허하면서 소극적으로 제지한 것은 범죄행위 예방을 위한 경찰 행정상 즉시강제로서 적법한 공무집행에 해당한다. (23.2차)","answer":true,"quote":"피고인들을 포함한 ‘甲 주식회사 희생자 추모와 해고자 복직을 위한 범국민대책위원회’(이하 ‘대책위’라 한다)가 덕수궁 대한문 화단 앞 인도(이하 ‘농성 장소’라 한다)를 불법적으로 점거한 뒤 천막ㆍ분향소 등을 설치하고 농성을 계속하다가 관할 구청이 행정대집행으로 농성 장소에 있던 물건을 치웠음에도 대책위 관계자들이 이에 대한 항의의 일환으로 기자회견 명목의 집회를 개최하려고 하자, 출동한 경찰 병력이 농성 장소를 둘러싼 채 대책위 관계자들의 농성 장소 진입을 제지하는 과정에서 피고인들이 경찰관을 밀치는 등으로 공무집행을 방해하였다는 내용으로 기소된 사안에서, 경찰 병력이 행정대집행 직후 대책위가 또다시 같은 장소를 점거하고 물건을 다시 비치하는 것을 막기 위해 농성 장소를 미리 둘러싼 뒤 대책위가 같은 장소에서 기자회견 명목의 집회를 개최하려는 것을 불허하면서 소극적으로 제지한 것은 구 경찰관 직무집행법(2014. 5. 20.","cite":"대법원 2018도2993","badge":"","topic":"","from":"GY-2023-2-P-24","seq":null},{"id":"P-OX-179","subject":"경찰학","unit":"경찰행정법","stmt":"국가수사본부장은 ｢형사소송법｣에 따른 경찰의 수사에 관하여 각 시‧도경찰청장과 경찰서장 및 수사부서 소속 공무원을 지휘‧감독한다. (26.1차)","answer":true,"quote":"② 국가수사본부장은 「형사소송법」에 따른 경찰의 수사에 관하여 각 시·도경찰청장과 경찰서장 및 수사부서 소속 공무원을 지휘·감독한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제16조 제2항","badge":"","topic":"","from":"GY-2026-1-P-20","seq":null},{"id":"P-OX-079","subject":"경찰학","unit":"경찰행정법","stmt":"경찰청장, 시 도경찰청장 또는 경찰서장은 경찰관 직무집행법 제11조의3 제2항에 따른 보상금심사위원회의 심사 의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수한다. (22.1차)","answer":true,"quote":"⑤ 경찰청장, 시ㆍ도경찰청장 또는 경찰서장은 제2항에 따른 보상금심사위원회의 심사ㆍ의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수한다.","cite":"경찰관 직무집행법 제11조의3 제5항","badge":"","topic":"","from":"GY-2022-1-P-37","seq":null},{"id":"P-OX-284","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명‧신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지하여야 한다. (26.1차)","answer":false,"quote":"경찰관은 범죄행위가 목전(目前)에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명ㆍ신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지할 수 있다.","cite":"경찰관 직무집행법 제6조","badge":"","topic":"","from":"GY-2026-1-P-26","seq":null},{"id":"P-OX-135","subject":"경찰학","unit":"경찰행정법","stmt":"국가는 경찰관의 적법한 직무집행으로 인하여 손실발생의 원인에 대하여 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 생명･신체 또는 재산상의 손실을 입은 경우 정당한 보상을 하여야 한다. (24.1차)","answer":true,"quote":"① 국가는 경찰관의 적법한 직무집행으로 인하여 다음 각 호의 어느 하나에 해당하는 손실을 입은 자에 대하여 정당한 보상을 하여야 한다. 1. 손실발생의 원인에 대하여 책임이 없는 자가 생명ㆍ신체 또는 재산상의 손실을 입은 경우(손실발생의 원인에 대하여 책임이 없는 자가 경찰관의 직무집행에 자발적으로 협조하거나 물건을 제공하여 생명ㆍ신체 또는 재산상의 손실을 입은 경우를 포함한다) 2. 손실발생의 원인에 대하여 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 생명ㆍ신체 또는 재산상의 손실을 입은 경우","cite":"경찰관 직무집행법 제11조의2 제1항","badge":"","topic":"","from":"GY-2024-1-P-24","seq":null},{"id":"P-OX-204","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관의 조치는 사람의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우로 보기는 어려워 즉시강제가 아니라 직접강제의 요건에 부합한다. (22.2차)","answer":false,"quote":"경찰관 직무집행법 제6조 는 “경찰관은 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있어 긴급한 경우에는 그 행위를 제지할 수 있다.”라고 정하고 있다.","cite":"대법원 2016도19417","badge":"","topic":"","from":"GY-2022-2-P-16","seq":null},{"id":"P-OX-180","subject":"경찰학","unit":"경찰행정법","stmt":"국가경찰위원회 위원의 임기는 3년으로 하며, 연임할 수 없다. 이 경우 보궐위원의 임기는 전임자 임기의 남은 기간으로 한다. (26.1차)","answer":true,"quote":"① 위원의 임기는 3년으로 하며, 연임(連任)할 수 없다. 이 경우 보궐위원의 임기는 전임자 임기의 남은 기간으로 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제9조 제1항","badge":"","topic":"","from":"GY-2026-1-P-20","seq":null},{"id":"P-OX-198","subject":"경찰학","unit":"경찰행정법","stmt":"보궐위원은 전임자의 남은 임기가 1년 미만인 경우 한 차례에 한해서 연임할 수 있다. (22.2차)","answer":false,"quote":"② 보궐위원의 임기는 전임자 임기의 남은 기간으로 하되, 전임자의 남은 임기가 1년 미만인 경우 그 보궐위원은 제1항에도 불구하고 한 차례만 연임할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제23조 제2항","badge":"","topic":"","from":"GY-2022-2-P-03","seq":null},{"id":"P-OX-093","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 처분에 재량이 있는 경우에는 부관을 붙일 수 있다. (23.1차)","answer":true,"quote":"② 행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있는 경우에 부관을 붙일 수 있다.","cite":"행정기본법 제17조 제2항","badge":"","topic":"","from":"GY-2023-1-P-21","seq":null},{"id":"P-OX-228","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 형사처벌의 대상이 되는 행위가 눈앞에서 막 이루어 지려고 하는 것이 주관적으로 인정될 수 있는 상황이고 그 행위를 당장 제지하지 않으면 곧 인명･신체에 중대한 위해를 미치거나 재산에 손해를 끼칠 우려가 있는 상황이어서, 직접 제지하는 방법 외에는 위와 같은 결과를 막을 수 없는 급박한 상태일 때에만 ｢경찰관 직무집행법｣ 제6조에 의하여 적법하게 그 행위를 제지할 수 있다. (23.2차)","answer":false,"quote":"그러므로 경찰관은 형사처벌의 대상이 되는 행위가 눈앞에서 막 이루어지려고 하는 것이 객관적으로 인정될 수 있는 상황이고 그 행위를 당장 제지하지 않으면 곧 인명·신체에 위해를 미치거나 재산에 중대한 손해를 끼칠 우려가 있는 상황이어서, 직접 제지하는 방법 외에는 위와 같은 결과를 막을 수 없는 급박한 상태일 때에만 경찰관 직무집행법 제6조 에 의하여 적법하게 그 행위를 제지할 수 있고, 그 범위 내에서만 경찰관의 제지 조치가 적법하다고 평가될 수 있다.","cite":"대법원 2018다288631","badge":"","topic":"","from":"GY-2023-2-P-24","seq":null},{"id":"P-OX-242","subject":"경찰학","unit":"경찰행정법","stmt":"시･도경찰청장의 처분 또는 부작위에 대한 행정심판의 청구에 대해서는 경찰청에 두는 행정심판위원회에서 심리･재결한다. (24.1차)","answer":false,"quote":"① 다음 각 호의 행정청 또는 그 소속 행정청(행정기관의 계층구조와 관계없이 그 감독을 받거나 위탁을 받은 모든 행정청을 말하되, 위탁을 받은 행정청은 그 위탁받은 사무에 관하여는 위탁한 행정청의 소속 행정청으로 본다. 이하 같다)의 처분 또는 부작위에 대한 행정심판의 청구(이하 \"심판청구\"라 한다)에 대하여는 다음 각 호의 행정청에 두는 행정심판위원회에서 심리·재결한다. <개정 2016.3.29.>","cite":"행정심판법 제6조 제1항","badge":"","topic":"","from":"GY-2024-1-P-27","seq":null},{"id":"P-OX-282","subject":"경찰학","unit":"경찰행정법","stmt":"금고 이상의 형의 선고유예를 선고받고 그 유예기간 중에 있는 사람은 경찰공무원으로 임용될 수 있다. (26.1차)","answer":false,"quote":"경찰공무원은 자격정지 이상의 형의 선고유예 기간 중이면 결격이므로, 그보다 무거운 금고 이상의 선고유예도 결격이다.","cite":"경찰공무원법 제8조","badge":"","topic":"","from":"GY-2026-1-P-21","seq":null},{"id":"P-OX-064","subject":"경찰학","unit":"경찰행정법","stmt":"운전자가 경찰공무원으로부터 음주측정을 요구받고 호흡측정기에 숨을 내쉬는 시늉만 하는 등 형식적으로 음주측정에 응하였을 뿐 경찰공무원의 거듭된 요구에도 불구하고 호흡측정기에 음주 측정수치가 나타날 정도로 숨을 제대로 불어넣지 아니하였다면 이는 실질적으로 음주측정에 불응한 것과 다를 바 없다. (22.1차)","answer":true,"quote":"도로교통법 제41조 제2항 에서 말하는 '측정'이란, 측정결과에 불복하는 운전자에 대하여 그의 동의를 얻어 혈액채취 등의 방법으로 다시 측정할 수 있음을 규정하고 있는 같은 조 제3항 과의 체계적 해석상, 호흡을 채취하여 그로부터 주취의 정도를 객관적으로 환산하는 측정방법, 즉 호흡측정기에 의한 측정이라고 이해하여야 할 것이고, 한편 호흡측정기에 의한 음주측정은 운전자가 호흡측정기에 숨을 세게 불어넣는 방식으로 행하여지는 것으로서 여기에는 운전자의 자발적인 협조가 필수적이라 할 것이므로, 운전자가 경찰공무원으로부터 음주측정을 요구받고 호흡측정기에 숨을 내쉬는 시늉만 하는 등 형식적으로 음주측정에 응하였을 뿐 경찰공무원의 거듭된 요구에도 불구하고 호흡측정기에 음주측정수치가 나타날 정도로 숨을 제대로 불어넣지 아니하였다면 이는 실질적으로 음주측정에 불응한 것과 다를 바 없다 할 것이고, 운전자가 정당한 사유 없이 호흡측정기에 의한 음주측정에 불응한 이상 그로써 음주측정불응의 죄는 성립하는 것이며, 그 후 경찰공무원이 혈액채취 등의 방법으로 음주여부를 조사하지 아니하였다고 하여 달리 볼 것은 아니다.","cite":"대법원 99도5210","badge":"","topic":"","from":"GY-2022-1-P-25","seq":null},{"id":"P-OX-232","subject":"경찰학","unit":"경찰행정법","stmt":"취소심판은 당사자의 신청에 대한 행정청의 위법 또는 부당한 거부처분이나 부작위에 대하여 일정한 처분을 하도록 하는 행정심판이다. (23.2차)","answer":false,"quote":"행정심판의 종류는 다음 각 호와 같다. 1. 취소심판: 행정청의 위법 또는 부당한 처분을 취소하거나 변경하는 행정심판 2. 무효등확인심판: 행정청의 처분의 효력 유무 또는 존재 여부를 확인하는 행정심판 3. 의무이행심판: 당사자의 신청에 대한 행정청의 위법 또는 부당한 거부처분이나 부작위에 대하여 일정한 처분을 하도록 하는 행정심판","cite":"행정심판법 제5조","badge":"","topic":"","from":"GY-2023-2-P-26","seq":null},{"id":"P-OX-130","subject":"경찰학","unit":"경찰행정법","stmt":"행정응원에 드는 비용은 응원을 요청한 행정청이 부담하며, 그 부담금액 및 부담방법은 응원을 요청한 행정청과 응원을 하는 행정청이 협의하여 결정한다. (24.1차)","answer":true,"quote":"⑥ 행정응원에 드는 비용은 응원을 요청한 행정청이 부담하며, 그 부담금액 및 부담방법은 응원을 요청한 행정청과 응원을 하는 행정청이 협의하여 결정한다. [전문개정 2012.10.22.]","cite":"행정절차법 제8조 제6항","badge":"","topic":"","from":"GY-2024-1-P-21","seq":null},{"id":"P-OX-263","subject":"경찰학","unit":"경찰행정법","stmt":"손실보상심의위원회의 위원은 소속 경찰관과 판사‧검사 또는 변호사로 5년 이상 근무한 사람, ｢고등교육법｣ 제2조에 따른 학교에서 법학, 행정학 및 경찰학을 가르치는 조교수 이상으로 5년 이상 재직한 사람, 경찰 업무와 손실보상에 관하여 학식과 경험이 풍부한 사람 중에서 위촉하거나 임명한다. (25.1차)","answer":false,"quote":"대학 교원 위원은 법학 또는 행정학을 가르치는 부교수 이상으로 5년 이상 재직한 사람이어야 하고, 경찰학·조교수는 해당하지 않는다.","cite":"경찰관 직무집행법 제11조","badge":"","topic":"","from":"GY-2025-1-P-18","seq":null},{"id":"P-OX-150","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관은 경찰장비를 함부로 개조하거나 경찰장비에 임의의 장비를 부착하여 일반적인 사용법과 달리 사용함으로써 다른 사람의 생명･신체에 위해를 끼쳐서는 아니 된다. (24.2차)","answer":true,"quote":"③ 경찰관은 경찰장비를 함부로 개조하거나 경찰장비에 임의의 장비를 부착하여 일반적인 사용법과 달리 사용함으로써 다른 사람의 생명ㆍ신체에 위해를 끼쳐서는 아니 된다.","cite":"경찰관 직무집행법 제10조 제3항","badge":"","topic":"","from":"GY-2024-2-P-27","seq":null},{"id":"P-OX-141","subject":"경찰학","unit":"경찰행정법","stmt":"비례의 원칙은 헌법 제37조 제2항, ｢행정기본법｣ 제10조, ｢경찰관 직무집행법｣ 제1조 제2항에서 근거를 찾을 수 있다. (24.2차)","answer":true,"quote":"비례원칙은 헌법의 기본권 제한 한계, 행정기본법의 행정작용 원칙, 경찰관 직무집행법의 직권 최소한 행사에 근거를 둔다.","cite":"헌법 제37조 · 행정기본법 제10조 · 경찰관 직무집행법 제1조","badge":"","topic":"","from":"GY-2024-2-P-16","seq":null},{"id":"P-OX-251","subject":"경찰학","unit":"경찰행정법","stmt":"행정부에 의한 통제유형에는 중앙행정심판위원회에 의한 통제, 국정조사･감사권 등이 포함된다. (24.2차)","answer":false,"quote":"국정감사·조사권은 국회의 권한이라 입법부에 의한 통제이고, 중앙행정심판위원회에 의한 통제는 행정부에 의한 통제다.","cite":"헌법 제61조","badge":"","topic":"","from":"GY-2024-2-P-25","seq":null},{"id":"P-OX-063","subject":"경찰학","unit":"경찰행정법","stmt":"국회법 상 경위(警衛)나 경찰공무원은 국회 안에 현행범인이 있을 때에는 체포한 후 국회의장의 지시를 받아야 한다. 다만, 회의장 안에서는 국회의장의 명령 없이 국회의원을 체포할 수 없다. (22.1차)","answer":true,"quote":"경위나 국가경찰공무원은 국회 안에 현행범인이 있을 때에는 체포한 후 의장의 지시를 받아야 한다. 다만, 회의장 안에서는 의장의 명령 없이 의원을 체포할 수 없다. [전문개정 2018. 4. 17.]","cite":"국회법 제150조","badge":"","topic":"","from":"GY-2022-1-P-02","seq":null},{"id":"P-OX-122","subject":"경찰학","unit":"경찰행정법","stmt":"헌법상 보장된 국민의 자유나 권리를 제한할 때에는 적어도 그 제한의 본질적인 사항에 관하여 국회가 법률로써 스스로 규율하여야 한다. (24.1차)","answer":true,"quote":"따라서 국민의 권리·의무에 관한 기본적이고 본질적인 사항은 국회가 정하여야 하고, 헌법상 보장된 국민의 자유나 권리를 제한할 때에는 적어도 그 제한의 본질적인 사항에 관하여 국회가 법률로써 스스로 규율하여야 한다.","cite":"대법원 2016두32992","badge":"","topic":"","from":"GY-2024-1-P-15","seq":null},{"id":"P-OX-233","subject":"경찰학","unit":"경찰행정법","stmt":"법률유보원칙은 법률에 의한 규율을 뜻하므로 위임입법에 의해 기본권 제한을 할 수 없다. (24.1차)","answer":false,"quote":"법률유보는 「법률에 근거한」 규율을 뜻하므로, 법률에서 구체적 범위를 정해 위임한 명령으로도 기본권을 제한할 수 있다.","cite":"헌재 2015헌마1094","badge":"","topic":"","from":"GY-2024-1-P-15","seq":null},{"id":"P-OX-240","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관의 부작위를 이유로 한 국가배상책임을 인정하기 위한 요건으로서의 ‘법령 위반’이란 형식적 의미의 법령에 명시적으로 공무원의 작위의무가 규정되어 있는데도 이를 위반하는 경우를 의미하며, 인권존중·권력남용금지·신의성실과 같이 공무원으로서 마땅히 지켜야 할 준칙이나 규범을 지키지 않고 위반한 경우는 포함하지 않는다. (24.1차)","answer":false,"quote":"여기서 ‘법령 위반’이란 엄격하게 형식적 의미의 법령에 명시적으로 공무원의 작위의무가 규정되어 있는데도 이를 위반하는 경우만을 의미하는 것은 아니고, 인권존중·권력남용금지·신의성실과 같이 공무원으로서 마땅히 지켜야 할 준칙이나 규범을 지키지 않고 위반한 경우를 포함하여 널리 객관적인 정당성이 없는 행위를 한 경우를 포함한다.","cite":"대법원 2017다290538","badge":"","topic":"","from":"GY-2024-1-P-25","seq":null},{"id":"P-OX-275","subject":"경찰학","unit":"경찰행정법","stmt":"군인‧군무원‧경찰공무원 또는 예비군대원이 전투‧훈련 등 직무 집행과 관련하여 전사‧순직하거나 공상을 입은 경우, 유족이 다른 법령에 따라 재해보상금‧유족연금‧상이연금 등의 보상을 지급받을 수 있을 때에는 ｢국가배상법｣ 및 ｢민법｣에 따른 손해배상 및 위자료를 청구할 수 없다. (25.2차)","answer":false,"quote":"① 국가나 지방자치단체는 공무원 또는 공무를 위탁받은 사인(이하 \"공무원\"이라 한다)이 직무를 집행하면서 고의 또는 과실로 법령을 위반하여 타인에게 손해를 입히거나, 「자동차손해배상 보장법」에 따라 손해배상의 책임이 있을 때에는 이 법에 따라 그 손해를 배상하여야 한다. 다만, 군인·군무원·경찰공무원 또는 예비군대원이 전투·훈련 등 직무 집행과 관련하여 전사(戰死)·순직(殉職)하거나 공상(公傷)을 입은 경우에 본인이나 그 유족이 다른 법령에 따라 재해보상금·유족연금·상이연금 등의 보상을 지급받을 수 있을 때에는 이 법 및 「민법」에 따른 손해배상을 청구할 수 없다. <개정 2009. 10. 21., 2016. 5. 29.>","cite":"국가배상법 제2조 제1항","badge":"","topic":"","from":"GY-2025-2-P-26","seq":null},{"id":"P-OX-143","subject":"경찰학","unit":"경찰행정법","stmt":"의견제출기한에 따른 기한은 의견제출에 필요한 기간을 10일 이상으로 고려하여 정하여야 한다. (24.2차)","answer":true,"quote":"7. 그 밖에 필요한 사항 ② 행정청은 청문을 하려면 청문이 시작되는 날부터 10일 전까지 제1항 각 호의 사항을 당사자등에게 통지하여야 한다. 이 경우 제1항제4호부터 제6호까지의 사항은 청문 주재자의 소속·직위 및 성명, 청문의 일시 및 장소, 청문에 응하지 아니하는 경우의 처리방법 등 청문에 필요한 사항으로 갈음한다. ③ 제1항제6호에 따른 기한은 의견제출에 필요한 상당한 기간을 고려하여 정하여야 한다. ④ 다음 각 호의 어느 하나에 해당하는 경우에는 제1항에 따른 통지를 하지 아니할 수 있다.","cite":"행정절차법 제21조","badge":"","topic":"","from":"GY-2024-2-P-20","seq":null},{"id":"P-OX-266","subject":"경찰학","unit":"경찰행정법","stmt":"경찰공무원에 대한 징계위원회의 심의과정에 감경사유에 해당하는 공적 사항이 제시되지 아니한 경우에는 그 징계양정이 결과적으로 적정한지와 상관없이 이는 관계 법령이 정한 징계 절차를 지키지 아니한 것으로서 당연무효이다. (25.1차)","answer":false,"quote":"경찰공무원에 대한 징계위원회의 심의과정에 감경사유에 해당하는 공적 사항이 제시되지 아니한 경우에는 그 징계양정이 결과적으로 적정한지와 상관없이 이는 관계 법령이 정한 징계절차를 지키지 않은 것으로서 위법하다.","cite":"대법원 2012두13245","badge":"","topic":"","from":"GY-2025-1-P-21","seq":null},{"id":"P-OX-095","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 부관을 붙일 수 있는 처분이 당사자의 동의가 있는 경우에는 그 처분을 한 후에도 부관을 새로 붙이거나 종전의 부관을 변경할 수 있다. (23.1차)","answer":true,"quote":"③ 행정청은 부관을 붙일 수 있는 처분이 다음 각 호의 어느 하나에 해당하는 경우에는 그 처분을 한 후에도 부관을 새로 붙이거나 종전의 부관을 변경할 수 있다. 1. 법률에 근거가 있는 경우 2. 당사자의 동의가 있는 경우 3. 사정이 변경되어 부관을 새로 붙이거나 종전의 부관을 변경하지 아니하면 해당 처분의 목적을 달성할 수 없다고 인정되는 경우","cite":"행정기본법 제17조 제3항","badge":"","topic":"","from":"GY-2023-1-P-21","seq":null},{"id":"P-OX-276","subject":"경찰학","unit":"경찰행정법","stmt":"행정심판의 재결은 행정심판위원회 또는 피청구인의 행정청이 심판청구서를 받은 날부터 60일 이내에 하여야 한다. 다만, 부득이한 사정이 있는 경우에는 위원장이 직권으로 60일을 연장할 수 있다. (25.2차)","answer":false,"quote":"① 재결은 제23조에 따라 피청구인 또는 위원회가 심판청구서를 받은 날부터 60일 이내에 하여야 한다. 다만, 부득이한 사정이 있는 경우에는 위원장이 직권으로 30일을 연장할 수 있다.","cite":"행정심판법 제45조 제1항","badge":"","topic":"","from":"GY-2025-2-P-27","seq":null},{"id":"P-OX-234","subject":"경찰학","unit":"경찰행정법","stmt":"경찰청장은 시･도자치경찰위원회의 의결이 적정하지 아니하다고 판단되면 국가경찰위원회와 행정안전부장관을 거쳐 시･도지사에게 재의를 요구하게 할 수 있다. (24.1차)","answer":false,"quote":"④ 위원회의 의결이 법령에 위반되거나 공익을 현저히 해친다고 판단되면 행정안전부장관은 미리 경찰청장의 의견을 들어 국가경찰위원회를 거쳐 시·도지사에게 제3항의 재의를 요구하게 할 수 있고, 경찰청장은 국가경찰위원회와 행정안전부장관을 거쳐 시·도지사에게 재의를 요구하게 할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제25조 제4항","badge":"","topic":"","from":"GY-2024-1-P-16","seq":null},{"id":"P-OX-153","subject":"경찰학","unit":"경찰행정법","stmt":"주거 또는 신원이 확실하지 아니한 사람에게는 통고처분을 하지 아니한다. (24.2차)","answer":true,"quote":"① 경찰서장, 해양경비안전서장, 제주특별자치도지사 또는 철도특별사법경찰대장은 범칙자로 인정되는 사람에 대하여 그 이유를 명백히 나타낸 서면으로 범칙금을 부과하고 이를 납부할 것을 통고할 수 있다. 다만, 다음 각 호의 어느 하나에 해당하는 사람에게는 통고하지 아니한다. <개정 2014.11.19.> 1. 통고처분서 받기를 거부한 사람 2. 주거 또는 신원이 확실하지 아니한 사람 3. 그 밖에 통고처분을 하기가 매우 어려운 사람","cite":"경범죄처벌법 제7조 제1항","badge":"","topic":"","from":"GY-2024-2-P-35","seq":null},{"id":"P-OX-219","subject":"경찰학","unit":"경찰행정법","stmt":"시･도자치경찰위원회 비상임 위원은 특정 성(性)이 10분의 6을 초과하지 아니해야 한다. (23.2차)","answer":false,"quote":"② 위원은 특정 성(性)이 10분의 6을 초과하지 아니하도록 노력하여야 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제19조 제2항","badge":"","topic":"","from":"GY-2023-2-P-03","seq":null},{"id":"P-OX-104","subject":"경찰학","unit":"경찰행정법","stmt":"법인이나 조합 등의 설립허가의 취소의 처분을 하는 경우 (23.1차)","answer":true,"quote":"다. 법인이나 조합 등의 설립허가의 취소 ② 행정청이 처분을 할 때 다음 각 호의 어느 하나에 해당하는 경우에는 공청회를 개최한","cite":"행정절차법 제22조","badge":"","topic":"","from":"GY-2023-1-P-25","seq":null},{"id":"P-OX-191","subject":"경찰학","unit":"경찰행정법","stmt":"정보의 공개를 청구하는 자는 해당 정보를 보유하거나 관리하고 있는 공공기관에 정보공개 청구서를 제출하여 정보의 공개를 청구할 수 있으나, 말로써 정보의 공개를 청구할 수 없다. (22.1차)","answer":false,"quote":"① 정보의 공개를 청구하는 자(이하 \"청구인\"이라 한다)는 해당 정보를 보유하거나 관리하고 있는 공공기관에 다음 각 호의 사항을 적은 정보공개 청구서를 제출하거나 말로써 정보의 공개를 청구할 수 있다. 1. 청구인의 성명·주민등록번호·주소 및 연락처(전화번호·전자우편주소 등을 말한다) 2. 공개를 청구하는 정보의 내용 및 공개방법","cite":"공공기관의 정보공개에 관한 법률 제10조 제1항","badge":"","topic":"","from":"GY-2022-1-P-29","seq":null},{"id":"P-OX-107","subject":"경찰학","unit":"경찰행정법","stmt":"특별한 이유 없이 호흡측정기에 의한 측정에 불응하는 운전자에게 경찰공무원이 혈액채취에 의한 측정방법이 있음을 고지하고 그 선택 여부를 물어야 할 의무는 없다. (23.1차)","answer":true,"quote":"특별한 이유 없이 호흡측정기에 의한 측정에 불응하는 운전자에게 경찰공무원이 혈액채취에 의한 측정방법이 있음을 고지하고 그 선택 여부를 물어야 할 의무가 있다고는 할 수 없다.","cite":"대법원 2002도4220","badge":"","topic":"","from":"GY-2023-1-P-39","seq":null},{"id":"P-OX-119","subject":"경찰학","unit":"경찰행정법","stmt":"“개인정보처리자”란 업무를 목적으로 개인정보파일을 운용하기 위하여 스스로 또는 다른 사람을 통하여 개인정보를 처리하는 공공기관, 법인, 단체 및 개인 등을 말한다. (23.2차)","answer":true,"quote":"5. \"개인정보처리자\"란 업무를 목적으로 개인정보파일을 운용하기 위하여 스스로 또는 다른 사람을 통하여 개인정보를 처리하는 공공기관, 법인, 단체 및 개인 등을 말한다.","cite":"개인정보 보호법 제2조","badge":"","topic":"","from":"GY-2023-2-P-25","seq":null},{"id":"P-OX-185","subject":"경찰학","unit":"경찰행정법","stmt":"청구인이 정보공개와 관련한 공공기관의 결정에 대하여 불복이 있거나 정보공개 청구 후 20일이 경과하도록 정보공개 결정이 없는 때에는 ｢행정소송법｣에서 정하는 바에 따라 행정소송을 제기할 수 있다. (26.1차)","answer":true,"quote":"① 청구인이 정보공개와 관련한 공공기관의 결정에 대하여 불복이 있거나 정보공개 청구 후 20일이 경과하도록 정보공개 결정이 없는 때에는 「행정소송법」에서 정하는 바에 따라 행정소송을 제기할 수 있다.","cite":"공공기관의 정보공개에 관한 법률 제20조 제1항","badge":"","topic":"","from":"GY-2026-1-P-24","seq":null},{"id":"P-OX-147","subject":"경찰학","unit":"경찰행정법","stmt":"이 법은 대한민국 영역 밖에서 질서위반행위를 한 대한민국의 국민에게 적용한다. (24.2차)","answer":true,"quote":"② 이 법은 대한민국 영역 밖에서 질서위반행위를 한 대한민국의 국민에게 적용한다.","cite":"질서위반행위규제법 제4조 제2항","badge":"","topic":"","from":"GY-2024-2-P-22","seq":null},{"id":"P-OX-178","subject":"경찰학","unit":"경찰행정법","stmt":"｢경찰관 직무집행법｣ 제1조 제2항, ｢행정기본법｣ 제10조 등에 규정되어 있다. (26.1차)","answer":true,"quote":"비례원칙은 경찰관 직무집행법의 「직권은 필요한 최소한도에서」 조항과 행정기본법의 비례원칙 조항에 명문으로 들어 있다.","cite":"경찰관 직무집행법 제1조 · 행정기본법 제10조","badge":"","topic":"","from":"GY-2026-1-P-19","seq":null},{"id":"P-OX-189","subject":"경찰학","unit":"경찰행정법","stmt":"휴직 기간이 끝나거나 휴직 사유가 소멸된 후에도 직무에 복귀하지 아니하거나 직무를 감당할 수 없을 때 (22.1차)","answer":false,"quote":"4. 휴직 기간이 끝나거나 휴직 사유가 소멸된 후에도 직무에 복귀하지 아니하거나 직무를 감당할 수 없을 때","cite":"국가공무원법 제70조","badge":"","topic":"","from":"GY-2022-1-P-16","seq":null},{"id":"P-OX-184","subject":"경찰학","unit":"경찰행정법","stmt":"공공기관은 이 법 제10조에 따라 정보공개의 청구를 받으면 그 청구를 받은 날부터 10일 이내에 공개 여부를 결정하여야 한다. (26.1차)","answer":true,"quote":"① 공공기관은 제10조에 따라 정보공개의 청구를 받으면 그 청구를 받은 날부터 10일 이내에 공개 여부를 결정하여야 한다.","cite":"공공기관의 정보공개에 관한 법률 제11조 제1항","badge":"","topic":"","from":"GY-2026-1-P-24","seq":null},{"id":"P-OX-264","subject":"경찰학","unit":"경찰행정법","stmt":"자신의 행위가 위법하지 아니한 것으로 오인하고 행한 질서 위반행위는 그 오인에 정당한 이유가 있는 때에 한하여 과태료를 감경한다. (25.1차)","answer":false,"quote":"자신의 행위가 위법하지 아니한 것으로 오인하고 행한 질서위반행위는 그 오인에 정당한 이유가 있는 때에 한하여 과태료를 부과하지 아니한다.","cite":"질서위반행위규제법 제8조","badge":"","topic":"","from":"GY-2025-1-P-19","seq":null},{"id":"P-OX-170","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 당사자에게 의무를 부과하거나 권익을 제한하는 처분을 하는 경우에는 미리 당사자등에게 통지하여야 한다. 다만, 공공의 안전 또는 복리를 위하여 긴급히 처분을 할 필요가 있는 경우에는 통지하지 아니할 수 있다. (25.2차)","answer":true,"quote":"의무를 지우거나 권익을 제한하는 처분은 미리 당사자등에게 통지해야 하지만, 공공의 안전·복리를 위해 긴급히 처분할 때는 생략할 수 있다.","cite":"행정절차법 제21조","badge":"","topic":"","from":"GY-2025-2-P-23","seq":null},{"id":"P-OX-248","subject":"경찰학","unit":"경찰행정법","stmt":"행정청이 정당한 처리기간 내에 처리하지 아니하였을 때에도 신청인은 해당 행정청 또는 그 감독 행정청에 신속한 처리를 요청할 수 없다. (24.2차)","answer":false,"quote":"④ 행정청이 정당한 처리기간 내에 처리하지 아니하였을 때에는 신청인은 해당 행정청 또는 그 감독 행정청에 신속한 처리를 요청할 수 있다.","cite":"행정절차법 제19조 제4항","badge":"","topic":"","from":"GY-2024-2-P-20","seq":null},{"id":"P-OX-105","subject":"경찰학","unit":"경찰행정법","stmt":"위원회는 심판청구가 이유가 없다고 인정하면 그 심판청구를 기각(棄却)한다. (23.1차)","answer":true,"quote":"② 위원회는 심판청구가 이유가 없다고 인정하면 그 심판청구를 기각(棄却)한다.","cite":"행정심판법 제43조 제2항","badge":"","topic":"","from":"GY-2023-1-P-26","seq":null},{"id":"P-OX-146","subject":"경찰학","unit":"경찰행정법","stmt":"질서위반행위의 성립과 과태료 처분은 행위 시의 법률에 따른다. (24.2차)","answer":true,"quote":"① 질서위반행위의 성립과 과태료 처분은 행위 시의 법률에 따른다.","cite":"질서위반행위규제법 제3조 제1항","badge":"","topic":"","from":"GY-2024-2-P-22","seq":null},{"id":"P-OX-279","subject":"경찰학","unit":"경찰행정법","stmt":"부령은 행정각부의 장관이 제정하는 것이므로, 법제처 심사와 국무회의 심의를 모두 거쳐야 한다. (26.1차)","answer":false,"quote":"국무회의 심의를 거치는 것은 대통령령안이고, 부령은 법제처 심사만 거친다.","cite":"헌법 제89조 · 헌법 제25조","badge":"","topic":"","from":"GY-2026-1-P-18","seq":null},{"id":"P-OX-250","subject":"경찰학","unit":"경찰행정법","stmt":"심신장애로 인하여 행위의 옳고 그름을 판단할 능력이 없거나 그 판단에 따른 행위를
