 ‘허위의 사실’과 반대되는 ‘진실한 사실’을 말하는 것이 아니라 가치판단이나 평가를 내용으로 하는 ‘의견’에 대치되는 개념이다.","cite":"대법원 2016도18024","badge":"","topic":"","from":"GY-2023-1-X-16","seq":null},{"id":"X-OX-394","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 피해자를 폭행·협박하여 매출전표에 허위 서명하게 하고 이를 교부받아 소지한 경우 甲이 신용카드회사에 매출전표를 제출하여도 신용카드회사가 신용카드 가맹점 규약 또는 약관의 규정을 들어 그 금액의 지급을 거절할 수 있으므로 甲은 ‘재산상 이익’을 취득하였다고 볼 수 없다. (24.2차)","answer":false,"quote":"피고인들이 폭행·협박으로 피해자로 하여금 매출전표에 서명을 하게 한 다음 이를 교부받아 소지함으로써 이미 외관상 각 매출전표를 제출하여 신용카드회사들로부터 그 금액을 지급받을 수 있는 상태가 되었는바, 피해자가 각 매출전표에 허위 서명한 탓으로 피고인들이 신용카드회사들에게 각 매출전표를 제출하여도 신용카드회사들이 신용카드 가맹점 규약 또는 약관의 규정을 들어 그 금액의 지급을 거절할 가능성이 있다 하더라도, 그로 인하여 피고인들이 각 매출전표 상의 금액을 지급받을 가능성이 완전히 없어져 버린 것이 아니고 외견상 여전히 그 금액을 지급받을 가능성이 있는 상태이므로, 결국 피고인들이 '재산상 이익'을 취득하였다고 볼 수 있다.","cite":"대법원 96도3411","badge":"","topic":"","from":"GY-2024-2-X-19","seq":null},{"id":"X-OX-405","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 대학교 동창인 A가 SNS에서 자신의 팔로우를 해제한 것에 불만을 가지고 있던 중 A가 친구들과 촬영한 사진이 포함된 글을 작성‧게시한 것을 보고 거기에 “와 인성 저런데 친구는 있으시네요, 잘 봤습니다, 안녕히 계세요”라는 내용의 댓글을 게시하였다가 곧 삭제하였으나 A가 SNS의 댓글 미리알림 기능을 통해 이를 알게 된 경우, 甲에게는 모욕죄가 성립한다. (25.1차)","answer":false,"quote":"「인성 저런데 친구는 있으시네요」는 무례한 비꼼일 뿐 사회적 평가를 떨어뜨릴 경멸적 표현이 아니어서 모욕죄가 성립하지 않는다.","cite":"대법원 2024도2879 · 형법 제311조","badge":"","topic":"","from":"GY-2025-1-X-15","seq":null},{"id":"X-OX-260","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제299조의 준강제추행죄는 정신적·신체적 사정으로 인하여 성적인 자기방어를 할 수 없는 사람의 성적 자기결정권을 보호해 주는 것을 보호법익으로 하며, 그 성적 자기결정권은 원치 않는 성적 관계를 거부할 권리라는 소극적 측면을 말한다. (23.2차)","answer":true,"quote":"이러한 준강제추행죄는 정신적·신체적 사정으로 인하여 성적인 자기방어를 할 수 없는 사람의 성적 자기결정권을 보호해 주는 것을 보호법익으로 하며, 그 성적 자기결정권은 원치 않는 성적 관계를 거부할 권리라는 소극적 측면을 말한다.","cite":"대법원 2018도9781","badge":"","topic":"","from":"GY-2023-2-X-17","seq":null},{"id":"X-OX-424","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"재물에 대한 사기죄에서 외관상 재물을 교부하는 행위가 있다면, 그 재물이 범인의 자유로운 처분이 가능한 상태에 놓이지 않고 여전히 피해자의 지배 아래에 있는 것으로 평가되더라도, 그 재물에 대한 처분행위는 인정된다. (26.1차)","answer":false,"quote":"재물에 대한 사기죄에서 ‘처분행위’의 의미 / 외관상 재물의 교부에 해당하는 행위가 있었으나 재물이 범인의 사실상의 지배 아래에 들어가 그의 자유로운 처분이 가능한 상태에 놓이지 않고 여전히 피해자의 지배 아래에 있는 것으로 평가되는 경우, 그 재물에 대한 처분행위가 인정되는지 여부 (소극)","cite":"대법원 2024도11833","badge":"","topic":"","from":"GY-2026-1-X-18","seq":null},{"id":"X-OX-307","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"유기죄에 있어서는 행위자가 요부조자에 대한 보호책임의 발생원인이 된 사실이 존재한다는 것을 인식하고 이에 기한 부조의무를 해태한다는 의식이 있음을 요한다. (25.2차)","answer":true,"quote":"유기죄가 성립하기 위하여는 행위자가 형법 제271조 제1항 이 정한 바에 따라 ‘노유, 질병 기타 사정으로 인하여 부조를 요하는 자를 보호할 만한 법률상 또는 계약상 의무 있는 자’에 해당하여야 할 뿐만 아니라, 요부조자에 대한 보호책임의 발생원인이 된 사실이 존재한다는 것을 인식하고, 이에 기한 부조의무를 해태한다는 의식이 있음을 요한다.","cite":"대법원 2007도3952","badge":"","topic":"","from":"GY-2025-2-X-17","seq":null},{"id":"X-OX-391","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강간치사상죄에 있어서 사상의 결과는 간음행위 그 자체로 부터 발생한 경우나 강간의 수단으로 사용한 폭행으로부터 발생한 경우는 포함되지만, 강간에 수반하는 행위에서 발생한 경우는 포함되지 않는다. (24.2차)","answer":false,"quote":"강간 등에 의한 치사상죄에 있어서 사상의 결과가 간음행위 자체나 강간에 수반하는 행위에서 발생한 경우도 포함하는지 여부 (적극)","cite":"대법원 2007도10120","badge":"","topic":"","from":"GY-2024-2-X-16","seq":null},{"id":"X-OX-299","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 乙을 2회에 걸쳐 두 손으로 힘껏 밀어 땅바닥에 넘어뜨리는 폭행을 가함으로써 그 충격으로 인한 쇼크성 심장마비로 사망케 하였다면 비록 乙에게 그 당시 심관성동맥경화 및 심근섬유화 증세등의 심장질환의 지병이 있었고 음주로 만취된 상태였으며 그것이 乙의 사망에 영향을 주었다고 해서 甲의 폭행과 乙의 사망간에 상당인과관계가 없다고 할 수 없다. (25.2차)","answer":true,"quote":"피해자를 2회에 걸쳐 두 손으로 힘껏 밀어 땅바닥에 넘어뜨리는 폭행을 가함으로써 그 충격으로 인한 쇼크성 심장마비로 사망케 하였다면 비록 위 피해자에게 그 당시 심관성동맥경화 및 심근섬유화 증세등의 심장질환의 지병이 있었고 음주로 만취된 상태였으며 그것이 피해자가 사망함에 있어 영향을 주었다고 해서 피고인의 폭행과 피해자의 사망간에 상당인과 관계가 없다고 할 수 없다.","cite":"대법원 85도2433","badge":"","topic":"","from":"GY-2025-2-X-04","seq":null},{"id":"X-OX-411","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"X토지는 甲이 배임행위로 인하여 영득한 것이므로 丙이 甲의 배임행위를 알면서도 그 소유권이전등기를 넘겨받은 경우라면, 丙에게 장물취득죄가 성립한다. (25.1차)","answer":false,"quote":"형법상 장물죄의 객체인 장물이라 함은 재산권상의 침해를 가져 올 위법행위로 인하여 영득한 물건으로서 피해자가 반환청구권을 가지는 것을 말하고 본건 대지에 관하여 매수인 \" 갑\" 에게 소유권 이전등기를 하여 줄 임무가 있는 소유자가 그 임무에 위반하여 이를\" 을\" 에게 매도하고 소유권이전등기를 경유하여 준 경우에는 위 부동산소유자가 배임행위로 인하여 영득한 것은 재산상의 이익이고 위 배임범죄에 제공된 대지는 범죄로 인하여 영득한 것 자체는 아니므로 그 취득자 또는 전득자에게 대하여 배임죄의 가공여부를 논함은 별문제로 하고 장물취득죄로 처단할 수 없다","cite":"대법원 74도2804","badge":"","topic":"","from":"GY-2025-1-X-40","seq":null},{"id":"X-OX-302","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"소매치기가 피해자의 주머니에 손을 넣어 금품을 절취하려 한 경우 비록 그 주머니속에 금품이 들어있지 않았었다 하더라도 절도라는 결과 발생의 위험성을 충분히 내포하고 있으므로 이는 절도미수에 해당한다. (25.2차)","answer":true,"quote":"소매치기가 피해자의 주머니에 손을 넣어 금품을 절취하려 한 경우 비록 그 주머니속에 금품이 들어있지 않았었다 하더라도 위 소위는 절도라는 결과 발생의 위험성을 충분히 내포하고 있으므로 이는 절도미수에 해당한다.","cite":"대법원 86도2090","badge":"","topic":"","from":"GY-2025-2-X-09","seq":null},{"id":"X-OX-396","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"장물인 정을 알면서, 장물을 취득·양도·운반·보관하려는 당사자 사이에 서서 서로를 연결하여 장물의 취득·양도·운반·보관행위를 중개하거나 편의를 도모하였더라도 그 알선에 의하여 당사자 사이에 실제로 장물의 취득·양도·운반·보관에 관한 계약이 성립 하지 아니하였거나 장물의 점유가 현실적으로 이전되지 아니한 경우라면, 장물알선죄는 성립하지 않는다. (24.2차)","answer":false,"quote":"따라서 장물인 정을 알면서, 장물을 취득·양도·운반·보관하려는 당사자 사이에 서서 서로를 연결하여 장물의 취득·양도·운반·보관행위를 중개하거나 편의를 도모하였다면, 그 알선에 의하여 당사자 사이에 실제로 장물의 취득·양도·운반·보관에 관한 계약이 성립하지 아니하였거나 장물의 점유가 현실적으로 이전되지 아니한 경우라도 장물알선죄가 성립한다.","cite":"대법원 2009도1203","badge":"","topic":"","from":"GY-2024-2-X-21","seq":null},{"id":"X-OX-329","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정한 경우, 소급효금지의 원칙에 위반된다. (22.1차)","answer":false,"quote":"대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정한 사안에서, 피고인에게 불리한 법률을 소급하여 적용한 위법이 있다고 할 수 없다고 한 사례.","cite":"대법원 2009도11448","badge":"","topic":"","from":"GY-2022-1-X-01","seq":null},{"id":"X-OX-280","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 피해자의 주거에 침입하여 강간하려다 미수에 그침과 동시에 자기의 형사사건의 수사 또는 재판과 관련하여 수사 단서를 제공하고 진술한 것에 대한 보복 목적으로 그를 폭행한 경우, 특정범죄 가중처벌 등에 관한 법률위반(보복범죄등)죄 및 성폭력범죄의 처벌 등에 관한 특례법위반(주거침입강간등)죄가 각 성립하고 두 죄가 상상적 경합관계에 있다. (24.2차)","answer":true,"quote":"피고인이 피해자의 주거에 침입하여 강간하려다 미수에 그침과 동시에 자기의 형사사건의 수사 또는 재판과 관련하여 수사단서를 제공하고 진술한 것에 대한 보복 목적으로 그를 폭행하였다는 내용으로 기소된 사안에서, 특정범죄 가중처벌 등에 관한 법률 위반(보복범죄등)죄 및 성폭력범죄의 처벌 등에 관한 특례법 위반(주거침입강간등)죄가 각 성립하고 두 죄가 상상적 경합관계에 있다고 본 원심판단을 수긍한 사례","cite":"대법원 2012도544","badge":"","topic":"","from":"GY-2024-2-X-13","seq":null},{"id":"X-OX-402","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"타인과의 신뢰관계에서 일정한 임무에 따라 사무를 처리할 법적 의무가 있는 자가 그 상황에서 당연히 할 것이 법적으로 요구 되는 행위를 하지 않은 경우, 업무상배임의 실행의 착수를 인정 하기 위해서는 그러한 부작위 자체가 존재하는 것으로 족하고 구성요건적 결과 발생의 위험이 구체화한 상황에서의 부작위가 있을 것까지는 요하지 않는다. (25.1차)","answer":false,"quote":"업무상배임죄는 타인과의 신뢰관계에서 일정한 임무에 따라 사무를 처리할 법적 의무가 있는 자가 그 상황에서 당연히 할 것이 법적으로 요구되는 행위를 하지 않는 부작위에 의해서도 성립할 수 있다.","cite":"대법원 2020도15529","badge":"","topic":"","from":"GY-2025-1-X-06","seq":null},{"id":"X-OX-334","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 A가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 A를 간음하였으나 A가 실제로는 심신상실 또는 항거불능의 상태에 있지 않은 경우에는 준강간죄의 장애미수가 성립한다. (22.1차)","answer":false,"quote":"따라서 피고인이 피해자가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 피해자를 간음하였으나 피해자가 실제로는 심신상실 또는 항거불능의 상태에 있지 않은 경우에는, 실행의 수단 또는 대상의 착오로 인하여 준강간죄에서 규정하고 있는 구성요건적 결과의 발생이 처음부터 불가능하였고 실제로 그러한 결과가 발생하였다고 할 수 없다.","cite":"대법원 2018도16002","badge":"","topic":"","from":"GY-2022-1-X-15","seq":null},{"id":"X-OX-336","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"공동거주자 중 한 사람인 A가 정당한 이유 없이 다른 공동 거주자가 공동생활의 장소에 출입하는 것을 금지한 경우, 다른 공동거주자인 甲이 이에 대항하여 공동생활의 장소에 들어갔더라도 주거침입죄는 성립하지 않고, 다만 甲이 그 장소에 출입하기 위하여 출입문의 잠금장치를 손괴하는 등 다소간의 물리력을 행사한 경우에는 주거침입죄가 성립할 수 있다. (22.1차)","answer":false,"quote":"공동거주자 중 한 사람이 법률적인 근거 기타 정당한 이유 없이 다른 공동거주자가 공동생활의 장소에 출입하는 것을 금지하였는데 다른 공동거주자가 이에 대항하여 공동생활의 장소에 들어간 경우, 주거침입죄가 성립하는지 여부 (소극) 및 그 공동거주자가 공동생활의 장소에 출입하기 위하여 출입문의 잠금장치를 손괴하는 등 다소간의 물리력을 행사하여 그 출입을 금지한 공동거주자의 사실상 평온상태를 해쳤더라도 마찬가지인지 여부 (적극) / 이때 그 공동거주자의 승낙을 받아 공동생활의 장소에 함께 들어간 외부인의 출입 및 이용행위가 전체적으로 그의 출입을 승낙한 공동거주자의 통상적인 공동생활 장소의 출입 및 이용행위의 일환이자 이에 수반되는 행위로 평가할 수 있는 경우, 그 외부인에 대하여 주거침입죄가 성립하는지 여부 (소극)","cite":"대법원 2020도6085","badge":"","topic":"","from":"GY-2022-1-X-18","seq":null},{"id":"X-OX-305","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"협박이라 함은, 상대방에게 공포심을 일으킬 목적으로 해악을 고지하는 일체의 행위를 의미하는 것으로서, 고지하는 해악의 내용이 경미하여 상대방이 전혀 개의치 않을 정도인 경우에는 협박에 해당하지 않는다. (25.2차)","answer":true,"quote":"공무집행방해죄에서 협박이란 상대방에게 공포심을 일으킬 목적으로 해악을 고지하는 행위를 의미하는 것으로서 고지하는 해악의 내용이 그 경위, 행위 당시의 주위 상황, 행위자의 성향, 행위자와 상대방과의 친숙함의 정도, 지위 등의 상호관계 등 행위 당시의 여러 사정을 종합하여 객관적으로 상대방으로 하여금 공포심을 느끼게 하는 것이어야 하고, 그 협박이 경미하여 상대방이 전혀 개의치 않을 정도인 경우에는 협박에 해당하지 않는다.","cite":"대법원 2010도15986","badge":"","topic":"","from":"GY-2025-2-X-16","seq":null},{"id":"X-OX-274","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣상 친족상도례 규정은 ｢특정경제범죄 가중처벌 등에 관한 법률｣ 제3조 제1항에 의하여 가중처벌되는 사기죄에도 적용된다. (24.1차)","answer":true,"quote":"특정경제범죄 가중처벌 등에 관한 법률로 가중처벌되는 사기에도 형법의 친족상도례가 적용된다.","cite":"형법 제354조","badge":"","topic":"","from":"GY-2024-1-X-17","seq":null},{"id":"X-OX-382","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"수분양권 매도인 甲이 수분양권 매매계약에 따라 매수인 A에게 수분양권을 이전할 의무를 이행하지 않고, 수분양권 또는 이에 근거하여 향후 소유권을 취득하게 될 목적물을 미리 B에게 처분한 경우, 특별한 사정이 없는 한 甲에게는 배임죄의 기수범이 성립한다. (24.1차)","answer":false,"quote":"수분양권 매도인이 매매계약에 따라 ‘매수인에게 수분양권을 이전할 의무’를 부담하는 경우, 매수인에 대한 관계에서 ‘타인의 사무를 처리하는 자’에 해당하는지 여부 (소극) / 수분양권 매도인이 위와 같은 의무를 이행하지 아니하고 수분양권 또는 이에 근거하여 향후 소유권을 취득하게 될 목적물을 미리 제3자에게 처분한 경우, 형법상 배임죄가 성립하는지 여부 (소극)","cite":"대법원 2014도12104","badge":"","topic":"","from":"GY-2024-1-X-19","seq":null},{"id":"X-OX-314","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강도상해･치상죄와 강간상해･치상죄는 단순히 평면적으로 비교하여 법정형의 과중 여부를 판단할 수 없으므로, 강도상해･치상죄의 법정형 하한을 강간상해･치상죄에 비하여 높게 규정하였다고 하더라도 형벌체계상의 균형을 상실한 것이라고 할 수 없다. (26.1차)","answer":true,"quote":"또한 기본범죄, 보호법익, 죄질 등이 다른 결합범을 단순히 평면적으로 비교하여 법정형의 과중 여부를 판단할 수 없으므로, 심판대상조항이 강도상해죄 또는 강도치상죄의 법정형의 하한을 강간상해죄 또는 강간치상죄, 현주건조물등방화치상죄 등에 비하여 높게 규정하였다고 하더라도 형벌체계상의 균형을 상실하여 평등원칙에 위반된다고 할 수 없다.","cite":"헌재 2020헌바527","badge":"","topic":"","from":"GY-2026-1-X-01","seq":null},{"id":"X-OX-353","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"관리자가 일정한 토지와 외부의 경계에 인적 또는 물적 설비를 갖추고 외부인의 출입을 제한하고 있다면 그 토지에 인접하여 건조물로서의 요건을 갖춘 구조물이 존재하지 않더라도 이러한 토지는 건조물침입죄의 객체인 위요지에 해당한다. (23.1차)","answer":false,"quote":"건조물침입죄에서 침입행위의 객체인 ‘건조물’에 포함되는 ‘위요지’의 의미 / 관리자가 일정한 토지와 외부의 경계에 인적 또는 물적 설비를 갖추고 외부인의 출입을 제한하고 있으나 그 토지에 인접하여 건조물로서의 요건을 갖춘 구조물이 존재하지 않는 경우, 이러한 토지가 건조물침입죄의 객체인 위요지에 해당하는지 여부 (소극)","cite":"대법원 2017도690","badge":"","topic":"","from":"GY-2023-1-X-17","seq":null},{"id":"X-OX-287","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"부동산 관리를 하는 업무자가 건물주로부터 월세임대차계약 체결업무를 위임받고도 임차인들을 속여 전세임대차계약을 체결하고 그 보증금을 편취한 경우, 사기죄와 별도로 업무상 배임죄에 해당한다. (25.1차)","answer":true,"quote":"건물관리인이 건물주로부터 월세임대차계약 체결업무를 위임받고도 임차인들을 속여 전세임대차계약을 체결하고 그 보증금을 편취한 경우, 사기죄와 별도로 업무상배임죄가 성립하고 두 죄가 실체적 경합범의 관계에 있다고 본 원심판단을 수긍한 사례","cite":"대법원 2010도10690","badge":"","topic":"","from":"GY-2025-1-X-12","seq":null},{"id":"X-OX-327","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"사법경찰관은 국가안보를 위협하는 음모행위, 직접적인 사망이나 심각한 상해의 위험을 야기할 수 있는 범죄 또는 조직범죄 등 중대한 범죄의 계획이나 실행 등 긴박한 상황에 있고, 범죄수사를 위한 통신제한조치 허가요건을 구비한 자에 대하여 허가절차를 거칠 수 없는 긴급한 사유가 있는 때에는 법원의 허가없이 통신 제한조치를 할 수 있다. (26.1차)","answer":true,"quote":"① 검사, 사법경찰관 또는 정보수사기관의 장은 국가안보를 위협하는 음모행위, 직접적인 사망이나 심각한 상해의 위험을 야기할 수 있는 범죄 또는 조직범죄등 중대한 범죄의 계획이나 실행 등 긴박한 상황에 있고 제5조제1항 또는 제7조제1항제1호의 규정에 의한 요건을 구비한 자에 대하여 제6조 또는 제7조제1항 및 제3항의 규정에 의한 절차를 거칠 수 없는 긴급한 사유가 있는 때에는 법원의 허가없이 통신제한조치를 할 수 있다. ②검사, 사법경찰관 또는 정보수사기관의 장은 제1항의 규정에 의한 통신제한조치(이하 \"긴급통신제한조치\"라 한다)의 집행착수후 지체없이 제6조 및 제7조제3항의 규정에 의하여 법원에 허가청구를 하여야 하며, 그 긴급통신제한조치를 한 때부터 36시간 이내에 법원의 허가를 받지 못한 때에는 즉시 이를 중지하여야 한다. ③사법경찰관이 긴급통신제한조치를 할 경우에는 미리 검사의 지휘를 받아야 한다. 다만, 특히 급속을 요하여 미리 지휘를 받을 수 없는 사유가 있는 경우에는 긴급통신제한조치의 집행착수후 지체없이 검사의 승인을 얻어야 한다. ④검사, 사법경찰관 또는 정보수사기관의 장이 긴급통신제한조치를 하고자 하는 경우에는 반드시 긴급검열서 또는 긴급감청서(이하 \"긴급감청서등\"이라 한다)에 의하여야 하며 소속기관에 긴급통신제한조치대장을 비치하여야 한다. ⑤긴급통신제한조치가 단시간내에 종료되어 법원의 허가를 받을 필요가 없는 경우에는 그 종료후 7일 이내에 관할 지방검찰청검사장(제1항의 규정에 의하여 정보수사기관의 장이 제7조제1항제1호의 규정에 의한 요건을 구비한 자에 대하여 긴급통신제한조치를 한 경우에는 관할 고등검찰청검사장)은 이에 대응하는 법원장에게 긴급통신제한조치를 한 검사, 사법경찰관 또는 정보수사기관의 장이 작성한 긴급통신제한조치통보서를 송부하여야 한다. 다만, 검찰관 또는 군사법경찰관이 제5조제1항의 규정에 의한 요건을 구비한 자에 대하여 긴급통신제한조치를 한 경우에는 관할 보통검찰부장이 이에 대응하는 보통군사법원 군판사에게 긴급통신제한조치통보서를 송부하여야 한다. ⑥제5항의 규정에 의한 통보서에는 긴급통신제한조치의 목적·대상·범위·기간·집행장소·방법 및 통신제한조치허가청구를 하지 못한 사유 등을 기재하여야 한다. ⑦제5항의 규정에 의하여 긴급통신제한조치통보서를 송부받은 법원 또는 보통군사법원 군판사는 긴급통신제한조치통보대장을 비치하여야 한다. ⑧정보수사기관의 장은 국가안보를 위협하는 음모행위, 직접적인 사망이나 심각한 상해의 위험을 야기할 수 있는 범죄 또는 조직범죄등 중대한 범죄의 계획이나 실행 등 긴박한 상황에 있고 제7조제1항제2호에 해당하는 자에 대하여 대통령의 승인을 얻을 시간적 여유가 없거나 통신제한조치를 긴급히 실시하지 아니하면 국가안전보장에 대한 위해를 초래할 수 있다고 판단되는 때에는 소속 장관(국가정보원장을 포함한다)의 승인을 얻어 통신제한조치를 할 수 있다. ⑨제8항의 규정에 의하여 긴급통신제한조치를 한 때에는 지체없이 제7조의 규정에 의하여 대통령의 승인을 얻어야 하며, 36시간 이내에 대통령의 승인을 얻지 못한 때에는 즉시 그 긴급통신제한조치를 중지하여야 한다. [전문개정 2001.12.29]","cite":"통신비밀보호법 제8조 제1항","badge":"","topic":"","from":"GY-2026-1-X-31","seq":null},{"id":"X-OX-227","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"형법은 태아를 임산부 신체의 일부로 보거나, 낙태행위가 임산부의 태아양육, 출산 기능의 침해라는 측면에서 임산부에 대한 상해죄를 구성하는 것으로 보지는 않는다고 해석된다. (22.1차)","answer":true,"quote":"현행 형법이 사람에 대한 상해 및 과실치사상의 죄에 관한 규정과는 별도로 태아를 독립된 행위객체로 하는 낙태죄, 부동의 낙태죄, 낙태치상 및 낙태치사의 죄 등에 관한 규정을 두어 포태한 부녀의 자기낙태행위 및 제3자의 부동의 낙태행위, 낙태로 인하여 위 부녀에게 상해 또는 사망에 이르게 한 행위 등에 대하여 처벌하도록 한 점, 과실낙태행위 및 낙태미수행위에 대하여 따로 처벌규정을 두지 아니한 점 등에 비추어 보면, 우리 형법은 태아를 임산부 신체의 일부로 보거나, 낙태행위가 임산부의 태아양육, 출산 기능의 침해라는 측면에서 낙태죄와는 별개로 임산부에 대한 상해죄를 구성하는 것으로 보지는 않는다고 해석된다.","cite":"대법원 2005도3832","badge":"","topic":"","from":"GY-2022-1-X-14","seq":null},{"id":"X-OX-243","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"골프장의 경기보조원 甲은 골프 카트에 A를 태우면서 출발에 앞서 안전 손잡이를 잡도록 고지하지 않고, 이를 잡았는지 확인하지도 않은 채 출발 후 각도 70°가 넘는 우로 굽은 길에서 속도를 줄이지 않고 급하게 우회전하여 A가 골프 카트에서 떨어져 상해를 입은 경우 (22.2차)","answer":true,"quote":"골프장의 경기보조원인 피고인이 골프 카트에 피해자 등 승객들을 태우고 진행하기 전에 안전 손잡이를 잡도록 고지하지도 않고, 또한 승객들이 안전 손잡이를 잡았는지 확인하지도 않은 상태에서 만연히 출발하였으며, 각도 70°가 넘는 우로 굽은 길을 속도를 충분히 줄이지 않고 급하게 우회전한 업무상 과실로, 피해자를 골프 카트에서 떨어지게 하여 두개골골절, 지주막하출혈 등의 상해를 입게 하였다고 본 원심판단을 수긍한 사례.","cite":"대법원 2010도1911","badge":"","topic":"","from":"GY-2022-2-X-12","seq":null},{"id":"X-OX-316","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제299조 준강간죄에서 ‘항거불능’의 상태란 심신상실 이외의 원인으로 심리적 또는 물리적으로 반항이 절대적으로 불가능하거나 현저히 곤란한 경우를 의미한다. (26.1차)","answer":true,"quote":"준강간죄에서 ‘항거불능’의 상태란 심신상실 이외의 원인으로 심리적 또는 물리적으로 반항이 절대적으로 불가능하거나 현저히 곤란한 경우를 의미한다.","cite":"대법원 2021도11938","badge":"","topic":"","from":"GY-2026-1-X-14","seq":null},{"id":"X-OX-413","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"乙이 대문을 손괴한 행위는 甲의 부당한 공격을 방위하기 위한 행위로서 ｢형법｣ 제21조 정당방위에 해당한다. (25.2차)","answer":false,"quote":"정당방위는 침해자에게 반격하는 것이라, 공격을 피하려고 제3자 丙의 대문을 부순 것은 긴급피난으로 따진다.","cite":"형법 제21조 · 형법 제22조","badge":"","topic":"","from":"GY-2025-2-X-06","seq":null},{"id":"X-OX-318","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"예금주인 현금카드 소유자로부터 일정한 금액의 현금을 인출해 오라는 부탁과 함께 현금카드를 건네받아 그 위임을 받은 금액을 초과하여 현금을 인출하는 방법으로 그 차액 상당을 위법하게 이득할 의사로 현금자동지급기에 그 초과된 금액이 인출되도록 입력하여 그 초과된 금액의 현금을 인출한 경우, 그 차액 상당액에 대한 컴퓨터 등 사용사기죄가 성립한다. (26.1차)","answer":true,"quote":"예금주인 현금카드 소유자로부터 일정한 금액의 현금을 인출해 오라는 부탁을 받으면서 이와 함께 현금카드를 건네받은 것을 기화로 그 위임을 받은 금액을 초과하여 현금을 인출하는 방법으로 그 차액 상당을 위법하게 이득할 의사로 현금자동지급기에 그 초과된 금액이 인출되도록 입력하여 그 초과된 금액의 현금을 인출한 경우에는 그 인출된 현금에 대한 점유를 취득함으로써 이 때에 그 인출한 현금 총액 중 인출을 위임받은 금액을 넘는 부분의 비율에 상당하는 재산상 이익을 취득한 것으로 볼 수 있으므로 이러한 행위는 그 차액 상당액에 관하여 형법 제347조의2 (컴퓨터등사용사기)에 규정된 ‘컴퓨터 등 정보처리장치에 권한 없이 정보를 입력하여 정보처리를 하게 함으로써 재산상의 이익을 취득’하는 행위로서 컴퓨터 등 사용사기죄에 해당된다.","cite":"대법원 2005도3516","badge":"","topic":"","from":"GY-2026-1-X-17","seq":null},{"id":"X-OX-392","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 상대방으로부터 금품이나 재산상 이익을 받을 것을 약속 하고 성행위를 하는 경우 그 행위의 대가는 사기죄의 객체인 경제적 이익에 해당하지 않는다. (24.2차)","answer":false,"quote":"일반적으로 부녀와의 성행위 자체는 경제적으로 평가할 수 없고, 부녀가 상대방으로부터 금품이나 재산상 이익을 받을 것을 약속하고 성행위를 하는 약속 자체는 선량한 풍속 기타 사회질서에 위반한 사항을 내용으로 하는 법률행위로서 무효이나, 사기죄의 객체가 되는 재산상의 이익이 반드시 사법(私法)상 보호되는 경제적 이익만을 의미하지 아니하고, 부녀가 금품 등을 받을 것을 전제로 성행위를 하는 경우 그 행위의 대가는 사기죄의 객체인 경제적 이익에 해당하므로, 부녀를 기망하여 성행위 대가의 지급을 면하는 경우 사기죄가 성립한다.","cite":"대법원 2001도2991","badge":"","topic":"","from":"GY-2024-2-X-19","seq":null},{"id":"X-OX-230","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"위계에 의한 간음죄에 해당하는지 여부를 판단할 때에는 구체적인 범행 상황에 놓인 피해자의 입장과 관점이 충분히 고려되어야 하고, 일반적 평균적 판단능력을 갖춘 성인 또는 충분한 보호와 교육을 받은 또래의 시각에서 인과관계를 쉽사리 부정하여서는 안 된다. (22.1차)","answer":true,"quote":"한편 위계에 의한 간음죄가 보호대상으로 삼는 아동·청소년, 미성년자, 심신미약자, 피보호자·피감독자, 장애인 등의 성적 자기결정 능력은 그 나이, 성장과정, 환경, 지능 내지 정신기능 장애의 정도 등에 따라 개인별로 차이가 있으므로 간음행위와 인과관계가 있는 위계에 해당하는지 여부를 판단할 때에는 구체적인 범행 상황에 놓인 피해자의 입장과 관점이 충분히 고려되어야 하고, 일반적·평균적 판단능력을 갖춘 성인 또는 충분한 보호와 교육을 받은 또래의 시각에서 인과관계를 쉽사리 부정하여서는 안 된다.","cite":"대법원 2015도9436","badge":"","topic":"","from":"GY-2022-1-X-16","seq":null},{"id":"X-OX-311","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 乙의 주택에 무단 침입한 범죄사실로 이미 유죄판결을 받은 후, 판결 확정 후에도 퇴거하지 않은 채 계속하여 乙의 주택에 거주한 경우, 판결확정 이후의 甲의 행위에 대해 별도의 주거침입죄가 성립한다. (25.2차)","answer":true,"quote":"다른 사람의 주택에 무단 침입한 범죄사실로 이미 유죄판결을 받은 사람이 판결 확정 후에도 퇴거하지 않은 채 계속하여 당해 주택에 거주한 사안에서, 판결확정 이후의 행위는 별도의 주거침입죄를 구성한다고 한 사례","cite":"대법원 2007도11322","badge":"","topic":"","from":"GY-2025-2-X-19","seq":null},{"id":"X-OX-389","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강제추행죄의 폭행 또는 협박이 추행보다 시간적으로 앞서 그 수단으로 행해진 이른바 폭행·협박 선행형의 경우에는 상대방의 항거를 곤란하게 하는 정도의 폭행 또는 협박이어야 한다. (24.2차)","answer":false,"quote":"[다수의견] (가) 형법 및 성폭력범죄의 처벌 등에 관한 특례법(이하 ‘성폭력처벌법’이라 한다)은 강제추행죄의 구성요건으로 ‘폭행 또는 협박’을 규정하고 있는데, 대법원은 강제추행죄의 ‘폭행 또는 협박’의 의미에 관하여 이를 두 가지 유형으로 나누어, 폭행행위 자체가 곧바로 추행에 해당하는 경우(이른바 기습추행형)에는 상대방의 의사를 억압할 정도의 것임을 요하지 않고 상대방의 의사에 반하는 유형력의 행사가 있는 이상 그 힘의 대소강약을 불문한다고 판시하는 한편, 폭행 또는 협박이 추행보다 시간적으로 앞서 그 수단으로 행해진 경우(이른바 폭행·협박 선행형)에는 상대방의 항거를 곤란하게 하는 정도의 폭행 또는 협박이 요구된다고 판시하여 왔다(이하 폭행·협박 선행형 관련 판례 법리를 ‘종래의 판례 법리’라 한다).","cite":"대법원 2018도13877","badge":"","topic":"","from":"GY-2024-2-X-16","seq":null},{"id":"X-OX-324","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"업무상배임죄에서 재산상의 손해라 함은 현실적인 손해가 발생한 경우뿐만 아니라 재산상 실해 발생의 위험을 초래한 경우도 포함되고, 재산상 손해의 유무에 대한 판단은 법률적 판단에 의하지 않고 경제적 관점에서 파악하여야 한다. (26.1차)","answer":true,"quote":"업무상배임죄는 업무상 타인의 사무를 처리하는 자가 임무에 위배하는 행위를 하고 그러한 임무위배행위로 인하여 재산상의 이익을 취득하거나 제3자로 하여금 이를 취득하게 하여 본인에게 재산상의 손해를 가한 때 성립하는데, 여기서 재산상의 손해에는 현실적인 손해가 발생한 경우뿐만 아니라 재산상 실해 발생의 위험을 초래한 경우도 포함되고, 재산상 손해의 유무에 대한 판단은 법률적 판단에 의하지 않고 경제적 관점에서 파악하여야 한다.","cite":"대법원 2017도6151","badge":"","topic":"","from":"GY-2026-1-X-19","seq":null},{"id":"X-OX-342","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"지하철 공사구간 현장안전업무 담당자 甲은 공사현장에 인접한 기존의 횡단보도 표시선 안쪽으로 돌출된 강철빔 주위에 라바콘 3개를 설치하고 신호수 1명을 배치하였는데, A가 그 횡단보도를 건너면서 강철빔에 부딪혀 상해를 입은 경우 (22.2차)","answer":false,"quote":"지하철 공사구간 현장안전업무 담당자인 피고인이 공사현장에 인접한 기존의 횡단보도 표시선 안쪽으로 돌출된 강철빔 주위에 라바콘 3개를 설치하고 신호수 1명을 배치하였는데, 피해자가 위 횡단보도를 건너면서 강철빔에 부딪혀 상해를 입은 사안에서, 제반 사정에 비추어 피고인이 안전조치를 취하여야 할 업무상 주의의무를 위반하였다고 보기 어려운데도, 이와 달리 보아 업무상과실치상죄를 인정한 원심판결에 법리오해 등의 잘못이 있다고 한 사례.","cite":"대법원 2012도11361","badge":"","topic":"","from":"GY-2022-2-X-12","seq":null},{"id":"X-OX-242","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"건축자재인 철판 수백 장의 운반을 의뢰한 생산자 甲이 절단면이 날카롭고 무거운 철판을 묶기에 매우 부적합한 폴리에스터 끈을 사용하여 철판 묶음 작업을 한 탓에 철판 쏠림 현상이 발생하였고, 이로 인하여 철판을 차에서 내리는 과정에서 철판이 쏟아져 내려 화물차 운전자 A가 사망한 경우 (22.2차)","answer":true,"quote":"건축자재인 철판 수백 장의 운반을 의뢰한 자가 절단면이 날카롭고 무거운 철판을 묶기에 매우 부적합한 폴리에스터 끈을 사용하여 철판 묶음 작업을 하는 등의 과실로 철판 쏠림 현상이 발생하였고, 이로 인하여 철판을 차에서 내리는 과정에서 철판이 쏟아져 내려 화물차 운전자가 사망한 사안에서, 운반 의뢰인에게 업무상 과실치사의 죄책을 인정한 사례","cite":"대법원 2009도3219","badge":"","topic":"","from":"GY-2022-2-X-12","seq":null},{"id":"X-OX-232","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주간에 절도의 목적으로 타인의 주거에 침입하였다고 하여도 아직 절취할 물건의 물색행위를 시작하기 전이라면 절도죄의 실행에 착수한 것으로 볼 수 없는 것이어서 절도미수죄는 성립하지 않는다. (22.1차)","answer":true,"quote":"절도죄의 실행의 착수시기는 재물에 대한 타인의 사실상의 지배를 침해하는 데에 밀접한 행위를 개시한 때라고 보아야 하므로, 야간이 아닌 주간에 절도의 목적으로 타인의 주거에 침입하였다고 하여도 아직 절취할 물건의 물색행위를 시작하기 전이라면 주거침입죄만 성립할뿐 절도죄의 실행에 착수한 것으로 볼 수 없는 것이어서 절도미수죄는 성립하지 않는다.","cite":"대법원 92도1650","badge":"","topic":"","from":"GY-2022-1-X-19","seq":null},{"id":"X-OX-328","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"알 수 없는 경위로 가상자산을 이체받은 자가 가상자산을 사용 처분한 경우 이를 형사처벌하는 명문의 규정이 없다고 하더라도 착오송금 시 횡령죄 성립을 긍정한 판례를 유추하여 신의칙을 근거로 배임죄로 처벌하는 것은 죄형법정주의에 반하지 않는다. (22.1차)","answer":false,"quote":"원인불명으로 재산상 이익인 가상자산을 이체받은 자가 가상자산을 사용·처분한 경우 이를 형사처벌하는 명문의 규정이 없는 현재의 상황에서 착오송금 시 횡령죄 성립을 긍정한 판례를 유추하여 신의칙을 근거로 피고인을 배임죄로 처벌하는 것은 죄형법정주의에 반한다.","cite":"대법원 2020도9789","badge":"","topic":"","from":"GY-2022-1-X-01","seq":null},{"id":"X-OX-233","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"어떠한 물건을 점유자의 의사에 반하여 취거하는 행위가 결과 적으로 소유자의 이익으로 된다는 사정 또는 소유자의 추정적 승낙이 있다고 볼 만한 사정이 있다고 하더라도, 다른 특별한 사정이 없는 한 그러한 사유만으로 불법영득의 의사가 없다고 할 수는 없다. (22.1차)","answer":true,"quote":"따라서 어떠한 물건을 점유자의 의사에 반하여 취거하는 행위가 결과적으로 소유자의 이익으로 된다는 사정 또는 소유자의 추정적 승낙이 있다고 볼 만한 사정이 있다고 하더라도, 다른 특별한 사정이 없는 한 그러한 사유만으로 불법영득의 의사가 없다고 할 수는 없다.","cite":"대법원 2013도14139","badge":"","topic":"","from":"GY-2022-1-X-19","seq":null},{"id":"X-OX-275","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"건물의 임차인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하였는데도 A에게 채권양도 통지를 하지 않고 A로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용한 경우, 별도의 약정이나 그 밖의 특별한 사정이 인정되지 않는 한 甲에게는 횡령죄가 성립하지 않는다. (24.1차)","answer":true,"quote":"건물의 임차인인 피고인이 임대인 甲에 대한 임대차보증금반환채권을 乙에게 양도하였는데도 甲에게 채권양도 통지를 하지 않고 甲으로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용하여 이를 횡령하였다는 내용으로 기소된 사안에서, 피고인이 乙과 임대차보증금반환채권에 관한 채권양도계약을 체결하고 甲에게 채권양도 통지를 하기 전에 甲으로부터 채권을 추심하여 남아 있던 임대차보증금을 수령하였더라도 임대차보증금으로 받은 금전의 소유권은 피고인에게 귀속할 뿐 乙에게 귀속한다고 볼 수 없고, 나아가 채권양도계약을 체결한 피고인과 乙은 통상의 권리이전계약에 따른 이익대립관계에 있을 뿐 피고인이 乙을 위한 보관자 지위가 인정될 수 있는 신임관계에 있다고 볼 수 없어 횡령죄가 성립하지 않는다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 채권양도에서 횡령죄의 성립 등에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도3829","badge":"","topic":"","from":"GY-2024-1-X-20","seq":null},{"id":"X-OX-387","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 보이스피싱 사기 범죄단체에 가입한 후 사기범죄의 피해자 들로부터 돈을 편취하는 등 그 구성원으로서 활동한 경우, 범죄 단체 가입행위 또는 범죄단체 구성원으로서 활동하는 행위와 사기행위는 법조경합 중 흡수관계에 있으므로 목적된 범죄인 사기죄만 성립한다. (24.2차)","answer":false,"quote":"피고인이 보이스피싱 사기 범죄단체에 가입한 후 사기범죄의 피해자들로부터 돈을 편취하는 등 그 구성원으로서 활동하였다는 내용의 공소사실이 유죄로 인정된 사안에서, 범죄단체 가입행위 또는 범죄단체 구성원으로서 활동하는 행위와 사기행위는 각각 별개의 범죄구성요건을 충족하는 독립된 행위이고 서로 보호법익도 달라 법조경합 관계로 목적된 범죄인 사기죄만 성립하는 것은 아니라고 본 원심판단을 수긍한 사례.","cite":"대법원 2017도8600","badge":"","topic":"","from":"GY-2024-2-X-13","seq":null},{"id":"X-OX-341","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"위치추적 전자장치의 피부착자 甲이 그 장치의 구성 부분인 휴대용 추적장치를 분실한 후 3일이 경과하도록 보호관찰소에 분실신고를 하지 않고 돌아다닌 경우, 분실을 넘어서서 상당한 기간 동안 휴대용 추적장치가 없는 상태를 방치한 부작위는 전자장치 부착 등에 관한 법률 제38조에 따른 전자장치의 효용을 해한 행위에 해당하지 아니한다. (22.2차)","answer":false,"quote":"위치추적 전자장치의 피부착자인 피고인이 구성 부분인 휴대용 추적장치를 분실한 후 3일이 경과하도록 보호관찰소에 분실신고를 하지 않고 돌아다니는 등 전자장치의 효용을 해하였다고 하여 특정 범죄자에 대한 위치추적 전자장치 부착 등에 관한 법률 위반으로 기소된 사안에서, 피고인이 휴대용 추적장치의 분실을 넘어서서 상당한 기간 동안 휴대용 추적장치가 없는 상태를 임의로 방치하여 전자장치의 효용이 정상적으로 발휘될 수 없는 상태를 이룬 행위를 전자장치의 효용을 해한 행위로 보고, 위 행위에 고의가 있었음을 전제로 유죄를 인정한 원심판단을 정당하다고 한 사례.","cite":"대법원 2012도5862","badge":"","topic":"","from":"GY-2022-2-X-09","seq":null},{"id":"X-OX-258","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"가압류 후에 목적물의 소유권을 취득한 제3취득자가 다른 사람에 대한 허위의 채무에 기하여 근저당권설정등기를 경료하더라도 강제집행면탈죄를 구성하지 않는다. (23.1차)","answer":true,"quote":"따라서 가압류 후에 목적물의 소유권을 취득한 제3취득자가 다른 사람에 대한 허위의 채무에 기하여 근저당권설정등기 등을 경료하더라도 이로써 가압류채권자의 법률상 지위에 어떤 영향을 미치지 않으므로, 강제집행면탈죄에 해당하지 아니한다.","cite":"대법원 2008도2476","badge":"","topic":"","from":"GY-2023-1-X-22","seq":null},{"id":"X-OX-423","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"행정상 공표의 방법으로 실명을 공개함으로써 타인의 명예를 훼손한 경우, 그 내용이 오로지 공공의 이익에 관한 것이라면 공표사실이 의심의 여지없이 확실히 진실이라고 믿을 만한 객관적이고도 타당한 확증과 근거가 없더라도 명예훼손의 위법성은 조각된다. (26.1차)","answer":false,"quote":"국가기관이 행정목적달성을 위하여 언론에 보도자료를 제공하는 등 이른바 행정상 공표의 방법으로 실명을 공개함으로써 타인의 명예를 훼손한 경우, 그 공표된 사람에 관하여 적시된 사실의 내용이 진실이라는 증명이 없더라도 국가기관이 공표 당시 이를 진실이라고 믿었고 또 그렇게 믿을 만한 상당한 이유가 있다면 위법성이 없는 것이고, 이 점은 언론을 포함한 사인에 의한 명예훼손의 경우에서와 마찬가지이다.","cite":"대법원 93다18389","badge":"","topic":"","from":"GY-2026-1-X-15","seq":null},{"id":"X-OX-283","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"행위자 자신이 다른 사람과 공동으로 거주하거나 관리 또는 점유하는 주거 등에 임의로 출입하더라도 주거침입죄를 구성 하지 않지만, 다른 사람과 공동으로 주거에 거주하거나 건조물을 관리하던 사람이 공동생활관계에서 이탈하거나 주거 등에 대한 사실상의 지배·관리를 상실한 경우 등 특별한 사정이 있는 경우에 주거침입죄가 성립할 수 있다. (24.2차)","answer":true,"quote":"다만 다른 사람과 공동으로 주거에 거주하거나 건조물을 관리하던 사람이 공동생활관계에서 이탈하거나 주거 등에 대한 사실상의 지배ㆍ관리를 상실한 경우 등 특별한 사정이 있는 경우에 주거침입죄가 성립할 수 있을 뿐이다.","cite":"대법원 2020도6085","badge":"","topic":"","from":"GY-2024-2-X-17","seq":null},{"id":"X-OX-236","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"침해행정 영역에서 일반 국민이 담당 공무원을 기망하여 권력작용에 의한 재산권 제한을 면하는 경우에는 부과권자의 직접적인 권력작용을 사기죄의 보호법익인 재산권과 동일 하게 평가할 수 없는 것이므로 사기죄는 성립할 수 없다. (22.1차)","answer":true,"quote":"이러한 침해행정 영역에서 일반 국민이 담당 공무원을 기망하여 권력작용에 의한 재산권 제한을 면하는 경우에는 부과권자의 직접적인 권력작용을 사기죄의 보호법익인 재산권과 동일하게 평가할 수 없는 것이므로, 행정법규에서 그러한 행위에 대한 처벌규정을 두어 처벌함은 별론으로 하고, 사기죄는 성립할 수 없다.","cite":"대법원 2019도2003","badge":"","topic":"","from":"GY-2022-1-X-20","seq":null},{"id":"X-OX-259","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"협박죄는 사람의 의사결정의 자유를 보호법익으로 하는 위험범 이라 봄이 상당하고, 협박죄의 미수범 처벌조항은 해악의 고지가 현실적으로 상대방에게 도달하지 아니한 경우나, 도달은 하였으나 상대방이 이를 지각하지 못하였거나 고지된 해악의의미를 인식하지 못한 경우 등에 적용될 뿐이다. (23.2차)","answer":true,"quote":"(나) 결국, 협박죄는 사람의 의사결정의 자유를 보호법익으로 하는 위험범이라 봄이 상당하고, 협박죄의 미수범 처벌조항은 해악의 고지가 현실적으로 상대방에게 도달하지 아니한 경우나, 도달은 하였으나 상대방이 이를 지각하지 못하였거나 고지된 해악의 의미를 인식하지 못한 경우 등에 적용될 뿐이다.","cite":"대법원 2007도606","badge":"","topic":"","from":"GY-2023-2-X-16","seq":null},{"id":"X-OX-239","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 법무사가 아님에도 자신이 법무사로 소개되거나 호칭 되는 상황에서 자신이 법무사가 아니라는 사실을 밝히지 않은 채 법무사 행세를 계속하면서 근저당권설정계약서를 작성해 준 경우, 甲에게는 부작위에 의한 법무사법 위반(법무사가 아닌 자에 대한 금지)죄가 성립한다. (22.2차)","answer":true,"quote":"법무사가 아닌 사람이 법무사로 소개되거나 호칭되는 데에도 자신이 법무사가 아니라는 사실을 밝히지 않은 채 법무사 행세를 계속하면서 근저당권설정계약서를 작성한 사안에서, 부작위에 의한","cite":"대법원 2007도9354","badge":"","topic":"","from":"GY-2022-2-X-09","seq":null},{"id":"X-OX-303","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 乙에게 중상해를 교사하였는데 乙이 이를 넘어 살인을 실행한 경우, 일반적으로 甲은 중상해죄의 죄책을 지게 되는 것이지만, 이 경우에 甲에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다. (25.2차)","answer":true,"quote":"교사자가 피교사자에 대하여 상해 또는 중상해를 교사하였는데 피교사자가 이를 넘어 살인을 실행한 경우에, 일반적으로 교사자는 상해죄 또는 중상해죄의 죄책을 지게 되는 것이지만 이 경우에 교사자에게 피해자의 사망이라는 결과에 대하여 과실 내지 예견가능성이 있는 때에는 상해치사죄의 죄책을 지울 수 있다.","cite":"대법원 2002도4089","badge":"","topic":"","from":"GY-2025-2-X-14","seq":null},{"id":"X-OX-284","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"다가구용 단독주택이나 아파트와 같은 공동주택 내부의 엘리 베이터, 공용 계단, 복도 등 공용 부분도 주거침입죄의 객체인 ‘사람의 주거’에 해당한다. (24.2차)","answer":true,"quote":"따라서 다가구용 단독주택이나 다세대주택·연립주택·아파트 등 공동주택 안에서 공용으로 사용하는 계단과 복도는, 주거로 사용하는 각 가구 또는 세대의 전용 부분에 필수적으로 부속하는 부분으로서 그 거주자들에 의하여 일상생활에서 감시·관리가 예정되어 있고 사실상의 주거의 평온을 보호할 필요성이 있는 부분이므로, 특별한 사정이 없는 한 주거침입죄의 객체인 ‘사람의 주거’에 해당한다.","cite":"대법원 2009도3452","badge":"","topic":"","from":"GY-2024-2-X-17","seq":null},{"id":"X-OX-285","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"사기범행의 공범이 아닌 계좌명의인이 개설한 예금계좌가 전기통신금융사기 범행에 이용되어 그 계좌에 피해자가 사기 피해금을 송금·이체한 경우에는 계좌명의인은 피해자를 위하여 사기피해금을 보관하는 지위에 있다고 보아야 하므로, 계좌 명의인이 그 돈을 영득할 의사로 인출하면 피해자에 대한 횡령죄가 성립한다. (24.2차)","answer":true,"quote":"계좌명의인은 피해자와 사이에 아무런 법률관계 없이 송금·이체된 사기피해금 상당의 돈을 피해자에게 반환하여야 하므로, 피해자를 위하여 사기피해금을 보관하는 지위에 있다고 보아야 하고, 만약 계좌명의인이 그 돈을 영득할 의사로 인출하면 피해자에 대한 횡령죄가 성립한다.","cite":"대법원 2017도17494","badge":"","topic":"","from":"GY-2024-2-X-20","seq":null},{"id":"X-OX-397","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"단순히 보수를 받고 본범을 위하여 장물을 일시 사용하거나 그와 같이 사용할 목적으로 장물을 건네받은 것만으로도 장물 취득죄가 성립한다. (24.2차)","answer":false,"quote":"장물취득죄에서 '취득'이라고 함은 점유를 이전받음으로써 그 장물에 대하여 사실상의 처분권을 획득하는 것을 의미하는 것이므로, 단순히 보수를 받고 본범을 위하여 장물을 일시 사용하거나 그와 같이 사용할 목적으로 장물을 건네받은 것만으로는 장물을 취득한 것으로 볼 수 없다.","cite":"대법원 2003도1366","badge":"","topic":"","from":"GY-2024-2-X-21","seq":null},{"id":"X-OX-428","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"문서가 자기명의인 경우에는 타인 소유라 하더라도 문서손괴죄의 객체가 될 수 없다. (26.1차)","answer":false,"quote":"문서손괴죄의 객체는 타인 소유의 문서여서, 자기 명의의 문서라도 이미 남에게 접수되어 있다면 객체가 된다.","cite":"대법원 87도177 · 형법 제366조","badge":"","topic":"","from":"GY-2026-1-X-21","seq":null},{"id":"X-OX-376","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"피해자가 술･약물 등에 의해 완전히 의식을 잃지 않았다면 그와 같은 사유로 정상적인 판단능력과 대응･조절능력을 행사할 수 없는 상태에 있었더라도 준강제추행죄에서의 심신상실 또는 항거 불능 상태에 해당한다고 볼 수 없다. (24.1차)","answer":false,"quote":"피해자가 깊은 잠에 빠져 있거나 술·약물 등에 의해 일시적으로 의식을 잃은 상태 또는 완전히 의식을 잃지는 않았더라도 그와 같은 사유로 정상적인 판단능력과 대응·조절능력을 행사할 수 없는 상태에 있었다면 준강간죄 또는 준강제추행죄에서의 심신상실 또는 항거불능 상태에 해당한다.","cite":"대법원 2018도9781","badge":"","topic":"","from":"GY-2024-1-X-14","seq":null},{"id":"X-OX-399","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 A에 대한 채무를 담보하기 위하여 자기 소유의 건물과 기계·기구를 A의 근저당권의 목적물로 제공한 경우에 甲이 담보유지의무를 위반하여 A의 근저당권의 목적이 된 건물을 철거 및 멸실등기하고, 기계·기구를 양도한 행위만으로는 물건을 손괴 또는 은닉하여 A의 권리행사를 방해한 행위로서 권리행사방해죄가 성립한다고 볼 수 없다. (24.2차)","answer":false,"quote":"근저당 목적 건물을 철거·멸실등기하고 기계·기구를 양도하면 물건을 손괴·은닉해 근저당권자의 권리행사를 방해한 것이라 권리행사방해죄가 된다.","cite":"대법원 2020도14735 · 형법 제323조","badge":"","topic":"","from":"GY-2024-2-X-22","seq":null},{"id":"X-OX-360","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용･수익 하는 행위는 소유자를 배제한 채 물건의 이용가치를 영득하는 것이고, 그 때문에 소유자가 물건의 효용을 누리지 못하게 되었다면 그 효용 자체가 침해된 것으로 볼 수 있어 재물손괴죄를 구성한다. (23.1차)","answer":false,"quote":"다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용·수익하는 행위는 소유자를 배제한 채 물건의 이용가치를 영득하는 것이고, 그 때문에 소유자가 물건의 효용을 누리지 못하게 되었더라도 효용 자체가 침해된 것이 아니므로 재물손괴죄에 해당하지 않는다.","cite":"대법원 2022도1410","badge":"","topic":"","from":"GY-2023-1-X-22","seq":null},{"id":"X-OX-296","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"건물의 임차인인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하였는데도 A에게 채권양도 통지를 하지 않고 A로부터 임대차보증금을수령한후 개인적인용도로 처분한 경우, 특별한 사정이 없는 한 B에 대한 횡령죄는 성립하지 않는다. (25.1차)","answer":true,"quote":"건물의 임차인인 피고인이 임대인 甲에 대한 임대차보증금반환채권을 乙에게 양도하였는데도 甲에게 채권양도 통지를 하지 않고 甲으로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용하여 이를 횡령하였다는 내용으로 기소된 사안에서, 피고인이 乙과 임대차보증금반환채권에 관한 채권양도계약을 체결하고 甲에게 채권양도 통지를 하기 전에 甲으로부터 채권을 추심하여 남아 있던 임대차보증금을 수령하였더라도 임대차보증금으로 받은 금전의 소유권은 피고인에게 귀속할 뿐 乙에게 귀속한다고 볼 수 없고, 나아가 채권양도계약을 체결한 피고인과 乙은 통상의 권리이전계약에 따른 이익대립관계에 있을 뿐 피고인이 乙을 위한 보관자 지위가 인정될 수 있는 신임관계에 있다고 볼 수 없어 횡령죄가 성립하지 않는다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 채권양도에서 횡령죄의 성립 등에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도3829","badge":"","topic":"","from":"GY-2025-1-X-22","seq":null},{"id":"X-OX-366","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"폭행치사죄와 상해치사죄까지 ｢형법｣ 제263조(동시범)를 적용 하면 피고인에게 불리한 유추적용이 되므로 동 규정의 적용은 배제되어야 한다. (23.2차)","answer":false,"quote":"동시범 규정은 폭행치사·상해치사에도 적용되어, 사망의 원인 행위가 판명되지 않으면 공동정범의 예에 따른다.","cite":"대법원 2000도2466 · 형법 제263조","badge":"","topic":"","from":"GY-2023-2-X-14","seq":null},{"id":"X-OX-356","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주거침입이 주간에 이루어졌더라도 야간에 절취행위를 하였다면 야간주거침입절도죄가 성립한다. (23.1차)","answer":false,"quote":"이러한 형법 제330조 의 규정형식과 그 구성요건의 문언에 비추어 보면, 형법은 야간에 이루어지는 주거침입행위의 위험성에 주목하여 그러한 행위를 수반한 절도를 야간주거침입절도죄로 중하게 처벌하고 있는 것으로 보아야 하고, 따라서 주거침입이 주간에 이루어진 경우에는 야간주거침입절도죄가 성립하지 않는다고 해석하는 것이 타당하다.","cite":"대법원 2011도300","badge":"","topic":"","from":"GY-2023-1-X-19","seq":null},{"id":"X-OX-406","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 사람 및 차량의 왕래가 빈번한 도로에서 A(여, 48세)에게 성적인 성질을 가지지 아니한 욕설을 하면서 어떠한 신체의 접촉도 없이 단지 자신의 바지를 벗어 성기를 보여준 경우, 甲의 행위는 강제추행죄를 구성한다. (25.1차)","answer":false,"quote":"피고인이 피해자 甲(여, 48세)에게 욕설을 하면서 자신의 바지를 벗어 성기를 보여주는 방법으로 강제추행하였다는 내용으로 기소된 사안에서, 甲의 성별·연령, 행위에 이르게 된 경위, 甲에 대하여 어떠한 신체 접촉도 없었던 점, 행위장소가 사람 및 차량의 왕래가 빈번한 도로로서 공중에게 공개된 곳인 점, 피고인이 한 욕설은 성적인 성질을 가지지 아니하는 것으로서 ‘추행’과 관련이 없는 점, 甲이 자신의 성적 결정의 자유를 침해당하였다고 볼 만한 사정이 없는 점 등 제반 사정을 고려할 때, 단순히 피고인이 바지를 벗어 자신의 성기를 보여준 것만으로는 폭행 또는 협박으로 ‘추행’을 하였다고 볼 수 없는데도, 이와 달리 보아 유죄를 인정한 원심판결에 강제추행죄의 추행에 관한 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2011도8805","badge":"","topic":"","from":"GY-2025-1-X-16","seq":null},{"id":"X-OX-252","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"살인예비죄가 성립하기 위하여는 살인죄를 범할 목적 외에도 살인의 준비에 관한 고의가 있어야 한다. (23.1차)","answer":true,"quote":"형법 제255조 , 제250조 의 살인예비죄가 성립하기 위하여는 형법 제255조 에서 명문으로 요구하는 살인죄를 범할 목적 외에도 살인의 준비에 관한 고의가 있어야 하며, 나아가 실행의 착수까지에는 이르지 아니하는 살인죄의 실현을 위한 준비행위가 있어야 한다.","cite":"대법원 2009도7150","badge":"","topic":"","from":"GY-2023-1-X-14","seq":null},{"id":"X-OX-294","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"법인의 대표기관이 아닌 대리인이나 지배인이 대표기관과 공모 없이 한 행위라도 그 직무권한 범위 내에서 직무에 관하여 타인이 점유하는 법인의 물건을 취거한 경우, 이는 권리행사 방해죄가 규정하는 ‘자기의 물건을 취거한 경우’에 해당한다. (25.1차)","answer":true,"quote":"법인의 대표기관이 아닌 대리인이나 지배인이 대표기관과 공모 없이 한 행위라도 그 직무권한 범위 내에서 직무에 관하여 타인이 점유하는 법인의 물건을 취거한 경우, 권리행사방해죄가 규정하는 ‘자기의 물건을 취거한 경우’에 해당하는지 여부 (적극)","cite":"대법원 2020도9801","badge":"","topic":"","from":"GY-2025-1-X-22","seq":null},{"id":"X-OX-286","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"장물인 정을 모르고 보관하던 중 장물인 정을 알게되었으면서도 계속 보관함으로써 피해자의 정당한 반환청구권 행사를 어렵게 하고 위법한 재산상태를 유지시키는 때에는 장물보관죄가 성립한다. (24.2차)","answer":true,"quote":"장물인 정을 모르고 보관하던 중 장물인 정을 알게 되었고, 위 장물을 반환하는 것이 불가능하지 않음에도 불구하고 계속 보관함으로써 피해자의 정당한 반환청구권 행사를 어렵게하여 위법한 재산상태를 유지시킨 경우에는 장물보관죄에 해당한다.","cite":"대법원 87도1633","badge":"","topic":"","from":"GY-2024-2-X-21","seq":null},{"id":"X-OX-410","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"타인의 사무를 처리하는 자가 여러 사람으로부터 각각 부정한 청탁을 받고 그들로부터 각각 금품을 수수한 경우, 만약 그 청탁이 동종의 것이라고 한다면 단일하고 계속된 범의 아래 이루어진 범행으로 볼 수 있어 그 전체를 배임수재죄의 포괄 일죄로 볼 수 있다. (25.1차)","answer":false,"quote":"여러 사람에게서 각각 부정한 청탁을 받고 금품을 받았다면 청탁이 같은 종류여도 단일한 범의로 볼 수 없어, 포괄일죄가 아니라 따로따로 배임수재죄가 된다.","cite":"대법원 2008도6987 · 형법 제357조","badge":"","topic":"","from":"GY-2025-1-X-22","seq":null},{"id":"X-OX-372","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"건물의 임차인인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하였는데도 A에게 채권양도 통지를 하지 않고 A로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용하였다면 甲에게는 횡령죄가 성립한다. (23.2차)","answer":false,"quote":"건물의 임차인인 피고인이 임대인 甲에 대한 임대차보증금반환채권을 乙에게 양도하였는데도 甲에게 채권양도 통지를 하지 않고 甲으로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용하여 이를 횡령하였다는 내용으로 기소된 사안에서, 피고인이 乙과 임대차보증금반환채권에 관한 채권양도계약을 체결하고 甲에게 채권양도 통지를 하기 전에 甲으로부터 채권을 추심하여 남아 있던 임대차보증금을 수령하였더라도 임대차보증금으로 받은 금전의 소유권은 피고인에게 귀속할 뿐 乙에게 귀속한다고 볼 수 없고, 나아가 채권양도계약을 체결한 피고인과 乙은 통상의 권리이전계약에 따른 이익대립관계에 있을 뿐 피고인이 乙을 위한 보관자 지위가 인정될 수 있는 신임관계에 있다고 볼 수 없어 횡령죄가 성립하지 않는다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 채권양도에서 횡령죄의 성립 등에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도3829","badge":"","topic":"","from":"GY-2023-2-X-22","seq":null},{"id":"X-OX-409","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"전문건설업을 부정 등록한 무자격 건설업자 甲이 전문공사를 하도급받을 수 없었음에도 건설회사 담당자에게 이러한 사실을 숨기고 하도급 계약을 체결한 후 각 계약들에 따른 공사대금을 지급받은 경우, 해당 공사에 하자나 시공 상의 결함이 밝혀진 사실이 없고 도급받은 보수공사 또한 모두 정상적으로 준공된 것으로 보이는 사정 등이 있더라도, 甲의 행위는 사기죄에서의 기망행위로 인한 재물의 편취에 해당한다. (25.1차)","answer":false,"quote":"피고인이 설립한 甲 주식회사는 설립 자본금을 가장납입하고, 자격증 대여자를 보유 건설기술자로 등록하는 등 자본금 요건과 기술자 보유 요건을 가장하여 전문건설업을 부정 등록한 무자격 건설업자로 전문공사를 하도급받을 수 없었음에도, 이를 바탕으로 공사 발주기관을 기망하여 특허 사용협약을 체결하고, 해당 공사를 낙찰받은 건설회사 담당자를 기망하여 하도급 계약을 체결한 후, 각 계약들에 따른 공사대금을 지급받아 편취하였다는 이유로 특정경제범죄 가중처벌 등에 관한 법률 위반(사기) 및 사기죄로 기소된 사안에서, 甲 회사가 시공 또는 납품한 교량 가설공사는 모두 정상적으로 준공되었고, 해당 공사에 시공상 하자가 발생하였다거나 시공 과정에서 특허공법의 결함이 밝혀진 사실도 없으며, 甲 회사가 도급받은 보수공사 또한 모두 정상적으로 준공된 것으로 보이는 점, 납입가장 이후 발주기관이나 건설회사와 사이에 계약을 체결할 당시 甲 회사가 자본 잠식 상태에 있었다거나 혹은 자본금 부족으로 인한 경영상 문제가 발생하였다는 점이 밝혀지지는 아니한 점, 피고인과 甲 회사가 전용실시권을 보유하고 있는 특허공법에 기술적 문제점이 있다거나, 이들이 특허권을 취득하는 과정에 문제가 있다는 점이 밝혀지지는 아니한 점에 비추어, 甲 회사의 설립 또는 사업분야 확장 과정에서 자본금 납입을 가장하였다거나, 국가기술자격증을 대여받아 전문건설업 등록을 하였다는 사정만으로는 피고인에게 각 공사를 완성할 의사나 능력이 없었다고 단정하기 어렵고, 교량 가설공사에 관하여 피고인이 발주기관의 주무 사무관으로부터 개략 견적가에 관한 정보를 전해 듣고 가격을 수정하였다는 사정만으로는 발주기관 계약 담당 공무원에 대하여 계약이행능력에 관한 기망행위를 하였다고 보기 어려워, 피고인이 발주기관 또는 건설회사들로부터 공사대금을 지급받은 행위가 사기죄에서의 기망행위로 인한 재물의 편취에 해당한다고 보기 어려우므로, 이와 달리 공소사실을 유죄로 본 원심판단에 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도14104","badge":"","topic":"","from":"GY-2025-1-X-20","seq":null},{"id":"X-OX-268","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"‘성추행 피해자가 추행 즉시 행위자에게 항의하지 않은 사정’이나 ‘피해 신고 시 성폭력이 아닌 다른 피해 사실을 먼저 진술한 사정’만으로 곧바로 피해자 진술의 신빙성을 부정할 것은 아니고, 가해자와의 관계와 피해자의 구체적 상황을 모두 살펴 판단 하여야 한다. (23.2차)","answer":true,"quote":"성추행 피해자가 즉시 항의하지 않았거나 다른 피해부터 말했다는 사정만으로 진술의 신빙성을 부정하지 않고, 관계와 구체적 상황을 살펴 판단한다.","cite":"대법원 2020도7869 · 형사소송법 제308조","badge":"","topic":"","from":"GY-2023-2-X-39","seq":null},{"id":"X-OX-425","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"차량과 같이 소유권의 취득에 등록이 필요한 경우 횡령죄의 주체는 차량의 등록명의자여야 하므로, 소유권의 취득에 등록이 필요한 타인 소유의 차량을 인도받아 보관하고 있는 자가 이를 사실상 임의처분해도 횡령죄는 성립하지 않는다. (26.1차)","answer":false,"quote":"따라서 소유권의 취득에 등록이 필요한 타인 소유의 차량을 인도받아 보관하고 있는 사람이 이를 사실상 처분하면 횡령죄가 성립하며, 보관 위임자나 보관자가 차량의 등록명의자일 필요는 없다.","cite":"대법원 2015도1944","badge":"","topic":"","from":"GY-2026-1-X-19","seq":null},{"id":"X-OX-417","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"A가 홍보를 위해 광고판(배너와 거치대)을 1층 로비에 설치해 두었는데, 甲이 乙에게 지시하여 乙이 A의 광고판을 그 장소 에서 제거하여 컨테이너로 된 창고로 옮겨 놓아 A가 사용할 수 없도록 한 경우, 해당 광고판을 물질적인 형태의 변경이나 멸실, 감손을 초래하지 않은 채 그대로 옮겼다면 광고판의 효용 자체를 해한 것은 아니어서 재물손괴죄가 성립하지 않는다. (25.2차)","answer":false,"quote":"甲이 홍보를 위해 광고판(홍보용 배너와 거치대)을 1층 로비에 설치해 두었는데, 피고인이 乙에게 지시하여 乙이 위 광고판을 그 장소에서 제거하여 컨테이너로 된 창고로 옮겨 놓아 甲이 사용할 수 없도록 한 사안에서, 비록 물질적인 형태의 변경이나 멸실, 감손을 초래하지 않은 채 그대로 옮겼더라도 위 광고판은 본래적 역할을 할 수 없는 상태로 되었으므로 피고인의 행위는 재물손괴죄에서의 재물의 효용을 해하는 행위에 해당한다는 이유로, 이와 달리 본 원심판단에 재물손괴죄의 법리를 오해한 위법이 있다고 한 사례","cite":"대법원 2017도18807","badge":"","topic":"","from":"GY-2025-2-X-22","seq":null},{"id":"X-OX-359","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"서면으로 부동산 증여의 의사를 표시한 증여자가 증여계약을 취소하거나 해제할 수 없음에도 불구하고 증여계약에 따라 수증자에게 부동산의 소유권을 이전하지 않고 부동산을 제3자에게 처분하여 등기를 한 경우, 증여자의 소유권이전등기의무는 증여자 자신의 사무일 뿐 타인의 사무에 해당하지 않으므로 배임죄가 성립하지 않는다. (23.1차)","answer":false,"quote":"부동산 매매계약에서 중도금이 지급되는 등 계약이 본격적으로 이행되는 단계에 이른 경우, 그때부터 매도인은 배임죄에서 말하는 ‘타인의 사무를 처리하는 자’에 해당하는지 여부 (적극) 및 그러한 지위에 있는 매도인이 매수인에게 계약 내용에 따라 부동산의 소유권을 이전해 주기 전에 부동산을 제3자에게 처분하여 등기를 하는 행위가 배임죄를 구성하는지 여부 (적극) / 서면으로 부동산 증여의 의사를 표시한 증여자가 ‘타인의 사무를 처리하는 자’에 해당하는지 여부 (적극) 및 그가 수증자에게 증여계약에 따라 부동산의 소유권을 이전하지 않고 부동산을 제3자에게 처분하여 등기를 하는 행위가 배임죄를 구성하는지 여부 (적극)","cite":"대법원 2016도19308","badge":"","topic":"","from":"GY-2023-1-X-21","seq":null},{"id":"X-OX-427","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"업무상배임죄에서 본인에게 재산상 손해를 가한다 함은 총체적으로 보아 본인의 재산상태에 손해를 가하는 경우를 말하고, 이와 같은 법리가 타인의 사무를 처리하는 자 내지 제3자가 취득하는 재산상 이익에 대하여도 동일하게 적용 되는 것은 아니다. (26.1차)","answer":false,"quote":"업무상배임죄에서 ‘본인에게 재산상 손해를 가한다.’는 것의 의미(=본인의 전체적 재산가치의 감소) 및 이는 ‘행위자나 제3자가 취득하는 재산상 이익’에 대하여도 동일하게 적용되는지 여부 (적극)","cite":"대법원 2025도6356","badge":"","topic":"","from":"GY-2026-1-X-21","seq":null},{"id":"X-OX-403","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"업무상 배임죄의 실행으로 인하여 이익을 얻게 되는 수익자 또는 그와 밀접한 관련이 있는 제3자를 배임의 실행행위자에 대한 공동정범으로 인정하기 위하여는, 실행행위자의 행위가 피해자 본인에 대한 배임행위에 해당한다는 점을 인식하는 것으로 족하고, 실행행위자의 배임행위를 교사하거나 또는 배임행위의 전 과정에 관여하는 등으로 배임행위에 적극 가담할 것을 필요로 하지 않는다. (25.1차)","answer":false,"quote":"거래상대방의 대향적 행위의 존재를 필요로 하는 유형의 배임죄에서 거래상대방은 기본적으로 배임행위의 실행행위자와 별개의 이해관계를 가지고 반대편에서 독자적으로 거래에 임한다는 점을 고려하면, 업무상배임죄의 실행으로 이익을 얻게 되는 수익자는 배임죄의 공범이라고 볼 수 없는 것이 원칙이고, 실행행위자의 행위가 피해자 본인에 대한 배임행위에 해당한다는 점을 인식한 상태에서 배임의 의도가 전혀 없었던 실행행위자에게 배임행위를 교사하거나 또는 배임행위의 전 과정에 관여하는 등으로 배임행위에 적극 가담한 경우에 한하여 배임의 실행행위자에 대한 공동정범으로 인정할 수 있다.","cite":"대법원 2014도17211","badge":"","topic":"","from":"GY-2025-1-X-10","seq":null},{"id":"X-OX-288","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 자신의 주거지 방안에서 4촌 관계인 A(여, 15세)의 학교 과제를 도와주던 중 A의 왼손을 잡아 자신의 성기 쪽으로 끌어당겼고 이를 거부하고 자리를 이탈하려는 A의 의사에 반하여 A를 양팔로 끌어안은 다음 침대에 쓰러뜨린 후 A의 가슴을 만진 경우, 甲의 행위는 성폭력범죄의 처벌 등에 관한 특례법 위반(친족관계에의한강제추행)죄를 구성한다. (25.1차)","answer":true,"quote":"피고인이 자신의 주거지 방안에서 4촌 친족관계인 피해자 甲(女, 15세)의 학교 과제를 도와주던 중 甲을 양팔로 끌어안은 다음 침대에 쓰러뜨린 후 甲의 가슴을 만지는 등 강제로 추행하였다는 성폭력범죄의 처벌 등에 관한 특례법 위반(친족관계에의한강제추행)의 주위적 공소사실로 기소된 사안에서, 당시 피고인은 방안에서 甲의 숙제를 도와주던 중 甲의 왼손을 잡아 자신의 성기 쪽으로 끌어당겼고, 이를 거부하고 자리를 이탈하려는 甲의 의사에 반하여 甲을 끌어안은 다음 침대로 넘어져 甲의 위에 올라탄 후 甲의 가슴을 만졌으며, 방문을 나가려는 甲을 뒤따라가 끌어안았는바, 이러한 피고인의 행위는 甲의 신체에 대하여 불법한 유형력을 행사하여 甲을 강제추행한 것에 해당한다고 볼 여지가 충분하다는 이유로, 이와 달리 피고인의 행위가 甲의 항거를 곤란하게 할 정도의 폭행 또는 협박에 해당하지 않는다고 보아 위 공소사실을 무죄로 판단한 원심의 조치에 강제추행죄의 폭행에 관한 법리오해 등의 잘못이 있다고 한 사례.","cite":"대법원 2018도13877","badge":"","topic":"","from":"GY-2025-1-X-16","seq":null},{"id":"X-OX-375","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강제추행죄의 ‘폭행 또는 협박’의 의미에 있어서 폭행행위 자체가 곧바로 추행에 해당하는 경우에는 상대방의 의사를 억압할 정도의 것임을 요하지 아니하나, 폭행 또는 협박이 추행보다 시간적으로 앞서 그 수단으로 행해진 경우에는 상대방의 항거를 곤란하게 할 정도에 이르러야 한다. (24.1차)","answer":false,"quote":"[다수의견] (가) 형법 및 성폭력범죄의 처벌 등에 관한 특례법(이하 ‘성폭력처벌법’이라 한다)은 강제추행죄의 구성요건으로 ‘폭행 또는 협박’을 규정하고 있는데, 대법원은 강제추행죄의 ‘폭행 또는 협박’의 의미에 관하여 이를 두 가지 유형으로 나누어, 폭행행위 자체가 곧바로 추행에 해당하는 경우(이른바 기습추행형)에는 상대방의 의사를 억압할 정도의 것임을 요하지 않고 상대방의 의사에 반하는 유형력의 행사가 있는 이상 그 힘의 대소강약을 불문한다고 판시하는 한편, 폭행 또는 협박이 추행보다 시간적으로 앞서 그 수단으로 행해진 경우(이른바 폭행·협박 선행형)에는 상대방의 항거를 곤란하게 하는 정도의 폭행 또는 협박이 요구된다고 판시하여 왔다(이하 폭행·협박 선행형 관련 판례 법리를 ‘종래의 판례 법리’라 한다).","cite":"대법원 2018도13877","badge":"","topic":"","from":"GY-2024-1-X-14","seq":null},{"id":"X-OX-272","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"A대학교 총학생회장인 甲이 총학생회 주관의 농활 사전답사 과정에서 B를 비롯한 학생회 임원진의 음주 및 음주운전 사실을 계기로 음주운전 및 이를 묵인하는 관행을 공론화하여 ‘총학생회장으로서 음주운전을 끝까지 막지 못하여 사과드립니다.’ 라는 글을 페이스북 등에 게시한 경우, 甲에게는 B에 대한 명예 훼손죄가 성립하지 않는다. (24.1차)","answer":true,"quote":"甲 대학교 총학생회장인 피고인이 총학생회 주관의 농활 사전답사 과정에서 乙을 비롯한 학생회 임원진의 음주 및 음주운전 사실이 있었음을 계기로 음주운전 및 이를 묵인하는 관행을 공론화하여 ‘총학생회장으로서 음주운전을 끝까지 막지 못하여 사과드립니다.’라는 제목의 글을 써 페이스북 등에 게시함으로써 음주운전자로 특정된 乙의 명예를 훼손하였다는 내용으로 기소된 사안에서, 게시글의 전체적인 취지·내용에 비추어 중요한 부분은 ‘乙이 술을 마신 상태에서 음주운전을 하였고 피고인도 이를 끝까지 제지하지 않았으며, 피고인 역시 음주운전 차량에 동승하였다.’는 점으로서 객관적 사실과 합치되므로, 비록 乙이 마신 술의 종류·양과 같은 세부적 부분이 객관적 사실과 정확히 일치하지 않더라도 게시글의 중요한 부분은 ‘진실한 사실’에 해당하는 점, 피고인은 사회적으로 음주운전에 엄격해진 분위기와 달리 농활 과정의 관성적인 음주운전 문화가 해당 개인은 물론 농활에 참여한 학내 구성원 등의 안전을 위협하고 이로 인해 총학생회의 자치활동에마저 부정적인 사회적 인식을 초래할 수 있다는 문제의식 아래 게시글을 올린 것으로 보이므로, 게시글은 주된 의도·목적의 측면에서 공익성이 충분히 인정되는 점, 게시글을 올린 시점이 乙의 음주운전 행위일로부터 약 4개월이 경과되었고, 乙의 甲 대학교 단과대학 학생회장 출마 시점으로부터 약 2주일 전이라는 점에서 그 의도·목적상 乙의 출마와 관련성이 있다고 볼 여지도 있으나, 게시글의 중요 부분은 객관적인 사실로서 乙의 준법의식·도덕성·윤리성과 직결되는 부분이어서 단과대학 학생회장으로서의 적격 여부와 상당한 관련성이 있을 뿐만 아니라 단과대학 구성원 전체의 관심과 이익에 관한 사항에 해당하는 점 등을 종합하면, 피고인의 행위는 형법 제310조 에 따라 위법성이 조각된다고 봄이 타당하다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 형법 제310조 의 위법성조각사유에 관한 법리오해 및 심리미진의 잘못이 있다고 한 사례.","cite":"대법원 2022도13425","badge":"","topic":"","from":"GY-2024-1-X-15","seq":null},{"id":"X-OX-331","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"A가 甲으로부터 폭행을 당하고 얼마 후 함께 A를 폭행하자는 甲의 연락을 받고 달려 온 乙로부터 다시 폭행을 당하고 사망하였으나 사망의 원인행위가 판명되지 않았다면, 형법 제263조가 적용되어 甲과 乙은 폭행치사죄의 공동정범의 예에 의하여 처벌된다. (22.1차)","answer":false,"quote":"함께 폭행하자는 연락을 받고 가담했다면 의사연락이 있는 공동정범이라, 독립행위의 경합을 전제로 하는 제263조를 적용할 일이 아니다.","cite":"대법원 85도1892 · 형법 제30조","badge":"","topic":"","from":"GY-2022-1-X-10","seq":null},{"id":"X-OX-339","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"형법 제333조(강도)에서의 ‘재산상 이익’은 반드시 사법상 유효한 재산상의 이득만을 의미하는 것은 아니나, 단지 외견상 재산상의 이득을 얻을 것이라고 인정할 수 있는 사실관계만 으로는 재산상의 이익을 인정할 수 없다. (22.1차)","answer":false,"quote":"형법 제333조 후단 의 강도죄(이른바 강제이득죄)의 요건이 되는 재산상의 이익이란 재물 이외의 재산상의 이익을 말하는 것으로서, 그 재산상의 이익은 반드시 사법상 유효한 재산상의 이득만을 의미하는 것이 아니고 외견상 재산상의 이득을 얻을 것이라고 인정할 수 있는 사실관계만 있으면 여기에 해당된다.","cite":"대법원 96도3411","badge":"","topic":"","from":"GY-2022-1-X-22","seq":null},{"id":"X-OX-234","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강제집행절차를 통한 소송사기는 집행절차의 개시신청을 한 때 또는 진행 중인 집행절차에 배당신청을 한 때에 실행에 착수하였다고 볼 것이다. (22.1차)","answer":true,"quote":"강제집행절차를 통한 소송사기는 집행절차의 개시신청을 한 때 또는 진행 중인 집행절차에 배당신청을 한 때에 실행에 착수하였다고 볼 것이다.","cite":"대법원 2014도10086","badge":"","topic":"","from":"GY-2022-1-X-20","seq":null},{"id":"X-OX-298","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 丙에게 X토지를 매도하고 그 소유권이전등기를 마쳐준 행위는 A와의 신임관계를 저버리는 것으로서 배임죄의 구성요건에 해당한다. (25.1차)","answer":true,"quote":"법률 제13719호로 개정되기 전의 것) 위반(배임)으로 기소된 사안에서, 甲 등이 피고인에게 매매계약에 따라 중도금을 지급하였을 때 매매계약은 임의로 해제할 수 없는 단계에 이르렀고, 피고인은 甲 등에 대하여 재산적 이익을 보호할 신임관계에 있게 되어 타인인 甲 등의 부동산에 관한 소유권 취득 사무를 처리하는 자가 된 점, 甲 등이 잔금 지급기일이 지나도 부동산을 인도받지 못하자 피고인에게 보낸 통고서의 내용은, 甲 등이 피고인에게 요구조건을 받아들일 것을 촉구하면서 이를 받아들이지 않으면 매매계약을 해제하겠다는 취지일 뿐 그 자체로 계약 해제의 의사표시가 포함되어 있다고 보기 어려운 점, 피고인은 매매계약이 적법하게 해제되지 않은 상태에서 甲 등에 대한 위와 같은 신임관계에 기초한 임무를 위배하여 부동산을 乙 등에게 매도하고 소유권이전등기를 마쳐 준 점, 비록 피고인이 당시 임차인으로부터 부동산을 반환받지 못하여 甲 등에게 이를 인도하지 못하고 있었고, 甲 등과 채무불이행으로 인한 손해배상과 관련한 말들을 주고받았더라도, 매매계약이 적법하게 해제되지 않고 유효하게 유지되고 있었던 이상 위와 같은 신임관계가 소멸되었다고 볼 수 없는 점을 종합하면, 피고인의 행위는 甲 등과의 신임관계를 저버리는 임무위배행위로서 배임죄가 성립하고, 또한 매매계약은 당시 적법하게 해제되지 않았고, 설령 피고인이 적법하게 해제되었다고 믿었더라도 그 믿음에 정당한 사유가 있다고 보기 어려워 피고인에게 배임의 범의와 불법이득의사가 인정됨에도, 이와 달리 보아 공소사실을 무죄로 판단한 원심판결에 배임죄에서 ‘타인의 사무를 처리하는 자’, 범의 등에 관한 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2017도4027","badge":"","topic":"","from":"GY-2025-1-X-40","seq":null},{"id":"X-OX-325","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"보도의 대상이 되는 자가 언론사 소속 기자에게 소위 ‘유료 기사’ 게재를 청탁하는 행위는 사실상 ‘광고’를 ‘언론 보도’인 것처럼 가장하여 달라는 것으로 배임수재죄의 부정한 청탁에 해당하고, 설령 그 ‘유료 기사’의 내용이 객관적 사실과 부합하더라도 언론 보도를 금전적 거래의 대상으로 삼은 이상 그 자체로 부정한 청탁에 해당한다. (26.1차)","answer":true,"quote":"그러므로 보도의 대상이 되는 자가 언론사 소속 기자에게 소위 ‘유료 기사’ 게재를 청탁하는 행위는 사실상 ‘광고’를 ‘언론 보도’인 것처럼 가장하여 달라는 것으로서 언론 보도의 공정성 및 객관성에 대한 공공의 신뢰를 저버리는 것이므로, 배임수재죄의 부정한 청탁에 해당한다.","cite":"대법원 2019도17102","badge":"","topic":"","from":"GY-2026-1-X-20","seq":null},{"id":"X-OX-264","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"업무상배임죄에있어‘재산상이익취득’과‘재산상손해발생’은 대등한 범죄성립요건이고, 따라서 임무위배행위로 인하여 여러 재산상 이익과 손해가 발생하더라도 재산상 이익과 손해 사이에 서로 대응하는 관계에 있는 등 일정한 관련성이 인정되어야 업무상배임죄가 성립한다. (23.2차)","answer":true,"quote":"따라서 임무위배행위로 인하여 여러 재산상 이익과 손해가 발생하더라도 재산상 이익과 손해 사이에 서로 대응하는 관계에 있는 등 일정한 관련성이 인정되어야 업무상배임죄가 성립한다.","cite":"대법원 2016도3452","badge":"","topic":"","from":"GY-2023-2-X-20","seq":null},{"id":"X-OX-281","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"성폭력범죄의 처벌 등에 관한 특례법위반(주거침입강간)죄는 주거침입죄를 범한 후에 사람을 강간하는 등의 행위를 하여야 하는 일종의 신분범이고, 선후가 바뀌어 강간죄 등을 범한 자가 그 피해자의 주거에 침입한 경우에는 이에 해당하지 않고 강간죄 등과 주거침입죄 등의 실체적 경합범이 된다. (24.2차)","answer":true,"quote":"주거침입강제추행죄 및 주거침입강간죄 등은 사람의 주거 등을 침입한 자가 피해자를 간음, 강제추행 등 성폭력을 행사한 경우에 성립하는 것으로서, 주거침입죄를 범한 후에 사람을 강간하는 등의 행위를 하여야 하는 일종의 신분범이고, 선후가 바뀌어 강간죄 등을 범한 자가 그 피해자의 주거에 침입한 경우에는 이에 해당하지 않고 강간죄 등과 주거침입죄 등의 실체적 경합범이 된다.","cite":"대법원 2020도17796","badge":"","topic":"","from":"GY-2024-2-X-16","seq":null},{"id":"X-OX-340","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"형법 제307조 제2항 허위사실 적시 명예훼손죄에서 허위사실의 인식과 달리 허위사실 자체는 엄격한 증명의 대상이 된다. (22.1차)","answer":false,"quote":"허위사실 적시 명예훼손은 적시 사실이 허위라는 점과 그 허위성의 인식이 모두 구성요건이라, 둘 다 검사가 엄격한 증명으로 입증해야 한다.","cite":"대법원 2009도12132 · 형법 제307조","badge":"","topic":"","from":"GY-2022-1-X-35","seq":null},{"id":"X-OX-292","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"수분양권 매도인이 수분양권 매매계약에 따라 매수인에게 수분양권을 이전할 의무는 특별한 사정이 없는 한 자신의 사무에 해당할 뿐이므로, 매수인에 대한 관계에서 배임죄의 ‘타인의 사무를 처리하는 자’라고 할 수 없다. (25.1차)","answer":true,"quote":"따라서 특별한 사정이 없는 한 수분양권 매도인이 수분양권 매매계약에 따라 매수인에게 수분양권을 이전할 의무는 자신의 사무에 해당할 뿐이므로, 매수인에 대한 관계에서 ‘타인의 사무를 처리하는 자’라고 할 수 없다.","cite":"대법원 2014도12104","badge":"","topic":"","from":"GY-2025-1-X-21","seq":null},{"id":"X-OX-374","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 금품을 훔칠 목적으로 A의 집에 담을 넘어 침입한 후 부엌에서 금품을 물색하던 중 발각되어 도주한 경우, 甲에게는 절도죄의 실행의 착수가 인정되지 않는다. (24.1차)","answer":false,"quote":"금품을 훔칠 목적으로 피해자의 집에 담을 넘어 침입하여 그집 부엌에서 금품을 물색하던 중에 발각되어 도주한 것이라면 이는 절취행위에 착수한 것이라고 보아야 한다.","cite":"대법원 86도2199","badge":"","topic":"","from":"GY-2024-1-X-08","seq":null},{"id":"X-OX-393","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제333조 후단의 강도죄(이른바 강제이득죄)의 요건인 재산상의 이익이란 재물을 포함한 모든 재산상의 이익을 말하는 것으로서 적극적 이익(적극적인 재산의 증가)이든 소극적 이익 (소극적인 부채의 감소)이든 묻지 않는다. (24.2차)","answer":false,"quote":"형법 제333조 후단의 강도죄, 이른바 강제이득죄의 요건인 재산상의 이익이란 재물 이외의 재산상의 이익을 말하는 것으로서 적극적 이익(적극적인 재산의 증가)이든 소극적 이익(소극적인 부채의 감소)이든 상관없는 것이고, 강제이득죄는 권리의무관계가 외형상으로라도 불법적으로 변동되는 것을 막고자함에 있는 것으로서 항거불능이나 반항을 억압할 정도의 폭행 협박을 그 요건으로 하는 강도죄의 성질상 그 권리의무관계의 외형상 변동의 사법상 효력의 유무는 그 범죄의 성립에 영향이 없고, 법률상 정당하게 그 이행을 청구할 수 있는 것이 아니라도 강도죄에 있어서의 재산상의 이익에 해당하는 것이며, 따라서 이와 같은 재산상의 이익은 반드시 사법상 유효한 재산상의 이득만을 의미하는 것이 아니고 외견상 재산상의 이득을 얻을 것이라고 인정할 수 있는 사실관계만 있으면 된다.","cite":"대법원 93도428","badge":"","topic":"","from":"GY-2024-2-X-19","seq":null},{"id":"X-OX-388","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"객관적으로 피해자의 사회적 평가를 저하시키는 사실에 관한 발언이 보도, 소문이나 제3자의 말을 인용하는 방법으로 단정 적인 표현이 아닌 전문 또는 추측의 형태로 표현된 경우, 표현 전체의 취지로 보아 사실이 존재할 수 있다는 것을 ‘암시’하는 방식으로 이루어졌다면 사실을 적시한 것으로 볼 수 없다. (24.2차)","answer":false,"quote":"대법원은 명예훼손죄에서 ‘사실의 적시’에 관하여, 객관적으로 피해자의 사회적 평가를 저하시키는 사실에 관한 발언이 보도, 소문이나 제3자의 말을 인용하는 방법으로 단정적인 표현이 아닌 전문 또는 추측의 형태로 표현되었더라도, 표현 전체의 취지로 보아 사실이 존재할 수 있다는 것을 암시하는 방식으로 이루어진 경우에는 사실의 적시로 인정하여 왔다.","cite":"대법원 2017도18697","badge":"","topic":"","from":"GY-2024-2-X-15","seq":null},{"id":"X-OX-248","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"충동조절장애와 같은 성격적 결함은 형의 감면사유인 심신장애에 해당하지 아니하지만 그것이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있는 경우에는 그로 인한 범행은 심신장애로 인한 범행으로 보아야 한다. (23.1차)","answer":true,"quote":"자신의 충동을 억제하지 못하여 범죄를 저지르게 되는 현상은 정상인에게서도 얼마든지 찾아볼 수 있는 일로서, 특단의 사정이 없는 한 위와 같은 성격적 결함을 가진 자에 대하여 자신의 충동을 억제하고 법을 준수하도록 요구하는 것이 기대할 수 없는 행위를 요구하는 것이라고는 할 수 없으므로, 원칙적으로 충동조절장애와 같은 성격적 결함은 형의 감면사유인 심신장애에 해당하지 아니한다고 봄이 상당하지만, 그 이상으로 사물을 변별할 수 있는 능력에 장애를 가져오는 원래의 의미의 정신병이 도벽의 원인이라거나 혹은 도벽의 원인이 충동조절장애와 같은 성격적 결함이라 할지라도 그것이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있는 경우에는 그로 인한 절도 범행은 심신장애로 인한 범행으로 보아야 한다.","cite":"대법원 2002도1541","badge":"","topic":"","from":"GY-2023-1-X-07","seq":null},{"id":"X-OX-317","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"명예훼손에서 행위자의 주요한 동기나 목적이 공공의 이익을 위한 것이라면 부수적으로 다른 사익적 목적이나 동기가 내포되어 있더라도 ｢형법｣ 제310조의 적용을 배제할 수 없다. (26.1차)","answer":true,"quote":"적시된 사실이 공공의 이익에 관한 것인지는 사실의 내용과 성질, 사실의 공표가 이루어진 상대방의 범위, 표현의 방법 등 표현 자체에 관한 여러 사정을 감안함과 동시에 표현에 의하여 훼손되거나 훼손될 수 있는 명예의 침해 정도 등을 비교·고려하여 결정해야 하며, 행위자의 주요한 동기나 목적이 공공의 이익을 위한 것이라면 부수적으로 다른 사익적 목적이나 동기가 내포되어 있더라도 형법 제310조 의 적용을 배제할 수 없다.","cite":"대법원 2022도13425","badge":"","topic":"","from":"GY-2026-1-X-15","seq":null},{"id":"X-OX-254","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"미성년자와 부모가 함께 거주하는 주거에 침입하여 부모만을 강제로 퇴거시키고 미성년자와 독자적인 생활관계를 형성하기에 이르렀다면, 비록 장소적 이전이 없었다 할지라도 ｢형법｣ 제287조의 미성년자약취죄에 해당한다. (23.1차)","answer":true,"quote":"미성년자가 혼자 머무는 주거에 침입하여 그를 감금한 뒤 폭행 또는 협박에 의하여 부모의 출입을 봉쇄하거나, 미성년자와 부모가 거주하는 주거에 침입하여 부모만을 강제로 퇴거시키고 독자적인 생활관계를 형성하기에 이르렀다면 비록 장소적 이전이 없었다 할지라도 형법 제287조 의 미성년자약취죄에 해당함이 명백하지만, 강도 범행을 하는 과정에서 혼자 주거에 머무르고 있는 미성년자를 체포·감금하거나 혹은 미성년자와 그의 부모를 함께 체포·감금, 또는 폭행·협박을 가하는 경우, 나아가 주거지에 침입하여 미성년자의 신체에 위해를 가할 것처럼 협박하여 부모로부터 금품을 강취하는 경우와 같이, 일시적으로 부모와의 보호관계가 사실상 침해·배제되었다 할지라도, 그 의도가 미성년자를 기존의 생활관계 및 보호관계로부터 이탈시키는 데 있었던 것이 아니라 단지 금품 강취를 위하여 반항을 제압하는 데 있었다거나 금품 강취를 위하여 고지한 해악의 대상이 그곳에 거주하는 미성년자였던 것에 불과하다면, 특별한 사정이 없는 한 미성년자를 약취한다는 범의를 인정하기 곤란할 뿐 아니라, 보통의 경우 시간적 간격이 짧아 그 주거지를 중심으로 영위되었던 기존의 생활관계로부터 완전히 이탈되었다고 평가하기도 곤란하다.","cite":"대법원 2007도8485","badge":"","topic":"","from":"GY-2023-1-X-15","seq":null},{"id":"X-OX-335","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강제추행죄는 상대방에 대하여 폭행 또는 협박을 가하여 항거를 곤란하게 한 뒤에 추행행위를 하는 경우뿐만 아니라 폭행행위 자체가 추행행위라고 인정되는 경우도 포함되며, 이 경우의 폭행은 반드시 상대방의 의사를 억압할 정도의 것이어야 한다. (22.1차)","answer":false,"quote":"폭행 자체가 추행인 기습추행에서 폭행은 의사를 억압할 정도일 필요가 없고, 의사에 반하는 유형력이면 힘의 세기를 묻지 않는다.","cite":"대법원 2001도2417 · 형법 제298조","badge":"","topic":"","from":"GY-2022-1-X-16","seq":null},{"id":"X-OX-267","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 PC방에 게임을 하러 온 A로부터 20,000원을 인출해 오라는 부탁과 함께 현금카드를 건네받게 되자, 위법하게 이득할 의사로 권한 없이 그 위임받은 금액을 초과한 50,000원을 인출한 후 그 중 20,000원만 A에게 건네주고 30,000원을 취득하였다면, 甲의 행위는 그 차액 상당액에 관하여 컴퓨터등사용사기죄에 해당한다. (23.2차)","answer":true,"quote":"예금주인 현금카드 소유자로부터 일정한 금액의 현금을 인출해 오라는 부탁을 받으면서 이와 함께 현금카드를 건네받은 것을 기화로 그 위임을 받은 금액을 초과하여 현금을 인출하는 방법으로 그 차액 상당을 위법하게 이득할 의사로 현금자동지급기에 그 초과된 금액이 인출되도록 입력하여 그 초과된 금액의 현금을 인출한 경우에는 그 인출된 현금에 대한 점유를 취득함으로써 이 때에 그 인출한 현금 총액 중 인출을 위임받은 금액을 넘는 부분의 비율에 상당하는 재산상 이익을 취득한 것으로 볼 수 있으므로 이러한 행위는 그 차액 상당액에 관하여 형법 제347조의2 (컴퓨터등사용사기)에 규정된 ‘컴퓨터 등 정보처리장치에 권한 없이 정보를 입력하여 정보처리를 하게 함으로써 재산상의 이익을 취득’하는 행위로서 컴퓨터 등 사용사기죄에 해당된다.","cite":"대법원 2005도3516","badge":"","topic":"","from":"GY-2023-2-X-22","seq":null},{"id":"X-OX-237","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"비트코인은 경제적인 가치를 디지털로 표상하여 전자적으로 이전, 저장과 거래가 가능하도록 한 가상자산의 일종으로 사기죄의 객체인 재산상 이익에 해당한다. (22.1차)","answer":true,"quote":"비트코인은 경제적인 가치를 디지털로 표상하여 전자적으로 이전, 저장과 거래가 가능하도록 한 가상자산의 일종으로 사기죄의 객체인 재산상 이익에 해당한다.","cite":"대법원 2021도9855","badge":"","topic":"","from":"GY-2022-1-X-22","seq":null},{"id":"X-OX-338","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"형법 제330조에 규정된 야간주거침입절도죄 및 형법 제331조 제1항에 규정된 특수절도(야간손괴침입절도)죄를 제외하고 일반적으로 주거침입은 절도죄의 구성요건이 아니므로 절도범인이 범행수단으로 주거침입을 한 경우에 주거침입행위는 절도죄에 흡수되지 아니하고 별개로 주거침입죄를 구성하여 절도죄와는 상상적 경합의 관계에 있다. (22.1차)","answer":false,"quote":"형법 제330조 에 규정된 야간주거침입절도죄 및 형법 제331조 제1항 에 규정된 특수절도(야간손괴침입절도)죄를 제외하고 일반적으로 주거침입은 절도죄의 구성요건이 아니므로 절도범인이 범행수단으로 주거침입을 한 경우에 주거침입행위는 절도죄에 흡수되지 아니하고 별개로 주거침입죄를 구성하여 절도죄와는 실체적 경합의 관계에 서는 것이 원칙이다.","cite":"대법원 2015도8169","badge":"","topic":"","from":"GY-2022-1-X-21","seq":null},{"id":"X-OX-246","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"영득죄는 범죄성립에 불법영득의사를 필요로 하고, 손괴죄는 이를 필요로 하지 않는다. (22.2차)","answer":true,"quote":"절도·사기 같은 영득죄는 불법영득의사가 있어야 하지만, 손괴죄는 효용을 해한다는 고의만으로 성립한다.","cite":"형법 제366조","badge":"","topic":"","from":"GY-2022-2-X-18","seq":null},{"id":"X-OX-355","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲과 乙이 공동으로 생강밭을 경작하여 그 이익을 분배하기로 약정하고 생강 농사를 시작하였으나, 곧바로 동업 관계에 불화가 생겨 乙이 묵시적으로 동업 탈퇴의 의사표시를 한 채 생강밭에 나오지 않자, 그때부터 甲이 혼자 생강밭을 경작하고 수확하여 생강을 반출한 경우, 甲의 행위는 절도죄를 구성한다. (23.1차)","answer":false,"quote":"두 사람으로 된 생강농사 동업관계에 불화가 생겨 그 중 1인이 나오지 않자, 남은 동업인이 혼자 생강 밭을 경작하여 생강을 반출한 행위가 절도죄를 구성하지 않는다고 한 사례","cite":"대법원 2008도11804","badge":"","topic":"","from":"GY-2023-1-X-18","seq":null},{"id":"X-OX-293","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"지입차주가 지입회사로부터 할부로 지입회사 소유의 자동차를 매수하면서 해당 자동차에 관하여 지입계약을 체결한 경우, 할부대금을 완납하기 전까지는 지입차량을 지입차주의 실질적 재산이라고 보기 어려우므로, 지입계약이 체결되었다는 사실만으로 곧바로 지입회사 운영자가 지입차주와의 관계에서 ‘타인의 사무를 처리하는 자’의 지위에 있는 것은 아니다. (25.1차)","answer":true,"quote":"지입차주가 자신이 실질적으로 소유하거나 처분권한을 가지는 자동차에 관하여 지입회사와 지입계약을 체결함으로써 지입회사에 자동차의 소유권등록 명의를 신탁하고 운송사업용 자동차로서 등록 및 유지 관련 사무의 대행을 위임한 경우에는, 특별한 사정이 없는 한 지입회사 측이 지입차주의 실질적 재산인 지입차량에 관한 재산상 사무를 일정한 권한을 가지고 맡아 처리하는 것으로서 당사자 관계의 전형적·본질적 내용이 통상의 계약에서의 이익대립관계를 넘어서 그들 사이의 신임관계에 기초하여 타인의 재산을 보호 또는 관리하는 데에 있으므로, 지입회사 운영자는 지입차주와의 관계에서 ‘타인의 사무를 처리하는 자’의 지위에 있다고 할 것이나, 지입차주가 지입회사로부터 할부로 지입회사 소유의 자동차를 매수하면서 해당 자동차에 관하여 지입계약을 체결한 경우에는 특별한 사정이 없는 한 지입차주가 그 할부대금을 완납하기 전까지는 지입차량을 지입차주의 실질적 재산이라고 보기 어려우므로, 지입계약이 체결되었다는 사실만으로 곧바로 지입회사 운영자가 지입차주와의 관계에서 지입차량에 관한 재산상 사무를 맡아 처리하는 ‘타인의 사무를 처리하는 자’의 지위에 있다고 보기 어렵다.","cite":"대법원 2024도13000","badge":"","topic":"","from":"GY-2025-1-X-22","seq":null},{"id":"X-OX-390","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"준강간죄에서 피해자가 술에 취해 수면상태에 빠지는 등 의식을 상실한 패싱아웃(passing out) 상태뿐만 아니라 범행 당시 알코올이 기억형성의 실패만을 야기한 알코올 블랙아웃 (black out) 상태인 경우에도 기억장애 외에 인지기능이나 의식 상태의 장애에 이르렀다고 인정된다. (24.2차)","answer":false,"quote":"(나) 따라서 음주 후 준강간 또는 준강제추행을 당하였음을 호소한 피해자의 경우, 범행 당시 알코올이 위의 기억형성의 실패만을 야기한 알코올 블랙아웃 상태였다면 피해자는 기억장애 외에 인지기능이나 의식 상태의 장애에 이르렀다고 인정하기 어렵지만, 이에 비하여 피해자가 술에 취해 수면상태에 빠지는 등 의식을 상실한 패싱아웃 상태였다면 심신상실의 상태에 있었음을 인정할 수 있다.","cite":"대법원 2018도9781","badge":"","topic":"","from":"GY-2024-2-X-16","seq":null},{"id":"X-OX-255","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제309조 제1항의 ‘사람을 비방할 목적’은 제310조의 ‘공공의 이익’을 위한 것과는 행위자의 주관적 의도의 방향에 있어 서로 상반되는 관계에 있으므로, 적시한 사실이 공공의 이익에 관한 것인 경우 특별한 사정이 없는 한 비방할 목적은 부인된다. (23.1차)","answer":true,"quote":"형법 제309조 제1항 소정의 '사람을 비방할 목적'이란 가해의 의사 내지 목적을 요하는 것으로서 공공의 이익을 위한 것과는 행위자의 주관적 의도의 방향에 있어 서로 상반되는 관계에 있다고 할 것이므로, 형법 제310조 의 공공의 이익에 관한 때에는 처벌하지 아니한다는 규정은 사람을 비방할 목적이 있어야 하는 형법 제309조 제1항 소정의 행위에 대하여는 적용되지 아니하고 그 목적을 필요로 하지 않는 형법 제307조 제1항 의 행위에 한하여 적용되는 것이고, 반면에 적시한 사실이 공공의 이익에 관한 것인 경우에는 특별한 사정이 없는 한 비방 목적은 부인된다고 봄이 상당하므로 이와 같은 경우에는 형법 제307조 제1항 소정의 명예훼손죄의 성립 여부가 문제될 수 있고 이에 대하여는 다시 형법 제310조 에 의한 위법성 조각 여부가 문제로 될 수 있다.","cite":"대법원 2003도6036","badge":"","topic":"","from":"GY-2023-1-X-16","seq":null},{"id":"X-OX-345","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"횡령죄는 타인의 재물에 관한 소유권 등 본권을 보호법익으로 하는 범죄이므로 본권 침해의 결과가 발생하였을 때 성립하는 이른바 침해범이다. (22.2차)","answer":false,"quote":"[다수의견] (가) 횡령죄는 다른 사람의 재물에 관한 소유권 등 본권을 보호법익으로 하고 법익침해의 위험이 있으면 침해의 결과가 발생되지 아니하더라도 성립하는 위험범이다.","cite":"대법원 2010도10500","badge":"","topic":"","from":"GY-2022-2-X-20","seq":null},{"id":"X-OX-414","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 동일한 일시, 장소에서 동일한 목적을 가지고 이발용 면도칼을 휘둘러 乙과 丙에게 상해를 입힌 경우, 甲의 행위는 피해자별로 각각 별개의 상해죄가 성립하는 것이 아니라, 1개의 행위가 수개의 죄에 해당하는 경우라고 보아야 한다. (25.2차)","answer":false,"quote":"상해를 입힌 행위가 동일한 일시, 장소에서 동일한 목적으로 저질러진 것이라 하더라도 피해자를 달리하고 있으면 피해자별로 각각 별개의 상해죄를 구성한다고 보아야 할 것이고 1개의 행위가 수개의 죄에 해당하는 경우라고 볼 수 없다.","cite":"대법원 83도524","badge":"","topic":"","from":"GY-2025-2-X-14","seq":null},{"id":"X-OX-326","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"재물손괴죄에서 ‘재물의 효용을 해한다.’고 함은 사실상으로나 감정상으로 그 재물을 본래의 사용목적에 제공할 수 없게 하는 상태로 만드는 것을 말하며, 일시적으로 그 재물을 이용할 수 없거나 구체적 역할을 할 수 없는 상태로 만드는 것도 포함한다. (26.1차)","answer":true,"quote":"재물의 효용을 해한다는 것은 물리적 훼손이 없어도 사실상·감정상 본래 용도에 쓸 수 없게 하거나 일시적으로 이용할 수 없게 하는 것을 포함한다.","cite":"대법원 2019도13764 · 형법 제366조","badge":"","topic":"","from":"GY-2026-1-X-20","seq":null},{"id":"X-OX-319","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢성폭력범죄의 처벌 등에 관한 특례법｣상 주거침입강간죄의 실행의 착수시기는 주거침입 행위 후 강간죄의 실행행위에 나아간 때이다. (26.1차)","answer":true,"quote":"그 실행의 착수시기는 주거침입 행위 후 강간죄 등의 실행행위에 나아간 때이다.","cite":"대법원 2020도17796","badge":"","topic":"","from":"GY-2026-1-X-17","seq":null},{"id":"X-OX-257","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"공동거주자 중 한 사람이 법률적인 근거 기타 정당한 이유 없이 다른 공동거주자가 공동생활의 장소에 출입하는 것을 금지한 경우, 다른 공동거주자가 이에 대항하여 공동생활의 장소에 들어갔더라도 주거침입죄는 성립하지 않는다. (23.1차)","answer":true,"quote":"공동거주자 중 한 사람이 법률적인 근거 기타 정당한 이유 없이 다른 공동거주자가 공동생활의 장소에 출입하는 것을 금지한 경우, 다른 공동거주자가 이에 대항하여 공동생활의 장소에 들어갔더라도 이는 사전 양해된 공동주거의 취지 및 특성에 맞추어 공동생활의 장소를 이용하기 위한 방편에 불과할 뿐, 그의 출입을 금지한 공동거주자의 사실상 주거의 평온이라는 법익을 침해하는 행위라고는 볼 수 없으므로 주거침입죄는 성립하지 않는다.","cite":"대법원 2020도6085","badge":"","topic":"","from":"GY-2023-1-X-17","seq":null},{"id":"X-OX-365","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"살인예비죄가 성립하기 위한 ‘준비행위’는 물적인 것에 한정되지 아니하며 특별한 정형이 있는 것도 아니어서 단순히 범행의 의사 또는 계획만으로도 충분하므로, 객관적으로 보아 살인죄의 실현에 실질적으로 기여할 수 있는 외적 행위를 필요로 하는 것은 아니다. (23.2차)","answer":false,"quote":"여기서의 준비행위는 물적인 것에 한정되지 아니하며 특별한 정형이 있는 것도 아니지만, 단순히 범행의 의사 또는 계획만으로는 그것이 있다고 할 수 없고 객관적으로 보아서 살인죄의 실현에 실질적으로 기여할 수 있는 외적 행위를 필요로 한다.","cite":"대법원 2009도7150","badge":"","topic":"","from":"GY-2023-2-X-14","seq":null},{"id":"X-OX-419","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"재물손괴죄는 다른 사람의 재물을 손괴 또는 은닉하거나 그 밖의 방법으로 그 효용을 해한 경우에 성립하는 범죄로, 행위자에게 불법영득의사가 있어야 한다. (25.2차)","answer":false,"quote":"재물손괴죄는 재물의 효용을 해치는 죄라 불법영득의사가 필요 없고, 이 점이 절도·횡령과 다르다.","cite":"형법 제366조","badge":"","topic":"","from":"GY-2025-2-X-22","seq":null},{"id":"X-OX-333","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"다방 종업원 숙소에 이르러 종업원들 중 1인이 자신을 만나주지 않는다는 이유로 시정된 탁구장문과 주방문을 부수고 주방으로 들어가 방문을 열어주지 않으면 모두 죽여버린다고 폭언하면서 시정된 방문을 단순히 수회 발로 찬 甲의 행위도 종업원들의 신체에 대한 유형력의 행사로 볼 수 있어 폭행죄에 해당한다. (22.1차)","answer":false,"quote":"공소외인이 피고인을 만나주지 않는다는 이유로 시정된 탁구장문과 주방문을 부수고 주방으로 들어가 방문을 열어주지 않으면 모두 죽여버린다고 폭언하면서 시정된 방문을 수회 발로 찬 피고인의 행위는 재물손괴죄 또는 숙소안의 자에게 해악을 고지하여 외포케 하는 단순 협박죄에 해당함은 별론으로 하고, 단순히 방문을 발로 몇번 찼다고 하여 그것이 피해자들의 신체에 대한 유형력의 행사로는 볼 수 없어 폭행죄에 해당한다 할 수 없다.","cite":"대법원 83도3186","badge":"","topic":"","from":"GY-2022-1-X-14","seq":null},{"id":"X-OX-271","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주식회사의 대표이사가 타인을 기망하여 그 회사가 발행하는 신주를 인수하게 한 후 그로부터 납입받은 신주인수대금을 보관하던 중 횡령한 경우, 신주인수대금을 횡령한 행위는 사기죄의 불가벌적 사후행위에 해당하지 않는다. (24.1차)","answer":true,"quote":"주식회사의 대표이사가 타인을 기망하여 회사가 발행하는 신주를 인수하게 한 다음 그로부터 납입받은 신주인수대금을 보관하던 중 횡령한 행위는 사기죄와는 전혀 다른 새로운 보호법익을 침해하는 행위로서 별죄를 구성한다.","cite":"대법원 2004도6503","badge":"","topic":"","from":"GY-2024-1-X-11","seq":null},{"id":"X-OX-282","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"다른 사람의 주택에 무단 침입한 범죄사실로 이미 유죄판결을 받은 사람이 그 판결이 확정된 후에도 퇴거하지 않은 채 계속 하여 당해 주택에 거주한 경우, 위 판결 확정 이후의 행위는 별도의 주거침입죄를 구성한다. (24.2차)","answer":true,"quote":"다른 사람의 주택에 무단 침입한 범죄사실로 이미 유죄판결을 받은 사람이 그 판결이 확정된 후에도 퇴거하지 않은 채 계속하여 당해 주택에 거주한 사안에서, 위 판결 확정 이후의 행위는 별도의 주거침입죄를 구성한다고 한 사례.","cite":"대법원 2007도11322","badge":"","topic":"","from":"GY-2024-2-X-17","seq":null},{"id":"X-OX-262","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"인터넷 등 공간에서 작성된 단문의 글이라고 하더라도, 그 내용이 자신의 의견을 강조하거나 압축하여 표현한 것이라고 평가할 수 있고 표현도 지나치게 모욕적이거나 악의적이지 않다면 ｢형법｣ 제20조에 의하여 위법성이 조각될 수 있다. (23.2차)","answer":true,"quote":"그리고 인터넷 등 공간에서 작성된 단문의 글이라고 하더라도, 그 내용이 자신의 의견을 강조하거나 압축하여 표현한 것이라고 평가할 수 있고 표현도 지나치게 모욕적이거나 악의적이지 않다면 마찬가지로 위법성이 조각될 수 있다.","cite":"대법원 2020도16897","badge":"","topic":"","from":"GY-2023-2-X-18","seq":null},{"id":"X-OX-304","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"협박죄에 있어서의 해악을 고지하는 방법으로는 통상 언어에 의하는 것이나 경우에 따라서는 한마디 말도 없이 거동에 의하여서도 고지할 수 있다. (25.2차)","answer":true,"quote":"협박죄에 있어서의 해악을 가할 것을 고지하는 행위는 통상 언어에 의하는 것이나 경우에 따라서는 한마디 말도 없이 거동에 의하여서도 고지할 수 있는 것이다.","cite":"대법원 74도2727","badge":"","topic":"","from":"GY-2025-2-X-16","seq":null},{"id":"X-OX-251","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"배임죄는 임무에 위배하는 행위를 한다는 점과 이로 인하여 자기 또는 제3자가 이익을 취득하여 본인에게 손해를 가한다는 점에 대한 인식이나 의사를 가지고 임무에 위배한 행위를 개시한 때 실행에 착수하였다고 볼 수 있다. (23.1차)","answer":true,"quote":"이와 같이 형법은 타인의 사무를 처리하는 자가 그 임무에 위배하는 행위를 할 것과 그러한 행위로 인해 행위자나 제3자가 재산상 이익을 취득하여 본인에게 손해를 가할 것을 배임죄의 객관적 구성요건으로 정하고 있으므로, 타인의 사무를 처리하는 자가 배임의 범의로, 즉 임무에 위배하는 행위를 한다는 점과 이로 인하여 자기 또는 제3자가 이익을 취득하여 본인에게 손해를 가한다는 점에 대한 인식이나 의사를 가지고 임무에 위배한 행위를 개시한 때 배임죄의 실행에 착수한 것이고, 이러한 행위로 인하여 자기 또는 제3자가 이익을 취득하여 본인에게 손해를 가한 때 기수에 이른다.","cite":"대법원 2014도1104","badge":"","topic":"","from":"GY-2023-1-X-09","seq":null},{"id":"X-OX-369","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"범인이 피해자를 촬영하기 위하여 육안 또는 캠코더의 줌 기능을 이용하여 피해자가 있는지 여부를 탐색하다가 피해자를 발견하지 못하고 촬영을 포기하였더라도 이는 촬영을 위한 준비행위를 한 것으로 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)죄의 실행에 착수한 것이다. (23.2차)","answer":false,"quote":"촬영할 사람을 찾으려 육안이나 줌으로 탐색하다 포기한 것은 준비행위일 뿐 촬영죄의 실행 착수로 볼 수 없다.","cite":"대법원 2021도749 · 성폭력범죄의 처벌 등에 관한 특례법 제14조","badge":"","topic":"","from":"GY-2023-2-X-17","seq":null},{"id":"X-OX-354","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"횡령범인이 위탁자가 소유자를 위해 보관하고 있는 물건을 위탁자로부터 보관받아 이를 횡령한 경우, 범인과 피해물건의 소유자 사이에 친족관계가 있으면 범인과 위탁자 사이에 친족 관계가 없더라도 친족상도례가 적용된다. (23.1차)","answer":false,"quote":"횡령범인이 위탁자가 소유자를 위해 보관하고 있는 물건을 위탁자로부터 보관받아 이를 횡령한 경우에 형법 제361조 에 의하여 준용되는 제328조 제2항 의 친족간의 범행에 관한 조문은 범인과 피해물건의 소유자 및 위탁자 쌍방 사이에 같은 조문에 정한 친족관계가 있는 경우에만 적용되고, 단지 횡령범인과 피해물건의 소유자간에만 친족관계가 있거나 횡령범인과 피해물건의 위탁자간에만 친족관계가 있는 경우에는 적용되지 않는다.","cite":"대법원 2008도3438","badge":"","topic":"","from":"GY-2023-1-X-18","seq":null},{"id":"X-OX-401","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 A의 얼굴을 주먹으로 수회 때리는 등 무차별적으로 폭행 하여 상해를 가하자 A가 甲의 계속된 폭행을 피하려고 도로를 건너 도주하다가 차량에 치여 사망한 경우, 甲의 위 상해행위와 A의 사망 사이에는 상당인과관계가 인정되지 않는다. (25.1차)","answer":false,"quote":"계속되는 폭행을 피하려 도로로 달아나다 차에 치여 숨지는 것은 예견할 수 있는 결과여서, 상해와 사망 사이에 상당인과관계가 있다.","cite":"대법원 96도529 · 형법 제259조","badge":"","topic":"","from":"GY-2025-1-X-05","seq":null},{"id":"X-OX-276","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"정상적으로 발급받은 신용카드를 소지한 카드회원 甲이 일시적인 자금궁색 등의 이유로 그 채무를 일시적으로 이행하지 못하게 되는 상황이 아니라 이미 과다한 부채의 누적 등으로 신용카드 사용으로 인한 대출금채무를 변제할 의사나 능력이 없는 상황에 처하였음에도 불구하고 신용카드를 사용한 경우, 甲에게는 사기죄가 성립한다. (24.1차)","answer":true,"quote":"신용카드의 거래는 신용카드업자로부터 카드를 발급받은 사람(카드회원)이 신용카드를 사용하여 가맹점으로부터 물품을 구입하면 신용카드업자는 그 카드를 소지하여 사용한 사람이 신용카드업자로부터 신용카드를 발급받은 정당한 카드회원인 한 그 물품구입대금을 가맹점에 결제하는 한편, 카드회원에 대하여 물품구입대금을 대출해 준 금전채권을 가지는 것이고, 또 카드회원이 현금자동지급기를 통해서 현금서비스를 받아 가면 현금대출관계가 성립되어 신용카드업자는 카드회원에게 대출금채권을 가지는 것이므로, 궁극적으로는 카드회원이 신용카드업자에게 신용카드 거래에서 발생한 대출금채무를 변제할 의무를 부담하게 되고, 그렇다면 이와 같이 신용카드 사용으로 인한 신용카드업자의 금전채권을 발생케 하는 행위는 카드회원이 신용카드업자에 대하여 대금을 성실히 변제할 것을 전제로 하는 것이므로, 카드회원이 일시적인 자금궁색 등의 이유로 그 채무를 일시적으로 이행하지 못하게 되는 상황이 아니라 이미 과다한 부채의 누적 등으로 신용카드 사용으로 인한 대출금채무를 변제할 의사나 능력이 없는 상황에 처하였음에도 불구하고 신용카드를 사용하였다면 사기죄에 있어서 기망행위 내지 편취의 범의를 인정할 수 있다고 한 사례.","cite":"대법원 2004도6859","badge":"","topic":"","from":"GY-2024-1-X-21","seq":null},{"id":"X-OX-385","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 현금카드 소유자 A로부터 강취한 현금카드로 현금자동 지급기에서 예금을 인출한 경우, 이는 모두 A의 예금을 강취 하고자 하는 甲의 단일하고 계속된 범의 아래에서 이루어진 일련의 행위로서 포괄하여 하나의 강도죄를 구성하므로, 현금 인출행위를 현금카드 강취행위와 분리하여 따로 절도죄로 처벌 할 수는 없다. (24.1차)","answer":false,"quote":"예금주인 현금카드 소유자를 협박하여 그 카드를 갈취한 다음 피해자의 승낙에 의하여 현금카드를 사용할 권한을 부여받아 이를 이용하여 현금자동지급기에서 현금을 인출한 행위는 모두 피해자의 예금을 갈취하고자 하는 피고인의 단일하고 계속된 범의 아래에서 이루어진 일련의 행위로서 포괄하여 하나의 공갈죄를 구성하므로, 현금자동지급기에서 피해자의 예금을 인출한 행위를 현금카드 갈취행위와 분리하여 따로 절도죄로 처단할 수는 없다.","cite":"대법원 2007도1375","badge":"","topic":"","from":"GY-2024-1-X-21","seq":null},{"id":"X-OX-291","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"사기죄에 있어서 기망으로 인한 재물교부의 대가가 일부 지급된 경우, 편취액은 피해자로부터 교부된 재물의 가치로부터 그 대가를 공제한 차액이 아니라 교부받은 재물 전부이다. (25.1차)","answer":true,"quote":"금원 편취를 내용으로 하는 사기죄에 있어서는 기망으로 인한 금원 교부가 있으면 그 자체로써 피해자의 재산침해가 되어 바로 사기죄가 성립하고, 상당한 대가가 지급되었다거나 피해자의 전체 재산상에 손해가 없다 하여도 사기죄의 성립에는 영향이 없으므로 사기죄에 있어서 그 대가가 일부 지급된 경우에도 편취액은 피해자로부터 교부된 금원으로부터 그 대가를 공제한 차액이 아니라 교부받은 금원 전부이고, 이는 사기로 인한 특정경제범죄 가중처벌 등에 관한 법률(이하 ‘특정경제범죄법’이라 한다) 위반죄에 있어서도 마찬가지다.","cite":"대법원 2023도18971","badge":"","topic":"","from":"GY-2025-1-X-20","seq":null},{"id":"X-OX-420","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"업무상배임으로 취득한 재산상 이익이 있는 경우, 비록 이익 가액을 구체적으로 산정할 수 없더라도 재산상 이득액을 기준으로 가중 처벌하는 ｢특정경제범죄 가중처벌 등에 관한 법률｣ 제3조를 적용하는 것이 책임주의 원칙에 반하는 것은 아니다. (26.1차)","answer":false,"quote":"재산상 이익의 가액(이득액)을 기준으로 가중 처벌하는 특정경제범죄 가중처벌 등에 관한 법률 제3조 의 적용을 전제로 이득액을 산정할 때 유의하여야 할 사항 / 업무상배임으로 취득한 재산상 이익이 있더라도 이득액을 구체적으로 산정할 수 없는 경우, 같은 법 제3조 를 적용할 수 있는지 여부 (소극)","cite":"대법원 2025도6356","badge":"","topic":"","from":"GY-2026-1-X-01","seq":null},{"id":"X-OX-368","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"‘강제추행’이란 객관적으로 일반인에게 성적 불쾌감이나 혐오감을 일으키게 하고 선량한 성적 도덕관념에 반하는 행위로서 피해자의 성적 자유를 침해하는 것이므로 강제추행죄의 성립에 필요한 주관적 구성요건으로는 성욕을 자극･흥분･만족시키려는 주관적 동기나 목적이 있어야 한다. (23.2차)","answer":false,"quote":"‘추행’이란 객관적으로 일반인에게 성적 수치심이나 혐오감을 일으키게 하고 선량한 성적 도덕관념에 반하는 행위로서 피해자의 성적 자유를 침해하는 것이고, 이에 해당하는지는 피해자의 의사, 성별, 연령, 행위자와 피해자의 이전부터의 관계, 행위에 이르게 된 경위, 구체적 행위태양, 주위의 객관적 상황과 그 시대의 성적 도덕관념 등을 종합적으로 고려하여 신중히 결정되어야 한다.","cite":"대법원 2013도5856","badge":"","topic":"","from":"GY-2023-2-X-17","seq":null},{"id":"X-OX-240","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"압류된 골프장 시설을 보관하는 회사의 대표이사 甲이 그 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장 개장 및 압류시설 작동을 의도적으로 묵인 또는 방치하여 봉인이 훼손되게 한 경우, 甲에게는 부작위에 의한 공무상표시무효죄가 성립한다. (22.2차)","answer":true,"quote":"압류된 골프장시설을 보관하는 회사의 대표이사가 위 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장을 개장하게 하여 봉인이 훼손되게 한 경우, 부작위에 의한 공무상표시무효죄의 성립을 인정한 사례","cite":"대법원 2005도3034","badge":"","topic":"","from":"GY-2022-2-X-09","seq":null},{"id":"X-OX-415","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제273조 제1항에서 말하는 ‘학대’라 함은 육체적으로 고통을 주거나 정신적인 차별대우를 포함하는 행위로서, 단순히 상대방의 인격에 대한 반인륜적 침해행위가 있으면 그 즉시 범죄가 완성되는 즉시범이다. (25.2차)","answer":false,"quote":"학대는 반인륜적 인격 침해만으로는 부족하고 적어도 유기에 준할 정도여야 하며, 판례는 학대죄를 학대행위와 동시에 완성되는 즉시범으로 본다.","cite":"대법원 2000도223 · 대법원 84도2922 · 형법 제273조","badge":"","topic":"","from":"GY-2025-2-X-17","seq":null},{"id":"X-OX-301","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"결과적 가중범은 기본범죄에 내재된 전형적 위험성이 발현 되었다는 점에서 가중처벌의 근거를 찾을 수 있으므로 기본범죄의 실행에 착수한 사람이 실행행위를 완료하지 않았더라도 이로 인하여 형이 무거워지는 요인이 되는 결과가 생겼다면 기본범죄에 내재된 위험이 현실화되었다는 점에서 이를 결과적 가중범의 기수범으로 처벌하는 것은 당연하다. (25.2차)","answer":true,"quote":"기본 범죄의 실행에 착수한 사람이 실행행위를 완료하지 않았더라도, 이로 인하여 형이 무거워지는 요인이 되는 결과가 생겼다면 기본 범죄에 내재된 위험이 현실화되었다는 점에서 이를 결과적 가중범의 기수범으로 처벌하는 것이 책임원칙에 부합하는 당연한 결론이다.","cite":"대법원 2023도10405","badge":"","topic":"","from":"GY-2025-2-X-05","seq":null},{"id":"X-OX-270","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 A를 강간하려고 속옷을 강제로 벗기고 음부를 만지던 중 A가 수술한 지 얼마 되지 않아 배가 아프다면서 애원하는 바람에 간음행위를 중단한 경우, 甲에게는 중지미수의 성립요건인 ‘자의성’이 인정되지 않는다. (24.1차)","answer":true,"quote":"피고인 갑, 을, 병이 강도행위를 하던 중 피고인 갑, 을은 피해자를 강간하려고 작은 방으로 끌고가 팬티를 강제로 벗기고 음부를 만지던 중 피해자가 수술한 지 얼마 안되어 배가 아프다면서 애원하는 바람에 그 뜻을 이루지 못하였다면, 강도행위의 계속 중 이미 공포상태에 빠진 피해자를 강간하려고 한 이상 강간의 실행에 착수한 것이고, 피고인들이 간음행위를 중단한 것은 피해자를 불쌍히 여겨서가 아니라 피해자의 신체조건상 강간을 하기에 지장이 있다고 본 데에 기인한 것이므로, 이는 일반의 경험상 강간행위를 수행함에 장애가 되는 외부적 사정에 의하여 범행을 중지한 것에 지나지 않는 것으로서 중지범의 요건인 자의성을 결여하였다.","cite":"대법원 92도917","badge":"","topic":"","from":"GY-2024-1-X-08","seq":null},{"id":"X-OX-278","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"거래의 상대방이 일정한 사정에 관한 고지를 받았더라면 당해 거래에 임하지 아니하였을 것임이 경험칙상 명백한 경우, 그 거래로 인하여 재물을 수취하는 자에게는 신의성실의 원칙상 사전에 상대방에게 그와 같은 사정을 고지할 의무가 있다고 할 것이므로 이를 고지하지 아니한 것은 고지할 사실을 묵비함 으로써 상대방을 기망한 것이 되어 사기죄를 구성한다. (24.1차)","answer":true,"quote":"사기죄의 요건으로서의 기망은 널리 재산상의 거래관계에 있어 서로 지켜야 할 신의와 성실의 의무를 져버리는 모든 적극적 또는 소극적 행위를 말하는 것인바, 거래의 상대방이 일정한 사정에 관한 고지를 받았더라면 당해 거래에 임하지 아니하였을 것임이 경험칙상 명백한 경우 그 거래로 인하여 재물을 수취하는 자에게는 신의성실의 원칙상 사전에 상대방에게 그와 같은 사정을 고지할 의무가 있다고 할 것이므로 이를 고지하지 아니한 것은 고지할 사실을 묵비함으로써 상대방을 기망한 것이 되어 사기죄를 구성한다.","cite":"대법원 96도1081","badge":"","topic":"","from":"GY-2024-1-X-22","seq":null},{"id":"X-OX-358","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"사기죄의 ‘처분행위’라 함은 재산적 처분행위로서 피해자가 자유의사로 직접 재산상 손해를 초래하는 작위에 나아가는 것을 말하므로, 피해자가 기망에 의하여 착오에 빠진 결과 채권의 존재를 알지 못하여 채권을 행사하지 아니한 것에 불과하다면 그와 같은 부작위는 재산의 처분행위에 해당하지 않는다. (23.1차)","answer":false,"quote":"사기죄는 타인을 기망하여 착오를 일으키게 하고 그로 인한 처분행위를 유발하여 재물·재산상의 이득을 얻음으로써 성립하고, 여기서 처분행위라 함은 재산적 처분행위로서 피해자가 자유의사로 직접 재산상 손해를 초래하는 작위에 나아가거나 또는 부작위에 이른 것을 말하므로, 피해자가 착오에 빠진 결과 채권의 존재를 알지 못하여 채권을 행사하지 아니하였다면 그와 같은 부작위도 재산의 처분행위에 해당한다.","cite":"대법원 2005도9221","badge":"","topic":"","from":"GY-2023-1-X-20","seq":null},{"id":"X-OX-362","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 소송비용을 편취할 의사로 소송비용의 지급을 구하는 손해배상청구의 소를 제기하였다가 담당 판사로부터 소송비용의 확정은 소송비용액 확정절차를 통해 하라는 권유를 받고 위 소를 취하한 때에는 ｢형법｣ 제347조에 따른 사기죄의 불능미수에 해당한다. (23.2차)","answer":false,"quote":"소송비용을 편취할 의사로 소송비용의 지급을 구하는 손해배상청구의 소를 제기한 경우, 사기죄의 불능범에 해당한다고 한 사례","cite":"대법원 2005도8105","badge":"","topic":"","from":"GY-2023-2-X-09","seq":null},{"id":"X-OX-378","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"지역버스 노동조합 조합원인 甲이 자신의 페이스북에 집회 일정을 알리면서 노동조합 집행부인 A와 B를 지칭하며 “버스 노조 악의 축, A와 B를 구속수사하라!!”라는 표현을 적시한 경우, 甲에게는 A와 B에 대한 모욕죄가 성립한다. (24.1차)","answer":false,"quote":"지역버스노동조합 조합원인 피고인이 자신의 페이스북에 집회 일정을 알리면서 노동조합 집행부인 피해자 甲과 乙을 지칭하며 \"버스노조 악의 축, 甲과 乙 구속수사하라!!\"라는 표현을 적시하여 피해자들을 모욕하였다는 내용으로 기소된 사안에서, 위 표현이 피해자들의 사회적인 평가를 저해시킬 만한 경멸적인 표현에 해당하는 것으로 보이지만, 피고인 등은 노동조합의 운영에 문제를 제기하면서 노동조합 재산의 투명한 운영, 위원장 직선제 등을 요구하고 있었고, 피고인은 그 주장을 하기 위한 집회 참여를 독려하면서 위 표현을 사용한 것으로, 노동조합의 운영 등에 대한 비판적인 의견을 표현하는 과정에서 자신의 입장과 의견을 강조하기 위한 의도로 위 표현을 사용한 것으로 보이는 점, ‘악의 축’이라는 용어는 자신과 의견이 다른 상대방 측의 핵심 일원이라는 취지로 비유적으로도 사용되고 있어 피해자들의 의혹과 관련된 위 표현이 지나치게 모욕적이거나 악의적이라 보기 어려운 점 등 제반 사정을 종합할 때, 피고인이 노동조합 집행부의 공적 활동과 관련한 자신의 의견을 담은 게시글을 작성하면서 그러한 표현을 한 것은 사회상규에 위배되지 않는 정당행위로서 형법 제20조 에 따라 위법성이 조각된다고 볼 여지가 크다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판단에 모욕죄의 위법성 판단에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2019도14421","badge":"","topic":"","from":"GY-2024-1-X-15","seq":null},{"id":"X-OX-273","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"부(父)가 혼인 외의 출생자를 인지하는 경우 ｢민법｣상 인지의 소급효는 친족상도례에 관한 규정의 적용에도 미친다고 보아야 할 것이므로, 인지가 범행 후에 이루어졌다 하더라도 그 소급효에 따라 형성되는 친족관계를 기초로 하여 ｢형법｣상 친족상도례 규정이 적용된다. (24.1차)","answer":true,"quote":"민법 제860조 에 의하여 그 자의 출생시에 소급하여 인지의 효력이 생기는 것이며, 이와 같은 인지의 소급효는 친족상도례에 관한 규정의 적용에도 미친다고 보아야 할 것이므로, 인지가 범행 후에 이루어진 경우라고 하더라도 그 소급효에 따라 형성되는 친족관계를 기초로 하여 친족상도례의 규정이 적용된다.","cite":"대법원 96도1731","badge":"","topic":"","from":"GY-2024-1-X-17","seq":null},{"id":"X-OX-377","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 골프클럽 경기보조원들의 구직편의를 위해 제작된 인터넷 사이트 내 회원 게시판에 특정 골프클럽의 운영상 불합리성을 비난하는 글을 게시하면서 위 클럽담당자 A에 대하여 ‘한심 하고 불쌍한 인간’이라는 등 경멸적 표현을 한 경우, 甲에게는 A에 대한 모욕죄가 성립한다. (24.1차)","answer":false,"quote":"골프클럽 경기보조원들의 구직편의를 위해 제작된 인터넷 사이트 내 회원 게시판에 특정 골프클럽의 운영상 불합리성을 비난하는 글을 게시하면서 위 클럽담당자에 대하여 한심하고 불쌍한 인간이라는 등 경멸적 표현을 한 사안에서, 게시의 동기와 경위, 모욕적 표현의 정도와 비중 등에 비추어 사회상규에 위배되지 않는다고 보아 모욕죄의 성립을 부정한 사례.","cite":"대법원 2008도1433","badge":"","topic":"","from":"GY-2024-1-X-15","seq":null},{"id":"X-OX-422","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제12조의 강요된 행위에서 방어할 방법이 없는 협박이란 자기 또는 친족의 생명, 신체, 자유에 대한 위해를 달리 막을 방법이 없는 협박을 의미한다. (26.1차)","answer":false,"quote":"강요된 행위의 협박은 자기 또는 친족의 생명·신체에 대한 위해를 방어할 방법이 없는 경우이고, 자유에 대한 위해는 들지 않는다.","cite":"형법 제12조","badge":"","topic":"","from":"GY-2026-1-X-07","seq":null},{"id":"X-OX-321","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"사기의 공모공동정범이 그 기망방법을 구체적으로 몰랐다고 하더라도 공모관계를 부정할 수 없다. (26.1차)","answer":true,"quote":"사기의 공모공동정범은 기망방법을 구체적으로 몰랐더라도 그것만으로 공모관계가 부정되지 않는다.","cite":"대법원 2013도5080","badge":"","topic":"","from":"GY-2026-1-X-18","seq":null},{"id":"X-OX-408","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 ‘A에게 100m 이내로 접근하지 말 것’ 등을 명하는 법원의 접근금지가처분 결정이 있는 등 甲이 A를 방문하는 것을 A가 싫어하는 것을 알고 있음에도 임의로 A가 근무하는 사무실 안으로 들어간 경우, 甲의 행위는 건조물침입죄를 구성하지 않는다. (25.1차)","answer":false,"quote":"피고인이 ‘甲에게 100m 이내로 접근하지 말 것’ 등을 명하는 법원의 접근금지가처분 결정이 있는 등 피고인이 甲을 방문하는 것을 甲이 싫어하는 것을 알고 있음에도 임의로 甲이 근무하는 사무실 안으로 들어감으로써 건조물에 침입하였다는 공소사실로 기소된 사안에서, 피고인이 위 결정에 반하여 甲이 근무하는 사무실에 출입한 것은 甲의 명시적인 의사에 반하는 행위일 뿐만 아니라, 출입의 금지나 제한을 무시하고 출입한 경우로서 출입 당시 객관적·외형적으로 드러난 행위태양을 기준으로 보더라도 사실상 평온상태가 침해된 것으로 볼 수 있으므로 건조물침입죄가 성립한다고 한 사례","cite":"대법원 2023도16595","badge":"","topic":"","from":"GY-2025-1-X-18","seq":null},{"id":"X-OX-312","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"상품의 선전, 광고의 경우라도 거래에 있어서 중요한 사항에 관하여 구체적 사실을 거래상의 신의성실의 의무에 비추어 비난받을 정도의 방법으로 허위로 고지한 경우에는 사기죄의 기망행위에 해당한다. (25.2차)","answer":true,"quote":"사기죄의 요건으로서의 기망은 널리 재산상의 거래관계에 있어서 서로 지켜야 할 신의와 성실의 의무를 저버리는 모든 적극적 및 소극적 행위로서 사람으로 하여금 착오를 일으키게 하는 것을 말하며 사기죄의 본질은 기망에 의한 재물이나 재산상 이익의 취득에 있고, 상대방에게 현실적으로 재산상 손해가 발생함을 그 요건으로 하지 아니하는바, 일반적으로 상품의 선전, 광고에 있어 다소의 과장, 허위가 수반되는 것은 그것이 일반 상거래의 관행과 신의칙에 비추어 시인될 수 있는 한 기망성이 결여된다고 하겠으나 거래에 있어서 중요한 사항에 관하여 구체적 사실을 거래상의 신의성실의 의무에 비추어 비난받을 정도의 방법으로 허위로 고지한 경우에는 과장, 허위광고의 한계를 넘어 사기죄의 기망행위에 해당한다.","cite":"대법원 91도2994","badge":"","topic":"","from":"GY-2025-2-X-20","seq":null},{"id":"X-OX-347","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲과 丙에게는 배임죄의 미수가 성립한다. (22.2차)","answer":false,"quote":"매수인에게 가등기를 해 준 甲도 제3자에게 소유권이전등기를 마치면 배임죄 기수이고, 丙도 가등기로 기수라 둘 다 미수가 아니다.","cite":"대법원 2019도16228 · 대법원 2008도3766","badge":"","topic":"","from":"GY-2022-2-X-21","seq":null},{"id":"X-OX-300","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 자신이 경영하는 속셈학원의 강사로 乙을 채용하고 학습 교재를 설명하겠다는 구실로 유인하여 호텔 객실에 감금한 후 강간하려 하자, 乙이 완강히 반항하던 중 甲이 대실시간 연장을 위해 전화하는 사이에 객실 창문을 통해 탈출하려다가 지상에 추락하여 사망한 경우, 甲의 강간미수행위와 乙의 사망 사이에 상당인과관계가 있다. (25.2차)","answer":true,"quote":"피고인이 자신이 경영하는 속셈학원의 강사로 피해자를 채용하고 학습교재를 설명하겠다는 구실로 유인하여 호텔 객실에 감금한 후 강간하려 하자, 피해자가 완강히 반항하던 중 피고인이 대실시간 연장을 위해 전화하는 사이에 객실 창문을 통해 탈출하려다가 지상에 추락하여 사망한 사안에서, 피고인의 강간미수행위와 피해자의 사망과의 사이에 상당인과관계가 있다고 보아 피고인을 강간치사죄로 처단한 원심의 판단을 수긍한 사례.","cite":"대법원 95도425","badge":"","topic":"","from":"GY-2025-2-X-04","seq":null},{"id":"X-OX-380","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"타인의 예금통장을 무단사용하여 예금을 인출한 후 바로 통장을 반환한 경우, 그 사용으로 인한 경제적 가치의 소모 정도를 불문하고 예금통장에 대한 절도죄는 성립하지 않는다. (24.1차)","answer":false,"quote":"그렇다면 타인의 예금통장을 무단사용하여 예금을 인출한 후 바로 예금통장을 반환하였다 하더라도 그 사용으로 인한 위와 같은 경제적 가치의 소모가 무시할 수 있을 정도로 경미한 경우가 아닌 이상, 예금통장 자체가 가지는 예금액 증명기능의 경제적 가치에 대한 불법영득의 의사를 인정할 수 있으므로 절도죄가 성립한다.","cite":"대법원 2009도9008","badge":"","topic":"","from":"GY-2024-1-X-18","seq":null},{"id":"X-OX-421","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"골프와 같은 개인 운동경기에 참가하는 자는 자신의 행동으로 인해 다른 사람이 다칠 수도 있으므로, 경기 규칙을 준수하고 주위를 살펴 상해의 결과가 발생하는 것을 미연에 방지해야 할 주의의무가 있으나 이러한 주의의무는 경기보조원에 대하여는 부담하지 않는다. (26.1차)","answer":false,"quote":"골프와 같은 개인 운동경기에 참가하는 자는 자신의 행동으로 인해 다른 사람이 다칠 수도 있으므로, 경기 규칙을 준수하고 주위를 살펴 상해의 결과가 발생하는 것을 미연에 방지해야 할 주의의무가 있다.","cite":"대법원 2008도6940","badge":"","topic":"","from":"GY-2026-1-X-05","seq":null},{"id":"X-OX-398","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 술집 운영자 A로부터 술값의 지급을 요구받자 A를 유인· 폭행하고 도주함으로써 술값의 지급을 면하여 재산상 이익을 취득한 경우에는 ｢형법｣ 제335조의 준강도죄가 성립한다. (24.2차)","answer":false,"quote":"피고인이 술집 운영자 甲으로부터 술값의 지급을 요구받자 甲을 유인·폭행하고 도주함으로써 술값의 지급을 면하여 재산상 이익을 취득하고 상해를 가하였다고 하여 강도상해로 기소되었는데, 원심이 위 공소사실을 ‘피고인이 甲에게 지급해야 할 술값의 지급을 면하여 재산상 이익을 취득하고 甲을 폭행하였다’는 범죄사실로 인정하여 준강도죄를 적용한 사안에서, 원심이 인정한 범죄사실에는 그 자체로 절도의 실행에 착수하였다는 내용이 포함되어 있지 않음에도 준강도죄를 적용하여 유죄로 인정한 원심판결에 준강도죄의 주체에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2014도2521","badge":"","topic":"","from":"GY-2024-2-X-22","seq":null},{"id":"X-OX-265","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"A는 드라이버를 구매하기 위해 특정 매장에 방문하였다가 자신의 지갑을 떨어뜨렸는데, 10분쯤 후 甲이 같은 매장에서 우산을 구매하고 계산을 마친 뒤, 그 지갑을 발견하여 습득한 매장 주인 B로부터 “이 지갑이 선생님 지갑이 맞느냐?”라는 질문을 받자 “내 것이 맞다.”라고 대답한 후 이를 교부받아 가지고 갔다면 甲에게는 절도죄가 아니라 사기죄가 성립한다. (23.2차)","answer":true,"quote":"피해자 甲은 드라이버를 구매하기 위해 특정 매장에 방문하였다가 지갑을 떨어뜨렸는데, 10분쯤 후 피고인이 같은 매장에서 우산을 구매하고 계산을 마친 뒤, 지갑을 발견하여 습득한 매장 주인 乙로부터 \"이 지갑이 선생님 지갑이 맞느냐?\"라는 질문을 받자 \"내 것이 맞다.\"라고 대답한 후 이를 교부받아 가지고 간 사안에서, 乙은 지갑을 습득하여 진정한 소유자에게 돌려주어야 하는 지위에 있으므로 甲을 위하여 이를 처분할 수 있는 권능을 갖거나 그 지위에 있었으며, 이러한 처분 권능과 지위에 기초하여 지갑의 소유자라고 주장하는 피고인에게 지갑을 교부하였고 이를 통해 피고인이 지갑을 취득하여 자유로운 처분이 가능한 상태가 되었으므로, 乙의 행위는 사기죄에서 말하는 처분행위에 해당하고 피고인의 행위를 절취행위로 평가할 수 없다는 이유로, 피고인에 대한 주위적 공소사실인 절도 부분을 이유에서 무죄로 판단하면서 예비적 공소사실인 사기 부분을 유죄로 인정한 원심의 판단이 정당하다고 한 사례.","cite":"대법원 2022도12494","badge":"","topic":"","from":"GY-2023-2-X-20","seq":null},{"id":"X-OX-241","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주거침입강간죄는 사람의 주거 등을 침입한 자가 피해자를 강간한 경우에 성립하는 것으로서 주거침입죄를 범한 후에 사람을 강간하여야 하는 일종의 신분범이고, 선후가 바뀌어 강간죄를 범한 자가 그 피해자의 주거에 침입한 경우에는 강간죄와 주거침입죄의 실체적 경합범이 된다. (22.2차)","answer":true,"quote":"주거침입강제추행죄 및 주거침입강간죄 등은 사람의 주거 등을 침입한 자가 피해자를 간음, 강제추행 등 성폭력을 행사한 경우에 성립하는 것으로서, 주거침입죄를 범한 후에 사람을 강간하는 등의 행위를 하여야 하는 일종의 신분범이고, 선후가 바뀌어 강간죄 등을 범한 자가 그 피해자의 주거에 침입한 경우에는 이에 해당하지 않고 강간죄 등과 주거침입죄 등의 실체적 경합범이 된다.","cite":"대법원 2020도17796","badge":"","topic":"","from":"GY-2022-2-X-11","seq":null},{"id":"X-OX-364","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 상습으로 A를 폭행하고, 자신의 어머니 B를 존속폭행 하였다는 내용으로 기소된 사안에서, 甲에게 폭행 범행을 반복하여 저지르는 습벽이 있고 이러한 습벽에 의하여 단순폭행, 존속폭행 범행을 저지른 사실이 인정된다면 단순폭행, 존속폭행의 각 죄별로 상습성을 판단하여야 한다. (23.2차)","answer":false,"quote":"피고인이 상습으로 甲을 폭행하고, 어머니 乙을 존속폭행하였다는 내용으로 기소된 사안에서, 피고인에게 폭행 범행을 반복하여 저지르는 습벽이 있고 이러한 습벽에 의하여 단순폭행, 존속폭행 범행을 저지른 사실이 인정된다면 단순폭행, 존속폭행의 각 죄별로 상습성을 판단할 것이 아니라 포괄하여 그중 법정형이 가장 중한 상습존속폭행죄만 성립할 여지가 있는데도, 이와 달리 상습폭행과 존속폭행의 2개 행위로 파악하여, 피고인에게 단순폭행의 습벽이 인정된다는 이유로 상습폭행 부분을 유죄로 인정하면서도 존속폭행의 습벽까지는 인정할 증거가 없다는 이유에서 상습존속폭행은 성립할 수 없고 존속폭행만 성립할 수 있다고 전제한 다음, 乙이 제1심판결 선고 전에 처벌을 원하지 않는다는 의사를 밝혔다는 이유로 존속폭행 부분에 대하여 주문에서 공소기각을 선고한 원심판결에 형법 제264조 , 폭행죄의 상습성, 죄수 등에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도10956","badge":"","topic":"","from":"GY-2023-2-X-14","seq":null},{"id":"X-OX-277","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢여신전문금융업법｣상 신용카드 부정사용죄와 관련하여, 동법 제70조 제1항 제4호의 ‘기망하거나 공갈하여 취득한 신용카드나 직불카드’는 ‘신용카드나 직불카드의 소유자 또는 점유자를 기망 하거나 공갈하여 그들의 자유로운 의사에 의하지 않고 점유가 배제되어 그들로부터 사실상 처분권을 취득한 신용카드나 직불 카드’라고 해석되어야 한다. (24.1차)","answer":true,"quote":"그리고 ‘기망하거나 공갈하여 취득한 신용카드나 직불카드’는 문언상 ‘기망이나 공갈을 수단으로 하여 다른 사람으로부터 취득한 신용카드나 직불카드’라는 의미이므로, ‘신용카드나 직불카드의 소유자 또는 점유자를 기망하거나 공갈하여 그들의 자유로운 의사에 의하지 않고 점유가 배제되어 그들로부터 사실상 처분권을 취득한 신용카드나 직불카드’라고 해석되어야 한다.","cite":"대법원 2022도10629","badge":"","topic":"","from":"GY-2024-1-X-21","seq":null},{"id":"X-OX-295","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"여론 형성에 상당한 영향을 미치는 언론사 논설주간인 甲이 개인적 친분관계나 거래관계가 없던 X회사의 대표이사 乙로 부터 X회사 및 乙에 대한 우호적인 여론 형성에 도움을 달라는 취지로 수천만 원 상당의 유럽 여행 비용을 제공받은 경우, 이는 배임수재죄에서 말하는 ‘부정한 청탁’에 해당한다. (25.1차)","answer":true,"quote":"언론사 논설주간인 피고인이 甲 주식회사의 대표이사 乙로부터 甲 회사 및 乙에 대한 우호적인 여론 형성에 도움을 달라는 취지의 부정한 청탁을 받고 8박 9일 동안의 유럽여행 비용을 제공받았다는 배임수재의 공소사실로 기소된 사안에서, ① 피고인은 논설주간 및 경제 분야 칼럼니스트로서 甲 회사 등 기업체에 대한 여론 형성에 영향력을 행사할 수 있는 지위에 있었던 점, ② 乙이 피고인에게 일방적으로 거액의 재산상 이익을 공여할 정도의 개인적 친분관계나 거래관계가 없었음에도, 피고인이 乙로부터 취득한 재산상 이익인 유럽여행 비용(약 3,973만 원)은 지나치게 이례적인 거액인 점, ③ 甲 회사는 당시 업계에서 상당한 비중을 차지하던 거대 기업으로 언제든지 언론 보도, 평론 등의 대상이 될 수 있는 상황이었고, 실제로 그 무렵 甲 회사와 관련한 칼럼, 사설 등이 적지 않게 게재되고 있었던 사정 등에 비추어, 乙은 물론 피고인도 논설주간 사무를 이용한 우호적 여론 형성에 관한 청탁의 대가라는 점에 대한 인식과 양해하에 사교적 의례 범위를 크게 벗어나는 여행 비용을 주고받았다고 보아야 하므로, 청탁의 내용이 명시되지 않았더라도 묵시적 의사표시에 의한 청탁이 있었다고 평가되어야 하는 점, ④ 언론인이 평론의 대상이 되는 특정인이나 특정 기업으로부터 경제적 이익을 제공받으면서 우호적 여론 형성 등에 관한 청탁을 받는 것은 사회상규 또는 신의성실의 원칙에 반하는 배임수재죄의 부정한 청탁에 해당하는 점 등을 종합하면, 피고인이 乙로부터 거액의 경제적 이익을 제공받으면서 甲 회사에 대한 우호적 여론 형성에 관한 청탁을 받은 것은 ‘부정한 청탁’에 해당한다는 이유로, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","cite":"대법원 2020도1263","badge":"","topic":"","from":"GY-2025-1-X-22","seq":null},{"id":"X-OX-309","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주거침입죄의 범의는 반드시 신체의 전부가 타인의 주거 안으로 들어간다는 인식이 있어야만 하는 것이 아니라 신체의 일부라도 타인의 주거 안으로 들어간다는 인식이 있으면 족하다. (25.2차)","answer":true,"quote":"주거침입죄는 사실상의 주거의 평온을 보호법익으로 하는 것이므로, 반드시 행위자의 신체의 전부가 범행의 목적인 타인의 주거 안으로 들어가야만 성립하는 것이 아니라 신체의 일부만 타인의 주거 안으로 들어갔다고 하더라도 거주자가 누리는 사실상의 주거의 평온을 해할 수 있는 정도에 이르렀다면 범죄구성요건을 충족하는 것이라고 보아야 하고, 따라서 주거침입죄의 범의는 반드시 신체의 전부가 타인의 주거 안으로 들어간다는 인식이 있어야만 하는 것이 아니라 신체의 일부라도 타인의 주거 안으로 들어간다는 인식이 있으면 족하다.","cite":"대법원 94도2561","badge":"","topic":"","from":"GY-2025-2-X-19","seq":null},{"id":"X-OX-235","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"횡령죄의 본질이 신임관계에 기초하여 위탁된 타인의 물건을 위법하게 영득하는 데 있음에 비추어 볼 때 위탁신임관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정함이 타당하다. (22.1차)","answer":true,"quote":"이러한 위탁관계는 사용대차ㆍ임대차ㆍ위임 등의 계약에 의하여서뿐만 아니라 사무관리ㆍ관습ㆍ조리ㆍ신의칙 등에 의해서도 성립될 수 있으나, 횡령죄의 본질이 신임관계에 기초하여 위탁된 타인의 물건을 위법하게 영득하는 데 있음에 비추어 볼 때 위탁관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정함이 타당하다.","cite":"대법원 2016도18761","badge":"","topic":"","from":"GY-2022-1-X-20","seq":null},{"id":"X-OX-351","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"미성년자를 유인한 자가 계속하여 미성년자를 불법하게 감금한 경우, 감금죄만 성립하고 미성년자유인죄는 이에 흡수된다. (23.1차)","answer":false,"quote":"미성년자를 유인한 자가 계속하여 미성년자를 불법하게 감금하였을 때에는 미성년자유인죄 이외에 감금죄가 별도로 성립한다.","cite":"대법원 98도1036","badge":"","topic":"","from":"GY-2023-1-X-15","seq":null},{"id":"X-OX-279","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제263조의 동시범은 상해와 폭행죄에 관한 특별규정 으로서 동 규정은 그 보호법익을 달리하는 강간치상죄에는 적용할 수 없다. (24.2차)","answer":true,"quote":"형법 제263조 의 동시범은 상해와 폭행죄에 관한 특별규정으로서 동 규정은 그 보호법익을 달리하는 강간치상죄에는 적용할 수 없다.","cite":"대법원 84도372","badge":"","topic":"","from":"GY-2024-2-X-11","seq":null},{"id":"X-OX-373","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 타인 소유 토지의 이용을 방해할 목적으로 권한 없이 건물을 신축하였다면, 이는 다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용·수익하는
