행위로 소유자를 배제한 채 물건의 이용가치를 영득하는 것이고 그 결과 소유자가 물건의 효용을 누리지 못하게 된 것으로 볼 수 있어 이와 같은 甲의 행위는 재물손괴죄에 해당한다. (23.2차)","answer":false,"quote":"다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용·수익하는 행위는 소유자를 배제한 채 물건의 이용가치를 영득하는 것이고, 그 때문에 소유자가 물건의 효용을 누리지 못하게 되었더라도 효용 자체가 침해된 것이 아니므로 재물손괴죄에 해당하지 않는다.","cite":"대법원 2022도1410","badge":"","topic":"","from":"GY-2023-2-X-22","seq":null},{"id":"X-OX-386","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제263조의 동시범은 ‘상해의 결과’를 발생하게 한 경우에 적용되기 때문에 시간적 차이가 있는 독립된 상해행위나 폭행 행위가 경합하여 사망의 결과가 일어나고 그 사망의 원인된 행위가 판명되지 않은 경우에는 동 규정을 적용할 수 없다. (24.2차)","answer":false,"quote":"시간적 차이가 있는 독립된 상해행위나 폭행행위가 경합하여 사망의 결과가 일어나고 그 사망의 원인된 행위가 판명되지 않은 경우에는 공동정범의 예에 의하여 처벌할 것이다.","cite":"대법원 2000도2466","badge":"","topic":"","from":"GY-2024-2-X-11","seq":null},{"id":"X-OX-384","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주주나 대표이사 또는 그에 준하여 회사 자금의 보관이나 운용에 관한 사실상의 사무를 처리하는 자가 회사 소유 재산을 제3자의 자금 조달을 위하여 담보로 제공하는 등 사적인 용도로 임의 처분한 경우 횡령죄가 성립하지만, 그 처분에 관하여 주주총회나 이사회의 결의가 있었다면 횡령죄가 성립하지 않는다. (24.1차)","answer":false,"quote":"회사는 주주와 별개의 주체이므로, 회사 재산을 사적으로 담보 제공했다면 주주총회나 이사회 결의가 있었어도 횡령죄가 된다.","cite":"대법원 2005도3045","badge":"","topic":"","from":"GY-2024-1-X-20","seq":null},{"id":"X-OX-256","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제310조의 ‘공공의 이익’이라 함은 널리 국가･사회 기타 일반 다수인의 이익에 관한 것뿐만 아니라 특정한 사회집단이나 그 구성원의 관심과 이익에 관한 것도 포함한다. (23.1차)","answer":true,"quote":"형법 제310조 에서 '오로지 공공의 이익에 관한 때'라 함은 적시된 사실이 객관적으로 볼 때, 공공의 이익에 관한 것으로서 행위자도 주관적으로 공공의 이익을 위하여 그 사실을 적시한 것이어야 하는 것인데, 여기의 공공의 이익에 관한 것에는 널리 국가·사회 기타 일반 다수인의 이익에 관한 것뿐만 아니라 특정한 사회집단이나 그 구성원 전체의 관심과 이익에 관한 것도 포함하는 것이고, 적시된 사실이 공공의 이익에 관한 것인지 여부는 당해 적시사실의 내용과 성질, 당해 사실의 공표가 이루어진 상대방의 범위, 그 표현의 방법 등 그 표현 자체에 관한 제반 사정을 감안함과 동시에 그 표현에 의하여 훼손되거나 훼손될 수 있는 명예의 침해 정도 등을 비교·고려하여 결정하여야 한다.","cite":"대법원 2004도3912","badge":"","topic":"","from":"GY-2023-1-X-16","seq":null},{"id":"X-OX-330","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"독립행위가 경합하여 상해의 결과를 발생하게 한 경우에 있어서 원인된 행위가 판명되지 아니한 때에는 각 행위자를 미수범으로 처벌한다. (22.1차)","answer":false,"quote":"독립행위가 경합하여 상해의 결과를 발생하게 한 경우에 있어서 원인된 행위가 판명되지 아니한 때에는 공동정범의 예에 의한다.","cite":"형법 제263조","badge":"","topic":"","from":"GY-2022-1-X-10","seq":null},{"id":"X-OX-308","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"친권자인 甲이 아동 乙을 양육하면서 집안 내부에 먹다 남은 음식물 쓰레기, 소주병, 담배꽁초가 방치된 비위생적인 환경에서 乙에게 제대로 세탁하지 않아 음식물이 묻어있는 옷을 입히고, 목욕을 주기적으로 시키지 않아 몸에서 악취를 풍기게 하는 등의 행위를 한 경우, 비록 甲이 乙의 생존에 필요한 최소한의 보호와 애정표현을 했다는 사정이 있더라도 방임에 해당한다. (25.2차)","answer":true,"quote":"아동 甲(당시 1세)의 친아버지인 피고인이 甲을 양육하면서 집안 내부에 먹다 남은 음식물 쓰레기, 소주병, 담배꽁초가 방치된 상태로 청소를 하지 않아 악취가 나는 비위생적인 환경에서 甲에게 제대로 세탁하지 않아 음식물이 묻어있는 옷을 입히고, 목욕을 주기적으로 시키지 않아 몸에서 악취를 풍기게 하는 등으로 甲을 방임하였다고 하여 아동복지법 위반으로 기소된 사안에서, 생존에 필요한 최소한의 보호를 하였다는 사정이나 甲이 피고인에게 애정을 표현했다는 사정만으로는 피고인이 甲의 친권자로서 甲의 건강과 안전, 행복을 위하여 필요한 책무를 다했다고 보기 어렵다는 이유로, 피고인이 비위생적인 환경에서 甲을 양육하였고 甲의 의복과 몸을 청결하게 유지해 주지 않았으며 甲을 집에 두고 외출하기도 하는 등 의식주를 포함한 기본적인 보호·양육·치료 및 교육을 소홀히 하는 방임행위를 하였다고 본 원심의 판단이 정당하다고 한 사례.","cite":"대법원 2020도7625","badge":"","topic":"","from":"GY-2025-2-X-17","seq":null},{"id":"X-OX-344","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"A주식회사 해고자 신분으로 노동조합 사무장직을 맡아 노조 활동을 하는 甲이 노사 관계자 140여 명이 있는 가운데 큰 소리로 자신보다 15세 연장자인 A회사 부사장 B를 향해 “야 ○○아, ○○이 여기 있네, 니 이름이 ○○이잖아, ○○아 나오니까 좋지?” 등으로 여러 차례 B의 이름을 부른 경우 (22.2차)","answer":false,"quote":"甲 주식회사 해고자 신분으로 노동조합 사무장직을 맡아 노조활동을 하는 피고인이 노사 관계자 140여 명이 있는 가운데 큰 소리로 피고인보다 15세 연장자로서 甲 회사 부사장인 乙을 향해 “야 ○○아, ○○이 여기 있네, 니 이름이 ○○이잖아, ○○아 나오니까 좋지?” 등으로 여러 차례 乙의 이름을 불러 乙을 모욕하였다는 내용으로 기소된 사안에서, 甲 회사는 노사분규로 노조와 사용자가 극심한 대립을 겪고 있고, 그러한 과정에서 사용자 측의 부당노동행위가 사실로 확인되는 등 노사간 갈등이 격화된 점, 乙은 사용자 측 교섭위원들과 노사교섭을 하였다가 노조 간부 丙이 乙에게 욕설을 하여 교섭이 결렬되었고, 그 후 노사 양측이 교섭을 이어나갔으나 피고인과 丙이 乙에게 다시 욕설을 하여 노사교섭이 파행된 점, 乙 등을 비롯한 관리자 40여 명이 시설관리권 행사 명목으로 노조가 설치한 미승인 게시물을 철거하기 위하여 모이자, 이를 제지하기 위해 노조 조합원 100여 명이 모여 서로 대치하였는데, 피고인은 사용자 측의 게시물 철거행위가 노조활동을 방해하고 노동운동에 대해 간섭하는 것으로 여겨 화가 나 위와 같이 말하였던 점 및 피고인과 乙의 관계, 피고인이 이러한 발언을 하게 된 경위, 발언의 의미와 전체적인 맥락, 발언을 한 장소와 발언 전후의 정황을 종합하면, 피고인의 위 발언은 상대방을 불쾌하게 할 수 있는 무례하고 예의에 벗어난 표현이기는 하지만 객관적으로 乙의 인격적 가치에 대한 사회적 평가를 저하시킬 만한 모욕적 언사에 해당한다고 보기 어렵다는 이유로, 이와 달리 본 원심판단에 형법상 모욕의 의미에 관한 법리를 오해한 잘못이 있다고 한 사례.","cite":"대법원 2017도2661","badge":"","topic":"","from":"GY-2022-2-X-15","seq":null},{"id":"X-OX-426","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"주거침입행위와 절취행위가 모두 야간에 이루어졌다면 절도의 고의가 언제 생겼는지를 불문하고 ｢형법｣상 야간주거침입절도죄가 성립할 뿐 주거침입죄와 절도죄의 경합범이 되는 것은 아니다. (26.1차)","answer":false,"quote":"야간에 주거침입행위가 있은 후 비로소 절도의 고의가 생겼다면 주거침입죄와 절도죄의 경합범이 될 수 있을지언정 야간주거침입절도죄는 성립하지 않는다.","cite":"대법원 2022도5573","badge":"","topic":"","from":"GY-2026-1-X-20","seq":null},{"id":"X-OX-250","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"소유권이전등기청구권에 대한 압류는 강제집행절차를 위한 일련의 시작행위라고 할 수 있으므로, 허위 채권에 기한 공정증서를 집행권원으로 하여 채무자의 소유권이전등기청구권에 대하여 압류신청을 한 시점에 소송사기의 실행에 착수하였다고 볼 수 있다. (23.1차)","answer":true,"quote":"이러한 경우 소유권이전등기청구권에 대한 압류는 당해 부동산에 대한 경매의 실시를 위한 사전 단계로서의 의미를 가지나, 전체로서의 강제집행절차를 위한 일련의 시작행위라고 할 수 있으므로, 허위 채권에 기한 공정증서를 집행권원으로 하여 채무자의 소유권이전등기청구권에 대하여 압류신청을 한 시점에 소송사기의 실행에 착수하였다고 볼 것이다.","cite":"대법원 2014도10086","badge":"","topic":"","from":"GY-2023-1-X-09","seq":null},{"id":"X-OX-263","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"회사직원이 퇴사한 후에는 특별한 사정이 없는 한 더 이상 업무상배임죄에서 타인의 사무를 처리하는 자의 지위에 있다고 볼 수 없어, 퇴사한 회사직원이 반환하거나 폐기하지 아니한 영업비밀 등을 경쟁업체에 유출하거나 스스로의 이익을 위하여 이용하더라도 그 유출 내지 이용행위에 대하여는 따로 업무상배임죄를 구성할 여지는 없다. (23.2차)","answer":true,"quote":"그러나 회사직원이 퇴사한 후에는 특별한 사정이 없는 한 퇴사한 회사직원은 더 이상 업무상배임죄에서 타인의 사무를 처리하는 자의 지위에 있다고 볼 수 없고, 위와 같이 반환하거나 폐기하지 아니한 영업비밀 등을 경쟁업체에 유출하거나 스스로의 이익을 위하여 이용하더라도 이는 이미 성립한 업무상배임 행위의 실행행위에 지나지 아니하므로, 그 유출 내지 이용행위가 부정경쟁방지 및 영입비밀보호에 관한 법률 위반(영업비밀누설등)죄에 해당하는지는 별론으로 하더라도, 따로 업무상배임죄를 구성할 여지는 없다.","cite":"대법원 2017도3808","badge":"","topic":"","from":"GY-2023-2-X-20","seq":null},{"id":"X-OX-289","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 아내인 A와의 불화로 인해 A와 공동생활을 영위하던 아파트에서 짐 일부를 챙겨 나왔는데, 그 후 자신의 부모인 乙, 丙과 함께 아파트에 찾아가 출입문을 열 것을 요구하였으나 A는 외출한 상태로 A의 동생인 B가 출입문에 설치된 체인형 걸쇠를 걸어 문을 열어 주지 않자 공동하여 걸쇠를 손괴한 후 아파트에 들어간 경우, 이는 폭력행위 등 처벌에 관한 법률 위반(공동주거침입)죄를 구성하지 않는다. (25.1차)","answer":true,"quote":"피고인 甲은 처(妻) 乙과의 불화로 인해 乙과 공동생활을 영위하던 아파트에서 짐 일부를 챙겨 나왔는데, 그 후 자신의 부모인 피고인 丙, 丁과 함께 아파트에 찾아가 출입문을 열 것을 요구하였으나 乙은 외출한 상태로 乙의 동생인 戊가 출입문에 설치된 체인형 걸쇠를 걸어 \"언니가 귀가하면 오라.\"며 문을 열어 주지 않자 공동하여 걸쇠를 손괴한 후 아파트에 침입하였다고 하여 폭력행위 등 처벌에 관한 법률 위반(공동주거침입)으로 기소된 사안에서, 검사가 제출한 증거만으로는 피고인 甲이 아파트에서의 공동생활관계에서 이탈하였다거나 그에 대한 지배ㆍ관리를 상실하였다고 보기 어렵고, 공동거주자인 乙이나 그로부터 출입관리를 위탁받은 戊가 공동거주자인 피고인 甲의 출입을 금지할 법률적인 근거 기타 정당한 이유가 인정되지 않으므로, 아파트에 대한 공동거주자의 지위를 계속 유지하고 있던 피고인 甲이 아파트에 출입하는 과정에서 정당한 이유 없이 이를 금지하는 戊의 조치에 대항하여 걸쇠를 손괴하는 등 물리력을 행사하였다고 하여 주거침입죄가 성립한다고 볼 수 없고, 한편 피고인 丙, 丁은 공동거주자이자 아들인 피고인 甲의 공동주거인 아파트에 출입함에 있어 戊의 정당한 이유 없는 출입금지 조치에 대항하여 아파트에 출입하는 데에 가담한 것으로 볼 수 있고, 그 과정에서 피고인 甲이 걸쇠를 손괴하는 등 물리력을 행사하고 피고인 丙도 이에 가담함으로써 공동으로 재물손괴 범죄를 저질렀으나 피고인 丙의 행위는 그 실질에 있어 피고인 甲의 행위에 편승, 가담한 것에 불과하므로, 피고인 丙, 丁이 아파트에 출입한 행위 자체는 전체적으로 공동거주자인 피고인 甲이 아파트에 출입하고 이를 이용하는 행위의 일환이자 이에 수반되어 이루어진 것에 해당한다고 평가할 수 있어 피고인 丙, 丁에 대하여도 같은 법 위반(공동주거침입)죄가 성립하지 않는다고 한 사례.","cite":"대법원 2020도6085","badge":"","topic":"","from":"GY-2025-1-X-18","seq":null},{"id":"X-OX-418","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 A가 B로부터 매수한 토지의 경계 부분에 매수 전 자신이 식재하였던 수목 5그루를 전기톱을 이용하여 절단한 경우, 수목을 식재할 당시 토지 소유권자 B로부터 그에 관한 명시적 또는 묵시적 승낙‧동의‧허락 등을 받았더라도 수목의 소유권은 A에게 귀속되므로 특수재물손괴죄가 성립한다. (25.2차)","answer":false,"quote":"피고인은 피해자 甲이 乙로부터 매수한 토지의 경계 부분에 매수 전 자신이 식재하였던 수목 5그루를 전기톱을 이용하여 절단하였다고 하여 특수재물손괴의 공소사실로 기소된 사안에서, 제반 사정에 비추어 피고인이 수목을 식재할 당시 토지의 전 소유자 乙로부터 명시적 또는 묵시적으로 승낙·동의를 받았거나 적어도 토지 중 수목이 식재된 부분에 관하여는 무상으로 사용할 것을 허락받았을 가능성을 배제하기 어렵고, 이는 민법 제256조 에서 부동산에의 부합의 예외사유로 정한 ‘권원’에 해당한다고 볼 수 있어 수목은 토지에 부합하지 않고 이를 식재한 피고인에게 소유권이 귀속된다는 등의 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 법리오해의 잘못이 있다고 한 사례","cite":"대법원 2023도11885","badge":"","topic":"","from":"GY-2025-2-X-22","seq":null},{"id":"X-OX-313","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"횡령죄에서 재물의 보관은 재물에 대한 사실상 또는 법률상 지배력 있는 상태를 의미하므로, 소유권의 취득에 등록이 필요한 타인 소유의 차량을 인도받아 보관하고 있는 사람이 이를 사실상 처분하면 횡령죄가 성립하며, 보관 위임자나 보관자가 차량의 등록명의자일 필요는 없다. (25.2차)","answer":true,"quote":"따라서 소유권의 취득에 등록이 필요한 타인 소유의 차량을 인도받아 보관하고 있는 사람이 이를 사실상 처분하면 횡령죄가 성립하며, 보관 위임자나 보관자가 차량의 등록명의자일 필요는 없다.","cite":"대법원 2015도1944","badge":"","topic":"","from":"GY-2025-2-X-21","seq":null},{"id":"X-OX-231","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"건조물의 이용에 기여하는 인접의 부속 토지라고 하더라도 인적 또는 물적 설비 등에 의한 구획 내지 통제가 없어 통상의 보행 으로 그 경계를 쉽사리 넘을 수 있는 정도라고 한다면, 이는 다른 특별한 사정이 없는 한 주거침입죄의 객체에 속하지 아니한다. (22.1차)","answer":true,"quote":"따라서 건조물의 이용에 기여하는 인접의 부속 토지라고 하더라도 인적 또는 물적 설비 등에 의한 구획 내지 통제가 없어 통상의 보행으로 그 경계를 쉽사리 넘을 수 있는 정도라고 한다면 일반적으로 외부인의 출입이 제한된다는 사정이 객관적으로 명확하게 드러났다고 보기 어려우므로, 이는 다른 특별한 사정이 없는 한 주거침입죄의 객체에 속하지 아니한다고 봄이 상당하다.","cite":"대법원 2009도14643","badge":"","topic":"","from":"GY-2022-1-X-18","seq":null},{"id":"X-OX-404","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 혼자 술을 마시던 중 X정당이 국회에서 예산안을 강행 처리하였다는 것에 화가 나서 공중전화를 이용하여 경찰서에 여러 차례 전화를 걸어 전화를 받은 각 경찰관에게 경찰서 관할 구역 내에 있는 X정당의 당사를 폭파하겠다는 말을 한 경우, 甲의 행위는 협박죄를 구성한다. (25.1차)","answer":false,"quote":"피고인이 혼자 술을 마시던 중 甲 정당이 국회에서 예산안을 강행처리하였다는 것에 화가 나서 공중전화를 이용하여 경찰서에 여러 차례 전화를 걸어 전화를 받은 각 경찰관에게 경찰서 관할구역 내에 있는 甲 정당의 당사를 폭파하겠다는 말을 한 사안에서, 피고인은 甲 정당에 관한 해악을 고지한 것이므로 각 경찰관 개인에 관한 해악을 고지하였다고 할 수 없고, 다른 특별한 사정이 없는 한 일반적으로 甲 정당에 대한 해악의 고지가 각 경찰관 개인에게 공포심을 일으킬 만큼 서로 밀접한 관계에 있다고 보기 어려운데도, 이와 달리 피고인의 행위가 각 경찰관에 대한 협박죄를 구성한다고 본 원심판결에 협박죄에 관한 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2011도10451","badge":"","topic":"","from":"GY-2025-1-X-14","seq":null},{"id":"X-OX-249","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제12조의 ‘협박’이란 자기 또는 친족의 생명, 신체에 대한 위해를 달리 막을 방법이 없는 협박을 말한다. (23.1차)","answer":true,"quote":"형법 제12조 소정의 저항할 수 없는 폭력은, 심리적인 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 아니할 수 없게 하는 경우와 윤리적 의미에 있어서 강압된 경우를 말하고, 협박이란 자기 또는 친족의 생명, 신체에 대한 위해를 달리 막을 방법이 없는 협박을 말하며, 강요라 함은 피강요자의 자유스런 의사결정을 하지 못하게 하면서 특정한 행위를 하게 하는 것을 말한다.","cite":"대법원 83도2276","badge":"","topic":"","from":"GY-2023-1-X-08","seq":null},{"id":"X-OX-228","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 상습으로 A를 폭행하고, 어머니 B를 존속폭행하였다는 내용으로 기소된 사안에서, 甲에게 폭행 범행을 반복하여 저지르는 습벽이 있고 이러한 습벽에 의하여 단순폭행, 존속 폭행 범행을 저지른 사실이 인정된다면 단순폭행, 존속폭행의 각 죄별로 상습성을 판단할 것이 아니라 포괄하여 그 중 법정형이 가장 중한 상습존속폭행죄만 성립할 여지가 있다. (22.1차)","answer":true,"quote":"피고인이 상습으로 甲을 폭행하고, 어머니 乙을 존속폭행하였다는 내용으로 기소된 사안에서, 피고인에게 폭행 범행을 반복하여 저지르는 습벽이 있고 이러한 습벽에 의하여 단순폭행, 존속폭행 범행을 저지른 사실이 인정된다면 단순폭행, 존속폭행의 각 죄별로 상습성을 판단할 것이 아니라 포괄하여 그중 법정형이 가장 중한 상습존속폭행죄만 성립할 여지가 있는데도, 이와 달리 상습폭행과 존속폭행의 2개 행위로 파악하여, 피고인에게 단순폭행의 습벽이 인정된다는 이유로 상습폭행 부분을 유죄로 인정하면서도 존속폭행의 습벽까지는 인정할 증거가 없다는 이유에서 상습존속폭행은 성립할 수 없고 존속폭행만 성립할 수 있다고 전제한 다음, 乙이 제1심판결 선고 전에 처벌을 원하지 않는다는 의사를 밝혔다는 이유로 존속폭행 부분에 대하여 주문에서 공소기각을 선고한 원심판결에 형법 제264조 , 폭행죄의 상습성, 죄수 등에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도10956","badge":"","topic":"","from":"GY-2022-1-X-14","seq":null},{"id":"X-OX-306","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강요죄는 폭행 또는 협박으로 사람의 권리행사를 방해하거나 의무 없는 일을 하게 하는 범죄이다. 여기에서 ‘폭행’은 간접적인 유형력의 행사도 포함하며, 사람에 대한 간접적인 유형력의 행사를 강요죄의 폭행으로 평가하기 위해서는 피고인이 유형력을 행사한 의도와 방법, 피고인의 행위와 피해자의 근접성, 유형력이 행사된 객체와 피해자의 관계 등을 종합적으로 고려해야 한다. (25.2차)","answer":true,"quote":"사람에 대한 간접적인 유형력의 행사를 강요죄의 폭행으로 평가하기 위해서는 피고인이 유형력을 행사한 의도와 방법, 피고인의 행위와 피해자의 근접성, 유형력이 행사된 객체와 피해자의 관계 등을 종합적으로 고려해야 한다.","cite":"대법원 2018도1346","badge":"","topic":"","from":"GY-2025-2-X-16","seq":null},{"id":"X-OX-290","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"지방의회 본회의 방청 중 회의 진행을 방해하고 퇴거 요구에 불응한 사건과 회의장에서 인화물질로 몸에 불을 붙이려다 미수에 그친 사건으로 지방의회 출입제한 조치를 받은 甲이 며칠 뒤 의회 1층 출입구 앞에서 출입을 제지하는 방호요원들을 밀치면서 의회 청사 로비로 들어간 경우, 甲의 행위는 건조물침입죄를 구성한다. (25.1차)","answer":true,"quote":"지방의회 본회의 방청 중 회의 진행을 방해하고 퇴거 요구에 불응한 사건 등으로 지방의회 출입제한 조치를 받은 피고인이 며칠 뒤 의회 1층 출입구 앞에서 출입을 제지하는 방호요원들을 밀치면서 의회 청사 로비로 들어가 타인이 관리하는 건조물에 침입하였다는 공소사실로 기소된 사안에서, 관리자의 명시적인 의사에 반하여 물리력을 행사하여 건조물에 출입한 경우로서 출입 당시 객관적·외형적으로 드러난 행위태양을 기준으로 보더라도 사실상 평온상태가 침해되었다고 볼 수 있는데도, 이와 달리 공소사실을 무죄로 판단한 원심판결에 법리오해의 잘못이 있다고 한 사례","cite":"대법원 2023도9571","badge":"","topic":"","from":"GY-2025-1-X-18","seq":null},{"id":"X-OX-245","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"군인 甲은 자신의 독신자 숙소에서 군인 A와 서로 키스, 구강 성교나 항문성교를 하는 방법으로 추행하고, 군인 乙은 자신의 독신자 숙소에서 동일한 방법으로 甲과 추행한 경우, 이는 독신자 숙소에서 휴일 또는 근무시간 이후에 성인 남성들의 자유로운 의사에 기초한 합의된 행위로 군형법 제92조의6에서 처벌대상 으로 규정한 ‘항문성교나 그 밖의 추행’에 해당하지 아니한다. (22.2차)","answer":true,"quote":"군인인 피고인 甲은 자신의 독신자 숙소에서 군인 乙과 서로 키스, 구강성교나 항문성교를 하는 방법으로 6회에 걸쳐 추행하고, 군인인 피고인 丙은 자신의 독신자 숙소에서 동일한 방법으로 피고인 甲과 2회에 걸쳐 추행하였다고 하여 군형법 위반으로 기소된 사안에서, 피고인들과 乙은 모두 남성 군인으로 동성애 채팅 애플리케이션을 통해 만났고 같은 부대 소속이 아니었는데, 당시 피고인들의 독신자 숙소에서 휴일 또는 근무시간 이후에 자유로운 의사를 기초로 한 합의에 따라 항문성교나 그 밖의 성행위를 하였고, 그 과정에 폭행·협박, 위계·위력은 없었으며 의사에 반하는 행위인지 여부가 문제 된 사정도 전혀 없는 점, 피고인들의 행위가 군이라는 공동체 내의 공적, 업무적 영역 또는 이에 준하는 상황에서 이루어져 군이라는 공동체의 건전한 생활과 군기를 직접적이고 구체적으로 침해한 경우에 해당한다는 사정은 증명되지 않은 점에 비추어 피고인들의 행위는 군형법 제92조의6 에서 처벌대상으로 규정한 ‘항문성교나 그 밖의 추행’에 해당하지 않는다는 이유로, 이와 달리 보아 피고인들에게 유죄를 인정한 원심판단에 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2019도3047","badge":"","topic":"","from":"GY-2022-2-X-17","seq":null},{"id":"X-OX-395","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"동업재산은 동업자의 합유에 속하는 것이므로 동업관계가 존속 하는 한 동업자의 한 사람이 동업재산을 보관 중 임의로 횡령한 경우에는 지분비율에 따라 임의로 횡령한 금액 중 자신의 지분 비율을 초과한 부분에 대하여 횡령죄의 죄책을 부담한다. (24.2차)","answer":false,"quote":"동업자 사이에 손익분배의 정산이 되지 아니하였다면 동업자의 한 사람이 임의로 동업자들의 합유에 속하는 동업재산을 처분할 권한이 없는 것이므로, 동업자의 한 사람이 동업재산을 보관 중 임의로 횡령하였다면 지분비율에 관계없이 임의로 횡령한 금액 전부에 대하여 횡령죄의 죄책을 부담한다.","cite":"대법원 2000도3013","badge":"","topic":"","from":"GY-2024-2-X-20","seq":null},{"id":"X-OX-238","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"살인예비죄가 성립하기 위해서는 살인죄를 범할 목적 외에도 살인준비에 관한 고의가 있어야 한다. (22.2차)","answer":true,"quote":"형법 제255조 , 제250조 의 살인예비죄가 성립하기 위하여는 형법 제255조 에서 명문으로 요구하는 살인죄를 범할 목적 외에도 살인의 준비에 관한 고의가 있어야 하며, 나아가 실행의 착수까지에는 이르지 아니하는 살인죄의 실현을 위한 준비행위가 있어야 한다.","cite":"대법원 2009도7150","badge":"","topic":"","from":"GY-2022-2-X-03","seq":null},{"id":"X-OX-244","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 소속 노동조합 위원장 A를 ‘어용’, ‘앞잡이’ 등으로 지칭 하여 표현한 현수막, 피켓 등을 장기간 반복하여 일반인의 왕래가 잦은 도로변 등에 게시한 경우 (22.2차)","answer":true,"quote":"피고인들이 소속 노동조합 위원장 甲을 ‘어용’, ‘앞잡이’ 등으로 지칭하여 표현한 현수막, 피켓 등을 장기간 반복하여 일반인의 왕래가 잦은 도로변 등에 게시한 사안에서, ‘어용’이란 자신의 이익을 위하여 권력자나 권력 기관에 영합하여 줏대 없이 행동하는 것을 낮잡아 이르는 말, ‘앞잡이’란 남의 사주를 받고 끄나풀 노릇을 하는 사람을 뜻하는 말로서 언제나 위 표현들이 지칭된 상대방에 대한 모욕에 해당한다거나 사회상규에 비추어 허용되지 않는 것은 아니지만, 제반 사정에 비추어 피고인들의 위 행위는 甲에 대한 모욕적 표현으로서 사회상규에 위배되지 않는 행위로 보기 어렵다고 한 사례","cite":"대법원 2016도88","badge":"","topic":"","from":"GY-2022-2-X-15","seq":null},{"id":"X-OX-381","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 A로부터 18억 원을 차용하면서 담보로 甲 소유의 아파트에 A 명의의 4순위 근저당권을 설정해 주기로 약정하였음에도 B에게 채권최고액을 12억 원으로 하는 4순위 근저당권을 설정해 준 경우, 甲에게는 배임죄의 기수범이 성립한다. (24.1차)","answer":false,"quote":"피고인이 甲으로부터 18억 원을 차용하면서 담보로 피고인 소유의 아파트에 甲 명의의 4순위 근저당권을 설정해 주기로 약정하였음에도 제3자에게 채권최고액을 12억 원으로 하는 4순위 근저당권을 설정하여 줌으로써 12억 원 상당의 재산상 이익을 취득하고 甲에게 같은 금액 상당의 손해를 가하였다고 하여 특정경제범죄 가중처벌 등에 관한 법률 위반(배임)으로 기소된 사안에서, 위 근저당권설정계약에서 피고인과 甲 사이 당사자 관계의 전형적·본질적 내용은 채무의 변제와 이를 위한 담보에 있고, 피고인을 통상의 계약에서의 이익대립관계를 넘어서 甲과의 신임관계에 기초하여 甲의 사무를 맡아 처리하는 것으로 볼 수 없는 이상 甲에 대한 관계에서 ‘타인의 사무를 처리하는 자’에 해당한다고 할 수 없다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 배임죄에서 ‘타인의 사무를 처리하는 자’의 의미에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2019도14340","badge":"","topic":"","from":"GY-2024-1-X-19","seq":null},{"id":"X-OX-315","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강제추행죄는 상대방의 신체에 대해 불법한 유형력을 행사하거나 상대방으로 하여금 공포심을 일으킬 수 있는 정도의 해악을 고지하여 상대방을 추행한 경우에 성립한다. (26.1차)","answer":true,"quote":"(다) 요컨대, 강제추행죄는 상대방의 신체에 대해 불법한 유형력을 행사하거나 상대방으로 하여금 공포심을 일으킬 수 있는 정도의 해악을 고지하여 상대방을 추행한 경우에 성립한다.","cite":"대법원 2018도13877","badge":"","topic":"","from":"GY-2026-1-X-14","seq":null},{"id":"X-OX-247","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲과 丙은 각각 A주식회사와 B와의 관계에서 타인의 사무를 처리하는 자에 해당한다. (22.2차)","answer":true,"quote":"중도금 등을 받아 계약이 본격적으로 이행되는 단계에 이른 매도인은 매수인의 재산보전에 협력할 타인의 사무를 처리하는 자다.","cite":"대법원 2019도16228","badge":"","topic":"","from":"GY-2022-2-X-21","seq":null},{"id":"X-OX-412","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 乙을 폭행하여 재물을 강취하려하자 극도의 흥분과 공포심을 느낀 乙이 이를 피하려다 상해를 입은 경우, 甲이 상해의 결과를 예견할 수 있었더라도 甲의 폭행과 乙의 상해 사이에는 상당인과관계가 없으므로 甲을 강도치상죄로 처벌 할 수 없다. (25.2차)","answer":false,"quote":"폭행 또는 협박으로 타인의 재물을 강취하려는 행위와 이에 극도의 흥분을 느끼고 공포심에 사로잡혀 이를 피하려다 상해에 이르게 된 사실과는 상당인과관계가 있다 할 것이고 이 경우 강취 행위자가 상해의 결과의 발생을 예견할 수 있었다면 이를 강도치상죄로 다스릴 수 있다.","cite":"대법원 96도1142","badge":"","topic":"","from":"GY-2025-2-X-05","seq":null},{"id":"X-OX-348","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"지방자치단체의 장이 미리 승진후보자명부상 후보자들 중에서 승진대상자를 실질적으로 결정한 다음, 그 내용을 인사위원회 간사, 서기 등을 통해 인사위원회 위원들에게 ‘승진대상자 추천’이 라는 명목으로 제시하여 인사위원회로 하여금 자신이 특정한 후보자들을 승진대상자로 의결하도록 유도하는 행위는 직권 남용권리행사방해죄의 구성요건인‘직권의남용’ 및‘의무없는일을 하게한경우’로볼수있다. (22.2차)","answer":false,"quote":"지방자치단체의 장이 승진후보자명부 방식에 의한 5급 공무원 승진임용 절차에서 인사위원회의 사전심의·의결 결과를 참고하여 승진후보자명부상 후보자들에 대하여 승진임용 여부를 심사하고서 최종적으로 승진대상자를 결정하는 것이 아니라, 미리 승진후보자명부상 후보자들 중에서 승진대상자를 실질적으로 결정한 다음 그 내용을 인사위원회 간사, 서기 등을 통해 인사위원회 위원들에게 ‘승진대상자 추천’이라는 명목으로 제시하여 인사위원회로 하여금 자신이 특정한 후보자들을 승진대상자로 의결하도록 유도하는 행위는 인사위원회 사전심의 제도의 취지에 부합하지 않다는 점에서 바람직하지 않다고 볼 수 있지만, 그것만으로는 직권남용권리행사방해죄의 구성요건인 ‘직권의 남용’ 및 ‘의무 없는 일을 하게 한 경우’로 볼 수 없다.","cite":"대법원 2019도17879","badge":"","topic":"","from":"GY-2022-2-X-26","seq":null},{"id":"X-OX-266","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"자동차를 절취한 후 자동차등록번호판을 떼어내는 행위는 새로운 법익의 침해로 보아야 하므로 이와 같은 번호판을 떼어내는 행위가 절도범행의 불가벌적 사후행위가 되는 것은 아니다. (23.2차)","answer":true,"quote":"자동차를 절취한 후 자동차등록번호판을 떼어내는 행위가 절도범행의 불가벌적 사후행위에 해당하는지 여부 (소극)","cite":"대법원 2007도4739","badge":"","topic":"","from":"GY-2023-2-X-21","seq":null},{"id":"X-OX-261","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"명예훼손죄와 모욕죄에서 전파가능성을 이유로 공연성을 인정하는 경우에는 적어도 범죄구성요건의 주관적 요소로서 미필적 고의가 필요하므로, 전파가능성에 대한 인식이 있음은 물론 나아가 위험을 용인하는 내심의 의사가 있어야 한다. (23.2차)","answer":true,"quote":"명예훼손죄와 모욕죄에서 전파가능성을 이유로 공연성을 인정하는 경우에는 적어도 범죄구성요건의 주관적 요소로서 미필적 고의가 필요하므로, 전파가능성에 대한 인식이 있음은 물론 나아가 위험을 용인하는 내심의 의사가 있어야 한다.","cite":"대법원 2020도8336","badge":"","topic":"","from":"GY-2023-2-X-18","seq":null},{"id":"X-OX-361","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 지나가던 행인 3명과 싸우다가 힘이 달리자 식칼을 가지고 이들 3명을 상대로 휘두르다가 이를 말리면서 식칼을 뺏으려던 A에게 상해를 입혔다면 甲에게 A에 대한 상해의 범의를 인정 할 수 없어 과실치상죄가 성립할 수 있을 뿐이다. (23.2차)","answer":false,"quote":"갑이 을등 3명과 싸우다가 힘이 달리자 식칼을 가지고 이들 3명을 상대로 휘두르다가 이를 말리면서 식칼을 뺏으려던 피해자 병에게 상해를 입혔다면 갑에게 상해의 범의가 인정되며 상해를 입은 사람이 목적한 사람이 아닌 다른 사람이라 하여 과실상해죄에 해당한다고 할 수 없다.","cite":"대법원 87도1745","badge":"","topic":"","from":"GY-2023-2-X-03","seq":null},{"id":"X-OX-416","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 특정 권원에 기하여 민사소송을 진행하던 중 법원에 조작된 증거를 제출하면서 종전에 주장하던 특정 권원과 별개의 허위의 권원을 추가로 주장한 경우, 법원이 종전의 특정 권원을 인정하여 甲에게 승소판결을 선고하였다면 甲의 이러한 행위는 특별한 사정이 없는 한 소송사기의 실행의 착수에 해당하지 않는다. (25.2차)","answer":false,"quote":"피고인이 특정 권원에 기하여 민사소송을 진행하던 중 법원에 조작된 증거를 제출하면서 종전에 주장하던 특정 권원과 별개의 허위의 권원을 추가로 주장하는 경우에 그 당시로서는 종전의 특정권원의 인정 여부가 확정되지 아니하였고, 만약 종전의 특정 권원이 배척될 때에는 조작된 증거에 의하여 법원을 기망하여 추가된 허위의 권원을 인정받아 승소판결을 받을 가능성이 있으므로, 가사 나중에 법원이 종전의 특정 권원을 인정하여 피고인에게 승소판결을 선고하였다고 하더라도, 피고인의 이러한 행위는 특별한 사정이 없는 한 소송사기의 실행의 착수에 해당된다.","cite":"대법원 2003도7124","badge":"","topic":"","from":"GY-2025-2-X-20","seq":null},{"id":"X-OX-371","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"절도 범인으로부터 장물보관 의뢰를 받은 자가 그 정을 알면서 이를 인도받아 보관하고 있다가 그 보관 장물을 임의로 처분 하였다면 장물보관죄 외에 별도로 횡령죄가 성립한다. (23.2차)","answer":false,"quote":"절도범인으로부터 장물보관의뢰를 받은 자가 그 정을 알면서 이를 인도받아 보관하고 있다가 임의처분하였다 하여도 장물보관죄가 성립되는 때에는 이미 그 소유자의 소유물추구권을 침해하였으므로 그 후의 횡령행위는 불가벌적 사후행위에 불과하여 별도로 횡령죄가 성립하지 않는다.","cite":"대법원 76도3067","badge":"","topic":"","from":"GY-2023-2-X-21","seq":null},{"id":"X-OX-253","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"단순폭행, 존속폭행의 범행이 동일한 폭행 습벽의 발현에 의한 것으로 인정되어 상습존속폭행죄로 처벌되는 경우 피해자의 명시한 의사에 반하여도 공소를 제기할 수 있다. (23.1차)","answer":true,"quote":"폭행죄의 ‘상습성’의 의미 및 상습성 유무를 판단하는 방법 / 단순폭행, 존속폭행의 범행이 동일한 폭행 습벽의 발현에 의한 것으로 인정되는 경우, 그 죄수(=상습존속폭행죄의 포괄일죄) / 상습존속폭행죄로 처벌되는 경우, 피해자의 명시한 의사에 반하여 공소를 제기할 수 있는지 여부 (적극)","cite":"대법원 2017도10956","badge":"","topic":"","from":"GY-2023-1-X-14","seq":null},{"id":"X-OX-493","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"사문서위조 및 동행사죄의 객체인 ‘사실증명에 관한 타인의 문서’는 권리‧의무에 관한 문서 이외의 문서로서 거래상 중요한 사실을 증명하는 문서를 의미하고, 여기에는 법률관계에 간접적 으로만 연관된 의사표시 또는 권리‧의무의 변동에 사실상으로만 영향을 줄 수 있는 의사표시를 내용으로 하는 문서는 포함되지 않는다. (25.1차)","answer":false,"quote":"사문서위조 및 동행사죄의 객체인 사문서는 권리·의무 또는 사실증명에 관한 타인의 문서 또는 도화를 가리키고, ‘권리·의무에 관한 문서’는 권리 또는 의무의 발생·변경·소멸에 관한 사항이 기재된 것을 말하며, ‘사실증명에 관한 문서’는 권리·의무에 관한 문서 이외의 문서로서 거래상 중요한 사실을 증명하는 문서를 의미한다.","cite":"대법원 2023도1178","badge":"","topic":"","from":"GY-2025-1-X-23","seq":null},{"id":"X-OX-475","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"영리의 목적으로 속칭 포커나 고스톱 등의 인터넷 도박게임 사이트를 개설하여 운영하는 경우, 게임이용자들이 그 도박게임 사이트에 접속하여 실제로 도박이 행하여진 때에 도박개장죄는 기수에 이른다. (22.2차)","answer":false,"quote":"따라서 영리의 목적으로 속칭 포커나 바둑이, 고스톱 등의 인터넷 도박게임 사이트를 개설하여 운영하는 경우, 현실적으로 게임이용자들로부터 돈을 받고 게임머니를 제공하고 게임이용자들이 위 도박게임 사이트에 접속하여 도박을 하여, 위 게임으로 획득한 게임머니를 현금으로 환전해 주는 방법 등으로 게임이용자들과 게임회사 사이에 있어서 재물이 오고갈 수 있는 상태에 있으면, 게임이용자가 위 도박게임 사이트에 접속하여 실제 게임을 하였는지 여부와 관계없이 도박개장죄는 ‘기수’에 이른다.","cite":"대법원 2008도5282","badge":"","topic":"","from":"GY-2022-2-X-25","seq":null},{"id":"X-OX-431","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"인터넷을 통하여 열람 출력한 등기사항전부증명서 하단의 열람 일시 부분을 수정 테이프로 지우고 복사한 행위는 공문서 변조에 해당한다. (22.1차)","answer":true,"quote":"피고인이 인터넷을 통하여 열람ㆍ출력한 등기사항전부증명서 하단의 열람 일시 부분을 수정 테이프로 지우고 복사해 두었다가 이를 타인에게 교부하여 공문서변조 및 변조공문서행사로 기소된 사안에서, 등기사항전부증명서의 열람 일시는 등기부상 권리관계의 기준 일시를 나타내는 역할을 하는 것으로서 권리관계나 사실관계의 증명에서 중요한 부분에 해당하고, 열람 일시의 기재가 있어 그 일시를 기준으로 한 부동산의 권리관계를 증명하는 등기사항전부증명서와 열람 일시의 기재가 없어 부동산의 권리관계를 증명하는 기준 시점이 표시되지 않은 등기사항전부증명서 사이에는 증명하는 사실이나 증명력에 분명한 차이가 있는 점, 법률가나 관련 분야의 전문가가 아닌 평균인 수준의 사리분별력을 갖는 일반인의 관점에서 볼 때 그 등기사항전부증명서가 조금만 주의를 기울여 살펴보기만 해도 그 열람 일시가 삭제된 것임을 쉽게 알아볼 수 있을 정도로 공문서로서의 형식과 외관을 갖추지 못했다고 보기 어려운 점을 종합하면, 피고인이 등기사항전부증명서의 열람 일시를 삭제하여 복사한 행위는 등기사항전부증명서가 나타내는 권리ㆍ사실관계와 다른 새로운 증명력을 가진 문서를 만든 것에 해당하고 그로 인하여 공공적 신용을 해할 위험성도 발생하였다는 이유로, 이와 달리 본 원심판결에 공문서변조에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2018도19043","badge":"","topic":"","from":"GY-2022-1-X-23","seq":null},{"id":"X-OX-438","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"통화위조죄에서의 ‘행사할 목적’이란 위조한 통화를 진정한 통화로서 유통에 놓겠다는 목적을 말하므로, 자신의 신용력을 증명하기 위하여 타인에게 보일 목적으로 통화를 위조한 경우에는 행사할 목적이 있다고 할 수 없다. (23.1차)","answer":true,"quote":"형법 제207조 에서 정한 ‘행사할 목적’이란 유가증권위조의 경우와 달리 위조·변조한 통화를 진정한 통화로서 유통에 놓겠다는 목적을 말하므로, 자신의 신용력을 증명하기 위하여 타인에게 보일 목적으로 통화를 위조한 경우에는 행사할 목적이 있다고 할 수 없다.","cite":"대법원 2011도7704","badge":"","topic":"","from":"GY-2023-1-X-24","seq":null},{"id":"X-OX-429","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"입찰방해죄는 위계 또는 위력 기타의 방법으로 입찰의 공정을 해하는 경우에 성립하는 위태범으로서 결과의 불공정이 현실적 으로 나타나는 것을 필요로 하지 않는다. (22.1차)","answer":true,"quote":"입찰방해죄는 입찰의 공정을 해칠 위험만 생기면 성립하는 위태범이라, 결과의 불공정이 실제로 나타날 필요가 없다.","cite":"형법 제315조","badge":"","topic":"","from":"GY-2022-1-X-15","seq":null},{"id":"X-OX-442","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 타인을 비방할 목적으로 허위의 기사 재료를 그 정을 모르는 기자에게 제공하여 신문 등에 보도되게 한 경우 甲에게 출판물에 의한 명예훼손죄의 간접정범이 성립할 수 있다. (23.2차)","answer":true,"quote":"출판물에 의한 명예훼손죄는 간접정범에 의하여 범하여질 수도 있으므로 타인을 비방할 목적으로 허위의 기사 재료를 그 정을 모르는 기자에게 제공하여 신문 등에 보도되게 한 경우에도 성립할 수 있으나 제보자가 기사의 취재·작성과 직접적인 연관이 없는 자에게 허위의 사실을 알렸을 뿐인 경우에는, 제보자가 피제보자에게 그 알리는 사실이 기사화 되도록 특별히 부탁하였다거나 피제보자가 이를 기사화 할 것이 고도로 예상되는 등의 특별한 사정이 없는 한, 피제보자가 언론에 공개하거나 기자들에게 취재됨으로써 그 사실이 신문에 게재되어 일반 공중에게 배포되더라도 제보자에게 출판·배포된 기사에 관하여 출판물에 의한 명예훼손죄의 책임을 물을 수는 없다.","cite":"대법원 2000도3045","badge":"","topic":"","from":"GY-2023-2-X-10","seq":null},{"id":"X-OX-439","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"위조사문서의 행사는 상대방으로 하여금 위조된 문서를 인식 할 수 있는 상태에 둠으로써 기수가 되고 상대방이 실제로 그 내용을 인식하여야 하는 것은 아니므로, 위조된 문서를 우송한 경우에는 그 문서가 상대방에게 도달한 때에 기수가 되고 상대방이 실제로 그 문서를 보아야 하는 것은 아니다. (23.1차)","answer":true,"quote":"위조사문서의 행사는 상대방으로 하여금 위조된 문서를 인식할 수 있는 상태에 둠으로써 기수가 되고 상대방이 실제로 그 내용을 인식하여야 하는 것은 아니므로, 위조된 문서를 우송한 경우에는 그 문서가 상대방에게 도달한 때에 기수가 되고 상대방이 실제로 그 문서를 보아야 하는 것은 아니다.","cite":"대법원 2004도4663","badge":"","topic":"","from":"GY-2023-1-X-25","seq":null},{"id":"X-OX-447","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"노상에서 전봇대 주변에 놓인 쓰레기에 불을 놓아 태움으로써 공공의 위험을 발생케 한 경우 자기소유 일반물건방화죄가 성립 한다. (24.1차)","answer":true,"quote":"노상에서 전봇대 주변에 놓인 재활용품과 쓰레기 등에 불을 놓아 소훼한 사안에서, 그 재활용품과 쓰레기 등은 ‘무주물’로서 형법 제167조 제2항 에 정한 ‘자기 소유의 물건’에 준하는 것으로 보아야 하므로, 여기에 불을 붙인 후 불상의 가연물을 집어넣어 그 화염을 키움으로써 전선을 비롯한 주변의 가연물에 손상을 입히거나 바람에 의하여 다른 곳으로 불이 옮아붙을 수 있는 공공의 위험을 발생하게 하였다면, 일반물건방화죄가 성립한다고 한 사례.","cite":"대법원 2009도7421","badge":"","topic":"","from":"GY-2024-1-X-23","seq":null},{"id":"X-OX-464","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"식당의 주‧부식 구입 업무를 담당하는 공무원 甲이 주‧부식 구입요구서의 과장결재란에 권한 없이 자신의 서명을 한 경우, 자격모용공문서작성죄가 성립함은 별론으로 하고 공문서위조죄가 성립할 수는 없다. (26.1차)","answer":true,"quote":"식당의 주·부식 구입 업무를 담당하는 공무원이 주·부식구입요구서의 과장결재란에 권한 없이 자신의 서명을 한 경우, 자격모용공문서작성죄가 성립하고 공문서위조죄는 문제되지 않는다고 한 사례","cite":"대법원 2007도6987","badge":"","topic":"","from":"GY-2026-1-X-23","seq":null},{"id":"X-OX-455","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"업무의 개시나 수행과정에 실체상 또는 절차상 하자가 있더라도 사회생활상 도저히 용인할 수 없는 정도로 반사회성을 띠는 데까지 이르거나 법적 보호라는 측면에서 그와 동등한 평가를 받을 수밖에 없는 경우에 이르지 아니한 이상 업무방해죄의 보호대상이 되는 업무에 해당한다. (25.1차)","answer":true,"quote":"업무방해죄의 보호대상이 되는 ‘업무’의 의미 및 법률상 보호할 가치가 있는 업무인지 판단하는 기준 / 업무의 개시나 수행과정에 실체상 또는 절차상의 하자가 있더라도 정도가 반사회성을 띠거나 그와 동등한 평가를 받는 경우에 이르지 아니한 이상 업무방해죄의 보호대상이 되는지 여부 (적극)","cite":"대법원 2013도9828","badge":"","topic":"","from":"GY-2025-1-X-17","seq":null},{"id":"X-OX-495","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공무원 아닌 자가 관공서에 허위 내용의 증명원을 제출하여 그 내용이 허위인 정을 모르는 담당공무원으로부터 그 증명원 내용과 같은 증명서를 발급받은 경우, 공문서위조죄의 간접정범이 성립한다. (25.2차)","answer":false,"quote":"어느 문서의 작성권한을 갖는 공무원이 그 문서의 기재 사항을 인식하고 그 문서를 작성할 의사로써 이에 서명날인하였다면, 설령 그 서명날인이 타인의 기망으로 착오에 빠진 결과 그 문서의 기재사항이 진실에 반함을 알지 못한 데 기인한다고 하여도, 그 문서의 성립은 진정하며 여기에 하등 작성명의를 모용한 사실이 있다고 할 수는 없으므로, 공무원 아닌 자가 관공서에 허위 내용의 증명원을 제출하여 그 내용이 허위인 정을 모르는 담당공무원으로부터 그 증명원 내용과 같은 증명서를 발급받은 경우 공문서위조죄의 간접정범으로 의율할 수는 없다.","cite":"대법원 2000도938","badge":"","topic":"","from":"GY-2025-2-X-11","seq":null},{"id":"X-OX-452","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"우리나라 사람이 외국에서 도박을 한 경우, ｢형법｣ 제3조는 형법의 적용 범위에 관한 속인주의를 규정하고 있으므로 도박죄를 처벌하지 않는 외국 카지노에서의 도박이라는 사정만으로 그 위법성이 조각된다고 할 수 없다. (25.1차)","answer":true,"quote":"형법 제3조 는 \"본법은 대한민국 영역 외에서 죄를 범한 내국인에게 적용한다.\"고 하여 형법의 적용 범위에 관한 속인주의를 규정하고 있고, 또한 국가 정책적 견지에서 도박죄의 보호법익보다 좀더 높은 국가이익을 위하여 예외적으로 내국인의 출입을 허용하는 폐광지역개발지원에관한특별법 등에 따라 카지노에 출입하는 것은 법령에 의한 행위로 위법성이 조각된다고 할 것이나, 도박죄를 처벌하지 않는 외국 카지노에서의 도박이라는 사정만으로 그 위법성이 조각된다고 할 수 없다.","cite":"대법원 2002도2518","badge":"","topic":"","from":"GY-2025-1-X-02","seq":null},{"id":"X-OX-448","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"재물을 강취한 후 피해자를 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 강도살인죄와 현주건조물방화 치사죄는 상상적 경합관계에 있다. (24.2차)","answer":true,"quote":"피고인들이 피해자들의 재물을 강취한 후 그들을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 피고인들의 행위는 강도살인죄와 현주건조물방화치사죄에 모두 해당하고 그 두 죄는 상상적 경합범관계에 있다.","cite":"대법원 98도3416","badge":"","topic":"","from":"GY-2024-2-X-07","seq":null},{"id":"X-OX-469","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 일부 입찰참가자들과 가격을 합의하고, 낙찰이 되면 특정 업체가 모든 공사를 하기로 합의하는 등 담합하여 투찰행위를 한 경우, 그 투찰에 참여한 업체의 수가 많아서 실제로 가격형성에 부당한 영향을 주지 않았다면 甲에게는 입찰방해죄가 성립하지 아니한다. (22.2차)","answer":false,"quote":"일부 입찰참가자들이 가격을 합의하고, 낙찰이 되면 특정 업체가 모든 공사를 하기로 합의하는 등 담합하여 투찰행위를 한 사안에서, 이는 ‘적법하고 공정한 경쟁방법’을 해하는 행위로서 입찰의 공정을 해하는 경우에 해당하며, 결과적으로 위 투찰에 참여한 업체의 수가 많아서 실제로 가격형성에 부당한 영향을 주지 않았다고 하더라도 입찰방해죄가 성립한다고 한 사례.","cite":"대법원 2008도11361","badge":"","topic":"","from":"GY-2022-2-X-16","seq":null},{"id":"X-OX-459","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 자기에게 맡겨진 사무를 처리한 내역을 그때그때 계속적, 기계적으로 기재한 문서는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 전문증거라 하더라도 당연히 증거능력이 인정된다. (25.2차)","answer":true,"quote":"상업장부나 항해일지, 진료일지 또는 이와 유사한 금전출납부 등과 같이 범죄사실의 인정 여부와는 관계없이 자기에게 맡겨진 사무를 처리한 내역을 그때그때 계속적, 기계적으로 기재한 문서는 사무처리 내역을 증명하기 위하여 존재하는 문서로서 형사소송법 제315조 제2호 에 의하여 당연히 증거능력이 인정된다.","cite":"대법원 2015도2625","badge":"","topic":"","from":"GY-2025-2-X-38","seq":null},{"id":"X-OX-499","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"A가 甲 몰래 녹음한 통화 녹음 파일은 甲의 동의 없이 녹음 하였으므로 증거로 사용될 수 없다. (25.2차)","answer":false,"quote":"통신비밀보호법이 막는 것은 제3자의 녹음이고, 대화 당사자인 A가 상대 몰래 녹음한 것은 위법하지 않아 증거로 쓸 수 있다.","cite":"대법원 2006도4981 · 통신비밀보호법 제3조","badge":"","topic":"","from":"GY-2025-2-X-39","seq":null},{"id":"X-OX-443","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"사기죄의 보호법익은 재산권이므로 도급계약이나 물품구매 조달 계약 체결 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정이 있더라도 그러한 사정만으로 도급계약을 체결한 행위가 기망 행위에 해당한다고 단정해서는 안 된다. (23.2차)","answer":true,"quote":"따라서 도급계약이나 물품구매 조달계약 체결 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정이 있더라도 그러한 사정만으로 도급계약을 체결한 행위가 기망행위에 해당한다고 단정해서는 안 되고, 그 위반으로 말미암아 계약 내용대로 이행되더라도 일의 완성이 불가능하였다고 평가할 수 있을 만큼 그 위법이 일의 내용에 본질적인 것인지 여부를 심리·판단하여야 한다.","cite":"대법원 2017도14104","badge":"","topic":"","from":"GY-2023-2-X-21","seq":null},{"id":"X-OX-497","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"교통사고 가해자가 사고발생 후 즉시 피해자 구호조치를 하지 않고, 사고현장으로부터 약 600미터 정도 도주한 후 다시 사고현장으로 돌아와 경찰관에게 자신이 사고야기자임을 밝힌바, 이를 들은 경찰관이 교통사고 후의 행동이 기재된 가해자 및 피해자의 관련자 진술서만을 첨부하고 교통사고 실황조사서의 사고원인기재란 중 사고도주 표시란에는 아무런 표시를 하지 않은 경우에는 허위공문서작성에 해당한다. (25.2차)","answer":false,"quote":"교통사고 가해자가 사고발생 후 즉시 피해자를 구호조치하지 않고 사고현장으로부터 약 600m 정도 도주한 후 다시 사고현장으로 되돌아 와 경찰관에게 자신이 사고야기자라고 말한 사안에서, 교통사고 가해자의 사고 후의 행동이 기재된 가해자 및 피해자의 관련자 진술서만 첨부하고 교통사고 실황조사서의 사고원인기재란 중 사고도주 표시란에는 아무런 표시를 하지 않은 것이 허위공문서작성에 해당하지 않는다고 본 사례.","cite":"대법원 96도2329","badge":"","topic":"","from":"GY-2025-2-X-24","seq":null},{"id":"X-OX-453","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"도박공간을 개설한 자가 도박에 직접 참가하여 얻은 수익을 도박공간개설로 얻은 범죄수익으로 몰수하거나 추징할 수는 없다. (25.1차)","answer":true,"quote":"피고인이 영리의 목적으로 도박공간을 개설하였다는 공소사실이 제1심 및 원심에서 유죄로 인정되었는데, 그로 인한 범죄수익의 추징과 관련하여 피고인이 직접 도박에 참가하여 얻은 수익 부분에 대한 추징 여부가 문제 된 사안에서, 형법 제247조 의 도박개장죄는 영리의 목적으로 스스로 주재자가 되어 그 지배 아래 도박장소를 개설함으로써 성립하는 범죄로서 도박죄와 별개의 독립된 범죄이고, 도박공간을 개설한 자가 도박에 참가하여 얻은 수익은 도박공간개설을 통하여 간접적으로 얻은 이익에 당연히 포함된다고 보기도 어려워 도박공간을 개설한 자가 도박에 참가하여 얻은 수익을 도박공간개설로 얻은 범죄수익으로 몰수하거나 추징할 수 없다는 이유로, 전체 범죄수익 중 피고인이 직접 도박에 참가하여 얻은 수익을 도박공간개설의 범죄로 인한 추징 대상에서 제외하고 그 차액만을 추징한 원심의 판단이 정당하다고 한 사례.","cite":"대법원 2022도8592","badge":"","topic":"","from":"GY-2025-1-X-13","seq":null},{"id":"X-OX-437","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공용건조물방화죄를 범할 목적으로 예비･음모한 후 목적한 죄의 실행에 이른 후에 수사기관에 자수한 경우 형을 감경하거나 면제할 수 있다. (23.1차)","answer":true,"quote":"제164조제1항, 제165조, 제166조제1항, 제172조제1항, 제172조의2제1항, 제173조제1항과 제2항의 죄를 범할 목적으로 예비 또는 음모한 자는 5년 이하의 징역에 처한다. 단 그 목적한 죄의 실행에 이르기 전에 자수한 때에는 형을 감경 또는 면제한다.","cite":"형법 제175조","badge":"","topic":"","from":"GY-2023-1-X-23","seq":null},{"id":"X-OX-463","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"반전과 평화메시지와 같은 공적 관심사에 대한 표현행위가 업무방해죄에서 말하는 위력의 행사에 해당하는지는 헌법상 표현의 자유의 중요성과 보호범위 및 한계, 형벌의 보충성과 최후수단성의 원칙도 함께 음미하여 판단하여야 한다. (26.1차)","answer":true,"quote":"따라서 이러한 표현행위가 형법 제314조 제1항 의 업무방해죄에서 말하는 위력의 행사에 해당하는지는 표현의 자유의 중요성과 보호범위 및 한계, 형벌의 보충성과 최후수단성의 원칙도 함께 음미하여 판단하여야 한다.","cite":"대법원 2024도16921","badge":"","topic":"","from":"GY-2026-1-X-16","seq":null},{"id":"X-OX-445","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"명의인을 기망하여 문서를 작성케 하는 경우에는, 서명·날인이 정당히 성립된 경우라도 기망자는 명의인을 이용하여 서명 날인자의 의사에 반하는 문서를 작성케 하는 것이므로 사문서 위조죄가 성립한다. (23.2차)","answer":true,"quote":"명의인을 기망하여 문서를 작성케 하는 경우는 서명, 날인이 정당히 성립된 경우에도 기망자는 명의인을 이용하여 서명 날인자의 의사에 반하는 문서를 작성케 하는 것이므로 사문서위조죄가 성립한다.","cite":"대법원 2000도778","badge":"","topic":"","from":"GY-2023-2-X-23","seq":null},{"id":"X-OX-441","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공용서류등무효죄의 ‘공무소에서 사용하는 서류 기타 전자기록’ 에는 공문서로서의 효력이 생기기 이전의 서류, 정식의 접수 및 결재 절차를 거치지 않은 문서, 결재 상신 과정에서 반려된 문서도 포함된다. (23.1차)","answer":true,"quote":"‘공무소에서 사용하는 서류 기타 전자기록’에는 공문서로서의 효력이 생기기 이전의 서류라거나, 정식의 접수 및 결재 절차를 거치지 않은 문서, 결재 상신 과정에서 반려된 문서 등을 포함하는 것으로, 미완성의 문서라고 하더라도 본죄의 성립에는 영향이 없다.","cite":"대법원 2015도19296","badge":"","topic":"","from":"GY-2023-1-X-26","seq":null},{"id":"X-OX-503","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"문서 작성의 권한을 위임받은 자가 그 위임받은 권한의 범위 내에서 이를 남용하여 문서를 작성한 경우, 사문서위조죄가 성립한다. (26.1차)","answer":false,"quote":"위임받은 권한을 넘어 작성하면 위조지만, 권한의 범위 안에서 남용해 작성한 것은 사문서위조가 아니다.","cite":"대법원 2005도6088 · 형법 제231조","badge":"","topic":"","from":"GY-2026-1-X-23","seq":null},{"id":"X-OX-465","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 환전상으로부터 구매한 게임머니를 사용하여 인터넷 사이트에서 스포츠 경기의 승패, 점수 차를 예측하여 맞추는 게임을 하여 예측이 적중되면 미리 정해진 배당률에 따른 게임머니를 지급받고 지급받은 게임머니를 환전상을 통해 현금으로 환전한 경우, 위 게임은 ｢형법｣ 제246조의 도박에 해당한다. (26.1차)","answer":true,"quote":"피고인이 환전상으로부터 구매한 게임머니를 사용하여 인터넷 도박사이트에서 스포츠 경기의 승패, 점수 차를 예측하여 맞추는 게임을 하여 예측이 적중되면 미리 정해진 배당률에 따른 게임머니를 지급받고 지급받은 게임머니를 환전상을 통해 현금으로 환전하는 방법으로 여러 차례 도박을 하여 기소된 사안에서, 위 게임에 사용되는 게임머니는 그 환전성에 비추어 볼 때 재물에 해당하고, 게임참가자와 운영자가 스포츠 결과를 확실히 예견할 수 있거나 자유로이 지배할 수 없으므로 위 게임을 통한 게임머니의 획득과 몰수는 우연한 사정에 달려있어 위 게임은 도박에 해당함에도, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례","cite":"대법원 2025도6368","badge":"","topic":"","from":"GY-2026-1-X-24","seq":null},{"id":"X-OX-492","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"위력에 의한 행위의 결과 실질적으로 상대방의 업무에 지장이 초래되었다면 그것이 행위자가 가지는 정당한 권한을 행사한 것으로 볼 수 있는 경우라도 업무방해죄가 성립한다. (25.1차)","answer":false,"quote":"그러나 어떤 행위의 결과 상대방의 업무에 지장이 초래되었다 하더라도 행위자가 가지는 정당한 권한을 행사한 것으로 볼 수 있는 경우에는, 행위의 내용이나 수단 등이 사회통념상 허용될 수 없는 등 특별한 사정이 없는 한 업무방해죄를 구성하는 위력을 행사한 것이라고 할 수 없다.","cite":"대법원 2011도16718","badge":"","topic":"","from":"GY-2025-1-X-17","seq":null},{"id":"X-OX-457","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"어느 문서에 대한 종래의 사용상태가 문서 소유자의 의사에 반하여 또는 문서 소유자의 의사와 무관하게 이루어진 경우에 단순히 종래의 사용상태를 제거하거나 변경시키는 것에 불과하고, 손괴, 은닉하는 등으로 새로이 문서 소유자의 문서 사용에 지장을 초래하지 않는 경우에는 문서손괴죄가 성립하지 않는다. (25.2차)","answer":true,"quote":"그러나 문서손괴죄는 문서의 소유자가 문서를 소유하면서 사용하는 것을 보호하려는 것이므로, 어느 문서에 대한 종래의 사용상태가 문서 소유자의 의사에 반하여 또는 문서 소유자의 의사와 무관하게 이루어진 경우에 단순히 종래의 사용상태를 제거하거나 변경시키는 것에 불과하고 손괴, 은닉하는 등으로 새로이 문서 소유자의 문서 사용에 지장을 초래하지 않는 경우에는 문서의 효용, 즉 문서 소유자의 문서에 대한 사용가치를 일시적으로도 해하였다고 할 수 없어서 문서손괴죄가 성립하지 아니한다.","cite":"대법원 2014도13083","badge":"","topic":"","from":"GY-2025-2-X-22","seq":null},{"id":"X-OX-462","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"어떤 행위의 결과 상대방의 업무에 지장이 초래되었더라도 행위자가 상대방의 의사결정에 관여할 수 있는 권한을 가지고 있거나 업무상의 지시를 할 수 있는 지위에 있는 경우에는 그 행위의 내용이나 수단이 사회통념상 허용될 수 없는 등 특별한 사정이 없는 한 업무방해죄를 구성하는 위력을 행사한 것이라고 할 수 없다. (26.1차)","answer":true,"quote":"한편 어떤 행위의 결과 상대방의 업무에 지장이 초래되었더라도 행위자가 상대방의 의사결정에 관여할 수 있는 권한을 가지고 있거나 업무상의 지시를 할 수 있는 지위에 있는 경우에는 그 행위의 내용이나 수단이 사회통념상 허용될 수 없는 등 특별한 사정이 없는 한 위력을 행사한 것이라고 할 수 없다.","cite":"대법원 2019도7446","badge":"","topic":"","from":"GY-2026-1-X-16","seq":null},{"id":"X-OX-433","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공무원의 문서작성을 보조하는 직무에 종사하는 공무원이 허위 공문서를 기안하여 결재를 거치지 않고 임의로 작성권자의 직인 등을 부정 사용함으로써 공문서를 완성한 경우 공문서위조죄가 성립한다. (22.1차)","answer":true,"quote":"공무원의 문서작성을 보조하는 직무에 종사하는 공무원이 허위공문서를 기안하여 임의로 작성권자의 직인 등을 부정 사용함으로써 공문서를 완성한 경우, 공문서위조죄가 성립하는지 여부 (적극) 및 공문서의 작성권한 없는 사람이 허위공문서를 기안하여 공문서를 완성한 경우에도 마찬가지인지 여부 (적극) / 공문서의 작성권한 없는 공무원 등이 작성권자의 결재를 받지 않고 직인 등을 보관하는 담당자를 기망하여 작성권자의 직인을 날인하도록 하여 공문서를 완성한 경우, 공문서위조죄가 성립하는지 여부 (적극)","cite":"대법원 2016도13912","badge":"","topic":"","from":"GY-2022-1-X-25","seq":null},{"id":"X-OX-480","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공문서의 작성권한이 있는 A의 직무를 보좌하는 공무원 甲이 비공무원 乙과 공모하여 행사할 목적으로 허위의 내용이 기재된 문서 초안을 그 정을 모르는 A에게 제출하여 결재 하도록 하는 방법으로 허위의 공문서를 작성하게 한 경우, 甲은 허위공문서작성죄의 간접정범이 될 수 있지만 공무원의 신분이 없는 乙은 간접정범의 공범이 될 수 없다. (23.1차)","answer":false,"quote":"공문서의 작성권한이 있는 공무원의 직무를 보좌하는 자가 그 직위를 이용하여 행사할 목적으로 허위의 내용이 기재된 문서 초안을 그 정을 모르는 상사에게 제출하여 결재하도록 하는 등의 방법으로 작성권한이 있는 공무원으로 하여금 허위의 공문서를 작성하게 한 경우에는 간접정범이 성립되고 이와 공모한 자 역시 그 간접정범의 공범으로서의 죄책을 면할 수 없는 것이고, 여기서 말하는 공범은 반드시 공무원의 신분이 있는 자로 한정되는 것은 아니라고 할 것이다.","cite":"대법원 91도2837","badge":"","topic":"","from":"GY-2023-1-X-25","seq":null},{"id":"X-OX-470","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 서울특별시 도시철도공사가 발주한 시각장애인용 음성유도기 제작설치 입찰에 관한 담합에 가담하기로 하였다가 자신이 낙찰 받기 위하여 당초의 합의에 따르지 아니한 채 원래 낙찰받기로 한 특정업체보다 저가로 입찰한 경우, 비록 입찰의 공정을 해할 우려가 있었으나 실제 입찰의 공정을 해하지 아니하였기에 甲에게는 입찰방해죄가 성립하지 아니한다. (22.2차)","answer":false,"quote":"피고인이 서울특별시도시철도공사가 발주한 시각장애인용 음성유도기 제작설치 입찰에 관한 담합에 가담하기로 하였다가 자신이 낙찰받기 위하여 당초의 합의에 따르지 아니한 채 원래 낙찰받기로 한 특정업체보다 저가로 입찰한 사안에서, 이러한 피고인의 행위는 입찰방해죄에 해당하므로, 같은 취지에서 위계로써 입찰의 공정을 해하였다는 공소사실을 유죄로 인정한 원심판단을 수긍한 사례.","cite":"대법원 2010도4940","badge":"","topic":"","from":"GY-2022-2-X-16","seq":null},{"id":"X-OX-432","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"문서가 위조된 것임을 이미 알고 있는 공범자 등에게 행사하는 경우에는 위조문서행사죄가 성립할 수 없으나, 간접정범을 통한 위조문서행사범행에 있어 도구로 이용된 자라고 하더라도 문서가 위조된 것임을 알지 못하는 자에게 행사한 경우에는 위조문서행사죄가 성립한다. (22.1차)","answer":true,"quote":"위조문서를 공범자 등에게 행사한 경우 위조문서행사죄가 성립하는지 여부 (소극) 및 간접정범을 통한 위조문서행사 범행에서 도구로 이용된 자에게 행사한 경우 위조문서행사죄가 성립하는지 여부 (적극)","cite":"대법원 2011도14441","badge":"","topic":"","from":"GY-2022-1-X-23","seq":null},{"id":"X-OX-494","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 방화의 의사로 뿌린 휘발유가 인화성이 강한 상태로 사람이 현존하는 주택 주변과 A의 몸에 적지 않게 살포되어 있는 사정을 알면서도 라이터를 켜 불꽃을 일으킴으로써 A의 몸에 불이 붙은 경우, 외부적 사정에 의하여 불이 방화 목적물인 주택 자체에 옮겨 붙지는 아니하였다면 현존건조물방화죄의 실행의 착수를 인정할 수 없다. (25.1차)","answer":false,"quote":"피고인이 방화의 의사로 뿌린 휘발유가 인화성이 강한 상태로 주택주변과 피해자의 몸에 적지 않게 살포되어 있는 사정을 알면서도 라이터를 켜 불꽃을 일으킴으로써 피해자의 몸에 불이 붙은 경우, 비록 외부적 사정에 의하여 불이 방화 목적물인 주택 자체에 옮겨 붙지는 아니하였다 하더라도 현존건조물방화죄의 실행의 착수가 있었다고 봄이 상당하다고 한 사례.","cite":"대법원 2001도6641","badge":"","topic":"","from":"GY-2025-1-X-24","seq":null},{"id":"X-OX-487","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"의료인이나 의료법인이 아닌 자가 의료기관을 개설하여 운영하는 행위뿐만 아니라 무자격자에 의해 개설된 의료기관에 고용된 의료인이 환자를 진료하는 행위 또한 당연히 반사회성을 띠는 행위이므로 업무방해죄의 보호대상이 되는 업무에 해당하지 않는다. (24.2차)","answer":false,"quote":"의료인이나 의료법인이 아닌 자가 의료기관을 개설하여 운영하는 행위가 업무방해죄의 보호대상이 되는 업무에 해당하는지 여부 (소극) / 무자격자에 의해 개설된 의료기관에 고용된 의료인의 진료 업무가 업무방해죄의 보호대상이 되는 업무인지 판단하는 기준","cite":"대법원 2021도16482","badge":"","topic":"","from":"GY-2024-2-X-18","seq":null},{"id":"X-OX-440","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"주식회사의 발기인 등이 법령에 정한 회사설립의 요건과 절차에 따라 회사설립등기를 함으로써 회사가 성립하였다고 볼 수 있는 경우, 회사를 설립할 당시 회사를 실제로 운영할 의사 없이 회사를 이용한 범죄 의도나 목적이 있었다는 이유만으로는 공정증서원본 불실기재죄에서 말하는 불실의 사실을 법인등기부에 기록하게 한 것으로 볼 수 없다. (23.1차)","answer":true,"quote":"주식회사의 발기인 등이 상법 등 법령에 정한 회사설립의 요건과 절차에 따라 회사설립등기를 함으로써 회사가 성립하였다고 볼 수 있는 경우, 회사설립등기와 그 기재 내용이 공정증서원본 불실기재죄나 공전자기록 등 불실기재죄에서 말하는 ‘불실의 사실’에 해당하는지 여부 (원칙적 소극) / 이때 발기인 등이 회사를 설립할 당시 회사를 실제로 운영할 의사 없이 회사를 이용한 범죄 의도나 목적이 있었다거나, 회사로서의 인적·물적 조직 등 영업의 실질을 갖추지 않았다는 이유만으로 불실의 사실을 법인등기부에 기록하게 한 것으로 볼 수 있는지 여부 (소극)","cite":"대법원 2019도9293","badge":"","topic":"","from":"GY-2023-1-X-25","seq":null},{"id":"X-OX-468","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공무원인 의사가 공무소의 명의로 허위의 진단서를 작성한 경우 허위공문서작성죄와 허위진단서작성죄가 성립하고 두 죄는 상상적 경합관계에 있다. (22.1차)","answer":false,"quote":"형법이 제225조 내지 제230조 에서 공문서에 관한 범죄를 규정하고, 이어 제231조 내지 제236조 에서 사문서에 관한 범죄를 규정하고 있는 점 등에 비추어 볼 때 형법 제233조 소정의 허위진단서작성죄의 대상은 공무원이 아닌 의사가 사문서로서 진단서를 작성한 경우에 한정되고, 공무원인 의사가 공무소의 명의로 허위진단서를 작성한 경우에는 허위공문서작성죄만이 성립하고 허위진단서작성죄는 별도로 성립하지 않는다.","cite":"대법원 2003도7762","badge":"","topic":"","from":"GY-2022-1-X-24","seq":null},{"id":"X-OX-472","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공문서를 작성하는 과정에서 법령 등을 잘못 적용하거나 적용하여야 할 법령 등을 적용하지 아니한 잘못이 있는 경우에는 허위공문서작성죄가 성립하며, 그 적용의 전제가 된 사실관계에 관하여 거짓된 기재가 없더라도 그 성립을 부정할 수 없다. (22.2차)","answer":false,"quote":"허위공문서작성죄는 공문서에 진실에 반하는 기재를 하는 때에 성립하는 범죄이므로, 공문서를 작성하는 과정에서 법령 등을 잘못 적용하거나 적용하여야 할 법령 등을 적용하지 아니한 잘못이 있더라도 그 적용의 전제가 된 사실관계에 관하여 거짓된 기재가 없다면 허위공문서작성죄가 성립할 수 없고, 이는 그와 같은 잘못이 공무원의 고의에 기한 것이라도 달리 볼 수 없다.","cite":"대법원 2019도18394","badge":"","topic":"","from":"GY-2022-2-X-23","seq":null},{"id":"X-OX-500","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 자신이 지배하지 않는 서버에 저장된 아동‧청소년이용 음란물에 접근하여 다운로드 받을 수 있는 인터넷 주소를 제공받은 것만으로도 청소년성보호법 위반(음란물소지)죄에 해당한다. (26.1차)","answer":false,"quote":"구 아동·청소년의 성보호에 관한 법률 제11조 제5항 에서 정한 ‘소지’의 의미 / 자신이 지배하지 않는 서버 등에 저장된 아동·청소년이용음란물에 접근하여 다운로드받을 수 있는 인터넷 주소(URL) 등을 제공받은 것에 그친 경우, 이를 아동·청소년이용음란물을 ‘소지’한 것으로 평가할 수 있는지 여부 (원칙적 소극) / 아동·청소년성착취물 등을 구입한 다음 직접 다운로드받을 수 있는 인터넷 주소를 제공받은 경우, 2020. 6. 2.","cite":"대법원 2022도6278","badge":"","topic":"","from":"GY-2026-1-X-14","seq":null},{"id":"X-OX-481","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"작성자가 ‘행사할 목적’으로 타인의 자격을 모용하여 문서를 작성하였다 하더라도, 문서행사의 상대방이 자격모용 사실을 알았다거나, 작성자가 그 문서에 모용한 자격과 무관한 직인을 날인하였다는 등의 사정이 있었다면 자격모용에 의한 사문서 작성죄의 범의와 행사의 목적은 인정되지 않는다. (23.2차)","answer":false,"quote":"자격모용사문서작성죄에서 ‘행사할 목적’의 의미 / 사문서를 작성하는 자가 주식회사의 대표로서의 자격을 모용하여 문서를 작성한다는 것을 인식·용인하면서 그 문서를 진정한 문서로서 어떤 효용에 쓸 목적으로 사문서를 작성한 경우, 자격모용사문서작성죄의 행사의 목적과 고의를 인정할 수 있는지 여부 (적극) 및 이때 문서행사의 상대방이 자격모용 사실을 알았거나, 작성자가 그 문서에 모용한 자격과 무관한 직인을 날인하였다는 등의 사정이 있더라도 마찬가지인지 여부 (적극)","cite":"대법원 2021도17712","badge":"","topic":"","from":"GY-2023-2-X-23","seq":null},{"id":"X-OX-498","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"사법경찰관 P는 甲의 마약류 투약 혐의가 상당하다고 판단하여 甲에게 경찰서로 임의동행을 요구하였고, 동행장소인 경찰서에서 甲에게 마약류 투약 혐의를 밝힐 수 있는 소변과 모발의 임의 제출을 요구한 경우, 甲에 대한 임의동행은 ｢형사소송법｣ 제199조 제1항에 따른 임의동행에 해당하지 아니한다. (25.2차)","answer":false,"quote":"피고인이 메트암페타민(일명 필로폰) 투약 혐의로 임의동행 형식으로 경찰서에 간 후 자신의 소변과 모발을 경찰관에게 제출하여 마약류 관리에 관한 법률 위반(향정)으로 기소된 사안에서, 경찰관은 당시 피고인의 정신 상태, 신체에 있는 주사바늘 자국, 알콜솜 휴대, 전과 등을 근거로 피고인의 마약류 투약 혐의가 상당하다고 판단하여 경찰서로 임의동행을 요구하였고, 동행장소인 경찰서에서 피고인에게 마약류 투약 혐의를 밝힐 수 있는 소변과 모발의 임의제출을 요구하였으므로 피고인에 대한 임의동행은 마약류 투약 혐의에 대한 수사를 위한 것이어서 형사소송법 제199조 제1항 에 따른 임의동행에 해당한다는 이유로, 피고인에 대한 임의동행은 경찰관 직무집행법 제3조 제2항 에 의한 것인데 같은 조 제6항 을 위반하여 불법구금 상태에서 제출된 피고인의 소변과 모발은 위법하게 수집된 증거라고 본 원심판단에 임의동행에 관한 법리를 오해한 잘못이 있다고 한 사례.","cite":"대법원 2020도398","badge":"","topic":"","from":"GY-2025-2-X-29","seq":null},{"id":"X-OX-430","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"위조된 외국의 화폐, 지폐 또는 은행권이 강제통용력을 가지지 않고, 그 화폐 등이 국내에서 사실상 거래 대가의 지급수단이 되고 있지 않는 경우에는 그 화폐 등을 행사하더라도 위조통화행사죄를 구성하지 않는다고 할 것이므로, 형법 제234조에서 정한 위조 사문서행사죄 또는 위조사도화행사죄로 의율할 수 있다. (22.1차)","answer":true,"quote":"그러나 위조된 외국의 화폐, 지폐 또는 은행권이 강제통용력을 가지지 않는 경우에는 형법 제207조 제3항 에서 정한 ‘외국에서 통용하는 외국의 화폐 등’에 해당하지 않고, 나아가 그 화폐 등이 국내에서 사실상 거래 대가의 지급수단이 되고 있지 않는 경우에는 형법 제207조 제2항 에서 정한 ‘내국에서 유통하는 외국의 화폐 등’에도 해당하지 않으므로, 그 화폐 등을 행사하더라도 형법 제207조 제4항 에서 정한 위조통화행사죄를 구성하지 않는다고 할 것이고, 따라서 이러한 경우에는 형법 제234조 에서 정한 위조사문서행사죄 또는 위조사도화행사죄로 의율할 수 있다고 보아야 한다.","cite":"대법원 2012도2249","badge":"","topic":"","from":"GY-2022-1-X-23","seq":null},{"id":"X-OX-434","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"단순히 자신의 신용력을 증명하기 위하여 타인에게 보일 목적으로 통화를 위조한 경우에는 통화위조죄가 성립하지 않는다. (22.1차)","answer":true,"quote":"형법 제207조 에서 정한 ‘행사할 목적’이란 유가증권위조의 경우와 달리 위조·변조한 통화를 진정한 통화로서 유통에 놓겠다는 목적을 말하므로, 자신의 신용력을 증명하기 위하여 타인에게 보일 목적으로 통화를 위조한 경우에는 행사할 목적이 있다고 할 수 없다.","cite":"대법원 2011도7704","badge":"","topic":"","from":"GY-2022-1-X-25","seq":null},{"id":"X-OX-484","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 지붕과 문짝, 창문이 없고 담장과 일부 벽체가 붕괴된 철거 대상 건물로서 사실상 기거･취침에 사용할 수 없는 폐가의 내부와 외부에 쓰레기를 모아놓고 태워 그 불길이 폐가 주변 수목 4～5그루를 태우고 폐가의 벽을 일부 그을리게 한 경우, 甲은 일반물건방화죄의 미수범으로 처벌된다. (24.1차)","answer":false,"quote":"기거·취침할 수 없는 폐가는 건조물이 아닌 일반물건이고, 주변 나무를 태우고 벽을 그을린 정도로는 기수가 아닌데 일반물건방화는 미수범 처벌 규정이 없다.","cite":"대법원 2013도3950 · 형법 제167조 · 형법 제174조","badge":"","topic":"","from":"GY-2024-1-X-23","seq":null},{"id":"X-OX-444","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우에도 그 공문서 본래의 용도에 따른 사용이 아닌 경우에는 공문서부정행사죄가 성립하지 않는다. (23.2차)","answer":true,"quote":"사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우에도 그 공문서 본래의 용도에 따른 사용이 아닌 경우에는 공문서부정행사죄가 성립되지 아니한다.","cite":"대법원 2021도14514","badge":"","topic":"","from":"GY-2023-2-X-23","seq":null},{"id":"X-OX-476","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"경찰관이 甲의 정신상태, 신체에 있는 주사바늘 자국, 알콜솜 휴대, 전과 등을 근거로 甲의 마약류 투약 혐의가 상당하다고 판단하여 경찰서로 임의동행을 요구하였고, 동행 장소인 경찰서 에서 甲에게 마약류 투약 혐의를 밝힐 수 있는 소변과 모발의 임의제출을 요구하였다면, 이때 임의동행은 형사소송법 제199조 제1항에 따른 임의동행에 해당하지 아니한다. (22.2차)","answer":false,"quote":"피고인이 메트암페타민(일명 필로폰) 투약 혐의로 임의동행 형식으로 경찰서에 간 후 자신의 소변과 모발을 경찰관에게 제출하여 마약류 관리에 관한 법률 위반(향정)으로 기소된 사안에서, 경찰관은 당시 피고인의 정신 상태, 신체에 있는 주사바늘 자국, 알콜솜 휴대, 전과 등을 근거로 피고인의 마약류 투약 혐의가 상당하다고 판단하여 경찰서로 임의동행을 요구하였고, 동행장소인 경찰서에서 피고인에게 마약류 투약 혐의를 밝힐 수 있는 소변과 모발의 임의제출을 요구하였으므로 피고인에 대한 임의동행은 마약류 투약 혐의에 대한 수사를 위한 것이어서 형사소송법 제199조 제1항 에 따른 임의동행에 해당한다는 이유로, 피고인에 대한 임의동행은 경찰관 직무집행법 제3조 제2항 에 의한 것인데 같은 조 제6항 을 위반하여 불법구금 상태에서 제출된 피고인의 소변과 모발은 위법하게 수집된 증거라고 본 원심판단에 임의동행에 관한 법리를 오해한 잘못이 있다고 한 사례.","cite":"대법원 2020도398","badge":"","topic":"","from":"GY-2022-2-X-33","seq":null},{"id":"X-OX-485","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 휴대폰 녹음기능을 작동시킨 상태로 A의 휴대폰에 전화를 걸어 약 8분간의 전화통화를 마친 후 바로 전화를 끊지 않고 A가 먼저 전화 끊기를 기다리던 중 B의 목소리가 들려오자 A가 실수로 통화종료 버튼을 누르지 아니한 상태를 이용하여 A와 B가 나누는 대화를 몰래 청취･녹음하였다면 甲의 행위는 부작위에 의한 통신비밀보호법위반죄에 해당한다. (24.2차)","answer":false,"quote":"통화를 마친 뒤 끊지 않고 상대방 쪽 대화를 몰래 청취·녹음한 것은 적극적인 작위이므로, 부작위가 아닌 작위에 의한 통신비밀보호법 위반이다.","cite":"대법원 2013도15616 · 통신비밀보호법 제3조","badge":"","topic":"","from":"GY-2024-2-X-08","seq":null},{"id":"X-OX-450","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"컴퓨터 등 정보처리장치에 정보를 입력하는 등의 행위가 그 입력된 정보 등을 바탕으로 업무를 담당하는 사람의 오인, 착각 또는 부지를 일으킬 목적으로 행해진 경우에는 그 행위가 업무를 담당하는 사람을 직접적인 대상으로 이루어진 것이 아니라고 하여도 위계에 의한 업무방해죄가 성립한다. (24.2차)","answer":true,"quote":"나아가 컴퓨터 등 정보처리장치에 정보를 입력하는 등의 행위가 그 입력된 정보 등을 바탕으로 업무를 담당하는 사람의 오인, 착각 또는 부지를 일으킬 목적으로 행해진 경우에는 그 행위가 업무를 담당하는 사람을 직접적인 대상으로 이루어진 것이 아니라고 하여 위계가 아니라고 할 수는 없다.","cite":"대법원 2013도5117","badge":"","topic":"","from":"GY-2024-2-X-18","seq":null},{"id":"X-OX-488","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"인터넷을 통하여 열람·출력한 등기사항전부증명서 하단의 열람 일시 부분을 단순히 수정 테이프로 지우고 복사해 두었다가 이를 타인에게 교부한 행위는 등기사항전부증명서가 나타내는 권리·사실 관계와 다른 새로운 증명력을 가진 문서를 만든 것으로 볼 수 없으므로 공문서변조 및 변조공문서행사죄를 구성하지 않는다. (24.2차)","answer":false,"quote":"피고인이 인터넷을 통하여 열람ㆍ출력한 등기사항전부증명서 하단의 열람 일시 부분을 수정 테이프로 지우고 복사해 두었다가 이를 타인에게 교부하여 공문서변조 및 변조공문서행사로 기소된 사안에서, 등기사항전부증명서의 열람 일시는 등기부상 권리관계의 기준 일시를 나타내는 역할을 하는 것으로서 권리관계나 사실관계의 증명에서 중요한 부분에 해당하고, 열람 일시의 기재가 있어 그 일시를 기준으로 한 부동산의 권리관계를 증명하는 등기사항전부증명서와 열람 일시의 기재가 없어 부동산의 권리관계를 증명하는 기준 시점이 표시되지 않은 등기사항전부증명서 사이에는 증명하는 사실이나 증명력에 분명한 차이가 있는 점, 법률가나 관련 분야의 전문가가 아닌 평균인 수준의 사리분별력을 갖는 일반인의 관점에서 볼 때 그 등기사항전부증명서가 조금만 주의를 기울여 살펴보기만 해도 그 열람 일시가 삭제된 것임을 쉽게 알아볼 수 있을 정도로 공문서로서의 형식과 외관을 갖추지 못했다고 보기 어려운 점을 종합하면, 피고인이 등기사항전부증명서의 열람 일시를 삭제하여 복사한 행위는 등기사항전부증명서가 나타내는 권리ㆍ사실관계와 다른 새로운 증명력을 가진 문서를 만든 것에 해당하고 그로 인하여 공공적 신용을 해할 위험성도 발생하였다는 이유로, 이와 달리 본 원심판결에 공문서변조에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2018도19043","badge":"","topic":"","from":"GY-2024-2-X-23","seq":null},{"id":"X-OX-482","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"피해자와의 전화통화 당시 아무런 말을 하지 않은 경우, 이는 피해자가 전화를 수신하기 전에 전화 벨소리를 울리게 하거나 발신자 전화번호를 표시되도록 한 것까지 포함하여 피해자에게 불안감이나 공포심을 일으킨 것으로 평가되더라도 ‘음향, 글 등을 도달하게 하는 행위’로 볼 수 없어 스토킹행위에 해당하지 않는다. (24.1차)","answer":false,"quote":"설령 피고인이 피해자와의 전화통화 당시 아무런 말을 하지 않아 ‘말을 도달하게 하는 행위’에 해당하지 않더라도 피해자의 수신 전 전화 벨소리가 울리게 하거나 발신자 전화번호가 표시되도록 한 것까지 포함하여 피해자에게 불안감이나 공포심을 일으킨 것으로 평가된다면 ‘음향, 글 등을 도달하게 하는 행위’에 해당하므로 마찬가지로 위 조항 스토킹행위에 해당한다.","cite":"대법원 2022도12037","badge":"","topic":"","from":"GY-2024-1-X-16","seq":null},{"id":"X-OX-461","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"현수막 등을 설치하여 어떠한 사실이나 의견 등을 알리는 것이 일회적 또는 일시적인 사무라 하더라도 그것이 계속성을 갖는 본래의 업무수행의 일환으로서 또는 본래의 업무수행과 밀접 불가분의 관계에서 행하여지는 것이라면 업무방해죄에 의하여 보호되는 ‘업무’에 해당할 수는 있다. (26.1차)","answer":true,"quote":"현수막 등을 설치하여 어떠한 사실이나 의견 등을 알리는 것이 일회적 또는 일시적인 사무라 하더라도 그것이 계속성을 갖는 본래의 업무수행의 일환으로서 또는 본래의 업무수행과 밀접불가분의 관계에서 행하여지는 것이라면 업무방해죄에 의하여 보호되는 ‘업무’에 해당할 수는 있다.","cite":"대법원 2022도1665","badge":"","topic":"","from":"GY-2026-1-X-16","seq":null},{"id":"X-OX-466","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"업무방해죄와 폭행죄의 관계에 있어 피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 된 경우, 그러한 폭행행위는 이른바 불가벌적 수반행위에 해당하여 업무방해죄에 대하여 흡수관계에 있다. (22.1차)","answer":false,"quote":"업무방해죄와 폭행죄는 구성요건과 보호법익을 달리하고 있고, 업무방해죄의 성립에 일반적·전형적으로 사람에 대한 폭행행위를 수반하는 것은 아니며, 폭행행위가 업무방해죄에 비하여 별도로 고려되지 않을 만큼 경미한 것이라고 할 수도 없으므로, 설령 피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 되었다고 하더라도 그러한 폭행행위가 이른바 ‘불가벌적 수반행위’에 해당하여 업무방해죄에 대하여 흡수관계에 있다고 볼 수는 없다.","cite":"대법원 2012도1895","badge":"","topic":"","from":"GY-2022-1-X-13","seq":null},{"id":"X-OX-473","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"컴퓨터의 기억장치 중 하나인 램(RAM, Random Access Memory)은 기억장치 또는 저장매체이기는 하나 임시적인 기억 또는 저장에 활용되는 매체에 불과하여 램에 올려진 전자기록은 형법 제232조의2의 사전자기록위작·변작죄에서 말하는 전자기록에 해당하지 않는다. (22.2차)","answer":false,"quote":"형법 제232조의2 의 사전자기록위작·변작죄에서 말하는 권리의무 또는 사실증명에 관한 타인의 전자기록 등 특수매체기록이라 함은 일정한 저장매체에 전자방식이나 자기방식에 의하여 저장된 기록을 의미한다고 할 것인데, 비록 컴퓨터의 기억장치 중 하나인 램(RAM, Random Access Memory)이 임시기억장치 또는 임시저장매체이기는 하지만, 형법이 전자기록위·변작죄를 문서위·변조죄와 따로 처벌하고자 한 입법취지, 저장매체에 따라 생기는 그 매체와 저장된 전자기록 사이의 결합강도와 각 매체별 전자기록의 지속성의 상대적 차이, 전자기록의 계속성과 증명적 기능과의 관계, 본죄의 보호법익과 그 침해행위의 태양 및 가벌성 등에 비추어 볼 때, 위 램에 올려진 전자기록 역시 사전자기록위작·변작죄에서 말하는 전자기록 등 특수매체기록에 해당한다.","cite":"대법원 2000도4993","badge":"","topic":"","from":"GY-2022-2-X-23","seq":null},{"id":"X-OX-435","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"음란성을 구체적으로 판단함에 있어서는 행위자의 주관적 의도가 아니라 사회 평균인의 입장에서 그 전체적인 내용을 관찰하여 건전한 사회통념에 따라 객관적이고 규범적으로 평가하여야 한다. (22.2차)","answer":true,"quote":"‘음란’이라는 개념 자체는 사회와 시대적 변화에 따라 변동하는 상대적이고도 유동적인 것이고, 그 시대에 있어서 사회의 풍속, 윤리, 종교 등과도 밀접한 관계를 가지는 추상적인 것이므로, 결국 음란성을 구체적으로 판단함에 있어서는 행위자의 주관적 의도가 아니라 사회 평균인의 입장에서 그 전체적인 내용을 관찰하여 건전한 사회통념에 따라 객관적이고 규범적으로 평가하여야 한다.","cite":"대법원 2019도14056","badge":"","topic":"","from":"GY-2022-2-X-24","seq":null},{"id":"X-OX-449","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 되었다고 하더라도 그러한 폭행행위는 이른바 ‘불가벌적 수반행위’에 해당하므로 업무방해죄에 대하여 흡수관계에 있다고 볼 수 없다. (24.2차)","answer":true,"quote":"업무방해죄와 폭행죄는 구성요건과 보호법익을 달리하고 있고, 업무방해죄의 성립에 일반적·전형적으로 사람에 대한 폭행행위를 수반하는 것은 아니며, 폭행행위가 업무방해죄에 비하여 별도로 고려되지 않을 만큼 경미한 것이라고 할 수도 없으므로, 설령 피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 되었다고 하더라도 그러한 폭행행위가 이른바 ‘불가벌적 수반행위’에 해당하여 업무방해죄에 대하여 흡수관계에 있다고 볼 수는 없다.","cite":"대법원 2012도1895","badge":"","topic":"","from":"GY-2024-2-X-18","seq":null},{"id":"X-OX-501","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"입찰방해죄에서 방해의 대상인 ‘입찰’은 공정한 자유경쟁을 통한 적정한 가격형성을 목적으로 하는 입찰절차를 말하고, 여기에는 공적‧사적 경제주체가 임의의 선택에 따라 진행하는 계약체결 과정도 포함한다. (26.1차)","answer":false,"quote":"그리고 방해의 대상인 ‘입찰’은 공정한 자유경쟁을 통한 적정한 가격형성을 목적으로 하는 입찰절차를 말하고, 공적·사적 경제주체가 임의의 선택에 따라 진행하는 계약체결 과정은 이에 해당하지 않는다.","cite":"대법원 2022도8459","badge":"","topic":"","from":"GY-2026-1-X-16","seq":null},{"id":"X-OX-446","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"｢형법｣ 제228조 제1항 공전자기록 등 불실기재죄의 구성요건인 ‘불실의 사실기재’는 당사자의 허위신고에 의하여 이루어져야 하므로, 법원의 촉탁에 의하여 등기를 마친 경우에는 그 전제 절차에 허위적 요소가 있더라도 위 죄가 성립하지 않는다. (23.2차)","answer":true,"quote":"공정증서원본불실기재죄에 있어서의 불실의 기재는 당사자의 허위신고에 의하여 이루어져야 하므로 법원의 촉탁에 의하여 이루어진 경우에는 가령 그 전제절차에 허위적 요소가 있다 하더라도 그것은 법원의 촉탁에 의하여 이루어진 것이지 당사자의 허위신고에 의하여 이루어진 것이 아니므로 공정증서원본불실기재죄를 구성하지 않는다.","cite":"대법원 83도2442","badge":"","topic":"","from":"GY-2023-2-X-23","seq":null},{"id":"X-OX-436","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"사기도박의 경우 도박에서의 우연성이 결여되어 사기죄만 성립하고, 사기도박에 필요한 준비를 갖추고 그러한 의도로 피해자들에게 도박에 참가하도록 권유한 때 또는 늦어도 그 정을 알지 못하는 피해자들이 도박에 참가한 때 실행의 착수가 인정된다. (22.2차)","answer":true,"quote":"피고인 등이 사기도박에 필요한 준비를 갖추고 그러한 의도로 피해자들에게 도박에 참가하도록 권유한 때 또는 늦어도 그 정을 알지 못하는 피해자들이 도박에 참가한 때에는 이미 사기죄의 실행에 착수하였다고 할 것이므로, 피고인 등이 그 후에 사기도박을 숨기기 위하여 얼마간 정상적인 도박을 하였더라도 이는 사기죄의 실행행위에 포함되는 것이어서 피고인에 대하여는 피해자들에 대한 사기죄만이 성립하고 도박죄는 따로 성립하지 아니함에도, 이와 달리 피해자들에 대한 사기죄 외에 도박죄가 별도로 성립하는 것으로 판단하고 이를 유죄로 인정한 원심판결에 사기도박에 있어서의 실행의 착수시기 등에 관한 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2010도9330","badge":"","topic":"","from":"GY-2022-2-X-25","seq":null},{"id":"X-OX-489","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"｢형법｣ 제238조의 공기호는 해당 부호를 공무원 또는 공무소가 사용하는 것만으로 족하므로 온라인 구매사이트에서 검찰 업무 표장의 이미지가 들어간 주차표지판 등을 주문하여 자신의 승용차에 부착하고 다닌 경우에는 해당 부호를 공무원 또는 공무소가 사용하는 것이 분명한 이상 그 부호를 통하여 증명을 하는 사항이 구체적으로 특정되어 있지 않더라도 공기호위조 및 위조공기호행사죄에 해당한다. (24.2차)","answer":false,"quote":"피고인이 온라인 구매사이트에서 ① 검찰 업무표장(에서 ‘검찰’을 제외한 부분) 아래 ‘검찰 PROSECUTION SERVICE’라고 기재하고 그 아래 피고인의 전화번호를 기재한 주차표지판 1개, ② 검찰 업무표장() 아래 ‘검찰 PROSECUTION OFFICE’라고 기재하고 그 아래 피고인의 차량번호를 표시한 표지판 1개, ③ 검찰 업무표장() 아래 ‘검찰 PROSECUTION SERVICE’라고 기재하고 그 아래 ‘공무수행’이라고 표시한 표지판 1개를 주문하여 배송받음으로써 행사할 목적으로 공기호인 검찰청 업무표장을 각각 위조하고, 이를 자신의 승용차에 부착하고 다님으로써 위조된 공기호인 검찰청 업무표장을 행사하였다는 공소사실로 기소된 사안에서, 위 각 표지판에 사용된 검찰 업무표장은 검찰수사, 공판, 형의 집행부터 대외 홍보 등 검찰청의 업무 전반 또는 검찰청 업무와의 관련성을 나타내기 위한 것으로 보일 뿐, 이것이 부착된 차량은 ‘검찰 공무수행 차량’이라는 것을 증명하는 기능이 있다는 등 이를 통하여 증명을 하는 사항이 구체적으로 특정되어 있다거나 그 사항이 이러한 검찰 업무표장에 의하여 증명된다고 볼 근거가 없고, 일반인들이 위 각 표지판이 부착된 차량을 ‘검찰 공무수행 차량’으로 오인할 수 있다고 해도 위 각 검찰 업무표장이 위와 같은 증명적 기능을 갖추지 못한 이상, 이를 공기호라고 볼 수 없음에도, 이와 달리 보아 공소사실을 유죄로 인정한 원심판단에 법리오해 등의 잘못이 있다고 한 사례.","cite":"대법원 2023도11313","badge":"","topic":"","from":"GY-2024-2-X-23","seq":null},{"id":"X-OX-491","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"정보통신망을 통하여 음란한 화상 또는 영상을 배포하고 도박 사이트를 홍보한 경우, 그 범죄행위에 이용된 웹사이트를 매각하여 취득한 대가는 ｢형법｣ 제48조 제1항 제2호, 제2항이 규정한 추징의 대상에 해당한다. (25.1차)","answer":false,"quote":"피고인이 甲, 乙과 공모하여 정보통신망을 통하여 음란한 화상 또는 영상을 배포하고, 도박 사이트를 홍보하였다는 공소사실로 기소되었는데, 원심이 공소사실을 유죄로 인정하면서 피고인이 범죄행위에 이용한 웹사이트 매각을 통해 취득한 대가를 형법 제48조 에 따라 추징한 사안에서, 위 웹사이트는 범죄행위에 제공된 무형의 재산에 해당할 뿐 형법 제48조 제1항 제2호 에서 정한 ‘범죄행위로 인하여 생(生)하였거나 이로 인하여 취득한 물건’에 해당하지 않으므로, 피고인이 위 웹사이트 매각을 통해 취득한 대가는 형법 제48조 제1항 제2호 , 제2항 이 규정한 추징의 대상에 해당하지 않는다는 이유로, 이와 달리 보아 위 웹사이트 매각대금을 추징한 원심판결에 형법 제48조 에서 정한 몰수ㆍ추징에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2021도7168","badge":"","topic":"","from":"GY-2025-1-X-13","seq":null},{"id":"X-OX-451","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"｢형법｣상 업무방해죄에서 말하는 ‘위력’은 폭력·협박은 물론 사회적·경제적·정치적 지위와 권세에 의한 압박 등도 이에 포함 되지만, 적어도 그러한 위력으로 인하여 피해자의 자유의사를 제압하기에 충분하다고 평가될 정도의 세력에는 이르러야 한다. (24.2차)","answer":true,"quote":"업무방해의 위력에는 폭력·협박뿐 아니라 사회적·경제적·정치적 지위에 의한 압박도 들지만, 피해자의 자유의사를 제압하기에 충분한 세력이어야 한다.","cite":"형법 제314조","badge":"","topic":"","from":"GY-2024-2-X-18","seq":null},{"id":"X-OX-460","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"아동･청소년이용음란물을 제작한 자가 그 음란물을 소지하게 되는 경우 청소년성보호법 위반(음란물소지)죄는 청소년성보호법 위반(음란물제작･배포등)죄에 흡수되므로 양자는 법조경합 중 흡수관계에 있다. (26.1차)","answer":true,"quote":"따라서 아동ㆍ청소년이용음란물을 제작한 자가 그 음란물을 소지하게 되는 경우 청소년성보호법 위반(음란물소지)죄는 청소년성보호법 위반(음란물제작ㆍ배포등)죄에 흡수된다고 봄이 타당하다.","cite":"대법원 2021도2993","badge":"","topic":"","from":"GY-2026-1-X-11","seq":null},{"id":"X-OX-479","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"위조통화를 행사하여 재물을 취득한 경우 위조통화행사죄와 사기죄가 성립하고 양죄는 상상적 경합관계에 있다. (23.1차)","answer":false,"quote":"통화위조죄에 관한 규정은 공공의 거래상의 신용 및 안전을 보호하는 공공적인 법익을 보호함을 목적으로 하고 있고, 사기죄는 개인의 재산법익에 대한 죄이어서 양죄는 그 보호법익을 달리하고 있으므로 위조통화를 행사하여 재물을 불법영득한 때에는 위조통화행사죄와 사기죄의 양죄가 성립된다.","cite":"대법원 79도840","badge":"","topic":"","from":"GY-2023-1-X-24","seq":null},{"id":"X-OX-502","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공무원 甲이 국회 국정조사절차에서 증언한 후 국회의원으로부터 추가 서면질의를 받고, 실무 공무원 A로 하여금 ‘비서실에서는 20～30분 단위로 간단없이 유‧무선으로 보고를 하였기 때문에, 공무원 B는 직접 대면보고 받는 것 이상으로 상황을 파악하고 있었다고 생각합니다.’라는 내용의 서면답변서를 작성하여 국회에 제출하도록 한 경우, 위 답변서는 공문서에 해당하지 않는다. (26.1차)","answer":false,"quote":"피고인 甲이 세월호 침몰사고 진상규명을 위한 국정조사특별위원회의 국정조사(이하 ‘국조특위’라고 한다)절차에서 대통령비서실장으로서 증언한 후 국회의원으로부터 대통령 대면보고 시점 등에 관한 추가 서면질의를 받고, 실무 담당 행정관으로 하여금 ‘비서실에서는 20~30분 단위로 간단없이 유·무선으로 보고를 하였기 때문에, 대통령은 직접 대면보고 받는 것 이상으로 상황을 파악하고 있었다고 생각합니다.’라는 내용의 서면답변서(이하 ‘답변서’라고 한다)를 작성하여 국회에 제출하도록 함으로써 공문서를 허위로 작성·행사하였다는 내용으로 기소된 사안에서, 답변서가 대통령비서실장으로서 최종 작성권한을 갖는 피고인 甲에 의하여 대통령비서실, 국가안보실의 직무권한 범위 내에서 작성된 공문서에 해당한다고 본 원심판단은 정당하나, 답변서 중 ‘대통령은 직접 대면보고 받는 것 이상으로 상황을 파악하고 있었다고 생각한다.’는 부분은 피고인 甲의 의견으로서 그 자체로 내용의 진실 여부를 판단할 수 있다거나 문서에 대한 공공의 신용을 위태롭게 할 만한 증명력과 신용력을 갖는다고 볼 수 없고, ‘비서실에서 20~30분 단위로 간단없이 유·무선으로 보고를 하였다.’는 부분은 실제로 있었던 객관적 사실을 기반으로 하여 기재된 내용으로 이를 허위라고 볼 수 없으며, 또한 답변서는 그 실질이 국조특위 이후 추가된 국회 질의에 대하여 서면으로 행한 ‘증언’과 다를 바 없을 뿐만 아니라, 국조특위에서 위증에 대한 제재를 감수하는 증인선서 후 증언한 것과 내용 면에서 차이가 없고, 실제 작성·제출도 자료 취합과 정리를 담당한 실무자에 의하여 기존 증언 내용 그대로 이루어졌다는 점 등에 비추어, 답변서는 피고인 甲이 국조특위 이후 추가된 국회 질의에 대하여 기존 증언과 같은 내용의 답변을 담은 문서로서 허위공문서작성죄에서 말하는 ‘허위’가 있다거나 그에 관한 피고인 甲의 인식이 있었다고 보기 어렵다는 이유로, 이와 달리 보아 답변서 작성 및 제출이 허위공문서작성죄 및 허위작성공문서행사죄에 해당한다고 인정한 원심판단에는 허위공문서작성죄에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2020도9714","badge":"","topic":"","from":"GY-2026-1-X-23","seq":null},{"id":"X-OX-477","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 A의 재물을 강취한 후 A를 살해할 의사로 현주건조물에 방화하여 A가 사망한 경우, 甲의 행위는 강도살인죄와 현주 건조물방화치사죄에 모두 해당하고 그 두 죄는 실체적 경합범 관계에 있다. (23.1차)","answer":false,"quote":"피고인들이 피해자들의 재물을 강취한 후 그들을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 피고인들의 행위는 강도살인죄와 현주건조물방화치사죄에 모두 해당하고 그 두 죄는 상상적 경합범관계에 있다.","cite":"대법원 98도3416","badge":"","topic":"","from":"GY-2023-1-X-23","seq":null},{"id":"X-OX-454","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"업무방해죄의 성립에는 업무방해의 결과가 실제로 발생할 것을 요하지 않지만 업무방해의 결과를 초래할 위험은 발생하여야 한다. (25.1차)","answer":true,"quote":"위계에 의한 업무방해죄에서 ‘위계’의 의미 / 업무방해죄의 성립에 업무방해의 결과가 실제로 발생할 것을 요하는지 여부 (소극) 및 업무방해의 결과를 초래할 위험은 발생하여야 하고, 그 위험의 발생이 위계 또는 위력으로 인한 것이어야 하는지 여부 (적극)","cite":"대법원 2021도13708","badge":"","topic":"","from":"GY-2025-1-X-17","seq":null},{"id":"X-OX-478","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"유가증권의 내용 중 권한 없는 자에 의하여 이미 변조된 부분을 다시 권한 없이 변경한 경우 유가증권변조죄를 구성한다. (23.1차)","answer":false,"quote":"따라서 유가증권의 내용 중 권한 없는 자에 의하여 이미 변조된 부분을 다시 권한 없이 변경하였다고 하더라도 유가증권변조죄는 성립하지 않는다.","cite":"대법원 2010도15206","badge":"","topic":"","from":"GY-2023-1-X-24","seq":null},{"id":"X-OX-490","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 된 경우, 그 폭행행위는 불가벌적 수반행위에 해당하므로 업무방해죄에 대하여 흡수관계에 있다. (25.1차)","answer":false,"quote":"업무방해죄와 폭행죄는 구성요건과 보호법익을 달리하고 있고, 업무방해죄의 성립에 일반적·전형적으로 사람에 대한 폭행행위를 수반하는 것은 아니며, 폭행행위가 업무방해죄에 비하여 별도로 고려되지 않을 만큼 경미한 것이라고 할 수도 없으므로, 설령 피해자에 대한 폭행행위가 동일한 피해자에 대한 업무방해죄의 수단이 되었다고 하더라도 그러한 폭행행위가 이른바 ‘불가벌적 수반행위’에 해당하여 업무방해죄에 대하여 흡수관계에 있다고 볼 수는 없다.","cite":"대법원 2012도1895","badge":"","topic":"","from":"GY-2025-1-X-12","seq":null},{"id":"X-OX-474","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"공연음란죄에서 정하는 ‘음란한 행위’는 일반인의 성욕을 자극하여 성적 흥분을 유발하고 정상적인 성적 수치심을 해하여 성적 도의관념에 반하는 것을 의미하고, 그 행위의 음란성에 대한 의미의 인식뿐만 아니라 성욕의 흥분, 만족 등의 성적인 목적이 있어야 공연음란죄가 성립한다. (22.2차)","answer":false,"quote":"형법 제245조 소정의 '음란한 행위'라 함은 일반 보통인의 성욕을 자극하여 성적 흥분을 유발하고 정상적인 성적 수치심을 해하여 성적 도의관념에 반하는 것을 가리킨다고 할 것이고, 위 죄는 주관적으로 성욕의 흥분 또는 만족 등의 성적인 목적이 있어야 성립하는 것은 아니지만 그 행위의 음란성에 대한 의미의 인식이 있으면 족하다.","cite":"대법원 2000도4372","badge":"","topic":"","from":"GY-2022-2-X-24","seq":null},{"id":"X-OX-471","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 상대방에게 성적 수치심을 일으키는 그림 등이 담겨 있는 웹페이지에 대한 인터넷 링크를 A에게 보낸 경우, A가 그 링크를 이용하여 별다른 제한 없이 이에 바로 접할 수 있는 상태가 조성되었는지 여부를 묻지 않고 甲에게는 성폭력범죄의 처벌 등에 관한 특례법 위반(통신매체이용음란)죄가 성립한다. (22.2차)","answer":false,"quote":"따라서 행위자의 의사와 그 내용, 웹페이지의 성격과 사용된 링크기술의 구체적인 방식 등 모든 사정을 종합하여 볼 때 상대방에게 성적 수치심을 일으키는 그림 등이 담겨 있는 웹페이지 등에 대한 인터넷 링크(internet link)를 보내는 행위를 통해 그와 같은 그림 등이 상대방에 의하여 인식될 수 있는 상태에 놓이고 실질에 있어서 이를 직접 전달하는 것과 다를 바 없다고 평가되고, 이에 따라 상대방이 이러한 링크를 이용하여 별다른 제한 없이 성적 수치심을 일으키는 그림 등에 바로 접할 수 있는 상태가 실제로 조성되었다면, 그러한 행위는 전체로 보아 성적 수치심을 일으키는 그림 등을 상대방에게 도달하게 한다는 구성요건을 충족한다.","cite":"대법원 2016도21389","badge":"","topic":"","from":"GY-2022-2-X-17","seq":null},{"id":"X-OX-467","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우 그 공문서 본래의 용도에 따른 사용이 아니라 하더라도 형법 제230조의 공문서부정행사죄가 성립된다. (22.1차)","answer":false,"quote":"사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우에도 그 공문서 본래의 용도에 따른 사용이 아닌 경우에는 형법 제230조 의 공문서부정행사죄가 성립되지 아니한다.","cite":"대법원 2002도4935","badge":"","topic":"","from":"GY-2022-1-X-23","seq":null},{"id":"X-OX-483","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 A의 집에 불을 놓은 후 불이 붙은 집에서 탈출하려는 A를 막아 탈출하지 못하게 함으로써 A가 결국 불에 타 사망한 경우, 甲에게는 현주건조물방화죄와 살인죄의 상상적 경합범이 성립한다. (24.1차)","answer":false,"quote":"불을 놓은 뒤 탈출하려는 사람을 막아 숨지게 한 것은 별개의 범의로 별개의 법익을 해친 행위라 두 죄는 실체적 경합이다.","cite":"대법원 82도2341","badge":"","topic":"","from":"GY-2024-1-X-23","seq":null},{"id":"X-OX-496","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"입찰참가자들 사이의 담합행위가 입찰방해죄로 되기 위하여는 입찰참가자들 일부가 아닌 전원 사이에 담합이 이루어져야 하는 것이고, 나아가 그것이 입찰의 공정을 해하는 것으로 평가되는 이상 입찰방해죄는 성립한다. (25.2차)","answer":false,"quote":"여기서 ‘입찰의 공정을 해하는 행위’란 공정한 자유경쟁을 방해할 염려가 있는 상태를 발생시키는 것, 즉 공정한 자유경쟁을 통한 적정한 가격형성에 부당한 영향을 주는 상태를 발생시키는 것으로, 그 행위에는 가격결정뿐 아니라 ‘적법하고 공정한 경쟁방법’을 해하는 행위도 포함되고, 입찰참가자들 사이의 담합행위가 입찰방해죄로 되기 위하여는 반드시 입찰참가자 전원 사이에 담합이 이루어져야 하는 것은 아니며, 입찰참가자들 중 일부 사이에만 담합이 이루어진 경우라고 하더라도 그것이 입찰의 공정을 해하는 것으로 평가되는 이상 입찰방해죄가 성립한다.","cite":"대법원 2022도8459","badge":"","topic":"","from":"GY-2025-2-X-18","seq":null},{"id":"X-OX-458","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"｢형법｣ 제233조 소정의 허위진단서작성죄의 대상은 공무원이 아닌 의사가 사문서로서 진단서를 작성한 경우에 한정되고, 공무원인 의사가 공무소의 명의로 허위진단서를 작성한 경우에는 허위공문서작성죄만 성립하고, 허위진단서작성죄는 별도로 성립하지 않는다. (25.2차)","answer":true,"quote":"형법이 제225조 내지 제230조 에서 공문서에 관한 범죄를 규정하고, 이어 제231조 내지 제236조 에서 사문서에 관한 범죄를 규정하고 있는 점 등에 비추어 볼 때 형법 제233조 소정의 허위진단서작성죄의 대상은 공무원이 아닌 의사가 사문서로서 진단서를 작성한 경우에 한정되고, 공무원인 의사가 공무소의 명의로 허위진단서를 작성한 경우에는 허위공문서작성죄만이 성립하고 허위진단서작성죄는 별도로 성립하지 않는다.","cite":"대법원 2003도7762","badge":"","topic":"","from":"GY-2025-2-X-24","seq":null},{"id":"X-OX-486","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"｢마약류 관리에 관한 법률｣ 제67조에 의한 몰수나 추징은 범죄 행위로 인한 이득의 박탈을 목적으로 하는 것이므로, 그 범행 으로 인하여 이득을 취득한 바 없다면 법원은 그 가액의 추징을 명할 수 없다. (24.2차)","answer":false,"quote":"마약류관리에 관한 법률 제67조 에 의한 몰수나 추징은 범죄행위로 인한 이득의 박탈을 목적으로 하는 것이 아니라 징벌적 성질의 처분이므로, 그 범행으로 인하여 이득을 취득한 바 없다 하더라도 법원은 그 가액의 추징을 명하여야 하고, 그 추징의 범위에 관하여는 죄를 범한 자가 여러 사람일 때에는 각자에 대하여 그가 취급한 범위 내에서 의약품 가액 전액의 추징을 명하여야 한다.","cite":"대법원 2010도7251","badge":"","topic":"","from":"GY-2024-2-X-14","seq":null},{"id":"X-OX-456","subject":"형사법","unit":"사회적 법익에 대한 죄","stmt":"甲이 어떠한 방법으로 변조된 게임프로그램을 실행하여 게임 서버에 접속하였는지에 관하여 전혀 특정하지 아니한 채 변조된 게임프로그램을 게시·유포하였다는 사실만으로는 위계로써 乙게임회사의 업무를 방해한 것으로 볼 수 없다. (25.2차)","answer":true,"quote":"피고인이 피해자 게임회사들이 제작한 모바일게임의 이용자들의 게임머니나 능력치를 높게 할 수 있는 변조된 게임프로그램을 해외 인터넷 사이트에서 다운로드받은 다음, 위와 같은 게임프로그램을 제공한다는 것을 나타내는 문구가 게임프로그램 실행 시 화면에 나올 수 있도록 게임프로그램을 변조한 후 자신이 직접 개설한 모바일 어플리케이션 공유사이트 게시판에 위와 같이 변조한 게임프로그램들을 게시·유포하여 위계로써 피해자 게임회사들의 정상적인 영업업무를 방해하였다는 내용으로 기소된 사안에서, 피고인이 어떠한 방법으로 변조된 게임프로그램을 실행하여 게임서버에 접속하였는지에 관하여 전혀 특정하지 아니한 채 변조된 게임프로그램을 게시·유포하였다는 사실만으로는 위계에 의한 업무방해죄가 성립하지 않는다고 한 사례","cite":"대법원 2016도15144","badge":"","topic":"","from":"GY-2025-2-X-18","seq":null},{"id":"X-OX-573","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"지방자치단체장이 전국공무원노동조합이 주도한 파업에 참가한 소속 공무원들에 대하여 관할 인사위원회에 징계의결요구를 하지 아니하고 가담 정도의 경중을 가려 자체 인사위원회에 징계의결요구를 하거나 훈계처분을 하도록 지시한 행위는 직무유기죄를 구성한다. (26.1차)","answer":false,"quote":"지방자치단체장이 전국공무원노동조합이 주도한 파업에 참가한 소속 공무원들에 대하여 관할 인사위원회에 징계의결요구를 하지 아니하고 가담 정도의 경중을 가려 자체 인사위원회에 징계의결요구를 하거나 훈계처분을 하도록 지시한 행위가 직무유기죄를 구성하지 않는다고 한 사례.","cite":"대법원 2006도1390","badge":"","topic":"","from":"GY-2026-1-X-25","seq":null},{"id":"X-OX-535","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"객관적으로 고소사실에 대한 공소시효가 완성되었더라도 고소를 제기하면서 마치 공소시효가 완성되지 아니한 것처럼 고소한 경우에는 국가기관의 직무를 그르칠 염려가 있으므로 무고죄를 구성한다. (25.2차)","answer":true,"quote":"객관적으로 고소사실에 대한 공소시효가 완성되었더라도 고소를 제기하면서 마치 공소시효가 완성되지 아니한 것처럼 고소한 경우에는 국가기관의 직무를 그르칠 염려가 있으므로 무고죄를 구성한다.","cite":"대법원 95도1908","badge":"","topic":"","from":"GY-2025-2-X-27","seq":null},{"id":"X-OX-523","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"증거위조죄의 적용대상인 ‘증거’에는 범죄의 성립에 관한 증거 외에 양형의 기초가 되는 정상관계 사실에 관한 증거도 포함된다. 그런데 양형의 기초가 되는정상관계사실은 매우복잡하고비유형적일 뿐만 아니라 ｢형사소송법｣ 제307조가 규정한 엄격한 증명의 대상에도 해당하지 않는다. (24.1차)","answer":true,"quote":"증거위조죄의 증거에는 양형 자료도 들어가지만, 정상관계 사실 자체는 엄격한 증명이 아니라 자유로운 증명의 대상이다.","cite":"대법원 2020도2642 · 형법 제155조","badge":"","topic":"","from":"GY-2024-1-X-35","seq":null},{"id":"X-OX-571","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제157조, 제153조는 무고죄를 범한 자가 그 신고한 사건의 재판 또는 징계처분이 확정되기 전에 자백 또는 자수한 때에는 그 형을 감경 또는 면제하도록 정하고 있는바, ｢형법｣ 제153조에서 정한 ‘재판이 확정되기 전’이라 함은 피고소인에 대한 공소 제기 또는 재판절차가 개시되는 것을 전제로 하며, 피고소인에 대해서 불기소결정이 내려진 경우는 포함되지 않는다. (25.2차)","answer":false,"quote":"형법 제157조 , 제153조 는 무고죄를 범한 자가 그 신고한 사건의 재판 또는 징계처분이 확정되기 전에 자백 또는 자수한 때에는 그 형을 감경 또는 면제한다고 하여 이러한 재판확정 전의 자백을 필요적 감경 또는 면제사유로 정하고 있다.","cite":"대법원 2018도7293","badge":"","topic":"","from":"GY-2025-2-X-27","seq":null},{"id":"X-OX-524","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 ｢형법｣ 제124조 제1항의 직권남용감금죄가 성립한다. (24.2차)","answer":true,"quote":"감금죄는 간접정범의 형태로도 행하여질 수 있는 것이므로, 인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 형법 제124조 제1항 의 직권남용감금죄가 성립한다.","cite":"대법원 2003도3945","badge":"","topic":"","from":"GY-2024-2-X-24","seq":null},{"id":"X-OX-521","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무원 甲이 출원인이 어업허가를 받을 수 없는 자라는 사실을 알면서도 그 직무상의 의무에 따른 적절한 조치를 취하지 않고 오히려 부하직원으로 하여금 어업허가 처리기안문을 작성하게 한 다음 甲 스스로 중간결재를 하는 등 위계로써 결재권자의 최종 결재를 받은 경우, 甲에게는 작위범인 위계에 의한 공무집행 방해죄만이 성립하고 부작위범인 직무유기죄는 따로 성립하지 아니한다. (24.1차)","answer":true,"quote":"피고인이, 출원인이 어업허가를 받을 수 없는 자라는 사실을 알면서도 그 직무상의 의무에 따른 적절한 조치를 취하지 않고 오히려 부하직원으로 하여금 어업허가 처리기안문을 작성하게 한 다음 피고인 스스로 중간결재를 하는 등 위계로써 농수산국장의 최종결재를 받았다면, 직무위배의 위법상태가 위계에 의한 공무집행방해행위 속에 포함되어 있는 것이라고 보아야 할 것이므로, 이와 같은 경우에는 작위범인 위계에 의한 공무집행방해죄만이 성립하고 부작위범인 직무유기죄는 따로 성립하지 아니한다.","cite":"대법원 96도2825","badge":"","topic":"","from":"GY-2024-1-X-25","seq":null},{"id":"X-OX-533","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"단일하고도 계속된 범의 아래 일정 기간 반복하여 뇌물수수 행위와 부정한 행위가 행하여졌고 그 뇌물수수 행위와 부정한 행위 사이에 인과관계가 인정되며 피해법익도 동일하다면, 최후의 부정한 행위 이후에 저질러진 뇌물수수 행위도 최후의 부정한 행위 이전의 뇌물수수 행위 및 부정한 행위와 함께 수뢰후부정처사죄의 포괄일죄가 성립한다. (25.2차)","answer":true,"quote":"따라서 단일하고도 계속된 범의 아래 일정 기간 반복하여 일련의 뇌물수수 행위와 부정한 행위가 행하여졌고 그 뇌물수수 행위와 부정한 행위 사이에 인과관계가 인정되며 피해법익도 동일하다면, 최후의 부정한 행위 이후에 저질러진 뇌물수수 행위도 최후의 부정한 행위 이전의 뇌물수수 행위 및 부정한 행위와 함께 수뢰후부정처사죄의 포괄일죄로 처벌함이 타당하다.","cite":"대법원 2020도12103","badge":"","topic":"","from":"GY-2025-2-X-12","seq":null},{"id":"X-OX-547","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"마약범죄 피의자가 타인의 소변을 마치 자신의 소변인 것처럼 수사기관에 건네주어 필로폰 음성반응이 나오게 한 경우, 위계에 의한 공무집행방해죄는 성립하지 않는다. (23.2차)","answer":false,"quote":"타인의 소변을 마치 자신의 소변인 것처럼 수사기관에 건네주어 필로폰 음성반응이 나오게 한 경우, 수사기관의 착오를 이용하여 적극적으로 피의사실에 관한 증거를 조작한 것이므로 위계에 의한 공무집행방해죄가 성립한다고 한 사례","cite":"대법원 2007도6101","badge":"","topic":"","from":"GY-2023-2-X-26","seq":null},{"id":"X-OX-574","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"뇌물을 수수한 자가 공동수수자가 아닌 교사범 또는 종범에게 뇌물 중 일부를 사례금 등의 명목으로 교부한 경우, 이는 뇌물을 수수하는 데 따르는 부수적 비용의 지출 또는 뇌물의 소비행위로 볼 수 없으므로 교사범 또는 종범에게 수뢰액을 추징하여야 한다. (26.1차)","answer":false,"quote":"그리고 뇌물을 수수한 자가 공동수수자가 아닌 교사범 또는 종범에게 뇌물 중 일부를 사례금 등의 명목으로 교부하였다면 이는 뇌물을 수수하는 데 따르는 부수적 비용의 지출 또는 뇌물의 소비행위에 지나지 아니하므로, 뇌물수수자에게서 수뢰액 전부를 추징하여야 한다.","cite":"대법원 2011도9585","badge":"","topic":"","from":"GY-2026-1-X-26","seq":null},{"id":"X-OX-526","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"금품이나 이익 전부에 관하여 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 공동정범이 성립한 이후에 뇌물이 실제로 공동 정범인 공무원 또는 비공무원 중 누구에게 귀속되었는지는 이미 성립한 뇌물수수죄에 영향을 미치지 않는다. (24.2차)","answer":true,"quote":"금품이나 이익 전부에 관하여 뇌물수수죄의 공동정범이 성립한 이후에 뇌물이 실제로 공동정범인 공무원 또는 비공무원 중 누구에게 귀속되었는지는 이미 성립한 뇌물수수죄에 영향을 미치지 않는다.","cite":"대법원 2018도13792","badge":"","topic":"","from":"GY-2024-2-X-25","seq":null},{"id":"X-OX-519","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"하나의 사건에 관하여 한 번 선서한 증인이 같은 기일에 여러 가지 사실에 관하여 기억에 반하는 허위의 진술을 한 경우, 1개의 위증죄만이 성립한다. (24.1차)","answer":true,"quote":"선서한 증인이 같은 기일에 여러 가지 사실에 관하여 기억에 반하는 허위의 진술을 한 경우, 위증죄의 죄수(=포괄일죄) 및 그 기판력이 미치는 범위","cite":"대법원 2006도9463","badge":"","topic":"","from":"GY-2024-1-X-11","seq":null},{"id":"X-OX-545","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"알선수뢰죄에서 ‘공무원이 그 지위를 이용하여’라 함은 친구, 친족관계 등 사적인 관계를 이용하는 경우뿐만 아니라 다른 공무원이 취급하는 사무처리에 법률상이거나 사실상으로 영향을 줄 수 있는 관계에 있는 공무원이 그 지위를 이용하는 경우도 포함한다. (23.2차)","answer":false,"quote":"알선수뢰의 「지위를 이용하여」는 다른 공무원의 사무에 영향을 줄 수 있는 관계를 이용하는 것이고, 친구·친족 같은 사적 관계는 해당하지 않는다.","cite":"대법원 2006도735 · 형법 제132조","badge":"","topic":"","from":"GY-2023-2-X-25","seq":null},{"id":"X-OX-529","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무집행방해죄는 공무원의 적법한 공무집행을 전제로 하는데, 추상적인 권한에 속하는 공무원의 어떠한 공무집행이 적법한지 여부는 행위 당시의 구체적 상황에 기하여 객관적 합리적으로 판단하여야 하고 사후적으로 순수한 객관적 기준에서 판단할 것은 아니다. (24.2차)","answer":true,"quote":"추상적인 권한에 속하는 공무원의 어떠한 공무집행이 적법한지는 행위 당시의 구체적 상황에 기초를 두고 객관적ㆍ합리적으로 판단해야 하고, 사후적으로 순수한 객관적 기준에서 판단할 것은 아니다.","cite":"대법원 2018도2993","badge":"","topic":"","from":"GY-2024-2-X-26","seq":null},{"id":"X-OX-566","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"경찰관이 성폭력범죄로 체포영장이 발부된 피의자에 대해 체포절차에 착수하였으나 피의자가 저항하는 과정에서 경찰관에게 상해를 가하였고, 이에 대해 경찰관이 별도 범죄인 특수공무집행방해치상의 현행범으로 피의자를 체포한 경우라도 집행완료에 이르지 못한 성폭력범죄의 체포영장은 사후에 그 피의자에게 제시하여야 한다. (25.1차)","answer":false,"quote":"체포영장 집행에 착수했다가 다른 범죄의 현행범으로 체포했다면 그 영장으로 체포한 것이 아니므로, 집행을 마치지 못한 체포영장을 사후에 제시할 필요는 없다.","cite":"형사소송법 제200조의6 · 형사소송법 제85조","badge":"","topic":"","from":"GY-2025-1-X-29","seq":null},{"id":"X-OX-538","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"지방자치단체장이 직무에 관하여 부정한 청탁을 받고 지방자치 단체에 금품을 제공하게 하였다면 공무원 개인이 금품을 취득한 경우와 동일시할 수는 없고, 그 공무원이 단체를 대표하는 지위에 있는 경우에도 마찬가지여서 ｢형법｣ 제130조의 제3자 뇌물제공죄가 성립할 수 있다. (26.1차)","answer":true,"quote":"구청장인 피고인이 구청 관내의 공사 인·허가와 관련하여 甲 회사로부터 묵시적인 부정한 청탁을 받고 5억 원 상당의 경로당 누각을 제3자인 구(區)에 기부채납하게 하였다는 등의 제3자뇌물제공으로 기소된 사안에서, 공무원인 지방자치단체장이 직무에 관하여 부정한 청탁을 받고 지방자치단체에 금품을 제공하게 하였다면 공무원 개인이 금품을 취득한 경우와 동일시할 수는 없고 그 공무원이 단체를 대표하는 지위에 있는 경우에도 마찬가지여서 형법 제130조 의 제3자뇌물제공죄가 성립할 수 있으므로, 이와 달리 위 기부채납 재산을 취득한 지방자치단체인 구는 ‘제3자뇌물제공죄의 제3자’가 될 수 없다고 본 원심판단에 잘못이 있으나, 제반 사정에 비추어 甲 회사의 관계자들이 피고인의 요구를 받고 위 누각을 구에 기부채납한 것이 피고인의 직무와 관련한 부정한 청탁의 대가로 제공된 것이라고 단정할 수 없다는 이유로, 피고인에게 무죄를 선고한 원심판단의 결론은 정당하다고 한 사례.","cite":"대법원 2010도12313","badge":"","topic":"","from":"GY-2026-1-X-26","seq":null},{"id":"X-OX-549","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"참고인이 타인의 형사사건 등에 관하여 제3자와 대화를 하면서 허위로 진술하고 위와 같은 허위 진술이 담긴 대화 내용을 녹음한 녹음파일 또는 이를 녹취한 녹취록을 만들어 수사 기관 등에 제출하는 것은 증거위조죄를 구성하지 아니한다. (23.2차)","answer":false,"quote":"따라서 참고인이 타인의 형사사건 등에 관하여 제3자와 대화를 하면서 허위로 진술하고 위와 같은 허위 진술이 담긴 대화 내용을 녹음한 녹음파일 또는 이를 녹취한 녹취록을 만들어 수사기관 등에 제출하는 것은, 참고인이 타인의 형사사건 등에 관하여 수사기관에 허위의 진술을 하거나 이와 다를 바 없는 것으로서 허위의 사실확인서나 진술서를 작성하여 수사기관 등에 제출하는 것과는 달리, 증거위조죄를 구성한다.","cite":"대법원 2013도8085","badge":"","topic":"","from":"GY-2023-2-X-27","seq":null},{"id":"X-OX-550","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"위증죄는 법률에 의하여 선서한 증인이 사실에 관하여 기억에 반하는 진술을 한 때에 성립하고, 증인의 진술이 경험한 사실에 대한 법률적 평가이거나 단순한 의견에 지나지 아니하는 경우에는 위증죄에서 말하는 허위의 공술이라고 할 수 없으나, 경험한 객관적 사실에 대한 증인 나름의 법률적·주관적 평가나 의견을 부연한 부분에 다소의 오류나 모순이 있는 경우 위증죄가 성립한다. (23.2차)","answer":false,"quote":"경험한 사실에 덧붙인 법률적·주관적 평가나 의견에 다소의 오류·모순이 있어도 허위 진술이 아니어서 위증죄가 되지 않는다.","cite":"대법원 2008도11007 · 형법 제152조","badge":"","topic":"","from":"GY-2023-2-X-27","seq":null},{"id":"X-OX-508","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"사실의 증명을 위해 작성된 문서가 그 사실에 관한 내용이나 작성명의 등에 아무런 허위가 없다면 증거위조죄에서의 ‘증거 위조’에 해당한다고 볼 수 없는 것이고, 설령 사실증명에 관한 문서가 형사사건 또는 징계사건에서 허위의 주장에 관한 증거로 제출되어 그 주장을 뒷받침하게 되더라도 마찬가지이다. (22.1차)","answer":true,"quote":"증거위조죄에서 말하는 ‘위조’의 의미 / 사실의 증명을 위해 작성된 문서가 그 사실에 관한 내용이나 작성명의 등에 아무런 허위가 없는 경우, ‘증거위조’에 해당하는지 여부 (소극) 및 사실증명에 관한 문서가 형사사건 또는 징계사건에서 허위의 주장에 관한 증거로 제출되어 그 주장을 뒷받침하게 되더라도 마찬가지인지 여부 (적극)","cite":"대법원 2020도2642","badge":"","topic":"","from":"GY-2022-1-X-27","seq":null},{"id":"X-OX-532","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"인신구속에 관한 직무를 행하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속 영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 ｢형법｣ 제124조 제1항의 직권남용감금죄가 성립한다. (25.2차)","answer":true,"quote":"감금죄는 간접정범의 형태로도 행하여질 수 있는 것이므로, 인신구속에 관한 직무를 행하는 자 또는 이를 보조하는 자가 피해자를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 피해자를 구금하였다면 형법 제124조 제1항 의 직권남용감금죄가 성립한다.","cite":"대법원 2003도3945","badge":"","topic":"","from":"GY-2025-2-X-11","seq":null},{"id":"X-OX-504","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"자기 자신을 무고하기로 제3자와 공모하고 이에 따라 무고 행위에 가담한 경우 무고죄의 공동정범으로 처벌할 수 없다. (22.1차)","answer":true,"quote":"따라서 자기 자신을 무고하기로 제3자와 공모하고 이에 따라 무고행위에 가담하였더라도 이는 자기 자신에게는 무고죄의 구성요건에 해당하지 않아 범죄가 성립할 수 없는 행위를 실현하고자 한 것에 지나지 않아 무고죄의 공동정범으로 처벌할 수 없다.","cite":"대법원 2013도12592","badge":"","topic":"","from":"GY-2022-1-X-26","seq":null},{"id":"X-OX-511","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"경찰관들이 현행범으로 체포한 도박혐의자들에게 현행범인체포서 대신에 임의동행동의서를 작성하게 하고, 그나마 제대로 조사도 하지 않은 채 석방하였으며, 압수한 일부 도박자금에 관하여 압수조서 및 목록도 작성하지 않은 채 반환하고, 일부 도박혐의자의 명의도용 사실과 도박 관련 범죄로 수회 처벌받은 전력을 확인 하고서도 아무런 추가조사도 없이 석방한 경우, 그 경찰관들에게는 직무유기죄가 성립한다. (22.2차)","answer":true,"quote":"피고인들을 비롯한 경찰관들이 현행범으로 체포한 도박혐의자 17명에 대해 현행범인체포서 대신에 임의동행동의서를 작성하게 하고, 그나마 제대로 조사도 하지 않은 채 석방하였으며, 현행범인 석방사실을 검사에게 보고도 하지 않았고, 석방일시·사유를 기재한 서면을 작성하여 기록에 편철하지도 않았으며, 압수한 일부 도박자금에 관하여 압수조서 및 목록도 작성하지 않은 채 검사의 지휘도 받지 않고 반환하였고, 일부 도박혐의자의 명의도용 사실과 도박 관련 범죄로 수회 처벌받은 전력을 확인하고서도 아무런 추가조사 없이 석방한 사안에서, 이는 단순히 업무를 소홀히 수행한 것이 아니라 정당한 사유 없이 의도적으로 수사업무를 방임 내지 포기한 것이라고 봄이 상당하다는 이유로, 피고인들에 대하여 직무유기죄의 성립을 부정한 원심판단에 법리오해 또는 사실오인의 잘못이 있다고 한 사례.","cite":"대법원 2008도11226","badge":"","topic":"","from":"GY-2022-2-X-26","seq":null},{"id":"X-OX-562","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"위계에 의한 공무집행방해죄에서 ‘공무원의 직무집행’이란 법령의 위임에 따른 공무원의 적법한 직무집행인 이상 공권력의 행사를 내용으로 하는 권력적 작용으로, 사경제주체로서의 활동을 비롯한 비권력적 작용은 포함되지 않는다. (25.1차)","answer":false,"quote":"위계에 의한 공무집행방해죄는 행위목적을 이루기 위하여 상대방에게 오인, 착각, 부지를 일으키게 하여 이를 이용함으로써 법령에 의하여 위임된 공무원의 적법한 직무에 관하여 그릇된 행위나 처분을 하게 하는 경우에 성립하고, 여기에서 공무원의 직무집행이란 법령의 위임에 따른 공무원의 적법한 직무집행인 이상 공권력의 행사를 내용으로 하는 권력적 작용뿐만 아니라 사경제주체로서의 활동을 비롯한 비권력적 작용도 포함되는 것으로 봄이 상당하다.","cite":"대법원 2001도6349","badge":"","topic":"","from":"GY-2025-1-X-26","seq":null},{"id":"X-OX-517","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"피고인 자신이 직접 형사처분이나 징계처분을 받게 될 것을 두려워한 나머지 자기의 이익을 위하여 그 증거가 될 자료를 인멸하였다면, 그 행위가 동시에 다른 공범자의 형사사건이나 징계사건에 관한 증거를 인멸한 결과가 된다고 하더라도 이를 증거인멸죄로 다스릴 수 없다. (23.2차)","answer":true,"quote":"증거인멸죄는 타인의 형사사건 또는 징계사건에 관한 증거를 인멸하는 경우에 성립하는 것으로서, 피고인 자신이 직접 형사처분이나 징계처분을 받게 될 것을 두려워한 나머지 자기의 이익을 위하여 그 증거가 될 자료를 인멸하였다면, 그 행위가 동시에 다른 공범자의 형사사건이나 징계사건에 관한 증거를 인멸한 결과가 된다고 하더라도 이를 증거인멸죄로 다스릴 수 없고, 이러한 법리는 그 행위가 피고인의 공범자가 아닌 자의 형사사건이나 징계사건에 관한 증거를 인멸한 결과가 된다고 하더라도 마찬가지이다.","cite":"대법원 94도2608","badge":"","topic":"","from":"GY-2023-2-X-27","seq":null},{"id":"X-OX-527","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"행정청에 대한 일방적 통고로 효과가 완성되는 ‘신고’의 경우 에는 신고인이 신고서에 허위사실을 기재하거나 허위의 소명 자료를 제출하였더라도, 그것만으로는 담당 공무원의 구체적 이고 현실적인 직무집행이 방해받았다고 볼 수 없어 특별한 사정이 없는 한 허위 신고가 위계에 의한 공무집행방해죄를 구성한다고 볼 수 없다. (24.2차)","answer":true,"quote":"따라서 행정청에 대한 일방적 통고로 효과가 완성되는 ‘신고’의 경우에는 신고인이 신고서에 허위사실을 기재하거나 허위의 소명자료를 제출하였더라도, 그것만으로는 담당 공무원의 구체적이고 현실적인 직무집행이 방해받았다고 볼 수 없어 특별한 사정이 없는 한 허위 신고가 위계에 의한 공무집행방해죄를 구성한다고 볼 수 없다.","cite":"대법원 2015도17297","badge":"","topic":"","from":"GY-2024-2-X-26","seq":null},{"id":"X-OX-506","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"신고사실의 일부에 허위의 사실이 포함되어 있다고 하더라도 그 허위부분이 범죄의 성부에 영향을 미치는 중요한 부분이 아니고 단지 신고한 사실을 과장한 것에 불과한 경우에는 무고죄에 해당하지 아니하지만, 그 일부 허위인 사실이 국가의 심판작용을 그르치거나 부당하게 처벌을 받지 아니할 개인의 법적 안정성을 침해할 우려가 있을 정도로 고소사실 전체의 성질을 변경시키는 때에는 무고죄가 성립될 수 있다. (22.1차)","answer":true,"quote":"신고 사실을 다소 과장한 정도면 무고가 아니지만, 일부 허위가 고소사실 전체의 성질을 바꿀 정도면 무고죄가 성립한다.","cite":"대법원 2006도6347 · 형법 제156조","badge":"","topic":"","from":"GY-2022-1-X-26","seq":null},{"id":"X-OX-544","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"강도범인이 체포를 면탈할 목적으로 경찰관에게 폭행을 가한 때에는 강도죄와 공무집행방해죄는 상상적 경합관계에 있다. (23.2차)","answer":false,"quote":"절도범인이 체포를 면탈할 목적으로 경찰관에게 폭행 협박을 가한 때에는 준강도죄와 공무집행방해죄를 구성하고 양죄는 상상적 경합관계에 있으나, 강도범인이 체포를 면탈할 목적으로 경찰관에게 폭행을 가한 때에는 강도죄와 공무집행방해죄는 실체적 경합관계에 있고 상상적 경합관계에 있는 것이아니다.","cite":"대법원 92도917","badge":"","topic":"","from":"GY-2023-2-X-13","seq":null},{"id":"X-OX-548","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"피고인 자신을 위해 증인을 도피하게 한 행위가 동시에 다른 공범자의 형사사건이나 징계사건에 관한 증인을 도피하게 한 결과로 되는 경우 증인도피죄가 성립한다. (23.2차)","answer":false,"quote":"피고인 자신을 위해 증인을 도피하게 한 행위가 동시에 다른 공범자의 형사사건이나 징계사건에 관한 증인을 도피하게 한 결과로 되는 경우, 증인도피죄의 성립 여부 (소극)","cite":"대법원 2002도6134","badge":"","topic":"","from":"GY-2023-2-X-27","seq":null},{"id":"X-OX-525","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"비공무원이 공무원과 공동가공의 의사와 이를 기초로 한 기능적 행위지배를 통하여 공무원의 직무에 관하여 뇌물을 수수하는 범죄를 실행하였다면 공무원이 직접 뇌물을 받은 것과 동일하게 평가할 수 있으므로 공무원과 비공무원에게 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 공동정범이 성립한다. (24.2차)","answer":true,"quote":"따라서 공무원이 아닌 사람(이하 ‘비공무원’이라 한다)이 공무원과 공동가공의 의사와 이를 기초로 한 기능적 행위지배를 통하여 공무원의 직무에 관하여 뇌물을 수수하는 범죄를 실행하였다면 공무원이 직접 뇌물을 받은 것과 동일하게 평가할 수 있으므로 공무원과 비공무원에게 형법 제129조 제1항 에서 정한 뇌물수수죄의 공동정범이 성립한다.","cite":"대법원 2018도13792","badge":"","topic":"","from":"GY-2024-2-X-25","seq":null},{"id":"X-OX-507","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"피의자 등이 적극적으로 허위의 증거를 조작하여 제출하고 그 증거 조작의 결과 수사기관이 그 진위에 관하여 나름대로 충실한 수사를 하더라도 제출된 증거가 허위임을 발견하지 못할 정도에 이르렀다면, 이는 위계에 의하여 수사기관의 수사행위를 적극적 으로 방해한 것으로서 위계공무집행방해죄가 성립된다. (22.1차)","answer":true,"quote":"수사기관이 범죄사건을 수사함에 있어서는 피의자나 참고인의 진술 여하에 불구하고 피의자를 확정하고 그 피의사실을 인정할 만한 객관적인 제반 증거를 수집·조사하여야 할 권리와 의무가 있는 것이고, 한편, 피의자는 진술거부권과 자기에게 유리한 진술을 할 권리와 유리한 증거를 제출할 권리가 있지만 수사기관에 대하여 진실만을 진술하여야 할 의무가 있는 것은 아니며, 또한 수사기관에서의 참고인은 형사소송절차에서 선서를 한 증인이 허위로 공술을 한 경우에 위증죄가 성립하는 것과 달리 반드시 진실만을 말하도록 법률상의 의무가 부과되어 있는 것은 아니므로, 피의자나 참고인이 피의자의 무고함을 입증하는 등의 목적으로 수사기관에 대하여 허위사실을 진술하거나 허위의 증거를 제출하였다 하더라도, 수사기관이 충분한 수사를 하지 아니한 채 이와 같은 허위의 진술과 증거만으로 잘못된 결론을 내렸다면, 이는 수사기관의 불충분한 수사에 의한 것으로서 피의자 등의 위계에 의하여 수사가 방해되었다고 볼 수 없어 위계에 의한 공무집행방해죄가 성립된다고 할 수 없을 것이나, 피의자나 참고인이 피의자의 무고함을 입증하는 등의 목적으로 적극적으로 허위의 증거를 조작하여 제출하였고 그 증거 조작의 결과 수사기관이 그 진위에 관하여 나름대로 충실한 수사를 하더라도 제출된 증거가 허위임을 발견하지 못하여 잘못된 결론을 내리게 될 정도에 이르렀다면, 이는 위계에 의하여 수사기관의 수사행위를 적극적으로 방해한 것으로서 위계에 의한 공무집행방해죄가 성립된다.","cite":"대법원 2003도1609","badge":"","topic":"","from":"GY-2022-1-X-27","seq":null},{"id":"X-OX-551","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"무고죄는 국가의 형사사법권의 적정한 행사뿐만 아니라 개인이 부당하게 처벌받지 아니할 이익을 부수적으로 보호하는 죄이기에, 피무고자의 승낙이 있는 경우에는 위법성이 조각된다. (24.1차)","answer":false,"quote":"무고죄는 국가의 형사사법권 또는 징계권의 적정한 행사를 주된 보호법익으로 하고 다만, 개인의 부당하게 처벌 또는 징계받지 아니할 이익을 부수적으로 보호하는 죄이므로, 설사 무고에 있어서 피무고자의 승낙이 있었다고 하더라도 무고죄의 성립에는 영향을 미치지 못한다 할 것이고, 무고죄에 있어서 형사처분 또는 징계처분을 받게 할 목적은 허위신고를 함에 있어서 다른 사람이 그로 인하여 형사 또는 징계처분을 받게 될 것이라는 인식이 있으면 족한 것이고 그 결과발생을 희망하는 것까지를 요하는 것은 아니므로, 고소인이 고소장을 수사기관에 제출한 이상 그러한 인식은 있었다고 보아야 한다.","cite":"대법원 2005도2712","badge":"","topic":"","from":"GY-2024-1-X-04","seq":null},{"id":"X-OX-510","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"국헌문란의 목적을 달성하기 위해 그러한 목적이 없는 대통령을 이용하여 비상계엄 전국확대조치를 한 것은 간접정범의 방법 으로 내란죄를 실행한 것이다. (22.2차)","answer":true,"quote":"목적범에서 목적 없는 사람을 도구로 이용하면 목적을 가진 이용자가 간접정범이 된다 — 비상계엄 전국확대가 그 예다.","cite":"대법원 96도3376","badge":"","topic":"","from":"GY-2022-2-X-07","seq":null},{"id":"X-OX-534","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"병원에서 의약품 선정‧구매 업무를 담당하는 약국장이 병원을 대신하여 제약회사로부터 의약품 제공의 대가로 기부금 명목의 돈을 받아 보관하던 중 임의소비한 경우, 업무상 횡령죄가 성립한다. (25.2차)","answer":true,"quote":"병원에서 의약품 선정·구매 업무를 담당하는 약국장이 병원을 대신하여 제약회사로부터 의약품 제공의 대가로 기부금 명목의 돈을 받아 보관중 임의소비한 사안에서, 위 돈은 병원이 약국장에게 불법원인급여를 한 것에 해당하지 않아 여전히 반환청구권을 가지므로, 업무상 횡령죄가 성립한다고 본 사례","cite":"대법원 2007도2511","badge":"","topic":"","from":"GY-2025-2-X-21","seq":null},{"id":"X-OX-552","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"수뢰자가 뇌물로 받은 수표를 은행에 예금한 후 그 수표금액에 상당하는 금전을 찾아 증뢰자에게 반환한 경우, 증뢰자로부터 그 가액을 추징하여야 한다. (24.1차)","answer":false,"quote":"뇌물로 받은 수표를 은행에 예금한 경우 그 예금행위는 뇌물의 처분행위에 해당하여 그 후 수뢰자가 그 액면에 상당하는 금전을 찾아서 증뢰자에게 반환하였다 하더라도 이를 뇌물 그 자체의 반환으로 볼 수 없으므로 이러한 경우에는 수뢰자로부터 그 가액을 추징하여야 한다.","cite":"대법원 69도2461","badge":"","topic":"","from":"GY-2024-1-X-12","seq":null},{"id":"X-OX-536","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"허위로 신고한 사실이 무고행위 당시 형사처분의 대상이 될 수 있었던 경우에는 무고죄가 기수에 이르고, 이후 그러한 사실이 형사범죄가 되지 않는 것으로 판례가 변경되었더라도 특별한 사정이 없는 한 이미 성립한 무고죄에는 영향을 미치지 않는다. (25.2차)","answer":true,"quote":"그러나 허위로 신고한 사실이 무고행위 당시 형사처분의 대상이 될 수 있었던 경우에는 국가의 형사사법권의 적정한 행사를 그르치게 할 위험과 부당하게 처벌받지 않을 개인의 법적 안정성이 침해될 위험이 이미 발생하였으므로 무고죄는 기수에 이르고, 이후 그러한 사실이 형사범죄가 되지 않는 것으로 판례가 변경되었더라도 특별한 사정이 없는 한 이미 성립한 무고죄에는 영향을 미치지 않는다.","cite":"대법원 2015도15398","badge":"","topic":"","from":"GY-2025-2-X-27","seq":null},{"id":"X-OX-540","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"뇌물죄에서 수뢰액은 다과에 따라 범죄구성요건이 되므로 엄격한 증명의 대상이 되고, ｢특정범죄 가중처벌 등에 관한 법률｣에서 정한 범죄구성요건이 되지 않는 단순 뇌물죄의 경우에도 몰수‧추징의 대상이 되는 까닭에 역시 증거에 의하여 인정되어야 하며, 수뢰액을 특정할 수 없는 경우에는 가액을 추징할 수 없다. (26.1차)","answer":true,"quote":"뇌물죄에서 수뢰액은 다과에 따라 범죄구성요건이 되므로 엄격한 증명의 대상이 되고, 특정범죄 가중처벌 등에 관한 법률에서 정한 범죄구성요건이 되지 않는 단순 뇌물죄의 경우에도 몰수·추징의 대상이 되는 까닭에 역시 증거에 의하여 인정되어야 하며, 수뢰액을 특정할 수 없는 경우에는 가액을 추징할 수 없다.","cite":"대법원 2009도2453","badge":"","topic":"","from":"GY-2026-1-X-37","seq":null},{"id":"X-OX-522","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"증인의 증언은 그 전부를 일체로 관찰･판단하는 것이므로 선서한 증인이 일단 기억에 반하는 허위의 진술을 하였더라도 그 신문이 끝나기 전에 그 진술을 철회･시정한 경우 위증이 되지 않는다. (24.1차)","answer":true,"quote":"증인의 증언은 그 전부를 일체로 관찰 판단하는 것이므로 선서한 증인이 일단 기억에 반하는 허위의 진술을 하였더라도 그 신문이 끝나기 전에 그 진술을 철회 시정한 경우 위증이 되지 아니한다.","cite":"대법원 93도2510","badge":"","topic":"","from":"GY-2024-1-X-27","seq":null},{"id":"X-OX-509","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"경찰공무원이 지명수배 중인 범인을 발견하고도 직무상 의무에 따른 적절한 조치를 취하지 아니하고 오히려 범인을 도피하게 하는 행위를 한 경우, 범인도피죄만이 성립하고 직무유기죄는 따로 성립하지 아니한다. (22.1차)","answer":true,"quote":"경찰공무원이 지명수배 중인 범인을 발견하고도 직무상 의무에 따른 적절한 조치를 취하지 아니하고 오히려 범인을 도피하게 하는 행위를 한 경우, 범인도피죄 외에 직무유기죄가 따로 성립하는지 여부 (소극)","cite":"대법원 2015도1456","badge":"","topic":"","from":"GY-2022-1-X-27","seq":null},{"id":"X-OX-577","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"위증죄에는 ｢형법｣ 제151조에 따른 친족간의 특례규정과 ｢형법｣ 제153조에 따른 자백･자수의 특례규정이 모두 적용된다. (26.1차)","answer":false,"quote":"친족 특례는 범인은닉·도피죄에만 있고, 위증죄에는 재판 확정 전에 자백·자수하면 형을 감면하는 특례만 적용된다.","cite":"형법 제151조 · 형법 제153조","badge":"","topic":"","from":"GY-2026-1-X-27","seq":null},{"id":"X-OX-546","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"피의자나 참고인이 아닌 자가 자발적이고 계획적으로 피의자를 가장하여 수사기관에 대하여 허위사실을 진술한 경우 위계에 의한 공무집행방해죄가 성립한다. (23.2차)","answer":false,"quote":"형사 피의자와 수사기관이 대립적 위치에서 서로 공격방어를 할 수 있는 취지의 형사소송법의 규정과 법률에 의한 선서를 한 증인이 허위로 진술을 한 경우에 한하여 위증죄가 성립된다는 형법의 규정 취지에 비추어 수사기관이 범죄사건을 수사함에 있어서는 피의자나 피의자로 자처하는 자 또는 참고인의 진술여하에 불구하고 피의자를 확정하고 그 피의사실을 인정할 만한 객관적인 제반증거를 수집 조사하여야 할 권리와 의무가 있는 것이라고 할 것이므로 피의자나 참고인이 아닌 자가 자발적이고 계획적으로 피의자를 가장하여 수사기관에 대하여 허위사실을 진술하였다 하여 바로 이를 위계에
