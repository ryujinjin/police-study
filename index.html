"수사상 증거보전(제184조)·증인신문(제221조의2)의 청구 주체 서술은 개정 후 검사·사법경찰관 역할을 확인해야 합니다."],["2023-2","형사법",32,"구속에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","항소법원이 구속기간의 만료로 피고인에 대한 구속의 효력이 상실된 후 피고인에 대한 판결을 선고하면서 피고인을 구속하였다 하여 ｢형사소송법｣ 제208조의 규정에 위배되는 재구속 또는 이중구속이라 할 수 없다.","구속적부심사 청구에 대한 법원의 기각결정 및 석방결정에 대해서는 항고할 수 없지만, 보증금납입조건부 석방결정에 대해서는피의자나 검사가그취소의 실익이있으면｢형사소송법｣ 제402조에 의하여 항고할 수 있다.","지방법원 판사가 구속기간의 연장을 허가하지 않는 결정을 하더라도 ｢형사소송법｣ 제402조 또는 제403조가 정하는 항고의 방법으로는 불복할 수 없으며, 다만, ｢형사소송법｣ 제416조가 정하는 준항고의 대상이 될 뿐이다.","구속의 효력은 원칙적으로 ｢형사소송법｣ 제75조 제1항의 방식에 따라 작성된 구속영장에 기재된 범죄사실에만 미치는 것이므로, 구속기간이 만료될 무렵에 종전 구속영장에 기재된 범죄사실과 다른 범죄사실로 피고인을 구속하였다는 사정만으로는 피고인에 대한 구속이 위법하다고 할 수 없다.",2,0,""],["2023-2","형사법",33,"전자정보 압수･수색에 관한 다음 설명 중 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 수사기관이 압수･수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 클라우드에 저장된 전자정보를 압수･수색하기 위해서는 압수･ 수색영장에 적힌 ‘압수할 물건’에 별도로 원격지 클라우드 저장 전자정보가 특정되어 있어야 한다. ㉡ 수사기관이 전자정보에 대한 압수･수색이 종료되기 전에 혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도 범죄혐의와 관련된 전자정보를 우연히 발견한 경우, 대법원은 ‘우연한 육안발견 원칙(plain view doctrine)’에 의해 별도의 영장 없이 우연히 발견한 별도 범죄혐의와 관련된 전자정보를 압수･수색할 수 있다고 판시하였다. ㉢ 수사기관이 피의자의 이메일 계정에 대한 접근권한에 갈음 하여 발부받은 압수･수색영장에 따라, 원격지의 저장매체에 적법하게 접속하여 내려받거나 현출된 전자정보를 대상으로 하여 범죄 혐의사실과 관련된 부분에 대하여 압수･수색하는 것은 특별한 사정이 없는 한 허용되지만, 원격지 저장매체가 국외에 있는 경우에는 허용되지 않는다. ㉣ 수사기관이 범죄 혐의사실과 관련 있는 정보를 선별하여 압수한 후에도 그와 관련이 없는 나머지 정보를 법원의 영장 내용에 반하여 삭제･폐기･반환하지 아니한 채 그대로 보관하고 있다면, 범죄 혐의사실과 관련이 없는 부분에 대하여는 압수의 대상이 되는 전자정보의 범위를 넘어서는 전자정보를 영장 없이 압수･수색하여 취득한 것이어서 위법하다. ㉤ 피의자가 휴대전화를 임의제출하면서 휴대전화에 저장된 전자정보가 아닌 클라우드 등 제3자가 관리하는 원격지에 저장되어 있는 전자정보를 수사기관에 제출한다는 의사로 수사기관에게 클라우드 등에 접속하기 위한 아이디와 비밀 번호를 임의로 제공하였다면 위 클라우드 등에 저장된 전자 정보를 임의제출하는 것으로 볼 수 있다.","1개","2개","3개","4개",1,0,""],["2023-2","형사법",34,"거증책임에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","법위반에 대한 정당한 사유가 없다는 사실은 범죄구성요건 이므로 검사가 증명해야 하는데, 다만 진정한 양심의 부존재와 같은 사실을 증명하는 것은 사회통념상 불가능한 반면 그 존재를 주장･증명하는 것이 좀 더 쉬우므로 이러한 사정은 검사가 증명책임을 다하였는지 판단할 때 고려해야 한다.","진술증거의 증거능력 인정 여부와 관련하여 진술의 임의성에 다툼이 있을 때에는 그 임의성을 의심할 만한 합리적이고 구체적인사실을피고인이증명할것이아니고검사가그임의성의 의문점을 없애는 증명을 하여야 한다.","｢공직선거법｣상 허위사실공표죄에서 공표된 사실이 실제로 존재한다고 주장하는 자는 그러한 사실의 존재를 수긍할 만한 소명자료를 제시할 부담을 지고, 이때 제시하여야 할 소명자료는 적어도 허위성에 관한 검사의 증명활동이 현실적으로 가능할 정도의 구체성은 갖추어야 한다.","공연성은 명예훼손죄의 구성요건으로서, 특정 소수에 대한 사실적시의 경우 공연성이 부정되는 유력한 사정이 될 수 있으므로 전파될 가능성에 관하여는 검사에게 증명의 책임이 있음이 원칙이나, 전파될 가능성은 특정되지 않은 기간과 공간에서 아직 구체화되지 않은 사실이므로 그 증명의 정도는 자유로운 증명으로 족하다.",3,0,""],["2023-2","형사법",35,"위법수집증거배제법칙에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","사법경찰관이 ｢형사소송법｣ 제215조 제2항을 위반하여 영장 없이 물건을 압수한 경우라도, 그러한 압수 직후 피고인으로 부터그압수물에대한임의제출동의서를작성받았고그 동의서를 작성받음에 사법경찰관에 의한 강요나 기망의 정황이 없었다면, 그 압수물은 임의제출의 법리에 따라 유죄의 증거로 할 수 있다.","기본권의 본질적 영역에 대한 보호는 국가의 기본적 책무이고 사인 간의 공개되지 않은 대화에 대한 도청 및 감청을 불법으로 간주하는 ｢통신비밀보호법｣의 취지 등을 종합적으로 고려하면 제3자가 권한 없이 개인의 전자우편을 무단으로 수집한 것은 비록 그 전자우편 서비스가 공공적 성격을 가지는 것이라고 하더라도 증거로 제출하는 것이 허용될 수 없다.","｢형사소송법｣ 제218조에 의하여 영장 없이 압수할 수 있는 유류물의 압수 후 압수조서의 작성 및 압수목록의 작성 교부 절차가 제대로 이행되지 아니한 잘못이 있더라도 이는 위법 수집증거의 배제법칙에 비추어 증거능력의 배제가 요구되는 경우에 해당한다고 볼 수는 없다.","경찰이 영장에 의해 압수된 피고인의 휴대전화를 탐색하던 중 영장에 기재된 범죄사실이 기록된 파일을 발견하여 이를 별도의 저장매체에 복제･출력한 경우, 이러한 탐색･복제･출력의 과정에서 피고인에게 참여의 기회를 부여하지 않았어도 사후에 그 파일에 대한 압수･수색영장을 발부받아 절차가 진행되었다면 적법하게 수집된 증거이다.",2,0,""],["2023-2","형사법",36,"자백배제법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피고인의 자백이 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에는 유죄의 증거가 될 수 없으며, 자백의 임의성이 인정되는 경우라도 수사기관에서의 신문절차에서 미리 진술거부권을 고지받지 아니하고 행한 것이라면 이는 위법하게 수집된 증거로서 증거능력이 부인되어야 한다.","자백은 일단 자백하였다가 이를 번복 내지 취소하더라도 그 효력이 없어지는 것은 아니기에, 피고인이 항소이유서에 ‘돈이 급해 지어서는 안될 죄를 지었습니다.’, ‘진심으로 뉘우치고 있습니다.’라고 기재하였고 항소심 공판기일에 그 항소이유서를 진술하였다면, 이어진 검사의 신문에 범죄사실을 부인하였고 수사단계에서도 일관되게 범죄사실을 부인하여 온 사정이 있다고 하더라도 피고인이 자백한 것으로 볼 수 있다.","피고인의 자백이 신문에 참여한 검찰주사가 피의사실을 자백하면 피의사실 부분은 가볍게 처리하고 부가적인 보안처분의 청구를 하지 않겠다는 각서를 작성하여 주면서 자백을 유도한 것에 기인한 것이라면 그 자백은 증거로 할 수 없다.","｢형사소송법｣ 제309조소정의사유로임의성이없다고의심할 만한 이유가 있는 자백은 그 인과관계의 존재가 추정되는 것이므로 이를 유죄의 증거로 하려면 적극적으로 그 인과관계가 존재하지 아니하는 것이 인정되어야 할 것이다.",1,0,""],["2023-2","형사법",37,"전문증거에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","A가 B에게 행한 진술이 기재된 서류가 A가 그러한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 서류의 증거능력을 인정한 다음 그 사실을 다시 A의 B에대한진술내용이나그진실성을증명하는간접사실로사용하는 경우, 그 서류는 전문증거에 해당한다.","알선자인 피고인으로부터 전화를 통해 “건축허가 담당 공무원이 외국연수를 가므로 사례비를 주어야 한다.”는 말을 들은 증인이 피고인의 알선수재 피고사건에 대해 그러한 말을 들었다고 법정에서 진술한 것은 전문증거에 해당한다.","피고인이 피해자에게 보낸 협박문자를 피해자가 화면캡쳐의 방식으로 촬영한 사진은 피고인의 협박죄 피고사건에 대해서는 전문증거에 해당하지 않는다.","A가 피해자들을 흉기로 살해하면서 “이것은 신의 명령을 집행하는 것이다.”라고 말하였는데 이 말을 들은 B가 법정에서 A의 정신상태를 증명하기 위해 그 내용을 증언하는 경우 이 진술은 전문증거에 해당하지 않는다.",1,0,""],["2023-2","형사법",38,"전문법칙의 예외에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","A가 B와의 개별면담에서 대화한 내용을 피고인 甲에게 불러 주었고, 그 내용이 기재된 甲의 업무수첩이 그 대화내용을 증명하기 위한 진술증거인 경우에는 피고인이 작성한 진술서에 대한｢형사소송법｣ 제313조제1항에따라증거능력을판단해야한다.","공소제기 전에 피고인을 피의자로 조사했던 사법경찰관이 공판기일에 피고인의 진술을 그 내용으로 하여 한 진술을 증거로 하기 위해서는 사법경찰관이 피의자였던 피고인으로부터 진술을 들을 당시 피고인이 증언능력에 준하는 능력을 갖춘 상태에 있었어야 한다.","피해자가 제1심 법정에서 수사기관에서의 진술조서에 대해 실질적진정성립을부인하는취지로진술하였다면, 이후 피해자가 사망하였더라도피해자를조사하였던 조사자에의한 수사기관에서 이루어진 피해자의 진술을 내용으로 하는 제2심 법정에서의 증언은 증거능력이 없다.","법원이 구속된 피의자를 심문하고 그에 대한 피의자의 진술 등을 기재한 구속적부심문조서는 ｢형사소송법｣ 제315조 제3호의 ‘특히신용할만한정황에의하여작성된문서’에해당하여피고인이 증거로 함에 부동의하더라도 당연히 그 증거능력이 인정된다.",0,0,""],["2023-2","형사법",39,"자유심증주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰에서의 진술조서의 기재와 당해 사건의 공판정에서의 같은 사람의 증인으로서의 진술이 상반되는 경우 반드시 공판정에서의 증언에 따라야 한다는 법칙은 없고 그 중 어느 것을 채용하여 사실인정의 자료로 할 것인가는 오로지 사실심법원의 자유심증에 속하는 것이다.","호흡측정기에 의한 음주측정치와 혈액검사에 의한 음주측정치가 다른 경우에 혈액채취에 의한 검사 결과를 믿지 못할 특별한 사정이 없는 한, 혈액검사에 의한 음주측정치가 호흡측정기에 의한 음주측정치보다 측정 당시의 혈중알코올농도에 더 근접한 음주측정치라고 보는 것이 경험칙에 부합한다.","‘성추행 피해자가 추행 즉시 행위자에게 항의하지 않은 사정’이나 ‘피해 신고 시 성폭력이 아닌 다른 피해 사실을 먼저 진술한 사정’만으로 곧바로 피해자 진술의 신빙성을 부정할 것은 아니고, 가해자와의 관계와 피해자의 구체적 상황을 모두 살펴 판단 하여야 한다.","형사재판에서 이와 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이므로, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건 확정판결의 사실판단을 그대로 채택하기 어렵다고 인정되는 면이 있다고 하여도 이를 배척할 수는 없다.",3,0,""],["2023-2","형사법",40,"다음 사례에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 연구실을 함께 운영하는 甲과 乙은 소속 연구원들에 대한 인건비 지급 명목으로 X 학교법인에 지원금 지급을 신청하여 지급받은 금원을 연구실 운영비로 사용하기로 공모하였다. 이에 따라 甲은 2022년 1월부터 12월까지 매월 1회 지급신청을 하고 해당 금액을 지급받는 동일한 방식으로 총 12회에 걸쳐 연구원 인건비 명목으로 X 학교법인으로부터 합계 1억원 상당을 송금 받았다. 다만, 乙은 2022년 8월에 퇴직하여 이후의 연구실 운영에는 관여하지 않았다. 이후 甲과 乙에 대한 재판에서 검사는 ‘연구실원 A에 대한 참고인 진술조서’(이하, ‘조서’라 한다)를 증거로 제출하였으나, 공판기일에 증인으로 출석한 A는 甲과의 관계를 우려하여 조서의 진정성립을 비롯한 일체의 증언을 거부하였다.","甲과乙이2022년1월부터12월까지금원을지급받은것이사기죄에 해당하는 경우, 각 지급행위시마다 별개의 사기죄가 성립한다.","A가 증언을 거부하면 甲의 반대신문권이 보장되지 않는 것인데, 이 경우 A의 증언거부가 정당한 증언거부권의 행사라 하더라도 甲의반대신문권이보장되지않는다는점에서는아무런차이가없다.","乙은 퇴직 이후에 甲이 금원을 송금받은 부분에 대해서는 사기죄의 죄책을 부담하지 않는다.","만약 A가 법정에서 증언을 거부하지 않고 조서에 대해 “기재된 바와 같이 내가 말한 것은 맞는데, 그건 일부러 거짓말을 한 것이다.”라고 진술하게 되면 조서는 증거로 사용할 수 없게 된다.",1,0,""],["2023-2","경찰학",1,"경찰개념에 관한 설명으로 가장 적절하지 않은 것은?","경찰개념은 역사적으로 발전되고 형성된 개념이므로, 근대국가 에서의 일반적인 경찰개념을 ‘공공의 안녕과 질서유지를 위한 권력작용’이라고 할 경우, 이는 각국의 실정법상 경찰개념과 반드시 일치한다고는 할 수 없다.","실질적 의미의 경찰을 보안경찰과 협의의 행정경찰로 구분하는 것이 일반적 견해라고 할 때, 보안경찰은 독립적인 경찰기관이 관할하지만, 협의의 행정경찰은 각종의 일반행정기관이 함께 그것을 관장하는 경우가 많다.","18∼19세기에 등장한 법치국가는 절대주의적 경찰국가에 대항하는 의미에서 자유주의적 법치국가의 성격을 띠었고, 이와 같은 법치국가적 경찰개념이 처음으로 법제화된 경우로는 1794년의 ‘프로이센 일반란트법’을 들 수 있다.","경찰의 개념을 형식적 의미의 경찰과 실질적 의미의 경찰로 구분할때, 사법경찰(수사경찰)은실질적의미의 경찰에 포함된다.",3,0,""],["2023-2","경찰학",2,"경찰의 위험방지 임무에서 말하는 ‘위험’에 관한 설명으로 가장 적절하지 않은 것은?","경찰개입의 대상이 되는 위험은 행위책임에 기인한 것일 수도 있고 상태책임에 기인한 것일 수도 있다.","외관상 위험이 존재할 때의 경찰개입이 적법하더라도, 원칙적으로 국가의 손해배상책임을 발생시킨다.","경찰의 범죄예방 및 위험방지 행위의 준비는 추상적 위험이 존재하는 경우에도 가능하다.","위험혐의의 존재는 위험조사차원의 경찰개입을 정당화시킨다.",1,0,""],["2023-2","경찰학",3,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣상 시･도 자치경찰위원회에 관한 설명으로 가장 적절한 것은?","동법 제18조 제1항 단서에 따라 2개의 시･도자치경찰위원회를 두는 경우 해당 시･도자치경찰위원회의 명칭, 관할구역, 사무분장, 그 밖에 필요한 사항은 행정안전부령으로 정한다.","시･도자치경찰위원회 비상임 위원은 특정 성(性)이 10분의 6을 초과하지 아니해야 한다.","시･도자치경찰위원회 위원장과 위원의 임기는 3년으로 하되, 위원만 한 차례 연임할 수 있다.","시･도자치경찰위원회의 회의는 정기적으로 개최하여야 한다. 다만 위원장이 필요하다고 인정하는 경우, 위원 2명 이상이 요구하는 경우 및 시･도지사가 필요하다고 인정하는 경우에는 임시회의를 개최할 수 있다.",3,0,""],["2023-2","경찰학",4,"경찰조직의 냉소주의에 관한 설명으로 가장 적절한 것은?","니더호퍼(Niederhoffer)는 사회체계에 대한 기존의 신념체제가 붕괴된 후 새로운 신념체제에 의해 급하게 대체될 때 냉소주의가 나타날 수 있다고 하였다.","조직 내 팽배한 냉소주의는 경찰의 전문직업화를 저해하는 기제로 작동할 수 있다.","회의주의와 비교할 때, 냉소주의는 조직 내 특정한 대상을 합리적 의심을 통해 신뢰하지 않는 것과 관련이 있다.","냉소주의 극복을 위한 가장 효과적인 조직관리방안은 인간을 본래 게으르고 생리적 욕구 또는 안전의 욕구에 자극을 주는 금전적 보상이나 제재 등 외재적 유인에 반응한다고 상정하여 조직이 권위적으로 관리할 필요가 있다는 맥그리거(McGregor)의 인간모형에 기초한다.",1,0,""],["2023-2","경찰학",5,"부정부패에 관한 설명으로 가장 적절하지 않은 것은?","작은호의를제공받은경찰관이도덕적부채를느껴이를 보충하기 위해 결과적으로 선한 후속행위를 하는 상황은 미끄러운 경사 (slippery slope) 가설의 맥락에서 이해할 수 있다.","대의명분 있는 부패(noble cause corruption)와 Dirty Harry 문제는 부패의 개념적 징표를 개인적 이익 추구를 넘어 조직 혹은 사회적 차원의 이익 추구로 확대하고자 하는 시도라고 볼 수 있다. 찰 학】(일반공채･101경비단･경행 경채)","고객이 위험을 감수하고서라도 원하는 이익을 확실히 취하기 위해 높은 가격의 뇌물을 지불하는 상황을 부패로 이해한다면, 이는 하이덴하이머(Heidenheimer)가 제시한 세 가지 유형의 부정부패 정의 중 시장중심적 정의와 가장 관련이 크다.","공직자가 직무와 관련하여 그 지위 또는 권한을 남용하거나 법령을 위반하여 자기 또는 제3자의 이익을 도모하는 행위는 ｢부패방지 및 국민권익위원회의 설치와 운영에 관한 법률｣상 부패행위에 해당한다.",0,0,""],["2023-2","경찰학",6,"코헨(Cohen)과 펠드버그(Feldberg)가 사회계약설로부터 도출한 경찰활동의기준과그내용의연결이가장적절하지않은 것은?","생명과 재산의 안전보호 - 경찰활동은 시민의 생명과 재산의 보호가 궁극적인 목적이며 법집행 자체가 목적은 아니다.","냉정하고 객관적인 자세 - 과거 아버지의 가정폭력을 경험한 甲경찰관이 가정폭력 사건을 처리하면서 모든 문제는 남편에게 있다고 단정지어 생각하는 경우는 이 기준에 어긋난다.","공공의 신뢰 - 乙경찰관이 공명심이 앞서서 상부에 보고도 없이 탈주범을 혼자서 검거하려다 실패하였다면 이 기준에 어긋난다.","공정한 접근 보장 - 경찰의 법집행 과정에서 발생하는 차별과 편들기는 이 기준에 어긋난다.",2,0,""],["2023-2","경찰학",7,"｢부정청탁 및 금품등 수수의 금지에 관한 법률｣ 및 동법 시행령에 관한 설명으로 가장 적절하지 않은 것은?","공직자등은 직무 관련 여부 및 기부･후원･증여 등 그 명목에 관계없이 동일인으로부터 1회에 100만 원 또는 매 회계연도에 300만 원을 초과하는 금품등을 받거나 요구 또는 약속해서는 아니 된다.","경찰청에서 근무하는 甲총경은 A전자회사의 요청으로 시간 당 30만 원의 사례금을 약속받고 A전자회사의 직원을 대상으로 자신의 직무와 관련된 3시간짜리 강의를 월 1회, 총 3개월간 진행하였다. 이 경우 甲총경이 지급받을 수 있는 최대사례금 총액은 270만 원이다.","B자동차회사의 요청으로 자신의 직무와 관련된 외부강의를 마치고 소정의 사례금을 약속받은 乙경무관은 대통령령으로 정하는 바에 따라 외부강의의 요청 명세 등을 소속기관장에게 그외부강의를마친날부터10일이내에서면으로신고하여야한다.","사단법인 C학회가 주관 및 개최한 토론회에 참석하여 자신의 직무와 관련된 토론을 한 丙경감이 상한액을 초과하는 사례금을 받은 경우 초과사례금을 받은 사실을 안 날부터 2일 이내에 동법 시행령이 정한 사항을 적은 서면으로 소속기관장에게 신고 하여야 한다.",1,0,""],["2023-2","경찰학",8,"｢경찰 인권보호 규칙｣상 경찰청 및 시･도경찰청 인권위원회에 관한 설명으로 가장 적절한 것은?","당연직 위원은 경찰청은 청문감사인권담당관, 시･도경찰청은 감사관으로 한다.","경찰청 인권위원회와 시･도경찰청 인권위원회 각각의 위원장과 위촉 위원의 임기는 위촉된 날로부터 2년으로 하며 위원장의 직은 연임할 수 없고, 위촉 위원은 세 차례만 연임할 수 있다.","경찰청 인권위원회와 시･도경찰청 인권위원회의 정기회의는 각각 분기 1회 개최한다.","경찰의 직에 있거나 그 직에서 퇴직한 날부터 3년이 지나지 아니한 사람은 경찰청 인권위원회나 시･도경찰청 인권위원회의 위촉 위원이 될 수 없다.",3,0,""],["2023-2","경찰학",9,"｢적극행정 운영규정｣ 및 ｢경찰청 적극행정 면책제도 운영 규정｣에 관한 설명으로 가장 적절하지 않은 것은?","｢적극행정 운영규정｣상 공무원이 적극행정을 추진한 결과에 대해 그의 행위에 고의 또는 중대한 과실이 없는 경우에는 징계 관련 법령에 따라 징계의결 또는 징계부가금 부과의결을 하지 않는다.","｢경찰청 적극행정 면책제도 운영규정｣에 의한 면책은 경찰청 및 그 소속기관의공무원 또는 산하단체의 임･직원 등에게적용된다.","｢경찰청 적극행정 면책제도 운영규정｣ 제5조 제1항 제3호의 요건을 적용하는 경우 자체감사를 받는 사람이 ‘대상 업무를 처리하면서 중대한 절차상의 하자가 없었을 것’과 ‘자체감사를 받는 사람과 대상 업무 사이에 사적인 이해관계가 없을 것’이라는 요건을 모두 갖추어 업무를 처리한 것으로 인정되는 경우에는 그 행위에 고의나 중대한 과실이 없는 경우에 해당하는 것으로 추정한다.","｢적극행정 운영규정｣ 제18조의3은 “누구든지 공무원의 소극행정을 국가인권위원회가 운영하는 소극행정 신고센터에 신고할 수 있다.”고 규정하고 있다.",3,0,""],["2023-2","경찰학",10,"‘지역사회경찰활동’(Community Policing)에 관한 설명으로 가장 적절하지 않은 것은?","범죄가 자주 발생하는 지점에 경찰력을 집중적으로 배치하여 범죄예방효과를 극대화하는 데 중점을 둔다.","경찰활동의목적과우선순위를결정할때시민의참여가중요하다.","사후적 대응보다 사전적 예방 중심의 경찰활동 전개에 주력한다.","경찰은 지역사회 내 지방자치단체, 학교 등 공적 주체들은 물론 시민단체 등 사적 주체들과도 파트너십을 형성할 필요가 있다.",0,0,""],["2023-2","경찰학",11,"다음은 경찰이 수행하는 범죄예방활동 사례(<보기 1>)와 톤리와 패링턴(Tonry & Farrington)의 구분에 따른 범죄예방 전략 유형(<보기 2>)이다. <보기 1>과 <보기 2>의 내용이 가장 적절하게 연결된 것은? <보 기 1> (가) 경찰서의 여성청소년 담당부서에서 운영하고 있는 학교전담 경찰관(SPO)은 학교에 배치되어 학교폭력예방교육 등 학교 폭력 관련 예방과 가해학생 선도 등 사후관리 역할을 담당하고, 학대예방경찰관(APO)은 미취학 혹은 장기결석 아동에 대해 점검하고 학대피해 우려가 높은 아동에 대해 지속적으로 모니터링을 실시함으로써 아동학대의 위험성을 감소시키고아동의안전등을확인하는역할을담당하고있다. (나) 여성 1인 가구 밀집지역에 대한 경찰순찰을 확대함으로써 공식적 감시기능을 강화하거나 혹은 아파트 입구 현관문에 반사경을 부착함으로써 출입자의 익명성을 감소시켜 범행에 수반되는 발각 위험을 증대하기 위한 조치를 취하고 있다. (다) 위법행위에 대한 단속을 강화하는 무관용 경찰활동을 지향함으로써 처벌의 확실성을 높여 범죄를 억제하고자 노력하고 있다. <보 기 2> ㉠상황적범죄예방 ㉡지역사회 기반 범죄예방 ㉢발달적범죄예방 ㉣법집행을 통한 범죄억제 (가) (나) (다)","㉡ ㉣ ㉠","㉢ ㉡ ㉣","㉡ ㉢ ㉠","㉢ ㉠ ㉣",3,0,""],["2023-2","경찰학",12,"에크와 스펠만(Eck & Spelman)은 경찰관서에서 문제지향 경찰활동을 지역문제의 해결에 보다 쉽게 적용할 수 있도록 4단계의 문제해결과정(이른바 SARA 모델)을 제시하였다. 개별 단계에 관한 설명으로 가장 적절하지 않은 것은?","조사단계(scanning)는 일반적으로 지역사회에서 일회적으로 발생하지만 대중의 이목을 집중시키는 심각한 중대범죄 사건을 우선적으로 조사대상화하는 데에서 출발한다.","분석단계(analysis)에서는 각종 통계자료 등 수집된 자료를 활용하여 심층적인 분석을 실시하며, 당면 문제의 성격을 정확하게 파악하기 위해 문제분석 삼각모형(problem analysis triangle)을 유용한 분석도구로 활용할 수 있다.","대응단계(response)에서는 경찰이 보유한 자원과 역량만으로는 한계가 있으므로 지역사회 내의 여러 다른 기관들과의 협력을 통한 대응방안을 추구하며, 상황적 범죄예방에서 제시하는 25가지 범죄예방기술을 적용해 볼 수도 있다.","평가단계(assessment)는과정평가와효과평가의두단계로구성되며, 이전 문제해결과정에의 환류를 통해 각 단계가 지속적인 순환 과정으로 작동할 수 있도록 한다는 점에서중요한 의미를 가진다.",0,0,""],["2023-2","경찰학",13,"한국경찰의 역사적 사실을 과거에서부터 현재 순으로 바르게 나열한 것은? ㉠ 경찰청 사이버테러대응센터 신설 ㉡ 경찰서비스헌장 제정 ㉢ 국가수사본부 신설 ㉣ ｢경찰법｣ 제정 ㉤ 제주특별자치도 자치경찰단 설치","㉣-㉡-㉠-㉤-㉢","㉡-㉣-㉤-㉠-㉢","㉡-㉣-㉠-㉢-㉤","㉣-㉠-㉡-㉤-㉢",0,0,""],["2023-2","경찰학",14,"부당결부금지의 원칙에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","행정청은 행정작용을 할 때 상대방에게 해당 행정작용과 실질적인 관련이 없는 의무를 부과해서는 아니 된다는 원칙이다.","현행법상 명시적인 규정은 없지만 법치국가의 원리와 자의금지의 원칙으로부터 도출되는 행정법의 일반원칙이다.","지방자치단체장이 사업자에게 주택사업계획승인을 하면서 그 주택사업과는 아무런 관련이 없는 토지를 기부채납하도록 하는 부관을 붙인 경우에는, 기부채납한 토지 가액이 그 주택사업 계획의 100분의 1 상당의 금액에 불과하고 사업자가 이의를 제기하지 아니하다가 지방자치단체장이 업무착오로 기부채납한 토지에 대하여 보상협조요청서를 보내자 그 때서야 비로소 부관의 하자를 들고 나왔다고 하더라도 그 부관은 당연무효이다.","甲이 혈중알코올농도 0.140%의 주취상태로 배기량 125cc 이륜 자동차를 운전하였다는 이유로 甲의 자동차운전면허[제1종 대형, 제1종보통, 제1종특수(대형견인･구난), 제2종소형]를취소한것은 甲이 음주상태에서 운전을 하지 않으면 안 되는 부득이한 사정이 없었더라도 재량권을 일탈･남용한 것이다.",0,0,""],["2023-2","경찰학",15,"｢행정기본법｣에 관한 설명으로 가장 적절한 것은?","행정에 관한 나이는 다른 법령등에 특별한 규정이 있는 경우 에도 출생일을 산입하지 않고 만(滿) 나이로 계산하고, 연수 (年數)로 표시하되, 1세에 이르지 아니한 경우에는 월수(月數)로 표시할 수 있다.","행정작용은 그 행정작용이 의도하는 공익이 행정작용으로 인한 국민의 이익 침해보다 크지 않아야 한다.","행정청은 법률로 정하는 바에 따라 완전히 자동화된 시스템 (인공지능 기술을 적용한 시스템을 포함)으로 처분을 할 수 있으나, 처분에 재량이 있는 경우는 그러하지 아니하다.","공익 또는 제3자의 이익을 현저히 해칠 우려가 있는 경우에도 행정청은 권한 행사의 기회가 있음에도 불구하고 장기간 권한을 행사하지 아니하여 국민이 그 권한이 행사되지 아니할 것으로 믿을 만한 정당한 사유가 있는 경우에는 그 권한을 행사해서는 아니 된다.",2,0,""],["2023-2","경찰학",16,"｢행정권한의 위임 및 위탁에 관한 규정｣에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","“위임”이란 법률에 규정된 행정기관의 장의 권한 중 일부를 다른 행정기관의 장에게 맡겨 그의 권한과 책임 아래 행사하도록 하는 것을 말한다.","위임 및 위탁기관은 수임 및 수탁기관의 수임 및 수탁사무 처리에 대하여 지휘･감독하고, 그 처리가 위법하거나 부당하다고 인정될 때에는 이를 취소하거나 정지시킬 수 있다.","행정기관의 장은 행정권한을 위임 및 위탁할 때에는 위임 및 위탁하기 전에 단순한 사무인 경우를 제외하고는 수임 및 수탁기관에 대하여 수임 및 수탁사무 처리에 필요한 교육을 하여야 하며, 수임 및 수탁사무의 처리지침을 통보하여야 한다.","수임 및 수탁사무의 처리가 부당한지 여부의 판단은 위법성 판단과 달리 합목적적･정책적 고려도 포함되므로, 위임 및 위탁기관이 그 사무처리에 관하여 일반적인 지휘･감독을 하는 경우는 물론이고 나아가 수임 및 수탁사무의 처리가 부당하다는 이유로 그 사무처리를 취소하는 경우에도 광범위한 재량이 허용된다고 보아야 한다.",0,0,""],["2023-2","경찰학",17,"행정상 법률관계에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국유재산의 관리청이 그 무단점유자에 대하여 하는 변상금부과 처분은 순전히 사경제 주체로서 행하는 사법상의 법률행위이다.","국가나 지방자치단체에 근무하는 청원경찰은 ｢국가공무원법｣ 이나 ｢지방공무원법｣상의 공무원은 아니지만 그 근무관계를 사법상의 고용계약관계로 보기는 어렵다.","원천징수의무자가 비록 과세관청과 같은 행정청이라 하더라도 그의 원천징수행위는 법령에서 규정된 징수 및 납부의무를 이행하기 위한 것에 불과한 것이지, 공권력의 행사로서의 행정 처분을 한 경우에 해당되지 아니한다.","국립 교육대학 학생에 대한 퇴학처분은 행정처분이다.",0,0,""],["2023-2","경찰학",18,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣상 국가수사본부장에 관한 설명으로 가장 적절하지 않은 것은?","국가수사본부장은 치안정감으로 보한다.","국가수사본부장을 경찰청 외부를 대상으로 모집하여 임용하는 경우 정당의 당원이거나 당적을 이탈한 날부터 3년이 지나지 아니한 사람은 국가수사본부장이 될 수 없다.","국가수사본부장이 직무를 집행하면서 헌법이나 법률을 위배하였을 때에는 국회는 대통령에게 해임을 건의할 수 있다.","국가수사본부장의 임기는 2년으로 하며, 중임할 수 없다.",2,0,""],["2023-2","경찰학",19,"경찰공무원의 징계에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무원인 피징계자에게 징계사유가 있어서 징계처분을 하는 경우 어떠한 처분을 할 것인가는 징계권자의 재량에 맡겨진 것이고, 다만 징계권자가 재량권의 행사로서 한 징계처분이 사회통념상 현저하게 타당성을 잃어 징계권자에게 맡겨진 재량권을 남용한 것이라고 인정되는 경우에 한하여 그 처분을 위법하다고 할 수 있다.","동료 경찰관에 대한 성희롱을 이유로 징계에 의하여 해임처분을 받은 경찰관은 해임처분을 받은 때부터 3년이 지나면 경찰 공무원으로 임용될 수 있다.","징계등 의결 요구를 받은 징계위원회는 그 요구서를 받은 날부터 30일 이내에 징계등에 관한 의결을 하여야 하나, 부득이한 사유가 있을 때에는 해당 징계등 의결을 요구한 경찰기관의 장의 승인을 받아 30일 이내의 범위에서 그 기한을 연기할 수 있다.","징계위원회는 징계등 의결을 하였을 때에는 지체 없이 징계등 의결을요구한자에게의결서정본(正本)을보내어통지하여야한다.",1,0,""],["2023-2","경찰학",20,"경찰권 발동의 근거와 한계에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","일반수권조항이란 경찰권의 발동근거가 되는 개별적인 작용법적 근거가 없을 때 경찰권 발동의 일반적･보충적 근거가 될 수 있도록 개괄적으로 수권된 일반조항을 말한다.","｢경찰관 직무집행법｣ 제5조는 형식상 경찰관에게 재량에 의한 직무수행권한을 부여한 것처럼 되어 있으나, 경찰관에게 그러한 권한을 부여한 취지와 목적에 비추어 볼 때 구체적인 사정에 따라 경찰관이 그 권한을 행사하여 필요한 조치를 취하지 아니하는 것이 현저하게 불합리하다고 인정되는 경우에는 그러한 권한의불행사는직무상의의무를위반한것이되어위법하게된다.","경찰청장과 해양경찰청장은 경찰관이 ｢경찰관 직무집행법｣ 제2조 각 호에 따른 직무의 수행으로 인하여 민･형사상 책임과 관련된 소송을 수행할 경우 변호인 선임 등 소송 수행에 필요한 지원을 할 수 있다.","｢경찰관 직무집행법｣은 “경찰공무원은 직위 또는 직권을 이용 하여 부당하게 타인의 사생활에 개입하여서는 아니된다.”고 규정하고 있다.",3,0,""],["2023-2","경찰학",21,"행정행위의 부관은 ( )인 경우를 제외하고는 독립하여 행정소송의 대상이 될 수 없다. 빈칸에 들어갈 말로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","부담","조건","기한","기간",0,0,""],["2023-2","경찰학",22,"행정상 의무이행 확보수단에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","질서위반행위에 대하여 과태료 부과의 근거 법률이 개정되어 행위 시의 법률에 의하면 과태료 부과대상이었지만 재판 시의 법률에 의하면 과태료 부과대상이 아니게 된 때에는 개정 법률의 부칙에서 종전 법률 시행 당시에 행해진 질서위반행위에 대해서는 행위 시의 법률을 적용하도록 특별한 규정을 두지 않은 이상 재판 시의 법률을 적용하여야 하므로 과태료를 부과할 수 없다.","경찰서장이 범칙행위에 대하여 통고처분을 한 이상 통고처분에서 정한 범칙금 납부기간까지는 원칙적으로 경찰서장은 즉결심판을 청구할 수 없다.","피고인이 즉결심판에 대하여 제출한 정식재판청구서에 피고인의 자필로 보이는 이름이 기재되어 있고 그 옆에 서명이 되어 있어 위 서류가 작성자 본인인 피고인의 진정한 의사에 따라 작성 되었다는 것을 명백하게 확인할 수 있더라도 피고인의 인장이나 지장이찍혀있지않다면정식재판청구는부적법하다고보아야한다.","｢질서위반행위규제법｣에 따르면 고의 또는 과실이 없는 질서 위반행위는 과태료를 부과하지 아니한다.",2,0,""],["2023-2","경찰학",23,"｢경찰관 직무집행법｣에 관한 설명으로 가장 적절한 것은?","｢경찰관 직무집행법｣에 따르면 경찰관은 유실물을 인수할 권리자 확인의 직무를 수행하기 위하여 필요하면 관계인에게 출석하여야 하는 사유･일시 및 장소를 명확히 적은 출석 요구서를 보내 경찰관서에 출석할 것을 요구할 수 있다.","｢경찰관 직무집행법｣에 따르면 위해성 경찰장비의 종류 및 그 사용기준, 안전교육･안전검사의 기준 등은 행정안전부령으로 정한다.","｢경찰관직무집행법｣ 제11조의2 제1항에따른손실보상을청구할수 있는 권리는 손실이 있음을 안 날부터 3년, 손실보상이 확정된 때부터 5년간 행사하지 아니하면 시효의 완성으로 소멸한다.","｢경찰관 직무집행법｣ 제2조 직무의 범위에 “테러경보 발령･대테러 작전 수행”을 명시하고 있다.",0,0,""],["2023-2","경찰학",24,"｢경찰관 직무집행법｣에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","경찰 병력이 행정대집행 직후 “A자동차 희생자 추모와 해고자 복직을 위한 범국민대책위원회”(이하 ‘A차 대책위’라 함)가 또다시 같은 장소를 점거하고 물건을 다시 비치하는 것을 막기 위해 당해 사건 장소를 미리 둘러싼 뒤 ‘A차 대책위’가 같은 장소에서 기자회견 명목의 집회를 개최하려는 것을 불허하면서 소극적으로 제지한 것은 범죄행위 예방을 위한 경찰 행정상 즉시강제로서 적법한 공무집행에 해당한다.","｢아동학대범죄의 처벌 등에 관한 특례법｣에 따른 아동학대범죄가 행하여지려고 하거나 행하여지고 있어 타인의 생명･신체에 대한 위해발생의우려가명백하고긴급한상황에서, 경찰관이 그 위해를 예방하거나 진압하기 위한 행위 또는 범인의 검거 과정에서 경찰관을 향한 직접적인 유형력 행사에 대응하는 행위를 하여 그로 인하여 타인에게 피해가 발생한 경우, 그 경찰관의 직무 수행이 불가피한 것이고 필요한 최소한의 범위에서 이루어졌으며 해당 경찰관에게 고의 또는 중대한 과실이 없는 때에는 형을 감경하거나 면제한다.","경찰관은 형사처벌의 대상이 되는 행위가 눈앞에서 막 이루어 지려고 하는 것이 주관적으로 인정될 수 있는 상황이고 그 행위를 당장 제지하지 않으면 곧 인명･신체에 중대한 위해를 미치거나 재산에 손해를 끼칠 우려가 있는 상황이어서, 직접 제지하는 방법 외에는 위와 같은 결과를 막을 수 없는 급박한 상태일 때에만 ｢경찰관 직무집행법｣ 제6조에 의하여 적법하게 그 행위를 제지할 수 있다.","｢경찰관 직무집행법｣은 제1조 제2항에서 “경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.”라고 선언하여 경찰비례의 원칙을 명시적으로 규정하고 있는데, 이는 경찰행정 영역에서의 헌법상 과소보호 금지원칙을 표현한 것이다.",0,0,""],["2023-2","경찰학",25,"｢개인정보보호법｣에관한설명으로가장적절하지않은 것은?","살아있는개인에관한정보로서성명, 주민등록번호및영상등을 통하여 개인을 알아볼 수 있는 정보는 “개인정보”에 해당한다.","“개인정보처리자”란 업무를 목적으로 개인정보파일을 운용하기 위하여 스스로 또는 다른 사람을 통하여 개인정보를 처리하는 공공기관, 법인, 단체 및 개인 등을 말한다.","정보주체는 자신의 개인정보 처리와 관련하여 개인정보의 처리 정지, 정정･삭제 및 파기를 요구할 권리를 가진다.","“익명처리”란 개인정보의 전부를 삭제하거나 일부를 대체하는 등의 방법으로 추가 정보가 없이는 특정 개인을 알아볼 수 없도록 처리하는 것을 말한다.",3,0,""],["2023-2","경찰학",26,"｢행정심판법｣에 관한 설명으로 가장 적절한 것은?","대통령의 처분 또는 부작위에 대하여는 다른 법률에서 행정심판을 청구할 수 있도록 정한 경우 외에는 행정심판을 청구할 수 없다.","취소심판은 당사자의 신청에 대한 행정청의 위법 또는 부당한 거부처분이나 부작위에 대하여 일정한 처분을 하도록 하는 행정심판이다.","처분 또는 부작위에 대한 행정심판은 청구서를 제출하거나 말로써 청구할 수 있다.","행정심판위원회는 심판청구가 이유가 있다고 인정하는 경우에도 이를 인용(認容)하는 것이 공공복리에 크게 위배된다고 인정하면 그 심판청구를 기각하는 재결을 하여야 한다.",0,0,""],["2023-2","경찰학",27,"다음 빈칸에 들어갈 말로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 명예퇴직한 법관이 미지급 명예퇴직수당액에 대하여 가지는 권리는 명예퇴직수당 지급대상자 결정 절차를 거쳐 명예퇴직 수당규칙에 의하여 확정된 공법상 법률관계에 관한 권리로서, 그 지급을 구하는 소송은 ｢행정소송법｣의 ( )에 해당하며, 그법률관계의당사자인국가를상대로제기하여야한다.","취소소송","부작위위법확인소송","기관소송","당사자소송",3,0,""],["2023-2","경찰학",28,"경찰조직편성의원리에관한설명으로가장적절하지않은것은?","분업의 원리 - 가급적 한 사람에게 동일한 업무를 분담시킴으로써 특정 분야에 대한 업무의 전문화 확보를 가능하게 한다.","계층제의 원리 - 권한과 책임의 정도에 따라 직무를 계층화 함으로써 상･하 계층 간에 직무상 지휘･감독관계에 있도록 한다.","조정과 통합의 원리 - 구성원의 노력과 행동을 질서있게 배열하고 통일시키는 작용을 함으로써 경찰행정의 목표를 효율적으로 달성할 수 있게 한다.","통솔범위의 원리 - 1인의 상관 또는 감독자가 직접 통솔할 수 있는 부하직원의 수를 의미하며, 무니(Mooney)는 이러한 통솔 범위의 원리를 조직편성 제1의 원리라고 하였다.",3,0,""],["2023-2","경찰학",29,"동기부여이론 중 내용이론에 해당하는 것으로 가장 적절하지 않은 것은?","매슬로우(Maslow)의 욕구단계이론","맥그리거(McGregor)의 X이론･Y이론","포터와 롤러(Porter & Lawler)의 업적만족이론","허즈버그(Herzberg)의 욕구충족요인 이원론(동기위생이론)",2,0,""],["2023-2","경찰학",30,"예산제도에 관한 설명으로 가장 적절하지 않은 것은?","영기준 예산제도는 전년도 예산을 기준으로 하여 점증적으로 예산액을결정하는데서생기는폐단을시정하려고개발한것이다.","품목별 예산제도는 일반 국민들이 정부사업에 대한 이해를 용이 하게 하지만 인건비 등 경직성 경비적용에 어려움이 있다.","계획예산의 핵심은 프로그램 예산형식을 따르는 것으로서, 기획 (planning), 사업구조화(programming), 예산(budgeting)을 연계시킨 시스템적 예산제도이다.","준예산은 새로운 회계연도가 개시될 때까지 국회에서 예산안이 의결되지 못한 경우 예산안이 의결될 때까지 전년도 예산에 준하여 지출하는 예산이다.",1,0,""],["2023-2","경찰학",31,"｢경찰장비관리규칙｣상 무기 및 탄약관리에 관한 설명으로 가장 적절하지 않은 것은?","간이무기고란 경찰인력 및 경찰기관별 무기책정기준에 따라 배정된 개인화기와 공용화기를 집중보관･관리하기 위하여 각 경찰기관에 설치된 시설을 말한다.","무기･탄약을 대여 받은 자는 그 무기를 휴대하고 근무하는 경우를 제외하고는 무기고에 보관하여야 하며, 근무 종료시에는 감독자 입회아래 무기탄약 입출고부에 기재한 뒤 즉시 입고하여야 한다.","경찰기관의 장은 무기를 휴대한 자가 형사사건의 조사의 대상이 된 때에는 즉시 대여한 무기･탄약을 회수하여야 한다.","경찰기관의 장은 무기를 휴대한 자가 상사의 사무실을 출입할 경우 대여한 무기･탄약을 무기고에 보관하도록 하여야 한다.",0,0,""],["2023-2","경찰학",32,"｢보안업무규정｣상 비밀보호에 관한 설명으로 가장 적절하지 않은 것은?","각급기관의 장은 비밀의 작성･분류･접수･발송 및 취급 등에 필요한 모든 관리사항을 기록하기 위하여 비밀관리기록부를 작성하여 갖추어 두어야 한다. 다만, II급 이상 비밀관리기록부는 따로 작성하여 갖추어 두어야 한다.","각급기관의 장은 비밀문서의 접수·발송·복제·열람 및 반출 등의 통제에 필요한 규정을 따로 작성·운영할 수 있다.","각급기관의 장은 연 2회 비밀 소유 현황을 조사하여 국가정보원장 에게 통보하여야 한다.","중앙행정기관등의 장은 국가안전보장을 위하여 국민에게 긴급히 알려야 할 필요가 있다고 판단될 때에는 그가 생산한 비밀을 ｢보안업무규정｣ 제3조의3에 따른 보안심사위원회의 심의를 거쳐 공개할 수 있다. 다만, Ⅰ급비밀의 공개에 관하여는 국가정보원장과 미리 협의해야 한다.",0,0,""],["2023-2","경찰학",33,"｢경찰 감찰 규칙｣에 관한 설명으로 가장 적절하지 않은 것은?","“감찰”이란 복무기강 확립과 경찰행정의 적정성을 확보하기 위해 경찰기관 또는 소속공무원의 제반업무와 활동 등을 조사·점검· 확인하고 그 결과를 처리하는 감찰관의 직무활동을 말한다.","감찰부서장은 소속 감찰관에 대하여 감찰관 보직 후 3년마다 적격심사를 실시하여 인사에 반영하여야 한다.","경찰기관의장은의무위반행위가자주발생하거나그발생가능성이 높다고 인정되는 시기, 업무분야 및 경찰관서 등에 대하여는 일정기간 동안 전반적인 조직관리 및 업무추진 실태 등을 집중 점검할 수 있다.","감찰관은 감찰관 본인이 의무위반행위로 인해 감찰대상이 된 때에는 당해 감찰직무(감찰조사 및 감찰업무에 대한 지휘를 포함한다)에서 제척된다.",1,0,""],["2023-2","경찰학",34,"｢지역경찰의 조직 및 운영에 관한 규칙｣에 관한 설명으로 가장 적절한 것은?","경찰청장은 인구, 면적, 행정구역, 교통･지리적 여건, 각종 사건사고 발생 등을 고려하여 경찰서의 관할구역을 나누어 지역경찰관서를 설치한다.","순찰팀은 범죄예방 순찰, 각종 사건사고에 대한 초동조치 등 현장 치안활동을 담당한다.","지역경찰관서장은 지역경찰관서의 운영에 관하여 총괄 지휘･ 감독한다.","｢지역경찰의 조직 및 운영에 관한 규칙｣ 제23조는 “행정근무를 지정받은 지역경찰은 지역경찰관서 및 치안센터 내에서 방문 민원 및 각종 신고사건의 접수 및 처리업무를 수행한다.”라고 규정하고 있다.",1,0,""],["2023-2","경찰학",35,"｢아동･청소년의 성보호에 관한 법률｣에 관한 설명으로 가장 적절하지 않은 것은?","“아동･청소년”이란 19세 미만의 자를 말한다. 다만, 19세에 도달 하는 연도의 1월 1일을 맞이한 자는 제외한다.","위계(僞計) 또는 위력으로써 아동･청소년을 추행한 자에 대한 미수범 처벌규정을 두고 있다.","사법경찰관리는 19세 이상의 사람이 성적 착취를 목적으로 정보 통신망을 통하여 아동･청소년에게 성적 욕망이나 수치심 또는 혐오감을 유발할 수 있는 대화를 지속적 또는 반복적으로 하거나 그러한 대화에 지속적 또는 반복적으로 참여시키는 행위를 한 범죄에 대하여 신분을 비공개하고 범인으로 추정되는 자들에게 접근하여 범죄행위의 증거 및 자료 등을 수집할 수 있다.","사법경찰관리가 디지털 성범죄에 대한 신분위장수사를 할 때 신분을 위장하기 위한 문서, 도화 및 전자기록 등의 작성, 변경 또는 행사는 가능하지만, 아동･청소년성착취물을 소지, 판매 또는 광고할 수 없다.",3,0,""],["2023-2","경찰학",36,"｢아동학대범죄의 처벌 등에 관한 특례법｣상 사법경찰관의 긴급임시조치로 가장 적절하지 않은 것은?","피해아동등 또는 가정구성원의 주거로부터 퇴거 등 격리","경찰관서의 유치장 또는 구치소에의 유치","피해아동등 또는 가정구성원의 주거, 학교 또는 보호시설 등 에서 100미터 이내의 접근 금지","피해아동등 또는 가정구성원에 대한 ｢전기통신기본법｣ 제2조 제1호의 전기통신을 이용한 접근 금지",1,0,""],["2023-2","경찰학",37,"｢도로교통법｣에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","모든 차의 운전자는 예외 없이 터널 안에 차를 주차해서는 아니 된다.","긴급자동차에 대하여는 동법 제23조에 따른 끼어들기의 금지를 적용하지 아니한다.","“정차”란 운전자가 5분을 초과하지 아니하고 차를 정지시키는 것으로서 주차 외의 정지 상태를 말한다.","물로 입 안을 헹굴 기회를 달라는 피고인의 요구를 무시한 채 호흡측정기로 측정한 혈중알코올 농도 수치가 0.05%로 나타난 사안에서, 피고인이 당시 혈중알코올 농도 0.05% 이상의 술에 취한 상태에서 운전하였다고 단정할 수 없다.",0,0,""],["2023-2","경찰학",38,"｢국민보호와 공공안전을 위한 테러방지법｣에 관한 설명으로 가장 적절한 것은?","｢여권법｣ 제17조 제1항 단서에 따른 외교부장관의 허가를 받지 아니하고 방문 및 체류가 금지된 국가 또는 지역을 방문･체류한 사람이 테러로 인해 생명의 피해를 입은 경우, 그 사람의 유족에 대해 특별위로금을 지급할 수 있다.","｢국민보호와 공공안전을 위한 테러방지법｣에서 말하는 “테러 단체”란 국제형사경찰기구(ICPO)가 지정한 테러단체를 말한다.","대테러활동을 수행하는 국가기관, 지방자치단체, 그 밖에 대통령령 으로 정하는 기관의 대테러활동으로 인한 국민의 기본권 침해 방지를 위하여 국가테러대책위원회 소속으로 대테러 인권보호관 1명을 둔다.","테러로 인하여 신체･재산･명예의 피해를 입은 국민은 관계기관에 즉시 신고하여야 한다. 다만, 인질 등 부득이한 사유로 신고 할 수 없을 때에는 법률관계 또는 계약관계에 의하여 보호 의무가 있는 사람이 이를 알게 된 때에 즉시 신고하여야 한다.",2,0,""],["2023-2","경찰학",39,"｢집회 및 시위에 관한 법률｣에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ “질서유지인”이란 관할 경찰서장이 집회 또는 시위의 질서를 유지하게 할 목적으로 임명한 자를 말한다. ㉡ 집회의 자유가 가지는 헌법적 가치와 기능, 집회에 대한 허가 금지를 선언한 헌법정신, 신고제도의 취지 등을 종합하여 보면, 신고는 행정관청에 집회에 관한 구체적인 정보를 제공 함으로써 공공질서의 유지에 협력하도록 하는 데 의의가 있는 것으로 집회의 허가를 구하는 신청으로 변질되어서는 아니 되므로, 신고를 하지 아니하였다는 이유만으로 옥외집회 또는 시위를 헌법의 보호 범위를 벗어나 개최가 허용되지 않는 집회 내지 시위라고 단정할 수 없다. ㉢ 관할경찰관서장은 옥외집회 및 시위에 관한 신고서의 기재 사항에 미비한 점을 발견하면 접수증을 교부한 때부터 24시간 이내에 주최자에게 48시간을 기한으로 그 기재 사항을 보완할 것을 통고할 수 있다. ㉣ ｢집회 및 시위에 관한 법률｣에 따른 신고 없이 이루어진 집회에 참석한 참가자들이 차로 위를 행진하는 등 도로교통을 방해함으로써 통행을 불가능하게 하거나 현저하게 곤란하게 하는 경우라도 참가자 모두에게 당연히 일반교통방해죄가 성립하는 것은 아니다.","㉠㉡","㉡㉢","㉡㉣","㉢㉣",2,0,""],["2023-2","경찰학",40,"｢경찰수사규칙｣과 ｢범죄수사규칙｣이 규정하고 있는 외국인에 대한조사및수사에관한내용으로가장적절하지않은 것은?","경찰관은 대한민국의 영해에 있는 외국 선박 내에서 발생한 범죄로서 대한민국 육상이나 항내의 안전을 해할 때, 승무원 이외의 사람이나 대한민국의 국민에 관계가 있을 때 또는 중대한 범죄가 행하여졌을 때는 수사를 하여야 한다.","사법경찰관리는 외국인을 조사하는 경우에는 조사를 받는 외국인이 이해할 수 있는 언어로 통역해 주어야 한다.","사법경찰관은 주한 미합중국 군대의 구성원･외국인군무원 및 그 가족이나 초청계약자의 범죄 관련 사건을 인지하거나 고소･ 고발 등을 수리한 때에는 7일 이내에 한미행정협정사건 통보서를 미군 당국에게 통보해야 한다.","경찰관은 외국군함에 속하는 군인이나 군속이 그 군함을 떠나 대한민국의 영해 또는 영토 내에서 죄를 범한 경우에는 신속히 국가수사본부장에게 보고하여 그 지시를 받아야 한다. 다만, 현행범 그 밖의 급속을 요하는 때에는 체포 그 밖의 수사상 필요한 조치를 한 후 신속히 국가수사본부장에게 보고하여 그 지시를 받아야 한다.",2,0,""],["2024-1","헌법",1,"헌법해석과 합헌적 법률해석에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법의 해석은 헌법이 담고 추구하는 이상과 이념에 따른 역사적, 사회적 요구를 올바르게 수용하여 헌법적 방향을 제시하는 헌법의 창조적 기능을 수행하여 국민적 욕구와 의식에 알맞는 실질적 국민주권의 실현을 보장하는 것이어야 한다.","현행 헌법 제12조에서 종래의 “구금”을 “구속”으로 바꾼 것은 신체의 자유의 보장 범위를 구금된 사람뿐 아니라 구인된 사람 에게까지 넓히기 위한 것으로 해석하는 것이 타당하다.","법률 또는 법률 조항은 원칙적으로 가능한 범위안에서 합헌적 으로 해석하여야 하나 그 해석은 문의적 한계와 법목적에 따른 한계가 있다. 이러한 한계를 벗어난 합헌적 해석은 그것이 바로 실질적 의미에서의 입법작용을 뜻하게 되어 결과적으로 입법 권자의 입법권을 침해하는 것이 된다.","조세법률주의가 지배하는 조세법의 영역에서 경과규정의 미비 라는 명백한 입법의 공백을 방지하고 형평성의 왜곡을 시정하기 위해 실효된 법률조항을 유효한 것으로 해석하는 것은 헌법 정신에 맞도록 법률의 내용을 해석･보충하거나 정정하는 ‘헌법 합치적 법률해석’에 따른 해석이다.",3,0,""],["2024-1","헌법",2,"헌법의 기본원리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법의 기본원리는 헌법의 이념적 기초인 동시에 헌법을 지배하는 지도원리로서 입법이나 정책결정의 방향을 제시하며 공무원을비롯한 모든 국민･국가기관이 헌법을 존중하고 수호하도록 하는 지침이고 법률조항의 위헌 여부를 심사할 때 해석기준으로 삼을 수도 있다.","‘책임 없는 자에게 형벌을 부과할 수 없다’는 형벌에 관한 책임 주의는 형사법의 기본원리로서, 헌법상 법치국가의 원리에 내재하는 원리인 동시에 헌법 제10조의 취지로부터 도출되는 원리이므로 법인에게는 적용되지 않는다.","정부는 문화국가실현에 관한 과제를 수행함에 있어 문화의 다양성, 자율성, 창조성이 조화롭게 실현될 수 있도록 중립성을 지키면서 문화에 대한 지원 및 육성을 하도록 유의하여야 한다.","헌법은 법치주의를 그 기본원리의 하나로 하고 있으며, 법치주의는 행정작용에 국회가 제정한 형식적 법률의 근거가 요청된다는 법률유보를 그 핵심적 내용의 하나로 하고 있다.",1,0,""],["2024-1","헌법",3,"신뢰보호원칙에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","법률에 따른 개인의 행위가 단지 법률이 반사적으로 부여하는 기회의 활용을 넘어서 국가에 의하여 일정 방향으로 유인된 것 이라면, 원칙적으로 국가의 법률개정이익이 개인의 신뢰보호에 우선된다고 볼 여지가 있다.","｢산업재해보상보험법｣ 개정을 통하여 최고보상제도를 신설하고, 개정법 시행 전에 장해사유가 발생하여 이미 장해보상연금을 수령하고 있던 수급권자에게도 감액된 보상연금을 지급하도록 하더라도, 2년 6개월의 경과기간 동안 구법을 적용한 후 일률적이고 전면적으로 최고보상제도를 적용하도록 하였다면 신뢰보호원칙에 위배되지 않는다.","헌법상 법치국가원리의 파생원칙인 신뢰보호의 원칙은 국민이 법률적 규율이 장래에도 지속할 것이라는 합리적인 신뢰를 바탕으로 이에 적응하여 개인의 법적 지위를 형성해 왔을 때에는 국가로 하여금 그와 같은 국민의 신뢰를 되도록 보호할 것을 요구하는 것으로, 법률이나 그 하위법규에 적용되는 것이지 국가관리의 입시제도와 같은 제도운영지침의 개폐에 적용되는 것은 아니다.","조세법의 영역에 있어서는 특별한 사정이 없는 한 현재의 세법이 변함없이 유지되리라는 납세자의 기대나 신뢰는 보호될 수 없다.",3,0,""],["2024-1","헌법",4,"헌법의 제정과 개정에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","헌법을 개정하는 것은 주권자인 국민이 보유하는 가장 기본적인 권리로서 가장 강력하게 보호되어야 할 권리 중의 권리이지만, 헌법을 폐지하고 다른 내용의 헌법을 모색하는 것은 국민에게 허용되지 않는 권리이다.","헌법개정안은 국회에서 재적의원 3분의 2 이상의 찬성에 따른 국회의 의결을 거친 다음 국민투표에서 국회의원선거권자 과반수의 찬성을 얻어 확정된다.","헌법의 제규정 가운데는 헌법의 근본가치를 보다 추상적으로 선언한 것도 있고, 이를 보다 구체적으로 표현한 것도 있어서 이념적･논리적으로는 규범 상호간의 우열을 인정할 수 있으므로, 우리 헌법의 각 개별규정 가운데 무엇이 헌법제정규정이고 무엇이 헌법개정규정인지를 구분하는 것이 가능할 뿐 아니라, 각 개별규정에 그 효력상의 차이를 인정할 수도 있다.","우리 헌법은 제128조 내지 제130조에서 일반법률의 개정절차와는 다른 엄격한 헌법개정절차를 정하고 있으며 헌법개정절차의 대상을 단지 ‘헌법’이라고만 하고 있으므로, 관습헌법도 헌법에 해당하는 이상 여기서 말하는 헌법개정의 대상인 헌법에 포함 된다고 보아야 한다.",3,0,""],["2024-1","헌법",5,"기본권 주체에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","의료인에게 면허된 의료행위 이외의 의료행위를 금지하고 처벌하는 ｢의료법｣ 조항이 제한하고 있는 직업의 자유는 국가 자격제도정책과 국가의 경제상황에 따라 법률에 의하여 제한할 수 있고 인류보편적인 성격을 지니고 있지 아니하는 국민의 권리이므로 원칙적으로 외국인에게 인정되는 기본권은 아니다.","거주･이전의 자유는 인간의 권리에 해당하므로 외국인에게 거주･ 이전의 자유의 내용인 출･입국의 자유에 대한 기본권주체성이 인정된다.","국가 및 그 기관 또는 조직의 일부나 공법인은 원칙적으로 기본권의 ‘수범자’로서 기본권의 주체가 되지 못하므로, ｢주민 소환에 관한 법률｣에서 주민소환의 청구사유에 제한을 두지 아니하였다는 이유로 지방자치단체장이 자신의 공무담임권 침해를 다툴 수는 없다.","중소기업중앙회는 ｢중소기업협동조합법｣에 의해 설치되고 국가가 그 육성을 위해 재정을 보조해주는 등 공법인적 성격을 강하게 가지고 있으므로 결사의 자유를 누릴 수 있는 단체에 해당되지는 않는다.",0,0,""],["2024-1","헌법",6,"기본권의 충돌이란 상이한 복수의 기본권주체가 서로의 권익을 실현하기 위해 하나의 동일한 사건에서 국가에 대하여 서로 대립되는 기본권의 적용을 주장하는 경우를 말하는데 헌법 재판소는 이를 해결하기 위한 방법으로 기본권의 서열이론, 법익형량의 원리, 실제적 조화의 원리(＝규범조화적 해석) 등을 사용한다. 다음 중 헌법재판소가 흡연권과 혐연권의 충돌을 해결하기 위해 사용한 방법과 같은 방법으로 기본권 충돌을 해결한 사례는?","｢정기간행물의등록등에관한법률｣상의 피해자의 반론권과 보도 기관의 언론의 자유 사이의 충돌","｢통신비밀보호법｣이 위법하게 취득한 타인간의 대화내용을 공개하는 자를 처벌하는 경우 대화 공개자의 표현의 자유와 대화자의 통신의 비밀 사이의 충돌","유니언 샵(Union Shop) 협정 체결을 용인하고 있는 ｢노동조합 및노동관계조정법｣에 의한 노동조합의 적극적 단결권과 근로자의 단결하지 아니할 자유 사이의 충돌","유니언 샵(Union Shop) 협정 체결을 용인하고 있는 ｢노동조합 및노동관계조정법｣에 의한 노동조합의 집단적 단결권과 근로자의 단결선택권 사이의 충돌",2,0,""],["2024-1","헌법",7,"과잉금지원칙(비례원칙)에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","보험사기를 이유로 체포된 공인이 아닌 피의자를 수사기관이 기자들에게 경찰서 내에서 수갑을 차고 얼굴을 드러낸 상태에서 조사받는 모습을 촬영할 수 있도록 허용한 행위는 피의자의 재범방지 및 범죄예방을 위한 것으로 목적의 정당성이 인정된다.","기본권을 제한하는 규정은 기본권행사의 ‘방법’과 ‘여부’에 관한 규정으로 구분할 수 있다. 방법의 적절성의 관점에서, 입법자는 우선 기본권행사의 ‘방법’에 관한 규제로써 공익을 실현할 수 있는가를 시도하고 이러한 방법으로는 공익달성이 어렵다고 판단되는 경우에 기본권행사의 ‘여부’에 관한 규제를 선택해야 한다.","변호사시험 성적을 합격자에게 공개하지 않도록 규정한 ｢변호사 시험법｣ 조항은 법학전문대학원 간의 과다경쟁 및 서열화를 방지하고, 교육과정이 충실하게 이행될 수 있도록 하여 다양한 분야의 전문성을 갖춘 양질의 변호사를 양성하기 위한 것으로 그 입법목적은 정당하나 입법목적을 달성하는 적절한 수단이 라고 볼 수는 없다.","형사재판에 피고인으로 출석하는 수형자에 대하여 사복착용을 불허하는 ｢형의 집행 및 수용자의 처우에 관한 법률｣ 조항은 형사재판을 받는 수형자의 도주를 방지하기 위한 것으로 목적의 정당성은 인정되나, 재판 과정에서 재소자용 의류를 입게 하는 것이 도주의 방지를 위한 필요하고도 유용한 수단이라고 보기는 어렵다.",2,0,""],["2024-1","헌법",8,"부작위에 의한 기본권 침해에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢가족관계의 등록 등에 관한 법률｣이 직계혈족이기만 하면 사실상 자유롭게 그 자녀의 가족관계증명서와 기본증명서의 교부를 청구하여 발급받을 수 있도록 규정함으로써 가정폭력 피해자의 개인정보가 가정폭력 가해자인 전 배우자에게 무단으로 유출될 수 있는 경우, 이는 가정폭력 피해자를 보호하기 위한 구체적 방안을 마련하지 아니한 진정입법부작위에 해당되어 가정폭력 피해자인 청구인의 개인정보자기결정권을 침해한다.","｢국군포로의 송환 및 대우 등에 관한 법률｣에 따라 대통령은 등록 포로, 등록하기 전에 사망한 귀환포로, 귀환하기 전에 사망한 국군 포로에 대한 예우의 신청, 기준, 방법 등에 필요한 사항을 대통령령 으로 제･개정할 의무가 있음에도 상당한 기간 동안 정당한 사유 없이 그 예우에 관한 사항을 대통령령에 규정하지 않은 행정입법 부작위는 등록포로 등의 가족인 청구인의 명예권을 침해한다.","｢진실･화해를 위한 과거사정리 기본법｣에 따라 행정안전부장관, 법무부장관 등은 진실규명사건 피해자의 명예회복을 위해 적절한 조치를 취할 의무가 있으나 이는 법령에서 유래하는 작위의무이지 헌법에서 유래하는 작위의무는 아니다.","통일부장관이 2010. 5. 24. 발표한 북한에 대한 신규투자 불허 및 진행 중인 사업의 투자확대 금지 등을 내용으로 하는 대북조치로 인하여 재산상 손실을 입은 자에 대한 보상입법을 마련하지 않은 경우, 이는 헌법 해석상 보상규정을 두어야 할 입법의무가 도출 됨에도 이를 이행하지 아니한 진정입법부작위에 해당하여 개성공단 내의 토지이용권을 사용･수익할 수 없게 된 청구인의 재산권을 침해한다.",1,0,""],["2024-1","헌법",9,"일반적 행동의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰공무원이 교통의 안전과 위험방지를 위하여 필요하다고 인정하는 경우 운전자가 술에 취하였는지를 호흡조사로 측정할 수 있도록 하고 운전자는 이러한 경찰공무원의 측정에 응하여야 하도록 규정한 ｢도로교통법｣ 조항은 운전자인 청구인의 일반적 행동의 자유를 제한한다.","응급의료종사자의 응급환자에 대한 진료를 폭행, 협박, 위계, 위력, 그 밖의 방법으로 방해하는 것을 금지하고 이에 위반하는 자를 형사처벌하는 ｢응급의료에 관한 법률｣ 조항은 해당 응급환자인 청구인의 일반적 행동의 자유를 제한한다.","국내에 도착한 외국물품을 수입통관절차를 거치지 않고 다시 외국으로 반출하려면, 해당 물품의 품명･규격･수량 및 가격 등을 세관장에게 신고하도록 하는 ｢관세법｣ 조항은 환승 여행객인 청구인의 일반적 행동자유권을 제한한다.","치료감호가종료시3년의보호관찰이시작되도록한｢치료감호등에관한 법률｣ 조항은피보호관찰자인청구인의일반적행동자유권을제한한다.",1,0,""],["2024-1","헌법",10,"평등권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","지원에 의하여 현역복무를 마친 여성의 경우 현역복무 과정에서의 훈련과 경험을 통해 예비전력으로서의 자질을 갖추고 있을 것으로 추정할 수 있으므로 지원에 의하여 현역복무를 마친 여성을 예비역 복무의무자의 범위에서 제외한 ｢군인사법｣ 조항은 예비역 복무의무자인 남성인 청구인의 평등권을 침해한다.","자율형 사립고등학교를 지원한 학생에게 평준화지역 후기학교에 중복지원하는 것을 금지한 ｢초･중등교육법시행령｣ 조항은 매우 보편화된 일반교육에 해당하는 고등학교 진학 기회를 제한하는 것으로 당사자에게 미치는 기본권 제한의 효과가 크다는 점에서 엄격한 심사척도에 의하여 평등원칙 위배여부를 심사하여야 한다.","독립유공자의 사망시기에 따라 그 손자녀의 보상금 지급 요건을 달리하거나 보상금 수급대상을 독립유공자의 손자녀 1명으로 한정한 ｢독립유공자예우에 관한 법률｣ 조항은 헌법에서 특히 평등을 요구하는 영역에서의 차별에 해당하지 않고 관련 기본권에 중대한 제한을 초래하지도 않는다.","평등권으로서 교육을 받을 권리는 ‘취학･진학의 기회균등’, 즉 각자의 능력에 상응하는 교육을 받을 수 있도록 학교 입학에 있어서 자의적 차별이 금지되어야 한다는 차별금지원칙을 의미 한다.",0,0,""],["2024-1","헌법",11,"신체의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","디엔에이감식시료의 채취행위는 신체의 안정성을 해한다고 볼 수 있으므로 디엔에이감식시료 채취의 근거인 ｢디엔에이신원확인 정보의 이용 및 보호에 관한 법률｣ 조항은 디엔에이감식시료의 채취대상자인 청구인의 신체의 자유를 제한한다.","강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 ｢출입국관리법｣ 조항은 과잉금지원칙 및 적법절차원칙에 위배되어 피보호자의 신체의 자유를 침해한다.","1억 원 이상의 벌금형을 선고하는 경우 노역장유치기간의 하한을 정한 ｢형법｣ 조항을 시행일 이후 최초로 공소제기되는 경우부터 적용하도록 한 ｢형법｣ 부칙조항은 형벌불소급원칙에 위배되지 않는다.","행정절차상 강제처분에 의해 신체의 자유가 제한되는 경우 강제 처분의 집행기관으로부터 독립된 중립적인 기관이 이를 통제 하도록 하는 것은 적법절차원칙의 중요한 내용에 해당한다.",2,0,""],["2024-1","헌법",12,"직업의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","의료인이 아닌 자의 문신시술업을 금지하고 처벌하는 ｢의료법｣ 조항은 문신시술자에 대하여 의료인 자격까지 요구하지 않고도, 시술자의 자격, 위생적인 문신시술 환경, 문신시술 절차 및 방법 등에 관한 규제를 통하여도 안전한 문신시술을 보장할 수 있다는 점에서 과잉금지원칙에 위배되어 문신시술을 업으로 삼고자 하는 청구인의 직업선택의 자유를 침해한다.","직업선택의 자유와 직업수행의 자유는 기본권의 주체에 대한 제한의 효과가 다르기 때문에 제한에 있어 적용되는 기준 또한 다르며, 특히 직업수행의 자유에 대한 제한의 경우 인격발현에 대한 침해의 효과가 일반적으로 직업선택 그 자체에 대한 제한에 비하여 작기 때문에, 그에 대한 제한은 보다 폭넓게 허용된다.","교육부장관이 학교법인 ○○학당에게 한 법학전문대학원 설치인가 중 여성만을 입학자격요건으로 하는 입학전형계획을 인정한 부분은 남성인 청구인의 직업선택의 자유를 제한한다.","성매매는 성판매자의 입장에서 생활의 기본적 수요를 충족하기 위한 소득활동에 해당함을 부인할 수 없으므로, 성매매를 한 자를 형사처벌 하도록 규정한 ｢성매매알선 등 행위의 처벌에 관한 법률｣ 조항은 성판매자의 직업선택의 자유를 제한하고 있다.",0,0,""],["2024-1","헌법",13,"표현의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","표현의 자유는 국민 개인적인 차원에서는 자유로운 인격발현의 수단임과 동시에 합리적이고 건설적인 의사형성 및 진리발견의 수단이 되며, 국가와 사회적인 차원에서는 민주주의 국가와 사회의 존립과 발전에 필수불가결한 기본권이다.","사회복무요원이 정당 가입을 할 수 없도록 규정한 ｢병역법｣ 조항은 사회복지시설에 근무하는 사회복무요원의 경우에는 민간 영역에서 근무하고 그 직무의 성질상 정치적 중립성을 훼손할 가능성이 거의 없음에도 불구하고 일괄적으로 정당에 가입하는 행위를 금지한다는 점에서 과잉금지원칙에 위배되어 사회복무 요원인 청구인의 정치적 표현의 자유를 침해한다.","대한민국을 모욕할 목적으로 국기를 손상, 제거 또는 오욕한 자를 처벌하는 ｢형법｣ 조항은 이러한 국기모독행위를 단순히 경범죄로 취급하거나 형벌 이외의 다른 수단으로 제재하여서는 입법목적을 효과적으로 달성하기 어렵다는 점에서 과잉금지원칙에 위배되어 해당 청구인의 표현의 자유를 침해하지 않는다.","남북합의서 위반행위로서 전단등 살포를 하여 국민의 생명･ 신체에 위해를 끼치거나 심각한 위험을 발생시키는 것을 금지하고 이를 위반한 경우 처벌하는 ｢남북관계 발전에 관한 법률｣ 조항은 그 궁극적인 의도가 북한 주민을 상대로 한 북한 체제 비판 등의 내용을 담은 표현을 제한하는 데 있다는 점에서 표현의 내용과 무관한 내용중립적 규제로 보기는 어렵다.",1,0,""],["2024-1","헌법",14,"집회의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢집회 및 시위에 관한 법률｣상의 시위는 반드시 ‘일반인이 자유로이 통행할 수 있는 장소’에서 이루어져야 하며 ‘행진’ 등 장소 이동을 동반해야만 성립한다.","집회의 자유에 대한 제한은 다른 중요한 법익의 보호를 위하여 반드시 필요한 경우에 한하여 정당화되는 것이며, 특히 집회의 금지는 원칙적으로 공공의 안녕질서에 대한 위협이 예상되는 경우에 한하여 허용될 수 있다.","집회 또는 시위를 하기 위하여 인천애(愛)뜰 중 잔디마당과 그 경계 내 부지에 대한 사용허가 신청을 한 경우 인천광역시장이 이를 허가할 수 없도록 제한하는 ｢인천애(愛)뜰의 사용 및 관리에 관한 조례｣ 조항은 헌법 제21조 제2항이 규정하는 집회에 대한 허가제 금지원칙에 위배된다.","누구든지 선거기간 중 선거에 영향을 미치게 하기 위하여 ‘그 밖의 집회나 모임’을 개최할 수 없고, 이를 위반하는 자를 처벌하는 ｢공직선거법｣ 조항은 선거의 공정이나 평온에 대한 구체적인 위험이 없는 경우에도 해당 목적을 위한 일반 유권자의 집회나 모임을 전면적으로 금지하고 위반 시 처벌한다는 점에서 과잉금지원칙에 위배되어 해당 일반 유권자의 집회의 자유를 침해한다.",3,0,""],["2024-1","헌법",15,"사생활의 비밀과 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사생활의 비밀이란 사생활에 관한 사항으로 일반인에게 아직 알려지지 아니하고 일반인의 감수성을 기준으로 할 때 공개를 원하지 않을 사항을 말한다.","사생활의 비밀과 자유는 개인의 내밀한 내용의 비밀을 유지할 권리, 개인이 자신의 사생활의 불가침을 보장받을 수 있는 권리, 개인의 양심영역이나 성적 영역과 같은 내밀한 영역에 대한 보호, 인격적인 감정세계의 존중의 권리와 정신적인 내면생활이 침해받지 아니할 권리 등을 보호한다.","어린이집에 폐쇄회로 텔레비전(CCTV: Closed Circuit Television)을 원칙적으로 설치하도록 정한 ｢영유아보육법｣ 조항은 CCTV 설치로 보육교사 및 영유아의 신체나 행동이 그대로 CCTV에 촬영･녹화된다는 점에서 보육교사 및 영유아의 사생활의 비밀과 자유를 제한한다.","인터넷 통신망을 통해 송·수신하는 전기통신에 대한 감청을 범죄수사를 위한 통신제한조치의 하나로 정한 ｢통신비밀보호법｣ 조항은 인터넷회선 감청을 위해 법원의 허가를 얻도록 정하고 있으나, 해당 인터넷회선을 통하여 흐르는 모든 정보가 감청 대상이 되므로 개별성, 특정성을 전제로 하는 영장주의를 유명무실하게 함으로써 감청대상자인 청구인의 사생활의 비밀과 자유를 침해한다.",3,0,""],["2024-1","헌법",16,"개인정보자기결정권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","개인정보자기결정권의 보호대상이 되는 개인정보는 개인의 신체, 신념, 사회적 지위, 신분 등과 같이 개인의 인격주체성을 특징짓는 사항으로서 그 개인의 동일성을 식별할 수 있게 하는 일체의 정보이고, 반드시 개인의 내밀한 영역이나 사사(私事)의 영역에 속하는 정보에 국한되지 않고 공적 생활에서 형성되었거나 이미 공개된 개인정보까지 포함한다.","디엔에이신원확인정보는 개인 식별을 목적으로 디엔에이감식을 통하여 취득한 정보로서 당해 정보만으로는 특정개인을 식별할 수 없더라도 다른 정보와 쉽게 결합하여 당해 개인을 식별할 수 있는 정보에 해당하는 개인정보이다.","디엔에이감식시료의 채취대상자가 사망할 때까지 디엔에이신원 확인정보를 데이터베이스에 수록, 관리할 수 있도록 규정한 ｢디엔에이신원확인정보의 이용 및 보호에 관한 법률｣ 조항은 대상자의 재범위험성을 고려하지 않고 일률적으로 대상자가 사망할 때까지 디엔에이신원확인정보를 보관한다는 점에서 과잉금지원칙에 위배되어 디엔에이신원확인정보 수록 대상자인 청구인의 개인정보자기결정권을 침해한다.","개별 의료급여기관으로 하여금 수급권자의 진료정보를 국민건강 보험공단에 알려줄 의무 등 의료급여 자격관리 시스템에 관하여 규정한 보건복지부 고시조항은 동 조항에 의해 수집되는 정보의 범위가 건강생활유지비의 지원 및 급여일수의 확인을 위해 필요한 정보로 제한되어 있다는 점에서 과잉금지원칙에 위배되어 해당 수급권자인 청구인의 개인정보자기결정권을 침해하지 않는다.",2,0,""],["2024-1","헌법",17,"양심의 자유에 관한 설명 중 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 내용상 단순히 국법질서나 헌법체제를 준수하겠다는 취지의 서약을 할 것을 요구하는 준법서약은 어떤 구체적이거나 적극적인 내용을 담지 않은 채 단순한 헌법적 의무의 확인･ 서약에 불과하다 할 것이어서 양심의 영역을 건드리는 것이 아니다. ㉡ 양심형성의 자유는 외부의 간섭과 강제로부터 절대적으로 보호되는 기본권이므로, 이적표현물의 소지·취득행위가 반포나 판매로 이어지거나 이를 통해 형성된 양심적 결정이 외부로 표현되고 실현되지 아니한 단계에서 이를 처벌하는 것은 헌법상 허용되지 아니한다. ㉢ 가해학생에 대한 조치로 피해학생에 대한 서면사과를 규정한 ｢학교폭력예방법｣ 조항은 서면사과의 교육적 효과는 가해학생에 대한주의나경고또는 권고적인조치만으로는 달성하기 어렵다는 점을 고려할 때 과잉금지원칙에 위배되어 가해학생의 양심의 자유를 침해하지 않는다. ㉣ 보안관찰처분은 보안관찰처분대상자가 보안관찰해당범죄를 다시 저지를 위험성이 내심의 영역을 벗어나 외부에 표출되는 경우에 재범의 방지를 위하여 내려지는 특별예방적 목적의 처분이므로, 보안관찰처분의 요건과 절차를 규정한 ｢보안관찰법｣ 제2조, 제3조, 제4조, 제12조 제1항, 제14조는 보안관찰처분대상자의 양심의 자유를 침해하지 아니한다.","㉠(X) ㉡(O) ㉢(O) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(O) ㉡(O) ㉢(X) ㉣(X)",1,0,""],["2024-1","헌법",18,"재산권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","상업용 음반 등에 관한 저작재산권자의 공연권 및 저작인접권자의 보상청구권은 헌법 제23조에 의하여 보장되는 재산적 가치가 있는 권리에 해당한다.","헌법 제23조 제3항은 재산권 수용의 주체를 한정하지 않고 있으므로 그 수용의 주체를 국가 등의 공적 기관에 한정하여 해석할 이유가 없다.","금융위원회위원장이 2019. 12. 16. 시중 은행을 상대로 투기지역･ 투기과열지구 내 초고가 아파트(시가 15억 원 초과)에 대한 주택구입용 주택담보대출을 2019. 12. 17.부터 금지한 조치는 투기적 대출수요뿐 아니라 실수요자의 경우에도 예외 없이 대출을 금지한 점 등을 고려할 때, 해당 주택담보대출을 받고자 하는 청구인의 재산권을 침해한다.","피상속인에 대한 부양의무를 이행하지 않은 직계존속의 경우를 상속결격사유로 규정하지 않은 ｢민법｣ 조항은 상속관계에 관한 법적 안정성의 확보 등을 고려할 때 입법형성권의 한계를 일탈하여 다른 상속인인 청구인의 재산권을 침해하지 않는다.",2,0,""],["2024-1","헌법",19,"범죄피해자구조청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","범죄피해자구조청구권은 제9차 개정헌법에서 처음으로 도입되었다.","범죄피해자구조청구권은 생존권적 기본권으로서의 성격을 가지는 청구권적 기본권이다.","범죄피해자구조청구권은 국민의 권리로서 외국인에게는 인정되지 않는 권리이므로 외국인이 ｢범죄피해자 보호법｣에 따른 범죄 피해구조금을 신청할 수는 없다.","｢범죄피해자 보호법｣에서 제척기간을 범죄피해가 발생한 날부터 5년으로 정하더라도, 5년이라는 기간이 지나치게 단기라든지 불합리하여 범죄피해자의 구조청구권 행사를 현저히 곤란하게 하거나 사실상 불가능하게 하는 것으로는 볼 수 없다.",2,0,""],["2024-1","헌법",20,"국민의 기본의무에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢향토예비군설치법｣에 따라 예비군훈련소집에 응하여 훈련을 받는 것은 국민이 마땅히 하여야 할 의무를 다하는 것일 뿐 국가나 공익목적을 위하여 특별한 희생을 하는 것이라고 할 수 없다.","납세의무자인 국민은 자신이 납부한 세금을 국가가 효율적으로 사용하는지 여부를 감시하고 이에 대하여 이의를 제기하거나 잘못 사용되는 세금에 대하여 그 사용을 중지할 것을 요구할 수 있는 헌법상의 권리를 가진다.","헌법은 국방의 의무를 국민에게 부과하면서 병역의무의 이행을 이유로 불이익한 처우를 하는 것을 금지하고 있는데, 여기서 ‘불이익한 처우’라 함은 법적인 불이익뿐만이 아니라 사실상, 경제상의 불이익을 모두 포함하는 것으로 이해해야 한다.","공중보건의사에 편입되어 군사교육에 소집된 사람에게 사회복무 요원과 달리 군사교육 소집기간 동안의 보수를 지급하지 않도록 규정한 ｢군인보수법｣ 조항은 공중보건의사의 경우 사회복무요원과 같은 보충역으로서 대체복무를 한다는 점에서 양자를 달리 취급할 합리적인 이유가 없으므로 공중보건의사의 평등권을 침해한다.",0,0,""],["2024-1","형사법",1,"죄형법정주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","‘여러 사람의 눈에 뜨이는 곳에서 공공연하게 알몸을 지나치게 내놓거나 가려야 할 곳을 내놓아 다른 사람에게 부끄러운 느낌이나 불쾌감을 준 사람’을 처벌하는 구 ｢경범죄 처벌법｣ 제3조 제1항 제33호는 죄형법정주의에 위배된다.","｢아동･청소년의 성보호에 관한 법률｣상 공개명령 제도에 대해서는 소급입법금지의 원칙이 적용되지 않는다.","어린이집 대표자를 변경하였음에도 변경인가를 받지 않은 채 어린이집을 운영한 행위에 대해 설치인가를 받지 않고 사실상 어린이집의 형태로 운영하는 행위 등을 처벌하는 규정인 ｢영유아 보육법｣ 제54조 제4항 제1호를 적용하는 것은 죄형법정주의에 위배된다.","구 ｢공공기관의 운영에 관한 법률｣ 제53조가 공기업의 임직원으로서 공무원이 아닌 사람을 ｢형법｣ 제129조의 적용에서는 공무원으로 본다고 규정하면서도, 구체적인 공기업 지정과 관련하여 하위규범인 기획재정부장관의 고시에 의하도록 규정한 것은 죄형법정주의에 위배된다.",3,0,""],["2024-1","형사법",2,"형법의 적용범위에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","범죄에 의하여 외국에서 형의 전부 또는 일부의 집행을 받은 자에 대하여는 형을 감경 또는 면제할 수 있다.","법령 제정 당시부터 또는 폐지 이전에 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우, 그 유효기간 경과 전에 행해진 법령 위반행위의 가벌성은 소멸하므로 더 이상 행위자를 처벌할 수 없게 된다.","재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법보다 가벼워진 경우, 형의 집행을 면제한다.","캐나다 시민권자인 甲이 투자금을 교부받더라도 선물시장에 투자하여 운용할 의사나 능력이 없음에도 캐나다에서 그곳에 거주하는 대한민국 국민 A를 기망하여 직접 투자금을 수령한 경우, 甲의 행위가 캐나다 법률에 의해 범죄를 구성하고 그에 대한 소추나 형의 집행이 면제되지 않는 경우에만 우리 형법이 적용된다.",3,0,""],["2024-1","형사법",3,"고의에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","목적적 범죄체계론에 따르면 고의는 책임의 요소이다.","고의가 성립하기 위해서는 행위자가 모든 객관적 구성요건에 해당하는 사실을 인식해야 하기에 상습도박죄에 있어서 상습성은 고의의 인식 대상이다.","고의의 본질에 관한 학설 중 행위자가 결과발생의 가능성을 인식하기만 하면 고의가 성립한다고 보는 견해에 따르면 인식 있는 과실도 고의로 인정될 수 있다.","방조범은 정범의 실행을 방조한다는 방조의 고의와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 정범의 고의가 있어야 하고, 방조범에 있어서 정범의 고의는 정범에 의하여 실현되는 범죄의 구체적 내용까지 인식할 것을 요한다.",2,0,""],["2024-1","형사법",4,"위법성조각사유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","일련의 연속되는 행위로 인해 침해상황이 중단되지 아니하거나 일시 중단되더라도 추가 침해가 곧바로 발생할 객관적인 사유가 있는 경우, 그중 일부 행위가 범죄의 기수에 이르렀을지라도 정당방위의 요건 중 침해의 현재성이 인정된다.","甲이 A를 살해하기 위해 총을 쏴 A가 사망하였는데, 알고 보니 A도 甲을 살해하기 위해 甲에게 총을 조준하고 있었던 경우, 위법성이 조각되기 위해서는 주관적 정당화요소가 필요하다는 견해에 따르면 甲의 행위는 위법성이 조각된다.","위난을 피하지 못할 책임 있는 자에게는 긴급피난이 허용되지 않기에 이들이 감수해야 할 범위를 넘는 위난에 처한 때에도 긴급피난은 허용되지 않는다.","무고죄는 국가의 형사사법권의 적정한 행사뿐만 아니라 개인이 부당하게 처벌받지 아니할 이익을 부수적으로 보호하는 죄이기에, 피무고자의 승낙이 있는 경우에는 위법성이 조각된다.",0,0,""],["2024-1","형사법",5,"다음 중 甲에게 정당행위가 인정되는 것은? (다툼이 있는 경우 판례에 의함)","사채업자 甲이 채권추심을 위하여 채무자 A에게 채무를 변제하지 않으면 A가 숨기고 싶어하는 과거 행적과 사채를 쓴 사실 등을 남편과 시댁에 알리겠다는 문자메시지를 발송한 경우","A주식회사로부터 공립유치원의 놀이시설 제작 및 설치공사를 하도급 받은 甲이 유치원 행정실장 등에게 공사대금의 직접 지급을 요구하였으나 거절당하자, 공사대금 직불청구권이 있는 놀이시설의 정당한 유치권자로서 공사대금 채권을 확보할 필요가 있어 놀이시설의 일부인 보호대를 칼로 뜯어내고 일부 놀이시설은 철거하는 방법으로 공무소에서 사용하는 물건을 손상한 경우","甲이 자신의 가옥 앞 도로가 폐기물 운반 차량의 통행로로 이용되어 가옥 일부에 균열 등이 발생하자 위 도로에 트랙터를 세워두거나 철책 펜스를 설치함으로써 위 차량의 통행을 불가능하게 한 경우","학교법인의 전 이사장 A가 부정입학과 관련된 금품수수 혐의로 구속되었다가 그 학교법인이 설립한 B대학교의 총장으로 선임 됨에 따라 학내 갈등을 빚던 중 총학생회 간부 甲이 대학 운영의 정상화를 위해 A와의 대화를 꾸준히 요구하였으나, 학교의 소극적인 태도로 인해 면담이 성사되지 않자 A를 직접 찾아가 면담하는 이외에는 다른 방도가 없다는 판단 아래 A와의 면담을 추진하는 과정에서 총장실 진입을 시도하거나, 교무위원회 회의실에 들어가 총장의 사퇴를 요구하면서 이를 막는 학교 교직원들과 길지 않은 시간 동안 실랑이를 벌인 경우",3,0,""],["2024-1","형사법",6,"다음 사례에 대하여 위법성 인식의 체계적 지위에 관한 학설의 설명으로 가장 적절한 것은? A는 관장 B가 운영하는 복싱클럽에 회원등록을 한 후 등록을 취소하는 문제로 B로부터 질책을 들은 다음 약 1시간이 지나 다시 복싱클럽을 찾아와 B에게 항의를 하였다. 그 과정에서 A와 B가 서로 멱살을 잡아당기거나 뒤엉켜 몸싸움을 벌였다. 이를 지켜보던 코치 甲은 A가 왼손을 주머니에 넣어 특정한 물건을 꺼내 움켜 쥐자, 조금만 주의를 기울였으면 흉기가 아니라는 것을 알 수 있었음에도 불구하고 B를 찌르기 위해 흉기를 꺼낸다고 오인하여 A를 다치게 해서라도 이를 막고자 A의 왼손을 때려 손가락골절상을 입혔다. 그러나 A가 움켜쥔 물건은 휴대용 녹음기로 밝혀졌다.","엄격고의설에 따르면 甲에게는 A에 대한 상해죄의 고의가 인정된다.","제한고의설에 따르면 甲이 현실적으로 자신의 행위가 위법하다고 인식하지 못했지만 위법성을 인식할 가능성이 있었기에 甲에게는 A에 대한 과실치상죄가 성립한다.","엄격책임설에 따르면 甲에게는 A에 대한 상해죄의 고의가 조각된다.","법효과제한책임설에 따르면 甲에게는 A에 대한 과실치상죄가 성립한다.",3,0,""],["2024-1","형사법",7,"결과적 가중범과 과실범에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ ｢형법｣ 제188조의 교통방해치사상죄가 성립하려면 교통방해 행위와 사상의 결과 사이에 상당인과관계가 있어야 하고 행위 시에 결과의 발생을 예견할 수 있어야 한다. 그 행위와 결과 사이에 피해자나 제3자의 과실 등 다른 사실이 개입되었을지 라도 그와 같은 사실이 통상 예견될 수 있는 것이라면 상당인과 관계가인정된다. ㉡ ｢형법｣상결과적가중범이성립하기위해서는고의나과실에의한 기본범죄가있어야하고, 이로인해중한결과가발생하여야한다. ㉢ 결과적 가중범의 공동정범이 성립하기 위해서는 기본행위를 공동으로할의사뿐만아니라결과를공동으로할의사도필요하다. ㉣ 실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우, 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 되었다면 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 진다.","㉠㉡","㉡㉢","㉢㉣","㉠㉣",1,0,""],["2024-1","형사법",8,"미수에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲은 A가 술에 만취하여 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 A를 간음하였으나, 실제로는 A가 심신상실 또는 항거불능의 상태에 있지 않았던 경우, 甲에게는 준강간죄의 불능미수가 성립한다.","甲은 A가 운영하는 주점에서 양주를 절취할 목적으로 야간에 그 주점의 잠금장치를 뜯고 침입하여 주점 내 진열장에 있던 양주를 미리 준비한 바구니에 담던 중, A가 주점으로 돌아오는 소리가 들려 양주를 주점에 그대로 둔 채 도망가다가 A에게 붙잡히자 체포를 면탈하기 위해 A를 폭행한 경우, 甲에게는 준강도죄의 미수범이 성립한다.","甲이 금품을 훔칠 목적으로 A의 집에 담을 넘어 침입한 후 부엌에서 금품을 물색하던 중 발각되어 도주한 경우, 甲에게는 절도죄의 실행의 착수가 인정되지 않는다.","甲이 A를 강간하려고 속옷을 강제로 벗기고 음부를 만지던 중 A가 수술한 지 얼마 되지 않아 배가 아프다면서 애원하는 바람에 간음행위를 중단한 경우, 甲에게는 중지미수의 성립요건인 ‘자의성’이 인정되지 않는다.",2,0,""],["2024-1","형사법",9,"공동정범과 간접정범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","포괄일죄의 범행 도중에 공동정범으로 범행에 가담한 자는 그 가담 이후의 범행에 대해서만 공동정범으로 책임을 지고, 그 가담 이전에 이미 이루어진 종전의 범행을 인식하고 범행에 가담한 경우라도 그 가담 이전의 범행에 대해서는 공동정범으로 책임을 지지 않는다.","수표금액의 지급 또는 거래정지처분을 면할 목적으로 금융기관에 허위신고한 자를 처벌하는 구 ｢부정수표 단속법｣ 제4조의 허위 신고죄와 관련하여, 발행인이 아닌 자는 허위신고의 고의가 없는 발행인을 이용하여 간접정범의 형태로 구 ｢부정수표 단속법｣ 제4조의 허위신고죄를 범할 수 없다.","비공무원 甲이 소속 예비군동대 방위병 乙에게 ‘자신이 예비군훈련에 불참했으나 예비군훈련 참가 확인서를 발급해 달라’는 취지의 부탁을 하자, 확인서 작성권자인 동대장 A의 직무를 보좌하는 乙은 이를 A에게 보고하여 甲의 불참 사실을 모르는 A로부터 甲의 예비군 훈련 참가 여부를 확인하여 확인서를 발급하도록 지시받았으나 미리 A의 직인을 찍어 보관하고 있던 용지를 이용하여 확인서를 발급해 준 경우, 甲에게는 허위공문서작성죄의 간접정범의공범이 성립하지 않는다.","공동정범의 본질에 관한 범죄공동설에 따르면, 고의범과 과실범 상호간에는 공동정범이 인정되지 않는다.",2,0,""],["2024-1","형사법",10,"교사범과 방조범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","교사자의 교사행위에 의해 정범이 범죄의 실행을 결의하게 되었다면, 비록 정범에게 범죄의 습벽이 있어 그 습벽과 함께 교사행위가 원인이 되어 정범이 범죄를 실행하게 되었다고 하더라도 교사범이 성립한다.","甲이 乙에게 A의 주거에 침입할 것을 교사하였으나 乙은 A의 승낙을 얻어 정당하게 A의 주거에 들어간 경우, 공범종속성설 중 제한종속형식에 의하면 甲에게는 주거침입죄의 교사범이 성립하지 않는다.","도박의 습벽이 있는 甲이 도박의 습벽이 없는 乙의 도박을 방조한 경우, 甲에게는 상습도박죄의 방조범이 성립한다.","甲으로부터 A의 불륜관계를 이용해 A를 공갈할 것을 교사받은 乙은 A의 불륜 현장을 촬영한 후 그 사실을 甲에게 알렸으나, 甲이 乙에게 수고비를 줄테니 촬영물을 넘기고 공갈을 단념하라고 만류하였음에도, 乙이 甲의 제안을 명시적으로 거절하고 돈을 주지 않으면 촬영물을 유포하겠다고 A에게 겁을 주어 돈을 받아낸경우, 甲은공갈죄의공범관계에서이탈한것으로볼 수있다.",3,0,""],["2024-1","형사법",11,"죄수에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","하나의 사건에 관하여 한 번 선서한 증인이 같은 기일에 여러 가지 사실에 관하여 기억에 반하는 허위의 진술을 한 경우, 1개의 위증죄만이 성립한다.","한 개의 행위가 서로 다른 둘 이상의 구성요건을 실현하는 경우 에는 상상적 경합이 성립하나, 한 개의 행위가 동일한 구성 요건을 2회 이상 실현하는 경우에는 상상적 경합이 성립하지 않는다.","주식회사의 대표이사가 타인을 기망하여 그 회사가 발행하는 신주를 인수하게 한 후 그로부터 납입받은 신주인수대금을 보관하던 중 횡령한 경우, 신주인수대금을 횡령한 행위는 사기죄의 불가벌적 사후행위에 해당하지 않는다.","같은 날 무면허운전 행위를 여러 차례 반복한 경우, 그 범의의 단일성 내지 계속성이 인정되지 않거나 범행 방법 등이 동일하지 않다면 각 무면허운전 범행은 실체적 경합 관계에 있다.",1,0,""],["2024-1","형사법",12,"형벌에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제48조 제1항의 ‘범인’에는 공범자도 포함되므로 피고인의 소유물은 물론 공범자의 소유물도 그 공범자의 소추 여부를 불문하고 몰수할 수 있고, 여기에서의 공범자에는 공동정범, 교사범, 방조범에 해당하는 자는 포함되나 필요적 공범관계에 있는 자는 포함되지 않는다.","｢형법｣ 제48조 제1항 제1호의 ‘범죄행위에 제공하려고 한 물건’은 범죄행위에 사용하려고 준비하였으나 실제 사용하지 못한 물건을 의미하며, 어떠한 물건을 ‘범죄행위에 제공하려고 한 물건’으로서 몰수하기 위해서는 그 물건이 유죄로 인정되는 당해 범죄행위에 제공하려고 한 물건임이 인정되어야 한다.","｢형법｣은 벌금형의 집행유예는 인정하나, 벌금형의 선고유예는 인정하지 않는다.","수뢰자가 뇌물로 받은 수표를 은행에 예금한 후 그 수표금액에 상당하는 금전을 찾아 증뢰자에게 반환한 경우, 증뢰자로부터 그 가액을 추징하여야 한다.",1,0,""],["2024-1","형사법",13,"폭행의 죄에 있어서 ‘위험한 물건’에 해당하는 것은? (다툼이 있는 경우 판례에 의함)","국회의원이 한미 자유무역협정 비준동의안의 국회 본회의 심리를 막기 위하여 의장석 앞 발언대 뒤에서 CS최루분말 비산형 최루탄 1개를 터뜨리고 최루탄 몸체에 남아있는 최루분말을 국회부의장에게 뿌린 경우, 그 최루탄과 최루분말","당구장에서 피해자가 시끄럽게 떠든다는 이유로, 주먹으로 피해자의 얼굴 부위를 1회 때리고 당구대 위에 놓여있던 당구공으로 피해자의 머리 부위를 툭툭 건드린 경우, 그 당구공","경륜장 사무실에서 술에 취해 소란을 피우면서 소화기를 집어 던졌지만, 특정인을 겨냥하여 던진 것이 아니어서 피해자들이 상해를 입지 않은 경우, 그 소화기","이혼 분쟁 과정에서 자신의 아들을 승낙 없이 중형자동차에 태우고 떠나려고 하는 피해자들 일행을 상대로 급하게 추격 또는 제지하는 과정에서 소형자동차로 중형자동차를 충격하였으나, 차량 속도가 빠르지 않았으며 상대방 차량의 손괴 정도나 피해자들이 입은 상해의 정도가 경미한 경우, 그 소형자동차",0,0,""],["2024-1","형사법",14,"성폭력범죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","자신의 웹사이트에 아동･청소년성착취물이 저장된 다른 웹사이트로 연결되는 링크를 게시하여 불특정 또는 다수인이 링크를 이용하여 별다른 제한 없이 아동･청소년성착취물에 바로 접할 수 있는 상태를 실제로 조성한 경우, ｢아동･청소년의 성보호에 관한 법률｣ 제11조 제3항에서 정한 아동･청소년성착취물을 배포하거나 공연히 전시한 것으로 평가할 수 있다.","지하철 환승에스컬레이터 내에서 카메라폰으로 일정한 시간 동안 피해자의 치마 속 신체 부위를 동영상 촬영하였으나, 경찰관 에게 발각되어 저장버튼을 누르지 않고 촬영을 종료한 경우, 구 ｢성폭력범죄의 처벌 및 피해자보호 등에 관한 법률｣상 카메라 등 이용 촬영죄의 미수범이 성립한다.","강제추행죄의 ‘폭행 또는 협박’의 의미에 있어서 폭행행위 자체가 곧바로 추행에 해당하는 경우에는 상대방의 의사를 억압할 정도의 것임을 요하지 아니하나, 폭행 또는 협박이 추행보다 시간적으로 앞서 그 수단으로 행해진 경우에는 상대방의 항거를 곤란하게 할 정도에 이르러야 한다.","피해자가 술･약물 등에 의해 완전히 의식을 잃지 않았다면 그와 같은 사유로 정상적인 판단능력과 대응･조절능력을 행사할 수 없는 상태에 있었더라도 준강제추행죄에서의 심신상실 또는 항거 불능 상태에 해당한다고 볼 수 없다.",0,0,""],["2024-1","형사법",15,"명예훼손죄와 모욕죄에 관한 설명으로 옳지 않은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ A대학교 총학생회장인 甲이 총학생회 주관의 농활 사전답사 과정에서 B를 비롯한 학생회 임원진의 음주 및 음주운전 사실을 계기로 음주운전 및 이를 묵인하는 관행을 공론화하여 ‘총학생회장으로서 음주운전을 끝까지 막지 못하여 사과드립니다.’ 라는 글을 페이스북 등에 게시한 경우, 甲에게는 B에 대한 명예 훼손죄가 성립하지 않는다. ㉡ 지역버스 노동조합 조합원인 甲이 자신의 페이스북에 집회 일정을 알리면서 노동조합 집행부인 A와 B를 지칭하며 “버스 노조 악의 축, A와 B를 구속수사하라!!”라는 표현을 적시한 경우, 甲에게는 A와 B에 대한 모욕죄가 성립한다. ㉢ 甲이 초등학생인 딸 A의 학교폭력 피해사실을 신고하여 교장이 가해학생인 B에게 학교폭력대책자치위원회의 의결에 따라 ‘피해학생에 대한 접촉, 보복행위의 금지’ 등의 조치를 하였는데, 그 후 甲이 자신의 카카오톡 계정 프로필 상태메시지에 “학교폭력범은 접촉금지!!!”라는 글과 주먹 모양의 그림말 세 개를 게시한 경우, 甲에게는 B에 대한 명예훼손죄가 성립한다. ㉣ 甲이 골프클럽 경기보조원들의 구직편의를 위해 제작된 인터넷 사이트 내 회원 게시판에 특정 골프클럽의 운영상 불합리성을 비난하는 글을 게시하면서 위 클럽담당자 A에 대하여 ‘한심 하고 불쌍한 인간’이라는 등 경멸적 표현을 한 경우, 甲에게는 A에 대한 모욕죄가 성립한다.","㉠㉡","㉡㉢","㉠㉢㉣","㉡㉢㉣",3,0,""],["2024-1","형사법",16,"스토킹범죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","빌라 아래층에 살던 사람이 주변의 생활소음에 대한 불만으로 이웃을 괴롭히기 위해 불상의 도구로 수개월에 걸쳐 늦은 밤부터 새벽 사이에 반복하여 벽 또는 천장을 두드려 ‘쿵쿵’ 소리를 내어 이를 위층에 살던 피해자의 의사에 반하여 피해자에게 도달하게 한 경우, 이는 객관적･일반적으로 상대방에게 불안감 내지 공포심을 일으키기에 충분한 행위라 볼 수 없어 스토킹 범죄를 구성하지 않는다.","전화를 걸어 상대방의 휴대전화에 벨소리가 울리게 하거나 부재중 전화 문구 등이 표시되도록 하여 상대방에게 불안감이나 공포심을 일으키는 행위는 실제 전화통화가 이루어졌는지와 상관없이 구 ｢스토킹범죄의 처벌 등에 관한 법률｣ 제2조 제1호 (다)목에서 정한 스토킹행위에 해당한다.","피해자와의 전화통화 당시 아무런 말을 하지 않은 경우, 이는 피해자가 전화를 수신하기 전에 전화 벨소리를 울리게 하거나 발신자 전화번호를 표시되도록 한 것까지 포함하여 피해자에게 불안감이나 공포심을 일으킨 것으로 평가되더라도 ‘음향, 글 등을 도달하게 하는 행위’로 볼 수 없어 스토킹행위에 해당하지 않는다.","구 ｢스토킹범죄의 처벌 등에 관한 법률｣ 제2조 제1호 각 목의 행위가 객관적･일반적으로 볼 때 이를 인식한 상대방으로 하여금 불안감 또는 공포심을 일으키기에 충분한 정도라고 평가되는 경우라도 상대방이 현실적으로 불안감 내지 공포심을 갖게 되어야 스토킹행위에 해당한다.",1,0,""],["2024-1","형사법",17,"재산죄 기초이론에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사기죄 및 컴퓨터 등 사용사기죄는 재물뿐만 아니라 재산상의 이익도 객체로 하는 재물죄 겸 이득죄이다.","절도죄는 재물만을 객체로 하는 재물죄인 반면, 강도죄는 재물뿐만 아니라 재산상의 이익도 객체로 하는 재물죄 겸 이득죄이다.","｢형법｣상 친족상도례 규정은 ｢특정경제범죄 가중처벌 등에 관한 법률｣ 제3조 제1항에 의하여 가중처벌되는 사기죄에도 적용된다.","부(父)가 혼인 외의 출생자를 인지하는 경우 ｢민법｣상 인지의 소급효는 친족상도례에 관한 규정의 적용에도 미친다고 보아야 할 것이므로, 인지가 범행 후에 이루어졌다 하더라도 그 소급효에 따라 형성되는 친족관계를 기초로 하여 ｢형법｣상 친족상도례 규정이 적용된다.",0,0,""],["2024-1","형사법",18,"절도와 강도의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","타인의 예금통장을 무단사용하여 예금을 인출한 후 바로 통장을 반환한 경우, 그 사용으로 인한 경제적 가치의 소모 정도를 불문하고 예금통장에 대한 절도죄는 성립하지 않는다.","강간범이 강간행위의 계속 중에 강도행위를 한 경우, 이후에 그 자리에서 강간행위를 계속한다 하더라도 ｢형법｣상 강도강간죄가 성립하지 않는다.","｢형법｣상 권리자의 동의없이 타인의 자동차를 일시 사용한 자는 처벌되는 데 반해, 권리자의 동의없이 타인의 원동기장치자전거를 일시 사용한 자는 처벌되지 않는다.","甲이 2024. 1. 1. 15:40경 문이 열려 있는 A의 주거에 침입하여 머물러 있다가, 같은 날 21:00경 그곳에 있던 A 소유의 시가 100만 원 상당 노트북 1대를 가지고 나와 절취한 경우, 甲에게는 야간주거침입절도죄가 성립하지 않는다.",3,0,""],["2024-1","형사법",19,"배임의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","채무자 甲이 자신의 금전채무를 담보하기 위하여 채권자 A와 자신 소유의 자동차에 관한 양도담보설정계약을 체결한 후, A에게 양도 담보설정계약에 따른 의무를 다하지 않고 이를 B에게 처분한 경우, 甲에게는 배임죄의 기수범이 성립한다.","수분양권 매도인 甲이 수분양권 매매계약에 따라 매수인 A에게 수분양권을 이전할 의무를 이행하지 않고, 수분양권 또는 이에 근거하여 향후 소유권을 취득하게 될 목적물을 미리 B에게 처분한 경우, 특별한 사정이 없는 한 甲에게는 배임죄의 기수범이 성립한다.","A주식회사의 대표이사인 甲이 대표권을 남용하는 등 그 임무에 위배하여 A주식회사 명의의 약속어음을 발행하고 그 사정을 모르는 B에게 이를 교부하였으나 아직 어음채무가 실제로 이행되기 전인 경우, 甲에게는 배임죄의 기수범이 성립한다.","甲이 A로부터 18억 원을 차용하면서 담보로 甲 소유의 아파트에 A 명의의 4순위 근저당권을 설정해 주기로 약정하였음에도 B에게 채권최고액을 12억 원으로 하는 4순위 근저당권을 설정해 준 경우, 甲에게는 배임죄의 기수범이 성립한다.",2,0,""],["2024-1","형사법",20,"횡령의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","횡령죄의 본질에 관한 영득행위설에 따르면, 보관하는 재물을 위탁의 취지에 반하여 일시사용･손괴･은닉의 목적으로 처분하는 등 불법영득의 의사가 없는 경우, 횡령죄가 성립하지 않는다.","보관자도 업무자도 아닌 甲이 위탁받은 재물의 보관자인 동시에 업무자인 乙의 업무상횡령죄를 방조한 경우, 甲에게는 업무상 횡령죄의 방조범이 성립한다.","주주나 대표이사 또는 그에 준하여 회사 자금의 보관이나 운용에 관한 사실상의 사무를 처리하는 자가 회사 소유 재산을 제3자의 자금 조달을 위하여 담보로 제공하는 등 사적인 용도로 임의 처분한 경우 횡령죄가 성립하지만, 그 처분에 관하여 주주총회나 이사회의 결의가 있었다면 횡령죄가 성립하지 않는다.","건물의 임차인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하였는데도 A에게 채권양도 통지를 하지 않고 A로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용한 경우, 별도의 약정이나 그 밖의 특별한 사정이 인정되지 않는 한 甲에게는 횡령죄가 성립하지 않는다.",2,0,""],["2024-1","형사법",21,"신용카드 관련 범죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","정상적으로 발급받은 신용카드를 소지한 카드회원 甲이 일시적인 자금궁색 등의 이유로 그 채무를 일시적으로 이행하지 못하게 되는 상황이 아니라 이미 과다한 부채의 누적 등으로 신용카드 사용으로 인한 대출금채무를 변제할 의사나 능력이 없는 상황에 처하였음에도 불구하고 신용카드를 사용한 경우, 甲에게는 사기죄가 성립한다.","甲이 현금카드 소유자 A로부터 강취한 현금카드로 현금자동 지급기에서 예금을 인출한 경우, 이는 모두 A의 예금을 강취 하고자 하는 甲의 단일하고 계속된 범의 아래에서 이루어진 일련의 행위로서 포괄하여 하나의 강도죄를 구성하므로, 현금 인출행위를 현금카드 강취행위와 분리하여 따로 절도죄로 처벌 할 수는 없다.","甲이 현금카드 소유자 A로부터 편취한 현금카드로 현금자동 지급기에서 예금을 인출한 경우, A가 예금인출을 승낙한 이상 甲의 현금 인출행위는 절도죄에 해당하지 않는다.","｢여신전문금융업법｣상 신용카드 부정사용죄와 관련하여, 동법 제70조 제1항 제4호의 ‘기망하거나 공갈하여 취득한 신용카드나 직불카드’는 ‘신용카드나 직불카드의 소유자 또는 점유자를 기망 하거나 공갈하여 그들의 자유로운 의사에 의하지 않고 점유가 배제되어 그들로부터 사실상 처분권을 취득한 신용카드나 직불 카드’라고 해석되어야 한다.",1,0,""],["2024-1","형사법",22,"사기의 죄에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 사기죄에서 피해자에게 대가가 지급된 후 피해자를 기망하여 그가 보유하고 있는 그 대가를 다시 편취한 경우, 이는 새로운 법익의 침해가 발생한 것으로서 기존에 성립한 사기죄와 별도의 새로운 사기죄가 성립한다. ㉡ 적극적 소송당사자인 원고뿐만 아니라 방어적인 위치에 있는 피고라 하더라도 허위내용의 서류를 작성하여 이를 증거로 제출하거나 위증을 시키는 등의 적극적인 방법으로 법원을 기망하여 착오에 빠지게 한 결과 승소확정판결을 받음으로써 자기의 재산상의 의무이행을 면하게 된 경우, 그 재산가액 상당에 대하여 사기죄가 성립한다. ㉢ 甲은A를기망하여A가소유한B부동산(아무런부담이없는상태 에서시가 10억원임)의 소유권을이전받음으로써 B부동산을 편취 하였는데 B부동산에는 근저당권설정등기가 경료되어 있었던 경우 (근저당권의 채권최고액은 3억 원이고, 피담보채권액은 4억 원임), ｢특정경제범죄 가중처벌등에관한 법률｣ 제3조의 적용을 전제로 하여그부동산의가액(이득액)을산정하면10억원이된다. ㉣ 금방에서마치귀금속을구입할것처럼가장하여금방주인으로부터 순금목걸이 등을 건네받은 다음 화장실에 갔다 오겠다는 핑계를 대고 도주한 경우, 사기죄가 성립한다. ㉤ 거래의 상대방이 일정한 사정에 관한 고지를 받았더라면 당해 거래에 임하지 아니하였을 것임이 경험칙상 명백한 경우, 그 거래로 인하여 재물을 수취하는 자에게는 신의성실의 원칙상 사전에 상대방에게 그와 같은 사정을 고지할 의무가 있다고 할 것이므로 이를 고지하지 아니한 것은 고지할 사실을 묵비함 으로써 상대방을 기망한 것이 되어 사기죄를 구성한다.","1개","2개","3개","4개",2,0,""],["2024-1","형사법",23,"방화죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 지붕과 문짝, 창문이 없고 담장과 일부 벽체가 붕괴된 철거 대상 건물로서 사실상 기거･취침에 사용할 수 없는 폐가의 내부와 외부에 쓰레기를 모아놓고 태워 그 불길이 폐가 주변 수목 4～5그루를 태우고 폐가의 벽을 일부 그을리게 한 경우, 甲은 일반물건방화죄의 미수범으로 처벌된다.","甲이 A의 집에 불을 놓은 후 불이 붙은 집에서 탈출하려는 A를 막아 탈출하지 못하게 함으로써 A가 결국 불에 타 사망한 경우, 甲에게는 현주건조물방화죄와 살인죄의 상상적 경합범이 성립한다.","노상에서 전봇대 주변에 놓인 쓰레기에 불을 놓아 태움으로써 공공의 위험을 발생케 한 경우 자기소유 일반물건방화죄가 성립 한다.","｢형법｣ 제167조의 일반물건방화죄는 ｢형법｣ 제166조의 일반건조물등 방화죄에 대한 관계에서 법조경합 중 특별관계에 있으므로, ｢형법｣ 제166조의 일반건조물등방화죄가 성립하는 경우에는 ｢형법｣ 제167조의 일반물건방화죄는 성립하지 않는다.",2,0,""],["2024-1","형사법",24,"다음 중 甲에게 괄호 안의 범죄가 성립되지 않는 경우는 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 甲이 인터넷을 통해 등기사항전부증명서를 열람･출력한 후, 행사할 목적으로 그 증명서 하단의 열람 일시 부분을 수정 테이프로 지우고 복사해 둔 경우 (공문서변조죄) ㉡ 甲과 乙은 乙이 甲으로부터 1,000만 원을 차용하는 것처럼 가장하여 乙의 연인 A로 하여금 이를 변제하도록 협박하기로 공모한 후, A를 보증인으로 하는 차용증을 작성하는 자리에서 甲이 위조된 100만 원권 자기앞수표 10장이 들어 있는 봉투를 乙에게 교부하면서 그 자기앞수표 자체를 봉투에서 꺼내거나 그 자기앞수표의 위조 사실을 모르는 A에게 보여주지 않은 경우 (위조유가증권행사죄) ㉢ 甲이 1995년에 미국에서 진정하게 발행된 미화 1달러권 지폐와 2달러권 지폐를 화폐수집가들이 수집하는 희귀화폐인 것처럼 만들어 행사할 목적으로 발행연도 ‘1995’를 빨간색으로 ‘1928’로 고치고, 발행번호와 미국 재무부를 상징하는 문양 및 재무부장관의 사인 부분을 지운 후 빨간색으로 다시 가공한 경우 (외국통용외국통화변조죄) ㉣ 甲은 A종중의 적법한 대표자가 아님에도 A종중 소유의 토지가 소유권보존등기가 되어 있지 않은 점을 이용하여, 자신이 A종중의 대표자인 것처럼 종중규약과 회의록을 허위로 작성한 후 이를 근거로 그 토지에 대하여 A종중을 소유자로, 甲을 A종중의 대표자로 소유권보존등기를 경료하여, 부동산 등기부상 자신을 A종중의 대표자로 등재되도록 한 경우 (공정증서원본불실기재죄) ㉤ 사법경찰관 甲은 검사로부터 ‘교통사고 피해자들로부터 사고 경위에 대해 구체적 진술을 청취하여 운전자의 도주 여부에 대해재수사할것’을요청받고는, 행사할목적으로재수사결과서를 작성하면서피해자들로부터실제진술을청취하지않고도그재수사 결과서의 ‘재수사 결과’란에 자신의 독자적인 의견이나 추측에 불과한 것을 마치 피해자들로부터 직접 들은 진술인 것처럼 기재 한 경우 (허위공문서작성죄)","1개","2개","3개","4개",1,0,""],["2024-1","형사법",25,"공무방해에 대한 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","위계로써 구체적인 공무집행을 저지하거나 현실적으로 곤란하게 하는 데까지 이르지 아니하였다 하더라도 위계에 의한 공무집행 방해죄가 성립한다.","공무원 甲이 출원인이 어업허가를 받을 수 없는 자라는 사실을 알면서도 그 직무상의 의무에 따른 적절한 조치를 취하지 않고 오히려 부하직원으로 하여금 어업허가 처리기안문을 작성하게 한 다음 甲 스스로 중간결재를 하는 등 위계로써 결재권자의 최종 결재를 받은 경우, 甲에게는 작위범인 위계에 의한 공무집행 방해죄만이 성립하고 부작위범인 직무유기죄는 따로 성립하지 아니한다.","甲과 A가 주차문제로 언쟁을 벌이던 중 112 신고를 받고 출동한 경찰관 P가 A를 때리려는 甲을 제지하자, 甲이 자신만 제지를 당한 데 화가 나서 손으로 P의 가슴을 밀치고 계속 욕설을 하면서 자신을 현행범으로 체포하며 순찰차 뒷자석에 태우려는 P의 정강이 부분을 수 차례 걷어차는 등 폭행한 경우, 이는 공무집행방해죄의 ‘폭행’에 해당하지 않는다.","｢형법｣ 제136조의 공무집행방해죄는 침해범으로서 현실적으로 직무집행이 방해되어야 기수에 이른다.",1,0,""],["2024-1","형사법",26,"공무원의직무에대한죄에관한설명중옳고그름의표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 지방자치단체의 교육기관의 장이 수사기관으로부터 징계사유를 통보받고도 징계요구를 하지 아니하여 주무부장관으로부터 징계요구를 하라는 직무이행명령을 받았다 하더라도 그에 대한 이의의 소를 제기한 경우, 수사기관으로부터 통보받은 자료 등으로 보아 징계사유에 해당함이 객관적으로 명백한 경우 등 특별한 사정이 없는 한 징계사유를 통보받은 날로부터 1개월 내에 징계요구를 하지 않았다는 것만으로 곧바로 직무를 유기한 것에 해당하지 않는다. ㉡ 공무원이 수수･요구 또는 약속한 금품에 그 직무행위에 대한 대가로서의 성질과 직무 외의 행위에 대한 사례로서의 성질이 불가분적으로 결합되어 있는 경우, 그 수수･요구 또는 약속한 금품 전부가 불가분적으로 직무행위에 대한 대가로서의 성질을 가진다. ㉢ 법령에 기한 임명권자에 의하여 임용되어 공무에 종사하여 온 사람이 나중에 임용결격자임이 밝혀져 당초의 임용행위가 무효가 된 경우, 그가 임용행위라는 외관을 갖추어 실제로 공무를 수행하였다 하더라도 수뢰죄의 주체인 공무원이 될 수 없다. ㉣ 직무유기죄는 공무원이 법령･내규 등에 의한 추상적 충근 의무를 태만히 하는 일체의 경우에 성립하는 것이 아니므로, 어떠한 형태로든 직무집행의 의사로 자신의 직무를 수행한 경우, 그 직무집행의 내용이 위법하다고 평가된다는 점만으로 직무 유기죄의 성립을 인정할 수는 없다.","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(O)",0,0,""],["2024-1","형사법",27,"국가의 기능에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","범인 스스로 도피하는 행위는 처벌되지 않으므로, 범인이 도피를 위하여 타인에게 도움을 요청하는 행위 역시 도피행위의 범주에 속하는 한 처벌되지 않고, 범인이 타인으로 하여금 허위의 자백을 하게 하는 등으로 범인도피죄를 범하게 하는 경우와 같이 그것이 방어권의 남용으로 볼 수 있을 때라 하더라도 범인도피교사죄로 처벌할 수 없다.","직권남용권리행사방해죄는 단순히 공무원이 직권을 남용하는 행위를 하였다는 것만으로 곧바로 성립하는 것이 아니라, 직권을 남용하여 현실적으로 다른 사람으로 하여금 법령상 의무 없는 일을 하게 하였거나 다른 사람의 구체적인 권리행사를 방해하는 결과가 발생하여야 하고, 그 결과의 발생은 직권남용 행위로 인한 것이어야 한다.","｢형법｣ 제151조 제1항의 범인도피죄에서 ‘죄를 범한 자’라 함은 범죄의 혐의를 받아 수사대상이 되어 있는 자를 포함하고, 나아가 벌금 이상의 형에 해당하는 죄를 범한 자라는 것을 인식 하면서도 도피하게 한 경우에는 그 자가 당시에는 아직 수사 대상이 되어 있지 않았다고 하더라도 범인도피죄가 성립한다.","증인의 증언은 그 전부를 일체로 관찰･판단하는 것이므로 선서한 증인이 일단 기억에 반하는 허위의 진술을 하였더라도 그 신문이 끝나기 전에 그 진술을 철회･시정한 경우 위증이 되지 않는다.",0,0,""],["2024-1","형사법",28,"고소･고발에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 친고죄의 공범 중 그 1인 또는 수인에 대한 고소 또는 그 취소는 다른 공범자에 대하여도 효력이 있고, 여기의 공범에는 ｢형법｣ 총칙상의 공범뿐만 아니라 필요적 공범도 포함된다. ㉡ ｢조세범 처벌절차법｣에 따라 범칙사건에 대한 고발이 있는 경우 그 고발의 효력은 범칙사건에 관련된 범칙사실의 전부에 미치고 한개의 범칙사실의일부에대한고발은그전부에대하여 효력이 생긴다. ㉢ 친고죄에 있어서 고소불가분의 원칙을 규정한 ｢형사소송법｣ 제233조는 반의사불벌죄에 관하여도 적용된다. ㉣ 고소인이 수사기관에서 조사를 받으면서 ‘법대로 처벌하되 관대한 처분을 바란다’는 취지로한진술은고소의취소라고 보기 어렵다. ㉤ 고소는 서면 또는 구술로 검사 또는 사법경찰관에게 하면 충분 하므로, 경찰청 홈페이지에 ‘甲을 철저히 조사해 달라’는 취지의 민원을 접수한 것만으로도 적법한 고소에 해당한다.","2개","3개","4개","5개",0,0,""],["2024-1","형사법",29,"피의자신문에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구속영장 발부에 의하여 적법하게 구금된 피의자가 피의자신문을 위한 출석요구에 응하지 아니하면서 수사기관 조사실에의 출석을 거부하는 경우, 수사기관은 그 구속영장의 효력에 의하여 피의자를 조사실로 구인할 수 있다.","피의자의 진술은 영상녹화할 수 있고, 이 경우 피의자에게 미리 영상녹화사실을 알려주고 동의를 받아야 한다.","변호인이 검찰수사관으로부터 “구속된 피의자가 변호인 참여 없이 조사를 받지 않겠다고 하니 즉시 와달라”는 연락을 받고 조사실에 도착하여 피의자 옆에 앉으려고 하자, 검찰수사관이 조사실의 장소적 제약 등과 같은 특별한 사정이 없음에도 변호인에게 피의자 후방에 앉으라고 요구한행위는변호인의변호권을침해한다.","검사 또는 사법경찰관은 피의자를 신문하는 경우, 피의자의 연령･ 성별･국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 때에는 직권으로 피의자와 신뢰관계에 있는 자를 동석하게 할 수 있다.",1,0,""],["2024-1","형사법",30,"현행범인체포에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","범죄를실행하고있거나실행하고난직후의사람을현행범인이라한다.","甲이 X고등학교 앞길에서 피해자 A와 싸움을 하자, A의 친구 B가 112 신고를 하고 甲이 도주하는지 여부를 계속 감시하고 있었다. 그 후 경찰이 위 범행현장에 인접한 위 학교 운동장에 출동하였고, B가 甲을 범인으로 지목하자 위 싸움이 있은지 10분 정도 경과한 상황에서, 경찰이 곧바로 위 운동장에서 甲을 현행범인으로 체포한 경우 그 체포는 위법하다.","음주운전 중 교통사고를 내고 의식불명 상태에 빠져 병원으로 후송된 운전자 甲의 신체 내지 의복류에 주취로 인한 냄새가 강하게 나는 경우, 甲은 ｢형사소송법｣ 제211조 제2항 제3호가 정하는 ‘신체나 의복류에 증거가 될 만한 뚜렷한 흔적이 있을 때’의 준현행 범인에 해당한다.","체포한 피의자를 구속하고자할때에는 체포한 때부터48시간 이내에 구속영장을 청구해야 하는데, 검사 또는 사법경찰관리가 아닌 자에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 또는 사법 경찰관리에게 인도된 경우 위 48시간의 기산점은 체포시가 아니라 검사 또는 사법경찰관리가 현행범인을 인도받은 때이다.",1,0,""],["2024-1","형사법",31,"구속전피의자심문에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구속전피의자심문조서는 ｢형사소송법｣ 제315조 제3호의 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’로서 증거능력이 인정된다.","체포되지 않은 피의자에 대하여 구속영장을 청구받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인을 위한 구속영장을 발부하여 피의자를 구인한 후 심문하여야 한다. 다만, 피의자가 도망하는 등의 사유로 심문할 수 없는 경우에는 그러하지 아니하다.","심문은 법원청사 내에서 하여야 하나, 피의자가 출석을 거부하거나 질병 기타 부득이한 사유로 법원에 출석할 수 없는 때에는 경찰서, 구치소 기타 적당한 장소에서 심문할 수 있다.","심문할 피의자에게 변호인이 없어 지방법원판사가 직권으로 변호인을 선정한 경우, 그 선정은 피의자에 대한 구속영장 청구가 인용된 경우를 제외하고는 제1심까지 효력이 있다.",3,0,""],["2024-1","형사법",32,"압수･수색에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 압수·수색영장의 집행에 착수하여 압수·수색을 실시하고 그 집행을 종료하였다면, 동일한 장소 또는 목적물에 대하여 다시 압수·수색할 필요가 있고 그 영장의 유효기간이 남아있다고 하더라도 그 영장에 의하여 다시 압수·수색할 수는 없다.","피압수자가 수사기관에 압수･수색영장의 집행에 참여하지 않는다는 의사를 명시하였더라도, 특별한 사정이 없는 한 그 변호인에게는 미리 집행의 일시와 장소를 통지하는 등 압수･수색영장의 집행에 참여할 기회를 별도로 보장하여야 한다.","수사기관이 압수·수색영장을 집행함에 있어 그 처분을 받는 자가 여러 명일 경우, 그 장소의 관리책임자에게 영장을 제시하였다면, 그곳에서 물건을 소지하고 있는 다른 사람에게 따로 영장을 제시하지 않고 그 물건을 압수할 수 있다.","甲이 사법경찰관에게 휴대전화를 임의제출하면서 클라우드 등 제3자가 관리하는 원격지에 저장되어 있는 전자정보를 제출한다는 의사로 사법경찰관에게 클라우드 등에 접속하기 위한 아이디와 비밀번호를 임의로 제공한 경우, 위 클라우드 등에 저장된 전자 정보를 임의제출하는 것으로 볼 수 있다.",2,0,""],["2024-1","형사법",33,"정보저장매체의 압수･수색에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관의 전자정보에 대한 압수·수색은 원칙적으로 영장 발부의 사유로 된 범죄 혐의사실과 관련된 부분만을 문서 출력물로 수집하거나 수사기관이 휴대한 저장매체에 해당 파일을 복제하는 방식으로 이루어져야 하고, 수사기관 사무실 등 외부로 저장매체 자체를 직접 반출하는 방식으로 압수·수색하는 것은 예외적으로만 허용된다.","압수의목적을달성하기에현저히곤란한사정이인정되어전자정보가 담긴 저장매체를 수사기관 사무실 등으로 옮겨 혐의사실과 관련된 전자정보만을 복제·탐색·출력하는 경우에도, 피압수·수색 당사자나 변호인에게 참여의 기회를 보장하여야 한다.","수사기관이 범죄 혐의사실과 관련 있는 전자정보를 선별 압수한 후 그와 관련이 없는 나머지 정보를 삭제･폐기･반환하지 아니한 채 보관하고 있더라도, 사후에 위 나머지 정보에 대하여 법원으로부터 압수･수색영장을 발부받거나 피고인 또는 변호인이 이를 증거로 함에 동의하였다면 증거로 사용할 수 있다.","수사기관이 압수·수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 서버에 저장된 전자정보를 압수·수색하기 위해서는 그 영장에 적힌 ‘압수할 물건’에 별도로 원격지 서버 저장 전자정보가 특정되어 있어야 하고, ‘압수할 물건’에 컴퓨터 등 정보처리장치 저장 전자정보만 기재되어 있다면 컴퓨터 등 정보처리장치를 이용하여 원격지 서버 저장 전자정보를 압수할 수는 없다.",2,0,""],["2024-1","형사법",34,"증거에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣이 수사기관에서 작성된 조서 등 서면증거에 대하여 일정한 요건을 충족하는 경우에 증거능력을 인정하는 것은 실체적 진실발견의 이념과 소송경제의 요청을 고려하여 예외적으로 허용하는것일뿐이므로증거능력인정요건에관한규정은엄격하게 해석･적용하여야 한다.","수사기관은 영장 발부의 사유로 된 범죄 혐의사실과 관계가 없는 증거를 압수할 수 없고, 별도의 영장을 발부받지 아니하고서는 압수물 또는 압수한 정보를 그 압수의 근거가 된 압수･수색영장 혐의사실과 관계가 없는 범죄의 유죄 증거로 사용할 수 없다.","법원은 범죄의 구성요건이나 법률상 규정된 형의 가중･감면의 사유가 되는 경우를 제외하고는, 법률이 규정한 증거로서의 자격이나 증거 조사방식에 구애됨이 없이 상당한 방법으로 조사하여 양형의 조건이 되는 사항을 인정할 수 있다. 다만, 당사자가 직접 수집하여 제출 하기 곤란하다고 하여 직권으로 양형조건에 관한 ｢형법｣ 제51조의 사항을 수집·조사할 수 있는 것은 아니다.","자백에대한보강증거는범죄사실의전부또는중요부분을인정할수 있는 정도가 되지 않더라도, 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 충분하다. 또한 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있고, 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다.",2,0,""],["2024-1","형사법",35,"증명에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","증거위조죄의 적용대상인 ‘증거’에는 범죄의 성립에 관한 증거 외에 양형의 기초가 되는 정상관계 사실에 관한 증거도 포함된다. 그런데 양형의 기초가 되는정상관계사실은 매우복잡하고비유형적일 뿐만 아니라 ｢형사소송법｣ 제307조가 규정한 엄격한 증명의 대상에도 해당하지 않는다.","탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입증취지 등을 미리 구체적으로 명시하여야 할 것이나, 증명력을 다투고자 하는 증거의 어느 부분에 의하여진술의어느부분을다투려고한다는것을사전에상대방에게 알려야 하는 것은 아니다.","어떤 소송절차가 진행된 내용이 공판조서에 기재되지 않았다고 하여 당연히 그 소송절차가 당해 공판기일에 행하여지지 않은 것으로 추정되는 것은 아니고 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있고, 이는 소송법적 사실이므로 자유로운 증명의 대상이 된다.","범행에 관한 간접증거만이 존재하고 더구나 그간접증거의 증명력에 한계가 있는 경우, 범인으로 지목되고 있는 자에게 범행을 저지를 만한 동기가 발견되지 않는다면, 만연히 무엇인가 동기가 분명히 있는데도 이를 범인이 숨기고 있다고 단정할 것이 아니라 반대로 간접증거의 증명력이 그만큼 떨어진다고 평가하는 것이 형사증거법의 이념에 부합하는 것이다.",1,0,""],["2024-1","형사법",36,"자백배제법칙과 증거능력에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관은 수사 중인 사건의 범죄 혐의를 밝히기 위한 목적으로 합리적인근거없이별개의사건을부당하게수사하여서는아니되고, 다른 사건의 수사를 통하여 확보된 증거 또는 자료를 내세워 관련 없는 사건에 대한 자백이나 진술을 강요하여서도 아니 된다.","피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다.","피고인의 자백의 신빙성 유무를 판단할 때에는 그 자백에 ｢형사소송법｣ 제309조에 정한 사유 또는 자백의 동기나 과정에 합리적인 의심을 갖게 할 상황이 있었는지를 판단하여야 한다.","증거조사를 마친 증거가 증거능력이 없음을 이유로 한 이의신청을 이유있다고 인정할 경우에 법원은 그 증거의 일부가 아니라 전부를 배제하는 결정을 하여야 한다.",3,0,""],["2024-1","형사법",37,"위법수집증거배제법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피의자에대한진술거부권고지는피의자의진술거부권을실효적으로 보장하여진술이강요되는것을막기위한것인데, 이러한진술거부권 고지에 관한 ｢형사소송법｣ 규정내용 및 진술거부권 고지가 갖는 실질적인 의미를 고려하면, 수사기관이 수사를 개시하는 행위를 하기전이어서피의자지위에있지아니한자에대하여진술거부권이 고지되지 아니한 때에도 그 진술의 증거능력은 인정할 수 없다.","수사기관이 피압수자 측에 참여의 기회를 보장하거나 압수한 전자정보 목록을 교부하지 않는 등 영장주의 원칙과 적법절차를 준수하지 않은 위법한 압수･수색 과정을 통하여 취득한 증거는 위법수집증거에 해당하고, 사후에 법원으로부터 영장이 발부 되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 위법성이 치유되는 것도 아니다.","수사기관이 네트워크 카메라 등을 설치･이용하여 피고인의 행동과 피고인이 본 태블릿 개인용 컴퓨터 화면내용을 일반적으로 허용되는 상당한 방법에 의하지 않고 영장 없이 촬영한 것은 수사의 비례성･ 상당성 원칙과 영장주의 등을 위반한 것이므로 그로 인해 취득한 영상물 등의 증거는 증거능력이 없다.","수사기관의 절차 위반 행위가 적법절차의 실질적인 내용을 침해 하지 아니하고, 오히려 그 증거의 증거능력을 배제하는 것이 헌법과 ｢형사소송법｣이 형사소송에 관한 절차 조항을 마련하여 적법절차의 원칙과 실체적 진실 규명의 조화를 도모하고, 이를 통하여 형사 사법 정의를 실현하려고 한 취지에 반하는 결과를 초래하는 것으로 평가되는 예외적인 경우라면, 법원은 그 증거를 유죄 인정의 증거로 사용할 수 있다.",0,0,""],["2024-1","형사법",38,"전문증거에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 어떤 진술이 기재된 서류가 그 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 때는 전문증거가 되지만, 그와 같은 진술을 하였다는 것 자체 또는 진술의 진실성과 관계없는 간접사실에 대한 정황증거로 사용될 때는 반드시 전문증거가 되는 것이 아니다. ㉡ ｢형사소송법｣ 제312조 제1항은 검사가 작성한 피의자신문조서는 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다고 규정하고 있다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한내용이 실제 사실과 부합한다는 것을 의미한다. ㉢ 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 ｢형사소송법｣ 제312조 제1항이 적용되지 아니하므로 이를 유죄의 증거로 쓸 수 있다. ㉣ 재전문진술이기재된조서는｢형사소송법｣ 제312조또는제314조에 따라 증거능력이 인정될 수 있는 경우에 해당하여야 함은 물론 ｢형사소송법｣ 제316조 제2항에 따른 요건을 갖추어야 예외적으로 증거능력이 있다. ㉤ ｢형사소송법｣은 전문진술에 대하여 제316조에서 실질상 단순한 전문의 형태를 취하는 경우에 한하여 예외적으로 그 증거능력을 인정하는 규정을 두고 있을 뿐, 재전문진술이나 재전문진술을 기재한 조서에 대하여는 달리 그 증거능력을 인정하는 규정을 두고 있지 아니하므로, 피고인이 증거로 하는 데 동의하더라도 ｢형사소송법｣ 제310조의2의규정에의하여이를증거로할수없다.","2개","3개","4개","5개",0,0,""],["2024-1","형사법",39,"증거동의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣ 제318조에 규정된 증거동의는 소송 주체인 검사와 피고인이 하는 것이고, 피고인이 변호인과 함께 출석한 공판기일의 공판조서에 검사가 제출한 증거에 대하여 동의한다는 기재가 되어 있다면 이는 피고인이 증거동의를 한 것으로 보아야 하고, 그 기재는 절대적인 증명력을 가진다.","｢형사소송법｣ 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다.","피고인이나 변호인이 무죄에 관한 자료로 제출한 서증 가운데 도리어 유죄임을 뒷받침하는 내용이 있다고 하여도, 법원은 그 서류의 진정성립 여부 등을 조사하고 아울러 그 서류에 대한 피고인이나 변호인의 의견과 변명의 기회를 주지 않았다면 상대방의 원용(동의)이 있더라도 그 서증을 유죄인정의 증거로 쓸 수 없다.","피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 ｢형사소송법｣ 제318조 제1항에 의한 증거동의가 있는 것으로 간주한다. 다만, 피고인이 출정하지 아니하더라도 대리인 또는 변호인이 출정한 때에는 예외로 한다.",2,0,""],["2024-1","형사법",40,"다음 사례에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함) 甲은 2022. 1. 10.경 관할법원에 피해자 A를 상대로 허위의 지급 명령을 신청하고 이에 속은 그 법원 판사로부터 위 신청서와 같은 취지의 지급명령을 송달받은 후 지급명령정본에 집행문을 부여받아 A로부터 1,000만 원을 편취하였다. 신고를 받은 사법경찰관 P는 2023. 3. 10. 15:00경 甲이 운영하는 회사 사무실에서 甲을 사기죄로 적법하게 긴급체포하였고, ‘A와 주고받은 대화내용’이 기재된 수첩 (증 제1호)을 발견하자 임의제출을 거부하는 甲으로부터 영장 없이 이를 압수하였다. P는 체포 당일 경찰서에서 甲을 조사하였고, 甲은 “자신의 집에 A가 자신을 무고한 것임을 증명할 자료가 있다”라고 주장하며 범행을 부인하였다. P는 자료를 확보하기 위하여 2023. 3. 11. 16:00경 甲과 함께 甲의 집으로 갔으나 이를 발견하지 못하고 오히려 ‘甲이 A로부터 돈을 받은 내역’이 기재된 통장(증 제2호)을 발견 하자 임의제출을 거부하는 甲으로부터 영장 없이 이를 압수하였다. 이후 P는 甲에 대하여 검사를 통해 적법하게 구속영장만을 청구 하였으나, 지방법원 판사는 2023. 3. 12. 17:00경 甲의 방어권보장이 필요하다며 구속영장을 기각하였다. 이에 甲은 즉시 석방되었고, P는 위 통장(증 제2호)만을 환부하였다. 이후 甲은 위 사기죄로 불구속기소되었다.","만약 위 사기 혐의가 인정되고 甲이 허위의 내용으로 신청한 지급명령이 그대로 확정되었다면, 소송사기의 방법으로 승소판결을 받아 확정된 경우와 마찬가지로 사기죄는 이미 기수에 이른 것이다.","P가 통장(증 제2호)을 환부한 후에도 수첩(증 제1호)을 계속 보관하는 것은 ｢형사소송법｣ 제216조 제1항 제2호의 ‘체포현장 에서의 압수’에 의한 것이므로 적법하다.","P가 통장(증 제2호)을 압수한 것은 ｢형사소송법｣ 제217조의 요건을 갖추지 못하여 위법하다.","만약 검찰송치 전 P가 甲의 사기 혐의에 대한 결정적인 객관적 증거를추가로확보하였다면, 甲이외국으로출국하려하는등 긴급한 사정이 있더라도, P는 甲을 위 사기 혐의를 이유로 재차 긴급체포 할 수 없다.",1,0,""],["2024-1","경찰학",1,"영미법계국가의경찰에관한설명으로가장적절하지않은 것은?","영미법계 경찰개념은 ‘시민으로부터 부여받은 자치권에 근거하여 국민의 생명･신체･재산을 보호하고 범죄를 수사하며, 다양한 공공서비스를 제공하는 작용’이라고 설명된다.","영미법계 경찰개념은 국왕의 절대적 권력으로부터 유래된 경찰권을 전제로 한다.","영미법계 경찰개념은 경찰과 국민을 수평적･상호협력 동반자 관계로 본다.","영미법계 경찰은 비권력적 수단을 중시한다.",1,0,""],["2024-1","경찰학",2,"다음의 ㉠, ㉡에 들어갈 내용으로 가장 적절한 것은? (㉠)과 (㉡)의 구별은 프랑스에서 유래한 것으로, 경찰에 의하여 보호되는 법익을 기준으로 한다. 원래 (㉠)은 사회적으로 보다 우월한 가치를 지닌 법익을 보호하기 위한 경찰활동을 의미하였으나, 나중에는 사상･종교･집회･결사･언론의 자유에 대한 정보수집･단속과 같은 국가의 존립과 유지를 보장하기 위하여 국가적 기관 및 제도에 대한 위해를 방지하는 활동을 의미하게 되었다. 이에 비해 (㉡)은 교통의 안전, 풍속의 유지, 범죄의 예방･진압과 같이 일반 사회의 안녕과 질서유지를 목적으로 하는 활동을 의미한다.","㉠ 행정경찰 ㉡ 사법경찰","㉠ 진압경찰 ㉡ 예방경찰","㉠ 비상경찰 ㉡ 평시경찰","㉠ 고등경찰 ㉡ 보통경찰",3,0,""],["2024-1","경찰학",3,"바람직한 경찰의 역할모델 중 ‘범죄와 싸우는 경찰모델’에 관한 설명으로 가장 적절하지 않은 것은?","경찰활동의 전 부분을 포괄하는 용어로 가장 바람직한 모델이다.","경찰역할을 뚜렷이 인식시켜 ‘전문직화’에 기여한다.","수사, 형사 등 법 집행을 통한 범법자 제압 측면을 강조한 모델로서 시민들은 범인을 제압하는 것이 경찰의 주된 임무라고 인식한다.","범법자는 적이고, 경찰은 정의의 사자라는 흑백논리에 따른 이분법적 오류에 빠질 경우 인권침해 등의 우려가 있다.",0,0,""],["2024-1","경찰학",4,"경찰윤리강령에 관한 설명으로 가장 적절하지 않은 것은?","법적 강제력이 없기 때문에 위반했을 경우 제재할 방법이 미흡하다.","민주적 참여에 의한 제정보다는 상부에서 제정되고 일방적으로 하달되어 냉소주의를 불러일으키는 단점이 있다.","우리나라의 경찰윤리강령은 경찰윤리헌장 – 새경찰신조 – 경찰헌장 – 경찰서비스헌장 순서로 제정되었다.","1945년 10월 21일 국립경찰의 탄생 시 이념적 지표가 된 경찰정신은 대륙법계의 영향으로 ‘봉사’와 ‘질서’를 경찰의 행동강령으로 삼았다.",3,0,""],["2024-1","경찰학",5,"존 클라이니히(J. Kleinig)의 내부고발의 윤리적 정당화 요건으로 가장 적절하지 않은 것은?","내부고발자는 특별한 경우를 제외하고는 공표 전 자신의 이견을 표시하기 위한 내부적 채널을 모두 사용했어야 한다.","내부고발자는 부적절한 행동을 하도록 지시되었다는 자신의 신념이 합리적 증거에 근거하였는지 확인해야 한다.","적절한 도덕적 동기에 의해 내부고발이 이루어져야 하며, 성공가능성은 불문한다.","도덕적 위반이 얼마나 중대한가, 도덕적 위반이 얼마나 급박한가 등에 대한 세심한 고려가 있어야 한다.",2,0,""],["2024-1","경찰학",6,"｢부정청탁 및 금품등 수수의 금지에 관한 법률｣에 대한 설명으로 가장 적절하지 않은 것은?","공직자등은 부정청탁을 받았을 때에는 부정청탁을 한 자에게 부정청탁임을 알리고 이를 거절하는 의사를 명확히 표시하여야 한다. 그럼에도 불구하고 동일한 부정청탁을 다시 받은 경우에는 이를 소속기관장에게 서면(전자문서를 포함한다)으로 신고하여야 한다.","누구든지 동법의 위반행위가 발생하였거나 발생하고 있다는 사실을 알게 된 때에는 자신의 인적사항을 밝히지 아니하고 변호사를 선임하여 신고를 대리하게 할 수 있다.","공직자등은 외부기관(국가 및 지방자치단체를 포함한다)의 요청 으로 사례금을 받는 외부강의등을 할 때에는 소속기관장에게 그 외부강의등을 마친 날부터 10일 이내에 서면으로 신고하여야 한다.","공공기관의 장은 공직자등에게 부정청탁 금지 및 금품등의 수수 금지에 관한 내용을 정기적으로 교육하여야 하며, 교육의 실시를 위하여 필요하면 국민권익위원회에 지원을 요청할 수 있다.",2,0,""],["2024-1","경찰학",7,"｢공직자의 이해충돌 방지법｣에 관한 설명으로 가장 적절하지 않은 것은?","이 법은 공직자의 직무수행과 관련한 사적 이익추구를 금지 함으로써 공직자의 직무수행 중 발생할 수 있는 이해충돌을 방지하여 공정한 직무수행을 보장하고 공공기관에 대한 국민의 신뢰를 확보하는 것을 목적으로 한다.","｢초･중등교육법｣, ｢고등교육법｣ 또는 그 밖의 다른 법령에 따라 설치된 각급 국립･공립학교는 ‘공공기관’에 해당한다.","경무관인 세종특별자치시경찰청장은 ‘고위공직자’에 해당하지 않는다.","최근 2년 이내에 퇴직한 공직자로서 퇴직일 전 2년 이내에 사적 이해관계 신고 대상 직무를 수행하는 공직자와 같은 부서에서 근무하였던 사람은 사적이해관계자에 포함된다.",2,0,""],["2024-1","경찰학",8,"범죄 원인에 관한 학설의 설명으로 가장 적절하지 않은 것은?","뒤르켐(Durkheim)은 사회규범이 붕괴되어 규범에 대한 억제력이 상실된 상태를 아노미(Anomie)라고 하고 이러한 무규범상태에서 범죄가 발생한다고 주장하였다.","글레이저(Glaser)는 차별적 동일시이론을 통해 범죄의 원인이 개인이 아닌 사회구조의 변화에 있다고 설명하였다.","탄넨바움(Tannenbaum)은 낙인이론을 통해 범죄자라는 낙인이 어떠한 결과를 낳는가에 관심을 가졌다.","코헨(Cohen)은 목표와 수단이 괴리된 하류계층 청소년들이 중산층에 대한 저항으로 비행을 저지르며 목표달성의 어려움을 극복하기 위해 자신들의 하위문화를 만들게 된다고 주장하였다.",1,0,""],["2024-1","경찰학",9,"고전주의 범죄학의 억제이론(Deterrence Theory)은 베카리아 (Beccaria)와 벤담(Bentham)의 주장에 근거한다. 기본전제는 인간이 자유의지를 가지고 합리적인 판단에 의해 행동한다는 것이다. 이를 기반으로 한 처벌은 계량된 처벌의 고통과 범죄로 인한 이익 사이의 함수관계로 설명되는데 이 이론의 핵심적인 내용에 해당되는 것은?","처벌의 확실성, 처벌의 엄격성, 처벌의 신속성","처벌의 확실성, 처벌의 엄격성, 처벌의 신중성","처벌의 엄격성, 처벌의 신속성, 처벌의 신중성","처벌의 엄격성, 처벌의 신속성, 처벌의 지속성",0,0,""],["2024-1","경찰학",10,"범죄예방이론에 관한 설명으로 가장 적절하지 않은 것은?","일상활동이론(Routine Activity Theory), 합리적 선택이론 (Rational Choice Theory), 범죄패턴이론(Crime Pattern Theory) 등은 상황적 범죄예방(Situational Crime Prevention)의 중요한 이론적 배경이 되고 있다.","환경설계를 통한 범죄예방(CPTED: Crime Prevention Through Environmental Design)은 물리적 환경설계 또는 재설계를 통해 범죄기회를 차단하고 시민의 범죄에 대한 불안을 감소시키는 전략이다.","특별예방이론이 잠재적 범죄자인 일반인에 대한 형벌의 예방 기능을 강조한 것이라면, 일반예방이론은 형벌을 구체적인 범죄자 개인에 대한 영향력의 행사라고 보고, 범죄자를 교화함으로써 재범하지 않도록 하는 것이다.","범죄예방에 질병의 예방과 치료의 개념을 도입하여 소개한 브랜팅햄(P. J. Brantingham)과 파우스트(F. L. Faust)는 범죄 예방을 1차적 범죄예방, 2차적 범죄예방, 3차적 범죄예방으로 나누고 있다. 1차적 범죄예방은 일반대중, 2차적 범죄예방은 범죄우범자나 집단, 그리고 3차적 범죄예방은 범죄자가 주요 대상이라고 할 수 있다.",2,0,""],["2024-1","경찰학",11,"멘델존(Mendelsohn)의 피해자 유형 분류 중 가해자와 같은 정도의 책임이 있는 피해자에 해당하는 사례로 가장 적절하지 않은 것은?","동반자살 피해자","부모에게 살해된 패륜아","자살미수 피해자","촉탁살인에 의한 피살자",1,0,""],["2024-1","경찰학",12,"지역사회경찰활동의 구성요소에 관한 설명으로 가장 적절 하지 않은 것은?","지역중심적 경찰활동(COP: Community Oriented Policing) - 지역사회에서의 전반적인 삶의 질 향상을 목표로, 지역사회와 경찰 사이의 새로운 관계를 증진시키는 조직적인 전략원리를 말한다.","전략지향적 경찰활동(SOP: Strategic Oriented Policing) - 확인된 문제에 대한 전략적 대응을 위해 경찰자원을 배분하고, 전통적인 경찰활동과 절차를 통해 범죄적 요소나 사회무질서의 원인을 효과적으로 제거하는 경찰활동을 말한다.","이웃지향적 경찰활동(NOP: Neighborhood Oriented Policing) - 지역사회경찰활동을 위하여 경찰과 주민의 의사소통라인을 개설 하려는 모든 프로그램을 말한다.","문제지향적 경찰활동(POP: Problem Oriented Policing) - 지역 조직은 거주자들에게 지역에 관한 정보를 제공하며 경찰과 협동 하여 범죄를 억제하는 기능을 수행한다.",3,0,""],["2024-1","경찰학",13,"미군정시기 경찰에 관한 설명으로 가장 적절하지 않은 것은?","경찰이 담당하였던 위생사무 등 행정경찰사무가 경찰관할에서 분리되는 비경찰화 작업이 진행되었다.","일제강점기 치안입법이 정리된 시기로 1945년 ｢보안법｣이 폐지 되었고, 1948년 ｢예비검속법｣이 순차적으로 폐지되었다.","1946년 여자경찰제도가 신설되었다.","1947년 6인의 위원으로 구성된 중앙경찰위원회를 설치하였다.",1,0,""],["2024-1","경찰학",14,"외국경찰에 관한 설명으로 가장 적절하지 않은 것은?","11세기경 프랑스의 앙리 1세는 파리의 치안을 유지하기 위해 법원과 경찰기능을 가진 프레보(Prévôt)를 창설하였다.","독일경찰은 1949년 ｢기본법｣의 제정으로 대부분의 주(州)에서 주(州)단위 국가경찰제도를 채택하였다.","영국의 지방경찰은 2011년 ｢경찰개혁 및 사회책임법｣ 제정을 통해 기존의 3원 체제(지방경찰청장, 지방경찰위원회, 내무부장관)에서 4원 체제(지역치안위원장, 지역치안평의회, 지방경찰청장, 내무부장관)로 변화하면서 자치경찰의 성격이 약화되었다.","미국의 20세기 초 경찰개혁을 이끈 대표적 인물로 1인 순찰제의 효과성을 연구한 윌슨(O. W. Wilson)과 대학에 경찰 관련 교육과정을 개설한 어거스트 볼머(August Vollmer)가 있다.",2,0,""],["2024-1","경찰학",15,"법치행정의 원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","법률우위원칙은 행정의 종류를 불문하고 모든 행정 영역에 적용된다.","법률유보원칙은 법률에 의한 규율을 뜻하므로 위임입법에 의해 기본권 제한을 할 수 없다.","헌법상 보장된 국민의 자유나 권리를 제한할 때에는 적어도 그 제한의 본질적인 사항에 관하여 국회가 법률로써 스스로 규율하여야 한다.","집회나 시위 해산을 위한 살수차 사용은 기본권에 대한 중대한 제한이므로, 살수차사용요건이나기준은법률에근거를두어야한다.",1,0,""],["2024-1","경찰학",16,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣상 시･도 자치경찰위원회에 대한 설명으로 가장 적절하지 않은 것은?","합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다.","위원은 시･도의회가 추천하는 2명, 국가경찰위원회가 추천하는 1명, 해당 시･도 교육감이 추천하는 1명, 시･도자치경찰위원회 위원추천위원회가 추천하는 2명, 시･도지사가 지명하는 1명의 사람을 시･도지사가 임명한다.","시･도지사는 시･도자치경찰위원회의 의결이 적정하지 아니하다고 판단할 때에는 재의를 요구할 수 있다.","경찰청장은 시･도자치경찰위원회의 의결이 적정하지 아니하다고 판단되면 국가경찰위원회와 행정안전부장관을 거쳐 시･도지사에게 재의를 요구하게 할 수 있다.",3,0,""],["2024-1","경찰학",17,"｢경찰관 직무집행법｣에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰관이 불심검문 대상자 해당 여부를 판단할 때에는 불심검문 당시의 구체적 상황은 물론 사전에 얻은 정보나 전문적 지식 등에 기초하여 불심검문 대상자인지를 객관적·합리적인 기준에 따라 판단하여야 하나, 반드시 불심검문 대상자에게 ｢형사소송법｣상 체포나구속에이를정도의혐의가있을것을요한다고할수는없다.","술에 취한 상태로 인하여 자기 또는 타인의 생명·신체와 재산에 위해를 미칠 우려가 있는 피구호자에 대한 보호조치는 경찰 행정상 즉시강제에 해당하므로, 그 조치가 불가피한 최소한도 내에서만 행사되도록 발동･행사 요건을 신중하고 엄격하게 해석하여야 한다.","경찰관의 경고나 제지는 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에 이를 예방하기 위하여 이루어지는 조치로서, 범죄행위가 계속되는 중 그 진압을 위해서는 행하여질 수 없다.","경찰관은 ｢경범죄 처벌법｣상 경범죄에 해당하는 행위에 대해서도 필요한 경우 제지할 수 있다.",2,0,""],["2024-1","경찰학",18,"경찰장비와 그 사용에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰관은경찰장비에임의의장비를부착하여일반적인사용법과 달리 사용함으로써 다른 사람의 생명･신체에 위해를 끼쳐서는 안 된다.","경찰청장은 위해성 경찰장비를 새로 도입하려는 경우에는 대통령령으로 정하는 바에 따라 안전성 검사를 실시하여 그 안전성 검사의 결과보고서를 국회 소관 상임위원회에 제출하여야 한다. 이 경우 안전성 검사에는 외부 전문가를 참여시켜야 한다.","경찰관이 농성 진압 과정에서 경찰장비를 적법하게 사용하였더라도, 상대방이 그로 인한 생명･신체에 대한 위해를 면하기 위하여 대항하는 과정에서 경찰장비를 손상시켰다면 이는 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당한다.","수사기관에서 구속된 피의자의 도주, 항거 등을 억제하는 데 필요하다고인정할상당한이유가있는경우에는필요한한도내에서 포승이나 수갑을 사용할 수 있으며, 이러한 조치가 무죄추정의 원칙에 위배되는 것이라고 할 수 없다.",2,0,""],["2024-1","경찰학",19,"｢경찰관 직무집행법｣ 및 ｢경찰관의 정보수집 및 처리 등에 관한 규정｣에 따른 경찰의 정보활동에 관한 설명으로 가장 적절하지 않은 것은?","경찰관은 범죄･재난･공공갈등 등 공공안녕과 공공질서에 대한 위험의 예방과 대응을 위한 정보의 수집･작성･배포와 이에 수반되는 사실의 확인을 할 수 있다.","경찰관은 정치에 관여하기 위해 정보를 수집･작성･배포하는 행위를 해서는 안 된다.","경찰관은 민간기업에 상시적으로 출입해서는 안 되며, 정보활동을 위해 필요한 경우에 한정하여 일시적으로만 출입해야 한다.","경찰관은 수집･작성한 정보가 그 목적이 달성되어 불필요하게 되었을 때에는 다른 법령에 따라 보존해야 하는 경우를 제외 하고는 지체 없이 그 정보를 폐기해야 한다.",0,0,""],["2024-1","경찰학",20,"경찰행정의 실효성 확보수단에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행정대집행은 대체적 작위의무 불이행에 대하여 다른 수단으로는 그 이행을 확보하기 곤란하고 불이행을 방치하면 공익을 크게 해칠 것으로 인정될 때에 행정청이 의무자가 하여야 할 행위를 스스로 하거나 제3자에게 하게 하고 그 비용을 의무자로부터 징수하는 것을 말한다.","행정청은 의무자가 행정상 의무를 이행할 때까지 이행강제금을 반복하여 부과할 수 있으나, 의무자가 의무를 이행하면 이미 부과한 이행강제금을 징수하여서는 안 된다.","직접강제는 행정대집행이나 이행강제금 부과로는 행정상 의무이행을 확보할 수 없거나 그 실현이 불가능한 경우에 실시하여야 한다.","경찰행정상 즉시강제는 눈앞의 급박한 경찰상 장해를 제거하여야 할 필요가 있고 의무를 명할 시간적 여유가 없거나 의무를 명하는 방법으로는 그 목적을 달성하기 어려운 상황에서 의무불이행을 전제로 하지 않고 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 권력적 사실행위이다.",1,0,""],["2024-1","경찰학",21,"｢행정절차법｣ 제8조에 따른 행정응원에 관한 설명으로 가장 적절하지 않은 것은?","행정청은 다른 행정청의 응원을 받아 처리하는 것이 보다 능률적 이고 경제적인 경우 다른 행정청에 행정응원을 요청할 수 있다.","행정응원을 요청받은 행정청은 행정응원으로 인하여 고유의 직무 수행이 현저히 지장받을 것으로 인정되는 명백한 이유가 있는 경우에는 응원을 거부할 수 있다.","행정응원을 위하여 파견된 직원은 다른 법령 등에 특별한 규정이 있는 경우를 제외하고는 원 소속 행정청의 지휘･감독을 받는다.","행정응원에 드는 비용은 응원을 요청한 행정청이 부담하며, 그 부담금액 및 부담방법은 응원을 요청한 행정청과 응원을 하는 행정청이 협의하여 결정한다.",2,0,""],["2024-1","경찰학",22,"｢개인정보 보호법｣에 관한 설명으로 가장 적절하지 않은 것은? (단, 동법 제3조의 개인정보 보호 원칙은 준수한 것으로 봄)","개인정보처리자는 법령상 의무를 준수하기 위하여 불가피한 경우에는 개인정보를 수집할 수 있으며 그 수집 목적의 범위에서 이용할 수 있다.","인명의 구조･구급 등을 위하여 필요한 경우로서 대통령령으로 정하는 경우에는 불특정 다수가 이용하는 목욕실, 탈의실 등 개인의 사생활을 현저히 침해할 우려가 있는 장소의 내부를 볼 수 있는 곳에서 이동형 영상정보처리기기로 사람 또는 그 사람과 관련된 사물의 영상을 촬영할 수 있다.","개인정보처리자는 개인정보를 익명 또는 가명으로 처리하여도 개인정보 수집목적을 달성할 수 있는 경우 익명처리가 가능한 경우에는 익명에 의하여, 익명처리로 목적을 달성할 수 없는 경우에는 가명에 의하여 처리될 수 있도록 하여야 한다.","개인정보처리자는 통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 가명정보를 처리하는 경우에 정보주체에게 이를 알리고 동의를 받아야 한다.",3,0,""],["2024-1","경찰학",23,"｢공공기관의 정보공개에 관한 법률｣상 비공개대상정보에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","직무를 수행한 공무원의 성명･직위 등 ｢개인정보 보호법｣ 제2조 제1호에 따른 개인정보로서 공개될 경우 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보는 공개하지 않을 수 있다.","피의자신문조서 등 조서에 기재된 피의자 등의 인적사항 이외의 진술내용 역시 개인의 사생활의 비밀 또는 자유를 침해할 우려가 인정되는 경우에는 비공개대상정보에 해당한다.","수사기록 중 의견서, 보고문서, 메모, 법률검토 등은 그 실질적인 내용을 구체적으로 살펴 수사의 방법 및 절차 등이 공개됨으로써 수사기관의 직무수행을 현저히 곤란하게 한다고 인정할 만한 상당한 이유가 있어야만 비공개대상정보에 해당한다.","의사결정 과정에 있는 사항으로서 공개될 경우 업무의 공정한 수행에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 정보는 공개하지 않을 수 있다.",0,0,""],["2024-1","경찰학",24,"｢경찰관 직무집행법｣ 및 ｢경찰관 직무집행법 시행령｣상 손실보상에 관한 설명으로 가장 적절하지 않은 것은?","국가는 경찰관의 적법한 직무집행으로 인하여 손실발생의 원인에 대하여 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 생명･신체 또는 재산상의 손실을 입은 경우 정당한 보상을 하여야 한다.","경찰관의 적법한 직무집행으로 인하여 발생한 손실을 보상받으려는 사람은 보상금 지급 청구서에 손실내용과 손실금액을 증명할 수 있는 서류를 첨부하여 손실보상청구 사건발생지를 관할하는 국가경찰관서의 장에게 제출하여야 한다.","보상금은 다른 법률에 특별한 규정이 있는 경우를 제외하고는 현금으로 지급하여야 한다.","소속 경찰공무원의 직무집행으로 인하여 발생한 손실보상청구 사건을 심의하기 위하여 시·도경찰청, 지방해양경찰청, 경찰서 및 해양경찰서에 손실보상심의위원회를 설치한다.",3,0,""],["2024-1","경찰학",25,"국가배상에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰관의 부작위를 이유로 한 국가배상책임을 인정하기 위한 요건으로서의 ‘법령 위반’이란 형식적 의미의 법령에 명시적으로 공무원의 작위의무가 규정되어 있는데도 이를 위반하는 경우를 의미하며, 인권존중·권력남용금지·신의성실과 같이 공무원으로서 마땅히 지켜야 할 준칙이나 규범을 지키지 않고 위반한 경우는 포함하지 않는다.","경찰관의 직무집행이 법령이 정한 요건과 절차에 따라 이루어진 것이라면 특별한 사정이 없는 한 이는 법령에 적합한 것이고 그 과정에서 개인의 권리가 침해되었다고 하여 그 법령적합성이 곧바로 부정되는 것은 아니다.","공무원에게 부과된 직무상 의무의 내용이 전적으로 또는 부수적으로 사회구성원 개인의 구체적 안전과 이익을 보호하기 위하여 설정된 것이라면, 공무원이 그와 같은 직무상 의무를 위반함으로써 개인이 입게 된 손해는 상당인과관계가 인정되는 범위 안에서 국가가 그에 대한 배상책임을 부담하여야 한다.","시위진압이 불필요하거나 또는 불법시위의 태양 및 시위 장소의 상황 등에서 예측되는 피해 발생의 구체적 위험성의 내용에 비추어 시위진압의 계속 수행 내지 그 방법 등이 현저히 합리성을 결하였다면경찰관의직무집행이법령에위반한것이라고할수있다.",0,0,""],["2024-1","경찰학",26,"｢행정기본법｣상 이의신청에 관한 설명으로 가장 적절하지 않은 것은?","행정청의 처분에 이의가 있는 당사자는 처분을 받은 날부터 30일 이내에 해당 행정청에 이의신청을 할 수 있다.","행정청은 이의신청을 받으면 부득이한 사유가 있는 경우를 제외하고는 그 이의신청을 받은 날부터 14일 이내에 그 이의 신청에 대한 결과를 신청인에게 통지하여야 한다.","이의신청을 한 경우에도 그 이의신청과 관계없이 ｢행정심판법｣에 따른행정심판또는｢행정소송법｣에따른행정소송을제기할수있다.","이의신청에 대한 결과를 통지받은 후 행정심판 또는 행정소송을 제기하려는 자는 그 결과를 통지받은 날부터 60일 이내에 행정심판 또는 행정소송을 제기하여야 한다.",3,0,""],["2024-1","경찰학",27,"｢행정심판법｣상 행정심판에 관한 설명으로 가장 적절하지 않은 것은?","심판청구는 서면으로 하여야 하며, 심판청구서를 작성하여 피청구인 또는 행정심판위원회에 제출하여야 한다.","시･도경찰청장의 처분 또는 부작위에 대한 행정심판의 청구에 대해서는 경찰청에 두는 행정심판위원회에서 심리･재결한다.","행정심판위원회는 처분, 처분의 집행 또는 절차의 속행 때문에 중대한 손해가 생기는 것을 예방할 필요성이 긴급하다고 인정할 때에는 직권으로 또는 당사자의 신청에 의하여 처분의 효력, 처분의 집행 또는 절차의 속행의 전부 또는 일부의 정지를 결정 할 수 있다.","행정심판위원회는 심판청구가 이유가 있다고 인정하는 경우에도 이를 인용하는 것이 공공복리에 크게 위배된다고 인정하면 심판청구를 기각하는 재결을 할 수 있다.",1,0,""],["2024-1","경찰학",28,"｢경찰 물리력 행사의 기준과 방법에 관한 규칙｣상 ‘적극적 저항’을 하는 대상자에 대하여 경찰관이 사용할 수 있는 물리력의 종류로 가장 적절하지 않은 것은? (규칙 제2장 2.2.의 설명에 따름)","언어적 통제","체포 등을 위한 수갑 사용","손바닥, 주먹, 발 등 신체부위를 이용한 가격","분사기 사용",2,0,""],["2024-1","경찰학",29,"다음에서 설명하는 조직편성의 원리와 가장 관계가 깊은 것은? ∙업무를 그 종류와 성질별로 구분하여 구성원에게 가능한 한 한가지의 주된 업무를 부담시킴으로써 조직 관리상의 능률을 향상시키려는 원리이다. ∙한 사람이 수행할 수 있는 업무의 양과 시간에는 한계가 있고, 서로 다른 특성을 가진 업무를 한 사람이 맡아서 하는 것은 비효율적이다. ∙다수가 일을 함에 있어서 각자의 임무를 나누어서 분명하게 부과하고 협력을 하도록 하는 것으로, 인간능력의 한계를 극복하고 업무를 효율적으로 수행하기 위한 것이다.","이 원리는 구조조정의 문제와 깊은 관련성이 있다.","이 원리에 따르면 업무에 대한 신속결단과 결단내용의 지시가 단일한 명령계통이어야 한다.","이 원리의 장점은 권한과 책임을 계층에 따라 분배하여 의사결정의 검토가 이루어져 신중한 업무처리가 가능하다는 것이다.","이 원리의 단점은 정형적･반복적 업무수행에 기인하여 작업에 대한 흥미 상실과 노동의 소외화나 인간기계화를 심화시키며, 부처간의 할거주의가 초래될 수 있다는 것이다.",3,0,""],["2024-1","경찰학",30,"｢국가재정법｣상 경찰예산에 관한 설명으로 가장 적절하지 않은 것은?","경찰청장은 매년 1월 31일까지 해당 회계연도부터 5회계연도 이상의 기간 동안의 신규사업 및 경찰청장이 정하는 주요 계속사업에 대한 중기사업계획서를 기획재정부장관에게 제출 하여야 한다.","기획재정부장관은 국무회의의 심의를 거쳐 대통령의 승인을 얻은 다음 연도의 예산안편성지침을 매년 3월 31일까지 경찰청장에게 통보하여야 한다.","감사원은 제출된 국가결산보고서를 검사하고 그 보고서를 다음 연도 5월 20일까지 기획재정부장관에게 송부하여야 한다.","경찰청장은 예산이 확정된 후 예산배정요구서를 기획재정부장관 에게 제출하여야 하고, 기획재정부장관은 제출된 예산배정 요구서에 따라 분기별 예산배정계획을 작성하여 국무회의의 심의를 거친 후 대통령의 승인을 얻어야 한다.",0,0,""],["2024-1","경찰학",31,"｢경찰장비관리규칙｣상 무기관리에 관한 설명으로 옳은 것은 모두 몇 개인가? ㉠ 무기고와 탄약고는 견고하게 만들고 환기･방습장치와 방화 시설 및 총가시설 등이 완비되어야 한다. ㉡ 간이무기고는 근무자가 24시간 상주하는 지구대, 파출소, 상황실 등 경찰기관의 장이 필요하다고 인정하는 상당한 이유가 있는 장소에 설치할 수 있다. ㉢ 집중무기･탄약고의 열쇠보관은 일과시간의 경우 무기 관리 부서의 장이, 일과시간 후에는 당직 업무(청사방호) 책임자 (상황관리관 등 당직근무자)가 한다. ㉣ 경찰기관의 장은 무기를 휴대한 자 중에서 ‘정신건강상 문제가 우려되어 치료가 필요한 자’가 있을 때에는 즉시 대여한 무기･탄약을 회수하여야 한다.","1개","2개","3개","4개",2,0,""],["2024-1","경찰학",32,"｢보안업무규정｣에 따른 보호지역 중 비인가자가 비밀, 주요 시설 및 Ⅲ급 비밀 소통용 암호자재에 접근하는 것을 방지 하기 위하여 안내를 받아 출입하여야 하는 구역에 해당하는 장소는?","작전･경호･정보･안보업무 담당부서 전역","무기고 및 탄약고","종합상황실","종합조회처리실",0,0,""],["2024-1","경찰학",33,"경찰과 대중매체 관계에 관한 내용과 인물을 바르게 연결한 것은? ㉠ 경찰과 대중매체가 서로를 필요로 하기 때문에 둘 사이에는 공생관계가 발달한다고 주장하였다. ㉡ 경찰과 대중매체는 서로 연합하여 그 사회의 일탈에 대한 개념을 규정하며, 도덕성과 정의를 규정짓는 사회적 엘리트 집단을 구성한다. ㉢ 경찰과 대중매체의 관계를 “단란하고 행복스럽지는 않지만, 오래 지속되는 결혼생활”에 비유하였다.","㉠ - G. Crandon ㉡ - R. Mark ㉢ - R. Ericson","㉠ - R. Ericson ㉡ - G. Crandon ㉢ - R. Mark","㉠ - R. Mark ㉡ - R. Ericson ㉢ - G. Crandon","㉠ - G. Crandon ㉡ - R. Ericson ㉢ - R. Mark",3,0,""],["2024-1","경찰학",34,"계급제와 직위분류제의 관계에 관한 설명으로 가장 적절하지 않은 것은?","직무분석과직무평가의충실한수행을강조하는것은직위분류제이다.","계급제는 직업공무원제도 정착에 유리하다.","양자는 양립할 수 없는 상호 배타적인 관계가 아니라 서로의 결함을 시정할 수 있는 상호 보완적인 관계이다.","계급제는 ‘동일직무에 대한 동일보수의 원칙’을 확립함으로써 보수제도의 합리적 기준을 제시한다.",3,0,""],["2024-1","경찰학",35,"｢피의자 유치 및 호송규칙｣에 관한 설명으로 가장 적절하지 않은 것은?","외표검사란 죄질이 경미하고 동작과 언행에 특이사항이 없으며 위험물 등을 은닉하고 있지 않다고 판단되는 유치인에 대하여는 신체 등의 외부를 눈으로 확인하고 손으로 가볍게 두드려 만져 검사하는 것을 말한다.","동시에 2명 이상의 피의자를 입감시킬 때에는 경위 이상 경찰관이 입회하여 순차적으로 입감시켜야 한다.","신체 등의 검사는 동성의 유치인보호관이 실시하여야 한다. 다만, 여성유치인보호관이 없을 경우에는 미리 지정하여 신체 등의 검사방법을 교양 받은 여성경찰관으로 하여금 대신하게 할 수 있다.","호송은 원칙적으로 일출전 또는 일몰후에 할 수 없다.",1,0,""],["2024-1","경찰학",36,"｢아동･청소년의 성보호에 관한 법률｣에 대한 설명으로 옳은 것은 모두 몇 개인가? ㉠ 아동･청소년성착취물을제작한자에대한미수범처벌규정이있다. ㉡ 폭행 또는 협박으로 아동･청소년을 강간할 목적으로 예비 또는 음모한 자에 대한 처벌규정이 있다. ㉢ 아동･청소년의 성을 사는 행위를 한 자에 대한 미수범 처벌 규정이 있다. ㉣ 13세 미만의 사람에 대하여 강간죄를 범한 경우에는 공소시효를 적용하지 않는다.","1개","2개","3개","4개",2,0,""],["2024-1","경찰학",37,"｢가정폭력범죄의 처벌 등에 관한 특례법｣상 가정폭력범죄에 해당하지 않는 것은?","甲의 아버지가 甲의 명예를 훼손한 경우","乙의 계모였던 사람이 乙의 재물을 손괴한 경우","丙과 같이 사는 사촌동생이 丙을 약취유인한 경우","丁이 이혼한 전 부인을 강간한 경우",2,0,""],["2024-1","경찰학",38,"｢범죄인 인도법｣에서 규정하는 절대적 인도거절 사유로 옳은 것만을 모두 고른 것은? ㉠ 범죄인이 대한민국 국민인 경우 ㉡ 인도범죄의전부또는 일부가 대한민국영역에서범한것인 경우 ㉢ 범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우 ㉣ 인도범죄에 관하여 대한민국 법원에서 재판이 계속 중이거나 재판이 확정된 경우","㉠㉡","㉢㉣","㉠㉡㉣","㉡㉢㉣",1,0,""],["2024-1","경찰학",39,"정보배포 원칙에 관한 설명으로 가장 적절하지 않은 것은?","필요성의 원칙은 알 필요가 있는 대상자에게 정보를 알려야 하고, 알 필요가 없는 대상자에게는 알려서는 안 된다는 것을 의미한다.","보안성의 원칙에 따라, 정보가 누설됨으로써 초래될 결과를 예방하기 위한 보안대책을 강구해야 한다.","적시성의 원칙에 따라, 먼저 생산된 정보를 우선적으로 배포한다.","계속성의 원칙은 정보가 필요한 기관에 배포되었다면 그 주제와 관련된 새로운 정보는 그 기관에 계속 배포해 주어야 한다는 것을 의미한다.",2,0,""],["2024-1","경찰학",40,"제2종 보통면허만을 취득한 자가 운전할 경우, 무면허운전이 되는 것은?","원동기장치자전거","화물자동차(적재중량 3톤)","승합자동차(승차정원 8명)","특수자동차(총중량 4톤)",3,0,""],["2024-2","헌법",1,"헌법개정에 관한 설명으로 옳지 않은 것을 모두 고른 것은? ㉠ 헌법개정은 국회재적의원 과반수 또는 대통령을 수반으로 하는 정부의 발의로 제안된다. ㉡ 대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다. ㉢ 제안된 헌법개정안은 국회가 20일 이상의 기간 이를 공고 하여야 한다. ㉣ 국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결 하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 하는데, 표결은 무기명투표로 한다. ㉤ 헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다.","㉠㉡㉤","㉠㉢㉣","㉡㉢㉣","㉢㉣㉤",1,0,""],["2024-2","헌법",2,"헌법 제6조에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 헌법재판소 판례에 의함)","국제법존중주의는 국제법과 국내법의 동등한 효력을 인정한다는 취지이므로, ‘유엔 시민적·정치적 권리 규약 위원회’가 ｢국가 보안법｣의 폐지나 개정을 권고하였다는 이유만으로도 이적행위 조항과 이적표현물 소지조항은 국제법존중주의에 위배된다.","‘시민적 및 정치적 권리에 관한 국제규약’(이하 ‘자유권규약’)은 국내법체계상에서 법률적 효력을 가지므로,
