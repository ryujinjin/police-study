동의한 압수조서 중 ‘압수경위’란에 피고인의 범행 장면(휴대전화기로 여성의 치마 속 몰래 촬영)을 현장에서 목격한 사법경찰관리가 이를 묘사한 진술내용이 포함된 경우, 이러한 내용은 지하철역 에스컬레이터에서 휴대전화기의 카메라를 이용하여 여성 피해자의 치마 속을 몰래 촬영하였다는 피고인의 자백에 대한 보강증거가 될 수 있다. (24.2차)","answer":true,"quote":"피고인이 지하철역 에스컬레이터에서 휴대전화기의 카메라를 이용하여 성명불상 여성 피해자의 치마 속을 몰래 촬영하다가 현행범으로 체포되어 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)으로 기소된 사안에서, 피고인은 공소사실에 대해 자백하고 검사가 제출한 모든 서류에 대하여 증거로 함에 동의하였는데, 그 서류들 중 체포 당시 임의제출 방식으로 압수된 피고인 소유 휴대전화기(이하 ‘휴대전화기’라고 한다)에 대한 압수조서의 ‘압수경위’란에 ‘지하철역 승강장 및 게이트 앞에서 경찰관이 지하철범죄 예방·검거를 위한 비노출 잠복근무 중 검정 재킷, 검정 바지, 흰색 운동화를 착용한 20대가량 남성이 짧은 치마를 입고 에스컬레이터를 올라가는 여성을 쫓아가 뒤에 밀착하여 치마 속으로 휴대폰을 집어넣는 등 해당 여성의 신체를 몰래 촬영하는 행동을 하였다’는 내용이 포함되어 있고, 그 하단에 피고인의 범행을 직접 목격하면서 위 압수조서를 작성한 사법경찰관 및 사법경찰리의 각 기명날인이 들어가 있으므로, 위 압수조서 중 ‘압수경위’란에 기재된 내용은 피고인이 범행을 저지르는 현장을 직접 목격한 사람의 진술이 담긴 것으로서 형사소송법 제312조 제5항 에서 정한 ‘피고인이 아닌 자가 수사과정에서 작성한 진술서’에 준하는 것으로 볼 수 있고, 이에 따라 휴대전화기에 대한 임의제출절차가 적법하였는지에 영향을 받지 않는 별개의 독립적인 증거에 해당하여, 피고인이 증거로 함에 동의한 이상 유죄를 인정하기 위한 증거로 사용할 수 있을 뿐 아니라 피고인의 자백을 보강하는 증거가 된다고 볼 여지가 많다는 이유로, 이와 달리 피고인의 자백을 뒷받침할 보강증거가 없다고 보아 무죄를 선고한 원심판결에 자백의 보강증거 등에 관한 법리를 오해하거나 필요한 심리를 다하지 아니한 잘못이 있다고 한 사례.","cite":"대법원 2019도13290","badge":"","topic":"","from":"GY-2024-2-X-36","seq":null},{"id":"X-OX-724","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 ｢형사소송법｣ 제312조 제1항이 적용되지 아니하므로 이를 유죄의 증거로 쓸 수 있다. (24.1차)","answer":false,"quote":"따라서 피고인이 자신과 공범관계에 있는 다른 피고인이나 피의자에 대하여 검사가 작성한 피의자신문조서의 내용을 부인하는 경우에는 형사소송법 제312조 제1항 에 따라 유죄의 증거로 쓸 수 없다.","cite":"대법원 2023도3741","badge":"","topic":"","from":"GY-2024-1-X-38","seq":null},{"id":"X-OX-753","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲이 설계도면을 乙에게 팔아서 취득한 비트코인은 ｢형법｣ 제48조 제1항에서 정한 몰수의 대상에 해당한다. (25.2차)","answer":false,"quote":"피고인이 음란물유포 인터넷사이트를 운영하면서 정보통신망 이용촉진 및 정보보호 등에 관한 법률(이하 ‘정보통신망법’이라 한다) 위반(음란물유포)죄와 도박개장방조죄에 의하여 비트코인(Bitcoin)을 취득한 사안에서, 범죄수익은닉의 규제 및 처벌 등에 관한 법률(이하 ‘범죄수익은닉규제법’이라 한다) [별표] 제1호 (사)목에서는 형법 제247조 의 죄를, [별표] 제24호에서는 정보통신망법 제74조 제1항 제2호 의 죄를 중대범죄로 규정하고 있어 피고인의 정보통신망법 위반(음란물유포)죄와 도박개장방조죄는 범죄수익은닉규제법에 정한 중대범죄에 해당하며, 비트코인은 경제적인 가치를 디지털로 표상하여 전자적으로 이전, 저장 및 거래가 가능하도록 한, 이른바 ‘가상화폐’의 일종인 점, 피고인은 위 음란사이트를 운영하면서 사진과 영상을 이용하는 이용자 및 음란사이트에 광고를 원하는 광고주들로부터 비트코인을 대가로 지급받아 재산적 가치가 있는 것으로 취급한 점에 비추어 비트코인은 재산적 가치가 있는 무형의 재산이라고 보아야 하고, 몰수의 대상인 비트코인이 특정되어 있다는 이유로, 피고인이 취득한 비트코인을 몰수할 수 있다고 본 원심판단이 정당하다고 한 사례.","cite":"대법원 2018도3619","badge":"","topic":"","from":"GY-2025-2-X-40","seq":null},{"id":"X-OX-699","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포 행위가 확실히 사람의 신체의 자유를 구속하는 정도로 계속되지 못하고 일시적인 것에 그쳤다고 하여도 체포죄의 미수가 아닌 기수에 이른 것으로 보아야 한다. (23.1차)","answer":false,"quote":"체포죄는 계속범으로서 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 기수에 이르고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우에는 체포죄의 미수범이 성립할 뿐이다.","cite":"대법원 2016도18713","badge":"","topic":"","from":"GY-2023-1-X-15","seq":null},{"id":"X-OX-744","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲이 자전거도로에서 자전거를 운행하던 중 전방주시의무를 게을리하여 보행자인 피해자 A를 들이받아 중상해를 입게 하였다는 교통사고처리 특례법 위반(치상)의 공소사실로 기소 되었고, 위 사고로 의식불명이 된 A에 대하여 성년후견이 개시되어 성년후견인으로 A의 법률상 배우자 B가 선임되었다면 A의 성년후견인인 B가 A를 대신하여 처벌불원의사를 형성하거나 결정할 수 있다. (25.2차)","answer":false,"quote":"피고인이 자전거도로에서 자전거를 운행하던 중 전방주시의무를 게을리하여 보행자인 피해자 甲을 들이받아 중상해를 입게 하였다는 교통사고처리 특례법 위반(치상)의 공소사실로 기소되었고, 위 사고로 의식불명이 된 甲에 대하여 성년후견이 개시되어 성년후견인으로 甲의 법률상 배우자 乙이 선임되었는데, 乙이 피고인 측으로부터 합의금을 수령한 후 제1심 판결선고 전에 甲을 대리하여 처벌불원의사를 표시한 사안에서, 위 특례법 제3조 제2항 에서 차의 운전자가 교통사고로 인하여 범한 업무상과실치상죄는 ‘피해자의 명시적인 의사’에 반하여 공소를 제기할 수 없도록 규정하여 문언상 그 처벌 여부가 ‘피해자’의 ‘명시적’인 의사에 달려 있음이 명백하므로, 甲의 성년후견인인 乙이 甲을 대신하여 처벌불원의사를 형성하거나 결정할 수 있다고 해석하는 것은 법의 문언에 반한다는 이유로, 같은 취지에서 공소사실을 유죄로 인정한 원심의 판단이 정당하다고 한 사례.","cite":"대법원 2021도11126","badge":"","topic":"","from":"GY-2025-2-X-28","seq":null},{"id":"X-OX-664","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피해자가 경찰청 인터넷 홈페이지에 ‘피고인을 철저히 조사해 달라’는 취지의 민원을 접수하는 형태로 피고인에 대한 조사를 촉구하는 의사표시를 한 것은 ｢형사소송법｣에 따른 적법한 고소로 보기 어렵다. (25.2차)","answer":true,"quote":"출판사 대표인 피고인이 도서의 저작권자인 피해자와 전자도서(e-book)에 대하여 별도의 출판계약 등을 체결하지 않고 전자도서를 제작하여 인터넷서점 등을 통해 판매하였다고 하여 구 저작권법 위반으로 기소된 사안에서, 피해자가 경찰청 인터넷 홈페이지에 ‘피고인을 철저히 조사해 달라’는 취지의 민원을 접수하는 형태로 피고인에 대한 조사를 촉구하는 의사표시를 한 것은 형사소송법에 따른 적법한 고소로 보기 어렵다는 이유로 공소를 기각한 원심판단을 정당하다고 한 사례","cite":"대법원 2010도9524","badge":"","topic":"","from":"GY-2025-2-X-28","seq":null},{"id":"X-OX-658","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제216조 제3항에 따라 범행 중 또는 범행 직후의 범죄 장소에서 영장 없이 압수한 물건에 대하여 사후에 압수‧수색영장을 청구하였다가 영장을 발부받지 못한 때에는 수사기관은 압수한 물건을 즉시 반환하여야 하고, 즉시 반환 하지 아니한 압수물은 유죄의 증거로 사용할 수 없으며, 피고인 이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다. (25.1차)","answer":true,"quote":"이 규정에 따라 압수수색영장을 청구하였다가 영장을 발부받지 못한 때에는 수사기관은 압수한 물건을 즉시 반환하여야 하고, 즉시 반환하지 아니한 압수물은 유죄의 증거로 사용할 수 없으며, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다.","cite":"대법원 2024도10062","badge":"","topic":"","from":"GY-2025-1-X-37","seq":null},{"id":"X-OX-589","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이나 그 변호인이 검사 작성의 당해 피고인에 대한 피의자 신문조서의 임의성을 인정하는 진술을 하였다가 이를 번복하는 경우에, 증거조사를 마친 조서의 임의성을 다투는 주장이 받아 들여지게 되면, 그 조서는 증거배제결정을 통하여 유죄 인정의 자료에서 제외되어야 한다. (22.1차)","answer":true,"quote":"검사 작성의 당해 피고인에 대한 피의자신문조서에 기재된 진술의 임의성에 다툼이 있을 때에는 그 임의성을 의심할 만한 합리적이고 구체적인 사실을 피고인이 증명할 것이 아니라 검사가 그 임의성의 의문점을 없애는 증명을 하여야 하고, 검사가 그 임의성의 의문점을 없애는 증명을 하지 못한 경우에는 그 조서는 유죄 인정의 증거로 사용할 수 없는데, 이러한 법리는 피고인이나 그 변호인이 검사 작성의 당해 피고인에 대한 피의자신문조서의 임의성을 인정하는 진술을 하였다가 이를 번복하는 경우에도 마찬가지로 적용되어야 한다.","cite":"대법원 2007도7760","badge":"","topic":"","from":"GY-2022-1-X-36","seq":null},{"id":"X-OX-758","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"자백에 대한 보강증거에 있어서 피고인의 자백은 가공적인 것이 아닌 진실한 것임을 인정할 수 있을 정도만 되면 족하고, 간접 증거나 정황증거가 아닌 직접증거만이 보강증거가 될 수 있다. (26.1차)","answer":false,"quote":"자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라, 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있고, 또한 자백과 보강증거가 서로 어울려서 전체로서 범죄사실을 인정할 수 있으면 유죄의 증거로 충분하다.","cite":"대법원 2010도11272","badge":"","topic":"","from":"GY-2026-1-X-35","seq":null},{"id":"X-OX-746","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"누구든지 현행범인 체포를 위해 필요한 때에는 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 수색을 할 수 있지만 긴급한 사정이 있는 때에 한정한다. (25.2차)","answer":false,"quote":"① 검사 또는 사법경찰관은 제200조의2·제200조의3·제201조 또는 제212조의 규정에 의하여 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장없이 다음 처분을 할 수 있다. <개정 1995.12.29., 2019. 12. 31> 1. 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 수색. 다만, 제200조의2 또는 제201조에 따라 피의자를 체포 또는 구속하는 경우의 피의자 수색은 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정한다. 2. 체포현장에서의 압수, 수색, 검증","cite":"형사소송법 제216조 제1항","badge":"","topic":"","from":"GY-2025-2-X-31","seq":null},{"id":"X-OX-651","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 외국인을 체포하거나 구속하면서 지체 없이 영사 통보권 등이 있음을 고지하지 않았다면 체포나 구속 절차는 국내법과 같은 효력을 가지는 ｢영사관계에 관한 비엔나협약｣을 위반한 것으로 위법하다. (25.1차)","answer":true,"quote":"따라서 수사기관이 외국인을 체포하거나 구속하면서 지체 없이 영사통보권 등이 있음을 고지하지 않았다면 체포나 구속 절차는 국내법과 같은 효력을 가지는 협약 제36조 제1항 (b)호를 위반한 것으로 위법하다.","cite":"대법원 2021도17103","badge":"","topic":"","from":"GY-2025-1-X-29","seq":null},{"id":"X-OX-752","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"위법한 강제연행 상태에서 호흡측정의 방법에 의한 음주측정을 한 다음, 그 강제연행 상태로부터 완전히 벗어났다고 볼 수 없는 상황에서 피의자가 호흡측정 결과에 대한 탄핵을 하기 위하여 스스로 혈액채취 방법에 의한 측정을 할 것을 요구하여 혈액 채취가 이루어진 경우, 그러한 혈액채취에 의한 측정 결과는 피의자에 대한 불법체포와 증거수집 사이의 인과관계가 단절된 것으로 보아 유죄의 인정증거로 사용할 수 있다. (25.2차)","answer":false,"quote":"위법한 강제연행 상태에서 호흡측정 방법에 의한 음주측정을 한 다음 강제연행 상태로부터 시간적·장소적으로 단절되었다고 볼 수도 없고 피의자의 심적 상태 또한 강제연행 상태로부터 완전히 벗어났다고 볼 수 없는 상황에서 피의자가 호흡측정 결과에 대한 탄핵을 하기 위하여 스스로 혈액채취 방법에 의한 측정을 할 것을 요구하여 혈액채취가 이루어졌다고 하더라도 그 사이에 위법한 체포 상태에 의한 영향이 완전하게 배제되고 피의자의 의사결정의 자유가 확실하게 보장되었다고 볼 만한 다른 사정이 개입되지 않은 이상 불법체포와 증거수집 사이의 인과관계가 단절된 것으로 볼 수는 없다.","cite":"대법원 2010도2094","badge":"","topic":"","from":"GY-2025-2-X-37","seq":null},{"id":"X-OX-618","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 압수･수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 클라우드에 저장된 전자정보를 압수･수색하기 위해서는 압수･ 수색영장에 적힌 ‘압수할 물건’에 별도로 원격지 클라우드 저장 전자정보가 특정되어 있어야 한다. (23.2차)","answer":true,"quote":"법관이 압수·수색영장을 발부하면서 ‘압수할 물건’을 특정하기 위하여 기재한 문언은 엄격하게 해석하여야 하는지 여부 (적극) / 수사기관이 압수·수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 서버에 저장된 전자정보를 압수·수색하기 위해서는 압수·수색영장에 적힌 ‘압수할 물건’에 별도로 원격지 서버 저장 전자정보가 특정되어 있어야 하는지 여부 (적극) / 압수·수색영장에 적힌 ‘압수할 물건’에 컴퓨터 등 정보처리장치 저장 전자정보만 기재되어 있는 경우, 컴퓨터 등 정보처리장치를 이용하여 원격지 서버 저장 전자정보를 압수할 수 있는지 여부 (소극)","cite":"대법원 2022도1452","badge":"","topic":"","from":"GY-2023-2-X-33","seq":null},{"id":"X-OX-670","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 자신의 휴대전화 카메라를 이용하여 총 9회에 걸쳐 성적 욕망 또는 수치심을 유발할 수 있는 피해자 4명의 신체를 그들의 의사에 반하여 촬영하여 수사기관에 현행범으로 체포 되면서 체포 당시 임의제출 형식으로 휴대전화가 압수된 경우, 휴대전화 제출에 관해 검사가 임의성의 의문점을 없애는 증명을 다하지 못하면 휴대전화 및 그에 저장된 전자정보는 위법수집증거에 해당하여 증거능력이 없다. (25.2차)","answer":true,"quote":"피고인이 자신의 휴대전화 카메라를 이용하여 총 9회에 걸쳐 성적 욕망 또는 수치심을 유발할 수 있는 피해자 4명의 신체를 그들의 의사에 반하여 촬영하였다는 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)의 공소사실과 관련하여, 수사기관이 피고인을 현행범으로 체포할 당시 임의제출 형식으로 압수한 휴대전화의 증거능력이 문제 된 사안에서, 피고인은 현행범 체포 당시 목격자로부터 휴대전화를 빼앗겨 위축된 심리 상태였고, 목격자 및 경찰관으로부터 휴대전화를 되찾기 위해 달려들기도 하였으며, 경찰서로 연행되어 변호인의 조력을 받지 못한 상태에서 피의자로 조사받으면서 일부 범행에 대하여 부인하고 있던 상황이었으므로, 피고인이 자발적으로 휴대전화를 수사기관에 제출하였는지를 엄격히 심사해야 하는 점, 수사기관이 임의제출자인 피고인에게 임의제출의 의미, 절차와 임의제출할 경우 피압수물을 임의로 돌려받지는 못한다는 사정 등을 고지하였음을 인정할 자료가 없는 점, 피고인은 당시 \"경찰관으로부터 ‘휴대전화를 반환할 수 있다.’는 말을 들었다.\"라고 진술하는 등 휴대전화를 임의제출할 경우 나중에 번의하더라도 되돌려받지 못한다는 사정을 인식하고 있었다고 단정하기 어려운 점 등에 비추어 볼 때, 휴대전화 제출에 관하여 검사가 임의성의 의문점을 없애는 증명을 다하지 못하였으므로 휴대전화 및 그에 저장된 전자정보는 위법수집증거에 해당하여 증거능력이 없다는 이유로, 공소사실에 대하여 범죄의 증명이 없다고 보아 무죄를 선고한 원심의 결론이 옳다고 한 사례.","cite":"대법원 2020도9431","badge":"","topic":"","from":"GY-2025-2-X-37","seq":null},{"id":"X-OX-663","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"형벌법규는 문언에 따라 엄격하게 해석‧적용하여야 하고 피고인에게 불리하게 확장해석하거나 유추해석할 수 없으나, 문언의 통상적인 의미를 벗어나지 않는 한 그 법률의 입법 취지와 목적, 입법의 연혁 등을 고려한 목적론적 해석이 배제되는 것은 아니다. (25.2차)","answer":true,"quote":"형벌법규는 문언에 따라 엄격하게 해석·적용하여야 하고 피고인에게 불리한 방향으로 지나치게 확장해석하거나 유추해석하여서는 아니 되나, 형벌법규의 해석에 있어서도 가능한 문언의 의미 내에서 당해 규정의 입법 취지와 목적 등을 고려한 법률체계적 연관성에 따라 그 문언의 논리적 의미를 분명히 밝히는 체계적·논리적 해석방법은 그 규정의 본질적 내용에 가장 접근한 해석을 위한 것으로서 죄형법정주의의 원칙에 부합한다.","cite":"대법원 2022도10961","badge":"","topic":"","from":"GY-2025-2-X-01","seq":null},{"id":"X-OX-710","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"乙의 피의자신문조서는 乙이 법정에서 그 내용을 인정하면 甲이 내용을 부인하더라도 甲의 공소사실에 대한 증거로 사용할 수 있다. (23.1차)","answer":false,"quote":"경찰이 작성한 공범의 피의자신문조서는 그 공범이 내용을 인정해도, 증거로 쓰려는 사건의 피고인 甲이 내용을 부인하면 증거능력이 없다.","cite":"대법원 2019도11552 · 형사소송법 제312조","badge":"","topic":"","from":"GY-2023-1-X-40","seq":null},{"id":"X-OX-741","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"변호인은 피고인을 대리하여 증거동의에 관한 의견을 낼 수 있을 뿐만 아니라 피고인의 명시한 의사에 반하여 증거로 함에 동의할 수 있다. (25.1차)","answer":false,"quote":"증거동의의 주체는 검사와 피고인이고 변호인은 피고인을 대리해 의견을 낼 뿐이어서, 피고인의 명시한 의사에 반해 동의할 수 없다.","cite":"대법원 2013도3 · 형사소송법 제318조","badge":"","topic":"","from":"GY-2025-1-X-36","seq":null},{"id":"X-OX-622","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"공소제기 전에 피고인을 피의자로 조사했던 사법경찰관이 공판기일에 피고인의 진술을 그 내용으로 하여 한 진술을 증거로 하기 위해서는 사법경찰관이 피의자였던 피고인으로부터 진술을 들을 당시 피고인이 증언능력에 준하는 능력을 갖춘 상태에 있었어야 한다. (23.2차)","answer":true,"quote":"조사자가 피고인의 진술을 법정에서 옮기려면, 피고인이 그 진술을 할 때 증언능력에 준하는 능력을 갖추고 있었어야 한다.","cite":"형사소송법 제316조","badge":"","topic":"","from":"GY-2023-2-X-38","seq":null},{"id":"X-OX-604","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"출입국사범 사건에서 지방출입국･외국인관서의 장의 적법한 고발이 있었는지 여부가 문제 되는 경우에 법원은 증거조사의 방법이나 증거능력의 제한을 받지 아니하고 제반 사정을 종합하여 적당하다고 인정되는 방법에 의하여 자유로운 증명으로 그 고발 유무를 판단하면 된다. (23.1차)","answer":true,"quote":"출입국사범 사건에서 지방출입국ㆍ외국인관서의 장의 적법한 고발이 있었는지 여부가 문제 되는 경우에 법원은 증거조사의 방법이나 증거능력의 제한을 받지 아니하고 제반 사정을 종합하여 적당하다고 인정되는 방법에 의하여 자유로운 증명으로 그 고발 유무를 판단하면 된다.","cite":"대법원 2021도404","badge":"","topic":"","from":"GY-2023-1-X-34","seq":null},{"id":"X-OX-613","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 A 회사에서 압수･수색영장을 집행하면서 A 회사에 팩스로 영장 사본을 송신하기만 하고 영장 원본을 제시하지 않았고 또한 압수조서와 압수물 목록을 작성하여 피압수･수색 당사자에게 교부하지 않은 채 피고인의 이메일을 압수한 후 이를 증거로 제출한 것은 적법절차 원칙의 실질적인 내용을 침해한 것이다. (23.2차)","answer":true,"quote":"수사기관이 甲 주식회사에서 압수수색영장을 집행하면서 甲 회사에 팩스로 영장 사본을 송신하기만 하고 영장 원본을 제시하거나 압수조서와 압수물 목록을 작성하여 피압수·수색 당사자에게 교부하지도 않은 채 피고인의 이메일을 압수한 후 이를 증거로 제출한 사안에서, 위와 같은 방법으로 압수된 이메일은 증거능력이 없다고 본 원심판단을 수긍한 사례","cite":"대법원 2015도10648","badge":"","topic":"","from":"GY-2023-2-X-29","seq":null},{"id":"X-OX-598","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"친고죄에서 적법한 고소유무는 자유로운 증명의 대상이다. (22.2차)","answer":true,"quote":"친고죄에서 적법한 고소가 있었는지는 자유로운 증명의 대상이 되고, 일죄의 관계에 있는 범죄사실 일부에 대한 고소의 효력은 일죄 전부에 대하여 미친다.","cite":"대법원 2011도4451","badge":"","topic":"","from":"GY-2022-2-X-34","seq":null},{"id":"X-OX-650","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"법인에 대한 양벌규정이 있는 필요적 고발(즉시고발)사건의 고발장에 피고발인을 A 주식회사라고 명시한 다음, 이어서 위 A 주식회사의 등록번호와 대표자인 B의 성명‧주민등록번호‧ 주소를 기재하고 있을 뿐이라면, 이와 같은 고발장의 표시가 B를 피고발자로 표시한 것이라고 볼 수는 없다. (25.1차)","answer":true,"quote":"피고발인을 법인으로 명시한 다음, 이어서 법인의 등록번호와 대표자의 인적 사항을 기재한 고발장의 표시를 자연인인 개인까지를 피고발자로 표시한 것이라고 볼 수는 없다고 한 사례.","cite":"대법원 2004도4066","badge":"","topic":"","from":"GY-2025-1-X-28","seq":null},{"id":"X-OX-675","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피의자는 일체의 진술을 하지 않거나 개개의 질문에 대하여 진술을 하지 않을 수 있고, 진술을 하지 않더라도 불이익을 받지 않으며, 피의자가 진술을 거부할 권리를 포기하고 행한 진술은 법정에서 유죄의 증거로 사용될 수 있다. (26.1차)","answer":true,"quote":"① 검사 또는 사법경찰관은 피의자를 신문하기 전에 다음 각 호의 사항을 알려주어야 한다. 1. 일체의 진술을 하지 아니하거나 개개의 질문에 대하여 진술을 하지 아니할 수 있다는 것 2. 진술을 하지 아니하더라도 불이익을 받지 아니한다는 것 3. 진술을 거부할 권리를 포기하고 행한 진술은 법정에서 유죄의 증거로 사용될 수 있다는 것 4. 신문을 받을 때에는 변호인을 참여하게 하는 등 변호인의 조력을 받을 수 있다는 것","cite":"형사소송법 제244조의3 제1항","badge":"","topic":"","from":"GY-2026-1-X-28","seq":null},{"id":"X-OX-695","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"“피해자로부터 ‘피고인이 자신을 추행했다.’는 취지의 말을 들었다.”는 A의 진술을 “피고인이 자신을 추행했다.”는 피해자의 진술내용의 진실성을 증명하는 간접사실로 사용하는 경우에는 전문증거에 해당하지 않는다. (22.2차)","answer":false,"quote":"전문증거의 증거능력 / 다른 사람의 진술을 내용으로 하는 진술이 전문증거인지 본래증거인지 판단하는 기준 / 어떤 진술 내용의 진실성이 범죄사실에 대한 직접증거로 사용될 경우, 전문증거인지 여부 (적극) 및 어떠한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 진술의 증거능력을 인정한 다음 그 사실을 다시 진술 내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우, 그 진술은 전문증거에 해당하는지 여부 (적극)","cite":"대법원 2020도17109","badge":"","topic":"","from":"GY-2022-2-X-37","seq":null},{"id":"X-OX-726","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사 또는 사법경찰관은 피의자의 연령·성별·국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 경우 피의자와 신뢰관계에 있는 자를 동석하게 하여야 하며, 신뢰관계인이 동석하지 않은 상태에서 행한 진술은 임의성이 인정되더라도 유죄인정의 증거로 사용할 수 없다. (24.2차)","answer":false,"quote":"검사 또는 사법경찰관은 피의자를 신문하는 경우 다음 각 호의 어느 하나에 해당하는 때에는 직권 또는 피의자·법정대리인의 신청에 따라 피의자와 신뢰관계에 있는 자를 동석하게 할 수 있다. 1. 피의자가 신체적 또는 정신적 장애로 사물을 변별하거나 의사를 결정·전달할 능력이 미약한 때 2. 피의자의 연령·성별·국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 경우 [본조신설 2007.6.1.]","cite":"형사소송법 제244조의5","badge":"","topic":"","from":"GY-2024-2-X-29","seq":null},{"id":"X-OX-727","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 체포영장에 의해 피의자를 체포하는 경우에는 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정하여 영장 없이 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 발견을 위한 수색을 할 수 있다. 이 경우에는 사후에 지체 없이 수색영장을 받아야 한다. (24.2차)","answer":false,"quote":"① 검사 또는 사법경찰관은 제200조의2·제200조의3·제201조 또는 제212조의 규정에 의하여 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장없이 다음 처분을 할 수 있다. <개정 1995.12.29., 2019. 12. 31> 1. 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 수색. 다만, 제200조의2 또는 제201조에 따라 피의자를 체포 또는 구속하는 경우의 피의자 수색은 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정한다. 2. 체포현장에서의 압수, 수색, 검증","cite":"형사소송법 제216조 제1항","badge":"","topic":"","from":"GY-2024-2-X-30","seq":null},{"id":"X-OX-599","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"A가 제출한 휴대폰이 임의제출물이라 하더라도 휴대폰을 탐색하는 과정에서 甲에게 참여권을 보장하고 압수목록을 교부해야 한다. (22.2차)","answer":true,"quote":"피해자가 피의자 소유 휴대폰을 임의제출해도 정보의 주체인 피의자에게 참여권을 보장하고 전자정보 목록을 교부해야 한다.","cite":"대법원 2016도348","badge":"","topic":"","from":"GY-2022-2-X-35","seq":null},{"id":"X-OX-601","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"USB에 저장된 CCTV 영상이 범죄 당시 현장의 영상이라는 사실이 요증사실인 경우에는 전문법칙이 적용되지 않는다. (22.2차)","answer":true,"quote":"범행 장면이 찍혔다는 사실을 증명하는 CCTV 영상은 사람의 진술이 아니어서 전문법칙이 적용되지 않는다.","cite":"형사소송법 제310조의2","badge":"","topic":"","from":"GY-2022-2-X-39","seq":null},{"id":"X-OX-619","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피의자가 휴대전화를 임의제출하면서 휴대전화에 저장된 전자정보가 아닌 클라우드 등 제3자가 관리하는 원격지에 저장되어 있는 전자정보를 수사기관에 제출한다는 의사로 수사기관에게 클라우드 등에 접속하기 위한 아이디와 비밀 번호를 임의로 제공하였다면 위 클라우드 등에 저장된 전자 정보를 임의제출하는 것으로 볼 수 있다. (23.2차)","answer":true,"quote":"피의자의 이메일 계정에 대한 접근권한에 갈음하여 발부받은 압수·수색영장에 따라 원격지의 저장매체에 적법하게 접속하여 내려받거나 현출된 전자정보를 대상으로 하여 범죄 혐의사실과 관련된 부분에 대하여 압수·수색하는 것이 허용되는지 여부 (적극) / 피의자가 휴대전화를 임의제출하면서 원격지에 저장되어 있는 전자정보를 수사기관에 제출한다는 의사로 수사기관에게 클라우드 등에 접속하기 위한 아이디와 비밀번호를 임의로 제공한 경우 위 클라우드 등에 저장된 전자정보를 임의제출 하는 것으로 볼 수 있는지 여부 (적극)","cite":"대법원 2020도14654","badge":"","topic":"","from":"GY-2023-2-X-33","seq":null},{"id":"X-OX-591","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 공소사실을 부인하고 있는 상황에서 검사가 신청한 증인의 법정진술이 전문증거로서 증거능력이 없는 경우, 피고인 또는 변호인에게 의견을 묻는 등의 적절한 방법으로 그러한 사정에 대하여 고지가 이루어지지 않은 채 증인신문이 진행되 었다면, 피고인이 그 증거조사 결과에 대하여 별 의견이 없다고 진술하였더라도 증인의 법정증언을 증거로 삼는 데에 동의한 것으로 볼 수 없다. (22.1차)","answer":true,"quote":"피고인이 새마을금고 이사장 선거와 관련하여 대의원 甲에게 자신을 지지해 달라고 부탁하면서 현금 50만 원을 제공하였다고 하여 새마을금고법 위반으로 기소되었는데, 검사는 사법경찰관 작성의 공범 甲에 대한 피의자신문조서 및 진술조서를 증거로 제출하고, 검사가 신청한 증인 乙은 법정에 출석하여 ‘甲으로부터 피고인에게서 50만 원을 받았다는 취지의 말을 들었다’고 증언한 사안에서, 甲이 법정에 출석하여 위 피의자신문조서 및 진술조서의 성립의 진정을 인정하였더라도 피고인이 공판기일에서 그 조서의 내용을 모두 부인한 이상 이는 증거능력이 없고, 한편 제1심 및 원심 공동피고인인 甲은 원심에 이르기까지 일관되게 피고인으로부터 50만 원을 받았다는 취지의 공소사실을 부인한 사실에 비추어 원진술자 甲이 사망, 질병, 외국거주, 소재불명 그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때에 해당하지 아니하여 甲의 진술을 내용으로 하는 乙의 법정증언은 전문증거로서 증거능력이 없으며, 나아가 피고인은 일관되게 甲에게 50만 원 자체를 교부한 적이 없다고 주장하면서 적극적으로 다툰 점, 이에 따라 사법경찰관 작성의 甲에 대한 피의자신문조서 및 진술조서의 내용을 모두 부인한 점, 乙의 법정증언이 전문증거로서 증거능력이 없다는 사정에 대하여 피고인 또는 변호인에게 의견을 묻는 등의 적절한 방법으로 고지가 이루어지지 않은 채 증인신문이 진행된 다음 증거조사 결과에 대한 의견진술이 이루어진 점, 乙이 위와 같이 증언하기에 앞서 원진술자 甲이 피고인으로부터 50만 원을 제공받은 적이 없다고 이미 진술한 점 등을 종합하면 피고인이 乙의 법정증언을 증거로 삼는 데에 동의하였다고 볼 여지는 없고, 乙의 증언에 따른 증거조사 결과에 대하여 별 의견이 없다고 진술하였더라도 달리 볼 수 없으므로, 결국 사법경찰관 작성의 甲에 대한 피의자신문조서 및 진술조서와 乙의 전문진술은 증거능력이 없다는 이유로, 위 각 증거의 증거능력을 인정하여 공소사실에 대한 유죄의 증거로 삼은 원심의 조치에 형사소송법 제312조 , 제316조 등에서 정한 증거능력에 관한 법리 등을 오해한 잘못이 있다고 한 사례.","cite":"대법원 2019도11552","badge":"","topic":"","from":"GY-2022-1-X-39","seq":null},{"id":"X-OX-742","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제312조 제3항에서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되 어 있다는 것을 의미한다. (25.1차)","answer":false,"quote":"형사소송법 제312조 제3항 에 의하면, 검사 이외의 수사기관 작성의 피의자신문조서는 공판준비 또는 공판기일에 그 피의자였던 피고인이나 변호인이 그 내용을 인정할 때에 한하여 증거로 할 수 있다고 규정하고 있는바, 위 규정에서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다.","cite":"대법원 2010도5040","badge":"","topic":"","from":"GY-2025-1-X-38","seq":null},{"id":"X-OX-636","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 ｢형사소송법｣ 제318조 제1항에 의한 증거동의가 있는 것으로 간주한다. 다만, 피고인이 출정하지 아니하더라도 대리인 또는 변호인이 출정한 때에는 예외로 한다. (24.1차)","answer":true,"quote":"② 피고인의 출정없이 증거조사를 할 수 있는 경우에 피고인이 출정하지 아니한 때에는 전항의 동의가 있는 것으로 간주한다. 단, 대리인 또는 변호인이 출정한 때에는 예외로 한다.","cite":"형사소송법 제318조 제2항","badge":"","topic":"","from":"GY-2024-1-X-39","seq":null},{"id":"X-OX-588","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 피의자신문조서에 기재된 피고인의 진술 및 공판기일 에서의 피고인의 진술의 임의성을 다투면서 그것이 허위자백 이라고 다투는 경우, 법원은 제반 사정을 참작하여 자유로운 심증으로 임의성 여부를 판단하면 된다. (22.1차)","answer":true,"quote":"피고인이 피의자신문조서에 기재된 피고인의 진술 및 공판기일에서의 피고인의 진술의 임의성을 다투면서 그것이 허위자백이라고 다투는 경우, 법원은 구체적인 사건에 따라 피고인의 학력, 경력, 직업, 사회적 지위, 지능정도, 진술의 내용, 피의자신문조서의 경우 그 조서의 형식 등 제반 사정을 참작하여 자유로운 심증으로 위 진술이 임의로 된 것인지의 여부를 판단하면 된다.","cite":"대법원 2003도705","badge":"","topic":"","from":"GY-2022-1-X-36","seq":null},{"id":"X-OX-715","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 피의자의 이메일 계정에 대한 접근권한에 갈음 하여 발부받은 압수･수색영장에 따라, 원격지의 저장매체에 적법하게 접속하여 내려받거나 현출된 전자정보를 대상으로 하여 범죄 혐의사실과 관련된 부분에 대하여 압수･수색하는 것은 특별한 사정이 없는 한 허용되지만, 원격지 저장매체가 국외에 있는 경우에는 허용되지 않는다. (23.2차)","answer":false,"quote":"이메일 계정 접근권한에 갈음한 영장으로 원격지 저장매체에 접속해 내려받은 정보를 압수하는 것은 서버가 국외에 있어도 허용된다.","cite":"형사소송법 제215조 · 형사소송법 제120조","badge":"","topic":"","from":"GY-2023-2-X-33","seq":null},{"id":"X-OX-755","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사나 사법경찰관 등 수사주체의 판단에는 상당한 재량의 여지가 있다고 볼 수 없기 때문에 긴급체포 당시의 상황으로 보아서 그 요건의 충족 여부에 관한 검사나 사법경찰관의 판단이 경험칙에 비추어 현저히 합리성을 잃은 경우에는 불법 체포죄가 성립한다. (26.1차)","answer":false,"quote":"긴급체포 요건 판단에는 수사주체에게 상당한 재량이 있고, 체포 당시 상황으로 보아도 경험칙상 현저히 합리성을 잃은 경우에만 위법한 체포다.","cite":"형사소송법 제200조의3","badge":"","topic":"","from":"GY-2026-1-X-25","seq":null},{"id":"X-OX-676","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 범죄수사를 위한 통신제한조치의 허가요건이 구비된 경우에는 검사에 대하여 각 피의자별 또는 각 피내사자별로 통신제한조치에 대한 허가를 신청하고, 검사는 법원에 대하여 그 허가를 청구할 수 있다. (26.1차)","answer":true,"quote":"① 검사(검찰관을 포함한다. 이하 같다) 는 제5조제1항의 요건이 구비된 경우에는 법원(군사법원을 포함한다. 이하 같다)에 대하여 각 피의자별 또는 각 피내사자별로 통신제한조치를 허가하여 줄 것을 청구할 수 있다. <개정 2001.12.29> ②사법경찰관(군사법경찰관을 포함한다. 이하 같다)은 제5조제1항의 요건이 구비된 경우에는 검사에 대하여 각 피의자별 또는 각 피내사자별로 통신제한조치에 대한 허가를 신청하고, 검사는 법원에 대하여 그 허가를 청구할 수 있다. <개정 2001.12.29> ③제1항 및 제2항의 통신제한조치 청구사건의 관할법원은 그 통신제한조치를 받을 통신당사자의 쌍방 또는 일방의 주소지·소재지, 범죄지 또는 통신당사자와 공범관계에 있는 자의 주소지·소재지를 관할하는 지방법원 또는 지원(보통군사법원을 포함한다)으로 한다. <개정 2001.12.29> ④제1항 및 제2항의 통신제한조치청구는 필요한 통신제한조치의 종류·그 목적·대상·범위·기간·집행장소·방법 및 당해 통신제한조치가 제5조제1항의 허가요건을 충족하는 사유등의 청구이유를 기재한 서면(이하 \"청구서\"라 한다)으로 하여야 하며, 청구이유에 대한 소명자료를 첨부하여야 한다. 이 경우 동일한 범죄사실에 대하여 그 피의자 또는 피내사자에 대하여 통신제한조치의 허가를 청구하였거나 허가받은 사실이 있는 때에는 다시 통신제한조치를 청구하는 취지 및 이유를 기재하여야 한다. <개정 2001.12.29> ⑤법원은 청구가 이유 있다고 인정하는 경우에는 각 피의자별 또는 각 피내사자별로 통신제한조치를 허가하고, 이를 증명하는 서류(이하 \"허가서\"라 한다)를 청구인에게 발부한다. <개정 2001.12.29> ⑥제5항의 허가서에는 통신제한조치의 종류·그 목적·대상·범위·기간 및 집행장소와 방법을 특정하여 기재하여야 한다. <개정 2001.12.29> ⑦통신제한조치의 기간은 2월을 초과하지 못하고, 그 기간중 통신제한조치의 목적이 달성되었을 경우에는 즉시 종료하여야 한다. 다만, 제5조제1항의 허가요건이 존속하는 경우에는 제1항 및 제2항의 절차에 따라 소명자료를 첨부하여 2월의 범위안에서 통신제한조치기간의 연장을 청구할 수 있다. <개정 2001.12.29> ⑧법원은 청구가 이유없다고 인정하는 경우에는 청구를 기각하고 이를 청구인에게 통지한다. [헌법불합치, 2009헌가30,","cite":"통신비밀보호법 제6조 제1항","badge":"","topic":"","from":"GY-2026-1-X-31","seq":null},{"id":"X-OX-729","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"범죄수사를 위한 통신제한조치의 기간은 1개월을 초과하지 못하고, 그 기간 중 통신제한조치의 목적이 달성되었을 경우에는 즉시 종료하여야 한다. (24.2차)","answer":false,"quote":"범죄수사를 위한 통신제한조치 기간은 2개월을 넘지 못하고, 그 안에 목적을 이루면 즉시 끝내야 한다.","cite":"통신비밀보호법 제6조","badge":"","topic":"","from":"GY-2024-2-X-33","seq":null},{"id":"X-OX-698","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"A가 甲의 고소로 조사받는 것을 따지기 위하여 야간에 甲의 집에 침입한 상태에서 문을 닫으려는 甲과 열려는 A 사이의 실랑이가 계속되는 과정에서 문짝이 떨어져 그 앞에 있던 A가 넘어져 2주간의 치료를 요하는 타박상을 입게 된 경우, 甲의 행위는 사회통념에 비추어 용인할 수 있는 정도의 것이라고 보기 어렵다. (23.1차)","answer":false,"quote":"피해자가 피고인의 고소로 조사받는 것을 따지기 위하여 야간에 피고인의 집에 침입한 상태에서 문을 닫으려는 피고인과 열려는 피해자 사이의 실랑이가 계속되는 과정에서 문짝이 떨어져 그 앞에 있던 피해자가 넘어져 2주간의 치료를 요하는 요추부염좌 및 우측 제4수지 타박상의 각 상해를 입게 된 경우, 피고인의 가해행위가 이루어진 시간 및 장소, 경위와 동기, 방법과 강도 및 피고인의 의사와 목적 등에 비추어 볼 때, 사회통념상 허용될 만한 정도를 넘어서는 위법성이 있는 행위라고 보기는 어려우므로 정당행위에 해당한다고 본 사례.","cite":"대법원 99도4273","badge":"","topic":"","from":"GY-2023-1-X-05","seq":null},{"id":"X-OX-721","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲이 X고등학교 앞길에서 피해자 A와 싸움을 하자, A의 친구 B가 112 신고를 하고 甲이 도주하는지 여부를 계속 감시하고 있었다. 그 후 경찰이 위 범행현장에 인접한 위 학교 운동장에 출동하였고, B가 甲을 범인으로 지목하자 위 싸움이 있은지 10분 정도 경과한 상황에서, 경찰이 곧바로 위 운동장에서 甲을 현행범인으로 체포한 경우 그 체포는 위법하다. (24.1차)","answer":false,"quote":"범행 10분 뒤 바로 옆 운동장에서, 계속 지켜본 신고자가 지목한 사람이면 범행 직후의 범인임이 명백해 적법한 현행범 체포다.","cite":"대법원 93도926","badge":"","topic":"","from":"GY-2024-1-X-30","seq":null},{"id":"X-OX-740","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관은 특정 범죄혐의와 관련하여 정보저장매체에 저장된 전자정보를 압수하는 경우, 정보저장매체 자체를 임의제출받은 경우라면 영장에 의한 압수‧수색의 경우와 다르게 임의제출의 효력에 의하여 정보저장매체 자체나 그 전체내용의 복제본을 수사기관에 반출하는 방식으로 압수‧수색을 할 수 있음이 원칙이다. (25.1차)","answer":false,"quote":"임의제출이라도 압수 대상은 혐의사실과 관련된 전자정보가 원칙이고, 매체 자체나 전체 복제본을 가져가는 것은 예외적으로만 허용된다.","cite":"대법원 2016도348 · 형사소송법 제218조 · 형사소송법 제106조","badge":"","topic":"","from":"GY-2025-1-X-31","seq":null},{"id":"X-OX-595","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사 또는 사법경찰관은 피의자를 현행범인으로 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압수 수색을 할 수 있다. (22.2차)","answer":true,"quote":"① 검사 또는 사법경찰관은 제200조의2·제200조의3·제201조 또는 제212조의 규정에 의하여 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장없이 다음 처분을 할 수 있다. <개정 1995.12.29., 2019. 12. 31> 1. 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 수색. 다만, 제200조의2 또는 제201조에 따라 피의자를 체포 또는 구속하는 경우의 피의자 수색은 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정한다. 2. 체포현장에서의 압수, 수색, 검증","cite":"형사소송법 제216조 제1항","badge":"","topic":"","from":"GY-2022-2-X-30","seq":null},{"id":"X-OX-708","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제314조의 특신상태의 증명은 참고인의 진술 또는 조서의 작성이 특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 개연성 있는 정도의 증명으로 족하고, 법관으로 하여금 반드시 합리적인 의심의 여지를 배제할 정도에 이르러야 하는 것은 아니다. (23.1차)","answer":false,"quote":"형사소송법이 원진술자 또는 작성자(이하 ‘참고인’이라 한다)의 소재불명 등의 경우에 참고인이 진술하거나 작성한 진술조서나 진술서에 대하여 증거능력을 인정하는 것은, 형사소송법이 제312조 또는 제313조 에서 참고인 진술조서 등 서면증거에 대하여 피고인 또는 변호인의 반대신문권이 보장되는 등 엄격한 요건이 충족될 경우에 한하여 증거능력을 인정할 수 있도록 함으로써 직접심리주의 등 기본원칙에 대한 예외를 인정한 데 대하여 다시 중대한 예외를 인정하여 원진술자 등에 대한 반대신문의 기회조차 없이 증거능력을 부여할 수 있도록 한 것이므로, 그 경우 참고인의 진술 또는 작성이 ‘특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 증명’은 단지 그러할 개연성이 있다는 정도로는 부족하고 합리적인 의심의 여지를 배제할 정도에 이르러야 한다.","cite":"대법원 2013도12652","badge":"","topic":"","from":"GY-2023-1-X-38","seq":null},{"id":"X-OX-585","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"공판기일 외의 증인신문 검증에 대하여는 공판조서의 배타적 증명력이 인정되지 않는다. (22.1차)","answer":true,"quote":"공판조서의 배타적 증명력은 공판기일의 소송절차에만 미치므로, 공판기일 외의 증인신문·검증에는 인정되지 않는다.","cite":"형사소송법 제56조","badge":"","topic":"","from":"GY-2022-1-X-34","seq":null},{"id":"X-OX-616","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"구속적부심사 청구에 대한 법원의 기각결정 및 석방결정에 대해서는 항고할 수 없지만, 보증금납입조건부 석방결정에 대해서는피의자나 검사가그취소의 실익이있으면｢형사소송법｣ 제402조에 의하여 항고할 수 있다. (23.2차)","answer":true,"quote":"구속적부심의 기각·석방결정에는 항고할 수 없지만, 보증금납입조건부 석방결정에는 취소의 실익이 있으면 항고할 수 있다.","cite":"형사소송법 제214조의2 · 형사소송법 제402조","badge":"","topic":"","from":"GY-2023-2-X-32","seq":null},{"id":"X-OX-629","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관은 영장 발부의 사유로 된 범죄 혐의사실과 관계가 없는 증거를 압수할 수 없고, 별도의 영장을 발부받지 아니하고서는 압수물 또는 압수한 정보를 그 압수의 근거가 된 압수･수색영장 혐의사실과 관계가 없는 범죄의 유죄 증거로 사용할 수 없다. (24.1차)","answer":true,"quote":"따라서 수사기관은 영장 발부의 사유로 된 범죄 혐의사실과 관계가 없는 증거를 압수할 수 없고, 별도의 영장을 발부받지 아니하고서는 압수물 또는 압수한 정보를 그 압수의 근거가 된 압수·수색영장 혐의사실과 관계가 없는 범죄의 유죄 증거로 사용할 수 없다.","cite":"대법원 2018도18866","badge":"","topic":"","from":"GY-2024-1-X-34","seq":null},{"id":"X-OX-632","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인의 자백의 신빙성 유무를 판단할 때에는 그 자백에 ｢형사소송법｣ 제309조에 정한 사유 또는 자백의 동기나 과정에 합리적인 의심을 갖게 할 상황이 있었는지를 판단하여야 한다. (24.1차)","answer":true,"quote":"검찰에서의 피고인의 자백이 법정진술과 다르다거나 피고인에게 지나치게 불리한 내용이라는 사유만으로는 그 자백의 신빙성이 의심스럽다고 할 수는 없는 것이고, 자백의 신빙성 유무를 판단할 때에는 자백의 진술 내용 자체가 객관적으로 합리성을 띠고 있는지, 자백의 동기나 이유가 무엇이며, 자백에 이르게 된 경위는 어떠한지 그리고 자백 이외의 정황증거 중 자백과 저촉되거나 모순되는 것이 없는지 하는 점 등을 고려하여 피고인의 자백에 형사소송법 제309조 에 정한 사유 또는 자백의 동기나 과정에 합리적인 의심을 갖게 할 상황이 있었는지를 판단하여야 한다.","cite":"대법원 2009도1151","badge":"","topic":"","from":"GY-2024-1-X-36","seq":null},{"id":"X-OX-623","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사 또는 사법경찰관은 피의자를 신문하는 경우, 피의자의 연령･ 성별･국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 때에는 직권으로 피의자와 신뢰관계에 있는 자를 동석하게 할 수 있다. (24.1차)","answer":true,"quote":"검사 또는 사법경찰관은 피의자를 신문하는 경우 다음 각 호의 어느 하나에 해당하는 때에는 직권 또는 피의자·법정대리인의 신청에 따라 피의자와 신뢰관계에 있는 자를 동석하게 할 수 있다. 1. 피의자가 신체적 또는 정신적 장애로 사물을 변별하거나 의사를 결정·전달할 능력이 미약한 때 2. 피의자의 연령·성별·국적 등의 사정을 고려하여 그 심리적 안정의 도모와 원활한 의사소통을 위하여 필요한 경우 [본조신설 2007.6.1.]","cite":"형사소송법 제244조의5","badge":"","topic":"","from":"GY-2024-1-X-29","seq":null},{"id":"X-OX-751","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피압수자는 A이므로 P가 사기 관련 전자정보를 선별하는 과정에서 甲에게 참여권을 보장하지 않았다 하더라도 위법 하지 않다. (25.2차)","answer":false,"quote":"메신저 서버의 정보라도 그 정보를 만든 서비스 이용자 甲은 실질적 피압수자라, 선별 과정에서 甲에게 참여권을 보장하지 않으면 위법하다.","cite":"형사소송법 제121조 · 형사소송법 제219조","badge":"","topic":"","from":"GY-2025-2-X-36","seq":null},{"id":"X-OX-733","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"참고인의 진술을 내용으로 하는 조사자 증언은 그 참고인이 법정에 출석하여 조사 당시의 진술을 부인하는 취지로 증언 하였더라도, 그 진술이 ‘특히 신빙할 수 있는 상태에서 행하여 졌음’이 증명되면 증거능력이 인정된다. (24.2차)","answer":false,"quote":"따라서 조사자의 증언에 증거능력이 인정되기 위해서는 원진술자가 사망, 질병, 외국거주, 소재불명, 그 밖에 이에 준하는 사유로 인하여 진술할 수 없어야 하는 것이라서, 원진술자가 법정에 출석하여 수사기관에서 한 진술을 부인하는 취지로 증언한 이상 원진술자의 진술을 내용으로 하는 조사자의 증언은 증거능력이 없다.","cite":"대법원 2008도6985","badge":"","topic":"","from":"GY-2024-2-X-38","seq":null},{"id":"X-OX-709","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 불출정하여 ｢형사소송법｣ 제318조 제2항에 따라 피고인의 증거동의로 간주된 후, 제1심 법원이 증거조사를 완료하였더라도 피고인이 항소심에 출석하여 공소사실을 부인 하면서 제1심에서 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하면 해당 증거의 증거능력은 상실된다. (23.1차)","answer":false,"quote":"형사소송법 제318조 제2항 에 따라 증거동의가 간주된 후 증거조사를 완료하였으나, 피고인이 항소심에 출석하여 간주된 증거동의를 철회 또는 취소한다는 의사표시를 한 경우, 그 증거의 증거능력이 상실되는지 여부 (소극)","cite":"대법원 2010도15977","badge":"","topic":"","from":"GY-2023-1-X-39","seq":null},{"id":"X-OX-648","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 작성한 실황조서가 사고발생 직후 사고장소에서 긴급을 요하여 판사의 영장없이 시행된 것으로서 ｢형사소송법｣ 제216조 제3항에 의한 검증에 따라 작성된 것이라면 사후에 지체없이 영장을 받지 않는 한 유죄의 증거로 삼을 수 없다. (24.2차)","answer":true,"quote":"사법경찰관 사무취급이 작성한 실황조서가 사고발생 직후 사고장소에서 긴급을 요하여 판사의 영장없이 시행된 것으로서","cite":"대법원 88도1399","badge":"","topic":"","from":"GY-2024-2-X-38","seq":null},{"id":"X-OX-747","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사 또는 사법경찰관리 아닌 자가 현행범인을 체포한 때에는 즉시 검사 또는 사법경찰관리에게 인도하여야 하며, 여기서 ‘즉시’라고 함은 반드시 체포시점과 시간적으로 밀착된 시점이어야 하는 것을 의미한다. (25.2차)","answer":false,"quote":"여기서 ‘즉시’라고 함은 반드시 체포시점과 시간적으로 밀착된 시점이어야 하는 것은 아니고, ‘정당한 이유 없이 인도를 지연하거나 체포를 계속하는 등으로 불필요한 지체를 함이 없이’라는 뜻으로 볼 것이다.","cite":"대법원 2011도12927","badge":"","topic":"","from":"GY-2025-2-X-31","seq":null},{"id":"X-OX-637","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제318조에 규정된 증거동의는 소송 주체인 검사와 피고인이 하는 것이고, 피고인이 변호인과 함께 출석한 공판기일의 공판조서에 검사가 제출한 증거에 대하여 동의한다는 기재가 되어 있다면 이는 피고인이 증거동의를 한 것으로 보아야 하고, 그 기재는 절대적인 증명력을 가진다. (24.1차)","answer":true,"quote":"피고인이 변호인과 함께 출석한 공판기일의 공판조서에 검사가 제출한 증거에 대하여 동의한다는 기재가 되어 있는 경우, 피고인이 증거 동의를 한 것으로 보아야 하는지 여부 (적극) 및 그 기재의 증명력","cite":"대법원 2015도19139","badge":"","topic":"","from":"GY-2024-1-X-39","seq":null},{"id":"X-OX-610","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제318조 제1항 증거동의는 전문증거금지의 원칙에 대한 예외로서 반대신문권을 포기하겠다는 피고인의 의사표시에 의하여 서류 또는 물건의 증거능력을 부여하려는 규정이다. (23.1차)","answer":true,"quote":"형사소송법 제318조 제1항 은 전문증거금지의 원칙에 대한 예외로서 반대신문권을 포기하겠다는 피고인의 의사표시에 의하여 서류 또는 물건의 증거능력을 부여하려는 규정이므로 피고인의 의사표시가 위와 같은 내용을 적극적으로 표시하는 것이라고 인정되는 경우이면 증거동의로서의 효력이 있다.","cite":"대법원 82도2873","badge":"","topic":"","from":"GY-2023-1-X-39","seq":null},{"id":"X-OX-711","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포죄는 계속범으로서 원칙적으로 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 성립하고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우라면 체포죄의 성립은 부정되어 무죄가 된다. (23.2차)","answer":false,"quote":"체포죄는 계속범으로서 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 기수에 이르고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우에는 체포죄의 미수범이 성립할 뿐이다.","cite":"대법원 2016도18713","badge":"","topic":"","from":"GY-2023-2-X-16","seq":null},{"id":"X-OX-654","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"임의제출물을 압수한 경우 압수물이 ｢형사소송법｣ 제218조에 따라 실제로 임의제출된 것인지에 관하여 다툼이 있을 때에는 임의제출의 임의성을 의심할 만한 합리적이고 구체적인 사실을 피고인이 증명할 것이 아니라 검사가 그 임의성의 의문점을 없애는 증명을 해야 한다. (25.1차)","answer":true,"quote":"임의제출물을 압수한 경우 압수물이 형사소송법 제218조 에 따라 실제로 임의제출된 것인지에 관하여 다툼이 있을 때에는 임의제출의 임의성을 의심할 만한 합리적이고 구체적인 사실을 피고인이 증명할 것이 아니라 검사가 그 임의성의 의문점을 없애는 증명을 해야 한다.","cite":"대법원 2020도9431","badge":"","topic":"","from":"GY-2025-1-X-35","seq":null},{"id":"X-OX-639","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲이 수사기관에 자진 출석하여 처음 조사를 받으면서는 돈을 차용하였을 뿐이라며 범죄사실을 부인하다가 제2회 조사를 받으 면서 비로소 업무와 관련하여 돈을 수수하였다고 자백한 행위에 대하여 자수감경을 할 수 없다. (24.2차)","answer":true,"quote":"피고인이 금융기관 직원인 자신의 업무와 관련하여 금품을 수수하였다고 하여 특정경제범죄 가중처벌 등에 관한 법률 위반(수재)죄로 기소된 사안에서, 피고인이 수사기관에 자진 출석하여 처음 조사를 받으면서는 돈을 차용하였을 뿐이라며 범죄사실을 부인하다가 제2회 조사를 받으면서 비로소 업무와 관련하여 돈을 수수하였다고 자백한 행위를 자수라고 할 수 없고, 설령 자수하였다고 하더라도 자수한 이에 대하여는 법원이 임의로 형을 감경할 수 있음에 불과한 것으로서 원심이 자수의 착오 주장에 대하여 판단하지 아니하였다 하여 위법하다고 할 수 없다고 한 사례.","cite":"대법원 2011도12041","badge":"","topic":"","from":"GY-2024-2-X-14","seq":null},{"id":"X-OX-583","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 수표를 발행하였으나 예금부족 또는 거래정지처분 으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 증거물의 예에 의하여 증거능력을 판단하여야 한다. (22.1차)","answer":true,"quote":"피고인이 수표를 발행하였으나 예금부족 또는 거래정지처분으로 지급되지 아니하게 하였다는 부정수표단속법위반의 공소사실을 증명하기 위하여 제출되는 수표는 그 서류의 존재 또는 상태 자체가 증거가 되는 것이어서 증거물인 서면에 해당하고 어떠한 사실을 직접 경험한 사람의 진술에 갈음하는 대체물이 아니므로, 증거능력은 증거물의 예에 의하여 판단하여야 하고, 이에 대하여는 형사소송법 제310조의2 에서 정한 전문법칙이 적용될 여지가 없다.","cite":"대법원 2015도2275","badge":"","topic":"","from":"GY-2022-1-X-34","seq":null},{"id":"X-OX-668","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"P가 甲으로부터 압수한 후 법원에 증거로 제출된 마약은 특별한 사정이 없는 한 위법수집증거에 해당한다. (25.2차)","answer":true,"quote":"증거능력 없는 자백을 기초로 받은 영장으로 압수한 마약은 위법한 1차 증거에서 나온 2차 증거라, 인과관계가 희석·단절된 사정이 없으면 증거로 쓸 수 없다.","cite":"대법원 2007도3061","badge":"","topic":"","from":"GY-2025-2-X-34","seq":null},{"id":"X-OX-674","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"긴급체포된 피의자는 체포적부심사를 청구할 수 있으나, 법원은 해당 피의자에 대하여 피의자의 출석을 보증할 만한 보증금의 납입을 조건으로 하여 결정으로 석방을 명할 수 없다. (26.1차)","answer":true,"quote":"2. 공범 또는 공동피의자의 순차청구가 수사방해의 목적임이 명백한 때 ④ 제1항의 청구를 받은 법원은 청구서가 접수된 때부터 48시간 이내에 체포 또는 구속된 피의자를 심문하고 수사관계서류와 증거물을 조사하여 그 청구가 이유없다고 인정한 때에는 결정으로 이를 기각하고, 이유있다고 인정한 때에는 결정으로 체포 또는 구속된 피의자의 석방을 명하여야 한다. 심사청구후 피의자에 대하여 공소제기가 있는 경우에도 또한 같다. <개정 1995.12.29., 2004.10.16., 2007.6.1.> ⑤ 법원은 구속된 피의자(심사청구후 공소제기된 자를 포함한다)에 대하여 피의자의 출석을 보증할 만한 보증금의 납입을 조건으로 하여 결정으로 제4항의 석방을 명할 수 있다. 다만, 다음 각 호에 해당하는 경우에는 그러하지 아니하다. <신설 1995.12.29., 2004.10.16., 2007.6.1.>","cite":"형사소송법 제214조의2","badge":"","topic":"","from":"GY-2026-1-X-28","seq":null},{"id":"X-OX-621","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 피해자에게 보낸 협박문자를 피해자가 화면캡쳐의 방식으로 촬영한 사진은 피고인의 협박죄 피고사건에 대해서는 전문증거에 해당하지 않는다. (23.2차)","answer":true,"quote":"공포심을 일으키는 문자를 보낸 범행에서 그 문자를 촬영한 사진은 범행 수단 자체를 옮긴 것이라 전문법칙이 적용되지 않는다.","cite":"대법원 2006도2556 · 형사소송법 제310조의2","badge":"","topic":"","from":"GY-2023-2-X-37","seq":null},{"id":"X-OX-725","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이나 변호인이 무죄에 관한 자료로 제출한 서증 가운데 도리어 유죄임을 뒷받침하는 내용이 있다고 하여도, 법원은 그 서류의 진정성립 여부 등을 조사하고 아울러 그 서류에 대한 피고인이나 변호인의 의견과 변명의 기회를 주지 않았다면 상대방의 원용(동의)이 있더라도 그 서증을 유죄인정의 증거로 쓸 수 없다. (24.1차)","answer":false,"quote":"피고인 측 서증을 유죄 증거로 쓰려면 진정성립 조사와 의견·변명 기회가 필요하지만, 상대방이 원용(동의)하면 그대로 쓸 수 있다.","cite":"대법원 2013도12155","badge":"","topic":"","from":"GY-2024-1-X-39","seq":null},{"id":"X-OX-581","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"압수 수색영장을 집행함에 있어 ‘급속을 요하는 때’에는 집행의 일시와 장소를 피의자 등에게 통지하지 않아도 되는데, 여기서 ‘급속을 요하는 때’라고 함은 압수 수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수 수색의 실효를 거두기 어려울 경우를 의미한다. (22.1차)","answer":true,"quote":"여기서 ‘급속을 요하는 때’라고 함은 압수·수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수·수색의 실효를 거두기 어려울 경우라고 해석함이 옳고, 그와 같이 합리적인 해석이 가능하므로 형사소송법 제122조 단서가 명확성의 원칙 등에 반하여 위헌이라고 볼 수 없다.","cite":"대법원 2012도7455","badge":"","topic":"","from":"GY-2022-1-X-29","seq":null},{"id":"X-OX-700","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢경범죄 처벌법｣ 제3조 제1항 제34호의 지문채취 불응 시 처벌규정은 영장주의에 따른 강제처분을 규정한 것으로, 수사상 필요에 의하여 수사기관이 직접강제에 의하여 지문을 채취하려 하는 경우와 마찬가지로 법관에 의해 발부된 영장이 필요하다. (23.1차)","answer":false,"quote":"지문채취 불응 처벌은 벌칙으로 간접 강제할 뿐 물리력으로 직접 채취하는 것이 아니어서 영장주의에 어긋나지 않는다.","cite":"헌재 2002헌가17 · 경범죄처벌법 제3조","badge":"","topic":"","from":"GY-2023-1-X-29","seq":null},{"id":"X-OX-743","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 ｢형사소송법｣ 제310조의 피고인의 자백에는 포함 되지 아니하므로 이는 피고인의 자백의 보강증거로 될 수 있다. (25.1차)","answer":false,"quote":"피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 형사소송법 제310조 의 피고인의 자백에는 포함되지 아니하나 이는 피고인의 자백의 보강증거로 될 수 없다.","cite":"대법원 2007도10937","badge":"","topic":"","from":"GY-2025-1-X-39","seq":null},{"id":"X-OX-584","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"간접증거만으로 유죄를 인정하는 경우에는 여러 간접사실로 보아 피고인이 범행한 것으로 보기에 충분할 만큼 압도적 으로 우월한 증명이 있어야 한다. (22.1차)","answer":true,"quote":"그러므로 유죄의 인정은 범행 동기, 범행수단의 선택, 범행에 이르는 과정, 범행 전후 피고인의 태도 등 여러 간접사실로 보아 피고인이 범행한 것으로 보기에 충분할 만큼 압도적으로 우월한 증명이 있어야 한다.","cite":"대법원 2022도2236","badge":"","topic":"","from":"GY-2022-1-X-34","seq":null},{"id":"X-OX-691","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인의 변호인이 증거 부동의 의견을 밝힌 고발장을 첨부 문서로 포함하고 있는 검찰주사보 작성의 수사보고가 수사 기관이 첨부한 자료를 통하여 얻은 인식 판단 추론이거나 자료의 단순한 요약에 불과하더라도, 피고인이 증거에 동의하여 증거조사가 행하여졌다면 그 수사보고에 대한 증거동의의 효력은 첨부된 고발장에도 당연히 미친다고 볼 것이므로 이를 유죄의 증거로 삼을 수 있다. (22.1차)","answer":false,"quote":"검찰관이 공판기일에 제출한 증거 중 뇌물공여자 甲이 작성한 고발장에 대하여 피고인의 변호인이 증거 부동의 의견을 밝히고, 같은 고발장을 첨부문서로 포함하고 있는 검찰주사보 작성의 수사보고에 대하여는 증거에 동의하여 증거조사가 행하여졌는데, 원심법원이 수사보고에 대한 증거동의의 효력이 첨부된 고발장에도 당연히 미친다고 보아 이를 유죄의 증거로 삼은 사안에서, 수사기관이 수사과정에서 수집한 자료를 기록에 현출시키는 방법으로 자료의 의미, 성격, 혐의사실과의 관련성 등을 수사보고의 형태로 요약·설명하고 해당 자료를 수사보고에 첨부하는 경우, 수사보고에 기재된 내용은 수사기관이 첨부한 자료를 통하여 얻은 인식·판단·추론이거나 자료의 단순한 요약에 불과하여 원 자료로부터 독립하여 공소사실에 대한 증명력을 가질 수 없고, 피고인이나 변호인도 수사보고의 증명력을 위와 같은 취지로 이해하여 공소사실을 부인하면서도 수사보고의 증거능력을 다투지 않은 것으로 보이는 등의 제반 사정에 비추어, 위 고발장은 군사법원법에 따른 적법한 증거신청·증거결정·증거조사 절차를 거쳤다고 볼 수 없거나 공소사실을 뒷받침하는 증명력을 가진 증거가 아니므로 이를 유죄의 증거로 삼을 수 없다고 한 사례.","cite":"대법원 2011도3809","badge":"","topic":"","from":"GY-2022-1-X-39","seq":null},{"id":"X-OX-723","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 압수·수색영장을 집행함에 있어 그 처분을 받는 자가 여러 명일 경우, 그 장소의 관리책임자에게 영장을 제시하였다면, 그곳에서 물건을 소지하고 있는 다른 사람에게 따로 영장을 제시하지 않고 그 물건을 압수할 수 있다. (24.1차)","answer":false,"quote":"영장은 처분을 받는 사람마다 따로 제시해야 하므로, 관리책임자에게 보였더라도 물건을 가진 다른 사람에게 다시 제시해야 한다.","cite":"대법원 2008도763","badge":"","topic":"","from":"GY-2024-1-X-32","seq":null},{"id":"X-OX-655","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"개개의 증거에 대하여 개별적인 증거조사방식을 거치지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 이루어진 것이라 하여도 증거동의로서의 효력을 부정할 이유가 되지 못한다. (25.1차)","answer":true,"quote":"개개의 증거에 대하여 개별적인 증거조사방식을 거치지 아니하고 검사가 제시한 모든 증거에 대하여 피고인이 증거로 함에 동의한다는 방식으로 이루어진 것이라 하여도 증거동의로서의 효력을 부정할 이유가 되지 못한다.","cite":"대법원 82도2873","badge":"","topic":"","from":"GY-2025-1-X-36","seq":null},{"id":"X-OX-606","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니하여 ｢형사소송법｣ 제244조의4 제3항, 제1항에서 정한 절차를 위반한 경우에는, 특별한 사정이 없는 한 ‘적법한 절차와 방식’에 따라 수사과정에서 진술서가 작성되었다 할 수 없으므로 증거능력을 인정할 수 없다. (23.1차)","answer":true,"quote":"형사소송법 제221조 제1항 , 제244조의4 제1항 , 제3항 , 제312조 제4항 , 제5항 및 그 입법 목적 등을 종합하여 보면, 피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니하여 형사소송법 제244조의4 제3항 , 제1항 에서 정한 절차를 위반한 경우에는, 특별한 사정이 없는 한 ‘적법한 절차와 방식’에 따라 수사과정에서 진술서가 작성되었다 할 수 없으므로 증거능력을 인정할 수 없다.","cite":"대법원 2013도3790","badge":"","topic":"","from":"GY-2023-1-X-37","seq":null},{"id":"X-OX-754","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형법｣ 제52조 제1항에서 말하는 ‘자수’에는 수사기관의 직무상의 질문 또는 조사에 응하여 범죄사실을 진술하는 것도 해당한다. (26.1차)","answer":false,"quote":"형법 제52조 제1항 에서 말하는 ‘자수’란 범인이 스스로 수사책임이 있는 관서에 자기의 범행을 자발적으로 신고하고 그 처분을 구하는 의사표시이므로, 수사기관의 직무상의 질문 또는 조사에 응하여 범죄사실을 진술하는 것은 자백일 뿐 자수로는 되지 아니하고, 나아가 자수는 범인이 수사기관에 의사표시를 함으로써 성립하는 것이므로 내심적 의사만으로는 부족하고 외부로 표시되어야 이를 인정할 수 있는 것이다.","cite":"대법원 2011도12041","badge":"","topic":"","from":"GY-2026-1-X-13","seq":null},{"id":"X-OX-592","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"유추해석은 피고인에게 유리한 경우에는 가능한 것이나, 문리를 넘어서는 이러한 해석은 그렇게 해석하지 아니하면 그 결과가 현저히 형평과 정의에 반하거나 심각한 불합리가 초래되는 경우에 한하여 가능하다. (22.2차)","answer":true,"quote":"피고인에게 유리한 유추도 문언을 넘으면 현저히 형평·정의에 반하거나 심각한 불합리가 생기는 경우에만 허용된다.","cite":"대법원 2004도4049","badge":"","topic":"","from":"GY-2022-2-X-01","seq":null},{"id":"X-OX-641","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사 또는 사법경찰관은 피의자를 신문하기 전에 진술을 하지 아니할 수 있다는 것, 진술을 거부할 권리를 포기하고 행한 진술은 법정에서 유죄의 증거로 사용될 수 있다는 것, 신문을 받을 때에는 변호인을 참여하게 하는 등 변호인의 조력을 받을 수 있다는 것을 고지하여야 한다. (24.2차)","answer":true,"quote":"① 검사 또는 사법경찰관은 피의자를 신문하기 전에 다음 각 호의 사항을 알려주어야 한다. 1. 일체의 진술을 하지 아니하거나 개개의 질문에 대하여 진술을 하지 아니할 수 있다는 것 2. 진술을 하지 아니하더라도 불이익을 받지 아니한다는 것 3. 진술을 거부할 권리를 포기하고 행한 진술은 법정에서 유죄의 증거로 사용될 수 있다는 것 4. 신문을 받을 때에는 변호인을 참여하게 하는 등 변호인의 조력을 받을 수 있다는 것","cite":"형사소송법 제244조의3 제1항","badge":"","topic":"","from":"GY-2024-2-X-29","seq":null},{"id":"X-OX-688","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"임의성이 인정되지 아니하여 증거능력이 없는 진술증거는 피고인이 증거로 함에 동의하더라도 증거로 삼을 수 없으나, 임의성이 의심되는 자백은 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로는 사용할 수 있다. (22.1차)","answer":false,"quote":"기록상 진술증거의 임의성에 관하여 의심할 만한 사정이 나타나 있는 경우에는 법원은 직권으로 그 임의성 여부에 관하여 조사를 하여야 하고, 임의성이 인정되지 아니하여 증거능력이 없는 진술증거는 피고인이 증거로 함에 동의하더라도 증거로 삼을 수 없다.","cite":"대법원 2004도7900","badge":"","topic":"","from":"GY-2022-1-X-36","seq":null},{"id":"X-OX-679","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"경찰이 피의자의 집에서 20m 떨어진 곳에서 피의자를 체포한 후 피의자의 집안을 수색하여 칼과 합의서를 압수하고도 적법한 시간 내에 압수‧수색영장을 청구하여 발부받지 않은 경우, 위 칼과 합의서는 위법하게 압수된 것으로서 증거능력이 없고 이를 기초로 한 2차 증거인 ‘임의제출동의서’, ‘압수조서 및 목록’, ‘압수품 사진’ 역시 증거능력이 없다. (26.1차)","answer":true,"quote":"경찰이 피고인의 집에서 20m 떨어진 곳에서 피고인을 체포한 후 피고인의 집안을 수색하여 칼과 합의서를 압수하였을 뿐만 아니라 적법한 시간 내에 압수수색영장을 청구하여 발부받지도 않은 사안에서, 위 칼과 합의서는 위법하게 압수된 것으로서 증거능력이 없고, 이를 기초로 한 2차 증거인 ‘임의제출동의서’, ‘압수조서 및 목록’, ‘압수품 사진’ 역시 증거능력이 없다고 하며, 같은 취지의 원심판단을 수긍한 사례","cite":"대법원 2009도14376","badge":"","topic":"","from":"GY-2026-1-X-36","seq":null},{"id":"P-OX-015","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"사단법인 C학회가 주관 및 개최한 토론회에 참석하여 자신의 직무와 관련된 토론을 한 丙경감이 상한액을 초과하는 사례금을 받은 경우 초과사례금을 받은 사실을 안 날부터 2일 이내에 동법 시행령이 정한 사항을 적은 서면으로 소속기관장에게 신고 하여야 한다. (23.2차)","answer":true,"quote":"상한액을 넘는 사례금을 받으면 안 날부터 2일 안에 서면으로 소속기관장에게 신고하고, 초과금액은 지체 없이 돌려준다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제27조","badge":"","topic":"","from":"GY-2023-2-P-07","seq":null},{"id":"P-OX-025","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"언론등에 의하여 범죄혐의가 있거나 형사상의 조치를 받았다고 보도 또는 공표된 자는 그에 대한 형사절차가 무죄판결 또는 이와 동등한 형태로 종결되었을 때에는 그 사실을 안 날부터 3개월 이내에 언론사등에 이 사실에 관한 추후보도의 게재를 청구할 수 있다. (24.2차)","answer":true,"quote":"① 언론등에 의하여 범죄혐의가 있거나 형사상의 조치를 받았다고 보도 또는 공표된 자는 그에 대한 형사절차가 무죄판결 또는 이와 동등한 형태로 종결되었을 때에는 그 사실을 안 날부터 3개월 이내에 언론사등에 이 사실에 관한 추후보도의 게재를 청구할 수 있다.","cite":"언론중재 및 피해구제 등에 관한 법률 제17조 제1항","badge":"","topic":"","from":"GY-2024-2-P-34","seq":null},{"id":"P-OX-029","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"헌법상 공무원의 신분과 정치적 중립성은 법률이 정하는 바에 의하여 보장된다. (25.1차)","answer":true,"quote":"② 공무원의 신분과 정치적 중립성은 법률이 정하는 바에 의하여 보장된다.","cite":"헌법 제7조 제2항","badge":"","topic":"","from":"GY-2025-1-P-03","seq":null},{"id":"P-OX-008","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"지방자치단체장이 사업자에게 주택사업계획승인을 하면서 그 주택사업과는 아무런 관련이 없는 토지를 기부채납하도록 하는 부관을 주택사업계획승인에 붙인 경우, 그 부관은 부당 결부금지 원칙에 위반되어 위법하다. (22.2차)","answer":true,"quote":"지방자치단체장이 사업자에게 주택사업계획승인을 하면서 그 주택사업과는 아무런 관련이 없는 토지를 기부채납하도록 하는 부관을 주택사업계획승인에 붙인 경우, 그 부관은 부당결부금지의 원칙에 위반되어 위법하지만, 지방자치단체장이 승인한 사업자의 주택사업계획은 상당히 큰 규모의 사업임에 반하여, 사업자가 기부채납한 토지 가액은 그 100분의 1 상당의 금액에 불과한 데다가, 사업자가 그 동안 그 부관에 대하여 아무런 이의를 제기하지 아니하다가 지방자치단체장이 업무착오로 기부채납한 토지에 대하여 보상협조요청서를 보내자 그 때서야 비로소 부관의 하자를 들고 나온 사정에 비추어 볼 때 부관의 하자가 중대하고 명백하여 당연무효라고는 볼 수 없다고 한 사례.","cite":"대법원 96다49650","badge":"","topic":"","from":"GY-2022-2-P-12","seq":null},{"id":"P-OX-016","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"행정청은 행정작용을 할 때 상대방에게 해당 행정작용과 실질적인 관련이 없는 의무를 부과해서는 아니 된다는 원칙이다. (23.2차)","answer":true,"quote":"행정청은 행정작용을 할 때 상대방에게 해당 행정작용과 실질적인 관련이 없는 의무를 부과해서는 아니 된다.","cite":"행정기본법 제13조","badge":"","topic":"","from":"GY-2023-2-P-14","seq":null},{"id":"P-OX-048","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"행정청은 의무자가 행정상 의무를 이행할 때까지 이행강제금을 반복하여 부과할 수 있으나, 의무자가 의무를 이행하면 이미 부과한 이행강제금을 징수하여서는 안 된다. (24.1차)","answer":false,"quote":"⑤ 행정청은 의무자가 행정상 의무를 이행할 때까지 이행강제금을 반복하여 부과할 수 있다. 다만, 의무자가 의무를 이행하면 새로운 이행강제금의 부과를 즉시 중지하되, 이미 부과한 이행강제금은 징수하여야 한다.","cite":"행정기본법 제31조 제5항","badge":"","topic":"","from":"GY-2024-1-P-20","seq":null},{"id":"P-OX-005","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"국가는 범죄피해자가 요청하면 가해자에 대한 수사 결과, 공판기일, 재판 결과, 형 집행 및 보호관찰 집행 상황 등 형사 절차 관련 정보를 대통령령으로 정하는 바에 따라 제공할 수 있다. (22.1차)","answer":true,"quote":"(1) 국가는 범죄피해자가 해당 사건과 관련하여 수사담당자와 상담하거나 재판절차에 참여하여 진술하는 등 형사절차상의 권리를 행사할 수 있도록 보장하여야 한다. (2) 국가는 범죄피해자가 요청하면 가해자에 대한 수사 결과, 공판기일, 재판 결과, 형 집행 및 보호관찰 집행 상황 등 형사절차 관련 정보를 대통령령으로 정하는 바에 따라 제공할 수 있다.","cite":"범죄피해자 보호법 제8조","badge":"","topic":"","from":"GY-2022-1-P-22","seq":null},{"id":"P-OX-028","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"피해자가 있는 범칙행위를 한 사람은 범칙자에 해당하지 아니한다. (24.2차)","answer":true,"quote":"피해자가 있는 행위를 한 사람은 상습자·18세 미만자 등과 함께 범칙자에서 빠져 통고처분 대상이 아니다.","cite":"경범죄처벌법 제6조","badge":"","topic":"","from":"GY-2024-2-P-35","seq":null},{"id":"P-OX-017","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"수임 및 수탁사무의 처리가 부당한지 여부의 판단은 위법성 판단과 달리 합목적적･정책적 고려도 포함되므로, 위임 및 위탁기관이 그 사무처리에 관하여 일반적인 지휘･감독을 하는 경우는 물론이고 나아가 수임 및 수탁사무의 처리가 부당하다는 이유로 그 사무처리를 취소하는 경우에도 광범위한 재량이 허용된다고 보아야 한다. (23.2차)","answer":true,"quote":"수임 및 수탁사무의 처리가 부당한지 여부의 판단은 위법성 판단과 달리 합목적적·정책적 고려도 포함되므로, 위임 및 위탁기관이 그 사무처리에 관하여 일반적인 지휘·감독을 하는 경우는 물론이고 나아가 수임 및 수탁사무의 처리가 부당하다는 이유로 그 사무처리를 취소하는 경우에도 광범위한 재량이 허용된다고 보아야 한다.","cite":"대법원 2016두55629","badge":"","topic":"","from":"GY-2023-2-P-16","seq":null},{"id":"P-OX-031","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"인도조약이 체결되어 있지 아니한 경우에도 범죄인의 인도를 청구하는 국가가 같은 종류 또는 유사한 인도범죄에 대한 대한민국의 범죄인 인도청구에 응한다는 보증을 하는 경우에는 이 법을 적용한다. (25.2차)","answer":true,"quote":"인도조약이 체결되어 있지 아니한 경우에도 범죄인의 인도를 청구하는 국가가 같은 종류 또는 유사한 인도범죄에 대한 대한민국의 범죄인 인도청구에 응한다는 보증을 하는 경우에는 이 법을 적용한다. [전문개정 2010.3.31]","cite":"범죄인 인도법 제4조","badge":"","topic":"","from":"GY-2025-2-P-40","seq":null},{"id":"P-OX-055","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"지방자치단체의 장은 법령의 범위에서 그 사무에 관하여 조례를 제정할 수 있다. 다만, 주민의 권리 제한 또는 의무 부과에 관한 사항이나 벌칙을 정하는 때에는 법률의 위임이 있어야 한다. (25.2차)","answer":false,"quote":"조례를 제정하는 주체는 지방자치단체이고, 지방자치단체의 장은 법령·조례의 범위에서 규칙을 제정한다.","cite":"지방자치법 제28조 · 지방자치법 제29조","badge":"","topic":"","from":"GY-2025-2-P-15","seq":null},{"id":"P-OX-003","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"기획재정부장관은 각 중앙관서의 장에게 예산을 배정한 때에는 감사원에 통지하여야 한다. (22.1차)","answer":true,"quote":"(1) 기획재정부장관은 제42조의 규정에 따른 예산배정요구서에 따라 분기별 예산배정계획을 작성하여 국무회의의 심의를 거친 후 대통령의 승인을 얻어야 한다. <개정 2008.2.29> (2) 기획재정부장관은 각 중앙관서의 장에게 예산을 배정한 때에는 감사원에 통지하여야 한다. <개정 2008.2.29> (3) 기획재정부장관은 필요한 때에는 대통령령이 정하는 바에 따라 회계연도 개시 전에 예산을 배정할 수 있다. <개정 2008.2.29> (4) 기획재정부장관은 예산의 효율적인 집행관리를 위하여 필요한 때에는 제1항의 규정에 따른 분기별 예산배정계획에 불구하고 개별사업계획을 검토하여 그 결과에 따라 예산을 배정할 수 있다. <개정 2008.2.29> (5) 기획재정부장관은 재정수지의 적정한 관리 및 예산사업의 효율적인 집행관리 등을 위하여 필요한 때에는 제1항의 규정에 따른 분기별 예산배정계획을 조정하거나 예산배정을 유보할 수 있으며, 배정된 예산의 집행을 보류하도록 조치를 취할 수 있다. <개정 2008.2.29>","cite":"국가재정법 제43조","badge":"","topic":"","from":"GY-2022-1-P-18","seq":null},{"id":"P-OX-018","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"준예산은 새로운 회계연도가 개시될 때까지 국회에서 예산안이 의결되지 못한 경우 예산안이 의결될 때까지 전년도 예산에 준하여 지출하는 예산이다. (23.2차)","answer":true,"quote":"③ 새로운 회계연도가 개시될 때까지 예산안이 의결되지 못한 때에는 정부는 국회에서 예산안이 의결될 때까지 다음의 목적을 위한 경비는 전년도 예산에 준하여 집행할 수 있다. 1. 헌법이나 법률에 의하여 설치된 기관 또는 시설의 유지·운영 2. 법률상 지출의무의 이행 3. 이미 예산으로 승인된 사업의 계속","cite":"헌법 제54조 제3항","badge":"","topic":"","from":"GY-2023-2-P-30","seq":null},{"id":"P-OX-036","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"경찰행정작용으로 인한 국민의 이익 침해가 그 행정작용이 의도하는 공익보다 크지 아니하여야 한다. (26.1차)","answer":true,"quote":"행정작용은 다음 각 호의 원칙에 따라야 한다. 1. 행정목적을 달성하는 데 유효하고 적절할 것 2. 행정목적을 달성하는 데 필요한 최소한도에 그칠 것 3. 행정작용으로 인한 국민의 이익 침해가 그 행정작용이 의도하는 공익보다 크지 아니할 것","cite":"행정기본법 제10조","badge":"","topic":"","from":"GY-2026-1-P-19","seq":null},{"id":"P-OX-051","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"｢법령 등 공포에 관한 법률｣상 법률, 대통령령, 총리령 및 부령은 특별한 규정이 없으면 공포한 날부터 20일이 경과함으로써 효력을 발생한다. (24.2차)","answer":false,"quote":"이 법이 공포 후 20일 경과로 효력이 생긴다고 정한 것은 대통령령·총리령·부령이고, 법률의 20일은 헌법이 정한다.","cite":"헌법 제53조","badge":"","topic":"","from":"GY-2024-2-P-17","seq":null},{"id":"P-OX-004","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"국가는 범죄피해자가 해당 사건과 관련하여 수사담당자와 상담하거나 재판절차에 참여하여 진술하는 등 형사절차상의 권리를 행사할 수 있도록 보장하여야 한다. (22.1차)","answer":true,"quote":"(1) 국가는 범죄피해자가 해당 사건과 관련하여 수사담당자와 상담하거나 재판절차에 참여하여 진술하는 등 형사절차상의 권리를 행사할 수 있도록 보장하여야 한다. (2) 국가는 범죄피해자가 요청하면 가해자에 대한 수사 결과, 공판기일, 재판 결과, 형 집행 및 보호관찰 집행 상황 등 형사절차 관련 정보를 대통령령으로 정하는 바에 따라 제공할 수 있다.","cite":"범죄피해자 보호법 제8조","badge":"","topic":"","from":"GY-2022-1-P-22","seq":null},{"id":"P-OX-022","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"기획재정부장관은 국무회의의 심의를 거쳐 대통령의 승인을 얻은 다음 연도의 예산안편성지침을 매년 3월 31일까지 경찰청장에게 통보하여야 한다. (24.1차)","answer":true,"quote":"(1) 기획재정부장관은 국무회의의 심의를 거쳐 대통령의 승인을 얻은 다음 연도의 예산안편성지침을 매년 3월 31일까지 각 중앙관서의 장에게 통보하여야 한다. <개정 2008.2.29> (2) 기획재정부장관은 제7조의 규정에 따른 국가재정운용계획과 예산편성을 연계하기 위하여 제1항의 규정에 따른 예산안편성지침에 중앙관서별 지출한도를 포함하여 통보할 수 있다. <개정 2008.2.29>","cite":"국가재정법 제29조","badge":"","topic":"","from":"GY-2024-1-P-30","seq":null},{"id":"P-OX-052","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"언론사등이 정정보도청구를 수용할 때에는 지체없이 피해자 또는 그 대리인과 정정보도의 내용･크기 등에 관하여 협의한 후, 그 협의가 있은 날부터 7일 내에 정정보도문을 방송하거나 게재 하여야 한다. 다만, 신문 및 잡지 등 정기간행물의 경우 이미 편집 및 제작이 완료되어 부득이할 때에는 게재하지 않을 수 있다. (24.2차)","answer":false,"quote":"① 정정보도 청구는 언론사등의 대표자에게 서면으로 하여야 하며, 청구서에는 피해자의 성명·주소·전화번호 등의 연락처를 적고, 정정의 대상인 언론보도등의 내용 및 정정을 청구하는 이유와 청구하는 정정보도문을 명시하여야 한다. 다만, 인터넷신문 및 인터넷뉴스서비스의 언론보도등의 내용이 해당 인터넷 홈페이지를 통하여 계속 보도 중이거나 매개 중인 경우에는 그 내용의 정정을 함께 청구할 수 있다. ② 제1항의 청구를 받은 언론사등의 대표자는 3일 이내에 그 수용 여부에 대한 통지를 청구인에게 발송하여야 한다. 이 경우 정정의 대상인 언론보도등의 내용이 방송이나 인터넷신문, 인터넷뉴스서비스 및 인터넷 멀티미디어 방송의 보도과정에서 성립한 경우에는 해당 언론사등이 그러한 사실이 없었음을 입증하지 아니하면 그 사실의 존재를 부인하지 못한다. ③ 언론사등이 제1항의 청구를 수용할 때에는 지체 없이 피해자 또는 그 대리인과 정정보도의 내용·크기 등에 관하여 협의한 후, 그 청구를 받은 날부터 7일 내에 정정보도문을 방송하거나 게재(인터넷신문 및 인터넷뉴스서비스의 경우 제1항 단서에 따른 해당 언론보도등 내용의 정정을 포함한다)하여야 한다. 다만, 신문 및 잡지 등 정기간행물의 경우 이미 편집 및 제작이 완료되어 부득이할 때에는 다음 발행 호에 이를 게재하여야 한다. ④ 다음 각 호의 어느 하나에 해당하는 사유가 있는 경우에는 언론사등은 정정보도 청구를 거부할 수 있다.","cite":"언론중재 및 피해구제 등에 관한 법률 제15조 제1항","badge":"","topic":"","from":"GY-2024-2-P-34","seq":null},{"id":"P-OX-021","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"감사원은 제출된 국가결산보고서를 검사하고 그 보고서를 다음 연도 5월 20일까지 기획재정부장관에게 송부하여야 한다. (24.1차)","answer":true,"quote":"감사원은 제59조에 따라 제출된 국가결산보고서를 검사하고 그 보고서를 다음 연도 5월 20일까지 기획재정부장관에게 송부하여야 한다. <개정 2008.2.29, 2008.12.31>","cite":"국가재정법 제60조","badge":"","topic":"","from":"GY-2024-1-P-30","seq":null},{"id":"P-OX-010","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"위법한 경찰하명으로 인하여 권리･이익이 침해된 자는 행정쟁송 또는 손해배상을 청구할 수 있다. (23.1차)","answer":true,"quote":"위법한 하명으로 권익을 침해받은 자는 행정심판·취소소송으로 다투고, 공무원의 고의·과실이 있으면 국가배상도 청구할 수 있다.","cite":"행정소송법 제4조 · 국가배상법 제2조","badge":"","topic":"","from":"GY-2023-1-P-20","seq":null},{"id":"P-OX-012","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"각 중앙관서의 장은 예산이 확정된 후 사업운영계획 및 이에 따른 세입세출예산･계속비와 국고채무부담행위를 포함한 예산 배정요구서를 기획재정부장관에게 제출하여야 한다. (23.1차)","answer":true,"quote":"각 중앙관서의 장은 예산이 확정된 후 사업운영계획 및 이에 따른 세입세출예산·계속비와 국고채무부담행위를 포함한 예산배정요구서를 기획재정부장관에게 제출하여야 한다. <개정 2008.2.29>","cite":"국가재정법 제42조","badge":"","topic":"","from":"GY-2023-1-P-31","seq":null},{"id":"P-OX-019","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"공직자등은 부정청탁을 받았을 때에는 부정청탁을 한 자에게 부정청탁임을 알리고 이를 거절하는 의사를 명확히 표시하여야 한다. 그럼에도 불구하고 동일한 부정청탁을 다시 받은 경우에는 이를 소속기관장에게 서면(전자문서를 포함한다)으로 신고하여야 한다. (24.1차)","answer":true,"quote":"① 공직자등은 부정청탁을 받았을 때에는 부정청탁을 한 자에게 부정청탁임을 알리고 이를 거절하는 의사를 명확히 표시하여야 한다. ② 공직자등은 제1항에 따른 조치를 하였음에도 불구하고 동일한 부정청탁을 다시 받은 경우에는 이를 소속기관장에게 서면(전자문서를 포함한다. 이하 같다)으로 신고하여야 한다. ③ 제2항에 따른 신고를 받은 소속기관장은 신고의 경위·취지·내용·증거자료 등을 조사하여 신고 내용이 부정청탁에 해당하는지를 신속하게 확인하여야 한다. ④ 소속기관장은 부정청탁이 있었던 사실을 알게 된 경우 또는 제2항 및 제3항의 부정청탁에 관한 신고·확인 과정에서 해당 직무의 수행에 지장이 있다고 인정하는 경우에는 부정청탁을 받은 공직자등에 대하여 다음 각 호의 조치를 할 수 있다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제7조 제1항","badge":"","topic":"","from":"GY-2024-1-P-06","seq":null},{"id":"P-OX-007","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"인도범죄에 관하여 대한민국 법원에서 재판이 계속 중이거나 재판이 확정된 경우 (22.1차)","answer":true,"quote":"다음 각 호의 어느 하나에 해당하는 경우에는 범죄인을 인도하여서는 아니 된다. 1. 대한민국 또는 청구국의 법률에 따라 인도범죄에 관한 공소시효 또는 형의 시효가 완성된 경우 2. 인도범죄에 관하여 대한민국 법원에서 재판이 계속(係屬) 중이거나 재판이 확정된 경우 3. 범죄인이 인도범죄를 범하였다고 의심할 만한 상당한 이유가 없는 경우. 다만, 인도범죄에 관하여 청구국에서 유죄의 재판이 있는 경우는 제외한다. 4. 범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우 [전문개정 2010.3.31]","cite":"범죄인 인도법 제7조","badge":"","topic":"","from":"GY-2022-1-P-26","seq":null},{"id":"P-OX-001","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"헌법상 대통령은 내란 또는 외환의 죄를 범한 경우를 제외하고는 재직중 형사상의 소추를 받지 아니한다. (22.1차)","answer":true,"quote":"대통령은 내란 또는 외환의 죄를 범한 경우를 제외하고는 재직중 형사상의 소추를 받지 아니한다.","cite":"헌법 제84조","badge":"","topic":"","from":"GY-2022-1-P-02","seq":null},{"id":"P-OX-049","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"경찰청장은 매년 1월 31일까지 해당 회계연도부터 5회계연도 이상의 기간 동안의 신규사업 및 경찰청장이 정하는 주요 계속사업에 대한 중기사업계획서를 기획재정부장관에게 제출 하여야 한다. (24.1차)","answer":false,"quote":"각 중앙관서의 장은 매년 1월 31일까지 당해 회계연도부터 5회계연도 이상의 기간 동안의 신규사업 및 기획재정부장관이 정하는 주요 계속사업에 대한 중기사업계획서를 기획재정부장관에게 제출하여야 한다. <개정 2008.2.29>","cite":"국가재정법 제28조","badge":"","topic":"","from":"GY-2024-1-P-30","seq":null},{"id":"P-OX-039","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"인도범죄의 성격과 범죄인이 처한 환경 등에 비추어 범죄인을 인도하는 것이 비인도적이라고 인정되는 경우 (22.1차)","answer":false,"quote":"다음 각 호의 어느 하나에 해당하는 경우에는 범죄인을 인도하지 아니할 수 있다. 1. 범죄인이 대한민국 국민인 경우 2. 인도범죄의 전부 또는 일부가 대한민국 영역에서 범한 것인 경우 3. 범죄인의 인도범죄 외의 범죄에 관하여 대한민국 법원에 재판이 계속 중인 경우 또는 범죄인이 형을 선고받고 그 집행이 끝나지 아니하거나 면제되지 아니한 경우 4. 범죄인이 인도범죄에 관하여 제3국(청구국이 아닌 외국을 말한다. 이하 같다)에서 재판을 받고 처벌되었거나 처벌받지 아니하기로 확정된 경우 5. 인도범죄의 성격과 범죄인이 처한 환경 등에 비추어 범죄인을 인도하는 것이 비인도적(非人道的)이라고 인정되는 경우 [전문개정 2010.3.31]","cite":"범죄인 인도법 제9조","badge":"","topic":"","from":"GY-2022-1-P-26","seq":null},{"id":"P-OX-034","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"직무수행 중 알게 된 비밀 또는 소속 공공기관의 미공개정보를 사적 이익을 위하여 이용하거나 제3자로 하여금 이용하도록 한 공직자는 3년 이하의 징역 또는 3천만 원 이하의 벌금에 처한다. (26.1차)","answer":true,"quote":"비밀·미공개정보를 사적으로 이용하게만 해도 3년 이하 징역·3천만 원 이하 벌금이고, 재산상 이익을 얻으면 7년·7천만 원으로 무거워진다.","cite":"공직자의 이해충돌 방지법 제27조","badge":"","topic":"","from":"GY-2026-1-P-07","seq":null},{"id":"P-OX-060","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"소속기관장은 공직자등 또는 그 배우자가 수수 금지 금품등을 받거나 그 제공의 약속 또는 의사표시를 받은 사실을 알게 된 경우 수사의 필요성이 있다고 인정하는 때에는 그 내용을 수사기관에 통보할 수 있다. (26.1차)","answer":false,"quote":"3. 그 밖에 제공자에게 반환하기 어려운 사정이 있는 경우 ③ 소속기관장은 제1항에 따라 신고를 받거나 제2항 단서에 따라 금품등을 인도받은 경우 수수 금지 금품등에 해당한다고 인정하는 때에는 반환 또는 인도하게 하거나 거부의 의사를 표시하도록 하여야 하며, 수사의 필요성이 있다고 인정하는 때에는 그 내용을 지체 없이 수사기관에 통보하여야 한다. ④ 소속기관장은 공직자등 또는 그 배우자가 수수 금지 금품등을 받거나 그 제공의 약속 또는 의사표시를 받은 사실을 알게 된 경우 수사의 필요성이 있다고 인정하는 때에는 그 내용을 지체 없이 수사기관에 통보하여야 한다. ⑤ 소속기관장은 소속 공직자등 또는 그 배우자가 수수 금지 금품등을 받거나 그 제공의 약속 또는 의사표시를 받은 사실을 알게 된 경우 또는 제1항부터 제4항까지의 규정에 따른 금품등의 신고, 금품등의 반환·인도 또는 수사기관에 대한 통보의 과정에서 직무의 수행에 지장이 있다고 인정하는 경우에는 해당 공직자등에게 제7조제4항 각 호 및 같은 조 제5항의 조치를 할 수 있다. ⑥ 공직자등은 제1항 또는 같은 조 제2항 단서에 따른 신고나 인도를 감독기관·감사원·수사기관 또는 국민권익위원회에도 할 수 있다. ⑦ 소속기관장은 공직자등으로부터 제1항제2호에 따른 신고를 받은 경우 그 공직자등의 배우자가 반환을 거부하는 금품등이 수수 금지 금품등에 해당한다고 인정하는 때에는 그 공직자등의 배우자로 하여금 그 금품등을 제공자에게 반환하도록 요구하여야 한다. ⑧ 제1항부터 제7항까지에서 규정한 사항 외에 수수 금지 금품등의 신고 및 처리 등에 필요한 사항은 대통령령으로 정한다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제9조","badge":"","topic":"","from":"GY-2026-1-P-06","seq":null},{"id":"P-OX-046","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"공직자등은 외부기관(국가 및 지방자치단체를 포함한다)의 요청 으로 사례금을 받는 외부강의등을 할 때에는 소속기관장에게 그 외부강의등을 마친 날부터 10일 이내에 서면으로 신고하여야 한다. (24.1차)","answer":false,"quote":"② 공직자등은 사례금을 받는 외부강의등을 할 때에는 대통령령으로 정하는 바에 따라 외부강의등의 요청 명세 등을 소속기관장에게 그 외부강의등을 마친 날부터 10일 이내에 서면으로 신고하여야 한다. 다만, 외부강의등을 요청한 자가 국가나 지방자치단체인 경우에는 그러하지 아니하다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제10조 제2항","badge":"","topic":"","from":"GY-2024-1-P-06","seq":null},{"id":"P-OX-006","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"대한민국 또는 청구국의 법률에 따라 인도범죄에 관한 공소시효 또는 형의 시효가 완성된 경우 (22.1차)","answer":true,"quote":"다음 각 호의 어느 하나에 해당하는 경우에는 범죄인을 인도하여서는 아니 된다. 1. 대한민국 또는 청구국의 법률에 따라 인도범죄에 관한 공소시효 또는 형의 시효가 완성된 경우 2. 인도범죄에 관하여 대한민국 법원에서 재판이 계속(係屬) 중이거나 재판이 확정된 경우 3. 범죄인이 인도범죄를 범하였다고 의심할 만한 상당한 이유가 없는 경우. 다만, 인도범죄에 관하여 청구국에서 유죄의 재판이 있는 경우는 제외한다. 4. 범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우 [전문개정 2010.3.31]","cite":"범죄인 인도법 제7조","badge":"","topic":"","from":"GY-2022-1-P-26","seq":null},{"id":"P-OX-045","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"지방자치단체장이 사업자에게 주택사업계획승인을 하면서 그 주택사업과는 아무런 관련이 없는 토지를 기부채납하도록 하는 부관을 붙인 경우에는, 기부채납한 토지 가액이 그 주택사업 계획의 100분의 1 상당의 금액에 불과하고 사업자가 이의를 제기하지 아니하다가 지방자치단체장이 업무착오로 기부채납한 토지에 대하여 보상협조요청서를 보내자 그 때서야 비로소 부관의 하자를 들고 나왔다고 하더라도 그 부관은 당연무효이다. (23.2차)","answer":false,"quote":"지방자치단체장이 사업자에게 주택사업계획승인을 하면서 그 주택사업과는 아무런 관련이 없는 토지를 기부채납하도록 하는 부관을 주택사업계획승인에 붙인 경우, 그 부관은 부당결부금지의 원칙에 위반되어 위법하지만, 지방자치단체장이 승인한 사업자의 주택사업계획은 상당히 큰 규모의 사업임에 반하여, 사업자가 기부채납한 토지 가액은 그 100분의 1 상당의 금액에 불과한 데다가, 사업자가 그 동안 그 부관에 대하여 아무런 이의를 제기하지 아니하다가 지방자치단체장이 업무착오로 기부채납한 토지에 대하여 보상협조요청서를 보내자 그 때서야 비로소 부관의 하자를 들고 나온 사정에 비추어 볼 때 부관의 하자가 중대하고 명백하여 당연무효라고는 볼 수 없다고 한 사례.","cite":"대법원 96다49650","badge":"","topic":"","from":"GY-2023-2-P-14","seq":null},{"id":"P-OX-054","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"소속기관장은 부정청탁이 있었던 사실을 알게 된 경우 부정청탁을 받은 공직자등에 대하여 직무 참여 일시중지, 직무 대리자의 지정, 전보의 조치 등을 하여야 한다. (25.2차)","answer":false,"quote":"④ 소속기관장은 부정청탁이 있었던 사실을 알게 된 경우 또는 제2항 및 제3항의 부정청탁에 관한 신고·확인 과정에서 해당 직무의 수행에 지장이 있다고 인정하는 경우에는 부정청탁을 받은 공직자등에 대하여 다음 각 호의 조치를 할 수 있다. 1. 직무 참여 일시중지 2. 직무 대리자의 지정 3. 전보 4. 그 밖에 국회규칙, 대법원규칙, 헌법재판소규칙, 중앙선거관리위원회규칙 또는 대통령령으로 정하는 조치","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제7조 제4항","badge":"","topic":"","from":"GY-2025-2-P-09","seq":null},{"id":"P-OX-053","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"인터넷 중고거래 사이트를 통해 비대면으로 웃돈을 받고 유명 가수의 콘서트 티켓을 되판 사람은 이 법상 암표매매로 처벌된다. (24.2차)","answer":false,"quote":"암표매매는 흥행장·경기장·역·정류장 등 현장에서 웃돈을 받고 표를 되판 경우라, 온라인 비대면 되팔기는 해당하지 않는다.","cite":"경범죄처벌법 제3조","badge":"","topic":"","from":"GY-2024-2-P-35","seq":null},{"id":"P-OX-056","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"지방자치단체는 조례를 위반한 행위에 대하여 조례로써 1천만원 이하의 벌금을 정할 수 있고, 해당 지방자치단체의 장이 부과‧ 징수한다. (25.2차)","answer":false,"quote":"조례로 정할 수 있는 것은 1천만원 이하의 과태료이고, 형벌인 벌금은 조례로 정할 수 없다.","cite":"지방자치법 제34조","badge":"","topic":"","from":"GY-2025-2-P-15","seq":null},{"id":"P-OX-020","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"이 법은 공직자의 직무수행과 관련한 사적 이익추구를 금지 함으로써 공직자의 직무수행 중 발생할 수 있는 이해충돌을 방지하여 공정한 직무수행을 보장하고 공공기관에 대한 국민의 신뢰를 확보하는 것을 목적으로 한다. (24.1차)","answer":true,"quote":"이 법은 공직자가 직무로 사익을 챙기는 것을 막아, 직무의 공정성과 공공기관에 대한 국민의 믿음을 지키려는 법이다.","cite":"공직자의 이해충돌 방지법 제1조","badge":"","topic":"","from":"GY-2024-1-P-07","seq":null},{"id":"P-OX-044","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"기획재정부장관은 예산요구서에 따라 예산안을 편성하여 국회 심의를 거친 후 대통령의 승인을 얻어야 한다. (23.1차)","answer":false,"quote":"기획재정부장관은 제31조제1항의 규정에 따른 예산요구서에 따라 예산안을 편성하여 국무회의의 심의를 거친 후 대통령의 승인을 얻어야 한다. <개정 2008.2.29>","cite":"국가재정법 제32조","badge":"","topic":"","from":"GY-2023-1-P-31","seq":null},{"id":"P-OX-030","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"“범죄피해자”란 타인의 범죄행위로 피해를 당한 사람과 그 배우자 (사실상의 혼인관계를 포함한다), 직계친족 및 형제자매를 말한다. (25.2차)","answer":true,"quote":"1. \"범죄피해자\"란 타인의 범죄행위로 피해를 당한 사람과 그 배우자(사실상의 혼인관계를 포함한다), 직계친족 및 형제자매를 말한다.","cite":"범죄피해자 보호법 제3조","badge":"","topic":"","from":"GY-2025-2-P-35","seq":null},{"id":"P-OX-050","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"적합성의 원칙은, 행정조치는 설정된 목적 달성을 위해 필요 최소한의 한도 내에서 이루어져야 한다는 것으로, 협의의 비례 원칙이라고도 한다. (24.2차)","answer":false,"quote":"필요 최소한도에 그치라는 것은 필요성(최소침해)의 원칙이고, 협의의 비례원칙은 상당성이며, 적합성은 수단이 목적 달성에 유효하고 적절할 것을 뜻한다.","cite":"행정기본법 제10조","badge":"","topic":"","from":"GY-2024-2-P-16","seq":null},{"id":"P-OX-009","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"형사사건으로 기소된 자(약식명령이 청구된 자는 제외한다)에게는 직위를 부여하지 아니할 수 있다. (23.1차)","answer":true,"quote":"① 임용권자는 다음 각 호의 어느 하나에 해당하는 자에게는 직위를 부여하지 아니할 수 있다. <개정 2008.3.28., 2010.3.22., 2014.1.7., 2015.5.18.> 1. 삭제 <1973.2.5.> 2. 직무수행 능력이 부족하거나 근무성적이 극히 나쁜 자 3. 파면·해임·강등 또는 정직에 해당하는 징계 의결이 요구 중인 자 4. 형사 사건으로 기소된 자(약식명령이 청구된 자는 제외한다) 5. 고위공무원단에 속하는 일반직공무원으로서 제70조의2제1항제2호부터 제5호까지의 사유로 적격심사를 요구받은 자 6. 금품비위, 성범죄 등 대통령령으로 정하는 비위행위로 인하여 감사원 및 검찰·경찰 등 수사기관에서 조사나 수사 중인 자로서 비위의 정도가 중대하고 이로 인하여 정상적인 업무수행을 기대하기 현저히 어려운 자","cite":"국가공무원법 제73조의3 제1항","badge":"","topic":"","from":"GY-2023-1-P-17","seq":null},{"id":"P-OX-002","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"‘정정보도’란 언론의 보도 내용의 전부 또는 일부가 진실하지 아니한 경우 이를 진실에 부합되게 고쳐서 보도하는 것을 말한다. (22.1차)","answer":true,"quote":"16. \"정정보도\"란 언론의 보도 내용의 전부 또는 일부가 진실하지 아니한 경우 이를 진실에 부합되게 고쳐서 보도하는 것을 말한다.","cite":"언론중재 및 피해구제 등에 관한 법률 제2조","badge":"","topic":"","from":"GY-2022-1-P-07","seq":null},{"id":"P-OX-011","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"과징금은 원칙적으로 행정법상의 의무를 위반한 자에 대하여 당해 위반행위로 얻게 된 경제적 이익을 박탈하기 위한 목적으로 부과하는 금전적인 제재이다. (23.1차)","answer":true,"quote":"과징금은 의무 위반으로 얻은 경제적 이익을 거둬들이는 금전 제재로, 법률로 정한 경우에만 부과할 수 있다.","cite":"행정기본법 제28조","badge":"","topic":"","from":"GY-2023-1-P-22","seq":null},{"id":"P-OX-057","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"헌법재판소의 위헌결정은 신뢰의 대상이 되는 공적인 견해이므로 신뢰보호의 원칙이 적용된다. (25.2차)","answer":false,"quote":"헌법재판소의 위헌결정은 행정청이 개인에게 공적인 견해를 표명한 것이 아니어서, 이에 관련된 개인의 행위에는 신뢰보호원칙이 적용되지 않는다.","cite":"대법원 2002두6965","badge":"","topic":"","from":"GY-2025-2-P-17","seq":null},{"id":"P-OX-042","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"부정청탁 및 금품등 수수의 금지에 관한 법률 에 따르면 OO경찰서 소속 경찰관 甲이 모교에서 자신의 직무와 관련된 강의를 요청받아 1시간 동안 강의를 하고 50만 원의 사례금을 받았다면 대통령령이 정하는 바에 따라 소속기관장에게 신고하고 그 초과금액을 소속기관장에게 지체없이 반환하여야 한다. (22.2차)","answer":false,"quote":"공무원의 외부강의 사례금 상한은 1시간 40만원이고, 초과분은 소속기관장에게 신고한 뒤 제공자에게 돌려줘야 한다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제10조","badge":"","topic":"","from":"GY-2022-2-P-06","seq":null},{"id":"P-OX-040","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"부정청탁 및 금품등 수수의 금지에 관한 법률 상 ‘공직자등’이 부정청탁을 받았을 때에는 부정청탁을 한 자에게 부정청탁임을 알리고 이를 거절하는 의사를 명확히 표시하여야 하며, 이러한 조치를 하였음에도 불구하고 동일한 부정청탁을 다시 받은 경우에는 이를 소속기관장에게 구두 또는 서면(전자서면을 포함)으로 신고하여야 한다. (22.2차)","answer":false,"quote":"① 공직자등은 부정청탁을 받았을 때에는 부정청탁을 한 자에게 부정청탁임을 알리고 이를 거절하는 의사를 명확히 표시하여야 한다. ② 공직자등은 제1항에 따른 조치를 하였음에도 불구하고 동일한 부정청탁을 다시 받은 경우에는 이를 소속기관장에게 서면(전자문서를 포함한다. 이하 같다)으로 신고하여야 한다. ③ 제2항에 따른 신고를 받은 소속기관장은 신고의 경위·취지·내용·증거자료 등을 조사하여 신고 내용이 부정청탁에 해당하는지를 신속하게 확인하여야 한다. ④ 소속기관장은 부정청탁이 있었던 사실을 알게 된 경우 또는 제2항 및 제3항의 부정청탁에 관한 신고·확인 과정에서 해당 직무의 수행에 지장이 있다고 인정하는 경우에는 부정청탁을 받은 공직자등에 대하여 다음 각 호의 조치를 할 수 있다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제7조 제1항","badge":"","topic":"","from":"GY-2022-2-P-06","seq":null},{"id":"P-OX-032","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"인도범죄에 관하여 대한민국 법원에서 재판이 계속 중이거나 재판이 확정된 경우는 범죄인을 인도하여서는 아니 된다. (25.2차)","answer":true,"quote":"다음 각 호의 어느 하나에 해당하는 경우에는 범죄인을 인도하여서는 아니 된다. 1. 대한민국 또는 청구국의 법률에 따라 인도범죄에 관한 공소시효 또는 형의 시효가 완성된 경우 2. 인도범죄에 관하여 대한민국 법원에서 재판이 계속(係屬) 중이거나 재판이 확정된 경우 3. 범죄인이 인도범죄를 범하였다고 의심할 만한 상당한 이유가 없는 경우. 다만, 인도범죄에 관하여 청구국에서 유죄의 재판이 있는 경우는 제외한다. 4. 범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우 [전문개정 2010.3.31]","cite":"범죄인 인도법 제7조","badge":"","topic":"","from":"GY-2025-2-P-40","seq":null},{"id":"P-OX-038","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"‘범죄피해자’란 타인의 범죄행위로 피해를 당한 사람과 그 배우자, 직계친족 및 형제자매를 말한다. 다만, 배우자의 경우 사실상의 혼인관계는 제외한다. (22.1차)","answer":false,"quote":"(1) 이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"범죄피해자\"란 타인의 범죄행위로 피해를 당한 사람과 그 배우자(사실상의 혼인관계를 포함한다), 직계친족 및 형제자매를 말한다. 2. \"범죄피해자 보호·지원\"이란 범죄피해자의 손실 복구, 정당한 권리 행사 및 복지 증진에 기여하는 행위를 말한다. 다만, 수사·변호 또는 재판에 부당한 영향을 미치는 행위는 포함되지 아니한다. 3. \"범죄피해자 지원법인\"이란 범죄피해자 보호·지원을 주된 목적으로 설립된 비영리법인을 말한다. 4. \"구조대상 범죄피해\"란 대한민국의 영역 안에서 또는 대한민국의 영역 밖에 있는 대한민국의 선박이나 항공기 안에서 행하여진 사람의 생명 또는 신체를 해치는 죄에 해당하는 행위(「형법」 제9조, 제10조제1항, 제12조, 제22조제1항에 따라 처벌되지 아니하는 행위를 포함하며, 같은 법 제20조 또는 제21조제1항에 따라 처벌되지 아니하는 행위 및 과실에 의한 행위는 제외한다)로 인하여 사망하거나 장해 또는 중상해를 입은 것을 말한다. 5. \"장해\"란 범죄행위로 입은 부상이나 질병이 치료(그 증상이 고정된 때를 포함한다)된 후에 남은 신체의 장해로서 대통령령으로 정하는 경우를 말한다. 6. \"중상해\"란 범죄행위로 인하여 신체나 그 생리적 기능에 손상을 입은 것으로서 대통령령으로 정하는 경우를 말한다. (2) 제1항제1호에 해당하는 사람 외에 범죄피해 방지 및 범죄피해자 구조 활동으로 피해를 당한 사람도 범죄피해자로 본다.","cite":"범죄피해자 보호법 제3조","badge":"","topic":"","from":"GY-2022-1-P-22","seq":null},{"id":"P-OX-033","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"공직자등은 사례금을 받는 외부강의등을 할 때에는 대통령령으로 정하는 바에 따라 외부강의등의 요청 명세 등을 소속기관장에게 그 외부강의등을 마친 날부터 10일 이내에 서면으로 신고하여야 한다. 다만, 외부강의등을 요청한 자가 국가나 지방자치단체인 경우에는 그러하지 아니하다. (26.1차)","answer":true,"quote":"② 공직자등은 사례금을 받는 외부강의등을 할 때에는 대통령령으로 정하는 바에 따라 외부강의등의 요청 명세 등을 소속기관장에게 그 외부강의등을 마친 날부터 10일 이내에 서면으로 신고하여야 한다. 다만, 외부강의등을 요청한 자가 국가나 지방자치단체인 경우에는 그러하지 아니하다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제10조 제2항","badge":"","topic":"","from":"GY-2026-1-P-06","seq":null},{"id":"P-OX-061","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"최소침해의 원칙은 협의의 비례원칙이라고도 한다. (26.1차)","answer":false,"quote":"최소침해의 원칙은 필요성의 원칙이고, 협의의 비례원칙은 잃는 사익과 얻는 공익을 비교하는 상당성의 원칙이다.","cite":"행정기본법 제10조","badge":"","topic":"","from":"GY-2026-1-P-19","seq":null},{"id":"P-OX-047","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"경찰관이 농성 진압 과정에서 경찰장비를 적법하게 사용하였더라도, 상대방이 그로 인한 생명･신체에 대한 위해를 면하기 위하여 대항하는 과정에서 경찰장비를 손상시켰다면 이는 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당한다. (24.1차)","answer":false,"quote":"나아가 경찰관이 농성 진압의 과정에서 경찰장비를 위법하게 사용함으로써 그 직무수행이 적법한 범위를 벗어난 것으로 볼 수밖에 없다면, 상대방이 그로 인한 생명·신체에 대한 위해를 면하기 위하여 직접적으로 대항하는 과정에서 경찰장비를 손상시켰더라도 이는 위법한 공무집행으로 인한 신체에 대한 현재의 부당한 침해에서 벗어나기 위한 행위로서 정당방위에 해당한다.","cite":"대법원 2016다26662","badge":"","topic":"","from":"GY-2024-1-P-18","seq":null},{"id":"P-OX-027","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"있지 아니한 범죄나 재해 사실을 공무원에게 거짓으로 신고한 사람은 주거가 분명하여도 현행범으로 체포할 수 있다. (24.2차)","answer":true,"quote":"③ 다음 각 호의 어느 하나에 해당하는 사람은 60만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다. <개정 2013.5.22.> 1. (관공서에서의 주취소란) 술에 취한 채로 관공서에서 몹시 거친 말과 행동으로 주정하거나 시끄럽게 한 사람 2. (거짓신고) 있지 아니한 범죄나 재해 사실을 공무원에게 거짓으로 신고한 사람","cite":"경범죄처벌법 제3조 제3항","badge":"","topic":"","from":"GY-2024-2-P-35","seq":null},{"id":"P-OX-037","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"본예산은 정부가 매년 정기적으로 다음 연도의 세입과 세출을 예산안으로 편성한 후, 국회에서 심의‧의결하여 최초로 확정된 예산을 말한다. (26.1차)","answer":true,"quote":"본예산은 매년 정기 편성해 국회 의결로 처음 확정된 예산이고, 의결 전에 고치면 수정예산, 확정 뒤 고치면 추가경정예산이다.","cite":"헌법 제54조 · 헌법 제56조","badge":"","topic":"","from":"GY-2026-1-P-32","seq":null},{"id":"P-OX-023","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"경찰청장은 예산이 확정된 후 예산배정요구서를 기획재정부장관 에게 제출하여야 하고, 기획재정부장관은 제출된 예산배정 요구서에 따라 분기별 예산배정계획을 작성하여 국무회의의 심의를 거친 후 대통령의 승인을 얻어야 한다. (24.1차)","answer":true,"quote":"예산이 확정되면 각 중앙관서의 장이 예산배정요구서를 내고, 기획재정부장관은 분기별 예산배정계획을 만들어 국무회의 심의와 대통령 승인을 받는다.","cite":"국가재정법 제42조 · 국가재정법 제43조","badge":"","topic":"","from":"GY-2024-1-P-30","seq":null},{"id":"P-OX-058","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"구조피해자가 과도한 폭행‧협박 또는 중대한 모욕 등 해당 범죄행위를 유발하는 행위를 한 때에는 구조금의 일부를 지급 하지 아니한다. (25.2차)","answer":false,"quote":"(1) 범죄행위 당시 구조피해자와 가해자 사이에 다음 각 호의 어느 하나에 해당하는 친족관계가 있는 경우에는 구조금을 지급하지 아니한다. 1. 부부(사실상의 혼인관계를 포함한다) 2. 직계혈족 3. 4촌 이내의 친족 4. 동거친족 (2) 범죄행위 당시 구조피해자와 가해자 사이에 제1항 각 호의 어느 하나에 해당하지 아니하는 친족관계가 있는 경우에는 구조금의 일부를 지급하지 아니한다. (3) 구조피해자가 다음 각 호의 어느 하나에 해당하는 행위를 한 때에는 구조금을 지급하지 아니한다. 1. 해당 범죄행위를 교사 또는 방조하는 행위 2. 과도한 폭행·협박 또는 중대한 모욕 등 해당 범죄행위를 유발하는 행위 3. 해당 범죄행위와 관련하여 현저하게 부정한 행위 4. 해당 범죄행위를 용인하는 행위 5. 집단적 또는 상습적으로 불법행위를 행할 우려가 있는 조직에 속하는 행위(다만, 그 조직에 속하고 있는 것이 해당 범죄피해를 당한 것과 관련이 없다고 인정되는 경우는 제외한다) 6. 범죄행위에 대한 보복으로 가해자 또는 그 친족이나 그 밖에 가해자와 밀접한 관계가 있는 사람의 생명을 해치거나 신체를 중대하게 침해하는 행위 (4) 구조피해자가 다음 각 호의 어느 하나에 해당하는 행위를 한 때에는 구조금의 일부를 지급하지 아니한다. 1. 폭행·협박 또는 모욕 등 해당 범죄행위를 유발하는 행위 2. 해당 범죄피해의 발생 또는 증대에 가공(加功)한 부주의한 행위 또는 부적절한 행위 (5) 유족구조금을 지급할 때에는 제1항부터 제4항까지의 규정을 적용할 때 \"구조피해자\"는 \"구조피해자 또는 맨 앞의 순위인 유족\"으로 본다. (6) 구조피해자 또는 그 유족과 가해자 사이의 관계, 그 밖의 사정을 고려하여 구조금의 전부 또는 일부를 지급하는 것이 사회통념에 위배된다고 인정될 때에는 구조금의 전부 또는 일부를 지급하지 아니할 수 있다. (7) 제1항부터 제6항까지의 규정에도 불구하고 구조금을 지급하지 아니하는 것이 사회통념에 위배된다고 인정할 만한 특별한 사정이 있는 경우에는 구조금의 일부를 지급할 수 있다.","cite":"범죄피해자 보호법 제19조","badge":"","topic":"","from":"GY-2025-2-P-35","seq":null},{"id":"P-OX-026","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"언론, 인터넷뉴스서비스 및 인터넷 멀티미디어 방송(이하 “언론등”이라 한다)은 타인의 생명, 자유, 신체, 건강, 명예, 사생활의 비밀과 자유, 초상, 성명, 음성, 대화, 저작물 및 사적 문서, 그 밖의 인격적 가치 등에 관한 권리를 침해하여서는 아니 된다. (24.2차)","answer":true,"quote":"① 언론, 인터넷뉴스서비스 및 인터넷 멀티미디어 방송(이하 \"언론등\"이라 한다)은 타인의 생명, 자유, 신체, 건강, 명예, 사생활의 비밀과 자유, 초상(肖像), 성명, 음성, 대화, 저작물 및 사적(私的) 문서, 그 밖의 인격적 가치 등에 관한 권리(이하 \"인격권\"이라 한다)를 침해하여서는 아니 되며, 언론등이 타인의 인격권을 침해한 경우에는 이 법에서 정한 절차에 따라 그 피해를 신속하게 구제하여야 한다.","cite":"언론중재 및 피해구제 등에 관한 법률 제5조 제1항","badge":"","topic":"","from":"GY-2024-2-P-34","seq":null},{"id":"P-OX-035","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"기속행위와 재량행위의 구분은 당해 행위의 근거가 된 법규의 체제‧형식과 그 문언, 당해 행위가 속하는 행정 분야의 주된 목적과 특성, 당해 행위 자체의 개별적 성질과 유형 등을 모두 고려하여 판단해야 한다. (26.1차)","answer":true,"quote":"재량 여부는 「할 수 있다」 같은 문언 하나로 정하지 않고 법규 체재·행정 분야의 목적·행위의 성질을 함께 보며, 재량행위는 일탈·남용만 심사한다.","cite":"대법원 98두17593","badge":"","topic":"","from":"GY-2026-1-P-15","seq":null},{"id":"P-OX-059","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"대한민국과 청구국의 법률에 따라 인도범죄가 사형, 무기징역, 무기금고, 장기 3년 이상의 징역 또는 금고에 해당하는 경우에만 범죄인을 인도할 수 있다. (25.2차)","answer":false,"quote":"인도범죄는 대한민국과 청구국 법률에서 모두 사형·무기 또는 장기 1년 이상의 징역·금고에 해당해야 한다.","cite":"범죄인 인도법 제6조","badge":"","topic":"","from":"GY-2025-2-P-40","seq":null},{"id":"P-OX-043","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"지방자치단체의 장은 법령의 범위에서 그 사무에 관하여 조리 (條理)를 제정할 수 있다. (23.1차)","answer":false,"quote":"지방자치단체의 장이 법령·조례의 범위에서 만드는 것은 규칙이고, 조리는 사물의 본질적 법칙인 불문법원이라 제정 대상이 아니다.","cite":"지방자치법 제29조","badge":"","topic":"","from":"GY-2023-1-P-18","seq":null},{"id":"P-OX-041","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"공직자의 이해충돌 방지법 상 부동산을 직접 또는 간접으로 취급하는 대통령령으로 정한 공공기관의 공직자가 소속 공공 기관의 업무와 관련된 부동산을 보유하고 있거나 매수하는 경우 소속기관장에게 그 사실을 구두 또는 서면으로 신고하여야 한다. (22.2차)","answer":false,"quote":"업무 관련 부동산 보유·매수 신고 의무는 부동산을 간접이 아니라 직접 취급하는 공공기관의 공직자가 지고, 신고도 구두가 아니라 서면으로 한다.","cite":"공직자의 이해충돌 방지법 제6조","badge":"","topic":"","from":"GY-2022-2-P-06","seq":null},{"id":"P-OX-013","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"각 중앙관서의 장은 예산안편성지침에 따라 그 소관에 속하는 다음 연도의 세입세출예산･계속비･명시이월비 및 국고채무부담행위 요구서를 작성하여 매년 5월 31일까지 기획재정부장관에게 제출하여야 한다. (23.1차)","answer":true,"quote":"예산안편성지침은 3월 31일까지 내려오고, 각 중앙관서의 장은 예산요구서를 5월 31일까지 기획재정부장관에게 낸다.","cite":"국가재정법 제29조 · 국가재정법 제31조","badge":"","topic":"","from":"GY-2023-1-P-31","seq":null},{"id":"P-OX-062","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"추가경정예산은 예산불성립으로 인한 행정중단을 방지하기 위한 제도이다. (26.1차)","answer":false,"quote":"예산 불성립 때 행정중단을 막는 제도는 준예산이고, 추가경정예산은 성립된 예산을 사정 변화에 따라 고치는 예산이다.","cite":"헌법 제54조 · 헌법 제56조","badge":"","topic":"","from":"GY-2026-1-P-32","seq":null},{"id":"P-OX-024","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"인권 존중주의: 경찰은 직무를 수행할 때 헌법과 법률에 따라 국민의 자유와 권리 및 모든 개인이 가지는 불가침의 기본적 인권을 보호한다. (24.2차)","answer":true,"quote":"경찰은 그 직무를 수행할 때 헌법과 법률에 따라 국민의 자유와 권리 및 모든 개인이 가지는 불가침의 기본적 인권을 보호하고, 국민 전체에 대한 봉사자로서 공정·중립을 지켜야 하며, 부여된 권한을 남용하여서는 아니 된다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제5조","badge":"","topic":"","from":"GY-2024-2-P-07","seq":null},{"id":"P-OX-014","subject":"경찰학","unit":"경찰학 기초·이론","stmt":"공직자등은 직무 관련 여부 및 기부･후원･증여 등 그 명목에 관계없이 동일인으로부터 1회에 100만 원 또는 매 회계연도에 300만 원을 초과하는 금품등을 받거나 요구 또는 약속해서는 아니 된다. (23.2차)","answer":true,"quote":"① 공직자등은 직무 관련 여부 및 기부·후원·증여 등 그 명목에 관계없이 동일인으로부터 1회에 100만원 또는 매 회계연도에 300만원을 초과하는 금품등을 받거나 요구 또는 약속해서는 아니 된다.","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제8조 제1항","badge":"","topic":"","from":"GY-2023-2-P-07","seq":null},{"id":"P-OX-182","subject":"경찰학","unit":"경찰행정법","stmt":"행정청에 처분을 구하는 신청은 문서로 하여야 한다. 다만, 다른 법령등에 특별한 규정이 있는 경우와 행정청이 미리 다른 방법을 정하여 공시한 경우에는 그러하지 아니하다. (26.1차)","answer":true,"quote":"① 행정청에 처분을 구하는 신청은 문서로 하여야 한다. 다만, 다른 법령등에 특별한 규정이 있는 경우와 행정청이 미리 다른 방법을 정하여 공시한 경우에는 그러하지 아니하다.","cite":"행정절차법 제17조 제1항","badge":"","topic":"","from":"GY-2026-1-P-23","seq":null},{"id":"P-OX-086","subject":"경찰학","unit":"경찰행정법","stmt":"행정조사는 행정기관이 향후 행정작용에 필요한 자료 및 정보를 얻기 위한 준비적 보조적 작용이다. (22.2차)","answer":true,"quote":"행정조사는 정책 결정이나 직무 수행에 필요한 정보·자료를 모으는 준비적·보조적 작용이다.","cite":"행정조사기본법 제2조","badge":"","topic":"","from":"GY-2022-2-P-18","seq":null},{"id":"P-OX-231","subject":"경찰학","unit":"경찰행정법","stmt":"행정심판위원회는 심판청구가 이유가 있다고 인정하는 경우에도 이를 인용(認容)하는 것이 공공복리에 크게 위배된다고 인정하면 그 심판청구를 기각하는 재결을 하여야 한다. (23.2차)","answer":false,"quote":"① 위원회는 심판청구가 이유가 있다고 인정하는 경우에도 이를 인용(認容)하는 것이 공공복리에 크게 위배된다고 인정하면 그 심판청구를 기각하는 재결을 할 수 있다. 이 경우 위원회는 재결의 주문(主文)에서 그 처분 또는 부작위가 위법하거나 부당하다는 것을 구체적으로 밝혀야 한다.","cite":"행정심판법 제44조 제1항","badge":"","topic":"","from":"GY-2023-2-P-26","seq":null},{"id":"P-OX-195","subject":"경찰학","unit":"경찰행정법","stmt":"자신의 행위가 위법하지 아니한 것으로 오인하고 행한 질서 위반행위는 그 오인에 정당한 이유가 있는 때에도 과태료를 부과한다. (22.1차)","answer":false,"quote":"자신의 행위가 위법하지 아니한 것으로 오인하고 행한 질서위반행위는 그 오인에 정당한 이유가 있는 때에 한하여 과태료를 부과하지 아니한다.","cite":"질서위반행위규제법 제8조","badge":"","topic":"","from":"GY-2022-1-P-31","seq":null},{"id":"P-OX-078","subject":"경찰학","unit":"경찰행정법","stmt":"보상금심사위원회는 위원장 1명을 포함한 5명 이내의 위원으로 구성한다. (22.1차)","answer":true,"quote":"③ 제2항에 따른 보상금심사위원회는 위원장 1명을 포함한 5명 이내의 위원으로 구성한다.","cite":"경찰관 직무집행법 제11조의3 제3항","badge":"","topic":"","from":"GY-2022-1-P-37","seq":null},{"id":"P-OX-274","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 처분 후 2년 이내에 당사자등이 요청하는 경우에는 청문‧공청회 또는 의견제출을 위하여 제출받은 서류나 그 밖의 물건을 반환할 수 있다. (25.2차)","answer":false,"quote":"처분 후 1년 이내에 당사자등이 요청하면 청문·공청회·의견제출 때 받은 서류와 물건을 반드시 돌려줘야 한다 — 2년도, 재량도 아니다.","cite":"행정절차법 제22조","badge":"","topic":"","from":"GY-2025-2-P-23","seq":null},{"id":"P-OX-218","subject":"경찰학","unit":"경찰행정법","stmt":"동법 제18조 제1항 단서에 따라 2개의 시･도자치경찰위원회를 두는 경우 해당 시･도자치경찰위원회의 명칭, 관할구역, 사무분장, 그 밖에 필요한 사항은 행정안전부령으로 정한다. (23.2차)","answer":false,"quote":"③ 제1항 단서에 따라 2개의 시·도자치경찰위원회를 두는 경우 해당 시·도자치경찰위원회의 명칭, 관할구역, 사무분장, 그 밖에 필요한 사항은 대통령령으로 정한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제18조 제3항","badge":"","topic":"","from":"GY-2023-2-P-03","seq":null},{"id":"P-OX-083","subject":"경찰학","unit":"경찰행정법","stmt":"같은 정도의 비위를 저지른 자들 사이에 있어서도 그 직무의 특성, 비위의 성격 및 정도를 고려하여 징계종류의 선택과 양정을 차별적으로 취급하는 것은 합리적 차별로서 평등원칙에 반하지 아니한다. (22.2차)","answer":true,"quote":"같은 정도의 비위를 저지른 자들 사이에 있어서도 그 직무의 특성 등에 비추어, 개전의 정이 있는지 여부에 따라 징계의 종류의 선택과 양정에 있어서 차별적으로 취급하는 것은, 사안의 성질에 따른 합리적 차별로서 이를 자의적 취급이라고 할 수 없는 것이어서 평등원칙 내지 형평에 반하지 아니한다.","cite":"대법원 99두2611","badge":"","topic":"","from":"GY-2022-2-P-12","seq":null},{"id":"P-OX-136","subject":"경찰학","unit":"경찰행정법","stmt":"경찰관의 직무집행이 법령이 정한 요건과 절차에 따라 이루어진 것이라면 특별한 사정이 없는 한 이는 법령에 적합한 것이고 그 과정에서 개인의 권리가 침해되었다고 하여 그 법령적합성이 곧바로 부정되는 것은 아니다. (24.1차)","answer":true,"quote":"국가배상책임은 공무원의 직무집행이 법령에 위반한 것임을 요건으로 하는 것으로서, 공무원의 직무집행이 법령이 정한 요건과 절차에 따라 이루어진 것이라면 특별한 사정이 없는 한 이는 법령에 적합한 것이고 그 과정에서 개인의 권리가 침해되는 일이 생긴다고 하여 그 법령적합성이 곧바로 부정되는 것은 아니다.","cite":"대법원 2000다26807","badge":"","topic":"","from":"GY-2024-1-P-25","seq":null},{"id":"P-OX-068","subject":"경찰학","unit":"경찰행정법","stmt":"시 도자치경찰위원회는 합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다. (22.1차)","answer":true,"quote":"② 시·도자치경찰위원회는 합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제18조 제2항","badge":"","topic":"","from":"GY-2022-1-P-27","seq":null},{"id":"P-OX-280","subject":"경찰학","unit":"경찰행정법","stmt":"자치경찰사무의 수행에 필요한 예산은 시‧도자치경찰위원회의 심의‧의결을 거쳐 시‧도지사가 수립한다. 이 경우 시‧도 자치경찰위원회는 시‧도경찰청장의 의견을 들어야 한다. (26.1차)","answer":false,"quote":"① 자치경찰사무의 수행에 필요한 예산은 시·도자치경찰위원회의 심의·의결을 거쳐 시·도지사가 수립한다. 이 경우 시·도자치경찰위원회는 경찰청장의 의견을 들어야 한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제35조 제1항","badge":"","topic":"","from":"GY-2026-1-P-20","seq":null},{"id":"P-OX-069","subject":"경찰학","unit":"경찰행정법","stmt":"공공기관은 전자적 형태로 보유 관리하는 정보에 대하여 청구 인이 전자적 형태로 공개하여 줄 것을 요청하는 경우에는 그 정보의 성질상 현저히 곤란한 경우를 제외하고는 청구인의 요 청에 따라야 한다. (22.1차)","answer":true,"quote":"① 공공기관은 전자적 형태로 보유·관리하는 정보에 대하여 청구인이 전자적 형태로 공개하여 줄 것을 요청하는 경우에는 그 정보의 성질상 현저히 곤란한 경우를 제외하고는 청구인의 요청에 따라야 한다.","cite":"공공기관의 정보공개에 관한 법률 제15조 제1항","badge":"","topic":"","from":"GY-2022-1-P-29","seq":null},{"id":"P-OX-214","subject":"경찰학","unit":"경찰행정법","stmt":"해당 처분의 영향이 광범위하여 널리 의견을 수렴할 필요가 있다고 행정청이 인정하는 경우 (23.1차)","answer":false,"quote":"② 행정청이 처분을 할 때 다음 각 호의 어느 하나에 해당하는 경우에는 공청회를 개최한다. 1. 다른 법령등에서 공청회를 개최하도록 규정하고 있는 경우 2. 해당 처분의 영향이 광범위하여 널리 의견을 수렴할 필요가 있다고 행정청이 인정하는 경우","cite":"행정절차법 제22조 제2항","badge":"","topic":"","from":"GY-2023-1-P-25","seq":null},{"id":"P-OX-133","subject":"경찰학","unit":"경찰행정법","stmt":"수사기록 중 의견서, 보고문서, 메모, 법률검토 등은 그 실질적인 내용을 구체적으로 살펴 수사의 방법 및 절차 등이 공개됨으로써 수사기관의 직무수행을 현저히 곤란하게 한다고 인정할 만한 상당한 이유가 있어야만 비공개대상정보에 해당한다. (24.1차)","answer":true,"quote":"그 취지는 수사의 방법 및 절차 등이 공개되어 수사기관의 직무수행에 현저한 곤란을 초래할 위험을 막고자 하는 것으로서, 수사기록 중의 의견서, 보고문서, 메모, 법률검토, 내사자료 등(이하 ‘의견서 등’이라고 한다)이 이에 해당하나, 공개청구대상인 정보가 의견서 등에 해당한다고 하여 곧바로 정보공개법 제9조 제1항 제4호 에 규정된 비공개대상정보라고 볼 것은 아니고, 의견서 등의 실질적인 내용을 구체적으로 살펴 수사의 방법 및 절차 등이 공개됨으로써 수사기관의 직무수행을 현저히 곤란하게 한다고 인정할 만한 상당한 이유가 있어야만 위 비공개대상정보에 해당한다.","cite":"대법원 2017두44558","badge":"","topic":"","from":"GY-2024-1-P-23","seq":null},{"id":"P-OX-161","subject":"경찰학","unit":"경찰행정법","stmt":"행정청의 과태료 부과에 불복하는 당사자는 과태료 부과 통지를 받은 날부터 60일 이내에 해당 행정청에 서면으로 이의제기를 할 수 있다. (25.1차)","answer":true,"quote":"① 행정청의 과태료 부과에 불복하는 당사자는 제17조제1항에 따른 과태료 부과 통지를 받은 날부터 60일 이내에 해당 행정청에 서면으로 이의제기를 할 수 있다.","cite":"질서위반행위규제법 제20조 제1항","badge":"","topic":"","from":"GY-2025-1-P-19","seq":null},{"id":"P-OX-173","subject":"경찰학","unit":"경찰행정법","stmt":"행정청의 처분 또는 부작위에 대하여는 다른 법률에 특별한 규정이 있는 경우 외에는 이 법에 따라 행정심판을 청구할 수 있다. 다만, 대통령의 처분 또는 부작위에 대하여는 다른 법률에 특별한 규정이 있는 경우 외에는 행정심판을 청구할 수 없다. (25.2차)","answer":true,"quote":"① 행정청의 처분 또는 부작위에 대하여는 다른 법률에 특별한 규정이 있는 경우 외에는 이 법에 따라 행정심판을 청구할 수 있다.","cite":"행정심판법 제3조 제1항","badge":"","topic":"","from":"GY-2025-2-P-27","seq":null},{"id":"P-OX-188","subject":"경찰학","unit":"경찰행정법","stmt":"언론중재위원회는 40명 이상 90명 이내의 중재위원으로 구성 하며, 위원장 1명과 2명 이내의 부위원장 및 2명 이내의 감사를 두는데, 위원장 부위원장 감사 및 중재위원의 임기는 각각 3년 으로 하며, 연임할 수 없다. (22.1차)","answer":false,"quote":"중재위원회는 40명 이상 90명 이내로 구성하고, 위원장·부위원장·감사·중재위원의 임기는 3년이며 한 차례만 연임할 수 있다.","cite":"언론중재 및 피해구제 등에 관한 법률 제7조","badge":"","topic":"","from":"GY-2022-1-P-07","seq":null},{"id":"P-OX-183","subject":"경찰학","unit":"경찰행정법","stmt":"행정청은 신청인의 편의를 위하여 다른 행정청에 신청을 접수하게 할 수 있다. 이 경우 행정청은 다른 행정청에 접수할 수 있는 신청의 종류를 미리 정하여 공시하여야 한다. (26.1차)","answer":true,"quote":"⑦ 행정청은 신청인의 편의를 위하여 다른 행정청에 신청을 접수하게 할 수 있다. 이 경우 행정청은 다른 행정청에 접수할 수 있는 신청의 종류를 미리 정하여 공시하여야 한다.","cite":"행정절차법 제17조 제7항","badge":"","topic":"","from":"GY-2026-1-P-23","seq":null},{"id":"P-OX-100","subject":"경찰학","unit":"경찰행정법","stmt":"공공기관은 청구인이 사본 또는 복제물의 교부를 원하는 경우에는 이를 교부하여야 한다. (23.1차)","answer":true,"quote":"② 공공기관은 청구인이 사본 또는 복제물의 교부를 원하는 경우에는 이를 교부하여야 한다. 다만, 공개 대상 정보의 양이 너무 많아 정상적인 업무수행에 현저한 지장을 초래할 우려가 있는 경우에는 정보의 사본·복제물을 일정 기간별로 나누어 제공하거나 열람과 병행하여 제공할 수 있다.","cite":"공공기관의 정보공개에 관한 법률 제13조 제2항","badge":"","topic":"","from":"GY-2023-1-P-24","seq":null},{"id":"P-OX-256","subject":"경찰학","unit":"경찰행정법","stmt":"재판장은 법정에서의 질서유지를 위하여 필요하다고 인정할 때에는 개정 전후에 상관없이 시‧도경찰청장에게 경찰공무원의 파견을 요구할 수 있다. (25.1차)","answer":false,"quote":"① 재판장은 법정에서의 질서유지를 위하여 필요하다고 인정할 때에는 개정 전후에 상관없이 관할 경찰서장에게 국가경찰공무원의 파견을 요구할 수 있다.","cite":"법원조직법 제60조 제1항","badge":"","topic":"","from":"GY-2025-1-P-04","seq":null},{"id":"P-OX-253","subject":"경찰학","unit":"경찰행정법","stmt":"군인･군무원･경찰공무원 또는 예비군대원이 전투･훈련 등 직무 집행과 관련하여 전사･순직하거나 공상을 입은 경우에 본인이나 그 유족이 다른 법령에 따라 재해보상금･유족연금･상이연금 등의 보상을 지급받을 수 있을 때에도 ｢국가배상법｣ 및 ｢행정기본법｣에 따른 손해배상을 청구할 수 있다. (24.2차)","answer":false,"quote":"① 국가나 지방자치단체는 공무원 또는 공무를 위탁받은 사인(이하 \"공무원\"이라 한다)이 직무를 집행하면서 고의 또는 과실로 법령을 위반하여 타인에게 손해를 입히거나, 「자동차손해배상 보장법」에 따라 손해배상의 책임이 있을 때에는 이 법에 따라 그 손해를 배상하여야 한다. 다만, 군인·군무원·경찰공무원 또는 예비군대원이 전투·훈련 등 직무 집행과 관련하여 전사(戰死)·순직(殉職)하거나 공상(公傷)을 입은 경우에 본인이나 그 유족이 다른 법령에 따라 재해보상금·유족연금·상이연금 등의 보상을 지급받을 수 있을 때에는 이 법 및 「민법」에 따른 손해배상을 청구할 수 없다. <개정 2009. 10. 21., 2016. 5. 29.>","cite":"국가배상법 제2조 제1항","badge":"","topic":"","from":"GY-2024-2-P-28","seq":null},{"id":"P-OX-175","subject":"경찰학","unit":"경찰행정법","stmt":"공정한 업무처리에 대한 사의로 두고 간 돈 30만 원이 든 봉투를 소지함으로써 피동적으로 금품을 수수하였다가 돌려 준 20여년 근속의 경찰공무원에 대한 해임처분이 사회통념상 현저하게 타당성을 잃어 재량권의 남용에 해당한다. (26.1차)","answer":true,"quote":"공정한 업무처리에 대한 사의로 두고 간 돈 30만원이 든 봉투를 소지함으로써 피동적으로 금품을 수수하였다가 돌려 준 20여년 근속의 경찰공무원에 대한 해임처분이 사회통념상 현저하게 타당성을 잃어 재량권의 남용에 해당한다고 본 사례.","cite":"대법원 90누8954","badge":"","topic":"","from":"GY-2026-1-P-15","seq":null},{"id":"P-OX-154","subject":"경찰학","unit":"경찰행정법","stmt":"｢도로교통법시행규칙｣ 제53조 제1항이 정한 [별표 16]의 운전 면허행정처분기준은 부령의 형식으로 되어 있으나, 행정청 내부의 사무처리준칙을 규정한 것에 지나지 아니하므로 대외적으로 국민이나 법원을 기속하는 효력이 없다. (25.1차)","answer":true,"quote":"도로교통법시행규칙 제53조 제1항 이 정한 [별표 16]의 운전면허행정처분기준은 부령의 형식으로 되어 있으나, 그 규정의 성질과 내용이 운전면허의 취소처분 등에 관한 사무처리기준과 처분절차 등 행정청 내부의 사무처리준칙을 규정한 것에 지나지 아니하므로 대외적으로 국민이나 법원을 기속하는 효력이 없으므로, 자동차운전면허취소처분의 적법 여부는 그 운전면허행정처분기준만에 의하여 판단할 것이 아니라 도로교통법의 규정 내용과 취지에 따라 판단되어야 한다.","cite":"대법원 96누5773","badge":"","topic":"","from":"GY-2025-1-P-14","seq":null},{"id":"P-OX-123","subject":"경찰학","unit":"경찰행정법","stmt":"합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다. (24.1차)","answer":true,"quote":"② 시·도자치경찰위원회는 합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제18조 제2항","badge":"","topic":"","from":"GY-2024-1-P-16","seq":null},{"id":"P-OX-258","subject":"경찰학","unit":"경찰행정법","stmt":"법률유보의 원칙에서 요구되는 법적 근거는 행정의 조직법적 근거이다. (25.1차)","answer":false,"quote":"법률유보가 요구하는 근거는 권한을 나눠 준 조직법적 근거가 아니라, 국민의 권리를 제한할 수 있게 하는 작용법적 근거다.","cite":"행정기본법 제8조","badge":"","topic":"","from":"GY-2025-1-P-13","seq":null},{"id":"P-OX-109","subject":"경찰학","unit":"경찰행정법","stmt":"시･도자치경찰위원회의 회의는 정기적으로 개최하여야 한다. 다만 위원장이 필요하다고 인정하는 경우, 위원 2명 이상이 요구하는 경우 및 시･도지사가 필요하다고 인정하는 경우에는 임시회의를 개최할 수 있다. (23.2차)","answer":true,"quote":"① 시·도자치경찰위원회의 회의는 정기적으로 개최하여야 한다. 다만 위원장이 필요하다고 인정하는 경우, 위원 2명 이상이 요구하는 경우 및 시·도지사가 필요하다고 인정하는 경우에는 임시회의를 개최할 수 있다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제26조 제1항","badge":"","topic":"","from":"GY-2023-2-P-03","seq":null},{"id":"P-OX-162","subject":"경찰학","unit":"경찰행정법","stmt":"적법한 건축물에 대한 철거명령은 그 하자가 중대하고 명백하여 당연무효이고, 그 후행행위인 건축물철거 대집행계고처분 역시 당연무효이다. (25.1차)","answer":true,"quote":"적법한 건축물에 대한 철거명령은 그 하자가 중대하고 명백하여 당연무효라고 할 것이고, 그 후행행위인 건축물철거 대집행계고처분 역시 당연무효라고 할 것이다.","cite":"대법원 97누6780","badge":"","topic":"","from":"GY-2025-1-P-21","seq":null},{"id":"P-OX-222","subject":"경찰학","unit":"경찰행정법","stmt":"행정작용은 그 행정작용이 의도하는 공익이 행정작용으로 인한 국민의 이익 침해보다 크지 않아야 한다. (23.2차)","answer":false,"quote":"행정작용은 다음 각 호의 원칙에 따라야 한다. 1. 행정목적을 달성하는 데 유효하고 적절할 것 2. 행정목적을 달성하는 데 필요한 최소한도에 그칠 것 3. 행정작용으로 인한 국민의 이익 침해가 그 행정작용이
