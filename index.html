 거의 매일 검사실로 하루 종일 소환하여 피고인측 변호인이 접근하는 것을 차단하고 검찰에서의 진술을 번복하는 증언을 하지 않도록 회유･압박하는 행위는, 증인의 증언 전에 일방 당사자만이 증인과의 접촉을 독점하여 상대방은 증인이 어떠한 내용을 증언할 것인지를 알 수 없어 그에 대한 방어를 준비할 수 없게 되므로 적법절차원칙에 위배된다.","범칙금 통고처분을 받고도 납부기간 이내에 범칙금을 납부하지 아니한 사람에 대하여 행정청에 대한 이의제기나 의견진술 등의 기회를 주지 않고 경찰서장이 곧바로 즉결심판을 청구하도록 한 구 ｢도로교통법｣ 조항은, 이에 불복하여 범칙금을 납부하지 아니한 자에게는 재판절차라는 완비된 절차적 보장이 주어지므로 적법절차원칙에 위배되지 않는다.",0,0,""],["2023-1","헌법",11,"영장주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법에서 규정된 영장신청권자로서의 검사는 검찰권을 행사하는 국가기관인 검사로서 공익의 대표자이자 수사단계에서의 인권 옹호기관으로서의 지위에서 그에 부합하는 직무를 수행하는 자를 의미하는 것이지 ｢검찰청법｣상 검사만을 지칭하는 것은 아니다.","｢형의 집행 및 수용자의 처우에 관한 법률｣에 따라 미결수용자의 접견 내용을 녹음･녹화하는 것은 직접적으로 물리적 강제력을 수반하는 강제처분이 아니므로 영장주의가 적용되지 않는다.","｢형사소송법｣ 제199조 제2항 등에 따른 수사기관의 사실조회 행위에 대하여 공사단체가 이에 응하거나 협조하여야 할 의무를 부담하는 것은 아니므로, 이러한 사실조회행위는 강제력이 개입되지 아니한 임의수사에 해당하고 이에 응하여 이루어진 정보제공행위에는 영장주의가 적용되지 않는다.","국가보안법위반죄 등 일부 범죄혐의자를 법관의 영장없이 구속, 압수, 수색할 수 있도록 규정하고, 법관에 의한 사후영장제도도 마련하지 않은 구 ｢인신구속 등에 관한 임시 특례법｣ 조항은 국가비상사태에 준하는 상황에서 내려진 특별한 조치임을 감안하면 영장주의의 본질을 침해한다고 볼 수 없다.",3,0,""],["2023-1","헌법",12,"변호인의 조력을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","우리 헌법은 변호인의 조력을 받을 권리가 불구속 피의자･피고인 모두에게 포괄적으로 인정되는지 여부에 관하여 명시적으로 규율하고 있지는 않지만, 불구속 피의자의 경우에도 변호인의 조력을 받을 권리는 우리 헌법에 나타난 법치국가원리, 적법 절차원칙에서 인정되는 당연한 내용이다.","법원이 검사의 열람･등사 거부처분에 정당한 사유가 없다고 판단하고 그러한 거부처분이 피고인의 헌법상 기본권을 침해 한다는 취지에서 수사서류의 열람･등사를 허용하도록 명한 이상 검사로서는 당연히 법원의 그러한 결정에 지체 없이 따라야 하지만, 별건으로 공소제기되어 확정된 관련 형사사건 기록에 관한 경우에는 이를 따르지 않을 수 있다.","헌법 제12조 제4항 본문에 규정된 “구속”은 사법절차에서 이루어진 구속뿐 아니라 행정절차에서 이루어진 구속까지 포함하는 개념으로, 헌법 제12조 제4항 본문에 규정된 변호인의 조력을 받을 권리는 행정절차에서 구속을 당한 사람에게도 즉시 보장된다.","변호인과 상담하고 조언을 구할 권리는 변호인의 조력을 받을 권리의 내용 중 구체적인 입법형성이 필요한 다른 절차적 권리의 필수적인 전제요건으로서 변호인의 조력을 받을 권리 그 자체에서 막바로 도출되는 것이다.",1,0,""],["2023-1","헌법",13,"다음 사례에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함) 검사 乙은 전기통신사업자 A에게 수사를 위하여 시민 甲의 ‘성명, 주민등록번호, 주소, 전화번호, 가입일’ 등의 통신자료 제공을 요청하였고, A는 乙에게 2022.1.1.부터 2022.6.30.까지 甲의 통신자료를 제공하였다. 甲은 수사기관 등이 전기통신 사업자에게 통신자료 제공을 요청하면 전기통신사업자가 그 요청에 따를 수 있다고 정한 ｢전기통신사업법｣ 제83조에 대해 헌법소원심판을 청구하였다.","A가 乙의 통신자료 제공요청에 따라 乙에게 제공한 甲의 성명, 주민등록번호, 주소, 전화번호, 아이디, 가입일 또는 해지일은 甲의 동일성을 식별할 수 있게 해주는 개인정보에 해당하므로 이 사건 법률조항은 甲의 개인정보자기결정권을 제한한다.","헌법상 영장주의는 체포･구속･압수･수색 등 기본권을 제한하는 강제처분에 적용되므로 강제력이 개입되지 않은 임의수사에 해당하는 乙의 통신자료 취득에 영장주의가 적용되지 않는다.","이 사건 법률조항 중 ‘국가안전보장에 대한 위해를 방지하기 위한 정보수집’은 국가의 존립이나 헌법의 기본질서에 대한 위험을 방지하기 위한 목적을 달성함에 있어 요구되는 최소한의 범위 내에서의 정보수집을 의미하는 것으로 해석되므로 명확성 원칙에 위배되지 않는다.","효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 甲에게 통신자료 제공 내역을 통지하도록 하는 것이 적절하지 않기 때문에, 이 사건 법률조항이 통신자료 취득에 대한 사후통지절차를 두지 않은 것은 적법절차원칙에 위배되지 않는다.",3,0,""],["2023-1","헌법",14,"거주･이전의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","거주･이전의 자유는 국민에게 그가 선택할 직업 내지 그가 취임할 공직을 그가 선택하는 임의의 장소에서 자유롭게 행사할 수 있는 권리까지 보장하는 것은 아니다.","거주･이전의 자유는 거주지나 체류지라고 볼 만한 정도로 생활과 밀접한 연관을 갖는 장소를 선택하고 변경하는 행위를 보호하는 기본권으로서, 생활의 근거지에 이르지 못하는 일시적인 이동을 위한 장소의 선택과 변경까지 그 보호영역에 포함되는 것은 아니다.","복수국적자에 대하여 병역준비역에 편입된 때부터 3개월 이내에 대한민국 국적을 이탈하지 않으면 병역의무를 해소한 후에 이를 가능하도록 한 ｢국적법｣ 조항은 복수국적자의 국적이탈의 자유를 침해한다.","법무부령이 정하는 금액 이상의 추징금 미납자에 대해 출국금지를 규정한구 ｢출입국관리법｣ 조항은 기본권에 대한침해가 적은 수단이 마련되어 있음에도 불구하고 추징금 납부를 강제하기 위한 압박 수단으로 출국금지를 하는 것으로, 이는 필요한 정도를 넘는 과도한 출국의 자유를 제한하는 것이어서 과잉금지원칙에 위배된다.",3,0,""],["2023-1","헌법",15,"정신적 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","‘양심의 자유’가 보장하고자 하는 ‘양심’은 개인적 현상으로서 지극히 주관적인 것으로 그 대상이나 내용 또는 동기에 의하여 판단될 수 없으며, 특히 양심상의 결정이 이성적･합리적인가, 타당한가 또는 법질서나 사회규범, 도덕률과 일치하는가 하는 관점은 양심의 존재를 판단하는 기준이 될 수 없다.","현역입영 또는 소집 통지서를 받은 사람이 정당한 사유 없이 입영일이나 소집일부터 3일이 지나도 입영하지 아니하거나 소집에 응하지 아니한 경우를 처벌하는 ｢병역법｣ 처벌조항은 과잉금지 원칙을 위반하여 양심적 병역거부자의 양심의 자유를 침해한다.","종교전파의 자유는 누구에게나 자신의 종교 또는 종교적 확신을 알리고 선전하는 자유를 말하지만, 이러한 종교전파의 자유에는 국민에게 그가 선택한 임의의 장소에서 자유롭게 행사할 수 있는 권리까지 보장한다고 할 수 없다.","육군훈련소장이 훈련병에게 개신교, 불교, 천주교, 원불교 종교행사 중 하나에 참석하도록 한 것은 국가가 종교를 군사력 강화라는 목적을 달성하기 위한 수단으로 전락시키거나, 반대로 종교단체가 군대라는 국가권력에 개입하여 선교행위를 하는 등 영향력을 행사할 수 있는 기회를 제공하므로, 국가와 종교의 밀접한 결합을 초래한다는 점에서 헌법상 정교분리원칙에 위배된다.",1,0,""],["2023-1","헌법",16,"집회의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","누구나 ‘어떤 장소에서’ 자신이 계획한 집회를 할 것인가를 원칙적으로 자유롭게 결정할 수 있어야만 집회의 자유가 비로소 효과적으로 보장되는 것이므로, 집회의 자유는 다른 법익의 보호를 위하여 정당화되지 않는 한, 집회장소를 항의의 대상 으로부터 분리시키는 것을 금지한다.","일반적으로 집회는 일정한 장소를 전제로 하여 특정 목적을 가진 다수인이 일시적으로 회합하는 것을 말하는 것으로 일컬어 지고 있고, 그 공동의 목적은 ‘내적인 유대 관계’로 족하다.","집단적인 폭행･협박･손괴･방화 등으로 공공의 안녕질서에 직접적인 위협을 가할 것이 명백한 집회 또는 시위의 주최를 금지하는 구 ｢집회 및 시위에 관한 법률｣ 조항은 집회의 자유를 침해하지 아니한다.","경찰이 신고범위를 벗어난 동안에만 집회참가자들을 촬영한다 할지라도, 집회참가자에 대한 촬영행위는 집회참가자들에게 심리적 부담으로 작용하여 집회의 자유를 전체적으로 위축시키는 결과를 가져올 수 있으므로 집회의 자유를 침해한다.",3,0,""],["2023-1","헌법",17,"표현의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구 ｢건강기능식품에 관한 법률｣에 따른 심의는 형식적으로 식품의약품안전처장으로부터 위탁받은 한국건강기능식품협회에서 수행하고 있지만, 실질적으로 행정기관인 식품의약품안전처장이 자의로 개입할 가능성이 있어, 건강기능식품 기능성 광고 사전심의는 행정권이 주체가 된 사전심사로서 헌법이 금지하는 사전검열에 해당한다.","인터넷언론사가 선거운동기간 중 당해 홈페이지 게시판 등에 정당･후보자에 대한 지지･반대 등의 정보를 게시하는 경우 실명을 확인받도록 정한 ｢공직선거법｣ 조항은 인터넷언론사를 통한 정보의 특성과 우리나라 선거문화의 현실 등을 고려하고 선거의 공정성 확보를 위한 것으로, 게시판 이용자의 정치적 익명표현의 자유, 개인정보자기결정권 및 인터넷언론사의 언론의 자유를 침해한다고 볼 수 없다.","변호사시험 성적을 합격자에게 공개하지 않도록 규정한 구 ｢변호사시험법｣ 조항은 과잉금지원칙에 위배하여 변호사시험 합격자의 알 권리를 침해한다.","헌법 제21조 제4항은 “언론･출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니 된다.”고 규정하고 있는 바, 이는 언론･출판의 자유에 따르는 책임과 의무를 강조하는 동시에 언론･출판의 자유에 대한 제한의 요건을 명시한 규정으로 볼 것이고, 헌법상 표현의 자유의 보호영역 한계를 설정한 것이라고는 볼 수 없다.",1,0,""],["2023-1","헌법",18,"정치적 기본권에 관한 설명으로 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ ｢국가공무원 복무규정｣ 조항이 금지하는 정치적 주장을 표시 또는 상징하는 행위에서의 ‘정치적 주장’이란 정당 활동이나 선거와 직접적으로 관련되거나 특정 정당과의 밀접한 연계성을 인정할 수 있는 경우 등 정치적 중립성을 훼손할 가능성이 높은 주장에 한정된다고 해석되므로, 명확성원칙에 위배되지 아니한다. ㉡ ｢국가공무원법｣ 제65조 제1항 중 ‘그 밖의 정치단체’에 관한 부분은 명확성원칙에 위배되어 공무원의 정치적 표현의 자유 및 결사의 자유를 침해한다. ㉢ 피성년후견인인 국가공무원은 당연퇴직한다고 규정한 ｢국가 공무원법｣ 조항은 성년후견이 개시되지는 않았으나 동일한 정도의 정신적 장애가 발생한 국가공무원의 경우와 비교할 때 사익의 제한 정도가 과도하여 과잉금지원칙에 위반되므로 공무담임권을 침해한다. ㉣ 금고이상의 선고유예를 받고 그 기간 중에 있는 자를 임용 결격 사유로 삼고 위 사유에 해당하는 자가 임용되더라도 이를 당연무효로 하는 구 ｢국가공무원법｣ 조항은, 입법자의 재량을 일탈하여 공무담임권을 침해한 것이라고 볼 수 없다.","㉠(O) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(O) ㉢(X) ㉣(O)",0,0,""],["2023-1","헌법",19,"청원권에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","수용자가 발송하는 서신이 국가기관에 대한 청원적 성격을 가지고 있는 경우에 교도소장의 허가를 받도록 한 것은, 교도소 수용자가 수용생활 중 부당한 대우를 당하여 국가기관에 이에 대한 조사와 시정을 요구할 목적으로 서신을 보내는 경우 이를 사전에 교도소장의 허가를 받도록 요구하는 것으로 수용자에게 보장된 청원권을 침해하는 것이다.","국회에 청원을 하려고 하는 자는 국회의원의 소개를 얻도록 한 ｢국회법｣ 조항은 행정편의적 목적을 위하여 국민의 청원권 행사를 의원 개인의 판단에 맡겨 놓아 사실상 청원권을 박탈하고 본질적인 내용을 침해하는 것이다.","청원서를 접수한 국가기관은 이를 수리･심사하여 그 결과를 통지하여야 할 헌법에서 유래하는 작위의무를 지고 있고, 이에 상응하여 청원인에게는 청원에 대하여 위와 같은 적정한 처리를 할 것을 요구할 수 있는 권리가 있다.","청원서를 접수한 국가기관은 청원사항을 성실･공정･신속히 심사하고 청원인에게 그 청원을 어떻게 처리하였는지 알 수 있을 정도로 결과통지하여야 하므로, 만일 그 처리내용이 청원인이 기대한 바에 미치지 않는다면 헌법소원의 대상이 되는 공권력의 불행사에 해당한다.",2,0,""],["2023-1","헌법",20,"교육을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","검정고시로 고등학교 졸업학력을 취득한 사람들(검정고시 출신자)의 수시모집 지원을 제한하는 내용의 국립교육대학교 수시모집 입시요강은 검정고시 출신자를 합리적인 이유 없이 차별함으로써 균등하게 교육을 받을 권리를 침해한다.","헌법은 국가의 교육권한과 부모의 교육권의 범주 내에서 학생 에게도 자신의 교육에 관하여 스스로 결정할 권리, 즉 자유롭게 교육을 받을 권리를 부여하고, 학생은 국가의 간섭을 받지 아니하고 자신의 능력과 개성, 적성에 맞는 학교를 자유롭게 선택할 권리를 가진다.","헌법 제31조 제3항의 의무교육 무상의 원칙은 교육을 받을 권리를 보다 실효성 있게 보장하기 위하여 의무교육 비용을 학령아동의 보호자 개개인의 직접적 부담에서 공동체 전체의 부담으로 이전하라는 명령일 뿐, 의무교육의 비용을 오로지 국가 또는 지방자치단체의 예산으로 해결해야 함을 의미하는 것은 아니다.","학교폭력 가해학생에 대해서 수개의 조치를 병과하고 출석정지 기간의 상한을 두지 않은 ｢학교폭력예방 및 대책에 관한 법률｣ 조항은 피해학생의 보호에만 치중하여 가해학생에 대해 무기한 내지 지나치게 장기간의 출석정지조치가 취해지는 경우 가해 학생에게 가혹한 결과가 초래될 수 있어 학교폭력 가해학생의 자유롭게 교육을 받을 권리를 침해한다.",3,0,""],["2023-1","형사법",1,"｢형법｣의 기본개념에 관한 설명 중 가장 적절하지 않은 것은?","형법은 형벌이라는 수단을 통하여 주로 ‘법익을 보호하는 기능’을 하며, ‘법익’이란 법률을 통해 보호할 가치 있는 이익을 의미한다.","형법은 법규범으로 법공동체의 평화를 유지하기 위하여 부과된 것으로서 강제력이 수반되기 때문에 신중하게 규정되어야 한다.","형법은 일반 국민에게 일정한 행위를 금지하거나 일정한 행위를 명령함으로써 행위의 준칙을 제시하는 행위규범이며, 법관을 수명자로 하여 법관에게 형벌권 행사의 한계를 설정함으로써 사법(司法)작용을 규제하는 재판규범이기도 하다.","형법은 보호적 기능과 보장적 기능을 모두 가지며, 어느 한 기능을 강조하면 다른 한 기능도 함께 강화되는 상호 비례 관계에 있다.",3,0,""],["2023-1","형사법",2,"죄형법정주의에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구 ｢정보통신망 이용촉진 및 정보보호 등에 관한 법률｣에서 규정하는 ‘불안감’은 평가적･정서적 판단을 요하는 규범적 구성요건요소이고, ‘불안감’이란 개념이 사전적으로 ‘마음이 편하지 아니하고 조마조마한 느낌’이라고 풀이되고 있어 이를 불명확하다고 볼 수는 없으므로, 위 규정 자체가 죄형법정주의에 반한다고 볼 수 없다.","형벌법규의 위임은 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우로 한정되어야 하며, 이러한 경우에도 위임법률에서 범죄의 구성요건은 처벌 대상행위가 어떠한 것일 것이라고 예측할 수 있을 정도로 구체적으로 정하여야 하며, 형벌의 종류 및 그 상한과 폭을 명백히 규정하여야 한다.","구 ｢근로기준법｣에서 임금･퇴직금 청산기일의 연장합의의 한도에 관하여 아무런 제한을 두고 있지 아니함에도 불구하고, 같은 법 시행령에서 기일연장을 3월 이내로 제한한 것은 죄형법정주의의 원칙에 위배된다.","｢게임산업진흥에 관한 법률｣ 제32조 제1항 제7호의 ‘환전’의 의미를 ‘게임결과물을 수령하고 돈을 교부하는 행위’뿐만 아니라 ‘게임결과물을 교부하고 돈을 수령하는 행위’도 포함되는 것으로 해석하는 것은 죄형법정주의에 위배된다.",3,0,""],["2023-1","형사법",3,"(가)와 (나)에 관한 다음 설명 중 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) (가) 구성요건적 실행행위에 의해 법익의 침해가 발생하여 범죄가 기수에 이르고 범죄행위도 종료되지만 법익침해 상태는 기수 이후에도 존속되는 범죄 (나) 범죄가 기수에 이른 후에도 범죄행위와 법익침해 상태가 범행 종료시까지 계속되는 범죄 ㉠ (가)의 경우 기수 이후 법익침해 상태가 계속되는 시점에도 공범성립이 가능하다. ㉡ (나)의 공소시효는 기수시부터가 아니라 범죄종료시로부터 진행하므로 범죄가 종료한 때로부터 공소시효가 진행된다. ㉢ (가)와 (나)의 경우 정당방위는 기수시까지 가능하다. ㉣ (가)는 범죄의 기수시기와 종료시기가 일치하지만, (나)는 범죄의 기수시기와 종료시기가 일치하지 않고 분리된다.","㉠(O) ㉡(X) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(O) ㉢(X) ㉣(X) (일반공채･101경비단･경행 경채)",2,0,""],["2023-1","형사법",4,"구성요건적 착오에 관한 다음 설명 중 옳고 그름의 표시 (O, X)가 바르게 된 것은? ㉠ 甲이 자신의 아버지 A를 친구 B로 오인하고 B를 살해할 의사로 총을 발포하여 A가 사망한 경우 – ｢형법｣ 제15조 제1항에 따라 보통살인죄가 성립한다. ㉡ 甲이 살해 의사를 가지고 친구 A에게 총을 발포하였으나 빗나가 옆에 있던 친구 B에게 명중하여 사망한 경우 – 법정적 부합설에 의하면 B에 대한 살인죄가 성립한다. ㉢ 사냥을 나온 甲이 어둠 속에서 움직이는 물체를 동료 A로 알고 A를 살해하기 위해 총을 발포하였으나 사실은 A의 사냥개였던 경우 – 구체적 부합설과 법정적 부합설 중 어느 학설에 의하더라도 결론은 같다. ㉣ 甲이 이웃 A를 상해할 의사로 A를 향해 돌을 던졌으나 빗나가서 옆에 있던 A의 개가 맞아 다친 경우 – 구체적 부합설과 법정적 부합설 모두 A에 대한 상해미수죄가 성립한다.","㉠(O) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(X) ㉣(X)",0,0,""],["2023-1","형사법",5,"위법성조각사유에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","A가 甲의 고소로 조사받는 것을 따지기 위하여 야간에 甲의 집에 침입한 상태에서 문을 닫으려는 甲과 열려는 A 사이의 실랑이가 계속되는 과정에서 문짝이 떨어져 그 앞에 있던 A가 넘어져 2주간의 치료를 요하는 타박상을 입게 된 경우, 甲의 행위는 사회통념에 비추어 용인할 수 있는 정도의 것이라고 보기 어렵다.","현역군인이 국군보안사령부의 민간인에 대한 정치사찰을 폭로 한다는 명목으로 군무를 이탈한 행위는 정당방위나 정당행위에 해당하지 아니한다.","노동조합이 주도한 쟁의행위 자체의 정당성과 이를 구성하거나 여기에 부수되는 개개 행위의 정당성은 구별하여야 하므로, 일부 소수의 근로자가 폭력행위 등의 위법행위를 하였더라도, 전체로서의 쟁의행위마저 당연히 위법하게 되는 것은 아니다.","구 ｢공직선거및선거부정방지법｣상 선거비용지출죄는 회계책임자가 아닌 자가 선거비용을 지출한 경우에 성립되는 죄인바, 후보자가 그와 같은 행위가 죄가 되는지 몰랐다고 하더라도 회계책임자가 아닌 후보자가 선거비용을 지출한 이상 회계책임자가 후에 후보자의 선거비용 지출을 추인하였다 하더라도 그 위법성이 조각되지 않는다.",0,0,""],["2023-1","형사법",6,"자구행위에 관한 설명 중 가장 적절하지 않은 것은?","자구행위란 법률에서 정한 절차에 따라서는 청구권을 보전(保全) 할 수 없는 경우에 그 청구권의 실행이 불가능해지거나 현저히 곤란해지는 상황을 피하기 위한 상당한 이유가 있는 행위를 말한다.","자구행위의 경우에도 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때 벌하지 아니하는 ｢형법｣ 제21조 제3항의 규정이 준용된다.","자구행위는 사후적 긴급행위이므로 과거의 침해에 대해서만 가능하다.","자구행위에서 청구권 보전의 불가능이란 시간적․장소적 관계로 국가기관의 구제를 기다릴 여유가 없거나 후일 공적수단에 의한다면 그 실효를 거두지 못할 긴급한 사정이 있는 경우를 말한다.",1,0,""],["2023-1","형사법",7,"책임능력에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니하고, 심신장애로 인하여 위의 능력이 미약한 자의 행위는 형을 감경할 수 있다.","충동조절장애와 같은 성격적 결함은 형의 감면사유인 심신장애에 해당하지 아니하지만 그것이 매우 심각하여 원래의 의미의 정신병을 가진 사람과 동등하다고 평가할 수 있는 경우에는 그로 인한 범행은 심신장애로 인한 범행으로 보아야 한다.","｢형법｣은 책임능력의 평가방법에 있어서 제9조의 형사미성년자는 생물학적 방법을, 제10조의 심신장애인은 ‘심신장애’라는 생물학적 방법과 ‘사물변별능력･의사결정능력’이라는 심리적 방법의 혼합적 방법을 채택하고 있다.","사물을 변별할 능력이나 의사를 결정할 능력은 판단능력 또는 의지능력과 관련된 것으로서 사실의 인식능력이나 기억능력과 반드시 일치하여야 한다.",3,0,""],["2023-1","형사법",8,"강요된 행위에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제12조의 ‘저항할 수 없는 폭력’은 심리적인 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 않을 수 없게 하는 행위와 윤리적 의미에 있어서 강압된 경우를 말한다.","｢형법｣ 제12조의 ‘협박’이란 자기 또는 친족의 생명, 신체에 대한 위해를 달리 막을 방법이 없는 협박을 말한다.","어떤 사람의 성장교육과정을 통하여 형성된 내재적인 관념 내지 확신으로 인하여 행위자 스스로의 의사결정이 사실상 강제되는 결과를 낳게 하는 경우도 ｢형법｣ 제12조의 강요된 행위에 포함된다.","행위자의 강요와 피강요자의 강요된 행위 사이에는 인과관계가 요구되며, 피강요자의 강요된 행위는 적법행위의 기대가능성이 없기 때문에 책임이 조각되어 범죄가 성립하지 않는다.",2,0,""],["2023-1","형사법",9,"실행의 착수에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","소유권이전등기청구권에 대한 압류는 강제집행절차를 위한 일련의 시작행위라고 할 수 있으므로, 허위 채권에 기한 공정증서를 집행권원으로 하여 채무자의 소유권이전등기청구권에 대하여 압류신청을 한 시점에 소송사기의 실행에 착수하였다고 볼 수 있다.","배임죄는 임무에 위배하는 행위를 한다는 점과 이로 인하여 자기 또는 제3자가 이익을 취득하여 본인에게 손해를 가한다는 점에 대한 인식이나 의사를 가지고 임무에 위배한 행위를 개시한 때 실행에 착수하였다고 볼 수 있다.","업무상배임죄에서 부작위를 실행의 착수로 볼 수 있기 위해서는 작위의무가 이행되지 않으면 사무처리의 임무를 부여한 사람이 재산권을 행사할 수 없으리라고 객관적으로 예견되는 등으로 구성요건적 결과 발생의 위험이 구체화한 상황에서 부작위가 이루어져야 하고, 행위자는 부작위 당시 자신에게 주어진 임무를 위반한다는 점과 그 부작위로 인해 손해가 발생할 위험이 있다는 점을 인식하였어야 한다.","甲이 乙로부터 국제우편을 통해 향정신성의약품을 수입하는 경우, 필로폰을 받을 국내 주소를 알려주었으나 乙이 필로폰이 들어 있는 우편물을 발신국의 우체국에 제출하지 않았다고 하더라도 甲의 이러한 행위는 향정신성의약품 수입행위의 실행에 착수하였다고 볼 수 있다.",3,0,""],["2023-1","형사법",10,"공범의 종속성에 관한 설명 중 가장 적절하지 않은 것은?","공범종속성설에 의하면 공범은 정범의 실행행위에 종속해서만 성립할 수 있고, 정범이 적어도 실행의 착수에 이르러야 공범이 성립할 수 있다.","공범종속성설 중 극단적 종속형식에 의하면 정범의 행위가 구성요건에 해당하고 위법하며 유책할 뿐만 아니라 가벌성의 조건(처벌조건)까지 모두 갖추어야 공범이 성립할 수 있다.","공범독립성설에 의하면 공범은 독립된 범죄로서 교사･방조행위가 있으면 정범의 실행행위가 없더라도 공범이 성립할 수 있다.","공범종속성설 중 제한적 종속형식에 의하면 정범의 실행행위가 구성요건에 해당하고 위법하면 공범이 성립할 수 있고 유책할 것을 요하지 않는다는 것으로, 책임무능력자의 위법행위를 교사･방조한 경우에도 공범이 성립할 수 있다.",1,0,""],["2023-1","형사법",11,"교사범과 방조범에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","교사범이란 타인으로 하여금 범죄실행의 결의를 일으키게 하고, 이 결의에 의하여 범죄를 실행하게 함으로써 성립하는 범죄로서 ｢형법｣ 제31조 제1항에 따라 정범과 동일한 형으로 처벌한다.","방조범은 정범의 실행행위를 방조한다는 ‘방조의 고의’와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 ‘정범의 고의’를 갖추어야 하며, 목적범의 경우 정범의 목적에 대한 구체적 내용까지 인식할 것을 요한다.","교사자의 교사행위에도 불구하고 피교사자가 범행을 승낙하지 아니하거나 피교사자의 범행결의가 교사자의 교사행위에 의하여 생긴 것으로 보기 어려운 경우에는 실패한 교사로서 ｢형법｣ 제31조 제3항에 따라 교사자를 예비･음모에 준하여 처벌할 수 있다.","방조범이란 타인의 범죄실행을 방조함으로써 성립하는 범죄이며, ｢형법｣ 제32조 제2항에 따라 방조범의 형은 정범의 형보다 감경한다.",1,0,""],["2023-1","형사법",12,"죄수에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무원이 직무관련자에게 제3자와 계약을 체결하도록 요구하여 계약 체결을 하게 한 행위가 제3자뇌물수수죄의 구성요건과 직권남용권리행사방해죄의 구성요건에 모두 해당하는 경우, 제3자뇌물수수죄와 직권남용권리행사방해죄가 각각 성립하고 양죄는 상상적 경합관계에 있다.","허위공문서작성죄와 동행사죄가 수뢰후 부정처사죄와 각각 상상적 경합관계에 있는 경우, 허위공문서작성죄와 동행사죄 상호간은 실체적 경합범관계에 있다고 할지라도 상상적 경합 범관계에 있는 수뢰후 부정처사죄와 대비하여 가장 중한 죄에 정한 형으로 처단하면 족하다.","수개의 행위가 여러 개의 구성요건을 충족하는 경우에도 포괄 일죄가 될 수 있으므로 횡령, 배임의 행위와 사기의 행위 사이에는 포괄일죄를 구성할 수 있다.","｢형법｣ 제40조가 규정하는 한 개의 행위가 여러 개의 죄에 해당하는 경우에 “가장 무거운 죄에 정한 형으로 처벌한다”란, 여러 개의 죄명 중 가장 무거운 형을 규정한 법조에 의하여 처단한다는 취지와 함께 다른 법조의 최하한의 형보다 가볍게 처단할 수 없다는 취지 즉, 각 법조의 상한과 하한을 모두 중한 형의 범위 내에서 처단한다는 것을 포함한다.",2,0,""],["2023-1","형사법",13,"선고유예･집행유예･가석방에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","집행유예의 선고를 받은 후 그 선고의 실효 또는 취소됨이 없이 유예기간을 경과한 때에는 ｢형법｣ 제65조가 정하는 바에 따라 형의 선고는 효력을 잃는 것이고, 그와 같이 유예기간이 경과 함으로써 형의 선고가 효력을 잃은 후에는 ｢형법｣ 제62조 단행의 사유가 발각되었다고 하더라도 그와 같은 이유로 집행유예를 취소할 수 없고 그대로 유예기간 경과의 효과가 발생한다.","1년 이하의 징역이나 금고, 자격정지, 벌금 또는 구류의 형을 선고할 경우에 ｢형법｣ 제51조의 사항을 고려하여 뉘우치는 정상이 뚜렷할 때에는 그 형의 선고를 유예할 수 있지만, 자격정지 이상의 형을 받은 전과가 있는 사람에 대해서는 그러하지 아니하다.","｢형법｣ 제62조의2의 규정에 의하여 보호관찰이나 사회봉사 또는 수강을 명한 집행유예를 받은 자가 준수사항이나 명령을 위반한 경우에 그 위반사실이 동시에 범죄행위로 되더라도 그 기소나 재판의 확정 여부 등 형사절차와는 별도로 법원이 ｢보호관찰 등에 관한 법률｣에 의한 검사의 청구에 의하여 ｢형법｣ 제64조 제2항에 규정된 집행유예 취소의 요건에 해당하는가를 심리하여 준수 사항이나 명령 위반사실이 인정되고 위반의 정도가 무거운 때에는 집행유예를 취소할 수 있다.","｢형법｣에 의하면 징역이나 금고의 집행 중에 있는 사람이 행상(行狀)이 양호하여 뉘우침이 뚜렷한 때에는 무기형은 20년, 유기형은 형기의 3분의 1이 지난 후 행정처분으로 가석방을 할 수 있다. 벌금･과료가 병과되어 있는 때에는 그 금액을 완납 하여야 하며, 벌금이나 과료에 관한 노역장 유치기간에 산입된 판결선고 전 구금일수는 그에 해당하는 금액이 납입된 것으로 본다.",1,0,""],["2023-1","형사법",14,"살인 및 폭행･상해의 죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","살인예비죄가 성립하기 위하여는 살인죄를 범할 목적 외에도 살인의 준비에 관한 고의가 있어야 한다.","자살의 의미를 이해할 능력이 없고 자신의 말은 무엇이나 복종하는 어린 자식을 권유하여 익사하게 하였다면, 물속에 직접 밀어서 빠뜨린 것이 아니더라도 ｢형법｣ 제253조의 위계에 의한 살인죄가 성립한다.","시간적 차이가 있는 2인 이상의 독립된 상해행위가 경합하여 사망의결과가일어난 경우에 그 원인된 행위가 판명되지 아니한 때에는 공동정범의 예에 의하여야 한다.","단순폭행, 존속폭행의 범행이 동일한 폭행 습벽의 발현에 의한 것으로 인정되어 상습존속폭행죄로 처벌되는 경우 피해자의 명시한 의사에 반하여도 공소를 제기할 수 있다.",1,0,""],["2023-1","형사법",15,"체포･감금 및 약취･유인의 죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","미국인이 프랑스에서 일본인 미성년자를 약취한 경우, 우리 형법을 적용할 수는 없다.","체포 행위가 확실히 사람의 신체의 자유를 구속하는 정도로 계속되지 못하고 일시적인 것에 그쳤다고 하여도 체포죄의 미수가 아닌 기수에 이른 것으로 보아야 한다.","미성년자와 부모가 함께 거주하는 주거에 침입하여 부모만을 강제로 퇴거시키고 미성년자와 독자적인 생활관계를 형성하기에 이르렀다면, 비록 장소적 이전이 없었다 할지라도 ｢형법｣ 제287조의 미성년자약취죄에 해당한다.","미성년자를 유인한 자가 계속하여 미성년자를 불법하게 감금한 경우, 감금죄만 성립하고 미성년자유인죄는 이에 흡수된다.",2,0,""],["2023-1","형사법",16,"명예훼손의 죄에 관한 설명 중 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ ｢형법｣ 제307조 제1항의 ‘사실’은 제2항의 ‘허위의 사실’과 반대되는 ‘진실한 사실’을 말하며, 가치판단이나 평가를 내용으로 하는 ‘의견’에 대치되는 개념은 아니다. ㉡ 공연성의 존부는 발언자와 상대방 또는 피해자 사이의 관계나 지위, 대화를 하게 된 경위와 상황, 사실적시의 내용, 적시의 방법과 장소 등 행위 당시의 객관적 제반 사정으로부터 상대방이 불특정 또는 다수인에게 전파할 가능성이 있는지 여부를 검토하여 종합적으로 판단하여야 하며, 발언 후 실제 전파 여부라는 우연한 사정은 공연성 인정 여부를 판단함에 있어 소극적 사정으로만 고려되어야 한다. ㉢ ｢형법｣ 제310조의 ‘공공의 이익’이라 함은 널리 국가･사회 기타 일반 다수인의 이익에 관한 것뿐만 아니라 특정한 사회집단이나 그 구성원의 관심과 이익에 관한 것도 포함한다. ㉣ ｢형법｣ 제309조 제1항의 ‘사람을 비방할 목적’은 제310조의 ‘공공의 이익’을 위한 것과는 행위자의 주관적 의도의 방향에 있어 서로 상반되는 관계에 있으므로, 적시한 사실이 공공의 이익에 관한 것인 경우 특별한 사정이 없는 한 비방할 목적은 부인된다.","1개","2개","3개","4개",0,0,""],["2023-1","형사법",17,"주거침입의 죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","관리자가 일정한 토지와 외부의 경계에 인적 또는 물적 설비를 갖추고 외부인의 출입을 제한하고 있다면 그 토지에 인접하여 건조물로서의 요건을 갖춘 구조물이 존재하지 않더라도 이러한 토지는 건조물침입죄의 객체인 위요지에 해당한다.","다가구용 단독주택이나 다세대주택･연립주택･아파트와 같은 공동주택 내부의 엘리베이터, 공용 계단, 복도 등 공용 부분도 그 거주자들의 사실상 주거의 평온을 보호할 필요성이 있으므로 주거침입죄의 객체인 ‘사람의 주거’에 해당한다.","범죄의 목적으로 일반인의 출입이 허용된 음식점에 영업주의 승낙을 받아 통상적인 출입방법으로 들어간 경우, 특별한 사정이 없는 한 주거침입죄의 침입행위에 해당하지 않는다.","공동거주자 중 한 사람이 법률적인 근거 기타 정당한 이유 없이 다른 공동거주자가 공동생활의 장소에 출입하는 것을 금지한 경우, 다른 공동거주자가 이에 대항하여 공동생활의 장소에 들어갔더라도 주거침입죄는 성립하지 않는다.",0,0,""],["2023-1","형사법",18,"재산죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲과 乙이 공동으로 생강밭을 경작하여 그 이익을 분배하기로 약정하고 생강 농사를 시작하였으나, 곧바로 동업 관계에 불화가 생겨 乙이 묵시적으로 동업 탈퇴의 의사표시를 한 채 생강밭에 나오지 않자, 그때부터 甲이 혼자 생강밭을 경작하고 수확하여 생강을 반출한 경우, 甲의 행위는 절도죄를 구성한다.","절도죄의 성립에 필요한 불법영득의 의사는 물건의 가치만을 영득할 의사만으로는 부족하고, 재물의 소유권 또는 이에 준하는 본권을 영구적으로 보유할 의사를 필요로 한다.","횡령범인이 위탁자가 소유자를 위해 보관하고 있는 물건을 위탁자로부터 보관받아 이를 횡령한 경우, 범인과 피해물건의 소유자 사이에 친족관계가 있으면 범인과 위탁자 사이에 친족 관계가 없더라도 친족상도례가 적용된다.","재산범죄를 저지른 이후에 별도의 재산범죄의 구성요건에 해당하는 사후행위가 있었다면 비록 그 행위가 불가벌적 사후 행위로서 처벌의 대상이 되지 않는다 할지라도 그 사후행위로 인하여 취득한 물건은 재산범죄로 인하여 취득한 물건으로서 장물이 될 수 있다.",3,0,""],["2023-1","형사법",19,"절도 및 강도의 죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","주거침입이 주간에 이루어졌더라도 야간에 절취행위를 하였다면 야간주거침입절도죄가 성립한다.","절도 습벽의 발현으로 절도, 야간주거침입절도, 특수절도, 자동차등불법사용의 범행을 함께 저지른 경우, 자동차등불법 사용의 범행은 상습절도죄에 흡수되지 않고 자동차불법사용죄가 따로 성립한다.","절도범인이 처음에는 흉기를 휴대하지 아니하였으나, 체포를 면탈할 목적으로 폭행 또는 협박을 가할 때에 비로소 흉기를 휴대･사용하게 된 경우에는 ｢형법｣ 제334조의 예에 의한 준강도 (특수강도의 준강도)가 된다.","강도살인죄의 주체인 ‘강도’에는 준강도죄의 강도범인이 포함 되지 않는다.",2,0,""],["2023-1","형사법",20,"사기죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢민법｣ 제746조의 불법원인급여에 해당하여 급여자가 수익자에 대한 반환청구권을 행사할 수 없다면, 수익자가 기망을 통하여 급여자로 하여금 불법원인급여에 해당하는 재물을 제공하도록 하였더라도 사기죄를 구성하지 않는다.","甲이 A에 대한 사기범행을 실현하는 수단으로서 사기의 고의가 없는 B를 기망하여 그를 A로부터 편취한 재물이나 재산상 이익을 전달하는 도구로서만 이용한 경우, 편취의 대상인 재물 또는 재산상 이익에 관하여 A에 대한 사기죄가 성립할 뿐, 도구로 이용된 B에 대한 사기죄는 별도로 성립하지 않는다.","사기죄가 성립하기 위해서는 적극적 기망행위가 있어야 하므로 부작위에 의한 기망은 있을 수 없다.","사기죄의 ‘처분행위’라 함은 재산적 처분행위로서 피해자가 자유의사로 직접 재산상 손해를 초래하는 작위에 나아가는 것을 말하므로, 피해자가 기망에 의하여 착오에 빠진 결과 채권의 존재를 알지 못하여 채권을 행사하지 아니한 것에 불과하다면 그와 같은 부작위는 재산의 처분행위에 해당하지 않는다.",1,0,""],["2023-1","형사법",21,"배임의 죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","채무자가 금전채무를 담보하기 위해 주식에 관하여 양도담보 설정계약을 체결한 후 변제일 전에 제3자에게 해당 주식을 처분하더라도 배임죄는 성립하지 않는다.","권리이전에 등록을 요하는 자동차에 대한 매매계약에서 매도인은 매수인의 사무를 처리하는 자의 지위에 있지 않으므로, 매도인이 매수인에게 소유권이전등록을 하지 아니하고 그 자동차를 제3자에게 처분하였다고 하더라도 배임죄는 성립하지 않는다.","배임수재죄의 주체로서 ‘타인의 사무를 처리하는 자’라 함은 타인과의 대내관계에 있어서 신의성실의 원칙에 비추어 그 사무를 처리할 신임관계가 존재한다고 인정되는 자를 의미하고, 반드시 제3자에 대한 대외관계에서 그 사무에 관한 권한이 존재할 것을 요하지는 않는다.","서면으로 부동산 증여의 의사를 표시한 증여자가 증여계약을 취소하거나 해제할 수 없음에도 불구하고 증여계약에 따라 수증자에게 부동산의 소유권을 이전하지 않고 부동산을 제3자에게 처분하여 등기를 한 경우, 증여자의 소유권이전등기의무는 증여자 자신의 사무일 뿐 타인의 사무에 해당하지 않으므로 배임죄가 성립하지 않는다.",3,0,""],["2023-1","형사법",22,"손괴 및 권리행사방해의 죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","소유자의 의사에 따라 어느 장소에 게시 중인 문서를 소유자의 의사에 반하여 떼어내는 것과 같이 소유자의 의사에 따라 형성된 종래의 이용상태를 변경시켜 종래의 상태에 따른 이용을 일시적으로불가능하게하는경우에도문서손괴죄가성립할수있다.","다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용･수익 하는 행위는 소유자를 배제한 채 물건의 이용가치를 영득하는 것이고, 그 때문에 소유자가 물건의 효용을 누리지 못하게 되었다면 그 효용 자체가 침해된 것으로 볼 수 있어 재물손괴죄를 구성한다.","물건의 소유자가 아닌 甲은 ｢형법｣ 제33조 본문에 따라 권리 행사방해 범행에 가담한 경우에 한하여 권리행사방해죄의 공범이 될 수 있을 뿐이며, 甲과 함께 권리행사방해죄의 공동정범으로 기소된 물건의 소유자 乙에게 고의가 없어 범죄가 성립하지 않는다면 甲에게 공동정범이 성립할 여지가 없다.","가압류 후에 목적물의 소유권을 취득한 제3취득자가 다른 사람에 대한 허위의 채무에 기하여 근저당권설정등기를 경료하더라도 강제집행면탈죄를 구성하지 않는다.",1,0,""],["2023-1","형사법",23,"방화의 죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","공용건조물방화죄를 범할 목적으로 예비･음모한 후 목적한 죄의 실행에 이른 후에 수사기관에 자수한 경우 형을 감경하거나 면제할 수 있다.","주거로 사용하지 않고 사람이 현존하지도 않는 타인 소유의 자동차를 불태웠으나 공공의 위험이 발생하지 않았다면 방화죄를 구성하지 않는다.","甲이 A의 재물을 강취한 후 A를 살해할 의사로 현주건조물에 방화하여 A가 사망한 경우, 甲의 행위는 강도살인죄와 현주 건조물방화치사죄에 모두 해당하고 그 두 죄는 실체적 경합범 관계에 있다.","甲이 A를 살해할 의사로 A가 혼자 있는 건조물에 방화하였으나 A가 사망하지 않은 경우 현존건조물방화치사미수죄를 구성한다.",0,0,""],["2023-1","형사법",24,"통화 및 유가증권의 죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","위조통화를 행사하여 재물을 취득한 경우 위조통화행사죄와 사기죄가 성립하고 양죄는 상상적 경합관계에 있다.","위조유가증권행사죄에 있어서의 유가증권에는 원본뿐만 아니라 사본도 포함된다.","통화위조죄에서의 ‘행사할 목적’이란 위조한 통화를 진정한 통화로서 유통에 놓겠다는 목적을 말하므로, 자신의 신용력을 증명하기 위하여 타인에게 보일 목적으로 통화를 위조한 경우에는 행사할 목적이 있다고 할 수 없다.","유가증권의 내용 중 권한 없는 자에 의하여 이미 변조된 부분을 다시 권한 없이 변경한 경우 유가증권변조죄를 구성한다.",2,0,""],["2023-1","형사법",25,"문서의 죄에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 주식회사의 대표이사로부터 포괄적인 권한 행사를 위임받은 사람은 주식회사 명의의 문서 작성에 관하여 개별적･구체 적으로 위임 또는 승낙을 받지 않더라도 주식회사 명의로 문서를 작성할 수 있으므로, 이를 두고 자격모용사문서작성 또는 위조에 해당하는 것으로 볼 수는 없다. ㉡ 위조사문서의 행사는 상대방으로 하여금 위조된 문서를 인식 할 수 있는 상태에 둠으로써 기수가 되고 상대방이 실제로 그 내용을 인식하여야 하는 것은 아니므로, 위조된 문서를 우송한 경우에는 그 문서가 상대방에게 도달한 때에 기수가 되고 상대방이 실제로 그 문서를 보아야 하는 것은 아니다. ㉢ 공문서의 작성권한이 있는 A의 직무를 보좌하는 공무원 甲이 비공무원 乙과 공모하여 행사할 목적으로 허위의 내용이 기재된 문서 초안을 그 정을 모르는 A에게 제출하여 결재 하도록 하는 방법으로 허위의 공문서를 작성하게 한 경우, 甲은 허위공문서작성죄의 간접정범이 될 수 있지만 공무원의 신분이 없는 乙은 간접정범의 공범이 될 수 없다. ㉣ 주식회사의 발기인 등이 법령에 정한 회사설립의 요건과 절차에 따라 회사설립등기를 함으로써 회사가 성립하였다고 볼 수 있는 경우, 회사를 설립할 당시 회사를 실제로 운영할 의사 없이 회사를 이용한 범죄 의도나 목적이 있었다는 이유만으로는 공정증서원본 불실기재죄에서 말하는 불실의 사실을 법인등기부에 기록하게 한 것으로 볼 수 없다.","㉠㉡","㉠㉢","㉡㉣","㉢㉣",2,0,""],["2023-1","형사법",26,"공무방해의 죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제136조에서 정한 공무집행방해죄는 직무를 집행하는 공무원에 대하여 폭행 또는 협박한 경우에 성립하는 범죄로서, 구체적으로 직무집행의 방해라는 결과가 발생할 것을 요하지는 않는다.","공용서류등무효죄의 ‘공무소에서 사용하는 서류 기타 전자기록’ 에는 공문서로서의 효력이 생기기 이전의 서류, 정식의 접수 및 결재 절차를 거치지 않은 문서, 결재 상신 과정에서 반려된 문서도 포함된다.","타인의 소변을 마치 자신의 소변인 것처럼 수사기관에 건네주어 필로폰 음성반응이 나오게 한 경우, 수사기관의 착오를 이용하여 적극적으로 피의사실에 관한 증거를 조작한 것이므로 위계에 의한 공무집행방해죄를 구성한다.","공무상표시무효죄는 공무원이 그 직무에 관하여 실시한 봉인 또는 압류 기타 강제처분의 표시를 적극적으로 손상･은닉하거나 기타 방법으로 그 효용을 해하는 것을 요건으로 하므로, 부작위에 의한 방법으로는 공무상표시무효죄를 범할 수 없다.",3,0,""],["2023-1","형사법",27,"다음 설명 중 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 범죄 또는 징계사유의 성립 여부에 관한 것뿐만 아니라 형 또는 징계의 경중에 영향을 미치는 정상을 인정하는 데 도움이 될 자료까지도 증거위조죄에서 규정한 ‘증거’에 포함된다. ㉡ 자신이 직접 형사처분을 받게 될 것을 두려워한 나머지 자기의 이익을 위하여 그 증거가 될 자료를 은닉하였다면 증거은닉죄에 해당하지 않고, 제3자와 공동하여 그러한 행위를 하였더라도 마찬가지이다. ㉢ 모해위증죄에 있어서 甲이 A를 모해할 목적으로 그러한 목적이 없는 乙에게 위증을 교사한 경우, 공범종속성에 관한 일반 규정인 ｢형법｣ 제31조 제1항이 공범과 신분에 관한 ｢형법｣ 제33조 단서에 우선하여 적용되므로 신분이 있는 甲이 신분이 없는 乙보다 무겁게 처벌된다. ㉣ 甲이 자기 자신을 무고하기로 乙과 공모하고 공동의 의사에 따라 乙과 함께 자신을 무고한 경우, 甲과 乙은 무고죄의 공동정범으로서의 죄책을 진다.","㉠(O) ㉡(O) ㉢(O) ㉣(X)","㉠(O) ㉡(O) ㉢(X) ㉣(X)","㉠(X) ㉡(O) ㉢(O) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(O)",1,0,""],["2023-1","형사법",28,"불심검문에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","경찰관이 불심검문 대상자 해당 여부를 판단할 때에는 불심검문 당시의 구체적 상황은 물론 사전에 얻은 정보나 전문적 지식 등에 기초하여 그 대상자인지를 객관적･합리적 기준에 따라 판단하여야 하므로, 불심검문의 적법요건으로 불심검문 대상자에게 ｢형사소송법｣상체포나구속에이를정도의혐의가있을것을요한다.","행정경찰 목적의 경찰활동으로 행하여지는 ｢경찰관 직무집행법｣ 제3조 제2항 소정의 질문을 위한 동행요구가 ｢형사소송법｣의 규율을 받는 수사로 이어지는 경우에는 ｢형사소송법｣ 제199조 제1항 및 제200조 규정에 의하여야 한다.","｢경찰관 직무집행법｣ 제3조 제4항은 경찰관이 불심검문을 하고자 할 때에는 자신의 신분을 표시하는 증표를 제시하여야 한다고 규정하고 있고, 동법 시행령은 위 법에서 규정한 신분을 표시하는 증표가 경찰관의 공무원증이라고 규정하고 있으므로, 경찰관이 불심검문 과정에서 공무원증을 제시하지 않았다면 어떠한 경우라도 그 불심검문은 위법한 공무집행에 해당한다.","｢경찰관 직무집행법｣ 제3조 제6항은 불심검문에 관하여 임의 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정하고 있으므로, 대상자를 6시간 동안 경찰관서에 구금하는 것이 허용된다.",1,0,""],["2023-1","형사법",29,"수사에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","누구든지 자기의 얼굴 기타 모습을 함부로 촬영당하지 않을 자유를 가지므로, 수사기관이 범죄를 수사함에 있어 타인의 얼굴 기타 모습을 영장 없이 촬영하였다면, 그 촬영은 어떠한 경우라도 허용될 수 없다.","음주운전에 대한 수사과정에서 음주운전 혐의가 있는 운전자에 대하여 ｢도로교통법｣에 따른 호흡측정이 이루어진 경우 과학적이고 중립적인 호흡측정 수치가 도출되었다 하여도 그 결과에 오류가 있다고 인정할 만한 객관적이고 합리적인 사정이 있는 경우라면 추가로 음주측정을 할 필요성이 있으므로, 경찰관이 혐의를 제대로 밝히기 위해 혈액채취에 의한 측정방법으로 재측정하는 것을 위법하다 할 수 없고 운전자는 이에 따라야 할 의무가 있다.","위법한 체포상태에서 마약 투약 혐의를 확인하기 위한 채뇨 요구가 이루어진 경우, 채뇨 요구를 위한 위법한 체포와 그에 이은 채뇨 요구는 마약 투약이라는 범죄행위에 대한 증거수집을 위하여 연속하여 이루어진 것으로서 개별적으로 그 적법 여부를 평가하는 것은 적절하지 아니하므로 그 일련의 과정을 전체적으로 보아 위법한 채뇨 요구가 있었던 것으로 보아야 한다.","｢경범죄 처벌법｣ 제3조 제1항 제34호의 지문채취 불응 시 처벌규정은 영장주의에 따른 강제처분을 규정한 것으로, 수사상 필요에 의하여 수사기관이 직접강제에 의하여 지문을 채취하려 하는 경우와 마찬가지로 법관에 의해 발부된 영장이 필요하다.",2,0,""],["2023-1","형사법",30,"영장주의에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 甲 주식회사에서 압수수색영장을 집행하면서 甲 회사에 팩스로 영장 사본을 송신하기만 하고 영장 원본을 제시하거나 압수조서와 압수물 목록을 작성하여 피압수･수색 당사자에게 교부하지도 않은 채 피고인의 이메일을 압수한 후 이를 증거로 제출한 사안에서, 위와 같은 방법으로 압수된 이메일은 ｢형사 소송법｣ 등에서 정한 절차를 위반한 것으로 유죄 인정의 증거로 사용할 수 없다.","법원이 피고인에 대하여 구속영장을 발부하기 전에 ｢형사소송법｣ 제72조에서 규정한 절차를 거치지 아니하였다 하더라도 같은 규정에 따른 절차적 권리가 실질적으로 보장되었다면, 위 사전 청문절차를 거치지 않은 것만으로 그 구속영장 발부결정이 위법하다고 볼 것은 아니다.","｢형사소송법｣ 제88조는 “피고인을 구속한 때에는 즉시 공소사실의 요지와 변호인을 선임할 수 있음을 알려야 한다”고 규정하고 있는바, 이는 사후 청문절차에 관한 규정으로서 이를 위반한 경우 구속영장의 효력에 어떠한 영향을 미치는 것은 아니다.","｢형사소송법｣ 제217조 제2항, 제3항에 위반하여 압수수색영장을 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없지만, 피고인이나 변호인이 이를 증거로 함에 동의하였다면 유죄 인정의 증거로 사용할 수 있다.",3,0,""],["2023-1","형사법",31,"현행범인의 체포에 관한 다음 설명 중 옳고 그름의 표시 (O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 사인의 현행범 체포과정에서 일어날 수 있는 물리적 충돌이 적정한 한계를 벗어났는지 여부는 그 행위가 소극적인 방어행위인가 적극적인 공격행위인가에 따라 결정된다. ㉡ ｢형사소송법｣ 제211조 제1항이 현행범인으로 규정한 ‘범죄를 실행하고 난 직후의 사람’이라고 함은, 범죄의 실행행위를 종료한 직후의 범인이라는 것이 체포하는 자의 입장에서 볼 때 명백한 경우를 일컫는 것으로서, ‘범죄의 실행행위를 종료한 직후’라고 함은, 범죄행위를 실행하여 끝마친 순간 또는 이에 아주 접착된 시간적 단계를 의미하는 것으로 해석된다. ㉢ 현행범인은 누구든지 영장없이 체포할 수 있고, 검사 또는 사법경찰관리가 아닌 자가 현행범인을 체포한 때에는 즉시 검사 등에게 인도하여야 하며, 이때 인도시점은 반드시 체포시점과 시간적으로 밀착된 시점이어야 한다. ㉣ 공장을 점거하여 농성 중이던 조합원들이 경찰과 부식반입 문제를 협의하거나 기자회견장 촬영을 위해 공장 밖으로 나오자, 전투경찰대원들은 ‘고착관리’라는 명목으로 그 조합원들을 방패로 에워싸고 이동하지 못하게 한 사안에서, 위 조합원들이 어떠한 범죄행위를 목전에서 저지르려고 하는 등 긴급한 사정이 있는 경우가 아니라면, 위 전투경찰대원들의 행위는 ｢형사소송법｣상 체포에 해당한다.","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(X) ㉣(O)",3,0,""],["2023-1","형사법",32,"접견교통권에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","변호인의 접견교통의 상대방인 신체구속을 당한 사람이 그 변호인을 자신의 범죄행위에 공범으로 가담시키려고 하였다는 등의 사정만으로 그 변호인의 신체구속을 당한 사람과의 접견교통을 금지하는 것이 정당화될 수는 없다.","｢형사소송법｣ 제34조에 따르면 변호인 또는 변호인이 되려는 자는 신체구속을 당한 피고인 또는 피의자와 접견하고 서류 또는 물건을 수수할 수 있으며 의사로 하여금 진료하게 할 수 있으므로, 변호인이 되려는 의사를 표시한 자가 객관적으로 변호인이 될 가능성이 있다고 인정된다면, 신체구속을 당한 피고인 또는 피의자와 접견하지 못하도록 제한해서는 안된다.","변호인의 구속된 피고인 또는 피의자와의 접견교통권은 피고인 또는 피의자 자신이 가지는 변호인과의 접견교통권과는 성질을 달리하는 것으로서 헌법상 보장된 권리라고 할 수 없으므로, 수사기관의 처분 등에 의하여 이를 제한할 수 있으며 반드시 법령에 의하여서만 제한 가능한 것은 아니다.","변호인의 조력을 받을 권리를 보장하는 목적은 피의자 또는 피고인의 방어권 행사를 보장하기 위한 것이므로, 변호인의 조력을 받을 기회가 충분히 보장되었다고 인정될 수 있는 경 우에는 미결수용자 또는 변호인이 원하는 특정한 시점에 접견이 이루어지지 못하였다 하더라도 그것만으로 곧바로 변호인의 조력을 받을 권리가 침해되었다고 단정할 수는 없다.",2,0,""],["2023-1","형사법",33,"저장매체의 임의제출에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","임의제출된 정보저장매체에서 압수의 대상이 되는 전자정보의 범위를 넘어서는 전자정보에 대해 수사기관이 영장 없이 압수･ 수색하여 취득한 증거는 위법수집증거에 해당하지만, 피고인이나 변호인이 이를 증거로 함에 동의하였다면 그 위법성이 치유된다.","제3자가 피의자의 소유･관리에 속하는 정보저장매체를 영장에 의하지 않고 임의제출하는 경우, 특별한 사정이 없는 한 피의자에게 참여권을 보장하고 압수한 전자정보 목록을 교부하는 등 피의자의 절차적 권리를 보장하기 위한 적절한 조치가 이루어져야 한다.","피의자가 자기 소유의 휴대전화를 임의제출하면서 클라우드 등 제3자가 관리하는 원격지에 저장되어 있는 전자정보를 수사기관에게 제출한다는 의사로 수사기관에 클라우드 등에 접속하기 위한 자신의 아이디와 비밀번호를 임의로 제공한 경우, 위 클라우드 등에 저장된 전자정보를 임의제출하는 것으로 볼 수 있다.","현행범 체포현장이나 범죄현장에서도 소지자 등이 임의로 제출하는 저장매체는 ｢형사소송법｣ 제218조에 의하여 영장 없이 압수하는 것이 허용된다.",0,0,""],["2023-1","형사법",34,"증명의 대상과 방법에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제6조 단서에 따라 “행위지의 법률에 의하여 범죄를 구성”하는가 여부는 법원의 직권조사사항이므로 증명의 대상이 될 수 없다.","출입국사범 사건에서 지방출입국･외국인관서의 장의 적법한 고발이 있었는지 여부가 문제 되는 경우에 법원은 증거조사의 방법이나 증거능력의 제한을 받지 아니하고 제반 사정을 종합하여 적당하다고 인정되는 방법에 의하여 자유로운 증명으로 그 고발 유무를 판단하면 된다.","공동정범에 있어 공모관계를 인정하기 위해서는 엄격한 증명이 요구되지만, 피고인이 범죄의 주관적 요소인 공모관계를 부인하는 경우에는 사물의 성질상 이와 상당한 관련성이 있는 간접사실 또는 정황사실을 증명하는 방법으로 이를 증명할 수밖에 없다.","｢형사소송법｣ 제313조 제1항 단서의 특신상태는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장･ 입증하여야 하는 것이지만, 이는 소송상의 사실에 관한 것이므로, 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다.",0,0,""],["2023-1","형사법",35,"위법수집증거배제법칙에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 사기죄의 증거인 업무일지가 피고인의 사생활 영역과 관계된 자유로운 인격권의 발현물이라고 볼 수 없고 피고인을 형사소추하기 위해서는 이 사건 업무일지가 반드시 필요한 증거라 하더라도, 그것이 제3자에 의하여 절취된 것으로서 피해자측이 이를 수사기관에 증거자료로 제출하기 위하여 대가를 지급하였다면, 위 업무일지는 위법수집증거로서 증거로 사용할 수 없다. ㉡ 사법경찰관이 체포 당시 외국인인 피고인에게 영사통보권을 지체 없이 고지하지 않았다면 피고인에게 영사조력이 가능한지 여부나 실질적인 불이익이 있었는지 여부와 상관없이 국제 협약에 따른 피고인의 권리나 법익을 본질적으로 침해하였다고 볼 수 있으므로, 체포나 구속 이후 수집된 증거와 이에 기초한 증거들은 유죄인정의 증거로 사용할 수 없다. ㉢ 특별한 사정이 존재하지 아니하는 이상 피고인에게 실질적 반대신문권의 기회가 부여되지 아니한 채 이루어진 증인의 법정진술은 위법한 증거로서 증거능력을 인정하기 어렵지만, 피고인의 책문권 포기로 그 하자가 치유될 수 있고, 이 경우 피고인의 책문권 포기의 의사는 명시적인 것이어야 한다. ㉣ 검사가 공소제기 후 ｢형사소송법｣ 제215조에 따라 수소법원 이외의 지방법원 판사에게 청구하여 발부받은 영장에 의하여 압수･수색을 하였다면, 그와 같이 수집된 증거는 적법한 절차에 따른 것으로서 원칙적으로 유죄의 증거로 삼을 수 있다.","1개","2개","3개","4개",0,0,""],["2023-1","형사법",36,"자백의 증거능력과 증명력에 관한 다음 설명 중 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 피고인이 범행을 자인하는 것을 들었다는 피고인 아닌 자의 진술내용은 ｢형사소송법｣ 제310조의 피고인의 자백에 포함되며, 자백을 자백으로 보강할 수 없다는 법리에 따라 그 진술내용을 피고인의 자백의 보강증거로 할 수 없다. ㉡ 일정한 증거가 발견되면 피의자가 자백하겠다고 한 약속이 검사의 강요나 위계에 의하여 이루어졌다던가 또는 불기소나 경한 죄의 소추 등 이익과 교환조건으로 된 것으로 인정되지 않는다면 위와 같은 자백의 약속하에 된 자백이라 하여 곧 임의성 없는 자백으로 증거능력이 부정된다고 단정할 수 없다. ㉢ 상습범은 피고인의 습벽을 구성요건으로 하는 범죄로서 상습범에 있어 피고인의 자백이 있는 경우, 이를 구성하는 각 행위에 관하여 개별적으로 보강증거를 필요로 하는 것은 아니다. ㉣ 자백에 대한 보강증거는 범죄사실의 전부 또는 중요 부분을 인정할 수 있는 정도가 되지 아니하더라도 피고인의 자백이 가공적인 것이 아닌 진실한 것임을 인정할 수 있는 정도만 되면 족할 뿐만 아니라, 직접증거가 아닌 간접증거나 정황증거도 보강증거가 될 수 있다.","㉠(X) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(X)","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)",0,0,""],["2023-1","형사법",37,"전문증거에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","제1심에서 피고인에 대하여 무죄판결이 선고되어 검사가 항소한 후, 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 않는 한 증거능력이 없지만, 위 참고인이 법정에 증인으로 출석하여 위 진술조서의 진정성립을 인정하고 피고인측에 반대신문의 기회가 부여된다면 예외적으로 증거능력이 인정된다.","피고인의 진술을 피고인 아닌 자가 녹음한 경우 피고인이 해당 녹음테이프를 증거로 할 수 있음에 동의하지 않은 이상 녹음 테이프에 녹음된 피고인의 진술 내용을 증거로 사용하기 위해서는 ｢형사소송법｣ 제313조 제1항 단서에 따라 공판준비 또는 공판 기일에서 진술자인 피고인의 진술에 의하여 녹음테이프에 녹음된 진술 내용이 자신이 진술한 대로 녹음된 것임이 증명되고 나아가 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 것임이 인정되어야 한다.","피고인이 아닌 자가 수사과정에서 진술서를 작성하였지만 수사기관이 그에 대한 조사과정을 기록하지 아니하여 ｢형사소송법｣ 제244조의4 제3항, 제1항에서 정한 절차를 위반한 경우에는, 특별한 사정이 없는 한 ‘적법한 절차와 방식’에 따라 수사과정에서 진술서가 작성되었다 할 수 없으므로 증거능력을 인정할 수 없다.","｢형사소송법｣ 제316조 제2항에 의하면, ‘피고인 아닌 자’의 공판준비 또는 공판기일에서의 진술이 피고인 아닌 타인의 진술을 그 내용으로 하는 것인 때에는 원진술자가 사망, 질병 기타 사유로 인하여 진술할 수 없고 그 진술이 특히 신빙할 수 있는 상태 하에서 행하여진 때에 한하여 이를 증거로 할 수 있다고 규정하고 있는데, 여기서 말하는 ‘피고인 아닌 자’라고 함은 공동피고인이나 공범자를 제외한 제3자를 의미한다.",2,0,""],["2023-1","형사법",38,"｢형사소송법｣ 제314조의 증거능력 인정요건에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣ 제314조의 특신상태의 증명은 참고인의 진술 또는 조서의 작성이 특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 개연성 있는 정도의 증명으로 족하고, 법관으로 하여금 반드시 합리적인 의심의 여지를 배제할 정도에 이르러야 하는 것은 아니다.","｢형사소송법｣ 제314조의 ‘특신상태’와 관련된 법리는 마찬가지로 원진술자의 소재불명 등을 전제로 하고 있는 ｢형사소송법｣ 제316조 제2항의 ‘특신상태’에 관한 해석에도 그대로 적용된다.","｢형사소송법｣ 제314조에서 말하는 ‘원진술자가 진술을 할 수 없는 때’에는 사망, 질병 등 명시적으로 열거된 사유 외에도, 원진술자가 공판정에서 진술을 한 경우라도 증인신문 당시 일정한 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 그 진술의 일부가 재현 불가능하게 된 경우도 포함한다.","수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 ｢형사소송법｣ 제314조의‘그 밖에 이에준하는 사유로인하여 진술할수 없는 때’에 해당하지 않는다고 보아야 한다.",0,0,""],["2023-1","형사법",39,"증거동의에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사소송법｣ 제318조 제1항 증거동의는 전문증거금지의 원칙에 대한 예외로서 반대신문권을 포기하겠다는 피고인의 의사표시에 의하여 서류 또는 물건의 증거능력을 부여하려는 규정이다.","약식명령에 불복하여 정식재판을 청구한 피고인이 정식재판절차의 제1심에서 2회 불출정하여 ｢형사소송법｣ 제318조 제2항에 따라 피고인의 증거동의로 간주된 후, 제1심 법원이 증거조사를 완료하였더라도 피고인이 항소심에 출석하여 공소사실을 부인 하면서 제1심에서 간주된 증거동의를 철회 또는 취소한다는 의사표시를 하면 해당 증거의 증거능력은 상실된다.","피고인이 출석한 공판기일에서 증거로 함에 부동의한다는 의견이 진술된 경우에는 그 후 피고인이 출석하지 아니한 공판기일에 변호인만이 출석하여 종전 의견을 번복하여 증거로 함에 동의 하였다 하더라도 이는 특별한 사정이 없는 한 효력이 없다고 보아야 한다.","필요적 변호사건이라 하여도 피고인이 재판거부의 의사를 표시하고 재판장의 허가 없이 퇴정하고 변호인 마저 이에 동조하여 퇴정해 버림으로써 피고인과 변호인들이 출석하지 않은 상태에서 증거조사를 할 수밖에 없는 경우, ｢형사소송법｣ 제318조 제2항의 규정상 피고인의 진의와는 관계없이 증거동의가 있는 것으로 간주한다.",1,0,""],["2023-1","형사법",40,"다음 사례에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 친구사이인 甲, 乙, 丙은 사업가 A의 사무실 금고에 거액의 현금이 있다는 정보를 입수한 후, 甲과 乙은 A의 사무실 금고에서 현금을 절취하고 丙은 위 사무실로부터 100m 떨어진 곳에서 망을 보기로 모의하였다. 범행 당일 오전 10시경 甲과 乙은 A의 사무실에 들어가 현금을 절취한 후, 망을 보던 丙과 함께 도주하였다. 甲, 乙, 丙은 검거되어 절도혐의로 수사를 받고 공동으로 기소되어 심리가 진행되었는데, 검사는 경찰수사 단계에서 작성된 공범 乙의 피의자 신문조서를 甲의 범죄혐의 입증의 증거로 제출하였고 甲은 그 내용을 부인하였다. 한편 丙은 甲의 공소사실에 대해 증인으로 채택되어 선서하고 증 언하면서 甲의 범행을 덮어주기 위해 기억에 반하는 허위진술을 하였다. (주거침입죄 및 손괴죄 기타 특별법 위반의 점은 고려하지 않음)","甲과 乙에 대해서는 ｢형법｣ 제331조 제2항의 합동절도가 성립 하지만, 현장에서의 협동관계가 인정되지 않는 丙에 대해서는 ｢형법｣ 제329조 단순절도죄가 성립한다.","만약 甲과 乙이 A의 사무실 출입문의 시정장치를 손괴하다가 A에게 발각되어 도주하였다면 甲과 乙의 행위에 대해서는 특수절도죄의 미수범이 성립한다.","乙의 피의자신문조서는 乙이 법정에서 그 내용을 인정하면 甲이 내용을 부인하더라도 甲의 공소사실에 대한 증거로 사용할 수 있다.","丙에 대해서는 ｢형법｣ 제152조 제1항 위증죄가 성립하지 않는다.",3,0,""],["2023-1","경찰학",1,"대륙법계 경찰개념에 관한 설명으로 가장 적절하지 않은 것은?","경찰이란 용어는 라틴어의 Politia에서 유래한 것으로 도시국가에 관한 일체의 정치, 특히 헌법을 지칭하였다.","경찰국가시대는 국가작용의 분화현상이 나타나 경찰개념이 외교･ 군사･재정･사법을 제외한 내무행정 전반에 국한되었다.","크로이쯔베르크(Kreuzberg) 판결에 의하면 경찰관청이 일반수권 규정에 근거하여 법규명령을 발할 수 있는 분야는 소극적 위험방지 분야에 한정된다.","경찰은 시민으로부터 자치권한을 위임받은 조직체로서 시민을 위한 기능과 역할에 초점을 맞추어 형성되었다.",3,0,""],["2023-1","경찰학",2,"형식적 의미의 경찰과 실질적 의미의 경찰에 관한 설명으로 가장 적절하지 않은 것은?","형식적 의미의 경찰은 실정법상 개념으로 보통경찰기관에 분배되어 있는 임무를 달성하기 위하여 행하여지는 일체의 경찰작용이다.","형식적 의미의 경찰은 모두 실질적 의미의 경찰에 포함된다.","실질적 의미의 경찰은 독일의 행정법학에서 정립된 학문상 개념이다.","실질적 의미의 경찰은 사회공공의 안녕, 질서유지와 같은 소극적 목적을 위한 작용이다.",1,0,""],["2023-1","경찰학",3,"경찰의 종류와 구별기준의 연결이 가장 적절하지 않은 것은?","질서경찰- 봉사경찰: 경찰의 목적에 따른 분류","예방경찰- 진압경찰: 경찰권 발동시점에 따른 분류","국가경찰- 자치경찰: 권한과 책임의 소재에 따른 분류","평시경찰- 비상경찰: 위해정도및담당기관, 적용법규에따른분류",0,0,""],["2023-1","경찰학",4,"국가경찰과 자치경찰에 관한 설명으로 가장 적절하지 않은 것은?","자치경찰은 지역사회 특성을 반영한 치안활동이 가능하며 주민들의 지지를 받기 쉽다.","국가경찰은 강력하고 광범위한 집행력을 행사할 수 있다.","자치경찰은 지방세력의 간섭으로 인하여 정실주의에 대한 우려가 있다.","국가경찰은전국단위의통계자료수집및정확성측면에서불리하다.",3,0,""],["2023-1","경찰학",5,"공공질서에 관한 설명으로 가장 적절하지 않은 것은?","원만한 공동체 생활을 위한 불가결적 전제조건으로서 공공사회에서 각 개인의 행동에 대한 불문규범의 총체이다.","공공질서의 개념은 절대적인 것이 아니라, 시대에 따라 변화하는 상대적이고 유동적인 개념이다.","공공질서 개념의 적용 가능분야는 점차 확대되고 있다.","통치권 집행을 위한 개입근거로 활용될 수 있는 공공질서 개념은 엄격한 합헌성이 요구되고, 제한적인 사용이 필요하다.",2,0,""],["2023-1","경찰학",6,"경찰의 관할에 대한 설명으로 가장 적절하지 않은 것은?","사물관할이란 경찰이 처리할 수 있고 또 처리해야 하는 사무 내용의 범위를 말한다.","인적관할이란 광의의 경찰권이 어떤 사람에게 적용되는가의 문제이다.","우리나라는 대륙법계의 영향으로 범죄수사를 경찰의 사물관할로 인정하고 있다.","헌법상 대통령은 내란 또는 외환의 죄를 범한 경우를 제외하고는 재직 중 형사상의 소추를 받지 아니한다. (일반공채･101경비단･경행 경채)",2,0,""],["2023-1","경찰학",7,"경찰부패의 원인에 관한 설명으로 가장 적절하지 않은 것은?","윌슨은 ‘시카고 시민이 경찰을 부패시켰다’고 주장하였는데, 이는 시민사회의 부패가 경찰부패의 주원인이라고 보는 입장이다.","구조원인가설은 신임경찰관들이 그들의 선배경찰관들에 의해 조직의 부패한 전통 내에서 사회화됨으로써 부패의 길로 들어 선다는 이론이다.","‘미끄러운 경사로 이론’은 사회전체가 경찰의 부패를 묵인하거나 조장할 때 경찰관은 자연스럽게 부패행위를 하게 되며, 초기 단계에는 설령 불법적인 행위를 하지 않더라도 작은 호의에 길들여져 나중에는 명백한 부정부패로 빠져들게 된다는 것이다.","전체사회가설은 니더호퍼, 로벅, 바커 등이 주장한 가설이다.",3,0,""],["2023-1","경찰학",8,"｢경찰청 공무원 행동강령｣에 해당하지 않는 것은?","공무원은 상급자가 자기 또는 타인의 부당한 이익을 위하여 공정한 직무수행을 현저하게 해치는 지시를 하였을 때에는 그 사유를 상급자에게 소명하고 지시에 따르지 아니하거나 행동강령책임관과 상담할 수 있다.","공무원은 수사･단속의 대상이 되는 업소 중 경찰청장이 지정하는 유형의 업소 관계자와 부적절한 사적 접촉을 하여서는 아니 되며, 공적 또는 사적으로 접촉한 경우 경찰청장이 정하는 방법에 따라 신고하여야 한다.","공무원은 직무수행 중 알게 된 정보를 이용하여 유가증권, 부동산 등과 관련된 재산상 거래 또는 투자를 하거나 타인에게 그러한 정보를 제공하여 재산상 거래 또는 투자를 돕는 행위를 해서는 아니 된다.","경찰공무원은 정당이나 정치단체에 가입하거나 정치활동에 관여하는 행위를 하여서는 아니 된다.",3,0,""],["2023-1","경찰학",9,"화이트칼라범죄(white-collar crimes)에 관한 설명으로 가장 적절하지 않은 것은?","초기 화이트칼라범죄를 정의한 학자는 서덜랜드(Sutherland)이다.","화이트칼라범죄는 직업활동과 관련하여 높은 지위를 가지고 있는 사람에 의해 저질러지는 범죄이다.","일반적으로 살인･강도･강간범죄는 화이트칼라범죄로 분류된다.","화이트칼라범죄는 상류계층의 경제범죄에 대한 사회적 심각성을 연구하는 과정에서 등장한 개념이다.",2,0,""],["2023-1","경찰학",10,"환경설계를 통한 범죄예방(CPTED)에 관한 설명으로 가장 적절하지 않은 것은?","CPTED는 근본적이고 효과적인 범죄예방을 위한 방안으로 물리적 환경설계 또는 재설계를 통해 범죄 기회를 차단하는 것이 핵심이다.","‘자연적 감시(natural surveillance)’는 건축물이나 시설물의 설계시 가시권을 확보하여 외부침입에 대한 감시기능을 확대함으로써 범죄행위 발견 가능성을 증가시켜 범죄의 기회를 감소시킬 수 있다는 원리이다.","‘영역성 강화(territorial reinforcement)’는 사적공간에 대한 경계 표시로 주민들의 책임의식과 소유의식을 증대함으로써 사적공간에 대한 관리권과 권리를 강화시키는 원리이다.","‘유지･관리(maintenance and management)’는 차단기, 방범창, 잠금장치의 파손을 수리하지 않고 유지하는 원리이다.",3,0,""],["2023-1","경찰학",11,"무관용 경찰활동(Zero Tolerance Policing)에 관한 설명으로 가장 적절하지 않은 것은?","사소한 무질서에 관대하게 대응했던 전통적 경찰활동의 전략을 계승하였다.","무관용 경찰활동은 1990년대 뉴욕에서 본격적으로 시행되었다.","윌슨(Wilson)과 켈링(Kelling)의 ‘깨어진 창 이론’에 기초하였다.","경미한 비행자에 대한 무관용 개입은 낙인효과를 유발할 수 있다는 비판이 있다.",0,0,""],["2023-1","경찰학",12,"지역사회 경찰활동(COP)에 관한 설명으로 가장 적절하지 않은 것은?","경찰과 시민 모두 지역문제 해결을 위한 치안주체로서 인정하고 협력을 강조한다.","업무평가의 주요한 척도는 사전예방을 강조한 범죄나 무질서의 감소율이다.","프로그램으로는 전략지향적 경찰활동(Strategy Oriented Policing:SOP), 이웃지향적 경찰활동(Neighborhood Oriented Policing:NOP) 등이 있다.","범죄신고에 대한 출동소요시간을 바탕으로 효과성을 평가한다.",3,0,""],["2023-1","경찰학",13,"다음은 자랑스러운 경찰의 표상에 관한 서술이다. 해당 인물을 바르게 나열한 것은? ㉠ 성산포경찰서장 재직 시 계엄군의 예비검속자 총살 명령에 ‘부당함으로 불이행’한다고 거부하고 주민들을 방면함 ㉡ 5･18 광주 민주화운동 당시 무장 강경진압 방침이 내려오자 ‘분산되는 자는 너무 추적하지 말 것, 부상자가 발생하지 않도록 할 것’ 등을 지시하여 비례의 원칙에 입각한 경찰권 행사 및 인권보호를 강조함 ㉢ 임시정부 경무국 경호원 및 의경대원으로 활동하였고 1926년 12월 식민수탈의 심장인 식산은행과 동양척식회사에 폭탄을 투척함 ㉣ 구례경찰서장 재임 당시, 재판을 받지 않고 수감된 보도 연맹원 480명을 방면하였으며, ‘내가 만일 반역으로 몰려 죽는다면 나의 혼이 여러분 각자의 가슴에 들어가 지킬 것이니 새 사람이 되어주십시오’라고 당부함 ㉠ ㉡ ㉢ ㉣","문형순 안병하 차일혁 안종삼","이준규 최규식 안맥결 나석주","문형순 안병하 나석주 안종삼","이준규 최규식 정종수 나석주",2,0,""],["2023-1","경찰학",14,"각 국의 수사기관에 관한 설명으로 가장 적절하지 않은 것은?","영국의 국립범죄청(NCA)은 2013년 중대조직범죄청(SOCA)과 아동범죄대응센터(CEOPC)를 통합하여 출범하였다.","미국의 연방수사국(FBI)은 2001년 9.11 테러 이후 테러예방과 수사에 많은 역량을 집중시키고 있다.","독일의 연방범죄수사청(BKA)은 연방헌법기관 요인들에 대한 신변경호도 담당한다.","한국의 국가수사본부는 고위공직자범죄등에 관한 수사를 독립적 으로 수행하기 위하여 법무부장관 소속으로 설치되었다.",3,0,""],["2023-1","경찰학",15,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣ 제10조에 따른 국가경찰위원회의 심의･의결 사항에 관한 내용으로 가장 적절하지 않은 것은?","국가경찰사무에 관한 인사, 예산, 장비, 통신 등에 관한 주요 정책 및 경찰 업무 발전에 관한 사항","국가경찰사무에 관한 인권보호와 관련되는 경찰의 운영･개선에 관한 사항","지방행정과 치안행정의 업무조정에 관한 사항","제주특별자치도의 자치경찰에 대한 경찰의 지원･협조 및 협약 체결의 조정 등에 관한 주요 정책사항",2,0,""],["2023-1","경찰학",16,"｢경찰공무원법｣ 제7조에 따른 임용권자에 관한 설명으로 가장 적절하지 않은 것은?","총경 이상 경찰공무원은 경찰청장 또는 해양경찰청장의 추천을 받아 행정안전부장관 또는 해양수산부장관의 제청으로 국무총리를 거쳐 대통령이 임용한다.","총경의 전보, 휴직, 직위해제, 강등, 정직 및 복직은 행정안전부 장관 또는 해양수산부장관이 임용한다.","경정 이하의 경찰공무원은 경찰청장 또는 해양경찰청장이 임용한다. 다만, 경정으로의 신규채용, 승진임용 및 면직은 경찰청장 또는 해양경찰청장의 제청으로 국무총리를 거쳐 대통령이 한다.","경찰청장은 대통령령으로 정하는 바에 따라 경찰공무원의 임용에 관한 권한의 일부를 특별시장ㆍ광역시장ㆍ도지사ㆍ특별자치시장 또는 특별자치도지사, 국가수사본부장, 소속 기관의 장, 시･도 경찰청장에게 위임할 수 있다.",1,0,""],["2023-1","경찰학",17,"｢국가공무원법｣상 직위해제에 관한 설명으로 가장 적절하지 않은 것은?","임용권자는 직무수행 능력이 부족하거나 근무성적이 극히 나쁜 자에게 직위를 부여하지 아니할 수 있다.","형사사건으로 기소된 자(약식명령이 청구된 자는 제외한다)에게는 직위를 부여하지 아니할 수 있다.","제73조의3 제1항에 따라 직위를 부여하지 아니한 경우에 그 사유가 소멸되면 임용권자는 7일 이내에 직위를 부여할 수 있다.","임용권자는 제1항 제2호에 따라 직위해제된 자에게 3개월의 범위에서 대기를 명한다.",2,0,""],["2023-1","경찰학",18,"경찰행정법의 법원(法源)에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰행정법의 법원(法源)은 일반적으로 성문법원과 불문법원으로 나눌 수 있으며 헌법, 법률, 조례와 규칙은 성문법원에 해당한다.","대통령령, 총리령 및 부령은 특별한 규정이 없으면 공포한 날부터 20일이 경과함으로써 효력을 발생한다.","지방자치단체의 장은 법령의 범위에서 그 사무에 관하여 조리 (條理)를 제정할 수 있다.","사회의 거듭된 관행으로 생성한 사회생활규범이 사회의 법적 확신과 인식에 의하여 법적 규범으로 승인･강행되기에 이른 것을 관습법이라 한다.",2,0,""],["2023-1","경찰학",19,"경찰비례의 원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰비례의 원칙은 일반적 수권조항에 근거하여 경찰권을 발동하는 경우는 물론, 개별적 수권조항에 근거하여 경찰권을 발동하는 경우에도 적용된다.","적합성의 원칙은 경찰기관의 어떤 조치가 경찰목적 달성을 위해 필요한 경우라고 하여도 그 조치에 따른 불이익이 그 조치로 인해 발생하는 이익보다 큰 경우에는 경찰권을 발동해서는 안된다는 원칙이다.","필요성의 원칙(최소침해의 원칙)은 목적을 달성할 수 있는 수단이 여러 가지가 있는 경우에 적합한 여러 가지 수단 중에서 가장 적게 침해를 가져오는 수단을 선택해야 한다는 원칙이다.","경찰비례의 원칙은 ｢행정기본법｣ 제10조, ｢경찰관 직무집행법｣ 제1조 제2항 등에서 근거를 찾아볼 수 있다.",1,0,""],["2023-1","경찰학",20,"경찰하명에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰하명은 경찰상의 목적을 위하여 국가의 일반통치권에 의거, 개인에게 특정한 작위･부작위･수인 또는 급부의 의무를 명하는 행정행위이다.","부작위하명은 적극적으로 어떤 행위를 하지 말 것을 명하는 것으로 ‘면제’라 부르기도 한다.","경찰하명에 위반한 행위는 강제집행이나 처벌의 대상이 되지만, 원칙적으로 사법(私法)상의 법률적 효력까지 부인하는 것은 아니다.","위법한 경찰하명으로 인하여 권리･이익이 침해된 자는 행정쟁송 또는 손해배상을 청구할 수 있다.",1,0,""],["2023-1","경찰학",21,"｢행정기본법｣상 부관에 관한 설명으로가장적절하지않은것은?","행정청은 처분에 재량이 있는 경우에는 부관을 붙일 수 있다.","행정청은 처분에 재량이 없는 경우에는 법률에 근거가 있는 경우에 부관을 붙일 수 있다.","행정청은 부관을 붙일 수 있는 처분이 당사자의 동의가 있는 경우에는 그 처분을 한 후에도 부관을 새로 붙이거나 종전의 부관을 변경할 수 있다.","부관은 해당 처분의 목적에 위배되지 아니하고, 실질적 관련이 없을 것을 요건으로 한다.",3,0,""],["2023-1","경찰학",22,"행정상 의무이행확보수단에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","과징금은 원칙적으로 행정법상의 의무를 위반한 자에 대하여 당해 위반행위로 얻게 된 경제적 이익을 박탈하기 위한 목적으로 부과하는 금전적인 제재이다.","｢경찰관 직무집행법｣ 제6조 “경찰관은 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명･ 신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지할 수 있다” 규정은 행정상 즉시강제에 해당한다.","｢경찰관 직무집행법｣ 제4조 제1항 제1호에서 규정하는 술에 취한 상태로 인하여 자기 또는 타인의 생명･신체와 재산에 위해를 미칠 우려가 있는 피구호자에 대한 보호조치는 행정상 강제 집행에 해당한다.","가산세는 개별 세법이 과세의 적정을 기하기 위하여 정한 의무의 이행을 확보할 목적으로 그 의무 위반에 대하여 세금의 형태로 가하는 행정상 제재이다.",2,0,""],["2023-1","경찰학",23,"｢질서위반행위규제법｣상 행정청의 과태료 부과 및 징수에 관한 설명으로 가장 적절하지 않은 것은?","행정청은 법 제16조 제2항에 따라 당사자가 제출한 의견에 상당한 이유가 있는 경우에는 과태료를 부과하지 아니하거나 통지한 내용을 변경할 수 있다.","법 제20조 제1항에 따른 이의제기가 있는 경우에는 행정청의 과태료 부과처분은 그 효력을 상실하지 않는다.","당사자가 법 제18조 제1항에 따라 감경된 과태료를 납부한 경우에는 해당 질서위반행위에 대한 과태료 부과 및 징수절차는 종료한다.","행정청은 당사자가 납부기한까지 과태료를 납부하지 아니한 때에는 납부기한을 경과한 날부터 체납된 과태료에 대하여 100분의 3에 상당하는 가산금을 징수한다.",1,0,""],["2023-1","경찰학",24,"｢공공기관의 정보공개에 관한 법률｣에 관한 설명으로 가장 적절하지 않은 것은?","청구인은 이의신청 절차를 거치지 아니하고 행정심판을 청구 할 수 없다.","“정보”란 공공기관이 직무상 작성 또는 취득하여 관리하고 있는 문서(전자문서를 포함한다) 및 전자매체를 비롯한 모든 형태의 매체 등에 기록된 사항을 말한다.","공공기관은 부득이한 사유로 법 제11조 제1항에 따른 기간 이내에 공개 여부를 결정할 수 없을 때에는 그 기간이 끝나는 날의 다음 날부터 기산(起算)하여 10일의 범위에서 공개 여부 결정 기간을 연장할 수 있다. 이 경우 공공기관은 연장된 사실과 연장 사유를 청구인에게 지체 없이 문서로 통지하여야 한다.","공공기관은 청구인이 사본 또는 복제물의 교부를 원하는 경우에는 이를 교부하여야 한다.",0,0,""],["2023-1","경찰학",25,"｢행정절차법｣상 행정청이 처분을 할 때 청문을 하여야 하는 경우가 아닌 것은?","다른 법령등에서 청문을 하도록 규정하고 있는 경우","해당 처분의 영향이 광범위하여 널리 의견을 수렴할 필요가 있다고 행정청이 인정하는 경우","인허가 등의 취소의 처분을 하는 경우","법인이나 조합 등의 설립허가의 취소의 처분을 하는 경우",1,0,""],["2023-1","경찰학",26,"｢행정심판법｣상 재결에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","재결은 서면으로 한다.","위원회는 심판청구가 이유가 없다고 인정하면 그 심판청구를 기각(棄却)한다.","위원회는 지체 없이 당사자에게 재결서의 등본을 송달하여야 하며, 재결서가 청구인에게 발송되었을 때에 그 효력이 생긴다.","재결의 기속력은 재결의 주문 및 그 전제가 된 요건사실의 인정과 판단, 즉 처분 등의 구체적 위법사유에 관한 판단에만 미친다고 할 것이고, 종전 처분이 재결에 의하여 취소되었다 하더라도 종전 처분시와는 다른 사유를 들어서 처분을 하는 것은 기속력에 저촉되지 않는다.",2,0,""],["2023-1","경찰학",27,"｢경찰관 직무집행법｣상 보호조치 등에 관한 설명으로 가장 적절한 것은?","긴급구호를 요청받은 공공보건의료기관이나 공공구호기관은 정당한 이유 없이 긴급구호를 거절할 수 있다.","경찰관은 보호조치를 하는 경우에 구호대상자가 휴대하고 있는 무기･흉기 등 위험을 일으킬 수 있는 것으로 인정되는 물건을 공공보건의료기관이나공공구호기관에임시로영치하여놓을수있다.","경찰관은 보호조치를 하였을 때에는 지체 없이 구호대상자의 가족, 친지 또는 그 밖의 연고자에게 그 사실을 알려야 하며, 연고자가 발견되지 아니할 때에는 구호대상자를 적당한 공공 보건의료기관이나 공공구호기관에 즉시 인계하여야 한다.","구호대상자를 경찰관서에서 보호하는 기간은 48시간을 초과할 수 없고, 물건을 공공보건의료기관이나 공공구호기관에 임시로 영치하는 기간은 10일을 초과할 수 없다.",2,0,""],["2023-1","경찰학",28,"｢경찰 물리력 행사의 기준과 방법에 관한 규칙｣상 경찰 물리력 수준에 관한 설명으로 가장 적절하지 않은 것은?","협조적 통제는 ‘순응’ 이상의 상태인 대상자에 대해 사용할 수 있는 물리력 수준으로서, 대상자의 협조를 유도하거나 협조에 따른 물리력을 말한다.","접촉 통제는 ‘소극적 저항’ 이상의 상태인 대상자에 대해 사용 할 수 있는 물리력 수준으로서, 대상자 신체 접촉을 통해 경찰목적 달성을 강제하지만 신체적 부상을 야기할 가능성은 극히 낮은 물리력을 말한다.","저위험 물리력은 ‘적극적 저항’ 이상의 상태인 대상자에 대해 사용할 수 있는 물리력 수준으로서, 대상자가 통증을 느낄 수 있으나 신체적 부상을 당할 가능성은 낮은 물리력을 말한다.","중위험 물리력은 ‘치명적 공격’ 상태의 대상자로 인해 경찰관 또는 제3자의 생명･신체에 급박하고 중대한 위해가 초래될 가능성이 있는 경우 최후의 수단으로 사용할 수 있는 물리력 수준으로서, 대상자의 사망 또는 심각한 부상을 초래할 수 있는 물리력을 말한다.",3,0,""],["2023-1","경찰학",29,"경찰조직편성의원리에관한설명으로가장적절하지않은 것은?","할거주의는 조정과 통합의 원리를 실현시키는 필수적 요소이다.","계층제는 조직의 경직화를 초래하여 환경변화에 대한 조직의 신축적 대응을 어렵게 한다.","명령통일의 원리는 부하직원이 한 사람의 상관으로부터만 명령을 받고, 보고도 그 상관에게만 하도록 하는 것을 의미한다.","통솔의 범위는 한 사람의 상관이 효과적으로 감독할 수 있는 최대한의 부하의 수를 의미한다.",0,0,""],["2023-1","경찰학",30,"계급제와직위분류제에관한설명으로가장적절하지않은 것은?","직위분류제는 사람 중심 분류로서 계급제보다 인사배치의 신축성 측면에서 유리하다.","우리나라의 공직분류는 계급제 위주에 직위분류제적 요소를 가미한 혼합 형태라고 할 수 있다.","직위분류제는 미국에서 실시된 후 다른 나라로 전파되었다.","직위분류제는 계급제에 비해서 보수결정의 합리적인 기준을 제시하는 것이 장점이다.",0,0,""],["2023-1","경찰학",31,"｢국가재정법｣상 예산안의 편성과 집행에 관한 설명으로 가 장 적절하지 않은 것은?","각 중앙관서의 장은 예산안편성지침에 따라 그 소관에 속하는 다음 연도의 세입세출예산･계속비･명시이월비 및 국고채무부담행위 요구서를 작성하여 매년 5월 31일까지 기획재정부장관에게 제출하여야 한다.","기획재정부장관은 예산요구서에 따라 예산안을 편성하여 국회 심의를 거친 후 대통령의 승인을 얻어야 한다.","각 중앙관서의 장은 예산이 확정된 후 사업운영계획 및 이에 따른 세입세출예산･계속비와 국고채무부담행위를 포함한 예산 배정요구서를 기획재정부장관에게 제출하여야 한다.","기획재정부장관은 각 중앙관서의 장에게 예산을 배정한 때에는 감사원에 통지하여야 한다.",1,0,""],["2023-1","경찰학",32,"｢보안업무규정｣상 비밀보호에 관한 설명으로 가장 적절하지 않은 것은?","비밀은 그 중요성과 가치의 정도에 따라 구분되는데, 누설될 경우 대한민국과 외교관계가 단절되고 전쟁을 일으키며 국가의 방위계획･정보활동 및 국가방위에 반드시 필요한 과학과 기술의 개발을위태롭게하는등의우려가있는비밀은‘Ⅰ급비밀’ 에속한다.","비밀은 해당 등급의 비밀취급 인가를 받은 사람만 취급할 수 있으며, 암호자재는 해당 등급의 비밀 소통용 암호자재취급 인가를 받은 사람만 취급할 수 있다.","검찰총장, 국가정보원장, 경찰청장은 Ⅰ급비밀 취급 인가권자와 Ⅰ급 및 Ⅱ급비밀 소통용 암호자재 취급 인가권자에 해당한다.","비밀은 적절히 보호할 수 있는 최저등급으로 분류하되, 과도 하거나 과소하게 분류해서는 아니 된다.",2,1,"보안업무규정의 '검찰총장' 인용 부분은 2026.10.2. 검찰청 폐지·공소청 출범에 따른 명칭·권한자 변경 여부를 확인해야 합니다."],["2023-1","경찰학",33,"｢경찰 인권보호 규칙｣에 관한 설명으로 가장 적절하지 않은 것은?","“경찰관등”이란 경찰청과 그 소속기관의 경찰공무원, 일반직 공무원을 말한다(단, 무기계약근로자 및 기간제근로자, 의무경찰은 제외한다).","경찰활동 전반에 걸친 민주적 통제를 구현하여 경찰력 오･남용을 예방하고, 경찰행정의 인권지향성을 높여 인권을 존중하는 경찰활동을 정립하기 위해 경찰청장 및 시･도경찰청장의 자문 기구로서 각각 경찰청 인권위원회, 시･도경찰청 인권위원회를 설치하여 운영한다.","경찰청장은 국민의 인권보호와 증진을 위하여 경찰 인권정책 기본계획을 5년마다 수립해야 한다.","인권보호담당관은 인권침해를 예방하고 제도를 개선하기 위해 연 1회 이상 인권 관련 정책 이행 실태, 인권교육 추진 현황, 경찰청과 소속기관의 청사 및 부속 시설 전반의 인권침해적 요소의 존재 여부를 진단하여야 한다.",0,0,""],["2023-1","경찰학",34,"｢경범죄 처벌법｣상 다음 ( ) 안에 들어갈 숫자로 알맞은 것은? ㉠ 출판물의 부당게재 등 - 올바르지 아니한 이익을 얻을 목적으로 다른 사람 또는 단체의 사업이나 사사로운 일에 관하여 신문, 잡지, 그 밖의 출판물에 어떤 사항을 싣거나 싣지 아니할 것을 약속하고 돈이나 물건을 받은 사람은 ( 가 ) 만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다. ㉡ 거짓 광고 - 여러 사람에게 물품을 팔거나 나누어 주거나 일을 해주면서 다른 사람을 속이거나 잘못 알게 할 만한 사실을 들어 광고한 사람은 ( 나 )만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다. ㉢ 업무방해 - 못된 장난 등으로 다른 사람, 단체 또는 공무 수행 중인 자의 업무를 방해한 사람은 ( 다 )만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다. ㉣ 암표매매 - 흥행장, 경기장, 역, 나루터, 정류장, 그 밖에 정하여진 요금을 받고 입장시키거나 승차 또는 승선시키는 곳에서 웃돈을 받고 입장권･승차권 또는 승선권을 다른 사람에게 되판 사람은 ( 라 )만원 이하의 벌금, 구류 또는 과료의 형으로 처벌한다. ( 가 ) ( 나 ) ( 다 ) ( 라 )","10 20 60 20","20 20 20 20","20 10 60 20","20 60 20 10",1,0,""],["2023-1","경찰학",35,"다음 경찰통제의 유형 중 내부적 통제에 해당하는 것은 모두 몇 개인가? ㉠ 청문감사인권관제도 ㉡ 국민권익위원회 ㉢ 국가경찰위원회 ㉣ 소청심사위원회 ㉤ 경찰청장의 훈령권 ㉥ 국회의 입법권","2개","3개","4개","5개",0,0,""],["2023-1","경찰학",36,"｢가정폭력범죄의 처벌 등에 관한 특례법｣상 가정폭력범죄에 대해 사법경찰관이 취할 수 있는 긴급임시조치로 가장 적절하지 않은 것은?","국가경찰관서의 유치장 또는 구치소에의 유치","피해자 또는 가정구성원이나 그 주거･직장 등에서 100미터 이내의 접근금지","피해자 또는 가정구성원의 주거 또는 점유하는 방실로부터의 퇴거 등 격리","피해자 또는 가정구성원에 대한 ｢전기통신기본법｣ 제2조 제1호의 전기통신을 이용한 접근금지",0,0,""],["2023-1","경찰학",37,"다음은 ｢마약류 관리에 관한 법률 및 동법 시행령｣상 마약류에 관한 설명이다. <보기 1>의 설명과 <보기 2> 마약류의 품명이 가장 적절하게 연결된 것은? <보기 1> ㉠ 진해거담제로서 의사의 처방이 있으면 약국에서 구입 가능 하고, 도취감과 환각작용을 느끼기 위해 사용량의 수십 배를 남용하는 경우도 있다. 청소년들이 소주에 타서 마시기도 하여 흔히 ‘정글주스’라고도 불린다. ㉡ 골격근 이완의 효과가 있는 근골격계 질환 치료제이며, 과다복용 시 인사불성, 혼수쇼크, 호흡저하, 사망에까지 이를 수 있다. ㉢ 곡물의 곰팡이, 보리 맥각에서 추출･합성한 무색･무취･무미의 매우 강력한 환각제로, 내성은 있으나 금단증상은 일으키지 않는다고 알려져 있다. ㉣ 페놀계 화합물로 흔히 수면마취제라고 불리는 정맥마취제로서 수면내시경검사 마취 등에 사용되고, 환각제 대용으로 오남용되는 사례가 있으며, 정신적 의존성을 유발하기도 한다. <보기 2> ⓐ 카리소프로돌(S정) ⓑ 프로포폴 ⓒ LSD ⓓ 덱스트로메트로판(러미나)","㉠ - ⓓ ㉡ - ⓒ ㉢ - ⓐ ㉣ - ⓑ","㉠ - ⓓ ㉡ - ⓐ ㉢ - ⓒ ㉣ - ⓑ","㉠ - ⓒ ㉡ - ⓑ ㉢ - ⓓ ㉣ - ⓐ","㉠ - ⓓ ㉡ - ⓐ ㉢ - ⓑ ㉣ - ⓒ",1,0,""],["2023-1","경찰학",38,"｢재난 및 안전관리 기본법｣에 관한 설명으로 가장 적절하지 않은 것은?","“재난”이란 국민의 생명･신체･재산과 국가에 피해를 주거나 줄 수 있는 것으로서 사회재난과 자연재난으로 구분한다.","“재난관리”란 재난의 예방･대비･대응 및 복구를 위하여 하는 모든 활동을 말한다.","경찰청장은 국가 및 지방자치단체가 행하는 재난 및 안전관리 업무를 총괄･조정한다.","대통령령으로 정하는 대규모 재난의 대응･복구 등에 관한 사항을 총괄･조정하고, 필요한 조치를 하기 위하여 행정안전부에 중앙재난안전대책본부를 둔다.",2,0,""],["2023-1","경찰학",39,"음주운전 관련 판례에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰관이 술에 취한 상태에서 자동차를 운전한 것으로 보이는 피고인을 ｢경찰관 직무집행법｣에 따른 보호조치 대상자로 보아 경찰관서로 데려온 직후 음주측정을 요구하였는데 피고인이 불응하여 음주측정불응죄로 기소된 사안에서, 위법한 보호조치 상태를 이용하여 음주측정 요구가 이루어졌다는 등의 특별한 사정이 없는 한 피고인의 행위는 음주측정불응죄에 해당한다.","술에 취해 자동차 안에서 잠을 자다가 추위를 느껴 히터를 가동시키기 위하여 시동을 걸었고, 실수로 자동차의 제동장치 등을 건드렸거나 처음 주차할 때 안전조치를 제대로 취하지 아니한 탓으로 원동기의 추진력에 의하여 자동차가 약간 경사진 길을 따라 앞으로 움직여 피해자의 차량 옆면을 충격하게 된 경우는 자동차의 운전에 해당한다.","음주측정 요구 당시 운전자가 술에 취한 상태에서 자동차를 운전하였다고 인정할 만한 상당한 이유가 있었으며, 음주운전 종료 후 별도의 음주 사실이 없었음이 증명된 경우, 경찰관이 음주 및 음주운전 종료로부터 약 5시간 후 집에서 자고 있는 피고인을 연행하여 음주측정을 요구한 데에 대하여 피고인이 불응하였다면, ｢도로교통법｣상의 음주측정불응죄가 성립한다.","특별한 이유 없이 호흡측정기에 의한 측정에 불응하는 운전자에게 경찰공무원이 혈액채취에 의한 측정방법이 있음을 고지하고 그 선택 여부를 물어야 할 의무는 없다.",1,0,""],["2023-1","경찰학",40,"｢보안관찰법｣에 관한 설명으로 가장 적절하지 않은 것은?","“보안관찰처분대상자”라 함은 보안관찰해당범죄 또는 이와 경합된 범죄로 금고 이상의 형의 선고를 받고 그 형기 합계가 3년 이상인 자로서 형의 전부 또는 일부의 집행을 받은 사실이 있는 자를 말한다.","보안관찰처분청구는 검사가 행한다.","보안관찰처분을 받은 자는 이 법이 정하는 바에 따라 소정의 사항을 주거지 관할경찰서장에게 신고하고, 재범방지에 필요한 범위 안에서 그 지시에 따라 보안관찰을 받아야 한다.","보안관찰처분의 기간은 3년으로 한다.",3,0,""],["2023-2","헌법",1,"정당제도에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","정당의 명칭은 그 정당의 정책과 정치적 신념을 나타내는 대표적인 표지에 해당하므로, 정당설립의 자유는 자신들이 원하는 명칭을 사용하여 정당을 설립하거나 정당활동을 할 자유도 포함한다.","정당의 중앙당과 지구당과의 복합적 구조에 비추어 정당의 지구당은 단순한 중앙당의 하부조직이 아니라 어느 정도의 독자성을 가진 단체로서 법인격 없는 사단에 해당한다.","정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 법원은 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법 재판소의 심판에 의하여 해산된다.","대한민국 국민이 아닌 자는 정당의 당원이 될 수 없으며, 누구든지 2이상의 정당의 당원이 되지 못한다.",2,0,""],["2023-2","헌법",2,"국적에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","출생이나 그 밖에 ｢국적법｣에 따라 대한민국 국적과 외국 국적을 함께 가지게 된 사람으로서 대통령령으로 정하는 사람은 대한민국의 법령 적용에서 대한민국 국민으로만 처우한다.","대한민국의 국민이 아닌 자로서 대한민국의 국민인 부 또는 모에 의하여 인지된 자가 대한민국의 ｢민법｣상 미성년자이면서 출생 당시에 부 또는 모가 대한민국의 국민이었을 경우에는 법무부장관에게 신고함으로써 대한민국 국적을 취득할 수 있다.","직계존속이 외국에서 영주할 목적 없이 체류한 상태에서 출생한 자는 병역의무를 해소한 경우에만 국적이탈을 신고할 수 있도록 하는 구 ｢국적법｣ 제12조 제3항은 혈통주의에 따라 출생과 동시에 대한민국 국적을 취득하게 되므로 병역의무를 해소해야만 국적이탈을 허용하게 되는 결과를 가져오지만, 과잉금지원칙에 위배되지 아니하므로 국적이탈의 자유를 침해하지 않는다.","외국인이 귀화허가를 받기 위해서는 ‘품행이 단정할 것’의 요건을 갖추도록 한 구 ｢국적법｣ 제5조 제3호는 귀화신청자의 성별, 연령, 직업, 가족, 경력, 전과관계 등 여러 사정을종합적으로 고려하여판단하는것이자의적일수있어명확성원칙에위배된다.",3,0,""],["2023-2","헌법",3,"역대 헌법에 관한 설명으로 가장 적절하지 않은 것은?","1952년 제1차 개정헌법에서는 국무총리와 국무위원은 국회에 대하여 국무원의 권한에 속하는 일반 국무에 관하여는 연대책임을 지고 각자의 행위에 관하여는 개별책임을 진다고 규정하였다.","1962년 제5차 개정헌법에서는 국회의원 후보가 되려 하는 자는 소속 정당의 추천을 받아야 하며, 국회의원이 임기 중 당적을 이탈하거나 변경한 때 또는 소속 정당이 해산된 때에는 그 자격이 상실되지만 합당 또는 제명으로 소속이 달라지는 경우에는 예외로 한다고 규정하였다.","1972년 제7차 개정헌법에서는 대통령은 통일주체국민회의에서 토론 없이 무기명투표로 선거하고, 국회의원 정수의 3분의 1에 해당하는 수의 국회의원도 통일주체국민회의에서 선거하도록 규정하였다.","1980년 제8차 개정헌법에서는 국회가 상호원조 또는 안전보장에 관한 조약, 국제조직에 관한 조약, 통상조약, 주권의 제약에 관한 조약, 강화조약, 국가나 국민에게 중대한 재정적 부담을 지우는 조약 또는 입법사항에 관한 조약의 체결ㆍ비준에 대한 동의권을 가진다고 규정하였다.",3,0,""],["2023-2","헌법",4,"법치주의에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 헌법 제37조 제2항은 기본권제한에 관한 일반적 법률유보 조항이고, 법률유보의 원칙은 ‘법률에 의한 규율’을 요청하고 있으므로, 기본권 제한에는 법률의 근거가 필요하고 반드시 법률의 형식으로 하여야 한다. ㉡ 법률유보원칙은 단순히 행정작용이 법률에 근거를 두기만 하면 충분한 것이 아니라, 국가공동체와 그 구성원에게 기본적이고도 중요한 의미를 갖는 영역, 특히 국민의 기본권실현에 관련된 영역에 있어서는 행정에 맡길 것이 아니라 국민의 대표자인 입법자 스스로 그 본질적 사항에 대해 결정하여야 한다는 요구까지 내포한다. 법】(일반공채･101경비단) ㉢ 체계정당성의 원리는 동일 규범 내에서 또는 상이한 규범간에 그 규범의 구조나 내용 또는 규범의 근거가 되는 원칙면에서 상호 배치되거나 모순되어서는 안 된다는 하나의 헌법적 요청이고, 이러한 체계정당성 위반은 비례의 원칙이나 평등의 원칙 등 일정한 헌법의 규정이나 원칙을 위반하여야만 비로소 위헌이 된다. ㉣ 소급입법은 신법이 이미 종료된 사실관계에 작용하는지 아니면 현재 진행중인 사실관계에 작용하는지에 따라 ‘진정소급입법’과 ‘부진정소급입법’으로 구분되고, 전자는 헌법적으로 허용되지 않는 것이 원칙이며 특단의 사정이 있는 경우에만 예외적으로 허용될 수 있는 반면, 후자는 원칙적으로 허용되지만 소급효를 요구하는공익상의사유와신뢰보호의요청사이의교량과정에서 신뢰보호의 관점이 입법자의 형성권에 제한을 가하게 된다.","1개","2개","3개","4개",2,0,""],["2023-2","헌법",5,"기본권 주체에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","아동과 청소년은 인격의 발전을 위하여 어느 정도 부모와 학교의 교사 등 타인에 의한 결정을 필요로 하는 아직 성숙하지 못한 인격체이지만, 부모와 국가에 의한 단순한 보호의 대상이 아닌 독자적인 인격체이며, 그의 인격권은 성인과 마찬가지로 인간의 존엄성및행복추구권을보장하는헌법제10조에의하여보호된다.","불법체류 중인 외국인은 성질상 인간의 권리에 해당되는 신체의 자유, 주거의 자유, 변호인의 조력을 받을 권리, 재판청구권 등에 대해 주체성이 인정되므로 국가인권위원회의 공정한 조사를 받을권리도불법체류중인외국인에게헌법상인정되는기본권이다.","정당은 국민의 정치적 의사형성에 참여하기 위한 조직이지만， 구성원과는 독립하여 그 자체로서 기본권의 주체가 될 수 있다.","주택재개발정비사업조합은 노후･불량한 건축물이 밀집한 지역에서 주거환경을 개선하여 도시의 기능을 정비하고 주거생활의 질을 높여야 할 국가의 의무를 대신하여 실현하는 기능을 수행하고 있으므로 구 ｢도시 및 주거환경정비법｣상 주택재개발정비사업 조합이 공법인의 지위에서 기본권의 수범자로 기능하면서 행정심판의 피청구인이 된 경우에는기본권의 주체가 될 수없다.",1,0,""],["2023-2","헌법",6,"다음 사례에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함) 甲은 지방자치단체장으로 2006. 7. 1. 재직하고 있는 자로서 다음 지방자치단체장 선거에도 신분을 유지한 채로 출마하고자 하였다. 그런데 당시 ｢공직선거법｣ 제86조 제1항 및 제255조 제1항에서는 공무원이 ‘선거운동의 기획에 참여하거나 그 기획의 실시에 관여하는 행위’를 못하도록 하였고, 이를 위반한 경우 처벌하도록 규정하고 있었다. 이에 甲은 위 조항이 자신의 기본권을 침해 한다며 헌법소원심판을 청구하였다.","위 사례는 하나의 규제로 인하여 청구인 甲의 정치적 표현의 자유와 공무담임권이 동시에 제약을 받을 수 있는 기본권경합에 해당한다.","선거운동의 기획행위는 공직 출마를 곧바로 제한하는 것이어서 정치적 표현의 자유보다는 공무담임권과 더 밀접한 관계가 있으므로 위 사례는 청구인 甲의 공무담임권을 침해하고 있는지 여부를 중심으로 해결한다.","위 ｢공직선거법｣ 제86조 제1항 및 제255조 제1항은 ‘선거운동’, ‘기획’, ‘참여’, ‘관여’라는 약간의 불명확성을 지닌 구성요건을 사용하여 법관의 보충적인 해석이 필요하다고 하더라도 헌법이 요구하는죄형법정주의의명확성의원칙에위배된다고할수없다.","공무원이라 하더라도 그 지위를 이용하지 않고 사적인 지위에서 선거운동의 기획행위를 하는 것까지 금지하는 것은 선거의 공정성을 보장하려는 입법목적을 달성하기 위한 합리적인 차별 취급이라고 볼 수 없으므로 위 조항은 청구인 甲의 평등권을 침해한다.",1,0,""],["2023-2","헌법",7,"기본권제한에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","긴급재정경제명령은 평상시의 헌법 질서에 따른 권력행사 방법으로서는 대처할 수 없는 재정･경제상의 국가위기 상황에 처하여 이를 극복하기 위하여 발동되는 비상입법조치라는 속성상 기본권제한의한계로서의과잉금지원칙의준수가요구되지않는다.","｢국가공무원법｣제66조 제1항 본문 중 ‘그 밖에 공무 외의 일을 위한 집단행위’ 부분은 ‘공익에 반하는 목적을 위하여 직무전념 의무를 해태하는 등의 영향을 가져오는 집단적 행위’라고 한정하여 해석하는 한 명확성 원칙에 위반되지 않는다.","교도소의 안전 및 질서유지를 위하여 행해지는 규율과 징계로 인한 수용자의 기본권의 제한도 다른 방법으로는 그 목적을 달성할 수 없는 경우에만 예외적으로 허용되어야 한다.","사회복무요원의 정치적 행위를 금지하는 ｢병역법｣ 제33조 제2항 본문 제2호 중 ‘그 밖의 정치단체에 가입하는 등 정치적 목적을 지닌 행위’에 관한 부분은 과잉금지원칙에 위배되어 사회복무 요원인청구인의 정치적 표현의자유및 결사의자유를 침해한다.",0,0,""],["2023-2","헌법",8,"인간의 존엄과 가치 및 행복추구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행복추구권에서 도출되는 일반적 행동의 자유는 적극적으로 자유롭게 행동하는 것은 물론 소극적으로 행동을 하지 않을 자유도 포함하므로, 교통사고 발생 시 사상자 구호 등 필요한 조치를 하지 않은 자에 대한 형사처벌을 규정한 구 ｢도로교통법｣ 조항은 과잉금지원칙에 위반되어 운전자인 청구인의 일반적 행동자유권을 침해한다.","자기책임원리는 자기결정권의 한계논리로서 책임부담의 근거로 기능하는 동시에, 자기가 결정하지 않은 것이나 결정할 수 없는 것에 대하여는 책임을 지지 않고 책임부담의 범위도 스스로 결정한 결과 내지 그와 상관관계가 있는 부분에 국한됨을 의미하는 책임의 한정원리로 기능한다.","교정시설의 1인당 수용면적이 수형자의 인간으로서의 기본 욕구에 따른 생활조차 어렵게 할 만큼 지나치게 협소하다면, 이는 그 자체로 국가형벌권 행사의 한계를 넘어 수형자의 인간의 존엄과 가치를 침해하는 것이다.","일반적 행동자유권은 가치있는 행동만 보호영역으로 하는 것은 아니므로, 개인이 대마를 자유롭게 수수하고 흡연할 자유도 헌법 제10조의 행복추구권에서 나오는 일반적 행동자유권의 보호영역에 속한다.",0,0,""],["2023-2","헌법",9,"평등권 및 평등의 원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구 ｢건설근로자의 고용개선 등에 관한 법률｣ 제14조 제2항 중 구 ｢산업재해보상보험법｣ 제63조 제1항 가운데 ‘그 근로자가 사망할 당시 대한민국 국민이 아닌 자로서 외국에서 거주하고 있던 유족은 제외한다’를 준용하는 부분은 합리적 이유없이 외국거주 외국인 유족을 대한민국 국민인 유족 및 국내거주 외국인 유족과 차별하는 것으로 평등원칙에 위반된다.","국회의원을 후원회지정권자로 정하면서 ｢지방자치법｣의 ‘도’의회의원, ‘시’의회의원을 후원회지정권자에서 제외하고 있는 ｢정치자금법｣ 제6조 제2호는 국회의원과 지방의회의원의 업무의 특성을 고려한 합리적 차별로 평등권을 침해하지 않는다.","국군포로로서 억류기간 동안의 보수를 지급받을 권리를 국내로 귀환하여등록절차를거친자에게만인정하는｢국군포로의송환및 대우 등에 관한 법률｣ 제9조 제1항은 귀환하지 않은 국군포로를 합리적 이유없이 차별한 것이라 볼 수 없어 평등원칙에 위배 되지 않는다.","사회복무요원에게 현역병의 봉급에 해당하는 보수를 지급하도록 정한 구 ｢병역법 시행령｣ 제62조 제1항 본문, 사회복무요원에게 교통비, 중식비의 실비를 지급하도록 정한 구 ｢병역법 시행령｣ 제62조 제2항 전단, 구 ｢사회복무요원 복무관리 규정｣ 제41조 제3항 본문 전단은 사회복무요원을 현역병에 비하여 합리적 이유없이 자의적으로 차별한 것이라 볼 수 없어 사회복무요원인 청구인의 평등권을 침해하지 않는다.",1,0,""],["2023-2","헌법",10,"직업의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사회복무요원은 출･퇴근 근무를 원칙으로 하며 퇴근 이후에는 상대적으로 자유로운 생활관계를 형성하고 있는바, 사회복무 요원이‘복무기관의장의허가없이다른직무를겸하는행위’를한 경우 경고처분하고, 경고처분 횟수가 더하여질 때마다 5일을 연장하여 복무하도록 하는 ｢병역법｣ 제33조 제2항은 사회복무 요원인 청구인의 직업의 자유를 침해한다.","시설경비업을 허가받은 경비업자로 하여금 ‘허가받은 경비업무 외의 업무에경비원을 종사하게하는것’을 금지하고, 이를위반한 경비업자에 대한 허가를 취소하도록 정하고 있는 ｢경비업법｣ 제7조 제5항 중 ‘시설경비업무’에 관한 부분, 같은 법 제19조 제1항 제2호 중 ‘시설경비업무’에 관한 부분은 과잉금지원칙에 위반하여 시설경비업을 수행하는 경비업자의 직업의 자유를 침해한다.","시각장애인만이 안마사 자격인정을 받을 수 있도록 규정한 ｢의료법｣ 제82조 제1항 중 ‘｢장애인복지법｣에 따른 시각장애인 중’ 부분, 시･도지사로부터 안마사 자격인정을 받지 아니한 자는 안마시술소 또는 안마원을 개설할 수 없도록 규정한 ｢의료법｣ 제82조 제3항 중 제33조 제2항 제1호를 준용하는 부분은 비시각 장애인인 청구인의 직업선택의 자유를 침해한다고 볼 수 없다.","변호사의 자격이 있는 자에게 더 이상 세무사 자격을 부여하지 않는 구 ｢세무사법｣ 조항은 시행일 이후 변호사 자격을 취득한 청구인의 직업선택의 자유를 침해한다고 볼 수 없다.",0,0,""],["2023-2","헌법",11,"사생활의비밀과자유에관한설명으로가장적절하지않은것은? (다툼이 있는 경우 판례에 의함)","인터넷 언론사의 공개된 게시판･대화방에서 스스로의 의사에 의하여 정당･후보자에 대한 지지･반대의 글을 게시하는 행위가 사생활 비밀의 자유에 의하여 보호되는 영역이라고 할 수 없다.","공직자의 공무집행과 직접적인 관련이 없는 개인적인 사생활에 관한 사실은어떠한 경우에도공적인관심사안에해당될 수없다.","공직선거에 후보자로 등록하고자 하는 자에게 실효된 형을 포함한 금고이상의 형의 범죄경력에 관한 증명서류를 제출 하도록 한 구 ｢공직선거법｣ 조항은 청구인의 사생활의 비밀과 자유를 침해한다고 볼 수 없다.","금융감독원의 4급 이상 직원에 대하여 재산등록의무를 부과하는 구 ｢공직자윤리법｣ 제3조 제1항 제13호 중 구 ｢공직자윤리법 시행령｣ 제3조 제4항 제15호에 관한 부분이 금융감독원의 4급 직원인 청구인의 사생활의 비밀과 자유를 침해하는 것은 아니다.",1,0,""],["2023-2","헌법",12,"학문과예술의자유에관한설명으로가장적절하지않은 것은? (다툼이 있는 경우 헌법재판소 결정에 의함)","대학의 자율권은 헌법상의 기본권이므로 기본권제한의 일반적 법률유보의 원칙을 규정한 헌법 제37조 제2항에 따라 제한될 수 있고, 대학의 자율의 구체적인 내용은 법률이 정하는 바에 의하여 보장된다.","학교 정화구역 내에서의 극장시설 및 영업을 금지하고 있는 구 ｢학교보건법｣조항은 정화구역 내에서 극장업을 하고자 하는 자의 예술의 자유를 과도하게 침해하여 위헌이다.","구 ｢영화진흥법｣이 제한상영가 상영등급분류의 구체적 기준을 영상물등급위원회의 규정에 위임하고 있는 것은 그 내용이 사회현상에 따라 급변하는 내용들이고, 특별히 전문성이 요구 되는 기술적인 사항에 해당한다고 할 것이므로 포괄위임금지 원칙에 위배되지 않는다.","헌법 제22조 제2항은 발명가의 권리를 법률로써 보호하도록 하고 있고, 이에 따라 ｢특허법｣은 특허권자에게 업(業)으로서 그 특허발명을 실시할 권리를 독점적으로 부여하고 있다. 따라서 특허권자가 그 특허발명의 방법에 의하여 생산한 물건에 발명의 명칭과 내용을 표시하는 것은 특허실시권에 내재된 요소이며, 그러한 표시를 제한하는 것은 곧 특허권에 대한 제한이라고 보아야 한다.",2,0,""],["2023-2","헌법",13,"재산권에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","헌법의 재산권 보장은 사유재산의 사용과 그 처분을 포함하는 것인바, 유언자가 생전에 최종적으로 자신의 재산권에 대하여 처분할 수 있는 법적 가능성을 의미하는 유언의 자유가 생전 증여에 의한 처분과 마찬가지로 헌법상 재산권의 보호를 받는 것은 아니다.","환경개선부담금은 경유에 리터당 부과되는 교통･에너지･환경세와 달리 개별 경유차의 오염유발 수준을 고려하므로, 경유를 연료로 사용하는 자동차의 소유자로부터 환경개선부담금을 부과･징수 하도록 정한 ｢환경개선비용 부담법｣ 조항이 과잉금지원칙을 위반하여 경유차 소유자의 재산권을 침해한다고는 볼 수 없다.","회원제 골프장용 부동산의 재산세에 대하여 1천분의 40의 중과세율을 규정한 구 ｢지방세법｣조항은 모든 회원제 골프장을 동일하게 취급하고 있는바, 이는 회원제 골프장 운영자 등의 재산권을 침해하는 것으로서 과잉금지원칙에 반하여 헌법에 위반된다.","전기통신금융사기의 피해자가 피해구제 신청을 하는 경우, 피해자의 자금이 송금･이체된 계좌 및 해당 계좌로부터 자금의 이전에 이용된 계좌를 지급정지하는 ｢전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법｣조항은 과잉금지원칙을 위반하여 청구인의 재산권을 침해한다.",1,0,""],["2023-2","헌법",14,"인간다운 생활을 할 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","인간다운 생활을 할 권리로부터 인간의 존엄에 상응하는 생활에 필요한 ‘최소한의 물질적인 생활’의 유지에 필요한 급부를 요구할 수 있는 구체적인 권리가 상황에 따라서는 직접 도출 될 수 있어도, 동 기본권이 직접 그 이상의 급부를 내용으로 하는 구체적인 권리까지 발생케 한다고 볼 수 없다.","국가가 행하는 최저생활보장 수준이 국민의 인간다운 생활을 보장하기 위한 객관적인 내용의 최소한을 보장하고 있는지 여부는 특정한 법률에 의한 급부만을 가지고 판단하여서는 아니되고, 국가가 최저생활보장을 위하여 지급하는 각종 급여나 각종 부담의 감면 등을 총괄한 수준으로 판단하여야 한다．","직장가입자가 소득월액보험료를 일정 기간 이상 체납한 경우 그체납한보험료를완납할때까지국민건강보험공단이그가입자및 피부양자에 대하여 보험급여를 실시하지 아니할 수 있도록 한 구 ｢국민건강보험법｣ 조항은 해당 직장가입자인 청구인의 인간다운 생활을 할 권리를 침해한 것이라고 볼 수 없다.","구치소･치료감호시설에 수용 중인 자에 대하여 ｢국민기초생활 보장법｣에 의한 중복적인 보장을 피하기 위하여 기초생활보장 제도의 보장단위인 개별가구에서 제외하기로 한 입법자의 판단은 헌법상 용인될 수 있는 재량의 범위를 일탈하여 구치소･치료 감호시설에 수용 중인 자인 청구인의 인간다운 생활을 할 권리를 침해한다.",3,0,""],["2023-2","헌법",15,"교육을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법 제31조 제1항의 ‘교육을 받을 권리’는 국가로부터 교육에 필요한 시설의 제공을 요구할 수 있는 권리 및 각자의 능력에 따라 교육시설에 입학하여 배울 수 있는 권리를 의미한다.","부모는 자녀의 교육에 있어서 자녀의 정신적, 신체적 건강을 고려하여 교육의 목적과 그에 적합한 수단을 선택해야 할 것이고, 부모가 자녀의 건강에 반하는 방향으로 자녀교육권을 행사할 경우에는 헌법 제31조는 부모 외에도 국가에게 자녀의 교육에 대한 과제와 의무가 있다는 것을 규정하고 있으므로 국가는 부모의 자녀교육권을 제한할 수 있다.","학교급식의 실시에 필요한 시설･설비에 요하는 경비를 원칙적으로 학교의 설립･경영자가 부담하도록 한 ｢학교급식법｣조항은 사립학교 운영의 자유를 필요한 범위를 넘어서 지나치게 제한하고 있고 공익의 비중에 비추어 사립학교에게 과도한 부담을 지우는 것이라고 볼 수 있으므로 사립학교 운영의 자유를 침해한다.","헌법 제31조 제4항에 의해 보장되는 교육의 자주성과 전문성은 ‘교육기관의 자유’와 ‘교육의 자유’를 보장함으로써 비로소 달성할 수 있는데, ‘교육기관의 자유’는 교육을 담당하는 교육 기관의 교육운영에 관한 자주적인 결정권을 그 내용으로 하고, ‘교육의 자유’는 교육내용이나 교육방법 등에 관한 자주적인 결정권을 그 내용으로 한다.",2,0,""],["2023-2","헌법",16,"근로3권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","노동조합을 설립할 때 행정관청에 설립신고서를 제출하게 하고 그요건을충족하지못하는경우설립신고서를반려하도록하고있는 ｢노동조합 및 노동관계조정법｣ 조항의 노동조합 설립신고서 반려제도가 헌법 제21조 제2항 후단에서 금지하는 결사에 대한 허가제라고 볼 수 없다.","법령 등에 의하여 국가 또는 지방자치단체가 그 권한으로 행하는 정책결정에 관한 사항, 임용권의 행사 등 그 기관의 관리･운영에 관한 사항으로서 근무조건과 직접 관련되지 아니하는 사항을 공무원노동조합의 단체교섭 대상에서 제외하고 있는 ｢공무원의 노동조합 설립 및 운영 등에 관한 법률｣조항이 명확성의 원칙에 위반되는 것은 아니다.","근로자들의 단체행동권은 집단적 실력행사로서 위력의 요소를 가지고 있으므로, 사용자의 재산권이나 직업의 자유, 경제활동의 자유를 현저히 침해하고, 거래질서나 국가 경제에 중대한 영향을 미치는 일정한 단체행동권의 행사에 대하여는 제한이 가능하다.","｢노동조합 및 노동관계조정법｣상 ｢방위사업법｣에 의하여 지정된 주요 방위산업체에 종사하는 근로자 중 전력, 용수 및 주로 방산물자를생산하는업무에종사하는자는단체교섭을할수없다.",3,0,""],["2023-2","헌법",17,"재판청구권에 관한 헌법 제27조의 규정으로 옳고 그름의 표시(O, X)가 바르게 된 것은? ㉠ 모든 국민은 법률이 정한 법관에 의하여 공개재판을 받을 권리를 가진다. ㉡ 군인 또는 군무원이 아닌 국민은 대한민국의 영역 안에서는 중대한 군사상 기밀･초병･초소･유독음식물공급･포로･군용물에 관한 죄중 법률이 정한 경우와 계엄, 긴급명령이 선포된 경우를 제외하고는 군사법원의 재판을 받지 아니한다. ㉢ 모든 국민은 신속한 재판을 받을 권리를 가진다. 형사피고인은 정당한 이유가 없는 한 지체없이 공정한 재판을 받을 권리를 가진다. ㉣ 형사피고인은유죄의판결이확정될때까지는무죄로추정된다.","㉠(O) ㉡(O) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(O)","㉠(X) ㉡(X) ㉢(X) ㉣(O)",3,0,""],["2023-2","헌법",18,"국가배상청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","군인･군무원･경찰공무원 기타 법률이 정하는 자가 전투･훈련등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상 외에 국가 또는 공공단체에 공무원의 직무상 불법행위로 인한 정당한 배상을 청구할 수 있다.","특수임무수행자 등이 보상금 등의 지급결정에 동의한 때에는 특수임무수행 또는 이와 관련한 교육훈련으로 입은 피해에 대하여 재판상 화해가 성립된 것으로 보는 ｢특수임무수행자 보상에 관한 법률｣ 제17조의2 가운데 특수임무수행 또는 이와 관련한 교육훈련으로 입은 피해 중 ‘정신적 손해’에 관한 부분이 과잉 금지원칙을 위반하여 국가배상청구권을 침해한다고 보기 어렵다.","국가배상청구권의 성립 요건으로서 공무원의 고의 또는 과실을 규정함으로써 무과실책임을 인정하지 않은 ｢국가배상법｣ 조항이 입법자의 입법형성권의 자의적 행사로서 국가배상청구권을 침해한다고 볼 수 없다.","｢국가배상법｣은 외국인이 피해자인 경우에는 해당 국가와 상호 보증이 있을 때에만 ｢국가배상법｣을 적용한다고 규정하고 있다.",0,0,""],["2023-2","헌법",19,"형사보상청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형사보상 및 명예회복에 관한 법률｣은 법원의 형사보상 결정에 대하여는 1주일 이내에 즉시항고를 할 수 있으나, 형사보상 청구기각결정에대하여는즉시항고를할수없다고규정하고있다.","형사피의자 또는 형사피고인으로서 구금되었던 자가 법률이 정하는 불기소처분을 받거나 무죄판결을 받은 때에는 법률이 정하는 바에 의하여 국가에 정당한 보상을 청구할 수 있다.","형사보상청구는 무죄재판이 확정된 사실을 안 날부터 3년, 무죄재판이 확정된 때부터 5년 이내에 하여야 한다.","무죄판결이 확정된 피고인에게 국선변호인 보수를 기준으로 소송비용의 보상을 청구할 수 있는 권리는 구금되었음을 전제로 하는 헌법 제28조의 형사보상청구권과는 달리 헌법적 차원의 권리라고 볼 수는 없고, 입법자가 입법의 목적, 국가의 경제적･ 사회적･정책적 사정들을 참작하여 제정하는 법률에 적용요건, 적용대상, 범위 등 구체적인 사항이 규정될 때 비로소 형성되는 법률상의 권리에 불과하다.",0,0,""],["2023-2","헌법",20,"혼인과 가족생활에 관한 권리에 대한 설명으로 가장 적절 하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법 제36조 제1항은 혼인과 가족에 관련되는 공법 및 사법의 모든 영역에 영향을 미치는 헌법원리 내지 원칙규범으로서의 성격도 가진다.","태어난 즉시 ‘출생등록 될 권리’는 헌법상의 기본권이 아니라 법률상의 권리이므로 ‘혼인 중 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고’를 허용하도록 규정하지 아니한 ｢가족관계의 등록 등에 관한 법률｣ 조항이 혼인외 출생자인 청구인들의 태어난 즉시 ‘출생등록 될 권리’를 침해하는 것은 아니다.","사실혼 배우자는 혼인신고를 함으로써 상속권을 가질 수 있고, 증여나 유증을 받는 방법으로 상속에 준하는 효과를 얻을 수 있으며, ｢근로기준법｣, ｢국민연금법｣ 등에 근거한 급여를 받을 권리 등이 인정된다는 측면에서 볼 때, 사실혼 배우자에게 상속권을 인정하지 않는 ｢민법｣ 조항이 사실혼 배우자인 청구인의 상속권을 침해하는 것은 아니다.","부모가 자녀의 이름을 지어주는 것은 자녀의 양육과 가족생활을 위하여 필수적인 것이고, 가족생활의 핵심적 요소라 할 수 있으므로, ‘부모가 자녀의 이름을 지을 자유’는 혼인과 가족생활을 보장하는 헌법 제36조 제1항과 행복추구권을 보장하는 헌법 제10조에 의하여 보호받는다.",1,0,""],["2023-2","형사법",1,"죄형법정주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제349조(부당이득)에서 정하는 ‘현저하게 부당한 이익’은 그 비교기준이 되는 정당한 이익 내지는 원래의 급부가치는 무엇인지에 대한 규정이 없어 일반 국민들로서는 해당 법률 조항으로는 어느 정도가 정당한 이익인지를 예측하기 어렵고, 수사기관으로서도 객관적이고 구속적인 해석 및 집행의 기준을 제공받지 못하므로 자의적･선별적인 법집행에로 이끌리기 쉬워 해당 법률조항은 죄형법정주의의 명확성의 원칙에 반한다.","｢형법｣ 제207조(통화의 위조 등) 제3항에 규정된 ‘외국에서 통용된다’고 함은 그 외국에서 강제통용력을 가지는 것을 의미하는 것이므로, 일반인의 관점에서 통용할 것이라고 오인할 가능성이 있다고 하여 외국에서 통용되지 아니하는, 즉 강제 통용력을 가지지 아니하는 지폐까지 ｢형법｣ 제207조 제3항의 외국에서 통용하는 지폐에 포함시키면 이는 유추해석 내지 확장 해석하여 적용하는 것이 되어 죄형법정주의의 원칙에 위배된다.","형사처벌에 관한 위임입법은 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우에 한하여 수권법률(위임법률)이 구성요건의 점에서는 처벌대상인 행위가 어떠한 것인지 이를 예측할 수 있을 정도로 구체적으로 정하고, 형벌의 점에서는 형벌의 종류 및 그 상한과 폭을 명확히 규정하는 것을 전제로 허용된다.","｢가정폭력범죄의 처벌 등에 관한 특례법｣이 정한 보호처분 중의 하나인 사회봉사명령은 가정폭력범죄행위에 대하여 형사처벌 대신 부과되는 것으로서, 가정폭력범죄를 범한 자에게 의무적 노동을 부과하고 여가시간을 박탈하여 실질적으로는 신체적 자유를 제한하게 되므로, 이에 대하여는 원칙적으로 형벌불소급의 원칙에 따라 행위시법을 적용함이 상당하다.",0,0,""],["2023-2","형사법",2,"｢형법｣의 시간적 적용범위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","범죄의 성립과 처벌에 관하여 규정한 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령의 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워진 경우에는 종전 법령이 범죄로 정하여 처벌한 것이 부당하였다거나 과형이 과중하였다는 반성적고려에따라변경된것인지여부를따지지않고원칙적으로 ｢형법｣ 제1조 제2항이 적용된다.","형벌법규가 대통령령, 총리령, 부령과 같은 법규명령이 아닌 고시 등 행정규칙·행정명령, 조례 등에 구성요건의 일부를 수권 내지 위임한 경우에도 이러한 고시 등 규정이 위임입법의 한계를 벗어나지 않는 한 형벌법규와 결합하여 법령을 보충하는 기능을 하는 것이므로, 그 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워졌다면 ｢형법｣ 제1조 제2항이 적용된다.","형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우 ｢형법｣ 제1조 제2항을 적용하려면, 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접적으로 관련된 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하여야 한다.","법령이 개정 내지 폐지된 경우가 아니라, 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우도 ｢형법｣ 제1조 제2항에서 말하는 법령의 변경에 해당한다.",3,0,""],["2023-2","형사법",3,"착오에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제15조 제1항에 따르면 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.","甲은 자신의 아버지인 A의 지갑을 훔친다고 생각하고 지갑을 훔쳤으나, 사실 그 지갑은 아버지 친구인 B의 것이라면 甲의 행위는 과실 행위이므로 절도죄로 처벌되지 않는다. 사 법】(일반공채･101경비단･경행 경채)","법률의 착오에 있어서 위법성의 인식에 필요한 노력의 정도는 구체적인 행위정황과 행위자 개인의 인식능력 그리고 행위자가 속한 사회집단에 따라 달리 평가되어야 한다.","甲이 지나가던 행인 3명과 싸우다가 힘이 달리자 식칼을 가지고 이들 3명을 상대로 휘두르다가 이를 말리면서 식칼을 뺏으려던 A에게 상해를 입혔다면 甲에게 A에 대한 상해의 범의를 인정 할 수 없어 과실치상죄가 성립할 수 있을 뿐이다.",2,0,""],["2023-2","형사법",4,"과실범에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제14조에 따르면 정상적으로 기울여야 할 주의(注意)를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 정당한 이유가 있는 때에 한하여 벌하지 아니한다.","의료과오사건에 있어서 의사의 과실을 인정하려면 결과 발생을 예견할 수 있고 또 회피할 수 있었음에도 이를 하지 못한 점을 인정할 수 있어야 하고, 위 과실의 유무를 판단함에는 사회적 평균인의 주의 정도를 표준으로 하여야 하며, 이때 사고 당시의 일반적인 의학의 수준과 의료환경 및 조건, 의료행위의 특수성 등을 고려하여야 한다.","과실범의 주의의무는 반드시 개별적인 법령에서 일일이 그 근거나 내용이 명시되어 있어야만 하는 것이 아니며, 결과 발생에 즈음한 구체적인 상황에서 이와 관련된 제반 사정들을 종합적으로 평가하여 결과 발생에 대한 예견 및 회피 가능성을 기준으로 삼아 그 결과 발생을 방지하여야 할 주의의무를 인정할 수 있는 것이다.","｢형법｣ 제364조에 따른 업무상과실장물취득죄는 업무상과실에 의하여 ｢형법｣ 제362조 제1항에 따른 단순과실장물취득죄보다 형이 가중되는 가중적 구성요건이다.",2,0,""],["2023-2","형사법",5,"위법성조각사유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","방위행위, 피난행위, 자구행위가 그 정도를 초과한 경우에는 정황(情況)에 따라 그 형을 감경하거나 면제한다.","가해자의 행위가 피해자의 부당한 공격을 방위하기 위한 것이라기 보다는 서로 공격할 의사로 싸우다가 먼저 공격을 받고 이에 대항하여 가해하게 된 것이라고 봄이 상당한 경우, 그 가해행위는 방어행위인 동시에 공격행위의 성격을 가지므로 정당방위 또는 과잉방위행위라고 볼 수 없다.","정당방위, 긴급피난, 자구행위의 성립요건으로 ‘상당한 이유가 있을 것’이 요구된다.","피해자의 승낙은 해석상 개인적 법익을 훼손하는 경우에 법률상 이를 처분할 수 있는 사람의 승낙을 말할 뿐만 아니라 그 승낙이 윤리적, 도덕적으로 사회상규에 반하는 것이 아니어야 한다.",0,0,""],["2023-2","형사법",6,"정당행위에 관한 설명 중 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 甲은 ○○수지요법학회의 지회를 운영하면서 일반인에게 수지침을 보급하고 무료의료봉사활동을 하는 사람으로서 A에게 수지침 시술을 부탁받고 아무런 대가 없이 수지침 시술을 해 준 경우, 甲이 침술 면허가 없다고 해도 해당 행위는 사회 상규에 위배되지 아니하는 행위로서 위법성이 조각될 수 있다. ㉡ A 노동조합의 조합원 甲 등이 관계 법령에서 정하는 서면 신고의무에따라쟁의행위의일시, 장소, 참가인원및그방법에 관한 서면신고를 하지 않고 쟁의행위를 한 경우, 세부적･형식적 절차를 미준수한 것으로서 쟁의행위의 정당성이 부정된다. ㉢ A 아파트 입주자대표회의 회장인 甲이 자신의 승인 없이 동대표들이 관리소장과 함께 게시한 입주자대표회의의 소집 공고문을 뜯어내 제거한 경우, 해당 공고문을 손괴한 조치가 그에 선행하는 위법한 공고문 작성 및 게시에 따른 위법상태의 구체적 실현이 임박한 상황 하에서 그 위법성을 바로잡기 위한 것이라면 사회통념상 허용되는 범위를 크게 넘어서지 않는 것으로 볼 수 있다. ㉣ 甲이 ｢가정폭력범죄의 처벌 등에 관한 특례법｣상의 임시보호 명령을위반하여피해자인A의주거지에접근하고문자메시지를 보낸 경우, 이에 대하여 A의 양해 내지 승낙이 있었다면 甲의 행위가 사회상규에 위배되는 행위로 볼 것은 아니다.","㉠㉡","㉠㉢","㉠㉡㉣","㉠㉢㉣",1,0,""],["2023-2","형사법",7,"책임에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제10조 제2항에 따르면 심신장애로 인하여 사물을 변별할 능력이나 의사를 결정할 능력이 미약한 사람의 행위는 형을 감경할 수 있다.","｢형법｣ 제10조에 규정된 심신장애는 생물학적 요소로서 정신병 또는 비정상적 정신상태와 같은 정신적 장애가 있는 외에 심리학적 요소로서 이와 같은 정신적 장애로 말미암아 사물에 대한 변별능력과 그에 따른 행위통제능력이 결여되거나 감소 되었음을 요하므로, 정신적 장애가 있는 자라고 하여도 범행 당시 정상적인 사물변별능력이나 행위통제능력이 있었다면 심신장애로 볼 수 없다.","｢형법｣ 제10조 제1항 및 동조 제2항에 규정된 심신장애의 유무 및 정도의 판단은 법률적 판단으로서 반드시 전문감정인의 의견에 기속되어야 하는 것은 아니고, 정신분열증의 종류와 정도, 범행의 동기, 경위, 수단과 태양, 범행 전후의 피고인의 행동, 반성의 정도등여러사정을종합하여법원이독자적으로판단할수있다.","원인에 있어서 자유로운 행위에 관한 ｢형법｣ 제10조 제3항은 원인행위시 심신장애 상태에서 위법행위로 나아갈 예견가능성이 없었던 경우에도 적용된다.",3,0,""],["2023-2","형사법",8,"다음 사례와 학설에 관한 설명으로 가장 적절한 것은? <사 례> 甲이 야간에 자신의 방에 들어오는 룸메이트를 강도로 오인하고 상해의 고의는 없이 방어할 의사로 그를 폭행하였는데 강도로 오인한 과실이 회피 가능하였을 경우 <학 설> (가) 범죄를 불법과 책임의 두 단계로 나누어, 위법성조각사유의 요건을 소극적 구성요건요소로 이해하는 이론으로서, 위 사례는 구성요건적 착오의 문제로 이해하는 견해 (나) 위법성의 인식을 고의의 요소가 아닌 독자적인 책임요소로 파악하는이론으로서, 위사례는금지착오의문제로이해하는견해 (다) 위법성조각사유의 전제사실은 구성요건적 사실과 유사하다는 점을 전제로 하여, 위 사례는 구성요건적 착오 규정을 유추적용 해야 하는 것으로 이해하는 견해 (라) 고의의 이중적 지위를 전제로 하여, 위 사례는 구성요건적 고의는 인정되나 책임고의가 탈락되어 결국 구성요건적 착오와 법효과적으로 동일한 것으로 이해하는 견해","(가)와 (다)에 따르면 甲에게는 폭행죄가 성립한다.","(나)와 (라)에 따르면 甲에게는 상해죄가 성립한다.","(나)와 (다)에 따르면 甲에게는 과실치상죄가 성립한다.","(가)와 (라)에 따르면 甲은 처벌되지 않는다.",3,0,""],["2023-2","형사법",9,"다음 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 허위내용의 고소장을 경찰관에게 제출하였다가 그 경찰관 으로부터 고소장의 내용만으로는 범죄 혐의가 없는 것이라 하므로 그 고소장을 되돌려 받은 때에는 ｢형법｣ 제156조에 따른 무고죄의 장애미수에 해당한다.","甲이 소송비용을 편취할 의사로 소송비용의 지급을 구하는 손해배상청구의 소를 제기하였다가 담당 판사로부터 소송비용의 확정은 소송비용액 확정절차를 통해 하라는 권유를 받고 위 소를 취하한 때에는 ｢형법｣ 제347조에 따른 사기죄의 불능미수에 해당한다.","甲이 외국환 수출의 신고를 하지 않은 채 일화를 국외로 반출 하기위해, 일화400만엔이든휴대용가방을가지고보안검색대에 나아가지 않은 채 공항 내에서 탑승을 기다리고 있던 중에 체포되었다면 일화 400만 엔의 반출에 대해서는 실행의 착수가 있다고 볼 수 없다.","甲이 A의 뒤에 서서 카메라폰으로 치마 속 신체 부위를 일정한 시간 동안 촬영하다가 경찰관에게 발각되어 저장버튼을 누르지 않고 촬영을 종료하였다면 구 ｢성폭력범죄의 처벌 및 피해자보호 등에 관한 법률｣ 제14조의2 제1항에 따른 카메라 등 이용촬영죄의 장애미수에 해당한다.",2,0,""],["2023-2","형사법",10,"다음 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 타인을 비방할 목적으로 허위의 기사 재료를 그 정을 모르는 기자에게 제공하여 신문 등에 보도되게 한 경우 甲에게 출판물에 의한 명예훼손죄의 간접정범이 성립할 수 있다.","국헌문란의 목적을 달성하기 위해 그러한 목적이 없는 대통령을 이용하여 비상계엄 전국확대조치를 한 것은 간접정범의 방법으로 내란죄를 실행한 것이다.","공범자의 범인도피행위의 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 자에 대하여는 범인도피죄의 공동정범이 성립한다.","피해자는강제추행에관한간접정범의의사를실현하는도구로서의 타인에 포함될 수 없다.",3,0,""],["2023-2","형사법",11,"공동정범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공동정범에서 주관적 요건인 공동가공의 의사는 타인의 범행을 인식하면서도 이를 제지하지 아니하고 용인하는 것만으로는 부족하고, 공동의 의사로 특정한 범죄행위를 하기 위하여 일체가 되어 서로 다른 사람의 행위를 이용하여 자기의 의사를 실행에 옮기는 것을 내용으로 하여야 한다.","공동정범이 성립하기 위하여는 반드시 공범자간에 사전 모의가 있어야 하므로, 우연히 만난 자리에서 서로 협력하여 공동의 범의를 실현하려는 의사가 암묵적으로 상통하여 범행에 공동 가공하더라도 공동정범은 성립되지 않는다.","공모공동정범에 있어서 공모자가 공모에 주도적으로 참여하여 다른 공모자의 실행에 영향을 미친 때에는 범행을 저지하기 위하여 적극적으로 노력하는 등 실행에 미친 영향력을 제거하지 아니하는 한 공모관계에서 이탈하였다고 할 수 없다.","비신분자가 신분관계로 인하여 성립될 범죄에 가공한 경우, 비신분자에게 공동가공의 의사와 이에 기초한 기능적 행위지 배를 통해 범죄의 실행이라는 주관적·객관적 요건이 충족되면 신분자와 공동정범이 성립한다.",1,0,""],["2023-2","형사법",12,"다음 사례에서 甲의 죄책에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함) 甲은 2022. 12. 21. 경부터 보이스피싱 사기범행에 사용된다는 사정을 알면서도 유령법인 설립, 그 법인 명의 계좌 개설 후 그 접근매체를 채팅 애플리케이션을 통해 대화명 A에게 전달 유통하는 행위를 계속하였다. 그 후 2023. 1. 15. 경 보이스피싱 조직원의 제안에 따라 이른바 ‘전달책’ 역할을 승낙하고, 2023. 1. 28.부터 ‘전달책’에 해당하는 실행행위를 하였다.","형법상 방조행위는 정범이 범행을 한다는 정을 알면서 그 실행 행위를 용이하게 하는 직･간접의 모든 행위를 가리킨다.","甲의 이러한 접근매체 전달･유통행위는 보이스피싱 사기 범행에 사용된다는 정을 알면서도 정범이 실행에 착수하기 이전부터 장래의 실행행위를 예상하고서 이를 용이하게 하는 유형적･ 물질적 방조행위이다.","甲이 ‘전달책’ 역할까지 승낙한 행위 역시 정범의 범행 결의를 강화시키는 무형적･정신적 방조행위이다.","甲이 ‘전달책’으로서의 행위를 한 때부터 비로소 피해자들에 대한 사기죄의 종범에 해당한다.",3,0,""],["2023-2","형사법",13,"죄수에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 강도범인이 체포를 면탈할 목적으로 경찰관에게 폭행을 가한 때에는 강도죄와 공무집행방해죄는 상상적 경합관계에 있다. ㉡ 피고인들이 피해자들의 재물을 강취한 후 그들을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 피고인들의 행위는 강도살인죄와 현주건조물방화치사죄에 모두 해당하고 그 두 죄는 실체적 경합관계에 있다. ㉢ ｢폭력행위 등 처벌에 관한 법률｣ 제4조 제1항은 그 법에 규정된 범죄행위를 목적으로 하는 단체를 구성하거나 이에 가입하는 행위(범죄단체구성･가입죄) 또는 구성원으로 활동 하는 행위(범죄단체 활동죄)를 처벌하도록 정하고 있는데, 범죄단체를 구성하거나 이에 가입한 자가 더 나아가 구성원으로 활동하는 경우, 각 행위는 실체적 경합관계에 있다. ㉣ 범죄단체 등에 소속된 조직원이 저지른 폭력행위 등 처벌에 관한 법률 위반(단체 등의 공동강요)죄 등의 개별적 범행과 동법 위반(단체 등의 활동)죄는 범행의 목적이나 행위 등 측면에서 일부 중첩되는 부분이 있고, 이에 특별한 사정이 없는 한 법률상 1개의 행위로 평가되어 실체적 경합이 아닌 상상적 경합관계에 있다고 보아야 한다.","0개","1개","2개","3개",0,0,""],["2023-2","형사법",14,"다음 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","폭행치사죄와 상해치사죄까지 ｢형법｣ 제263조(동시범)를 적용 하면 피고인에게 불리한 유추적용이 되므로 동 규정의 적용은 배제되어야 한다.","공무집행방해죄에서의 ‘폭행’은 사람에 대한 유형력의 행사로 족하고 반드시 그 신체에 대한 것임을 요하지 아니하며, 또한 추상적 위험범으로서 구체적으로 직무집행의 방해라는 결과 발생을 요하지도 아니한다.","살인예비죄가 성립하기 위한 ‘준비행위’는 물적인 것에 한정되지 아니하며 특별한 정형이 있는 것도 아니어서 단순히 범행의 의사 또는 계획만으로도 충분하므로, 객관적으로 보아 살인죄의 실현에 실질적으로 기여할 수 있는 외적 행위를 필요로 하는 것은 아니다.","甲이 상습으로 A를 폭행하고, 자신의 어머니 B를 존속폭행 하였다는 내용으로 기소된 사안에서, 甲에게 폭행 범행을 반복하여 저지르는 습벽이 있고 이러한 습벽에 의하여 단순폭행, 존속폭행 범행을 저지른 사실이 인정된다면 단순폭행, 존속폭행의 각 죄별로 상습성을 판단하여야 한다.",1,0,""],["2023-2","형사법",15,"과실치사상의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","4층 건물의 2층 내부 벽면에 설치된 분전반을 통해 3층과 4층으로 가설된 전선이 합선으로 단락되어 화재가 나 상해가 발생한 사안에서, 단지 4층 건물의 소유자로서 위 건물 2층을 임대 하였다는 사정만으로는 업무상과실치상죄에 있어서의 ‘업무’로 보기 어렵다.","고속도로를 무단횡단하는 보행자를 충격하여 사고를 발생시킨 경우라도 운전자가 상당한 거리에서 보행자의 무단횡단을 미리 예상할 수 있는 사정이 있었고, 그에 따라 즉시 감속하거나 급제동하는 등의 조치를 취하였다면 보행자와의 충돌을 피할 수 있었다는 등의 특별한 사정이 인정되는 경우에는 자동차 운전자의 과실을 인정할 수 있다.","야간 당직간호사가 담당 환자의 심근경색 증상을 당직의사에게 제대로 보고하지 않음으로써 당직의사가 필요한 조치를 취하지 못한 채 환자가 사망하였다면 병원의 야간당직 운영체계상 당직의사에게도 업무상 과실이 있다.","의사가 환자에 대하여 주된 의사의 지위에서 진료하는 경우라도, 자신은 환자의 수술이나 시술에 전념하고 마취과 의사로 하여금 마취와 환자 감시 등을 담당토록 하는 경우처럼 서로 대등한 지위에서 각자의 의료영역을 나누어 환자 진료의 일부를 분담하였다면, 진료를 분담받은 다른 의사의 전적인 과실로 환자에게 발생한 결과에 대하여는 주된 의사의 책임을 인정 할 수 없다.",2,0,""],["2023-2","형사법",16,"다음 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","협박죄는 사람의 의사결정의 자유를 보호법익으로 하는 위험범 이라 봄이 상당하고, 협박죄의 미수범 처벌조항은 해악의 고지가 현실적으로 상대방에게 도달하지 아니한 경우나, 도달은 하였으나 상대방이 이를 지각하지 못하였거나 고지된 해악의의미를 인식하지 못한 경우 등에 적용될 뿐이다.","체포죄는 계속범으로서 원칙적으로 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 성립하고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우라면 체포죄의 성립은 부정되어 무죄가 된다.","강간죄의 성립에 언제나 직접적으로 또 필요한 수단으로서 감금행위를 수반하는 것은 아니므로 감금행위가 강간미수죄의 수단이 되었다 하여 감금행위는 강간미수죄에 흡수되어 범죄를 구성하지 않는다고 할 수는 없는 것이고, 그때에는 감금죄와 강간미수죄는 일개의 행위에 의하여 실현된 경우로서 ｢형법｣ 제40조의 상상적 경합관계에 있다.","甲은 A로 하여금 주차장을 이용하지 못하게 할 의도로 乙과 공모하여 乙의 차량을 A의 주택 앞에 주차하였으나, 주차 당시 甲과 A 사이에 물리적 접촉이 있거나 甲이 A에게 어떠한 유형력을 행사했다고 볼만한 사정이 없고, 甲의 행위로 A 본인의 차량을 주택 내부의 주차장에 출입시키지 못하는 불편은 발생 하였으나 A는 차량을 용법에 따라 정상적으로 사용할 수 있었다면 甲은 A를 폭행하여 차량 운행에 관한 권리행사를 방해하였다고 평가하기는 어렵다.",1,0,""],["2023-2","형사법",17,"강간과추행의죄에관한설명으로가장적절한것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제299조의 준강제추행죄는 정신적·신체적 사정으로 인하여 성적인 자기방어를 할 수 없는 사람의 성적 자기결정권을 보호해 주는 것을 보호법익으로 하며, 그 성적 자기결정권은 원치 않는 성적 관계를 거부할 권리라는 소극적 측면을 말한다.","범인이 피해자를 촬영하기 위하여 육안 또는 캠코더의 줌 기능을 이용하여 피해자가 있는지 여부를 탐색하다가 피해자를 발견하지 못하고 촬영을 포기하였더라도 이는 촬영을 위한 준비행위를 한 것으로 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)죄의 실행에 착수한 것이다.","｢성폭력범죄의 처벌 등에 관한 특례법｣ 제14조 제2항에서 유포 행위의 한 유형으로 열거하고 있는 ‘공공연한 전시’란 불특정 또는 다수인이 촬영물 등을 인식할 수 있는 상태에 두는 것을 의미하고, 따라서 촬영물 등의 ‘공공연한 전시’로 인한 범죄는 불특정 또는 다수인이 전시된 촬영물 등을 실제 인식하지 못하였다면 성립하지 않는다.","‘강제추행’이란 객관적으로 일반인에게 성적 불쾌감이나 혐오감을 일으키게 하고 선량한 성적 도덕관념에 반하는 행위로서 피해자의 성적 자유를 침해하는 것이므로 강제추행죄의 성립에 필요한 주관적 구성요건으로는 성욕을 자극･흥분･만족시키려는 주관적 동기나 목적이 있어야 한다.",0,0,""],["2023-2","형사법",18,"명예에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사실적시의 내용이 개인에 관한 사항이더라도 공공의 이익과 관련되어 있고 사회적인 관심을 획득한 경우라면 직접적으로 국가·사회 일반의 이익이나 특정한 사회집단에 관한 것이 아니라는이유만으로｢형법｣ 제310조의적용을배제할것은아니다.","명예훼손죄와 모욕죄에서 전파가능성을 이유로 공연성을 인정하는 경우에는 적어도 범죄구성요건의 주관적 요소로서 미필적 고의가 필요하므로, 전파가능성에 대한 인식이 있음은 물론 나아가 위험을 용인하는 내심의 의사가 있어야 한다.","인터넷 등 공간에서 작성된 단문의 글이라고 하더라도, 그 내용이 자신의 의견을 강조하거나 압축하여 표현한 것이라고 평가할 수 있고 표현도 지나치게 모욕적이거나 악의적이지 않다면 ｢형법｣ 제20조에 의하여 위법성이 조각될 수 있다.","甲은 자신의 인터넷 채널에 A의 방송 영상을 게시하면서 A의 얼굴에 ‘개’ 얼굴을 합성하는 방법을 사용하였는바, 그 영상의 전체적인내용을살펴볼때A의얼굴을가리는용도로동물그림을 사용하면서 A에 대한 부정적인 감정을 다소 해학적으로 표현하려 한 것에 불과한 경우라도이러한 행위는 모욕적표현에 해당한다.",3,0,""],["2023-2","형사법",19,"다음 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲을 비롯한 직원들의 임금이 체불되고 사무실 임대료를 내지 못할 정도로 재정 상태가 좋지 않는 등 회사의 경영상황이 우려되고 대표이사 겸 최대주주인 A의 경영능력이 의심받던 상황에서, 甲이 동료 직원들과 함께 A를 만나 사임제안서만을 전달한 행위는 협박죄에서의 ‘협박’에 해당한다.","｢형법｣ 제316조 제2항 소정의 전자기록등내용탐지죄의 객체인 ‘전자기록 등 특수매체기록’이 되기 위해서는 특정인의 의사가 표시되어야하는바, 인터넷계정등에 접속하는과정에서입력하는 아이디 및 비밀번호 등 자체는 특정인의 의사를 표시한 것으로 보기 어려워 ‘전자기록 등 특수매체기록’이라 할 수 없다.","｢형법｣ 제316조 제2항 소정의 전자기록등내용탐지죄는 봉함 기타 비밀장치한 전자기록 등 특수매체기록을 기술적 수단을 이용하여 그 내용을 알아낸 자를 처벌하는 규정인바, 전자기록 등 특수매체기록에 해당하더라도 봉함 기타 비밀장치가 되어 있지 아니한 것은 이를 기술적 수단을 동원해서 알아냈더라도 전자 기록등내용탐지죄가 성립하지 않는다.","甲은 연인관계인 A로부터 안방에 TV를 설치하여 달라는 요청을 받고 통상적인 출입방법에 따라 A의 안방에 들어간 후 A가 있는 자리에서 TV를 설치하는 등 달리 A의 사실상 평온상태가 침해되었다고 볼 만한 사정이 없었더라도, 甲의 출입이 실제로는 CCTV 카메라와 동영상 저장장치를 부착한 TV인 사실을 숨기고 이루어졌다면 甲에게는 주거침입죄가 성립한다.",2,0,""],["2023-2","형사법",20,"재산죄에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 회사직원이 퇴사한 후에는 특별한 사정이 없는 한 더 이상 업무상배임죄에서 타인의 사무를 처리하는 자의 지위에 있다고 볼 수 없어, 퇴사한 회사직원이 반환하거나 폐기하지 아니한 영업비밀 등을 경쟁업체에 유출하거나 스스로의 이익을 위하여 이용하더라도 그 유출 내지 이용행위에 대하여는 따로 업무상배임죄를 구성할 여지는 없다. ㉡ A는 드라이버를 구매하기 위해 특정 매장에 방문하였다가 자신의 지갑을 떨어뜨렸는데, 10분쯤 후 甲이 같은 매장에서 우산을 구매하고 계산을 마친 뒤, 그 지갑을 발견하여 습득한 매장 주인 B로부터 “이 지갑이 선생님 지갑이 맞느냐?”라는 질문을 받자 “내 것이 맞다.”라고 대답한 후 이를 교부받아 가지고 갔다면 甲에게는 절도죄가 아니라 사기죄가 성립한다. ㉢ 업무상배임죄에있어‘재산상이익취득’과‘재산상손해발생’은 대등한 범죄성립요건이고, 따라서 임무위배행위로 인하여 여러 재산상 이익과 손해가 발생하더라도 재산상 이익과 손해 사이에 서로 대응하는 관계에 있는 등 일정한 관련성이 인정되어야 업무상배임죄가 성립한다. ㉣ 주류회사 이사인 甲은 A를 상대로 주류대금 청구소송을 제기한 민사 분쟁 중에 A의 착오로 위 주류회사 명의 계좌로 송금된 4,700,000원을 보관하게 되었고, 이후 A로부터 해당 금원이 착오송금된것이라는사정을문자메시지를통해고지받았음에도 불구하고, 甲 본인이 주장하는 채권액인 1,108,310원을 임의로 상계 정산하여 반환을 거부하였다면, 설령 나머지 금액을 반환하고 상계권 행사의 의사를 충분히 밝혔다 하더라도 甲에게는 횡령죄가 성립한다.","0개","1개","2개","3개",1,0,""],["2023-2","형사법",21,"재산죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사기죄의 보호법익은 재산권이므로 도급계약이나 물품구매 조달 계약 체결 당시 관련 영업 또는 업무를 규제하는 행정법규나 입찰 참가자격, 계약절차 등에 관한 규정을 위반한 사정이 있더라도 그러한 사정만으로 도급계약을 체결한 행위가 기망 행위에 해당한다고 단정해서는 안 된다.","예금주인 현금카드 소유자를 협박하여 그 카드를 갈취한 다음 피해자의 승낙에 의하여 현금카드를 사용할 권한을 부여받아 이를 이용하여 현금자동지급기에서 현금을 인출한 행위는 현금카드 갈취행위와 분리하여 따로 절도죄로 처단할 수는 없다.","자동차를 절취한 후 자동차등록번호판을 떼어내는 행위는 새로운 법익의 침해로 보아야 하므로 이와 같은 번호판을 떼어내는 행위가 절도범행의 불가벌적 사후행위가 되는 것은 아니다.","절도 범인으로부터 장물보관 의뢰를 받은 자가 그 정을 알면서 이를 인도받아 보관하고 있다가 그 보관 장물을 임의로 처분 하였다면 장물보관죄 외에 별도로 횡령죄가 성립한다.",3,0,""],["2023-2","형사법",22,"다음 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲은 건물의 소유자로, 해당 건물을 매입하기 위한 소요자금을 대납하는 조건으로 해당 건물에서 약 2개월 동안 거주하고 있던 A가 위 금액을 입금하지 않자, A를 내쫓을 목적으로 아들인 乙에게 A가 거주하는 곳의 현관문에 설치된 디지털 도어락의 비밀번호를 변경할 것을 지시하고, 이에 따라 乙이 그 도어락의 비밀번호를 변경하였다면 甲에게는 권리행사방해교사죄가 성립한다.","甲이 타인 소유 토지의 이용을 방해할 목적으로 권한 없이 건물을 신축하였다면, 이는 다른 사람의 소유물을 본래의 용법에 따라 무단으로 사용·수익하는 행위로 소유자를 배제한 채 물건의 이용가치를 영득하는 것이고 그 결과 소유자가 물건의 효용을 누리지 못하게 된 것으로 볼 수 있어 이와 같은 甲의 행위는 재물손괴죄에 해당한다.","건물의 임차인인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하였는데도 A에게 채권양도 통지를 하지 않고 A로부터 남아 있던 임대차보증금을 반환받아 보관하던 중 개인적인 용도로 사용하였다면 甲에게는 횡령죄가 성립한다.","甲은 PC방에 게임을 하러 온 A로부터 20,000원을 인출해 오라는 부탁과 함께 현금카드를 건네받게 되자, 위법하게 이득할 의사로 권한 없이 그 위임받은 금액을 초과한 50,000원을 인출한 후 그 중 20,000원만 A에게 건네주고 30,000원을 취득하였다면, 甲의 행위는 그 차액 상당액에 관하여 컴퓨터등사용사기죄에 해당한다.",3,0,""],["2023-2","형사법",23,"문서에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제228조 제1항 공전자기록 등 불실기재죄의 구성요건인 ‘불실의 사실기재’는 당사자의 허위신고에 의하여 이루어져야 하므로, 법원의 촉탁에 의하여 등기를 마친 경우에는 그 전제 절차에 허위적 요소가 있더라도 위 죄가 성립하지 않는다.","작성자가 ‘행사할 목적’으로 타인의 자격을 모용하여 문서를 작성하였다 하더라도, 문서행사의 상대방이 자격모용 사실을 알았다거나, 작성자가 그 문서에 모용한 자격과 무관한 직인을 날인하였다는 등의 사정이 있었다면 자격모용에 의한 사문서 작성죄의 범의와 행사의 목적은 인정되지 않는다.","명의인을 기망하여 문서를 작성케 하는 경우에는, 서명·날인이 정당히 성립된 경우라도 기망자는 명의인을 이용하여 서명 날인자의 의사에 반하는 문서를 작성케 하는 것이므로 사문서 위조죄가 성립한다.","사용권한자와 용도가 특정되어 있는 공문서를 사용권한 없는 자가 사용한 경우에도 그 공문서 본래의 용도에 따른 사용이 아닌 경우에는 공문서부정행사죄가 성립하지 않는다.",1,0,""],["2023-2","형사법",24,"공무원의 직무에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무원이 태만이나 착각 등으로 인하여 직무를 성실히 수행하지 않은 경우 또는 직무를 소홀하게 수행하였기 때문에 성실한 직무수행을 못한 데 지나지 않는 경우에는 직무유기죄가 성립 하지 않는다.","경찰공무원이 지명수배 중인 범인을 발견하고도 직무상 의무에 따른적절한조치를취하지아니하고오히려범인을도피하게하는 행위를 하였다면, 범인도피죄만 성립하고 직무유기죄는 따로 성립하지 않는다.","공무상비밀누설죄는 공무원 또는 공무원이었던 자가 법령에 의한 직무상 비밀을 누설하는 것을 구성요건으로 하고 있는바, 여기서 ‘법령에 의한 직무상 비밀’이란 법령에 의하여 비밀로 규정되었거나 비밀로 분류 명시된 사항에 한정된다.","통고처분이나 고발을 할 권한이 없는 세무공무원이 그 권한자에게 범칙사건 조사 결과에 따른 통고처분이나 고발조치를 건의하는 등의 조치를 취하지 않았다고 하더라도, 구체적 사정에 비추어 그것이 직무를 성실히 수행하지 못한 것이라고 할 수 있을지 언정 그 직무를 의식적으로 방임 내지 포기하였다고 볼 수 없다.",2,0,""],["2023-2","형사법",25,"뇌물죄에 관한 설명으로 옳지 않은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 법령에 의한 임용권을 가지는 자에 의하여 임용되어 상당히 오랜 기간동안 공무에 종사하여 온 사람이 나중에 그가 임용 결격자이었음이 밝혀져 당초의 임용행위가 무효라고 하더라도 ｢형법｣ 제129조에서 규정한 공무원으로 봄이 타당하고, 그가 그직무에관하여뇌물을수수한때에는수뢰죄로처벌할수있다. ㉡ 타인을 기망하여 뇌물을 수수한 경우 뇌물을 수수한 공무원 에게는 뇌물죄와 사기죄가 성립하고 양 죄는 실체적 경합 관계에 있다. ㉢ 공무원이 직무집행을 빙자하여 타인의 재물을 갈취한 경우 뇌물공여죄가 성립하지 않는다. ㉣ 알선수뢰죄에서 ‘공무원이 그 지위를 이용하여’라 함은 친구, 친족관계 등 사적인 관계를 이용하는 경우뿐만 아니라 다른 공무원이 취급하는 사무처리에 법률상이거나 사실상으로 영향을 줄 수 있는 관계에 있는 공무원이 그 지위를 이용하는 경우도 포함한다.","㉠㉡","㉡㉢","㉡㉣","㉢㉣",2,0,""],["2023-2","형사법",26,"공무방해에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","불법체류를 이유로 강제출국 당한 중국 동포인 피고인이 중국 에서 이름과 생년월일을 변경한 호구부를 발급받아 중국 주재 대한민국 총영사관에 제출하여 입국사증을 받은 다음, 다시 입국하여 외국인등록증을 발급받고 귀화허가신청서까지 제출한 경우, 출원인의 적극적인 위계에 의해 사증 및 외국인등록증이 발급되었던 것이므로 위계에 의한 공무집행방해죄가 성립하고, 귀화허가가 이루어지지 아니하였더라도 위 죄의 성립에 아무런 영향이 없다.","과속단속카메라에 촬영되더라도 불빛을 반사시켜 차량 번호판이 식별되지 않도록 하는 기능이 있는 제품을 차량 번호판에 뿌린 상태로 차량을 운행한 경우, 이는 공무원의 감시·단속업무를 적극적으로방해한것으로위계에의한공무집행방해죄가성립한다.","마약범죄 피의자가 타인의 소변을 마치 자신의 소변인 것처럼 수사기관에 건네주어 필로폰 음성반응이 나오게 한 경우, 위계에 의한 공무집행방해죄는 성립하지 않는다.","피의자나 참고인이 아닌 자가 자발적이고 계획적으로 피의자를 가장하여 수사기관에 대하여 허위사실을 진술한 경우 위계에 의한 공무집행방해죄가 성립한다.",0,0,""],["2023-2","형사법",27,"다음 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 위증죄는 법률에 의하여 선서한 증인이 사실에 관하여 기억에 반하는 진술을 한 때에 성립하고, 증인의 진술이 경험한 사실에 대한 법률적 평가이거나 단순한 의견에 지나지 아니하는 경우에는 위증죄에서 말하는 허위의 공술이라고 할 수 없으나, 경험한 객관적 사실에 대한 증인 나름의 법률적·주관적 평가나 의견을 부연한 부분에 다소의 오류나 모순이 있는 경우 위증죄가 성립한다. ㉡ 피고인 자신이 직접 형사처분이나 징계처분을 받게 될 것을 두려워한 나머지 자기의 이익을 위하여 그 증거가 될 자료를 인멸하였다면, 그 행위가 동시에 다른 공범자의 형사사건이나 징계사건에 관한 증거를 인멸한 결과가 된다고 하더라도 이를 증거인멸죄로 다스릴 수 없다. ㉢ 피고인 자신을 위해 증인을 도피하게 한 행위가 동시에 다른 공범자의 형사사건이나 징계사건에 관한 증인을 도피하게 한 결과로 되는 경우 증인도피죄가 성립한다. ㉣ 참고인이 타인의 형사사건 등에 관하여 제3자와 대화를 하면서 허위로 진술하고 위와 같은 허위 진술이 담긴 대화 내용을 녹음한 녹음파일 또는 이를 녹취한 녹취록을 만들어 수사 기관 등에 제출하는 것은 증거위조죄를 구성하지 아니한다. ㉤ 무고죄는 국가의 형사사법권 또는 징계권의 적정한 행사를 주된 보호법익으로 하고 다만, 개인의 부당하게 처벌 또는 징계받지 아니할 이익을 부수적으로 보호하는 죄이므로, 설사 무고에 있어서 피무고자의 승낙이 있었다고 하더라도 무고죄가 성립한다.","㉠㉡","㉡㉣","㉡㉤","㉢㉤",2,0,""],["2023-2","형사법",28,"수사에 관한 설명으로 가장 적절하지 않은 것은?","사법경찰관은 고소･고발 사건을 포함하여 범죄를 수사한 때, 범죄 혐의가 있다고 인정되면 지체없이 관계 서류와 증거물을 함께 첨부하여 검사에게 사건을 송치하고, 그 밖의 경우에는 그 이유를 명시한 서면만을 지체없이 검사에게 송부하여야 한다.","검사는 사법경찰관과 동일한 범죄사실을 수사하게 된 때에는 사법경찰관에게 사건을 송치할 것을 요구할 수 있으며, 송치 요구를 받은 사법경찰관은 원칙적으로 지체 없이 검사에게 사건을 송치하여야 한다.","검사는 사법경찰관이 사건을 송치하지 아니한 것이 위법 또는 부당한 때에는 그 이유를 문서로 명시하여 재수사를 요청할 수 있는데, 사법경찰관은 재수사 후 기소의견으로 사건을 검찰에 송치하거나 재차 불송치결정을 할 수 있다.","검사의 수사 개시는 예외적으로 인정되는데, 검사는 부패범죄, 경제범죄 등 대통령령으로 정하는 중요 범죄에 대해서는 수사를 개시할 수 있다.",0,2,"개정 전 형사소송법(검사의 직접수사·사건송치 요구)을 전제로 한 문항입니다. 2026.10.2.부터 검사의 수사권이 폐지되고(제195조·제196조 삭제) 송치 기한도 고소·고발 사건 3개월(제238조)로 바뀌어, 현행법 기준으로는 지문의 진위가 달라집니다."],["2023-2","형사법",29,"압수･수색 절차에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","압수･수색영장은 원칙적으로 처분을 받는 자에게 반드시 제시하고, 처분을 받는 자가 피의자인 경우에는 그 사본을 교부해야 하는데, 이는 준항고 등 피압수자의 불복신청의 기회를 실질적으로 보장하기 위한 것이다.","압수･수색영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피의자에 대하여 공소사실의 요지와 영장이 발부되었음을 고지하고 집행할 수 있다.","압수･수색영장 통지의 예외 사유인 ‘급속을 요하는 때’란 압수･ 수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수･수색의 실효를 거두기 어려울 경우를 의미한다.","수사기관이 A 회사에서 압수･수색영장을 집행하면서 A 회사에 팩스로 영장 사본을 송신하기만 하고 영장 원본을 제시하지 않았고 또한 압수조서와 압수물 목록을 작성하여 피압수･수색 당사자에게 교부하지 않은 채 피고인의 이메일을 압수한 후 이를 증거로 제출한 것은 적법절차 원칙의 실질적인 내용을 침해한 것이다.",1,0,""],["2023-2","형사법",30,"체포에 관한 다음 설명 중 옳지 않은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 경찰관들이 성폭력범죄 혐의에 대한 체포영장을 근거로 체포절차에 착수하였으나 피의자가 흥분하여 타고 있던 승용차를 출발시켜 경찰관들에게 상해를 입히는 범죄를 추가로 저지르자, 경찰관들이 그 승용차를 멈춘 후 저항하는 피의자를 별도 범죄인 특수공무집행방해치상의 현행범으로 적법하게 체포하였더라도, 집행완료에 이르지 못한 성폭력 범죄 체포영장은 사후에 그 피의자에게 제시하여야 한다. ㉡ 긴급체포의 요건을 갖추었는지 여부는 사후에 밝혀진 사정을 기초로 판단하는 것이 아니라 체포 당시 상황을 기초로 판단하여 수사주체의 판단에 상당한 재량의 여지가 있지만, 긴급체포 당시의 상황으로 보아서도 그 요건의 충족 여부에 관한 수사주체의 판단이 경험칙에 비추어 현저히 합리성을 잃은 경우에는 그 체포는 위법한 체포가 된다. ㉢ 사법경찰관은 긴급체포한 피의자에 대하여 구속영장을 신청하지 아니하고 석방한 경우에는 즉시 검사에게 보고하여야 하고, 검사는석방한 날부터 30일 이내에 서면으로 긴급체포 후 석방된자의인적사항, 긴급체포의일시･장소와긴급체포하게된 구체적 이유 등을 법원에 통지하여야 한다. ㉣ 체포한 피의자를 구속하고자 할 때에는 체포한 때부터 48시간 이내에 구속영장을 청구해야 하는데, 검사 또는 사법경찰관이 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 위 48시간의 기산점은 체포시이다.","㉠㉣","㉠㉢㉣","㉡㉢","㉣",0,0,""],["2023-2","형사법",31,"｢형사소송법｣ 제184조의 수사상 증거보전과 ｢형사소송법｣ 제221조의2의 증인신문에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","증거보전은 수사단계뿐 아니라 공소제기 이후에도 제1심 제1회 공판기일 전에 한하여 허용되지만, 재심청구사건에서는 증거 보전절차가 허용되지 않는다.","｢형사소송법｣ 제221조의2의 증인신문청구를 하려면 증인의 진술로서 증명할 대상인 피의사실이 존재해야 하는데, 피의사실은 수사기관 내심의 혐의만으로는 존재한다고 할 수 없고, 고소･ 고발 또는 자수를 받는 등 수사의 대상으로 삼고 있음을 외부로 표현한 때에 비로소 그 존재를 인정할 수 있다.","증거보전을 청구할 수 있는 것은 압수･수색･검증･증인신문･ 감정이어서 피의자의 신문을 구하는 청구는 할 수 없지만, 필요적 공범관계에 있는 공동피고인을 증인으로 신문할 것을 청구할 수 있다.","｢형사소송법｣ 제221조의2의증인신문에관한서류는증인신문을 한 법원이 보관하므로, 공소제기 이전에도 피의자 또는 변호인은 판사의 허가를 얻어 서류와 증거물을 열람 또는 등사할 수 있다.",3,1,
