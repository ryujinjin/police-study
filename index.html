 의한 공무집행방해죄가 성립된다고 할 수 없다.","cite":"대법원 76도3685","badge":"","topic":"","from":"GY-2023-2-X-26","seq":null},{"id":"X-OX-528","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"피고인들이 불법적인 농성을 계속하다가 관할 구청이 행정대집행 으로 농성 장소에 있던 물건을 치웠음에도 피고인들이 이에 대한 항의의 일환으로 집회를 개최하려고 하자, 또다시 같은 장소를 점거하고 물건을 다시 비치하는 것을 막기 위해 출동하여 농성 장소를 미리 둘러싼 경찰관들이 농성 장소 진입을 소극적으로 제지하는 과정에서 피고인들이 경찰관들을 밀치는 등 유형력을 행사한 행위는 공무집행방해죄를 구성한다. (24.2차)","answer":true,"quote":"피고인들을 포함한 ‘甲 주식회사 희생자 추모와 해고자 복직을 위한 범국민대책위원회’(이하 ‘대책위’라 한다)가 덕수궁 대한문 화단 앞 인도(이하 ‘농성 장소’라 한다)를 불법적으로 점거한 뒤 천막ㆍ분향소 등을 설치하고 농성을 계속하다가 관할 구청이 행정대집행으로 농성 장소에 있던 물건을 치웠음에도 대책위 관계자들이 이에 대한 항의의 일환으로 기자회견 명목의 집회를 개최하려고 하자, 출동한 경찰 병력이 농성 장소를 둘러싼 채 대책위 관계자들의 농성 장소 진입을 제지하는 과정에서 피고인들이 경찰관을 밀치는 등으로 공무집행을 방해하였다는 내용으로 기소된 사안에서, 경찰 병력이 행정대집행 직후 대책위가 또다시 같은 장소를 점거하고 물건을 다시 비치하는 것을 막기 위해 농성 장소를 미리 둘러싼 뒤 대책위가 같은 장소에서 기자회견 명목의 집회를 개최하려는 것을 불허하면서 소극적으로 제지한 것은 구 경찰관 직무집행법(2014. 5. 20.","cite":"대법원 2018도2993","badge":"","topic":"","from":"GY-2024-2-X-26","seq":null},{"id":"X-OX-570","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무집행방해죄에서 ‘직무를 집행하는’이란 공무원이 직무수행에 직접 필요한 행위를 현실적으로 행하고 있는 때만을 가리키는 것으로서, 불법주차차량에 불법주차스티커를 붙였다가 이를 다시 떼어낸 직후에 있는 주차단속공무원을 폭행한 경우, 공무집행방해죄가 인정되지 않는다. (25.2차)","answer":false,"quote":"형법 제136조 제1항 소정의 공무집행방해죄에 있어서 '직무를 집행하는'이라 함은 공무원이 직무수행에 직접 필요한 행위를 현실적으로 행하고 있는 때만을 가리키는 것이 아니라 공무원이 직무수행을 위하여 근무중인 상태에 있는 때를 포괄한다 할 것이고, 직무의 성질에 따라서는 그 직무수행의 과정을 개별적으로 분리하여 부분적으로 각각의 개시와 종료를 논하는 것이 부적절하고 여러 종류의 행위를 포괄하여 일련의 직무수행으로 파악함이 상당한 경우가 있다.","cite":"대법원 99도383","badge":"","topic":"","from":"GY-2025-2-X-26","seq":null},{"id":"X-OX-539","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"증거위조죄에서 ‘증거’라 함은 타인에게 유리한 것이건 불리한 것이건 가리지 아니하며 또 증거가치의 유무 및 정도를 불문한다. (26.1차)","answer":true,"quote":"증거위조죄의 증거는 국가형벌권 유무 확인에 관계되는 일체의 자료로, 유리·불리와 증거가치의 유무·정도를 묻지 않는다.","cite":"대법원 2010도2244 · 형법 제155조","badge":"","topic":"","from":"GY-2026-1-X-27","seq":null},{"id":"X-OX-554","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"위계로써 구체적인 공무집행을 저지하거나 현실적으로 곤란하게 하는 데까지 이르지 아니하였다 하더라도 위계에 의한 공무집행 방해죄가 성립한다. (24.1차)","answer":false,"quote":"위계에 의한 공무집행방해죄에서 ‘위계’의 의미 및 상대방이 이에 따라 그릇된 행위나 처분을 하여야만 위 죄가 성립하는지 여부 (적극) / 구체적인 직무집행을 저지하거나 현실적으로 곤란하게 하는 데까지 이르지 않은 경우, 위계에 의한 공무집행방해죄로 처벌할 수 있는지 여부 (소극)","cite":"대법원 2017도2583","badge":"","topic":"","from":"GY-2024-1-X-25","seq":null},{"id":"X-OX-559","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"자신의 강도상해 범행을 일관되게 부인하였으나 유죄판결이 확정된 피고인이 별건으로 기소된 공범의 형사사건에서 유죄가 확정된 자신의 범행사실을 부인하는 증언을 한 경우, 피고인 에게 사실대로 진술할 기대가능성이 없으므로 위증죄는 성립 하지 않는다. (25.1차)","answer":false,"quote":"자신의 강도상해 범행을 일관되게 부인하였으나 유죄판결이 확정된 피고인이 별건으로 기소된 공범의 형사사건에서 자신의 범행사실을 부인하는 증언을 한 사안에서, 피고인에게 사실대로 진술할 기대가능성이 있으므로 위증죄가 성립한다고 판단한 사례.","cite":"대법원 2005도10101","badge":"","topic":"","from":"GY-2025-1-X-08","seq":null},{"id":"X-OX-564","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"소송절차가 분리된 공범인 공동피고인이 증언거부권을 고지 받았음에도 자기의 범죄사실에 대하여 증언거부권을 행사하지 않고 허위로 진술한 경우, 위증죄가 성립하지 않는다. (25.1차)","answer":false,"quote":"소송절차가 분리된 공범인 공동피고인이 증언거부권을 고지받았음에도 자기의 범죄사실에 대하여 증언거부권을 행사하지 아니한 채 허위로 진술한 경우, 위증죄가 성립하는지 여부 (적극)","cite":"대법원 2023도7528","badge":"","topic":"","from":"GY-2025-1-X-27","seq":null},{"id":"X-OX-576","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제133조 제2항의 제3자뇌물취득죄는 뇌물공여자로부터 금품을 교부받는 것만으로는 부족하고, 교부받은 금품을 수뢰할 사람에게 전달하여야 성립한다. (26.1차)","answer":false,"quote":"제3자뇌물취득(증뢰물전달)죄는 사정을 알면서 금품을 교부받으면 성립하고, 수뢰할 사람에게 전달했는지는 묻지 않는다.","cite":"대법원 97도1572 · 형법 제133조","badge":"","topic":"","from":"GY-2026-1-X-26","seq":null},{"id":"X-OX-560","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"자기 자신을 무고하기로 제3자와 공모하고 이에 따라 무고행위에 가담한 경우, 자기 자신에게는 무고죄의 구성요건에 해당하지 않아 범죄가 성립할 수 없는 행위를 실현한 것일지라도 무고죄의 공동정범이 성립한다. (25.1차)","answer":false,"quote":"따라서 자기 자신을 무고하기로 제3자와 공모하고 이에 따라 무고행위에 가담하였더라도 이는 자기 자신에게는 무고죄의 구성요건에 해당하지 않아 범죄가 성립할 수 없는 행위를 실현하고자 한 것에 지나지 않아 무고죄의 공동정범으로 처벌할 수 없다.","cite":"대법원 2013도12592","badge":"","topic":"","from":"GY-2025-1-X-10","seq":null},{"id":"X-OX-520","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"적극적 소송당사자인 원고뿐만 아니라 방어적인 위치에 있는 피고라 하더라도 허위내용의 서류를 작성하여 이를 증거로 제출하거나 위증을 시키는 등의 적극적인 방법으로 법원을 기망하여 착오에 빠지게 한 결과 승소확정판결을 받음으로써 자기의 재산상의 의무이행을 면하게 된 경우, 그 재산가액 상당에 대하여 사기죄가 성립한다. (24.1차)","answer":true,"quote":"적극적 소송당사자인 원고뿐만 아니라 방어적인 위치에 있는 피고라 하더라도 허위내용의 서류를 작성하여 이를 증거로 제출하거나 위증을 시키는 등의 적극적인 방법으로 법원을 기망하여 착오에 빠지게 한 결과 승소확정판결을 받음으로써 자기의 재산상의 의무이행을 면하게 된 경우에는 그 재산가액 상당에 대하여 사기죄가 성립한다.","cite":"대법원 2003도333","badge":"","topic":"","from":"GY-2024-1-X-22","seq":null},{"id":"X-OX-543","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"타인에게 형사처분을 받게 할 목적으로 ‘허위의 사실’을 신고한 행위가 무고죄를 구성하기 위해서는 신고된 사실 자체가 형사처분의 대상이 될 수 있어야 하므로, 허위로 신고한 사실이 신고 당시에는 형사처분의 대상이 될 수 있었으나 이후 그러한 사실이 형사처분의 대상이 되지 않는 것으로 대법원 판례가 변경된 경우 무고죄는 성립하지 않는다. (22.1차)","answer":false,"quote":"타인에게 형사처분을 받게 할 목적으로 ‘허위의 사실’을 신고한 행위가 무고죄를 구성하기 위해서는 신고된 사실 자체가 형사처분의 대상이 될 수 있어야 하므로, 가령 허위의 사실을 신고하였더라도 신고 당시 그 사실 자체가 형사범죄를 구성하지 않으면 무고죄는 성립하지 않는다.","cite":"대법원 2015도15398","badge":"","topic":"","from":"GY-2022-1-X-26","seq":null},{"id":"X-OX-569","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"甲이 ｢국민기초생활 보장법｣상 ‘자활근로자’로 선정되어 주민 자치센터 사회복지담당 공무원의 복지도우미로 근무하던 乙을 협박하여 그 직무집행을 방해한 경우, 甲에게 공무집행방해죄가 인정된다. (25.2차)","answer":false,"quote":"피고인이 국민기초생활 보장법상 ‘자활근로자’로 선정되어 주민자치센터 사회복지담당 공무원의 복지도우미로 근무하던 甲을 협박하여 그 직무집행을 방해하였다는 내용으로 기소된 사안에서, 甲이 공무원으로서 공무를 담당하고 있었다고 볼 수 없다고 판단한 원심판결을 수긍한 사례","cite":"대법원 2010도14484","badge":"","topic":"","from":"GY-2025-2-X-26","seq":null},{"id":"X-OX-513","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"타인의 소변을 마치 자신의 소변인 것처럼 수사기관에 건네주어 필로폰 음성반응이 나오게 한 경우, 수사기관의 착오를 이용하여 적극적으로 피의사실에 관한 증거를 조작한 것이므로 위계에 의한 공무집행방해죄를 구성한다. (23.1차)","answer":true,"quote":"타인의 소변을 마치 자신의 소변인 것처럼 수사기관에 건네주어 필로폰 음성반응이 나오게 한 경우, 수사기관의 착오를 이용하여 적극적으로 피의사실에 관한 증거를 조작한 것이므로 위계에 의한 공무집행방해죄가 성립한다고 한 사례","cite":"대법원 2007도6101","badge":"","topic":"","from":"GY-2023-1-X-26","seq":null},{"id":"X-OX-572","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"경찰관이 불법체류자의 신병을 출입국관리사무소에 인계하지 않고 훈방하면서 이들의 인적사항조차 기재해 두지 아니하였다면, 작위에 의한 직무유기죄가 성립한다. (26.1차)","answer":false,"quote":"경찰관이 불법체류자의 신병을 출입국관리사무소에 인계하지 않고 훈방하면서 이들의 인적사항조차 기재해 두지 아니하였다면 직무유기죄가 성립한다고 한 사례.","cite":"대법원 2005도4202","badge":"","topic":"","from":"GY-2026-1-X-03","seq":null},{"id":"X-OX-561","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"수뢰자가 뇌물을 그대로 보관하다가 증뢰자에게 반환한 때에는 몰수나 추징의 상대방은 증뢰자가 되고, 몰수할 수 없는 때에 추징하여야 할 가액은 범인이 그 물건을 보유하고 있다가 몰수의 선고를 받았더라면 잃었을 이득상당액을 의미한다고 보아야 하므로, 다른 특별한 사정이 없는 한 그 가액산정은 반환 시의 가격을 기준으로 하여야 한다. (25.1차)","answer":false,"quote":"몰수는 범죄에 의한 이득을 박탈하는 데 그 취지가 있고, 추징도 이러한 몰수의 취지를 관철하기 위한 것인 점 등에 비추어 볼 때, 몰수할 수 없는 때에 추징하여야 할 가액은 범인이 그 물건을 보유하고 있다가 몰수의 선고를 받았더라면 잃었을 이득상당액을 의미하므로, 다른 특별한 사정이 없는 한 그 가액산정은 재판선고시의 가격을 기준으로 하여야 한다.","cite":"대법원 2008도6944","badge":"","topic":"","from":"GY-2025-1-X-13","seq":null},{"id":"X-OX-537","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무원이 퇴임한 이후에는 직권이 존재하지 않아 직권남용죄가 성립할 수 없으나 퇴임 후에도 실질적 영향력을 행사하는 등으로 퇴임 전 공모한 범행에 관한 기능적 행위지배가 계속되었다고 인정할 만한 특별한 사정이 있다면, 퇴임 후의 범행에 관하여도 공범으로서 책임을 질 수 있다. (26.1차)","answer":true,"quote":"퇴임 뒤에는 직권이 없어 원칙적으로 책임지지 않지만, 실질적 영향력으로 퇴임 전 공모한 범행의 기능적 행위지배가 이어졌다면 공범 책임을 진다.","cite":"대법원 2018도2236 · 형법 제123조","badge":"","topic":"","from":"GY-2026-1-X-25","seq":null},{"id":"X-OX-512","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"직무집행의 의사로 자신의 직무를 수행한 경우에는 그 직무집행의 내용이 위법한 것으로 평가된다는 점만으로 직무유기죄의 성립을 인정할 것은 아니고, 공무원이 태만·분망 또는 착각 등으로 인하여 직무를 성실히 수행하지 아니한 경우나 형식적으로 또는 소홀히 직무를 수행한 탓으로 적절한 직무수행에 이르지 못한 것에 불과한 경우에도 직무유기죄는 성립하지 아니한다. (22.2차)","answer":true,"quote":"직무유기는 직무를 의식적으로 방임할 때 성립하고, 내용이 위법한 집행이나 태만·착각에 따른 부실한 수행은 해당하지 않는다.","cite":"대법원 2012도15257","badge":"","topic":"","from":"GY-2022-2-X-26","seq":null},{"id":"X-OX-568","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"甲이 민사소송을 제기함에 있어 피고 乙의 주소를 허위로 기재하여 법원공무원으로 하여금 변론기일소환장 등을 허위주소로 송달케 한 경우, 甲의 행위는 법원공무원의 구체적이고 현실적인 직무집행을 방해한 것으로 볼 수 있으므로 위계에 의한 공무 집행방해죄가 인정된다. (25.2차)","answer":false,"quote":"민사소송을 제기함에 있어 피고의 주소를 허위로 기재하여 법원공무원으로 하여금 변론기일소환장 등을 허위주소로 송달케 하였다는 사실만으로는 이로 인하여 법원공무원의 구체적이고 현실적인 어떤 직무집행이 방해되었다고 할 수는 없으므로, 이로써 바로 위계에 의한 공무집행방해죄가 성립한다고 볼 수는 없다.","cite":"대법원 96도312","badge":"","topic":"","from":"GY-2025-2-X-26","seq":null},{"id":"X-OX-557","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"시청 청사 내 주민생활복지과 사무실에서 소란을 피우던 甲을 소속 공무원 A가 제지하며 밖으로 데리고 나가려 하자 甲이 A를 폭행한 경우, 민원 상담을 시도한 순간부터 민원 상담 시도를 종료한 순간까지만 소속 공무원의 직무 범위인 민원 업무에 해당 하는 것이므로 甲을 사무실에서 퇴거시키는 등의 후속 조치는 직무 범위에 포함되지 않는다고 할 것이므로 공무집행방해죄를 구성하지 않는다. (24.2차)","answer":false,"quote":"시청 청사 내 주민생활복지과 사무실에 술에 취한 상태로 찾아가 소란을 피우던 피고인을 소속 공무원 甲과 乙이 제지하며 밖으로 데리고 나가려 하자, 피고인이 甲과 乙의 멱살을 잡고 수회 흔든 다음 휴대전화를 휘둘러 甲의 뺨을 때림으로써 시청 공무원들의 주민생활복지에 대한 통합조사 및 민원 업무에 관한 정당한 직무집행을 방해하였다는 공소사실로 기소된 사안에서, 지방공무원법 제51조 , 제75조의2 , 민원 처리에 관한 법률 제5조 제2항 등에 비추어 시청 주민생활복지과 소속 공무원이 주민생활복지과 사무실에 방문한 피고인에게 민원 내용을 물어보며 민원 상담을 시도한 행위, 피고인의 욕설과 소란으로 정상적인 민원 상담이 이루어지지 않고 다른 민원 업무 처리에 장애가 발생하는 상황이 지속되자 피고인을 사무실 밖으로 데리고 나간 행위는 민원 안내 업무와 관련된 일련의 직무수행으로 포괄하여 파악함이 타당한 점, 행위 당시의 구체적 상황에 기초를 두고 객관적·합리적으로 판단해 보면, 담당 공무원이 피고인을 사무실 밖으로 데리고 나가는 과정에서 피고인의 팔을 잡는 등 다소의 물리력을 행사했더라도, 이는 피고인의 불법행위를 사회적 상당성이 있는 방법으로 저지한 것에 불과하므로 위법하다고 볼 수 없는 점, 소란을 피우는 민원인을 제지하거나 사무실 밖으로 데리고 나가는 행위도 민원 담당 공무원의 직무에 수반되는 행위로 파악함이 타당하고 직무권한의 범위를 벗어난 행위라고 볼 것은 아닌 점 등을 종합하면, 피고인의 행위는 시청 소속 공무원들의 적법한 직무집행을 방해한 행위에 해당하므로 공무집행방해죄를 구성하는데도, 이와 달리 본 원심판결에 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2021도13883","badge":"","topic":"","from":"GY-2024-2-X-26","seq":null},{"id":"X-OX-558","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제153조 소정의 위증죄를 범한 자가 자백, 자수를 한 경우의 형의 감면규정은 재판 확정 전의 자백을 형의 필요적 감경 또는 면제사유로 한다는 것이며, 또 위 자백의 절차에 관하여는 공술한 사건을 다루는 기관에 대한 자발적인 고백은 포함되나, 위증사건의 피고인 또는 피의자로서 법원이나 수사 기관의 신문에 의한 고백은 위 자백의 개념에 포함되지 않는다. (24.2차)","answer":false,"quote":"형법 제153조 소정의 위증죄를 범한자가 자백, 자수를 한 경우의 형의 감면규정은 재판 확정전의 자백을 형의 필요적 감경 또는 면제사유로 한다는 것이며, 또 위 자백의 절차에 관하여는 아무런 제한이 없으므로 그가 공술한 사건을 다루는 기관에 대한 자발적인 고백은 물론, 위증사건의 피고인 또는 피의자로서 법원이나 수사기관의 심문에 의한 고백도 위 자백의 개념에 포함된다.","cite":"대법원 73도1639","badge":"","topic":"","from":"GY-2024-2-X-27","seq":null},{"id":"X-OX-563","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"법률에 의하여 선서한 증인이 타인의 형사사건에 관하여 위증을 하면 ｢형법｣ 제152조 제1항의 위증죄가 성립되나, 자기의 형사 사건에 관하여 타인을 교사하여 위증죄를 범하게 하는 것은 방어권을 인정하는 취지에서 증거인멸교사죄가 성립되지 않는다. (25.1차)","answer":false,"quote":"피고인이 자기의 형사사건에 관하여 허위의 진술을 하는 행위는 피고인의 형사소송에 있어서의 방어권을 인정하는 취지에서 처벌의 대상이 되지 않으나, 법률에 의하여 선서한 증인이 타인의 형사사건에 관하여 위증을 하면 형법 제152조 제1항 의 위증죄가 성립되므로 자기의 형사사건에 관하여 타인을 교사하여 위증죄를 범하게 하는 것은 이러한 방어권을 남용하는 것이라고 할 것이어서 교사범의 죄책을 부담케 함이 상당하다.","cite":"대법원 2003도5114","badge":"","topic":"","from":"GY-2025-1-X-27","seq":null},{"id":"X-OX-518","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"무고죄는 국가의 형사사법권 또는 징계권의 적정한 행사를 주된 보호법익으로 하고 다만, 개인의 부당하게 처벌 또는 징계받지 아니할 이익을 부수적으로 보호하는 죄이므로, 설사 무고에 있어서 피무고자의 승낙이 있었다고 하더라도 무고죄가 성립한다. (23.2차)","answer":true,"quote":"무고죄는 국가의 형사사법권 또는 징계권의 적정한 행사를 주된 보호법익으로 하고 다만, 개인의 부당하게 처벌 또는 징계받지 아니할 이익을 부수적으로 보호하는 죄이므로, 설사 무고에 있어서 피무고자의 승낙이 있었다고 하더라도 무고죄의 성립에는 영향을 미치지 못한다 할 것이고, 무고죄에 있어서 형사처분 또는 징계처분을 받게 할 목적은 허위신고를 함에 있어서 다른 사람이 그로 인하여 형사 또는 징계처분을 받게 될 것이라는 인식이 있으면 족한 것이고 그 결과발생을 희망하는 것까지를 요하는 것은 아니므로, 고소인이 고소장을 수사기관에 제출한 이상 그러한 인식은 있었다고 보아야 한다.","cite":"대법원 2005도2712","badge":"","topic":"","from":"GY-2023-2-X-27","seq":null},{"id":"X-OX-565","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제155조 제1항의 증거위조죄에서 ‘증거’란 타인의 형사사건 또는 징계사건에 관하여 수사기관이나 법원 또는 징계기관이 국가의 형벌권 또는 징계권의 유무를 확인하는 데 관계있다고 인정되는 자료로, 범죄 또는 징계사유의 성립 여부에 관한 것이 아닌 형 또는 징계의 경중에 관계있는 정상을 인정하는 데 도움이 될 자료는 여기에 포함되지 않는다. (25.1차)","answer":false,"quote":"형법 제155조 제1항 의 증거위조죄에서 말하는 ‘증거’란 타인의 형사사건 또는 징계사건에 관하여 수사기관이나 법원 또는 징계기관이 국가의 형벌권 또는 징계권의 유무를 확인하는 데 관계있다고 인정되는 일체의 자료를 뜻한다.","cite":"대법원 2020도2642","badge":"","topic":"","from":"GY-2025-1-X-27","seq":null},{"id":"X-OX-555","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제123조의 직권남용죄에 있어서 직권남용 행위의 상대방이 일반 사인인 경우에는 그가 권리에 대응하여 어떠한 일을 한 것이 의무 없는 일인지 여부는 관계 법령 등의 내용에 따라 개별적으로 판단하여야 한다. (24.2차)","answer":false,"quote":"상대방이 일반 사인이면 특별한 사정이 없는 한 직권에 따를 의무가 없어 의무 없는 일이 되고, 관계 법령에 따라 개별 판단하는 것은 상대방이 공무원 등일 때다.","cite":"대법원 2018도2236 · 형법 제123조","badge":"","topic":"","from":"GY-2024-2-X-24","seq":null},{"id":"X-OX-542","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"무고죄에 있어서의 신고는 자발적인 것이어야 하고 수사기관 등의 추문에 대하여 허위의 진술을 하는 것은 무고죄를 구성 하지 않는 것이므로, 당초 고소장에 기재하지 않은 사실을 수사기관에서 고소보충조서를 받을 때 자진하여 진술하였다 하더라도 이 진술 부분까지 신고한 것으로 볼 수는 없다. (22.1차)","answer":false,"quote":"무고죄에 있어서의 신고는 자발적인 것이어야 하고 수사기관 등의 추문에 대하여 허위의 진술을 하는 것은 무고죄를 구성하지 않는 것이지만 당초 고소장에 기재하지 않은 사실을 수사기관에서 고소보충조서를 받을 때 자진하여 진술하였다면 이 진술부분까지 신고한 것으로 보아야 한다.","cite":"대법원 84도1953","badge":"","topic":"","from":"GY-2022-1-X-26","seq":null},{"id":"X-OX-516","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무집행방해죄에서의 ‘폭행’은 사람에 대한 유형력의 행사로 족하고 반드시 그 신체에 대한 것임을 요하지 아니하며, 또한 추상적 위험범으로서 구체적으로 직무집행의 방해라는 결과 발생을 요하지도 아니한다. (23.2차)","answer":true,"quote":"형법 제136조 에서 정한 공무집행방해죄는 직무를 집행하는 공무원에 대하여 폭행 또는 협박한 경우에 성립하는 범죄로서 여기서의 폭행은 사람에 대한 유형력의 행사로 족하고 반드시 그 신체에 대한 것임을 요하지 아니하며, 또한 추상적 위험범으로서 구체적으로 직무집행의 방해라는 결과발생을 요하지도 아니한다.","cite":"대법원 2017도21537","badge":"","topic":"","from":"GY-2023-2-X-14","seq":null},{"id":"X-OX-575","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무원이 그 지위를 이용하여 자신의 직무가 아닌 다른 공무원의 직무에 속한 사항의 알선행위로서 금품을 수수한 경우에도 ｢형법｣ 제129조 제1항의 뇌물수수죄가 성립한다. (26.1차)","answer":false,"quote":"지위를 이용해 다른 공무원의 직무에 속한 사항을 알선하고 금품을 받으면 제129조 뇌물수수가 아니라 제132조 알선수뢰죄다.","cite":"형법 제132조","badge":"","topic":"","from":"GY-2026-1-X-26","seq":null},{"id":"X-OX-514","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제136조에서 정한 공무집행방해죄는 직무를 집행하는 공무원에 대하여 폭행 또는 협박한 경우에 성립하는 범죄로서, 구체적으로 직무집행의 방해라는 결과가 발생할 것을 요하지는 않는다. (23.1차)","answer":true,"quote":"형법 제136조 에서 정한 공무집행방해죄는 직무를 집행하는 공무원에 대하여 폭행 또는 협박한 경우에 성립하는 범죄로서 여기서의 폭행은 사람에 대한 유형력의 행사로 족하고 반드시 그 신체에 대한 것임을 요하지 아니하며, 또한 추상적 위험범으로서 구체적으로 직무집행의 방해라는 결과발생을 요하지도 아니한다.","cite":"대법원 2017도21537","badge":"","topic":"","from":"GY-2023-1-X-26","seq":null},{"id":"X-OX-505","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"신고자가 진실이라고 확신하고 신고하였을 때에는 무고죄가 성립하지 않는다고 할 것이고, ‘진실이라고 확신한다’ 함에는 신고자가 알고 있는 객관적 사실관계에 의하여 신고사실이 허위라거나 허위일 가능성이 있다는 인식을 하면서도 이를 무시한 채 무조건 자신의 주장이 옳다고 생각하는 경우까지 포함되는 것은 아니다. (22.1차)","answer":true,"quote":"또한 신고자가 알고 있는 객관적인 사실관계에 의하더라도 신고사실이 허위라거나 또는 허위일 가능성이 있다는 인식을 하지 못하였다면 무고의 고의를 부정할 수 있으나, 이는 알고 있는 객관적 사실관계에 의하여 신고사실이 허위라거나 허위일 가능성이 있다는 인식을 하면서도 그 인식을 무시한 채 무조건 자신의 주장이 옳다고 생각하는 경우까지 포함하는 것은 아니다.","cite":"대법원 2022도3413","badge":"","topic":"","from":"GY-2022-1-X-26","seq":null},{"id":"X-OX-556","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"공무원이 아닌 사람(‘비공무원’)과 공무원이 공모하여 금품을 수수한 경우에 각 수수자가 수수한 금품별로 직무 관련성 유무가 다르더라도, 각 금품마다 직무와의 관련성을 따질 것이 아니라 그 수수한 금품 전부가 불가분적으로 직무행위에 대한 대가로서의 성질을 가지므로 ｢형법｣ 제129조 제1항에서 정한 뇌물수수죄의 공동정범이 성립한다. (24.2차)","answer":false,"quote":"공무원이 수수한 금품에 직무행위에 대한 대가로서의 성질과 직무 외의 행위에 대한 대가로서의 성질이 불가분적으로 결합되어 있는 경우, 수수한 금품 전부가 직무행위에 대한 대가로서의 성질을 가지는지 여부 (적극) / 금품의 수수가 수회에 걸쳐 이루어지고 각 수수 행위별로 직무 관련성 유무를 달리 볼 여지가 있는 경우 및 공무원이 아닌 사람과 공무원이 공모하여 금품을 수수하고 각 수수자가 수수한 금품별로 직무 관련성 유무를 달리 볼 수 있는 경우, 직무 관련성을 판단하는 방법","cite":"대법원 2023도17394","badge":"","topic":"","from":"GY-2024-2-X-25","seq":null},{"id":"X-OX-541","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"형법 제136조 제1항의 공무집행방해죄에 있어서의 범의는 상대방이 직무를 집행하는 공무원이라는 사실과 이에 대하여 폭행 또는 협박을 한다는 인식, 그리고 그 직무집행을 방해할 의사를 내용으로 한다. (22.1차)","answer":false,"quote":"공무집행방해죄에 있어서의 범의는 상대방이 직무를 집행하는 공무원이라는 사실, 그리고 이에 대하여 폭행 또는 협박을 한다는 사실을 인식하는 것을 그 내용으로 하고, 그 인식은 불확정적인 것이라도 소위 미필적 고의가 있다고 보아야 하며, 그 직무집행을 방해할 의사를 필요로 하지 아니하고 이와 같은 범의는 피고인이 이를 자백하고 있지 않고 있는 경우에는 그것을 입증함에 있어서는 사물의 성질상 고의와 상당한 관련성이 있는 간접사실을 증명하는 방법에 의할 수밖에 없는 것이나, 그때에 무엇이 상당한 관련성이 있는 간접사실에 해당할 것인가는 정상적인 경험칙에 바탕을 두고 치밀한 관찰력이나 분석력에 의하여 사실의 연결상태를 합리적으로 판단하는 것 외에 다른 방법은 없다.","cite":"대법원 94도1949","badge":"","topic":"","from":"GY-2022-1-X-04","seq":null},{"id":"X-OX-567","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"경찰관이 피의자 4명을 현행범으로 체포하면서 체포사유 등을 고지하지 않았음에도, 동 내용을 고지 후 체포했다는 내용의 허위의 현행범인체포서 4장과 체포사유 등을 고지하였다는 내용의 허위의 확인서 4장을 각 작성한 경우에 직무유기죄가 성립하는 이상, 별도로 허위공문서작성죄는 성립하지 않는다. (25.2차)","answer":false,"quote":"피고인들을 비롯한 경찰관들이 피의자 4명을 현행범으로 체포하거나 현행범인체포서를 작성할 때 체포사유 및 변호인선임권을 고지하지 아니하였음에도 불구하고, ‘체포의 사유 및 변호인 선임권 등을 고지 후 현행범인 체포한 것임’이라는 내용의 허위의 현행범인체포서 4장과 ‘현행범인으로 체포하면서 범죄사실의 요지, 구속의 이유와 변호인을 선임할 수 있음을 고지하고 변명의 기회를 주었다’는 내용의 허위의 확인서 4장을 각 작성한 사안에서, 당시 피고인들에게 허위공문서작성에 대한 범의도 있었다고 보아야 함에도 이와 다른 판단을 한 원심판결에 사실오인의 잘못이 있다고 한 사례.","cite":"대법원 2008도11226","badge":"","topic":"","from":"GY-2025-2-X-24","seq":null},{"id":"X-OX-515","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"丙에 대해서는 ｢형법｣ 제152조 제1항 위증죄가 성립하지 않는다. (23.1차)","answer":true,"quote":"공범인 공동피고인은 소송절차가 분리되지 않으면 다른 공동피고인 사건의 증인적격이 없어, 선서하고 거짓 증언을 해도 위증죄가 되지 않는다.","cite":"대법원 2008도3300 · 형법 제152조","badge":"","topic":"","from":"GY-2023-1-X-40","seq":null},{"id":"X-OX-553","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"甲과 A가 주차문제로 언쟁을 벌이던 중 112 신고를 받고 출동한 경찰관 P가 A를 때리려는 甲을 제지하자, 甲이 자신만 제지를 당한 데 화가 나서 손으로 P의 가슴을 밀치고 계속 욕설을 하면서 자신을 현행범으로 체포하며 순찰차 뒷자석에 태우려는 P의 정강이 부분을 수 차례 걷어차는 등 폭행한 경우, 이는 공무집행방해죄의 ‘폭행’에 해당하지 않는다. (24.1차)","answer":false,"quote":"피고인이 甲과 주차문제로 언쟁을 벌이던 중, 112 신고를 받고 출동한 경찰관 乙이 甲을 때리려는 피고인을 제지하자 자신만 제지를 당한 데 화가 나서 손으로 乙의 가슴을 1회 밀치고, 계속하여 욕설을 하면서 피고인을 현행범으로 체포하며 순찰차 뒷좌석에 태우려고 하는 乙의 정강이 부분을 양발로 2회 걷어차는 등 폭행함으로써 경찰관의 112 신고처리에 관한 직무집행을 방해하였다는 내용으로 기소된 사안에서, 제반 사정을 종합하면 피고인이 손으로 乙의 가슴을 밀칠 당시 乙은 112 신고처리에 관한 직무 내지 순찰근무를 수행하고 있었고, 이와 같이 공무를 집행하고 있는 乙의 가슴을 밀치는 행위는 공무원에 대한 유형력의 행사로서 공무집행방해죄에서 정한 폭행에 해당하며, 피고인이 체포될 당시 도망 또는 증거인멸의 염려가 없었다고 할 수 없어 체포의 필요성이 인정되고, 공소사실에 관한 증인들의 법정진술의 신빙성을 인정한 제1심의 판단을 뒤집을 만한 특별한 사정이 없다는 등의 이유로, 이와 달리 보아 공소사실을 무죄라고 판단한 원심판결에 공무집행방해죄의 폭행이나 직무집행, 현행범 체포의 요건 등에 관한 법리오해 또는 제1심 증인이 한 진술의 신빙성을 판단할 때 공판중심주의와 직접심리주의 원칙을 위반한 잘못이 있다고 한 사례.","cite":"대법원 2017도21537","badge":"","topic":"","from":"GY-2024-1-X-25","seq":null},{"id":"X-OX-530","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"｢형법｣ 제122조의 직무유기죄에서 ‘직무를 유기한다는 것’은 공무원이 법령, 내규 등에 따른 추상적 성실의무를 게을리하는 일체의 경우를 말하는 것이 아니라 직장의 무단이탈, 직무의 의식적인 포기 등과 같이 국가의 기능을 저해하고 국민에게 피해를 야기할 구체적인 가능성이 있는 경우만을 가리킨다. (25.1차)","answer":true,"quote":"이때 직무를 유기한다는 것은 공무원이 법령, 내규 등에 따른 추상적 성실의무를 게을리하는 일체의 경우를 말하는 것이 아니라 직장의 무단이탈, 직무의 의식적인 포기 등과 같이 국가의 기능을 저해하고 국민에게 피해를 야기할 구체적인 가능성이 있는 경우만을 가리킨다.","cite":"대법원 2021도8361","badge":"","topic":"","from":"GY-2025-1-X-25","seq":null},{"id":"X-OX-531","subject":"형사법","unit":"국가적 법익에 대한 죄","stmt":"부하직원으로부터 오락실을 단속하여 증거물로 오락기의 변조 기판을 압수하여 사무실에 보관 중임을 보고받아 알고 있는 경찰서 과장 甲이 그 직무상의 의무에 따라 위 압수물을 인계 하여 범죄 혐의의 입증에 사용하도록 하는 등의 적절한 조치를 취하지 않고, 오히려 부하직원에게 압수물을 돌려주라고 지시하여 오락실 업주에게 이를 돌려준 경우, 작위범인 증거인멸죄만이 성립하고 부작위범인 직무유기죄는 따로 성립하지 않는다. (25.1차)","answer":true,"quote":"경찰서 ○○과장이 부하직원으로부터 음반·비디오물 및 게임물에 관한 법률 위반 혐의로 오락실을 단속하여 증거물로 오락기의 변조 기판을 압수하여 사무실에 보관중임을 보고받아 알고 있었음에도 그 직무상의 의무에 따라 위 압수물을 수사계에 인계하고 검찰에 송치하여 범죄 혐의의 입증에 사용하도록 하는 등의 적절한 조치를 취하지 않고, 오히려 부하직원에게 위와 같이 압수한 변조 기판을 돌려주라고 지시하여 오락실 업주에게 이를 돌려준 경우, 작위범인 증거인멸죄만이 성립하고 부작위범인 직무유기(거부)죄는 따로 성립하지 아니한다.","cite":"대법원 2005도3909","badge":"","topic":"","from":"GY-2025-1-X-25","seq":null},{"id":"X-OX-763","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"2026. 10. 2.부터 검사는 공소제기 및 공소유지를 책임지고, 사법경찰관은 수사를 책임지며, 검사는 사법경찰관의 수사에 관한 영장의 청구·보완수사요구·재수사요구 등 법률이 정하는 직무를 수행한다.","answer":true,"quote":"① 검사와 사법경찰관은 수사, 공소제기 및 공소유지에 관하여 서로 협력하여야 한다. 이 경우 검사는 공소제기 및 공소유지를 책임지고, 사법경찰관은 수사를 책임진다. ② 검사는 국민의 인권을 옹호하기 위하여 사법경찰관의 수사에 관한 영장의 청구, 보완수사요구, 재수사요구 등 이 법률에서 정하는 직무를 수행한다. ③ 사법경찰관은 수사와 관련하여 검사에게 법률적 판단이나 증거수집의 적절성 등에 관하여 의견을 요청할 수 있다. 이 경우 검사는 특별한 사정이 없는 한 이에 응하여야 한다. ④ 제1항부터 제3항까지에 따른 검사와 사법경찰관 간의 협력을 위하여 준수하여야 하는 일반적 수사준칙에 관한 사항은 대통령령으로 정한다.","cite":"형사소송법 제195조 (2026. 8. 4. 개정, 2026. 10. 2. 시행)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-764","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사는 2026. 10. 2. 이후에도 중요 범죄에 대하여 직접 수사를 개시할 수 있고, 사법경찰관이 수사한 사건을 송치받지 아니하고 스스로 수사할 수 있다.","answer":false,"quote":"제196조(검사의 수사)는 2026. 8. 4. 개정으로 삭제되었다. ① 검사와 사법경찰관은 수사, 공소제기 및 공소유지에 관하여 서로 협력하여야 한다. 이 경우 검사는 공소제기 및 공소유지를 책임지고, 사법경찰관은 수사를 책임진다. ② 검사는 국민의 인권을 옹호하기 위하여 사법경찰관의 수사에 관한 영장의 청구, 보완수사요구, 재수사요구 등 이 법률에서 정하는 직무를 수행한다. ③ 사법경찰관은 수사와 관련하여 검사에게 법률적 판단이나 증거수집의 적절성 등에 관하여 의견을 요청할 수 있다. 이 경우 검사는 특별한 사정이 없는 한 이에 응하여야 한다. ④ 제1항부터 제3항까지에 따른 검사와 사법경찰관 간의 협력을 위하여 준수하여야 하는 일반적 수사준칙에 관한 사항은 대통령령으로 정한다.","cite":"형사소송법 제196조(삭제) · 제195조 (2026. 8. 4. 개정)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-765","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 피의자를 구속한 때에는 10일 이내에 피의자를 검사에게 인치하지 아니하면 석방하여야 하고, 검사가 사법경찰관으로부터 피의자를 인치받은 때에는 10일 이내에 공소를 제기하지 아니하면 석방하여야 한다.","answer":true,"quote":"제202조 사법경찰관이 피의자를 구속한 때에는 10일 이내에 피의자를 검사에게 인치하지 아니하면 석방하여야 한다. 제203조 검사가 사법경찰관으로부터 피의자를 인치받은 때에는 10일 이내에 공소를 제기하지 아니하면 석방하여야 한다.","cite":"형사소송법 제202조·제203조 (2026. 8. 4. 개정, 2026. 10. 2. 시행)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-766","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 고소 또는 고발에 의하여 범죄를 수사할 때에는 고소 또는 고발을 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정하여야 한다.","answer":true,"quote":"사법경찰관이 고소 또는 고발에 의하여 범죄를 수사할 때에는 고소 또는 고발을 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정하여야 한다.","cite":"형사소송법 제238조 (2026. 8. 4. 개정, 2026. 10. 2. 시행)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-767","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 불송치 결정을 한 때에는 서류와 증거물을 송부한 날부터 30일 이내에 그 사실을 고소인등에게 서면으로 통지하여야 한다.","answer":false,"quote":"사법경찰관은 제245조의5제1항제2호의 경우에는 그 송부한 날부터 7일 이내에 서면으로 고소인등에게 사건을 검사에게 송치하지 아니하는 취지와 그 이유를 통지하여야 한다. 이 경우 사법경찰관은 불송치 등의 결정서와 제245조의7에 따른 이의신청에 대한 안내 및 서식을 함께 보내야 한다.","cite":"형사소송법 제245조의6 (2026. 8. 4. 개정 — 30일이 아니라 7일)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-768","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"고소인등의 이의신청은 불송치 통지를 받은 날부터 3개월 이내에 하여야 하고, 정당한 사유가 있는 때에는 송부일부터 6개월의 범위에서 그 기간을 연장할 수 있다.","answer":true,"quote":"① 제245조의6의 통지를 받은 고소인등은 해당 사법경찰관의 소속 관서의 장에게 이의를 신청할 수 있다. ③ 제1항 및 제2항의 이의신청은 제245조의6의 통지를 받은 날부터 3개월 이내에 하여야 한다. 다만, 정당한 사유가 있는 때에는 제245조의5제1항제2호에 따른 송부일부터 6개월의 범위에서 해당 사법경찰관의 소속 관서의 장이 이의신청 기간을 연장할 수 있다.","cite":"형사소송법 제245조의7 제1항·제3항 (2026. 8. 4. 개정)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-769","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사는 고소 또는 고발에 의하여 사법경찰관이 범죄를 수사한 사건을 송치받은 날부터 3개월 이내에 공소제기 여부를 결정하여야 한다.","answer":true,"quote":"검사는 고소 또는 고발에 의하여 사법경찰관이 범죄를 수사한 사건이 제238조 및 제245조의5제1항에 따라 송치되거나 송부되는 경우 그 날부터 3개월 이내에 공소제기 여부를 결정하여야 한다.","cite":"형사소송법 제257조 (2026. 8. 4. 개정, 2026. 10. 2. 시행)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-607","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제314조에서 말하는 ‘원진술자가 진술을 할 수 없는 때’에는 사망, 질병 등 명시적으로 열거된 사유 외에도, 원진술자가 공판정에서 진술을 한 경우라도 증인신문 당시 일정한 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 그 진술의 일부가 재현 불가능하게 된 경우도 포함한다. (23.1차)","answer":true,"quote":"［3］ 형사소송법 제314조 , 제316조 제2항 에서 말하는 ‘원진술자가 진술을 할 수 없는 때’에는 사망, 질병 등 명시적으로 열거된 사유 외에도 원진술자가 공판정에서 진술을 한 경우라도 증인신문 당시 일정한 사항에 관하여 기억이 나지 않는다는 취지로 진술하여 그 진술의 일부가 재현 불가능하게 된 경우도 포함하는 것이고, 위 규정들에서 ‘그 진술 또는 작성이 특히 신빙할 수 있는 상태하에서 행하여진 때’라 함은 그 진술내용이나 조서 또는 서류의 작성에 허위개입의 여지가 거의 없고, 그 진술내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 있는 경우를 가리킨다.","cite":"대법원 2005도9561","badge":"","topic":"","from":"GY-2023-1-X-38","seq":null},{"id":"X-OX-665","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사관의 피의자에 대한 임의동행은 수사관이 동행에 앞서 피의자에게 동행을 거부할 수 있음을 알려주었거나 동행하는 경우에도 언제든지 자유롭게 동행 과정에서 이탈 또는 동행 장소에서 퇴거할 수 있었음이 인정되는 등 오로지 피의자의 자발적인 의사에 의하여 이루어졌음이 객관적인 사정에 의하여 명백하게 입증된 경우에 한하여, 그 적법성이 인정된다. (25.2차)","answer":true,"quote":"다만, 강제처분은 이 법률에 특별한 규정이 있는 경우에 한하며, 필요한 최소한도의 범위 안에서만 하여야 한다.\"고 규정하여 임의수사의 원칙을 명시하고 있는바, 수사관이 수사과정에서 당사자의 동의를 받는 형식으로 피의자를 수사관서 등에 동행하는 것은, 상대방의 신체의 자유가 현실적으로 제한되어 실질적으로 체포와 유사한 상태에 놓이게 됨에도, 영장에 의하지 아니하고 그 밖에 강제성을 띤 동행을 억제할 방법도 없어서 제도적으로는 물론 현실적으로도 임의성이 보장되지 않을 뿐만 아니라, 아직 정식의 체포·구속단계 이전이라는 이유로 상대방에게 헌법 및 형사소송법이 체포·구속된 피의자에게 부여하는 각종의 권리보장 장치가 제공되지 않는 등 형사소송법의 원리에 반하는 결과를 초래할 가능성이 크므로, 수사관이 동행에 앞서 피의자에게 동행을 거부할 수 있음을 알려 주었거나 동행한 피의자가 언제든지 자유로이 동행과정에서 이탈 또는 동행장소로부터 퇴거할 수 있었음이 인정되는 등 오로지 피의자의 자발적인 의사에 의하여 수사관서 등에의 동행이 이루어졌음이 객관적인 사정에 의하여 명백하게 입증된 경우에 한하여, 그 적법성이 인정되는 것으로 봄이 상당하다.","cite":"대법원 2005도6810","badge":"","topic":"","from":"GY-2025-2-X-29","seq":null},{"id":"X-OX-630","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"어떤 소송절차가 진행된 내용이 공판조서에 기재되지 않았다고 하여 당연히 그 소송절차가 당해 공판기일에 행하여지지 않은 것으로 추정되는 것은 아니고 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있고, 이는 소송법적 사실이므로 자유로운 증명의 대상이 된다. (24.1차)","answer":true,"quote":"반면에 어떤 소송절차가 진행된 내용이 공판조서에 기재되지 않았다고 하여 당연히 그 소송절차가 당해 공판기일에 행하여지지 않은 것으로 추정되는 것은 아니고 공판조서에 기재되지 않은 소송절차의 존재가 공판조서에 기재된 다른 내용이나 공판조서 이외의 자료로 증명될 수 있고, 이는 소송법적 사실이므로 자유로운 증명의 대상이 된다.","cite":"대법원 2023도3038","badge":"","topic":"","from":"GY-2024-1-X-35","seq":null},{"id":"X-OX-596","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"A가 수사기관에 체포된 동거남의 석방을 위한 공적을 쌓기 위하여 B에게 필로폰 밀수입에 관한 정보제공을 부탁하면서 대가의 지급을 약속하고, 이에 B가 C에게, C가 甲에게 순차적으로 필로폰 밀수입을 권유하여, 이를 승낙하고 필로폰을 받으러 나온 甲이 체포된 경우, B와 C가 각자의 사적인 동기에 기하여 수사기관과 직접적인 관련이 없이 독자적으로 甲을 유인한 것 으로서 위법한 함정수사에 해당하지 아니한다. (22.2차)","answer":true,"quote":"甲이 수사기관에 체포된 동거남의 석방을 위한 공적을 쌓기 위하여 乙에게 필로폰 밀수입에 관한 정보제공을 부탁하면서 대가의 지급을 약속하고, 이에 乙이 丙에게, 丙은 丁에게 순차 필로폰 밀수입을 권유하여, 이를 승낙하고 필로폰을 받으러 나온 丁을 체포한 사안에서, 乙, 丙 등이 각자의 사적인 동기에 기하여 수사기관과 직접적인 관련이 없이 독자적으로 丁을 유인한 것으로서 위법한 함정수사에 해당하지 않는다고 한 사례","cite":"대법원 2007도7680","badge":"","topic":"","from":"GY-2022-2-X-31","seq":null},{"id":"X-OX-625","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포되지 않은 피의자에 대하여 구속영장을 청구받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인을 위한 구속영장을 발부하여 피의자를 구인한 후 심문하여야 한다. 다만, 피의자가 도망하는 등의 사유로 심문할 수 없는 경우에는 그러하지 아니하다. (24.1차)","answer":true,"quote":"② 제1항 외의 피의자에 대하여 구속영장을 청구받은 판사는 피의자가 죄를 범하였다고 의심할 만한 이유가 있는 경우에 구인을 위한 구속영장을 발부하여 피의자를 구인한 후 심문하여야 한다. 다만, 피의자가 도망하는 등의 사유로 심문할 수 없는 경우에는 그러하지 아니하다.","cite":"형사소송법 제201조의2 제2항","badge":"","topic":"","from":"GY-2024-1-X-31","seq":null},{"id":"X-OX-600","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"USB에 저장된 파일이 복사 과정에서 편집되는 등 인위적 개작 없이 원본 내용을 그대로 복사한 사본이라는 점이 증명되어야 한다. (22.2차)","answer":true,"quote":"그리고 증거로 제출된 전자문서 파일의 사본이나 출력물이 복사·출력 과정에서 편집되는 등 인위적 개작 없이 원본 내용을 그대로 복사·출력한 것이라는 사실은 전자문서 파일의 사본이나 출력물의 생성과 전달 및 보관 등의 절차에 관여한 사람의 증언이나 진술, 원본이나 사본 파일 생성 직후의 해시(Hash)값 비교, 전자문서 파일에 대한 검증·감정 결과 등 제반 사정을 종합하여 판단할 수 있다.","cite":"대법원 2017도13263","badge":"","topic":"","from":"GY-2022-2-X-39","seq":null},{"id":"X-OX-652","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제122조 단서에서 ‘급속을 요하는 때’라고 함은 압수‧수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수‧수색의 실효를 거두기 어려울 경우라고 해석함이 옳다. (25.1차)","answer":true,"quote":"여기서 ‘급속을 요하는 때’라고 함은 압수·수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수·수색의 실효를 거두기 어려울 경우라고 해석함이 옳고, 그와 같이 합리적인 해석이 가능하므로 형사소송법 제122조 단서가 명확성의 원칙 등에 반하여 위헌이라고 볼 수 없다.","cite":"대법원 2012도7455","badge":"","topic":"","from":"GY-2025-1-X-32","seq":null},{"id":"X-OX-703","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"임의제출된 정보저장매체에서 압수의 대상이 되는 전자정보의 범위를 넘어서는 전자정보에 대해 수사기관이 영장 없이 압수･ 수색하여 취득한 증거는 위법수집증거에 해당하지만, 피고인이나 변호인이 이를 증거로 함에 동의하였다면 그 위법성이 치유된다. (23.1차)","answer":false,"quote":"임의제출 범위를 넘는 전자정보를 영장 없이 압수하면 위법수집증거이고, 사후 영장이나 증거동의로도 위법성이 치유되지 않는다.","cite":"대법원 2016도348 · 형사소송법 제218조 · 형사소송법 제308조의2","badge":"","topic":"","from":"GY-2023-1-X-33","seq":null},{"id":"X-OX-634","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제312조 제1항은 검사가 작성한 피의자신문조서는 공판준비, 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한정하여 증거로 할 수 있다고 규정하고 있다. 여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한내용이 실제 사실과 부합한다는 것을 의미한다. (24.1차)","answer":true,"quote":"여기서 ‘그 내용을 인정할 때’라 함은 피의자신문조서의 기재 내용이 진술 내용대로 기재되어 있다는 의미가 아니고 그와 같이 진술한 내용이 실제 사실과 부합한다는 것을 의미한다.","cite":"대법원 2023도3741","badge":"","topic":"","from":"GY-2024-1-X-38","seq":null},{"id":"X-OX-603","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제34조에 따르면 변호인 또는 변호인이 되려는 자는 신체구속을 당한 피고인 또는 피의자와 접견하고 서류 또는 물건을 수수할 수 있으며 의사로 하여금 진료하게 할 수 있으므로, 변호인이 되려는 의사를 표시한 자가 객관적으로 변호인이 될 가능성이 있다고 인정된다면, 신체구속을 당한 피고인 또는 피의자와 접견하지 못하도록 제한해서는 안된다. (23.1차)","answer":true,"quote":"형사소송법 제34조 는 “변호인 또는 변호인이 되려는 자는 신체구속을 당한 피고인 또는 피의자와 접견하고 서류 또는 물건을 수수할 수 있으며 의사로 하여금 진료하게 할 수 있다.”라고 규정하고 있으므로, 변호인이 되려는 의사를 표시한 자가 객관적으로 변호인이 될 가능성이 있다고 인정되는데도, 형사소송법 제34조 에서 정한 ‘변호인 또는 변호인이 되려는 자’가 아니라고 보아 신체구속을 당한 피고인 또는 피의자와 접견하지 못하도록 제한하여서는 아니 된다.","cite":"대법원 2013도16162","badge":"","topic":"","from":"GY-2023-1-X-32","seq":null},{"id":"X-OX-597","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"경찰관이 동행에 앞서 피의자에게 동행을 거부할 수 있음을 알려 주었거나 동행한 피의자가 언제든지 자유로이 동행 과정 에서 이탈 또는 동행 장소로부터 퇴거할 수 있었음이 인정되는 등 오로지 피의자의 자발적인 의사에 의하여 수사관서에의 동행이 이루어졌음이 객관적인 사정에 의하여 명백하게 입증된 경우에 한하여 임의동행의 적법성이 인정된다. (22.2차)","answer":true,"quote":"다만, 강제처분은 이 법률에 특별한 규정이 있는 경우에 한하며, 필요한 최소한도의 범위 안에서만 하여야 한다.\"고 규정하여 임의수사의 원칙을 명시하고 있는바, 수사관이 수사과정에서 당사자의 동의를 받는 형식으로 피의자를 수사관서 등에 동행하는 것은, 상대방의 신체의 자유가 현실적으로 제한되어 실질적으로 체포와 유사한 상태에 놓이게 됨에도, 영장에 의하지 아니하고 그 밖에 강제성을 띤 동행을 억제할 방법도 없어서 제도적으로는 물론 현실적으로도 임의성이 보장되지 않을 뿐만 아니라, 아직 정식의 체포·구속단계 이전이라는 이유로 상대방에게 헌법 및 형사소송법이 체포·구속된 피의자에게 부여하는 각종의 권리보장 장치가 제공되지 않는 등 형사소송법의 원리에 반하는 결과를 초래할 가능성이 크므로, 수사관이 동행에 앞서 피의자에게 동행을 거부할 수 있음을 알려 주었거나 동행한 피의자가 언제든지 자유로이 동행과정에서 이탈 또는 동행장소로부터 퇴거할 수 있었음이 인정되는 등 오로지 피의자의 자발적인 의사에 의하여 수사관서 등에의 동행이 이루어졌음이 객관적인 사정에 의하여 명백하게 입증된 경우에 한하여, 그 적법성이 인정되는 것으로 봄이 상당하다.","cite":"대법원 2005도6810","badge":"","topic":"","from":"GY-2022-2-X-33","seq":null},{"id":"X-OX-696","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 적법한 절차와 방식에 따라 작성한 검증조서에 피의자 아닌 자의 진술이 기재된 경우, 그 진술이 영상녹화물에 의하여 증명되고 공판기일에서 작성자인 사법경찰관의 진술에 따라 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다. (22.2차)","answer":false,"quote":"① 검사가 피고인이 된 피의자의 진술을 기재한 조서는 적법한 절차와 방식에 따라 작성된 것으로서 피고인이 진술한 내용과 동일하게 기재되어 있음이 공판준비 또는 공판기일에서의 피고인의 진술에 의하여 인정되고, 그 조서에 기재된 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한하여 증거로 할 수 있다. ② 제1항에도 불구하고 피고인이 그 조서의 성립의 진정을 부인하는 경우에는 그 조서에 기재된 진술이 피고인이 진술한 내용과 동일하게 기재되어 있음이 영상녹화물이나 그 밖의 객관적인 방법에 의하여 증명되고, 그 조서에 기재된 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한하여 증거로 할 수 있다. ③ 검사 이외의 수사기관이 작성한 피의자신문조서는 적법한 절차와 방식에 따라 작성된 것으로서 공판준비 또는 공판기일에 그 피의자였던 피고인 또는 변호인이 그 내용을 인정할 때에 한하여 증거로 할 수 있다. ④ 검사 또는 사법경찰관이 피고인이 아닌 자의 진술을 기재한 조서는 적법한 절차와 방식에 따라 작성된 것으로서 그 조서가 검사 또는 사법경찰관 앞에서 진술한 내용과 동일하게 기재되어 있음이 원진술자의 공판준비 또는 공판기일에서의 진술이나 영상녹화물 또는 그 밖의 객관적인 방법에 의하여 증명되고, 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 원진술자를 신문할 수 있었던 때에는 증거로 할 수 있다. 다만, 그 조서에 기재된 진술이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때에 한한다. ⑤ 제1항부터 제4항까지의 규정은 피고인 또는 피고인이 아닌 자가 수사과정에서 작성한 진술서에 관하여 준용한다. ⑥ 검사 또는 사법경찰관이 검증의 결과를 기재한 조서는 적법한 절차와 방식에 따라 작성된 것으로서 공판준비 또는 공판기일에서의 작성자의 진술에 따라 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다. [전문개정 2007.6.1.]","cite":"형사소송법 제312조 제1항","badge":"","topic":"","from":"GY-2022-2-X-38","seq":null},{"id":"X-OX-756","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피의자는 미리 증거를 보전하지 않으면 그 증거를 사용하기 곤란한 사정이 있는 때에 ｢형사소송법｣ 제184조에 따른 증거보전을 청구 하거나 동법 제221조의2에 따른 증인신문을 청구할 수 있다. (26.1차)","answer":false,"quote":"증거보전은 피의자도 청구할 수 있지만, 참고인에 대한 제221조의2 증인신문 청구는 검사만 할 수 있다.","cite":"형사소송법 제184조 · 형사소송법 제221조의2","badge":"","topic":"","from":"GY-2026-1-X-28","seq":null},{"id":"X-OX-706","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사기죄의 증거인 업무일지가 피고인의 사생활 영역과 관계된 자유로운 인격권의 발현물이라고 볼 수 없고 피고인을 형사소추하기 위해서는 이 사건 업무일지가 반드시 필요한 증거라 하더라도, 그것이 제3자에 의하여 절취된 것으로서 피해자측이 이를 수사기관에 증거자료로 제출하기 위하여 대가를 지급하였다면, 위 업무일지는 위법수집증거로서 증거로 사용할 수 없다. (23.1차)","answer":false,"quote":"제3자가 훔친 업무일지라도 사생활 핵심과 관계없고 소추에 꼭 필요하면, 피해자 측이 대가를 주고 얻었어도 증거로 쓸 수 있다.","cite":"대법원 2008도1584 · 형사소송법 제308조의2","badge":"","topic":"","from":"GY-2023-1-X-35","seq":null},{"id":"X-OX-690","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 발송한 이메일에 대한 압수 수색영장을 집행하면서 수사기관이 甲 회사에 팩스로 영장 사본을 송신하였다면, 비록 영장 원본을 제시하거나 압수조서와 압수물 목록을 작성하여 피압수 수색 당사자에게 교부하지 않았더라도, 이 같은 방법으로 압수된 피고인의 이메일은 위법수집증거의 증거능력을 인정할 수 있는 예외적인 경우에 해당하므로 증거능력이 부정되지 않는다. (22.1차)","answer":false,"quote":"수사기관이 甲 주식회사에서 압수수색영장을 집행하면서 甲 회사에 팩스로 영장 사본을 송신하기만 하고 영장 원본을 제시하거나 압수조서와 압수물 목록을 작성하여 피압수·수색 당사자에게 교부하지도 않은 채 피고인의 이메일을 압수한 후 이를 증거로 제출한 사안에서, 위와 같은 방법으로 압수된 이메일은 증거능력이 없다고 본 원심판단을 수긍한 사례","cite":"대법원 2015도10648","badge":"","topic":"","from":"GY-2022-1-X-37","seq":null},{"id":"X-OX-717","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"경찰이 영장에 의해 압수된 피고인의 휴대전화를 탐색하던 중 영장에 기재된 범죄사실이 기록된 파일을 발견하여 이를 별도의 저장매체에 복제･출력한 경우, 이러한 탐색･복제･출력의 과정에서 피고인에게 참여의 기회를 부여하지 않았어도 사후에 그 파일에 대한 압수･수색영장을 발부받아 절차가 진행되었다면 적법하게 수집된 증거이다. (23.2차)","answer":false,"quote":"탐색·복제·출력은 압수의 실행이라 그때 참여 기회를 주어야 하고, 뒤에 영장을 다시 받아도 앞선 위법이 치유되지 않는다.","cite":"형사소송법 제219조 · 형사소송법 제121조","badge":"","topic":"","from":"GY-2023-2-X-35","seq":null},{"id":"X-OX-687","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"타인의 진술을 내용으로 하는 진술이 전문증거인지 여부는 요증사실과의 관계에서 정하여지는바, 원진술의 내용인 사실이 요증사실인 경우에는 전문증거가 아니라 본래증거이다. (22.1차)","answer":false,"quote":"다른 사람의 진술, 즉 원진술의 내용인 사실이 요증사실인 경우에는 전문증거이지만, 원진술의 존재 자체가 요증사실인 경우에는 본래증거이지 전문증거가 아니다.","cite":"대법원 2018도13792","badge":"","topic":"","from":"GY-2022-1-X-34","seq":null},{"id":"X-OX-633","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 피압수자 측에 참여의 기회를 보장하거나 압수한 전자정보 목록을 교부하지 않는 등 영장주의 원칙과 적법절차를 준수하지 않은 위법한 압수･수색 과정을 통하여 취득한 증거는 위법수집증거에 해당하고, 사후에 법원으로부터 영장이 발부 되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 위법성이 치유되는 것도 아니다. (24.1차)","answer":true,"quote":"따라서 수사기관이 피압수자 측에 참여의 기회를 보장하거나 압수한 전자정보 목록을 교부하지 않는 등 영장주의 원칙과 적법절차를 준수하지 않은 위법한 압수·수색 과정을 통하여 취득한 증거는 위법수집증거에 해당하고, 사후에 법원으로부터 영장이 발부되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 위법성이 치유되는 것도 아니다.","cite":"대법원 2022도2960","badge":"","topic":"","from":"GY-2024-1-X-37","seq":null},{"id":"X-OX-586","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"형사소송법 제150조 증언거부사유의 소명, 제184조 제3항 증거보전청구사유의 소명, 제221조의2 제3항 증인신문청구 사유의 소명은 증명의 정도에 이르지 않더라도 입증이 허용된다. (22.1차)","answer":true,"quote":"증언거부사유·증거보전청구사유·증인신문청구사유는 법이 소명하도록 정해, 증명에 이르지 않는 정도의 입증으로 족하다.","cite":"형사소송법 제150조 · 형사소송법 제184조 · 형사소송법 제221조의2","badge":"","topic":"","from":"GY-2022-1-X-34","seq":null},{"id":"X-OX-617","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"구속의 효력은 원칙적으로 ｢형사소송법｣ 제75조 제1항의 방식에 따라 작성된 구속영장에 기재된 범죄사실에만 미치는 것이므로, 구속기간이 만료될 무렵에 종전 구속영장에 기재된 범죄사실과 다른 범죄사실로 피고인을 구속하였다는 사정만으로는 피고인에 대한 구속이 위법하다고 할 수 없다. (23.2차)","answer":true,"quote":"구속의 효력은 구속영장에 적힌 범죄사실에만 미치므로, 구속기간 만료 무렵 다른 범죄사실로 구속했다는 것만으로 위법하지 않다.","cite":"형사소송법 제75조","badge":"","topic":"","from":"GY-2023-2-X-32","seq":null},{"id":"X-OX-713","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포한 피의자를 구속하고자 할 때에는 체포한 때부터 48시간 이내에 구속영장을 청구해야 하는데, 검사 또는 사법경찰관이 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 위 48시간의 기산점은 체포시이다. (23.2차)","answer":false,"quote":"따라서 검사 등이 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 위 48시간의 기산점은 체포시가 아니라 검사 등이 현행범인을 인도받은 때라고 할 것이다.","cite":"대법원 2011도12927","badge":"","topic":"","from":"GY-2023-2-X-30","seq":null},{"id":"X-OX-666","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"현행범인은 누구든지 영장 없이 체포할 수 있고, 검사 또는 사법경찰관은 피의자 등이 유류한 물건이나 소유자·소지자 또는 보관자가 임의로 제출한 물건을 영장 없이 압수할 수 있으므로, 현행범 체포현장에서도 소지자 등이 임의로 제출하는 물건은 ｢형사소송법｣ 제218조에 따라 영장 없이 압수하는 것이 허용 되고, 이 경우 검사나 사법경찰관은 별도로 사후에 영장을 받을 필요가 없다. (25.2차)","answer":true,"quote":"다만 형사소송법 제218조 에 의하면 검사 또는 사법경찰관은 피의자 등이 유류한 물건이나 소유자·소지자 또는 보관자가 임의로 제출한 물건은 영장 없이 압수할 수 있으므로, 현행범 체포 현장이나 범죄 장소에서도 소지자 등이 임의로 제출하는 물건은 위 조항에 의하여 영장 없이 압수할 수 있고, 이 경우에는 검사나 사법경찰관이 사후에 영장을 받을 필요가 없다.","cite":"대법원 2015도13726","badge":"","topic":"","from":"GY-2025-2-X-31","seq":null},{"id":"X-OX-736","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 甲에 대한 피의자신문조서를 작성하면서 동석한 신뢰관계 있는 사람이 甲을 대신하여 진술하도록 하여서는 아니 되지만, 만약 동석한 사람이 甲을 대신하여 진술한 부분을 사법 경찰관이 조서에 기재하였다면 그 부분은 피의자의 진술을 기재한 것에 해당한다. (24.2차)","answer":false,"quote":"만약 동석한 사람이 피의자를 대신하여 진술한 부분이 조서에 기재되어 있다면 그 부분은 피의자의 진술을 기재한 것이 아니라 동석한 사람의 진술을 기재한 조서에 해당하므로, 그 사람에 대한 진술조서로서의 증거능력을 취득하기 위한 요건을 충족하지 못하는 한 이를 유죄 인정의 증거로 사용할 수 없다.","cite":"대법원 2009도1322","badge":"","topic":"","from":"GY-2024-2-X-40","seq":null},{"id":"X-OX-718","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"기본권의 본질적 영역에 대한 보호는 국가의 기본적 책무이고 사인 간의 공개되지 않은 대화에 대한 도청 및 감청을 불법으로 간주하는 ｢통신비밀보호법｣의 취지 등을 종합적으로 고려하면 제3자가 권한 없이 개인의 전자우편을 무단으로 수집한 것은 비록 그 전자우편 서비스가 공공적 성격을 가지는 것이라고 하더라도 증거로 제출하는 것이 허용될 수 없다. (23.2차)","answer":false,"quote":"사인이 위법하게 모은 증거는 진실 발견의 공익과 사생활 보호를 견주어 정하고, 공공적 성격의 전자우편 서비스라면 증거로 쓸 수 있다.","cite":"대법원 2010도12244 · 형사소송법 제308조의2","badge":"","topic":"","from":"GY-2023-2-X-35","seq":null},{"id":"X-OX-680","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"정서적 학대를 당했다는 피해아동의 부모가 피해아동의 가방에 녹음기를 넣어 30명의 아동을 상대로 한 수업시간 중 교실에서 피의자인 담임교사가 한 발언을 몰래 녹음한 녹음파일은 ｢통신비밀보호법｣을 위반하여 공개되지 아니한 타인 간의 대화를 녹음한 것이므로 증거능력을 인정할 수 없다. (26.1차)","answer":true,"quote":"저쪽에서 학교 다닌 거 맞아, 1, 2학년 다녔어, 공부시간에 책 넘기는 것도 안 배웠어, 학습 훈련이 전혀 안 되어 있어, 1, 2학년 때 공부 안 하고 왔다갔다만 했나봐.”라는 말을 하는 등 수회에 걸쳐 아동의 정신건강 및 발달에 해를 끼치는 정서적 학대행위를 하였다는 이유로 아동학대범죄의 처벌 등에 관한 특례법 위반(아동복지시설종사자등의아동학대가중처벌)으로 기소된 사안에서, 초등학교 담임교사가 교실에서 수업시간 중 한 발언은 통상적으로 교실 내 학생들만을 대상으로 하는 것으로서 교실 내 학생들에게만 공개된 것일 뿐, 일반 공중이나 불특정 다수에게 공개된 것이 아니므로, 대화자 내지 청취자가 다수였다는 사정만으로 ‘공개된 대화’로 평가할 수는 없어, 피해아동의 부모가 몰래 녹음한 피고인의 수업시간 중 발언은 ‘공개되지 않은 대화’에 해당하는 점, 피해아동의 부모는 피고인의 수업시간 중 발언의 상대방에 해당하지 않으므로, 위 발언은 ‘타인 간의 대화’에 해당하는 점을 종합하면, 피해아동의 부모가 피해아동의 가방에 녹음기를 넣어 수업시간 중 교실에서 피고인이 한 발언을 녹음한 녹음파일, 녹취록 등은 통신비밀보호법 제14조 제1항 을 위반하여 공개되지 아니한 타인 간의 대화를 녹음한 것이므로 통신비밀보호법 제14조 제2항 및 제4조 에 따라 증거능력이 부정된다는 이유로, 이와 달리 본 원심판단에 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2020도1538","badge":"","topic":"","from":"GY-2026-1-X-36","seq":null},{"id":"X-OX-719","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"자백은 일단 자백하였다가 이를 번복 내지 취소하더라도 그 효력이 없어지는 것은 아니기에, 피고인이 항소이유서에 ‘돈이 급해 지어서는 안될 죄를 지었습니다.’, ‘진심으로 뉘우치고 있습니다.’라고 기재하였고 항소심 공판기일에 그 항소이유서를 진술하였다면, 이어진 검사의 신문에 범죄사실을 부인하였고 수사단계에서도 일관되게 범죄사실을 부인하여 온 사정이 있다고 하더라도 피고인이 자백한 것으로 볼 수 있다. (23.2차)","answer":false,"quote":"피고인이 제출한 항소이유서에 '피고인은 돈이 급해 지어서는 안될 죄를 지었습니다.', '진심으로 뉘우치고 있습니다.'라고 기재되어 있고 피고인은 항소심 제2회 공판기일에 위 항소이유서를 진술하였으나, 곧 이어서 있은 검사와 재판장 및 변호인의 각 심문에 대하여 피고인은 범죄사실을 부인하였고, 수사단계에서도 일관되게 그와 같이 범죄사실을 부인하여 온 점에 비추어 볼 때, 위와 같이 추상적인 항소이유서의 기재만을 가지고 범죄사실을 자백한 것으로 볼 수 없다고 한 사례.","cite":"대법원 99도3341","badge":"","topic":"","from":"GY-2023-2-X-36","seq":null},{"id":"X-OX-749","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"변호인의 조력을 받을 권리를 실질적으로 보장하기 위하여는 변호인과의 접견교통권의 인정이 당연한 전제가 되므로, 임의동행의 형식으로 수사기관에 연행된 피의자에게는 변호인 또는 변호인이 되려는 자와의 접견교통권은 당연히 인정되지만, 임의동행의 형식으로 연행된 피내사자의 경우에는 인정되지 아니한다. (25.2차)","answer":false,"quote":"임의동행 형식으로 연행된 사람은 피의자든 피내사자든 변호인 또는 변호인이 되려는 자와 접견교통할 권리를 가진다.","cite":"형사소송법 제34조","badge":"","topic":"","from":"GY-2025-2-X-33","seq":null},{"id":"X-OX-653","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사가 공판기일에 증인으로 신청하여 신문할 사람을 특별한 사정 없이 미리 수사기관에 소환하여 면담하는 절차를 거친 후 증인이 법정에서 피고인에게 불리한 내용의 진술을 한 경우, 검사가 증인신문 전 면담 과정에서 증인에 대한 회유나 압박, 답변 유도나 암시 등으로 증인의 법정진술에 영향을 미치지 않았다는 점이 담보되어야 증인의 법정진술을 신빙할 수 있다. (25.1차)","answer":true,"quote":"이러한 형사소송법의 기본원칙에 비추어 보면, 검사가 공판기일에 증인으로 신청하여 신문할 사람을 특별한 사정 없이 미리 수사기관에 소환하여 면담하는 절차를 거친 후 증인이 법정에서 피고인에게 불리한 내용의 진술을 한 경우, 검사가 증인신문 전 면담 과정에서 증인에 대한 회유나 압박, 답변 유도나 암시 등으로 증인의 법정진술에 영향을 미치지 않았다는 점이 담보되어야 증인의 법정진술을 신빙할 수 있다고 할 것이다.","cite":"대법원 2020도15891","badge":"","topic":"","from":"GY-2025-1-X-35","seq":null},{"id":"X-OX-587","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인의 자백이 고문, 폭행, 협박, 신체구속의 부당한 장기화 또는 기망 기타의 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에는 이를 유죄의 증거로 하지 못한다. (22.1차)","answer":true,"quote":"피고인의 자백이 고문, 폭행, 협박, 신체구속의 부당한 장기화 또는 기망 기타의 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에는 이를 유죄의 증거로 하지 못한다. [제목개정 1963.12.13.]","cite":"형사소송법 제309조","badge":"","topic":"","from":"GY-2022-1-X-36","seq":null},{"id":"X-OX-760","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인 아닌 자가 작성한 진술서는 작성자가 공판준비나 공판 기일에서 그 성립의 진정을 부인하는 경우에, 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 작성자를 신문할 수 없는 경우라도 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에는 증거로 할 수 있다. (26.1차)","answer":false,"quote":"② 제1항 본문에도 불구하고 진술서의 작성자가 공판준비나 공판기일에서 그 성립의 진정을 부인하는 경우에는 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에는 증거로 할 수 있다. 다만, 피고인 아닌 자가 작성한 진술서는 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 작성자를 신문할 수 있었을 것을 요한다. <개정 2016.5.29.>","cite":"형사소송법 제313조 제2항","badge":"","topic":"","from":"GY-2026-1-X-38","seq":null},{"id":"X-OX-643","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 ｢통신비밀보호법｣ 제8조에 따른 긴급통신제한 조치를 한 경우에 집행에 착수한 때부터 36시간 이내에 법원의 허가를 받지 못한 경우에는 해당 조치를 즉시 중지 하고 해당 조치로 취득한 자료를 폐기하여야 한다. (24.2차)","answer":true,"quote":"긴급통신제한조치는 집행에 착수한 때부터 36시간 안에 법원 허가를 받지 못하면 즉시 중지하고 그로 얻은 자료를 폐기해야 한다.","cite":"통신비밀보호법 제8조","badge":"","topic":"","from":"GY-2024-2-X-33","seq":null},{"id":"X-OX-578","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"법원이 인정하는 범죄사실이 공소사실과 차이가 없이 동일한 경우에는 비록 검사가 재판시법인 신법의 적용을 구하였더라도 그 범행에 대한 형의 경중의 차이가 없으면 공소장변경절차를 거치지 않아도 구법을 적용할 수 있다. (22.1차)","answer":true,"quote":"법원이 인정하는 범죄사실이 공소사실과 차이가 없이 동일한 경우에는 비록 검사가 재판시법인 개정 후 신법의 적용을 구하였더라도 그 범행에 대한 형의 경중의 차이가 없으면 피고인의 방어권 행사에 실질적으로 불이익을 초래할 우려도 없어 공소장 변경절차를 거치지 않고도 정당하게 적용되어야 할 행위시법인 구법을 적용할 수 있다.","cite":"대법원 2000도3350","badge":"","topic":"","from":"GY-2022-1-X-02","seq":null},{"id":"X-OX-701","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제217조 제2항, 제3항에 위반하여 압수수색영장을 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없지만, 피고인이나 변호인이 이를 증거로 함에 동의하였다면 유죄 인정의 증거로 사용할 수 있다. (23.1차)","answer":false,"quote":"형사소송법 제216조 제1항 제2호 , 제217조 제2항 , 제3항 은 사법경찰관은 형사소송법 제200조의3 (긴급체포)의 규정에 의하여 피의자를 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압수·수색을 할 수 있고, 압수한 물건을 계속 압수할 필요가 있는 경우에는 지체 없이 압수수색영장을 청구하여야 하며, 청구한 압수수색영장을 발부받지 못한 때에는 압수한 물건을 즉시 반환하여야 한다고 규정하고 있는바, 형사소송법 제217조 제2항 , 제3항 에 위반하여 압수수색영장을 청구하여 이를 발부받지 아니하고도 즉시 반환하지 아니한 압수물은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다.","cite":"대법원 2009도11401","badge":"","topic":"","from":"GY-2023-1-X-30","seq":null},{"id":"X-OX-759","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"반의사불벌죄에서 피고인 또는 피의자의 처벌을 희망하지 않는다는 의사표시 또는 처벌희망 의사표시 철회의 유무나 그 효력 여부에 관한 사실은 엄격한 증명의 대상이다. (26.1차)","answer":false,"quote":"반의사불벌죄에서 ‘처벌불원의 의사표시’ 또는 ‘처벌희망 의사표시 철회’의 유무나 그 효력에 관한 사실이 엄격한 증명의 대상인지 여부 (소극)","cite":"대법원 2010도5610","badge":"","topic":"","from":"GY-2026-1-X-37","seq":null},{"id":"X-OX-579","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 범죄증거를 수집할 목적으로 피의자의 동의 없이 피의자의 소변을 채취하기 위해서는 법원으로부터 감정허가장을 받아 형사소송법 제221조의4 제1항, 제173조 제1항에서 정한 ‘감정에 필요한 처분’으로 할 수 있지만, 형사소송법 제219조, 제106조 제1항, 제109조에 따른 압수 수색의 방법으로도 할 수 있다. (22.1차)","answer":true,"quote":"수사기관이 범죄 증거를 수집할 목적으로 피의자의 동의 없이 피의자의 소변을 채취하는 것은 법원으로부터 감정허가장을 받아 형사소송법 제221조의4 제1항 , 제173조 제1항 에서 정한 ‘감정에 필요한 처분’으로 할 수 있지만(피의자를 병원 등에 유치할 필요가 있는 경우에는 형사소송법 제221조의3 에 따라 법원으로부터 감정유치장을 받아야 한다), 형사소송법 제219조 , 제106조 제1항 , 제109조 에 따른 압수·수색의 방법으로도 할 수 있다.","cite":"대법원 2018도6219","badge":"","topic":"","from":"GY-2022-1-X-28","seq":null},{"id":"X-OX-631","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다. (24.1차)","answer":true,"quote":"피고인의 자백이 임의성이 없다고 의심할 만한 사유가 있는 때에 해당한다 할지라도 그 임의성이 없다고 의심하게 된 사유들과 피고인의 자백과의 사이에 인과관계가 존재하지 않은 것이 명백한 때에는 그 자백은 임의성이 있는 것으로 인정된다.","cite":"대법원 84도2252","badge":"","topic":"","from":"GY-2024-1-X-36","seq":null},{"id":"X-OX-602","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"위법한 체포상태에서 마약 투약 혐의를 확인하기 위한 채뇨 요구가 이루어진 경우, 채뇨 요구를 위한 위법한 체포와 그에 이은 채뇨 요구는 마약 투약이라는 범죄행위에 대한 증거수집을 위하여 연속하여 이루어진 것으로서 개별적으로 그 적법 여부를 평가하는 것은 적절하지 아니하므로 그 일련의 과정을 전체적으로 보아 위법한 채뇨 요구가 있었던 것으로 보아야 한다. (23.1차)","answer":true,"quote":"피의자가 동행을 거부하는 의사를 표시하였음에도 불구하고 경찰관들이 영장에 의하지 아니하고 피의자를 강제로 연행한 행위는 수사상의 강제처분에 관한 형사소송법상의 절차를 무시한 채 이루어진 것으로 위법한 체포에 해당하고, 이와 같이 위법한 체포상태에서 마약 투약 혐의를 확인하기 위한 채뇨 요구가 이루어진 경우, 채뇨 요구를 위한 위법한 체포와 그에 이은 채뇨 요구는 마약 투약이라는 범죄행위에 대한 증거 수집을 위하여 연속하여 이루어진 것으로서 개별적으로 그 적법 여부를 평가하는 것은 적절하지 아니하므로 그 일련의 과정을 전체적으로 보아 위법한 채뇨 요구가 있었던 것으로 볼 수밖에 없다.","cite":"대법원 2012도13611","badge":"","topic":"","from":"GY-2023-1-X-29","seq":null},{"id":"X-OX-761","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"乙은 甲의 보험사기의 실행의 착수 이후에 공모관계로부터 이탈하였으므로, 乙에게도 사기죄의 실행의 착수는 인정된다. (26.1차)","answer":false,"quote":"보험사기의 실행의 착수는 보험금을 청구할 때이고, 불을 놓은 것은 아직 사기의 준비 단계라 乙이 빠질 때까지 사기의 착수는 없었다.","cite":"형법 제347조","badge":"","topic":"","from":"GY-2026-1-X-40","seq":null},{"id":"X-OX-697","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"이메일 작성자인 B가 증인으로 출석하여 “甲에게 이메일을 보낸 기억이 없다.”고 진술한 경우에는 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에도 증거로 할 수 없다. (22.2차)","answer":false,"quote":"① 전2조의 규정 이외에 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류로서 그 작성자 또는 진술자의 자필이거나 그 서명 또는 날인이 있는 것(피고인 또는 피고인 아닌 자가 작성하였거나 진술한 내용이 포함된 문자·사진·영상 등의 정보로서 컴퓨터용디스크, 그 밖에 이와 비슷한 정보저장매체에 저장된 것을 포함한다. 이하 이 조에서 같다)은 공판준비나 공판기일에서의 그 작성자 또는 진술자의 진술에 의하여 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다. 단, 피고인의 진술을 기재한 서류는 공판준비 또는 공판기일에서의 그 작성자의 진술에 의하여 그 성립의 진정함이 증명되고 그 진술이 특히 신빙할 수 있는 상태하에서 행하여 진 때에 한하여 피고인의 공판준비 또는 공판기일에서의 진술에 불구하고 증거로 할 수 있다. <개정 2016.5.29.> ② 제1항 본문에도 불구하고 진술서의 작성자가 공판준비나 공판기일에서 그 성립의 진정을 부인하는 경우에는 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에는 증거로 할 수 있다. 다만, 피고인 아닌 자가 작성한 진술서는 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 작성자를 신문할 수 있었을 것을 요한다. <개정 2016.5.29.> ③ 감정의 경과와 결과를 기재한 서류도 제1항 및 제2항과 같다. <신설 2016.5.29.> [전문개정 1961.9.1.]","cite":"형사소송법 제313조 제1항","badge":"","topic":"","from":"GY-2022-2-X-39","seq":null},{"id":"X-OX-682","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 피의자였을 때 수사기관에 한 진술이 기재된 조서나 수사과정에서 작성된 진술서 등의 증거능력을 인정할 수 없다면 수사기관에 제출된 변호인의견서에 기재된 같은 취지의 피의자 진술 부분도 유죄의 증거로 사용할 수 없다. (26.1차)","answer":true,"quote":"따라서 피고인이 피의자였을 때 수사기관에 한 진술이 기재된 조서나 수사과정에서 작성된 진술서 등의 증거능력을 인정할 수 없다면 수사기관에 제출된 변호인의견서에 기재된 같은 취지의 피의자 진술 부분도 유죄의 증거로 사용할 수 없다.","cite":"대법원 2020도16796","badge":"","topic":"","from":"GY-2026-1-X-38","seq":null},{"id":"X-OX-649","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정 하더라도 피고인에게 불리한 법률을 소급하여 적용한 것으로 볼 수는 없다. (25.1차)","answer":true,"quote":"대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정한 사안에서, 피고인에게 불리한 법률을 소급하여 적용한 위법이 있다고 할 수 없다고 한 사례.","cite":"대법원 2009도11448","badge":"","topic":"","from":"GY-2025-1-X-01","seq":null},{"id":"X-OX-605","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제313조 제1항 단서의 특신상태는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장･ 입증하여야 하는 것이지만, 이는 소송상의 사실에 관한 것이므로, 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다. (23.1차)","answer":true,"quote":"피고인의 자필로 작성된 진술서의 경우에는 서류의 작성자가 동시에 진술자이므로 진정하게 성립된 것으로 인정되어 형사소송법 제313조 단서에 의하여 그 진술이 특히 신빙할 수 있는 상태하에서 행하여진 때에는 증거능력이 있고, 이러한 특신상태는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장·입증하여야 하는 것이지만, 이는 소송상의 사실에 관한 것이므로, 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다.","cite":"대법원 2000도1743","badge":"","topic":"","from":"GY-2023-1-X-34","seq":null},{"id":"X-OX-671","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 작성한 피고인 甲의 범행현장의 검증조서에 살인 범행에 부합하는 甲의 자백진술과 범행을 재연하는 사진이 첨부되어 있는 경우 甲이 공판정에서 검증조서에 기재된 자백과 범행을 재연하는 부분에 대하여 내용을 부인하는 경우에는 증거로 할 수 없다. (25.2차)","answer":true,"quote":"사법경찰관 작성의 검증조서에 대하여 피고인이 증거로 함에 동의만 하였을 뿐 공판정에서 검증조서에 기재된 진술내용 및 범행을 재연한 부분에 대하여 그 성립의 진정 및 내용을 인정한 흔적을 찾아 볼 수 없고 오히려 이를 부인하고 있는 경우에는 그 증거능력을 인정할 수 없으므로, 위 검증조서 중 범행에 부합되는 피고인의 진술을 기재한 부분과 범행을 재연한 부분을 제외한 나머지 부분만을 증거로 채용하여야 함에도 이를 구분하지 아니한 채 그 전부를 유죄의 증거로 인용한 항소심의 조치는 위법하다.","cite":"대법원 98도159","badge":"","topic":"","from":"GY-2025-2-X-38","seq":null},{"id":"X-OX-693","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"압수된 CD에 저장된 동영상과 휴대폰2에 저장된 원본 동영상과의 동일성은 검사가 주장 입증해야 하며, 엄격한 증명의 방법으로 증명되어야 한다. (22.2차)","answer":false,"quote":"원본 동일성은 증거능력의 요건이라 검사가 증명하되, 관여자 진술·해시값 비교 등 제반 사정으로 판단해 엄격한 증명을 요하지 않는다.","cite":"대법원 2017도13263","badge":"","topic":"","from":"GY-2022-2-X-35","seq":null},{"id":"X-OX-645","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분은 피고인 또는 변호인이 내용을 부인하는 이상 증거능력이 없다. (24.2차)","answer":true,"quote":"피의자의 진술을 기재한 서류 내지 문서가 수사기관의 수사과정에서 작성된 것이라면 그 서류나 문서의 형식과 관계없이 피의자신문조서와 달리 볼 이유가 없으므로, 수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분은 피고인 또는 변호인이 내용을 부인하는 이상 증거능력이 없다.","cite":"대법원 2020도16796","badge":"","topic":"","from":"GY-2024-2-X-36","seq":null},{"id":"X-OX-684","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관에서 乙이 참고인으로 진술한 후에 법정에서 증인으로 증언하고자 하였으나, 피고인 甲이 乙의 증언거부 상황을 초래한 특별한 사정이 있는 경우, 이는 ｢형사소송법｣ 제314조 (증거능력에 대한 예외)의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당한다. (26.1차)","answer":true,"quote":"[다수의견] 수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 형사소송법 제314조 의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다고 보아야 한다.","cite":"대법원 2018도13945","badge":"","topic":"","from":"GY-2026-1-X-40","seq":null},{"id":"X-OX-673","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포죄는 계속범으로서 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 기수에 이르고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우에는 체포죄의 미수범이 성립할 뿐이다. (26.1차)","answer":true,"quote":"체포죄는 계속범으로서 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 기수에 이르고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우에는 체포죄의 미수범이 성립할 뿐이다.","cite":"대법원 2016도18713","badge":"","topic":"","from":"GY-2026-1-X-17","seq":null},{"id":"X-OX-614","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"압수･수색영장은 원칙적으로 처분을 받는 자에게 반드시 제시하고, 처분을 받는 자가 피의자인 경우에는 그 사본을 교부해야 하는데, 이는 준항고 등 피압수자의 불복신청의 기회를 실질적으로 보장하기 위한 것이다. (23.2차)","answer":true,"quote":"압수·수색영장은 처분받는 자에게 반드시 제시하고 피의자면 사본까지 주는데, 준항고 등 불복의 기회를 실질적으로 보장하려는 것이다.","cite":"형사소송법 제118조 · 형사소송법 제219조","badge":"","topic":"","from":"GY-2023-2-X-29","seq":null},{"id":"X-OX-580","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"통신비밀보호법 에 규정된 통신제한조치상의 ‘전기통신의 감청’은 ‘감청’의 개념 규정에 비추어 이미 수신이 완료된 전기통신에 관하여 남아 있는 기록이나 내용을 열어보는 등의 행위는 포함하지 않는다. (22.1차)","answer":true,"quote":"통신비밀보호법상 ‘전기통신의 감청’의 의미 및 전자우편이 송신되어 수신인이 이를 확인하는 등 이미 수신이 완료된 전기통신에 관하여 남아 있는 기록이나 내용을 열어보는 등의 행위가 이에 포함되는지 여부 (소극)","cite":"대법원 2010도9007","badge":"","topic":"","from":"GY-2022-1-X-28","seq":null},{"id":"X-OX-678","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"위치추적 전자장치 부착명령을 선고받아 그 집행을 받고 있는 피고인에 대하여 준수기간의 정함이 없이 ‘혈중알코올농도 0.03% 이상 음주를 하지 말고, 보호관찰관의 정당한 음주측정에 응할 것’이라는 준수사항 추가 결정이 있었던 경우 피고인에 대한 보호관찰소 직원들의 추가 준수사항을 근거로 한 음주 측정요구에 따른 음주측정 결과는 증거능력을 인정할 수 없다. (26.1차)","answer":true,"quote":"위치추적 전자장치 부착명령을 선고받아 그 집행을 받고 있는 피고인에 대하여 준수기간의 정함이 없이 ‘혈중알코올농도 0.03% 이상 음주를 하지 말고, 보호관찰관의 정당한 음주측정에 응할 것’이라는 준수사항 추가 결정이 있었는데, 피고인이 식당에서 식사를 하던 중 보호관찰소 직원들이 추가 준수사항의 이행 여부를 점검하려 하자 자신의 차를 운전하여 주거지로 귀가하였고, 뒤따라 도착한 보호관찰소 직원들의 추가 준수사항에 따른 음주측정 요구에 응하여 혈중알코올농도가 0.107%로 측정되어 추가 준수사항 위반의 전자장치 부착 등에 관한 법률(이하 ‘전자장치부착법’이라 한다) 위반 및 도로교통법 위반(음주운전)의 공소사실로 기소된 사안에서, 전자장치부착법 제9조의2 제1항 제6호 의 준수사항을 부과받은 피부착자 등이 이를 위반한 경우 준수사항 미이행을 이유로 같은 법 제39조 제3항 에 따라 처벌하기 위해서는 그 준수사항이 적법한 것이어야 하는데, 준수기간을 정하지 아니한 추가 준수사항은 같은 법 제9조의2 제1항 을 위반하여 위법하고, 보호관찰관은 위법한 추가 준수사항을 근거로 피고인에게 음주측정에 응할 것을 요구할 수 없으며, 그러한 요구에 따른 음주측정 결과도 적법한 절차에 따르지 아니하고 수집된 증거로서 증거능력을 인정할 수 없다는 이유로, 이와 달리 본 원심판단에 전자장치부착법 위반죄의 성립과 위법수집증거 배제법칙 등에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2025도7665","badge":"","topic":"","from":"GY-2026-1-X-36","seq":null},{"id":"X-OX-594","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사는 사본을 확보한 경우 등 압수를 계속할 필요가 없다고 인정되는 압수물 및 증거에 사용할 압수물에 대하여 공소제기 전이라도 소유자, 소지자, 보관자 또는 제출인의 청구가 있는 때에는 환부 또는 가환부하여야 한다. (22.2차)","answer":true,"quote":"① 검사는 사본을 확보한 경우 등 압수를 계속할 필요가 없다고 인정되는 압수물 및 증거에 사용할 압수물에 대하여 공소제기 전이라도 소유자, 소지자, 보관자 또는 제출인의 청구가 있는 때에는 환부 또는 가환부하여야 한다.","cite":"형사소송법 제218조의2 제1항","badge":"","topic":"","from":"GY-2022-2-X-30","seq":null},{"id":"X-OX-730","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢통신비밀보호법｣ 제3조 제1항을 위반한 불법감청에 의하여 녹음된 전화통화의 내용은 ｢통신비밀보호법｣ 제4조에 의하여 원칙적으로 증거능력이 없으나, 피고인이나 변호인이 이를 증거로 함에 동의하였다면 증거능력이 인정된다. (24.2차)","answer":false,"quote":"불법감청으로 녹음한 통화 내용은 피고인이나 변호인이 증거로 함에 동의해도 증거능력이 없다.","cite":"대법원 2010도9016 · 통신비밀보호법 제4조","badge":"","topic":"","from":"GY-2024-2-X-33","seq":null},{"id":"X-OX-731","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 피고인 아닌 자의 주거지·근무지를 방문한 곳에서 진술서 작성을 요구하여 제출받은 경우 등 그 진술서가 경찰서 에서 작성한 것이 아니라 작성자가 원하는 장소를 방문하여 받은 것이라면, 위 진술서는 ｢형사소송법｣ 제312조 제5항이 적용되지 않아 ｢형사소송법｣ 제244조의4(수사과정의 기록)에서 정한 절차를 준수하지 않더라도 증거능력이 인정된다. (24.2차)","answer":false,"quote":"수사가 시작된 뒤 수사기관의 관여로 작성된 진술서는 작성 장소와 관계없이 제312조 제5항이 적용되어, 수사과정 기록 절차를 어기면 증거능력이 없다.","cite":"대법원 2022도9510 · 형사소송법 제244조의4","badge":"","topic":"","from":"GY-2024-2-X-35","seq":null},{"id":"X-OX-656","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다. (25.1차)","answer":true,"quote":"형사소송법 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다.","cite":"대법원 99도2029","badge":"","topic":"","from":"GY-2025-1-X-36","seq":null},{"id":"X-OX-611","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"통고처분이나 고발을 할 권한이 없는 세무공무원이 그 권한자에게 범칙사건 조사 결과에 따른 통고처분이나 고발조치를 건의하는 등의 조치를 취하지 않았다고 하더라도, 구체적 사정에 비추어 그것이 직무를 성실히 수행하지 못한 것이라고 할 수 있을지 언정 그 직무를 의식적으로 방임 내지 포기하였다고 볼 수 없다. (23.2차)","answer":true,"quote":"통고처분이나 고발을 할 권한이 없는 세무공무원이 그 권한자에게 범칙사건 조사 결과에 따른 통고처분이나 고발조치를 건의하는 등의 조치를 취하지 않았다고 하더라도, 구체적 사정에 비추어 그것이 직무를 성실히 수행하지 못한 것이라고 할 수 있을지언정 그 직무를 의식적으로 방임 내지 포기하였다고 볼 수 없다고 한 사례.","cite":"대법원 96도2753","badge":"","topic":"","from":"GY-2023-2-X-24","seq":null},{"id":"X-OX-683","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"지적능력‧판단능력 등과 같이 본질적으로 수사기관이 작성한 진술조서에 나타나기 어려운 피고인의 상태에 대해서는 공판 중심주의 및 실질적 직접심리주의 원칙에 따라 검사가 제출한 객관적인 증거에 대하여 적법한 증거조사를 거친 후 이를 인정하여야 할 것이지, 공소사실을 부인하는 취지의 피고인 진술이 기재된 피의자신문조서 중 일부를 근거로 이를 인정하여서는 아니된다. (26.1차)","answer":true,"quote":"특히 지적능력·판단능력 등과 같이 본질적으로 수사기관이 작성한 진술조서에 나타나기 어려운 피고인의 상태에 대해서는 공판중심주의 및 실질적 직접심리주의 원칙에 따라 검사가 제출한 객관적인 증거에 대하여 적법한 증거조사를 거친 후 이를 인정하여야 할 것이지, 공소사실을 부인하는 취지의 피고인 진술이 기재된 피의자신문조서 중 일부를 근거로 이를 인정하여서는 안 된다.","cite":"대법원 2023도13081","badge":"","topic":"","from":"GY-2026-1-X-38","seq":null},{"id":"X-OX-647","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 참고인을 조사하는 과정에서 ｢형사소송법｣ 제221조 제1항에 따라 작성한 영상녹화물은 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한, 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용될 수 없다. (24.2차)","answer":true,"quote":"즉 검사 또는 사법경찰관이 피고인이 아닌 자를 조사하는 과정에서 형사소송법 제221조 제1항 에 따라 제작한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 없는 한 공소사실을 직접 증명할 수 있는 독립적인 증거로 사용할 수 없다.","cite":"대법원 2023도15133","badge":"","topic":"","from":"GY-2024-2-X-38","seq":null},{"id":"X-OX-661","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제310조 소정의 ‘피고인의 자백’에 공범인 공동 피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다. (25.1차)","answer":true,"quote":"형사소송법 제310조 소정의 \"피고인의 자백\"에 공범인 공동피고인의 진술은 포함되지 아니하므로 공범인 공동피고인의 진술은 다른 공동피고인에 대한 범죄사실을 인정하는 증거로 할 수 있는 것일 뿐만 아니라 공범인 공동피고인들의 각 진술은 상호간에 서로 보강증거가 될 수 있다.","cite":"대법원 90도1939","badge":"","topic":"","from":"GY-2025-1-X-39","seq":null},{"id":"X-OX-593","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"영업정지처분에 대한 집행정지 신청이 잠정적으로 받아들여졌다는 사정만으로는 구 음반 비디오물 및 게임물에 관한 법률 위반으로 기소된 피고인에게 적법행위의 기대가능성이 없다고 볼 수 없다. (22.2차)","answer":true,"quote":"영업정지처분에 대한 집행정지 신청이 잠정적으로 받아들여졌다는 사정만으로는, 구 음반·비디오물 및 게임물에 관한 법률 위반으로 기소된 피고인에게 적법행위의 기대가능성이 없다고 볼 수는 없다고 본 원심판단을 수긍한 사례","cite":"대법원 2007도8645","badge":"","topic":"","from":"GY-2022-2-X-06","seq":null},{"id":"X-OX-685","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"임의제출물의 압수는 압수물에 대한 수사기관의 점유취득이 제출자의 의사에 따라 이루어지므로, 임의제출된 정보저장매체 에서 압수의 대상이 되는 전자정보의 범위를 초과하여 수사기관이 임의로 전자정보를 탐색 복제 출력하는 것은 원칙적으로 위법한 압수 수색에 해당한다고 할 수 없다. (22.1차)","answer":false,"quote":"임의제출된 저장매체라도 압수 대상인 전자정보의 범위를 넘어 수사기관이 임의로 탐색·복제·출력하면 원칙적으로 위법한 압수·수색이다.","cite":"대법원 2016도348 · 형사소송법 제218조","badge":"","topic":"","from":"GY-2022-1-X-28","seq":null},{"id":"X-OX-692","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사 또는 사법경찰관이 피의자를 영장에 의하여 체포하는 경우에 필요한 때에는 영장없이 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 안에서의 피의자 수색이 허용된다. (22.2차)","answer":false,"quote":"① 검사 또는 사법경찰관은 제200조의2·제200조의3·제201조 또는 제212조의 규정에 의하여 피의자를 체포 또는 구속하는 경우에 필요한 때에는 영장없이 다음 처분을 할 수 있다. <개정 1995.12.29., 2019. 12. 31> 1. 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 내에서의 피의자 수색. 다만, 제200조의2 또는 제201조에 따라 피의자를 체포 또는 구속하는 경우의 피의자 수색은 미리 수색영장을 발부받기 어려운 긴급한 사정이 있는 때에 한정한다. 2. 체포현장에서의 압수, 수색, 검증","cite":"형사소송법 제216조 제1항","badge":"","topic":"","from":"GY-2022-2-X-30","seq":null},{"id":"X-OX-638","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"만약 위 사기 혐의가 인정되고 甲이 허위의 내용으로 신청한 지급명령이 그대로 확정되었다면, 소송사기의 방법으로 승소판결을 받아 확정된 경우와 마찬가지로 사기죄는 이미 기수에 이른 것이다. (24.1차)","answer":true,"quote":"법률 제6626호로 전문 개정되기 전의 것) 제445조 에 따라 지급명령은 확정되고, 이와 같이 확정된 지급명령에 대해서는 항고를 제기하는 등 동일한 절차 내에서는 불복절차가 따로 없어서 이를 취소하기 위해서는 재심의 소를 제기하거나 위 법 제505조 에 따라 청구이의의 소로써 강제집행의 불허를 소구할 길이 열려 있을 뿐인데, 이는 피해자가 별도의 소로써 피해구제를 받을 수 있는 것에 불과하므로 허위의 내용으로 신청한 지급명령이 그대로 확정된 경우에는 소송사기의 방법으로 승소 판결을 받아 확정된 경우와 마찬가지로 사기죄는 이미 기수에 이르렀다고 볼 것이다.","cite":"대법원 2002도4151","badge":"","topic":"","from":"GY-2024-1-X-40","seq":null},{"id":"X-OX-608","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 ｢형사소송법｣ 제314조의‘그 밖에 이에준하는 사유로인하여 진술할수 없는 때’에 해당하지 않는다고 보아야 한다. (23.1차)","answer":true,"quote":"[다수의견] 수사기관에서 진술한 참고인이 법정에서 증언을 거부하여 피고인이 반대신문을 하지 못한 경우에는 정당하게 증언거부권을 행사한 것이 아니라도, 피고인이 증인의 증언거부 상황을 초래하였다는 등의 특별한 사정이 없는 한 형사소송법 제314조 의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당하지 않는다고 보아야 한다.","cite":"대법원 2018도13945","badge":"","topic":"","from":"GY-2023-1-X-38","seq":null},{"id":"X-OX-732","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"자동차등록증에 차량의 소유자가 피고인으로 등록·기재된 것은 피고인이 그 차량을 운전하였다는 사실의 자백 부분에 대한 보강증거가 될 수 있지만, 피고인의 무면허운전이라는 전체 범죄 사실의 보강증거가 될 수는 없다. (24.2차)","answer":false,"quote":"자동차등록증에 차량의 소유자가 피고인으로 등록·기재된 것이 피고인이 그 차량을 운전하였다는 사실의 자백 부분에 대한 보강증거가 될 수 있고 결과적으로 피고인의 무면허운전이라는 전체 범죄사실의 보강증거로 충분하다고 한 사례.","cite":"대법원 2000도2365","badge":"","topic":"","from":"GY-2024-2-X-36","seq":null},{"id":"X-OX-660","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피의자의 진술을 기재한 서류 내지 문서가 수사기관의 수사 과정에서 작성된 것이라면 그 서류나 문서의 형식과 관계없이 피의자신문조서와 달리 볼 이유가 없으므로, 수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분은 피고인 또는 변호인이 내용을 부인하는 이상 증거능력이 없다. (25.1차)","answer":true,"quote":"피의자의 진술을 기재한 서류 내지 문서가 수사기관의 수사과정에서 작성된 것이라면 그 서류나 문서의 형식과 관계없이 피의자신문조서와 달리 볼 이유가 없으므로, 수사기관이 작성한 압수조서에 기재된 피의자였던 피고인의 자백 진술 부분은 피고인 또는 변호인이 내용을 부인하는 이상 증거능력이 없다.","cite":"대법원 2020도16796","badge":"","topic":"","from":"GY-2025-1-X-38","seq":null},{"id":"X-OX-635","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다. (24.1차)","answer":true,"quote":"형사소송법 제318조에 규정된 증거동의의 의사표시는 증거조사가 완료되기 전까지 취소 또는 철회할 수 있으나, 일단 증거조사가 완료된 뒤에는 취소 또는 철회가 인정되지 아니하므로 제1심에서 한 증거동의를 제2심에서 취소할 수 없고, 일단 증거조사가 종료된 후에 증거동의의 의사표시를 취소 또는 철회하더라도 취소 또는 철회 이전에 이미 취득한 증거능력이 상실되지 않는다.","cite":"대법원 99도2029","badge":"","topic":"","from":"GY-2024-1-X-39","seq":null},{"id":"X-OX-737","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"법원이 선임한 부재자 재산관리인은 법률에 따라 선임된 부재자의 법정대리인이므로 관리대상 재산에 관한 범죄행위에 대하여 독립하여 고소권을 가지고 법정대리인의 고소권은 ｢형사소송법｣상 당연히 인정되는 것이므로, 고소권의 행사에 있어 법원의 허가는 요하지 않는다. (25.1차)","answer":false,"quote":"법원이 선임한 부재자 재산관리인이 그 관리대상인 부재자의 재산에 대한 범죄행위에 관하여 법원으로부터 고소권 행사에 관한 허가를 얻은 경우 부재자 재산관리인은 형사소송법 제225조 제1항 에서 정한 법정대리인으로서 적법한 고소권자에 해당한다고 보아야 한다.","cite":"대법원 2021도2488","badge":"","topic":"","from":"GY-2025-1-X-28","seq":null},{"id":"X-OX-612","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"압수･수색영장 통지의 예외 사유인 ‘급속을 요하는 때’란 압수･ 수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수･수색의 실효를 거두기 어려울 경우를 의미한다. (23.2차)","answer":true,"quote":"여기서 ‘급속을 요하는 때’라고 함은 압수·수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수·수색의 실효를 거두기 어려울 경우라고 해석함이 옳고, 그와 같이 합리적인 해석이 가능하므로 형사소송법 제122조 단서가 명확성의 원칙 등에 반하여 위헌이라고 볼 수 없다.","cite":"대법원 2012도7455","badge":"","topic":"","from":"GY-2023-2-X-29","seq":null},{"id":"X-OX-705","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관이 체포 당시 외국인인 피고인에게 영사통보권을 지체 없이 고지하지 않았다면 피고인에게 영사조력이 가능한지 여부나 실질적인 불이익이 있었는지 여부와 상관없이 국제 협약에 따른 피고인의 권리나 법익을 본질적으로 침해하였다고 볼 수 있으므로, 체포나 구속 이후 수집된 증거와 이에 기초한 증거들은 유죄인정의 증거로 사용할 수 없다. (23.1차)","answer":false,"quote":"대한민국에 대하여 발효된 조약 제594호) 제36조 제1항 (b)호를 위반한 위법이 있으나, 제반 사정을 종합하면 피고인이 영사통보권 등을 고지받았더라도 영사의 조력을 구하였으리라고 보기 어렵고, 수사기관이 피고인에게 영사통보권 등을 고지하지 않았더라도 그로 인해 피고인에게 실질적인 불이익이 초래되었다고 볼 수 없어 피고인에게 영사통보권 등을 고지하지 않은 사정이 수사기관의 증거 수집이나 이후 공판절차에 상당한 영향을 미쳤다고 보기 어려우므로, 절차 위반의 내용과 정도가 중대하거나 절차 조항이 보호하고자 하는 외국인 피고인의 권리나 법익을 본질적으로 침해하였다고 볼 수 없어 체포나 구속 이후 수집된 증거와 이에 기초한 증거들은 유죄 인정의 증거로 사용할 수 있다고 한 사례.","cite":"대법원 2021도17103","badge":"","topic":"","from":"GY-2023-1-X-35","seq":null},{"id":"X-OX-728","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 통신제한조치를 집행한 사건에 관하여 검사가 공소를 제기하거나 제기하지 아니하는 처분(기소중지 또는 참고인중지 결정은 포함한다)의 통보를 받은 때에는 그 통보를 받은 날부터 30일 이내에 감청의 대상이 된 전기통신의 가입자 에게 통신제한조치를 집행한 사실과 집행기관 및 그 기간 등을 서면으로 통지하여야 한다. (24.2차)","answer":false,"quote":"②사법경찰관은 제6조제1항 및 제8조제1항의 규정에 의한 통신제한조치를 집행한 사건에 관하여 검사로부터 공소를 제기하거나 제기하지 아니하는 처분(기소중지 결정을 제외한다)의 통보를 받거나 내사사건에 관하여 입건하지 아니하는 처분을 한 때에는 그 날부터 30일 이내에 우편물 검열의 경우에는 그 대상자에게, 감청의 경우에는 그 대상이 된 전기통신의 가입자에게 통신제한조치를 집행한 사실과 집행기관 및 그 기간 등을 서면으로 통지하여야 한다.","cite":"통신비밀보호법 제9조의2 제2항","badge":"","topic":"","from":"GY-2024-2-X-33","seq":null},{"id":"X-OX-624","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포한 피의자를 구속하고자할때에는 체포한 때부터48시간 이내에 구속영장을 청구해야 하는데, 검사 또는 사법경찰관리가 아닌 자에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 또는 사법 경찰관리에게 인도된 경우 위 48시간의 기산점은 체포시가 아니라 검사 또는 사법경찰관리가 현행범인을 인도받은 때이다. (24.1차)","answer":true,"quote":"따라서 검사 등이 아닌 이에 의하여 현행범인이 체포된 후 불필요한 지체 없이 검사 등에게 인도된 경우 위 48시간의 기산점은 체포시가 아니라 검사 등이 현행범인을 인도받은 때라고 할 것이다.","cite":"대법원 2011도12927","badge":"","topic":"","from":"GY-2024-1-X-30","seq":null},{"id":"X-OX-704","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"검사가 공소제기 후 ｢형사소송법｣ 제215조에 따라 수소법원 이외의 지방법원 판사에게 청구하여 발부받은 영장에 의하여 압수･수색을 하였다면, 그와 같이 수집된 증거는 적법한 절차에 따른 것으로서 원칙적으로 유죄의 증거로 삼을 수 있다. (23.1차)","answer":false,"quote":"형사소송법은 제215조 에서 검사가 압수·수색 영장을 청구할 수 있는 시기를 공소제기 전으로 명시적으로 한정하고 있지는 아니하나, 헌법상 보장된 적법절차의 원칙과 재판받을 권리, 공판중심주의·당사자주의·직접주의를 지향하는 현행 형사소송법의 소송구조, 관련 법규의 체계, 문언 형식, 내용 등을 종합하여 보면, 일단 공소가 제기된 후에는 피고사건에 관하여 검사로서는 형사소송법 제215조 에 의하여 압수·수색을 할 수 없다고 보아야 하며, 그럼에도 검사가 공소제기 후 형사소송법 제215조 에 따라 수소법원 이외의 지방법원 판사에게 청구하여 발부받은 영장에 의하여 압수·수색을 하였다면, 그와 같이 수집된 증거는 기본적 인권 보장을 위해 마련된 적법한 절차에 따르지 않은 것으로서 원칙적으로 유죄의 증거로 삼을 수 없다.","cite":"대법원 2009도10412","badge":"","topic":"","from":"GY-2023-1-X-35","seq":null},{"id":"X-OX-748","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제200조의2(영장에 의한 체포)‧제200조의3(긴급체포) 또는 제212조(현행범인의 체포)에 따라 체포된 피의자에 대하여 구속영장을 청구받은 판사는 특별한 사정이 없는 한 구속영장이 청구된 때로부터 48시간 이내에 피의자를 심문하여야 한다. (25.2차)","answer":false,"quote":"체포된 피의자의 구속 전 심문은 지체 없이 하되, 특별한 사정이 없으면 구속영장이 청구된 날의 다음 날까지 해야 한다.","cite":"형사소송법 제201조의2","badge":"","topic":"","from":"GY-2025-2-X-32","seq":null},{"id":"X-OX-672","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인 甲의 자백이 기재된 공판조서가 甲의 피고사건과는 별개인 乙의 피고사건에서 피고인 乙의 범행을 입증할 증거로 사용될 경우 전문증거라 하더라도 ｢형사소송법｣ 제315조 제3호에 정한 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’로서 당연히 증거능력이 인정된다. (25.2차)","answer":true,"quote":"다른 사건의 공판조서는 법관 앞에서 법이 정한 절차로 작성된 문서라, 제315조 제3호의 신용할 만한 서류로서 당연히 증거능력이 있다.","cite":"대법원 2004도4428 · 형사소송법 제315조","badge":"","topic":"","from":"GY-2025-2-X-38","seq":null},{"id":"X-OX-735","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"공소사실에 부합하는 증거인 피해자의 진술을 탄핵하는 증거로 삼은 변호인 제출의 신용카드 사용내역승인서 사본이 비록 공판 과정에서 그 입증취지가 구체적으로 명시되고 제시까지 되었다고 하더라도 증거목록에 기재되지 않았고 증거결정이 있지 아니 하였다면, 탄핵증거로서의 증거조사는 이루어졌다고 볼 수 없다. (24.2차)","answer":false,"quote":"［3］ 증거목록에 기재되지 않고 증거결정이 있지 아니한 서증들이 공판과정에서 그 입증취지가 구체적으로 명시되고 제시까지 된 경우, 탄핵증거로서의 증거조사가 이루어졌다고 볼 것인지 여부 (적극)","cite":"대법원 2005도6271","badge":"","topic":"","from":"GY-2024-2-X-39","seq":null},{"id":"X-OX-720","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"고소는 서면 또는 구술로 검사 또는 사법경찰관에게 하면 충분 하므로, 경찰청 홈페이지에 ‘甲을 철저히 조사해 달라’는 취지의 민원을 접수한 것만으로도 적법한 고소에 해당한다. (24.1차)","answer":false,"quote":"출판사 대표인 피고인이 도서의 저작권자인 피해자와 전자도서(e-book)에 대하여 별도의 출판계약 등을 체결하지 않고 전자도서를 제작하여 인터넷서점 등을 통해 판매하였다고 하여 구 저작권법 위반으로 기소된 사안에서, 피해자가 경찰청 인터넷 홈페이지에 ‘피고인을 철저히 조사해 달라’는 취지의 민원을 접수하는 형태로 피고인에 대한 조사를 촉구하는 의사표시를 한 것은 형사소송법에 따른 적법한 고소로 보기 어렵다는 이유로 공소를 기각한 원심판단을 정당하다고 한 사례","cite":"대법원 2010도9524","badge":"","topic":"","from":"GY-2024-1-X-28","seq":null},{"id":"X-OX-762","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"화재 직후 사법경찰관 P가 영장 없이 행한 검증은, 사후영장이 발부되지 아니한 경우라도 공판정에서 작성자의 진술에 의하여 그 성립의 진정함이 증명된 때에는 그 조서를 유죄의 증거로 할 수 있다. (26.1차)","answer":false,"quote":"범죄장소에서 긴급히 영장 없이 한 검증은 사후에 지체 없이 영장을 받아야 하고, 사후영장이 없으면 그 검증조서는 유죄의 증거로 쓸 수 없다.","cite":"대법원 83도3006 · 형사소송법 제216조","badge":"","topic":"","from":"GY-2026-1-X-40","seq":null},{"id":"X-OX-640","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형법｣ 제126조의 피의사실공표죄는 검찰, 경찰 그 밖에 범죄 수사에 관한 직무를 수행하는 자 또는 이를 감독하거나 보조하는 자가 그 직무를 수행하면서 알게 된 피의사실을 공소제기 전에 공표한 경우에 성립한다. (24.2차)","answer":true,"quote":"피의사실공표죄는 수사 직무를 하거나 이를 감독·보조하는 사람이 직무 중 알게 된 피의사실을 공소제기 전에 공표하면 성립한다.","cite":"형법 제126조","badge":"","topic":"","from":"GY-2024-2-X-24","seq":null},{"id":"X-OX-657","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제218조를 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 임의로 제출받은 물건을 영장 없이 압수한 경우 그 ‘압수물’ 및 ‘압수물을 찍은 사진’은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다. (25.1차)","answer":true,"quote":"형사소송법 제218조 는 \"사법경찰관은 소유자, 소지자 또는 보관자가 임의로 제출한 물건을 영장없이 압수할 수 있다\"고 규정하고 있는바, 위 규정을 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 제출받은 물건을 영장없이 압수한 경우 그 ‘압수물’ 및 ‘압수물을 찍은 사진’은 이를 유죄 인정의 증거로 사용할 수 없는 것이고, 헌법과 형사소송법이 선언한 영장주의의 중요성에 비추어 볼 때 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하더라도 달리 볼 것은 아니다.","cite":"대법원 2009도10092","badge":"","topic":"","from":"GY-2025-1-X-37","seq":null},{"id":"X-OX-662","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲과 乙이 각각 배임죄와 배임교사죄로 함께 기소되어 공범관계에 있는 공동피고인이 된 경우, 甲에 대하여 사법 경찰관이 작성한 피의자신문조서는 甲의 법정진술에 의하여 성립의 진정이 인정되는 등 ｢형사소송법｣ 제312조 제4항의 요건을 갖춘 경우라도 乙이 공판기일에서 그 조서의 내용을 부인하면 이를 乙에 대한 유죄 인정의 증거로 사용할 수 없다. (25.1차)","answer":true,"quote":"따라서 당해 피고인과 공범관계가 있는 다른 피의자에 대하여 검사 이외의 수사기관이 작성한 피의자신문조서는, 그 피의자의 법정진술에 의하여 그 성립의 진정이 인정되는 등 형사소송법 제312조 제4항 의 요건을 갖춘 경우라고 하더라도 당해 피고인이 공판기일에서 그 조서의 내용을 부인한 이상 이를 유죄 인정의 증거로 사용할 수 없다.","cite":"대법원 2009도2865","badge":"","topic":"","from":"GY-2025-1-X-40","seq":null},{"id":"X-OX-702","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"변호인의 구속된 피고인 또는 피의자와의 접견교통권은 피고인 또는 피의자 자신이 가지는 변호인과의 접견교통권과는 성질을 달리하는 것으로서 헌법상 보장된 권리라고 할 수 없으므로, 수사기관의 처분 등에 의하여 이를 제한할 수 있으며 반드시 법령에 의하여서만 제한 가능한 것은 아니다. (23.1차)","answer":false,"quote":"대법원은 변호인의 접견교통권을 형사소송법상 권리로 보면서도, 법령에 의해서만 제한할 수 있고 수사기관의 처분으로는 제한하지 못한다고 한다.","cite":"형사소송법 제34조","badge":"","topic":"","from":"GY-2023-1-X-32","seq":null},{"id":"X-OX-677","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢조세범처벌법｣에서는 조세에 관한 범칙행위에 대하여 원칙적으로 국세청장 등의 고발을 기다려 논하도록 규정하고 있는바, 동법에 의하여 하는 고발에 있어서는 고소‧고발 불가분의 원칙이 적용되지 아니하므로, 고발의 구비 여부는 양벌규정에 의하여 처벌받는 자연인인 행위자와 법인에 대하여 개별적으로 논하여야 한다. (26.1차)","answer":true,"quote":"조세범처벌법 제6조 는 조세에 관한 범칙행위에 대하여는 원칙적으로 국세청장 등의 고발을 기다려 논하도록 규정하고 있는바, 같은 법에 의하여 하는 고발에 있어서는 이른바 고소·고발 불가분의 원칙이 적용되지 아니하므로, 고발의 구비 여부는 양벌규정에 의하여 처벌받는 자연인인 행위자와 법인에 대하여 개별적으로 논하여야 한다.","cite":"대법원 2004도4066","badge":"","topic":"","from":"GY-2026-1-X-34","seq":null},{"id":"X-OX-626","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피압수자가 수사기관에 압수･수색영장의 집행에 참여하지 않는다는 의사를 명시하였더라도, 특별한 사정이 없는 한 그 변호인에게는 미리 집행의 일시와 장소를 통지하는 등 압수･수색영장의 집행에 참여할 기회를 별도로 보장하여야 한다. (24.1차)","answer":true,"quote":"따라서 설령 피압수자가 수사기관에 압수ㆍ수색영장의 집행에 참여하지 않는다는 의사를 명시하였다고 하더라도, 특별한 사정이 없는 한 그 변호인에게는 형사소송법 제219조 , 제122조 에 따라 미리 집행의 일시와 장소를 통지하는 등으로 압수ㆍ수색영장의 집행에 참여할 기회를 별도로 보장하여야 한다.","cite":"대법원 2020도10729","badge":"","topic":"","from":"GY-2024-1-X-32","seq":null},{"id":"X-OX-689","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"유흥주점 업주인 피고인이 성매매업을 하면서 금품을 수수하였다고 하여 기소된 사안에서, 경찰이 피고인 아닌 甲, 乙을 사실상 강제연행하여 불법체포한 상태에서 받은 자술서 및 진술조서가 위법수사로 얻은 진술증거에 해당하더라도, 이를 피고인에 대한 유죄 인정의 증거로 삼을 수 있다. (22.1차)","answer":false,"quote":"유흥주점 업주와 종업원인 피고인들이 이른바 ‘티켓영업’ 형태로 성매매를 하면서 금품을 수수하였다고 하여 구 식품위생법 위반으로 기소된 사안에서, 경찰이 피고인 아닌 甲, 乙을 사실상 강제연행한 상태에서 받은 각 자술서 및 이들에 대하여 작성한 각 진술조서는 위법수사로 얻은 진술증거에 해당하여 증거능력이 없다는 이유로, 이를 피고인들에 대한 유죄 인정의 증거로 삼을 수 없다고 한 사례","cite":"대법원 2009도6717","badge":"","topic":"","from":"GY-2022-1-X-37","seq":null},{"id":"X-OX-716","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 전자정보에 대한 압수･수색이 종료되기 전에 혐의사실과 관련된 전자정보를 적법하게 탐색하는 과정에서 별도 범죄혐의와 관련된 전자정보를 우연히 발견한 경우, 대법원은 ‘우연한 육안발견 원칙(plain view doctrine)’에 의해 별도의 영장 없이 우연히 발견한 별도 범죄혐의와 관련된 전자정보를 압수･수색할 수 있다고 판시하였다. (23.2차)","answer":false,"quote":"대법원은 우연한 육안발견 원칙을 채택하지 않았고, 별건 정보를 발견하면 탐색을 멈추고 별도 영장을 받아야 한다.","cite":"형사소송법 제215조","badge":"","topic":"","from":"GY-2023-2-X-33","seq":null},{"id":"X-OX-615","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰관은 긴급체포한 피의자에 대하여 구속영장을 신청하지 아니하고 석방한 경우에는 즉시 검사에게 보고하여야 하고, 검사는석방한 날부터 30일 이내에 서면으로 긴급체포 후 석방된자의인적사항, 긴급체포의일시･장소와긴급체포하게된 구체적 이유 등을 법원에 통지하여야 한다. (23.2차)","answer":true,"quote":"긴급체포 후 영장 신청 없이 석방하면 사법경찰관은 즉시 검사에게 보고하고, 검사는 석방일부터 30일 이내에 서면으로 법원에 통지한다.","cite":"형사소송법 제200조의4","badge":"","topic":"","from":"GY-2023-2-X-30","seq":null},{"id":"X-OX-712","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"압수･수색영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피의자에 대하여 공소사실의 요지와 영장이 발부되었음을 고지하고 집행할 수 있다. (23.2차)","answer":false,"quote":"③ 구속영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피고인에 대하여 공소사실의 요지와 영장이 발부되었음을 고하고 집행할 수 있다.","cite":"형사소송법 제85조 제3항","badge":"","topic":"","from":"GY-2023-2-X-29","seq":null},{"id":"X-OX-644","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 이른바 전화사기죄 범행의 혐의자를 긴급체포하면서 그가 보관하고 있던 다른 사람의 주민등록증, 운전면허증 등을 압수한 경우, 이는 ｢형사소송법｣ 제217조 제1항에서 규정한 위 범죄사실의 수사에 필요한 범위 내의 적법한 압수로서 이를 위 혐의자의 점유이탈물횡령죄 범행에 대한 증거로 사용할 수 있다. (24.2차)","answer":true,"quote":"경찰관이 이른바 전화사기죄 범행의 혐의자를 긴급체포하면서 그가 보관하고 있던 다른 사람의 주민등록증, 운전면허증 등을 압수한 사안에서, 이는 구 형사소송법 제217조 제1항 에서 규정한 해당 범죄사실의 수사에 필요한 범위 내의 압수로서 적법하므로, 이를 위 혐의자의 점유이탈물횡령죄 범행에 대한 증거로 인정한 사례","cite":"대법원 2008도2245","badge":"","topic":"","from":"GY-2024-2-X-35","seq":null},{"id":"X-OX-582","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"구속영장을 집행함에 있어 사법경찰관이 구속영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피고인에 대하여 공소 사실의 요지와 영장이 발부되었음을 고하고 집행할 수 있다. (22.1차)","answer":true,"quote":"③ 구속영장을 소지하지 아니한 경우에 급속을 요하는 때에는 피고인에 대하여 공소사실의 요지와 영장이 발부되었음을 고하고 집행할 수 있다.","cite":"형사소송법 제85조 제3항","badge":"","topic":"","from":"GY-2022-1-X-29","seq":null},{"id":"X-OX-694","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲의 컴퓨터를 압수 수색함에 있어서 압수·수색영장 집행 사실을 미리 알려주면 컴퓨터에 저장된 파일을 삭제할 염려 등이 있더라도 사전에 집행의 일시와 장소를 甲에게 통지하여 참여권을 보장해야 한다. (22.2차)","answer":false,"quote":"여기서 ‘급속을 요하는 때’라고 함은 압수·수색영장 집행 사실을 미리 알려주면 증거물을 은닉할 염려 등이 있어 압수·수색의 실효를 거두기 어려울 경우라고 해석함이 옳고, 그와 같이 합리적인 해석이 가능하므로 형사소송법 제122조 단서가 명확성의 원칙 등에 반하여 위헌이라고 볼 수 없다.","cite":"대법원 2012도7455","badge":"","topic":"","from":"GY-2022-2-X-36","seq":null},{"id":"X-OX-681","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제312조 제4항에서 ‘특히 신빙할 수 있는 상태’는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장‧증명하여야 하지만, 이는 소송상의 사실에 관한 것이므로 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다. (26.1차)","answer":true,"quote":"그리고 이러한 ‘특히 신빙할 수 있는 상태’는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장·증명하여야 하지만, 이는 소송상의 사실에 관한 것이므로 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다.","cite":"대법원 2012도2937","badge":"","topic":"","from":"GY-2026-1-X-37","seq":null},{"id":"X-OX-745","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"현행범인 체포의 요건을 갖추었는지는 체포 이후 범인으로 인정되었는지 여부로 판단하여야 하고, 이에 관한 검사나 사법경찰관 등 수사주체의 판단에는 재량의 여지가 없다. (25.2차)","answer":false,"quote":"여기서 현행범인 체포의 요건을 갖추었는지는 체포 당시 상황을 기초로 판단하여야 하고, 이에 관한 검사나 사법경찰관 등 수사주체의 판단에는 상당한 재량 여지가 있으나, 체포 당시 상황으로 보아도 요건 충족 여부에 관한 검사나 사법경찰관 등의 판단이 경험칙에 비추어 현저히 합리성을 잃은 경우에는 그 체포는 위법하다고 보아야 한다.","cite":"대법원 2011도3682","badge":"","topic":"","from":"GY-2025-2-X-31","seq":null},{"id":"X-OX-714","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"지방법원 판사가 구속기간의 연장을 허가하지 않는 결정을 하더라도 ｢형사소송법｣ 제402조 또는 제403조가 정하는 항고의 방법으로는 불복할 수 없으며, 다만, ｢형사소송법｣ 제416조가 정하는 준항고의 대상이 될 뿐이다. (23.2차)","answer":false,"quote":"구속기간 연장을 불허한 지방법원 판사의 결정은 수소법원의 결정도, 재판장·수명법관의 재판도 아니어서 항고·준항고 모두 할 수 없다.","cite":"형사소송법 제402조 · 형사소송법 제416조","badge":"","topic":"","from":"GY-2023-2-X-32","seq":null},{"id":"X-OX-659","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제312조 제5항의 적용대상인 ‘수사과정에서 작성한 진술서’란 수사가 시작된 이후에 수사기관의 관여 아래 작성된 것이거나, 개시된 수사와 관련하여 수사과정에 제출할 목적으로 작성한 것으로, 작성 시기와 경위 등 여러 사정에 비추어 그 실질이 이에 해당하는 이상 명칭이나 작성된 장소 여부를 불문한다. (25.1차)","answer":true,"quote":"이러한 형사소송법 규정 및 문언과 그 입법 목적 등에 비추어 보면, 형사소송법 제312조 제5항 의 적용대상인 ‘수사과정에서 작성한 진술서’란 수사가 시작된 이후에 수사기관의 관여 아래 작성된 것이거나, 개시된 수사와 관련하여 수사과정에 제출할 목적으로 작성한 것으로, 작성 시기와 경위 등 여러 사정에 비추어 그 실질이 이에 해당하는 이상 명칭이나 작성된 장소 여부를 불문한다.","cite":"대법원 2022도9510","badge":"","topic":"","from":"GY-2025-1-X-38","seq":null},{"id":"X-OX-734","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"사법경찰리 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없을 뿐만 아니라, 그것이 임의로 작성된 것이라도 피고인의 법정에서의 진술을 탄핵 하기 위한 반대증거로 사용할 수 없다. (24.2차)","answer":false,"quote":"사법경찰리 작성의 피고인에 대한 피의자신문조서와 피고인이 작성한 자술서들은 모두 검사가 유죄의 자료로 제출한 증거들로서 피고인이 각 그 내용을 부인하는 이상 증거능력이 없으나 그러한 증거라 하더라도 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있다.","cite":"대법원 97도1770","badge":"","topic":"","from":"GY-2024-2-X-39","seq":null},{"id":"X-OX-609","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"｢형사소송법｣ 제314조의 ‘특신상태’와 관련된 법리는 마찬가지로 원진술자의 소재불명 등을 전제로 하고 있는 ｢형사소송법｣ 제316조 제2항의 ‘특신상태’에 관한 해석에도 그대로 적용된다. (23.1차)","answer":true,"quote":"형사소송법 제314조 의 ‘특신상태’와 관련된 법리는 마찬가지로 원진술자의 소재불명 등을 전제로 하고 있는 형사소송법 제316조 제2항 의 ‘특신상태’에 관한 해석에도 그대로 적용된다.","cite":"대법원 2012도725","badge":"","topic":"","from":"GY-2023-1-X-38","seq":null},{"id":"X-OX-620","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인의 자백이 신문에 참여한 검찰주사가 피의사실을 자백하면 피의사실 부분은 가볍게 처리하고 부가적인 보안처분의 청구를 하지 않겠다는 각서를 작성하여 주면서 자백을 유도한 것에 기인한 것이라면 그 자백은 증거로 할 수 없다. (23.2차)","answer":true,"quote":"피고인의 자백이 심문에 참여한 검찰주사가 피의사실을 자백하면 피의사실부분은 가볍게 처리하고 보호감호의 청구를 하지 않겠다는 각서를 작성하여 주면서 자백을 유도한 것에 기인한 것이라면 위 자백은 기망에 의하여 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에 해당하여","cite":"대법원 85도2182","badge":"","topic":"","from":"GY-2023-2-X-36","seq":null},{"id":"X-OX-750","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲의 마약류관리법 위반 사건과 성범죄 동영상이 구체적‧개별적 연관 관계가 없다 하더라도 휴대전화에서 신속히 압수‧수색하여 촬영물의 유통가능성을 적시에 차단해 피해자를 보호할 필요성이 크다는 점에서 해당 동영상은 위법수집증거에 해당하지 않는다. (25.2차)","answer":false,"quote":"휴대전화에서 영장 혐의와 구체적·개별적 연관이 없는 별건 정보를 압수하려면 별도 영장이 필요하고, 피해자 보호의 필요성만으로 그 요건을 건너뛸 수 없다.","cite":"형사소송법 제215조","badge":"","topic":"","from":"GY-2025-2-X-34","seq":null},{"id":"X-OX-738","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"현행범으로 체포된 피의자에 대한 구속영장의 제시와 집행이 비록 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다고 하더라도 구속영장에 명시된 유효기간 내에 집행되었다면 지체된 기간 동안의 체포 내지 구금상태를 위법하다고 할 수는 없다. (25.1차)","answer":false,"quote":"법관이 검사의 청구에 의하여 체포된 피의자의 구금을 위한 구속영장을 발부한 경우, 검사와 사법경찰관리는 지체 없이 신속하게 구속영장을 집행하여야 하는지 여부 (적극) / 피의자에 대한 구속영장의 제시와 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어진 경우, 구속영장의 유효기간 내에 집행되었다고 하더라도 위 기간 동안의 체포 내지 구금 상태는 위법한지 여부 (적극)","cite":"대법원 2020도16438","badge":"","topic":"","from":"GY-2025-1-X-29","seq":null},{"id":"X-OX-590","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"형사소송법 은 재전문진술이나 재전문진술을 기재한 조서에 대하여는 그 증거능력을 인정하는 규정을 두고 있지 아니하고 있으므로, 피고인이 증거로 하는 데 동의하지 아니하는 한 형사 소송법 제310조의2의 규정에 의하여 이를 증거로 할 수 없다. (22.1차)","answer":true,"quote":"재전문진술이나 이를 기재한 조서는 증거능력을 인정하는 예외 규정이 없어, 피고인이 동의하지 않으면 증거로 할 수 없다.","cite":"대법원 2000도159 · 형사소송법 제310조의2","badge":"","topic":"","from":"GY-2022-1-X-38","seq":null},{"id":"X-OX-739","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"증거은닉범이 본범으로부터 증거은닉을 교사받아 소지‧보관하고 있던 본범 소유‧관리의 정보저장매체를 피의자의 지위에서 수사기관에 임의제출하였고, 본범이 그 매체 내 전자정보의 탐색‧복제‧출력 시 사생활의 비밀과 자유를 침해받지 않을 실질적인 이익을 갖는다고 평가될 수 있는 경우, 그러한 실질적 이익을 갖는 본범에게 참여권이 보장되어야 한다. (25.1차)","answer":false,"quote":"따라서 증거은닉범이 본범으로부터 증거은닉을 교사받아 소지·보관하고 있던 본범 소유·관리의 정보저장매체를 피의자의 지위에서 수사기관에 임의제출하였고, 본범이 그 정보저장매체에 저장된 전자정보의 탐색·복제·출력 시 사생활의 비밀과 자유 등을 침해받지 않을 실질적인 이익을 갖는다고 평가될 수 있는 경우, 임의제출자이자 피의자인 증거은닉범과 함께 그러한 실질적 이익을 갖는 본범에게도 참여권이 보장되어야 한다.","cite":"대법원 2022도7453","badge":"","topic":"","from":"GY-2025-1-X-31","seq":null},{"id":"X-OX-707","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"제1심에서 피고인에 대하여 무죄판결이 선고되어 검사가 항소한 후, 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서는 피고인이 증거로 할 수 있음에 동의하지 않는 한 증거능력이 없지만, 위 참고인이 법정에 증인으로 출석하여 위 진술조서의 진정성립을 인정하고 피고인측에 반대신문의 기회가 부여된다면 예외적으로 증거능력이 인정된다. (23.1차)","answer":false,"quote":"제1심에서 피고인에 대하여 무죄판결이 선고되어 검사가 항소한 후, 수사기관이 항소심 공판기일에 증인으로 신청하여 신문할 수 있는 사람을 특별한 사정 없이 미리 수사기관에 소환하여 작성한 진술조서의 증거능력 유무 (원칙적 소극) / 참고인이 나중에 법정에 증인으로 출석하여 위 진술조서의 성립의 진정을 인정하고 피고인 측에 반대신문의 기회가 부여되더라도 위 진술조서의 증거능력을 인정할 수 없음은 마찬가지인지 여부 (적극) / 참고인이 법정에서 위와 같이 증거능력이 없는 진술조서와 같은 취지로 피고인에게 불리한 내용의 진술을 한 경우, 그 진술에 신빙성을 인정하여 유죄의 증거로 삼을 것인지 판단하는 기준","cite":"대법원 2013도6825","badge":"","topic":"","from":"GY-2023-1-X-37","seq":null},{"id":"X-OX-667","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포된 피의자에 대한 구속 전 피의자심문절차에서 별다른 사유 없이 심문절차가 지연됨으로써 구속영장이 발부되지 않은 상태로 피의자의 신체의 자유가 장기간 제한되어 실질적으로 불법구금에 해당한다고 볼 정도에 이른 것이 아닌 경우, 단지 심문기일을 속행하였다는 사정만으로 구속영장의 적법성과 효력에 어떠한 영향을 미친다고 볼 수 없다. (25.2차)","answer":true,"quote":"구속 전 피의자심문절차에서 심문기일을 속행하는 것이 바람직한지 여부 (원칙적 소극) / 별다른 사유 없이 심문절차가 지연됨으로써 구속영장이 발부되지 않은 상태로 피의자의 신체의 자유가 장기간 제한되어 실질적으로 불법구금에 해당한다고 볼 정도에 이른 것이 아닌 경우, 단지 심문기일을 속행하였다는 사정만으로 구속영장의 적법성과 효력에 영향을 미치는지 여부 (소극)","cite":"대법원 2022도9819","badge":"","topic":"","from":"GY-2025-2-X-32","seq":null},{"id":"X-OX-669","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲에 대한 피의자신문조서는 甲의 진술에 임의성이 인정되는 경우라도 증거능력이 인정되지 않는다. (25.2차)","answer":true,"quote":"진술거부권을 알리지 않고 받은 피의자의 진술은 임의성이 인정되더라도 위법하게 수집한 증거라 증거능력이 없다.","cite":"대법원 2008도8213 · 형사소송법 제244조의3","badge":"","topic":"","from":"GY-2025-2-X-34","seq":null},{"id":"X-OX-628","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 압수·수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 서버에 저장된 전자정보를 압수·수색하기 위해서는 그 영장에 적힌 ‘압수할 물건’에 별도로 원격지 서버 저장 전자정보가 특정되어 있어야 하고, ‘압수할 물건’에 컴퓨터 등 정보처리장치 저장 전자정보만 기재되어 있다면 컴퓨터 등 정보처리장치를 이용하여 원격지 서버 저장 전자정보를 압수할 수는 없다. (24.1차)","answer":true,"quote":"법관이 압수·수색영장을 발부하면서 ‘압수할 물건’을 특정하기 위하여 기재한 문언은 엄격하게 해석하여야 하는지 여부 (적극) / 수사기관이 압수·수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 서버에 저장된 전자정보를 압수·수색하기 위해서는 압수·수색영장에 적힌 ‘압수할 물건’에 별도로 원격지 서버 저장 전자정보가 특정되어 있어야 하는지 여부 (적극) / 압수·수색영장에 적힌 ‘압수할 물건’에 컴퓨터 등 정보처리장치 저장 전자정보만 기재되어 있는 경우, 컴퓨터 등 정보처리장치를 이용하여 원격지 서버 저장 전자정보를 압수할 수 있는지 여부 (소극)","cite":"대법원 2022도1452","badge":"","topic":"","from":"GY-2024-1-X-33","seq":null},{"id":"X-OX-757","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"수사기관이 범죄를 수사하면서 불특정, 다수의 출입이 가능한 장소에 통상적인 방법으로 출입하여 아무런 물리력이나 강제력을 행사하지 않고 통상적인 방법으로 피의자를 찾는 등 위법행위를 확인하는 것은 해당 장소의 소유자, 영업주 및 관리자 등 권한 있는 자의 동의가 있은 때에 한해 임의수사의 한 방법으로 허용된다. (26.1차)","answer":false,"quote":"수사기관이 범죄를 수사하면서 불특정, 다수의 출입이 가능한 장소에 통상적인 방법으로 출입하여 아무런 물리력이나 강제력을 행사하지 않고 통상적인 방법으로 피의자를 찾는 등 위법행위를 확인하는 것은 특별한 사정이 없는 한 임의수사의 한 방법으로서 허용되므로 영장 없이 이루어졌다고 하여 위법하다고 할 수 없다.","cite":"대법원 2025도6752","badge":"","topic":"","from":"GY-2026-1-X-29","seq":null},{"id":"X-OX-627","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"甲이 사법경찰관에게 휴대전화를 임의제출하면서 클라우드 등 제3자가 관리하는 원격지에 저장되어 있는 전자정보를 제출한다는 의사로 사법경찰관에게 클라우드 등에 접속하기 위한 아이디와 비밀번호를 임의로 제공한 경우, 위 클라우드 등에 저장된 전자 정보를 임의제출하는 것으로 볼 수 있다. (24.1차)","answer":true,"quote":"피의자의 이메일 계정에 대한 접근권한에 갈음하여 발부받은 압수·수색영장에 따라 원격지의 저장매체에 적법하게 접속하여 내려받거나 현출된 전자정보를 대상으로 하여 범죄 혐의사실과 관련된 부분에 대하여 압수·수색하는 것이 허용되는지 여부 (적극) / 피의자가 휴대전화를 임의제출하면서 원격지에 저장되어 있는 전자정보를 수사기관에 제출한다는 의사로 수사기관에게 클라우드 등에 접속하기 위한 아이디와 비밀번호를 임의로 제공한 경우 위 클라우드 등에 저장된 전자정보를 임의제출 하는 것으로 볼 수 있는지 여부 (적극)","cite":"대법원 2020도14654","badge":"","topic":"","from":"GY-2024-1-X-32","seq":null},{"id":"X-OX-722","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"심문할 피의자에게 변호인이 없어 지방법원판사가 직권으로 변호인을 선정한 경우, 그 선정은 피의자에 대한 구속영장 청구가 인용된 경우를 제외하고는 제1심까지 효력이 있다. (24.1차)","answer":false,"quote":"⑧ 심문할 피의자에게 변호인이 없는 때에는 지방법원판사는 직권으로 변호인을 선정하여야 한다. 이 경우 변호인의 선정은 피의자에 대한 구속영장 청구가 기각되어 효력이 소멸한 경우를 제외하고는 제1심까지 효력이 있다.","cite":"형사소송법 제201조의2 제8항","badge":"","topic":"","from":"GY-2024-1-X-31","seq":null},{"id":"X-OX-642","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"전기통신의 감청은 ‘감청’의 개념 규정에 비추어 전기통신이 이루어지고 있는 상황에서 실시간으로 전기통신의 내용을 지득･채록하는 경우와 전기통신의 송･수신을 직접적으로 방해하는 경우를 의미하는 것이므로, 이미 수신이 완료된 전기통신에 관하여 남아있는 기록이나 내용을 열어보는 등의 행위는 포함하지 않는다. (24.2차)","answer":true,"quote":"그런데 해당 규정의 문언이 송신하거나 수신하는 전기통신 행위를 감청의 대상으로 규정하고 있을 뿐 송·수신이 완료되어 보관 중인 전기통신 내용은 대상으로 규정하지 않은 점, 일반적으로 감청은 다른 사람의 대화나 통신 내용을 몰래 엿듣는 행위를 의미하는 점 등을 고려하여 보면, 통신비밀보호법상 ‘감청’이란 대상이 되는 전기통신의 송·수신과 동시에 이루어지는 경우만을 의미하고, 이미 수신이 완료된 전기통신의 내용을 지득하는 등의 행위는 포함되지 않는다.","cite":"대법원 2012도4644","badge":"","topic":"","from":"GY-2024-2-X-33","seq":null},{"id":"X-OX-686","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"체포된 피의자에 대한 수사기관의 구속영장의 제시와 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다 하더라도, 구속영장이 그 유효기간 내에 집행되었다면 위 기간 동안의 체포 내지 구금 상태를 위법하다고 할 수 없다. (22.1차)","answer":false,"quote":"법관이 검사의 청구에 의하여 체포된 피의자의 구금을 위한 구속영장을 발부한 경우, 검사와 사법경찰관리는 지체 없이 신속하게 구속영장을 집행하여야 하는지 여부 (적극) / 피의자에 대한 구속영장의 제시와 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어진 경우, 구속영장의 유효기간 내에 집행되었다고 하더라도 위 기간 동안의 체포 내지 구금 상태는 위법한지 여부 (적극)","cite":"대법원 2020도16438","badge":"","topic":"","from":"GY-2022-1-X-29","seq":null},{"id":"X-OX-646","subject":"형사법","unit":"형사소송법(수사·공판·증거)","stmt":"피고인이 증거로
