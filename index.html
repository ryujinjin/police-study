<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="경찰공채 핵심암기">
<meta name="theme-color" content="#1d3a8f">
<meta name="description" content="경찰공무원 순경 공채 헌법·형사법·경찰학 핵심 암기카드와 사지선다 퀴즈. 2026.10.2. 시행 형사사법 개편 반영.">
<title>경찰공채 핵심암기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3a8f'/%3E%3Cpath d='M32 12l14 5v14c0 9-6 16-14 19-8-3-14-10-14-19V17z' fill='%23fff'/%3E%3Cpath d='M25 31l5 5 10-10' stroke='%231d3a8f' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="./assets/char-base.png">
<style>
  :root{
    --bg:#eef1f7;
    --bg2:#f7f9fd;
    --card:#ffffff;
    --ink:#0f172a;
    --ink2:#46536b;
    --muted:#77839a;
    --line:#e1e6f0;
    --accent:#1d3a8f;
    --accent2:#2f5bd0;
    --tint:#e9eefc;
    --good:#0f7a4e;
    --goodbg:#e6f6ed;
    --bad:#b3261e;
    --badbg:#fdecea;
    --warn:#9a5a06;
    --warnbg:#fff4e1;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -16px rgba(15,23,42,.45);
    --r:18px;
    --tabh:66px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c1017;
      --bg2:#111722;
      --card:#151c27;
      --ink:#e9eef7;
      --ink2:#b8c2d4;
      --muted:#8b97ab;
      --line:#25303f;
      --accent:#9db6ff;
      --accent2:#5f86f7;
      --tint:#1a2440;
      --good:#5fdca2;
      --goodbg:#122a20;
      --bad:#ff948c;
      --badbg:#2c1614;
      --warn:#f0b45f;
      --warnbg:#2a2013;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
    -webkit-font-smoothing:antialiased;
    overflow-wrap:break-word;
    word-break:keep-all;
  }
  button{font:inherit;color:inherit}
  button:focus-visible,[role="button"]:focus-visible{outline:2.5px solid var(--accent2);outline-offset:2px}
  .app{max-width:620px;margin:0 auto}

  /* ---------- header ---------- */
  .appbar{padding:calc(env(safe-area-inset-top) + 12px) 14px 8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand > div{min-width:0}
  .logo{
    width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(160deg,#2c56c9,#1b3178);color:#fff;font-size:19px;
    box-shadow:0 6px 14px -8px rgba(29,58,143,.9);
  }
  .brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .brand .brand-sub{margin:1px 0 0;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .icon-btn{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;font-size:16px;color:var(--ink2);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .icon-btn:active{transform:scale(.96)}
  .notice{
    display:flex;align-items:center;gap:6px;margin:9px 0 0;padding:7px 10px;
    background:var(--tint);border-radius:10px;font-size:11.5px;font-weight:600;color:var(--accent);
    line-height:1.35;letter-spacing:-.01em;
  }
  .notice .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);flex:0 0 6px}

  /* ---------- subject chips ---------- */
  .chipbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:8px 0 8px;
    border-bottom:1px solid transparent;
    transition:border-color .2s;
  }
  .chipbar.stuck{border-bottom-color:var(--line);box-shadow:0 8px 16px -16px rgba(15,23,42,.6)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:baseline;gap:5px;
    min-height:38px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:13.5px;font-weight:700;letter-spacing:-.01em;
    cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .chip .chip-count{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip[aria-selected="true"] .chip-count{color:rgba(255,255,255,.8)}
  html[data-theme="dark"] .chip[aria-selected="true"]{color:#0b1220}
  html[data-theme="dark"] .chip[aria-selected="true"] .chip-count{color:rgba(11,18,32,.62)}

  /* ---------- layout ---------- */
  main{padding:4px 14px 0}
  .view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:15px 15px;
  }
  .card + .card,.card + .row,.row + .card,.sec + .card,.card + .sec,.sec + .sec{margin-top:12px}
  .sec{margin-top:18px}
  h2.sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 8px;letter-spacing:-.01em}
  h3{font-size:14px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
  p{margin:0}
  .muted{color:var(--ink2);font-size:12.5px;line-height:1.55}
  .tiny{font-size:11.5px;color:var(--muted);line-height:1.5}
  .eyebrow{margin:0 0 3px;font-size:11.5px;font-weight:800;color:var(--accent2);letter-spacing:.02em}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- hero ---------- */
  .hero{padding:16px;background:linear-gradient(155deg,#223f96 0%,#16295f 100%);border:0;color:#fff;box-shadow:0 14px 30px -18px rgba(20,40,100,.95)}
  .hero .eyebrow{color:#b9caff}
  .hero-title{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .hero .hero-sub{margin:5px 0 0;font-size:12px;color:rgba(255,255,255,.78);line-height:1.5}
  .hero-stats{display:flex;gap:8px;margin-top:14px}
  .hero-stat{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 9px}
  .hero-stat b{display:block;font-size:17px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
  .hero-stat span{font-size:10.5px;color:rgba(255,255,255,.75);font-weight:600}
  html[data-theme="dark"] .hero{background:linear-gradient(155deg,#1b2e63 0%,#121d3c 100%)}

  /* ---------- progress ---------- */
  .prow + .prow{margin-top:13px}
  .prow-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
  .prow-title{font-size:13px;font-weight:800}
  .prow-val{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s ease}
  .bar.good > i{background:linear-gradient(90deg,#19a06a,#0f7a4e)}
  .prow-sub{margin-top:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:14px;
    font-size:14.5px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s;
  }
  .btn:active{transform:scale(.985);filter:brightness(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  html[data-theme="dark"] .btn-primary{background:#2f5bd0;color:#fff}
  .btn-good{background:var(--good);color:#fff}
  html[data-theme="dark"] .btn-good{background:#137a4e;color:#fff}
  .btn-warn{background:var(--warnbg);color:var(--warn);border:1.5px solid var(--warn);box-shadow:inset 0 0 0 1px rgba(154,90,6,.06)}
  .btn-ghost{background:var(--tint);color:var(--accent)}
  .btn-line{background:var(--card);border:1.5px solid var(--line);color:var(--ink2)}
  .btn-sm{min-height:40px;padding:9px 12px;font-size:12.5px;border-radius:11px;width:auto}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .row{display:flex;gap:9px}
  .row > .btn{flex:1}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .quick-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:3px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;
    min-height:74px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow);
  }
  .quick-btn .qi{font-size:16px;line-height:1}
  .quick-btn .qt{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
  .quick-btn .qc{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .quick-btn:active{transform:scale(.98)}

  /* ---------- subject rows ---------- */
  .subj-row{
    display:block;width:100%;text-align:left;background:none;border:0;padding:11px 0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .subj-row + .subj-row{border-top:1px solid var(--line)}
  .subj-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
  .subj-row-name{font-size:13.5px;font-weight:800}
  .subj-row-val{font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* ---------- flashcard ---------- */
  .deckbar{display:flex;gap:6px;overflow-x:auto;padding:1px 0 2px;scrollbar-width:none}
  .deckbar::-webkit-scrollbar{display:none}
  .fchip{
    flex:0 0 auto;min-height:34px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .fchip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent2);color:var(--accent)}
  .deck-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:11px 1px 7px}
  .deck-meta .dm-l{font-size:12px;font-weight:700;color:var(--ink2)}
  .deck-meta .dm-r{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

  .flash{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
  .flash-inner{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.8,.22,1);position:relative}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{
    grid-area:1 / 1;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:17px 16px;min-height:246px;
  }
  .face.back{transform:rotateY(180deg)}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .pill{
    display:inline-flex;align-items:center;gap:3px;
    padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:-.01em;
    background:var(--tint);color:var(--accent);line-height:1.4;white-space:nowrap;
  }
  .pill.rev{background:var(--warnbg);color:var(--warn)}
  .pill.known{background:var(--goodbg);color:var(--good)}
  .pill.unsure{background:var(--badbg);color:var(--bad)}
  .pill.diff{background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
  .face .q{
    margin:auto 0;font-size:19px;line-height:1.5;font-weight:800;letter-spacing:-.035em;
    text-align:center;padding:6px 2px;
  }
  .face .hint{margin-top:auto;padding-top:14px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
  .face .face-label{margin:0 0 7px;font-size:10.5px;font-weight:800;color:var(--accent2);letter-spacing:.04em}
  .face .answer{margin:0;font-size:14.5px;line-height:1.72;letter-spacing:-.015em;color:var(--ink)}
  .face .tagbox{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0 0;padding-top:11px;border-top:1px dashed var(--line)}
  .tagbox .tg-label{width:100%;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.03em;margin-bottom:1px}
  .tag{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .face .src{margin:11px 0 0;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .face .verify{margin:6px 0 0;font-size:10.5px;color:var(--muted);line-height:1.45}

  .mark-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .nav-row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .nav-row .btn{flex:0 0 auto;width:auto;min-height:44px;padding:8px 15px;font-size:13px}
  .nav-count{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  /* 사지선다 이전·다음 : 스크롤해도 화면 아래에 붙어 자유롭게 이동 */
  .qnav{
    position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 8px);z-index:16;
    display:flex;align-items:center;gap:8px;margin-top:14px;padding:6px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 6px 22px -12px rgba(15,23,42,.55);
  }
  .qnav .btn{flex:0 0 auto;width:auto;min-height:44px;padding:8px 14px;font-size:13.5px;border-radius:11px}
  .qnav .btn-primary{flex:1 1 auto;min-width:0;padding:8px 12px}
  .qnav-count{flex:0 0 auto;min-width:70px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .empty{text-align:center;padding:30px 16px}
  .empty .eico{font-size:30px;margin-bottom:8px}
  .empty h3{font-size:14.5px}
  .empty p{font-size:12.5px;color:var(--ink2);line-height:1.6}
  .empty .btn{margin-top:14px}

  /* ---------- quiz ---------- */
  .quizbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    border:0;background:none;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);
    cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:32px;
  }
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.14)}
  .qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .qmeta .qm-r{font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .qtext{margin:2px 0 13px;font-size:16px;line-height:1.55;font-weight:800;letter-spacing:-.03em}
  .qbox{margin:0 0 13px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-size:13.5px;line-height:1.72;color:var(--ink2);white-space:pre-line}
  .wn-box{margin:0 0 5px;font-size:12px;line-height:1.6;color:var(--ink2);white-space:pre-line}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    padding:12px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);
    font-size:13.5px;line-height:1.5;font-weight:600;letter-spacing:-.015em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,opacity .15s;
  }
  .choice .cnum{
    flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
    background:var(--tint);color:var(--accent);font-size:12px;font-weight:800;margin-top:1px;
  }
  .choice:active{background:var(--bg2)}
  .choice.correct{border-color:var(--good);background:var(--goodbg)}
  .choice.correct .cnum{background:var(--good);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--badbg)}
  .choice.wrong .cnum{background:var(--bad);color:#fff}
  .choice.dim{opacity:.55}
  .choice[disabled]{cursor:default}

  .explain{margin-top:13px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);scroll-margin-top:74px}
  .verdict{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin-bottom:10px;padding:9px 11px;border-radius:11px}
  .verdict.ok{background:var(--goodbg);color:var(--good)}
  .verdict.no{background:var(--badbg);color:var(--bad)}
  .explain h4{margin:13px 0 6px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em}
  .explain .body{font-size:13.5px;line-height:1.65;color:var(--ink)}
  .notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .notes li{display:flex;gap:7px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .ox{flex:0 0 18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:900;margin-top:1px}
  .ox.o{background:var(--goodbg);color:var(--good)}
  .ox.x{background:var(--badbg);color:var(--bad)}
  .explain .src{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .explain .verify{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.45}
  .after{margin-top:12px}

  .score{text-align:center;padding:8px 4px 4px}
  .score .pct{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
  .score .pct small{font-size:17px;font-weight:800;color:var(--muted)}
  .score .st{margin-top:2px;font-size:12.5px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
  .score .st-sub{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .score .msg{margin-top:9px;font-size:13px;color:var(--ink2);line-height:1.55}

  /* ---------- wrong note ---------- */
  .wn-group + .wn-group{margin-top:14px}
  .wn-group h3{font-size:12px;color:var(--muted);margin:0 0 6px}
  .wn-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .wn-item:first-of-type{border-top:0}
  .wn-main{flex:1;min-width:0}
  .wn-q{font-size:13px;line-height:1.5;font-weight:700;letter-spacing:-.02em}
  .wn-meta{margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .wn-x{
    flex:0 0 32px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);
    color:var(--muted);font-size:13px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .wn-x:active{background:var(--badbg);color:var(--bad)}
  .wn-card{border:0;background:none;padding:0;text-align:left;width:100%;cursor:pointer;font:inherit}
  .wn-item.wn-stack{display:block;padding:11px 0}
  .wn-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .wn-hint{flex:1;font-size:10px;font-weight:700;color:var(--muted)}
  .wn-acts{display:flex;align-items:center;gap:7px}
  .wn-acts .btn-sm{min-height:36px;padding:7px 13px;font-size:12px}
  .wn-acts .wn-x{width:36px;height:36px;flex:0 0 36px}

  /* ---------- details ---------- */
  details.card{padding:0;overflow:hidden}
  details.card > summary{
    list-style:none;cursor:pointer;padding:14px 15px;font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary::after{content:"+";font-size:17px;color:var(--muted);font-weight:600;line-height:1}
  details.card[open] > summary::after{content:"−"}
  details.card > .dbody{padding:0 15px 15px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
  .kv{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
  .kv:first-child{border-top:0;padding-top:0}
  .kv .k{flex:0 0 74px;font-size:11.5px;font-weight:800;color:var(--muted)}
  .kv .v{flex:1;font-size:12px;line-height:1.55}
  .bullet-list{margin:0;padding-left:17px}
  .bullet-list li{margin:5px 0;font-size:12px;line-height:1.55}
  .lawlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .lawlist li{font-size:11.5px;line-height:1.5;color:var(--ink2);padding-left:15px;position:relative}
  .lawlist li::before{content:"";position:absolute;left:3px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent2);opacity:.6}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -8px 24px -20px rgba(15,23,42,.7);
  }
  .tabbar-inner{max-width:620px;margin:0 auto;display:flex}
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:none;min-height:var(--tabh);padding:4px 0 2px;
    font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:-.01em;
    cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent2)}
  .tab[aria-selected="true"]::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent2)}
  .tab .tbadge{
    position:absolute;top:8px;left:calc(50% + 8px);min-width:15px;height:15px;padding:0 4px;border-radius:99px;
    background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;line-height:1;
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
    transform:translate(-50%,14px);z-index:80;
    background:rgba(15,23,42,.94);color:#fff;font-size:12.5px;font-weight:700;
    padding:10px 15px;border-radius:99px;max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.7);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-color-scheme: dark){.toast{background:rgba(235,241,252,.96);color:#0c1017}}

  /* ---------- sheet & modal ---------- */
  .overlay{position:fixed;inset:0;z-index:70;background:rgba(9,14,26,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  @media (min-width:640px){.overlay{align-items:center}}
  .sheet{
    width:100%;max-width:620px;max-height:88vh;background:var(--bg2);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);animation:slideup .24s cubic-bezier(.2,.85,.25,1);
  }
  @media (min-width:640px){.sheet{border-radius:22px;max-height:82vh}}
  @keyframes slideup{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .sheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}
  .sheet-body{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
  .sheet-body .card{box-shadow:none;background:var(--card)}
  .sheet-body .sec{margin-top:16px}

  .modal{
    width:calc(100% - 40px);max-width:360px;background:var(--card);border-radius:18px;padding:20px 18px 16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55);animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 8px;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .modal p{margin:0;font-size:13px;line-height:1.6;color:var(--ink2)}
  .modal .row{margin-top:16px}
  .btn-danger{background:var(--bad);color:#fff}
  html[data-theme="dark"] .btn-danger{background:#c2382f;color:#fff}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }

  /* ================= 캐릭터 버디 · 명언 · 포인트/계급 ================= */
  /* 명언 롤링 */
  .quote{margin-top:2px;margin-bottom:12px}
  .quote-btn{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:10px 12px;border-radius:15px;border:1px dashed #c8d6fb;
    background:linear-gradient(135deg,#f1f5ff 0%,#fdf6fb 100%);
    color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;
    box-shadow:0 8px 20px -18px rgba(29,58,143,.8);
  }
  .quote-btn:active{filter:brightness(.985)}
  .quote-ic{flex:0 0 auto;font-size:12px;color:#8fa6e0;line-height:1}
  .quote-text{
    flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.45;letter-spacing:-.02em;
    min-height:2.9em;display:flex;align-items:center;
    transition:opacity .22s ease,transform .22s ease;
  }
  .quote-text.out{opacity:0;transform:translateY(-3px)}
  .quote-hint{
    flex:0 0 auto;font-size:10px;font-weight:800;color:#9aa8c7;background:#fff;
    border:1px solid #e2e9fa;padding:2px 6px;border-radius:99px;line-height:1.5;
  }
  html[data-theme="dark"] .quote-btn{background:linear-gradient(135deg,#18223c 0%,#221a30 100%);border-color:#33415f}
  html[data-theme="dark"] .quote-hint{background:#0f1522;border-color:#2b3550;color:#7f8ba6}

  /* 히어로 · 계급 */
  .hero{position:relative;overflow:hidden;padding:14px 15px 15px}
  .hero::after{
    content:"";position:absolute;right:-46px;top:-58px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 66%);pointer-events:none;
  }
  .hero::before{
    content:"";position:absolute;left:-34px;bottom:-64px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(164,196,255,.3),rgba(164,196,255,0) 70%);pointer-events:none;
  }
  .hero-top{position:relative;display:flex;align-items:flex-start;gap:8px}
  .hero-copy{flex:1 1 auto;min-width:0}
  .hero-fig{flex:0 0 74px;width:74px;position:relative;align-self:flex-end}
  .hero-fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 11px rgba(4,10,30,.45))}
  .rank-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:1px 0 0}
  .rank-name{font-size:23px;font-weight:900;letter-spacing:-.045em;line-height:1.15}
  .insignia{display:inline-flex;align-items:center;gap:2px}
  .insignia svg{width:13px;height:13px;display:block;flex:0 0 auto}
  .hero-greet{margin:6px 0 0;font-size:12px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.45}
  .pscore{display:flex;align-items:baseline;gap:3px;margin-top:9px;flex-wrap:wrap}
  .pscore b{font-size:20px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pscore span{font-size:11px;font-weight:800;color:rgba(255,255,255,.72)}
  .pscore .earn{
    margin-left:4px;align-self:center;font-size:10.5px;font-weight:800;color:#ffe1ab;
    background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px;
  }
  .rank-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:10px}
  .rank-bar > i{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#ffd98a,#f7b733);
    transition:width .55s cubic-bezier(.2,.8,.2,1);
  }
  .rank-next{margin-top:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.45}

  /* 하루 할당량 */
  .mission .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .mission .bonus{
    flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warnbg);
    padding:3px 8px;border-radius:99px;line-height:1.5;
  }
  .mission.done{border-color:#bfe8d3}
  .mission.done .bonus{color:var(--good);background:var(--goodbg)}
  .mission-foot{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .mission.done .mission-foot{color:var(--good)}
  html[data-theme="dark"] .mission.done{border-color:#1f4635}

  /* 캐릭터 버디 바 */
  .buddy{
    display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:15px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    margin-bottom:10px;position:relative;
  }
  .buddy-av{
    position:relative;flex:0 0 44px;width:44px;height:44px;border-radius:50%;overflow:hidden;
    background:linear-gradient(150deg,#e9f0ff,#f7ecff);
  }
  .buddy-av img{display:block;width:100%;height:100%;object-fit:cover}
  .buddy.good .buddy-av{box-shadow:0 0 0 2px rgba(25,160,106,.5)}
  .buddy.cheer .buddy-av{box-shadow:0 0 0 2px rgba(255,138,128,.5)}
  .buddy.pop .buddy-av{animation:buddyPop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes buddyPop{0%{transform:scale(.82) rotate(-7deg)}55%{transform:scale(1.12) rotate(4deg)}100%{transform:none}}
  .buddy-text{flex:1;min-width:0}
  .buddy-line{font-size:12.5px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
  .buddy-sub{margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}
  .float-pt{
    position:absolute;left:22px;top:0;font-size:11px;font-weight:900;color:var(--good);
    white-space:nowrap;pointer-events:none;z-index:3;
    animation:floatUp 1.35s ease-out forwards;
  }
  .float-pt.minus{color:var(--bad)}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,6px) scale(.9)}
    22%{opacity:1;transform:translate(-50%,-8px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-30px) scale(1)}
  }
  html[data-theme="dark"] .buddy-av{background:linear-gradient(150deg,#212c47,#2a2138)}

  /* 응답 영역 리액션 */
  .reaction{
    position:relative;display:flex;align-items:center;gap:9px;margin:0 0 11px;padding:8px 10px;
    border-radius:12px;background:var(--bg2);border:1px solid var(--line);
  }
  .reaction.good{background:var(--goodbg);border-color:rgba(15,122,78,.22)}
  .reaction.cheer{background:var(--warnbg);border-color:rgba(154,90,6,.22)}
  .rx-av{flex:0 0 32px;width:32px;height:32px;border-radius:50%;overflow:hidden;background:#eef3ff}
  .rx-av img{display:block;width:100%;height:100%;object-fit:cover}
  .rx-line{font-size:12px;font-weight:800;line-height:1.4}
  .rx-sub{margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}

  /* 결과 화면 캐릭터 */
  .score-fig{display:block;width:76px;height:auto;margin:2px auto 0}

  /* 승진 축하 */
  .overlay.center{align-items:center;padding:20px}
  .modal.promo{text-align:center;padding:18px 18px 15px;border-radius:20px;position:relative;overflow:hidden}
  .promo-fig{display:block;width:92px;height:auto;margin:0 auto 2px;filter:drop-shadow(0 8px 12px rgba(15,23,42,.22))}
  .modal.promo .eyebrow{color:#d99b00}
  .promo-insignia{display:flex;justify-content:center;gap:3px;margin:7px 0 3px}
  .promo-insignia svg{width:14px;height:14px}
  .modal.promo h2{font-size:18px}
  .modal.promo .promo-note{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .promo-spark{position:absolute;font-size:15px;opacity:.85;animation:sparkle 1.9s ease-in-out infinite alternate}
  .promo-spark.s1{left:16px;top:22px}
  .promo-spark.s2{right:16px;top:52px;animation-delay:.5s}
  @keyframes sparkle{from{transform:scale(.8);opacity:.35}to{transform:scale(1.15);opacity:.95}}

  @media (max-width:360px){
    .rank-name{font-size:20px}
    .pscore b{font-size:18px}
    .hero-fig{flex-basis:64px;width:64px}
    .hero-greet{font-size:11.5px}
    .quote-text{font-size:12px}
    .quote-hint{display:none}
    .buddy{gap:8px;padding:7px 9px}
    .buddy-av{flex-basis:40px;width:40px;height:40px}
    .buddy-line{font-size:12px}
  }
  /* ================= 실전 기출 모드 ================= */
  .gswitch{margin-bottom:10px}
  .gswitch .seg{width:100%}
  .gswitch .seg button{flex:1}
  .gchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gchips::-webkit-scrollbar{display:none}
  .gchip{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);background:var(--bg2);border-radius:11px;font:inherit;font-size:12px;font-weight:800;color:var(--ink2)}
  .gchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .gchip-c{font-size:10.5px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
  .gsubj{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 10px}
  .gbtn{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:11px 6px;border:1px solid var(--line);background:var(--card);border-radius:13px;color:var(--ink);font:inherit}
  .gbtn-t{font-size:13px;font-weight:800}
  .gbtn-s{font-size:10.5px;color:var(--muted);font-weight:700}
  .gactive{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
  .gactive-t{font-size:12.5px;font-weight:800;color:var(--ink2)}
  .gnote{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--muted)}
  .pill.law{background:var(--warnbg);color:var(--warn)}
  .pill.law.out{background:var(--badbg);color:var(--bad)}
  .lawbox{margin:0 0 10px;padding:10px 11px;border-radius:11px;background:var(--warnbg)}
  .lawbox.out{background:var(--badbg)}
  .lawbox strong{display:block;font-size:11.5px;font-weight:800;color:var(--warn);margin-bottom:4px}
  .lawbox.out strong{color:var(--bad)}
  .lawbox p{margin:0;font-size:12px;line-height:1.55;color:var(--ink2)}
  .verdict.skip{background:var(--warnbg);color:var(--warn)}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">🛡️</span>
        <div>
          <h1>경찰공채 핵심암기</h1>
          <p class="brand-sub" id="brandSub">헌법 · 형사법 · 경찰학</p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="설정과 데이터 정보">⚙</button>
    </div>
    <div class="notice">
      <span class="dot" aria-hidden="true"></span>
      <span>실전 기출 1,000문항 · 핵심 50문항 · 2026.10.2. 개정 반영</span>
    </div>
  </header>

  <div class="chipbar" id="chipbar">
    <div class="chips" id="subjectChips" role="tablist" aria-label="과목 선택"></div>
  </div>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-cards" hidden></section>
    <section class="view" id="view-quiz" hidden></section>
    <section class="view" id="view-wrong" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="학습 모드">
  <div class="tabbar-inner" role="tablist">
    <button type="button" class="tab" id="tab-home" data-tab="home" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.7 12 3.5l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>홈</span>
    </button>
    <button type="button" class="tab" id="tab-cards" data-tab="cards" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.6A1.6 1.6 0 0 1 5.6 4H11v16H5.6A1.6 1.6 0 0 1 4 18.4z"/><path d="M20 5.6A1.6 1.6 0 0 0 18.4 4H13v16h5.4A1.6 1.6 0 0 0 20 18.4z"/></svg>
      <span>암기카드</span>
    </button>
    <button type="button" class="tab" id="tab-quiz" data-tab="quiz" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4h15v16h-15z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg>
      <span>사지선다</span>
    </button>
    <button type="button" class="tab" id="tab-wrong" data-tab="wrong" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6 21 20H3z"/><path d="M12 9.5v5"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>오답노트</span>
      <span class="tbadge" id="wrongBadge" hidden></span>
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="sheetOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">설정과 데이터 정보</h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <h2 id="modalTitle">학습 기록 초기화</h2>
    <p id="modalBody"></p>
    <div class="row">
      <button type="button" class="btn btn-line" id="modalCancel">취소</button>
      <button type="button" class="btn btn-danger" id="modalOk">초기화</button>
    </div>
  </div>
</div>

<div class="overlay center" id="promoOverlay" hidden>
  <div class="modal promo" role="alertdialog" aria-modal="true" aria-labelledby="promoTitle">
    <span class="promo-spark s1" aria-hidden="true">✦</span>
    <span class="promo-spark s2" aria-hidden="true">✦</span>
    <img class="promo-fig" src="./assets/char-thumbsup.png" alt="" width="92" height="177" loading="lazy" decoding="async">
    <p class="eyebrow">승진했어요!</p>
    <h2 id="promoTitle">순경 → 경장</h2>

<script type="application/json" id="study-data">{"meta":{"title":"경찰공무원 순경 공채 3과목 학습 데이터 (헌법·형사법·경찰학)","generated_at":"2026-11-22","verified_against":"국가법령정보센터(law.go.kr) 현행 조문 원문, 헌법재판소 결정문·보도자료, 법무부·연합뉴스 보도","exam_basis":{"note":"2026년 제2차 순경 공채 공고(제2026-11호) 기준. 2027년 일정은 아직 공고 전이며 최근 3년 1차 필기는 3월 중순 토요일이었다.","subjects":"헌법 20문항 50점, 형사법 40문항 100점, 경찰학 40문항 100점 (총 100문항 250점, 100분, 4지선다, 10:00~11:40)","ratios":"헌법: 기본권 총론·각론 80% 내외, 헌법총론·기본질서 20% 내외 / 형사법: 형법총론 35%, 형법각론 35%, 형사소송법 30% / 경찰학: 경찰행정법 35%, 경찰학 기초이론 30%, 경찰행정학 15%, 분야별 경찰활동 15%, 한국경찰사·비교경찰 5%","pass_rule":"한국사·영어는 능력검정 대체. 각 과목 만점의 40% 이상 득점자 중 고득점자 순으로 선발예정 인원의 2배수 선발(총점 요건 없음)."},"critical_notice":"2026. 10. 2.부터 「검찰청법」이 폐지되고 「공소청법」·「중대범죄수사청 조직 및 운영에 관한 법률」이 시행되어, 형사소송법(법률 제21857호, 2026.8.4. / 법률 제22009호, 2026.9.29.)상 검사의 직접수사권이 폐지되고 수사 주체가 사법경찰관으로 일원화되었다. 2024~2025년 기출의 수사·영장·기소 파트는 현행법과 결론이 달라질 수 있으므로, 이 데이터는 현행법 기준으로 작성하고 변경된 쟁점에 '2026.10.2. 개정' 표시를 달았다.","law_versions":["대한민국헌법 [헌법 제10호, 1987.10.29. 전부개정, 시행 1988.2.25.]","형법 [법률 제22007호, 2026.9.29. 일부개정, 시행 2026.10.2.]","형사소송법 [법률 제22009호, 2026.9.29. 일부개정, 시행 2026.10.2.]","경찰관 직무집행법 [법률 제21304호, 2026.1.6. 일부개정, 시행 2026.7.7.]","국가경찰과 자치경찰의 조직 및 운영에 관한 법률(경찰법) [법률 제22015호, 2026.9.29. 일부개정, 시행 2026.10.2.]","경찰공무원법 [법률 제20646호, 2025.1.7. 일부개정, 시행 2025.1.7.]","도로교통법 [법률 제22067호, 2026.10.13. 일부개정]","스토킹범죄의 처벌 등에 관한 법률 [법률 제21998호, 2026.9.29. 일부개정, 시행 2026.10.2.]"],"gyeolchul_updated":"2026-11-22","core_revised_at":"2026-11-22","core_note":"핵심 문항 50문항(헌법 15·형사법 20·경찰학 15)은 2026-11-22에 실제 순경 공채 발문·선지 형식으로 전면 개편했고, 형사소송법 2026.10.2. 개정 쟁점 7문항에는 🆕 배지를 달았다."},"subjects":[{"id":"constitution","name":"헌법","description":"기본권 총론·각론 80%, 헌법총론·기본질서 20%. 조문 숫자(정족수·기간·인원)와 최신 헌재 결정을 함께 정리한다.","flashcards":[{"id":"C01","front":"기본권 제한의 일반원칙 3요소는? (헌법 제37조 제2항)","back":"① 국가안전보장·질서유지 또는 공공복리를 위하여 '필요한 경우에 한하여' ② '법률로써' 제한 ③ 제한하는 경우에도 자유와 권리의 '본질적인 내용'은 침해할 수 없다. + 제37조 제1항: 열거되지 아니한 권리도 경시되지 않는다.","source":"대한민국헌법 제37조","verified_note":"law.go.kr 헌법 본문(시행 1988.2.25.) 2026-11-21 조회, 제37조 제1·2항 원문 대조","tags":["기본권총론","제37조","비례원칙"]},{"id":"C02","front":"평등원칙 조항에서 시험에 자주 나오는 제11조 제2항·제3항은?","back":"② 사회적 특수계급의 제도는 인정되지 아니하며 어떠한 형태로도 창설할 수 없다. ③ 훈장 등의 영전은 이를 받은 자에게만 효력이 있고, 어떠한 특권도 이에 따르지 아니한다. (①은 법 앞의 평등 + 성별·종교·사회적 신분에 의한 차별 금지)","source":"대한민국헌법 제11조","verified_note":"law.go.kr 헌법 제11조 원문 대조(2026-11-21)","tags":["평등권","제11조"]},{"id":"C03","front":"영장주의의 예외 2가지와 체포·구속 시 고지·통지 규정은? (헌법 제12조)","back":"영장 제시 예외: ① 현행범인인 경우 ② 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때(사후 영장 청구 가능). 제5항: 체포·구속의 이유와 변호인의 조력을 받을 권리를 고지받지 아니하고는 체포·구속되지 않으며, 가족 등에게 이유와 일시·장소를 지체 없이 통지. 제6항: 적부심사를 법원에 청구할 권리.","source":"대한민국헌법 제12조 제3항·제5항·제6항","verified_note":"law.go.kr 헌법 제12조 원문 대조(2026-11-21). 조문은 여전히 '검사의 신청에 의하여 법관이 발부한 영장'으로 규정되어 있음(2026.10.2. 형사사법 개편 후에도 헌법 조문은 미개정).","tags":["신체의자유","영장주의","제12조"]},{"id":"C04","front":"죄형법정주의·일사부재리·연좌제 금지를 규정한 조문과 각 항의 내용은?","back":"헌법 제13조. ① 행위시의 법률에 의하여 범죄를 구성하지 아니하는 행위로 소추되지 아니하며, 동일한 범죄에 대하여 거듭 처벌받지 아니한다(죄형법정주의+일사부재리). ② 소급입법에 의하여 참정권의 제한을 받거나 재산권을 박탈당하지 아니한다. ③ 자기의 행위가 아닌 친족의 행위로 인하여 불이익한 처우를 받지 아니한다(연좌제 금지).","source":"대한민국헌법 제13조","verified_note":"law.go.kr 헌법 제13조 원문 대조(2026-11-21)","tags":["죄형법정주의","제13조"]},{"id":"C05","front":"언론·출판의 자유와 집회·결사의 자유에서 금지되는 것과 피해 구제는? (헌법 제21조)","back":"② 언론·출판에 대한 허가나 검열과 집회·결사에 대한 허가는 인정되지 아니한다(신고제는 가능). ④ 언론·출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니 되고, 침해한 때에는 피해자가 피해의 배상을 청구할 수 있다.","source":"대한민국헌법 제21조","verified_note":"law.go.kr 헌법 제21조 원문 대조(2026-11-21)","tags":["언론자유","집회결사","제21조"]},{"id":"C06","front":"재산권의 수용·사용·제한과 보상의 헌법적 요건은?","back":"제23조 제3항: 공공필요에 의한 재산권의 수용·사용 또는 제한 및 그에 대한 보상은 법률로써 하되, 정당한 보상을 지급하여야 한다. 제1항: 재산권의 내용과 한계는 법률로 정한다. 제2항: 재산권의 행사는 공공복리에 적합하도록 하여야 한다.","source":"대한민국헌법 제23조","verified_note":"law.go.kr 헌법 제23조 원문 대조(2026-11-21)","tags":["재산권","제23조"]},{"id":"C07","front":"재판청구권 조항 중 숫자·대상이 자주 틀리는 부분은? (헌법 제27조)","back":"① 법관에 의하여 법률에 의한 재판을 받을 권리. ② 군인·군무원이 아닌 국민은 영역 안에서는 '중대한 군사상 기밀·초병·초소·유독음식물공급·포로·군용물에 관한 죄 중 법률이 정한 경우'와 '비상계엄이 선포된 경우'를 제외하고 군사법원의 재판을 받지 아니한다. ③ 신속한 재판, 형사피고인의 공개재판. ④ 무죄추정. ⑤ 형사피해자의 재판절차 진술권.","source":"대한민국헌법 제27조","verified_note":"law.go.kr 헌법 제27조 원문 대조(2026-11-21)","tags":["재판청구권","제27조"]},{"id":"C08","front":"국가배상·형사보상·범죄피해자 구조, 그리고 경찰공무원의 배상 제한은?","back":"제29조 제1항: 공무원의 직무상 불법행위로 손해를 받은 국민은 국가·공공단체에 정당한 배상을 청구할 수 있고, 공무원 자신의 책임은 면제되지 않는다. 제29조 제2항: 군인·군무원·경찰공무원 등이 전투·훈련 등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상 외에 직무상 불법행위로 인한 배상은 청구할 수 없다. 제28조 형사보상, 제30조 범죄피해자 구조.","source":"대한민국헌법 제28조·제29조·제30조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["국가배상","제29조","경찰"]},{"id":"C09","front":"근로3권과 공무원의 제한은? (헌법 제33조)","back":"① 근로자는 근로조건 향상을 위하여 자주적인 단결권·단체교섭권·단체행동권을 가진다. ② 공무원인 근로자는 법률이 정하는 자에 한하여 단결권·단체교섭권·단체행동권을 가진다. ③ 법률이 정하는 주요방위산업체 종사 근로자의 단체행동권은 법률로 제한하거나 인정하지 아니할 수 있다.","source":"대한민국헌법 제33조","verified_note":"law.go.kr 헌법 제33조 원문 대조(2026-11-21)","tags":["근로3권","제33조","공무원"]},{"id":"C10","front":"국회의 일반 의결정족수와 가부동수 처리, 회기·예산 관련 숫자는?","back":"제49조: 헌법 또는 법률에 특별한 규정이 없는 한 재적의원 과반수의 출석과 출석의원 과반수의 찬성으로 의결하며, 가부동수인 때에는 부결된 것으로 본다. 제47조 제2항: 정기회 회기 100일, 임시회 회기 30일을 초과할 수 없다. 제54조 제2항: 정부는 회계연도 개시 90일 전까지 예산안 제출, 국회는 30일 전까지 의결.","source":"대한민국헌법 제47조·제49조·제54조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["국회","의결정족수","제49조"]},{"id":"C11","front":"법률안에 대한 대통령의 재의요구와 국회 재의결 정족수는?","back":"제53조: 국회 의결 법률안은 정부에 이송되어 15일 이내 공포. 대통령이 이의가 있으면 기간 내 이의서를 붙여 환부하고 재의 요구 가능(일부·수정 재의요구는 불가). 재의요구 시 국회는 재적의원 과반수 출석과 출석의원 3분의 2 이상 찬성으로 전과 같은 의결을 하면 법률로 확정된다.","source":"대한민국헌법 제53조","verified_note":"law.go.kr 헌법 제53조 원문 대조(2026-11-21)","tags":["국회","재의요구","제53조"]},{"id":"C12","front":"탄핵소추 발의·의결 정족수는 대상별로 어떻게 다른가? (헌법 제65조)","back":"일반 공무원(국무총리·국무위원·헌법재판소 재판관·법관·중앙선관위 위원·감사원장·감사위원 등): 국회재적의원 3분의 1 이상 발의 + 국회재적의원 과반수 찬성. 대통령: 국회재적의원 과반수 발의 + 국회재적의원 3분의 2 이상 찬성. 탄핵소추 의결 시 탄핵심판까지 권한행사 정지, 탄핵결정은 파면에 그치고 민·형사 책임은 면제되지 않는다.","source":"대한민국헌법 제65조","verified_note":"law.go.kr 헌법 제65조 원문 대조(2026-11-21)","tags":["탄핵","제65조"]},{"id":"C13","front":"대통령의 선거 연령·임기·선거 시기는?","back":"제67조 제4항: 국회의원 피선거권이 있고 선거일 현재 40세에 달하여야 한다. 제70조: 임기 5년, 중임할 수 없다. 제68조: 임기만료 시 70일 내지 40일 전에 후임자 선거, 궐위·당선자 사망 등 자격상실 시 60일 이내 선거.","source":"대한민국헌법 제67조·제68조·제70조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["대통령","제70조"]},{"id":"C14","front":"계엄의 종류와 국회의 계엄 해제 요구 정족수는?","back":"제77조: 계엄은 비상계엄과 경비계엄으로 한다. 비상계엄이 선포되면 법률이 정하는 바에 의하여 영장제도, 언론·출판·집회·결사의 자유, 정부나 법원의 권한에 관하여 특별한 조치를 할 수 있다. 계엄 선포 시 대통령은 지체 없이 국회에 통고하여야 하고, 국회가 재적의원 과반수의 찬성으로 해제를 요구하면 대통령은 이를 해제하여야 한다.","source":"대한민국헌법 제77조","verified_note":"law.go.kr 헌법 제77조 원문 대조(2026-11-21)","tags":["계엄","제77조"]},{"id":"C15","front":"헌법재판소의 구성(인원·임명 경로)과 결정 정족수는?","back":"제111조: 법관 자격을 가진 9인의 재판관, 대통령이 임명하되 3인은 국회에서 선출한 자, 3인은 대법원장이 지명한 자를 임명. 소장은 국회 동의를 얻어 재판관 중에서 대통령이 임명. 제112조: 임기 6년, 법률이 정하는 바에 의하여 연임 가능. 제113조 제1항: 법률의 위헌결정, 탄핵결정, 정당해산결정, 헌법소원 인용결정에는 재판관 6인 이상의 찬성이 필요하다.","source":"대한민국헌법 제111조~제113조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["헌법재판소","제111조","제113조"]},{"id":"C16","front":"법관의 임기·신분보장과 위헌법률심판 제청권은?","back":"제105조: 대법원장 임기 6년·중임 불가, 대법관 임기 6년·법률이 정하는 바에 의하여 연임 가능, 대법원장·대법관이 아닌 법관 임기 10년·연임 가능. 제106조: 법관은 탄핵 또는 금고 이상의 형의 선고에 의하지 아니하고는 파면되지 아니하고, 징계처분에 의하지 아니하고는 정직·감봉 기타 불리한 처분을 받지 아니한다. 제107조 제1항: 법률이 헌법에 위반되는 여부가 재판의 전제가 된 경우 법원은 헌법재판소에 제청하여 그 심판에 의하여 재판한다.","source":"대한민국헌법 제105조~제107조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["법원","제107조","위헌법률심판"]},{"id":"C17","front":"헌법개정 절차의 숫자를 순서대로 말하면?","back":"제128조: 국회재적의원 과반수 또는 대통령 발의로 제안. 제129조: 대통령이 20일 이상 공고. 제130조: 국회는 공고된 날부터 60일 이내에 재적의원 3분의 2 이상 찬성으로 의결 → 의결 후 30일 이내 국민투표 → 국회의원선거권자 과반수 투표와 투표자 과반수 찬성으로 확정.","source":"대한민국헌법 제128조~제130조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["헌법개정","제130조"]},{"id":"C18","front":"최신 헌재 결정 2건의 사건번호·결론은? (2026년)","back":"① 2022헌바95(2026.10.22., 재판관 8:1): 형법 제250조 제2항 중 '자기의 직계존속을 살해한 자' 부분은 합헌(존속살해 가중처벌 유지). ② 2021헌바168(2026.2.26.): 집시법 제22조 제2항 중 제6조 제1항 본문 가운데 '옥외집회'에 관한 부분(미신고 옥외집회 처벌조항)은 헌법불합치, 2027.8.31.을 시한으로 개정될 때까지 계속 적용. 같은 법 제6조 제1항 본문의 신고조항 자체는 합헌.","source":"헌법재판소 2022헌바95 결정(2026.10.22.), 헌법재판소 2021헌바168 결정(2026.2.26.)","verified_note":"헌법재판소 홈페이지 '최근 주요결정' 및 헌법불합치 목록(ccourt.go.kr) 2026-11-21 조회, 결정 주문·종국일자·의견수 대조","tags":["헌재","최신판례","존속살해","집시법"]}],"questions":[{"id":"CQ01","question":"기본권 제한의 일반원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["국민의 모든 자유와 권리는 국가안전보장·질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 제한할 수 있고, 제한하는 경우에도 자유와 권리의 본질적인 내용은 침해할 수 없다.","기본권의 제한은 국가안전보장·질서유지·공공복리를 위한 경우 외에도, 행정의 능률과 편의를 도모하거나 관리상의 편의를 위하여 필요한 경우에는 법률로써 할 수 있다.","기본권을 제한하는 것은 국회가 제정한 법률에 의하여야 하고, 법률의 위임을 받은 대통령령 등 하위법령만으로는 헌법 제37조 제2항이 정한 기본권 제한의 형식과 요건을 충족할 수 없다.","헌법에 열거되지 아니한 자유와 권리도 헌법 제37조 제1항에 따라 경시되지 아니하며, 같은 조 제2항에 따라 국가안전보장·질서유지 또는 공공복리를 위하여 법률로 제한될 수 있다."],"answer_index":1,"explanation":"제37조 제2항은 제한의 목적을 국가안전보장·질서유지 또는 공공복리로 한정하고, '필요한 경우에 한하여 법률로써' 제한하도록 하며, 제한하는 경우에도 본질적인 내용을 침해할 수 없다고 규정한다. 행정의 능률이나 편의는 여기에 열거되지 않은 목적이므로 ②가 가장 적절하지 않다.","choice_notes":["제37조 제2항의 문언과 그대로 일치한다.","행정의 능률·편의는 제37조 제2항이 정한 제한 목적이 아니다. 열거된 세 가지 목적 중 어느 것도 충족하지 못하면 법률로써도 제한할 수 없다.","'법률로써'는 국회가 제정한 형식적 법률을 뜻하므로, 하위법령만으로는 제2항이 정한 제한의 형식을 갖추지 못한다.","제37조 제2항은 '국민의 모든 자유와 권리'를 대상으로 하므로, 열거되지 않은 기본권도 같은 제한 원칙의 적용을 받는다."],"source":"대한민국헌법 제37조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제37조 제1·2항","difficulty":"중","choice_truth":[true,false,true,true]},{"id":"CQ02","question":"헌법 제10조 및 제37조 제1항에 따른 기본권 보장에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["모든 국민은 인간으로서의 존엄과 가치를 가지며 행복을 추구할 권리를 가지고, 국가는 개인이 가지는 불가침의 기본적 인권을 확인하고 이를 보장할 의무를 진다.","국민의 자유와 권리는 헌법에 열거되지 아니한 이유로 경시되지 아니하며, 이에 따라 헌법에 열거되지 않은 기본권도 헌법의 보호를 받는 기본권으로 인정된다.","헌법에 열거되지 아니한 기본권은 그 구체적 내용과 한계가 전적으로 입법자의 형성에 맡겨져 있어, 입법자가 이를 어떻게 규율하든 헌법재판의 심사 대상이 되지 아니한다.","국가의 기본권 보장의무는 입법·행정·사법을 포함한 모든 국가기관을 구속하는 것으로서, 국가기관은 국민의 기본권을 실현하기 위하여 필요한 조치를 하여야 한다."],"answer_index":2,"explanation":"제37조 제1항은 열거되지 아니한 권리도 경시되지 아니한다고 규정할 뿐, 그 내용과 한계를 입법자에게 전적으로 맡기지 않는다. 열거되지 않은 기본권도 헌법 제37조 제2항의 제한 원칙과 헌법재판의 심사 대상이 되므로 ③이 가장 적절하지 않다.","choice_notes":["제10조 전단·후단의 문언과 일치한다.","제37조 제1항의 문언과 일치하며, 포괄적 기본권 보장의 근거가 된다.","열거되지 않은 기본권도 헌법의 보호를 받고 제37조 제2항의 제한 원칙이 적용되므로, 입법 형성에 전적으로 맡겨진다고 볼 수 없다.","제10조 후단의 국가의 보장의무는 모든 국가기관에 대한 객관적 규범으로 작용한다."],"source":"대한민국헌법 제10조·제37조 제1항","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제10조·제37조 제1항","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"CQ03","question":"헌법 제11조의 평등원칙과 사회적 특수계급 금지에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["모든 국민은 법 앞에 평등하며, 누구든지 성별·종교 또는 사회적 신분에 의하여 정치적·경제적·사회적·문화적 생활의 모든 영역에서 차별을 받지 아니하고, 입법자는 합리적 이유 없이 같은 것을 다르게 대우하여서는 아니 된다.","사회적 특수계급의 제도는 인정되지 아니하며, 어떠한 형태로도 이를 창설할 수 없으므로 법률이나 대통령령 등 어떤 규범 형식으로도 신분계급을 새로 만들 수 없다.","훈장 등의 영전은 이를 받은 자에게만 효력이 있고 어떠한 특권도 이에 따르지 아니하므로, 훈장을 받은 사람이라도 그 영전을 자손에게 세습하거나 공직 임용에서 특권을 주장할 수 없다.","사회적 특수계급의 창설은 원칙적으로 금지되지만, 법률로써 특정한 가문이나 혈통에 세습적인 지위를 부여하여 공직에 우선하여 임용되도록 하는 경우에는 예외적으로 허용된다."],"answer_index":3,"explanation":"제11조 제2항은 사회적 특수계급의 제도를 인정하지 아니하며 어떠한 형태로도 창설할 수 없다고 규정한다. 법률로써 정하더라도 신분계급의 창설은 허용되지 않으므로 ④가 가장 적절하지 않다.","choice_notes":["제11조 제1항의 문언과 일치한다.","제11조 제2항은 '어떠한 형태로도' 창설을 금지하므로 규범 형식을 가리지 않는다.","제11조 제3항의 문언과 일치한다.","제11조 제2항이 어떤 형태의 창설도 금지하므로 법률에 의한 예외도 인정되지 않는다."],"source":"대한민국헌법 제11조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제11조 제1~3항","difficulty":"하","choice_truth":[true,true,true,false]},{"id":"CQ04","question":"헌법 제12조 제3항의 영장 제시와 사후 영장 청구에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠, ㉡, ㉢","㉠, ㉡, ㉣","㉠, ㉢, ㉣","㉡, ㉢, ㉣"],"answer_index":0,"explanation":"제12조 제3항 본문은 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하도록 하고, 단서는 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에 사후에 영장을 청구할 수 있다고 규정한다. ㉠·㉡·㉢이 옳고, ㉣의 '장기 1년 이상'은 조문에 없는 요건이다.","choice_notes":["㉠·㉡·㉢ 모두 조문에 명시되어 있다.","㉣의 '장기 1년 이상'은 제12조 제3항 단서의 요건이 아니다.","㉣이 조문에 없는 요건을 들고 있다.","㉠을 누락하였다. 영장 제시의 원칙은 조문의 본문에 명시되어 있다."],"source":"대한민국헌법 제12조 제3항","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제12조 제3항(2026.10.2. 형사사법 개편 후에도 '검사의 신청' 문구 유지 확인)","difficulty":"중","box":"㉠ 체포·구속·압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다.\n㉡ 현행범인인 경우에는 사후에 영장을 청구할 수 있다.\n㉢ 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다.\n㉣ 장기 1년 이상의 형에 해당하는 죄를 범한 경우에도 사후에 영장을 청구할 수 있다.","choice_truth":[true,false,false,false]},{"id":"CQ05","question":"체포·구속된 자의 권리 보장에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니하고, 그 가족 등 법률이 정하는 자에게는 그 이유와 일시·장소가 지체 없이 통지되어야 한다.","체포 또는 구속을 당한 사람은 그 적부의 심사를 법원에 청구할 권리를 가지나, 이 권리는 구속된 이후에만 행사할 수 있고 체포 단계에서는 행사할 수 없으며 구속영장이 발부된 뒤에야 비로소 행사할 수 있다.","피고인의 자백이 고문·폭행·협박·구속의 부당한 장기화 또는 기망 기타의 방법에 의하여 자의로 진술된 것이 아니라고 인정될 때에는 이를 유죄의 증거로 삼거나 이를 이유로 처벌할 수 없다.","누구든지 체포 또는 구속을 당한 때에는 즉시 변호인의 조력을 받을 권리를 가지며, 형사피고인이 스스로 변호인을 구할 수 없을 때에는 법률이 정하는 바에 의하여 국가가 변호인을 붙인다."],"answer_index":1,"explanation":"제12조 제6항은 '체포 또는 구속을 당한 때에는 적부의 심사를 법원에 청구할 권리'를 규정하므로, 체포 단계에서도 그 권리를 행사할 수 있다. 따라서 ②이 가장 적절하지 않다.","choice_notes":["제12조 제5항의 문언과 일치한다.","제12조 제6항은 '체포 또는 구속을 당한 때'라고 규정하여 체포 단계의 적부심사 청구권도 인정한다.","제12조 제7항의 문언과 일치한다.","제12조 제4항의 문언과 일치한다."],"source":"대한민국헌법 제12조 제4~7항","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제12조 제4~7항","difficulty":"중","choice_truth":[true,false,true,true]},{"id":"CQ06","question":"헌법 제13조에 관한 다음 설명 중 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠ X, ㉡ O, ㉢ X, ㉣ O","㉠ O, ㉡ O, ㉢ X, ㉣ X","㉠ O, ㉡ O, ㉢ O, ㉣ X","㉠ O, ㉡ X, ㉢ O, ㉣ O"],"answer_index":2,"explanation":"제13조 제1항은 죄형법정주의와 일사부재리를, 제2항은 소급입법에 의한 참정권 제한·재산권 박탈의 금지를, 제3항은 연좌제의 금지를 규정한다. ㉠·㉡·㉢은 옳고, ㉣은 동거 가족이라는 예외를 인정하지 않는 제13조 제3항에 반한다.","choice_notes":["㉠과 ㉢은 모두 조문에 명시된 원칙이다.","㉢은 제13조 제2항의 문언과 일치하므로 X가 아니다.","㉠은 제13조 제1항 전단, ㉡은 같은 항 후단, ㉢은 제13조 제2항과 일치한다. ㉣만 조문에 없는 예외를 두고 있다.","㉡은 제13조 제1항 후단이 명시한 일사부재리 원칙이므로 X가 아니다."],"source":"대한민국헌법 제13조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제13조 제1~3항","difficulty":"중","box":"㉠ 모든 국민은 행위 시의 법률에 의하여 범죄를 구성하지 아니하는 행위로 소추되지 아니한다.\n㉡ 모든 국민은 동일한 범죄에 대하여 거듭 처벌받지 아니한다.\n㉢ 모든 국민은 소급입법에 의하여 참정권의 제한을 받거나 재산권을 박탈당하지 아니한다.\n㉣ 모든 국민은 자기의 행위가 아닌 친족의 행위로 인하여 불이익한 처우를 받지 아니하나, 그 친족이 동거하는 가족인 때에는 이를 감수하여야 한다.","choice_truth":[false,false,true,false]},{"id":"CQ07","question":"언론·출판의 자유와 집회·결사의 자유에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["헌법재판소는 2021헌바168 결정(2026. 2. 26.)에서 집회 및 시위에 관한 법률 제6조 제1항 본문의 옥외집회 신고조항 자체에 대하여 재판관 전원의 일치된 의견으로 위헌 결정을 선고하였다.","헌법재판소는 2021헌바168 결정(2026. 2. 26.)에서 미신고 옥외집회를 처벌하는 조항에 대하여 즉시 그 효력이 상실되는 위헌 결정을 선고하고, 그 조항을 더 이상 적용할 수 없도록 하였다.","언론·출판이 타인의 명예나 권리를 침해한 때에는 별도의 법률이 마련되지 아니한 이상 피해자가 헌법 제21조에 근거하여 직접 손해의 배상을 청구할 수는 없다.","헌법 제21조 제2항은 언론·출판에 대한 허가나 검열과 집회·결사에 대한 허가를 금지하고 있을 뿐이고, 집회·결사에 대하여 일정한 절차를 요구하는 신고제 자체를 금지하고 있지는 않다."],"answer_index":3,"explanation":"제21조 제2항이 금지하는 것은 언론·출판에 대한 허가·검열과 집회·결사에 대한 허가이며, 신고는 열거되어 있지 않다. 2021헌바168 결정은 미신고 옥외집회 처벌조항에 대하여 2027. 8. 31.을 시한으로 개정될 때까지 계속 적용하는 헌법불합치 결정을 하였고, 신고조항 자체는 합헌으로 판단하였다.","choice_notes":["신고조항 자체는 합헌(7:2)으로 판단되었고 전원일치 위헌 결정이 아니다.","위헌이 아니라 헌법불합치 결정이었고, 2027. 8. 31.까지 계속 적용하도록 하였다.","제21조 제4항 후단은 언론·출판이 타인의 명예나 권리를 침해한 때 피해자의 피해 배상 청구를 헌법상으로 인정한다.","제21조 제2항은 허가와 검열만 금지하고 있고, 신고제는 이에 해당하지 않는다."],"source":"대한민국헌법 제21조, 헌법재판소 2021헌바168 결정(2026. 2. 26.)","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제21조; ccourt.go.kr 결정 주문·의견수 대조(2026-11-22) 2021헌바168(주문·의견수)","difficulty":"상","choice_truth":[false,false,false,true]},{"id":"CQ08","question":"헌법 제23조의 재산권 보장에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["공공필요에 의한 재산권의 수용에 대하여는 법률이 보상규정을 두고 있으면 충분하고, 그 보상의 액수가 정당한지 여부는 헌법 제23조의 문제가 되지 아니한다.","모든 국민의 재산권은 보장되며 그 내용과 한계는 법률로 정하고, 재산권의 행사는 공공복리에 적합하도록 하여야 하므로 국가는 법률로 재산권의 행사에 일정한 제한을 둘 수 있다.","공공필요에 의한 재산권의 수용·사용 또는 제한 및 그에 대한 보상은 법률로써 하되 정당한 보상을 지급하여야 하며, 보상 없이 재산권을 수용하는 것은 허용되지 아니한다.","재산권의 내용과 한계를 법률로 정할 때에도 그 본질적인 내용을 침해할 수 없고, 공공필요에 의하여 재산권을 수용하는 경우에는 정당한 보상이 뒤따라야 한다."],"answer_index":0,"explanation":"제23조 제3항은 공공필요에 의한 수용·사용·제한 및 그에 대한 보상은 법률로써 하되 '정당한 보상'을 지급하여야 한다고 규정한다. 보상의 내용이 정당한지 여부는 헌법이 직접 요구하는 사항이므로 ①가 가장 적절하지 않다.","choice_notes":["제23조 제3항은 '정당한 보상'을 요구하므로, 보상규정의 존재만으로는 충분하지 않고 보상의 정당성이 헌법상 문제된다.","제23조 제1항의 문언과 일치한다.","제23조 제2항의 문언과 일치한다.","제23조 제3항의 문언과 일치한다."],"source":"대한민국헌법 제23조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제23조 제1~3항","difficulty":"중","choice_truth":[false,true,true,true]},{"id":"CQ09","question":"헌법 제27조의 재판청구권 등에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["모든 국민은 신속한 재판을 받을 권리를 가지고, 형사피고인은 상당한 이유가 없는 한 지체 없이 공개재판을 받을 권리를 가지며, 유죄의 판결이 확정될 때까지는 무죄로 추정된다.","형사피해자가 당해 사건의 재판절차에서 진술할 수 있는 권리는 헌법에 규정되어 있지 아니하고 법률로써만 정할 수 있는 권리이므로, 헌법상 기본권으로 볼 수 없다.","모든 국민은 헌법과 법률이 정한 법관에 의하여 법률에 의한 재판을 받을 권리를 가지며, 법관이 아닌 자가 행하는 재판은 원칙적으로 헌법이 허용하지 아니한다.","군인 또는 군무원이 아닌 국민은 대한민국의 영역 안에서는 중대한 군사상 기밀·초병·초소·유독음식물공급·포로·군용물에 관한 죄 중 법률이 정한 경우와 비상계엄이 선포된 경우를 제외하고는 군사법원의 재판을 받지 아니한다."],"answer_index":1,"explanation":"제27조 제5항은 '형사피해자는 법률이 정하는 바에 의하여 당해 사건의 재판절차에서 진술할 수 있다'고 헌법에 직접 규정하고 있다. 따라서 ②가 가장 적절하지 않다.","choice_notes":["제27조 제3항의 문언과 일치한다.","제27조 제5항이 형사피해자의 재판절차 진술권을 헌법에 명시하고 있다.","제27조 제1항의 문언과 일치한다.","제27조 제2항의 문언과 일치한다."],"source":"대한민국헌법 제27조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제27조 제1~5항","difficulty":"중","choice_truth":[true,false,true,true]},{"id":"CQ10","question":"국가배상·형사보상·범죄피해자 구조에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["군인·군무원·경찰공무원 기타 법률이 정하는 자가 전투·훈련 등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상 외에 공무원의 직무상 불법행위로 인한 배상을 국가에 청구할 수 없다.","형사피의자 또는 형사피고인으로서 구금되었던 자가 법률이 정하는 불기소처분을 받거나 무죄판결을 받은 때에는 법률이 정하는 바에 의하여 국가에 정당한 보상을 청구할 수 있다.","타인의 범죄행위로 인하여 생명·신체에 대한 피해를 받은 국민은 국가로부터 구조를 받을 권리를 가지나, 그 구조의 내용과 절차는 법률이 아닌 대통령령으로 정한다.","공무원의 직무상 불법행위로 손해를 받은 국민은 법률이 정하는 바에 의하여 국가 또는 공공단체에 정당한 배상을 청구할 수 있고, 이 경우 공무원 자신의 책임은 면제되지 아니한다."],"answer_index":2,"explanation":"제30조는 타인의 범죄행위로 생명·신체에 대한 피해를 받은 국민이 '법률이 정하는 바에 의하여' 국가로부터 구조를 받을 수 있다고 규정한다. 구조의 내용과 절차를 대통령령으로 정한다는 ③가 가장 적절하지 않다.","choice_notes":["제29조 제2항의 문언과 일치한다.","제28조의 문언과 일치한다.","제30조는 '법률이 정하는 바에 의하여' 구조를 받는다고 규정하고 있어, 대통령령으로 정한다는 설명은 조문과 다르다.","제29조 제1항의 문언과 일치한다."],"source":"대한민국헌법 제28조~제30조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제28조~제30조","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"CQ11","question":"근로권과 근로3권에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠, ㉡, ㉣","㉠, ㉢, ㉣","㉡, ㉢, ㉣","㉠, ㉡, ㉢"],"answer_index":3,"explanation":"제32조 제1항은 근로의 권리와 최저임금제 시행 의무를, 제33조 제1항은 근로자의 자주적인 단결권·단체교섭권·단체행동권을, 제33조 제2항은 공무원인 근로자의 제한적 근로3권을 규정한다. 제33조 제3항은 주요방위산업체 근로자의 단체행동권을 '제한하거나 인정하지 아니할 수 있다'고 하므로 ㉣이 틀렸다.","choice_notes":["㉣은 조문의 '제한하거나 인정하지 아니할 수 있다'를 반대로 바꾸어 놓았다.","㉣이 조문과 반대의 내용을 담고 있다.","㉠은 제32조 제1항에 명시되어 있으므로 빠져서는 안 된다.","㉠·㉡·㉢ 모두 조문에 명시되어 있다."],"source":"대한민국헌법 제32조·제33조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제32조 제1항·제33조 제1~3항","difficulty":"중","box":"㉠ 모든 국민은 근로의 권리를 가지며, 국가는 법률이 정하는 바에 의하여 최저임금제를 시행하여야 한다.\n㉡ 근로자는 근로조건의 향상을 위하여 자주적인 단결권·단체교섭권 및 단체행동권을 가진다.\n㉢ 공무원인 근로자는 법률이 정하는 자에 한하여 단결권·단체교섭권 및 단체행동권을 가진다.\n㉣ 법률이 정하는 주요방위산업체에 종사하는 근로자의 단체행동권은 법률이 정하는 바에 의하여 제한하거나 인정하지 아니할 수 없다.","choice_truth":[false,false,false,true]},{"id":"CQ12","question":"국회의 회기·의결정족수·예산에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["국회의 임시회는 대통령 또는 국회재적의원 3분의 1 이상의 요구에 의하여 집회되고, 정기회는 대통령이 회기의 필요를 인정하여 요구하는 경우에만 집회되며 그 회기는 30일을 초과할 수 없다.","국회의 정기회는 법률이 정하는 바에 의하여 매년 1회 집회되며, 정기회의 회기는 100일을, 임시회의 회기는 30일을 초과할 수 없고, 대통령이 임시회의 집회를 요구할 때에는 기간과 이유를 명시하여야 한다.","국회는 헌법 또는 법률에 특별한 규정이 없는 한 재적의원 과반수의 출석과 출석의원 과반수의 찬성으로 의결하고, 가부동수인 때에는 부결된 것으로 보며, 이 원칙은 헌법이나 법률에 특별한 규정이 있는 경우에만 배제된다.","정부는 회계연도마다 예산안을 편성하여 회계연도 개시 90일 전까지 국회에 제출하고, 국회는 회계연도 개시 30일 전까지 이를 의결하여야 하며, 예산안이 의결되지 못한 때에는 일정한 경비를 전년도 예산에 준하여 집행할 수 있다."],"answer_index":0,"explanation":"제47조 제1항은 국회의 임시회가 대통령 또는 국회재적의원 '4분의 1 이상'의 요구에 의하여 집회된다고 규정한다. 3분의 1 이상이라는 ①가 가장 적절하지 않다.","choice_notes":["제47조 제1항은 '4분의 1 이상'의 요구를 요건으로 한다.","제47조 제2항의 문언과 일치한다.","제49조의 문언과 일치한다.","제54조 제2항의 문언과 일치한다."],"source":"대한민국헌법 제47조·제49조·제54조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제47조·제49조·제54조","difficulty":"중","choice_truth":[false,true,true,true]},{"id":"CQ13","question":"법률안의 공포와 재의요구에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)","choices":["대통령이 15일 이내에 공포나 재의의 요구를 하지 아니한 때에도 그 법률안은 법률로서 확정되지 아니하고, 국회가 다시 의결하여 정부에 이송하여야 비로소 법률로서 확정된다.","국회에서 의결된 법률안은 정부에 이송되어 15일 이내에 대통령이 공포하고, 법률은 특별한 규정이 없는 한 공포한 날로부터 20일을 경과함으로써 효력을 발생한다.","대통령은 법률안의 일부에 대하여 또는 법률안을 수정하여 재의를 요구할 수 있고, 국회가 폐회 중인 때에도 재의를 요구할 수 있으며, 그 기간은 30일로 연장된다.","대통령이 재의를 요구한 때에는 국회는 재적의원 3분의 2 이상의 출석과 출석의원 과반수의 찬성으로 전과 같은 의결을 하면 그 법률안은 법률로서 확정된다."],"answer_index":1,"explanation":"제53조 제1항은 국회에서 의결된 법률안이 정부에 이송되어 15일 이내에 대통령이 공포한다고 규정한다. 일부·수정 재의요구는 금지되고(제3항), 재의결은 재적의원 과반수 출석과 출석의원 3분의 2 이상 찬성으로 하며(제4항), 15일 내에 공포나 재의요구가 없으면 그 법률안은 법률로서 확정된다(제5항).","choice_notes":["제53조 제5항에 따라 15일 내에 공포나 재의요구가 없으면 그 법률안은 법률로서 확정되며, 다시 의결할 필요가 없다.","제53조 제1항의 문언과 일치한다.","제53조 제3항은 일부 또는 수정한 재의요구를 금지한다.","재의결 정족수는 '재적의원 과반수 출석과 출석의원 3분의 2 이상 찬성'이다. 출석 요건과 찬성 요건이 뒤바뀌었다."],"source":"대한민국헌법 제53조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제53조 제1~6항","difficulty":"중","choice_truth":[false,true,false,false]},{"id":"CQ14","question":"탄핵소추와 탄핵심판에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["탄핵소추는 국회재적의원 3분의 1 이상의 발의가 있어야 하며 그 의결은 국회재적의원 과반수의 찬성이 있어야 하고, 다만 대통령에 대한 탄핵소추는 재적의원 과반수의 발의와 재적의원 3분의 2 이상의 찬성이 있어야 한다.","탄핵소추의 의결을 받은 자는 탄핵심판이 있을 때까지 그 권한행사가 정지되고, 탄핵결정은 공직으로부터 파면함에 그치며, 탄핵심판의 절차는 법률로 정한다.","탄핵결정은 공직으로부터 파면함에 그치고, 이에 의하여 민사상이나 형사상의 책임도 함께 면제되므로 탄핵된 공무원에 대하여 별도로 민사소송이나 형사소송을 제기할 수 없다.","대통령·국무총리·국무위원·행정각부의 장·헌법재판소 재판관·법관·중앙선거관리위원회 위원·감사원장·감사위원 기타 법률이 정한 공무원이 그 직무집행에 있어서 헌법이나 법률을 위배한 때에는 국회는 탄핵의 소추를 의결할 수 있다."],"answer_index":2,"explanation":"제65조 제4항은 탄핵결정이 공직으로부터 파면함에 그치지만, 이에 의하여 민사상이나 형사상의 책임이 면제되지는 아니한다고 규정한다. ③가 가장 적절하지 않다.","choice_notes":["제65조 제2항의 문언과 일치한다.","제65조 제3항의 문언과 일치한다.","제65조 제4항 후단은 민사상·형사상 책임이 면제되지 않는다고 명시하고 있다.","제65조 제1항의 문언과 일치한다."],"source":"대한민국헌법 제65조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제65조 제1~4항","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"CQ15","question":"헌법재판소의 구성·결정정족수와 헌법개정 절차에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠, ㉢, ㉣","㉡, ㉢, ㉣","㉠, ㉡, ㉢","㉠, ㉡, ㉣"],"answer_index":3,"explanation":"제111조는 9인의 재판관 구성과 임명 경로를, 제112조는 임기 6년과 연임 가능을, 제130조 제2항은 국회 의결 후 30일 이내 국민투표를 규정한다. 위헌결정 등에 필요한 찬성 수는 제113조 제1항에 따라 '6인 이상'이므로 ㉢이 틀렸다.","choice_notes":["㉢의 '7인 이상'은 조문에 없는 수치이다.","㉢이 틀렸고, ㉠은 제111조 제2·3항에 명시되어 있다.","㉢이 틀렸다.","㉠·㉡·㉣ 모두 조문에 명시되어 있다."],"source":"대한민국헌법 제111조·제112조·제113조·제130조","verified_note":"law.go.kr 대한민국헌법(헌법 제10호, 시행 1988.2.25.) 원문 대조(2026-11-22) 제111조~제113조·제130조","difficulty":"중","box":"㉠ 헌법재판소는 법관의 자격을 가진 9인의 재판관으로 구성하며, 재판관 중 3인은 국회에서 선출하는 자를, 3인은 대법원장이 지명하는 자를 대통령이 임명한다.\n㉡ 헌법재판소 재판관의 임기는 6년으로 하며, 법률이 정하는 바에 의하여 연임할 수 있다.\n㉢ 헌법재판소에서 법률의 위헌결정, 탄핵의 결정, 정당해산의 결정 또는 헌법소원에 관한 인용결정을 할 때에는 재판관 7인 이상의 찬성이 있어야 한다.\n㉣ 헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다.","choice_truth":[false,false,false,true]}]},{"id":"criminal_law","name":"형사법","description":"형법총론 35%·형법각론 35%·형사소송법 30%. 2026.10.2. 시행 형사소송법 개정(수사 주체 일원화)과 2025~2026년 형법 개정을 반영한다.","flashcards":[{"id":"F01","front":"형법 제1조의 시간적 적용범위 3가지는?","back":"① 범죄의 성립과 처벌은 행위 시의 법률에 따른다. ② 범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법보다 가벼워진 경우에는 신법에 따른다. ③ 재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우에는 형의 집행을 면제한다.","source":"형법 제1조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 제1조 원문 대조(2026-11-21)","tags":["총론","시간적적용범위"]},{"id":"F02","front":"형사미성년·심신장애·청각 및 언어 장애의 법적 효과를 구분하면?","back":"제9조: 14세되지 아니한 자의 행위는 벌하지 아니한다. 제10조: 심신장애로 변별능력 또는 의사결정능력이 없는 자는 벌하지 아니하고(①), 그 능력이 미약한 자는 형을 감경할 수 있다(②, 임의적). 위험발생을 예견하고 자의로 심신장애를 야기한 경우에는 적용하지 않는다(③). 제11조: 듣거나 말하는 데 모두 장애가 있는 사람의 행위에 대해서는 형을 감경한다(필요적 감경).","source":"형법 제9조~제11조","verified_note":"law.go.kr 형법 제9·10·11조 원문 대조(2026-11-21). 제11조는 2020.12.8. 전문개정으로 '감경한다'로 되어 있어 임의적 감경이 아님.","tags":["총론","책임능력"]},{"id":"F03","front":"강요된 행위의 요건과 효과는? (형법 제12조)","back":"저항할 수 없는 폭력이나, 자기 또는 친족의 생명·신체에 대한 위해를 방어할 방법이 없는 협박에 의하여 강요된 행위는 벌하지 아니한다. 단순한 심리적 압박이나 피해자의 부탁은 이에 해당하지 않는다.","source":"형법 제12조","verified_note":"law.go.kr 형법 제12조 원문 대조(2026-11-21)","tags":["총론","책임조각"]},{"id":"F04","front":"고의·과실·사실의 착오·법률의 착오 조문을 구분하면?","back":"제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다(법률에 특별한 규정이 있으면 예외). 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다. 제15조(사실의 착오): 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다. 제16조(법률의 착오): 자기 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.","source":"형법 제13조~제16조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","고의","착오"]},{"id":"F05","front":"인과관계·부작위범·독립행위의 경합 조문의 결론은?","back":"제17조: 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. 제18조: 위험발생을 방지할 의무가 있거나 자기의 행위로 위험발생의 원인을 야기한 자가 방지하지 아니한 때에는 발생된 결과에 의하여 처벌한다(부작위범). 제19조: 동시 또는 이시의 독립행위가 경합하여 결과발생의 원인된 행위가 판명되지 아니한 때에는 각 행위를 미수범으로 처벌한다.","source":"형법 제17조~제19조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","인과관계","부작위범"]},{"id":"F06","front":"정당방위·긴급피난·자구행위·피해자 승낙의 핵심 차이와 과잉 시 효과는?","back":"제21조(정당방위): 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위. ② 정도를 초과하면 정황에 따라 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악·흥분·당황하였기 때문에 한 행위는 벌하지 아니한다. 제22조(긴급피난): 현재의 위난을 피하기 위한 행위, 위난을 피하지 못할 책임이 있는 자에게는 적용하지 않는다. 제23조(자구행위): 법률 절차로는 청구권을 보전할 수 없는 경우. 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙.","source":"형법 제21조~제24조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","위법성조각","정당방위"]},{"id":"F07","front":"미수·중지·불능·예비의 효과를 구분하면?","back":"제25조: 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때 미수범, 형은 기수범보다 감경할 수 있다(임의적). 제26조: 자의로 중지하거나 결과발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다(필요적 감면). 제27조: 실행의 수단 또는 대상의 착오로 결과 발생이 불가능하더라도 위험성이 있는 때에는 처벌하되 형을 감경 또는 면제할 수 있다. 제28조: 음모·예비가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.","source":"형법 제25조~제28조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","미수범"]},{"id":"F08","front":"공동정범·교사범·종범·공범과 신분·간접정범의 조문상 효과는?","back":"제30조: 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌. 제31조: 교사자는 죄를 실행한 자와 동일한 형. 피교사자가 승낙하고 착수하지 아니한 때, 승낙하지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌. 제32조: 방조한 자는 종범, '종범의 형은 정범의 형보다 감경한다'(필요적 감경). 제33조: 신분 없는 자도 공범 규정 적용, 신분 때문에 형의 경중이 달라지는 경우 신분 없는 자는 무거운 형으로 벌하지 아니한다. 제34조: 처벌되지 아니하는 자 또는 과실범을 교사·방조한 자는 교사·방조의 예에 의하여 처벌(간접정범).","source":"형법 제30조~제34조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","공범"]},{"id":"F09","front":"누범·경합범·상상적 경합의 요건과 처리 원칙은?","back":"제35조: 금고 이상의 형을 선고받아 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 지으면 누범, 그 형은 죄에 정한 형의 장기의 2배까지 가중. 제37조: 판결이 확정되지 아니한 수개의 죄 또는 금고 이상의 형에 처한 확정판결과 그 확정 전에 범한 죄가 경합범. 제38조 제1항 제2호: 같은 종류의 형이면 가장 무거운 죄의 장기·다액의 2분의 1까지 가중하되 합산한 형기·액수를 초과할 수 없고, 과료와 과료·몰수와 몰수는 병과 가능. 제40조: 한 개의 행위가 여러 개의 죄에 해당하면 가장 무거운 죄에 정한 형으로 처벌(상상적 경합).","source":"형법 제35조·제37조·제38조·제40조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","누범","경합범"]},{"id":"F10","front":"형의 종류와 징역·금고 기간, 몰수·추징의 요건은?","back":"제41조: 사형·징역·금고·자격상실·자격정지·벌금·구류·과료·몰수(9종). 제42조: 징역·금고는 무기 또는 유기, 유기는 1개월 이상 30년 이하, 가중하는 때에는 50년까지. 제48조: 범죄행위에 제공한 물건, 범죄로 인하여 생긴·취득한 물건, 그 대가로 취득한 물건을 몰수할 수 있고, 몰수할 수 없을 때에는 그 가액을 추징한다. 제49조: 몰수는 타형에 부가하여 과하되, 유죄 재판을 하지 아니할 때에도 몰수 요건이 있으면 몰수만 선고할 수 있다.","source":"형법 제41조·제42조·제48조·제49조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","형의종류","몰수"]},{"id":"F11","front":"선고유예와 집행유예의 요건·기간·효과를 비교하면?","back":"선고유예(제59조): 1년 이하의 징역이나 금고, 자격정지 또는 벌금의 형을 선고할 경우, 뉘우치는 정상이 뚜렷할 때. 단 자격정지 이상의 형을 받은 전과가 있는 사람은 제외. 제60조: 선고유예를 받은 날로부터 2년을 경과하면 면소된 것으로 간주. 집행유예(제62조): 3년 이하의 징역이나 금고 또는 500만원 이하의 벌금, 1년 이상 5년 이하의 기간 유예. 금고 이상의 형을 선고한 판결이 확정된 때부터 집행 종료·면제 후 3년까지의 기간에 범한 죄는 제외.","source":"형법 제59조·제60조·제62조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","선고유예","집행유예"]},{"id":"F12","front":"형의 시효 기간은? (2023.8.8. 개정 반영)","back":"제78조: ① 사형에 관한 규정(제1호)은 2023.8.8. 삭제. ② 무기의 징역·금고 20년 ③ 10년 이상의 징역·금고 15년 ④ 3년 이상의 징역·금고 또는 10년 이상의 자격정지 10년 ⑤ 3년 미만의 징역·금고 또는 5년 이상의 자격정지 7년 ⑥ 5년 미만의 자격정지, 벌금, 몰수 또는 추징 5년 ⑦ 구류 또는 과료 1년.","source":"형법 제78조","verified_note":"law.go.kr 형법 제78조 원문 대조(2026-11-21). '1. 삭제 <2023.8.8.>' 표기 확인.","tags":["총론","형의시효"]},{"id":"F13","front":"살인·존속살해의 법정형과 관련 헌재 결정은?","back":"제250조 제1항: 사람을 살해한 자는 사형, 무기 또는 5년 이상의 징역. 제2항: 자기 또는 배우자의 직계존속을 살해한 자는 사형, 무기 또는 7년 이상의 징역. 헌법재판소 2022헌바95(2026.10.22., 8:1)는 제2항 중 '자기의 직계존속을 살해한 자' 부분을 합헌으로 결정하였다.","source":"형법 제250조, 헌법재판소 2022헌바95 결정","verified_note":"law.go.kr 형법 제250조 원문 대조 + ccourt.go.kr 최근 주요결정(2026.10.22.) 대조","tags":["각론","살인","헌재"]},{"id":"F14","front":"상해·폭행·특수폭행·협박의 법정형과 반의사불벌죄 해당 여부는?","back":"제257조: 상해 7년 이하 징역, 10년 이하 자격정지 또는 1천만원 이하 벌금(존속상해 10년 이하 징역 또는 1천500만원, 미수 처벌). 제260조: 폭행 2년 이하 징역, 500만원 이하 벌금, 구류 또는 과료, 제3항에 따라 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다. 제261조: 특수폭행(단체·다중의 위력 또는 위험한 물건 휴대) 5년 이하 징역 또는 1천만원 이하 벌금. 제283조: 협박 3년 이하 징역, 500만원 이하 벌금, 구류 또는 과료, 제3항 반의사불벌.","source":"형법 제257조·제260조·제261조·제283조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","상해","폭행","반의사불벌"]},{"id":"F15","front":"강제추행·준강간·미성년자 간음·추행 조문의 구조는?","back":"제298조: 폭행 또는 협박으로 추행한 자는 10년 이하의 징역 또는 1천500만원 이하의 벌금(강제추행). 제299조: 사람의 심신상실 또는 항거불능 상태를 이용하여 간음·추행하면 제297조·제297조의2·제298조의 예에 의한다(준강간·준강제추행). 제305조 제1항: 13세 미만의 사람에 대하여 간음·추행하면 제297조·제297조의2·제298조·제301조·제301조의2의 예에 의한다. 제2항: 13세 이상 16세 미만의 사람에 대하여 간음·추행한 19세 이상의 자도 같은 예에 의한다.","source":"형법 제298조·제299조·제305조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","성범죄","제305조"]},{"id":"F16","front":"야간주거침입절도·특수절도·강도·준강도의 법정형과 구조는?","back":"제330조: 야간에 주거·관리하는 건조물·선박·항공기·점유하는 방실에 침입하여 타인의 재물을 절취하면 10년 이하의 징역. 제331조: ① 야간에 문·담 등 건조물 일부를 손괴하고 제330조 장소에 침입하여 절취하거나 ② 흉기를 휴대하거나 2명 이상이 합동하여 타인의 재물을 절취하면 1년 이상 10년 이하의 징역. 제333조: 폭행·협박으로 타인의 재물을 강취하거나 재산상 이익을 취득하면 3년 이상의 유기징역. 제335조: 절도가 재물의 탈환에 항거, 체포 면탈, 범죄 흔적 인멸의 목적으로 폭행·협박하면 제333조·제334조의 예에 따른다(준강도).","source":"형법 제330조·제331조·제333조·제335조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","절도","강도"]},{"id":"F17","front":"사기죄의 최신 법정형(2025.12.23. 개정)과 공갈·횡령·배임·장물의 법정형은?","back":"제347조(사기): 사람을 기망하여 재물의 교부를 받거나 재산상 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금(2025.12.23. 개정으로 상향). 제350조(공갈): 10년 이하 징역 또는 2천만원 이하 벌금. 제355조(횡령·배임): 5년 이하 징역 또는 1천500만원 이하 벌금. 제356조(업무상 횡령·배임): 10년 이하 징역 또는 3천만원 이하 벌금. 제362조(장물 취득·양도·운반·보관·알선): 7년 이하 징역 또는 1천500만원 이하 벌금.","source":"형법 제347조·제350조·제355조·제356조·제362조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21). 제347조에 '<개정 2025.12.23.>' 표기 확인","tags":["각론","사기","최신개정"]},{"id":"F18","front":"현주건조물 등 방화·일반물건 방화·실화의 법정형은?","back":"제164조: 불을 놓아 사람이 주거로 사용하거나 사람이 현존하는 건조물·기차·전차·자동차·선박·항공기·지하채굴시설을 불태우면 무기 또는 3년 이상의 징역. 상해에 이르게 하면 무기 또는 5년 이상, 사망에 이르게 하면 사형·무기 또는 7년 이상. 제167조: 제164조부터 제166조까지 외의 물건을 불태워 공공의 위험을 발생하게 하면 1년 이상 10년 이하(자기 소유 물건이면 3년 이하 징역 또는 700만원 이하 벌금). 제170조: 과실로 제164조·제165조의 물건 또는 타인 소유의 제166조 물건을 불태우면 1천500만원 이하의 벌금.","source":"형법 제164조·제167조·제170조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","방화","실화"]},{"id":"F19","front":"공문서·사문서 위조와 뇌물죄의 기본 법정형은?","back":"제225조(공문서등 위조·변조): 행사할 목적으로 공무원·공무소의 문서·도화를 위조·변조하면 10년 이하의 징역. 제231조(사문서등 위조·변조): 행사할 목적으로 권리·의무 또는 사실증명에 관한 타인의 문서·도화를 위조·변조하면 5년 이하 징역 또는 1천만원 이하 벌금. 제234조: 위조사문서를 행사하면 그 각 죄에 정한 형. 제129조(수뢰): 5년 이하 징역 또는 10년 이하 자격정지, 사전수뢰는 3년 이하 징역 또는 7년 이하 자격정지. 제130조(제3자뇌물제공): 5년 이하 징역 또는 10년 이하 자격정지. 제133조(뇌물공여 등): 5년 이하 징역 또는 2천만원 이하 벌금.","source":"형법 제225조·제231조·제234조·제129조·제130조·제133조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","문서죄","뇌물"]},{"id":"F20","front":"공무원 범죄 4개 조문과 2026.9.29. 신설된 법왜곡죄는?","back":"제122조(직무유기): 공무원이 정당한 이유 없이 직무수행을 거부하거나 유기하면 1년 이하 징역·금고 또는 3년 이하 자격정지. 제124조(불법체포·불법감금): 7년 이하의 징역과 10년 이하의 자격정지(2026.9.29. 개정). 제126조(피의사실공표): 3년 이하의 징역 또는 5년 이하의 자격정지(2026.9.29. 개정). 제136조(공무집행방해): 5년 이하 징역 또는 1천만원 이하 벌금. 제123조의2(법왜곡, 2026.9.29. 신설): 법관·검사·수사직무 수행자가 위법·부당하게 이익을 주거나 권익을 해할 목적으로 법령 적용·증거 수집 등을 하면 10년 이하의 징역과 10년 이하의 자격정지.","source":"형법 제122조·제123조의2·제124조·제126조·제136조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21). 제123조의2는 본조신설 2026.9.29., 제124조·제126조는 개정 2026.9.29. 표기 확인","tags":["각론","공무원범죄","최신개정"]},{"id":"F21","front":"2026.10.2. 시행 형사소송법상 수사 주체와 검사의 역할은?","back":"제195조: 검사와 사법경찰관은 수사·공소제기·공소유지에 관하여 협력하고, 검사는 공소제기 및 공소유지를, 사법경찰관은 수사를 책임진다. 검사는 인권 옹호를 위하여 영장의 청구, 보완수사요구, 재수사요구 등 법률이 정하는 직무를 수행한다. 제197조: 경위 이상의 경찰공무원은 사법경찰관, 경사·경장·순경은 사법경찰리. 제198조 제1항: 피의자에 대한 수사는 불구속 상태에서 함을 원칙으로 한다. 제199조: 강제처분은 법률에 특별한 규정이 있는 경우에 한하며 필요한 최소한도에서만.","source":"형사소송법 제195조·제197조·제198조·제199조","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-21)","tags":["수사","2026개정","제195조"]},{"id":"F22","front":"체포영장·긴급체포·현행범 체포의 요건과 시간 제한은?","back":"제200조의2: 사법경찰관이 검사에게 신청하여 검사의 청구로 판사의 체포영장을 발부받아 체포. 체포한 때부터 48시간 이내에 구속영장을 청구하지 아니하면 즉시 석방. 제200조의3(긴급체포): 사형·무기 또는 장기 3년 이상의 징역·금고에 해당하는 죄를 범하였다고 의심할 상당한 이유 + 증거인멸 염려 또는 도피 염려 + 긴급하여 영장을 받을 수 없을 때. 체포 후 즉시 검사의 승인을 받아야 하고 긴급체포서를 작성. 제211조: 현행범인·준현행범인(4호). 제212조: 현행범인은 누구든지 영장 없이 체포할 수 있다. 제214조: 다액 50만원 이하 벌금·구류·과료에 해당하는 죄의 현행범인은 주거가 분명하지 아니한 때에만 체포 규정 적용.","source":"형사소송법 제200조의2·제200조의3·제211조·제212조·제214조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","tags":["수사","체포","긴급체포"]},{"id":"F23","front":"구속영장·구속 전 피의자심문·구속기간의 숫자는? (2026.10.2. 현행)","back":"제201조: 사법경찰관이 검사에게 신청하여 검사의 청구로 판사의 구속영장을 받아 구속. 다액 50만원 이하 벌금·구류·과료 사건은 피의자가 일정한 주거가 없는 경우에 한정. 제201조의2: 체포된 피의자에 대한 구속영장 청구 시 판사는 지체 없이 심문하되 특별한 사정이 없으면 청구된 날의 다음날까지 심문, 심문 기간은 구속기간에 산입하지 않는다. 제202조: 사법경찰관이 구속한 때에는 10일 이내에 검사에게 인치하지 아니하면 석방. 제203조: 검사가 인치받은 때에는 10일 이내에 공소를 제기하지 아니하면 석방. 제205조: 판사는 검사의 신청에 의하여 10일을 초과하지 아니하는 범위에서 제203조의 구속기간 연장을 1차에 한정하여 허가할 수 있다.","source":"형사소송법 제201조·제201조의2·제202조·제203조·제205조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21). 2026.8.4. 개정으로 검사 구속기간이 '10일'로 변경된 현행 조문임을 확인.","tags":["수사","구속","2026개정"]},{"id":"F24","front":"압수·수색·검증의 영장 청구 구조와 영장 없는 처분의 시간 제한은?","back":"제215조 제2항: 사법경찰관이 범죄수사에 필요한 때에는 피의자가 죄를 범하였다고 의심할 만한 정황이 있고 사건과 관계가 있다고 인정되는 것에 한정하여 검사에게 신청하여 검사의 청구로 판사가 발부한 영장에 의하여 압수·수색·검증. 제216조 제1항: 체포·구속 시 영장 없이 ① 타인의 주거나 간수하는 가옥 등에서의 피의자 수색(제200조의2·제201조의 경우 미리 수색영장을 발부받기 어려운 긴급한 사정이 있을 때), ② 체포현장에서의 압수·수색·검증. 제216조 제3항: 범행 중 또는 직후 범죄 장소에서 긴급하여 영장을 받을 수 없으면 영장 없이 압수·수색·검증하되 사후에 지체 없이 영장을 받아야 한다. 제217조: 긴급체포된 자의 물건은 체포한 때부터 24시간 이내에 한하여 영장 없이 압수·수색·검증, 계속 압수하려면 48시간 이내에 영장 청구. 제218조: 유류물·임의제출물은 영장 없이 압수.","source":"형사소송법 제215조·제216조·제217조·제218조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","tags":["수사","압수수색","영장"]},{"id":"F25","front":"위법수집증거 배제·자백의 증거능력·전문법칙·조서의 증거능력 요약은?","back":"제308조의2: 적법한 절차에 따르지 아니하고 수집한 증거는 증거로 할 수 없다. 제309조: 자백이 고문·폭행·협박·신체구속의 부당한 장기화 또는 기망 기타 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있으면 유죄의 증거로 하지 못한다. 제310조: 자백이 피고인에게 불이익한 유일의 증거인 때에는 유죄의 증거로 하지 못한다(보강법칙). 제310조의2: 제311조부터 제316조까지 규정한 것 외에는 공판준비·공판기일의 진술에 대신하는 서류, 공판 외 타인의 진술을 내용으로 하는 진술은 증거로 할 수 없다(전문법칙). 제312조 제3항: 사법경찰관이 작성한 피의자신문조서는 적법한 절차와 방식으로 작성되고 공판준비·공판기일에서 피고인 또는 변호인이 내용을 인정할 때에 한하여 증거로 할 수 있다.","source":"형사소송법 제308조의2·제309조·제310조·제310조의2·제312조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","tags":["증거","자백","전문법칙"]},{"id":"F26","front":"고소·고발 사건의 3개월 처리기한과 불송치 시 절차는? (2026.10.2. 시행)","back":"제238조: 사법경찰관이 고소·고발에 의하여 범죄를 수사할 때에는 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정. 제245조의5: 혐의가 인정되면 지체 없이 검사에게 송치·송부하고, 그 밖의 경우에는 이유를 명시한 서면과 함께 서류·증거물을 송부(검사는 송부받은 날부터 90일 이내 반환). 수사과정에서 생성한 문서·기록·자료 목록을 작성하여 함께 송부. 제245조의6: 불송치 시 송부한 날부터 7일 이내에 서면 통지하고 결정서·이의신청 안내·서식을 함께 보낸다. 제245조의7 제3항: 이의신청은 통지를 받은 날부터 3개월 이내(정당한 사유 시 6개월 범위 연장). 제257조: 검사는 송치·송부된 날부터 3개월 이내에 공소제기 여부를 결정.","source":"형사소송법 제238조·제245조의5~제245조의7·제257조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21). 연합뉴스 2026.8.4. 보도(경찰 3개월·검사 3개월)와 교차 확인.","tags":["수사","고소고발","2026개정"]}],"questions":[{"id":"FQ01","question":"형법의 시간적 적용범위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["범죄 후 법률이 변경되어 형이 구법보다 무거워진 경우에도 신법에 따라 처벌하는 것이 원칙이고, 신법이 정한 형이 구법보다 가벼울 때에만 구법을 적용한다.","범죄의 성립과 처벌은 행위 시의 법률에 따르며, 행위 후 법률이 변경되어 형이 구법보다 무거워진 때에도 행위 시의 법률이 적용되고, 형이 가벼워진 때에만 신법을 적용한다.","범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법보다 가벼워진 경우에는 신법에 따라 처벌하고, 구법에 따라 처벌할 수 없다.","재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우에는 형의 집행을 면제하므로, 이미 확정된 유죄판결의 형도 집행할 수 없다."],"answer_index":0,"explanation":"형법 제1조 제1항은 행위 시의 법률에 따르도록 하고, 제2항은 범죄 후 법률 변경으로 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법보다 가벼워진 경우에 신법에 따르도록 한다. 형이 무거워진 경우에는 행위 시의 법률(구법)에 따르므로 ①가 가장 적절하지 않다.","choice_notes":["형이 구법보다 무거워진 경우에는 신법을 적용하지 않고 행위 시의 법률에 따른다.","제1조 제1항의 문언과 일치한다.","제1조 제2항의 문언과 일치한다.","제1조 제3항의 문언과 일치한다."],"source":"형법 제1조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제1조","difficulty":"하","choice_truth":[false,true,true,true]},{"id":"FQ02","question":"책임능력에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니하고, 그 능력이 미약한 자의 행위는 형을 감경할 수 있다.","심신장애로 인하여 사물을 변별하거나 의사를 결정할 능력이 미약한 자의 행위는 형을 감경하거나 면제할 수 있고, 법원은 정상에 따라 처벌하지 아니할 수도 있다.","위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 형법 제10조 제1항·제2항의 감면 규정을 적용하지 아니하므로, 온전한 책임능력자로서 처벌된다.","14세되지 아니한 자의 행위는 벌하지 아니하며, 형사미성년자의 행위는 구성요건에 해당하고 위법하더라도 책임이 조각되어 형사처벌을 받지 아니하고 보호처분의 대상이 될 뿐이다."],"answer_index":1,"explanation":"제9조는 14세 미만자의 행위를 벌하지 않고, 제10조 제1항은 변별능력 또는 의사결정능력이 없는 자의 행위를 벌하지 않으며, 제2항은 그 능력이 미약한 자의 형을 '감경할 수 있다'고 규정한다. 면제까지 허용하는 ②이 가장 적절하지 않다. 제10조 제3항에 따라 위험 발생을 예견하고 자의로 심신장애를 야기한 자에게는 감면 규정이 적용되지 않는다.","choice_notes":["제10조 제1항·제2항의 문언과 일치한다.","제10조 제2항은 '형을 감경할 수 있다'고만 규정하므로 면제는 허용되지 않는다.","제10조 제3항에 따라 자의로 야기한 심신장애에는 감면 규정이 적용되지 않는다.","제9조의 문언과 일치한다."],"source":"형법 제9조~제11조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제9조·제10조·제11조","difficulty":"중","choice_truth":[true,false,true,true]},{"id":"FQ03","question":"정당방위와 과잉방위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있고, 야간 등 불안한 상태에서 공포를 느끼거나 경악·흥분·당황하여 한 때에는 벌하지 아니한다.","정당방위는 현재의 부당한 침해에 대한 방위행위로서 상당한 이유가 있어야 하므로, 침해가 종료된 후에 보복을 위하여 한 행위는 정당방위가 될 수 없고 별도의 범죄를 구성한다.","방위행위가 정도를 초과한 경우에는 정황에 관계없이 형의 감경 또는 면제만 할 수 있고, 야간 등 불안한 상태에서 공포를 느낀 때에도 벌하지 아니하는 처분을 할 수는 없다.","현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니하며, 자기 법익뿐 아니라 타인의 법익을 위한 방위도 포함된다."],"answer_index":2,"explanation":"제21조 제2항은 과잉방위에 대하여 정황에 따라 형을 감경하거나 면제할 수 있게 하고, 제3항은 야간 등 불안한 상태에서 공포·경악·흥분·당황으로 과잉방위를 한 때에는 벌하지 아니한다고 규정한다. 따라서 ③가 가장 적절하지 않다.","choice_notes":["제21조 제2항의 문언과 일치한다.","제21조 제3항의 문언과 일치한다.","제21조 제3항은 야간 등 불안한 상태에서의 과잉방위를 벌하지 아니하는 사유로 규정하고 있어, 감면만 가능하다는 설명은 틀렸다.","제21조 제1항의 문언과 일치한다."],"source":"형법 제21조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제21조","difficulty":"중","choice_truth":[true,true,false,true]},{"id":"FQ04","question":"미수범·중지범·불능범·예비에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠, ㉡, ㉣","㉠, ㉢, ㉣","㉡, ㉢, ㉣","㉠, ㉡, ㉢"],"answer_index":3,"explanation":"제25조는 미수범과 임의적 감경을, 제26조는 중지범의 필요적 감면을, 제27조는 불능범의 처벌과 임의적 감면을 규정한다. 제28조는 음모·예비가 실행의 착수에 이르지 아니한 때에 '법률에 특별한 규정이 없는 한' 벌하지 아니한다고 하므로, 특별규정이 있는 때에도 벌하지 않는다는 ㉣이 틀렸다.","choice_notes":["㉣은 제28조의 '법률에 특별한 규정이 없는 한'을 반대로 바꾸어 놓았다.","㉣이 조문과 반대의 내용을 담고 있다.","㉠은 제25조 제1항·제2항에 명시되어 있으므로 빠져서는 안 된다.","㉠·㉡·㉢ 모두 조문에 명시되어 있다."],"source":"형법 제25조~제28조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제25조~제28조","difficulty":"중","box":"㉠ 범죄의 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때에는 미수범으로 처벌하고, 그 형은 기수범보다 감경할 수 있다.\n㉡ 범인이 실행에 착수한 행위를 자의로 중지하거나 그 행위로 인한 결과의 발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다.\n㉢ 실행의 수단 또는 대상의 착오로 인하여 결과의 발생이 불가능하더라도 위험성이 있는 때에는 처벌하되, 형을 감경 또는 면제할 수 있다.\n㉣ 범죄의 음모 또는 예비행위가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 있는 때에도 벌하지 아니한다.","choice_truth":[false,false,false,true]},{"id":"FQ05","question":"공범에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함)","choices":["㉠, ㉡, ㉢","㉠, ㉡, ㉣","㉠, ㉢, ㉣","㉡, ㉢, ㉣"],"answer_index":0,"explanation":"제30조는 공동정범을, 제31조 제1항은 교사범을 실행한 자와 동일한 형으로 처벌하도록 하며, 제32조 제2항은 종범의 형을 정범보다 감경하도록 한다. 제33조는 신분 없는 사람에게도 제30조부터 제32조까지의 규정을 적용하므로 ㉣이 틀렸다.","choice_notes":["㉠·㉡·㉢ 모두 조문에 명시되어 있다.","㉣은 제33조 본문과 정반대이다. 신분 없는 사람에게도 공범 규정이 적용된다.","㉣이 조문과 반대의 내용을 담고 있다.","㉠은 제30조에 명시되어 있으므로 빠져서는 안 된다."],"source":"형법 제30조~제33조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제30조~제33조","difficulty":"중","box":"㉠ 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.\n㉡ 타인을 교사하여 죄를 범하게 한 자는 죄를 실행한 자와 동일한 형으로 처벌한다.\n㉢ 종범의 형은 정범의 형보다 감경한다.\n㉣ 신분이 있어야 성립되는 범죄에 신분 없는 사람이 가담한 경우에는 그 신분 없는 사람에게는 공범에 관한 규정을 적용하지 아니한다.","choice_truth":[true,false,false,false]},{"id":"FQ06","question":"누범과 경합범에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["한 개의 행위가 여러 개의 죄에 해당하는 경우에는 상상적 경합으로서 가장 무거운 죄에 정한 형으로 처벌하고, 이를 경합범으로 보아 각 죄의 형을 합산하거나 가중하지는 아니한다.","경합범을 동시에 판결할 때 같은 종류의 형이면 가장 무거운 죄의 장기 또는 다액에 그 2분의 1까지 가중하되, 각 죄의 장기 또는 다액을 합산한 형기 또는 액수를 초과하여 가중할 수 있다.","금고 이상의 형을 선고받아 그 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 지은 사람은 누범으로 처벌하고, 누범의 형은 그 죄에 정한 형의 장기의 2배까지 가중한다.","판결이 확정되지 아니한 수개의 죄 또는 금고 이상의 형에 처한 판결이 확정된 죄와 그 판결확정 전에 범한 죄를 경합범으로 하며, 경합범은 동시에 판결하는 것이 원칙이다."],"answer_index":1,"explanation":"제38조 제1항 제2호는 가장 무거운 죄의 장기 또는 다액의 2분의 1까지 가중하되, 각 죄에 정한 형의 장기 또는 다액을 합산한 형기 또는 액수를 초과할 수 없다고 규정한다. ②가 가장 적절하지 않다.","choice_notes":["제40조(상상적 경합)의 문언과 일치한다.","제38조 제1항 제2호는 합산한 형기·액수를 '초과할 수 없다'고 규정하고 있어, 초과하여 가중할 수 있다는 설명은 틀렸다.","제35조 제1항·제2항의 문언과 일치한다.","제37조의 문언과 일치한다."],"source":"형법 제35조·제37조·제38조·제40조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 원문 대조(2026-11-22) 제35조·제37조·제38조·제40조","difficulty":"상","choice_truth":[true,false,true,true]},{"id":"FQ07","question":"선고유예와 집행유예에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","choices":["형의 선고유예를 받은 날로부터 2년을 경과한 때에는 면소된 것으로 간주하고, 유예기간 중 자격정지 이상의 형에 처한 판결이 확정되면 유예한 형을 선고한다.","3년 이하의 징역이나 금고 또는 500만원 이하의 벌금의 형을 선고할 경우에 그 정상에 참작할 만한 사유가 있는 때에는 1년 이상 5년 이하의 기간 형의 집행을 유예할 수 있다.","집행유예는 금고 이상의 형을 선고한 판결이 확정된 때부터 그 집행을 종료하거나 면제된 후 5년까지의 기간에 범한 죄에 대하여도 선고할 수 있고, 그 기간을 넘긴 경우에도 법원의 재량으로 허가할 수 있다.","1년 이하의 징역이나 금고, 자격정지 또는 벌금의 형을 선고할 경우에 뉘우치는 정상이 뚜렷할 때에는 그 형의 선고를 유예할 수 있고, 자격정지 이상의 형을 받은 전과가 있는 사람에 대해서는 이를 허용하지 아니한다."],"answer_index":2,"explanation":"제59조 제1항은 선고유예의 요건을, 제60조는 선고유예 후 2년 경과 시 면소 간주를, 제62조 제1항은 집행유예의 요건과 기간을 규정한다. 집행유예의 결격기간은 '3년'까지이므로 5년이라는 ③가 가장 적절하지 않다.","choice_notes":["제60조의 문언과 일치한다.","제62조 제1항의 문언과 일치한다.","제62조 제1항 단서의 기간은 집행 종료·면제 후 '3년'까지이다.","제59조 제1항의 문언과 일치한다."],"sour
