<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="경찰공채 핵심암기">
<meta name="theme-color" content="#1d3a8f">
<meta name="description" content="경찰공무원 순경 공채 헌법·형사법·경찰학 핵심 암기카드와 사지선다 퀴즈. 2026.10.2. 시행 형사사법 개편 반영.">
<title>경찰공채 핵심암기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3a8f'/%3E%3Cpath d='M32 12l14 5v14c0 9-6 16-14 19-8-3-14-10-14-19V17z' fill='%23fff'/%3E%3Cpath d='M25 31l5 5 10-10' stroke='%231d3a8f' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="./assets/char-base.png">
<style>
  :root{
    --bg:#eef1f7;
    --bg2:#f7f9fd;
    --card:#ffffff;
    --ink:#0f172a;
    --ink2:#46536b;
    --muted:#77839a;
    --line:#e1e6f0;
    --accent:#1d3a8f;
    --accent2:#2f5bd0;
    --tint:#e9eefc;
    --good:#0f7a4e;
    --goodbg:#e6f6ed;
    --bad:#b3261e;
    --badbg:#fdecea;
    --warn:#9a5a06;
    --warnbg:#fff4e1;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -16px rgba(15,23,42,.45);
    --r:18px;
    --tabh:66px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c1017;
      --bg2:#111722;
      --card:#151c27;
      --ink:#e9eef7;
      --ink2:#b8c2d4;
      --muted:#8b97ab;
      --line:#25303f;
      --accent:#9db6ff;
      --accent2:#5f86f7;
      --tint:#1a2440;
      --good:#5fdca2;
      --goodbg:#122a20;
      --bad:#ff948c;
      --badbg:#2c1614;
      --warn:#f0b45f;
      --warnbg:#2a2013;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
    -webkit-font-smoothing:antialiased;
    overflow-wrap:break-word;
    word-break:keep-all;
  }
  button{font:inherit;color:inherit}
  button:focus-visible,[role="button"]:focus-visible{outline:2.5px solid var(--accent2);outline-offset:2px}
  .app{max-width:620px;margin:0 auto}

  /* ---------- header ---------- */
  .appbar{padding:calc(env(safe-area-inset-top) + 12px) 14px 8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand > div{min-width:0}
  .logo{
    width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(160deg,#2c56c9,#1b3178);color:#fff;font-size:19px;
    box-shadow:0 6px 14px -8px rgba(29,58,143,.9);
  }
  .brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .brand .brand-sub{margin:1px 0 0;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .icon-btn{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;font-size:16px;color:var(--ink2);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .icon-btn:active{transform:scale(.96)}
  .notice{
    display:flex;align-items:center;gap:6px;margin:9px 0 0;padding:7px 10px;
    background:var(--tint);border-radius:10px;font-size:11.5px;font-weight:600;color:var(--accent);
    line-height:1.35;letter-spacing:-.01em;
  }
  .notice .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);flex:0 0 6px}

  /* ---------- subject chips ---------- */
  .chipbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:8px 0 8px;
    border-bottom:1px solid transparent;
    transition:border-color .2s;
  }
  .chipbar.stuck{border-bottom-color:var(--line);box-shadow:0 8px 16px -16px rgba(15,23,42,.6)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:baseline;gap:5px;
    min-height:38px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:13.5px;font-weight:700;letter-spacing:-.01em;
    cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .chip .chip-count{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip[aria-selected="true"] .chip-count{color:rgba(255,255,255,.8)}
  html[data-theme="dark"] .chip[aria-selected="true"]{color:#0b1220}
  html[data-theme="dark"] .chip[aria-selected="true"] .chip-count{color:rgba(11,18,32,.62)}

  /* ---------- layout ---------- */
  main{padding:4px 14px 0}
  .view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:15px 15px;
  }
  .card + .card,.card + .row,.row + .card,.sec + .card,.card + .sec,.sec + .sec{margin-top:12px}
  .sec{margin-top:18px}
  h2.sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 8px;letter-spacing:-.01em}
  h3{font-size:14px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
  p{margin:0}
  .muted{color:var(--ink2);font-size:12.5px;line-height:1.55}
  .tiny{font-size:11.5px;color:var(--muted);line-height:1.5}
  .eyebrow{margin:0 0 3px;font-size:11.5px;font-weight:800;color:var(--accent2);letter-spacing:.02em}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- hero ---------- */
  .hero{padding:16px;background:linear-gradient(155deg,#223f96 0%,#16295f 100%);border:0;color:#fff;box-shadow:0 14px 30px -18px rgba(20,40,100,.95)}
  .hero .eyebrow{color:#b9caff}
  .hero-title{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .hero .hero-sub{margin:5px 0 0;font-size:12px;color:rgba(255,255,255,.78);line-height:1.5}
  .hero-stats{display:flex;gap:8px;margin-top:14px}
  .hero-stat{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 9px}
  .hero-stat b{display:block;font-size:17px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
  .hero-stat span{font-size:10.5px;color:rgba(255,255,255,.75);font-weight:600}
  html[data-theme="dark"] .hero{background:linear-gradient(155deg,#1b2e63 0%,#121d3c 100%)}

  /* ---------- progress ---------- */
  .prow + .prow{margin-top:13px}
  .prow-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
  .prow-title{font-size:13px;font-weight:800}
  .prow-val{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s ease}
  .bar.good > i{background:linear-gradient(90deg,#19a06a,#0f7a4e)}
  .prow-sub{margin-top:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:14px;
    font-size:14.5px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s;
  }
  .btn:active{transform:scale(.985);filter:brightness(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  html[data-theme="dark"] .btn-primary{background:#2f5bd0;color:#fff}
  .btn-good{background:var(--good);color:#fff}
  html[data-theme="dark"] .btn-good{background:#137a4e;color:#fff}
  .btn-warn{background:var(--warnbg);color:var(--warn);border:1.5px solid var(--warn);box-shadow:inset 0 0 0 1px rgba(154,90,6,.06)}
  .btn-ghost{background:var(--tint);color:var(--accent)}
  .btn-line{background:var(--card);border:1.5px solid var(--line);color:var(--ink2)}
  .btn-sm{min-height:40px;padding:9px 12px;font-size:12.5px;border-radius:11px;width:auto}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .row{display:flex;gap:9px}
  .row > .btn{flex:1}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .quick-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:3px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;
    min-height:74px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow);
  }
  .quick-btn .qi{font-size:16px;line-height:1}
  .quick-btn .qt{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
  .quick-btn .qc{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .quick-btn:active{transform:scale(.98)}

  /* ---------- subject rows ---------- */
  .subj-row{
    display:block;width:100%;text-align:left;background:none;border:0;padding:11px 0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .subj-row + .subj-row{border-top:1px solid var(--line)}
  .subj-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
  .subj-row-name{font-size:13.5px;font-weight:800}
  .subj-row-val{font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* ---------- flashcard ---------- */
  .deckbar{display:flex;gap:6px;overflow-x:auto;padding:1px 0 2px;scrollbar-width:none}
  .deckbar::-webkit-scrollbar{display:none}
  .fchip{
    flex:0 0 auto;min-height:34px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .fchip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent2);color:var(--accent)}
  .deck-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:11px 1px 7px}
  .deck-meta .dm-l{font-size:12px;font-weight:700;color:var(--ink2)}
  .deck-meta .dm-r{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

  .flash{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
  .flash-inner{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.8,.22,1);position:relative}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{
    grid-area:1 / 1;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:17px 16px;min-height:246px;
  }
  .face.back{transform:rotateY(180deg)}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .pill{
    display:inline-flex;align-items:center;gap:3px;
    padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:-.01em;
    background:var(--tint);color:var(--accent);line-height:1.4;white-space:nowrap;
  }
  .pill.rev{background:var(--warnbg);color:var(--warn)}
  .pill.known{background:var(--goodbg);color:var(--good)}
  .pill.unsure{background:var(--badbg);color:var(--bad)}
  .pill.diff{background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
  .face .q{
    margin:auto 0;font-size:19px;line-height:1.5;font-weight:800;letter-spacing:-.035em;
    text-align:center;padding:6px 2px;
  }
  .face .hint{margin-top:auto;padding-top:14px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
  .face .face-label{margin:0 0 7px;font-size:10.5px;font-weight:800;color:var(--accent2);letter-spacing:.04em}
  .face .answer{margin:0;font-size:14.5px;line-height:1.72;letter-spacing:-.015em;color:var(--ink)}
  .face .tagbox{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0 0;padding-top:11px;border-top:1px dashed var(--line)}
  .tagbox .tg-label{width:100%;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.03em;margin-bottom:1px}
  .tag{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .face .src{margin:11px 0 0;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .face .verify{margin:6px 0 0;font-size:10.5px;color:var(--muted);line-height:1.45}

  .mark-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .nav-row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .nav-row .btn{flex:0 0 auto;width:auto;min-height:44px;padding:8px 15px;font-size:13px}
  .nav-count{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .empty{text-align:center;padding:30px 16px}
  .empty .eico{font-size:30px;margin-bottom:8px}
  .empty h3{font-size:14.5px}
  .empty p{font-size:12.5px;color:var(--ink2);line-height:1.6}
  .empty .btn{margin-top:14px}

  /* ---------- quiz ---------- */
  .quizbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    border:0;background:none;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);
    cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:32px;
  }
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.14)}
  .qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .qmeta .qm-r{font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .qtext{margin:2px 0 13px;font-size:16px;line-height:1.55;font-weight:800;letter-spacing:-.03em}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    padding:12px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);
    font-size:13.5px;line-height:1.5;font-weight:600;letter-spacing:-.015em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,opacity .15s;
  }
  .choice .cnum{
    flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
    background:var(--tint);color:var(--accent);font-size:12px;font-weight:800;margin-top:1px;
  }
  .choice:active{background:var(--bg2)}
  .choice.correct{border-color:var(--good);background:var(--goodbg)}
  .choice.correct .cnum{background:var(--good);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--badbg)}
  .choice.wrong .cnum{background:var(--bad);color:#fff}
  .choice.dim{opacity:.55}
  .choice[disabled]{cursor:default}

  .explain{margin-top:13px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);scroll-margin-top:74px}
  .verdict{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin-bottom:10px;padding:9px 11px;border-radius:11px}
  .verdict.ok{background:var(--goodbg);color:var(--good)}
  .verdict.no{background:var(--badbg);color:var(--bad)}
  .explain h4{margin:13px 0 6px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em}
  .explain .body{font-size:13.5px;line-height:1.65;color:var(--ink)}
  .notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .notes li{display:flex;gap:7px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .ox{flex:0 0 18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:900;margin-top:1px}
  .ox.o{background:var(--goodbg);color:var(--good)}
  .ox.x{background:var(--badbg);color:var(--bad)}
  .explain .src{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .explain .verify{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.45}
  .after{margin-top:12px}

  .score{text-align:center;padding:8px 4px 4px}
  .score .pct{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
  .score .pct small{font-size:17px;font-weight:800;color:var(--muted)}
  .score .st{margin-top:2px;font-size:12.5px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
  .score .msg{margin-top:9px;font-size:13px;color:var(--ink2);line-height:1.55}

  /* ---------- wrong note ---------- */
  .wn-group + .wn-group{margin-top:14px}
  .wn-group h3{font-size:12px;color:var(--muted);margin:0 0 6px}
  .wn-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .wn-item:first-of-type{border-top:0}
  .wn-main{flex:1;min-width:0}
  .wn-q{font-size:13px;line-height:1.5;font-weight:700;letter-spacing:-.02em}
  .wn-meta{margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .wn-x{
    flex:0 0 32px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);
    color:var(--muted);font-size:13px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .wn-x:active{background:var(--badbg);color:var(--bad)}
  .wn-card{border:0;background:none;padding:0;text-align:left;width:100%;cursor:pointer;font:inherit}
  .wn-item.wn-stack{display:block;padding:11px 0}
  .wn-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .wn-hint{flex:1;font-size:10px;font-weight:700;color:var(--muted)}
  .wn-acts{display:flex;align-items:center;gap:7px}
  .wn-acts .btn-sm{min-height:36px;padding:7px 13px;font-size:12px}
  .wn-acts .wn-x{width:36px;height:36px;flex:0 0 36px}

  /* ---------- details ---------- */
  details.card{padding:0;overflow:hidden}
  details.card > summary{
    list-style:none;cursor:pointer;padding:14px 15px;font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary::after{content:"+";font-size:17px;color:var(--muted);font-weight:600;line-height:1}
  details.card[open] > summary::after{content:"−"}
  details.card > .dbody{padding:0 15px 15px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
  .kv{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
  .kv:first-child{border-top:0;padding-top:0}
  .kv .k{flex:0 0 74px;font-size:11.5px;font-weight:800;color:var(--muted)}
  .kv .v{flex:1;font-size:12px;line-height:1.55}
  .bullet-list{margin:0;padding-left:17px}
  .bullet-list li{margin:5px 0;font-size:12px;line-height:1.55}
  .lawlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .lawlist li{font-size:11.5px;line-height:1.5;color:var(--ink2);padding-left:15px;position:relative}
  .lawlist li::before{content:"";position:absolute;left:3px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent2);opacity:.6}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -8px 24px -20px rgba(15,23,42,.7);
  }
  .tabbar-inner{max-width:620px;margin:0 auto;display:flex}
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:none;min-height:var(--tabh);padding:4px 0 2px;
    font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:-.01em;
    cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent2)}
  .tab[aria-selected="true"]::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent2)}
  .tab .tbadge{
    position:absolute;top:8px;left:calc(50% + 8px);min-width:15px;height:15px;padding:0 4px;border-radius:99px;
    background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;line-height:1;
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
    transform:translate(-50%,14px);z-index:80;
    background:rgba(15,23,42,.94);color:#fff;font-size:12.5px;font-weight:700;
    padding:10px 15px;border-radius:99px;max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.7);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-color-scheme: dark){.toast{background:rgba(235,241,252,.96);color:#0c1017}}

  /* ---------- sheet & modal ---------- */
  .overlay{position:fixed;inset:0;z-index:70;background:rgba(9,14,26,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  @media (min-width:640px){.overlay{align-items:center}}
  .sheet{
    width:100%;max-width:620px;max-height:88vh;background:var(--bg2);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);animation:slideup .24s cubic-bezier(.2,.85,.25,1);
  }
  @media (min-width:640px){.sheet{border-radius:22px;max-height:82vh}}
  @keyframes slideup{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .sheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}
  .sheet-body{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
  .sheet-body .card{box-shadow:none;background:var(--card)}
  .sheet-body .sec{margin-top:16px}

  .modal{
    width:calc(100% - 40px);max-width:360px;background:var(--card);border-radius:18px;padding:20px 18px 16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55);animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 8px;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .modal p{margin:0;font-size:13px;line-height:1.6;color:var(--ink2)}
  .modal .row{margin-top:16px}
  .btn-danger{background:var(--bad);color:#fff}
  html[data-theme="dark"] .btn-danger{background:#c2382f;color:#fff}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }

  /* ================= 캐릭터 버디 · 명언 · 포인트/계급 ================= */
  /* 명언 롤링 */
  .quote{margin-top:2px;margin-bottom:12px}
  .quote-btn{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:10px 12px;border-radius:15px;border:1px dashed #c8d6fb;
    background:linear-gradient(135deg,#f1f5ff 0%,#fdf6fb 100%);
    color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;
    box-shadow:0 8px 20px -18px rgba(29,58,143,.8);
  }
  .quote-btn:active{filter:brightness(.985)}
  .quote-ic{flex:0 0 auto;font-size:12px;color:#8fa6e0;line-height:1}
  .quote-text{
    flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.45;letter-spacing:-.02em;
    min-height:2.9em;display:flex;align-items:center;
    transition:opacity .22s ease,transform .22s ease;
  }
  .quote-text.out{opacity:0;transform:translateY(-3px)}
  .quote-hint{
    flex:0 0 auto;font-size:10px;font-weight:800;color:#9aa8c7;background:#fff;
    border:1px solid #e2e9fa;padding:2px 6px;border-radius:99px;line-height:1.5;
  }
  html[data-theme="dark"] .quote-btn{background:linear-gradient(135deg,#18223c 0%,#221a30 100%);border-color:#33415f}
  html[data-theme="dark"] .quote-hint{background:#0f1522;border-color:#2b3550;color:#7f8ba6}

  /* 히어로 · 계급 */
  .hero{position:relative;overflow:hidden;padding:14px 15px 15px}
  .hero::after{
    content:"";position:absolute;right:-46px;top:-58px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 66%);pointer-events:none;
  }
  .hero::before{
    content:"";position:absolute;left:-34px;bottom:-64px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(164,196,255,.3),rgba(164,196,255,0) 70%);pointer-events:none;
  }
  .hero-top{position:relative;display:flex;align-items:flex-start;gap:8px}
  .hero-copy{flex:1 1 auto;min-width:0}
  .hero-fig{flex:0 0 74px;width:74px;position:relative;align-self:flex-end}
  .hero-fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 11px rgba(4,10,30,.45))}
  .rank-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:1px 0 0}
  .rank-name{font-size:23px;font-weight:900;letter-spacing:-.045em;line-height:1.15}
  .insignia{display:inline-flex;align-items:center;gap:2px}
  .insignia svg{width:13px;height:13px;display:block;flex:0 0 auto}
  .hero-greet{margin:6px 0 0;font-size:12px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.45}
  .pscore{display:flex;align-items:baseline;gap:3px;margin-top:9px;flex-wrap:wrap}
  .pscore b{font-size:20px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pscore span{font-size:11px;font-weight:800;color:rgba(255,255,255,.72)}
  .pscore .earn{
    margin-left:4px;align-self:center;font-size:10.5px;font-weight:800;color:#ffe1ab;
    background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px;
  }
  .rank-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:10px}
  .rank-bar > i{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#ffd98a,#f7b733);
    transition:width .55s cubic-bezier(.2,.8,.2,1);
  }
  .rank-next{margin-top:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.45}

  /* 하루 할당량 */
  .mission .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .mission .bonus{
    flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warnbg);
    padding:3px 8px;border-radius:99px;line-height:1.5;
  }
  .mission.done{border-color:#bfe8d3}
  .mission.done .bonus{color:var(--good);background:var(--goodbg)}
  .mission-foot{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .mission.done .mission-foot{color:var(--good)}
  html[data-theme="dark"] .mission.done{border-color:#1f4635}

  /* 캐릭터 버디 바 */
  .buddy{
    display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:15px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    margin-bottom:10px;position:relative;
  }
  .buddy-av{
    position:relative;flex:0 0 44px;width:44px;height:44px;border-radius:50%;overflow:hidden;
    background:linear-gradient(150deg,#e9f0ff,#f7ecff);
  }
  .buddy-av img{display:block;width:100%;height:100%;object-fit:cover}
  .buddy.good .buddy-av{box-shadow:0 0 0 2px rgba(25,160,106,.5)}
  .buddy.cheer .buddy-av{box-shadow:0 0 0 2px rgba(255,138,128,.5)}
  .buddy.pop .buddy-av{animation:buddyPop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes buddyPop{0%{transform:scale(.82) rotate(-7deg)}55%{transform:scale(1.12) rotate(4deg)}100%{transform:none}}
  .buddy-text{flex:1;min-width:0}
  .buddy-line{font-size:12.5px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
  .buddy-sub{margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}
  .float-pt{
    position:absolute;left:22px;top:0;font-size:11px;font-weight:900;color:var(--good);
    white-space:nowrap;pointer-events:none;z-index:3;
    animation:floatUp 1.35s ease-out forwards;
  }
  .float-pt.minus{color:var(--bad)}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,6px) scale(.9)}
    22%{opacity:1;transform:translate(-50%,-8px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-30px) scale(1)}
  }
  html[data-theme="dark"] .buddy-av{background:linear-gradient(150deg,#212c47,#2a2138)}

  /* 응답 영역 리액션 */
  .reaction{
    position:relative;display:flex;align-items:center;gap:9px;margin:0 0 11px;padding:8px 10px;
    border-radius:12px;background:var(--bg2);border:1px solid var(--line);
  }
  .reaction.good{background:var(--goodbg);border-color:rgba(15,122,78,.22)}
  .reaction.cheer{background:var(--warnbg);border-color:rgba(154,90,6,.22)}
  .rx-av{flex:0 0 32px;width:32px;height:32px;border-radius:50%;overflow:hidden;background:#eef3ff}
  .rx-av img{display:block;width:100%;height:100%;object-fit:cover}
  .rx-line{font-size:12px;font-weight:800;line-height:1.4}
  .rx-sub{margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}

  /* 결과 화면 캐릭터 */
  .score-fig{display:block;width:76px;height:auto;margin:2px auto 0}

  /* 승진 축하 */
  .overlay.center{align-items:center;padding:20px}
  .modal.promo{text-align:center;padding:18px 18px 15px;border-radius:20px;position:relative;overflow:hidden}
  .promo-fig{display:block;width:92px;height:auto;margin:0 auto 2px;filter:drop-shadow(0 8px 12px rgba(15,23,42,.22))}
  .modal.promo .eyebrow{color:#d99b00}
  .promo-insignia{display:flex;justify-content:center;gap:3px;margin:7px 0 3px}
  .promo-insignia svg{width:14px;height:14px}
  .modal.promo h2{font-size:18px}
  .modal.promo .promo-note{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .promo-spark{position:absolute;font-size:15px;opacity:.85;animation:sparkle 1.9s ease-in-out infinite alternate}
  .promo-spark.s1{left:16px;top:22px}
  .promo-spark.s2{right:16px;top:52px;animation-delay:.5s}
  @keyframes sparkle{from{transform:scale(.8);opacity:.35}to{transform:scale(1.15);opacity:.95}}

  @media (max-width:360px){
    .rank-name{font-size:20px}
    .pscore b{font-size:18px}
    .hero-fig{flex-basis:64px;width:64px}
    .hero-greet{font-size:11.5px}
    .quote-text{font-size:12px}
    .quote-hint{display:none}
    .buddy{gap:8px;padding:7px 9px}
    .buddy-av{flex-basis:40px;width:40px;height:40px}
    .buddy-line{font-size:12px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">🛡️</span>
        <div>
          <h1>경찰공채 핵심암기</h1>
          <p class="brand-sub" id="brandSub">헌법 · 형사법 · 경찰학</p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="설정과 데이터 정보">⚙</button>
    </div>
    <div class="notice">
      <span class="dot" aria-hidden="true"></span>
      <span>2026.10.2. 시행 형사사법 개편·최신 법령 반영</span>
    </div>
  </header>

  <div class="chipbar" id="chipbar">
    <div class="chips" id="subjectChips" role="tablist" aria-label="과목 선택"></div>
  </div>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-cards" hidden></section>
    <section class="view" id="view-quiz" hidden></section>
    <section class="view" id="view-wrong" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="학습 모드">
  <div class="tabbar-inner" role="tablist">
    <button type="button" class="tab" id="tab-home" data-tab="home" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.7 12 3.5l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>홈</span>
    </button>
    <button type="button" class="tab" id="tab-cards" data-tab="cards" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.6A1.6 1.6 0 0 1 5.6 4H11v16H5.6A1.6 1.6 0 0 1 4 18.4z"/><path d="M20 5.6A1.6 1.6 0 0 0 18.4 4H13v16h5.4A1.6 1.6 0 0 0 20 18.4z"/></svg>
      <span>암기카드</span>
    </button>
    <button type="button" class="tab" id="tab-quiz" data-tab="quiz" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4h15v16h-15z"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg>
      <span>사지선다</span>
    </button>
    <button type="button" class="tab" id="tab-wrong" data-tab="wrong" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6 21 20H3z"/><path d="M12 9.5v5"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/></svg>
      <span>오답노트</span>
      <span class="tbadge" id="wrongBadge" hidden></span>
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay" id="sheetOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">설정과 데이터 정보</h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="overlay" id="modalOverlay" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <h2 id="modalTitle">학습 기록 초기화</h2>
    <p id="modalBody"></p>
    <div class="row">
      <button type="button" class="btn btn-line" id="modalCancel">취소</button>
      <button type="button" class="btn btn-danger" id="modalOk">초기화</button>
    </div>
  </div>
</div>

<div class="overlay center" id="promoOverlay" hidden>
  <div class="modal promo" role="alertdialog" aria-modal="true" aria-labelledby="promoTitle">
    <span class="promo-spark s1" aria-hidden="true">✦</span>
    <span class="promo-spark s2" aria-hidden="true">✦</span>
    <img class="promo-fig" src="./assets/char-thumbsup.png" alt="" width="92" height="177" decoding="async">
    <p class="eyebrow">승진했어요!</p>
    <h2 id="promoTitle">순경 → 경장</h2>
    <div class="promo-insignia" id="promoInsignia" aria-hidden="true"></div>
    <p class="promo-note" id="promoNote"></p>
    <div class="row">
      <button type="button" class="btn btn-primary" id="promoOk">좋아, 계속 갈게!</button>
    </div>
  </div>
</div>

<script type="application/json" id="study-data">{"meta":{"title":"경찰공무원 순경 공채 3과목 학습 데이터 (헌법·형사법·경찰학)","generated_at":"2026-11-21","verified_against":"국가법령정보센터(law.go.kr) 현행 조문 원문, 헌법재판소 결정문·보도자료, 법무부·연합뉴스 보도","exam_basis":{"note":"2026년 제2차 순경 공채 공고(제2026-11호) 기준. 2027년 일정은 아직 공고 전이며 최근 3년 1차 필기는 3월 중순 토요일이었다.","subjects":"헌법 20문항 50점, 형사법 40문항 100점, 경찰학 40문항 100점 (총 100문항 250점, 100분, 4지선다, 10:00~11:40)","ratios":"헌법: 기본권 총론·각론 80% 내외, 헌법총론·기본질서 20% 내외 / 형사법: 형법총론 35%, 형법각론 35%, 형사소송법 30% / 경찰학: 경찰행정법 35%, 경찰학 기초이론 30%, 경찰행정학 15%, 분야별 경찰활동 15%, 한국경찰사·비교경찰 5%","pass_rule":"한국사·영어는 능력검정 대체. 각 과목 만점의 40% 이상 득점자 중 고득점자 순으로 선발예정 인원의 2배수 선발(총점 요건 없음)."},"critical_notice":"2026. 10. 2.부터 「검찰청법」이 폐지되고 「공소청법」·「중대범죄수사청 조직 및 운영에 관한 법률」이 시행되어, 형사소송법(법률 제21857호, 2026.8.4. / 법률 제22009호, 2026.9.29.)상 검사의 직접수사권이 폐지되고 수사 주체가 사법경찰관으로 일원화되었다. 2024~2025년 기출의 수사·영장·기소 파트는 현행법과 결론이 달라질 수 있으므로, 이 데이터는 현행법 기준으로 작성하고 변경된 쟁점에 '2026.10.2. 개정' 표시를 달았다.","law_versions":["대한민국헌법 [헌법 제10호, 1987.10.29. 전부개정, 시행 1988.2.25.]","형법 [법률 제22007호, 2026.9.29. 일부개정, 시행 2026.10.2.]","형사소송법 [법률 제22009호, 2026.9.29. 일부개정, 시행 2026.10.2.]","경찰관 직무집행법 [법률 제21304호, 2026.1.6. 일부개정, 시행 2026.7.7.]","국가경찰과 자치경찰의 조직 및 운영에 관한 법률(경찰법) [법률 제22015호, 2026.9.29. 일부개정, 시행 2026.10.2.]","경찰공무원법 [법률 제20646호, 2025.1.7. 일부개정, 시행 2025.1.7.]","도로교통법 [법률 제22067호, 2026.10.13. 일부개정]","스토킹범죄의 처벌 등에 관한 법률 [법률 제21998호, 2026.9.29. 일부개정, 시행 2026.10.2.]"]},"subjects":[{"id":"constitution","name":"헌법","description":"기본권 총론·각론 80%, 헌법총론·기본질서 20%. 조문 숫자(정족수·기간·인원)와 최신 헌재 결정을 함께 정리한다.","flashcards":[{"id":"C01","front":"기본권 제한의 일반원칙 3요소는? (헌법 제37조 제2항)","back":"① 국가안전보장·질서유지 또는 공공복리를 위하여 '필요한 경우에 한하여' ② '법률로써' 제한 ③ 제한하는 경우에도 자유와 권리의 '본질적인 내용'은 침해할 수 없다. + 제37조 제1항: 열거되지 아니한 권리도 경시되지 않는다.","source":"대한민국헌법 제37조","verified_note":"law.go.kr 헌법 본문(시행 1988.2.25.) 2026-11-21 조회, 제37조 제1·2항 원문 대조","tags":["기본권총론","제37조","비례원칙"]},{"id":"C02","front":"평등원칙 조항에서 시험에 자주 나오는 제11조 제2항·제3항은?","back":"② 사회적 특수계급의 제도는 인정되지 아니하며 어떠한 형태로도 창설할 수 없다. ③ 훈장 등의 영전은 이를 받은 자에게만 효력이 있고, 어떠한 특권도 이에 따르지 아니한다. (①은 법 앞의 평등 + 성별·종교·사회적 신분에 의한 차별 금지)","source":"대한민국헌법 제11조","verified_note":"law.go.kr 헌법 제11조 원문 대조(2026-11-21)","tags":["평등권","제11조"]},{"id":"C03","front":"영장주의의 예외 2가지와 체포·구속 시 고지·통지 규정은? (헌법 제12조)","back":"영장 제시 예외: ① 현행범인인 경우 ② 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때(사후 영장 청구 가능). 제5항: 체포·구속의 이유와 변호인의 조력을 받을 권리를 고지받지 아니하고는 체포·구속되지 않으며, 가족 등에게 이유와 일시·장소를 지체 없이 통지. 제6항: 적부심사를 법원에 청구할 권리.","source":"대한민국헌법 제12조 제3항·제5항·제6항","verified_note":"law.go.kr 헌법 제12조 원문 대조(2026-11-21). 조문은 여전히 '검사의 신청에 의하여 법관이 발부한 영장'으로 규정되어 있음(2026.10.2. 형사사법 개편 후에도 헌법 조문은 미개정).","tags":["신체의자유","영장주의","제12조"]},{"id":"C04","front":"죄형법정주의·일사부재리·연좌제 금지를 규정한 조문과 각 항의 내용은?","back":"헌법 제13조. ① 행위시의 법률에 의하여 범죄를 구성하지 아니하는 행위로 소추되지 아니하며, 동일한 범죄에 대하여 거듭 처벌받지 아니한다(죄형법정주의+일사부재리). ② 소급입법에 의하여 참정권의 제한을 받거나 재산권을 박탈당하지 아니한다. ③ 자기의 행위가 아닌 친족의 행위로 인하여 불이익한 처우를 받지 아니한다(연좌제 금지).","source":"대한민국헌법 제13조","verified_note":"law.go.kr 헌법 제13조 원문 대조(2026-11-21)","tags":["죄형법정주의","제13조"]},{"id":"C05","front":"언론·출판의 자유와 집회·결사의 자유에서 금지되는 것과 피해 구제는? (헌법 제21조)","back":"② 언론·출판에 대한 허가나 검열과 집회·결사에 대한 허가는 인정되지 아니한다(신고제는 가능). ④ 언론·출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니 되고, 침해한 때에는 피해자가 피해의 배상을 청구할 수 있다.","source":"대한민국헌법 제21조","verified_note":"law.go.kr 헌법 제21조 원문 대조(2026-11-21)","tags":["언론자유","집회결사","제21조"]},{"id":"C06","front":"재산권의 수용·사용·제한과 보상의 헌법적 요건은?","back":"제23조 제3항: 공공필요에 의한 재산권의 수용·사용 또는 제한 및 그에 대한 보상은 법률로써 하되, 정당한 보상을 지급하여야 한다. 제1항: 재산권의 내용과 한계는 법률로 정한다. 제2항: 재산권의 행사는 공공복리에 적합하도록 하여야 한다.","source":"대한민국헌법 제23조","verified_note":"law.go.kr 헌법 제23조 원문 대조(2026-11-21)","tags":["재산권","제23조"]},{"id":"C07","front":"재판청구권 조항 중 숫자·대상이 자주 틀리는 부분은? (헌법 제27조)","back":"① 법관에 의하여 법률에 의한 재판을 받을 권리. ② 군인·군무원이 아닌 국민은 영역 안에서는 '중대한 군사상 기밀·초병·초소·유독음식물공급·포로·군용물에 관한 죄 중 법률이 정한 경우'와 '비상계엄이 선포된 경우'를 제외하고 군사법원의 재판을 받지 아니한다. ③ 신속한 재판, 형사피고인의 공개재판. ④ 무죄추정. ⑤ 형사피해자의 재판절차 진술권.","source":"대한민국헌법 제27조","verified_note":"law.go.kr 헌법 제27조 원문 대조(2026-11-21)","tags":["재판청구권","제27조"]},{"id":"C08","front":"국가배상·형사보상·범죄피해자 구조, 그리고 경찰공무원의 배상 제한은?","back":"제29조 제1항: 공무원의 직무상 불법행위로 손해를 받은 국민은 국가·공공단체에 정당한 배상을 청구할 수 있고, 공무원 자신의 책임은 면제되지 않는다. 제29조 제2항: 군인·군무원·경찰공무원 등이 전투·훈련 등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상 외에 직무상 불법행위로 인한 배상은 청구할 수 없다. 제28조 형사보상, 제30조 범죄피해자 구조.","source":"대한민국헌법 제28조·제29조·제30조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["국가배상","제29조","경찰"]},{"id":"C09","front":"근로3권과 공무원의 제한은? (헌법 제33조)","back":"① 근로자는 근로조건 향상을 위하여 자주적인 단결권·단체교섭권·단체행동권을 가진다. ② 공무원인 근로자는 법률이 정하는 자에 한하여 단결권·단체교섭권·단체행동권을 가진다. ③ 법률이 정하는 주요방위산업체 종사 근로자의 단체행동권은 법률로 제한하거나 인정하지 아니할 수 있다.","source":"대한민국헌법 제33조","verified_note":"law.go.kr 헌법 제33조 원문 대조(2026-11-21)","tags":["근로3권","제33조","공무원"]},{"id":"C10","front":"국회의 일반 의결정족수와 가부동수 처리, 회기·예산 관련 숫자는?","back":"제49조: 헌법 또는 법률에 특별한 규정이 없는 한 재적의원 과반수의 출석과 출석의원 과반수의 찬성으로 의결하며, 가부동수인 때에는 부결된 것으로 본다. 제47조 제2항: 정기회 회기 100일, 임시회 회기 30일을 초과할 수 없다. 제54조 제2항: 정부는 회계연도 개시 90일 전까지 예산안 제출, 국회는 30일 전까지 의결.","source":"대한민국헌법 제47조·제49조·제54조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["국회","의결정족수","제49조"]},{"id":"C11","front":"법률안에 대한 대통령의 재의요구와 국회 재의결 정족수는?","back":"제53조: 국회 의결 법률안은 정부에 이송되어 15일 이내 공포. 대통령이 이의가 있으면 기간 내 이의서를 붙여 환부하고 재의 요구 가능(일부·수정 재의요구는 불가). 재의요구 시 국회는 재적의원 과반수 출석과 출석의원 3분의 2 이상 찬성으로 전과 같은 의결을 하면 법률로 확정된다.","source":"대한민국헌법 제53조","verified_note":"law.go.kr 헌법 제53조 원문 대조(2026-11-21)","tags":["국회","재의요구","제53조"]},{"id":"C12","front":"탄핵소추 발의·의결 정족수는 대상별로 어떻게 다른가? (헌법 제65조)","back":"일반 공무원(국무총리·국무위원·헌법재판소 재판관·법관·중앙선관위 위원·감사원장·감사위원 등): 국회재적의원 3분의 1 이상 발의 + 국회재적의원 과반수 찬성. 대통령: 국회재적의원 과반수 발의 + 국회재적의원 3분의 2 이상 찬성. 탄핵소추 의결 시 탄핵심판까지 권한행사 정지, 탄핵결정은 파면에 그치고 민·형사 책임은 면제되지 않는다.","source":"대한민국헌법 제65조","verified_note":"law.go.kr 헌법 제65조 원문 대조(2026-11-21)","tags":["탄핵","제65조"]},{"id":"C13","front":"대통령의 선거 연령·임기·선거 시기는?","back":"제67조 제4항: 국회의원 피선거권이 있고 선거일 현재 40세에 달하여야 한다. 제70조: 임기 5년, 중임할 수 없다. 제68조: 임기만료 시 70일 내지 40일 전에 후임자 선거, 궐위·당선자 사망 등 자격상실 시 60일 이내 선거.","source":"대한민국헌법 제67조·제68조·제70조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["대통령","제70조"]},{"id":"C14","front":"계엄의 종류와 국회의 계엄 해제 요구 정족수는?","back":"제77조: 계엄은 비상계엄과 경비계엄으로 한다. 비상계엄이 선포되면 법률이 정하는 바에 의하여 영장제도, 언론·출판·집회·결사의 자유, 정부나 법원의 권한에 관하여 특별한 조치를 할 수 있다. 계엄 선포 시 대통령은 지체 없이 국회에 통고하여야 하고, 국회가 재적의원 과반수의 찬성으로 해제를 요구하면 대통령은 이를 해제하여야 한다.","source":"대한민국헌법 제77조","verified_note":"law.go.kr 헌법 제77조 원문 대조(2026-11-21)","tags":["계엄","제77조"]},{"id":"C15","front":"헌법재판소의 구성(인원·임명 경로)과 결정 정족수는?","back":"제111조: 법관 자격을 가진 9인의 재판관, 대통령이 임명하되 3인은 국회에서 선출한 자, 3인은 대법원장이 지명한 자를 임명. 소장은 국회 동의를 얻어 재판관 중에서 대통령이 임명. 제112조: 임기 6년, 법률이 정하는 바에 의하여 연임 가능. 제113조 제1항: 법률의 위헌결정, 탄핵결정, 정당해산결정, 헌법소원 인용결정에는 재판관 6인 이상의 찬성이 필요하다.","source":"대한민국헌법 제111조~제113조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["헌법재판소","제111조","제113조"]},{"id":"C16","front":"법관의 임기·신분보장과 위헌법률심판 제청권은?","back":"제105조: 대법원장 임기 6년·중임 불가, 대법관 임기 6년·법률이 정하는 바에 의하여 연임 가능, 대법원장·대법관이 아닌 법관 임기 10년·연임 가능. 제106조: 법관은 탄핵 또는 금고 이상의 형의 선고에 의하지 아니하고는 파면되지 아니하고, 징계처분에 의하지 아니하고는 정직·감봉 기타 불리한 처분을 받지 아니한다. 제107조 제1항: 법률이 헌법에 위반되는 여부가 재판의 전제가 된 경우 법원은 헌법재판소에 제청하여 그 심판에 의하여 재판한다.","source":"대한민국헌법 제105조~제107조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["법원","제107조","위헌법률심판"]},{"id":"C17","front":"헌법개정 절차의 숫자를 순서대로 말하면?","back":"제128조: 국회재적의원 과반수 또는 대통령 발의로 제안. 제129조: 대통령이 20일 이상 공고. 제130조: 국회는 공고된 날부터 60일 이내에 재적의원 3분의 2 이상 찬성으로 의결 → 의결 후 30일 이내 국민투표 → 국회의원선거권자 과반수 투표와 투표자 과반수 찬성으로 확정.","source":"대한민국헌법 제128조~제130조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","tags":["헌법개정","제130조"]},{"id":"C18","front":"최신 헌재 결정 2건의 사건번호·결론은? (2026년)","back":"① 2022헌바95(2026.10.22., 재판관 8:1): 형법 제250조 제2항 중 '자기의 직계존속을 살해한 자' 부분은 합헌(존속살해 가중처벌 유지). ② 2021헌바168(2026.2.26.): 집시법 제22조 제2항 중 제6조 제1항 본문 가운데 '옥외집회'에 관한 부분(미신고 옥외집회 처벌조항)은 헌법불합치, 2027.8.31.을 시한으로 개정될 때까지 계속 적용. 같은 법 제6조 제1항 본문의 신고조항 자체는 합헌.","source":"헌법재판소 2022헌바95 결정(2026.10.22.), 헌법재판소 2021헌바168 결정(2026.2.26.)","verified_note":"헌법재판소 홈페이지 '최근 주요결정' 및 헌법불합치 목록(ccourt.go.kr) 2026-11-21 조회, 결정 주문·종국일자·의견수 대조","tags":["헌재","최신판례","존속살해","집시법"]}],"questions":[{"id":"CQ01","question":"헌법 제37조 제2항에 따른 기본권 제한에 관한 설명으로 옳은 것은?","choices":["국가안전보장을 위해서라면 법률이 아니더라도 대통령령으로 기본권을 제한할 수 있다.","기본권 제한은 질서유지만을 목적으로 하는 경우에도 허용된다.","헌법에 열거되지 아니한 기본권은 법률로 제한할 필요가 없다.","기본권을 제한할 때에는 그 본질적인 내용을 침해하여서도 아니 된다."],"answer_index":3,"explanation":"제37조 제2항은 국가안전보장·질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 '법률로써' 제한할 수 있고, 제한하는 경우에도 자유와 권리의 본질적인 내용을 침해할 수 없다고 규정한다. 따라서 ④가 정답이다.","choice_notes":["① X: 반드시 '법률'로써 제한하여야 하며 대통령령으로는 부족하다.","② X: '질서유지'만으로는 부족하고 국가안전보장·질서유지 또는 공공복리를 위한 '필요한 경우'여야 한다.","③ X: 제37조 제1항은 열거되지 아니한 권리도 경시되지 아니한다고 규정할 뿐, 제한 요건을 면제하지 않는다.","④ O: 조문에 '본질적인 내용을 침해할 수 없다'고 명시되어 있다."],"source":"대한민국헌법 제37조","verified_note":"law.go.kr 헌법 제37조 원문 대조(2026-11-21)","difficulty":"하"},{"id":"CQ02","question":"헌법 제12조 제3항의 영장 제시 예외에 해당하는 경우를 모두 고른 것은? ㉠ 현행범인인 경우 ㉡ 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때 ㉢ 장기 1년 이상의 형에 해당하는 죄를 범한 경우 ㉣ 외국인인 경우","choices":["㉡, ㉣","㉢, ㉣","㉠, ㉢","㉠, ㉡"],"answer_index":3,"explanation":"제12조 제3항 단서는 '현행범인인 경우'와 '장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때'에 사후에 영장을 청구할 수 있다고 규정한다. ㉠·㉡이 정답이다.","choice_notes":["① X: ㉣ 외국인이라는 사유만으로 영장이 면제되지 않는다.","② X: ㉢·㉣ 모두 근거가 없다.","③ X: ㉢ '장기 1년 이상'은 조문에 없는 요건이다.","④ O: ㉠·㉡ 모두 조문에 명시된 예외이다."],"source":"대한민국헌법 제12조 제3항","verified_note":"law.go.kr 헌법 제12조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"CQ03","question":"헌법 제11조 제3항(훈장 등의 영전)에 관한 설명으로 옳은 것은?","choices":["훈장 등의 영전은 이를 받은 자에게만 효력이 있고 어떠한 특권도 이에 따르지 아니한다.","훈장을 받은 자는 공무원 임용에서 특별한 우대를 받는다.","훈장 등의 영전은 법률로 폐지할 수 없다.","훈장을 받은 자의 자녀에게도 그 효력이 승계된다."],"answer_index":0,"explanation":"제11조 제3항은 '훈장등의 영전은 이를 받은 자에게만 효력이 있고, 어떠한 특권도 이에 따르지 아니한다'고 규정한다.","choice_notes":["① O: 조문 그대로이다.","② X: '어떠한 특권도 이에 따르지 아니한다'고 명시되어 있다.","③ X: 영전 제도는 법률로 정할 수 있으며, 헌법이 폐지를 금지하지 않는다.","④ X: 받은 자에게만 효력이 있어 승계되지 않는다."],"source":"대한민국헌법 제11조 제3항","verified_note":"law.go.kr 헌법 제11조 원문 대조(2026-11-21)","difficulty":"하"},{"id":"CQ04","question":"헌법 제49조의 국회 의결정족수에 관한 설명으로 옳은 것은?","choices":["출석의원 과반수 찬성이면 재적의원 수와 관계없이 항상 의결된다.","재적의원 과반수 출석과 출석의원 3분의 2 이상 찬성이 원칙이다.","재적의원 3분의 2 이상 출석과 출석의원 과반수 찬성이 원칙이다.","재적의원 과반수 출석과 출석의원 과반수 찬성이 원칙이고, 가부동수이면 부결된 것으로 본다."],"answer_index":3,"explanation":"제49조 본문은 '재적의원 과반수의 출석과 출석의원 과반수의 찬성'을 원칙으로 하고, 후단에서 '가부동수인 때에는 부결된 것으로 본다'고 규정한다.","choice_notes":["① X: 재적의원 과반수 출석 요건이 별도로 필요하다.","② X: 3분의 2는 법률안 재의결 등 특별한 경우의 요건이다.","③ X: 출석 요건과 찬성 요건이 뒤바뀌었다.","④ O: 조문 그대로이다."],"source":"대한민국헌법 제49조","verified_note":"law.go.kr 헌법 제49조 원문 대조(2026-11-21)","difficulty":"하"},{"id":"CQ05","question":"대통령에 대한 탄핵소추의 발의·의결 정족수로 옳은 것은?","choices":["국회재적의원 3분의 1 이상 발의, 국회재적의원 과반수 찬성","국회재적의원 과반수 발의, 출석의원 3분의 2 이상 찬성","국회재적의원 3분의 2 이상 발의, 국회재적의원 3분의 2 이상 찬성","국회재적의원 과반수 발의, 국회재적의원 3분의 2 이상 찬성"],"answer_index":3,"explanation":"헌법 제65조 제2항은 일반 공무원에 대해서는 재적의원 3분의 1 이상 발의·재적의원 과반수 찬성, 대통령에 대해서는 재적의원 과반수 발의·재적의원 3분의 2 이상 찬성을 요구한다.","choice_notes":["① X: 이는 대통령 외의 공무원에 대한 정족수이다.","② X: '출석의원'이 아니라 '재적의원' 3분의 2이다.","③ X: 발의 요건이 과도하다.","④ O: 대통령에 대한 정족수이다."],"source":"대한민국헌법 제65조 제2항","verified_note":"law.go.kr 헌법 제65조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"CQ06","question":"헌법재판소의 구성에 관한 설명으로 옳지 않은 것은?","choices":["재판관은 법관의 자격을 가진 9인으로 구성한다.","재판관 3인은 대법원장이 지명하는 자를 대통령이 임명한다.","재판관 3인은 국회에서 선출하는 자를 대통령이 임명한다.","헌법재판소장은 재판관 중에서 대통령이 단독으로 임명한다."],"answer_index":3,"explanation":"제111조 제4항은 헌법재판소의 장을 '국회의 동의를 얻어' 재판관 중에서 대통령이 임명한다고 규정한다. ④가 틀린 설명이다.","choice_notes":["① X: 제111조 제2항.","② X: 제111조 제3항.","③ X: 제111조 제3항.","④ O: 국회의 동의가 필요하다."],"source":"대한민국헌법 제111조","verified_note":"law.go.kr 헌법 제111조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"CQ07","question":"헌법재판소의 위헌결정 등에 필요한 재판관 찬성 수는?","choices":["재판관 7인 이상","재판관 6인 이상","재판관 전원","재판관 5인 이상"],"answer_index":1,"explanation":"제113조 제1항은 법률의 위헌결정, 탄핵의 결정, 정당해산의 결정 또는 헌법소원에 관한 인용결정에 재판관 6인 이상의 찬성이 있어야 한다고 규정한다.","choice_notes":["① X: 7인은 요건이 아니다.","② O: 6인 이상.","③ X: 전원일치는 요구되지 않는다.","④ X: 5인으로는 부족하다."],"source":"대한민국헌법 제113조 제1항","verified_note":"law.go.kr 헌법 제113조 원문 대조(2026-11-21)","difficulty":"하"},{"id":"CQ08","question":"헌법 제29조 제2항에 따라 경찰공무원이 국가에 대해 직무상 불법행위로 인한 배상을 청구할 수 없는 손해는?","choices":["직무와 무관한 사인 간 폭행으로 입은 손해","공무원의 직무상 불법행위로 인하여 국민이 입은 손해","퇴근 후 사적인 교통사고로 입은 손해","전투·훈련 등 직무집행과 관련하여 받은 손해"],"answer_index":3,"explanation":"제29조 제2항은 군인·군무원·경찰공무원 기타 법률이 정하는 자가 전투·훈련 등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상 외에 공무원의 직무상 불법행위로 인한 배상을 청구할 수 없다고 규정한다.","choice_notes":["① X: 직무와 무관한 사인 간 불법행위는 국가배상과 무관하다.","② X: 국민의 국가배상 청구권을 인정하는 것이 제29조 제1항이다.","③ X: 사적인 손해는 이 조항의 대상이 아니다.","④ O: 조문이 정한 배상 청구 제한 대상이다."],"source":"대한민국헌법 제29조 제2항","verified_note":"law.go.kr 헌법 제29조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"CQ09","question":"헌법 제21조 제2항이 금지하는 것에 해당하지 않는 것은?","choices":["언론·출판에 대한 검열","집회·결사에 대한 신고","언론·출판에 대한 허가","집회·결사에 대한 허가"],"answer_index":1,"explanation":"제21조 제2항은 '언론·출판에 대한 허가나 검열과 집회·결사에 대한 허가는 인정되지 아니한다'고 규정한다. 신고는 허가와 달리 금지되지 않으므로 ②가 정답이다.","choice_notes":["① X: 언론·출판에 대한 검열은 금지된다.","② O: 신고제는 헌법이 금지하지 않는다(조문에 열거되지 않음).","③ X: 언론·출판에 대한 허가는 금지된다.","④ X: 집회·결사에 대한 허가는 금지된다."],"source":"대한민국헌법 제21조 제2항","verified_note":"law.go.kr 헌법 제21조 원문 대조(2026-11-21). 조문에 열거된 허가·검열만 금지되고 신고는 열거되지 않았음을 확인.","difficulty":"중"},{"id":"CQ10","question":"헌법 제70조와 제67조 제4항에 따른 대통령의 임기와 피선거권 연령은?","choices":["임기 6년·중임 불가, 40세","임기 4년·중임 가능, 40세","임기 5년·1차 중임 가능, 45세","임기 5년·중임 불가, 40세"],"answer_index":3,"explanation":"제70조는 대통령의 임기를 5년으로 하며 중임할 수 없다고 규정하고, 제67조 제4항은 선거일 현재 40세에 달하여야 한다고 규정한다.","choice_notes":["① X: 임기는 5년이다.","② X: 임기 5년, 중임 불가이다.","③ X: 중임은 허용되지 않는다.","④ O: 5년·중임 불가·40세."],"source":"대한민국헌법 제67조·제70조","verified_note":"law.go.kr 헌법 원문 대조(2026-11-21)","difficulty":"하"},{"id":"CQ11","question":"2026년 헌법재판소 결정에 관한 설명으로 옳은 것은?","choices":["2022헌바95 결정은 재판관 전원일치로 합헌 결정을 하였다.","2021헌바168 결정(2026.2.26.)은 미신고 옥외집회 처벌조항에 대해 헌법불합치 결정을 하면서 2027.8.31.까지 계속 적용하도록 하였다.","2022헌바95 결정(2026.10.22.)은 존속살해 가중처벌 조항을 위헌으로 선고하였다.","2021헌바168 결정은 옥외집회 사전신고 의무 자체도 위헌이라고 선고하였다."],"answer_index":1,"explanation":"2021헌바168 결정(2026.2.26.)은 집시법 제22조 제2항 중 제6조 제1항 본문 가운데 '옥외집회'에 관한 처벌조항에 대해 헌법불합치 결정을 하면서 2027.8.31.을 시한으로 개정될 때까지 계속 적용한다고 선고하였다.","choice_notes":["① X: 8:1 의견으로, 전원일치가 아니다.","② O: 결정 주문과 일치한다.","③ X: 2022헌바95는 합헌(8:1) 결정이다.","④ X: 신고조항 자체는 합헌(7:2)으로 판단되었다."],"source":"헌법재판소 2021헌바168 결정(2026.2.26.), 2022헌바95 결정(2026.10.22.)","verified_note":"ccourt.go.kr '최근 주요결정' 2026-11-21 조회, 주문·의견수·종국일자 대조","difficulty":"상"},{"id":"CQ12","question":"헌법 제77조 제5항에 따라 국회가 계엄의 해제를 요구할 때 필요한 요건은?","choices":["재적의원 과반수의 찬성","출석의원 3분의 2 이상의 찬성","재적의원 3분의 1 이상의 찬성","재적의원 3분의 2 이상의 찬성"],"answer_index":0,"explanation":"제77조 제5항은 '국회가 재적의원 과반수의 찬성으로 계엄의 해제를 요구한 때에는 대통령은 이를 해제하여야 한다'고 규정한다.","choice_notes":["① O: 재적의원 과반수 찬성.","② X: 출석의원 기준이 아니다.","③ X: 3분의 1은 요건이 아니다.","④ X: 3분의 2는 탄핵 등 다른 절차의 요건이다."],"source":"대한민국헌법 제77조 제5항","verified_note":"law.go.kr 헌법 제77조 원문 대조(2026-11-21)","difficulty":"중"}]},{"id":"criminal_law","name":"형사법","description":"형법총론 35%·형법각론 35%·형사소송법 30%. 2026.10.2. 시행 형사소송법 개정(수사 주체 일원화)과 2025~2026년 형법 개정을 반영한다.","flashcards":[{"id":"F01","front":"형법 제1조의 시간적 적용범위 3가지는?","back":"① 범죄의 성립과 처벌은 행위 시의 법률에 따른다. ② 범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법보다 가벼워진 경우에는 신법에 따른다. ③ 재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우에는 형의 집행을 면제한다.","source":"형법 제1조","verified_note":"law.go.kr 형법(법률 제22007호, 시행 2026.10.2.) 제1조 원문 대조(2026-11-21)","tags":["총론","시간적적용범위"]},{"id":"F02","front":"형사미성년·심신장애·청각 및 언어 장애의 법적 효과를 구분하면?","back":"제9조: 14세되지 아니한 자의 행위는 벌하지 아니한다. 제10조: 심신장애로 변별능력 또는 의사결정능력이 없는 자는 벌하지 아니하고(①), 그 능력이 미약한 자는 형을 감경할 수 있다(②, 임의적). 위험발생을 예견하고 자의로 심신장애를 야기한 경우에는 적용하지 않는다(③). 제11조: 듣거나 말하는 데 모두 장애가 있는 사람의 행위에 대해서는 형을 감경한다(필요적 감경).","source":"형법 제9조~제11조","verified_note":"law.go.kr 형법 제9·10·11조 원문 대조(2026-11-21). 제11조는 2020.12.8. 전문개정으로 '감경한다'로 되어 있어 임의적 감경이 아님.","tags":["총론","책임능력"]},{"id":"F03","front":"강요된 행위의 요건과 효과는? (형법 제12조)","back":"저항할 수 없는 폭력이나, 자기 또는 친족의 생명·신체에 대한 위해를 방어할 방법이 없는 협박에 의하여 강요된 행위는 벌하지 아니한다. 단순한 심리적 압박이나 피해자의 부탁은 이에 해당하지 않는다.","source":"형법 제12조","verified_note":"law.go.kr 형법 제12조 원문 대조(2026-11-21)","tags":["총론","책임조각"]},{"id":"F04","front":"고의·과실·사실의 착오·법률의 착오 조문을 구분하면?","back":"제13조(고의): 죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다(법률에 특별한 규정이 있으면 예외). 제14조(과실): 정상적으로 기울여야 할 주의를 게을리하여 죄의 성립요소인 사실을 인식하지 못한 행위는 법률에 특별한 규정이 있는 경우에만 처벌한다. 제15조(사실의 착오): 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 무거운 죄로 벌하지 아니한다. 제16조(법률의 착오): 자기 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.","source":"형법 제13조~제16조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","고의","착오"]},{"id":"F05","front":"인과관계·부작위범·독립행위의 경합 조문의 결론은?","back":"제17조: 어떤 행위라도 죄의 요소되는 위험발생에 연결되지 아니한 때에는 그 결과로 인하여 벌하지 아니한다. 제18조: 위험발생을 방지할 의무가 있거나 자기의 행위로 위험발생의 원인을 야기한 자가 방지하지 아니한 때에는 발생된 결과에 의하여 처벌한다(부작위범). 제19조: 동시 또는 이시의 독립행위가 경합하여 결과발생의 원인된 행위가 판명되지 아니한 때에는 각 행위를 미수범으로 처벌한다.","source":"형법 제17조~제19조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","인과관계","부작위범"]},{"id":"F06","front":"정당방위·긴급피난·자구행위·피해자 승낙의 핵심 차이와 과잉 시 효과는?","back":"제21조(정당방위): 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위. ② 정도를 초과하면 정황에 따라 형을 감경하거나 면제할 수 있다. ③ 제2항의 경우 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악·흥분·당황하였기 때문에 한 행위는 벌하지 아니한다. 제22조(긴급피난): 현재의 위난을 피하기 위한 행위, 위난을 피하지 못할 책임이 있는 자에게는 적용하지 않는다. 제23조(자구행위): 법률 절차로는 청구권을 보전할 수 없는 경우. 제24조(피해자의 승낙): 처분할 수 있는 자의 승낙.","source":"형법 제21조~제24조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","위법성조각","정당방위"]},{"id":"F07","front":"미수·중지·불능·예비의 효과를 구분하면?","back":"제25조: 실행에 착수하여 행위를 종료하지 못하였거나 결과가 발생하지 아니한 때 미수범, 형은 기수범보다 감경할 수 있다(임의적). 제26조: 자의로 중지하거나 결과발생을 자의로 방지한 경우에는 형을 감경하거나 면제한다(필요적 감면). 제27조: 실행의 수단 또는 대상의 착오로 결과 발생이 불가능하더라도 위험성이 있는 때에는 처벌하되 형을 감경 또는 면제할 수 있다. 제28조: 음모·예비가 실행의 착수에 이르지 아니한 때에는 법률에 특별한 규정이 없는 한 벌하지 아니한다.","source":"형법 제25조~제28조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","미수범"]},{"id":"F08","front":"공동정범·교사범·종범·공범과 신분·간접정범의 조문상 효과는?","back":"제30조: 2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌. 제31조: 교사자는 죄를 실행한 자와 동일한 형. 피교사자가 승낙하고 착수하지 아니한 때, 승낙하지 아니한 때에는 교사자와 피교사자를 음모 또는 예비에 준하여 처벌. 제32조: 방조한 자는 종범, '종범의 형은 정범의 형보다 감경한다'(필요적 감경). 제33조: 신분 없는 자도 공범 규정 적용, 신분 때문에 형의 경중이 달라지는 경우 신분 없는 자는 무거운 형으로 벌하지 아니한다. 제34조: 처벌되지 아니하는 자 또는 과실범을 교사·방조한 자는 교사·방조의 예에 의하여 처벌(간접정범).","source":"형법 제30조~제34조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","공범"]},{"id":"F09","front":"누범·경합범·상상적 경합의 요건과 처리 원칙은?","back":"제35조: 금고 이상의 형을 선고받아 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 지으면 누범, 그 형은 죄에 정한 형의 장기의 2배까지 가중. 제37조: 판결이 확정되지 아니한 수개의 죄 또는 금고 이상의 형에 처한 확정판결과 그 확정 전에 범한 죄가 경합범. 제38조 제1항 제2호: 같은 종류의 형이면 가장 무거운 죄의 장기·다액의 2분의 1까지 가중하되 합산한 형기·액수를 초과할 수 없고, 과료와 과료·몰수와 몰수는 병과 가능. 제40조: 한 개의 행위가 여러 개의 죄에 해당하면 가장 무거운 죄에 정한 형으로 처벌(상상적 경합).","source":"형법 제35조·제37조·제38조·제40조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","누범","경합범"]},{"id":"F10","front":"형의 종류와 징역·금고 기간, 몰수·추징의 요건은?","back":"제41조: 사형·징역·금고·자격상실·자격정지·벌금·구류·과료·몰수(9종). 제42조: 징역·금고는 무기 또는 유기, 유기는 1개월 이상 30년 이하, 가중하는 때에는 50년까지. 제48조: 범죄행위에 제공한 물건, 범죄로 인하여 생긴·취득한 물건, 그 대가로 취득한 물건을 몰수할 수 있고, 몰수할 수 없을 때에는 그 가액을 추징한다. 제49조: 몰수는 타형에 부가하여 과하되, 유죄 재판을 하지 아니할 때에도 몰수 요건이 있으면 몰수만 선고할 수 있다.","source":"형법 제41조·제42조·제48조·제49조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","형의종류","몰수"]},{"id":"F11","front":"선고유예와 집행유예의 요건·기간·효과를 비교하면?","back":"선고유예(제59조): 1년 이하의 징역이나 금고, 자격정지 또는 벌금의 형을 선고할 경우, 뉘우치는 정상이 뚜렷할 때. 단 자격정지 이상의 형을 받은 전과가 있는 사람은 제외. 제60조: 선고유예를 받은 날로부터 2년을 경과하면 면소된 것으로 간주. 집행유예(제62조): 3년 이하의 징역이나 금고 또는 500만원 이하의 벌금, 1년 이상 5년 이하의 기간 유예. 금고 이상의 형을 선고한 판결이 확정된 때부터 집행 종료·면제 후 3년까지의 기간에 범한 죄는 제외.","source":"형법 제59조·제60조·제62조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["총론","선고유예","집행유예"]},{"id":"F12","front":"형의 시효 기간은? (2023.8.8. 개정 반영)","back":"제78조: ① 사형에 관한 규정(제1호)은 2023.8.8. 삭제. ② 무기의 징역·금고 20년 ③ 10년 이상의 징역·금고 15년 ④ 3년 이상의 징역·금고 또는 10년 이상의 자격정지 10년 ⑤ 3년 미만의 징역·금고 또는 5년 이상의 자격정지 7년 ⑥ 5년 미만의 자격정지, 벌금, 몰수 또는 추징 5년 ⑦ 구류 또는 과료 1년.","source":"형법 제78조","verified_note":"law.go.kr 형법 제78조 원문 대조(2026-11-21). '1. 삭제 <2023.8.8.>' 표기 확인.","tags":["총론","형의시효"]},{"id":"F13","front":"살인·존속살해의 법정형과 관련 헌재 결정은?","back":"제250조 제1항: 사람을 살해한 자는 사형, 무기 또는 5년 이상의 징역. 제2항: 자기 또는 배우자의 직계존속을 살해한 자는 사형, 무기 또는 7년 이상의 징역. 헌법재판소 2022헌바95(2026.10.22., 8:1)는 제2항 중 '자기의 직계존속을 살해한 자' 부분을 합헌으로 결정하였다.","source":"형법 제250조, 헌법재판소 2022헌바95 결정","verified_note":"law.go.kr 형법 제250조 원문 대조 + ccourt.go.kr 최근 주요결정(2026.10.22.) 대조","tags":["각론","살인","헌재"]},{"id":"F14","front":"상해·폭행·특수폭행·협박의 법정형과 반의사불벌죄 해당 여부는?","back":"제257조: 상해 7년 이하 징역, 10년 이하 자격정지 또는 1천만원 이하 벌금(존속상해 10년 이하 징역 또는 1천500만원, 미수 처벌). 제260조: 폭행 2년 이하 징역, 500만원 이하 벌금, 구류 또는 과료, 제3항에 따라 피해자의 명시한 의사에 반하여 공소를 제기할 수 없다. 제261조: 특수폭행(단체·다중의 위력 또는 위험한 물건 휴대) 5년 이하 징역 또는 1천만원 이하 벌금. 제283조: 협박 3년 이하 징역, 500만원 이하 벌금, 구류 또는 과료, 제3항 반의사불벌.","source":"형법 제257조·제260조·제261조·제283조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","상해","폭행","반의사불벌"]},{"id":"F15","front":"강제추행·준강간·미성년자 간음·추행 조문의 구조는?","back":"제298조: 폭행 또는 협박으로 추행한 자는 10년 이하의 징역 또는 1천500만원 이하의 벌금(강제추행). 제299조: 사람의 심신상실 또는 항거불능 상태를 이용하여 간음·추행하면 제297조·제297조의2·제298조의 예에 의한다(준강간·준강제추행). 제305조 제1항: 13세 미만의 사람에 대하여 간음·추행하면 제297조·제297조의2·제298조·제301조·제301조의2의 예에 의한다. 제2항: 13세 이상 16세 미만의 사람에 대하여 간음·추행한 19세 이상의 자도 같은 예에 의한다.","source":"형법 제298조·제299조·제305조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","성범죄","제305조"]},{"id":"F16","front":"야간주거침입절도·특수절도·강도·준강도의 법정형과 구조는?","back":"제330조: 야간에 주거·관리하는 건조물·선박·항공기·점유하는 방실에 침입하여 타인의 재물을 절취하면 10년 이하의 징역. 제331조: ① 야간에 문·담 등 건조물 일부를 손괴하고 제330조 장소에 침입하여 절취하거나 ② 흉기를 휴대하거나 2명 이상이 합동하여 타인의 재물을 절취하면 1년 이상 10년 이하의 징역. 제333조: 폭행·협박으로 타인의 재물을 강취하거나 재산상 이익을 취득하면 3년 이상의 유기징역. 제335조: 절도가 재물의 탈환에 항거, 체포 면탈, 범죄 흔적 인멸의 목적으로 폭행·협박하면 제333조·제334조의 예에 따른다(준강도).","source":"형법 제330조·제331조·제333조·제335조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","절도","강도"]},{"id":"F17","front":"사기죄의 최신 법정형(2025.12.23. 개정)과 공갈·횡령·배임·장물의 법정형은?","back":"제347조(사기): 사람을 기망하여 재물의 교부를 받거나 재산상 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금(2025.12.23. 개정으로 상향). 제350조(공갈): 10년 이하 징역 또는 2천만원 이하 벌금. 제355조(횡령·배임): 5년 이하 징역 또는 1천500만원 이하 벌금. 제356조(업무상 횡령·배임): 10년 이하 징역 또는 3천만원 이하 벌금. 제362조(장물 취득·양도·운반·보관·알선): 7년 이하 징역 또는 1천500만원 이하 벌금.","source":"형법 제347조·제350조·제355조·제356조·제362조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21). 제347조에 '<개정 2025.12.23.>' 표기 확인","tags":["각론","사기","최신개정"]},{"id":"F18","front":"현주건조물 등 방화·일반물건 방화·실화의 법정형은?","back":"제164조: 불을 놓아 사람이 주거로 사용하거나 사람이 현존하는 건조물·기차·전차·자동차·선박·항공기·지하채굴시설을 불태우면 무기 또는 3년 이상의 징역. 상해에 이르게 하면 무기 또는 5년 이상, 사망에 이르게 하면 사형·무기 또는 7년 이상. 제167조: 제164조부터 제166조까지 외의 물건을 불태워 공공의 위험을 발생하게 하면 1년 이상 10년 이하(자기 소유 물건이면 3년 이하 징역 또는 700만원 이하 벌금). 제170조: 과실로 제164조·제165조의 물건 또는 타인 소유의 제166조 물건을 불태우면 1천500만원 이하의 벌금.","source":"형법 제164조·제167조·제170조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","방화","실화"]},{"id":"F19","front":"공문서·사문서 위조와 뇌물죄의 기본 법정형은?","back":"제225조(공문서등 위조·변조): 행사할 목적으로 공무원·공무소의 문서·도화를 위조·변조하면 10년 이하의 징역. 제231조(사문서등 위조·변조): 행사할 목적으로 권리·의무 또는 사실증명에 관한 타인의 문서·도화를 위조·변조하면 5년 이하 징역 또는 1천만원 이하 벌금. 제234조: 위조사문서를 행사하면 그 각 죄에 정한 형. 제129조(수뢰): 5년 이하 징역 또는 10년 이하 자격정지, 사전수뢰는 3년 이하 징역 또는 7년 이하 자격정지. 제130조(제3자뇌물제공): 5년 이하 징역 또는 10년 이하 자격정지. 제133조(뇌물공여 등): 5년 이하 징역 또는 2천만원 이하 벌금.","source":"형법 제225조·제231조·제234조·제129조·제130조·제133조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","tags":["각론","문서죄","뇌물"]},{"id":"F20","front":"공무원 범죄 4개 조문과 2026.9.29. 신설된 법왜곡죄는?","back":"제122조(직무유기): 공무원이 정당한 이유 없이 직무수행을 거부하거나 유기하면 1년 이하 징역·금고 또는 3년 이하 자격정지. 제124조(불법체포·불법감금): 7년 이하의 징역과 10년 이하의 자격정지(2026.9.29. 개정). 제126조(피의사실공표): 3년 이하의 징역 또는 5년 이하의 자격정지(2026.9.29. 개정). 제136조(공무집행방해): 5년 이하 징역 또는 1천만원 이하 벌금. 제123조의2(법왜곡, 2026.9.29. 신설): 법관·검사·수사직무 수행자가 위법·부당하게 이익을 주거나 권익을 해할 목적으로 법령 적용·증거 수집 등을 하면 10년 이하의 징역과 10년 이하의 자격정지.","source":"형법 제122조·제123조의2·제124조·제126조·제136조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21). 제123조의2는 본조신설 2026.9.29., 제124조·제126조는 개정 2026.9.29. 표기 확인","tags":["각론","공무원범죄","최신개정"]},{"id":"F21","front":"2026.10.2. 시행 형사소송법상 수사 주체와 검사의 역할은?","back":"제195조: 검사와 사법경찰관은 수사·공소제기·공소유지에 관하여 협력하고, 검사는 공소제기 및 공소유지를, 사법경찰관은 수사를 책임진다. 검사는 인권 옹호를 위하여 영장의 청구, 보완수사요구, 재수사요구 등 법률이 정하는 직무를 수행한다. 제197조: 경위 이상의 경찰공무원은 사법경찰관, 경사·경장·순경은 사법경찰리. 제198조 제1항: 피의자에 대한 수사는 불구속 상태에서 함을 원칙으로 한다. 제199조: 강제처분은 법률에 특별한 규정이 있는 경우에 한하며 필요한 최소한도에서만.","source":"형사소송법 제195조·제197조·제198조·제199조","verified_note":"law.go.kr 형사소송법(법률 제22009호, 시행 2026.10.2.) 원문 대조(2026-11-21)","tags":["수사","2026개정","제195조"]},{"id":"F22","front":"체포영장·긴급체포·현행범 체포의 요건과 시간 제한은?","back":"제200조의2: 사법경찰관이 검사에게 신청하여 검사의 청구로 판사의 체포영장을 발부받아 체포. 체포한 때부터 48시간 이내에 구속영장을 청구하지 아니하면 즉시 석방. 제200조의3(긴급체포): 사형·무기 또는 장기 3년 이상의 징역·금고에 해당하는 죄를 범하였다고 의심할 상당한 이유 + 증거인멸 염려 또는 도피 염려 + 긴급하여 영장을 받을 수 없을 때. 체포 후 즉시 검사의 승인을 받아야 하고 긴급체포서를 작성. 제211조: 현행범인·준현행범인(4호). 제212조: 현행범인은 누구든지 영장 없이 체포할 수 있다. 제214조: 다액 50만원 이하 벌금·구류·과료에 해당하는 죄의 현행범인은 주거가 분명하지 아니한 때에만 체포 규정 적용.","source":"형사소송법 제200조의2·제200조의3·제211조·제212조·제214조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","tags":["수사","체포","긴급체포"]},{"id":"F23","front":"구속영장·구속 전 피의자심문·구속기간의 숫자는? (2026.10.2. 현행)","back":"제201조: 사법경찰관이 검사에게 신청하여 검사의 청구로 판사의 구속영장을 받아 구속. 다액 50만원 이하 벌금·구류·과료 사건은 피의자가 일정한 주거가 없는 경우에 한정. 제201조의2: 체포된 피의자에 대한 구속영장 청구 시 판사는 지체 없이 심문하되 특별한 사정이 없으면 청구된 날의 다음날까지 심문, 심문 기간은 구속기간에 산입하지 않는다. 제202조: 사법경찰관이 구속한 때에는 10일 이내에 검사에게 인치하지 아니하면 석방. 제203조: 검사가 인치받은 때에는 10일 이내에 공소를 제기하지 아니하면 석방. 제205조: 판사는 검사의 신청에 의하여 10일을 초과하지 아니하는 범위에서 제203조의 구속기간 연장을 1차에 한정하여 허가할 수 있다.","source":"형사소송법 제201조·제201조의2·제202조·제203조·제205조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21). 2026.8.4. 개정으로 검사 구속기간이 '10일'로 변경된 현행 조문임을 확인.","tags":["수사","구속","2026개정"]},{"id":"F24","front":"압수·수색·검증의 영장 청구 구조와 영장 없는 처분의 시간 제한은?","back":"제215조 제2항: 사법경찰관이 범죄수사에 필요한 때에는 피의자가 죄를 범하였다고 의심할 만한 정황이 있고 사건과 관계가 있다고 인정되는 것에 한정하여 검사에게 신청하여 검사의 청구로 판사가 발부한 영장에 의하여 압수·수색·검증. 제216조 제1항: 체포·구속 시 영장 없이 ① 타인의 주거나 간수하는 가옥 등에서의 피의자 수색(제200조의2·제201조의 경우 미리 수색영장을 발부받기 어려운 긴급한 사정이 있을 때), ② 체포현장에서의 압수·수색·검증. 제216조 제3항: 범행 중 또는 직후 범죄 장소에서 긴급하여 영장을 받을 수 없으면 영장 없이 압수·수색·검증하되 사후에 지체 없이 영장을 받아야 한다. 제217조: 긴급체포된 자의 물건은 체포한 때부터 24시간 이내에 한하여 영장 없이 압수·수색·검증, 계속 압수하려면 48시간 이내에 영장 청구. 제218조: 유류물·임의제출물은 영장 없이 압수.","source":"형사소송법 제215조·제216조·제217조·제218조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","tags":["수사","압수수색","영장"]},{"id":"F25","front":"위법수집증거 배제·자백의 증거능력·전문법칙·조서의 증거능력 요약은?","back":"제308조의2: 적법한 절차에 따르지 아니하고 수집한 증거는 증거로 할 수 없다. 제309조: 자백이 고문·폭행·협박·신체구속의 부당한 장기화 또는 기망 기타 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있으면 유죄의 증거로 하지 못한다. 제310조: 자백이 피고인에게 불이익한 유일의 증거인 때에는 유죄의 증거로 하지 못한다(보강법칙). 제310조의2: 제311조부터 제316조까지 규정한 것 외에는 공판준비·공판기일의 진술에 대신하는 서류, 공판 외 타인의 진술을 내용으로 하는 진술은 증거로 할 수 없다(전문법칙). 제312조 제3항: 사법경찰관이 작성한 피의자신문조서는 적법한 절차와 방식으로 작성되고 공판준비·공판기일에서 피고인 또는 변호인이 내용을 인정할 때에 한하여 증거로 할 수 있다.","source":"형사소송법 제308조의2·제309조·제310조·제310조의2·제312조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","tags":["증거","자백","전문법칙"]},{"id":"F26","front":"고소·고발 사건의 3개월 처리기한과 불송치 시 절차는? (2026.10.2. 시행)","back":"제238조: 사법경찰관이 고소·고발에 의하여 범죄를 수사할 때에는 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정. 제245조의5: 혐의가 인정되면 지체 없이 검사에게 송치·송부하고, 그 밖의 경우에는 이유를 명시한 서면과 함께 서류·증거물을 송부(검사는 송부받은 날부터 90일 이내 반환). 수사과정에서 생성한 문서·기록·자료 목록을 작성하여 함께 송부. 제245조의6: 불송치 시 송부한 날부터 7일 이내에 서면 통지하고 결정서·이의신청 안내·서식을 함께 보낸다. 제245조의7 제3항: 이의신청은 통지를 받은 날부터 3개월 이내(정당한 사유 시 6개월 범위 연장). 제257조: 검사는 송치·송부된 날부터 3개월 이내에 공소제기 여부를 결정.","source":"형사소송법 제238조·제245조의5~제245조의7·제257조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21). 연합뉴스 2026.8.4. 보도(경찰 3개월·검사 3개월)와 교차 확인.","tags":["수사","고소고발","2026개정"]}],"questions":[{"id":"FQ01","question":"형법 제1조에 관한 설명으로 옳은 것은?","choices":["범죄 후 법률이 변경되어 형이 구법보다 가벼워진 경우에는 구법에 따른다.","범죄 후 형이 구법보다 무거워진 경우에도 신법을 적용한다.","범죄의 성립과 처벌은 언제나 재판 시의 법률에 따른다.","재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되면 형의 집행을 면제한다."],"answer_index":3,"explanation":"제1조 제3항은 재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 된 경우에는 형의 집행을 면제한다고 규정한다.","choice_notes":["① X: 형이 가벼워진 경우에는 신법에 따른다.","② X: 형이 무거워진 경우에는 행위 시 법률(구법)에 따른다.","③ X: 원칙은 행위 시 법률이다.","④ O: 제1조 제3항 그대로이다."],"source":"형법 제1조","verified_note":"law.go.kr 형법 제1조 원문 대조(2026-11-21)","difficulty":"하"},{"id":"FQ02","question":"형법 제21조 제3항에 따라 벌하지 아니하는 경우는?","choices":["과잉방위를 한 경우 언제나","긴급피난에서 위난을 피하지 못할 책임이 있는 자가 행위한 경우","피해자의 승낙 없이 법익을 훼손한 경우","야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악·흥분·당황하였기 때문에 과잉방위를 한 경우"],"answer_index":3,"explanation":"제21조 제3항은 제2항(과잉방위)의 경우 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악·흥분·당황하였기 때문에 그 행위를 하였을 때에는 벌하지 아니한다고 규정한다.","choice_notes":["① X: 과잉방위는 원칙적으로 형의 임의적 감면 대상이다.","② X: 제22조 제2항에 따라 긴급피난 규정이 적용되지 않을 뿐 면제 규정이 아니다.","③ X: 피해자 승낙이 없으면 원칙적으로 위법하다.","④ O: 조문에 명시된 특례이다."],"source":"형법 제21조 제3항","verified_note":"law.go.kr 형법 제21조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ03","question":"형법 제32조 제2항에 따른 종범의 형은?","choices":["정범의 형과 동일하다.","정범의 형보다 가중한다.","정범의 형보다 감경한다.","정범의 형보다 감경할 수 있다."],"answer_index":2,"explanation":"제32조 제2항은 '종범의 형은 정범의 형보다 감경한다'고 규정하여 필요적 감경임을 명시한다.","choice_notes":["① X: 동일한 형은 교사범(제31조 제1항)이다.","② X: 가중 규정이 없다.","③ O: '감경한다'이므로 필요적 감경이다.","④ X: '감경할 수 있다'는 임의적 감경으로 규정된 것은 미수범(제25조 제2항) 등이다."],"source":"형법 제32조 제2항","verified_note":"law.go.kr 형법 제32조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ04","question":"형법 제35조의 누범 요건으로 옳은 것은?","choices":["금고 이상의 형을 선고받아 집행이 종료되거나 면제된 후 5년 내에 금고 이상의 죄를 지은 경우","벌금형을 선고받은 후 3년 내에 다시 벌금형에 해당하는 죄를 지은 경우","금고 이상의 형을 선고받아 집행이 종료되거나 면제된 후 3년 내에 금고 이상의 죄를 지은 경우","집행유예를 선고받은 후 3년 내에 다시 죄를 지은 경우"],"answer_index":2,"explanation":"제35조 제1항은 금고 이상의 형을 선고받아 그 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 지은 사람을 누범으로 처벌한다고 규정한다.","choice_notes":["① X: 기간은 5년이 아니라 3년이다.","② X: 벌금형은 누범의 전제가 되지 않는다.","③ O: 조문 그대로이다.","④ X: 집행유예만으로는 누범 요건을 충족하지 않는다."],"source":"형법 제35조","verified_note":"law.go.kr 형법 제35조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ05","question":"선고유예와 집행유예의 요건을 비교한 설명으로 옳은 것은?","choices":["집행유예는 1년 이하의 징역에 대해서만 가능하다.","선고유예는 1년 이하의 징역·금고, 자격정지 또는 벌금의 형을 선고할 경우에 가능하다.","집행유예 기간은 2년 이상 5년 이하이다.","선고유예는 3년 이하의 징역에 대해서만 가능하다."],"answer_index":1,"explanation":"제59조 제1항은 1년 이하의 징역이나 금고, 자격정지 또는 벌금의 형을 선고할 경우에 뉘우치는 정상이 뚜렷할 때 선고를 유예할 수 있다고 규정한다.","choice_notes":["① X: 집행유예는 3년 이하의 징역·금고 또는 500만원 이하의 벌금이다.","② O: 선고유예의 요건 그대로이다.","③ X: 집행유예 기간은 1년 이상 5년 이하이다.","④ X: 3년 이하 기준은 집행유예이다."],"source":"형법 제59조·제62조","verified_note":"law.go.kr 형법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ06","question":"형법 제78조의 형의 시효 기간에 관한 설명으로 옳은 것은?","choices":["무기의 징역 또는 금고는 15년이다.","10년 이상의 징역 또는 금고는 15년이다.","3년 이상의 징역 또는 금고는 15년이다.","구류 또는 과료는 3년이다."],"answer_index":1,"explanation":"제78조 제3호는 '10년 이상의 징역 또는 금고: 15년'으로 규정한다.","choice_notes":["① X: 무기의 징역·금고는 20년이다.","② O: 제78조 제3호.","③ X: 3년 이상의 징역·금고 또는 10년 이상의 자격정지는 10년이다.","④ X: 구류·과료는 1년이다."],"source":"형법 제78조","verified_note":"law.go.kr 형법 제78조 원문 대조(2026-11-21, 2023.8.8. 개정 반영)","difficulty":"상"},{"id":"FQ07","question":"2025.12.23. 개정된 형법 제347조(사기)의 법정형으로 옳은 것은?","choices":["10년 이하의 징역 또는 2천만원 이하의 벌금","20년 이하의 징역 또는 5천만원 이하의 벌금","15년 이하의 징역 또는 3천만원 이하의 벌금","무기 또는 5년 이상의 징역"],"answer_index":1,"explanation":"제347조 제1항은 2025.12.23. 개정으로 '20년 이하의 징역 또는 5천만원 이하의 벌금'으로 상향되었다.","choice_notes":["① X: 개정 전 법정형이다.","② O: 현행 조문 그대로이다.","③ X: 조문에 없는 형량이다.","④ X: 살인죄 등의 법정형이다."],"source":"형법 제347조","verified_note":"law.go.kr 형법 제347조 원문 대조(2026-11-21). '<개정 2025.12.23.>' 표기 확인","difficulty":"상"},{"id":"FQ08","question":"형법 제335조(준강도)에 관한 설명으로 옳은 것은?","choices":["준강도는 폭행·협박의 정도를 묻지 않고 항상 강도죄로 처벌된다.","절도 후 24시간이 지나면 준강도가 성립하지 않는다.","준강도는 절도죄와 강도죄의 상상적 경합이다.","절도가 재물의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행·협박하면 강도죄의 예에 따른다."],"answer_index":3,"explanation":"제335조는 절도가 재물의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행 또는 협박한 때에는 제333조 및 제334조의 예에 따른다고 규정한다.","choice_notes":["① X: 조문상 목적을 가진 폭행·협박이 요건이다.","② X: 24시간 제한 규정이 없다.","③ X: 준강도는 강도죄의 예에 따라 처벌하는 별도 규정이다.","④ O: 조문의 목적 3가지를 모두 포함한다."],"source":"형법 제335조","verified_note":"law.go.kr 형법 제335조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ09","question":"형법 제305조(미성년자에 대한 간음·추행)에 관한 설명으로 옳은 것은?","choices":["13세 이상 18세 미만의 사람에 대하여 간음·추행을 한 19세 이상의 자도 같은 예에 의한다.","13세 미만의 사람에 대하여 간음·추행을 하면 제297조 등의 예에 의한다.","16세 이상 19세 미만의 사람은 이 조의 보호대상이다.","13세 미만인 경우에는 폭행·협박이 있어야만 처벌된다."],"answer_index":1,"explanation":"제305조 제1항은 13세 미만의 사람에 대하여 간음 또는 추행을 한 자는 제297조·제297조의2·제298조·제301조 또는 제301조의2의 예에 의한다고 규정한다.","choice_notes":["① X: 제2항은 '13세 이상 16세 미만'이다.","② O: 제1항 그대로이다.","③ X: 제2항의 상한은 16세 미만이다.","④ X: 제305조는 폭행·협박을 요건으로 하지 않는 의제 규정이다."],"source":"형법 제305조","verified_note":"law.go.kr 형법 제305조 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ10","question":"2026.10.2. 시행 형사소송법상 수사와 공소제기의 주체에 관한 설명으로 옳은 것은?","choices":["검찰청이 수사와 기소를 모두 담당한다.","사법경찰관이 수사를 책임지고, 검사는 공소제기 및 공소유지를 책임진다.","검사가 직접 수사하고 사법경찰관은 보조한다.","중대범죄수사청은 공소제기를 담당한다."],"answer_index":1,"explanation":"제195조 제1항은 검사는 공소제기 및 공소유지를 책임지고, 사법경찰관은 수사를 책임진다고 규정한다. 2026.10.2.부터 검찰청법이 폐지되고 공소청이 출범하여 검사의 직접수사권이 폐지되었다.","choice_notes":["① X: 검찰청은 2026.10.2. 폐지되었다.","② O: 현행 제195조 제1항.","③ X: 개정 전 구조이다.","④ X: 중대범죄수사청은 수사기관이고 공소제기는 공소청 검사가 담당한다."],"source":"형사소송법 제195조","verified_note":"law.go.kr 형사소송법 원문 + 법무부·연합뉴스 2026.8.4. 보도 대조","difficulty":"중"},{"id":"FQ11","question":"형사소송법 제200조의2 제5항에 따라 체포한 피의자를 구속하려는 경우 구속영장을 청구하여야 하는 기한은?","choices":["체포한 때부터 10일 이내","체포한 때부터 24시간 이내","체포한 때부터 48시간 이내","체포한 때부터 72시간 이내"],"answer_index":2,"explanation":"제200조의2 제5항은 체포한 피의자를 구속하고자 할 때에는 체포한 때부터 48시간 이내에 구속영장을 청구하여야 하고, 그 기간 내에 청구하지 아니하면 즉시 석방하여야 한다고 규정한다.","choice_notes":["① X: 10일은 구속기간이다.","② X: 24시간은 긴급체포 후 압수(제217조) 등의 기한이다.","③ O: 48시간.","④ X: 72시간 규정이 없다."],"source":"형사소송법 제200조의2 제5항","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","difficulty":"하"},{"id":"FQ12","question":"2026.10.2. 시행 형사소송법상 구속기간에 관한 설명으로 옳은 것은?","choices":["구속기간의 연장은 10일 단위로 2회까지 허가할 수 있다.","사법경찰관은 구속한 때부터 10일 이내에 검사에게 인치하여야 한다.","사법경찰관의 구속기간은 20일이다.","검사는 피의자를 인치받은 때부터 1개월 이내에 공소를 제기하여야 한다."],"answer_index":1,"explanation":"제202조는 사법경찰관이 피의자를 구속한 때에는 10일 이내에 검사에게 인치하지 아니하면 석방하여야 한다고 규정한다. 제203조상 검사의 구속기간도 인치받은 때부터 10일이며, 제205조상 연장은 10일을 초과하지 않는 범위에서 1차에 한정된다.","choice_notes":["① X: 연장은 1차에 한정된다(제205조).","② O: 제202조.","③ X: 사법경찰관 구속기간은 10일이다.","④ X: 검사 구속기간은 10일이다(제203조)."],"source":"형사소송법 제202조·제203조·제205조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21). 2026.8.4. 개정 반영","difficulty":"상"},{"id":"FQ13","question":"형사소송법 제217조 제1항에 따라 긴급체포된 자가 소유·소지·보관하는 물건을 영장 없이 압수할 수 있는 기한은?","choices":["체포한 때부터 72시간 이내","체포한 때부터 24시간 이내","체포한 때부터 12시간 이내","체포한 때부터 48시간 이내"],"answer_index":1,"explanation":"제217조 제1항은 긴급히 압수할 필요가 있는 경우 체포한 때부터 24시간 이내에 한하여 영장 없이 압수·수색·검증을 할 수 있다고 규정한다. 계속 압수하려면 48시간 이내에 영장을 청구하여야 한다(제2항).","choice_notes":["① X: 72시간 규정이 없다.","② O: 제217조 제1항.","③ X: 12시간 규정이 없다.","④ X: 48시간은 계속 압수 시 영장 청구 기한이다."],"source":"형사소송법 제217조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ14","question":"형사소송법 제308조의2와 제310조에 관한 설명으로 옳은 것은?","choices":["적법한 절차에 따르지 아니하고 수집한 증거도 증명력만 인정되면 유죄의 증거로 할 수 있다.","위법수집증거 배제는 공판정에서만 적용된다.","피고인의 자백이 그에게 불이익한 유일한 증거인 때에는 유죄의 증거로 할 수 없다.","자백의 임의성은 문제되지 않고 보강증거만 있으면 된다."],"answer_index":2,"explanation":"제310조는 피고인의 자백이 그 피고인에게 불이익한 유일의 증거인 때에는 이를 유죄의 증거로 하지 못한다고 규정한다(자백의 보강법칙).","choice_notes":["① X: 제308조의2는 적법절차를 따르지 않은 증거를 증거로 할 수 없다고 규정한다.","② X: 위법수집증거 배제는 수사 단계의 위법까지 문제 삼는다.","③ O: 제310조 그대로이다.","④ X: 제309조가 자백의 임의성을 요구한다."],"source":"형사소송법 제308조의2·제309조·제310조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","difficulty":"중"},{"id":"FQ15","question":"2026.10.2. 시행 형사소송법상 고소·고발 사건 처리기한에 관한 설명으로 옳은 것은?","choices":["불송치 통지는 송부한 날부터 30일 이내에 하여야 한다.","사법경찰관의 처리기한은 6개월이다.","사법경찰관은 고소·고발을 수리한 날부터 3개월 이내에 송치 여부를 결정하여야 한다.","검사는 사건을 송치받은 날부터 1개월 이내에 공소제기 여부를 결정하여야 한다."],"answer_index":2,"explanation":"제238조는 사법경찰관이 고소 또는 고발에 의하여 범죄를 수사할 때에는 수리한 날부터 3개월 이내에 수사를 완료하여 송치 여부를 결정하여야 한다고 규정한다.","choice_notes":["① X: 불송치 통지는 송부한 날부터 7일 이내이다(제245조의6).","② X: 3개월이다.","③ O: 현행 제238조.","④ X: 검사는 송치·송부된 날부터 3개월 이내에 결정한다(제257조)."],"source":"형사소송법 제238조·제245조의6·제257조","verified_note":"law.go.kr 형사소송법 원문 대조(2026-11-21)","difficulty":"상"}]},{"id":"police_studies","name":"경찰학","description":"경찰행정법 35%, 기초이론 30%, 경찰행정학 15%, 분야별 경찰활동 15%, 역사·비교경찰 5%. 경찰관 직무집행법·경찰법·경찰공무원법·도로교통법·스토킹처벌법의 숫자를 중심으로 정리한다.","flashcards":[{"id":"P01","front":"경찰관 직무집행법의 목적과 직권 행사의 한계는?","back":"제1조 제1항: 국민의 자유와 권리 및 모든 개인이 가지는 불가침의 기본적 인권을 보호하고 사회공공의 질서를 유지하기 위한 경찰관(경찰공무원만 해당)의 직무 수행에 필요한 사항을 규정함을 목적으로 한다. 제2항: 이 법에 규정된 경찰관의 직권은 그 직무 수행에 필요한 최소한도에서 행사되어야 하며 남용되어서는 아니 된다.","source":"경찰관 직무집행법 제1조","verified_note":"law.go.kr 경찰관 직무집행법(법률 제21304호, 시행 2026.7.7.) 제1조 원문 대조(2026-11-21)","tags":["직무집행법","비례원칙"]},{"id":"P02","front":"경찰관 직무집행법 제2조가 정한 경찰관의 직무 범위(각 호)를 모두 말하면?","back":"① 국민의 생명·신체 및 재산의 보호 ② 범죄의 예방·진압 및 수사 ②의2 범죄피해자 보호 ③ 경비, 주요 인사 경호 및 대간첩·대테러 작전 수행 ④ 공공안녕에 대한 위험의 예방과 대응을 위한 정보의 수집·작성 및 배포 ⑤ 교통 단속과 교통 위해의 방지 ⑥ 외국 정부기관 및 국제기구와의 국제협력 ⑦ 그 밖에 공공의 안녕과 질서 유지. (제1호·제2호·제2호의2·제3호~제7호로 모두 8개 항목)","source":"경찰관 직무집행법 제2조","verified_note":"law.go.kr 경찰관 직무집행법 제2조 원문 대조(2026-11-21)","tags":["직무집행법","직무범위"]},{"id":"P03","front":"불심검문의 대상·동행 요구·흉기 조사·동행 시간은?","back":"제3조 제1항: ① 수상한 행동이나 주위 사정을 합리적으로 판단하여 죄를 범하였거나 범하려 하고 있다고 의심할 만한 상당한 이유가 있는 사람 ② 이미 행하여진 범죄나 행하여지려고 하는 범죄행위에 관한 사실을 안다고 인정되는 사람을 정지시켜 질문할 수 있다. 제2항: 질문이 불리하거나 교통에 방해가 되면 가까운 경찰서·지구대·파출소·출장소로 동행을 요구할 수 있고, 요구받은 사람은 거절할 수 있다. 제3항: 흉기를 가지고 있는지 조사할 수 있다. 제6항: 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다.","source":"경찰관 직무집행법 제3조","verified_note":"law.go.kr 경찰관 직무집행법 제3조 원문 대조(2026-11-21). 동행 시간은 '6시간'임을 확인.","tags":["직무집행법","불심검문"]},{"id":"P04","front":"보호조치 대상·기간과 위험물 임시영치 기간은?","back":"제4조 제1항: 수상한 행동 등 주위 사정을 합리적으로 판단하여 ① 정신착란 또는 술에 취하여 자신·다른 사람의 생명·신체·재산에 위해를 끼칠 우려가 있는 사람 ② 자살을 시도하는 사람 ③ 미아·병자·부상자 등으로 적당한 보호자가 없고 응급구호가 필요하다고 인정되는 사람(본인이 구호를 거절하면 제외)이 명백하고 응급구호가 필요하다고 믿을 만한 상당한 이유가 있으면 보건의료기관·공공구호기관에 긴급구호를 요청하거나 경찰관서에 보호하는 등 조치할 수 있다. 제7항: 경찰관서 보호기간은 24시간을 초과할 수 없고, 위험물 임시영치는 10일을 초과할 수 없다.","source":"경찰관 직무집행법 제4조","verified_note":"law.go.kr 경찰관 직무집행법 제4조 원문 대조(2026-11-21)","tags":["직무집행법","보호조치"]},{"id":"P05","front":"위험 발생 방지·범죄의 예방과 제지·위험 방지를 위한 출입의 요건은?","back":"제5조 제1항: 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 천재·사변·인공구조물의 파손·붕괴·교통사고·위험물의 폭발·위험한 동물의 출현·극도의 혼잡 등 위험한 사태가 있을 때 경고, 이동 제한·대피, 퇴거·접근 금지, 필요한 조치 명령·직접 조치를 할 수 있다. 제6조: 범죄행위가 목전에 행하여지려고 하면 경고하고, 생명·신체에 위해 또는 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 제지할 수 있다. 제7조: 제5조·제6조의 위험한 사태로 위해가 임박한 때 부득이하면 필요한 한도에서 타인의 토지·건물·배·차에 출입할 수 있다.","source":"경찰관 직무집행법 제5조~제7조","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21)","tags":["직무집행법","위험방지"]},{"id":"P06","front":"경찰관 직무집행법상 손실보상의 요건과 청구권 시효는?","back":"제11조의2 제1항: 국가는 경찰관의 적법한 직무집행으로 인하여 ① 손실발생의 원인에 대하여 책임이 없는 자가 생명·신체·재산상 손실을 입은 경우(자발적 협조·물건 제공 포함) ② 책임이 있는 자가 자신의 책임에 상응하는 정도를 초과하는 손실을 입은 경우에 정당한 보상을 하여야 한다. 제2항: 보상 청구권은 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효로 소멸한다. 제3항: 손실보상심의위원회를 둔다.","source":"경찰관 직무집행법 제11조의2","verified_note":"law.go.kr 경찰관 직무집행법 제11조의2 원문 대조(2026-11-21)","tags":["직무집행법","손실보상"]},{"id":"P07","front":"경찰장비·경찰장구·분사기 사용의 법적 근거와 정의는?","back":"제10조: 경찰관은 직무수행 중 경찰장비를 사용할 수 있고, 위해성 경찰장비는 필요한 안전교육·안전검사를 받은 후 사용하여야 하며 필요한 최소한도에서 사용. '경찰장비'란 무기, 경찰장구, 경찰착용기록장치, 최루제와 그 발사장치, 살수차, 감식기구, 해안 감시기구, 통신기기, 차량·선박·항공기 등. 제10조의2: 경찰장구는 수갑, 포승, 경찰봉, 방패 등. 제10조의3: 분사기·최루탄은 현장책임자가 판단하여 필요한 최소한의 범위에서 사용(범인 체포·도주 방지, 불법집회·시위로 인한 현저한 위해 발생 억제).","source":"경찰관 직무집행법 제10조·제10조의2·제10조의3","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21)","tags":["직무집행법","경찰장비"]},{"id":"P08","front":"무기 사용이 허용되는 요건과 '3회 이상 명령' 규정은?","back":"제10조의4 제1항: 범인의 체포, 도주 방지, 자신·다른 사람의 생명·신체 방어·보호, 공무집행에 대한 항거 제지를 위하여 필요하다고 인정되는 상당한 이유가 있을 때 사태를 합리적으로 판단하여 필요한 한도에서 무기를 사용할 수 있다. 다만 ① 형법상 정당방위·긴급피난에 해당할 때 ② 다음 각 목의 어느 하나에 해당하여 무기를 사용하지 아니하고는 다른 수단이 없다고 인정되는 상당한 이유가 있을 때를 제외하고는 사람에게 위해를 끼쳐서는 아니 된다. 그 각 목에는 사형·무기 또는 장기 3년 이상의 죄를 범한 사람이 항거·도주하려 할 때, 영장 집행 과정에서 항거·도주하려 할 때, 제3자가 도주시키려 항거할 때, 범인·소요를 일으킨 사람이 무기·흉기 등 위험한 물건을 지니고 '3회 이상' 물건을 버리라는 명령이나 항복하라는 명령을 받고도 따르지 아니하면서 계속 항거할 때가 포함된다.","source":"경찰관 직무집행법 제10조의4","verified_note":"law.go.kr 경찰관 직무집행법 제10조의4 원문 대조(2026-11-21)","tags":["직무집행법","무기사용"]},{"id":"P09","front":"경찰착용기록장치(바디캠)의 사용 사유와 고지·보관 의무는?","back":"제10조의5(2024.1.30. 신설): ① 피의자 체포·구속(형소법 제200조의2·제200조의3·제201조·제212조) ② 범죄 수사를 위하여 범행 중이거나 직전·직후이고 증거보전의 필요성·긴급성이 모두 갖추어진 경우 ③ 제5조 제1항의 위험한 사태 ④ 기록대상자의 요청·동의 ⑤ 제4조 제1항의 응급구호 ⑥ 제6조의 범죄 예방·제지 ⑦ 해양경비법상 검문검색·추적·나포 ⑧ 수난구호 ⑨ 그 밖에 대통령령이 정하는 경우에 필요한 최소한의 범위에서 사용할 수 있다. 제10조의6: 촬영 사실을 불빛·소리·안내판 등으로 표시·고지하여야 하고, 기록은 지체 없이 관리체계에 전송·저장하며 임의로 편집·복사·삭제하여서는 아니 된다.","source":"경찰관 직무집행법 제10조의5·제10조의6","verified_note":"law.go.kr 경찰관 직무집행법 원문 대조(2026-11-21). 본조신설 2024.1.30. 표기 확인","tags":["직무집행법","바디캠","최신"]},{"id":"P10","front":"경찰관 직무집행법 위반의 벌칙은?","back":"제12조: 이 법에 규정된 경찰관의 의무를 위반하거나 직권을 남용하여 다른 사람에게 해를 끼친 사람은 1년 이하의 징역이나 금고 또는 300만원 이하의 벌금에 처한다.","source":"경찰관 직무집행법 제12조","verified_note":"law.go.kr 경찰관 직무집행법 제12조 원문 대조(2026-11-21)","tags":["직무집행법","벌칙"]},{"id":"P11","front":"경찰법상 경찰의 임무 8가지와 자치경찰사무의 수사사무 6종은?","back":"제3조 임무: ① 국민의 생명·신체 및 재산의 보호 ② 범죄의 예방·진압 및 수사 ③ 범죄피해자 보호 ④ 경비·요인경호 및 대간첩·대테러 작전 수행 ⑤ 공공안녕에 대한 위험의 예방과 대응을 위한 정보의 수집·작성 및 배포 ⑥ 교통의 단속과 위해의 방지 ⑦ 외국 정부기관 및 국제기구와의 국제협력 ⑧ 그 밖에 공공의 안녕과 질서유지. 제4조 제1항 제2호 라목의 자치경찰 수사사무: ① 학교폭력 등 소년범죄 ② 가정폭력·아동학대 범죄 ③ 교통사고 및 교통 관련 범죄 ④ 형법 제245조 공연음란 및 성폭력처벌법 제12조(성적 목적 다중이용장소 침입) ⑤ 경범죄·기초질서 관련 범죄 ⑥ 가출인 및 실종아동등 관련 수색·범죄.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제3조·제4조","verified_note":"law.go.kr 경찰법(법률 제22015호, 시행 2026.10.2.) 원문 대조(2026-11-21)","tags":["경찰법","임무","자치경찰"]},{"id":"P12","front":"국가경찰위원회의 구성·임기·결격사유는?","back":"제7조: 행정안전부에 두고, 위원장 1명을 포함한 7명의 위원으로 구성하되 위원장 및 5명은 비상임, 1명은 상임(정무직). 제8조: 위원은 행정안전부장관의 제청으로 국무총리를 거쳐 대통령이 임명하고, 위원 중 2명은 법관의 자격이 있는 사람이어야 하며, 특정 성이 10분의 6을 초과하지 않도록 노력. 제9조: 임기 3년, 연임할 수 없다. 제11조 제2항: 회의는 재적위원 과반수 출석과 출석위원 과반수 찬성으로 의결.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제7조~제11조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","tags":["경찰법","국가경찰위원회"]},{"id":"P13","front":"경찰청장과 국가수사본부장의 임기·임명절차는?","back":"제14조: 경찰청장은 치안총감으로 보하고, 국가경찰위원회의 동의를 받아 행정안전부장관의 제청으로 국무총리를 거쳐 대통령이 임명하며 국회 인사청문을 거친다. 임기는 2년으로 하고 중임할 수 없다. 제16조: 국가수사본부장은 치안정감으로 보하고, 임기는 2년으로 하며 중임할 수 없고, 임기가 끝나면 당연히 퇴직한다.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제14조·제16조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","tags":["경찰법","경찰청장","국가수사본부장"]},{"id":"P14","front":"시·도자치경찰위원회의 구성과 위원 추천 주체는?","back":"제19조: 위원장 1명을 포함한 7명의 위원으로 구성하되, 위원장과 1명의 위원은 상임, 5명은 비상임. 제20조 제1항: ① 시·도의회가 추천하는 2명 ② 국가경찰위원회가 추천하는 1명 ③ 해당 시·도 교육감이 추천하는 1명 ④ 시·도자치경찰위원회 위원추천위원회가 추천하는 2명 ⑤ 시·도지사가 지명하는 1명을 시·도지사가 임명한다. 제23조: 위원장과 위원의 임기는 3년, 연임할 수 없다.","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제19조·제20조·제23조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21). 국가경찰위원회(위원장+5 비상임+1 상임)와 구성이 다름을 확인.","tags":["경찰법","자치경찰위원회"]},{"id":"P15","front":"시·도경찰청장의 지휘·감독 체계와 경찰청장의 비상사태 직접 지휘 요건은?","back":"제28조 제3항: 시·도경찰청장은 국가경찰사무에 대해서는 경찰청장의, 자치경찰사무에 대해서는 시·도자치경찰위원회의 지휘·감독을 받고, 수사에 관한 사무에 대해서는 국가수사본부장의 지휘·감독을 받는다. 제32조 제1항: ① 전시·사변, 천재지변 등 국가 비상사태, 대규모 테러·소요사태 ② 다수의 시·도에 동일하게 적용되는 치안정책 시행 필요 ③ 해당 시·도 경찰력으로는 국민의 생명·신체·재산 보호가 어려워 지원·조정이 필요한 경우에 자치경찰사무 수행 경찰공무원을 직접 지휘·명령할 수 있다(제3호는 미리 국가경찰위원회 의결, 긴급 시 우선 조치 후 지체 없이 의결).","source":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제28조·제32조","verified_note":"law.go.kr 경찰법 원문 대조(2026-11-21)","tags":["경찰법","지휘체계"]},{"id":"P16","front":"경찰공무원의 임용권자와 시보임용 기간·산입 제외 기간은?","back":"경찰공무원법 제7조: 총경 이상은 경찰청장·해양경찰청장의 추천을 받아 행정안전부장관·해양수산부장관의 제청으로 국무총리를 거쳐 대통령이 임용(총경의 전보·휴직·직위해제·강등·정직·복직은 경찰청장 등이 함). 경정 이하는 경찰청장·해양경찰청장이 임용하되, 경정으로의 신규채용·승진임용·면직은 대통령이 한다. 제13조: 경정 이하 신규채용 시 1년간 시보로 임용하고 그 기간이 만료된 다음 날 정규 경찰공무원으로 임용. 휴직기간, 직위해제기간, 징계에 의한 정직·감봉처분을 받은 기간은 시보임용기간에 산입하지 않는다.","source":"경찰공무원법 제7조·제13조","verified_note":"law.go.kr 경찰공무원법(법률 제20646호, 시행 2025.1.7.) 원문 대조(2026-11-21)","tags":["경찰공무원법","임용","시보"]},{"id":"P17","front":"경찰공무원의 정년과 근속승진 기간은?","back":"제30조: 연령정년 60세. 계급정년은 치안감 4년, 경무관 6년, 총경 11년, 경정 14년. 정년이 된 날이 1월~6월 사이면 6월 30일, 7월~12월 사이면 12월 31일에 당연퇴직. 제16조 근속승진: 순경→경장 4년 이상, 경장→경사 5년 이상, 경사→경위 6년 6개월 이상, 경위→경감 8년 이상 근속자.","source":"경찰공무원법 제16조·제30조","verified_note":"law.go.kr 경찰공무원법 원문 대조(2026-11-21)","tags":["경찰공무원법","정년","근속승진"]},{"id":"P18","front":"경찰공무원 징계위원회의 관할은?","back":"제32조: 경무관 이상 경찰공무원에 대한 징계의결은 국가공무원법에 따라 국무총리 소속으로 설치된 징계위원회에서 한다. 총경 이하 경찰공무원에 대한 징계의결을 하기 위하여 대통령령으로 정하는 경찰기관 및 해양경찰관서에 경찰공무원 징계위원회를 둔다.","source":"경찰공무원법 제32조","verified_note":"law.go.kr 경찰공무원법 제32조 원문 대조(2026-11-21)","tags":["경찰공무원법","징계"]},{"id":"P19","front":"도로교통법상 음주운전 기준과 재범 가중 처벌은?","back":"제44조 제4항: 운전이 금지되는 술에 취한 상태의 기준은 혈중알코올농도 0.03퍼센트 이상. 제5항: 음주측정을 곤란하게 할 목적으로 추가로 술을 마시거나 혈중알코올농도에 영향을 줄 수 있는 물품을 사용하는 행위(음주측정방해행위) 금지. 제148조의2 제1항: 음주운전으로 벌금 이상의 형이 확정된 날부터 10년 내 다시 위반하면 ① 제44조 제2항·
