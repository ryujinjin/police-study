rantingham)과 파우스트(Faust)의 2차적 범죄예방은 범죄자들이 더 이상 범죄를 저지르지 못하도록 상습범 대책 및 재범억제를 지향하는 범죄예방 전략을 말하며, 교화‧개선‧전환 제도에 중점을 둔다. ㉡ 뉴먼(Newman)이 주장한 방어공간이론은 영역성, 감시, 이미지, 입지조건(환경)을 구성요소로 하고 있다. ㉢ 샘슨 등(Sampson et al.)이 주장한 집합효율성이론은 공식적 사회통제, 즉 경찰 등 법집행기관의 중요성을 간과하고 있다는 한계가 있다. ㉣ 코헨(Cohen)과 펠슨(Felson)의 일상활동이론에서는 동기가 부여된 잠재적 범죄자, 범행의 기술, 보호자(감시자)의 부재를 범행발생의 3요소로 하고 있다. ㉠ ㉡ ㉢ ㉣","(X) (O) (O) (X)","(X) (O) (X) (X)","(O) (O) (O) (X)","(O) (X) (X) (O)",0,0,""],["2025-2","경찰학",12,"지역사회 경찰활동에 관한 설명으로 가장 적절하지 않은 것은?","지역사회 경찰활동은 범죄 및 무질서에 대한 문제를 해결함에 있어서 경찰과 지역사회 양자를 참여시키는 협력관계를 중요 하게 여긴다.","지역사회 경찰활동은 지역사회와의 협력, 경찰조직의 분권화 등을 중요하게 여긴다.","지역사회 경찰활동 프로그램에는 경찰과 주민 사이에 의사 소통을 강화하는 이웃지향적 경찰활동이 있다.","지역사회 경찰활동의 효과성은 신고에 대한 경찰의 출동시간으로 결정하며, 능률성은 체포율과 적발건수로 결정한다.",3,0,""],["2025-2","경찰학",13,"외국경찰제도에 관한 설명으로 가장 적절하지 않은 것은?","영국에서는 로버트 필 경(Sir Robert Peel)의 제안으로 1829년 수도경찰청(Metropolitan Police Service)이 설립되었다.","독일에서는 제2차 세계대전 이후 연합국에 의하여 협의의 행정 경찰사무를 경찰로부터 분리하는 비(탈)경찰화가 추진되었다.","일본에서는 1차적 수사기관인 경찰과 2차적 수사기관인 검사가 대등적･협력적 관계를 이루고 있다.","미국에서는 중앙집권적인 경찰제도를 운영하고 있으며, 경찰 조직은 일반적으로 연방, 주, 시‧군 수준에 설치되어 있다.",3,0,""],["2025-2","경찰학",14,"다음은 1991년 제정된 ｢경찰법｣의 의의 및 평가이다. 이와 관련된 설명으로 가장 적절하지 않은 것은? ∙경찰민주화 및 정치적 중립성 확보에 대한 국민적 열망을 반영하여 제정되었으며, 이를 통하여 정부수립 이후 최초로 독립적인 경찰기구가 만들어졌다. ∙기존보다 경찰의 독립성 및 경찰에 대한 민주적 통제가 강화 되었으며 지방행정과의 연계를 위한 여건이 조성되었으나 경찰이 선거부처로부터완전히독립하지는못하였다는평가를동시에받는다.","경찰의 정치적 중립성 및 독립성 확보를 위하여 경찰청을 내무부의 외청으로 설치하였다.","분단국가로서 특수한 안보상황을 고려하여 보안경찰 업무는 국가안전기획부로 이양하였다.","경찰에 대한 민주적 통제를 위하여 경찰위원회 제도를 도입하였다.","치안행정과 지방행정 간의 협조를 위하여 치안행정협의회를 설치하였다.",1,0,""],["2025-2","경찰학",15,"｢지방자치법｣상 자치법규에 관한 설명으로 가장 적절한 것은?","지방자치단체의 장은 법령의 범위에서 그 사무에 관하여 조례를 제정할 수 있다. 다만, 주민의 권리 제한 또는 의무 부과에 관한 사항이나 벌칙을 정하는 때에는 법률의 위임이 있어야 한다.","지방자치단체는 조례를 위반한 행위에 대하여 조례로써 1천만원 이하의 벌금을 정할 수 있고, 해당 지방자치단체의 장이 부과‧ 징수한다.","조례안이 지방의회에서 의결되면 지방의회의 의장은 의결된 날부터 7일 이내에 그 지방자치단체의 장에게 이송하여야 한다.","법령에서 조례로 정하도록 위임한 사항은 그 법령의 하위 법령에서 그 위임의 내용과 범위를 제한하거나 직접 규정할 수 없다.",3,0,""],["2025-2","경찰학",16,"경찰행정법의 법원(法源)에 관한 설명으로 가장 적절하지 않은 것은?","헌법에 의하여 체결‧공포된 조약이나 일반적으로 승인된 국제 법규도 국내법과 같은 효력을 가지므로 경찰행정법의 법원이 된다.","법규명령은 국민과 행정청을 동시에 구속하는 양면적 구속력을 가짐으로써 재판규범성이 있다.","대통령령, 총리령 및 부령은 특별한 규정이 없으면 공포한 날부터 15일이 경과함으로써 효력이 발생한다.","법규명령의 한계로 행정권에 대한 입법권의 일반적‧포괄적 위임은 인정될 수 없고, 국회 전속적 법률사항의 위임은 금지 되며 법률에 의하여 위임된 사항을 전부 하위명령으로 재위임 하는 것은 금지된다.",2,0,""],["2025-2","경찰학",17,"행정법상 신뢰보호의 원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","이 원칙은 법치국가의 원리 및 그 구성 부분으로서의 법적 안정성으로부터 이론적 근거를 도출할 수 있다.","신뢰보호의 원칙을 위반한 행정청의 행위는 위헌·위법의 문제가 발생하는데 위법의 효과는 해당 행정행위를 취소할 수 있으며 그 위법성이 중대‧명백한 경우 무효가 된다.","운전면허 취소사유에 해당하는 음주운전을 적발한 경찰관의 소속 경찰서장이 사무착오로 위반자에게 운전면허정지처분을 한 상태에서 위반자의 주소지 관할 지방경찰청장이 위반자에게 운전면허취소처분을 한 것은 선행처분에 대한 당사자의 신뢰 및 법적 안정성을 저해하는 것으로서 허용될 수 없다.","헌법재판소의 위헌결정은 신뢰의 대상이 되는 공적인 견해이므로 신뢰보호의 원칙이 적용된다.",3,0,""],["2025-2","경찰학",18,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣상 시･도자치경찰위원회의 소관 사무로 가장 적절하지 않은 것은?","자치경찰사무에 관한 인사, 예산, 장비, 통신 등에 관한 주요 정책 및 그 운영지원","자치경찰사무 담당 공무원의 부패 방지와 청렴도 향상에 관한 주요 정책 및 인권침해 또는 권한남용 소지가 있는 규칙, 제도, 정책, 관행 등의 개선","시‧도경찰청장의 임용과 관련한 시‧도지사와의 협의","정기적으로 경찰서장의 자치경찰사무 수행에 관한 평가결과를 경찰청장에게 통보",2,0,""],["2025-2","경찰학",19,"｢경찰공무원 징계령 세부시행규칙｣에 관한 설명으로 가장 적절한 것은?","징계의결요구권자는 공금횡령‧유용 및 업무상 배임의 금액이 100만원 이상일 경우에는 중징계 의결을 요구하여야 한다.","징계요구권자 또는 징계위원회는 감독자가 부임기간이 3개월 미만으로 부하직원에 대한 실질적인 감독이 곤란하다고 인정된 때에는 징계책임을 감경하여 징계의결 요구 또는 징계의결하거나 징계책임을 묻지 아니할 수 있다.","징계의결요구권자 또는 징계위원회는 서로 관련이 없는 2개 이상의 의무위반행위가 경합될 때에는 그 중 책임이 중한 의무위반행위에 해당하는 징계보다 2단계 위의 징계의결 요구 또는 징계의결을 할 수 있다.","징계위원회는 징계의결이 요구된 자가 ｢모범공무원규정｣에 따라 모범공무원으로 선발된 공적이 있어도 징계의결이 요구된 자의 의무위반행위가 직무상 미공개 정보를 이용한 부당행위에 해당 하는 경우는 징계를 감경할 수 없다.",3,0,""],["2025-2","경찰학",20,"｢경찰 감찰 규칙｣에 관한 설명으로 가장 적절하지 않은 것은?","감찰관은 소속공무원의 의무위반사실에 대한 민원을 접수한 경우 접수일로부터 2개월 내에 신속히 처리하여야 한다. 다만, 부득이한 사유로 민원을 기한 내에 처리할 수 없을 때에는 소속 경찰기관의 감찰부서장에게 보고하여 그 처리 기간을 연장할 수 있다.","감찰관은 감찰조사를 위해서 조사대상자의 출석을 요구할 때에는 조사기일 3일 전까지 출석요구서 또는 구두로 조사일시, 의무 위반행위사실 요지 등을 통지하여야 한다. 다만, 사안이 급박한 경우 또는 조사대상자의 요청이 있는 경우에는 즉시 조사에 착수할 수 있다.","감찰정보심의회는 위원장을 포함한 5명 이상 7명 이하의 위원으로 구성하며, 위원장은 감찰부서장이 되고 위원은 감찰부서장이 소속 공무원 중에서 지명한다.","감찰관은 검찰‧경찰, 그 밖의 수사기관으로부터 수사개시 통보를 받은 경우에는 징계의결요구권자의 결재를 받아 해당 기관으로부터 수사결과의 통보를 받을 때까지 감찰조사, 징계 의결요구 등의 절차를 진행하지 아니 할 수 있다.",2,1,"경찰 감찰 규칙의 '검찰·경찰' 표현은 기관 명칭 변경(검찰청→공소청) 반영 여부를 확인해야 합니다."],["2025-2","경찰학",21,"｢경찰관 직무집행법｣ 및 동법 시행령상 범인검거 등 공로자 보상에 관한 설명으로 가장 적절하지 않은 것은?","경찰청장, 해양경찰청장, 시‧도경찰청장, 지방해양경찰청장, 경찰서장 또는 해양경찰서장은 범인 검거와 관련하여 경찰 수사 활동에 협조한 사람 중 보상금 지급 대상자에 해당한다고 보상금 심사위원회가 인정하는 사람에게 보상금을 지급할 수 있다.","경찰청장, 해양경찰청장, 시‧도경찰청장, 지방해양경찰청장, 경찰서장 또는 해양경찰서장은 보상금 지급사유가 발생한 경우에는 직권으로 또는 보상금을 지급받으려는 사람의 신청에 따라소속보상금심사위원회의심사‧의결을거쳐보상금을지급한다.","보상금심사위원회 위원의 과반수는 경찰관이 아닌 사람으로 해야 한다.","경찰청장, 해양경찰청장, 시‧도경찰청장, 지방해양경찰청장, 경찰서장 또는 해양경찰서장은 보상금심사위원회의 심사‧의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수한다.",2,0,""],["2025-2","경찰학",22,"｢경찰관의 정보수집 및 처리 등에 관한 규정｣에 대한 설명으로 가장 적절하지 않은 것은?","공공안녕에 대한 위험의 예방과 대응을 위한 정보의 수집‧ 작성‧배포와 이에 수반되는 사실의 확인을 위해 경찰관이 수행하는 활동은 국가의 존립과 기능을 보호하는 것을 목적으로 해야 하며, 필요 최소한의 범위에 그쳐야 한다.","경찰관이 ｢경찰관 직무집행법｣ 제8조의2 제1항에 따라 수집‧ 작성‧배포할 수 있는 정보의 구체적인 범위에는 도로 교통의 위해 방지‧제거 및 원활한 소통 확보를 위한 정보가 포함된다.","경찰관은 정보를 제공하거나 사실을 확인해 준 자가 신분이나 처우와 관련하여 불이익을 받지 않도록 비밀유지 등 필요한 조치를 해야 한다.","경찰관은 공공안녕에 대한 위험의 예방과 대응을 위해 필요한 경우에는 수집‧작성한 정보를 관계 기관 등에 통보할 수 있다.",0,0,""],["2025-2","경찰학",23,"｢행정절차법｣상처분에관한설명으로가장적절하지않은 것은?","행정청은 신청에 구비서류의 미비 등 흠이 있는 경우에는 보완에 필요한 상당한 기간을 정하여 지체 없이 신청인에게 보완을 요구하여야 한다.","행정청은 당사자에게 의무를 부과하거나 권익을 제한하는 처분을 하는 경우에는 미리 당사자등에게 통지하여야 한다. 다만, 공공의 안전 또는 복리를 위하여 긴급히 처분을 할 필요가 있는 경우에는 통지하지 아니할 수 있다.","행정청은 처분 후 2년 이내에 당사자등이 요청하는 경우에는 청문‧공청회 또는 의견제출을 위하여 제출받은 서류나 그 밖의 물건을 반환할 수 있다.","행정청은 청문‧공청회 또는 의견제출을 거쳤을 때에는 신속히 처분하여 해당 처분이 지연되지 아니하도록 하여야 한다.",2,0,""],["2025-2","경찰학",24,"｢경찰관 직무집행법｣ 제11조의5에 따른 ‘직무 수행으로 인한 형의 감면’의 대상이 되는 범죄에 해당하는 것은 모두 몇 개인가? ㉠ ｢형법｣ 제2편 제24장 살인의 죄 ㉡ ｢형법｣ 제2편 제32장 강간과 추행의 죄 중 강제추행에 관한 범죄 ㉢ ｢아동학대범죄의 처벌 등에 관한 특례법｣에 따른 아동학대범죄 ㉣ ｢가정폭력범죄의 처벌 등에 관한 특례법｣에 따른 가정폭력범죄","1개","2개","3개","4개",2,0,""],["2025-2","경찰학",25,"｢공직자윤리법｣상 등록재산의 공개대상자에 해당하지 않는 경찰공무원은?","충청북도경찰청장 치안감 A","세종특별자치시경찰청장 경무관 B","경찰청 국제협력관 경무관 C","경찰청 기획조정관 치안감 D",2,0,""],["2025-2","경찰학",26,"국가배상에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","지방자치단체가 ‘교통할아버지 봉사활동 계획’을 수립한 후 관할 동장으로 하여금 ‘교통할아버지’를 선정하게 하여 어린이 보호, 교통안내, 거리질서 확립 등의 공무를 위탁하여 집행하게 하던 중 ‘교통할아버지’로 선정된 노인이 위탁받은 업무 범위를 넘어 교차로 중앙에서 교통정리를 하다가 교통사고를 발생시킨 경우, 지방자치단체가 ｢국가배상법｣ 제2조 소정의 배상책임을 부담한다.","지방자치단체장이 설치하여 관할 지방경찰청장에게 관리권한이 위임된 교통신호기의 고장으로 인하여 교통사고가 발생한 경우, 지방자치단체뿐만 아니라 경찰관들의 봉급을 부담하는 국가도 손해배상책임이 인정된다.","음주운전으로 적발된 주취운전자가 도로 밖으로 차량을 이동 하겠다며 단속경찰관으로부터 보관중이던 차량열쇠를 반환받아 몰래 차량을 운전하여 가던 중 사고를 일으킨 경우, 국가배상 책임을 인정한다.","군인‧군무원‧경찰공무원 또는 예비군대원이 전투‧훈련 등 직무 집행과 관련하여 전사‧순직하거나 공상을 입은 경우, 유족이 다른 법령에 따라 재해보상금‧유족연금‧상이연금 등의 보상을 지급받을 수 있을 때에는 ｢국가배상법｣ 및 ｢민법｣에 따른 손해배상 및 위자료를 청구할 수 없다.",3,0,""],["2025-2","경찰학",27,"｢행정심판법｣에 관한 설명으로 가장 적절하지 않은 것은?","행정청의 처분 또는 부작위에 대하여는 다른 법률에 특별한 규정이 있는 경우 외에는 이 법에 따라 행정심판을 청구할 수 있다. 다만, 대통령의 처분 또는 부작위에 대하여는 다른 법률에 특별한 규정이 있는 경우 외에는 행정심판을 청구할 수 없다.","행정심판위원회는 무효등확인심판의 청구가 이유가 있다고 인정 하면 처분의 효력 유무 또는 처분의 존재 여부를 확인한다.","심판청구는 처분의 효력이나 그 집행 또는 절차의 속행에 영향을 주지 아니한다.","행정심판의 재결은 행정심판위원회 또는 피청구인의 행정청이 심판청구서를 받은 날부터 60일 이내에 하여야 한다. 다만, 부득이한 사정이 있는 경우에는 위원장이 직권으로 60일을 연장할 수 있다.",3,0,""],["2025-2","경찰학",28,"경찰조직편성의 원리에 관한 설명으로 가장 적절한 것은?","계층제의 원리에 의하면 계층이 많을수록 업무처리가 신속하고 계층 간의 갈등이 감소한다.","통솔범위의 원리에 의하면 계층의 수, 업무의 복잡성 및 조직 규모의 크기와 통솔의 범위는 정비례 관계이다.","분업의 원리에 의하면 분업화가 안 될수록 조정과 통합이 어려워지며 할거주의를 초래할 수 있다.","조정과 통합의 원리에 의하면 조직의 조정과 통합은 집단적 노력을 질서있게 배열하고 조직 및 구성원의 행동을 통일시키는 작용을 함으로써 경찰행정의 목표를 달성할 수 있게 한다.",3,0,""],["2025-2","경찰학",29,"계급제와 직위분류제에 관한설명으로옳은것은모두몇개인가? ㉠ 계급제는 사람중심의 분류방법으로 널리 일반적 교양과 능력을 가진 사람을 채용하여 신분보장과 함께 장기간에 걸쳐 능력이 키워지므로 공무원이 보다 종합적이며 신축적인 대응역량을 가질 수 있다. ㉡ 직위분류제는 공무원이 동일한 직무를 장기간 담당하게 되어 행정의 전문화에 유용하지만, 권한과 책임의 한계가 불명확하다. ㉢ 계급제는 폐쇄형 충원방식으로 공무원에 대한 인사배치가 자유롭지 않으나, 직위분류제는 개방형 충원방식으로 공무원에 대한 인사배치가 자유롭다. ㉣ 직위분류제는 계급제에 비해서 보수결정의 합리적인 기준을 제시할 수 있으며, 직무분석을 통해 부서 간, 기관 간 협조 및 조정이 용이하다.","1개","2개","3개","4개",0,0,""],["2025-2","경찰학",30,"동기부여이론에 관한 설명으로 가장 적절한 것은?","매슬로우(Maslow)의 욕구단계이론에 의하면 인간의 욕구는 우선순위의 계층을 이루며 상위욕구로부터 하위욕구로 욕구를 추구한다고 한다.","맥그리거(McGregor)의 X이론에 의하면 인간은 부지런하고 책임성과 자율성을 발휘하기를 좋아하므로 민주적이고 인간적인 동기유발전략이 필요하다고 한다.","동기부여 과정이론에는 아담스(Adams)의 공정성이론, 브룸 (Vroom)의 기대이론, 포터와 롤러(Porter & Lawler)의 업적 만족이론 등이 있다.","앨더퍼(Alderfer)는 매슬로우(Maslow)의 욕구단계이론을 수정하여 생존욕구, 존경욕구, 성장욕구로 구분하였다.",2,0,""],["2025-2","경찰학",31,"예산제도에 관한 설명으로 가장 적절하지 않은 것은?","품목별 예산제도는 회계 집행내용과 책임이 명확하며, 인건비 등 경직성 경비에 적용이 용이하다.","성과주의 예산제도는 자원배분의 합리성과 예산집행의 신축성을 기할 수 있으며 국민의 입장에서 행정기관의 활동을 이해하기 쉽다.","계획예산제도는 장기적인 기획과 단기적인 예산편성을 유기적으로 연결하여 자원배분의 일관성과 합리성을 도모한다.","일몰법 예산제도는 행정부가 제정한 법령에 의하여 특정 사업이 일정 기간이 경과하면 의무적·자동적으로 폐지되게 하는 예산 제도이며 행정부의 사업에 주로 사용된다.",3,0,""],["2025-2","경찰학",32,"직업공무원제도에 관한 설명으로 가장 적절하지 않은 것은?","공무원의 장기근속을 유도하므로 행정의 안정성과 계속성을 유지하는데 유리하다.","공무원이 환경변화에 민감하지 못하고 특권 집단화될 우려가 있다.","연령 등으로 대상을 제한하는 경우도 있어 공직임용의 기회균등이 제약될 수 있다.","강력한 신분보장으로 공무원에 대한 행정통제와 책임 확보가 용이하다.",3,0,""],["2025-2","경찰학",33,"경찰통제에 관한 설명으로 가장 적절하지 않은 것은?","경찰청장의 훈령권과 국회의 예산심의권은 사전통제이며 내부통제에 해당한다.","국가경찰위원회의 심의‧의결권은 외부통제이며 민주적 통제에 해당한다.","국회의 국정감사‧조사권은 사후통제인 동시에 외부통제에 해당한다.","경찰청장 및 국가경찰위원회 위원의 임명권, 총경 이상 경찰 공무원의 임명권 등 대통령에 의한 경찰통제는 행정통제이며 외부통제에 해당한다.",0,0,""],["2025-2","경찰학",34,"｢총포･도검･화약류 등의 안전관리에 관한 법률｣에 대한 설명으로 가장 적절하지 않은 것은?","화약류를 운반하려는 사람은 행정안전부령으로 정하는 바에 따라 도착지를 관할하는 경찰서장에게 신고하여야 한다. 다만, 대통령령으로 정하는 수량 이하의 화약류를 운반하는 경우에는 그러하지 아니하다.","화약류를 폐기하려는 자는 행정안전부령으로 정하는 바에 따라 그 폐기하려는 곳을 관할하는 경찰서장에게 신고하여야 한다. 다만, 제조업자가 제조과정에서 생긴 화약류를 그 제조소 안에서 폐기하는 경우에는 그러하지 아니하다.","금고 이상의 실형을 선고받고 그 집행이 끝나거나 집행을 받지 아니하기로 확정된 후 3년이 지나지 아니한 자는 총포‧도검‧ 화약류‧분사기‧전자충격기‧석궁 제조업의 허가를 받을 수 없다.","총포‧도검‧화약류‧분사기‧전자충격기‧석궁의 판매업을 하려는 자는 판매소마다 행정안전부령으로 정하는 바에 따라 판매소의 소재지를 관할하는 시‧도경찰청장의 허가를 받아야 한다.",0,0,""],["2025-2","경찰학",35,"｢범죄피해자보호법｣에관한설명으로가장적절하지않은 것은?","“범죄피해자”란 타인의 범죄행위로 피해를 당한 사람과 그 배우자 (사실상의 혼인관계를 포함한다), 직계친족 및 형제자매를 말한다.","구조금은 유족구조금‧장해구조금 및 중상해구조금으로 구분한다.","범죄행위 당시 구조피해자와 가해자 사이가 4촌 이내의 친족인 경우에는 구조금을 지급하지 아니한다.","구조피해자가 과도한 폭행‧협박 또는 중대한 모욕 등 해당 범죄행위를 유발하는 행위를 한 때에는 구조금의 일부를 지급 하지 아니한다.",3,0,""],["2025-2","경찰학",36,"｢아동학대범죄의 처벌 등에 관한 특례법｣에 대한 설명으로 가장 적절하지 않은 것은?","“아동학대행위자”란 아동학대범죄를 범한 사람 및 그 공범을 말하고, “피해아동”이란 아동학대범죄로 인하여 직접적으로 피해를 입은 아동을 말한다.","아동학대범죄 신고를 접수한 사법경찰관리나 아동학대전담공무원은 지체 없이 아동학대범죄의 현장에 출동하여야 한다. 이 경우 수사기관의 장이나 시‧도지사 또는 시장‧군수‧구청장은 서로 동행하여줄것을요청할수있으며, 그요청을받은수사기관의장이나 시‧도지사 또는 시장‧군수‧구청장은 정당한 사유가 없으면 사법경찰관리나 아동학대전담공무원이 아동학대범죄 현장에 동행하도록 조치하여야 한다.","사법경찰관리 또는 아동학대전담공무원이 응급조치를 한 경우에는 즉시 응급조치결과보고서를 작성하여야 한다. 이 경우 사법 경찰관리가 응급조치를 한 경우에는 관할 경찰관서의 장이 시‧도지사 또는 시장‧군수‧구청장에게, 아동학대전담공무원이 응급조치를 한 경우에는 소속 시‧도지사 또는 시장‧군수‧구청장이 관할 경찰관서의 장에게 작성된 응급조치결과보고서를 10일 이내에 송부하여야 한다.","“아동학대행위자를 피해아동등으로부터 격리”하는 응급조치는 72시간을 넘을 수 없다. 다만, 본문의 기간에 공휴일이나 토요일이 포함되는 경우로서 피해아동등의 보호를 위하여 필요하다고 인정되는 경우에는 48시간의 범위에서 그 기간을 연장할 수 있다.",2,0,""],["2025-2","경찰학",37,"｢경찰 비상업무 규칙｣에 관한 설명으로 가장 적절하지 않은 것은?","“필수요원”이란 모든 경찰공무원 및 일반직공무원 중 경찰기관의 장이 지정한 사람으로 비상소집 시 1시간 이내에 응소해야 할 사람을 말한다.","비상근무의 발령권자는 비상상황이 종료되는 즉시 비상근무를 해제한다.","작전준비태세가 발령되면 작전경력을 동원하고 지휘관과 참모는 정위치 근무를 원칙으로 한다.","비상근무 대상은 경비‧작전‧재난‧안보‧수사‧교통 업무와 관련한 비상상황에 국한한다. 다만, 두 종류 이상의 비상상황이 동시에 발생한 경우에는 긴급성 또는 중요도가 상대적으로 더 큰 비상상황의 비상근무로 통합하여 실시한다.",2,0,""],["2025-2","경찰학",38,"다음 중 ｢도로교통법｣ 및 동법 시행령상 자동차를 사용하는 사람 또는 기관 등의 신청에 의하여 시·도경찰청장이 지정 하는 긴급자동차로 옳은 것은 모두 몇 개인가? ㉠ 경찰용 자동차 중 범죄수사, 교통단속, 그 밖의 긴급한 경찰업무 수행에 사용되는 자동차 ㉡ 민방위업무를 수행하는 기관에서 긴급예방을 위한 출동에 사용되는 자동차 ㉢ 도로관리를 위하여 사용되는 자동차 중 운행이 제한되는 자동차를 단속하기 위하여 사용되는 자동차 ㉣ 교도소의 자동차 중 수용자의 호송‧경비를 위하여 사용되는 자동차 ㉤ 국내외 요인에 대한 경호업무 수행에 공무로 사용되는 자동차","2개","3개","4개","5개",0,0,""],["2025-2","경찰학",39,"｢북한이탈주민의 보호 및 정착지원에 관한 법률｣에 대한 설명으로 가장 적절하지 않은 것은?","“북한이탈주민”이란 군사분계선 이북지역에 주소, 직계가족, 배우자, 직장 등을 두고 있는 사람으로서 북한을 벗어난 후 외국 국적을 취득하지 아니한 사람을 말한다.","국가안전보장에 현저한 영향을 줄 우려가 있는 보호신청자는 통일부장관이 그 보호 여부를 결정하고, 그 결과를 지체 없이 국가정보원장과 보호신청자에게 통보하거나 알려야 한다.","통일부장관은 보호대상자가 거주지로 전입한 후 그의 신변안전을 위하여 국방부장관이나 경찰청장에게 협조를 요청할 수 있으며, 협조요청을 받은 국방부장관이나 경찰청장은 이에 협조한다.","보호신청자가 항공기 납치, 마약거래, 테러, 집단살해 등 국제 형사범죄자에 해당하면 보호대상자로 결정하지 아니할 수 있다.",1,0,""],["2025-2","경찰학",40,"｢범죄인 인도법｣에 관한 설명으로 가장 적절하지 않은 것은?","인도조약이 체결되어 있지 아니한 경우에도 범죄인의 인도를 청구하는 국가가 같은 종류 또는 유사한 인도범죄에 대한 대한민국의 범죄인 인도청구에 응한다는 보증을 하는 경우에는 이 법을 적용한다.","대한민국과 청구국의 법률에 따라 인도범죄가 사형, 무기징역, 무기금고, 장기 3년 이상의 징역 또는 금고에 해당하는 경우에만 범죄인을 인도할 수 있다.","인도범죄에 관하여 대한민국 법원에서 재판이 계속 중이거나 재판이 확정된 경우는 범죄인을 인도하여서는 아니 된다.","범죄인이인도범죄에관하여제3국(청구국이아닌외국을말한다.)에서 재판을 받고 처벌되었거나 처벌받지 아니하기로 확정된 경우 범죄인을 인도하지 아니할 수 있다.",1,0,""],["2026-1","헌법",1,"민주적 기본질서 및 자유민주적 기본질서에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","자유민주적 기본질서에 위해를 준다는 것은 구체적으로는 기본적 인권의 존중, 권력분립, 의회제도, 복수정당제도, 선거제도, 재산권의 상대화와 사회적 시장경제질서 및 사법권의 독립 등 우리의 내부 체제에 대한 단순한 위반이나 저촉도 포함한다.","현행헌법은 전문(前文)과 제4조에서 ‘자유민주적 기본질서’를 헌법의 기본원리 및 통일원칙으로 밝히고 있는 반면에 제8조에서는 정당의 목적이나 활동이 ‘민주적 기본질서’에 위배될 때에는 해산 된다고 하여, ‘자유민주적 기본질서’와 ‘민주적 기본질서’를 함께 사용하고 있다.","‘민주적 기본질서’는, 오늘날의 입헌적 민주주의 체제의 구성 및 운영에 필요한 가장 핵심적인 내용이나 요소를 의미하는 것으로서 민주주의 원리에 입각한 요소들과 법치주의 원리에 입각한 요소들 중에서 필요불가결한 부분을 의미한다.","헌법재판소는 현행헌법상 ‘민주적 기본질서’의 주요한 요소로 국민주권의 원리, 기본적 인권의 존중, 권력분립제도, 복수정당 제도 등을 들고 있다.",0,0,""],["2026-1","헌법",2,"역대 헌법상 계엄에 관한 설명으로 가장 적절하지 않은 것은?","1948년 제헌헌법에서는 대통령이 법률의 정하는 바에 의하여 계엄을 선포한다고 규정하였다.","1960년 제3차 개정헌법에서는 계엄이 선포되었을 때 법률이 정하는 바에 의하여 국민의 권리에 관한 특별한 조치를 할 수 있음을 규정하였다.","1962년 제5차 개정헌법에서는 계엄을 선포한 때 대통령은 지체 없이 이를 국회에 통고하고, 국회가 계엄의 해제를 요구한 때 대통령은 이를 해제하도록 규정하였다.","1972년 제7차 개정헌법에서는 계엄제도를 폐지하고 긴급조치 제도를 규정하였다.",3,0,""],["2026-1","헌법",3,"지방자치제도에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","자치제도의 보장은 지방자치단체에 의한 자치행정을 일반적으로 보장한다는 것뿐이고 특정자치단체의 존속을 보장한다는 것은 아니며, 군 및 도의회의 결의에 반하여 법률로 군을 폐지하고 타시에 병합하여 시를 설치한다 하여 주민들의 자치권을 침해하는 결과가 된다거나 지방자치제도의 본질을 침해하는 것이라고 할 수 없다.","주민자치제를 본질로 하는 민주적 지방자치제도가 안정적으로 뿌리내린 현 시점에서 지방자치단체의 장 선거권 역시 다른 선거권과 마찬가지로 헌법 제24조에 의해 보호되는 기본권으로 인정하여야 한다.","광역지방자치단체가 기초지방자치단체의 자치사무에 대한 감사에 착수하기 위해서는 자치사무에 관하여 특정한 법령위반행위가 확인되었거나 위법행위가 있었으리라는 합리적 의심이 가능한 경우이어야 하고 그 감사대상을 특정하여야 하며, 위법사항을 특정하지 않고 개시하는 감사 또는 법령위반사항을 적발하기 위한 감사는 허용될 수 없다.","국가기본도에 표시된 해상경계선은 그 자체로 불문법상 해상 경계선으로 인정될 수 없으므로, 관할 행정청이 국가기본도에 표시된 해상경계선을 기준으로 하여 과거부터 현재에 이르기까지 반복적으로 처분을 내리고, 지방자치단체가 허가, 면허 및 단속 등의 업무를 지속적으로 수행하여 왔더라도, 국가기본도상의 해상경계선은 여전히 지방자치단체 관할 경계에 관하여 불문법 으로서 그 기준이 될 수 없다.",3,0,""],["2026-1","헌법",4,"헌법 전문(前文)에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","현행헌법 전문은 ‘3‧1운동으로 건립된 대한민국임시정부의 법통을 계승’할 것을 규정하고 있는데, 여기서 ‘3‧1운동’의 정신은 우리나라 헌법의 연혁적‧이념적 기초로서 헌법이나 법률해석에서의 해석 기준으로 작용한다.","‘3‧1운동으로 건립된 대한민국임시정부의 법통을 계승’한다고 선언한 헌법 전문의 의미는 현행헌법이 일본제국주의의 식민 통치를 배격하고 우리 민족의 자주독립을 추구한 대한민국 임시정부의 정신을 헌법의 근간으로 하고 있다는 점을 뜻한다.","1972년 제4공화국 헌법은 전문에서 ‘3‧1운동의 숭고한 독립정신과 4‧19의거 및 5‧16혁명의 이념을 계승’하고 ‘자유민주적 기본질서를 더욱 공고히 하는 새로운 민주공화국을 건설함’을 선언하여, ‘5‧16혁명의 이념’과 ‘자유민주적 기본질서’의 확립을 우리 헌법 에서 처음으로 명시하였다.","현행헌법 전문은 “우리 대한국민은‧‧‧1948년 7월 12일에 제정되고 8차에 걸쳐 개정된 헌법을 이제 국회의 의결을 거쳐 국민투표에 의하여 개정한다.”라고 명시하여, 국민이 헌법개정권자이며, 현행헌법이 1948년 제헌헌법의 제9차 개정임을 밝히고 있다.",2,0,""],["2026-1","헌법",5,"국민에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","대법원은 헌법 제3조 영토조항을 근거로 하여 북한지역도 대한민국의 영토에 속하는 한반도의 일부를 이루는 것이어서 대한민국의 주권이 미치고 북한 주민도 대한민국 국적을 취득‧ 유지하는 데 아무런 영향이 없는 것으로 해석하고 있다.","헌법의 위임에 따라 국민이 되는 요건을 법률로 정할 때에는 인간의 존엄과 가치, 평등원칙 등 헌법의 요청인 기본권 보장 원칙을 준수하여야 하는 입법상의 제한을 받는다.","｢재외국민보호를 위한 영사조력법｣상 재외공관의 장은 관할구역에서 재외국민이 사건‧사고로 사망한 사실을 인지한 때에는 이를 지체 없이 해당 재외국민의 가족 등 연고자에게 알리고 법무부장관에게 보고하여야 한다.","법무부장관으로 하여금 거짓이나 그 밖의 부정한 방법으로 국적 회복허가를 받은 자에 대하여 그 허가를 취소할 수 있도록 규정 하면서도 그 취소권의 행사 기간을 따로 정하고 있지 아니한 ｢국적법｣ 조항은 과잉금지원칙에 위배하여 거주‧이전의 자유 및 행복추구권을 침해하지 아니한다.",2,0,""],["2026-1","헌법",6,"국가의 기본권 보호의무에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법 제10조는 모든 국민이 인간으로서의 존엄과 가치를 지닌 주체임을 천명하고, 국가권력이 국민의 기본권을 침해하는 것을 금지함은 물론 이에서 더 나아가 적극적으로 국민의 기본권을 보호하고 이를 실현할 의무가 있음을 선언하고 있다.","헌법 제35조 제1항이 국가와 국민에게 환경보전을 위하여 노력하여야 할 의무를 부여하고 있는 점을 고려하면, 일정한 경우 국가는 사인에 의한 국민의 환경권 침해에 대해서도 적극적으로 기본권 보호조치를 취할 의무를 부담한다.","국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 관한 보호의무를 다하지 않았는지를 헌법재판소가 심사할 때에는 국가가 이를 보호하기 위하여 적어도 적절하고 효율적인 최소한의 보호조치를 취하였는가 하는 이른바 ‘과소보호금지원칙’의 위반 여부를 기준으로 삼아야 한다.","개별 사례에서 과소보호금지원칙 위반 여부는 기본권침해가 예상되어 보호가 필요한 ‘위험상황’에 대응하는 ‘보호조치’의 내용이, 문제 되는 위험상황의 성격에 상응하는 보호조치로서 필요한 최소한의 성격을 갖고 있는지에 따라 판단하되, 그 판단이 전문적이고 기술적인 영역에 있더라도 위험상황의 성격 등은 헌법재판소의 주관적인 ‘가치판단’에 따라 판단한다.",3,0,""],["2026-1","헌법",7,"기본권의 제한에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","금융위원회 위원장이 2019. 12. 16. 시중 은행을 상대로 투기 지역‧투기과열지구 내 초고가 아파트(시가 15억 원 초과)에 대한 주택구입용 주택담보대출을 2019. 12. 17.부터 금지한 조치는 행정지도로 이루어진 조치로서 그 내용이 금융위원회에 적법하게 부여된 규제 권한을 벗어나지 않는 이상 법률유보 원칙을 충족한다고 할 것이므로 청구인의 재산권 및 계약의 자유를 침해하지 아니한다.","위반행위자 등이 ｢개발제한구역의 지정 및 관리에 관한 특별조치법｣ 위반으로 인해 시정명령을 받고도 이를 이행하지 아니한 경우에 이를 상당한 기간까지 이행하지 않으면 이행강제금을 부과‧징수 한다는 뜻을 토지 소유자에게 미리 문서로 계고하도록 하는 동법 조항은, 이행강제금이 부과되는 이행 기간의 대략을 법률로 직접 정하지 않고 ‘상당한 기간’으로만 규정하여 법률유보원칙 및 명확성원칙에 위배된다.","위임입법에 있어서 위임의 구체성‧명확성의 요구 정도는 처벌 법규나 조세법규와 같이 국민의 기본권을 직접적으로 제한 하거나 침해할 소지가 있는 법규에서는 구체성‧명확성의 요구가 강화되어 그 위임의 요건과 범위가 일반적인 급부행정의 경우 보다 더 엄격하게 제한적으로 규정되어야 한다.","‘재산의 관리‧처분에 관한 사항’을 주민소송의 대상으로 규정 하고 있는 ｢지방자치법｣ 조항은 그 문언, 주민소송의 목적, 관련 법률의 규정 및 법관의 보충적 해석을 통하여 그 의미를 분명하게 파악할 수 있으므로 명확성원칙에 위배되지 아니한다.",1,0,""],["2026-1","헌법",8,"수용자의 기본권 제한에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수형자라 하더라도 확정되지 않은 별도의 형사재판에서만큼은 미결수용자와 같은 지위에 있으므로, 형사재판의 피고인으로 출석 하는 수형자에 대하여 사복착용을 허용하지 않는 것은 수형자의 공정한 재판을 받을 권리, 인격권, 행복추구권을 침해한다.","수형자가 헌법소원 사건의 국선대리인인 변호사를 접견함에 있어서 접견의 목적이나 접견의 상대방 등을 고려할 때 그 접견 내용을 녹음, 기록하는 것이 허용되어서는 아니될 것임에도, 이를 녹음, 기록한 교도소장의 행위는 당해 수형자의 재판을 받을 권리를 침해한다.","금치의 징벌을 받은 수용자에 대해 금치기간 중 신문‧도서‧잡지 외 자비로 구매한 음식물, 의약품 및 의료용품 등 자비구매물품의 사용을 제한하는 것은 수용자의 일반적 행동의 자유를 침해한다.","수형자가 출정하기 이전에 여비를 납부하지 않았거나 출정비용과 영치금과의 상계에 미리 동의하지 않았다는 이유로, 교도소장이 행정소송 변론기일에 당해 수형자의 출정을 제한한 행위는 형벌의 집행을 위하여 필요한 한도를 벗어나 수형자의 재판청구권을 과도하게 침해한 것이다.",2,0,""],["2026-1","헌법",9,"의회유보원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢기후위기 대응을 위한 탄소중립 녹색성장 기본법｣ 조항에서 2031년부터 2049년까지의 감축목표에 관하여 대강의 정량적 수준도 규정하지 않고 이에 관해 정부가 5년마다 정하도록 한 것은 의회유보원칙을 포함하는 법률유보원칙을 위반한 것이다.","시각장애인에 한해 안마사의 자격을 인정하는 근거를 직접 법률에 규정하지 않은 ｢의료법｣ 조항은 안마사 자격인정 요건을 정할 수 있는 권한을 행정부에 위임하는 것으로서 의회유보원칙을 위반한 것은 아니다.","도시환경정비사업의 시행자인 토지등소유자가 사업시행인가를 신청하기 전에 얻어야 하는 토지등소유자의 동의요건을 토지등 소유자가 자치적으로 정하여 운영하는 규약에 정하도록 규정한 구 ｢도시 및 주거환경정비법｣ 조항은 최소한 사업시행인가 신청에 필요한 토지등소유자의 동의정족수를 자치규약에서 정하도록 위임하였으므로 의회유보원칙에 위배되지 않는다.","부동산 관련 업무나 정보를 취급하는 공직유관단체의 직원들에 대하여 소유한 부동산의 취득일자‧취득경위‧소득원 등을 기재할 의무를 부과하는 ｢공직자윤리법｣ 조항은 구체적인 적용 대상을 법률로 직접 규정하지 아니하고 대통령령으로 위임한 것만으로 의회유보원칙에 위반된다고 볼 수 없다.",2,0,""],["2026-1","헌법",10,"평등에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 국회의원보다 지방의회의원에 대하여 지역대표성을 고려할 필요성이 더 크다는 점을 고려하여 하나의 자치구‧시‧군에 최소 1명 이상의 시‧도의원을 보장하겠다는 취지로 인접한 2 이상의 관할구역과 합하지 않아, 도의회의원선거구역의 지역선거구들 평균인구수로부터 선거구의 인구수가 –56.29%의 인구편차를 보인다면 당해 선거구 부분은 당해 선거구 선거권자의 평등권을 침해한다. ㉡ 부동산 관련 업무에 종사하는 공직유관단체 직원들과 중앙 행정기관‧지방자치단체의 직원들이나 타 공직유관단체의 직원들이 ‘본질적으로 동일한 집단’이라고 단정할 수 없고, 설사 동일한 집단이라 하더라도, 부동산 관련 업무에 종사 하는 공직유관단체 직원들에 대해서는 급수에 상관없이 재산 등록의무를 부과한 입법자의 판단에는 합리적인 근거가 있으므로, 부동산 관련 업무나 정보를 취급하는 공직유관 단체의 직원들에 대하여 재산등록의무를 부과하는 ｢공직자 윤리법｣ 조항은 청구인들의 평등권을 침해하지 아니한다. ㉢ 병원, 치과병원, 종합병원과 달리 정신병원에 대하여는 한의사를 두어 한의과 진료과목을 추가로 설치‧운영할 수 있다는 규정을 두지 아니한 ｢의료법｣ 조항은 정신병원과 다른 병원의 차이점을 반영한 것으로 정신병원을 운영하는 청구인의 평등권을 침해 하지 아니한다. ㉣ 13세 미만의 사람에 대하여 강제추행죄를 범한 사람을 5년 이상의 유기징역에 처한다고 정한 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 조항은, 13세 미만 미성년자의 특성과 보호의 필요성을 고려하여 장애인강제추행죄, 청소년강제추행죄의 법정형보다 무겁게 규정한 입법자의 판단이 자의적이라 보기 어려워 평등원칙에 반한다고 볼 수 없다.","㉠㉢","㉡㉣","㉠㉡㉣","㉠㉡㉢㉣",2,0,""],["2026-1","헌법",11,"직업의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","근로계약 체결 시 사용자로 하여금 임금, 소정근로시간, 휴일 등에 관한 사항을 근로자에게 서면 교부의 방법으로 명시하도록 하고 위반시 500만 원 이하의 벌금에 처하도록 한 ｢근로기준법｣ 조항은, 사용자에 대한 직업의 자유 제한의 정도가 과도하여 사용자인 청구인의 직업의 자유를 침해한다.","운동전용면적 300제곱미터 이하인 체력단련장업의 경우 1명 이상 체육지도자를 배치하도록 규정한 것은 체력단련장 이용자 들의 생명과 신체에 대한 안전을 확보하기 위한 것으로 목적의 정당성은 인정되나, 과잉금지원칙을 위반하여 작은 규모로 체력단련장을 영리목적으로 설치‧운영하는 체육시설업자의 직업수행의 자유를 침해한다.","증권의 모집‧사모와 관련하여 거짓 기재가 된 문서 등을 사용 하여 재산상 이익을 얻고자 하는 행위를 금지하고 이를 위반한 경우 처벌하도록 규정한 구 ｢자본시장법｣ 조항은 상장절차와 관계없는 비상장회사의 증권모집에도 적용되므로 과잉금지 원칙에 반하여 직업의 자유를 침해한다.","금고 이상의 형의 집행유예를 선고받고 일정 기간이 지나지 아니한 사람은 행정사가 될 수 없다고 규정한 ｢행정사법｣ 조항은, 행정사의 공정성 및 신뢰성을 확보하기 위한 것으로 과잉금지원칙에 위배되어 직업선택의 자유를 침해하지 않는다.",3,0,""],["2026-1","헌법",12,"재산권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공법상의 권리가 헌법상의 재산권보장의 보호를 받기 위해서는 첫째, 공법상의 권리가 권리주체에게 귀속되어 개인의 이익을 위하여 이용가능해야 하고, 둘째, 국가의 일방적인 급부에 의한 것이 아니라 권리주체의 노동이나 투자, 특별한 희생에 의하여 획득되어 자신이 행한 급부의 등가물에 해당하는 것이어야 하며, 셋째, 수급자의 생존의 확보에 기여해야 한다.","행정청이 아닌 사업주체가 새로이 설치한 공공시설이 그 시설을 관리할 관리청에 무상으로 귀속되도록 한 구 ｢주택건설촉진법｣ 조항은, 그 실질은 공공시설의 설치와 그 비용부담자 등에 관하여 규율하고 있으나 재산권의 법률적 수용이라는 법적 외관을 가지고 있으므로, 이를 심사하려면 그것이 헌법 제23조 제3항에 따른 정당한 보상의 원칙에 위배되었는지 여부가 검토되어야 한다.","가축의 살처분으로 인한 재산권의 제약은 보상을 요하는 수용에 해당하지 않고 가축의 소유자가 수인해야 하는 사회적 제약의 범위에 속하더라도, 권리자에게 수인의 한계를 넘어 가혹한 부담이 발생하는 예외적인 경우에는 이를 완화하는 보상규정을 두어야 하므로, 심판대상조항이 재산권을 침해하는지 여부는 조정적 보상조치의 규율에 관하여 입법자가 갖는 입법형성재량의 한계를 일탈하였는지 여부로 심사한다.","대통령의 개성공단 운영 전면 중단 결정과 그에 따른 일련의 행위로 이루어진 개성공단 전면중단 조치는 개성공단이라는 특수한 지역에 위치한 사업용 재산이 받는 사회적 제약이 구체화된 것일 뿐이므로, 이 중단조치에 의한 영업중단으로 영업상 손실이나 주식 등 권리의 가치하락이 발생하였더라도 이는 영리획득의 기회나 기업활동의 여건 변화에 따른 재산적 손실일 뿐이므로 헌법 제23조의 재산권보장의 범위에 속한다고 보기 어렵다.",1,0,""],["2026-1","헌법",13,"특별부담금에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢개발이익 환수에 관한 법률｣에 규정된 요건에 해당하는 모든 사람에 대하여 일방적으로 부과‧징수되는 개발부담금은 실질적으로 투기방지와 토지의 효율적인 이용 및 개발에 관한 사회적 갈등을 조정하기 위한 유도적‧조정적 성격을 가지는 특별부담금으로서, 불로소득적인 개발이익을 환수하여 국가 및 지방자치단체의 재정수입에 배분하므로 입법재량의 범위를 벗어난 것이 아니다.","구 ｢국민체육진흥법｣이 규정한 ‘회원제로 운영하는 골프장 시설의 입장료에 대한 부가금’은 특정 부류의 집단에만 강제적‧ 일률적으로 부과되는 특별부담금으로서 국민체육진흥계정의 재원을 마련하는 데 목적이 있는 재정조달목적 부담금이며, 일반 국민에 비해 특별히 객관적으로 밀접한 관련성을 가진다고 볼 수 없는 골프장 부가금 징수 대상 시설 이용자들을 대상으로 하는 것으로서 헌법상 평등원칙에 위배된다.","｢한강수계 상수원수질개선 및 주민지원 등에 관한 법률｣이 규정한 ‘물사용량에 비례한 부담금’은 한강수계관리기금을 조성하는 재원으로서 재정조달목적 부담금에 해당하고, 물사용량에 비례한 부담금의 부과는 공적과제 달성을 위한 적합한 수단에 해당한다.","｢방송법｣에 따른 텔레비전 방송수신료는 공영방송사업이라는 특정한 공익사업의 경비조달에 충당하기 위하여 수상기를 소지한 특정집단에 대하여 부과되는 특별부담금에 해당하여 조세나 수익자부담금과는 구분된다.",0,0,""],["2026-1","헌법",14,"선거권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","방송광고, 후보자 등의 방송연설, 방송시설주관 후보자연설의 방송, 선거방송토론위원회 주관 대담‧토론회의 방송에서 한국 수화언어 또는 자막의 방영을 재량사항으로 규정한 ｢공직선거법｣ 조항은, 한국수화언어‧자막조항에 의해 침해되는 공익과 청각 장애인이 입는 불이익이 현저하므로 과잉금지원칙에 위배되어 청구인의 선거권을 침해한다.","지방자치단체의 장 선거에서 후보자 등록 마감시간까지 후보자 1인만이 등록한 경우 투표를 실시하지 않고 그 후보자를 당선인으로 결정하도록 하는 ｢공직선거법｣ 조항은 입법목적 달성에 필요한 범위를 넘은 과도한 제한이라 할 수 없어 청구인의 선거권을 침해하지 않는다.","선거일 현재 1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람은 선거권이 없으나, 그 형의 집행유예를 선고받고 유예기간 중에 있는 사람은 선거권을 갖는다.","육군훈련소에서 군사교육을 받고 있었던 훈련병에 대하여 소대장이 제19대 대통령선거 대담‧토론회의 시청을 금지한 행위는 훈련병이 다른 수단들을 통해서 선거정보를 취득할 수 있었던 점 등을 고려하면 훈련병의 선거권을 침해한다고 볼 수 없다.",0,0,""],["2026-1","헌법",15,"청원권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법 제26조와 ｢청원법｣의 규정에 의할 때, 헌법상 보장된 청원권은 공권력과의 관계에서 일어나는 여러 가지 이해관계, 의견, 희망 등에 관하여 적법한 청원을 한 모든 국민에게, 국가기관이 청원을 수리‧ 심사하여 그 결과를 통지할 것을 요구할 수 있는 권리를 말한다.","｢청원법｣에 의해 국민은 국회‧중앙선거관리위원회, 중앙행정기관 (대통령 소속 기관과 국무총리 소속 기관을 포함한다)과 그 소속 기관에 대하여 청원을 제출할 수 있으나 법원이나 헌법재판소에 대하여는 청원을 제출할 수 없다.","청원인은 청원사항이 법률‧명령‧조례‧규칙 등의 제정‧개정 또는 폐지 또는 공공의 제도 또는 시설의 운영에 해당하는 경우 청원의 내용, 접수 및 처리 상황과 결과를 온라인청원시스템에 공개하도록 청원할 수 있다.","국회에 청원을 하려는 자는 국회의원의 소개를 받거나 국회규칙으로 정하는 기간 동안 국회규칙으로 정하는 일정한 수 이상의 국민의 동의를 받아 청원서를 제출하여야 한다.",1,0,""],["2026-1","헌법",16,"국가배상청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","5‧18민주화운동과 관련하여 보상금 지급 결정에 동의하면 ‘정신적 손해’에 관한 부분도 재판상 화해가 성립된 것으로 보는 구 ｢5‧18민주화운동 관련자 보상 등에 관한 법률｣ 조항은 국가 배상청구권에 대한 과도한 제한이고, 해당 손해에 대한 적절한 배상이 이루어졌음을 전제로 하여 국가배상청구권 행사를 제한하려 한 동법의 입법목적에도 부합하지 않아 국가배상 청구권을 침해한다.","｢국가배상법｣ 제2조 제1항 소정의 ‘직무를 집행함에 당하여’라 함은 직접 공무원의 직무집행행위이거나 그와 밀접한 관계에 있는 행위를 의미하며, 이를 판단함에 있어서는 행위 자체의 외관을 객관적으로 관찰하여 공무원의 직무행위로 보여지고 그것이 실질적으로 직무행위에 속하는 경우에만 공무원이 ‘직무를 집행함에 당하여’ 한 것으로 보아야 한다.","소멸시효를 배제하는 등의 특별규정을 두지 아니함으로써 국가 배상청구권에 대하여 ｢민법｣ 또는 그 외의 법률상의 소멸시효 규정이 적용되도록 한 ｢국가배상법｣ 제8조는 국가배상청구권을 일부 제한하고 있다 하더라도 일정한 요건 하에 그 행사를 제한하고 있는 점에서 그 본질적인 내용에 대한 침해라고는 볼 수 없을뿐더러, 그 제한의 목적과 수단 및 방법에 있어서 정당하고 상당한 것이어서 헌법에 위반되지 아니한다.","순직한 군인의 유족이 다른 법령에 따라 보상을 지급받을 수 있을 때에는 국가에 대하여 손해배상을 청구할 수 없도록 규정한 ｢국가배상법｣ 조항은 헌법 제29조 제2항에 직접 근거 하고, 실질적으로 같은 내용을 규정한 것이므로 헌법 제29조 제2항의 위임범위를 일탈하였다고 볼 수 없다.",1,0,""],["2026-1","헌법",17,"교육을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","‘수학권’은 통상 국가에 대하여 교육조건의 개선‧정비와 교육 기회의 균등한 보장을 적극적으로 요구할 수 있는 권리로 이해되며, 헌법 제31조 제2항 내지 제6항은 수학권의 효율적인 보장을 위한 규정이다.","검정고시로 고등학교 졸업학력을 취득한 사람들의 수시모집 지원을 제한하는 내용의 국립교육대학교 등의 ‘2017학년도 신입생 수시모집 입시요강’은 검정고시 출신자들을 합리적인 이유 없이 차별함으로써 청구인들의 균등하게 교육을 받을 권리를 침해한다.","서울대학교 2023학년도 저소득학생 특별전형의 모집인원을 모두 수능위주전형으로 선발하도록 정한 2021. 4. 29.자 ‘서울대학교 2023학년도 대학 신입학생 입학전형 시행계획’은 저소득학생 특별전형에 응시하고자 하는 수험생들의 기회를 불합리하게 박탈하여 청구인의 균등하게 교육을 받을 권리를 침해한다.","헌법 제31조 제3항에 규정된 의무교육 무상의 원칙에 있어서 무상의 범위는 헌법상 교육의 기회균등을 실현하기 위해 필수 불가결한 비용, 즉 모든 학생이 의무교육을 받음에 있어서 경제적인 차별 없이 수학하는 데 반드시 필요한 비용에 한한다고 할 것이며, 수업료나 입학금의 면제, 학교와 교사 등 인적‧물적 기반 및 그 기반을 유지하기 위한 인건비와 시설유지비, 신규 시설투자비 등의 재원마련 및 의무교육의 실질적인 균등보장을 위해 필수불가결한 비용이 무상의 범위에 포함된다.",2,0,""],["2026-1","헌법",18,"사학의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","학교설립인가를 받지 아니하고 학교의 명칭을 사용하거나 학생을 모집하여 시설을 사실상 학교의 형태로 운영하는 행위를 처벌하는 ｢초‧중등교육법｣ 조항은 죄형법정주의의 명확성 원칙에 위배되지 않으며 사립학교 설립의 자유를 침해하지 아니한다.","개방감사제에 관한 ｢사립학교법｣ 제21조 제5항은, 학교법인에 대한 감사의 신뢰성을 확보하고 그 책무성을 강화함으로써 사립학교운영의 투명성과 공공성을 높이기 위한 것으로, 개방 감사가 1인으로 제한되고, 감사의 존재목적이 학교법인 및 학교운영의 적정성을 감독하는 데 있는 점 등을 고려하면 학교법인의 사학의 자유를 침해한다고 볼 수 없다.","사립유치원의 교비회계에 속하는 예산‧결산 및 회계 업무를 교육부장관이 지정하는 정보처리장치로 처리하도록 규정한 ｢사학기관 재무‧회계 규칙｣ 조항은 사립유치원의 회계투명성을 제고하기 위한 것이므로 사립유치원 설립‧경영자의 사립학교 운영의 자유를 침해한다고 볼 수 없다.","학교장의 중임 횟수는 사립학교의 설립 목적 달성과 밀접한 연관을 가지는 사립학교 운영의 핵심적인 사항으로 학교법인의 자율적인 판단과 결정을 존중할 필요가 있으므로, 사립 초‧중등 학교의 장을 1회에 한하여 중임할 수 있도록 하는 구 ｢사립학교법｣ 제53조 제3항 단서는 학교법인의 사립학교 운영의 자유를 침해하여 헌법에 위반된다.",3,0,""],["2026-1","헌법",19,"근로3권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국가 또는 지방자치단체의 정책결정에 관한 사항이나 기관의 관리‧운영에 관한 사항으로서 근무조건과 직접 관련되지 아니하는 사항을 공무원노동조합의 단체교섭대상에서 제외하고 있는 ｢공무원의 노동조합 설립 및 운영 등에 관한 법률｣ 조항이 과잉금지원칙에 위반된다고 볼 수 없다.","최저임금 산입을 위하여 임금지급 주기에 관한 취업규칙을 변경하는 경우 노동조합 또는 근로자 과반수의 동의를 받을 필요가 없도록 규정한 ｢최저임금법｣ 조항은 과잉금지원칙에 위배되어 청구인들의 단체교섭권을 침해한다고 볼 수 없다.","노동조합으로 하여금 행정관청이 요구하는 경우에 결산결과와 운영사항을 보고하도록 하고, 이에 위반한 경우 과태료를 부과 하도록 규정한 ｢노동조합 및 노동관계조정법｣ 조항은 과잉금지 원칙을 위반하여 노동조합의 단결권을 침해하지 아니한다.","｢교원의 노동조합 설립 및 운영 등에 관한 법률｣의 적용 대상을 ｢초‧중등교육법｣ 제19조 제1항의 교원이라고 규정함으로써, ｢고등교육법｣에서 규율하는 대학 교원들의 단결권을 인정하지 않는 ｢교원의 노동조합 설립 및 운영 등에 관한 법률｣ 조항은, 대학 교원이 노조형태의 단결체가 아니더라도 전문가단체 혹은 교수회 등을 통하여 사회적‧경제적 지위 향상을 도모할 수 있다는 점에서 초‧중등교원과 구별되므로 헌법에 위반되지 아니한다.",3,0,""],["2026-1","헌법",20,"혼인과 가족생활에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자간의 권리행사방해죄는 그 형을 면제하도록 한 ｢형법｣ 조항은 가족 생활의 자유를 직접 제한하는 것이다.","‘당사자 사이에 혼인의사의 합의가 없음을 원인으로 하는 혼인무효 판결에 의한 가족관계등록부 정정신청으로 해당 가족관계등록부가 정정된 때’ 가운데 ‘그 혼인무효사유가 한쪽 당사자나 제3자의 범죄행위로 인한 경우’에 한정하여 등록부 재작성 신청권을 부여한 ｢가족관계등록부의 재작성에 관한 사무처리지침｣ 조항은 신분등록 제도에 관한 규정일 뿐, 혼인과 가족생활을 스스로 결정하고 형성할 수 있는 자유를 제한하고 있다고 볼 수 없다.","입양신고 시 신고사건 본인이 시‧읍‧면에 출석하지 아니하는 경우에는 신고사건 본인의 신분증명서를 제시하도록 한 ｢가족 관계의 등록 등에 관한 법률｣ 조항은 입양당사자의 신고의사의 진실성을 담보하기 위한 것으로서 입양당사자의 가족생활의 자유를 침해한다고 보기 어렵다.","8촌 이내의 혈족 사이에서는 혼인할 수 없도록 하는 ｢민법｣ 조항은 근친혼으로 인하여 가까운 혈족 사이의 상호관계 및 역할, 지위와 관련하여 발생할 수 있는 혼란을 방지하고 가족제도의 기능을 유지하기 위한 것으로서 과잉금지원칙에 위배하여 혼인의 자유를 침해하지 않는다.",0,0,""],["2026-1","형사법",1,"형법이론에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","형벌법규를 해석할 때 법규정의 문언 자체가 비교적 명확한 개념으로 구성되어 있다고 하더라도 체계적·논리적 해석 방법을 제한 없이 사용할 수 있다.","업무상배임으로 취득한 재산상 이익이 있는 경우, 비록 이익 가액을 구체적으로 산정할 수 없더라도 재산상 이득액을 기준으로 가중 처벌하는 ｢특정경제범죄 가중처벌 등에 관한 법률｣ 제3조를 적용하는 것이 책임주의 원칙에 반하는 것은 아니다.","양벌규정에서 ‘행위자가 아닌 법인 또는 개인’은 국가형벌권 행사의 대상으로서 구성요건에서 정한 위반행위의 방지를 위한 주의와 감독의 해태 등을 근거로 별도의 형벌규정에 따라 법인 또는 개인의 직접책임 내지 자기책임에 기초하여 처벌되는 것이나, 양벌규정에서의 사업주와 행위자의 관계는 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와 동일하게 볼 수 있다.","강도상해･치상죄와 강간상해･치상죄는 단순히 평면적으로 비교하여 법정형의 과중 여부를 판단할 수 없으므로, 강도상해･치상죄의 법정형 하한을 강간상해･치상죄에 비하여 높게 규정하였다고 하더라도 형벌체계상의 균형을 상실한 것이라고 할 수 없다.",3,0,""],["2026-1","형사법",2,"구성요건의 유형에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","일반교통방해죄는 교통방해의 결과가 현실적으로 발생하여야 하는 것은 아니나 법익침해의 현실적 위험은 발생하여야 하므로 구체적 위험범이다.","스토킹행위를 전제로 하는 스토킹범죄는 행위자의 어떠한 행위를 매개로 이를 인식한 상대방에게 불안감 또는 공포심을 일으킴으로써 그의 자유로운 의사결정의 자유 및 생활형성의 자유와 평온이 침해되는 것을 막고자 하는 것을 보호법익으로 하는 침해범이다.","일반적으로 계속범의 경우 실행행위가 종료되는 시점에서의 법률이 적용되어야 할 것이나, 법률이 개정되면서 그 부칙에서 ‘개정된 법 시행 전의 행위에 대한 벌칙의 적용에 있어서는 종전의 규정에 의한다’는 경과규정을 두고 있는 경우 개정된 법이 시행되기 전의 행위에 대해서는 개정 전의 법을, 그 이후의 행위에 대해서는 개정된 법을 각각 적용하여야 하나, 법 개정 전후의 행위는 계속되는 행위이므로 그 유·무죄 판단은 서로 같아야 한다.","업무방해죄는 업무방해의 결과가 실제로 발생함을 요하는 것은 아니고 업무방해의 결과를 초래할 위험이 발생하면 충분한 추상적 위험범이나, 결과발생의 염려가 없는 경우에는 본 죄가 성립하지 아니한다.",3,0,""],["2026-1","형사법",3,"부작위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행위자가 구호의무를 이행함으로써 사망의 결과를 쉽게 방지 할 수 있음에도 그에 이르는 사태의 핵심적 경과를 그대로 방관하여 사망의 결과를 초래한 경우, 작위의무를 이행하였다면 결과가 발생하지 않았을 것이라는 관계가 인정되어야 부작위와 사망의 결과 사이에 인과관계가 있다.","작위를 내용으로 하는 범죄를 부작위에 의하여 범하는 부진정 부작위범이 성립하기 위하여는 부작위를 실행행위로서의 작위와 동일시할 수 있어야 한다.","경찰관이 불법체류자의 신병을 출입국관리사무소에 인계하지 않고 훈방하면서 이들의 인적사항조차 기재해 두지 아니하였다면, 작위에 의한 직무유기죄가 성립한다.","압류된 골프장시설을 보관하는 회사의 대표이사가 위 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장을 개장하게 하여 봉인이 훼손되게 한 경우, 부작위에 의한 공무상 표시무효죄가 성립한다.",2,0,""],["2026-1","형사법",4,"구성요건적 착오에 관한 각 학설의 적용에 대한 설명으로 가장 적절하지 않은 것은?","甲이 살해의 고의로 앞에 있는 사람이 A라고 생각하고 총을 쏘았으나 다가가서 확인해 보니 B가 맞아 사망한 경우, 구체적 부합설과 법정적 부합설의 결론은 일치한다.","甲이 살해의 고의로 A를 향해 총을 쏘았으나 총알이 빗나가서 옆에 있던 B가 맞아 사망한 경우, 구체적 부합설과 법정적 부합설의 결론은 일치하지 아니한다.","甲이 살해의 고의로 사육장 주인 A를 향해 총을 쏘았으나 다가가서 확인해 보니 사육장의 곰이 맞은 경우 甲이 인식했던 사실의 범죄 성립에 관하여, 구체적 부합설, 법정적 부합설, 추상적 부합설의 결론은 일치하지 아니한다.","甲이 손괴의 고의로 옆집 개를 향해 돌을 던졌으나 빗나가서 옆집 아이 A가 맞아 사망한 경우 甲이 인식했던 사실의 범죄 성립에 관하여, 구체적 부합설, 법정적 부합설, 추상적 부합설의 결론은 일치하지 아니한다.",2,0,""],["2026-1","형사법",5,"과실범에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","중실화죄와 업무상실화죄의 법정형은 동일하다.","화물차를 주차하고 적재함에 적재된 토마토 상자를 운반하던 중 적재된 상자 일부가 떨어지면서 지나가던 피해자에게 상해를 입힌 경우, ｢교통사고처리 특례법｣에 정한 ‘교통사고’에 해당 하지 않아 ｢형법｣상 업무상과실치상죄가 성립하지 않는다.","골프와 같은 개인 운동경기에 참가하는 자는 자신의 행동으로 인해 다른 사람이 다칠 수도 있으므로, 경기 규칙을 준수하고 주위를 살펴 상해의 결과가 발생하는 것을 미연에 방지해야 할 주의의무가 있으나 이러한 주의의무는 경기보조원에 대하여는 부담하지 않는다.","행정상의 단속을 주안으로 하는 법규는 과실범을 처벌하는 명문 규정이 있는 경우를 제외하고는, 해석상 과실범도 벌할 뜻이 명확한 경우라 하더라도 형법의 원칙에 따라 ‘고의’가 있어야 벌할 수 있다.",0,0,""],["2026-1","형사법",6,"결과적 가중범에 관한 설명 중 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 고의로 중한 결과를 발생하게 한 행위가 별도의 구성요건에 해당하고 그 고의범에 대하여 결과적 가중범에 정한 형보다 더 무겁게 처벌하는 규정이 있는 경우에는 그 고의범과 결과적 가중범이 상상적 경합관계에 있지만, 위와 같이 고의범에 대하여 더 무겁게 처벌하는 규정이 없는 경우에는 결과적 가중범이 고의범에 대하여 특별관계에 있으므로 결과적 가중범만 성립하고 이와 법조경합의 관계에 있는 고의범에 대하여는 별도로 죄를 구성하지 않는다. ㉡ ｢형법｣ 제15조 제2항이 규정하고 있는 결과적 가중범은 행위자가 행위시에 그 결과의 발생을 예견할 수 없을 때에는 비록 그 행위와 결과 사이에 인과관계가 있다 하더라도 무거운 죄로 벌할 수 없다. ㉢ 결과적 가중범의 성립요건으로 예견가능성은 일반인을 기준으로 객관적으로 판단되어야 하는 것이다. ㉣ 피해자를 강간한 후 피해자가 울면서 자신의 장래를 책임 지라고 이를 추궁하자 피해자를 타이르던 중 피해자가 계속 반항하므로 순간적으로 피해자를 살해할 것을 결의하고 양손으로 피해자의 목을 졸라 그 자리에서 질식 사망케 한 것이라면, 당시 살인의 확정적 범의가 있었음이 분명하여 결과적 가중범의 범의를 논할 여지가 없다.","㉠㉣","㉠㉡㉢","㉡㉢㉣","㉠㉡㉢㉣",3,0,""],["2026-1","형사법",7,"다음 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","존속폭행죄에서 폭행행위자가 피해자인 직계존속에게 스스로 범죄를 고백하였을 때에는 형을 감경 또는 면제할 수 있다.","｢형법｣ 제12조의 강요된 행위에서 방어할 방법이 없는 협박이란 자기 또는 친족의 생명, 신체, 자유에 대한 위해를 달리 막을 방법이 없는 협박을 의미한다.","책임조각사유로서 심신상실이란 심신장애로 인하여 사물을 변별할 능력이 없고 동시에 의사를 결정할 능력이 없을 때에만 적용된다.","행위자에게 적법행위를 기대할 가능성이 있는지 여부의 판단은 행위자가 행위 당시 인식하였던 사정과 행위 당시의 구체적인 상황 하에 행위자 대신 사회적 평균인을 두고 이 평균인의 관점에서 인식할 수 있었던 사정을 종합적으로 고려하여 판단 하여야 한다.",0,0,""],["2026-1","형사법",8,"미수범에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 미수범을 처벌하는 규정이 있다고 하여 반드시 침해범으로 해석할 것은 아니다. ㉡ ｢형법｣과 형사특별법에 규정되어 있는 결과적 가중범 중 특수강간치상죄와 같이 별도의 미수범 처벌규정을 두고 있는 것은 ‘형이 무거워지는 요인이 되는 결과가 과실로 생긴 결과적 가중범’과 ‘고의로 그 결과를 일으킨 결합범’을 하나의 조문에서 규정하고 있는 입법형식에서 찾아볼 수 있는데, 이는 입법자가 결과적 가중범에도 성질상 미수범 규정이 적용될 수 있음을 보여주는 입법형식이라고 할 수 있다. ㉢ 피해자가 항거불능 상태에 있다고 인식하고 그러한 상태를 이용하여 간음하려고 하였으나 간음에 이르지 못한 경우, 피해자가 실제로는 심신상실의 상태에 있지 않았다면 결과가 발생할 위험성이 있다고 하더라도 준강간죄의 불능미수가 성립하지 않는다. ㉣ 구 ｢부정경쟁방지법｣ 제19조(양벌규정)가 “법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이‧‧‧제18조 제1항부터 제4항까지의 어느 하나에 해당하는 위반행위를 하면 그 행위자를 벌하는 외에 그 법인 또는 개인에게도 해당 조문의 벌금형을 과한다.”고 규정하고 있고, 동법 제18조의2(미수)가 “제18조 제1항 및 제2항의 미수범은 처벌한다.”고 규정하고 있는 경우, 종업원이 미수범을 처벌하는 제18조의2에 해당하는 위반행위를 하였더라도 위 양벌규정은 법인에게 적용될 수 없다.","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(X) ㉣(X)","㉠(X) ㉡(O) ㉢(O) ㉣(X)","㉠(X) ㉡(X) ㉢(X) ㉣(O)",0,0,""],["2026-1","형사법",9,"공범에 관한 다음 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우 이탈자는 나머지 범행에 관하여는 죄책을 부담하지 아니한다.","2인 이상의 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여는 공범에 관한 형법 총칙 규정이 적용될 수 없는데, 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있더라도 그 구성요건이 대향범의 형태로 실행되는 경우에도 이러한 대향범에 관한 법리가 적용된다.","배임죄에서 계속된 거래행위 도중에 공동정범으로 범행에 가담한 자는 비록 그가 그 범행에 가담할 때에 이미 이루어진 종전의 범행을 알았다 하더라도 그 가담 이후의 범행에 대하여만 공동정범으로 책임을 지므로, 거래행위 전체가 포괄하여 하나의 죄가 된다 할지라도 그 가담 이전의 행위에 대하여서까지 유죄로 인정할 수는 없다.","｢형법｣ 제30조의 공동정범에는 고의범뿐만 아니라 과실범도 포함되므로, 비록 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없더라도 과실범의 공동정범은 성립할 수 있다.",2,0,""],["2026-1","형사법",10,"공범과 신분에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","치과의사가 환자의대량유치를위해치과기공사들에게내원환자들에 대한 진료행위를 하도록 지시하여 치과기공사들이 각 단독으로 진료행위를 하였다면, 치과의사는 무면허 의료행위의 교사범에 해당한다.","의료인일지라도 의료인 아닌 자의 의료행위에 공모하여 가공 하면 ｢의료법｣이 규정하는 무면허 의료행위의 공동정범으로서의 책임을 진다.","신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는, 공범종속성설에 의하여 신분이 있는 교사범이 신분이 없는 정범보다 중하게 처벌될 수는 없다.","｢변호사법｣ 제34조 제4항의 “변호사가 아닌 자는 변호사를 고용하여 법률사무소를 개설･운영하여서는 아니 된다.”라는 규정에 위반하여 변호사가 변호사 아닌 자에게 고용되어 법률 사무소의 개설‧운영에 관여한 경우, 변호사의 행위가 일반적인 형법 총칙상의 공모, 교사 또는 방조에 해당된다고 하더라도 변호사를 변호사 아닌 자의 공범으로서 처벌할 수는 없다.",2,0,""],["2026-1","형사법",11,"죄수에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","아동･청소년이용음란물을 제작한 자가 그 음란물을 소지하게 되는 경우 청소년성보호법 위반(음란물소지)죄는 청소년성보호법 위반(음란물제작･배포등)죄에 흡수되므로 양자는 법조경합 중 흡수관계에 있다.","｢전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법｣의 취지 및 내용 등에 비추어 보면, 전기통신금융사기죄는 ｢형법｣상 사기죄와 입법 목적을 달리할 뿐만 아니라 구체적인 구성요건에도 일부 차이가 있어, 전기통신금융사기죄 구성요건이 사기죄 구성 요건의 모든 요소를 포함하는 외에 다른 요소를 구비하는 경우에 해당하므로 양자는 법조경합이 아닌 실체적 경합의 관계에 있다.","행위자가 대출금 교부를 전후하여 이루어진 일련의 위계행위를 통해 은행의 대출 심사 및 대출금 환수 여부 심사 등에 관한 전반적인 업무를 방해한 경우, 은행의 대출 담당 직원을 기망하여 대출금을 교부받은 사기죄와 위계에 의한 업무방해죄는 법조경합이 아닌 실체적 경합의 관계에 있다.","피해자를 도구로 이용한 간접정범 형태로 유사강간죄나 강제추행죄가 성립하는 경우 별도로 강요죄가 성립하지 않으므로, 양자는 법조경합 중 특별관계에 있다.",1,0,""],["2026-1","형사법",12,"甲이 범한 죄의 경합에 관한 설명으로 가장 적절하지 않은 것은? (단, ㉠㉡㉢㉣㉤죄는 독립된 별개의 범죄로서, 지문에 제시된 사항 외에는 고려하지 않음) ㉠죄 ㉡죄 ㉢죄 ㉣죄 ㉤죄 2025년 1월 2월 4월 10월 12월","甲이 만일 2025년 9월에 ㉢죄로 기소되어 2026년 1월에 벌금형이 확정되었다면, 2026년 3월 14일을 기준으로 ㉠㉡㉣㉤죄는 모두 ｢형법｣ 제37조 전단의 동시적 경합범에 해당한다.","甲이 만일 2026년 2월에 ㉢죄로 기소되어 2026년 3월 14일을 기준으로 아직 확정판결에 이르지 않았다면, ㉠㉡㉢㉣㉤죄는 모두 ｢형법｣ 제37조 전단의 동시적 경합범에 해당한다.","甲이 만일 2025년 5월에 ㉢죄로 기소되어 2025년 11월에 징역형으로 확정판결을 받았다면, 2026년 3월 14일을 기준으로 ㉢죄와 ｢형법｣ 제37조 후단의 사후적 경합범에 해당하는 것은 ㉠㉡㉣죄만이다.","甲이 만일 2025년 5월에 ㉢죄로 기소되어 2025년 8월에 징역형과 동시에 집행유예로 확정판결을 받았다면, 2026년 3월 14일을 기준으로 ㉢죄와 ｢형법｣ 제37조 후단의 사후적 경합범에 해당 하는 것은 ㉠㉡㉣㉤죄이다.",3,0,""],["2026-1","형사법",13,"형사제재에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","형의 집행유예를 선고받은 자는 ｢형법｣ 제65조에 의하여 그 선고가 실효 또는 취소됨이 없이 정해진 유예기간을 무사히 경과하여 형의 선고가 효력을 잃게 되었다면, 형의 선고가 있었다는 기왕의 사실 자체까지 없어지는 것이므로, ｢형법｣ 제59조 제1항 단행에서 정한 선고유예 결격사유인 ‘자격정지 이상의 형을 받은 전과가 있는 자’에 해당하지 않는다.","｢형법｣ 제52조 제1항에서 말하는 ‘자수’에는 수사기관의 직무상의 질문 또는 조사에 응하여 범죄사실을 진술하는 것도 해당한다.","임의적 감경사유의 존재가 인정되고 법관이 그에 따라 징역형에 대해 법률상 감경을 하더라도 ｢형법｣ 제55조 제1항 제3호에 따라 상한과 하한을 모두 2분의 1로 감경할 수는 없다.","보안처분은 범죄행위를 한 자에 대한 응보를 주된 목적으로 그 책임을 추궁하는 사후적 처분인 형벌과 구별되어 그 본질을 달리하는 것으로서 형벌에 관한 일사부재리의 원칙이 그대로 적용되지 않는다.",3,0,""],["2026-1","형사법",14,"강간과 추행의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 자신이 지배하지 않는 서버에 저장된 아동‧청소년이용 음란물에 접근하여 다운로드 받을 수 있는 인터넷 주소를 제공받은 것만으로도 청소년성보호법 위반(음란물소지)죄에 해당한다.","甲과 乙이 A와 술을 마시던 중 A를 강간하기로 공모하고, 합동하여 인근 편의점에서 구입한 음료에 미리 소지하고 있던 졸피뎀 불상량을 넣은 다음 마시게 한 뒤 항거불능의 상태가 된 A를 강간하려 하였으나, A의 남편 등의 계속적인 휴대전화 통화 시도로 인하여 미수에 그쳤다 하더라도, A가 졸피뎀으로 인한 일시적인 수면 또는 의식불명의 상태에 이른 경우, 甲과 乙은 ｢성폭력범죄의 처벌 등에 관한 특례법｣상의 특수강간치상죄의 기수범이 성립한다.","강제추행죄는 상대방의 신체에 대해 불법한 유형력을 행사하거나 상대방으로 하여금 공포심을 일으킬 수 있는 정도의 해악을 고지하여 상대방을 추행한 경우에 성립한다.","｢형법｣ 제299조 준강간죄에서 ‘항거불능’의 상태란 심신상실 이외의 원인으로 심리적 또는 물리적으로 반항이 절대적으로 불가능하거나 현저히 곤란한 경우를 의미한다.",0,0,""],["2026-1","형사법",15,"명예에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","누구든지 범죄가 있다고 생각하는 때에는 고발할 수 있는 것이므로 어떤 사람이 범죄를 고발하였다는 사실이 주위에 알려졌다고 하여 그 고발사실 자체만으로 고발인의 사회적 가치나 평가가 침해될 가능성이 있다고 볼 수는 없고, 다만 그 고발의 동기나 경위가 불순하다거나 온당하지 못하다는 등의 사정이함께알려진경우에는고발인의명예가침해될가능성이있다.","명예훼손에서 행위자의 주요한 동기나 목적이 공공의 이익을 위한 것이라면 부수적으로 다른 사익적 목적이나 동기가 내포되어 있더라도 ｢형법｣ 제310조의 적용을 배제할 수 없다.","어떠한 표현이 모욕죄의 모욕에 해당하는지는 상대방 개인의 주관적 감정이나 정서상 어떠한 표현을 듣고 기분이 나쁜지 등 명예감정을 침해할 만한 표현인지를 기준으로 판단할 것은 아니다.","행정상 공표의 방법으로 실명을 공개함으로써 타인의 명예를 훼손한 경우, 그 내용이 오로지 공공의 이익에 관한 것이라면 공표사실이 의심의 여지없이 확실히 진실이라고 믿을 만한 객관적이고도 타당한 확증과 근거가 없더라도 명예훼손의 위법성은 조각된다.",3,0,""],["2026-1","형사법",16,"신용‧업무와 경매에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","어떤 행위의 결과 상대방의 업무에 지장이 초래되었더라도 행위자가 상대방의 의사결정에 관여할 수 있는 권한을 가지고 있거나 업무상의 지시를 할 수 있는 지위에 있는 경우에는 그 행위의 내용이나 수단이 사회통념상 허용될 수 없는 등 특별한 사정이 없는 한 업무방해죄를 구성하는 위력을 행사한 것이라고 할 수 없다.","반전과 평화메시지와 같은 공적 관심사에 대한 표현행위가 업무방해죄에서 말하는 위력의 행사에 해당하는지는 헌법상 표현의 자유의 중요성과 보호범위 및 한계, 형벌의 보충성과 최후수단성의 원칙도 함께 음미하여 판단하여야 한다.","입찰방해죄에서 방해의 대상인 ‘입찰’은 공정한 자유경쟁을 통한 적정한 가격형성을 목적으로 하는 입찰절차를 말하고, 여기에는 공적‧사적 경제주체가 임의의 선택에 따라 진행하는 계약체결 과정도 포함한다.","현수막 등을 설치하여 어떠한 사실이나 의견 등을 알리는 것이 일회적 또는 일시적인 사무라 하더라도 그것이 계속성을 갖는 본래의 업무수행의 일환으로서 또는 본래의 업무수행과 밀접 불가분의 관계에서 행하여지는 것이라면 업무방해죄에 의하여 보호되는 ‘업무’에 해당할 수는 있다.",2,0,""],["2026-1","형사법",17,"개인적 법익에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","체포죄는 계속범으로서 체포의 행위에 확실히 사람의 신체의 자유를 구속한다고 인정할 수 있을 정도의 시간적 계속이 있어야 기수에 이르고, 신체의 자유에 대한 구속이 그와 같은 정도에 이르지 못하고 일시적인 것으로 그친 경우에는 체포죄의 미수범이 성립할 뿐이다.","인터넷 계정의 아이디 및 비밀번호가 ｢형법｣ 제316조 제2항 소정의 전자기록 등 특수매체기록에 해당하기 위해서는 특정인의 의사가 표시되어야 하나, 아이디 및 비밀번호 자체는 특정인의 의사를 표시한 것으로 보기 어려워 기술적 수단을 이용하여 그 내용을 알아냈더라도 전자기록등내용탐지죄가 성립하지 않는다.","예금주인 현금카드 소유자로부터 일정한 금액의 현금을 인출해 오라는 부탁과 함께 현금카드를 건네받아 그 위임을 받은 금액을 초과하여 현금을 인출하는 방법으로 그 차액 상당을 위법하게 이득할 의사로 현금자동지급기에 그 초과된 금액이 인출되도록 입력하여 그 초과된 금액의 현금을 인출한 경우, 그 차액 상당액에 대한 컴퓨터 등 사용사기죄가 성립한다.","｢성폭력범죄의 처벌 등에 관한 특례법｣상 주거침입강간죄의 실행의 착수시기는 주거침입 행위 후 강간죄의 실행행위에 나아간 때이다.",1,0,""],["2026-1","형사법",18,"사기죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사기의 공모공동정범이 그 기망방법을 구체적으로 몰랐다고 하더라도 공모관계를 부정할 수 없다.","기망행위를 수단으로 한 권리행사의 경우 그 권리행사에 속하는 행위와 수단에 속하는 기망행위를 전체적으로 관찰하여 그와 같은 기망행위가 사회통념상 권리행사의 수단으로서 용인할 수 없는 정도라면, 권리행사에 속하는 행위는 사기죄를 구성한다.","甲이 정상적으로 대출금을 반환할 의사나 능력이 없음에도 휴대전화에 설치된 카드회사의 애플리케이션을 통해 카드론 대출을 신청하여 합계 34,500,000원을 자신의 계좌로 송금받았 더라도, 그 대출신청을 처리하는 일련의 과정에 카드회사 직원의 개입‧확인 없이 전산상 자동으로 처리되어 자동으로 송금받았다면 사기죄로 처벌할 수 없다.","재물에 대한 사기죄에서 외관상 재물을 교부하는 행위가 있다면, 그 재물이 범인의 자유로운 처분이 가능한 상태에 놓이지 않고 여전히 피해자의 지배 아래에 있는 것으로 평가되더라도, 그 재물에 대한 처분행위는 인정된다.",3,0,""],["2026-1","형사법",19,"횡령과 배임의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","차량과 같이 소유권의 취득에 등록이 필요한 경우 횡령죄의 주체는 차량의 등록명의자여야 하므로, 소유권의 취득에 등록이 필요한 타인 소유의 차량을 인도받아 보관하고 있는 자가 이를 사실상 임의처분해도 횡령죄는 성립하지 않는다.","재산상의 손실을 야기한 임무위배행위가 동시에 그 손실을 보상할 만한 재산상의 이익을 준 경우, 예컨대 배임행위로 인한 급부와 반대급부가 상응하고 다른 재산상 손해도 없는 때에는 전체적 재산가치의 감소, 즉 재산상 손해가 있다고 할 수 없다.","횡령죄의 본질이 신임관계에 기초하여 위탁된 타인의 물건을 위법하게 영득하는데 있음에 비추어 볼 때 위탁신임관계는 횡령죄로 보호할 만한 가치 있는 신임에 의한 것으로 한정함이 타당하다.","업무상배임죄에서 재산상의 손해라 함은 현실적인 손해가 발생한 경우뿐만 아니라 재산상 실해 발생의 위험을 초래한 경우도 포함되고, 재산상 손해의 유무에 대한 판단은 법률적 판단에 의하지 않고 경제적 관점에서 파악하여야 한다.",0,0,""],["2026-1","형사법",20,"재산에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","보도의 대상이 되는 자가 언론사 소속 기자에게 소위 ‘유료 기사’ 게재를 청탁하는 행위는 사실상 ‘광고’를 ‘언론 보도’인 것처럼 가장하여 달라는 것으로 배임수재죄의 부정한 청탁에 해당하고, 설령 그 ‘유료 기사’의 내용이 객관적 사실과 부합하더라도 언론 보도를 금전적 거래의 대상으로 삼은 이상 그 자체로 부정한 청탁에 해당한다.","사무처리시스템의 프로그램 자체에서 발생하는 오류를 적극적으로 이용하여 그 사무처리의 목적에 비추어 정당하지 아니한 사무처리를 하게 하는 행위는 특별한 사정이 없는 한 ｢형법｣ 제347조의2의 ‘부정한 명령의 입력’에 해당한다고 보아야 한다.","재물손괴죄에서 ‘재물의 효용을 해한다.’고 함은 사실상으로나 감정상으로 그 재물을 본래의 사용목적에 제공할 수 없게 하는 상태로 만드는 것을 말하며, 일시적으로 그 재물을 이용할 수 없거나 구체적 역할을 할 수 없는 상태로 만드는 것도 포함한다.","주거침입행위와 절취행위가 모두 야간에 이루어졌다면 절도의 고의가 언제 생겼는지를 불문하고 ｢형법｣상 야간주거침입절도죄가 성립할 뿐 주거침입죄와 절도죄의 경합범이 되는 것은 아니다.",3,0,""],["2026-1","형사법",21,"재산에 대한 죄에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 장물죄를 지은 사람이 본범과 배우자, 직계혈족‧동거친족 또는 그 배우자의 관계인 경우에는 그 형을 감경하거나 면제한다. ㉡ 甲이 술집을 운영하는 A로부터 술값 26만원의 지급을 요구받자, A를 유인‧폭행하여 술값의 지급을 면하기로 마음먹고, A를 OO아파트 부근 골목으로 유인한 후 A의 어깨 부위를 붙잡아 밀치고 발로 다리를 걸어 바닥에 넘어 뜨리는 등 반항하지 못하게 한 다음 그대로 도주한 경우, 甲은 준강도죄의 기수에 해당한다. ㉢ 업무상배임죄에서 본인에게 재산상 손해를 가한다 함은 총체적으로 보아 본인의 재산상태에 손해를 가하는 경우를 말하고, 이와 같은 법리가 타인의 사무를 처리하는 자 내지 제3자가 취득하는 재산상 이익에 대하여도 동일하게 적용 되는 것은 아니다. ㉣ 문서가 자기명의인 경우에는 타인 소유라 하더라도 문서손괴죄의 객체가 될 수 없다.","0개","1개","2개","3개",0,0,""],["2026-1","형사법",22,"공공의 안전과 평온에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제114조에서 ‘범죄를 목적으로 하는 집단’의 ‘조직’은 특정 다수인이 의사 연락을 통하여 계속적으로 결합된 집합체를 형성함을 의미하고 일정한 형식을 필요로 하지 않는다.","｢형법｣ 제116조의3에서는 정당한 이유 없이 도로‧공원 등 불특정 또는 다수의 사람이 이용하거나 통행할 수 있는 공공 장소에서 사람의 생명, 신체에 위해를 가할 수 있는 흉기를 소지하고 이를 드러내어 공중에게 불안감 또는 공포심을 일으킨 경우, 기수범뿐만 아니라 미수범도 처벌한다.","｢형법｣ 제116조의2의 불특정 또는 다수의 사람의 생명, 신체에 위해를 가할 것을 내용으로 공연히 공중을 협박하는 행위를 상습으로 한 경우, 동조 제1항에 정한 형의 2분의 1까지 가중한다.","어떤 도로가 일반 공중의 통행에 제공된 공로에 해당하는 경우에는 부지의 소유관계나 통행권리관계 또는 통행인의 많고 적음 등을 가리지 않고 일반 공중의 교통안전 등 자유로운 통행이 ｢형법｣상 일반교통방해죄의 보호법익으로 보장된다고 볼 수 있다.",1,0,""],["2026-1","형사법",23,"문서에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 통관 업무를 위하여 받아놓은 ‘OO국제무역유한공사’ 명의의 인보이스 엑셀파일의 화주란과 날짜란을 각각 변경한 후 이를 출력하여 진정하게 성립한 문서인 것처럼 교부하여 행사 하였다면, 甲의 행위는 각각 사문서위조 및 위조사문서행사죄에 해당한다.","문서 작성의 권한을 위임받은 자가 그 위임받은 권한의 범위 내에서 이를 남용하여 문서를 작성한 경우, 사문서위조죄가 성립한다.","공무원 甲이 국회 국정조사절차에서 증언한 후 국회의원으로부터 추가 서면질의를 받고, 실무 공무원 A로 하여금 ‘비서실에서는 20～30분 단위로 간단없이 유‧무선으로 보고를 하였기 때문에, 공무원 B는 직접 대면보고 받는 것 이상으로 상황을 파악하고 있었다고 생각합니다.’라는 내용의 서면답변서를 작성하여 국회에 제출하도록 한 경우, 위 답변서는 공문서에 해당하지 않는다.","식당의 주‧부식 구입 업무를 담당하는 공무원 甲이 주‧부식 구입요구서의 과장결재란에 권한 없이 자신의 서명을 한 경우, 자격모용공문서작성죄가 성립함은 별론으로 하고 공문서위조죄가 성립할 수는 없다.",3,0,""],["2026-1","형사법",24,"사회적 법익에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","위조문서행사죄와 위조유가증권행사죄 및 위조통화행사죄는 모두 위조임을 알고 있는 자에게 교부하더라도 성립한다.","지붕과 문짝, 창문이 없고 담장과 일부 벽체가 붕괴된 철거 대상 건물로서 사실상 기거‧취침에 사용할 수 없는 상태의 폐가는 ｢형법｣ 제166조의 건조물이 아닌 ｢형법｣ 제167조의 물건에 해당한다.","｢형법｣ 제243조(음화반포등)는 음란한 문서, 도화, 필름 기타 물건을 반포, 판매 또는 임대하거나 공연히 전시 또는 상영한 자에 대한 처벌 규정으로서 컴퓨터 프로그램파일은 위 규정에서 규정하고있는문서, 도화, 필름기타물건에해당한다고할수없다.","甲이 환전상으로부터 구매한 게임머니를 사용하여 인터넷 사이트에서 스포츠 경기의 승패, 점수 차를 예측하여 맞추는 게임을 하여 예측이 적중되면 미리 정해진 배당률에 따른 게임머니를 지급받고 지급받은 게임머니를 환전상을 통해 현금으로 환전한 경우, 위 게임은 ｢형법｣ 제246조의 도박에 해당한다.",0,0,""],["2026-1","형사법",25,"공무원의 직무에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","지방자치단체장이 전국공무원노동조합이 주도한 파업에 참가한 소속 공무원들에 대하여 관할 인사위원회에 징계의결요구를 하지 아니하고 가담 정도의 경중을 가려 자체 인사위원회에 징계의결요구를 하거나 훈계처분을 하도록 지시한 행위는 직무유기죄를 구성한다.","공무원이 퇴임한 이후에는 직권이 존재하지 않아 직권남용죄가 성립할 수 없으나 퇴임 후에도 실질적 영향력을 행사하는 등으로 퇴임 전 공모한 범행에 관한 기능적 행위지배가 계속되었다고 인정할 만한 특별한 사정이 있다면, 퇴임 후의 범행에 관하여도 공범으로서 책임을 질 수 있다.","검사나 사법경찰관 등 수사주체의 판단에는 상당한 재량의 여지가 있다고 볼 수 없기 때문에 긴급체포 당시의 상황으로 보아서 그 요건의 충족 여부에 관한 검사나 사법경찰관의 판단이 경험칙에 비추어 현저히 합리성을 잃은 경우에는 불법 체포죄가 성립한다.","공무원으로부터 직무상 비밀을 누설받은 자에 대해서는 공무상 비밀누설죄의공동정범은성립할수없으나교사범은성립할수있다.",1,0,""],["2026-1","형사법",26,"뇌물죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","공무원이 그 지위를 이용하여 자신의 직무가 아닌 다른 공무원의 직무에 속한 사항의 알선행위로서 금품을 수수한 경우에도 ｢형법｣ 제129조 제1항의 뇌물수수죄가 성립한다.","지방자치단체장이 직무에 관하여 부정한 청탁을 받고 지방자치 단체에 금품을 제공하게 하였다면 공무원 개인이 금품을 취득한 경우와 동일시할 수는 없고, 그 공무원이 단체를 대표하는 지위에 있는 경우에도 마찬가지여서 ｢형법｣ 제130조의 제3자 뇌물제공죄가 성립할 수 있다.","뇌물을 수수한 자가 공동수수자가 아닌 교사범 또는 종범에게 뇌물 중 일부를 사례금 등의 명목으로 교부한 경우, 이는 뇌물을 수수하는 데 따르는 부수적 비용의 지출 또는 뇌물의 소비행위로 볼 수 없으므로 교사범 또는 종범에게 수뢰액을 추징하여야 한다.","｢형법｣ 제133조 제2항의 제3자뇌물취득죄는 뇌물공여자로부터 금품을 교부받는 것만으로는 부족하고, 교부받은 금품을 수뢰할 사람에게 전달하여야 성립한다.",1,0,""],["2026-1","형사법",27,"국가의 사법작용을 침해하는 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","도주죄의 범인이 도주행위를 하여 기수에 이르른 이후에 범인의 도피를 도와주는 행위는 범인도피죄에 해당할 수 있을 뿐 도주 원조죄에는 해당하지 아니한다.","공범 중 1인이 그 범행에 관한 수사절차에서 참고인 또는 피의자로 조사받으면서 자기의 범행을 구성하는 사실관계에 관하여 허위로 진술하고 허위 자료를 제출한 경우, 이러한 행위가 다른 공범을 도피하게 하는 결과가 된다고 하더라도 범인도피죄로 처벌할 수 없고, 이때 공범이 이러한 행위를 교사 하였더라도 범죄가 될 수 없는 행위를 교사한 것에 불과하여 범인도피교사죄가 성립하지 않는다.","위증죄에는 ｢형법｣ 제151조에 따른 친족간의 특례규정과 ｢형법｣ 제153조에 따른 자백･자수의 특례규정이 모두 적용된다.","증거위조죄에서 ‘증거’라 함은 타인에게 유리한 것이건 불리한 것이건 가리지 아니하며 또 증거가치의 유무 및 정도를 불문한다.",2,0,""],["2026-1","형사법",28,"피의자에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피의자는 일체의 진술을 하지 않거나 개개의 질문에 대하여 진술을 하지 않을 수 있고, 진술을 하지 않더라도 불이익을 받지 않으며, 피의자가 진술을 거부할 권리를 포기하고 행한 진술은 법정에서 유죄의 증거로 사용될 수 있다.","변호인의 접견교통의 상대방인 신체구속을 당한 피의자가 그 변호인을 자신의 범죄행위에 공범으로 가담시키려고 하였다는 등의 사정만으로 그 변호인과 피의자 사이의 접견교통을 금지 하는 것은 정당화될 수 없고, 이러한 법리는 신체구속을 당한 사람의 변호인이 1명이 아니라 여러 명이라고 하여 달라질 수 없으며, 어느 변호인의 접견교통권 행사가 그 한계를 일탈한 것인지의 여부는 해당 변호인을 기준으로 하여 개별적으로 판단하여야 한다.","긴급체포된 피의자는 체포적부심사를 청구할 수 있으나, 법원은 해당 피의자에 대하여 피의자의 출석을 보증할 만한 보증금의 납입을 조건으로 하여 결정으로 석방을 명할 수 없다.","피의자는 미리 증거를 보전하지 않으면 그 증거를 사용하기 곤란한 사정이 있는 때에 ｢형사소송법｣ 제184조에 따른 증거보전을 청구 하거나 동법 제221조의2에 따른 증인신문을 청구할 수 있다.",3,0,""],["2026-1","형사법",29,"임의수사에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 범죄를 수사하면서 불특정, 다수의 출입이 가능한 장소에 통상적인 방법으로 출입하여 아무런 물리력이나 강제력을 행사하지 않고 통상적인 방법으로 피의자를 찾는 등 위법행위를 확인하는 것은 해당 장소의 소유자, 영업주 및 관리자 등 권한 있는 자의 동의가 있은 때에 한해 임의수사의 한 방법으로 허용된다.","사법경찰관은 피의자신문에 참여한 변호인이 피의자의 옆자리 등 실질적인 조력을 할 수 있는 위치에 앉도록 해야 하고, 정당한 사유가 없으면 피의자에 대한 법적인 조언‧상담을 보장하되, 피의자에 대한 신문이 아닌 단순 면담의 경우에는 변호인의 참여‧조력을 제한할 수 있다.","피의자신문에 참여한 변호인이 의견을 진술한 경우에 사법경찰관은 변호인의 의견이 기재된 피의자신문조서를 변호인에게 열람하게 한 후 변호인으로 하여금 그 조서에 기명날인 또는 서명을 하게 하여야 하고, 변호인의 신문참여 및 그 제한에 관한 사항을 피의자 신문조서에 기재하여야 한다.","사법경찰관은 참고인의 진술을 들을 때에는 영상녹화하여야 하고, 이 경우 미리 영상녹화사실을 알려주어야 하며, 조사의 개시부터 종료까지의 전 과정 및 객관적 정황을 영상녹화하여야 한다.",2,0,""],["2026-1","형사법",30,"체포‧구속의 절차에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","체포영장을 청구함에 있어서 동일한 범죄사실에 관하여 그 피의자에 대하여 전에 체포영장을 청구하였거나 발부받은 사실이 있는 때에는 다시 체포영장을 청구하는 취지 및 이유를 기재하여야 한다.","사법경찰관이 피의자를 긴급체포한 경우, 피의자를 구속하고자 할 때에는 지체 없이 검사에게 신청하여 검사의 청구로 관할지방 법원판사에게 구속영장을 청구하여야 하고, 구속영장을 발부받지 못한 때에는 피의자를 즉시 석방하여야 하며, 이 경우 석방된 자는 영장없이는 동일한 범죄사실에 관하여 체포하지 못한다.","사법경찰관은 체포영장 또는 구속영장의 유효기간 내에 영장의 집행에 착수하지 못하여 반환하는 경우, ｢검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정｣ 제35조 제3항에 따라 해당 영장을 발부한 법원에 반환해야 한다.","법관이 검사의 청구에 의하여 체포된 피의자의 구금을 위하여 구속영장을 발부하면 사법경찰관리는 지체 없이 신속하게 구속 영장을 집행하여야 하고, 피의자에 대한 구속영장의 제시와 집행이 그 발부 시로부터 정당한 사유 없이 시간이 지체되어 이루어졌다면, 구속영장이 그 유효기간 내에 집행되었다고 하더라도 위 기간 동안 체포 내지 구금 상태는 위법하다.",2,1,"②의 긴급체포 후 구속영장 절차는 사법경찰관 신청·검사 청구 구조가 유지되지만, 인치·구속기간 규정(제202·203조)을 함께 확인해야 합니다."],["2026-1","형사법",31,"｢통신비밀보호법｣에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢통신비밀보호법｣에서는 누구든지 공개되지 아니한 타인 간의 대화를 청취할 수 없도록 하고 있고, 여기서 금지하는 청취행위는 전자장치 또는 기계적 수단을 이용한 경우는 물론 타인 간의 비공개 대화를 자신의 청력을 이용하여 듣는 행위도 포함된다.","비공개 조치를 취한 후 방송을 송출하는 인터넷개인방송의 방송자가 제3자의 시청‧녹화 사실을 알거나 알 수 있었음에도 방송을 중단하거나 제3자를 배제하지 않은 채 방송을 계속 진행하는 등 허가받지 아니한 제3자의 시청‧녹화를 사실상 승낙‧용인한 것으로 볼 수 있는 경우, 불특정인 혹은 다수인을 직간접적인 대상으로 하는 인터넷개인방송의 일반적 특성상 그 제3자 역시 인터넷개인방송의 당사자에 포함될 수 있으므로, 이러한 제3자가 방송 내용을 지득‧채록하는 것은 ｢통신비밀 보호법｣에서 정한 감청에 해당하지 않는다.","사법경찰관은 범죄수사를 위한 통신제한조치의 허가요건이 구비된 경우에는 검사에 대하여 각 피의자별 또는 각 피내사자별로 통신제한조치에 대한 허가를 신청하고, 검사는 법원에 대하여 그 허가를 청구할 수 있다.","사법경찰관은 국가안보를 위협하는 음모행위, 직접적인 사망이나 심각한 상해의 위험을 야기할 수 있는 범죄 또는 조직범죄 등 중대한 범죄의 계획이나 실행 등 긴박한 상황에 있고, 범죄수사를 위한 통신제한조치 허가요건을 구비한 자에 대하여 허가절차를 거칠 수 없는 긴급한 사유가 있는 때에는 법원의 허가없이 통신 제한조치를 할 수 있다.",0,0,""],["2026-1","형사법",32,"압수‧수색에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 전자정보가 제3자 소유‧관리의 정보저장매체에 복제되어 임의제출된 경우, 압수‧수색 과정에서 복제 전자정보를 임의제출하는 사람에게만 참여의 기회를 부여하는 것이 현저히 부당하다는 등의 특별한 사정이 없는 한 복제 전자정보 임의제출자 외에 원본 전자정보 관리처분권자에게 참여권을 인정해야 하는 것은 아니다. ㉡ 수사기관은 강제채혈, 강제채뇨 등과 같이 강제처분이 법률상 의료인 아닌 자가 수행할 수 없는 의료행위를 수반하는 경우, 잠금장치 해제, 전자정보의 복호화나 중량 압수물의 운반과 같이 단순한 기술적, 사실적 보조가 필요한 경우, 압수‧수색 후 환부 대상이 될 도품의 특정을 위하여 필요한 경우 등 제한적 범위 내에서 압수‧수색영장의 집행기관인 사법경찰관리의 엄격한 감시‧감독하에 제3자의 집행 조력이 정당화될 수 있는 예외적인 경우가 아닌 이상 압수‧수색 현장에 ｢형사소송법｣상 참여권자나 참여할 수 있도록 규정된 사람 이외의 사람을 참여시킬 수는 없고, 참여가 허용된 사람 이외의 제3자를 임의로 참여케 할 수 없다. ㉢ 사법경찰관이 피의자를 타인의 주거지에서 긴급체포한 후, 급속을 요하여 해당 장소에서 압수‧수색‧검증을 하는 경우에는 주거주, 간수자 또는 이에 준하는 사람을 반드시 참여하게 하여야 한다. ㉣ 정보저장매체를 소지하고 있던 사람이 이를 분실한 경우와 같이 그 권리를 포기하였다고 단정하기 어려운 경우에도 수사기관이 그러한 사정을 알거나 충분히 알 수 있었음에도 이를 유류물로서 영장 없이 압수하였다는 등의 특별한 사정이 있는 때에는 영장에 의한 압수나 임의제출물 압수와 같이 수사기관의 압수 당시 참여권 행사의 주체가 되는 피압수자가 존재한다고 평가할 수 없다.","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(O) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(O) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(X)",1,0,""],["2026-1","형사법",33,"｢형사소송법｣과 ｢검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정｣에 따른 수사의 종결에 대한 설명으로 가장 적절하지 않은 것은?","사법경찰관은 범죄를 수사하여 범죄혐의가 있다고 인정되는 경우에는 지체 없이 검사에게 사건을 송치하고, 관계 서류와 증거물을 검사에게 송부하여야 하며, 그 밖의 경우에는 그 이유를 명시한 서면과 함께 관계 서류와 증거물을 지체 없이 검사에게 송부하여야 한다.","사법경찰관의 불송치 결정은 혐의없음, 죄가안됨, 공소권없음, 각하로 구분할 수 있고, 사법경찰관은 하나의 사건 중 피의자가 여러 사람이거나 피의사실이 여러 개인 경우에는 분리하여 결정해야 한다.","사법경찰관은 죄가안됨에 해당하는 사건이 ｢형법｣ 제10조 제1항에 따라 벌할 수 없는 경우인 때에는 해당 사건을 검사에게 이송한다.","사법경찰관으로부터 ｢형사소송법｣ 제245조의6에 따라 송부통지를 받은 사람(고발인을 제외한다)은 해당 사법경찰관의 소속 관서의 장에게 이의를 신청할 수 있고, 사법경찰관은 해당 신청이 있는 때에는 지체 없이 검사에게 사건을 송치하고 관계 서류와 증거물을 송부하여야하며, 처리결과와그이유를신청인에게통지하여야한다.",1,2,"수사의 종결 절차를 묻는 문항입니다. 2026. 3. 14. 시행 당시 법으로는 성립하지만, 2026.10.2. 개정(제238조·제245조의6·7) 이후 현행법 기준으로는 그대로 쓸 수 없습니다."],["2026-1","형사법",34,"양벌규정에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢조세범처벌법｣에서는 조세에 관한 범칙행위에 대하여 원칙적으로 국세청장 등의 고발을 기다려 논하도록 규정하고 있는바, 동법에 의하여 하는 고발에 있어서는 고소‧고발 불가분의 원칙이 적용되지 아니하므로, 고발의 구비 여부는 양벌규정에 의하여 처벌받는 자연인인 행위자와 법인에 대하여 개별적으로 논하여야 한다.","법인의 직원 또는 사용인이 법규위반행위를 하여 양벌규정에 의하여 법인이 처벌받는 경우, 법인에게 자수감경에 관한 ｢형법｣ 제52조 제1항의 규정을 적용하기 위하여는 법인의 이사 기타 대표자가 수사책임이 있는 관서에 자수한 경우에 한하고, 그 위반행위를 한 직원 또는 사용인이 자수한 것만으로는 위 규정에 의하여 형을 감경할 수 없다.","양벌규정의 제도적 취지와 법적 성격, 사업주‧행위자 관계와 공범관계의 차이, ｢형법｣ 등 실체법과의 체계적 조화의 관점 등에 비추어 보면 ｢형사소송법｣ 제253조 제2항의 시효의 정지와 효력에서 규정하고 있는 ‘공범’에는 양벌규정에서 사업주와 행위자 관계에 있는 사람도 포함된다.","행위자가 아닌 법인이 양벌규정에 따라 기소된 경우, 사법경찰관이 행위자에 대하여 작성한 피의자신문조서는 행위자가 그 내용을 인정한 경우라도 당해 피고인인 법인이 그 내용을 부인하면 증거능력이 없다.",2,0,""],["2026-1","형사법",35,"간접증거에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","범죄사실에 대한 뚜렷한 확증없이 단지 정황증거 내지 간접증거들 만으로 공소사실을 유죄로 인정하더라도 채증법칙 위반이라고 할 수 없다.","피고인이 공모와 함께 범의를 부인하는 경우에는 이러한 주관적 요소는 사물의 성질상 범의와 관련성 있는 간접사실 또는 정황사실을 증명하는 방법으로 이를 증명할 수 밖에 없다.","범행에 관한 간접증거만이 존재하고 그 간접증거의 증명력에 한계가 있는 경우, 범인으로 지목되고 있는 자에게 범행을 저지를 만한 동기가 발견되지 않는다면, 만연히 간접증거의 증명력이 그만큼 떨어진다고 평가할 것이 아니라, 무엇인가 동기가 분명히 있는데도 이를 범인이 숨기고 있을 수 있다고 적극적으로 평가하는 것이 형사증거법의 이념에 부합하는 것이다.","자백에 대한 보강증거에 있어서 피고인의 자백은 가공적인 것이 아닌 진실한 것임을 인정할 수 있을 정도만 되면 족하고, 간접 증거나 정황증거가 아닌 직접증거만이 보강증거가 될 수 있다.",1,0,""],["2026-1","형사법",36,"위법수집증거에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","정서적 학대를 당했다는 피해아동의 부모가 피해아동의 가방에 녹음기를 넣어 30명의 아동을 상대로 한 수업시간 중 교실에서 피의자인 담임교사가 한 발언을 몰래 녹음한 녹음파일은 ｢통신비밀보호법｣을 위반하여 공개되지 아니한 타인 간의 대화를 녹음한 것이므로 증거능력을 인정할 수 없다.","위치추적 전자장치 부착명령을 선고받아 그 집행을 받고 있는 피고인에 대하여 준수기간의 정함이 없이 ‘혈중알코올농도 0.03% 이상 음주를 하지 말고, 보호관찰관의 정당한 음주측정에 응할 것’이라는 준수사항 추가 결정이 있었던 경우 피고인에 대한 보호관찰소 직원들의 추가 준수사항을 근거로 한 음주 측정요구에 따른 음주측정 결과는 증거능력을 인정할 수 없다.","경찰이 피의자의 집에서 20m 떨어진 곳에서 피의자를 체포한 후 피의자의 집안을 수색하여 칼과 합의서를 압수하고도 적법한 시간 내에 압수‧수색영장을 청구하여 발부받지 않은 경우, 위 칼과 합의서는 위법하게 압수된 것으로서 증거능력이 없고 이를 기초로 한 2차 증거인 ‘임의제출동의서’, ‘압수조서 및 목록’, ‘압수품 사진’ 역시 증거능력이 없다.","영장담당판사가 발부한 압수‧수색영장의 서명날인란에 서명만 있고 날인이 없는 경우에 그 영장은 ｢형사소송법｣이 정한 요건을 갖추지 못하여 적법하게 발부되었다고 볼 수 없으므로, 비록 판사의 의사에 기초하여 진정하게 영장이 발부되었다는 점이 분명하고 의도적으로 적법절차의 실질적인 내용을 침해 한다거나 영장주의를 회피할 의도를 가지고 이 영장에 의하여 압수‧수색을 하였다고 보기 어렵다 하더라도, 이 영장에 따라 압수한 파일 출력물의 증거능력을 인정할 수 없다.",3,0,""],["2026-1","형사법",37,"증명에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 공연성은 명예훼손죄의 구성요건으로서, 특정 소수에 대한 사실적시의 경우 공연성이 부정되는 유력한 사정이 될 수 있으므로, 전파될 가능성에 관하여는 검사의 엄격한 증명이 필요하다. ㉡ ｢형사소송법｣ 제312조 제4항에서 ‘특히 신빙할 수 있는 상태’는 증거능력의 요건에 해당하므로 검사가 그 존재에 대하여 구체적으로 주장‧증명하여야 하지만, 이는 소송상의 사실에 관한 것이므로 엄격한 증명을 요하지 아니하고 자유로운 증명으로 족하다. ㉢ 반의사불벌죄에서 피고인 또는 피의자의 처벌을 희망하지 않는다는 의사표시 또는 처벌희망 의사표시 철회의 유무나 그 효력 여부에 관한 사실은 엄격한 증명의 대상이다. ㉣ 뇌물죄에서 수뢰액은 다과에 따라 범죄구성요건이 되므로 엄격한 증명의 대상이 되고, ｢특정범죄 가중처벌 등에 관한 법률｣에서 정한 범죄구성요건이 되지 않는 단순 뇌물죄의 경우에도 몰수‧추징의 대상이 되는 까닭에 역시 증거에 의하여 인정되어야 하며, 수뢰액을 특정할 수 없는 경우에는 가액을 추징할 수 없다. ㉤ 목적과 용도를 정하여 위탁한 금전은 정해진 목적, 용도에 사용할 때까지는 이에 대한 소유권이 위탁자에게 유보되어 있는 것으로서 수탁자가 임의로 소비하면 횡령죄를 구성하나, 피해자가 목적과 용도를 정하여 금전을 위탁한 사실 및 그 목적과 용도가 무엇인지는 엄격한 증명의 대상이다.","2개","3개","4개","5개",2,0,""],["2026-1","형사법",38,"전문법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","수사기관이 상당한 이유가 있는 경우에는 진술자의 성명을 가명으로 기재하여 조서를 작성하였다고 하더라도 그 이유만으로 그 조서의 증거능력을 부정할 것은 아니다.","피고인이 피의자였을 때 수사기관에 한 진술이 기재된 조서나 수사과정에서 작성된 진술서 등의 증거능력을 인정할 수 없다면 수사기관에 제출된 변호인의견서에 기재된 같은 취지의 피의자 진술 부분도 유죄의 증거로 사용할 수 없다.","피고인 아닌 자가 작성한 진술서는 작성자가 공판준비나 공판 기일에서 그 성립의 진정을 부인하는 경우에, 피고인 또는 변호인이 공판준비 또는 공판기일에 그 기재 내용에 관하여 작성자를 신문할 수 없는 경우라도 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에는 증거로 할 수 있다.","지적능력‧판단능력 등과 같이 본질적으로 수사기관이 작성한 진술조서에 나타나기 어려운 피고인의 상태에 대해서는 공판 중심주의 및 실질적 직접심리주의 원칙에 따라 검사가 제출한 객관적인 증거에 대하여 적법한 증거조사를 거친 후 이를 인정하여야 할 것이지, 공소사실을 부인하는 취지의 피고인 진술이 기재된 피의자신문조서 중 일부를 근거로 이를 인정하여서는 아니된다.",2,0,""],["2026-1","형사법",39,"피고인이 증거동의한 경우 증거능력을 인정할 수 있는 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 수사기관이 피압수자 측에 참여의 기회를 보장하지 않고 압수한 전자정보 목록을 교부하지 않는 등 영장주의 원칙과 적법절차를 준수하지 않은 압수‧수색과정을 통하여 취득한 증거 ㉡ 성폭력 피해아동이 어머니에게 진술한 내용을 어머니가 상담원에게 전한 후, 상담원이 그 내용을 검사 면전에서 진술하여 작성된 진술조서 ㉢ 피고인이 검사 이전의 수사기관에서 고문 등 가혹행위로 인하여 임의성 없는 자백을 하고 그 후 검사의 조사단계에서도 임의성 없는 심리상태가 계속되어 동일한 내용의 자백을 한 경우, 검사의 조사단계에서 고문 등 자백 강요행위 없이 검사 앞에서 한 자백 ㉣ ｢형사소송법｣에서 정한 절차와 방식에 따른 증인신문절차를 거치지 아니한 채 증인에 대하여 선서 없이 법관이 임의의 방법으로 청취한 진술과 그 진술의 형식적 변형에 불과한 녹음파일 등의 증거 ㉤ 공판준비 또는 공판기일에서 이미 증언을 마친 증인을 검사가 소환한 후 피고인에게 유리한 그 증언 내용을 추궁하여 이를 일방적으로 번복시키는 방식으로 작성한 진술조서","2개","3개","4개","5개",0,0,""],["2026-1","형사법",40,"다음 사례에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) 甲은 가족과 함께 거주하는 집이 이미 화재보험에 가입되어 있다는 것을 이용하여, 실화로 전소된 것처럼 꾸며 화재보험금을 수령하기로 마음먹었다. 甲은 화재보험회사 직원인 乙에게 화재 보험금의 일부 제공을 제시하면서 같이 할 것을 제안하였다. 乙은 이를 승낙하였다가 甲이 불을 놓아 천정에까지 불이 옮겨붙은 것을 보자, 양심의 가책을 느껴 그만두겠다고 하고 현장을 빠져나가 버렸다. 사법경찰관 P는 화재 직후 영장 없이 검증을 하였고, 이후 이 사건의 수사를 계속하여 甲만이 기소되었다. ㉠ 乙은 甲의 보험사기의 실행의 착수 이후에 공모관계로부터 이탈하였으므로, 乙에게도 사기죄의 실행의 착수는 인정된다. ㉡ 甲은 위 사례의 집에 불을 놓았으므로 ｢형법｣ 제166조 제1항의 타인소유일반건조물방화죄가 성립한다. ㉢ 乙은 행위를 스스로 그만두었으므로, 중지미수에 해당한다. ㉣ 화재 직후 사법경찰관 P가 영장 없이 행한 검증은, 사후영장이 발부되지 아니한 경우라도 공판정에서 작성자의 진술에 의하여 그 성립의 진정함이 증명된 때에는 그 조서를 유죄의 증거로 할 수 있다. ㉤ 수사기관에서 乙이 참고인으로 진술한 후에 법정에서 증인으로 증언하고자 하였으나, 피고인 甲이 乙의 증언거부 상황을 초래한 특별한 사정이 있는 경우, 이는 ｢형사소송법｣ 제314조 (증거능력에 대한 예외)의 ‘그 밖에 이에 준하는 사유로 인하여 진술할 수 없는 때’에 해당한다.","1개","2개","3개","4개",0,0,""],["2026-1","경찰학",1,"경찰의 개념과 분류에 관한 설명으로 가장 적절한 것은?","1953년 국민의 생명‧신체 및 재산보호라는 대륙법계의 사고가 최초로 반영된 ｢경찰관 직무집행법｣이 제정되었다.","국가경찰과 자치경찰은 경찰의 조직권, 인사권, 비용부담권에 따라 구분한 것으로, 국가경찰은 광역 범죄에 효과적으로 대응하기 어렵고 경찰기관 간의 협조가 어렵다는 단점을 가지고 있다.","실질적 의미의 경찰개념은 경찰작용의 성질에 따른 것으로서 학문적으로 정립된 개념인 반면, 형식적 의미의 경찰개념은 실정법상 개념으로 보통경찰기관에 분배되어 있는 임무를 위한 경찰작용을 의미한다.","블랑코(Blanco) 판결은 경찰관청이 일반수권규정에 근거하여 법규명령을 발할 수 있는 분야가 소극적 위험방지에 한정되도록 확정되는 계기를 마련하였다.",2,0,""],["2026-1","경찰학",2,"경찰의 기본적 임무를 ‘공공의 안녕과 질서에 대한 위험 방지’라고 정의할 때, 이에 관한 설명으로 옳지 않은 것은 모두 몇 개인가? ㉠ 경찰이 의무에 합당한 사려 깊은 판단을 하여 개입하였으나 실제로는 위험이 없는 경우를 위험 혐의라고 하며, 이때 경찰의 개입은 적법하더라도 특별한 희생이 있는 경우 국가에게 손실보상의 의무를 발생시키게 된다. ㉡ 국민의 생명‧신체 및 재산보호는 공공의 안녕을 포함하는 상위 개념이다. ㉢ 공공의 질서는 지배적인 사회‧윤리관에 비추어 그것을 준수 하는 것이 원만한 공동생활을 위한 전제조건으로 간주되는 성문규범의 총체를 의미하며, 이 개념의 사용 분야는 오늘날 점차 확대되고 있다. ㉣ 위험은 보호를 받게 되는 법익에 대해 필수적으로 존재해야 하는 것은 아니나, 경찰관의 개입은 구체적 위험이 존재할 때만 가능하다. ㉤ 오상위험에 대한 경찰의 개입은 위법하나, 국가에게는 손해 배상의 책임이 발생하지 않는다.","2개","3개","4개","5개",3,0,""],["2026-1","경찰학",3,"｢경찰 인권보호 규칙｣상 경찰 인권정책 기본계획 및 인권 교육에 관한 설명으로 가장 적절하지 않은 것은?","경찰청장 및 시‧도경찰청장은 국민의 인권보호와 증진을 위하여 경찰 인권정책 기본계획을 5년마다 수립해야 한다.","경찰관등에게 실시하는 인권교육에 관하여 다양한 의견을 수렴하고 대내외 협력을 강화하기 위하여 경찰청에 경찰 인권교육 협의회를 둔다.","경찰 인권교육협의회는 협의회장을 포함한 10명 이상 20명 이하의 위원으로 구성한다.","경찰관등은 대면 교육, 사이버 교육 등 다양한 방법을 통해 교육을 이수할 수 있고, 학습자의 능동적인 학습권을 보장하기 위해 토론식, 참여식 교육을 권장한다.",0,0,""],["2026-1","경찰학",4,"사회계약설 및 코헨(Cohen)과 펠드버그(Feldberg)가 주장한 경찰활동의 사상적 기준에 관한 설명으로 가장 적절하지 않은 것은?","홉스(Hobbes)는 그의 저서 리바이어던(Leviathan)에서 자연상태를 ‘만인에 대한 만인의 투쟁 상태’라고 하였으며, 개인의 자연권을 국왕에게 전부 양도하는 절대군주정치를 주장하였다.","음주단속 경찰관이 동료 경찰관을 적발하고도 동료라는 이유로 눈감아주는 경우 ‘공정한 접근 보장’에 실패한 것이다.","탈주범이 관내에 있다는 첩보를 입수한 경찰관이 상부에 보고하지 않고 단독으로 범인을 검거하려다가 실패한 경우에는 ‘협동’에 실패한 것이다.","P순경이 칼을 든 강도범을 추격 중에 도망가도록 내버려두었다면 이는 ‘냉정하고 객관적인 자세’에 실패한 것이다.",3,0,""],["2026-1","경찰학",5,"｢경찰청 공무원 행동강령｣에 관한 설명으로 가장 적절하지 않은 것은?","공무원은 직무수행 중 알게 된 가상자산과 관련된 정보를 이용한 재산상 거래 또는 투자 행위를 해서는 아니 된다.","공무원은 직무관련자와는 비용 부담 여부와 관계없이 골프를 같이 하여서는 아니 된다. 다만, 부득이한 사정에 따라 골프를 같이 하는 경우에는 소속관서장에게 사전에 신고하여야 하며 사전에 신고하기 어려운 특별한 사유가 있는 경우에는 사후에 즉시 신고하여야 한다.","공무원은 직무관련자와 마작, 화투, 카드 등 우연의 결과나 불확실한 승패에 의하여 금품 등 경제적 이익을 취할 목적으로 하는 사행성 오락을 같이 하여서는 아니 된다.","공무원은 직무관련자나 직무관련공무원에게 경조사를 알려서는 아니 된다. 다만, 신문, 방송 또는 현재 근무하고 있거나 과거에 근무하였던 기관의 소속 직원에게만 열람이 허용되는 내부 통신망 등을 통하여 알리는 경우에는 경조사를 알릴 수 있다.",1,0,""],["2026-1","경찰학",6,"｢부정청탁 및 금품등 수수의 금지에 관한 법률｣에 대한 설명으로 가장 적절하지 않은 것은?","공직자등은 사례금을 받는 외부강의등을 할 때에는 대통령령으로 정하는 바에 따라 외부강의등의 요청 명세 등을 소속기관장에게 그 외부강의등을 마친 날부터 10일 이내에 서면으로 신고하여야 한다. 다만, 외부강의등을 요청한 자가 국가나 지방자치단체인 경우에는 그러하지 아니하다.","소속기관장은 공직자등 또는 그 배우자가 수수 금지 금품등을 받거나 그 제공의 약속 또는 의사표시를 받은 사실을 알게 된 경우 수사의 필요성이 있다고 인정하는 때에는 그 내용을 수사기관에 통보할 수 있다.","국민권익위원회는 이 법에 따른 부정청탁 등에 관한 유형, 판단기준 및 그 예방 조치 등에 관한 기준의 작성 및 보급 업무를 관장한다.","공직자등은 직무 관련 여부 및 기부‧후원‧증여 등 그 명목에 관계없이 동일인으로부터 1회에 100만 원 또는 매 회계연도에 300만 원을 초과하는 금품등을 받거나 요구 또는 약속해서는 아니 된다.",1,0,""],["2026-1","경찰학",7,"｢공직자의 이해충돌 방지법｣에 관한 설명으로 가장 적절하지 않은 것은?","치안감 이상의 경찰공무원 및 특별시‧광역시‧특별자치시‧도‧ 특별자치도의 시‧도경찰청장은 ‘고위공직자’에 포함된다.","직무수행 중 알게 된 비밀 또는 소속 공공기관의 미공개정보를 사적 이익을 위하여 이용하거나 제3자로 하여금 이용하도록 한 공직자는 3년 이하의 징역 또는 3천만 원 이하의 벌금에 처한다.","고위공직자는 그 직위에 임용되거나 임기를 개시하기 전 3년 이내에 민간 부문에서 업무활동을 한 경우, 그 활동내역을 그 직위에 임용되거나 임기를 개시한 날부터 30일 이내에 소속부서장에게 제출하여야 한다.","이 법의 위반행위를 한 자가 위반사실을 자진하여 신고하거나 신고자등이 신고등을 함으로 인하여 자신이 한 이 법의 위반행위가 발견된 경우에는 그 위반행위에 대한 형사처벌, 과태료 부과, 징계처분, 그 밖의 행정처분 등을 감경하거나 면제할 수 있다.",2,0,""],["2026-1","경찰학",8,"｢적극행정 운영규정｣에 관한 설명으로 가장 적절하지 않은 것은?","‘적극행정’이란 공무원이 불합리한 규제를 개선하는 등 공공의 이익을 위해 창의성과 전문성을 바탕으로 적극적으로 업무를 처리하는 행위를 말한다.","중앙행정기관의 장은 소속 공무원을 대상으로 적극행정 관련 교육을 연 1회 이상 실시할 수 있다.","국민권익위원회는 중앙행정기관 소속 공무원의 소극행정 예방 및 근절을 위해 소극행정 신고센터를 운영하고, 중앙행정기관의 장에게 신고사항에 대해 적절한 조치를 하도록 권고할 수 있다.","중앙행정기관의 장은 적극행정 추진으로 인한 민‧형사상 책임과 관련하여 소속 공무원을 보호하기 위해 필요한 조치를 해야 한다.",1,0,""],["2026-1","경찰학",9,"범죄원인론에 관한 설명으로 가장 적절하지 않은 것은?","고전주의 범죄학에 따르면, 모든 인간은 자유의지의 합리적 행사를 통해 결정하고 행동하며, 범죄 억제를 위해서는 처벌의 엄격성, 확실성, 신속성이 필요하다고 하였다.","허쉬(Hirschi)는 사회에 대한 개인의 유대가 약하거나 깨졌을 때 비행이나 범죄가 발생하며, 이러한 유대를 구성하는 요인으로 애착(Attachment), 전념(Commitment), 참여(Involvement), 신념(Belief)을 제시하였다.","쇼(Shaw)와 맥케이(McKay)는 전이지역(Transitional Zone)에서 범죄 수준이 높다는 것을 발견하였으며, 이 지역은 빈곤, 민족적 동질성, 거주불안정성의 특징을 가진다고 주장한다.","코헨(Cohen)과 펠슨(Felson)은 일상활동이론에서 범죄의 3요소로 동기가 부여된 범죄자(Motivated Offender), 적절한 범행대상 (Suitable Target), 보호자의 부재(Absence of Capable Guardian)를 제시하였다.",2,0,""],["2026-1","경찰학",10,"문제지향적 경찰활동(Problem Oriented Policing)에 관한 설명으로 가장 적절하지 않은 것은?","허만 골드슈타인(Herman Goldstein)은 기존의 수동적이고 사건 대응적인 전통적 경찰활동을 대체할 새로운 경찰활동 전략으로 문제지향적 경찰활동을 제시하였다.","문제지향적 경찰활동의 능률성은 체포율과 적발건수로, 효과성은 현장 대응 시간으로 측정될 수 있다.","문제해결을 위해 ‘조사(Scanning) - 분석(Analysis) - 대응 (Response) - 평가(Assessment)’의 과정을 사용한다.","허만 골드슈타인은 형법의 적용이 문제에 대응하기 위한 여러 대응 수단 중 하나에 불과하다고 주장하였다.",1,0,""],["2026-1","경찰학",11,"경찰 윤리에 관한 설명으로 가장 적절한 것은?","델라트르(Delattre)는 작은 호의일지라도 그것이 반복되면 점점 더 멈추기 어려운 부패로 이어지므로 결코 이를 무시하거나 간과 하면 안 된다고 주장하였다.","니더호퍼(Niederhoffer), 로벅(Roebuck), 바커(Barker)는 시민사회의 부패가 경찰 부패의 주원인이라고 주장하였다.","고객이 위험을 감수하고 원하는 이익을 받는 것을 확실히 하기 위하여 높은 가격을 지불하는 상황은 룩셈버그(Luxemburger)가 제시한세가지유형의부패중에서‘시장중심적정의’와관련이깊다.","내부고발(Whistleblowing)은 경찰관이 동료나 상사의 부정부패에 대하여 감찰에 알리거나 외부의 언론매체에 대하여 공표하는 것을 의미하며, 성공가능성은 존 클라이니히(J. Kleinig)가 주장한 내부고발의 정당화 요건에 포함되지 않는다.",0,0,""],["2026-1","경찰학",12,"한국경찰의 역사에 관한 설명으로 가장 적절하지 않은 것은?","갑오개혁 이후 한국 최초의 경찰조직법은 ｢경무청관제직장｣이다.","1919년 3‧1운동으로 태어난 대한민국임시정부는 우리 민족 최초의 민주공화제를 선포하였다. 따라서 임시정부의 경찰은 우리 역사상 최초의 민주공화제 경찰로서 민주경찰의 효시라는 제도사적 의의를 가진다.","백범 김구 선생은 대한민국 임시정부의 초대 경무국장으로 취임 하였다.","1991년에 치안국이 경찰청으로 승격되었다.",3,0,""],["2026-1","경찰학",13,"외국경찰에 관한 설명으로 가장 적절하지 않은 것은?","영국의 헨리 필딩(Henry Fielding)은 ‘보우가의 주자(Bow Street Runner)’를 창설하였다.","미국의 연방범죄수사국(Federal Bureau of Investigation)은 재무부 소속이다.","프랑스의 국립경찰청(Police Nationale)은 내무부 소속이다.","일본의 경찰청은 국가경찰이다.",1,0,""],["2026-1","경찰학",14,"행정의 자기구속원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행정의 자기구속원칙이란 행정청은 동일한 사안에 대하여 제3자에게 한 것과 동일한 결정을 상대방에게도 하도록 구속을 받는다는 원칙을 말한다.","행정의 자기구속원칙은 일반적으로 재량행위에 적용된다.","평등의 원칙은 본질적으로 같은 것을 자의적으로 다르게 취급함을 금지하는 것이고, 위법한 행정처분이 수차례에 걸쳐 반복적으로 행하여졌다 하더라도 그러한 처분이 위법한 것인 때에는 행정청에 대하여 자기구속력을 갖게 된다고 할 수 없다.","행정의 자기구속원칙은 ｢행정기본법｣ 제8조에 명문의 규정이 있다.",3,0,""],["2026-1","경찰학",15,"기속행위와 재량행위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공정한 업무처리에 대한 사의로 두고 간 돈 30만 원이 든 봉투를 소지함으로써 피동적으로 금품을 수수하였다가 돌려 준 20여년 근속의 경찰공무원에 대한 해임처분이 사회통념상 현저하게 타당성을 잃어 재량권의 남용에 해당한다.","재량의 일탈‧남용뿐만 아니라 단순히 재량권 행사에서 합리성을 결하는 등 재량을 그르친 경우에도 행정심판의 대상이 된다.","재량권을 선택재량과 결정재량으로 나눌 경우, 경찰공무원의 비위에 대해 징계처분을 하는 결정과 그 공무원의 건강 등 제반 사정을 고려하여 징계처분을 하지 않는 결정 사이에서 선택권을 갖는 것을 선택재량이라 한다.","기속행위와 재량행위의 구분은 당해 행위의 근거가 된 법규의 체제‧형식과 그 문언, 당해 행위가 속하는 행정 분야의 주된 목적과 특성, 당해 행위 자체의 개별적 성질과 유형 등을 모두 고려하여 판단해야 한다.",2,0,""],["2026-1","경찰학",16,"훈령과 직무명령에 관한 설명으로 가장 적절하지 않은 것은?","훈령은 상급관청이 하급관청의 권한행사를 지휘하기 위하여 발하는 명령이다.","훈령은 하급관청의 권한행사의 독립된 범위에 속하는 사항이 아니어야 한다.","훈령은 직무명령으로서의 성질을 가질 수 있으나, 직무명령이 훈령으로서의 성질을 당연히 가지는 것은 아니다.","직무명령은 상관이 부하직원에 대하여 발하는 명령이며, 상위 법령의 법적 근거가 필요하다.",3,0,""],["2026-1","경찰학",17,"｢행정권한의 위임 및 위탁에 관한 규정｣에 대한 설명으로 가장 적절하지 않은 것은?","수임 및 수탁사무의 처리에 관하여 위임 및 위탁기관은 수임 및 수탁기관에 대하여 사전승인을 받거나 협의를 할 것을 요구 할 수 있다.","위임 및 위탁기관은 수임 및 수탁기관의 수임 및 수탁사무 처리에 대하여 지휘‧감독하고, 그 처리가 위법하거나 부당하다고 인정될 때에는 이를 취소하거나 정지시킬 수 있다.","‘위탁기관’이란 자기의 권한을 위탁한 해당 행정기관의 장을 말하고, ‘수탁기관’이란 행정기관의 권한을 위탁받은 다른 행정 기관의 장과 사무를 위탁받은 지방자치단체가 아닌 법인‧단체 또는 그 기관이나 개인을 말한다.","위임 및 위탁기관은 위임 및 위탁사무 처리의 적정성을 확보하기 위하여 필요한 경우에는 수임 및 수탁기관의 수임 및 수탁사무 처리 상황을 수시로 감사할 수 있다.",0,0,""],["2026-1","경찰학",18,"행정입법에 관한 설명으로 가장 적절하지 않은 것은?","부령의 위임을 받아 중앙행정기관(｢정부조직법｣ 및 그 밖의 법률에 따라 설치된 중앙행정기관을 말한다)의 장이 정한 예규는 ｢행정기본법｣상의 ‘법령등’에 해당된다.","집행명령은상위법령의명시적인수권이없는경우에도발할수있으나, 새로운입법사항에관하여는규율할수없다.","부령은 행정각부의 장관이 제정하는 것이므로, 법제처 심사와 국무회의 심의를 모두 거쳐야 한다.","헌법이 법률로 정하도록 규정한 국회 입법전속사항은 원칙적으로 직접 법규명령으로 정할 수 없다.",2,0,""],["2026-1","경찰학",19,"경찰행정상 비례의 원칙에 관한 설명으로 가장 적절하지 않은 것은?","｢경찰관 직무집행법｣ 제1조 제2항, ｢행정기본법｣ 제10조 등에 규정되어 있다.","경찰행정의 수단은 행정목적을 달성하기에 적합하여야 한다.","최소침해의 원칙은 협의의 비례원칙이라고도 한다.","경찰행정작용으로 인한 국민의 이익 침해가 그 행정작용이 의도하는 공익보다 크지 아니하여야 한다.",2,0,""],["2026-1","경찰학",20,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣에 대한 설명으로 아래 <보기>에서 옳지 않은 것은 모두 몇 개인가? < 보기 > ㉠ 국가경찰위원회 위원의 임기는 3년으로 하며, 연임할 수 없다. 이 경우 보궐위원의 임기는 전임자 임기의 남은 기간으로 한다. ㉡ 자치경찰사무의 수행에 필요한 예산은 시‧도자치경찰위원회의 심의‧의결을 거쳐 시‧도지사가 수립한다. 이 경우 시‧도 자치경찰위원회는 시‧도경찰청장의 의견을 들어야 한다. ㉢ 국가수사본부장은 ｢형사소송법｣에 따른 경찰의 수사에 관하여 각 시‧도경찰청장과 경찰서장 및 수사부서 소속 공무원을 지휘‧감독한다. ㉣ 시‧도자치경찰위원회 위원의 임기는 3년이며, 국가경찰위원회 위원장이 임명한다.","1개","2개","3개","4개",1,0,""],["2026-1","경찰학",21,"｢경찰공무원법｣상 경찰공무원의 임용자격 및 결격사유에 관한 설명으로 가장 적절한 것은?","대한민국 국적을 가지지 아니한 사람도 경찰공무원으로 임용 될 수 있다.","피성년후견인 또는 피한정후견인은 경찰공무원으로 임용될 수 있다.","금고 이상의 형의 선고유예를 선고받고 그 유예기간 중에 있는 사람은 경찰공무원으로 임용될 수 있다.","파산선고를 받고 복권되지 아니한 사람은 경찰공무원으로 임용 될 수 없다.",3,0,""],["2026-1","경찰학",22,"경찰하명에 관한 설명으로 가장 적절하지 않은 것은?","경찰하명은 경찰행정청이 경찰상의 위해방지를 위하여 개인에게 특정한 작위‧부작위‧수인‧급부의 의무를 부과하는 경찰처분을 말한다.","부작위하명은 소극적으로 어떤 행위를 하지 아니할 의무를 명하는 것으로 ‘경찰금지’라고도 한다.","사실행위는 경찰하명의 대상이 될 수 없다.","경찰하명에 위반하여 이루어진 행위는 원칙적으로 그 법적 효력에 아무런 영향을 받지 않는다.",2,0,""],["2026-1","경찰학",23,"｢행정절차법｣ 제17조(처분의 신청)에 관한 설명으로 가장 적절하지 않은 것은?","행정청에 처분을 구하는 신청은 문서로 하여야 한다. 다만, 다른 법령등에 특별한 규정이 있는 경우와 행정청이 미리 다른 방법을 정하여 공시한 경우에는 그러하지 아니하다.","행정청은 신청에 구비서류의 미비 등 흠이 있는 경우에 보완에 필요한 상당한 기간을 정하여 7일 이내에 신청인에게 보완을 요구하여야 한다.","행정청은 신청에 필요한 구비서류, 접수기관, 처리기간, 그 밖에 필요한 사항을 게시(인터넷 등을 통한 게시를 포함한다)하거나 이에대한편람을갖추어두고누구나열람할수있도록하여야한다.","행정청은 신청인의 편의를 위하여 다른 행정청에 신청을 접수하게 할 수 있다. 이 경우 행정청은 다른 행정청에 접수할 수 있는 신청의 종류를 미리 정하여 공시하여야 한다.",1,0,""],["2026-1","경찰학",24,"｢공공기관의 정보공개에 관한 법률｣상 정보공개절차에 대한 설명으로 가장 적절하지 않은 것은?","모든 국민은 정보의 공개를 청구할 권리를 가지며, 외국인의 정보공개 청구에 관하여는 대통령령으로 정한다.","공공기관은 이 법 제10조에 따라 정보공개의 청구를 받으면 그 청구를 받은 날부터 10일 이내에 공개 여부를 결정하여야 한다.","공공기관은 공개 청구된 공개 대상 정보의 전부 또는 일부가 제 3자와 관련이 있다고 인정할 때에는 그 사실을 제3자에게 3일 이내에통지하여야 하며, 필요한 경우에는 그의 의견을 들을 수 있다.","청구인이 정보공개와 관련한 공공기관의 결정에 대하여 불복이 있거나 정보공개 청구 후 20일이 경과하도록 정보공개 결정이 없는 때에는 ｢행정소송법｣에서 정하는 바에 따라 행정소송을 제기할 수 있다.",2,0,""],["2026-1","경찰학",25,"｢경찰 물리력 행사의 기준과 방법에 관한 규칙｣에 대한 설명으로 가장 적절한 것은?","경찰권 발동의 대상자(이하 ‘대상자’라고 한다)가 경찰관 또는 제3자에 대해 보일 수 있는 행위는 그 위해의 정도에 따라 순응, 소극적 저항, 적극적 저항, 폭력적 공격, 치사적 공격 등 다섯 단계로 구별한다.","대상자 행위에 따른 경찰관의 대응 수준은 협조적 통제, 접촉 통제, 저위험 물리력, 중위험 물리력, 치명적 물리력 등 다섯 단계로 구별한다.","대상자가 ‘순응’하는 경우, 손이나 팔을 힘을 주어 잡을 수 있고 대상자의 어깨 등 신체 일부를 힘을 주어 밀거나 잡아끌 수 있다.","대상자 행위가 ‘폭력적 공격’인 경우, 목을 압박하여 제압하거나 관절을 꺾는 방법, 팔‧다리를 이용해 움직이지 못하도록 조르는 방법, 다리를 걸거나 들쳐 매는 등 균형을 무너뜨려 넘어뜨리는 방법, 대상자가 넘어진 상태에서 움직이지 못하게 위에서 눌러 제압하는 방법 등을 사용할 수 있다.",3,0,""],["2026-1","경찰학",26,"｢경찰관직무집행법｣에관한설명으로가장적절하지않은 것은?","경찰관은 범죄행위가 목전에 행하여지려고 하고 있다고 인정될 때에는 이를 예방하기 위하여 관계인에게 필요한 경고를 하고, 그 행위로 인하여 사람의 생명‧신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우에는 그 행위를 제지하여야 한다.","경찰관은 미아를 인수할 보호자 확인, 유실물을 인수할 권리자 확인, 사고로 인한 사상자 확인, 행정처분을 위한 교통사고 조사에 필요한 사실확인의 직무를 수행하기 위하여 필요하면 관계인에게 출석하여야 하는 사유‧일시 및 장소를 명확히 적은 출석 요구서를 보내 경찰관서에 출석할 것을 요구할 수 있다.","이 법에 규정된 경찰관의 의무를 위반하거나 직권을 남용하여 다른 사람에게 해를 끼친 사람은 1년 이하의 징역이나 금고 또는 300만 원 이하의 벌금에 처한다.","경찰관은 범인의 체포, 범인의 도주 방지, 자신이나 다른 사람의 생명‧신체의 방어 및 보호, 공무집행에 대한 항거의 제지를 위하여 필요하다고 인정되는 상당한 이유가 있을 때에는 그 사태를 합리적으로 판단하여 필요한 한도에서 무기를 사용할 수 있다.",0,0,""],["2026-1","경찰학",27,"｢경찰관 직무집행법｣ 제11조의5(직무수행으로 인한 형의 감면)에 관한 아래 <보기>의 설명 중 옳지 않은 것은 모두 몇 개인가? < 보기 > 형의 감면대상 범죄가 행하여지려고 하거나 행하여지고 있어, ㉠타인의 생명‧신체 및 재산에 대한 위해 발생의 우려가 명백하고 긴급한 상황에서 ㉡경찰관이 그 위해를 예방하거나 진압하기 위한 행위 또는 범인의 검거 과정에서 타인을 향한 직접적인 유형력 행사에 대응하는 행위를 하여 그로 인하여 경찰관에게 피해가 발생한 경우, ㉢그 경찰관의 직무수행이 불가피한 것이고 필요한 최소한의 범위에서 이루어졌으며 ㉣해당 경찰관에게 고의 또는 중대한 과실이 없는 때에는 ㉤그 정상을 참작하여 형을 감경 하거나 면제하여야 한다.","1개","2개","3개","4개",2,0,""],["2026-1","경찰학",28,"관료제의 주요 병리현상에 관한 설명으로 옳은 것은 모두 몇 개인가? ㉠ ‘변화에 대한 저항’이란 행정의 궁극적인 목적이 아닌 수많은 도장, 많은 문서 등 서류절차에 과도하게 집착하는 형식주의를 말한다. ㉡ ‘할거주의’란 행정관료들이 자기가 소속하고 있는 기관, 부처 등만을 중심으로 생각하는 소속 이기주의를 말한다. 소속기관이나 부서에만 충성함으로써 다른 조직이나 다른 부서와의 조정이나 협조가 곤란할 수 있다. ㉢ ‘번문욕례(Red Tape)’란 행정관료가 상관으로부터의 지시가 옳든 그르든 이에 영합하고, 선례에 따라 소극적으로 처리 하는 행동을 말한다. 소극적인 일 처리와 책임회피 현상이 나타날 수 있다. ㉣ ‘피터의 원리(Peter’s Principle)’란 조직구성원이 자신의 ‘무능력의 한계까지 승진’하여 관료조직의 전반적인 효율성이 저하되는 현상을 말한다.","1개","2개","3개","4개",1,0,""],["2026-1","경찰학",29,"경찰조직의 편성원리에 관한 설명으로 가장 적절한 것은?","명령통일의 원리: 조직 구성원에게 가능한 한 한가지의 주된 업무를 분담시키는 원리","계층제의 원리: 권한과 책임의 정도에 따라 직무를 등급화하여야 한다는 원리","조정과 통합의 원리: 한 사람이 직접적으로 감독할 수 있는 부하의 수를 정하는 원리","통솔범위의 원리: 무니(Mooney)가 주장하는 조직편성의 원리 중 제1의 원리",1,0,""],["2026-1","경찰학",30,"매슬로우(Maslow)의 욕구계층 이론에 관한 설명으로 아래 <보기>와 관련 용어를 가장 적절하게 연결한 것은? < 보기 > ㉠ 이 욕구는 동료, 상사, 조직 전체에 대한 친근감, 귀속감의 충족을 주요 내용으로 하며, 충족 방안으로는 인간관계의 개선 등이 있다. ㉡ 이 욕구는 창조적이고 잠재성을 실현시키고, 자기완성과 자기발전에 관련된 욕구이다.","㉠ - 자아실현의 욕구(Self Actualization Needs)","㉠ - 사회적 욕구(애정의 욕구)(Love‧Social Needs)","㉡ - 존경의 욕구(Self Esteem Needs)","㉡ - 안전의 욕구(Safety Needs)",1,0,""],["2026-1","경찰학",31,"인사관리에 관한 설명으로 가장 적절한 것은?","직업공무원제도는 공직을 일생의 보람된 직장으로 생각하면서 일생을 거기에 기꺼이 바쳐 봉사할 수 있도록 인사업무를 조직하고 운영하는 공무원제도를 말한다.","영국에서 발달된 엽관주의는 잭슨(Andrew Jackson) 수상 시대에 본격적으로 시작되었다.","계급제는 직위분류제에 비해 개방형 충원방식을 취하고 있다.","직위분류제는 계급제에 비해 인사배치에 있어서 신축적이다.",0,0,""],["2026-1","경찰학",32,"예산관리에 관한 설명으로 가장 적절한 것은?","본예산은 정부가 매년 정기적으로 다음 연도의 세입과 세출을 예산안으로 편성한 후, 국회에서 심의‧의결하여 최초로 확정된 예산을 말한다.","영기준예산(Zero-Base Budget System)은 거대 정부시대에 각광받는 제도이다.","품목별 예산(Line-Item Budget System)은 ‘단위원가×업무량=예산액’ 으로 표시하는 제도이다.","추가경정예산은 예산불성립으로 인한 행정중단을 방지하기 위한 제도이다.",0,0,""],["2026-1","경찰학",33,"보안관리에 관한 설명으로 아래 <보기>에서 옳은 것은 모두 몇 개인가? < 보기 > ㉠ 보안의 원칙에는 과도 또는 과소분류 금지의 원칙, 독립 분류의 원칙, 외국비밀 존중의 원칙이 있다. ㉡ 비밀분류의 원칙은 알 사람만 알아야 하는 원칙(한정성의 원칙), 부분화의 원칙, 보안과 효율의 조화가 있다. ㉢ ｢보안업무규정｣상 비밀은 Ⅰ급 비밀, Ⅱ급 비밀, Ⅲ급 비밀로 구분한다. ㉣ ｢보안업무규정｣상 보호지역은 제한지역, 제한구역, 통제구역 으로 나눈다.","1개","2개","3개","4개",1,0,""],["2026-1","경찰학",34,"｢지역경찰의 조직 및 운영에 관한 규칙｣에 대한 설명으로 가장 적절한 것은?","지역경찰관서의 순찰팀은 범죄예방 순찰, 각종 사건사고에 대한 초동조치 등 현장 치안활동을 담당하며, 팀장은 경위 또는 경사로 보한다.","지역경찰관서의 관리팀 및 순찰팀 인원은 지역 치안수요 및 인력여건 등을 고려하여 시‧도경찰청장이 결정한다.","경찰청장은 지역치안을 효율적으로 수행하기 위하여 지역경찰 관서장 소속하에 치안센터를 설치할 수 있다.","경찰서장은 지역 치안여건 및 인원여건을 고려하여 치안센터의 운영시간을 탄력적으로 조정할 수 있다.",3,0,""],["2026-1","경찰학",35,"｢경비업법｣에 관한 설명으로 옳은 것은 모두 몇 개인가? ㉠ ‘혼잡‧교통유도 경비업무’란 도로에 접속한 공사현장 및 사람과 차량의 통행에 위험이 있는 장소 또는 도로를 점유 하는 행사장 등에서 교통사고나 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무를 말한다. ㉡ ｢도시 및 주거환경정비법｣에 따른 정비사업과 관련하여 이해대립이 있어 다툼이 있는 장소는 ‘집단민원현장’에 해당한다. ㉢ 경비업자는 허가받은 경비업무외의 업무에 경비원을 종사하게 하여서는 아니된다. 다만, 경비업무의 목적 달성을 침해하지 아니하는 범위에서 행정안전부령으로 정하는 업무에 대하여는 경비원을 종사하게 할 수 있다. ㉣ 경비업을 영위하고자 하는 법인은 도급받아 행하고자 하는 경비업무를 특정하여 그 법인의 주사무소의 소재지를 관할 하는 시‧도경찰청장의 허가를 받아야 한다. ㉤ 경비업의 허가를 받은 법인이 영업을 폐업하거나 휴업한 때에는 시‧도경찰청장에게 신고하여야 한다.","2개","3개","4개","5개",2,0,""],["2026-1","경찰학",36,"수사실행을 위한 5대 원칙에 관한 설명으로 옳지 않은 것을 모두 고른 것은? ㉠ 사실판단 증명의 원칙: 수사경찰의 판단을 형사사법절차에 올려놓기 위해서는 수사경찰의 주관적인 판단이 객관적으로 증명되어야 한다. ㉡ 수사자료 감식‧검토의 원칙: 여러 가지 추측 중에서 어떤 추측이 정당한 것인가를 가리기 위해서는 그들 추측 하나 하나를 모든 각도에서 검토하여야 한다. ㉢ 검증적 수사의 원칙: ‘수사방법의 결정’ → ‘수사사항의 결정’ → ‘수사실행’이라는 순서에 따라 사건에 대한 추리를 검증 하여야 한다. ㉣ 수사자료 완전수집의 원칙: 수사의 제1원칙으로서 기초수사를 통해 수사자료를 완전히 수집하여 문제를 명확하게 하고자 노력하여야 한다.","㉠㉡","㉠㉢","㉡㉢","㉡㉣",2,0,""],["2026-1","경찰학",37,"｢특정중대범죄피의자 등신상정보공개에 관한법률｣상피의자의 신상정보 공개에 대한 설명으로 가장 적절하지 않은 것은?","검사와 사법경찰관은 신상정보 공개를 결정할 때에는 범죄의 중대성, 범행 후 정황, 피해자 보호 필요성, 피해자(피해자가 사망한 경우 피해자의 유족을 포함한다)의 의사 등을 종합적으로 고려하여야 한다.","공개하는 피의자의 얼굴은 특별한 사정이 없으면 공개 결정일 전후 30일 이내의 모습으로 한다. 이 경우 검사와 사법경찰관은 다른 법령에 따라 적법하게 수집‧보관하고 있는 사진, 영상물 등이 있는 때에는 이를 활용하여 공개할 수 있다.","검사와 사법경찰관은 피의자의 얼굴을 공개하기 위하여 필요한 경우 피의자를 식별할 수 있도록 피의자의 얼굴을 촬영할 수 있다. 이 경우 피의자는 이에 따라야 한다.","검사와 사법경찰관은 피의자의 신상정보 공개가 결정된 날부터 3일 이상의 유예기간을 두고 신상정보를 공개하여야 한다. 다만, 피의자가 신상정보 공개 결정에 대하여 서면으로 이의 없음을 표시한 때에는 유예기간을 두지 아니할 수 있다.",3,0,""],["2026-1","경찰학",38,"｢재난 및 안전관리 기본법｣에 관한 설명으로 가장 적절한 것은?","제3조 제4호에서는 재난이나 그 밖의 각종 사고로부터 사람의 생명 및 신체의 안전을 확보하기 위하여 하는 모든 활동을 ‘안전 관리’로 정의하고 있다.","재난 및 안전관리에 관한 중요 정책과 관련된 사항 등을 심의하기 위하여 행정안전부장관 소속으로 중앙안전관리위원회를 둔다.","행정안전부장관은 국가 및 지방자치단체가 행하는 재난 및 안전관리 업무를 총괄‧조정한다.","재난관리 체계 중 재난피해 신고 및 조사, 응급조치, 특별재난 지역의 선포 등은 복구 단계에서의 활동이다.",2,0,""],["2026-1","경찰학",39,"｢도로교통법｣상 음주운전 방지장치 부착 조건부 운전면허에 관한 설명으로 가장 적절하지 않은 것은?","‘음주운전 방지장치’란 술에 취한 상태에서 자동차등을 운전하려는 경우 시동이 걸리지 아니하도록 하는 것으로서 행정안전부령으로 정하는 것을 말하며, 음주운전 방지장치 부착 조건부 운전면허를 받은 사람은 음주운전 방지장치가 설치되지 아니하거나 설치기준에 적합하지 아니한 음주운전 방지장치가 설치된 자동차등을 운전 하여서는 아니 된다.","｢여객자동차 운수사업법｣에 따른 여객자동차 운수사업자의 사업용 자동차, ｢화물자동차 운수사업법｣에 따른 화물자동차 운수사업자의 사업용 자동차 및 그 밖에 대통령령으로 정하는 자동차등에 음주운전 방지장치를 설치한 자는 시‧도경찰청장에게 등록하여야 한다.","누구든지 음주운전 방지장치 부착 조건부 운전면허를 받은 사람을 대신하여 음주운전 방지장치가 설치된 자동차등을 운전할 수 있도록 해당 장치에 호흡을 불어넣거나 다른 부정한 방법으로 음주운전 방지장치가 설치된 자동차등에 시동을 거는 행위를 하여서는 아니 된다.","｢도로교통법｣ 제80조의2(음주운전 방지장치 부착 조건부 운전면허)는 개인형 이동장치를 포함한 자동차등 또는 노면전차를 운전한 경우에 적용되는 규정이다.",3,0,""],["2026-1","경찰학",40,"정보요구의 방법에 관한 설명으로 <보기 1>과 <보기 2>의 내용이 가장 적절하게 연결된 것은? < 보기 1 > (가) 임시적‧돌발적이며, 단기적 문제해결을 위한 첩보요구 (나) 사전에 첩보수집계획서의 작성이 필요하며, 계속적‧반복적으로 수집할 사항 (다) 경찰청에서 정보활동을 계획할 때 가장 중요한 지침 < 보기 2 > ㉠ EEI ㉡ OIR ㉢ PNIO ㉣ SRI (가) (나) (다)","㉢ ㉠ ㉡","㉢ ㉣ ㉠","㉣ ㉠ ㉢","㉣ ㉢ ㉡",2,0,""],["2026-2","헌법",1,"법치국가원리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법은 국가 권력의 남용으로부터 국민의 기본권을 보호하려는 법치국가의 실현을 기본이념으로 하고 있고, 법치국가의 개념은 범죄에 대한 법정형을 정함에 있어 죄질과 그에 따른 행위자의 책임 사이에 적절한 비례 관계가 지켜질 것을 요구하는 실질적 법치국가의 이념을 포함하고 있으므로, 어떤 행위를 범죄로 규정하고 어떠한 형벌을 과할 것인가 하는 데 대한 입법자의 입법형성권이 무제한한 것이 될 수는 없다.","신뢰보호원칙은 헌법상 법치국가원리로부터 파생되는 것으로, 법률을 제정하거나 개정할 때 기존의 법질서에 대한 당사자의 신뢰가 합리적이고 정당한 반면, 법률의 제정이나 개정으로 야기되는 당사자의 손해가 극심하여 새로운 입법으로 달성코자 하는 공익적 목적이 그러한 당사자의 신뢰가 파괴되는 것을 정당화할 수 없는 경우 그러한 입법이 허용될 수 없다는 것이다.","법치국가원리의 한 표현인 명확성원칙은 기본적으로 모든 기본권 제한 입법에 요구되지만, 모든 법률에 있어서 동일한 정도로 요구되는 것은 아니며, 이러한 명확성원칙을 산술적으로 엄격히 관철하도록 요구하는 것은 입법기술상 불가능하거나 현저히 곤란하므로 어느 정도의 보편적 내지 일반적 개념의 용어 사용은 부득이하다고 할 수밖에 없다.","정량적인 온실가스 감축목표의 구체적인 수치가 얼마인지를 정하는 것은 여러 과학적‧정책적‧외교적인 요소와 다양한 이해관계를 고려해야 하는 문제이므로 민주주의원리에 따라 입법자와 그 위임을 받은 집행자의 몫이라고 할 것이지만, 이를 실효적으로 제도화 하기 위하여 필요한 입법자의 의무를 확인하여 선언하는 것이 법치국가원리에 따른 헌법재판소의 책무인 것은 아니다.",3,0,""],["2026-2","헌법",2,"헌법개정절차와 국민투표에 관한 설명으로 가장 적절하지 않은 것은?","｢국민투표법｣에 따르면, 대법원은 국민투표 무효의 소송에서 국민투표에 관한 규정을 위반한 사실이 있는 경우라도 국민투표의 결과에 영향을 미쳤다고 인정하는 때에 한정하여 국민투표의 전부 또는 일부의 무효를 판결한다.","｢국민투표법｣에 따르면, 국민투표의 효력에 관하여 이의가 있는 정당 또는 투표인은 10만명 이상의 서명을 받아 중앙선거관리 위원회위원장을 피고로 하여 국민투표일부터 20일 이내에 대법원에 소를 제기할 수 있다.","헌법개정은 국회재적의원 과반수 또는 대통령의 발의로 제안 되며, 제안된 헌법개정안은 대통령이 20일 이상의 기간 이를 공고하여야 한다.","국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다.",1,0,""],["2026-2","헌법",3,"헌정사에 관한 설명으로 가장 적절하지 않은 것은?","제헌헌법은 1948.7.12. 국회에서 통과되어 국회의장 이승만이 1948.7.17. 서명‧공포하여 시행되었으며, 혼인은 남녀동권을 기본으로 하며 혼인의 순결과 가족의 건강은 국가의 특별한 보호를 받는다고 규정하였다.","제2차 개정헌법에서는 헌법개정의 제안은 대통령, 민의원 또는 참의원의 재적의원 3분지 1이상 또는 민의원의원선거권자 50만인 이상의 찬성으로써 한다고 규정하였다.","제3차 개정헌법에서는 기본권 제한에 대한 일반적 법률유보조항과 기본권의 본질적 내용 침해 금지 조항을 두었다.","제8차 개정헌법에서는 제3차 개정헌법에서 규정된 언론‧출판에 대한 허가나 검열과 집회‧결사에 대한 허가는 인정되지 않는다는 조항이 부활되었다.",3,0,""],["2026-2","헌법",4,"｢국적법｣과 국적에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","복수국적자가 외국에 주소가 있는 경우에만 국적이탈을 신고할 수 있도록 하는 ｢국적법｣ 제14조 제1항 본문은, 외국에 생활근거 없이 주로 국내에서 생활하며 대한민국과 유대관계를 형성한 자에게 과도한 불이익이 발생하므로 국적이탈의 자유를 침해한다. (일반공채･101경비단)","‘직계존속이 외국에서 영주할 목적 없이 체류한상태에서 출생한 자’에 대해서는 병역의무를 해소한 경우에만 대한민국 국적이탈을 신고할 수 있도록 한 구 ｢국적법｣ 제12조 제3항은, 과잉금지원칙에 위배되지 아니하므로 국적이탈의 자유를 침해하지 아니한다.","복수국적자에 대하여 병역준비역에 편입된 때부터 3개월 이내에 대한민국 국적을 이탈하지 않으면 병역의무를 해소한 후에야 이를 가능하도록 한 ｢국적법｣ 제12조 제2항 본문 및 제14조 제1항 단서 중 제12조 제2항 본문에 관한 부분은, 과잉금지 원칙에 위배되어 복수국적자의 국적이탈의 자유를 침해한다.","국적은 국민이 되는 자격‧신분이자 국가와 구성원 간의 법적 유대(法的 紐帶)로서 보호와 복종관계를 뜻하는데, 국적에 관한 사항은 국가의 기본적 구성요소이며 주권자인 국민의 범위를 확정하는 고도의 정치적 속성을 가지고 있으므로 당해 국가가 역사적 전통과 정치, 경제, 사회, 문화 등의 제반사정을 고려 하여 결정할 문제이다.",0,0,""],["2026-2","헌법",5,"기본권 주체성에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공법인이나 이에 준하는 지위를 가진 자라 하더라도, 공무를 수행 하거나 고권적 행위를 하는 경우가 아닌 사경제 주체로서 활동 하는 경우나 조직법상 국가로부터 독립한 고유 업무를 수행하는 경우에는 기본권의 주체가 될 수 있지만, 다른 공권력 주체와의 관계에서 지배복종관계가 성립되어 일반 사인처럼 그 지배하에 있는 경우에는 기본권 주체가 될 수 없다.","아동과 청소년은 부모와 국가에 의한 단순한 보호의 대상이 아닌 독자적인 인격체이며, 그의 인격권은 성인과 마찬가지로 인간의 존엄성 및 행복추구권을 보장하는 헌법 제10조에 의하여 보호된다.","헌법 제8조 제1항은 정당설립의 자유, 정당조직의자유, 정당 활동의 자유 등을 포괄하는 정당의 자유를 보장하고 있으며 이러한 정당의 자유는 국민이 개인적으로 갖는 기본권일 뿐만 아니라, 단체로서의 정당이 가지는 기본권이기도 하다.","‘국민’ 또는 국민과 유사한 지위에 있는 ‘외국인’은 기본권의 주체가 될 수 있으며, 인간의 존엄과 가치, 행복추구권은 대체로 인간의 권리로서 외국인도 주체가 될 수 있다고 보아야 하고, 평등권도 인간의 권리로서 참정권 등에 대한 성질상의 제한 및 상호주의에 따른 제한이 있을 뿐이다.",0,0,""],["2026-2","헌법",6,"기본권 보호의무에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","산업단지의 지정권자로 하여금 산업단지계획안에 대한 주민의견 청취와 동시에 환경영향평가서 초안에 대한 주민의견청취를 진행 하도록 한 구 ｢산업단지 인‧허가 절차 간소화를 위한 특례법｣ 조항 중 해당 부분은, 국가의 기본권 보호의무에 위배되었다고 할 수 없다.","발전용원자로 및 관계시설의 건설허가 신청시 필요한 방사선 환경영향평가서 및 그 초안을 작성하는 데 있어 ‘중대사고’에 대한 평가를 제외하고 있는 ‘원자력이용시설 방사선환경영향 평가서 작성 등에 관한 규정’ 조항 중 해당 부분이 국가가 국민의 생명‧신체의 안전을 보호하는 데 적절하고 효율적인 최소한의 조치조차 취하지 아니한 것이라고 보기는 어렵다.","‘한약(생약)제제 등의 품목허가‧신고에 관한 규정’ 조항에서 일정한 한약서에 수재된 처방에 해당하는 품목의 한약제제를 안전성‧유효성 심사대상에서 제외한 것은, 국가가 국민의 보건권을 보호하는 데 적절하고 효율적인 최소한의 조치를 취하지 아니한 것이다.","원자력발전소 건설을 내용으로 하는 전원개발사업 실시계획에 대한 승인권한을 산업통상자원부장관에게 부여하고 있는 ｢전원개발촉진법｣ 조항에서 원전 건설을 내용으로 하는 전원 개발사업 실시계획에 대한 승인권한을 다른 전원개발과 마찬 가지로 산업통상자원부장관에게 부여하고 있다 하더라도, 국가가 국민의 생명‧신체의 안전을 보호하기 위하여 필요한 최소한의 보호조치를 취하지 아니한 것이라고 보기는 어렵다.",2,0,""],["2026-2","헌법",7,"기본권 제한 및 침해에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","특별자치시장‧시장‧군수‧구청장으로 하여금 대형마트 등에 대하여 영업시간 제한을 명하거나 의무휴업을 명할 수 있도록 한 ｢유통산업발전법｣ 조항이 영업제한을 받는 대형마트 등과 그러한 제한을 받지 않는 다른 형태의 대규모점포들을 차별 취급하고 있으나, 이는 지역상권에 미치는 영향에 차이가 있음을 고려한 것으로 합리적 이유가 있다.","교비회계의 전용을 금지하고 이를 위반하는 경우 처벌하는 구 ｢사립학교법｣ 조항은, 교비회계에 속하는 수입이나 재산을 다른 회계에 전출하거나 대여할 수 있는 예외적인 경우를 규정하고 있지 않고 법원이 교비 지출이 학교 교육에 직접 필요한 경비 인지 판단할 기회가 없어, 사립학교 운영의 자유를 침해한다.","문자메시지를 이용한 조합장 선거운동에서 문자 외의 음성‧화상‧ 동영상 등을 문자메시지에 포함하지 못하도록 규정한 구 ｢공공 단체 등 위탁선거에 관한 법률｣ 조항 중 해당 부분은, 조합장선거 후보자의 선거운동에 관한 사항으로 농업협동조합 및 수산업협동 조합의 단체의 기관 구성에 관한 결사의 자유를 제한할 뿐, 조합장선거 후보자의 표현의 자유를 제한하는 것은 아니다.","집회‧시위 등 현장에서 집회‧시위 참가자에 대한 경찰의 사진이나 영상촬영 등의 행위는 집회‧시위 참가자들에게 심리적 부담으로 작용하여 여론형성 및 민주적 토론절차에 영향을 주고 집회의 자유를 전체적으로 위축시키지만 이는 사실적이고 간접적인 불이익이라고 할 것인바 집회의 자유를 제한한다고 볼 수 없다.",0,0,""],["2026-2","헌법",8,"법률유보원칙에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 일정한 특정경제범죄로 징역형의 집행유예를 받은 사람에 대하여, 일정 기간 동안 ‘유죄판결된 범죄행위와 밀접한 관련이 있는 기업체’에 취업을 금지하면서 법무부장관의 승인을 받은 경우에만 취업할 수 있도록 규정한 ｢특정경제범죄 가중처벌 등에 관한 법률｣ 조항 중 해당 부분은, 취업승인의 의미, 방법, 요건, 기준 등을 직접 정하고 있지 않아 법률유보원칙에 반한다. ㉡ 구청장 등이 시가지 안에서 건축물의 위치나 환경을 정비하기 위하여 필요하다고 인정하면 대통령령이 정하는 범위에서 건축선을 따로 지정할 수 있도록 규정한 ｢건축법｣ 조항은 법률유보원칙에 위반되지 않는다. ㉢ 교습비등반환조항에 따른 교습비등의 반환사유, 반환금액, 그 밖에 필요한 사항을 대통령령으로 정하도록 한 ｢학원의 설립‧운영 및 과외교습에 관한 법률｣ 조항 중 해당 부분은 법률유보원칙에 반하지 아니한다. ㉣ 특별수선충당금의 요율 등을 대통령령으로 정하도록 위임한 구 ｢임대주택법｣ 조항 중 해당 부분은 법률유보원칙에 위배 되지 않는다.","㉠㉢","㉡㉣","㉡㉢㉣","㉠㉡㉢㉣",2,0,""],["2026-2","헌법",9,"일반적행동의자유에관한설명으로 옳은것만을모두고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 개인형 이동장치 운전자에게 원동기장치자전거 면허 이상의 운전면허 취득을 요구하고 이를 위반하면 벌금 등을 부과 하는 ｢도로교통법｣ 조항 중 해당 부분은, 일반적 행동의 자유를 침해하지 아니한다. ㉡ 중대재해가 발생한 경우 사업주에게 중대재해의 내용 등을 고용노동부장관에게 보고하도록 하고 이를 위반한 경우 과태료를 부과하도록 규정한 구 ｢산업안전보건법｣ 조항 중 해당 부분은, 과잉금지원칙에 위반되어 일반적 행동의 자유를 침해하지 아니한다. ㉢ 장교의 외출‧외박 지역을 2시간 이내 복귀 가능한 지역으로 한정한 구 ‘육군 제35보병사단 병영생활 예규’ 조항 중 해당 부분은, 과잉금지원칙을 위반하여 청구인의 일반적 행동의 자유를 침해하지 아니한다. ㉣ 정당한 사유 없이 정보통신시스템, 데이터 또는 프로그램 등의 운용을 방해할 수 있는 악성프로그램을 유포한 자를 형사처벌 하도록 규정한 구 ｢정보통신망 이용촉진 및 정보보호 등에 관한 법률｣ 조항은, 과잉금지원칙을 위반하여 일반적 행동의 자유를 침해하지 아니한다.","㉠㉢","㉡㉣","㉡㉢㉣","㉠㉡㉢㉣",3,0,""],["2026-2","헌법",10,"평등원칙 및 평등권에 관한 설명으로 옳고 그름의 표시 (O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 국회의원을 후원회지정권자로 정하면서 ‘도’의회의원과 ‘시’의회 의원을 후원회지정권자에서 제외하고 있는 ｢정치자금법｣ 조항은, 불합리한 차별로서 청구인들의 평등권을 침해한다. ㉡ 지역가입자가 임대사업자이거나 은퇴자인 경우에도 직장가입자와 달리 지역가입자에 대하여 소득 외에 재산까지 고려하여 건강 보험료를 부과하도록 한 구 ｢국민건강보험법｣ 조항은, 합리적인 이유가 있으므로 평등원칙에 위배되지 않는다. ㉢ 4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자, 즉 이른바 ‘초단시간근로자’를 퇴직급여제도의 적용 대상에서 제외하고 있는 ｢근로자퇴직급여 보장법｣ 조항 중 해당 부분은, 입법재량을 벗어난 자의적인 재량권 행사라고 보기는 어려우므로 평등원칙에 위배되지 아니한다. ㉣ 원판결의 근거가 된 가중처벌규정에 대하여 헌법재판소의 위헌 결정이 있었음을 이유로 개시된 재심절차에서, 공소장의 교환적 변경을 통해 위헌결정된 가중처벌규정보다 법정형이 가벼운 처벌규정으로 적용법조가 변경되어 피고인이 무죄판결을 받지는 않았으나 원판결보다 가벼운 형으로 유죄판결이 확정됨에 따라 원판결에 따른 구금형 집행이 재심판결에서 선고된 형을 초과 하게 된 경우, 재심판결에서 선고된 형을 초과하여 집행된 구금에 대하여 보상요건을 규정하지 아니한 ｢형사보상 및 명예 회복에관한법률｣ 조항은, 청구인들의평등권을침해하지아니한다.","㉠(O) ㉡(O) ㉢(O) ㉣(X)","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(O)","㉠(X) ㉡(X) ㉢(X) ㉣(X)",0,0,""],["2026-2","헌법",11,"죄형법정주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","옥외집회에 대하여 사전신고의무를 부과한 구 ｢집회 및 시위에 관한 법률｣ 제6조 제1항 본문 중 ‘옥외집회’에 관한 부분은 구체적 으로 어떤 행위가 집회에 해당하여 미리 신고하지 않으면 미신고 집회로 처벌되는지 여부에 대해 명확하게 규정하고 있지 않으므로 죄형법정주의의 명확성원칙에 위배된다.","아동‧청소년대상 성범죄의 신고의무자가 자기의 보호‧감독 또는 진료를 받는 13세 미만의 미성년자에 대하여 강제추행죄를 범한 경우 그 죄에 정한 형의 2분의 1까지 가중처벌하도록 정한 ｢아동‧청소년의 성보호에 관한 법률｣ 조항 중 해당 부분은 범죄의 죄질과 행위자의 책임의 다양성에 따라 적절한 양형을 할 수 없게 하여 책임주의에 반한다.","근로자가 사망 또는 퇴직한 경우 사용자로 하여금 지급사유가 발생한 날부터 14일 이내에 임금 등을 지급하도록 하고 이를 위반할 경우 형사처벌 하도록 규정한 구 ｢근로기준법｣ 조항 중 해당 부분은 죄형법정주의의 명확성원칙에 위반되지 아니한다.","자동차제작자등이 제작등을 한 자동차에 안전운행에 지장을 주는 등의 결함이 있는 경우 지체 없이 그 사실을 공개하고 시정조치를 하도록 하는 구 ｢자동차관리법｣ 조항 중 해당 부분은 죄형법정주의의 명확성원칙에 위배되지 아니한다.",0,0,""],["2026-2","헌법",12,"사생활의 비밀과 자유 및 개인정보자기결정권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국가가 사유재산에 관한 정보를 등록하게 하는 것은 사유재산에 관한 사적 영역의 자유로운 형성과 설계를 제한하는 것이므로, 헌법 제17조가 보장하는 사생활의 비밀과 자유를 제한하는 것이 라고 할 것이다.","어린이집 원장을 포함하여 보육교사 및 영유아의 신체나 행동이 그대로 CCTV에 촬영‧녹화되더라도 어린이집은 공적인 공간 이지 사적인 공간이 아니므로, 어린이집 설치‧운영자로 하여금 어린이집에 CCTV를 원칙적으로 설치하도록 하면서 설치 반대에 보호자 전원의 동의를 받는 경우에만 설치의무를 면할 수 있도록 정한 ｢영유아보육법｣ 조항은 이들의 사생활의 비밀과 자유를 제한하지 않는다.","조합원이 조합 임원에게 ‘조합원 명부’의 복사 요청을 한 경우 15일 이내에 그 요청에 따르도록 하는 ｢도시 및 주거환경정비법｣ 조항 중 해당 부분은 조합원의 개인정보자기결정권을 침해한다고 볼 수 없다.","‘아동에게 음란한 행위를 시키거나 이를 매개하는 행위 또는 아동에게 성적 수치심을 주는 성희롱 등의 성적 학대행위를 하였다는 범죄사실로 유죄판결이 확정된 자’를 신상정보 등록 대상자로 정한 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 조항 중 ｢아동‧청소년의 성보호에 관한 법률｣ 제2조 제2호 라목의 ‘구 아동복지법 제17조 제2호의 범죄로 유죄판결이 확정된 자’에 관한 부분은 개인정보자기결정권을 침해하지 않는다.",1,0,""],["2026-2","헌법",13,"직업의 자유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","법무사의 업무범위를 규정하고 법무사가 아닌 자는 법무사의 업무를 업으로 하는 것을 금지하는 ｢법무사법｣ 제2조 제1항 제8호는 행정사인 청구인의 직업의 자유를 제한하는 측면이 있고, 그에 앞서 국민의 법률생활 및 사법제도와 관련되어 있는 법무사의 자격제도에 관한 것이라는 점에서 과잉금지원칙 심사는 강화되어 적용된다고 할 것이다.","다른 사람에게 자기의 성명을 사용하여 건축사업무를 수행하게 한 경우 필요적으로 건축사 자격을 취소하도록 정한 구 ｢건축 사법｣ 조항 중 해당 부분은, 처분권자의 재량에 따라 임의적 으로 건축사 자격을 취소하게 하거나 건축사 자격을 일정 기간 정지하는 방법 등과 같이 완화된 수단에 의해서도 입법목적을 같은 정도로 달성하기에 충분하므로, 과잉금지원칙에 반하여 직업의 자유를 침해한다.","청원경찰이 금고 이상의 형의 선고유예를 받은 경우 당연 퇴직 되도록 규정한 ｢청원경찰법｣ 조항 중 제5조 제2항에 의한 ｢국가 공무원법｣ 제33조 제5호에 관한 부분은, 청원경찰이 저지른 범죄의 종류나 내용을 불문하고 범죄행위로 금고 이상의 형의 선고유예를 받게 되면 당연히 퇴직되도록 규정함으로써, 과잉금지원칙에 반하여 직업의 자유를 침해한다.","의약외품이 아닌 것을 용기‧포장 또는 첨부 문서에 의학적 효능‧ 효과 등이 있는 것으로 오인될 우려가 있는 표시를 금지하는 구 ｢약사법｣ 제66조 중 제61조 제2항 가운데 ‘표시’에 관한 부분을 준용하는 부분은 물품이 가지는 기능과 안전성에 대한 일체의 표시를 제한하는 것이므로 과잉금지원칙을 위반하여 직업의 자유를 침해한다.",2,0,""],["2026-2","헌법",14,"표현의 자유에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","선거의 공정성은 국민의 정치적 의사를 정확하게 반영하는 선거를 실현하기 위한 헌법적 목표이므로, 선거의 공정성이 정치적 표현의 자유를 보장하는 전제 조건이 된다.","전기통신역무의 종류, 사업규모 등을 고려하여 대통령령으로 정하는 조치의무사업자는 불법촬영물등의 유통을 방지하기 위하여 대통령령으로 정하는 기술적‧관리적 조치를 하여야 한다고 규정한 ｢전기통신사업법｣ 조항은 사회관계망서비스, 온라인 커뮤니티 등 부가통신서비스를 이용하는 청구인들의 표현의 자유를 침해하지 아니한다.","당선되거나 되게 하거나 되지 못하게 할 목적으로 공연히 사실을 적시하여 후보자가 되고자 하는 자를 비방한 자를 처벌하는 ｢공직선거법｣ 제251조 중 ‘후보자가 되고자 하는 자’에 관한 부분은 과잉금지원칙에 위배되어 정치적 표현의 자유를 침해한다.","정치적 표현에 대하여는 ‘자유를 원칙으로, 금지를 예외로’ 하여야 하고, ‘금지를 원칙으로, 허용을 예외로’ 해서는 안 된다는 점은 자명하므로, 선거운동 등에 대한 제한이 정치적 표현의 자유를 침해하는지 여부를 판단함에 있어서는 표현의 자유의 규제에 관한 판단기준으로서 엄격한 심사기준을 적용하여야 한다.",0,0,""],["2026-2","헌법",15,"재산권에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","의료급여기관이 의료급여 제공 후 건강보험심사평가원에 의료급여 비용의 심사를 청구하였고, 이에 관하여 건강보험심사평가원의 심사결과 통보가 있었다고 하더라도, 의료급여기관이 ｢의료급여법｣ 조항에 따라 시장‧군수‧구청장에 대하여 그 비용을 청구할 수 있는 권리는 국민건강보험공단의 지급결정이 있기 전에는 경제적 가치가 있는 권리로서 헌법 제23조에 의하여 보장되는 재산권의 성격을 갖는다고 보기 어렵다.","가축의 살처분으로 인한 재산권의 제약은 헌법 제23조 제3항에 따라 보상을 요하는 수용에 해당하지 않고 가축의 소유자가 수인해야 하는 사회적 제약의 범위에 속하지만, 헌법 제23조 제1항 및 제2항에 따라 재산권의 사회적 제약을 구체화하는 법률조항이라 하더라도 권리자에게 수인의 한계를 넘어 가혹한 부담이 발생하는 예외적인 경우에는 이를 완화하는 보상규정을 두어야 한다.","지방자치단체가 소유하는 일반재산을 임차목적물로 하는 임대차 에는 권리금 회수기회 보호에 관한 규정의 적용을 배제하도록 한 ｢상가건물 임대차보호법｣ 조항 중 ‘공유재산’ 가운데 ｢공유재산 및 물품 관리법｣ 조항에 따른 ‘일반재산’에 관한 부분은, 행정 재산 또는 일반재산인지를 구분함이 없이 권리금 회수기회 보호 제도의 적용을 일률적으로 배제함으로써, 상가임차인의 재산권을 침해한다.","지적재조사사업의 시행에 따른 경계 확정으로 지적공부상 면적이 증가된 경우, 필지별 면적 증가내역을 기준으로 조정금을 징수 하도록 규정한 구 ｢지적재조사에 관한 특별법｣ 조항 중 ‘징수’에 관한 부분은, 현실경계는 변동이 없으나 지적공부상 면적만 증가한 경우 등에 대하여도 예외 없이 일률적으로 조정금을 산정하여 현금으로 징수하도록 함으로써, 토지소유자의 재산권을 침해한다.",1,0,""],["2026-2","헌법",16,"재판청구권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형사재판에서 일반적으로 피고인이 자신을 방어하기 위하여 유리한 주장과 자료를 제출하는 영역은 대부분 ‘사실오인, 법리오해, 양형부당’ 중 하나에 해당하기 마련이고, 이러한 사유들은 모두 대표적인 항소이유에 해당되므로, 형사재판에 있어 ‘사실, 법리, 양형’과 관련하여 피고인이 자신에게 유리한 주장 및 자료를 제출할 수 있는 기회를 보장하는 것은, 헌법이 보장한 ‘공정한 재판을 받을 권리’의 보호영역에 포함된다.","원심재판장이 법원사무관등으로 하여금 상고장에 대하여 보정을 명하게 할 수 있도록 한 ｢민사소송법｣ 제425조 중 ｢민사소송법｣ 제399조 제1항 후문을 준용하는 부분은 입법형성권의 한계를 벗어나 법관에 의한 재판을 받을 권리를 침해한다고 볼 수 없다.","형사소송절차에서 피고인의 반대신문권 보장이 공정한 재판의 중요한 요소임은 분명하므로, 그 핵심은 진술의 진실성과 신빙성을 검증할 수 있는 기회가 보장되는지 여부가 아니라 물리적 대면 이라는 형식 그 자체이다.","‘법률에 의한’ 재판청구권은 원칙적으로 입법자에 의하여 형성된 현행 소송법의 범주 안에서 권리구제절차를 보장하며, 그 실현은 법원의 조직과 절차에 관한 입법에 의존하고 있으므로, 입법자는 사실상 재판청구권을 무력화하는 등 입법형성권의 한계를 벗어나지 않는 한 재판절차를 어떻게 구성할지에 관한 재량을 가진다.",2,0,""],["2026-2","헌법",17,"교육을 받을 권리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법 제20조 제2항은 국교는 인정되지 아니하며 종교와 정치는 분리된다고 규정하여 정교분리원칙을 선언하고 있는바, 국‧공립 학교에 다니는 자녀를 둔 부모는 종교중립적인 교육환경에서 그 자녀를 교육시킬 권리를 가진다.","부모의 자녀교육권은 다른 기본권과는 달리, 기본권의 주체
