할 능력이 없는 자의 질서위반행위는 과태료를 감경한다. (24.2차)","answer":false,"quote":"① 심신(心神)장애로 인하여 행위의 옳고 그름을 판단할 능력이 없거나 그 판단에 따른 행위를 할 능력이 없는 자의 질서위반행위는 과태료를 부과하지 아니한다.","cite":"질서위반행위규제법 제10조 제1항","badge":"","topic":"","from":"GY-2024-2-P-22","seq":null},{"id":"P-OX-297","subject":"경찰학","unit":"경찰실무·각론","stmt":"“재난관리”란 재난의 예방･대비･대응 및 복구를 위하여 하는 모든 활동을 말한다. (23.1차)","answer":true,"quote":"3. \"재난관리\"란 재난의 예방·대비·대응 및 복구를 위하여 하는 모든 활동을 말한다.","cite":"재난 및 안전관리 기본법 제3조","badge":"","topic":"","from":"GY-2023-1-P-38","seq":null},{"id":"P-OX-321","subject":"경찰학","unit":"경찰실무·각론","stmt":"경비업의 허가를 받은 법인이 영업을 폐업하거나 휴업한 때에는 시‧도경찰청장에게 신고하여야 한다. (26.1차)","answer":true,"quote":"(1) 경비업을 영위하고자 하는 법인은 도급받아 행하고자 하는 경비업무를 특정하여 그 법인의 주사무소의 소재지를 관할하는 지방경찰청장의 허가를 받아야 한다. 도급받아 행하고자 하는 경비업무를 변경하는 경우에도 또한 같다. (2) 제1항의 규정에 의한 허가를 받고자 하는 법인은 대통령령이 정하는 경비인력·자본금·시설 및 장비를 갖추어야 한다. (3) 제1항의 규정에 의하여 경비업의 허가를 받은 법인은 다음 각호의 1에 해당하는 때에는 지방경찰청장에게 신고하여야 한다. 1. 영업을 폐업하거나 휴업한 때 2. 법인의 명칭이나 대표자·임원을 변경한 때 3. 법인의 주사무소나 출장소를 신설·이전 또는 폐지한 때 4. 기계경비업무의 수행을 위한 관제시설을 신설·이전 또는 폐지한 때 5. 특수경비업무를 개시하거나 종료한 때 6. 그 밖에 대통령령이 정하는 중요사항을 변경한 때 (4) 제1항 및 제3항의 규정에 의한 허가 또는 신고의 절차, 신고의 기한 등 허가 및 신고에 관하여 필요한 사항은 대통령령으로 정한다.","cite":"경비업법 제4조","badge":"","topic":"","from":"GY-2026-1-P-35","seq":null},{"id":"P-OX-343","subject":"경찰학","unit":"경찰실무·각론","stmt":"丙과 같이 사는 사촌동생이 丙을 약취유인한 경우 (24.1차)","answer":false,"quote":"함께 사는 사촌은 동거 친족이라 가정구성원이지만, 약취·유인죄는 가정폭력범죄 목록에 없다.","cite":"가정폭력범죄의 처벌 등에 관한 특례법 제2조","badge":"","topic":"","from":"GY-2024-1-P-37","seq":null},{"id":"P-OX-349","subject":"경찰학","unit":"경찰실무·각론","stmt":"경비업자는 허가받은 경비업무외의 업무에 경비원을 종사하게 하여서는 아니된다. 다만, 경비업무의 목적 달성을 침해하지 아니하는 범위에서 행정안전부령으로 정하는 업무에 대하여는 경비원을 종사하게 할 수 있다. (26.1차)","answer":false,"quote":"허가받은 경비업무 밖의 업무에 경비원을 쓸 수 있는 예외는 행정안전부령이 아니라 대통령령으로 정한다.","cite":"경비업법 제7조","badge":"","topic":"","from":"GY-2026-1-P-35","seq":null},{"id":"P-OX-288","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘시설경비업무’란 경비를 필요로 하는 시설 및 장소(이하 “경비 대상시설” 이라 한다)에서의 도난 화재 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무를 말한다. (22.1차)","answer":true,"quote":"1. \"경비업\"이라 함은 다음 각목의 1에 해당하는 업무(이하 \"경비업무\"라 한다)의 전부 또는 일부를 도급받아 행하는 영업을 말한다. 가. 시설경비업무 : 경비를 필요로 하는 시설 및 장소(이하 \"경비대상시설\"이라 한다)에서의 도난·화재 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무 나. 호송경비업무 : 운반중에 있는 현금·유가증권·귀금속·상품 그 밖의 물건에 대하여 도난·화재 등 위험발생을 방지하는 업무 다. 신변보호업무 : 사람의 생명이나 신체에 대한 위해의 발생을 방지하고 그 신변을 보호하는 업무 라. 기계경비업무 : 경비대상시설에 설치한 기기에 의하여 감지·송신된 정보를 그 경비대상시설외의 장소에 설치한 관제시설의 기기로 수신하여 도난·화재 등 위험발생을 방지하는 업무 마. 특수경비업무 : 공항(항공기를 포함한다) 등 대통령령이 정하는 국가중요시설(이하 \"국가중요시설\"이라 한다)의 경비 및 도난·화재 그 밖의 위험발생을 방지하는 업무","cite":"경비업법 제2조","badge":"","topic":"","from":"GY-2022-1-P-21","seq":null},{"id":"P-OX-305","subject":"경찰학","unit":"경찰실무·각론","stmt":"｢집회 및 시위에 관한 법률｣에 따른 신고 없이 이루어진 집회에 참석한 참가자들이 차로 위를 행진하는 등 도로교통을 방해함으로써 통행을 불가능하게 하거나 현저하게 곤란하게 하는 경우라도 참가자 모두에게 당연히 일반교통방해죄가 성립하는 것은 아니다. (23.2차)","answer":true,"quote":"집회 및 시위에 관한 법률에 따른 신고 없이 이루어진 집회에 참석한 참가자들이 차로 위를 행진하는 등으로 도로 교통을 방해함으로써 통행을 불가능하게 하거나 현저하게 곤란하게 하는 경우에 일반교통방해죄가 성립한다.","cite":"대법원 2017도9146","badge":"","topic":"","from":"GY-2023-2-P-39","seq":null},{"id":"P-OX-301","subject":"경찰학","unit":"경찰실무·각론","stmt":"“보안관찰처분대상자”라 함은 보안관찰해당범죄 또는 이와 경합된 범죄로 금고 이상의 형의 선고를 받고 그 형기 합계가 3년 이상인 자로서 형의 전부 또는 일부의 집행을 받은 사실이 있는 자를 말한다. (23.1차)","answer":true,"quote":"이 법에서 \"보안관찰처분대상자\"라 함은 보안관찰해당범죄 또는 이와 경합된 범죄로 금고 이상의 형의 선고를 받고 그 형기합계가 3년 이상인 자로서 형의 전부 또는 일부의 집행을 받은 사실이 있는 자를 말한다.","cite":"보안관찰법 제3조","badge":"","topic":"","from":"GY-2023-1-P-40","seq":null},{"id":"P-OX-307","subject":"경찰학","unit":"경찰실무·각론","stmt":"폭행 또는 협박으로 아동･청소년을 강간할 목적으로 예비 또는 음모한 자에 대한 처벌규정이 있다. (24.1차)","answer":true,"quote":"아동·청소년에 대한 강간·강제추행 등의 죄를 범할 목적으로 예비·음모한 사람도 3년 이하 징역으로 처벌한다.","cite":"아동·청소년의 성보호에 관한 법률 제7조의2","badge":"","topic":"","from":"GY-2024-1-P-36","seq":null},{"id":"P-OX-309","subject":"경찰학","unit":"경찰실무·각론","stmt":"경찰청장은 실종아동등의 발견을 위하여 실종아동등을 찾고자 하는 가족으로부터 유전자검사대상물을 채취할 수 있다. (25.1차)","answer":true,"quote":"(1) 경찰청장은 실종아동등의 발견을 위하여 보호시설의 입소자 중 보호자가 확인되지 아니한 아동등과 실종아동등을 찾고자 하는 가족으로부터 유전자검사대상물(이하 \"검사대상물\"이라 한다)을 채취할 수 있다. (2) 유전자검사를 전문으로 하는 기관으로서 대통령령으로 정하는 기관(이하 \"검사기관\"이라 한다)은 유전자검사를 실시하고 그 결과를 데이터베이스로 구축ㆍ운영할 수 있다. (3) 제1항 및 제2항의 규정에 따른 검사대상물의 채취 및 유전자검사는 제8조제1항의 규정에 따른 데이터베이스를 활용하여 실종아동등의 여부를 확인한 후에 이를 실시하여야 한다. (4) 경찰청장은 제1항의 규정에 따라 검사대상물을 채취하고자 하는 때에는 미리 검사대상자의 서면동의를 얻어야 한다. 이 경우 검사대상자가 미성년자ㆍ심신상실자 또는 심신미약자인 때에는 본인 외에 법정대리인의 동의를 얻어야 한다. 다만, 심신상실ㆍ심신미약 또는 의사무능력 등의 사유로 본인의 동의를 얻을 수 없는 때에는 본인의 동의를 생략할 수 있다. (5) 제2항의 규정에 따른 유전정보 데이터베이스를 구축ㆍ운영함에 있어서는 유전정보는 검사기관의 장이, 신상정보는 전문기관의 장이 각각 구분하여 관리하여야 한다. (6) 제1항 내지 제5항의 규정에 따른 검사대상물의 채취, 유전자검사의 실시, 데이터베이스 구축, 유전자검사의 동의 및 유전정보와 신상정보의 구분ㆍ관리 등에 관하여 필요한 사항은 대통령령으로 정한다.","cite":"실종아동등의 보호 및 지원에 관한 법률 제11조","badge":"","topic":"","from":"GY-2025-1-P-35","seq":null},{"id":"P-OX-348","subject":"경찰학","unit":"경찰실무·각론","stmt":"사법경찰관리 또는 아동학대전담공무원이 응급조치를 한 경우에는 즉시 응급조치결과보고서를 작성하여야 한다. 이 경우 사법 경찰관리가 응급조치를 한 경우에는 관할 경찰관서의 장이 시‧도지사 또는 시장‧군수‧구청장에게, 아동학대전담공무원이 응급조치를 한 경우에는 소속 시‧도지사 또는 시장‧군수‧구청장이 관할 경찰관서의 장에게 작성된 응급조치결과보고서를 10일 이내에 송부하여야 한다. (25.2차)","answer":false,"quote":"응급조치결과보고서는 즉시 작성하고, 관할 경찰관서의 장과 지방자치단체장 사이에 10일 이내가 아니라 지체 없이 보내야 한다.","cite":"아동학대범죄의 처벌 등에 관한 특례법 제12조","badge":"","topic":"","from":"GY-2025-2-P-36","seq":null},{"id":"P-OX-320","subject":"경찰학","unit":"경찰실무·각론","stmt":"경비업을 영위하고자 하는 법인은 도급받아 행하고자 하는 경비업무를 특정하여 그 법인의 주사무소의 소재지를 관할 하는 시‧도경찰청장의 허가를 받아야 한다. (26.1차)","answer":true,"quote":"(1) 경비업을 영위하고자 하는 법인은 도급받아 행하고자 하는 경비업무를 특정하여 그 법인의 주사무소의 소재지를 관할하는 지방경찰청장의 허가를 받아야 한다. 도급받아 행하고자 하는 경비업무를 변경하는 경우에도 또한 같다. (2) 제1항의 규정에 의한 허가를 받고자 하는 법인은 대통령령이 정하는 경비인력·자본금·시설 및 장비를 갖추어야 한다. (3) 제1항의 규정에 의하여 경비업의 허가를 받은 법인은 다음 각호의 1에 해당하는 때에는 지방경찰청장에게 신고하여야 한다. 1. 영업을 폐업하거나 휴업한 때 2. 법인의 명칭이나 대표자·임원을 변경한 때 3. 법인의 주사무소나 출장소를 신설·이전 또는 폐지한 때 4. 기계경비업무의 수행을 위한 관제시설을 신설·이전 또는 폐지한 때 5. 특수경비업무를 개시하거나 종료한 때 6. 그 밖에 대통령령이 정하는 중요사항을 변경한 때 (4) 제1항 및 제3항의 규정에 의한 허가 또는 신고의 절차, 신고의 기한 등 허가 및 신고에 관하여 필요한 사항은 대통령령으로 정한다.","cite":"경비업법 제4조","badge":"","topic":"","from":"GY-2026-1-P-35","seq":null},{"id":"P-OX-287","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘호송경비업무’란 운반중에 있는 현금 유가증권 귀금속 상품 그 밖의 물건에 대하여 도난 화재 등 위험발생을 방지하는 업무를 말한다. (22.1차)","answer":true,"quote":"1. \"경비업\"이라 함은 다음 각목의 1에 해당하는 업무(이하 \"경비업무\"라 한다)의 전부 또는 일부를 도급받아 행하는 영업을 말한다. 가. 시설경비업무 : 경비를 필요로 하는 시설 및 장소(이하 \"경비대상시설\"이라 한다)에서의 도난·화재 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무 나. 호송경비업무 : 운반중에 있는 현금·유가증권·귀금속·상품 그 밖의 물건에 대하여 도난·화재 등 위험발생을 방지하는 업무 다. 신변보호업무 : 사람의 생명이나 신체에 대한 위해의 발생을 방지하고 그 신변을 보호하는 업무 라. 기계경비업무 : 경비대상시설에 설치한 기기에 의하여 감지·송신된 정보를 그 경비대상시설외의 장소에 설치한 관제시설의 기기로 수신하여 도난·화재 등 위험발생을 방지하는 업무 마. 특수경비업무 : 공항(항공기를 포함한다) 등 대통령령이 정하는 국가중요시설(이하 \"국가중요시설\"이라 한다)의 경비 및 도난·화재 그 밖의 위험발생을 방지하는 업무","cite":"경비업법 제2조","badge":"","topic":"","from":"GY-2022-1-P-21","seq":null},{"id":"P-OX-311","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘외국인테러전투원’이란 테러를 실행‧계획‧준비하거나 테러에 참가할 목적으로 국적국이 아닌 국가의 테러단체에 가입하거나 가입하기 위하여 이동 또는 이동을 시도하는 내국인‧외국인을 말한다. (25.1차)","answer":true,"quote":"4. \"외국인테러전투원\"이란 테러를 실행·계획·준비하거나 테러에 참가할 목적으로 국적국이 아닌 국가의 테러단체에 가입하거나 가입하기 위하여 이동 또는 이동을 시도하는 내국인·외국인을 말한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제2조","badge":"","topic":"","from":"GY-2025-1-P-36","seq":null},{"id":"P-OX-286","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘기계경비업무’란 경비대상시설에 설치한 기기에 의하여 감지 송신된 정보를 그 경비대상시설외의 장소에 설치한 관제시설의 기기로 수신하여 도난 화재 등 위험발생을 방지하는 업무를 말한다. (22.1차)","answer":true,"quote":"1. \"경비업\"이라 함은 다음 각목의 1에 해당하는 업무(이하 \"경비업무\"라 한다)의 전부 또는 일부를 도급받아 행하는 영업을 말한다. 가. 시설경비업무 : 경비를 필요로 하는 시설 및 장소(이하 \"경비대상시설\"이라 한다)에서의 도난·화재 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무 나. 호송경비업무 : 운반중에 있는 현금·유가증권·귀금속·상품 그 밖의 물건에 대하여 도난·화재 등 위험발생을 방지하는 업무 다. 신변보호업무 : 사람의 생명이나 신체에 대한 위해의 발생을 방지하고 그 신변을 보호하는 업무 라. 기계경비업무 : 경비대상시설에 설치한 기기에 의하여 감지·송신된 정보를 그 경비대상시설외의 장소에 설치한 관제시설의 기기로 수신하여 도난·화재 등 위험발생을 방지하는 업무 마. 특수경비업무 : 공항(항공기를 포함한다) 등 대통령령이 정하는 국가중요시설(이하 \"국가중요시설\"이라 한다)의 경비 및 도난·화재 그 밖의 위험발생을 방지하는 업무","cite":"경비업법 제2조","badge":"","topic":"","from":"GY-2022-1-P-21","seq":null},{"id":"P-OX-344","subject":"경찰학","unit":"경찰실무·각론","stmt":"확성기등 사용을 제한하는 규정 도입 취지에 따라 신고대상 집회･시위가 아닌 경우뿐만 아니라 1인 시위의 경우에도 소음 제한 규정을 동일하게 적용한다. (24.2차)","answer":false,"quote":"소음 제한은 신고 대상이 아닌 집회에도 적용되지만, 여러 사람을 요건으로 하는 시위가 아닌 1인 시위에는 적용되지 않는다.","cite":"집회 및 시위에 관한 법률 제2조 · 집회 및 시위에 관한 법률 제14조","badge":"","topic":"","from":"GY-2024-2-P-39","seq":null},{"id":"P-OX-327","subject":"경찰학","unit":"경찰실무·각론","stmt":"음주운전과 관련한 도로교통법 위반죄의 범죄수사를 위하여 미성년자인 피의자의 혈액채취가 필요한 경우에도 피의자에게 의사능력이 있다면 피의자 본인만이 혈액채취에 관한 유효한 동의를 할 수 있고, 피의자에게 의사능력이 없는 경우 명문의 규정이 없더라도 법정대리인이 피의자를 대리하여 동의할 수 있다. (22.1차)","answer":false,"quote":"따라서 음주운전과 관련한 도로교통법 위반죄의 범죄수사를 위하여 미성년자인 피의자의 혈액채취가 필요한 경우에도 피의자에게 의사능력이 있다면 피의자 본인만이 혈액채취에 관한 유효한 동의를 할 수 있고, 피의자에게 의사능력이 없는 경우에도 명문의 규정이 없는 이상 법정대리인이 피의자를 대리하여 동의할 수는 없다.","cite":"대법원 2013도1228","badge":"","topic":"","from":"GY-2022-1-P-25","seq":null},{"id":"P-OX-300","subject":"경찰학","unit":"경찰실무·각론","stmt":"음주측정 요구 당시 운전자가 술에 취한 상태에서 자동차를 운전하였다고 인정할 만한 상당한 이유가 있었으며, 음주운전 종료 후 별도의 음주 사실이 없었음이 증명된 경우, 경찰관이 음주 및 음주운전 종료로부터 약 5시간 후 집에서 자고 있는 피고인을 연행하여 음주측정을 요구한 데에 대하여 피고인이 불응하였다면, ｢도로교통법｣상의 음주측정불응죄가 성립한다. (23.1차)","answer":true,"quote":"도로교통법 제107조의2 제2호의 음주측정불응죄는 술에 취한 상태에 있다고 인정할 만한 상당한 이유가 있는 사람이 같은 법 제41조 제2항의 규정에 의한 경찰공무원의 측정에 응하지 아니한 경우에 성립하는 것인바, 같은 법 제41조 제2항의 규정에 비추어 보면 음주측정 요구 당시의 객관적 사정을 종합하여 볼 때 운전자가 술에 취한 상태에서 자동차 등을 운전하였다고 인정할 만한 상당한 이유가 있고 운전자의 음주운전 여부를 확인하기 위하여 필요한 경우에는 사후의 음주측정에 의하여 음주운전 여부를 확인할 수 없음이 명백하지 않는 한 경찰공무원은 당해 운전자에 대하여 음주측정을 요구할 수 있고, 당해 운전자가 이에 불응한 경우에는 같은 법 제107조의2 제2호 소정의 음주측정불응죄가 성립한다.","cite":"대법원 2000도6026","badge":"","topic":"","from":"GY-2023-1-P-39","seq":null},{"id":"P-OX-315","subject":"경찰학","unit":"경찰실무·각론","stmt":"운전면허 취소사유에 해당하는 음주운전을 적발한 경찰관의 소속 경찰서장이 사무착오로 위반자에게 운전면허정지처분을 한 상태에서 위반자의 주소지 관할 지방경찰청장이 위반자에게 운전면허취소처분을 한 것은 선행처분에 대한 당사자의 신뢰 및 법적 안정성을 저해하는 것으로서 허용될 수 없다. (25.2차)","answer":true,"quote":"운전면허 취소사유에 해당하는 음주운전을 적발한 경찰관의 소속 경찰서장이 사무착오로 위반자에게 운전면허정지처분을 한 상태에서 위반자의 주소지 관할 지방경찰청장이 위반자에게 운전면허취소처분을 한 것은 선행처분에 대한 당사자의 신뢰 및 법적 안정성을 저해하는 것으로서 허용될 수 없다고 한 사례.","cite":"대법원 99두10520","badge":"","topic":"","from":"GY-2025-2-P-17","seq":null},{"id":"P-OX-337","subject":"경찰학","unit":"경찰실무·각론","stmt":"테러로 인하여 신체･재산･명예의 피해를 입은 국민은 관계기관에 즉시 신고하여야 한다. 다만, 인질 등 부득이한 사유로 신고 할 수 없을 때에는 법률관계 또는 계약관계에 의하여 보호 의무가 있는 사람이 이를 알게 된 때에 즉시 신고하여야 한다. (23.2차)","answer":false,"quote":"① 테러로 인하여 신체 또는 재산의 피해를 입은 국민은 관계기관에 즉시 신고하여야 한다. 다만, 인질 등 부득이한 사유로 신고할 수 없을 때에는 법률관계 또는 계약관계에 의하여 보호의무가 있는 사람이 이를 알게 된 때에 즉시 신고하여야 한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제15조 제1항","badge":"","topic":"","from":"GY-2023-2-P-38","seq":null},{"id":"P-OX-332","subject":"경찰학","unit":"경찰실무·각론","stmt":"개인형 이동장치를 타고 신호위반, 중앙선 침범과 진로변경 금지 위반행위를 연달아 하여 다른 사람에게 위협 또는 위해를 가할 뿐 아니라 교통상의 위험을 발생하게 한 운전자에 대해 난폭운전으로 처벌할 수 있다. (22.2차)","answer":false,"quote":"난폭운전 금지는 개인형 이동장치 운전자에게는 적용되지 않으므로, 여러 위반을 연달아 해도 난폭운전으로 처벌할 수 없다.","cite":"도로교통법 제46조의3","badge":"","topic":"","from":"GY-2022-2-P-40","seq":null},{"id":"P-OX-302","subject":"경찰학","unit":"경찰실무·각론","stmt":"보안관찰처분을 받은 자는 이 법이 정하는 바에 따라 소정의 사항을 주거지 관할경찰서장에게 신고하고, 재범방지에 필요한 범위 안에서 그 지시에 따라 보안관찰을 받아야 한다. (23.1차)","answer":true,"quote":"② 보안관찰처분을 받은 자는 이 법이 정하는 바에 따라 소정의 사항을 주거지 관할경찰서장(이하 \"관할경찰서장\"이라 한다)에게 신고하고, 재범방지에 필요한 범위안에서 그 지시에 따라 보안관찰을 받아야 한다.","cite":"보안관찰법 제4조 제2항","badge":"","topic":"","from":"GY-2023-1-P-40","seq":null},{"id":"P-OX-341","subject":"경찰학","unit":"경찰실무·각론","stmt":"관할경찰관서장은 옥외집회 및 시위에 관한 신고서의 기재 사항에 미비한 점을 발견하면 접수증을 교부한 때부터 24시간 이내에 주최자에게 48시간을 기한으로 그 기재 사항을 보완할 것을 통고할 수 있다. (23.2차)","answer":false,"quote":"보완 통고는 접수증 교부 때부터 12시간 이내에, 24시간을 기한으로 한다 — 두 숫자가 모두 틀렸다.","cite":"집회 및 시위에 관한 법률 제7조","badge":"","topic":"","from":"GY-2023-2-P-39","seq":null},{"id":"P-OX-316","subject":"경찰학","unit":"경찰실무·각론","stmt":"지방자치단체가 ‘교통할아버지 봉사활동 계획’을 수립한 후 관할 동장으로 하여금 ‘교통할아버지’를 선정하게 하여 어린이 보호, 교통안내, 거리질서 확립 등의 공무를 위탁하여 집행하게 하던 중 ‘교통할아버지’로 선정된 노인이 위탁받은 업무 범위를 넘어 교차로 중앙에서 교통정리를 하다가 교통사고를 발생시킨 경우, 지방자치단체가 ｢국가배상법｣ 제2조 소정의 배상책임을 부담한다. (25.2차)","answer":true,"quote":"지방자치단체가 '교통할아버지 봉사활동 계획'을 수립한 후 관할 동장으로 하여금 '교통할아버지'를 선정하게 하여 어린이 보호, 교통안내, 거리질서 확립 등의 공무를 위탁하여 집행하게 하던 중 '교통할아버지'로 선정된 노인이 위탁받은 업무 범위를 넘어 교차로 중앙에서 교통정리를 하다가 교통사고를 발생시킨 경우, 지방자치단체가 국가배상법 제2조 소정의 배상책임을 부담한다고 인정한 원심의 판단을 수긍한 사례.","cite":"대법원 98다39060","badge":"","topic":"","from":"GY-2025-2-P-26","seq":null},{"id":"P-OX-289","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘테러단체’란 국제연합(UN)이 지정한 테러단체를 말한다. (22.1차)","answer":true,"quote":"2. \"테러단체\"란 국제연합(UN)이 지정한 테러단체를 말한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제2조","badge":"","topic":"","from":"GY-2022-1-P-24","seq":null},{"id":"P-OX-296","subject":"경찰학","unit":"경찰실무·각론","stmt":"질서유지선이 집회 및 시위의 보호와 공공의 질서유지를 위하여 필요하다고 인정되는 최소한의 범위를 정하여 설정되고 집회 및 시위에 관한 법률 시행령 관련 조항에서 정한 사유에 해당한다면, 집회 또는 시위가 이루어지는 장소 외곽의 경계 지역뿐 아니라 집회 또는 시위의 장소 안에도 설정할 수 있다. (22.2차)","answer":true,"quote":"위와 같은 질서유지선의 설정에 관한 집시법 및 집시법 시행령의 관련 규정에 비추어 볼 때, 집시법에서 정한 질서유지선은 집회 및 시위의 보호와 공공의 질서 유지를 위하여 필요하다고 인정되는 경우로서 집시법 시행령 제13조 제1항 에서 정한 사유에 해당한다면 반드시 집회 또는 시위가 이루어지는 장소 외곽의 경계지역뿐만 아니라 집회 또는 시위의 장소 안에도 설정할 수 있다고 봄이 타당하나, 이러한 경우에도 그 질서유지선은 집회 및 시위의 보호와 공공의 질서 유지를 위하여 필요하다고 인정되는 최소한의 범위를 정하여 설정되어야 하고, 질서유지선이 위 범위를 벗어나 설정되었다면 이는 집시법 제13조 제1항 에 위반되어 적법하다고 할 수 없다.","cite":"대법원 2016도21311","badge":"","topic":"","from":"GY-2022-2-P-39","seq":null},{"id":"P-OX-335","subject":"경찰학","unit":"경찰실무·각론","stmt":"甲이 혈중알코올농도 0.140%의 주취상태로 배기량 125cc 이륜 자동차를 운전하였다는 이유로 甲의 자동차운전면허[제1종 대형, 제1종보통, 제1종특수(대형견인･구난), 제2종소형]를취소한것은 甲이 음주상태에서 운전을 하지 않으면 안 되는 부득이한 사정이 없었더라도 재량권을 일탈･남용한 것이다. (23.2차)","answer":false,"quote":"甲이 혈중알코올농도 0.140%의 주취상태로 배기량 125cc 이륜자동차를 운전하였다는 이유로 관할 지방경찰청장이 甲의 자동차운전면허[제1종 대형, 제1종 보통, 제1종 특수(대형견인·구난), 제2종 소형]를 취소하는 처분을 한 사안에서, 甲에 대하여 제1종 대형, 제1종 보통, 제1종 특수(대형견인·구난) 운전면허를 취소하지 않는다면, 甲이 각 운전면허로 배기량 125cc 이하 이륜자동차를 계속 운전할 수 있어 실질적으로는 아무런 불이익을 받지 않게 되는 점, 甲의 혈중알코올농도는 0.140%로서 도로교통법령에서 정하고 있는 운전면허 취소처분 기준인 0.100%를 훨씬 초과하고 있고 甲에 대하여 특별히 감경해야 할 만한 사정을 찾아볼 수 없는 점, 甲이 음주상태에서 운전을 하지 않으면 안 되는 부득이한 사정이 있었다고 보이지 않는 점, 처분에 의하여 달성하려는 행정목적 등에 비추어 볼 때, 처분이 사회통념상 현저하게 타당성을 잃어 재량권을 남용하거나 한계를 일탈한 것이라고 단정하기에 충분하지 않음에도, 이와 달리 위 처분 중 제1종 대형, 제1종 보통, 제1종 특수(대형견인·구난) 운전면허를 취소한 부분에 재량권을 일탈·남용한 위법이 있다고 본 원심판단에 재량권 일탈·남용에 관한 법리 등을 오해한 위법이 있다고 한 사례.","cite":"대법원 2017두67476","badge":"","topic":"","from":"GY-2023-2-P-14","seq":null},{"id":"P-OX-325","subject":"경찰학","unit":"경찰실무·각론","stmt":"사법경찰관리는 진행 중인 스토킹행위에 대하여 신고를 받은 경우 즉시 현장에 나가 스토킹 행위의 제지, 스토킹행위자와 피해자 분리, 유치장 또는 구치소에의 유치 등의 조치를 할 수 있다. (22.1차)","answer":false,"quote":"응급조치는 제지·경고, 분리·범죄수사, 절차 안내, 상담소 인도로 모두 해야 하는 의무이고, 유치장·구치소 유치는 법원의 잠정조치다.","cite":"스토킹범죄의 처벌 등에 관한 법률 제3조 · 스토킹범죄의 처벌 등에 관한 법률 제9조","badge":"","topic":"","from":"GY-2022-1-P-23","seq":null},{"id":"P-OX-352","subject":"경찰학","unit":"경찰실무·각론","stmt":"재난관리 체계 중 재난피해 신고 및 조사, 응급조치, 특별재난 지역의 선포 등은 복구 단계에서의 활동이다. (26.1차)","answer":false,"quote":"응급조치는 대응 단계의 활동이고, 재난피해 신고·조사와 특별재난지역 선포는 복구 단계의 활동이다.","cite":"재난 및 안전관리 기본법 제37조 · 재난 및 안전관리 기본법 제58조 · 재난 및 안전관리 기본법 제60조","badge":"","topic":"","from":"GY-2026-1-P-38","seq":null},{"id":"P-OX-303","subject":"경찰학","unit":"경찰실무·각론","stmt":"물로 입 안을 헹굴 기회를 달라는 피고인의 요구를 무시한 채 호흡측정기로 측정한 혈중알코올 농도 수치가 0.05%로 나타난 사안에서, 피고인이 당시 혈중알코올 농도 0.05% 이상의 술에 취한 상태에서 운전하였다고 단정할 수 없다. (23.2차)","answer":true,"quote":"물로 입 안을 헹굴 기회를 달라는 피고인의 요구를 무시한 채 호흡측정기로 측정한 혈중알코올 농도 수치가 0.05%로 나타난 사안에서, 피고인이 당시 혈중알코올 농도 0.05% 이상의 술에 취한 상태에서 운전하였다고 단정할 수 없다고 한 사례.","cite":"대법원 2005도7034","badge":"","topic":"","from":"GY-2023-2-P-37","seq":null},{"id":"P-OX-314","subject":"경찰학","unit":"경찰실무·각론","stmt":"공직자등의 직무와 관련된 공식적인 행사에서 주최자가 참석자에게 통상적인 범위에서 일률적으로 제공하는 교통, 숙박, 음식물 등의 금품등은 이 법 제8조에서 규정하는 수수가 금지된 금품 등에 해당하지 않는다. (25.2차)","answer":true,"quote":"③ 제10조의 외부강의등에 관한 사례금 또는 다음 각 호의 어느 하나에 해당하는 금품등의 경우에는 제1항 또는 제2항에서 수수를 금지하는 금품등에 해당하지 아니한다. 1. 공공기관이 소속 공직자등이나 파견 공직자등에게 지급하거나 상급 공직자등이 위로·격려·포상 등의 목적으로 하급 공직자등에게 제공하는 금품등 2. 원활한 직무수행 또는 사교·의례 또는 부조의 목적으로 제공되는 음식물·경조사비·선물 등으로서 대통령령으로 정하는 가액 범위 안의 금품등 3. 사적 거래(증여는 제외한다)로 인한 채무의 이행 등 정당한 권원(權原)에 의하여 제공되는 금품등 4. 공직자등의 친족(「민법」 제777조에 따른 친족을 말한다)이 제공하는 금품등 5. 공직자등과 관련된 직원상조회·동호인회·동창회·향우회·친목회·종교단체·사회단체 등이 정하는 기준에 따라 구성원에게 제공하는 금품등 및 그 소속 구성원 등 공직자등과 특별히 장기적·지속적인 친분관계를 맺고 있는 자가 질병·재난 등으로 어려운 처지에 있는 공직자등에게 제공하는 금품등 6. 공직자등의 직무와 관련된 공식적인 행사에서 주최자가 참석자에게 통상적인 범위에서 일률적으로 제공하는 교통, 숙박, 음식물 등의 금품등 7. 불특정 다수인에게 배포하기 위한 기념품 또는 홍보용품 등이나 경연·추첨을 통하여 받는 보상 또는 상품 등 8. 그 밖에 다른 법령·기준 또는 사회상규에 따라 허용되는 금품등","cite":"부정청탁 및 금품등 수수의 금지에 관한 법률 제8조 제3항","badge":"","topic":"","from":"GY-2025-2-P-09","seq":null},{"id":"P-OX-304","subject":"경찰학","unit":"경찰실무·각론","stmt":"“정차”란 운전자가 5분을 초과하지 아니하고 차를 정지시키는 것으로서 주차 외의 정지 상태를 말한다. (23.2차)","answer":true,"quote":"25. \"정차\"란 운전자가 5분을 초과하지 아니하고 차를 정지시키는 것으로서 주차 외의 정지 상태를 말한다.","cite":"도로교통법 제2조","badge":"","topic":"","from":"GY-2023-2-P-37","seq":null},{"id":"P-OX-347","subject":"경찰학","unit":"경찰실무·각론","stmt":"개인형 이동장치의 운전자는 대통령령으로 정하는 승차정원을 초과하여 동승자를 태우고 개인형 이동장치를 운전하여서는 아니 된다. (25.1차)","answer":false,"quote":"개인형 이동장치의 승차정원은 대통령령이 아니라 행정안전부령으로 정하고, 이를 넘겨 태우고 운전할 수 없다.","cite":"도로교통법 제50조","badge":"","topic":"","from":"GY-2025-1-P-37","seq":null},{"id":"P-OX-328","subject":"경찰학","unit":"경찰실무·각론","stmt":"학교폭력 등 소년범죄, 가정폭력, 아동학대 범죄, 형법 제245조에 따른 공연음란 및 성폭력범죄의 처벌 등에 관한 특례법 제11조에 따른 공중밀집 장소에서의 추행행위에 관한 범죄는 자치경찰사무에 포함된다. (22.2차)","answer":false,"quote":"라. 다음의 어느 하나에 해당하는 수사사무 1) 학교폭력 등 소년범죄 2) 가정폭력, 아동학대 범죄 3) 교통사고 및 교통 관련 범죄 4) 「형법」 제245조에 따른 공연음란 및 「성폭력범죄의 처벌 등에 관한 특례법」 제12조에 따른 성적 목적을 위한 다중이용장소 침입행위에 관한 범죄 5) 경범죄 및 기초질서 관련 범죄 6) 가출인 및 「실종아동등의 보호 및 지원에 관한 법률」 제2조제2호에 따른 실종아동등 관련 수색 및 범죄 ② 제1항제2호가목부터 다목까지의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정하는 기준에 따라 시·도조례로 정한","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제4조","badge":"","topic":"","from":"GY-2022-2-P-02","seq":null},{"id":"P-OX-312","subject":"경찰학","unit":"경찰실무·각론","stmt":"관계기관의 장은 대통령령으로 정하는 국가중요시설과 많은 사람이 이용하는 시설 및 장비에 대한 테러예방대책과 테러의 수단으로 이용될 수 있는 폭발물‧총기류‧화생방물질, 국가 중요 행사에 대한 안전관리대책을 수립하여야 한다. (25.1차)","answer":true,"quote":"① 관계기관의 장은 대통령령으로 정하는 국가중요시설과 많은 사람이 이용하는 시설 및 장비(이하 \"테러대상시설\"이라 한다)에 대한 테러예방대책과 테러의 수단으로 이용될 수 있는 폭발물·총기류·화생방물질(이하 \"테러이용수단\"이라 한다), 국가 중요행사에 대한 안전관리대책을 수립하여야 한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제10조 제1항","badge":"","topic":"","from":"GY-2025-1-P-36","seq":null},{"id":"P-OX-324","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘신변보호업무’란 사람의 생명 신체 재산에 대한 위해의 발생을 방지하고 그 신변을 보호하는 업무를 말한다. (22.1차)","answer":false,"quote":"1. \"경비업\"이라 함은 다음 각목의 1에 해당하는 업무(이하 \"경비업무\"라 한다)의 전부 또는 일부를 도급받아 행하는 영업을 말한다. 가. 시설경비업무 : 경비를 필요로 하는 시설 및 장소(이하 \"경비대상시설\"이라 한다)에서의 도난·화재 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무 나. 호송경비업무 : 운반중에 있는 현금·유가증권·귀금속·상품 그 밖의 물건에 대하여 도난·화재 등 위험발생을 방지하는 업무 다. 신변보호업무 : 사람의 생명이나 신체에 대한 위해의 발생을 방지하고 그 신변을 보호하는 업무 라. 기계경비업무 : 경비대상시설에 설치한 기기에 의하여 감지·송신된 정보를 그 경비대상시설외의 장소에 설치한 관제시설의 기기로 수신하여 도난·화재 등 위험발생을 방지하는 업무 마. 특수경비업무 : 공항(항공기를 포함한다) 등 대통령령이 정하는 국가중요시설(이하 \"국가중요시설\"이라 한다)의 경비 및 도난·화재 그 밖의 위험발생을 방지하는 업무","cite":"경비업법 제2조","badge":"","topic":"","from":"GY-2022-1-P-21","seq":null},{"id":"P-OX-298","subject":"경찰학","unit":"경찰실무·각론","stmt":"대통령령으로 정하는 대규모 재난의 대응･복구 등에 관한 사항을 총괄･조정하고, 필요한 조치를 하기 위하여 행정안전부에 중앙재난안전대책본부를 둔다. (23.1차)","answer":true,"quote":"① 대통령령으로 정하는 대규모 재난(이하 \"대규모재난\"이라 한다)의 대응·복구(이하 \"수습\"이라 한다) 등에 관한 사항을 총괄·조정하고 필요한 조치를 하기 위하여 행정안전부에 중앙재난안전대책본부(이하 \"중앙대책본부\"라 한다)를 둔다. <개정","cite":"재난 및 안전관리 기본법 제14조 제1항","badge":"","topic":"","from":"GY-2023-1-P-38","seq":null},{"id":"P-OX-322","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘혼잡‧교통유도 경비업무’란 도로에 접속한 공사현장 및 사람과 차량의 통행에 위험이 있는 장소 또는 도로를 점유 하는 행사장 등에서 교통사고나 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무를 말한다. (26.1차)","answer":true,"quote":"혼잡·교통유도경비업무는 2024년 개정으로 더해진 여섯째 경비업무로, 공사현장·행사장 등에서 교통사고나 혼잡으로 인한 위험을 막는다.","cite":"경비업법 제2조","badge":"","topic":"","from":"GY-2026-1-P-35","seq":null},{"id":"P-OX-306","subject":"경찰학","unit":"경찰실무·각론","stmt":"13세 미만의 사람에 대하여 강간죄를 범한 경우에는 공소시효를 적용하지 않는다. (24.1차)","answer":true,"quote":"13세 미만 사람에 대한 강간 등에는 공소시효를 적용하지 않고, 다른 아동·청소년 성범죄는 피해자가 성년이 된 날부터 시효가 진행한다.","cite":"아동·청소년의 성보호에 관한 법률 제20조","badge":"","topic":"","from":"GY-2024-1-P-36","seq":null},{"id":"P-OX-326","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘테러위험인물’이란 테러를 실행 계획 준비하거나 테러에 참가할 목적으로 국적국이 아닌 국가의 테러단체에 가입하거나 가입 하기 위하여 이동 또는 이동을 시도하는 외국인을 말한다. (22.1차)","answer":false,"quote":"이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"테러\"란 국가·지방자치단체 또는 외국 정부(외국 지방자치단체와 조약 또는 그 밖의 국제적인 협약에 따라 설립된 국제기구를 포함한다)의 권한행사를 방해하거나 의무 없는 일을 하게 할 목적 또는 공중을 협박할 목적으로 하는 다음 각 목의 행위를 말한다. 가. 사람을 살해하거나 사람의 신체를 상해하여 생명에 대한 위험을 발생하게 하는 행위 또는 사람을 체포·감금·약취·유인하거나 인질로 삼는 행위 나. 항공기(「항공법」 제2조제1호의 항공기를 말한다. 이하 이 목에서 같다)와 관련된 다음 각각의 어느 하나에 해당하는 행위 1) 운항중(「항공보안법」 제2조제1호의 운항중을 말한다. 이하 이 목에서 같다)인 항공기를 추락시키거나 전복·파괴하는 행위, 그 밖에 운항중인 항공기의 안전을 해칠 만한 손괴를 가하는 행위 2) 폭행이나 협박, 그 밖의 방법으로 운항중인 항공기를 강탈하거나 항공기의 운항을 강제하는 행위 3) 항공기의 운항과 관련된 항공시설을 손괴하거나 조작을 방해하여 항공기의 안전운항에 위해를 가하는 행위 다. 선박(「선박 및 해상구조물에 대한 위해행위의 처벌 등에 관한 법률」 제2조제1호 본문의 선박을 말한다. 이하 이 목에서 같다) 또는 해상구조물(같은 법 제2조제5호의 해상구조물을 말한다. 이하 이 목에서 같다)과 관련된 다음 각각의 어느 하나에 해당하는 행위 1) 운항(같은 법 제2조제2호의 운항을 말한다. 이하 이 목에서 같다) 중인 선박 또는 해상구조물을 파괴하거나, 그 안전을 위태롭게 할 만한 정도의 손상을 가하는 행위(운항 중인 선박이나 해상구조물에 실려 있는 화물에 손상을 가하는 행위를 포함한다) 2) 폭행이나 협박, 그 밖의 방법으로 운항 중인 선박 또는 해상구조물을 강탈하거나 선박의 운항을 강제하는 행위 3) 운항 중인 선박의 안전을 위태롭게 하기 위하여 그 선박 운항과 관련된 기기·시설을 파괴하거나 중대한 손상을 가하거나 기능장애 상태를 야기하는 행위 라. 사망·중상해 또는 중대한 물적 손상을 유발하도록 제작되거나 그러한 위력을 가진 생화학·폭발성·소이성(燒夷性) 무기나 장치를 다음 각각의 어느 하나에 해당하는 차량 또는 시설에 배치하거나 폭발시키거나 그 밖의 방법으로 이를 사용하는 행위 1) 기차·전차·자동차 등 사람 또는 물건의 운송에 이용되는 차량으로서 공중이 이용하는 차량 2) 1)에 해당하는 차량의 운행을 위하여 이용되는 시설 또는 도로, 공원, 역, 그 밖에 공중이 이용하는 시설 3) 전기나 가스를 공급하기 위한 시설, 공중의 음용수를 공급하는 수도, 전기통신을 이용하기 위한 시설 및 그 밖의 시설로서 공용으로 제공되거나 공중이 이용하는 시설 4) 석유, 가연성 가스, 석탄, 그 밖의 연료 등의 원료가 되는 물질을 제조 또는 정제하거나 연료로 만들기 위하여 처리·수송 또는 저장하는 시설 5) 공중이 출입할 수 있는 건조물·항공기·선박으로서 1)부터 4)까지에 해당하는 것을 제외한 시설 마. 핵물질(「원자력시설 등의 방호 및 방사능 방재 대책법」 제2조제1호의 핵물질을 말한다. 이하 이 목에서 같다), 방사성물질(「원자력안전법」 제2조제5호의 방사성물질을 말한다. 이하 이 목에서 같다) 또는 원자력시설(「원자력시설 등의 방호 및 방사능 방재 대책법」 제2조제2호의 원자력시설을 말한다. 이하 이 목에서 같다)과 관련된 다음 각각의 어느 하나에 해당하는 행위 1) 원자로를 파괴하여 사람의 생명·신체 또는 재산을 해하거나 그 밖에 공공의 안전을 위태롭게 하는 행위 2) 방사성물질 등과 원자로 및 관계 시설, 핵연료주기시설 또는 방사선발생장치를 부당하게 조작하여 사람의 생명이나 신체에 위험을 가하는 행위 3) 핵물질을 수수·소지·소유·보관·사용·운반·개조·처분 또는 분산하는 행위 4) 핵물질이나 원자력시설을 파괴·손상 또는 그 원인을 제공하거나 원자력시설의 정상적인 운전을 방해하여 방사성물질을 배출하거나 방사선을 노출하는 행위 2. \"테러단체\"란 국제연합(UN)이 지정한 테러단체를 말한다. 3. \"테러위험인물\"이란 테러단체의 조직원이거나 테러단체 선전, 테러자금 모금·기부, 그 밖에 테러 예비·음모·선전·선동을 하였거나 하였다고 의심할 상당한 이유가 있는 사람을 말한다. 4. \"외국인테러전투원\"이란 테러를 실행·계획·준비하거나 테러에 참가할 목적으로 국적국이 아닌 국가의 테러단체에 가입하거나 가입하기 위하여 이동 또는 이동을 시도하는 내국인·외국인을 말한다. 5. \"테러자금\"이란 「공중 등 협박목적 및 대량살상무기확산을 위한 자금조달행위의 금지에 관한 법률」 제2조제1호에 따른 공중 등 협박목적을 위한 자금을 말한다. 6. \"대테러활동\"이란 제1호의 테러 관련 정보의 수집, 테러위험인물의 관리, 테러에 이용될 수 있는 위험물질 등 테러수단의 안전관리, 인원·시설·장비의 보호, 국제행사의 안전확보, 테러위협에의 대응 및 무력진압 등 테러 예방과 대응에 관한 제반 활동을 말한다. 7. \"관계기관\"이란 대테러활동을 수행하는 국가기관, 지방자치단체, 그 밖에 대통령령으로 정하는 기관을 말한다. 8. \"대테러조사\"란 대테러활동에 필요한 정보나 자료를 수집하기 위하여 현장조사·문서열람·시료채취 등을 하거나 조사대상자에게 자료제출 및 진술을 요구하는 활동을 말한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제2조","badge":"","topic":"","from":"GY-2022-1-P-24","seq":null},{"id":"P-OX-333","subject":"경찰학","unit":"경찰실무·각론","stmt":"경찰청장은 국가 및 지방자치단체가 행하는 재난 및 안전관리 업무를 총괄･조정한다. (23.1차)","answer":false,"quote":"행정안전부장관은 국가 및 지방자치단체가 행하는 재난 및 안전관리 업무를 총괄·조정한다. <개정 2017. 7. 26.> [본조신설 2014. 12. 30.]","cite":"재난 및 안전관리 기본법 제6조","badge":"","topic":"","from":"GY-2023-1-P-38","seq":null},{"id":"P-OX-334","subject":"경찰학","unit":"경찰실무·각론","stmt":"보안관찰처분의 기간은 3년으로 한다. (23.1차)","answer":false,"quote":"보안관찰처분의 기간은 2년이고, 검사가 청구하면 법무부장관이 위원회 의결을 거쳐 갱신할 수 있다.","cite":"보안관찰법 제5조","badge":"","topic":"","from":"GY-2023-1-P-40","seq":null},{"id":"P-OX-340","subject":"경찰학","unit":"경찰실무·각론","stmt":"“질서유지인”이란 관할 경찰서장이 집회 또는 시위의 질서를 유지하게 할 목적으로 임명한 자를 말한다. (23.2차)","answer":false,"quote":"이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"옥외집회\"란 천장이 없거나 사방이 폐쇄되지 아니한 장소에서 여는 집회를 말한다. 2. \"시위\"란 여러 사람이 공동의 목적을 가지고 도로, 광장, 공원 등 일반인이 자유로이 통행할 수 있는 장소를 행진하거나 위력(威力) 또는 기세(氣勢)를 보여, 불특정한 여러 사람의 의견에 영향을 주거나 제압(制壓)을 가하는 행위를 말한다. 3. \"주최자(主催者)\"란 자기 이름으로 자기 책임 아래 집회나 시위를 여는 사람이나 단체를 말한다. 주최자는 주관자(主管者)를 따로 두어 집회 또는 시위의 실행을 맡아 관리하도록 위임할 수 있다. 이 경우 주관자는 그 위임의 범위 안에서 주최자로 본다. 4. \"질서유지인\"이란 주최자가 자신을 보좌하여 집회 또는 시위의 질서를 유지하게 할 목적으로 임명한 자를 말한다. 5. \"질서유지선\"이란 관할 경찰서장이나 지방경찰청장이 적법한 집회 및 시위를 보호하고 질서유지나 원활한 교통 소통을 위하여 집회 또는 시위의 장소나 행진 구간을 일정하게 구획하여 설정한 띠, 방책(防柵), 차선(車線) 등의 경계 표지(標識)를 말한다. 6. \"경찰관서\"란 국가경찰관서를 말한다.","cite":"집회 및 시위에 관한 법률 제2조","badge":"","topic":"","from":"GY-2023-2-P-39","seq":null},{"id":"P-OX-351","subject":"경찰학","unit":"경찰실무·각론","stmt":"재난 및 안전관리에 관한 중요 정책과 관련된 사항 등을 심의하기 위하여 행정안전부장관 소속으로 중앙안전관리위원회를 둔다. (26.1차)","answer":false,"quote":"① 재난 및 안전관리에 관한 다음 각 호의 사항을 심의하기 위하여 국무총리 소속으로 중앙안전관리위원회(이하 \"중앙위원회\"라 한다)를 둔다. <개정 2013. 8. 6., 2014. 12. 30., 2016. 1. 7.> 1. 재난 및 안전관리에 관한 중요 정책에 관한 사항 2. 제22조에 따른 국가안전관리기본계획에 관한 사항 2의2. 제10조의2에 따른 재난 및 안전관리 사업 관련 중기사업계획서, 투자우선순위 의견 및 예산요구서에 관한 사항 3. 중앙행정기관의 장이 수립·시행하는 계획, 점검·검사, 교육·훈련, 평가 등 재난 및 안전관리업무의 조정에 관한 사항 3의2. 안전기준관리에 관한 사항 4. 제36조에 따른 재난사태의 선포에 관한 사항 5. 제60조에 따른 특별재난지역의 선포에 관한 사항 6. 재난이나 그 밖의 각종 사고가 발생하거나 발생할 우려가 있는 경우 이를 수습하기 위한 관계 기관 간 협력에 관한 중요 사항 7. 중앙행정기관의 장이 시행하는 대통령령으로 정하는 재난 및 사고의 예방사업 추진에 관한 사항 8. 그 밖에 위원장이 회의에 부치는 사항","cite":"재난 및 안전관리 기본법 제9조 제1항","badge":"","topic":"","from":"GY-2026-1-P-38","seq":null},{"id":"P-OX-350","subject":"경찰학","unit":"경찰실무·각론","stmt":"제3조 제4호에서는 재난이나 그 밖의 각종 사고로부터 사람의 생명 및 신체의 안전을 확보하기 위하여 하는 모든 활동을 ‘안전 관리’로 정의하고 있다. (26.1차)","answer":false,"quote":"다. 4. \"안전관리\"란 재난이나 그 밖의 각종 사고로부터 사람의 생명·신체 및 재산의 안전을 확보하기 위하여 하는 모든 활동을 말한","cite":"재난 및 안전관리 기본법 제3조","badge":"","topic":"","from":"GY-2026-1-P-38","seq":null},{"id":"P-OX-336","subject":"경찰학","unit":"경찰실무·각론","stmt":"모든 차의 운전자는 예외 없이 터널 안에 차를 주차해서는 아니 된다. (23.2차)","answer":false,"quote":"모든 차의 운전자는 다음 각 호의 어느 하나에 해당하는 곳에 차를 주차하여서는 아니 된다. 1. 터널 안 및 다리 위 2. 화재경보기로부터 3미터 이내인 곳 3. 다음 각 목의 곳으로부터 5미터 이내인 곳 가. 소방용 기계·기구가 설치된 곳 나. 소방용 방화(防火) 물통 다. 소화전(消火栓) 또는 소화용 방화 물통의 흡수구나 흡수관(吸 水管)을 넣는 구멍 라. 도로공사를 하고 있는 경우에는 그 공사 구역의 양쪽 가장자리 4. 지방경찰청장이 도로에서의 위험을 방지하고 교통의 안전과 원활한 소통을 확보하기 위하여 필요하다고 인정하여 지정한 곳 [전문개정 2011.6.8]","cite":"도로교통법 제33조","badge":"","topic":"","from":"GY-2023-2-P-37","seq":null},{"id":"P-OX-353","subject":"경찰학","unit":"경찰실무·각론","stmt":"｢도로교통법｣ 제80조의2(음주운전 방지장치 부착 조건부 운전면허)는 개인형 이동장치를 포함한 자동차등 또는 노면전차를 운전한 경우에 적용되는 규정이다. (26.1차)","answer":false,"quote":"조건부 면허는 5년 안에 음주운전을 되풀이해 면허가 취소된 사람이 대상이고, 이때 음주운전은 자동차등·노면전차로 한정되며 개인형 이동장치는 빠진다.","cite":"도로교통법 제80조의2","badge":"","topic":"","from":"GY-2026-1-P-39","seq":null},{"id":"P-OX-295","subject":"경찰학","unit":"경찰실무·각론","stmt":"위험물의 폭발로 인해 매우 긴급한 경우에 위해를 입을 우려가 있는 사람을 억류하거나 피난시키는 것 (22.2차)","answer":true,"quote":"① 경찰관은 사람의 생명 또는 신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 천재(天災), 사변(事變), 인공구조물의 파손이나 붕괴, 교통사고, 위험물의 폭발, 위험한 동물 등의 출현, 극도의 혼잡, 그 밖의 위험한 사태가 있을 때에는 다음 각 호의 조치를 할 수 있다. 1. 그 장소에 모인 사람, 사물(事物)의 관리자, 그 밖의 관계인에게 필요한 경고를 하는 것 2. 매우 긴급한 경우에는 위해를 입을 우려가 있는 사람을 필요한 한도에서 억류하거나 피난시키는 것 3. 그 장소에 있는 사람, 사물의 관리자, 그 밖의 관계인에게 위해를 방지하기 위하여 필요하다고 인정되는 조치를 하게 하거나 직접 그 조치를 하는 것","cite":"경찰관 직무집행법 제5조 제1항","badge":"","topic":"","from":"GY-2022-2-P-20","seq":null},{"id":"P-OX-308","subject":"경찰학","unit":"경찰실무·각론","stmt":"연령미달의 결격자인 피고인이 소외인의 이름으로 운전면허시험에 응시, 합격하여 교부받은 운전면허는 취소되지 않는 한 유효 하므로 피고인의 운전행위는 무면허운전에 해당하지 아니한다. (25.1차)","answer":true,"quote":"연령미달의 결격자인 피고인이 소외인의 이름으로 운전면허시험에 응시, 합격하여 교부받은 운전면허는 당연무효가 아니고","cite":"대법원 80도2646","badge":"","topic":"","from":"GY-2025-1-P-20","seq":null},{"id":"P-OX-330","subject":"경찰학","unit":"경찰실무·각론","stmt":"사법경찰관리가 신분비공개수사를 진행하고자 할 때에는 사전에 상급 경찰관서 수사부서의 장의 승인을 받아야 한다. 이 경우 그 수사기간은 1개월을 초과할 수 없다. (22.2차)","answer":false,"quote":"신분비공개수사는 상급 경찰관서 수사부서의 장의 사전 승인을 받아야 하고, 수사기간은 1개월이 아니라 3개월을 넘을 수 없다.","cite":"아동·청소년의 성보호에 관한 법률 제25조의3","badge":"","topic":"","from":"GY-2022-2-P-35","seq":null},{"id":"P-OX-345","subject":"경찰학","unit":"경찰실무·각론","stmt":"국회의 경호업무는 국회의장의 지휘를 받아 수행하되, 경위는 회의장 건물 밖에서, 경찰공무원은 회의장 건물 안에서 경호한다. (25.1차)","answer":false,"quote":"③ 경호업무는 의장의 지휘를 받아 수행하되, 경위는 회의장 건물 안에서, 국가경찰공무원은 회의장 건물 밖에서 경호한다. [전문개정 2018. 4. 17.]","cite":"국회법 제144조 제3항","badge":"","topic":"","from":"GY-2025-1-P-04","seq":null},{"id":"P-OX-331","subject":"경찰학","unit":"경찰실무·각론","stmt":"경찰관서의 장은 실종아동등의 발생 신고를 접수하면 24시간 이내에 수색 또는 수사의 실시여부를 결정하여야 한다. (22.2차)","answer":false,"quote":"실종아동등 발생 신고를 받으면 경찰관서의 장은 24시간 안이 아니라 지체 없이 수색·수사 실시 여부를 정해야 한다.","cite":"실종아동등의 보호 및 지원에 관한 법률 제9조","badge":"","topic":"","from":"GY-2022-2-P-36","seq":null},{"id":"P-OX-339","subject":"경찰학","unit":"경찰실무·각론","stmt":"｢국민보호와 공공안전을 위한 테러방지법｣에서 말하는 “테러 단체”란 국제형사경찰기구(ICPO)가 지정한 테러단체를 말한다. (23.2차)","answer":false,"quote":"테러단체는 국제형사경찰기구(ICPO)가 아니라 국제연합(UN)이 지정한 테러단체를 말한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제2조","badge":"","topic":"","from":"GY-2023-2-P-38","seq":null},{"id":"P-OX-329","subject":"경찰학","unit":"경찰실무·각론","stmt":"법원은 스토킹범죄의 원활한 조사 심리 또는 피해자 보호를 위하여 잠정조치가 필요하다고 인정하는 경우에는 결정으로 스토킹행위자를 경찰관서의 유치장 또는 구치소에 1개월을 초과하지 않는 범위에서 유치할 수 있다. 다만 법원은 피해자의 보호를 위하여 그 기간을 연장할 필요가 있다고 인정하는 경우에는 결정으로 2개월의 범위에서 연장할 수 있다. (22.2차)","answer":false,"quote":"유치장·구치소 유치는 1개월을 넘을 수 없고 연장도 안 되며, 2개월씩 두 차례 연장할 수 있는 것은 접근금지 잠정조치다.","cite":"스토킹범죄의 처벌 등에 관한 법률 제9조","badge":"","topic":"","from":"GY-2022-2-P-34","seq":null},{"id":"P-OX-294","subject":"경찰학","unit":"경찰실무·각론","stmt":"생활안전을 위한 순찰 및 시설의 운영, 주민참여 방범활동의 지원 및 지도, 주민의 일상생활과 관련된 사회질서의 유지 및 그 위반행위의 지도 단속 등 지역 내 주민의 생활안전 활동에 관한 사무는 자치경찰의 사무에 포함된다. (22.2차)","answer":true,"quote":"① 경찰의 사무는 다음 각 호와 같이 구분한다. 1. 국가경찰사무: 제3조에서 정한 경찰의 임무를 수행하기 위한 사무. 다만, 제2호의 자치경찰사무는 제외한다. 2. 자치경찰사무: 제3조에서 정한 경찰의 임무 범위에서 관할 지역의 생활안전·교통·경비·수사 등에 관한 다음 각 목의 사무 가. 지역 내 주민의 생활안전 활동에 관한 사무 1) 생활안전을 위한 순찰 및 시설의 운영 2) 주민참여 방범활동의 지원 및 지도 3) 안전사고 및 재해·재난 시 긴급구조지원 4) 아동·청소년·노인·여성·장애인 등 사회적 보호가 필요한 사람에 대한 보호 업무 및 가정폭력·학교폭력·성폭력 등의 예방 5) 주민의 일상생활과 관련된 사회질서의 유지 및 그 위반행위의 지도·단속. 다만, 지방자치단체 등 다른 행정청의 사무는 제외한다. 6) 그 밖에 지역주민의 생활안전에 관한 사무 나. 지역 내 교통활동에 관한 사무 1) 교통법규 위반에 대한 지도·단속 2) 교통안전시설 및 무인 교통단속용 장비의 심의·설치·관리 3) 교통안전에 대한 교육 및 홍보 4) 주민참여 지역 교통활동의 지원 및 지도 5) 통행 허가, 어린이 통학버스의 신고, 긴급자동차의 지정 신청 등 각종 허가 및 신고에 관한 사무 6) 그 밖에 지역 내의 교통안전 및 소통에 관한 사무 다. 지역 내 다중운집 행사 관련 혼잡 교통 및 안전 관리 라. 다음의 어느 하나에 해당하는 수사사무 1) 학교폭력 등 소년범죄 2) 가정폭력, 아동학대 범죄 3) 교통사고 및 교통 관련 범죄 4) 「형법」 제245조에 따른 공연음란 및 「성폭력범죄의 처벌 등에 관한 특례법」 제12조에 따른 성적 목적을 위한 다중이용장소 침입행위에 관한 범죄 5) 경범죄 및 기초질서 관련 범죄 6) 가출인 및 「실종아동등의 보호 및 지원에 관한 법률」 제2조제2호에 따른 실종아동등 관련 수색 및 범죄","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제4조 제1항","badge":"","topic":"","from":"GY-2022-2-P-02","seq":null},{"id":"P-OX-318","subject":"경찰학","unit":"경찰실무·각론","stmt":"“아동학대행위자”란 아동학대범죄를 범한 사람 및 그 공범을 말하고, “피해아동”이란 아동학대범죄로 인하여 직접적으로 피해를 입은 아동을 말한다. (25.2차)","answer":true,"quote":"이 법에서 사용하는 용어의 뜻은 다음과 같다. 1. \"아동\"이란 「아동복지법」 제3조제1호에 따른 아동을 말한다. 2. \"보호자\"란 「아동복지법」 제3조제3호에 따른 보호자를 말한다. 3. \"아동학대\"란 「아동복지법」 제3조제7호에 따른 아동학대를 말한다. 4. \"아동학대범죄\"란 보호자에 의한 아동학대로서 다음 각 목의 어느 하나에 해당하는 죄를 말한다. 가. 「형법」 제2편제25장 상해와 폭행의 죄 중 제257조(상해)제1항·제3항, 제260조(폭행)제1항, 제261조(특수폭행) 및 제262조(폭행치사상)(상해에 이르게 한 때에만 해당한다)의 죄 나. 「형법」 제2편제28장 유기와 학대의 죄 중 제271조(유기)제1항, 제272조(영아유기), 제273조(학대)제1항, 제274조(아동혹사) 및 제275조(유기등 치사상)(상해에 이르게 한 때에만 해당한다)의 죄 다. 「형법」 제2편제29장 체포와 감금의 죄 중 제276조(체포, 감금)제1항, 제277조(중체포, 중감금)제1항, 제278조(특수체포, 특수감금), 제280조(미수범) 및 제281조(체포·감금등의 치사상)(상해에 이르게 한 때에만 해당한다)의 죄 라. 「형법」 제2편제30장 협박의 죄 중 제283조(협박)제1항, 제284조(특수협박) 및 제286조(미수범)의 죄 마. 「형법」 제2편제31장 약취, 유인 및 인신매매의 죄 중 제287조(미성년자 약취, 유인), 제288조(추행 등 목적 약취, 유인 등), 제289조(인신매매) 및 제290조(약취, 유인, 매매, 이송 등 상해·치상)의 죄 바. 「형법」 제2편제32장 강간과 추행의 죄 중 제297조(강간), 제297조의2(유사강간), 제298조(강제추행), 제299조(준강간, 준강제추행), 제300조(미수범), 제301조(강간등 상해·치상), 제301조의2(강간등 살인·치사), 제302조(미성년자등에 대한 간음), 제303조(업무상위력 등에 의한 간음) 및 제305조(미성년자에 대한 간음, 추행)의 죄 사. 「형법」 제2편제33장 명예에 관한 죄 중 제307조(명예훼손), 제309조(출판물등에 의한 명예훼손) 및 제311조(모욕)의 죄 아. 「형법」 제2편제36장 주거침입의 죄 중 제321조(주거·신체 수색)의 죄 자. 「형법」 제2편제37장 권리행사를 방해하는 죄 중 제324조(강요) 및 제324조의5(미수범)(제324조의 죄에만 해당한다)의 죄 차. 「형법」 제2편제39장 사기와 공갈의 죄 중 제350조(공갈) 및 제352조(미수범)(제350조의 죄에만 해당한다)의 죄 카. 「형법」 제2편제42장 손괴의 죄 중 제366조(재물손괴등)의 죄 타. 「아동복지법」 제71조제1항 각 호의 죄(제3호의 죄는 제외한다) 파. 가목부터 타목까지의 죄로서 다른 법률에 따라 가중처벌되는 죄 하. 제4조(아동학대치사), 제5조(아동학대중상해) 및 제6조(상습범)의 죄 5. \"아동학대행위자\"란 아동학대범죄를 범한 사람 및 그 공범을 말한다. 6. \"피해아동\"이란 아동학대범죄로 인하여 직접적으로 피해를 입은 아동을 말한다. 7. \"아동보호사건\"이란 아동학대범죄로 인하여 제36조제1항에 따른 보호처분(이하 \"보호처분\"이라 한다)의 대상이 되는 사건을 말한다. 8. \"피해아동보호명령사건\"이란 아동학대범죄로 인하여 제47조에 따른 피해아동보호명령의 대상이 되는 사건을 말한다. 9. \"아동복지전담기관\"이란 「아동복지법」 제45조에 따른 아동보호전문기관(이하 \"아동보호전문기관\"이라 한다)과 「아동복지법」 제48조에 따른 가정위탁지원센터(이하 \"가정위탁지원센터\"라 한다)를 말한다. 10. \"아동복지시설\"이란 「아동복지법」 제50조에 따라 설치된 시설을 말한다. 11. \"아동복지시설의 종사자\"란 아동복지시설에서 아동의 상담·지도·치료·양육, 그 밖에 아동의 복지에 관한 업무를 담당하는 사람을 말한다.","cite":"아동학대범죄의 처벌 등에 관한 특례법 제2조","badge":"","topic":"","from":"GY-2025-2-P-36","seq":null},{"id":"P-OX-310","subject":"경찰학","unit":"경찰실무·각론","stmt":"경찰청장은 실종아동등의 조속한 발견과 복귀를 위하여 아동 등의 보호자가 신청하는 경우 아동등의 지문 및 얼굴 등에 관한 정보를 ｢실종아동등의 보호 및 지원에 관한 법률｣ 제8조의2에 따른 정보시스템에 등록하고 아동등의 보호자에게 사전신고증을 발급할 수 있다. (25.1차)","answer":true,"quote":"보호자가 신청하면 경찰청장은 지문·얼굴 정보를 등록하고 사전신고증을 발급할 수 있으며, 서면 신청서는 등록 후 지체 없이 파기한다.","cite":"실종아동등의 보호 및 지원에 관한 법률 제7조의2","badge":"","topic":"","from":"GY-2025-1-P-35","seq":null},{"id":"P-OX-313","subject":"경찰학","unit":"경찰실무·각론","stmt":"누구든지 술에 취한 상태에서 자동차등(｢건설기계관리법｣ 제26조 제1항 단서에 따른 건설기계 외의 건설기계를 포함), 노면전차 또는 자전거를 운전하여서는 아니 된다. (25.1차)","answer":true,"quote":"① 누구든지 술에 취한 상태에서 자동차등(「건설기계관리법」 제26조제1항 단서에 따른 건설기계 외의 건설기계를 포함한다. 이하 이 조, 제45조, 제47조, 제93조제1항제1호부터 제4호까지 및 제148조의2에서 같다)을 운전하여서는 아니 된다.","cite":"도로교통법 제44조 제1항","badge":"","topic":"","from":"GY-2025-1-P-37","seq":null},{"id":"P-OX-317","subject":"경찰학","unit":"경찰실무·각론","stmt":"지방자치단체장이 설치하여 관할 지방경찰청장에게 관리권한이 위임된 교통신호기의 고장으로 인하여 교통사고가 발생한 경우, 지방자치단체뿐만 아니라 경찰관들의 봉급을 부담하는 국가도 손해배상책임이 인정된다. (25.2차)","answer":true,"quote":"지방자치단체장이 설치하여 관할 지방경찰청장에게 관리권한이 위임된 교통신호기의 고장으로 인하여 교통사고가 발생한 경우, 지방자치단체뿐만 아니라 국가도 손해배상책임을 지는지 여부 (적극)","cite":"대법원 99다11120","badge":"","topic":"","from":"GY-2025-2-P-26","seq":null},{"id":"P-OX-342","subject":"경찰학","unit":"경찰실무·각론","stmt":"아동･청소년의 성을 사는 행위를 한 자에 대한 미수범 처벌 규정이 있다. (24.1차)","answer":false,"quote":"성을 사는 행위에는 미수범 처벌규정이 없고, 미수를 벌하는 것은 성착취물 제작, 아동·청소년 매매, 강간 등이다.","cite":"아동·청소년의 성보호에 관한 법률 제13조 · 아동·청소년의 성보호에 관한 법률 제11조","badge":"","topic":"","from":"GY-2024-1-P-36","seq":null},{"id":"P-OX-323","subject":"경찰학","unit":"경찰실무·각론","stmt":"행정안전부장관은 국가 및 지방자치단체가 행하는 재난 및 안전관리 업무를 총괄‧조정한다. (26.1차)","answer":true,"quote":"행정안전부장관은 국가 및 지방자치단체가 행하는 재난 및 안전관리 업무를 총괄·조정한다. <개정 2017. 7. 26.> [본조신설 2014. 12. 30.]","cite":"재난 및 안전관리 기본법 제6조","badge":"","topic":"","from":"GY-2026-1-P-38","seq":null},{"id":"P-OX-299","subject":"경찰학","unit":"경찰실무·각론","stmt":"“재난”이란 국민의 생명･신체･재산과 국가에 피해를 주거나 줄 수 있는 것으로서 사회재난과 자연재난으로 구분한다. (23.1차)","answer":true,"quote":"다. <개정 2009. 12. 29., 2011. 3. 29., 2012. 2. 22., 2013. 3. 23., 2013. 8. 6., 2014. 11. 19., 2014. 12. 30., 2015. 7. 24., 2016. 1. 7., 2017. 1. 17., 2017. 7. 26., 2018. 9. 18., 2019. 3. 26.> 1. \"재난\"이란 국민의 생명·신체·재산과 국가에 피해를 주거나 줄 수 있는 것으로서 다음 각 목의 것을 말한","cite":"재난 및 안전관리 기본법 제3조","badge":"","topic":"","from":"GY-2023-1-P-38","seq":null},{"id":"P-OX-293","subject":"경찰학","unit":"경찰실무·각론","stmt":"교통법규 위반에 대한 지도 단속, 교통안전시설 및 무인 교통 단속용 장비의 심의 설치 관리 등 지역 내 교통활동에 관한 사무는 자치경찰사무에 포함된다. (22.2차)","answer":true,"quote":"2. 자치경찰사무: 제3조에서 정한 경찰의 임무 범위에서 관할 지역의 생활안전·교통·경비·수사 등에 관한 다음 각 목의 사무 가. 지역 내 주민의 생활안전 활동에 관한 사무 1) 생활안전을 위한 순찰 및 시설의 운영 2) 주민참여 방범활동의 지원 및 지도 3) 안전사고 및 재해·재난 시 긴급구조지원 4) 아동·청소년·노인·여성·장애인 등 사회적 보호가 필요한 사람에 대한 보호 업무 및 가정폭력·학교폭력·성폭력 등의 예방 5) 주민의 일상생활과 관련된 사회질서의 유지 및 그 위반행위의 지도·단속. 다만, 지방자치단체 등 다른 행정청의 사무는 제외한다. 6) 그 밖에 지역주민의 생활안전에 관한 사무 나. 지역 내 교통활동에 관한 사무 1) 교통법규 위반에 대한 지도·단속 2) 교통안전시설 및 무인 교통단속용 장비의 심의·설치·관리 3) 교통안전에 대한 교육 및 홍보 4) 주민참여 지역 교통활동의 지원 및 지도 5) 통행 허가, 어린이 통학버스의 신고, 긴급자동차의 지정 신청 등 각종 허가 및 신고에 관한 사무 6) 그 밖에 지역 내의 교통안전 및 소통에 관한 사무 다. 지역 내 다중운집 행사 관련 혼잡 교통 및 안전 관리 라. 다음의 어느 하나에 해당하는 수사사무 1) 학교폭력 등 소년범죄 2) 가정폭력, 아동학대 범죄 3) 교통사고 및 교통 관련 범죄 4) 「형법」 제245조에 따른 공연음란 및 「성폭력범죄의 처벌 등에 관한 특례법」 제12조에 따른 성적 목적을 위한 다중이용장소 침입행위에 관한 범죄 5) 경범죄 및 기초질서 관련 범죄 6) 가출인 및 「실종아동등의 보호 및 지원에 관한 법률」 제2조제2호에 따른 실종아동등 관련 수색 및 범죄 ② 제1항제2호가목부터 다목까지의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정하는 기준에 따라 시·도조례로 정한다. ③ 제1항제2호라목의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제4조","badge":"","topic":"","from":"GY-2022-2-P-02","seq":null},{"id":"P-OX-319","subject":"경찰학","unit":"경찰실무·각론","stmt":"“아동학대행위자를 피해아동등으로부터 격리”하는 응급조치는 72시간을 넘을 수 없다. 다만, 본문의 기간에 공휴일이나 토요일이 포함되는 경우로서 피해아동등의 보호를 위하여 필요하다고 인정되는 경우에는 48시간의 범위에서 그 기간을 연장할 수 있다. (25.2차)","answer":true,"quote":"행위자 격리 같은 응급조치는 72시간을 넘을 수 없고, 그 기간에 공휴일·토요일이 끼면 48시간 범위에서 연장할 수 있다.","cite":"아동학대범죄의 처벌 등에 관한 특례법 제12조","badge":"","topic":"","from":"GY-2025-2-P-36","seq":null},{"id":"P-OX-290","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘대테러활동’이란 제1호의 테러 관련 정보의 수집, 테러위험 인물의 관리, 테러에 이용될 수 있는 위험물질 등 테러수단의 안전관리, 인원 시설 장비의 보호, 국제행사의 안전확보, 테러 위협에의 대응 및 무력진압 등 테러 예방과 대응에 관한 제반 활동을 말한다. (22.1차)","answer":true,"quote":"6. \"대테러활동\"이란 제1호의 테러 관련 정보의 수집, 테러위험인물의 관리, 테러에 이용될 수 있는 위험물질 등 테러수단의 안전관리, 인원·시설·장비의 보호, 국제행사의 안전확보, 테러위협에의 대응 및 무력진압 등 테러 예방과 대응에 관한 제반 활동을 말한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제2조","badge":"","topic":"","from":"GY-2022-1-P-24","seq":null},{"id":"P-OX-291","subject":"경찰학","unit":"경찰실무·각론","stmt":"‘대테러조사’란 대테러활동에 필요한 정보나 자료를 수집하기 위하여 현장조사 문서열람 시료채취 등을 하거나 조사대상자 에게 자료제출 및 진술을 요구하는 활동을 말한다. (22.1차)","answer":true,"quote":"8. \"대테러조사\"란 대테러활동에 필요한 정보나 자료를 수집하기 위하여 현장조사·문서열람·시료채취 등을 하거나 조사대상자에게 자료제출 및 진술을 요구하는 활동을 말한다.","cite":"국민보호와 공공안전을 위한 테러방지법 제2조","badge":"","topic":"","from":"GY-2022-1-P-24","seq":null},{"id":"P-OX-346","subject":"경찰학","unit":"경찰실무·각론","stmt":"대테러활동과 관련하여 장단기 국가대테러활동 지침 작성·배포 등을 수행하기 위하여 국무총리 소속으로 관계기관 공무원 및 민간위원으로 구성되는 대테러센터를 둔다. (25.1차)","answer":false,"quote":"① 대테러활동과 관련하여 다음 각 호의 사항을 수행하기 위하여 국무총리 소속으로 관계기관 공무원으로 구성되는 대테러센터를 둔다. 1. 국가 대테러활동 관련 임무분담 및 협조사항 실무 조정 2. 장단기 국가대테러활동 지침 작성·배포 3. 테러경보 발령 4. 국가 중요행사 대테러안전대책 수립 5. 대책위원회의 회의 및 운영에 필요한 사무의 처리 6. 그 밖에 대책위원회에서 심의·의결한 사항","cite":"국민보호와 공공안전을 위한 테러방지법 제6조 제1항","badge":"","topic":"","from":"GY-2025-1-P-36","seq":null},{"id":"P-OX-292","subject":"경찰학","unit":"경찰실무·각론","stmt":"지역 내 주민의 생활안전 활동에 관한 사무, 지역 내 교통활동에 관한 사무, 지역 내 다중운집 행사 관련 혼잡 교통 및 안전 관리의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정하는 기준에 따라 시 도조례로 정한다. (22.2차)","answer":true,"quote":"2. 자치경찰사무: 제3조에서 정한 경찰의 임무 범위에서 관할 지역의 생활안전·교통·경비·수사 등에 관한 다음 각 목의 사무 가. 지역 내 주민의 생활안전 활동에 관한 사무 1) 생활안전을 위한 순찰 및 시설의 운영 2) 주민참여 방범활동의 지원 및 지도 3) 안전사고 및 재해·재난 시 긴급구조지원 4) 아동·청소년·노인·여성·장애인 등 사회적 보호가 필요한 사람에 대한 보호 업무 및 가정폭력·학교폭력·성폭력 등의 예방 5) 주민의 일상생활과 관련된 사회질서의 유지 및 그 위반행위의 지도·단속. 다만, 지방자치단체 등 다른 행정청의 사무는 제외한다. 6) 그 밖에 지역주민의 생활안전에 관한 사무 나. 지역 내 교통활동에 관한 사무 1) 교통법규 위반에 대한 지도·단속 2) 교통안전시설 및 무인 교통단속용 장비의 심의·설치·관리 3) 교통안전에 대한 교육 및 홍보 4) 주민참여 지역 교통활동의 지원 및 지도 5) 통행 허가, 어린이 통학버스의 신고, 긴급자동차의 지정 신청 등 각종 허가 및 신고에 관한 사무 6) 그 밖에 지역 내의 교통안전 및 소통에 관한 사무 다. 지역 내 다중운집 행사 관련 혼잡 교통 및 안전 관리 라. 다음의 어느 하나에 해당하는 수사사무 1) 학교폭력 등 소년범죄 2) 가정폭력, 아동학대 범죄 3) 교통사고 및 교통 관련 범죄 4) 「형법」 제245조에 따른 공연음란 및 「성폭력범죄의 처벌 등에 관한 특례법」 제12조에 따른 성적 목적을 위한 다중이용장소 침입행위에 관한 범죄 5) 경범죄 및 기초질서 관련 범죄 6) 가출인 및 「실종아동등의 보호 및 지원에 관한 법률」 제2조제2호에 따른 실종아동등 관련 수색 및 범죄 ② 제1항제2호가목부터 다목까지의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정하는 기준에 따라 시·도조례로 정한다. ③ 제1항제2호라목의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정한다.","cite":"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 제4조","badge":"","topic":"","from":"GY-2022-2-P-02","seq":null},{"id":"P-OX-338","subject":"경찰학","unit":"경찰실무·각론","stmt":"｢여권법｣ 제17조 제1항 단서에 따른 외교부장관의 허가를 받지 아니하고 방문 및 체류가 금지된 국가 또는 지역을 방문･체류한 사람이 테러로 인해 생명의 피해를 입은 경우, 그 사람의 유족에 대해 특별위로금을 지급할 수 있다. (23.2차)","answer":false,"quote":"① 테러로 인하여 생명의 피해를 입은 사람의 유족 또는 신체상의 장애 및 장기치료를 요하는 피해를 입은 사람에 대해서는 그 피해의 정도에 따라 등급을 정하여 특별위로금을 지급할 수 있다. 다만, 「여권법」 제17조제1항 단서에 따른 외교부장관의 허가를 받지 아니하고 방문 및 체류가 금지된 국가 또는 지역을 방문·체류한 사람에 대해서는 그러하지 아니하다.","cite":"국민보호와 공공안전을 위한 테러방지법 제16조 제1항","badge":"","topic":"","from":"GY-2023-2-P-38","seq":null}],"news":[{"id":"news-03","category":"관계성 범죄","title":"경찰, 교제폭력·스토킹 대응 기준을 국민 숙의로 정한다","date":"2026-11-22","press":"연합뉴스","summary":"경찰청이 23~24일 서울에서 '경찰정책 국민참여단'을 연다. 국민 30명(남녀 각 15명)과 외부 전문가 4명, 현장 경찰관 6명이 '관계성 범죄 피해자의 의사 존중과 안전 확보, 경찰 개입의 기준과 범위'를 논의한다. 경찰이 치안정책에 국민 숙의 절차를 도입한 것은 이번이 처음이며, 둘째 날 마련한 권고안을 실제 정책에 반영할 계획이다.","point":"피해자의 자기결정권과 안전 확보가 충돌할 때 경찰 개입의 정당성을 어디에 두는지가 핵심 쟁점이다. '피해자가 원하지 않는데 경찰이 개입할 수 있는가'라는 질문에 기준(긴급성·생명 위험)을 들어 답할 수 있어야 한다.","url":"https://www.yna.co.kr/view/AKR20261122009500004","image":"assets/news/news-03.jpg","credit":"연합뉴스 자료사진"},{"id":"news-08","category":"경찰 정책","title":"자치경찰제 확대 두 안 검토…지구대만 넘기나, 시·도경찰청까지 넘기나","date":"2026-11-22","press":"노컷뉴스","summary":"경찰청 자치경찰기획단이 범정부협의체에서 두 가지 개편안을 검토 중이다. ①기존 자치경찰 사무(범죄예방·여성청소년·교통)와 지구대·파출소만 시도로 이관하고 국가경찰의 수사 기능은 유지하는 안, ②시·도경찰청 이하 대부분을 시도로 이관하는 안이다. ②안은 지역 유착·정치적 중립성 훼손 우려가 있어 총경 이상 대통령 임용권 유지, 전국 순환인사, 유착 우려 사건은 국가수사본부 직접 수사 같은 보완책이 함께 논의된다.","point":"자치경찰제의 쟁점은 '무엇을 넘기고 무엇을 남기는가'다. 사무 이관 범위에 따라 현장 대응력과 중립성이 어떻게 달라지는지, 국가경찰과 자치경찰의 사무 구분(경찰법 제5조)과 연결해 설명할 수 있어야 한다.","url":"https://www.nocutnews.co.kr/news/6610605","image":"assets/news/news-08.jpg","credit":"노컷뉴스"},{"id":"news-07","category":"AI·치안","title":"내년 순찰로봇 300대 도입 앞두고 '운용 근거 법령' 공백","date":"2026-11-19","press":"디지털데일리","summary":"경찰청이 내년 예산안에 4륜형 순찰로봇 300대 도입 사업비 450억 원(대당 1억5,000만 원 기준)을 신규 편성했다. 그런데 로봇 운용의 법적 근거가 없고, 관제시스템·데이터 저장시설·안전성 검증 환경도 갖추지 못했다. 순찰로봇·드론이 촬영과 정보수집을 하면 시민이 거부하기 어렵다는 지적에 대해 경찰청은 개인 식별을 어렵게 하는 기술을 개발 중이라고 밝혔다.","point":"AI 치안은 ①법적 근거 ②개인정보·영상정보 처리 ③오작동 시 책임 소재 세 가지로 정리하면 답이 선다. '효율'과 '기본권 제한의 법률유보'를 함께 언급하면 좋다.","url":"https://www.ddaily.co.kr/page/view/2026111816561787656","image":"assets/news/news-07.jpg","credit":"디지털데일리"},{"id":"news-11","category":"수사·법개정","title":"경찰수사 심의위원회 첫 전국 연례총회…'법제화' 목소리","date":"2026-11-13","press":"연합뉴스","summary":"경찰청 국가수사본부가 13일 제1회 전국 경찰수사 심의위원회 연례총회를 열었다. 2021년 제도 도입 이후 전국 단위 총회는 처음으로, 위원장·심의위원·시도청 수사심의과장 등 70여 명이 참석했다. 수심위는 민간 전문가가 경찰 수사의 적정성을 심의하는 기구로, 총회에서는 설치 근거의 법제화와 분야별 전문소위원회·주심제 도입이 제안됐다.","point":"검찰의 보완수사권이 사라진 뒤 경찰 수사를 견제할 장치가 수심위라는 점을 연결해 말할 수 있어야 한다. 현재 근거가 경찰청 예규라 구속력이 약하다는 한계도 함께 짚으면 답이 깊어진다.","url":"https://www.yna.co.kr/view/AKR20261113001300004","image":"assets/news/news-11.jpg","credit":"연합뉴스"},{"id":"news-04","category":"관계성 범죄","title":"내년 예산에 관계성 범죄 대응 확대…여성청소년안전국 신설 추진","date":"2026-11-09","press":"서울경제","summary":"2027년도 정부 예산안에 관계성 범죄 대응을 위한 현장 시나리오 교육과 위치추적장치 탐지 전문용역 예산이 새로 들어갔다. 지능형 CCTV를 활용한 피해자 안전조치 예산도 늘었다. 경찰청은 여성청소년안전국 신설을 위한 관계부처 협의를 마쳤고 인건비도 예산안에 반영됐다. 올해 하반기에만 수사부서에 2,313명을 추가 배치해, 정부 출범 이후 수사 인력 보강은 총 4,220명이다.","point":"조직(여성청소년안전국)과 인력·예산은 정책 의지를 보여주는 지표다. 관계성 범죄 대응이 '피해자 보호'에서 '가해자 관리'로 옮겨가는 흐름과 함께 설명하면 좋다.","url":"https://www.sedaily.com/article/20111891","image":"assets/news/news-04.jpg","credit":"서울경제"},{"id":"news-09","category":"경찰 정책","title":"2027년 경찰청 예산 14조 9,832억 원…마약·초국가범죄·AI로봇에 집중","date":"2026-11-05","press":"대한민국 정책브리핑","summary":"2027년 경찰청 예산안이 14조 9,832억 원으로 편성됐다(5.1% 증액). 마약범죄 단속·탐지·수사 인프라는 9.8억 원에서 68.3억 원으로, 국외도피사범 송환·공조수사는 5.6억 원에서 14.6억 원으로 늘었다. 대테러 대응 로봇은 24억 원에서 48억 원으로 두 배가 됐고, 위험현장 증거채취 로봇(22.5억 원)과 경찰부대 보조로봇(40억 원)이 신규 편성됐다.","point":"예산은 정책 우선순위를 보여주는 숫자다. 마약·초국가범죄·AI 로봇이라는 세 축을 '치안 환경 변화에 대한 대응'으로 묶어 말할 수 있어야 한다.","url":"https://www.korea.kr/multi/visualNewsView.do?newsId=148975069","image":"assets/news/news-09.jpg","credit":"대한민국 정책브리핑"},{"id":"news-10","category":"이상동기 범죄","title":"'초안전사회' 회의…안심순찰대·가해자 격리시설, 가석방 없는 무기형까지","date":"2026-10-23","press":"연합뉴스","summary":"이재명 대통령 주재 '초안전사회 범정부 대응회의'에서 부처별 대책이 보고됐다. 경찰청은 범죄 피해자 거주지 주변을 순찰하는 '안심순찰대' 신설, 여성 소상공인·1인 가구 CCTV·비상벨 할인 지원, 가정폭력 가해자를 주거지에서 우선 분리하는 '가해자 격리시설'을 검토한다고 밝혔다. 법무부는 '가석방 없는 무기형' 도입과 살인·강도 범죄자의 전자장치 부착 시 흉기소지 금지 의무 부과를 추진한다.","point":"'피해자 대책'에서 '가해자 관리·예방'으로 무게중심이 옮겨간 것이 핵심이다. 경찰·법무부·성평등가족부·복지부 대책을 구분해 말하고, 가해자 격리시설의 법적 근거(가정폭력처벌법)를 짚으면 좋다.","url":"https://www.yna.co.kr/view/AKR20261023117200001","image":"assets/news/news-10.jpg","credit":"연합뉴스"},{"id":"news-05","category":"이상동기 범죄","title":"이상동기 범죄 87%가 공개된 장소…경찰 대응체계 '구멍'","date":"2026-10-18","press":"연합뉴스","summary":"2023년부터 올해 상반기까지 이상동기 범죄는 146건(2023년 46·2024년 42·2025년 39) 발생했고, 87.0%인 127건이 노상·쇼핑몰·지하철역 같은 공개된 장소에서 일어났다. 도구를 쓴 범행이 58.2%였고 그중 69.4%가 흉기였다. 판결문 분석에서는 가해자의 78%가 전과자, 살인까지 간 사건의 68.4%가 계획범죄로 나타나 '예측 가능한 범죄'라는 지적이 나온다.","point":"이상동기 범죄의 공식 개념(피해자와의 무관련성·범행동기의 이상성·행위의 비전형성)과, 위험 징후 평가가 현장에서 작동하지 않은 사례를 함께 기억하자. 예방과 기본권 보호의 균형이 단골 질문이다.","url":"https://www.yna.co.kr/view/AKR20261016171200004","image":"assets/news/news-05.jpg","credit":"연합뉴스"},{"id":"news-06","category":"이상동기 범죄","title":"인천 흉기 난동 뒤 부산경찰 '특별치안활동'…흉기 소지 구속수사 원칙","date":"2026-10-17","press":"연합뉴스","summary":"부산경찰청이 이상동기 범죄 예방을 위한 특별치안활동에 들어갔다. 부산의 다중운집시설 97곳과 11월까지 예정된 축제 49개를 중심으로 순찰을 강화하고, 자율방범대·민간경비업체와 협업한다. 이상동기 범죄 관련 112신고는 '코드1' 이상으로 지정하고 필요하면 '코드0'으로 격상하며, 단순 흉기 소지 사안도 전력과 정황을 확인해 구속수사를 원칙으로 한다.","point":"112 신고 코드(코드0·코드1)와 가시적 순찰, 민간 협업은 지역경찰 활동의 실제 사례다. '예방적 순찰이 기본권을 과도하게 제한하지 않는가'라는 반대 논거도 준비해 두면 좋다.","url":"https://www.yna.co.kr/view/AKR20261017018100051","image":"assets/news/news-06.jpg","credit":"연합뉴스 자료사진(부산경찰청)"},{"id":"news-01","category":"수사·법개정","title":"검찰청 78년 만에 폐지…공소청·중대범죄수사청 출범","date":"2026-10-02","press":"연합뉴스","summary":"개정 형사소송법과 공소청법·중수청법이 시행되며 수사와 기소가 분리됐다. 대부분의 수사는 경찰이, 중대범죄 수사는 중대범죄수사청이, 기소와 공소유지는 공소청이 맡는다. 공소청은 직접수사도 보완수사도 할 수 없고 보완수사만 요구할 수 있다. 검찰 미제 사건 약 16만 5,000건이 이관되고, 중수청은 정원 2,874명의 66%인 약 1,900명으로 출범해 인력·시설 공백이 과제로 남았다.","point":"수사와 기소의 분리, 검사 직접수사권 폐지, 경찰 수사 책임 확대라는 세 문장으로 정리된다. 공소청의 권한(영장 청구·보완수사요구·재수사요구)과 한계를 구분해 말할 수 있어야 한다.","url":"https://www.yna.co.kr/view/AKR20261002077651004","image":"assets/news/news-01.jpg","credit":"연합뉴스"},{"id":"news-02","category":"수사·법개정","title":"고소·고발은 경찰서로…달라진 사건 처리 절차 일문일답","date":"2026-10-02","press":"경향신문","summary":"고소·고발장은 원칙적으로 경찰서(중수청 관할 사건은 중수청)에 내야 하고, 검찰에는 낼 수 없다. 사법경찰관은 고소·고발을 접수하면 원칙적으로 3개월 안에 수사를 완료해 송치 여부를 결정해야 한다. 수사 개시 6개월이 지나도 정당한 이유 없이 지연되면 이의를 신청할 수 있고, 관서장은 14일 이내에 조사 결과를 통보해야 한다. 불송치 결정에 대한 이의신청은 통지일부터 3개월(정당한 사유가 있으면 6개월 범위) 안에 할 수 있다.","point":"3개월·6개월·14일·90일 같은 기한 숫자가 사례형 문제로 나오기 쉽다. '경찰 수사 → 공소청 기소' 흐름과 고소인·고발인의 이의신청권(고발인은 제한적)을 함께 정리하자.","url":"https://www.khan.co.kr/article/202610020600061","image":"assets/news/news-02.jpg","credit":"경향신문"}]}</script>

  /* =========================================================
     1. 저장 상태
     ========================================================= */
  function freshState() {
    return {
      v: 2,
      wrong: {},      // 기출: { n, ts }
      stats: {},      // 기출: { ok, bad }
      oxwrong: {},    // OX: { n, ts }
      oxstats: {},    // OX: { ok, bad }
      pts: 0,
      rankSeen: 0,
      day: null,      // { d, ox:{}, news:{}, bonus, earn }
      settings: { subject: 'all', order: 'seq', oxMode: 'unit' }
    };
  }

  function prune(s) {
    Object.keys(s.oxwrong).forEach(function (id) { if (!OX_BY_ID[id]) delete s.oxwrong[id]; });
    Object.keys(s.oxstats).forEach(function (id) { if (!OX_BY_ID[id]) delete s.oxstats[id]; });
  }

  function loadState() {
    var s = freshState();
    function absorb(p) {
      ['oxwrong', 'oxstats'].forEach(function (k) {
        if (p[k] && typeof p[k] === 'object' && !Array.isArray(p[k])) s[k] = p[k];
      });
      if (typeof p.pts === 'number' && isFinite(p.pts) && p.pts >= 0) s.pts = Math.floor(p.pts);
      if (typeof p.rankSeen === 'number' && isFinite(p.rankSeen) && p.rankSeen >= 0) {
        s.rankSeen = Math.min(RANKS.length - 1, Math.floor(p.rankSeen));
      }
      if (p.day && typeof p.day === 'object' && typeof p.day.d === 'string') {
        s.day = {
          d: p.day.d,
          ox: (p.day.ox && typeof p.day.ox === 'object') ? p.day.ox : {},
          news: (p.day.news && typeof p.day.news === 'object') ? p.day.news : {},
          bonus: !!p.day.bonus,
          earn: (typeof p.day.earn === 'number' && isFinite(p.day.earn)) ? p.day.earn : 0
        };
      }
      if (p.settings && typeof p.settings === 'object') {
        if (typeof p.settings.subject === 'string') s.settings.subject = p.settings.subject;
        if (p.settings.order === 'shuffle' || p.settings.order === 'seq') s.settings.order = p.settings.order;
        if (p.settings.oxMode === 'unit' || p.settings.oxMode === 'random') s.settings.oxMode = p.settings.oxMode;
      }
    }
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) absorb(JSON.parse(raw) || {});
      else {
        var old = localStorage.getItem(OLD_KEY);
        if (old) {
          var p = JSON.parse(old) || {};
          p.oxwrong = {}; p.oxstats = {};
          if (p.day && typeof p.day === 'object') { p.day.ox = {}; }
          absorb(p);
        }
      }
    } catch (e) { /* 저장소를 쓸 수 없으면 메모리에서만 동작 */ }
    prune(s);
    return s;
  }

  function saveState() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { }
  }

  var state = loadState();
  if (!SUBJ_NAME[state.settings.subject]) state.settings.subject = 'all';

  var ui = {

  /* =========================================================

  function $(sel) { return document.querySelector(sel); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function btn(cls, label, onClick, attrs) {
    var b = el('button', cls);
    b.type = 'button';
    if (label) b.textContent = label;
    if (onClick) b.addEventListener('click', onClick);
    if (attrs) Object.keys(attrs).forEach(function (k) { b.setAttribute(k, attrs[k]); });
    return b;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function fmt(n) { return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function oxIn(subjectId) {
    return OX.filter(function (o) { return subjectId === 'all' || o.subjectId === subjectId; });
  }
  function oxWrongIn(subjectId) {
    return oxIn(subjectId).filter(function (o) { return !!state.oxwrong[o.id]; });
  }
  function oxSeen(subjectId) {
    return oxIn(subjectId).filter(function (o) { return !!state.oxstats[o.id]; }).length;
  }
  function oxRate(subjectId) {
    var ok = 0, bad = 0;
    oxIn(subjectId).forEach(function (o) {
      var st = state.oxstats[o.id];
      if (st) { ok += st.ok || 0; bad += st.bad || 0; }
    });
    var total = ok + bad;
    return { ok: ok, bad: bad, total: total, rate: total ? Math.round((ok / total) * 100) : 0 };
  }

  function progressBar(ratio, cls) {
    var bar = el('div', 'bar' + (cls ? ' ' + cls : ''));
    var fill = el('i');
    fill.style.width = Math.max(0, Math.min(100, ratio)) + '%';
    bar.appendChild(fill);
    return bar;
  }

  function insigniaHTML(rank) {
    var s = '';
    for (var i = 0; i < (rank.star || 0); i++) s += SVG_STAR;
    for (var j = 0; j < (rank.flower || 0); j++) s += SVG_FLOWER;
    return s;
  }

  function faceImg(kind, size, alt) {
    var img = el('img');
    img.src = FACE[kind] || FACE.base;
    img.alt = alt || '';
    img.width = size;
    img.height = size;
    img.decoding = 'async';
    return img;
  }

  function buddyEl(info, opts) {
    var o = opts || {};
    var box = el('div', 'buddy ' + (info.kind || 'base') + (o.pop ? ' pop' : ''));
    var av = el('div', 'buddy-av');
    av.appendChild(faceImg(info.kind, 44));
    box.appendChild(av);

      var f = el('span', 'float-pt' + (String(o.float).charAt(0) === '-' ? ' minus' : ''), o.float);

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1700);
  }

  /* 보기 박스(㉠~㉦, <보기 1>·<보기 2>) 렌더 */
  function renderBox(blocks) {
    if (!blocks || !blocks.length) return null;
    var wrap = el('div', 'qbox');
    blocks.forEach(function (b) {
      if (b.title) wrap.appendChild(el('span', 'qbox-t', b.title));
      if (b.pre) wrap.appendChild(el('p', 'qbox-pre', b.pre));
      (b.items || []).forEach(function (t) {
        var row = el('span', 'qbox-i');
        var m = String(t).match(/^(㉠|㉡|㉢|㉣|㉤|㉥|㉦|\(가\)|\(나\)|\(다\)|\(라\)|\(마\)|\(바\))/);
        if (m) {
          row.appendChild(el('b', null, m[1] + ' '));
          row.appendChild(document.createTextNode(String(t).slice(m[1].length).trim()));

          row.textContent = t;

        wrap.appendChild(row);
      });
    });

  /* =========================================================
     3. 포인트 · 계급 · 오늘의 임무
     ========================================================= */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function freshDay() { return { d: todayKey(), ox: {}, news: {}, bonus: false, earn: 0 }; }

  function ensureDay() {
    if (!state.day || state.day.d !== todayKey()) state.day = freshDay();
    if (!state.day.ox || typeof state.day.ox !== 'object') state.day.ox = {};
    if (!state.day.news || typeof state.day.news !== 'object') state.day.news = {};
    if (typeof state.day.earn !== 'number' || !isFinite(state.day.earn)) state.day.earn = 0;
  }

  function addPoints(n) {
    ensureDay();
    var before = Math.max(0, state.pts || 0);
    var after = Math.max(0, before + n);
    var delta = after - before;
    state.pts = after;
    state.day.earn = (state.day.earn || 0) + delta;
    return delta;
  }

  function rankIndexFor(pts) {
    var i = 0;
    for (var k = 0; k < RANKS.length; k++) if (pts >= RANKS[k].pts) i = k;
    return i;
  }

  function dayStats() {
    ensureDay();
    return {
      ox: Object.keys(state.day.ox).length,
      news: Object.keys(state.day.news).length,
      bonus: !!state.day.bonus,
      earn: state.day.earn || 0
    };
  }

  function missionDone() {
    var d = dayStats();
    return d.ox >= GOAL_OX && d.news >= GOAL_NEWS;
  }

  function checkMission() {
    var d = dayStats();
    if (d.bonus || d.ox < GOAL_OX || d.news < GOAL_NEWS) return false;
    state.day.bonus = true;
    var got = addPoints(P_BONUS);
    saveState();
    toast('특진 가산점 +' + got + 'P! 오늘의 임무 완수 🚓');
    return true;
  }

  function showPromo(level) {
    var box = $('#promoOverlay');
    if (!box || level < 1) return;
    var rk = RANKS[level];
    var nx = RANKS[level + 1] || null;
    var pts = Math.max(0, state.pts || 0);
    var title = $('#promoTitle');
    if (title) title.textContent = RANKS[level - 1].name + ' → ' + rk.name;
    var ins = $('#promoInsignia');
    if (ins) ins.innerHTML = insigniaHTML(rk);
    var note = $('#promoNote');
    if (note) {
      note.textContent = fmt(rk.pts) + 'P 돌파 — 승진 심사 통과! ' + rk.name + ' 계급입니다. ' +
        (nx ? '다음 ' + nx.name + '까지 ' + fmt(nx.pts - pts) + 'P 남았어요.' : '이제 최고 계급이에요. 정말 대단해요!');
    }
    box.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closePromo() {
    var box = $('#promoOverlay');
    if (box) box.hidden = true;
    document.body.style.overflow = '';
  }

  function checkPromotion() {
    var i = rankIndexFor(Math.max(0, state.pts || 0));
    if (i > (state.rankSeen || 0)) {
      state.rankSeen = i;
      saveState();
      setTimeout(function () { showPromo(i); }, 420);
    }
  }

  function greetLine() {
    var h = new Date().getHours();
    if (h < 5) return '야간 근무 중이야? 지문 하나만 더 하고 자자';
    if (h < 11) return '좋은 아침! 오늘 순찰 임무부터 가볍게';
    if (h < 17) return '점심 먹고 한 조, 딱 좋은 타이밍이야';
    if (h < 22) return '오늘 하루도 수고했어, 10분만 더!';
    return '야간 순찰 전에 지문 10제, 어때?';
  }

  var TABS = ['home', 'ox', 'news', 'wrong'];

  function go(tab) {
    if (TABS.indexOf(tab) < 0) tab = 'home';
    ui.tab = tab;
    if (tab === 'ox' && !ui.ox) startOx();
    renderAll();
    window.scrollTo(0, 0);
  }

  function setSubject(id) {
    if (id !== 'all' && !SUBJ_NAME[id]) return;
    ui.subject = id;
    state.settings.subject = id;
    ui.buddy = null;
    if (ui.ox && ui.ox.subject !== id) ui.ox = null;
    if (state.settings.oxMode === 'unit') ui.oxUnit = '';
    saveState();
    renderAll();
  }

  function renderAll() {
    ensureDay();
    renderChips();
    TABS.forEach(function (v) {
      var node = $('#view-' + v);
      if (node) node.hidden = (ui.tab !== v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === ui.tab));
    });
    if (ui.tab === 'home') renderHome();
    if (ui.tab === 'ox') renderOx();
    if (ui.tab === 'news') renderNews();
    if (ui.tab === 'wrong') renderWrong();
    renderBadges();
  }

  function renderBadges() {
    var n = oxWrongIn('all').length;
    var wb = $('#wrongBadge');
    if (wb) {
      if (n > 0) { wb.textContent = String(n); wb.hidden = false; }
      else wb.hidden = true;
    }
  }

  function renderChips() {
    var bar = $('#subjectChips');
    var wrap = $('#chipbar');
    if (wrap) wrap.hidden = (ui.tab === 'news');

    var list = [{ id: 'all', name: '전체' }].concat(SUBJECTS.map(function (s) { return { id: s.id, name: s.name }; }));

  function buildHero() {
    var pts = Math.max(0, state.pts || 0);

    var rk = RANKS[lvl];
    var nx = RANKS[lvl + 1] || null;

    var hero = el('section', 'card hero');

    copy.appendChild(ps);

    var ratio, nextLabel;
    if (nx) {
      var base = rk.pts, span = nx.pts - base;
      ratio = Math.max(0, Math.min(100, ((pts - base) / span) * 100));
      nextLabel = '다음 승진 ' + nx.name + '까지 ' + fmt(nx.pts - pts) + 'P';

    copy.appendChild(bar);
    copy.appendChild(el('p', 'rank-next', nextLabel));

  function buildMission() {

    card.appendChild(head);

    card.appendChild(missionRow('🔍', 'OX 지문 10제 검문', '지문을 읽고 O/X 판단', oN, GOAL_OX));
    card.appendChild(missionRow('📰', '경찰 뉴스 2건 읽기', '면접에 쓸 최신 이슈 챙기기', nN, GOAL_NEWS));

    card.appendChild(el('p', 'mission-foot', done
      ? '오늘 임무 완수! 특진 가산점 ' + P_BONUS + 'P 지급 완료 🎉'
      : '둘 다 채우면 근무평정 가산점 +' + P_BONUS + 'P · 지금 ' + fmt(state.pts || 0) + 'P'));

  function buildQuick() {

  /* =========================================================
     6. OX 검문
     ========================================================= */
  function oxUnits() {
    var list = [], map = {};
    OX.forEach(function (o) {
      if (ui.subject !== 'all' && o.subjectId !== ui.subject) return;
      if (!map[o.unit]) { map[o.unit] = { name: o.unit, ids: [], subjectName: o.subjectName }; list.push(map[o.unit]); }
      map[o.unit].ids.push(o.id);
    });
    list.sort(function (a, b) {
      return (OX_UNIT_ORDER.indexOf(a.name) + 1 || 99) - (OX_UNIT_ORDER.indexOf(b.name) + 1 || 99);
    });
    return list;
  }

  function startOx() {
    var mode = state.settings.oxMode || 'unit';
    var ids = [];
    if (mode === 'unit') {
      var us = oxUnits().filter(function (u) { return u.name === ui.oxUnit; });
      ids = us.length ? us[0].ids.slice() : [];
    } else {
      ids = oxIn(ui.subject).map(function (o) { return o.id; });
      ids = shuffle(ids);
    }
    if (state.settings.order === 'shuffle' && mode !== 'random') ids = shuffle(ids);
    ui.ox = {
      subject: ui.subject,
      mode: mode,
      unit: ui.oxUnit || '',
      order: state.settings.order,
      ids: ids,
      idx: 0,
      resp: {},
      combo: 0,
      best: 0,
      wrongStreak: 0,
      anim: false,
      lastDelta: 0,
      lastPenalty: 0,
      done: ids.length === 0
    };
  }

  function oxAnswered(q) {
    var n = 0;
    q.ids.forEach(function (id) { if (q.resp[id]) n += 1; });
    return n;
  }

  function oxBuddy(q, answered, ok) {
    var d = dayStats();
    var n = Math.min(GOAL_OX, d.ox);
    if (!answered) {
      return {
        kind: 'base',
        line: OX_LINES[q.idx % OX_LINES.length],
        sub: '정답 +' + P_OX_OK + 'P · 연속 오답 2번부터 ' + P_BAD + 'P'
      };
    }
    if (ok) {
      return {
        kind: 'good',
        line: q.combo >= 3 ? q.combo + '연속 검문 통과! 🔥' : '통과! 지문 하나 정리됐어',
        sub: '오늘 검문 ' + n + '/' + GOAL_OX + ' · 보유 ' + fmt(state.pts || 0) + 'P'
      };
    }
    return {
      kind: 'cheer',
      line: '이 지문은 다시 봐야겠어',
      sub: '오답 수사파일에 넣었어 · 오늘 검문 ' + n + '/' + GOAL_OX
    };
  }

  function oxUnitCard(u) {
    var done = u.ids.filter(function (id) { return !!state.oxstats[id]; }).length;
    var ok = u.ids.filter(function (id) { var st = state.oxstats[id]; return st && st.ok; }).length;
    var b = el('button', 'unitchip');
    b.type = 'button';
    b.appendChild(el('span', 'uname', u.name));
    b.appendChild(el('span', 'ucnt', u.ids.length + '지문 · 검문 ' + done));
    b.appendChild(el('span', 'ubar'));

    fill.style.width = pct(done, u.ids.length) + '%';

    b.addEventListener('click', function () {
      ui.oxUnit = u.name;
