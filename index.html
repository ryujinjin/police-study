,"from":"GY-2025-2-H-08","seq":null},{"id":"H-OX-258","subject":"헌법","unit":"기본권론","stmt":"구치소에 종교행사 공간이 1개뿐이고, 종교행사는 종교, 수형자와 미결수용자, 성별, 수용동 별로 진행되며, 미결수용자는 공범이나 동일사건 관련자가 있는 경우 이를 분리하여 참석하게 해야 하는 점을 고려하더라도, 구치소 내 미결수용자를 대상으로 한 개신교 종교행사를 4주에 1회, 일요일이 아닌 요일에 실시한 구치소장의 종교행사 처우는 미결수용자의 종교의 자유를 침해한다. (24.2차)","answer":false,"quote":"공간이 하나뿐이고 종교·성별·공범 분리까지 해야 하는 여건에서 개신교 행사를 4주에 1회 연 것은 종교의 자유 침해가 아니다.","cite":"헌재 2013헌마190","badge":"","topic":"","from":"GY-2024-2-H-13","seq":null},{"id":"H-OX-257","subject":"헌법","unit":"기본권론","stmt":"헌법상 보호되는 양심은 어떤 일의 옳고 그름을 판단할 때 그렇게 행동하지 아니하고는 자신의 인격적인 존재가치가 허물어지고 말 것이라는 강력하고 진지한 마음의 소리로서 절박하고 추상적인 양심을 말한다. (24.2차)","answer":false,"quote":"헌법이 보호하는 양심은 절박하고 「구체적」인 양심이며, 막연하고 추상적인 신념은 여기에 들지 않는다.","cite":"헌재 2002헌가1","badge":"","topic":"","from":"GY-2024-2-H-12","seq":null},{"id":"H-OX-156","subject":"헌법","unit":"기본권론","stmt":"근로조건의 보장은 기본적으로 근로자의 생활보장 및 인간의 존엄성을 보장해주는 기초적인 근로의 권리의 내용이지만, 이는 일방적으로 근로자를 두텁게 보호하는 것만으로 달성되는 것이 아니라, 사용자의 효율적인 기업경영 및 기업의 생산성이라는 측면과 조화를 이룰 때 달성이 가능하고, 이것이 헌법 제32조 제3항이 근로조건의 기준을 법률로 정하도록 한 취지이다. (25.1차)","answer":true,"quote":"가.인간의 존엄성을 보장하는 근로조건의 보장은 근로자를 두텁게 보호하는 것뿐만 아니라 사용자의 효율적인 기업경영 및 기업의 생산성이라는 측면과 조화를 이룰 때 달성 가능하고, 이것이 헌법 제32조 제3항이 근로조건의 기준을 법률로 정하도록 한 취지이다.","cite":"헌재 2015헌바334","badge":"","topic":"","from":"GY-2025-1-H-18","seq":null},{"id":"H-OX-287","subject":"헌법","unit":"기본권론","stmt":"산재피해 근로자에게 인정되는 산재보험수급권은 헌법상의 권리이며, 개인에게 국가에 대한 사회보장·사회복지 또는 재해예방 등과 관련된 적극적 급부청구권도 인정된다. (25.2차)","answer":false,"quote":"산재보험수급권은 입법으로 비로소 구체화되는 법률상 권리이고, 헌법에서 곧바로 국가에 대한 적극적 급부청구권이 나오지는 않는다.","cite":"헌재 2004헌바2","badge":"","topic":"","from":"GY-2025-2-H-19","seq":null},{"id":"H-OX-091","subject":"헌법","unit":"기본권론","stmt":"A가 乙의 통신자료 제공요청에 따라 乙에게 제공한 甲의 성명, 주민등록번호, 주소, 전화번호, 아이디, 가입일 또는 해지일은 甲의 동일성을 식별할 수 있게 해주는 개인정보에 해당하므로 이 사건 법률조항은 甲의 개인정보자기결정권을 제한한다. (23.1차)","answer":true,"quote":"전기통신사업자가 수사기관 등의 통신자료 제공요청에 따라 수사기관 등에 제공하는 이용자의 성명, 주민등록번호, 주소, 전화번호, 아이디, 가입일 또는 해지일은 청구인들의 동일성을 식별할 수 있게 해주는 개인정보에 해당하므로, 이 사건 법률조항은 개인정보자기결정권을 제한한다.","cite":"헌재 2016헌마388","badge":"","topic":"","from":"GY-2023-1-H-13","seq":null},{"id":"H-OX-124","subject":"헌법","unit":"기본권론","stmt":"현행 헌법 제12조에서 종래의 “구금”을 “구속”으로 바꾼 것은 신체의 자유의 보장 범위를 구금된 사람뿐 아니라 구인된 사람 에게까지 넓히기 위한 것으로 해석하는 것이 타당하다. (24.1차)","answer":true,"quote":"현행 헌법이 「구금」을 「구속」으로 바꾼 것은 구금된 사람뿐 아니라 구인된 사람까지 신체의 자유 보장 범위를 넓히려는 뜻이다.","cite":"헌재 2014헌마346","badge":"","topic":"","from":"GY-2024-1-H-01","seq":null},{"id":"H-OX-277","subject":"헌법","unit":"기본권론","stmt":"신체의 자유, 주거의 자유, 변호인의 조력을 받을 권리, 재판 청구권 등은 성질상 인간의 권리에 해당한다고 볼 수 있으므로, 위 기본권들에 관하여는 외국인 근로자들의 기본권 주체성이 인정된다. 따라서 ‘국가인권위원회의 공정한 조사를 받을 권리’ 또한 헌법상 인정되는 기본권이라고 할 수 있으므로 외국인 근로자에게도 인정된다. (25.2차)","answer":false,"quote":"신체의 자유·재판청구권 등은 인간의 권리라 외국인도 주체가 되지만, 「국가인권위원회의 공정한 조사를 받을 권리」는 헌법상 기본권이 아니다.","cite":"헌재 2008헌마430","badge":"","topic":"","from":"GY-2025-2-H-04","seq":null},{"id":"H-OX-195","subject":"헌법","unit":"기본권론","stmt":"친생부인의 소의 제척기간을 규정한 민법 규정 중 “부(夫)가 그 사유가 있음을 안 날부터 2년내” 부분은 부(夫)가 가정생활과 신분관계에서 누려야 할 인격권을 침해한다. (22.1차)","answer":false,"quote":"친생부인의 소를 「사유가 있음을 안 날부터 2년」 안에 내게 해도 부(夫)의 인격권 침해가 아니다 — 위헌은 옛 「출생을 안 날부터 1년」이었다.","cite":"헌재 2012헌바357","badge":"","topic":"","from":"GY-2022-1-H-07","seq":null},{"id":"H-OX-259","subject":"헌법","unit":"기본권론","stmt":"피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 하는 ｢형사소송법｣ 조항은 불이익변경금지원칙을 적용하지 않아 과잉금지원칙에 위반되어 피고인의 공정한 재판을 받을 권리를 침해한다. (24.2차)","answer":false,"quote":"피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 하는 형사소송법 제457조의2 제1항(이하 ‘심판대상조항’이라 한다)이 공정한 재판을 받을 권리를 침해하는지 여부(소극)","cite":"헌재 2021헌바6","badge":"","topic":"","from":"GY-2024-2-H-16","seq":null},{"id":"H-OX-147","subject":"헌법","unit":"기본권론","stmt":"금치처분을 받은 사람은 최장 30일 이내의 기간 동안 종교의식 또는 행사에 참석할 수 없으나 종교상담을 통해 종교활동은 할 수 있어서, 금치기간 중 30일 이내 공동행사 참가를 정지하는 ｢형의 집행 및 수용자의 처우에 관한 법률｣ 조항은 수용자의 종교의 자유를 침해하지 아니한다. (24.2차)","answer":true,"quote":"금치 기간 중 최장 30일 공동행사 참가를 막아도 종교상담으로 종교활동을 할 수 있어 종교의 자유를 침해하지 않는다.","cite":"헌재 2014헌마45","badge":"","topic":"","from":"GY-2024-2-H-13","seq":null},{"id":"H-OX-206","subject":"헌법","unit":"기본권론","stmt":"재판청구권과 같은 절차적 기본권은 원칙적으로 제도적 보장의 성격이 강하기 때문에, 자유권적 기본권의 경우와 비교하여 볼 때 상대적으로 축소된 입법형성권이 인정된다. (22.2차)","answer":false,"quote":"재판청구권 같은 절차적 기본권은 제도적 보장의 성격이 강해 입법형성권이 자유권보다 오히려 넓게 인정된다.","cite":"헌재 2013헌바178","badge":"","topic":"","from":"GY-2022-2-H-06","seq":null},{"id":"H-OX-129","subject":"헌법","unit":"기본권론","stmt":"강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 ｢출입국관리법｣ 조항은 과잉금지원칙 및 적법절차원칙에 위배되어 피보호자의 신체의 자유를 침해한다. (24.1차)","answer":true,"quote":"강제퇴거 대상자 보호에 기간 상한이 없고 독립된 기관의 통제도 없는 조항은 과잉금지원칙과 적법절차원칙에 위배되어 신체의 자유를 침해한다.","cite":"헌재 2020헌가1","badge":"","topic":"","from":"GY-2024-1-H-11","seq":null},{"id":"H-OX-197","subject":"헌법","unit":"기본권론","stmt":"‘음란표현’은 헌법상 언론 출판의 자유의 보호영역 밖에 있다고 보아야 한다. (22.1차)","answer":false,"quote":"음란표현도 언론·출판의 자유의 보호영역에 들어가고 제37조 제2항에 따라 제한될 뿐이다 — 보호영역 밖이라던 선례는 변경되었다.","cite":"헌재 2006헌바109","badge":"","topic":"","from":"GY-2022-1-H-09","seq":null},{"id":"H-OX-110","subject":"헌법","unit":"기본권론","stmt":"시설경비업을 허가받은 경비업자로 하여금 ‘허가받은 경비업무 외의 업무에경비원을 종사하게하는것’을 금지하고, 이를위반한 경비업자에 대한 허가를 취소하도록 정하고 있는 ｢경비업법｣ 제7조 제5항 중 ‘시설경비업무’에 관한 부분, 같은 법 제19조 제1항 제2호 중 ‘시설경비업무’에 관한 부분은 과잉금지원칙에 위반하여 시설경비업을 수행하는 경비업자의 직업의 자유를 침해한다. (23.2차)","answer":true,"quote":"허가받은 시설경비업무 외 업무에 경비원을 쓰면 반드시 허가를 취소하게 한 것은 과잉금지원칙에 위반되어 직업의 자유를 침해한다.","cite":"헌재 2020헌가19","badge":"","topic":"","from":"GY-2023-2-H-10","seq":null},{"id":"H-OX-231","subject":"헌법","unit":"기본권론","stmt":"군인･군무원･경찰공무원 기타 법률이 정하는 자가 전투･훈련등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상 외에 국가 또는 공공단체에 공무원의 직무상 불법행위로 인한 정당한 배상을 청구할 수 있다. (23.2차)","answer":false,"quote":"② 군인·군무원·경찰공무원 기타 법률이 정하는 자가 전투·훈련등 직무집행과 관련하여 받은 손해에 대하여는 법률이 정하는 보상외에 국가 또는 공공단체에 공무원의 직무상 불법행위로 인한 배상은 청구할 수 없다.","cite":"헌법 제29조 제2항","badge":"","topic":"","from":"GY-2023-2-H-18","seq":null},{"id":"H-OX-173","subject":"헌법","unit":"기본권론","stmt":"선거운동의 자유는 널리 선거과정에서 자유로이 의사를 표현할 자유의 일환이므로 표현의 자유의 한 태양이기도 한데, 이러한 정치적 표현의 자유는 선거과정에서의 선거운동을 통하여 국민이 정치적 의견을 자유로이 발표, 교환함으로써 비로소 그 기능을 다하게 된다 할 것이므로 선거운동의 자유는 헌법이 정한 언론· 출판·집회·결사의 자유 및 보장규정에 의한 보호를 받는다. (25.2차)","answer":true,"quote":"선거운동의 자유는 선거과정에서 자유롭게 의사를 표현할 자유로서 표현의 자유의 한 모습이므로, 언론·출판·집회·결사의 자유 보장규정의 보호를 받는다.","cite":"헌재 93헌가4","badge":"","topic":"","from":"GY-2025-2-H-18","seq":null},{"id":"H-OX-120","subject":"헌법","unit":"기본권론","stmt":"근로자들의 단체행동권은 집단적 실력행사로서 위력의 요소를 가지고 있으므로, 사용자의 재산권이나 직업의 자유, 경제활동의 자유를 현저히 침해하고, 거래질서나 국가 경제에 중대한 영향을 미치는 일정한 단체행동권의 행사에 대하여는 제한이 가능하다. (23.2차)","answer":true,"quote":"단체행동권은 집단적 실력행사로서 위력의 요소가 있어, 사용자의 재산권이나 국가 경제에 중대한 영향을 주는 행사는 제한할 수 있다.","cite":"헌재 2012헌바66","badge":"","topic":"","from":"GY-2023-2-H-16","seq":null},{"id":"H-OX-084","subject":"헌법","unit":"기본권론","stmt":"사법경찰관이 보험사기범 검거라는 보도자료 배포 직후 기자들의 취재 요청에 응하여 피의자가 경찰서 조사실에서 양손에 수갑을 찬 채 조사받는 모습을 촬영할 수 있도록 허용한 행위는 과잉금지원칙에 위반되어 피의자의 인격권을 침해한다. (23.1차)","answer":true,"quote":"수갑을 찬 채 조사받는 모습을 기자들이 찍게 한 것은 공익 목적조차 인정되지 않고 얼굴을 가리는 조치도 없어 피의자의 인격권을 침해한다.","cite":"헌재 2012헌마652","badge":"","topic":"","from":"GY-2023-1-H-07","seq":null},{"id":"H-OX-282","subject":"헌법","unit":"기본권론","stmt":"어린이집 원장 또는 보육교사가 아동학대관련범죄로 처벌을 받은 경우 행정청이 재량으로 그 자격을 취소할 수 있도록 정한 ｢영유아보육법｣ 조항은 행정청에게 자격취소에 관한 재량을 임의적으로 부여하고 있으며, 재량권 행사의 당부를 법원에서 사후적으로 판단받을 절차가 마련되어 있지 않다는 점을 고려하면 과잉금지원칙에 반하여 직업선택의 자유를 침해한다. (25.2차)","answer":false,"quote":"아동학대로 처벌받은 보육교사 등의 자격을 재량으로 취소하게 한 조항은 사안마다 판단하는 임의규정이고 법원에서 다툴 수도 있어 직업선택의 자유를 침해하지 않는다.","cite":"헌재 2021헌바234","badge":"","topic":"","from":"GY-2025-2-H-17","seq":null},{"id":"H-OX-221","subject":"헌법","unit":"기본권론","stmt":"경찰이 신고범위를 벗어난 동안에만 집회참가자들을 촬영한다 할지라도, 집회참가자에 대한 촬영행위는 집회참가자들에게 심리적 부담으로 작용하여 집회의 자유를 전체적으로 위축시키는 결과를 가져올 수 있으므로 집회의 자유를 침해한다. (23.1차)","answer":false,"quote":"신고범위를 벗어난 동안에만 참가자를 촬영한 것은 집시법 위반의 증거를 확보하려는 필요최소한의 조치라 집회의 자유 침해가 아니다.","cite":"헌재 2014헌마843","badge":"","topic":"","from":"GY-2023-1-H-16","seq":null},{"id":"H-OX-121","subject":"헌법","unit":"기본권론","stmt":"｢국가배상법｣은 외국인이 피해자인 경우에는 해당 국가와 상호 보증이 있을 때에만 ｢국가배상법｣을 적용한다고 규정하고 있다. (23.2차)","answer":true,"quote":"이 법은 외국인이 피해자인 경우에는 해당 국가와 상호 보증이 있을 때에만 적용한다. [전문개정 2008.3.14.]","cite":"국가배상법 제7조","badge":"","topic":"","from":"GY-2023-2-H-18","seq":null},{"id":"H-OX-086","subject":"헌법","unit":"기본권론","stmt":"학생 선발시기 구분에 있어 ｢초･중등교육법 시행령｣ 조항이 자사고를 후기학교로 규정함으로써 과학고와 달리 취급하고, 일반고와 같이 취급하는 데에는 합리적인 이유가 있으므로 자사고 학교법인의 평등권을 침해하지 아니한다. (23.1차)","answer":true,"quote":"자사고를 후기학교로 정해 일반고와 같이, 과학고와 달리 취급한 선발시기 규정은 합리적 이유가 있어 평등권 침해가 아니다.","cite":"헌재 2018헌마221","badge":"","topic":"","from":"GY-2023-1-H-08","seq":null},{"id":"H-OX-082","subject":"헌법","unit":"기본권론","stmt":"사자(死者)에 대한 사회적 명예와 평가의 훼손은 사자와의 관계를 통하여 스스로의 인격상을 형성하고 명예를 지켜온 그들 후손의 인격권, 즉 유족의 명예 또는 유족의 사자에 대한 경애추모의 정을 침해한다. (23.1차)","answer":true,"quote":"죽은 사람의 명예를 훼손하면 그와의 관계로 인격을 형성해 온 유족의 인격권, 곧 명예와 경애추모의 정이 침해된다.","cite":"헌재 2007헌가23","badge":"","topic":"","from":"GY-2023-1-H-05","seq":null},{"id":"H-OX-058","subject":"헌법","unit":"기본권론","stmt":"법관기피신청이 소송의 지연을 목적으로 함이 명백한 경우에 신청을 받은 법원 또는 법관은 결정으로 이를 기각할 수 있도록 규정한 형사소송법 제20조 제1항이 헌법상 보장되는 공정한 재판을 받을 권리를 침해하는 것은 아니다. (22.1차)","answer":true,"quote":"소송 지연 목적이 명백한 기피신청은 신청받은 법원이 스스로 기각할 수 있어도 공정한 재판을 받을 권리 침해가 아니다.","cite":"헌재 2005헌바58","badge":"","topic":"","from":"GY-2022-1-H-18","seq":null},{"id":"H-OX-073","subject":"헌법","unit":"기본권론","stmt":"집회의 자유는 집권세력에 대한 정치적 반대의사를 공동으로 표명하는 효과적인 수단으로서 현대사회에서 언론매체에 접근 할 수 없는 소수집단에게 그들의 권익과 주장을 옹호하기 위한 적절한 수단을 제공한다. (22.2차)","answer":true,"quote":"집회의 자유는 언론매체에 접근하기 어려운 소수집단이 정치적 반대의사와 주장을 함께 드러낼 수 있게 하는 수단이다.","cite":"헌재 2000헌바67","badge":"","topic":"","from":"GY-2022-2-H-14","seq":null},{"id":"H-OX-252","subject":"헌법","unit":"기본권론","stmt":"대체복무요원 생활관 내부의 공용공간에 CCTV를 설치하여 촬영하는 행위는 군부대와 달리 대체복무요원들의 모든 사적 활동의 동선을 촬영하여, 개인의 행동과 심리에 심각한 제약을 느끼게 하므로 대체복무요원들의 사생활의 비밀과 자유를 침해한다. (24.2차)","answer":false,"quote":"대체복무요원 생활관 내부의 공용공간에 CCTV를 설치하여 촬영하는 행위(이하 ‘CCTV 촬영행위’라 한다)가 대체복무요원 생활관에서 합숙하는 청구인들의 사생활의 비밀과 자유를 침해하는지 여부(소극)","cite":"헌재 2022헌마707","badge":"","topic":"","from":"GY-2024-2-H-11","seq":null},{"id":"H-OX-177","subject":"헌법","unit":"기본권론","stmt":"법무부장관으로 하여금 거짓이나 그 밖의 부정한 방법으로 국적 회복허가를 받은 자에 대하여 그 허가를 취소할 수 있도록 규정 하면서도 그 취소권의 행사 기간을 따로 정하고 있지 아니한 ｢국적법｣ 조항은 과잉금지원칙에 위배하여 거주‧이전의 자유 및 행복추구권을 침해하지 아니한다. (26.1차)","answer":true,"quote":"부정한 방법으로 받은 국적회복허가는 보호할 신뢰가 없어, 취소권 행사기간을 두지 않아도 거주·이전의 자유와 행복추구권을 침해하지 않는다.","cite":"헌재 2017헌바434 · 국적법 제21조","badge":"","topic":"","from":"GY-2026-1-H-05","seq":null},{"id":"H-OX-269","subject":"헌법","unit":"기본권론","stmt":"공직자의 공무집행과 직접적인 관련이 없는 개인적인 사생활에 관한 사실이라면 공적인 관심 사안에 해당할 수 없고, 비록 공직자의 자질‧도덕성‧청렴성에 관한 사실이라도 그 내용이 개인적인 사생활에 관한 것이라면 사생활의 영역에 있는 것이므로, 이러한 사실은 공직자 등의 사회적 활동에 대한 비판 내지 평가의 한 자료가 될 수 없다. (25.1차)","answer":false,"quote":"공직자의 자질·도덕성·청렴성에 관한 사실은 사생활에 속해도 순수한 사생활로 보기 어려워 비판과 평가의 자료가 될 수 있다.","cite":"헌재 2009헌마747","badge":"","topic":"","from":"GY-2025-1-H-10","seq":null},{"id":"H-OX-238","subject":"헌법","unit":"기본권론","stmt":"1억 원 이상의 벌금형을 선고하는 경우 노역장유치기간의 하한을 정한 ｢형법｣ 조항을 시행일 이후 최초로 공소제기되는 경우부터 적용하도록 한 ｢형법｣ 부칙조항은 형벌불소급원칙에 위배되지 않는다. (24.1차)","answer":false,"quote":"1. 1억 원 이상의 벌금형을 선고하는 경우 노역장유치기간의 하한을 정한 형법 (2014. 5. 14.","cite":"헌재 2015헌바239","badge":"","topic":"","from":"GY-2024-1-H-11","seq":null},{"id":"H-OX-194","subject":"헌법","unit":"기본권론","stmt":"청구인은 공법상 재단법인인 방송문화진흥회가 최다출자자인 방송사업자로서 방송법 등 관련 규정에 의하여 공법상의 의무를 부담하고 있으므로, 그 설립목적이 언론의 자유의 핵심 영역인 방송 사업이라고 하더라도 이러한 업무수행과 관련해서는 기본권 주체가 될 수 없다. (22.1차)","answer":false,"quote":"방송문화진흥회가 최다출자자인 방송사업자도 방송 업무에서는 언론의 자유를 누리는 기본권 주체가 된다.","cite":"헌재 2012헌마271","badge":"","topic":"","from":"GY-2022-1-H-05","seq":null},{"id":"H-OX-244","subject":"헌법","unit":"기본권론","stmt":"금융위원회위원장이 2019. 12. 16. 시중 은행을 상대로 투기지역･ 투기과열지구 내 초고가 아파트(시가 15억 원 초과)에 대한 주택구입용 주택담보대출을 2019. 12. 17.부터 금지한 조치는 투기적 대출수요뿐 아니라 실수요자의 경우에도 예외 없이 대출을 금지한 점 등을 고려할 때, 해당 주택담보대출을 받고자 하는 청구인의 재산권을 침해한다. (24.1차)","answer":false,"quote":"초고가 아파트 주택담보대출 금지 조치는 재산권·계약의 자유를 제한하지만, 주택시장 안정을 위한 것으로 과잉금지원칙에 반하지 않아 침해가 아니다.","cite":"헌재 2019헌마1399","badge":"","topic":"","from":"GY-2024-1-H-18","seq":null},{"id":"H-OX-123","subject":"헌법","unit":"기본권론","stmt":"부모가 자녀의 이름을 지어주는 것은 자녀의 양육과 가족생활을 위하여 필수적인 것이고, 가족생활의 핵심적 요소라 할 수 있으므로, ‘부모가 자녀의 이름을 지을 자유’는 혼인과 가족생활을 보장하는 헌법 제36조 제1항과 행복추구권을 보장하는 헌법 제10조에 의하여 보호받는다. (23.2차)","answer":true,"quote":"자녀의 이름을 지어 주는 것은 가족생활의 핵심이라, 부모가 이름을 지을 자유는 헌법 제36조 제1항과 제10조로 보호된다.","cite":"헌재 2015헌마964","badge":"","topic":"","from":"GY-2023-2-H-20","seq":null},{"id":"H-OX-207","subject":"헌법","unit":"기본권론","stmt":"국가를 상대로 하는 당사자소송의 경우에는 가집행선고를 할 수 없다고 규정한 행정소송법 제43조는 공법상 법률 관계를 전제로 한다는 점에서 일반 사법상 법률관계와 달리 취급할 합리적 이유가 있으므로 평등원칙에 위배되지 아니한다. (22.2차)","answer":false,"quote":"재산권의 청구가 공법상 법률관계를 전제로 한다는 점만으로 국가를 상대로 하는 당사자소송에서 국가를 우대할 합리적인 이유가 있다고 할 수 없고, 집행가능성 여부에 있어서도 국가와 지방자치단체 등이 실질적인 차이가 있다고 보기 어렵다는 점에서, 심판대상조항은 국가가 당사자소송의 피고인 경우 가집행의 선고를 제한하여, 국가가 아닌 공공단체 그 밖의 권리주체가 피고인 경우에 비하여 합리적인 이유 없이 차별하고 있으므로 평등원칙에 반한다.","cite":"헌재 2020헌가12","badge":"","topic":"","from":"GY-2022-2-H-08","seq":null},{"id":"H-OX-137","subject":"헌법","unit":"기본권론","stmt":"헌법 제23조 제3항은 재산권 수용의 주체를 한정하지 않고 있으므로 그 수용의 주체를 국가 등의 공적 기관에 한정하여 해석할 이유가 없다. (24.1차)","answer":true,"quote":"헌법 제23조 제3항은 수용의 주체를 한정하지 않아, 공공필요와 보상이 갖춰지면 민간기업도 수용의 주체가 될 수 있다.","cite":"헌재 2007헌바114","badge":"","topic":"","from":"GY-2024-1-H-18","seq":null},{"id":"H-OX-211","subject":"헌법","unit":"기본권론","stmt":"대한민국을 방문하는 외국의 국가 원수를 경호하기 위하여 지정된 경호구역 안에서 서울종로경찰서장이 안전 활동의 일환으로 청구인들의 삼보일배행진을 제지한 행위는 집회의 자유를 침해한다. (22.2차)","answer":false,"quote":"나.대한민국을 방문하는 외국의 국가 원수를 경호하기 위하여 지정된 경호구역 안에서 서울종로경찰서장이 안전 활동의 일환으로 청구인들의 삼보일배행진을 제지한 행위 등(이하 ‘이 사건 공권력 행사’라 한다)이 청구인들의 집회 또는 시위의 자유를 침해하는지 여부(소극)","cite":"헌재 2019헌마1091","badge":"","topic":"","from":"GY-2022-2-H-14","seq":null},{"id":"H-OX-223","subject":"헌법","unit":"기본권론","stmt":"학교폭력 가해학생에 대해서 수개의 조치를 병과하고 출석정지 기간의 상한을 두지 않은 ｢학교폭력예방 및 대책에 관한 법률｣ 조항은 피해학생의 보호에만 치중하여 가해학생에 대해 무기한 내지 지나치게 장기간의 출석정지조치가 취해지는 경우 가해 학생에게 가혹한 결과가 초래될 수 있어 학교폭력 가해학생의 자유롭게 교육을 받을 권리를 침해한다. (23.1차)","answer":false,"quote":"재판관 서기석, 재판관 이선애의 이 사건 징계조치 조항 중 ‘출석정지’ 부분에 대한 반대의견피해학생의 보호에만 치중하여 가해학생에 대하여 무기한 내지 지나치게 장기간의 출석정지조치가 취해지는 경우 가해학생에게 가혹한 결과가 초래될 수 있고, 가해학생의 선도교육을 도모하기 위한 관점에서도 출석정지기간의 상한은 반드시 규정되어야 한다.","cite":"헌재 2017헌바140","badge":"","topic":"","from":"GY-2023-1-H-20","seq":null},{"id":"H-OX-241","subject":"헌법","unit":"기본권론","stmt":"｢집회 및 시위에 관한 법률｣상의 시위는 반드시 ‘일반인이 자유로이 통행할 수 있는 장소’에서 이루어져야 하며 ‘행진’ 등 장소 이동을 동반해야만 성립한다. (24.1차)","answer":false,"quote":"시위는 반드시 일반인이 자유로이 통행하는 장소에서 하거나 행진처럼 장소 이동을 해야 성립하는 것이 아니다.","cite":"헌재 91헌바14","badge":"","topic":"","from":"GY-2024-1-H-14","seq":null},{"id":"H-OX-227","subject":"헌법","unit":"기본권론","stmt":"헌법의 재산권 보장은 사유재산의 사용과 그 처분을 포함하는 것인바, 유언자가 생전에 최종적으로 자신의 재산권에 대하여 처분할 수 있는 법적 가능성을 의미하는 유언의 자유가 생전 증여에 의한 처분과 마찬가지로 헌법상 재산권의 보호를 받는 것은 아니다. (23.2차)","answer":false,"quote":"재산권 보장에는 처분의 자유가 포함되므로, 생전증여와 마찬가지로 유언으로 재산을 처분할 자유도 재산권의 보호를 받는다.","cite":"헌재 2007헌바128","badge":"","topic":"","from":"GY-2023-2-H-13","seq":null},{"id":"H-OX-141","subject":"헌법","unit":"기본권론","stmt":"법률에서 명시적으로 규정된 제재보다 더 가벼운 것을 하위 규칙에서 규정하더라도 만일 그것이 기본권 제한적 효과를 지니게 된다면, 이는 행정법적 법률유보원칙에 어긋나는지와 상관없이 헌법 제37조 제2항에 따라 엄격한 법률적 근거를 지녀야 한다. (24.2차)","answer":true,"quote":"법률이 정한 제재보다 가벼운 제재를 하위 규칙에 두었더라도 그것이 기본권을 제한하는 효과를 내면 법률의 근거가 있어야 한다.","cite":"헌재 2004헌마290 · 헌법 제37조","badge":"","topic":"","from":"GY-2024-2-H-06","seq":null},{"id":"H-OX-051","subject":"헌법","unit":"기본권론","stmt":"체포 구속 압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다. 다만, 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다. (22.1차)","answer":true,"quote":"③ 체포·구속·압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다. 다만, 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다.","cite":"헌법 제12조 제3항","badge":"","topic":"","from":"GY-2022-1-H-10","seq":null},{"id":"H-OX-266","subject":"헌법","unit":"기본권론","stmt":"복수국적자에 대하여 병역준비역에 편입된 때부터 3개월 이내에 대한민국 국적을 이탈하지 않으면 병역의무를 해소한 후에야 이를 가능하도록 한 ｢국적법｣ 조항은 과잉금지원칙에 위배되지 않아 국적이탈의 자유를 침해하지 않는다. (25.1차)","answer":false,"quote":"3개월 안에 이탈하지 않은 복수국적자는 병역의무 해소 전까지 예외 없이 이탈할 수 없게 한 조항은 국적이탈의 자유를 침해해 헌법불합치가 되었다.","cite":"헌재 2016헌마889","badge":"","topic":"","from":"GY-2025-1-H-09","seq":null},{"id":"H-OX-213","subject":"헌법","unit":"기본권론","stmt":"퇴직급여제도가 갖는 사회보장적 급여의 성격과 근로자의 장기간 복무 및 충실한 근무를 유도하는 기능을 감안하더라도, 소정근로시간이 1주간 15시간 미만인 이른바 ‘초단시간근로자’에 대해 퇴직급여제도 적용대상에서 제외하는 것은 “근로조건의 기준은 인간의 존엄성을 보장하도록 법률로 정하도록 규정”한 헌법 제32조 제3항에 위배된다. (22.2차)","answer":false,"quote":"가.4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자, 즉 이른바 ‘초단시간근로자’를 퇴직급여제도의 적용대상에서 제외하고 있는 ‘근로자퇴직급여 보장법’ 제4조 제1항 단서 중 ‘4주간을 평균하여 1주간의 소정근로시간이 15시간 미만인 근로자’에 관한 부분(이하 ‘심판대상조항’이라 한다)이 근로조건의 기준은 인간의 존엄성을 보장하도록 법률로 정하도록 한 헌법 제32조 제3항에 위배되는지 여부(소극)","cite":"헌재 2015헌바334","badge":"","topic":"","from":"GY-2022-2-H-18","seq":null},{"id":"H-OX-139","subject":"헌법","unit":"기본권론","stmt":"범죄피해자구조청구권은 생존권적 기본권으로서의 성격을 가지는 청구권적 기본권이다. (24.1차)","answer":true,"quote":"범죄피해자구조청구권은 국가에 구조금을 청구하는 청구권적 기본권이면서 생존권적 기본권의 성격을 함께 가진다.","cite":"헌재 2009헌마354","badge":"","topic":"","from":"GY-2024-1-H-19","seq":null},{"id":"H-OX-170","subject":"헌법","unit":"기본권론","stmt":"안경사 면허를 가진 자연인에게만 안경업소의 개설 등을 할 수 있도록 한 구 ｢의료기사 등에 관한 법률｣ 조항은 과잉금지원칙에 반하지 아니하여 자연인 안경사와 법인의 직업의 자유를 침해하지 아니한다. (25.2차)","answer":true,"quote":"안경사 면허를 가진 자연인에게만 안경업소의 개설 등을 할 수 있도록 한 구 의료기사 등에 관한 법률 제12조 제1항 및 의료기사 등에 관한 법률 제12조 제1항과, 그 위반 시 처벌하도록 정한 구 의료기사 등에 관한 법률 제30조 제1항 제6호 등(이하 위 조항들을 모두 합하여 ‘심판대상조항’이라 한다)이 과잉금지원칙에 반하여 자연인 안경사와 법인의 직업의 자유를 침해하는지 여부(소극)","cite":"헌재 2017헌가31","badge":"","topic":"","from":"GY-2025-2-H-17","seq":null},{"id":"H-OX-167","subject":"헌법","unit":"기본권론","stmt":"신앙의 자유는 그 자체가 내심의 자유의 핵심이므로 법률로써도 이를 침해할 수 없는 반면, 종교적 행위의 자유와 종교적 집회･ 결사의 자유는 신앙의 자유와는 달리 절대적 자유가 아니므로 질서유지, 공공복리 등을 위하여 제한할 수 있다. (25.2차)","answer":true,"quote":"신앙의 자유는 내심의 자유라 법률로도 침해할 수 없지만, 종교적 행위·집회·결사의 자유는 절대적 자유가 아니어서 질서유지 등을 위해 제한할 수 있다.","cite":"헌재 2000헌마159","badge":"","topic":"","from":"GY-2025-2-H-15","seq":null},{"id":"H-OX-246","subject":"헌법","unit":"기본권론","stmt":"카자흐스탄 국적의 고려인은 외국국적동포로서 ‘인간의 권리’뿐 아니라 ‘국민의 권리’에 대해서도 기본권주체성이 있다. (24.2차)","answer":false,"quote":"외국국적동포도 외국인이라 인간의 존엄·평등권 같은 「인간의 권리」에만 주체가 되고, 참정권 같은 「국민의 권리」는 누리지 못한다.","cite":"헌재 99헌마494","badge":"","topic":"","from":"GY-2024-2-H-05","seq":null},{"id":"H-OX-286","subject":"헌법","unit":"기본권론","stmt":"실업급여의 지급목적, 경제활동인구의 연령별 비율, 보험재정 상태등을모두고려하여‘65세이후고용된자’의경우｢고용보험법｣상 고용안정·직업능력개발사업의 지원대상에 포함시키면서도 실업 급여를 적용하지 않도록 한 것은 65세 이후 고용된 후 이직한 청구인의 평등권을 침해하는 것이다. (25.2차)","answer":false,"quote":"65세 이후 고용된 사람에게 실업급여를 적용하지 않는 것은 급여 목적과 보험재정 등을 고려한 것으로 합리적 이유가 있어 평등권을 침해하지 않는다.","cite":"헌재 2017헌마238","badge":"","topic":"","from":"GY-2025-2-H-19","seq":null},{"id":"H-OX-288","subject":"헌법","unit":"기본권론","stmt":"자유민주적 기본질서에 위해를 준다는 것은 구체적으로는 기본적 인권의 존중, 권력분립, 의회제도, 복수정당제도, 선거제도, 재산권의 상대화와 사회적 시장경제질서 및 사법권의 독립 등 우리의 내부 체제에 대한 단순한 위반이나 저촉도 포함한다. (26.1차)","answer":false,"quote":"자유민주적 기본질서에 위해를 준다는 것은 내부체제를 파괴·변혁하려는 것이고, 그 요소도 '사유재산과 시장경제'를 골간으로 한 경제질서다.","cite":"헌재 89헌가113","badge":"","topic":"","from":"GY-2026-1-H-01","seq":null},{"id":"H-OX-181","subject":"헌법","unit":"기본권론","stmt":"위임입법에 있어서 위임의 구체성‧명확성의 요구 정도는 처벌 법규나 조세법규와 같이 국민의 기본권을 직접적으로 제한 하거나 침해할 소지가 있는 법규에서는 구체성‧명확성의 요구가 강화되어 그 위임의 요건과 범위가 일반적인 급부행정의 경우 보다 더 엄격하게 제한적으로 규정되어야 한다. (26.1차)","answer":true,"quote":"위임의 구체성 요구는 영역마다 달라, 처벌·조세처럼 기본권을 직접 제한하는 법규는 급부행정보다 위임의 요건과 범위를 엄격하게 정해야 한다.","cite":"헌재 90헌가27 · 헌법 제75조","badge":"","topic":"","from":"GY-2026-1-H-07","seq":null},{"id":"H-OX-115","subject":"헌법","unit":"기본권론","stmt":"학교 정화구역 내에서의 극장시설 및 영업을 금지하고 있는 구 ｢학교보건법｣조항은 정화구역 내에서 극장업을 하고자 하는 자의 예술의 자유를 과도하게 침해하여 위헌이다. (23.2차)","answer":true,"quote":"학교 정화구역 안의 극장을 일률적으로 금지한 조항은 직업의 자유와 함께 표현·예술의 자유도 과도하게 침해해 위헌이다.","cite":"헌재 2003헌가1","badge":"","topic":"","from":"GY-2023-2-H-12","seq":null},{"id":"H-OX-151","subject":"헌법","unit":"기본권론","stmt":"헌법상 영장주의의 본질은 강제처분을 함에 있어 중립적인 법관이 구체적 판단을 거쳐야 한다는 점에 있는바, 수사기관이 전기통신 사업자에게 통신사실 확인자료 제공을 요청함에 있어 관할 지방 법원 또는 지원의 허가를 받도록 한 ｢통신비밀보호법｣상 조항은 헌법상 영장주의에 위배되지 아니한다. (25.1차)","answer":true,"quote":"영장주의의 핵심은 강제처분에 중립적인 법관의 판단을 거치는 것이라, 법원 허가를 받게 한 통신사실 확인자료 제공요청 조항은 영장주의에 맞다.","cite":"헌재 2012헌마191","badge":"","topic":"","from":"GY-2025-1-H-08","seq":null},{"id":"H-OX-095","subject":"헌법","unit":"기본권론","stmt":"일반적으로 집회는 일정한 장소를 전제로 하여 특정 목적을 가진 다수인이 일시적으로 회합하는 것을 말하는 것으로 일컬어 지고 있고, 그 공동의 목적은 ‘내적인 유대 관계’로 족하다. (23.1차)","answer":true,"quote":"집회는 일정한 장소에서 공동 목적을 가진 다수인이 일시적으로 모이는 것이고, 그 공동 목적은 「내적인 유대 관계」로 족하다.","cite":"헌재 2007헌바22","badge":"","topic":"","from":"GY-2023-1-H-16","seq":null},{"id":"H-OX-105","subject":"헌법","unit":"기본권론","stmt":"교도소의 안전 및 질서유지를 위하여 행해지는 규율과 징계로 인한 수용자의 기본권의 제한도 다른 방법으로는 그 목적을 달성할 수 없는 경우에만 예외적으로 허용되어야 한다. (23.2차)","answer":true,"quote":"수용시설의 질서를 위한 규율·징계로 기본권을 제한하는 것도 다른 방법으로는 목적을 이룰 수 없을 때에만 예외적으로 허용된다.","cite":"헌재 2003헌마289","badge":"","topic":"","from":"GY-2023-2-H-07","seq":null},{"id":"H-OX-278","subject":"헌법","unit":"기본권론","stmt":"국가나 지방자치단체가 공익적 기능을 직접 수행하거나 별개의 단체를 설립하여 이를 위탁한다면 입법목적을 달성하면서도 지역별 협회의 결사의 자유를 덜 제한할 수 있음에도 불구하고, 운송사업자로 구성된 협회로 하여금 연합회에 강제로 가입하게 하고 임의로 탈퇴할 수 없도록 하는 ｢화물자동차 운수사업법｣ 제50조 제1항 후문 중 ‘운송사업자로 구성된 협회’에 관한 부분은 과잉금지원칙에 위배되어 결사의 자유를 침해한다. (25.2차)","answer":false,"quote":"운송사업자로 구성된 협회로 하여금 연합회에 강제로 가입하게 하고 임의로 탈퇴할 수 없도록 하는 ‘화물자동차 운수사업법’ 제50조 제1항 후문 중 ‘운송사업자로 구성된 협회’에 관한 부분(이하 ‘심판대상조항’이라 한다)이 과잉금지원칙을 위반하여 결사의 자유를 침해하는지 여부(소극)","cite":"헌재 2018헌가8","badge":"","topic":"","from":"GY-2025-2-H-08","seq":null},{"id":"H-OX-289","subject":"헌법","unit":"기본권론","stmt":"개별 사례에서 과소보호금지원칙 위반 여부는 기본권침해가 예상되어 보호가 필요한 ‘위험상황’에 대응하는 ‘보호조치’의 내용이, 문제 되는 위험상황의 성격에 상응하는 보호조치로서 필요한 최소한의 성격을 갖고 있는지에 따라 판단하되, 그 판단이 전문적이고 기술적인 영역에 있더라도 위험상황의 성격 등은 헌법재판소의 주관적인 ‘가치판단’에 따라 판단한다. (26.1차)","answer":false,"quote":"국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 관한 보호의무를 다하지 않았는지를 헌법재판소가 심사할 때에는 ‘과소보호금지원칙’의 위반 여부를 기준으로 삼아, 개별 사례에서 기본권침해가 예상되어 보호가 필요한 ‘위험상황’에 대응하는 ‘보호조치’의 내용이, 문제 되는 위험상황의 성격에 상응하는 보호조치로서 필요한 최소한의 성격을 갖고 있는지에 따라 판단하는데, 위험상황의 성격 등은 ‘과학적 사실’과 ‘국제기준’에 근거하여 객관적으로 검토되어야 한다.","cite":"헌재 2020헌마389","badge":"","topic":"","from":"GY-2026-1-H-06","seq":null},{"id":"H-OX-127","subject":"헌법","unit":"기본권론","stmt":"독립유공자의 사망시기에 따라 그 손자녀의 보상금 지급 요건을 달리하거나 보상금 수급대상을 독립유공자의 손자녀 1명으로 한정한 ｢독립유공자예우에 관한 법률｣ 조항은 헌법에서 특히 평등을 요구하는 영역에서의 차별에 해당하지 않고 관련 기본권에 중대한 제한을 초래하지도 않는다. (24.1차)","answer":true,"quote":"독립유공자 손자녀의 보상금 요건을 사망시기로 달리하고 1명으로 한정한 것은 특히 평등을 요구하는 영역도 중대한 제한도 아니어서 완화된 심사를 한다.","cite":"헌재 2020헌마594","badge":"","topic":"","from":"GY-2024-1-H-10","seq":null},{"id":"H-OX-090","subject":"헌법","unit":"기본권론","stmt":"이 사건 법률조항 중 ‘국가안전보장에 대한 위해를 방지하기 위한 정보수집’은 국가의 존립이나 헌법의 기본질서에 대한 위험을 방지하기 위한 목적을 달성함에 있어 요구되는 최소한의 범위 내에서의 정보수집을 의미하는 것으로 해석되므로 명확성 원칙에 위배되지 않는다. (23.1차)","answer":true,"quote":"청구인들은 이 사건 법률조항 중 ‘국가안전보장에 대한 위해’의 의미가 불분명하다고 주장하나, ‘국가안전보장에 대한 위해를 방지하기 위한 정보수집’은 국가의 존립이나 헌법의 기본질서에 대한 위험을 방지하기 위한 목적을 달성함에 있어 요구되는 최소한의 범위 내에서의 정보수집을 의미하는 것으로 해석되므로, 명확성원칙에 위배되지 않는다.6.","cite":"헌재 2016헌마388","badge":"","topic":"","from":"GY-2023-1-H-13","seq":null},{"id":"H-OX-256","subject":"헌법","unit":"기본권론","stmt":"양심은 그 대상이나 내용 또는 동기에 따라서 판단될 수 있고, 특히 양심상 결정이 이성적･합리적인가, 타당한가 또는 법질서나 사회규범･도덕률과 일치하는가 하는 관점은 양심의 존재를 판단 하는 기준이 될 수 있다. (24.2차)","answer":false,"quote":"양심인지는 대상·내용·동기로 판단할 수 없고, 합리적인지나 법질서·도덕률과 맞는지도 판단 기준이 아니다.","cite":"헌재 2002헌가1","badge":"","topic":"","from":"GY-2024-2-H-12","seq":null},{"id":"H-OX-205","subject":"헌법","unit":"기본권론","stmt":"학교안전사고 예방 및 보상에 관한 법률 에 의하여 설립된 학교안전공제회는 행정관청 또는 그로부터 행정권한을 위임받은 공공단체로 공법인에 해당할 뿐, 사법인적 성격을 갖는 것은 아니므로 기본권의 주체가 될 수 없다. (22.2차)","answer":false,"quote":"학교안전공제회는 공법인적 성격과 함께 사법인적 성격도 가지므로, 그 성격의 범위에서는 기본권의 주체가 될 수 있다.","cite":"헌재 2014헌가7","badge":"","topic":"","from":"GY-2022-2-H-04","seq":null},{"id":"H-OX-112","subject":"헌법","unit":"기본권론","stmt":"공직선거에 후보자로 등록하고자 하는 자에게 실효된 형을 포함한 금고이상의 형의 범죄경력에 관한 증명서류를 제출 하도록 한 구 ｢공직선거법｣ 조항은 청구인의 사생활의 비밀과 자유를 침해한다고 볼 수 없다. (23.2차)","answer":true,"quote":"1.공직선거에 후보자로 등록하고자 하는 자가 제출하여야 하는 금고 이상의 형의 범죄경력에 실효된 형을 포함시키고 있는 공직선거법 제49조 제4항 제5호(이하 ‘이 사건 법률조항’이라 한다)가 공무담임권을 침해하는지 여부(소극)","cite":"헌재 2006헌마402","badge":"","topic":"","from":"GY-2023-2-H-11","seq":null},{"id":"H-OX-175","subject":"헌법","unit":"기본권론","stmt":"노동조합이 그 설립 당시부터 노동조합으로서 자주성 등을 갖추고 있는지를 심사하여 이를 갖추지 못한 단체의 설립신고서를 반려하도록 하는 것은 과잉금지원칙에 위반되어 근로자의 단결권을 침해한다고 볼 수 없다. (25.2차)","answer":true,"quote":"노동조합 설립신고 때 자주성 등을 심사해 갖추지 못한 단체의 신고서를 반려하게 한 것은 과잉금지원칙에 반하지 않아 단결권을 침해하지 않는다.","cite":"헌재 2011헌바53","badge":"","topic":"","from":"GY-2025-2-H-20","seq":null},{"id":"H-OX-142","subject":"헌법","unit":"기본권론","stmt":"행복추구권에는 일반적 행동자유권과 개성의 자유로운 발현권이 함축되어 있다. (24.2차)","answer":true,"quote":"행복추구권은 일반적 행동자유권과 개성의 자유로운 발현권을 품고 있어, 따로 적용할 개별 기본권이 없을 때 보충적으로 쓰인다.","cite":"헌재 89헌마204 · 헌법 제10조","badge":"","topic":"","from":"GY-2024-2-H-07","seq":null},{"id":"H-OX-291","subject":"헌법","unit":"기본권론","stmt":"금치의 징벌을 받은 수용자에 대해 금치기간 중 신문‧도서‧잡지 외 자비로 구매한 음식물, 의약품 및 의료용품 등 자비구매물품의 사용을 제한하는 것은 수용자의 일반적 행동의 자유를 침해한다. (26.1차)","answer":false,"quote":"금치 중 자비구매물품 사용 제한은 소장이 지급하는 물품으로 필요한 생활이 가능하고 처방받은 의약품은 쓸 수 있어 일반적 행동의 자유를 침해하지 않는다.","cite":"헌재 2014헌마45","badge":"","topic":"","from":"GY-2026-1-H-08","seq":null},{"id":"H-OX-072","subject":"헌법","unit":"기본권론","stmt":"집회 장소의 선택은 집회의 성과를 결정하는 주요 요인이 되므로, 집회 장소를 선택할 자유는 집회의 자유의 실질적 부분을 형성 한다고 볼 수 있다. (22.2차)","answer":true,"quote":"집회 장소는 집회의 효과를 좌우하므로, 장소를 고를 자유는 집회의 자유의 실질적 내용에 속한다.","cite":"헌재 2000헌바67","badge":"","topic":"","from":"GY-2022-2-H-14","seq":null},{"id":"H-OX-107","subject":"헌법","unit":"기본권론","stmt":"교정시설의 1인당 수용면적이 수형자의 인간으로서의 기본 욕구에 따른 생활조차 어렵게 할 만큼 지나치게 협소하다면, 이는 그 자체로 국가형벌권 행사의 한계를 넘어 수형자의 인간의 존엄과 가치를 침해하는 것이다. (23.2차)","answer":true,"quote":"수형자 1인당 수용면적이 기본적인 생활조차 어려울 만큼 좁으면 그 자체로 인간의 존엄과 가치를 침해한다.","cite":"헌재 2013헌마142","badge":"","topic":"","from":"GY-2023-2-H-08","seq":null},{"id":"H-OX-293","subject":"헌법","unit":"기본권론","stmt":"운동전용면적 300제곱미터 이하인 체력단련장업의 경우 1명 이상 체육지도자를 배치하도록 규정한 것은 체력단련장 이용자 들의 생명과 신체에 대한 안전을 확보하기 위한 것으로 목적의 정당성은 인정되나, 과잉금지원칙을 위반하여 작은 규모로 체력단련장을 영리목적으로 설치‧운영하는 체육시설업자의 직업수행의 자유를 침해한다. (26.1차)","answer":false,"quote":"300제곱미터 이하 체력단련장에도 체육지도자 1명 이상을 두게 한 것은 이용자 안전을 위한 최소한의 기준이라 직업수행의 자유를 침해하지 않는다.","cite":"헌재 2022헌마316","badge":"","topic":"","from":"GY-2026-1-H-11","seq":null},{"id":"H-OX-271","subject":"헌법","unit":"기본권론","stmt":"대체복무요원의 복무기간을 ‘36개월’로 정한 ｢대체역의 편입 및 복무 등에 관한 법률｣ 조항은, 대체복무요원의 복무강도가 통상의 현역병과 큰 차이가 나지 않도록 정해졌음에도 대체복무기간을 육군 현역병의 실제 복무기간인 18개월의 2배로 정한 것으로 과잉 금지원칙을 위반하여 대체복무요원의 양심의 자유를 침해한다. (25.1차)","answer":false,"quote":"현행 대체복무제도가 대체복무기관을 교정시설로 한정하고 복무형태는 합숙복무를 강제함으로써 대체복무요원의 복무강도가 통상의 현역병과 큰 차이가 나지 않도록 정해졌음에도 대체복무기간을 육군 현역병의 실제 복무기간인 18개월의 2배로 정한 것은 과도하다.","cite":"헌재 2022헌마707","badge":"","topic":"","from":"GY-2025-1-H-12","seq":null},{"id":"H-OX-158","subject":"헌법","unit":"기본권론","stmt":"재외선거인은 대의기관을 선출할 권리가 있는 국민으로서 대의기관의 의사결정에 대해 승인할 권리가 있으므로, 국민 투표권자에는 재외선거인이 포함된다고 보아야 한다. (25.2차)","answer":true,"quote":"재외선거인은 대의기관을 선출할 권리가 있는 국민으로서 대의기관의 의사결정에 대해 승인할 권리가 있으므로, 국민투표권자에는 재외선거인이 포함된다고 보아야 한다.","cite":"헌재 2009헌마256","badge":"","topic":"","from":"GY-2025-2-H-03","seq":null},{"id":"H-OX-255","subject":"헌법","unit":"기본권론","stmt":"국가는 국민의 기본권을 확인하고 보장할 의무가 있으므로, 어떤 사람이 양심적 병역거부를 주장하면 그 사람이 자신의 ‘양심’을 외부로 표명하여 증명하여야 하는 것이 아니라, 국가가 그 사람의 병역거부가 양심에 따른 것인지를 확인하여야 한다. (24.2차)","answer":false,"quote":"양심은 국가가 대신 확인하는 것이 아니라, 병역거부를 주장하는 사람이 자기 양심을 밖으로 드러내 증명할 최소한의 의무를 진다.","cite":"헌재 2011헌바379","badge":"","topic":"","from":"GY-2024-2-H-12","seq":null},{"id":"H-OX-046","subject":"헌법","unit":"기본권론","stmt":"헌법에서 채택하고 있는 사회국가의 원리는 자유민주적 기본 질서의 범위내에서 이루어져야 하고, 국민 개인의 자유와 창의를 보완하는 범위내에서 이루어지는 내재적 한계를 지니고 있다. (22.1차)","answer":true,"quote":"사회국가원리는 자유민주적 기본질서를 벗어날 수 없고, 개인의 자유와 창의를 대신하지 않고 보완하는 데 그친다.","cite":"헌재 2000헌마238","badge":"","topic":"","from":"GY-2022-1-H-02","seq":null},{"id":"H-OX-083","subject":"헌법","unit":"기본권론","stmt":"입양이나 재혼 등과 같이 가족관계의 변동과 새로운 가족 관계의 형성에 있어서 구체적인 사정들에 따라서는 양부 또는 계부의 성으로의 변경이 개인의 인격적 이익과 매우 밀접한 관계를 가짐에도 부성(父姓)의 사용만을 강요하여 성의 변경을 허용하지 않는 것은 개인의 인격권을 침해한다. (23.1차)","answer":true,"quote":"(3)입양이나 재혼 등과 같이 가족관계의 변동과 새로운 가족관계의 형성에 있어서 구체적인 사정들에 따라서는 양부 또는 계부 성으로의 변경이 개인의 인격적 이익과 매우 밀접한 관계를 가짐에도 부성의 사용만을 강요하여 성의 변경을 허용하지 않는 것은 개인의 인격권을 침해한다.","cite":"헌재 2003헌가5","badge":"","topic":"","from":"GY-2023-1-H-07","seq":null},{"id":"H-OX-201","subject":"헌법","unit":"기본권론","stmt":"직업의 자유에 ‘해당 직업에 합당한 보수를 받을 권리’까지 포함 되어 있다고 보아야 하므로, 경장의 1호봉 봉급월액을 중사의 1호봉 봉급월액보다 적게 규정한 것은 청구인 A의 직업수행의 자유를 침해한 것이다. (22.1차)","answer":false,"quote":"직업의 자유에 「합당한 보수를 받을 권리」는 들어 있지 않아, 봉급이 낮다고 직업수행의 자유 침해가 되지 않는다.","cite":"헌재 2007헌마444","badge":"","topic":"","from":"GY-2022-1-H-13","seq":null},{"id":"H-OX-217","subject":"헌법","unit":"기본권론","stmt":"재산권의 청구는 공법상의 법률관계를 전제로 하는 당사자소송 이라는 점에서 민사소송과 본질적으로 달라, 국가를 상대로 한 당사자소송에서 가집행선고를 제한하는 ｢행정소송법｣ 조항은 국가만을 차별적으로 우대하는 데 합리적 이유가 있으므로 평등원칙에 위반되지 않는다. (23.1차)","answer":false,"quote":"재산권의 청구가 공법상 법률관계를 전제로 한다는 점만으로 국가를 상대로 하는 당사자소송에서 국가를 우대할 합리적인 이유가 있다고 할 수 없고, 집행가능성 여부에 있어서도 국가와 지방자치단체 등이 실질적인 차이가 있다고 보기 어렵다는 점에서, 심판대상조항은 국가가 당사자소송의 피고인 경우 가집행의 선고를 제한하여, 국가가 아닌 공공단체 그 밖의 권리주체가 피고인 경우에 비하여 합리적인 이유 없이 차별하고 있으므로 평등원칙에 반한다.","cite":"헌재 2020헌가12","badge":"","topic":"","from":"GY-2023-1-H-08","seq":null},{"id":"H-OX-097","subject":"헌법","unit":"기본권론","stmt":"변호사시험 성적을 합격자에게 공개하지 않도록 규정한 구 ｢변호사시험법｣ 조항은 과잉금지원칙에 위배하여 변호사시험 합격자의 알 권리를 침해한다. (23.1차)","answer":true,"quote":"변호사시험 성적을 합격자에게 공개하지 않도록 규정한 변호사시험법 (2011. 7. 25.","cite":"헌재 2011헌마769","badge":"","topic":"","from":"GY-2023-1-H-17","seq":null},{"id":"H-OX-061","subject":"헌법","unit":"기본권론","stmt":"외국인이 복수국적을 누릴 자유는 우리 헌법상 행복추구권에 의하여 보호되는 기본권이라고 보기 어렵다. (22.2차)","answer":true,"quote":"외국인이 특정 국적을 고를 권리는 헌법상 당연히 인정되지 않으므로, 복수국적을 누릴 자유는 행복추구권의 보호대상이 아니다.","cite":"헌재 2011헌마502","badge":"","topic":"","from":"GY-2022-2-H-02","seq":null},{"id":"H-OX-251","subject":"헌법","unit":"기본권론","stmt":"국민의 거주･이전의 자유는 국외에서 체류지와 거주지를 자유 롭게 정할 수 있는 ‘해외여행 및 해외이주의 자유’와 외국에서 체류하거나 거주하려고 대한민국을 떠날 수 있는 ‘출국의 자유’를 포함하지만, 외국체류나 거주를 중단하고 다시 대한민국으로 돌아 올 수 있는 ‘입국의 자유’는 포함하지 않는다. (24.2차)","answer":false,"quote":"국민의 해외여행·해외이주의 자유에는 출국의 자유와 함께 다시 돌아올 수 있는 입국의 자유도 들어간다.","cite":"헌재 2003헌가18","badge":"","topic":"","from":"GY-2024-2-H-09","seq":null},{"id":"H-OX-188","subject":"헌법","unit":"기본권론","stmt":"검정고시로 고등학교 졸업학력을 취득한 사람들의 수시모집 지원을 제한하는 내용의 국립교육대학교 등의 ‘2017학년도 신입생 수시모집 입시요강’은 검정고시 출신자들을 합리적인 이유 없이 차별함으로써 청구인들의 균등하게 교육을 받을 권리를 침해한다. (26.1차)","answer":true,"quote":"검정고시 출신자의 교육대학 수시모집 지원을 막은 것은 합리적 이유 없는 차별이라 균등하게 교육받을 권리를 침해한다.","cite":"헌재 2016헌마649 · 헌법 제31조","badge":"","topic":"","from":"GY-2026-1-H-17","seq":null},{"id":"H-OX-178","subject":"헌법","unit":"기본권론","stmt":"헌법의 위임에 따라 국민이 되는 요건을 법률로 정할 때에는 인간의 존엄과 가치, 평등원칙 등 헌법의 요청인 기본권 보장 원칙을 준수하여야 하는 입법상의 제한을 받는다. (26.1차)","answer":true,"quote":"국민의 요건은 법률로 정하지만 입법자는 인간의 존엄과 평등원칙 같은 기본권 보장원칙을 지켜야 하고, 부계혈통주의가 위헌이 된 이유도 이것이다.","cite":"헌재 97헌가12 · 헌법 제2조","badge":"","topic":"","from":"GY-2026-1-H-05","seq":null},{"id":"H-OX-059","subject":"헌법","unit":"기본권론","stmt":"국가의 형사사법행위가 고의 과실로 인한 것으로 인정되는 경우 에는 국가배상청구 등 별개의 절차에 의하여 인과관계 있는 모든 손해를 배상받을 수 있으므로, 형사보상절차로써 인과관계 있는 모든 손해를 보상하지 않는다고 하여 반드시 부당하다고 할 수는 없다. (22.1차)","answer":true,"quote":"이 사건 보상금조항 및 이 사건 보상금 시행령조항은 보상금을 일정한 범위 내로 한정하고 있는데, 형사보상은 형사사법절차에 내재하는 불가피한 위험으로 인한 피해에 대한 보상으로서 국가의 위법？부당한 행위를 전제로 하는 국가배상과는 그 취지 자체가 상이하므로 형사보상절차로서 인과관계 있는 모든 손해를 보상하지 않는다고 하여 반드시 부당하다고 할 수는 없으며, 보상금액의 구체화？개별화를 추구할 경우에는 개별적인 보상금액을 산정하는데 상당한 기간의 소요 및 절차의 지연을 초래하여 형사보상제도의 취지에 반하는 결과가 될 위험이 크고 나아가 그로 인하여 형사보상금의 액수에 지나친 차등이 발생하여 오히려 공평의 관념을 저해할 우려가 있는바, 이 사건 보상금조항 및 이 사건 보상금시행령조항은 청구인들의 형사보상청구권을 침해한다고 볼 수 없다.","cite":"헌재 2008헌마514","badge":"","topic":"","from":"GY-2022-1-H-19","seq":null},{"id":"H-OX-292","subject":"헌법","unit":"기본권론","stmt":"도시환경정비사업의 시행자인 토지등소유자가 사업시행인가를 신청하기 전에 얻어야 하는 토지등소유자의 동의요건을 토지등 소유자가 자치적으로 정하여 운영하는 규약에 정하도록 규정한 구 ｢도시 및 주거환경정비법｣ 조항은 최소한 사업시행인가 신청에 필요한 토지등소유자의 동의정족수를 자치규약에서 정하도록 위임하였으므로 의회유보원칙에 위배되지 않는다. (26.1차)","answer":false,"quote":"사업시행인가 신청에 필요한 토지등소유자의 동의요건은 재산권에 관한 본질적 사항이라 법률이 정해야 하고, 자치규약에 맡긴 것은 의회유보원칙 위반이다.","cite":"헌재 2010헌바1","badge":"","topic":"","from":"GY-2026-1-H-09","seq":null},{"id":"H-OX-052","subject":"헌법","unit":"기본권론","stmt":"피고인의 자백이 고문 폭행 협박 구속의 부당한 장기화 또는 기망 기타의 방법에 의하여 자의로 진술된 것이 아니라고 인정될 때 또는 정식재판에 있어서 피고인의 자백이 그에게 불리한 유일한 증거일 때에는 이를 유죄의 증거로 삼거나 이를 이유로 처벌 할 수 없다. (22.1차)","answer":true,"quote":"① 모든 국민은 신체의 자유를 가진다. 누구든지 법률에 의하지 아니하고는 체포·구속·압수·수색 또는 심문을 받지 아니하며, 법률과 적법한 절차에 의하지 아니하고는 처벌·보안처분 또는 강제노역을 받지 아니한다. ② 모든 국민은 고문을 받지 아니하며, 형사상 자기에게 불리한 진술을 강요당하지 아니한다. ③ 체포·구속·압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다. 다만, 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다. ④ 누구든지 체포 또는 구속을 당한 때에는 즉시 변호인의 조력을 받을 권리를 가진다. 다만, 형사피고인이 스스로 변호인을 구할 수 없을 때에는 법률이 정하는 바에 의하여 국가가 변호인을 붙인다. ⑤ 누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니한다. 체포 또는 구속을 당한 자의 가족등 법률이 정하는 자에게는 그 이유와 일시·장소가 지체없이 통지되어야 한다. ⑥ 누구든지 체포 또는 구속을 당한 때에는 적부의 심사를 법원에 청구할 권리를 가진다. ⑦ 피고인의 자백이 고문·폭행·협박·구속의 부당한 장기화 또는 기망 기타의 방법에 의하여 자의로 진술된 것이 아니라고 인정될 때 또는 정식재판에 있어서 피고인의 자백이 그에게 불리한 유일한 증거일 때에는 이를 유죄의 증거로 삼거나 이를 이유로 처벌할 수 없다.","cite":"헌법 제12조 제1항","badge":"","topic":"","from":"GY-2022-1-H-10","seq":null},{"id":"H-OX-053","subject":"헌법","unit":"기본권론","stmt":"누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니한다. 체포 또는 구속을 당한 자의 가족 등 법률이 정하는 자에게는 그 이유와 일시 장소가 지체없이 통지되어야 한다. (22.1차)","answer":true,"quote":"⑤ 누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니한다. 체포 또는 구속을 당한 자의 가족등 법률이 정하는 자에게는 그 이유와 일시·장소가 지체없이 통지되어야 한다.","cite":"헌법 제12조 제5항","badge":"","topic":"","from":"GY-2022-1-H-10","seq":null},{"id":"H-OX-233","subject":"헌법","unit":"기본권론","stmt":"헌법을 개정하는 것은 주권자인 국민이 보유하는 가장 기본적인 권리로서 가장 강력하게 보호되어야 할 권리 중의 권리이지만, 헌법을 폐지하고 다른 내용의 헌법을 모색하는 것은 국민에게 허용되지 않는 권리이다. (24.1차)","answer":false,"quote":"헌법을 개정하는 것뿐 아니라 폐지하고 다른 내용의 헌법을 모색하는 것도 국민이 가진 가장 기본적인 권리다.","cite":"헌재 2010헌바132","badge":"","topic":"","from":"GY-2024-1-H-04","seq":null},{"id":"H-OX-179","subject":"헌법","unit":"기본권론","stmt":"헌법 제35조 제1항이 국가와 국민에게 환경보전을 위하여 노력하여야 할 의무를 부여하고 있는 점을 고려하면, 일정한 경우 국가는 사인에 의한 국민의 환경권 침해에 대해서도 적극적으로 기본권 보호조치를 취할 의무를 부담한다. (26.1차)","answer":true,"quote":"헌법 제35조 제1항이 환경보전 노력 의무를 지우므로, 국가는 일정한 경우 사인이 일으킨 환경권 침해에도 보호조치를 취할 의무가 있다.","cite":"헌재 2006헌마711 · 헌법 제35조","badge":"","topic":"","from":"GY-2026-1-H-06","seq":null},{"id":"H-OX-144","subject":"헌법","unit":"기본권론","stmt":"일반적 행동자유권에는 적극적으로 자유롭게 행동을 하는 것은 물론 소극적으로 행동을 하지 않을 자유, 즉 부작위의 자유도 포함된다. (24.2차)","answer":true,"quote":"일반적 행동자유권은 행동할 자유와 함께 하지 않을 자유도 담아, 좌석안전띠를 매지 않을 자유도 여기서 보호된다.","cite":"헌재 2002헌마518","badge":"","topic":"","from":"GY-2024-2-H-07","seq":null},{"id":"H-OX-055","subject":"헌법","unit":"기본권론","stmt":"미결수용자가 교정시설 내에서 규율위반행위 등을 이유로 금치 처분을 받은 경우 금치기간 중 서신수수, 접견, 전화통화를 제한 하는 형의 집행 및 수용자의 처우에 관한 법률 조항 중 미결 수용자에게 적용되는 부분은 미결수용자인 청구인의 통신의 자유를 침해하지 않는다. (22.1차)","answer":true,"quote":"미결수용자가 교정시설 내에서 규율위반행위 등을 이유로 금치처분을 받은 경우 금치기간 중 서신수수, 접견, 전화통화를 제한하는 ‘형의 집행 및 수용자의 처우에 관한 법률’(2007. 12. 21.","cite":"헌재 2012헌마549","badge":"","topic":"","from":"GY-2022-1-H-14","seq":null},{"id":"H-OX-236","subject":"헌법","unit":"기본권론","stmt":"국가 및 그 기관 또는 조직의 일부나 공법인은 원칙적으로 기본권의 ‘수범자’로서 기본권의 주체가 되지 못하므로, ｢주민 소환에 관한 법률｣에서 주민소환의 청구사유에 제한을 두지 아니하였다는 이유로 지방자치단체장이 자신의 공무담임권 침해를 다툴 수는 없다. (24.1차)","answer":false,"quote":"주민소환 대상인 지방자치단체장도 자기 직을 잃을 수 있는 국면에서는 공무담임권 침해를 다툴 수 있다.","cite":"헌재 2007헌마843","badge":"","topic":"","from":"GY-2024-1-H-05","seq":null},{"id":"H-OX-298","subject":"헌법","unit":"기본권론","stmt":"서울대학교 2023학년도 저소득학생 특별전형의 모집인원을 모두 수능위주전형으로 선발하도록 정한 2021. 4. 29.자 ‘서울대학교 2023학년도 대학 신입학생 입학전형 시행계획’은 저소득학생 특별전형에 응시하고자 하는 수험생들의 기회를 불합리하게 박탈하여 청구인의 균등하게 교육을 받을 권리를 침해한다. (26.1차)","answer":false,"quote":"서울대가 저소득학생 특별전형을 수능위주로 선발하게 정한 것은 대학 자율에 속하는 전형 방법 선택이어서 균등하게 교육받을 권리를 침해하지 않는다.","cite":"헌재 2021헌마929","badge":"","topic":"","from":"GY-2026-1-H-17","seq":null},{"id":"H-OX-261","subject":"헌법","unit":"기본권론","stmt":"교정시설의 장이 미결수용자에게 교정시설 내 규율위반에 대해 징벌을 부과한 뒤 그 규율위반 내용 및 징벌처분 결과 등을 관할 법원에 양형 참고자료로 통보한 것은, 법관이 양형에 참고할 수 있는 자료로 작용할 수 있어 미결수용자의 공정한 재판을 받을 권리를 제한한다. (24.2차)","answer":false,"quote":"피청구인이 미결수용자인 청구인에게 징벌을 부과한 뒤 그 규율위반 내용 및 징벌처분 결과 등을 관할 법원에 양형 참고자료로 통보한 행위(이하 ‘이 사건 통보행위’라 한다)가 청구인의 개인정보자기결정권을 침해하는지 여부(소극)","cite":"헌재 2022헌마926","badge":"","topic":"","from":"GY-2024-2-H-16","seq":null},{"id":"H-OX-185","subject":"헌법","unit":"기본권론","stmt":"헌법 제26조와 ｢청원법｣의 규정에 의할 때, 헌법상 보장된 청원권은 공권력과의 관계에서 일어나는 여러 가지 이해관계, 의견, 희망 등에 관하여 적법한 청원을 한 모든 국민에게, 국가기관이 청원을 수리‧ 심사하여 그 결과를 통지할 것을 요구할 수 있는 권리를 말한다. (26.1차)","answer":true,"quote":"청원권은 국가기관이 청원을 수리·심사하고 결과를 통지하라고 요구하는 권리일 뿐, 청원한 내용대로 처리해 달라는 권리는 아니다.","cite":"헌재 93헌마213 · 헌법 제26조","badge":"","topic":"","from":"GY-2026-1-H-15","seq":null},{"id":"H-OX-285","subject":"헌법","unit":"기본권론","stmt":"장교가 군무와 관련된 고충사항을 집단으로 진정 또는 서명하는 행위를 하는 것을 금지하고 있는 ｢군인의 지위 및 복무에 관한 기본법｣ 제31조 제1항 제5호 중 ‘장교’에 관한 부분은 과잉금지 원칙을 위반하여 청구인의 표현의 자유를 침해한다. (25.2차)","answer":false,"quote":"장교의 군무 관련 고충 집단 진정·서명 금지는 군조직의 질서와 통수체계를 지키려는 것이고 다른 고충 제기 방법도 있어 표현의 자유를 침해하지 않는다.","cite":"헌재 2021헌마1258","badge":"","topic":"","from":"GY-2025-2-H-18","seq":null},{"id":"H-OX-263","subject":"헌법","unit":"기본권론","stmt":"학칙의 제정 또는 개정에 관한 사항 등 대학평의원회의 심의 사항을 규정한 ｢고등교육법｣ 조항은 연구와 교육 등 대학의 중심적 기능에 관한 자율적 의사결정을 방해한다고 볼 수 있어, 국･공립대학 교수회 및 교수들의 대학의 자율권을 침해한다. (24.2차)","answer":false,"quote":"대학평의원회의 학칙 심의는 연구·교육이라는 대학의 중심 기능에 대한 자율적 결정을 방해하지 않아 교수회의 대학 자율권 침해가 아니다.","cite":"헌재 2018헌마872","badge":"","topic":"","from":"GY-2024-2-H-17","seq":null},{"id":"H-OX-268","subject":"헌법","unit":"기본권론","stmt":"4급 이상 공무원들의 병역 면제사유인 질병명을 관보와 인터넷을 통해 공개하도록 하는 법률조항은 병무행정에 관한 비리근절과 병역부담평등에 대한 사회적 요구를 반영한 것으로서, 신고 의무자인 공무원의 사생활의 비밀을 침해하는 것은 아니다. (25.1차)","answer":false,"quote":"병역 면제사유인 질병명은 내밀한 개인정보라, 4급 이상 공무원의 질병명을 관보·인터넷으로 모두 공개하게 한 조항은 사생활의 비밀을 침해한다.","cite":"헌재 2005헌마1139","badge":"","topic":"","from":"GY-2025-1-H-10","seq":null},{"id":"H-OX-162","subject":"헌법","unit":"기본권론","stmt":"행정소송에 관하여 변론을 종결할 때까지만 청구의 취지 또는 원인을 변경할 수 있도록 하는 ｢행정소송법｣ 제8조 제2항 가운데 ｢민사소송법｣ 제262조 제1항 본문 중 ‘변론을 종결할 때까지’ 부분을 준용하는 부분은 재판청구권을 침해한다고 볼 수 없다. (25.2차)","answer":true,"quote":"행정소송에서 변론을 종결할 때까지만 청구를 변경할 수 있게 한 것은 절차 안정을 위한 합리적 제한이라 재판청구권을 침해하지 않는다.","cite":"헌재 2019헌바244","badge":"","topic":"","from":"GY-2025-2-H-10","seq":null},{"id":"H-OX-208","subject":"헌법","unit":"기본권론","stmt":"변호인접견실에 CCTV를 설치하여 교도관이 그 CCTV를 통해 미결수용자와 변호인 간의 접견을 관찰한 행위는 변호인의 조력을 받을 권리를 침해한다. (22.2차)","answer":false,"quote":"변호인접견실 CCTV는 대화 내용을 듣거나 녹화하지 않고 사고를 막으려 지켜보는 것이라 변호인의 조력을 받을 권리를 침해하지 않는다.","cite":"헌재 2015헌마243","badge":"","topic":"","from":"GY-2022-2-H-11","seq":null},{"id":"H-OX-130","subject":"헌법","unit":"기본권론","stmt":"교육부장관이 학교법인 ○○학당에게 한 법학전문대학원 설치인가 중 여성만을 입학자격요건으로 하는 입학전형계획을 인정한 부분은 남성인 청구인의 직업선택의 자유를 제한한다. (24.1차)","answer":true,"quote":"여성만 입학할 수 있는 법학전문대학원 설치인가는 남성이 그 경로로 법조인이 되는 길을 막아 직업선택의 자유를 제한한다 — 침해는 아니었다.","cite":"헌재 2009헌마514","badge":"","topic":"","from":"GY-2024-1-H-12","seq":null},{"id":"H-OX-216","subject":"헌법","unit":"기본권론","stmt":"지역아동센터의 시설별 신고정원의 80% 이상을 돌봄취약 아동으로 구성하도록 한 보건복지부 ‘2019년 지역아동센터 지원 사업안내’ 관련 부분은 돌봄취약아동과 일반아동을 분리함 으로써 아동들의 인격권을 침해한다. (23.1차)","answer":false,"quote":"지역아동센터 정원의 80% 이상을 돌봄취약아동으로 채우게 한 것은 한정된 자원을 필요한 아동에게 주려는 것이라 인격권 침해가 아니다.","cite":"헌재 2019헌마583","badge":"","topic":"","from":"GY-2023-1-H-07","seq":null},{"id":"H-OX-166","subject":"헌법","unit":"기본권론","stmt":"사람은 자신의 의사에 반하여 얼굴을 비롯하여 일반적으로 특정인임을 식별할 수 있는 신체적 특징에 관하여 함부로 촬영당하지 아니할 권리를 가지고 있으므로, 사법경찰관이 보도자료 배포 직후 기자들의 취재 요청에 응하여 사기혐의로 구속된 청구인이 경찰서 조사실에서 양손에 수갑을 찬 채 조사받는 모습을 촬영할 수 있도록 허용한 행위는 헌법 제10조로부터 도출되는 초상권을 포함한 일반적 인격권을 제한한다고 할 것이다. (25.2차)","answer":true,"quote":"사람은 얼굴 등을 함부로 촬영당하지 않을 권리가 있어, 수갑 찬 피의자의 조사 모습을 기자들이 촬영하게 허용한 행위는 초상권을 포함한 일반적 인격권을 제한한다.","cite":"헌재 2012헌마652","badge":"","topic":"","from":"GY-2025-2-H-14","seq":null},{"id":"H-OX-260","subject":"헌법","unit":"기본권론","stmt":"영상물에 수록된 ‘19세 미만 성폭력범죄 피해자’의 진술에 관하여 조사 과정에 동석하였던 신뢰관계인의 법정진술에 의하여 그 성립의 진정함이 인정된 경우에도 증거능력을 인정 할 수 있도록 정한 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 조항 중 해당 부분은, 피고인의 형사절차상 권리의 보장과 미성년 피해자의 보호 사이의 조화를 도모한 것으로 피고인의 공정한 재판을 받을 권리를 침해하지 않는다. (24.2차)","answer":false,"quote":"영상물에 수록된 ‘19세 미만 성폭력범죄 피해자’(이하 ‘미성년 피해자’라 한다)의 진술에 관하여 조사 과정에 동석하였던 신뢰관계인 내지 진술조력인의 법정진술에 의하여 그 성립의 진정함이 인정된 경우에도 증거능력을 인정할 수 있도록 정한 ‘성폭력범죄의 처벌 등에 관한 특례법 ’ 제30조 제6항 중 ‘제1항에 따라 촬영한 영상물에 수록된 피해자의 진술은 공판준비기일 또는 공판기일에 조사 과정에 동석하였던 신뢰관계에 있는 사람 또는 진술조력인의 진술에 의하여 그 성립의 진정함이 인정된 경우에 증거로 할 수 있다’ 부분 가운데 19세 미만 성폭력범죄 피해자에 관한 부분(이하 ‘심판대상조항’이라 한다)이 과잉금지원칙을 위반하여 공정한 재판을 받을 권리를 침해하는지 여부(적극)","cite":"헌재 2018헌바524","badge":"","topic":"","from":"GY-2024-2-H-16","seq":null},{"id":"H-OX-116","subject":"헌법","unit":"기본권론","stmt":"헌법 제22조 제2항은 발명가의 권리를 법률로써 보호하도록 하고 있고, 이에 따라 ｢특허법｣은 특허권자에게 업(業)으로서 그 특허발명을 실시할 권리를 독점적으로 부여하고 있다. 따라서 특허권자가 그 특허발명의 방법에 의하여 생산한 물건에 발명의 명칭과 내용을 표시하는 것은 특허실시권에 내재된 요소이며, 그러한 표시를 제한하는 것은 곧 특허권에 대한 제한이라고 보아야 한다. (23.2차)","answer":true,"quote":"특허권자가 특허발명으로 만든 물건에 발명의 명칭과 내용을 표시하는 것은 특허실시권에 내재된 것이라, 그 표시 제한은 특허권의 제한이다.","cite":"헌재 99헌마143","badge":"","topic":"","from":"GY-2023-2-H-12","seq":null},{"id":"H-OX-224","subject":"헌법","unit":"기본권론","stmt":"행복추구권에서 도출되는 일반적 행동의 자유는 적극적으로 자유롭게 행동하는 것은 물론 소극적으로 행동을 하지 않을 자유도 포함하므로, 교통사고 발생 시 사상자 구호 등 필요한 조치를 하지 않은 자에 대한 형사처벌을 규정한 구 ｢도로교통법｣ 조항은 과잉금지원칙에 위반되어 운전자인 청구인의 일반적 행동자유권을 침해한다. (23.2차)","answer":false,"quote":"교통사고 후 사상자 구호 등 조치를 하지 않은 운전자 처벌은 일반적 행동자유권을 제한하지만 생명·신체 보호를 위한 것이라 과잉금지원칙 위반이 아니다.","cite":"헌재 2017헌가28","badge":"","topic":"","from":"GY-2023-2-H-08","seq":null},{"id":"H-OX-281","subject":"헌법","unit":"기본권론","stmt":"검찰수사관인 피청구인이 피의자신문에 참여한 변호인인 청구인에게 피의자 후방에 앉으라고 요구한 행위와 관련하여 변호인의 피의자신문참여권이 헌법상 기본권에 해당한다고 보더라도, 청구인은 적극적으로 피의자에게 진술거부권 행사를 조력하는 등 피의자신문참여권을 행사함에 있어 어떠한 지장도 받지 않았 으므로 후방착석요구행위의 목적의 정당성과 수단의 적절성을 인정할 수 있다. (25.2차)","answer":false,"quote":"변호인의 피의자신문참여권은 헌법상 기본권이고, 변호인에게 피의자 뒤에 앉으라고 요구한 행위는 목적의 정당성과 수단의 적절성부터 인정되지 않는다.","cite":"헌재 2016헌마503","badge":"","topic":"","from":"GY-2025-2-H-13","seq":null},{"id":"H-OX-063","subject":"헌법","unit":"기본권론","stmt":"헌법에 법인의 기본권 향유능력을 인정하는 명문의 규정이 없지만, 언론 출판의 자유, 재산권의 보장 등과 같이 성질상 법인이 누릴 수 있는 기본권은 법인에게 적용된다. (22.2차)","answer":true,"quote":"법인의 기본권을 정한 명문 규정은 없지만, 언론·출판의 자유나 재산권처럼 성질상 법인이 누릴 수 있는 기본권은 법인에게도 인정된다.","cite":"헌재 90헌마56","badge":"","topic":"","from":"GY-2022-2-H-04","seq":null},{"id":"H-OX-126","subject":"헌법","unit":"기본권론","stmt":"평등권으로서 교육을 받을 권리는 ‘취학･진학의 기회균등’, 즉 각자의 능력에 상응하는 교육을 받을 수 있도록 학교 입학에 있어서 자의적 차별이 금지되어야 한다는 차별금지원칙을 의미 한다. (24.1차)","answer":true,"quote":"평등권으로서 교육을 받을 권리는 취학·진학의 기회균등, 곧 학교 입학에서 자의적 차별을 받지 않을 권리를 뜻한다.","cite":"헌재 2018헌마221","badge":"","topic":"","from":"GY-2024-1-H-10","seq":null},{"id":"H-OX-169","subject":"헌법","unit":"기본권론","stmt":"피청구인 A구치소장이 구치소 내 미결수용자를 대상으로 B종교 행사를 4주에 1회, 일요일이 아닌 요일에 실시한 행위는 해당 구치소에 종교행사 공간이 1개뿐이고, 종교행사는 종교, 수형자와 미결수용자, 성별, 수용동 별로 진행되며, 미결수용자는 공범이나 동일사건 관련자가 있는 경우 이를 분리하여 참석하게 해야 하는 점 등을 고려하면 청구인의 종교의 자유를 과도하게 제한 하였다고 보기 어렵다. (25.2차)","answer":true,"quote":"종교행사 공간이 하나뿐이고 종교·수용자 구분·공범 분리 등을 고려해야 하는 사정에서, 4주 1회 평일 종교행사는 종교의 자유를 과도하게 제한한 것이 아니다.","cite":"헌재 2013헌마190","badge":"","topic":"","from":"GY-2025-2-H-15","seq":null},{"id":"H-OX-104","subject":"헌법","unit":"기본권론","stmt":"사회복무요원의 정치적 행위를 금지하는 ｢병역법｣ 제33조 제2항 본문 제2호 중 ‘그 밖의 정치단체에 가입하는 등 정치적 목적을 지닌 행위’에 관한 부분은 과잉금지원칙에 위배되어 사회복무 요원인청구인의 정치적 표현의자유및 결사의자유를 침해한다. (23.2차)","answer":true,"quote":"이 사건 법률조항 중 ‘그 밖의 정치단체에 가입하는 등 정치적 목적을 지닌 행위’에 관한 부분의 과잉금지원칙 위배 여부에서 살펴본 것과 같은 이유에서, 사회복무요원의 정치적 중립성 보장과 무관한 정당 가입 행위까지 금지하는 것은 청구인의 정당가입의 자유를 침해한다.","cite":"헌재 2019헌마534","badge":"","topic":"","from":"GY-2023-2-H-07","seq":null},{"id":"H-OX-060","subject":"헌법","unit":"기본권론","stmt":"외국인이 국적법 상 귀화요건을 갖추었더라도 법무부장관은 그 외국인의 귀화 허가 여부에 대한 재량권을 가진다. (22.2차)","answer":true,"quote":"이와 같은 귀화허가의 근거 규정의 형식과 문언, 귀화허가의 내용과 특성 등을 고려해 보면, 법무부장관은 귀화신청인이 귀화 요건을 갖추었다 하더라도 귀화를 허가할 것인지 여부에 관하여 재량권을 가진다고 보는 것이 타당하다.","cite":"대법원 2010두6496","badge":"","topic":"","from":"GY-2022-2-H-02","seq":null},{"id":"H-OX-272","subject":"헌법","unit":"기본권론","stmt":"검사의 불기소처분에 대한 항고권자를 고소인‧고발인으로 한정한 ｢검찰청법｣ 제10조 제1항 전문은 고소하지 않은 범죄피해자가 검찰항고를 하지 못하게 하므로 재판청구권을 제한한다. (25.1차)","answer":false,"quote":"고소하지 않은 피해자가 재정신청을 못하는 것은 형사소송법 규정 때문이고 항고권자 한정 조항은 간접적 관련뿐이어서 재판청구권을 제한하지 않는다.","cite":"헌재 2021헌마248","badge":"","topic":"","from":"GY-2025-1-H-14","seq":null},{"id":"H-OX-226","subject":"헌법","unit":"기본권론","stmt":"회원제 골프장용 부동산의 재산세에 대하여 1천분의 40의 중과세율을 규정한 구 ｢지방세법｣조항은 모든 회원제 골프장을 동일하게 취급하고 있는바, 이는 회원제 골프장 운영자 등의 재산권을 침해하는 것으로서 과잉금지원칙에 반하여 헌법에 위반된다. (23.2차)","answer":false,"quote":"심판대상조항은 회원권의 가격, 이용자 중 비회원의 비율, 비회원의 독자적 이용 가능성 등 골프장의 사치성 정도를 평가할 수 있는 다양한 요소들을 전혀 반영하지 아니하고, 모든 회원제 골프장을 동일하게 취급하고 있는바, 이는 회원제 골프장 운영자 등의 재산권을 침해하는 것으로서 과잉금지원칙에 반하여 헌법 에 위반된다.","cite":"헌재 2016헌가17","badge":"","topic":"","from":"GY-2023-2-H-13","seq":null},{"id":"H-OX-088","subject":"헌법","unit":"기본권론","stmt":"헌법 제12조 제4항 본문에 규정된 “구속”은 사법절차에서 이루어진 구속뿐 아니라 행정절차에서 이루어진 구속까지 포함하는 개념으로, 헌법 제12조 제4항 본문에 규정된 변호인의 조력을 받을 권리는 행정절차에서 구속을 당한 사람에게도 즉시 보장된다. (23.1차)","answer":true,"quote":"헌법 제12조 제4항의 「구속」에는 행정절차상 구속도 포함되어, 행정절차에서 구속된 사람에게도 변호인 조력권이 즉시 보장된다.","cite":"헌재 2014헌마346","badge":"","topic":"","from":"GY-2023-1-H-12","seq":null},{"id":"H-OX-202","subject":"헌법","unit":"기본권론","stmt":"경찰공무원과 군인은 공무원보수규정 상의 봉급표에 있어서 본질적으로 동일 유사한 지위에 있다고 볼 수 없으므로 청구인 A의 평등권 침해는 문제되지 않는다. (22.1차)","answer":false,"quote":"보수 책정에서 경찰공무원과 군인은 모두 생명·신체의 위험을 지는 본질적으로 같은 집단이라 평등권 심사의 비교집단이 된다.","cite":"헌재 2007헌마444","badge":"","topic":"","from":"GY-2022-1-H-13","seq":null},{"id":"H-OX-135","subject":"헌법","unit":"기본권론","stmt":"어린이집에 폐쇄회로 텔레비전(CCTV: Closed Circuit Television)을 원칙적으로 설치하도록 정한 ｢영유아보육법｣ 조항은 CCTV 설치로 보육교사 및 영유아의 신체나 행동이 그대로 CCTV에 촬영･녹화된다는 점에서 보육교사 및 영유아의 사생활의 비밀과 자유를 제한한다. (24.1차)","answer":true,"quote":"어린이집 CCTV 설치 의무는 보육교사와 영유아의 모습이 촬영·녹화되므로 사생활의 비밀과 자유를 제한한다 — 침해는 아니었다.","cite":"헌재 2015헌마994","badge":"","topic":"","from":"GY-2024-1-H-15","seq":null},{"id":"H-OX-230","subject":"헌법","unit":"기본권론","stmt":"학교급식의 실시에 필요한 시설･설비에 요하는 경비를 원칙적으로 학교의 설립･경영자가 부담하도록 한 ｢학교급식법｣조항은 사립학교 운영의 자유를 필요한 범위를 넘어서 지나치게 제한하고 있고 공익의 비중에 비추어 사립학교에게 과도한 부담을 지우는 것이라고 볼 수 있으므로 사립학교 운영의 자유를 침해한다. (23.2차)","answer":false,"quote":"급식시설·설비 경비를 원칙적으로 학교 설립·경영자가 부담하게 한 것은 사립학교 운영의 자유를 과도하게 제한하지 않는다.","cite":"헌재 2009헌바40","badge":"","topic":"","from":"GY-2023-2-H-15","seq":null},{"id":"H-OX-164","subject":"헌법","unit":"기본권론","stmt":"청구인이 국가안전기획부 면회실에서 그의 변호인과 접견할 때, 국가안전기획부 소속직원인 수사관이 참여하여 대화 내용을 듣거나 기록한 것은 헌법 제12조 제4항이 규정한 변호인의 조력을 받을 권리를 침해한 것으로서 헌법에 위배된다. (25.2차)","answer":true,"quote":"구속된 사람이 변호인과 접견할 때 수사관이 참여해 대화를 듣고 기록하면 자유로운 접견이 불가능해져 변호인의 조력을 받을 권리를 침해한다.","cite":"헌재 91헌마111","badge":"","topic":"","from":"GY-2025-2-H-13","seq":null},{"id":"H-OX-196","subject":"헌법","unit":"기본권론","stmt":"육군 장교가 민간법원에서 약식명령을 받아 확정되면 자진 신고할 의무를 규정한, ‘2020년도 장교 진급 지시’의 해당 부분 중‘민간법원에서약식명령을 받아 확정된 사실이있는 자’에 관한 부분은 청구인인 육군 장교의 일반적 행동의 자유를 침해한다. (22.1차)","answer":false,"quote":"장교에게 민간법원 약식명령 확정 사실을 자진신고하게 한 것은 진급 심사에 필요하고 부담이 작아 일반적 행동의 자유 침해가 아니다.","cite":"헌재 2020헌마12","badge":"","topic":"","from":"GY-2022-1-H-08","seq":null},{"id":"H-OX-279","subject":"헌법","unit":"기본권론","stmt":"별건으로 공소제기 후 확정되어 검사가 보관하고 있는 서류에 대하여 법원의 열람·등사 허용 결정이 있었음에도 검사가 청구인에 대한 형사사건과의 관련성을 부정하면서 해당 서류의 열람·등사를 허용하지 아니한 행위는 청구인의 신속·공정한 재판을 받을 권리 및 변호인의 조력을 받을 권리를 침해하지 아니한다. (25.2차)","answer":false,"quote":"법원이 열람·등사를 허용했는데도 검사가 관련성을 부정하며 거부하면, 신속·공정한 재판을 받을 권리와 변호인의 조력을 받을 권리를 침해한다.","cite":"헌재 2019헌마356","badge":"","topic":"","from":"GY-2025-2-H-10","seq":null},{"id":"H-OX-108","subject":"헌법","unit":"기본권론","stmt":"자기책임원리는 자기결정권의 한계논리로서 책임부담의 근거로 기능하는 동시에, 자기가 결정하지 않은 것이나 결정할 수 없는 것에 대하여는 책임을 지지 않고 책임부담의 범위도 스스로 결정한 결과 내지 그와 상관관계가 있는 부분에 국한됨을 의미하는 책임의 한정원리로 기능한다. (23.2차)","answer":true,"quote":"자기책임원리는 스스로 결정한 데 대한 책임의 근거이자, 결정하지 않은 일에는 책임을 지지 않는다는 책임의 한정원리로 작동한다.","cite":"헌재 2019헌바139","badge":"","topic":"","from":"GY-2023-2-H-08","seq":null},{"id":"H-OX-145","subject":"헌법","unit":"기본권론","stmt":"헌법 제17조가 보호하고자 하는 기본권은 ‘사생활영역’의 자유로운 형성과 비밀유지라고 할 것이며, 공적인 영역의 활동은 다른 기본권에 의한 보호는 별론으로 하고 사생활의 비밀과 자유가 보호하는 것은 아니라고 할 것이다. (24.2차)","answer":true,"quote":"제17조는 사생활 영역의 형성과 비밀을 지킬 뿐이라, 도로에서 안전띠를 매는 일 같은 공적 영역의 활동은 여기서 보호되지 않는다.","cite":"헌재 2002헌마518 · 헌법 제17조","badge":"","topic":"","from":"GY-2024-2-H-11","seq":null},{"id":"H-OX-076","subject":"헌법","unit":"기본권론","stmt":"헌법 제22조 제2항은 저작자 발명가 과학기술자와 예술가의 권리는 법률로써 보호한다고 하여 학문과 예술의 자유를 제도적 으로 뒷받침해 주고 학문과 예술의 자유에 내포된 문화국가실현의 실효성을 높이기 위하여 저작자 등의 권리보호를 국가의 과제로 규정하고 있다. (22.2차)","answer":true,"quote":"저작자·발명가·과학기술자·예술가의 권리를 법률로 보호하게 한 것은 학문·예술의 자유를 제도로 뒷받침하려는 것이다.","cite":"헌법 제22조","badge":"","topic":"","from":"GY-2022-2-H-15","seq":null},{"id":"H-OX-068","subject":"헌법","unit":"기본권론","stmt":"변호인의 조력을 받을 권리란 국가권력의 일방적인 형벌권 행사에 대항하여 자신에게 부여된 헌법상 소송법상 권리를 효율적이고 독립적으로 행사하기 위하여 변호인의 도움을 얻을 피의자 및 피고인의 권리를 말한다. (22.2차)","answer":true,"quote":"변호인의 조력을 받을 권리는 피의자·피고인이 국가 형벌권에 맞서 자기 권리를 효율적이고 독립적으로 행사하도록 변호인의 도움을 받을 권리다.","cite":"헌재 2015헌마243","badge":"","topic":"","from":"GY-2022-2-H-11","seq":null},{"id":"H-OX-119","subject":"헌법","unit":"기본권론","stmt":"헌법 제31조 제4항에 의해 보장되는 교육의 자주성과 전문성은 ‘교육기관의 자유’와 ‘교육의 자유’를 보장함으로써 비로소 달성할 수 있는데, ‘교육기관의 자유’는 교육을 담당하는 교육 기관의 교육운영에 관한 자주적인 결정권을 그 내용으로 하고, ‘교육의 자유’는 교육내용이나 교육방법 등에 관한 자주적인 결정권을 그 내용으로 한다. (23.2차)","answer":true,"quote":"교육의 자주성·전문성은 교육기관이 운영을 스스로 정하는 「교육기관의 자유」와 교육내용·방법을 정하는 「교육의 자유」로 실현된다.","cite":"헌법 제31조","badge":"","topic":"","from":"GY-2023-2-H-15","seq":null},{"id":"H-OX-103","subject":"헌법","unit":"기본권론","stmt":"｢국가공무원법｣제66조 제1항 본문 중 ‘그 밖에 공무 외의 일을 위한 집단행위’ 부분은 ‘공익에 반하는 목적을 위하여 직무전념 의무를 해태하는 등의 영향을 가져오는 집단적 행위’라고 한정하여 해석하는 한 명확성 원칙에 위반되지 않는다. (23.2차)","answer":true,"quote":"어떠한 표현행위가 과연 ‘공익’을 해하는 것인지, 아닌지에 관한 판단은 사람마다의 가치관, 윤리관에 따라 크게 달라질 수밖에 없고, 법집행자의 통상적 해석을 통하여 그 의미내용을 객관적으로 확정할 수 있는 개념이라고 보기 어려운바, ‘공무 외의 일을 위한 집단행위’를 ‘공익에 반하는 목적을 위하여 직무전념의무를 해태하는 등의 영향을 가져오는 집단적 행위’라고 축소 해석한다고 하더라도 여전히 그 의미는 불명확할 수밖에 없으므로 명확성원칙에 위반된다.","cite":"헌재 2011헌바32","badge":"","topic":"","from":"GY-2023-2-H-07","seq":null},{"id":"H-OX-065","subject":"헌법","unit":"기본권론","stmt":"국가라 할지라도 국고작용으로 인한 민사관계에 있어서는 일반인과 같이 원칙적으로 대등하게 다루어져야 하며 국가 라고 하여 우대하여야 할 헌법상의 근거가 없다. (22.2차)","answer":true,"quote":"국가도 권력작용이 아닌 국고작용으로 생긴 민사관계에서는 일반인과 대등하게 다뤄야 하고, 국가라고 우대할 헌법상 근거가 없다.","cite":"헌재 88헌가7","badge":"","topic":"","from":"GY-2022-2-H-08","seq":null},{"id":"H-OX-253","subject":"헌법","unit":"기본권론","stmt":"교도소장이 수형자의 정신과진료 현장과 정신과 화상진료 현장에 각각 간호직교도관을 입회시킨 것은, 수형자에게 사생활 노출 염려로 솔직한 증세를 의사에게 전달하지 못하게 함으로써 해당 수형자의 사생활의 비밀과 자유를 침해한다. (24.2차)","answer":false,"quote":"정신과 진료에 간호직교도관을 입회시킨 것은 자해·타해 등 교정사고를 막기 위한 것으로, 수형자의 사생활의 비밀과 자유 침해가 아니다.","cite":"헌재 2020헌마1725","badge":"","topic":"","from":"GY-2024-2-H-11","seq":null},{"id":"H-OX-155","subject":"헌법","unit":"기본권론","stmt":"고등학교 퇴학일부터 검정고시 공고일까지의 기간이 6개월 이상이 되지 않은 사람은 고졸검정고시에 응시할 수 없도록 규정한 ｢초‧중등교육법 시행규칙｣ 제35조 제6항 제2호 본문 중 ‘고등학교’에 관한 부분은 고등학교를 자진퇴학한 청구인들의 교육을 받을 권리를 침해한다고 볼 수 없다. (25.1차)","answer":true,"quote":"고등학교 퇴학일부터 검정고시 공고일까지의 기간이 6개월 이상이 되지 않은 사람은 고졸검정고시에 응시할 수 없도록 규정한 ‘초ㆍ중등교육법 시행규칙’ 제35조 제6항 제2호 본문 중 ‘고등학교’에 관한 부분(이하 ‘심판대상조항’이라 한다)이 고등학교를 자진퇴학한 청구인들의 교육을 받을 권리를 침해하는지 여부(소극)","cite":"헌재 2020헌마1512","badge":"","topic":"","from":"GY-2025-1-H-17","seq":null},{"id":"H-OX-204","subject":"헌법","unit":"기본권론","stmt":"소환된 증인 또는 그 친족 등이 보복을 당할 우려가 있는 경우, 재판장은 피고인을 퇴정시키고 증인신문을 행할 수 있도록 규정한 특정범죄신고자 등 보호법 조항은 피고인의 형사소송법 상의 반대신문권을 제한하고 있어 피고인의 공정한 재판을 받을 권리를 침해한다. (22.1차)","answer":false,"quote":"보복 우려로 피고인을 퇴정시켜도 변호인 반대신문과 진술 요지 고지가 보장되어 공정한 재판을 받을 권리 침해가 아니다.","cite":"헌재 2009헌바57","badge":"","topic":"","from":"GY-2022-1-H-18","seq":null},{"id":"H-OX-214","subject":"헌법","unit":"기본권론","stmt":"법인도 그 성질에 반하지 않는 범위 내에서 인격권의 한 내용인 사회적 신용이나 명예 등의 주체가 될 수 있으나, 방송사업자가 심의규정을 위반한 경우 그 의사에 반하여 ‘시청자에 대한 사과’를 명령할 수 있도록 규정한 구 ｢방송법｣ 조항은 방송 사업자의 인격권을 제한하는 것은 아니다. (23.1차)","answer":false,"quote":"방송사업자에게 의사에 반해 시청자 사과를 명하는 것은 법인의 사회적 신용·명예라는 인격권을 제한하고, 결국 침해로 위헌이 되었다.","cite":"헌재 2009헌가27","badge":"","topic":"","from":"GY-2023-1-H-05","seq":null},{"id":"H-OX-075","subject":"헌법","unit":"기본권론","stmt":"자신의 미적 감상 등을 문신시술을 통하여 시각적으로 표현할 수 있다는 측면에서 문신시술이 예술의 자유 또는 표현의 자유의 영역에 포함될 수 있다. (22.2차)","answer":true,"quote":"문신시술은 미적 감상을 시각적으로 표현하는 면이 있어 예술·표현의 자유 영역에 들 수 있지만, 비의료인 금지는 합헌이었다.","cite":"헌재 2017헌마1343","badge":"","topic":"","from":"GY-2022-2-H-15","seq":null},{"id":"H-OX-066","subject":"헌법","unit":"기본권론","stmt":"형사재판에 계속 중인 사람에 대하여 출국을 금지할 수 있다고 규정한 출입국관리법 조항에 따른 법무부장관의 출국금지결정은 형사재판에 계속 중인 국민의 출국의 자유를 제한하는 행정처분일 뿐이고, 영장주의가 적용되는 신체에 대하여 직접적으로 물리적 강제력을 수반하는 강제처분이라고 할 수는 없다. (22.2차)","answer":true,"quote":"출국금지결정은 출국의 자유를 제한하는 행정처분일 뿐 신체에 물리적 강제력을 쓰는 강제처분이 아니어서 영장주의가 적용되지 않는다.","cite":"헌재 2012헌바302","badge":"","topic":"","from":"GY-2022-2-H-10","seq":null},{"id":"H-OX-273","subject":"헌법","unit":"기본권론","stmt":"한국대학교육협의회가 2018. 8. 30. 공표한 ‘2021학년도 대학입학 전형기본사항’ Ⅱ. 3. 다. (6) 재외국민과 외국인 특별전형 중 ‘지원자격에 따른 부모 및 학생의 세부 지원자격’ 가운데 ‘해외근무자의 배우자의 체류’에 관한 부분은 신뢰보호원칙에 반하여 학생인 청구인의 균등하게 교육받을 권리를 침해한다. (25.1차)","answer":false,"quote":"재외국민 특별전형에 해외근무자 배우자의 체류 요건을 둔 것은 예측할 수 있었던 변경이라, 신뢰보호원칙에 반하지 않고 교육받을 권리도 침해하지 않는다.","cite":"헌재 2019헌마212","badge":"","topic":"","from":"GY-2025-1-H-17","seq":null},{"id":"H-OX-215","subject":"헌법","unit":"기본권론","stmt":"업무상과실 또는 중대한 과실로 인한 교통사고로 말미암아 피해자로 하여금 상해에 이르게 하였으나 보험 등에 가입한 경우 운전자에 대한 공소를 제기할 수 없도록 한 구 ｢교통사고처리 특례법｣ 조항은 교통사고 피해자의 생명･신체의 안전에 관한 국가의 기본권 보호의무를 명백히 위반한 것이다. (23.1차)","answer":false,"quote":"교통사고처리특례법 제4조 제1항 본문 중 업무상과실 또는 중대한 과실로 인한 교통사고로 말미암아 피해자로 하여금 상해에 이르게 한 경우 공소를 제기할 수 없도록 한 부분(이하, ‘이 사건 법률조항’이라 한다)이 교통사고 피해자의 재판절차진술권을 침해하는지 여부(일부 적극)","cite":"헌재 2005헌마764","badge":"","topic":"","from":"GY-2023-1-H-06","seq":null},{"id":"H-OX-168","subject":"헌법","unit":"기본권론","stmt":"종교단체가 종교적 행사를 위하여 종교집회장 내에 납골시설을 설치하여 운영하는 것은 종교행사의 자유와 관련된 것이라고 할 것이고, 그러한 납골시설의 설치를 금지하는 것은 종교행사의 자유를 제한하는 결과로 된다. (25.2차)","answer":true,"quote":"종교단체가 종교집회장 안에 납골시설을 두어 운영하는 것은 종교행사의 자유와 관련되므로, 그 설치 금지는 종교행사의 자유를 제한하는 결과가 된다.","cite":"헌재 2008헌가2","badge":"","topic":"","from":"GY-2025-2-H-15","seq":null},{"id":"H-OX-267","subject":"헌법","unit":"기본권론","stmt":"헌법 제14조의 거주‧이전의 자유는 대한민국 영토 안에서 국가의 간섭이나 방해를 받지 않고 생활의 근거지와 거주지를 임의로 선택할 수 있는 자유를 뜻하는 것이지, 자신이 소속된 국적을 버리거나 변경할 자유, 즉 국적이탈의 자유가 포함되는 것은 아니다. (25.1차)","answer":false,"quote":"거주·이전의 자유에는 해외여행·이주의 자유와 함께 국적을 버리거나 바꿀 국적이탈의 자유도 들어간다.","cite":"헌재 2005헌마739","badge":"","topic":"","from":"GY-2025-1-H-09","seq":null},{"id":"H-OX-254","subject":"헌법","unit":"기본권론","stmt":"어린이집에 폐쇄회로 텔레비전(CCTV)을 원칙적으로 설치 하도록 정한 ｢영유아보호법｣ 조항은 보호자 전원이 반대하지 않는 한 어린이집에 의무적으로 CCTV를 설치하도록 정하고 있으므로 어린이집 보육교사(원장 포함) 및 영유아의 사생활의 비밀과 자유를 침해한다. (24.2차)","answer":false,"quote":"어린이집 CCTV 의무설치는 안전사고·아동학대를 막기 위한 것이고 보호자 전원이 반대하면 설치하지 않으므로 사생활의 비밀과 자유 침해가 아니다.","cite":"헌재 2015헌마994","badge":"","topic":"","from":"GY-2024-2-H-11","seq":null},{"id":"H-OX-245","subject":"헌법","unit":"기본권론","stmt":"범죄피해자구조청구권은 국민의 권리로서 외국인에게는 인정되지 않는 권리이므로 외국인이 ｢범죄피해자 보호법｣에 따른 범죄 피해구조금을 신청할 수는 없다. (24.1차)","answer":false,"quote":"외국인도 그 나라와 상호보증이 있으면 범죄피해자 보호법에 따라 구조금을 신청할 수 있다.","cite":"범죄피해자 보호법 제23조","badge":"","topic":"","from":"GY-2024-1-H-19","seq":null},{"id":"H-OX-085","subject":"헌법","unit":"기본권론","stmt":"보상금의 지급을 신청할 수 있는 자의 범위를 ‘내부 공익신고자’로 한정함으로써 ‘외부 공익신고자’를 보상금 지급대상에서 배제 하도록 정한 ｢공익신고자 보호법｣ 조항 중 ‘내부 공익신고자’ 부분은 평등원칙에 위배되지 않는다. (23.1차)","answer":true,"quote":"‘공익신고자 보호법’상 보상금의 지급을 신청할 수 있는 자의 범위를 ‘내부 공익신고자’로 한정함으로써 ‘외부 공익신고자’를 보상금 지급대상에서 배제하도록 정한, ‘공익신고자 보호법’ 제26조 제1항 중 ‘내부 공익신고자’ 부분(이하 ‘이 사건 법률조항’이라 한다)이 평등원칙에 위배되는지 여부(소극)","cite":"헌재 2018헌바127","badge":"","topic":"","from":"GY-2023-1-H-08","seq":null},{"id":"H-OX-149","subject":"헌법","unit":"기본권론","stmt":"‘대통령긴급조치 제9호’는 학생의 모든 집회･시위와 정치관여 행위를 금지하고, 위반자에 대하여는 주무부장관이 학생의 제적을 명하고 소속 학교의 휴업, 휴교, 폐쇄조치를 할 수 있도록 규정하여, 학생의 집회･시위의 자유, 학문의 자유와 대학의 자율성 내지 대학자치의 원칙을 본질적으로 침해한다. (24.2차)","answer":true,"quote":"긴급조치 제9호는 학생의 집회·시위와 정치관여를 전면 금지하고 제적·휴교까지 허용해 학문의 자유와 대학 자율성을 본질적으로 침해했다.","cite":"헌재 2010헌바132","badge":"","topic":"","from":"GY-2024-2-H-17","seq":null},{"id":"H-OX-237","subject":"헌법","unit":"기본권론","stmt":"기본권을 제한하는 규정은 기본권행사의 ‘방법’과 ‘여부’에 관한 규정으로 구분할 수 있다. 방법의 적절성의 관점에서, 입법자는 우선 기본권행사의 ‘방법’에 관한 규제로써 공익을 실현할 수 있는가를 시도하고 이러한 방법으로는 공익달성이 어렵다고 판단되는 경우에 기본권행사의 ‘여부’에 관한 규제를 선택해야 한다. (24.1차)","answer":false,"quote":"기본권 행사의 「방법」 규제를 먼저 시도하고 안 될 때 「여부」를 규제하라는 것은 방법의 적절성이 아니라 침해의 최소성의 요구다.","cite":"헌재 96헌가5","badge":"","topic":"","from":"GY-2024-1-H-07","seq":null},{"id":"H-OX-089","subject":"헌법","unit":"기본권론","stmt":"헌법상 영장주의는 체포･구속･압수･수색 등 기본권을 제한하는 강제처분에 적용되므로 강제력이 개입되지 않은 임의수사에 해당하는 乙의 통신자료 취득에 영장주의가 적용되지 않는다. (23.1차)","answer":true,"quote":"헌법상 영장주의는 체포ㆍ구속ㆍ압수ㆍ수색 등 기본권을 제한하는 강제처분에 적용되므로, 강제력이 개입되지 않은 임의수사에 해당하는 수사기관 등의 통신자료 취득에는 영장주의가 적용되지 않는다.5.","cite":"헌재 2016헌마388","badge":"","topic":"","from":"GY-2023-1-H-13","seq":null},{"id":"H-OX-106","subject":"헌법","unit":"기본권론","stmt":"일반적 행동자유권은 가치있는 행동만 보호영역으로 하는 것은 아니므로, 개인이 대마를 자유롭게 수수하고 흡연할 자유도 헌법 제10조의 행복추구권에서 나오는 일반적 행동자유권의 보호영역에 속한다. (23.2차)","answer":true,"quote":"일반적 행동자유권은 가치 있는 행동만 보호하지 않아, 대마를 수수하고 흡연할 자유도 보호영역에 들어간다 — 제한의 정당성은 따로 본다.","cite":"헌재 2005헌바46","badge":"","topic":"","from":"GY-2023-2-H-08","seq":null},{"id":"H-OX-270","subject":"헌법","unit":"기본권론","stmt":"헌법 제17조가 보호하고자 하는 기본권은 ‘사생활영역’의 자유 로운 형성과 비밀유지라고 할 것이며, 공적인 영역의 활동이라 하더라도 사생활의 비밀과 자유의 보호대상에 포함된다. (25.1차)","answer":false,"quote":"공적 영역의 활동은 다른 기본권으로 보호될 수는 있어도, 사생활의 비밀과 자유가 보호하는 대상은 아니다.","cite":"헌재 2002헌마518 · 헌법 제17조","badge":"","topic":"","from":"GY-2025-1-H-10","seq":null},{"id":"H-OX-165","subject":"헌법","unit":"기본권론","stmt":"배아생성자는 배아에 대해 자신의 유전자정보가 담긴 신체의 일부를 제공하고, 또 배아가 모체에 성공적으로 착상하여 인간으로 출생할 경우 생물학적 부모로서의 지위를 갖게 되므로, 배아의 관리 또는 처분에 대한 결정권을 가진다. 이러한 배아생성자의 배아에 대한 결정권은 헌법상 명문으로 규정되어 있지는 아니하지만, 헌법 제10조로부터 도출되는 일반적 인격권의 한 유형으로서의 헌법상 권리라 할 것이다. (25.2차)","answer":true,"quote":"배아생성자는 유전자정보가 담긴 신체 일부를 제공했고 장차 부모가 될 수 있어, 배아의 관리·처분을 결정할 권리를 가진다 — 헌법 제10조의 일반적 인격권에서 나온다.","cite":"헌재 2005헌마346","badge":"","topic":"","from":"GY-2025-2-H-14","seq":null},{"id":"H-OX-099","subject":"헌법","unit":"기본권론","stmt":"청원서를 접수한 국가기관은 이를 수리･심사하여 그 결과를 통지하여야 할 헌법에서 유래하는 작위의무를 지고 있고, 이에 상응하여 청원인에게는 청원에 대하여 위와 같은 적정한 처리를 할 것을 요구할 수 있는 권리가 있다. (23.1차)","answer":true,"quote":"청원을 받은 국가기관은 수리·심사하고 결과를 통지할 헌법상 작위의무를 지고, 청원인은 그 적정한 처리를 요구할 권리가 있다.","cite":"헌재 93헌마213","badge":"","topic":"","from":"GY-2023-1-H-19","seq":null},{"id":"H-OX-250","subject":"헌법","unit":"기본권론","stmt":"아프가니스탄 등 전쟁이나 테러위험이 있는 해외 위난지역에서 여권 사용을 제한하거나 방문 또는 체류를 금지한 외교통상부 고시는 거주･이전의 자유를 침해한다. (24.2차)","answer":false,"quote":"전쟁·테러 위험지역의 여권 사용 제한과 방문·체류 금지는 국민의 생명·신체를 지키려는 것이라 거주·이전의 자유를 침해하지 않는다.","cite":"헌재 2007헌마1366","badge":"","topic":"","from":"GY-2024-2-H-09","seq":null},{"id":"H-OX-171","subject":"헌법","unit":"기본권론","stmt":"농협·축협 조합장이 금고 이상의 형을 선고받고 그 형이 확정되지 아니한 경우에도 이사가 그 직무를 대행하도록 규정한 ｢농업협동조합법｣ 조항은 과잉금지원칙에 반하여 조합장인 청구인들의 직업수행의 자유를 침해한다. (25.2차)","answer":true,"quote":"농협ㆍ축협 조합장이 금고 이상의 형을 선고받고 그 형이 확정되지 아니한 경우에도 이사가 그 직무를 대행하도록 규정한 농업협동조합법 (2009. 6. 9.","cite":"헌재 2010헌마562","badge":"","topic":"","from":"GY-2025-2-H-17","seq":null},{"id":"H-OX-294","subject":"헌법","unit":"기본권론","stmt":"증권의 모집‧사모와 관련하여 거짓 기재가 된 문서 등을 사용 하여 재산상 이익을 얻고자 하는 행위를 금지하고 이를 위반한 경우 처벌하도록 규정한 구 ｢자본시장법｣ 조항은 상장절차와 관계없는 비상장회사의 증권모집에도 적용되므로 과잉금지 원칙에 반하여 직업의 자유를 침해한다. (26.1차)","answer":false,"quote":"증권 모집 때 거짓 기재 문서로 이익을 얻으려는 행위는 비상장회사라도 투자자를 속이는 해악이 같아, 처벌해도 직업의 자유를 침해하지 않는다.","cite":"헌재 2020헌바118","badge":"","topic":"","from":"GY-2026-1-H-11","seq":null},{"id":"H-OX-143","subject":"헌법","unit":"기본권론","stmt":"무상 또는 일회적･일시적으로 가르치는 행위는 일반적 행동 자유권에 속한다. (24.2차)","answer":true,"quote":"직업은 어느 정도 지속적인 소득활동이어야 하므로, 무상이거나 한두 번 가르치는 행위는 직업의 자유가 아니라 일반적 행동자유권으로 보호된다.","cite":"헌재 98헌가16","badge":"","topic":"","from":"GY-2024-2-H-07","seq":null},{"id":"H-OX-077","subject":"헌법","unit":"기본권론","stmt":"인간다운 생활을 할 권리는 자연인의 권리이므로 법인에게는 인정되지 않고, 또한 국민의 권리이므로 원칙적으로 외국인에게는 인정되지 아니한다. (22.2차)","answer":true,"quote":"인간다운 생활을 할 권리는 자연인의 권리라 법인에게는 없고, 국민의 권리여서 외국인에게는 원칙적으로 인정되지 않는다.","cite":"헌법 제34조","badge":"","topic":"","from":"GY-2022-2-H-17","seq":null},{"id":"H-OX-209","subject":"헌법","unit":"기본권론","stmt":"기독교재단이 설립한 사립대학에서 6학기 동안 대학예배에 참석할 것을 졸업요건으로 하는 학칙은 비록 위 대학예배가 복음 전도나 종교인 양성에 직접적인 목표가 있는 것이 아니고 신앙을 가지지 않을 자유를 침해하지 않는 범위 내에서 학생들 에게 종교교육을 함으로써 진리·사랑에 기초한 보편적 교양인을 양성하는 데 목표를 두고 있다고 하더라도 헌법상 보장된 종교의 자유를 침해하는 것이다. (22.2차)","answer":false,"quote":"기독교 재단이 설립한 사립대학이 학칙으로 대학예배의 6학기 참석을 졸업요건으로 정한 경우, 위 대학교의 대학예배는 목사에 의한 예배뿐만 아니라 강연이나 드라마 등 다양한 형식을 취하고 있고 학생들에 대하여도 예배시간의 참석만을 졸업의 요건으로 할 뿐 그 태도나 성과 등을 평가하지는 않는 사실 등에 비추어 볼 때, 위 대학교의 예배는 복음 전도나 종교인 양성에 직접적인 목표가 있는 것이 아니고 신앙을 가지지 않을 자유를 침해하지 않는 범위 내에서 학생들에게 종교교육을 함으로써 진리·사랑에 기초한 보편적 교양인을 양성하는 데 목표를 두고 있다고 할 것이므로, 대학예배에의 6학기 참석을 졸업요건으로 정한 위 대학교의 학칙은 헌법상 종교의 자유에 반하는 위헌무효의 학칙이 아니라고 본 사례.","cite":"대법원 96다37268","badge":"","topic":"","from":"GY-2022-2-H-12","seq":null},{"id":"H-OX-242","subject":"헌법","unit":"기본권론","stmt":"집회의 자유에 대한 제한은 다른 중요한 법익의 보호를 위하여 반드시 필요한 경우에 한하여 정당화되는 것이며, 특히 집회의 금지는 원칙적으로 공공의 안녕질서에 대한 위협이 예상되는 경우에 한하여 허용될 수 있다. (24.1차)","answer":false,"quote":"집회 금지는 공공의 안녕질서에 대한 위협이 「예상되는」 정도가 아니라 직접적인 위협이 명백히 존재할 때에만 허용된다.","cite":"헌재 2000헌바67","badge":"","topic":"","from":"GY-2024-1-H-14","seq":null},{"id":"H-OX-118","subject":"헌법","unit":"기본권론","stmt":"헌법 제31조 제1항의 ‘교육을 받을 권리’는 국가로부터 교육에 필요한 시설의 제공을 요구할 수 있는 권리 및 각자의 능력에 따라 교육시설에 입학하여 배울 수 있는 권리를 의미한다. (23.2차)","answer":true,"quote":"교육을 받을 권리는 국가에 교육시설 제공을 요구할 권리와 능력에 따라 교육시설에 입학해 배울 권리를 함께 담는다.","cite":"헌법 제31조","badge":"","topic":"","from":"GY-2023-2-H-15","seq":null},{"id":"H-OX-070","subject":"헌법","unit":"기본권론","stmt":"지방자치단체가 유서 깊은 천주교 성당 일대를 문화관광지로 조성하기 위하여 상급단체로부터 문화관광지 조성계획을 승인받은 후 사업부지 내 토지 등을 수용재결한 것은 헌법의 정교분리원칙에 위배되지 않는다. (22.2차)","answer":true,"quote":"지방자치단체가 유서 깊은 천주교 성당 일대를 문화관광지로 조성하기 위하여 상급 단체로부터 문화관광지 조성계획을 승인받은 후 사업부지 내 토지 등을 수용재결한 사안에서, 위 성당을 문화재로 보호할 가치가 충분하고 위 문화관광지 조성계획은 지방자치단체가 지역경제의 활성화를 도모하기 위하여 추진한 것으로 보이며 특정 종교를 우대·조장하거나 배타적 특권을 부여하는 것으로 볼 수 없어, 그 계획의 승인과 그에 따른 토지 등 수용재결이 헌법의 정교분리원칙이나 평등권에 위배되지 않는다고 한 사례.","cite":"대법원 2008두16933","badge":"","topic":"","from":"GY-2022-2-H-12","seq":null},{"id":"H-OX-153","subject":"헌법","unit":"기본권론","stmt":"피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 다른 종류의 형을 선고하지 못하도록 하는 ｢형사소송법｣ 제457조의2 제1항은 공정한 재판을 받을 권리를 침해하지 아니한다. (25.1차)","answer":true,"quote":"피고인이 정식재판을 청구한 사건에 대하여는 약식명령의 형보다 중한 종류의 형을 선고하지 못하도록 하는 형사소송법 제457조의2 제1항(이하 ‘심판대상조항’이라 한다)이 공정한 재판을 받을 권리를 침해하는지 여부(소극)","cite":"헌재 2021헌바6","badge":"","topic":"","from":"GY-2025-1-H-14","seq":null},{"id":"H-OX-117","subject":"헌법","unit":"기본권론","stmt":"인간다운 생활을 할 권리로부터 인간의 존엄에 상응하는 생활에 필요한 ‘최소한의 물질적인 생활’의 유지에 필요한 급부를 요구할 수 있는 구체적인 권리가 상황에 따라서는 직접 도출 될 수 있어도, 동 기본권이 직접 그 이상의 급부를 내용으로 하는 구체적인 권리까지 발생케 한다고 볼 수 없다. (23.2차)","answer":true,"quote":"인간다운 생활을 할 권리에서 직접 나오는 구체적 권리는 최소한의 물질적 생활에 필요한 급부까지이고, 그 이상은 입법으로 정해진다.","cite":"헌재 93헌가14","badge":"","topic":"","from":"GY-2023-2-H-14","seq":null},{"id":"H-OX-081","subject":"헌법","unit":"기본권론","stmt":"직업공무원제도는 헌법과 법률에 의하여 공무원의 신분이 보장되는 공직구조에 관한 제도이며, 여기서 말하는 공무원에는 정치적 공무원이라든가 임시적 공무원은 포함되지 않는다. (23.1차)","answer":true,"quote":"직업공무원제도가 보호하는 공무원은 신분이 보장되는 협의의 공무원이고, 정치적 공무원이나 임시적 공무원은 포함되지 않는다.","cite":"헌재 89헌마32","badge":"","topic":"","from":"GY-2023-1-H-04","seq":null},{"id":"H-OX-087","subject":"헌법","unit":"기본권론","stmt":"변호인과 상담하고 조언을 구할 권리는 변호인의 조력을 받을 권리의 내용 중 구체적인 입법형성이 필요한 다른 절차적 권리의 필수적인 전제요건으로서 변호인의 조력을 받을 권리 그 자체에서 막바로 도출되는 것이다. (23.1차)","answer":true,"quote":"변호인과 상담하고 조언을 구할 권리는 다른 절차적 권리의 전제라, 입법이 없어도 변호인 조력권에서 바로 나온다.","cite":"헌재 2000헌마138","badge":"","topic":"","from":"GY-2023-1-H-12","seq":null},{"id":"H-OX-220","subject":"헌법","unit":"기본권론","stmt":"현역입영 또는 소집 통지서를 받은 사람이 정당한 사유 없이 입영일이나 소집일부터 3일이 지나도 입영하지 아니하거나 소집에 응하지 아니한 경우를 처벌하는 ｢병역법｣ 처벌조항은 과잉금지 원칙을 위반하여 양심적 병역거부자의 양심의 자유를 침해한다. (23.1차)","answer":false,"quote":"현역입영 또는 소집 통지서를 받은 사람이 정당한 사유 없이 입영일이나 소집일부터 3일이 지나도 입영하지 아니하거나 소집에 응하지 아니한 경우를 처벌하는, 2009. 6. 9.","cite":"헌재 2011헌바379","badge":"","topic":"","from":"GY-2023-1-H-15","seq":null},{"id":"H-OX-157","subject":"헌법","unit":"기본권론","stmt":"LPG를 연료로 사용할 수 있는 자동차 또는 그 사용자의 범위를 제한하고 있는 ｢액화석유가스의 안전관리 및 사업법 시행규칙｣ 제40조는 LPG를 운송연료로 사용할 수 있는 자동차 또는 그 사용자의 범위를 제한하는 규정일 뿐이므로 청구인들의 환경권을 제한한다고 볼 수 없다. (25.1차)","answer":true,"quote":"LPG 사용 자동차·사용자의 범위를 정한 시행규칙은 연료 사용 범위를 제한하는 규정일 뿐이라, 환경권을 제한하는 것으로 보지 않았다.","cite":"헌재 2015헌마997","badge":"","topic":"","from":"GY-2025-1-H-20","seq":null},{"id":"H-OX-100","subject":"헌법","unit":"기본권론","stmt":"검정고시로 고등학교 졸업학력을 취득한 사람들(검정고시 출신자)의 수시모집 지원을 제한하는 내용의 국립교육대학교 수시모집 입시요강은 검정고시 출신자를 합리적인 이유 없이 차별함으로써 균등하게 교육을 받을 권리를 침해한다. (23.1차)","answer":true,"quote":"검정고시 출신자의 국립교대 수시모집 지원을 막은 입시요강은 합리적 이유 없는 차별로 균등하게 교육받을 권리를 침해한다.","cite":"헌재 2016헌마649","badge":"","topic":"","from":"GY-2023-1-H-20","seq":null},{"id":"H-OX-148","subject":"헌법","unit":"기본권론","stmt":"2009. 6. 1.부터 2009. 10. 8.까지 구치소 내에서 실시하는 종교의식 또는 행사에 일률적으로 미결수용자의 참석을 금지한 구치소장의 종교행사 등 참석불허 처우는, 미결수용자의 기본권을 덜 침해하는 수단이 존재함에도 불구하고 이를 전혀 고려하지 아니하였으므로 과잉금지원칙을 위반하여 미결수용자의 종교의 자유를 침해하였다. (24.2차)","answer":true,"quote":"미결수용자의 종교행사 참석을 일률적으로 막은 처우는 공범 분리 같은 덜 침해적인 수단을 검토하지 않아 종교의 자유를 침해한다.","cite":"헌재 2009헌마527","badge":"","topic":"","from":"GY-2024-2-H-13","seq":null},{"id":"H-OX-050","subject":"헌법","unit":"기본권론","stmt":"헌법 제10조 전문의 행복추구권에는 일반적 행동자유권이 포함되는바, 이는 적극적으로 자유롭게 행동을 하는 것은 물론 소극적으로 행동을 하지 않을 자유도 포함하는 권리로 포괄적인 의미의 자유권이다. (22.1차)","answer":true,"quote":"행복추구권에서 나오는 일반적 행동자유권에는 하고 싶은 일을 할 자유뿐 아니라 하기 싫은 일을 하지 않을 자유도 들어간다.","cite":"헌법 제10조","badge":"","topic":"","from":"GY-2022-1-H-08","seq":null},{"id":"H-OX-152","subject":"헌법","unit":"기본권론","stmt":"‘패킷감청’의 방식으로 이루어지는 인터넷회선 감청은 현대 사회에 가장 널리 이용되는 의사소통 수단인 인터넷 통신망을 통해 송‧수신하는 전기통신에 대한 감청을 범죄수사를 위한 통신제한조치의 하나로 정하고 있으므로, 일차적으로 헌법 제18조가 보장하는 통신의 비밀과 자유를 제한한다. (25.1차)","answer":true,"quote":"패킷감청은 인터넷회선으로 오가는 전기통신 전체를 감청하는 것이라 일차적으로 통신의 비밀과 자유를 제한하며, 헌법불합치가 선고되었다.","cite":"헌재 2016헌마263 · 헌법 제18조","badge":"","topic":"","from":"GY-2025-1-H-11","seq":null},{"id":"H-OX-140","subject":"헌법","unit":"기본권론","stmt":"｢범죄피해자 보호법｣에서 제척기간을 범죄피해가 발생한 날부터 5년으로 정하더라도, 5년이라는 기간이 지나치게 단기라든지 불합리하여 범죄피해자의 구조청구권 행사를 현저히 곤란하게 하거나 사실상 불가능하게 하는 것으로는 볼 수 없다. (24.1차)","answer":true,"quote":"구조금 신청기간을 피해 발생일부터 5년으로 제한한 옛 조항은 권리행사를 현저히 곤란하게 하지 않아 합헌이었다 — 시험일 당시 법은 발생일부터 10년이다.","cite":"헌재 2009헌마354 · 범죄피해자 보호법 제25조","badge":"","topic":"","from":"GY-2024-1-H-19","seq":null},{"id":"H-OX-249","subject":"헌법","unit":"기본권론","stmt":"수사기관 등이 전기통신사업자에게 이용자의 성명 등 통신자료의 열람이나 제출을 요청할 수 있도록 한 ｢전기통신사업법｣ 조항은, 효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 정보주체인 이용자에게 그 내역을 통지하도록 하는 것이 적절하지 않기 때문에 사후통지절차를 두지 않더라도 적법절차원칙에 위배되지 않는다. (24.2차)","answer":false,"quote":"효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 사전에 정보주체인 이용자에게 그 내역을 통지하도록 하는 것이 적절하지 않다면 수사기관 등이 통신자료를 취득한 이후에 수사 등 정보수집의 목적에 방해가 되지 않는 범위 내에서 통신자료의 취득사실을 이용자에게 통지하는 것이 얼마든지 가능하다.","cite":"헌재 2016헌마388","badge":"","topic":"","from":"GY-2024-2-H-08","seq":null},{"id":"H-OX-228","subject":"헌법","unit":"기본권론","stmt":"전기통신금융사기의 피해자가 피해구제 신청을 하는 경우, 피해자의 자금이 송금･이체된 계좌 및 해당 계좌로부터 자금의 이전에 이용된 계좌를 지급정지하는 ｢전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법｣조항은 과잉금지원칙을 위반하여 청구인의 재산권을 침해한다. (23.2차)","answer":false,"quote":"보이스피싱 피해 신청 시 사기이용계좌를 지급정지하는 것은 피해금 인출을 막기 위한 것이고 이의제기 절차도 있어 재산권 침해가 아니다.","cite":"헌재 2019헌마579","badge":"","topic":"","from":"GY-2023-2-H-13","seq":null},{"id":"H-OX-138","subject":"헌법","unit":"기본권론","stmt":"상업용 음반 등에 관한 저작재산권자의 공연권 및 저작인접권자의 보상청구권은 헌법 제23조에 의하여 보장되는 재산적 가치가 있는 권리에 해당한다. (24.1차)","answer":true,"quote":"음반 공연권이나 저작인접권자의 보상청구권처럼 법률로 생긴 권리도 재산적 가치가 있으면 헌법상 재산권으로 보호된다.","cite":"헌재 2016헌마1115","badge":"","topic":"","from":"GY-2024-1-H-18","seq":null},{"id":"H-OX-275","subject":"헌법","unit":"기본권론","stmt":"재요양을 받는 경우에 재요양 당시의 임금을 기준으로 휴업급여를 산정하도록 한 구 ｢산업재해보상보험법｣ 제56조 제1항과 재요양 당시 임금이 없으면 최저임금액을 기준으로 휴업급여를 지급 하도록 한 ｢산업재해보상보험법｣ 제56조 제2항은 근로자의 인간다운 생활을 할 권리를 침해한다. (25.1차)","answer":false,"quote":"재요양 당시 임금 기준이 늘 불리하지 않고 임금이 없으면 최저임금액을 보장하므로, 이 휴업급여 산정은 인간다운 생활을 할 권리 침해가 아니다.","cite":"헌재 2021헌바316","badge":"","topic":"","from":"GY-2025-1-H-19","seq":null},{"id":"H-OX-190","subject":"헌법","unit":"기본권론","stmt":"사립유치원의 교비회계에 속하는 예산‧결산 및 회계 업무를 교육부장관이 지정하는 정보처리장치로 처리하도록 규정한 ｢사학기관 재무‧회계 규칙｣ 조항은 사립유치원의 회계투명성을 제고하기 위한 것이므로 사립유치원 설립‧경영자의 사립학교 운영의 자유를 침해한다고 볼 수 없다. (26.1차)","answer":true,"quote":"사립유치원의 교비회계에 속하는 예산ㆍ결산 및 회계 업무를 교육부장관이 지정하는 정보처리장치로 처리하도록 규정한 ‘사학기관 재무ㆍ회계 규칙’ 본문 중 유아교육법 제7조 제3호에 따른 사립유치원에 관한 부분(이하 ‘이 사건 규칙’이라 한다)이 사립유치원을 운영하는 청구인들의 사립학교 운영의 자유를 침해하는지 여부(소극)","cite":"헌재 2019헌마542","badge":"","topic":"","from":"GY-2026-1-H-18","seq":null},{"id":"H-OX-198","subject":"헌법","unit":"기본권론","stmt":"헌법 제21조 제4항 전문은 “언론 출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니 된다.”라고 규정하고 있는바, 이는 헌법상 표현의 자유의 보호영역에 대한 한계를 설정한 것이라고 보아야 한다. (22.1차)","answer":false,"quote":"헌법 제21조 제4항은 언론·출판의 책임과 제한 요건을 밝힌 규정이지 표현의 자유 보호영역의 한계를 정한 것이 아니다.","cite":"헌재 2006헌바109 · 헌법 제21조","badge":"","topic":"","from":"GY-2022-1-H-09","seq":null},{"id":"H-OX-296","subject":"헌법","unit":"기본권론","stmt":"행정청이 아닌 사업주체가 새로이 설치한 공공시설이 그 시설을 관리할 관리청에 무상으로 귀속되도록 한 구 ｢주택건설촉진법｣ 조항은, 그 실질은 공공시설의 설치와 그 비용부담자 등에 관하여 규율하고 있으나 재산권의 법률적 수용이라는 법적 외관을 가지고 있으므로, 이를 심사하려면 그것이 헌법 제23조 제3항에 따른 정당한 보상의 원칙에 위배되었는지 여부가 검토되어야 한다. (26.1차)","answer":false,"quote":"사업주체가 새로 설치한 공공시설의 무상귀속은 수용이 아니라 재산권의 내용과 한계를 정한 것이라, 정당보상 원칙이 아니라 비례원칙으로 심사한다.","cite":"헌재 2014헌바177 · 헌법 제23조","badge":"","topic":"","from":"GY-2026-1-H-12","seq":null},{"id":"H-OX-225","subject":"헌법","unit":"기본권론","stmt":"구 ｢영화진흥법｣이 제한상영가 상영등급분류의 구체적 기준을 영상물등급위원회의 규정에 위임하고 있는 것은 그 내용이 사회현상에 따라 급변하는 내용들이고, 특별히 전문성이 요구 되는 기술적인 사항에 해당한다고 할 것이므로 포괄위임금지 원칙에 위배되지 않는다. (23.2차)","answer":false,"quote":"제한상영가 등급분류 기준은 급변하거나 전문적·기술적인 사항이 아닌데도 법률에 아무 기준 없이 영상물등급위원회 규정에 넘겨 포괄위임금지원칙에 위배된다.","cite":"헌재 2007헌가4","badge":"","topic":"","from":"GY-2023-2-H-12","seq":null},{"id":"H-OX-080","subject":"헌법","unit":"기본권론","stmt":"국방의 의무는 직접적인 병력형성의 의무뿐만 아니라 향토 예비군설치법 , 민방위기본법 등에 의한 간접적인 병력형성 의무 및 병력형성 이후 군작전 명령에 복종하고 협력하여야 할 의무를 포함하는 것이다. (22.2차)","answer":true,"quote":"국방의 의무는 군 복무 같은 직접적 병력형성뿐 아니라 예비군·민방위 같은 간접적 병력형성과 군작전 협력 의무까지 포함한다.","cite":"헌재 2002헌바45","badge":"","topic":"","from":"GY-2022-2-H-20","seq":null},{"id":"H-OX-150","subject":"헌법","unit":"기본권론","stmt":"병역의무를 부과하게 되면 그 의무자의 기본권은 여러 가지 면 에서 제약을 받으므로, 법률에 의한 병역의무 형성에도 헌법적 한계가 없다고 할 수 없고 헌법의 일반원칙, 기본권보장 정신에 의한 한계를 준수하여야 한다. (24.2차)","answer":true,"quote":"병역의무를 법률로 정할 때도 헌법의 일반원칙과 기본권보장 정신이라는 한계를 지켜야 하나, 병역 부과 자체에 따른 제한은 불가피한 것으로 본다.","cite":"헌재 2011헌마825","badge":"","topic":"","from":"GY-2024-2-H-20","seq":null},{"id":"H-OX-128","subject":"헌법","unit":"기본권론","stmt":"행정절차상 강제처분에 의해 신체의 자유가 제한되는 경우 강제 처분의 집행기관으로부터 독립된 중립적인 기관이 이를 통제 하도록 하는 것은 적법절차원칙의 중요한 내용에 해당한다. (24.1차)","answer":true,"quote":"행정절차상 강제처분으로 신체의 자유가 제한될 때도 집행기관과 독립된 중립적 기관의 통제를 받게 하는 것이 적법절차원칙의 중요한 내용이다.","cite":"헌재 2020헌가1","badge":"","topic":"","from":"GY-2024-1-H-11","seq":null},{"id":"H-OX-132","subject":"헌법","unit":"기본권론","stmt":"표현의 자유는 국민 개인적인 차원에서는 자유로운 인격발현의 수단임과 동시에 합리적이고 건설적인 의사형성 및 진리발견의 수단이 되며, 국가와 사회적인 차원에서는 민주주의 국가와 사회의 존립과 발전에 필수불가결한 기본권이다. (24.1차)","answer":true,"quote":"표현의 자유는 개인에게는 인격발현과 진리발견의 수단이고, 사회에는 민주주의의 존립과 발전에 없어서는 안 될 기본권이다.","cite":"헌재 2020헌마1724","badge":"","topic":"","from":"GY-2024-1-H-13","seq":null},{"id":"H-OX-264","subject":"헌법","unit":"기본권론","stmt":"대학의 학문과 연구 활동에서 중요한 역할을 담당하는 교원 에게 그와 관련된 영역에서 주도적인 역할을 인정하는 것은 대학의 자율성의 본질에 부합하고 필요하며, 그것은 교육과 연구에 관한 사항은 모두 교원이 전적으로 결정할 수 있어야 한다는 의미이다. (24.2차)","answer":false,"quote":"교원에게 교육·연구의 주도적 역할을 인정한다는 것이 그 사항을 모두 교원이 전적으로 결정해야 한다는 뜻은 아니다.","cite":"헌재 2018헌마872","badge":"","topic":"","from":"GY-2024-2-H-17","seq":null},{"id":"H-OX-192","subject":"헌법","unit":"기본권론","stmt":"노동조합으로 하여금 행정관청이 요구하는 경우에 결산결과와 운영사항을 보고하도록 하고, 이에 위반한 경우 과태료를 부과 하도록 규정한 ｢노동조합 및 노동관계조정법｣ 조항은 과잉금지 원칙을 위반하여 노동조합의 단결권을 침해하지 아니한다. (26.1차)","answer":true,"quote":"행정관청이 요구하면 결산결과와 운영상황을 보고하게 한 것은 노조 운영의 투명성을 위한 최소한의 요구라 단결권을 침해하지 않는다.","cite":"헌재 2012헌바116 · 노동조합 및 노동관계조정법 제27조","badge":"","topic":"","from":"GY-2026-1-H-19","seq":null},{"id":"H-OX-067","subject":"헌법","unit":"기본권론","stmt":"영장주의는 구속개시 시점에 있어서 신체의 자유에 대한 박탈의 허용만이 아니라 그 구속영장의 효력을 계속 유지할 것인지 아니면 정지 또는 실효시킬 것인지 여부의 결정도 오직 법관의 판단에 의하여만 결정되어야 한다는 것을 의미한다. (22.2차)","answer":true,"quote":"영장주의는 구속을 시작할 때뿐 아니라 구속영장의 효력을 유지·정지·실효할지도 법관이 정해야 한다는 뜻이다.","cite":"헌재 2011헌가36","badge":"","topic":"","from":"GY-2022-2-H-10","seq":null},{"id":"H-OX-299","subject":"헌법","unit":"기본권론","stmt":"학교장의 중임 횟수는 사립학교의 설립 목적 달성과 밀접한 연관을 가지는 사립학교 운영의 핵심적인 사항으로 학교법인의 자율적인 판단과 결정을 존중할 필요가 있으므로, 사립 초‧중등 학교의 장을 1회에 한하여 중임할 수 있도록 하는 구 ｢사립학교법｣ 제53조 제3항 단서는 학교법인의 사립학교 운영의 자유를 침해하여 헌법에 위반된다. (26.1차)","answer":false,"quote":"학교장의 중임 횟수는 사립학교의 설립목적 달성과 밀접한 연관을 가지는 사립학교 운영의 핵심적인 사항으로 학교법인의 자율적인 판단과 결정을 존중할 필요가 있다.","cite":"헌재 2018헌바522","badge":"","topic":"","from":"GY-2026-1-H-18","seq":null},{"id":"H-OX-101","subject":"헌법","unit":"기본권론","stmt":"헌법은 국가의 교육권한과 부모의 교육권의 범주 내에서 학생 에게도 자신의 교육에 관하여 스스로 결정할 권리, 즉 자유롭게 교육을 받을 권리를 부여하고, 학생은 국가의 간섭을 받지 아니하고 자신의 능력과 개성, 적성에 맞는 학교를 자유롭게 선택할 권리를 가진다. (23.1차)","answer":true,"quote":"학생도 국가·부모의 교육권 범위 안에서 자유롭게 교육받을 권리를 가지며, 능력과 적성에 맞는 학교를 자유롭게 고를 수 있다.","cite":"헌재 2011헌마827","badge":"","topic":"","from":"GY-2023-1-H-20","seq":null},{"id":"H-OX-193","subject":"헌법","unit":"기본권론","stmt":"입양신고 시 신고사건 본인이 시‧읍‧면에 출석하지 아니하는 경우에는 신고사건 본인의 신분증명서를 제시하도록 한 ｢가족 관계의 등록 등에 관한 법률｣ 조항은 입양당사자의 신고의사의 진실성을 담보하기 위한 것으로서 입양당사자의 가족생활의 자유를 침해한다고 보기 어렵다. (26.1차)","answer":true,"quote":"입양신고 때 본인이 나오지 않으면 신분증명서를 내게 한 것은 신고의사가 진실한지 확인하려는 것이어서 가족생활의 자유를 침해하지 않는다.","cite":"헌재 2019헌바108","badge":"","topic":"","from":"GY-2026-1-H-20","seq":null},{"id":"H-OX-154","subject":"헌법","unit":"기본권론","stmt":"기피신청에 대한 결정이 확정되기 전에 기피신청을 당한 법관으로 하여금 소송절차를 정지하지 않고 종국판결을 선고할 수 있도록 하는 ｢민사소송법｣ 제48조 단서 중 ‘종국판결을 선고하거나’에 관한 부분은 공정한 재판을 받을 권리를 침해하지 않는다. (25.1차)","answer":true,"quote":"기피결정이 확정되기 전에도 종국판결을 선고할 수 있게 한 것은 기피신청을 이용한 소송 지연을 막으려는 것으로, 공정한 재판을 받을 권리 침해가 아니다.","cite":"헌재 2021헌바146","badge":"","topic":"","from":"GY-2025-1-H-14","seq":null},{"id":"H-OX-232","subject":"헌법","unit":"기본권론","stmt":"태어난 즉시 ‘출생등록 될 권리’는 헌법상의 기본권이 아니라 법률상의 권리이므로 ‘혼인 중 여자와 남편 아닌 남자 사이에서 출생한 자녀에 대한 생부의 출생신고’를 허용하도록 규정하지 아니한 ｢가족관계의 등록 등에 관한 법률｣ 조항이 혼인외 출생자인 청구인들의 태어난 즉시 ‘출생등록 될 권리’를 침해하는 것은 아니다. (23.2차)","answer":false,"quote":"태어난 즉시 출생등록될 권리는 법률상 권리가 아니라 헌법상 기본권이고, 생부의 출생신고를 막은 조항은 이를 침해해 헌법불합치다.","cite":"헌재 2021헌마975","badge":"","topic":"","from":"GY-2023-2-H-20","seq":null},{"id":"H-OX-078","subject":"헌법","unit":"기본권론","stmt":"근로의 권리는 사회적 기본권으로서 국가에 대하여 직접 일자리를 청구하거나 일자리에 갈음하는 생계비의 지급을 청구할 수 있는 권리를 의미하는 것이 아니라 고용증진을 위한 사회적 경제적 정책을 요구할 수 있는 권리에 그치며, 근로의 권리로부터 국가에 대한 직접적인 직장존속청구권이 도출되는 것도 아니다. (22.2차)","answer":true,"quote":"근로의 권리는 일자리나 생계비를 직접 청구할 권리가 아니라 고용증진 정책을 요구할 권리이고, 직장존속청구권도 나오지 않는다.","cite":"헌재 2001헌바50","badge":"","topic":"","from":"GY-2022-2-H-18","seq":null},{"id":"H-OX-191","subject":"헌법","unit":"기본권론","stmt":"최저임금 산입을 위하여 임금지급 주기에 관한 취업규칙을 변경하는 경우 노동조합 또는 근로자 과반수의 동의를 받을 필요가 없도록 규정한 ｢최저임금법｣ 조항은 과잉금지원칙에 위배되어 청구인들의 단체교섭권을 침해한다고 볼 수 없다. (26.1차)","answer":true,"quote":"최저임금 산입을 위해 임금지급 주기를 바꾸는 취업규칙 변경에 노조·과반수의 동의 대신 의견만 듣게 한 특례는 단체교섭권을 침해하지 않는다.","cite":"헌재 2018헌마629","badge":"","topic":"","from":"GY-2026-1-H-19","seq":null},{"id":"H-OX-183","subject":"헌법","unit":"기본권론","stmt":"수형자라 하더라도 확정되지 않은 별도의 형사재판에서만큼은 미결수용자와 같은 지위에 있으므로, 형사재판의 피고인으로 출석 하는 수형자에 대하여 사복착용을 허용하지 않는 것은 수형자의 공정한 재판을 받을 권리, 인격권, 행복추구권을 침해한다. (26.1차)","answer":true,"quote":"수형자도 확정되지 않은 별도 형사재판에서는 피고인이어서, 사복착용을 막으면 공정한 재판을 받을 권리와 인격권을 침해한다 — 민사재판 출석은 다르다.","cite":"헌재 2013헌마712","badge":"","topic":"","from":"GY-2026-1-H-08","seq":null},{"id":"H-OX-295","subject":"헌법","unit":"기본권론","stmt":"근로계약 체결 시 사용자로 하여금 임금, 소정근로시간, 휴일 등에 관한 사항을 근로자에게 서면 교부의 방법으로 명시하도록 하고 위반시 500만 원 이하의 벌금에 처하도록 한 ｢근로기준법｣ 조항은, 사용자에 대한 직업의 자유 제한의 정도가 과도하여 사용자인 청구인의 직업의 자유를 침해한다. (26.1차)","answer":false,"quote":"근로조건 서면 명시·교부 의무는 분쟁이 생겼을 때 근로자를 지키는 최소한의 장치이고 사용자 부담도 크지 않아 직업의 자유를 침해하지 않는다.","cite":"헌재 2022헌바154 · 근로기준법 제17조","badge":"","topic":"","from":"GY-2026-1-H-11","seq":null},{"id":"H-OX-113","subject":"헌법","unit":"기본권론","stmt":"금융감독원의 4급 이상 직원에 대하여 재산등록의무를 부과하는 구 ｢공직자윤리법｣ 제3조 제1항 제13호 중 구 ｢공직자윤리법 시행령｣ 제3조 제4항 제15호에 관한 부분이 금융감독원의 4급 직원인 청구인의 사생활의 비밀과 자유를 침해하는 것은 아니다. (23.2차)","answer":true,"quote":"금융감독원 4급 이상 직원에게 재산등록의무를 지운 것은 금융기관 감독 업무의 공정성을 위한 것이라 사생활의 비밀과 자유 침해가 아니다.","cite":"헌재 2012헌마331","badge":"","topic":"","from":"GY-2023-2-H-11","seq":null},{"id":"H-OX-146","subject":"헌법","unit":"기본권론","stmt":"양심은 민주적 다수의 사고나 가치관과 일치하는 것이 아니라, 개인적 현상으로서 지극히 주관적인 것이다. (24.2차)","answer":true,"quote":"양심은 다수의 가치관과 같을 필요가 없는 지극히 주관적인 개인적 현상이라, 다수와 다른 양심일수록 보호가 필요하다.","cite":"헌재 2002헌가1","badge":"","topic":"","from":"GY-2024-2-H-12","seq":null},{"id":"H-OX-280","subject":"헌법","unit":"기본권론","stmt":"국가의 기본권 보호의무란 사인인 제3자에 의한 생명이나 신체에 대한 침해로부터 이를 보호하여야 할 국가의 의무를 말하는 것으로, 국가가 직접 주방용오물분쇄기의 사용을 금지 하여 개인의 기본권을 제한하는 경우에는 국가의 기본권 보호 의무 위반 여부가 문제된다. (25.2차)","answer":false,"quote":"기본권 보호의무는 사인인 제3자의 침해로부터 보호할 의무이므로, 국가가 직접 주방용오물분쇄기 사용을 금지해 기본권을 제한하는 것은 보호의무 위반 문제가 아니다.","cite":"헌재 2016헌마1151","badge":"","topic":"","from":"GY-2025-2-H-12","seq":null},{"id":"H-OX-218","subject":"헌법","unit":"기본권론","stmt":"효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 甲에게 통신자료 제공 내역을 통지하도록 하는 것이 적절하지 않기 때문에, 이 사건 법률조항이 통신자료 취득에 대한 사후통지절차를 두지 않은 것은 적법절차원칙에 위배되지 않는다. (23.1차)","answer":false,"quote":"효율적인 수사와 정보수집의 신속성, 밀행성 등의 필요성을 고려하여 사전에 정보주체인 이용자에게 그 내역을 통지하도록 하는 것이 적절하지 않다면 수사기관 등이 통신자료를 취득한 이후에 수사 등 정보수집의 목적에 방해가 되지 않는 범위 내에서 통신자료의 취득사실을 이용자에게 통지하는 것이 얼마든지 가능하다.","cite":"헌재 2016헌마388","badge":"","topic":"","from":"GY-2023-1-H-13","seq":null},{"id":"H-OX-240","subject":"헌법","unit":"기본권론","stmt":"집회 또는 시위를 하기 위하여 인천애(愛)뜰 중 잔디마당과 그 경계 내 부지에 대한 사용허가 신청을 한 경우 인천광역시장이 이를 허가할 수 없도록 제한하는 ｢인천애(愛)뜰의 사용 및 관리에 관한 조례｣ 조항은 헌법 제21조 제2항이 규정하는 집회에 대한 허가제 금지원칙에 위배된다. (24.1차)","answer":false,"quote":"집회 또는 시위를 하기 위하여 인천애(愛)뜰 중 잔디마당과 그 경계 내 부지에 대한 사용허가 신청을 한 경우 인천광역시장이 이를 허가할 수 없도록 제한하는 인천애(愛)뜰의 사용 및 관리에 관한 조례(이하 ‘이 사건 조례’라 한다) 제7조 제1항 제5호 가목(이하 ‘심판대상조항’이라 한다)이 법률유보원칙에 위배되어 청구인들의 집회의 자유를 침해하는지 여부(소극)","cite":"헌재 2019헌마1417","badge":"","topic":"","from":"GY-2024-1-H-14","seq":null},{"id":"H-OX-122","subject":"헌법","unit":"기본권론","stmt":"국가배상청구권의 성립 요건으로서 공무원의 고의 또는 과실을 규정함으로써 무과실책임을 인정하지 않은 ｢국가배상법｣ 조항이 입법자의 입법형성권의 자의적 행사로서 국가배상청구권을 침해한다고 볼 수 없다. (23.2차)","answer":true,"quote":"국가배상의 성립요건으로 공무원의 고의·과실을 요구해 무과실책임을 인정하지 않은 것은 입법형성의 범위 안이다.","cite":"헌재 2013헌바395","badge":"","topic":"","from":"GY-2023-2-H-18","seq":null},{"id":"H-OX-187","subject":"헌법","unit":"기본권론","stmt":"5‧18민주화운동과 관련하여 보상금 지급 결정에 동의하면 ‘정신적 손해’에 관한 부분도 재판상 화해가 성립된 것으로 보는 구 ｢5‧18민주화운동 관련자 보상 등에 관한 법률｣ 조항은 국가 배상청구권에 대한 과도한 제한이고, 해당 손해에 대한 적절한 배상이 이루어졌음을 전제로 하여 국가배상청구권 행사를 제한하려 한 동법의 입법목적에도 부합하지 않아 국가배상 청구권을 침해한다. (26.1차)","answer":true,"quote":"5ㆍ18민주화운동과 관련하여 보상금 지급 결정에 동의하면 ‘정신적 손해’에 관한 부분도 재판상 화해가 성립된 것으로 보는 구 ‘광주민주화운동 관련자 보상 등에 관한 법률’ 제16조 제2항 가운데 ‘광주민주화운동과 관련하여 입은 피해’ 중 ‘정신적 손해’에 관한 부분 및 구 ‘5ㆍ18민주화운동 관련자 보상 등에 관한 법률’(이하 법명이 변경된 전후 법을 통칭하여 ‘5ㆍ18보상법’이라 한다) 제16조 제2항 가운데 ‘5ㆍ18민주화운동과 관련하여 입은 피해’ 중 ‘정신적 손해’에 관한 부분(이하 위 두 조항을 통칭하여 ‘심판대상조항’이라 한다)이 국가배상청구권을 침해하는지 여부(적극)","cite":"헌재 2019헌가17","badge":"","topic":"","from":"GY-2026-1-H-16","seq":null},{"id":"H-OX-092","subject":"헌법","unit":"기본권론","stmt":"거주･이전의 자유는 국민에게 그가 선택할 직업 내지 그가 취임할 공직을 그가 선택하는 임의의 장소에서 자유롭게 행사할 수 있는 권리까지 보장하는 것은 아니다. (23.1차)","answer":true,"quote":"거주·이전의 자유는 살 곳을 정할 자유이지, 원하는 장소에서 직업이나 공직을 행사할 권리까지 보장하지 않는다.","cite":"헌재 96헌마200","badge":"","topic":"","from":"GY-2023-1-H-14","seq":null},{"id":"H-OX-093","subject":"헌법","unit":"기본권론","stmt":"거주･이전의 자유는 거주지나 체류지라고 볼 만한 정도로 생활과 밀접한 연관을 갖는 장소를 선택하고 변경하는 행위를 보호하는 기본권으로서, 생활의 근거지에 이르지 못하는 일시적인 이동을 위한 장소의 선택과 변경까지 그 보호영역에 포함되는 것은 아니다. (23.1차)","answer":true,"quote":"거주·이전의 자유는 생활과 밀접한 거주지·체류지를 고르고 바꾸는 행위를 보호하고, 일시적인 이동 장소의 선택은 보호영역 밖이다.","cite":"헌재 2009헌마406","badge":"","topic":"","from":"GY-2023-1-H-14","seq":null},{"id":"H-OX-163","subject":"헌법","unit":"기본권론","stmt":"청구인이 구속된 후 6월 1일에 청구인의 국선변호인이 선정되었고 그 국선변호인은 6월 5일에 청구인에 대한 접견을 신청하였는데, 접견을 희망한 6월 6일이 현충일로 공휴일이라는 이유로 접견이 거부되었고 이로부터 이틀 후인 6월 8일에 청구인과 변호인의 접견이 실시된 것은 청구인의 변호인의 조력을 받을 권리를 침해하였다고 볼 수 없다. (25.2차)","answer":true,"quote":"변호인 선정 뒤 공휴일이라는 이유로 희망일 접견이 거부되었더라도 이틀 뒤 접견이 이루어졌다면 변호인의 조력을 받을 권리를 침해한 것은 아니다.","cite":"헌재 2009헌마341","badge":"","topic":"","from":"GY-2025-2-H-13","seq":null},{"id":"H-OX-134","subject":"헌법","unit":"기본권론","stmt":"사생활의 비밀이란 사생활에 관한 사항으로 일반인에게 아직 알려지지 아니하고 일반인의 감수성을 기준으로 할 때 공개를 원하지 않을 사항을 말한다. (24.1차)","answer":true,"quote":"사생활의 비밀은 아직 알려지지 않았고 일반인의 감수성을 기준으로 공개를 원하지 않을 사생활 사항을 말한다.","cite":"헌법 제17조","badge":"","topic":"","from":"GY-2024-1-H-15","seq":null},{"id":"H-OX-239","subject":"헌법","unit":"기본권론","stmt":"의료인이 아닌 자의 문신시술업을 금지하고 처벌하는 ｢의료법｣ 조항은 문신시술자에 대하여 의료인 자격까지 요구하지 않고도, 시술자의 자격, 위생적인 문신시술 환경, 문신시술 절차 및 방법 등에 관한 규제를 통하여도 안전한 문신시술을 보장할 수 있다는 점에서 과잉금지원칙에 위배되어 문신시술을 업으로 삼고자 하는 청구인의 직업선택의 자유를 침해한다. (24.1차)","answer":false,"quote":"미국ㆍ프랑스ㆍ영국 등의 입법례와 같이, 문신시술자에 대하여 의료인 자격까지 요구하지 않고도, 안전한 문신시술에 필요한 범위로 한정된 시술자의 자격, 위생적인 문신시술 환경, 도구의 위생관리, 문신시술 절차 및 방법 등에 관한 규제와 염료 규제를 통하여도 안전한 문신시술을 보장할 수 있다.","cite":"헌재 2017헌마1343","badge":"","topic":"","from":"GY-2024-1-H-12","seq":null},{"id":"H-OX-161","subject":"헌법","unit":"기본권론","stm
