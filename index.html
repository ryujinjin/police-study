","answer":true,"quote":"아동·청소년의 성보호에 관한 법률 제11조 제3항 에서 정한 아동·청소년성착취물의 ‘배포’ 및 ‘공연히 전시’하는 행위의 의미 / 자신의 웹사이트에 아동·청소년성착취물이 저장된 다른 웹사이트로 연결되는 링크를 게시하여 불특정 또는 다수인이 링크를 이용하여 별다른 제한 없이 아동·청소년성착취물에 바로 접할 수 있는 상태를 실제로 조성한 경우, 위 조항에서 정한 아동·청소년성착취물을 배포하거나 공연히 전시한다는 구성요건을 충족하는지 여부 (적극)","cite":"대법원 2023도5757","badge":"","topic":"","from":"GY-2024-1-X-14","seq":null},{"id":"X-OX-220","subject":"형사법","unit":"형법 총론","stmt":"신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는, 공범종속성설에 의하여 신분이 있는 교사범이 신분이 없는 정범보다 중하게 처벌될 수는 없다. (26.1차)","answer":false,"quote":"형법 제31조 제1항 은 협의의 공범의 일종인 교사범이 그 성립과 처벌에 있어서 정범에 종속한다는 일반적인 원칙을 선언한 것에 불과하고, 신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는","cite":"대법원 93도1002","badge":"","topic":"","from":"GY-2026-1-X-10","seq":null},{"id":"X-OX-021","subject":"형사법","unit":"형법 총론","stmt":"공무원이 직무상 알게 된 비밀을 그 직무와의 관련성 혹은 필요성에 기하여 해당 직무의 집행과 관련 있는 다른 공무원 에게 직무집행의 일환으로 전달한 경우, 국가기능에 위험이 발생하리라고 볼 만한 특별한 사정이 인정되지 않는 한, 그 행위는 비밀의 누설에 해당하지 아니한다. (22.2차)","answer":true,"quote":"따라서 공무원이 직무상 알게 된 비밀을 그 직무와의 관련성 혹은 필요성에 기하여 해당 직무의 집행과 관련 있는 다른 공무원에게 직무집행의 일환으로 전달한 경우에는, 관련 각 공무원의 지위 및 관계, 직무집행의 목적과 경위, 비밀의 내용과 전달 경위 등 여러 사정에 비추어 비밀을 전달받은 공무원이 이를 그 직무집행과 무관하게 제3자에게 누설할 것으로 예상되는 등 국가기능에 위험이 발생하리라고 볼 만한 특별한 사정이 인정되지 않는 한, 위와 같은 행위가 비밀의 누설에 해당한다고 볼 수 없다.","cite":"대법원 2021도11924","badge":"","topic":"","from":"GY-2022-2-X-26","seq":null},{"id":"X-OX-103","subject":"형사법","unit":"형법 총론","stmt":"경찰관은 불심검문 대상자에게 질문을 하기 위하여 범행의 경중, 범행과의 관련성, 상황의 긴박성, 혐의의 정도, 질문의 필요성 등에 비추어 목적 달성에 필요한 최소한의 범위 내에서 사회 통념상 용인될 수 있는 상당한 방법으로 대상자를 정지시킬 수 있고 질문에 수반하여 흉기의 소지 여부도 조사할 수 있다. (25.2차)","answer":true,"quote":"경찰관직무집행법(이하 ‘법’이라 한다)의 목적, 법 제1조 제1항 , 제2항 , 제3조 제1항 , 제2항 , 제3항 , 제7항 의 규정 내용 및 체계 등을 종합하면, 경찰관은 법 제3조 제1항 에 규정된 대상자에게 질문을 하기 위하여 범행의 경중, 범행과의 관련성, 상황의 긴박성, 혐의의 정도, 질문의 필요성 등에 비추어 목적 달성에 필요한 최소한의 범위 내에서 사회통념상 용인될 수 있는 상당한 방법으로 대상자를 정지시킬 수 있고 질문에 수반하여 흉기의 소지 여부도 조사할 수 있다.","cite":"대법원 2010도6203","badge":"","topic":"","from":"GY-2025-2-X-28","seq":null},{"id":"X-OX-106","subject":"형사법","unit":"형법 총론","stmt":"압류된 골프장시설을 보관하는 회사의 대표이사가 위 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장을 개장하게 하여 봉인이 훼손되게 한 경우, 부작위에 의한 공무상 표시무효죄가 성립한다. (26.1차)","answer":true,"quote":"압류된 골프장시설을 보관하는 회사의 대표이사가 위 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장을 개장하게 하여 봉인이 훼손되게 한 경우, 부작위에 의한 공무상표시무효죄의 성립을 인정한 사례","cite":"대법원 2005도3034","badge":"","topic":"","from":"GY-2026-1-X-03","seq":null},{"id":"X-OX-218","subject":"형사법","unit":"형법 총론","stmt":"2인 이상의 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여는 공범에 관한 형법 총칙 규정이 적용될 수 없는데, 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있더라도 그 구성요건이 대향범의 형태로 실행되는 경우에도 이러한 대향범에 관한 법리가 적용된다. (26.1차)","answer":false,"quote":"대향범에 대하여 공범에 관한 형법 총칙 규정이 적용되는지 여부 (소극) 및 이러한 법리는 처벌규정의 구성요건 자체에서 2인 이상의 서로 대향된 행위의 존재를 전제로 하는지 여부 (적극) / 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 구성요건이 대향범의 형태로 실행되는 경우, 대향범에 관한 법리가 적용되는지 여부 (소극)","cite":"대법원 2020도7866","badge":"","topic":"","from":"GY-2026-1-X-09","seq":null},{"id":"X-OX-176","subject":"형사법","unit":"형법 총론","stmt":"법무사 등록증 대여를 처벌하는 ｢법무사법｣ 제72조 제1항에 더하여 2017. 12. 12. 동법 제72조 제2항의 몰수･추징 조항이 뒤늦게 신설되었다면, 2014. 1.경부터 2018. 4. 9.경까지 법무사 등록증 대여 금지를 위반하여 취득한 이익 전부를 추징하더라도 형벌법규의 소급효 금지 원칙에 반하지 않는다. (24.2차)","answer":false,"quote":"몰수·추징 조항 신설 전부터 이어진 등록증 대여라도 개정법 시행 뒤 행위로 얻은 이익만 추징할 수 있어, 이익 전부를 추징하면 소급효 금지에 반한다.","cite":"대법원 2020도7307 · 형법 제1조","badge":"","topic":"","from":"GY-2024-2-X-02","seq":null},{"id":"X-OX-143","subject":"형사법","unit":"형법 총론","stmt":"1년 이하의 징역이나 금고, 자격정지, 벌금 또는 구류의 형을 선고할 경우에 ｢형법｣ 제51조의 사항을 고려하여 뉘우치는 정상이 뚜렷할 때에는 그 형의 선고를 유예할 수 있지만, 자격정지 이상의 형을 받은 전과가 있는 사람에 대해서는 그러하지 아니하다. (23.1차)","answer":false,"quote":"①1년 이하의 징역이나 금고, 자격정지 또는 벌금의 형을 선고할 경우에 제51조의 사항을 참작하여 개전의 정상이 현저한 때에는 그 선고를 유예할 수 있다. 단, 자격정지 이상의 형을 받은 전과가 있는 자에 대하여는 예외로 한다.","cite":"형법 제59조 제1항","badge":"","topic":"","from":"GY-2023-1-X-13","seq":null},{"id":"X-OX-014","subject":"형사법","unit":"형법 총론","stmt":"처벌되지 아니하는 타인의 행위를 적극적으로 유발하고 이를 이용하여 자신의 범죄를 실현한 자는 간접정범의 죄책을 지게 되고, 그 과정에서 타인의 의사를 부당하게 억압하여야만 간접 정범에 해당하는 것은 아니다. (22.2차)","answer":true,"quote":"처벌되지 아니하는 타인의 행위를 적극적으로 유발하고 이를 이용하여 자신의 범죄를 실현한 자는 형법 제34조 제1항 이 정하는 간접정범의 죄책을 지게 되고, 그 과정에서 타인의 의사를 부당하게 억압하여야만 간접정범에 해당하는 것은 아니다.","cite":"대법원 2007도7204","badge":"","topic":"","from":"GY-2022-2-X-07","seq":null},{"id":"X-OX-041","subject":"형사법","unit":"형법 총론","stmt":"피해자의 승낙은 해석상 개인적 법익을 훼손하는 경우에 법률상 이를 처분할 수 있는 사람의 승낙을 말할 뿐만 아니라 그 승낙이 윤리적, 도덕적으로 사회상규에 반하는 것이 아니어야 한다. (23.2차)","answer":true,"quote":"형법 제24조 의 규정에 의하여 위법성이 조각되는 피해자의 승낙은 개인적 법익을 훼손하는 경우에 법률상 이를 처분할 수 있는 사람의 승낙을 말할 뿐만 아니라 그 승낙이 윤리적, 도덕적으로 사회상규에 반하는 것이 아니어야 한다.","cite":"대법원 85도1892","badge":"","topic":"","from":"GY-2023-2-X-05","seq":null},{"id":"X-OX-048","subject":"형사법","unit":"형법 총론","stmt":"4층 건물의 2층 내부 벽면에 설치된 분전반을 통해 3층과 4층으로 가설된 전선이 합선으로 단락되어 화재가 나 상해가 발생한 사안에서, 단지 4층 건물의 소유자로서 위 건물 2층을 임대 하였다는 사정만으로는 업무상과실치상죄에 있어서의 ‘업무’로 보기 어렵다. (23.2차)","answer":true,"quote":"4층 건물의 2층 내부 벽면에 설치된 분전반을 통해 3층과 4층으로 가설된 전선이 합선으로 단락되어 화재가 나 상해가 발생한 사안에서, 4층 건물의 소유자로서 위 건물 2층을 임대하였다는 사정만으로 업무상과실치상죄에 있어서의 ‘업무’에 관한 증명이 있다고 본 원심판결을 심리미진 등을 이유로 파기한 사례.","cite":"대법원 2009도1040","badge":"","topic":"","from":"GY-2023-2-X-15","seq":null},{"id":"X-OX-149","subject":"형사법","unit":"형법 총론","stmt":"방위행위, 피난행위, 자구행위가 그 정도를 초과한 경우에는 정황(情況)에 따라 그 형을 감경하거나 면제한다. (23.2차)","answer":false,"quote":"과잉방위·과잉피난·과잉자구행위는 정황에 따라 형을 감경하거나 면제「할 수 있다」 — 반드시 감면하는 것이 아닌 임의적 감면이다.","cite":"형법 제21조 · 형법 제22조 · 형법 제23조","badge":"","topic":"","from":"GY-2023-2-X-05","seq":null},{"id":"X-OX-157","subject":"형사법","unit":"형법 총론","stmt":"공무상비밀누설죄는 공무원 또는 공무원이었던 자가 법령에 의한 직무상 비밀을 누설하는 것을 구성요건으로 하고 있는바, 여기서 ‘법령에 의한 직무상 비밀’이란 법령에 의하여 비밀로 규정되었거나 비밀로 분류 명시된 사항에 한정된다. (23.2차)","answer":false,"quote":"형법 제127조 는 공무원 또는 공무원이었던 자가 법령에 의한 직무상 비밀을 누설하는 것을 구성요건으로 하고, 같은 조에서 ‘법령에 의한 직무상 비밀’이란 반드시 법령에 의하여 비밀로 규정되었거나 비밀로 분류 명시된 사항에 한하지 아니하고, 정치, 군사, 외교, 경제, 사회적 필요에 따라 비밀로 된 사항은 물론 정부나 공무소 또는 국민이 객관적, 일반적인 입장에서 외부에 알려지지 않는 것에 상당한 이익이 있는 사항도 포함하나, 실질적으로 그것을 비밀로서 보호할 가치가 있다고 인정할 수 있는 것이어야 하고, 본죄는 비밀 그 자체를 보호하는 것이 아니라 공무원의 비밀엄수의무의 침해에 의하여 위험하게 되는 이익, 즉 비밀 누설에 의하여 위협받는 국가의 기능을 보호하기 위한 것이다.","cite":"대법원 2010도14734","badge":"","topic":"","from":"GY-2023-2-X-24","seq":null},{"id":"X-OX-159","subject":"형사법","unit":"형법 총론","stmt":"형사재판에서 이와 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이므로, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건 확정판결의 사실판단을 그대로 채택하기 어렵다고 인정되는 면이 있다고 하여도 이를 배척할 수는 없다. (23.2차)","answer":false,"quote":"형사재판에서 이와 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이나, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건 확정판결의 사실판단을 그대로 채택하기 어렵다고 인정될 경우에는 이를 배척할 수 있다.","cite":"대법원 2011도15653","badge":"","topic":"","from":"GY-2023-2-X-39","seq":null},{"id":"X-OX-011","subject":"형사법","unit":"형법 총론","stmt":"법인격 없는 사단과 같은 단체는 법인과 마찬가지로 사법상의 권리의무의 주체가 될 수 있음은 별론으로 하더라도 법률에 명문의 규정이 없는 한 그 범죄능력은 없다. (22.2차)","answer":true,"quote":"법인격 없는 사단과 같은 단체는 법인과 마찬가지로 사법상의 권리의무의 주체가 될 수 있음은 별론으로 하더라도 법률에 명문의 규정이 없는 한 그 범죄능력은 없고 그 단체의 업무는 단체를 대표하는 자연인인 대표기관의 의사결정에 따른 대표행위에 의하여 실현될 수밖에 없는바,","cite":"대법원 96도524","badge":"","topic":"","from":"GY-2022-2-X-02","seq":null},{"id":"X-OX-191","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제8조 본문은 “본법 총칙은 타법령에 정한 죄에 적용한다”고 규정하고 있으므로, ｢형법｣에 법인에 대한 별도의 처벌규정이 없는 한, 개별 법령의 양벌규정을 근거로 법인을 처벌할 수는 없다. (25.1차)","answer":false,"quote":"형법 총칙은 다른 법령에 특별한 규정이 있으면 그에 따르므로, 형법에 법인 처벌 규정이 없어도 개별 법령의 양벌규정으로 법인을 처벌한다.","cite":"형법 제8조","badge":"","topic":"","from":"GY-2025-1-X-03","seq":null},{"id":"X-OX-033","subject":"형사법","unit":"형법 총론","stmt":"방조범이란 타인의 범죄실행을 방조함으로써 성립하는 범죄이며, ｢형법｣ 제32조 제2항에 따라 방조범의 형은 정범의 형보다 감경한다. (23.1차)","answer":true,"quote":"방조범의 형은 정범보다 반드시 감경하는 필요적 감경이고, 교사범은 정범과 같은 형이라는 점과 구별된다.","cite":"형법 제32조 · 형법 제31조","badge":"","topic":"","from":"GY-2023-1-X-11","seq":null},{"id":"X-OX-019","subject":"형사법","unit":"형법 총론","stmt":"어린이집 보육교사가 아동(만 4세)이 창틀에 매달리는 등 위험한 행동을 한다는 이유로 그를 안아 바닥에서 약 78cm 높이의 교구장(110cm×29cm×63cm) 위에 올려둔 후 교구장을 1회 흔 들고, 아동의 몸을 잡고는 교구장 뒤 창 쪽으로 흔들어 보이는 등 약 40분 동안 앉혀둔 경우, 이는 비록 안전을 위한 조치라 할지라도 아동에 대한 학대행위에 해당한다. (22.2차)","answer":true,"quote":"어린이집 보육교사인 피고인이, 아동 甲(4세)이 창틀에 매달리는 등 위험한 행동을 한다는 이유로 甲을 안아 바닥에서 약 78cm 높이의 교구장(110cm×29cm×63cm) 위에 올려둔 후 교구장을 1회 흔들고, 甲의 몸을 잡고는 교구장 뒤 창 쪽으로 흔들어 보이는 등 약 40분 동안 앉혀둠으로써 아동의 정신건강 및 발달에 해를 끼치는 정서적 학대행위를 하였다고 하여 아동복지법 위반(아동학대)으로 기소된 사안에서, 피고인이 강압적이고 부정적인 태도를 보이며 4세인 甲을 높이 78cm에 이르는 교구장 위에 약 40분 동안 앉혀놓은 것은 그 자체로 위험한 행위일 뿐만 아니라 그 과정에서 甲은 공포감 내지 소외감을 느꼈을 것으로 보이고, 실제로 甲이 정신적 고통 등을 호소하며 일주일이 넘도록 어린이집에 등원하지 못한 점 등 여러 사정에 비추어 피고인이 甲을 정서적으로 학대하였다고 보아 유죄를 인정한 원심판단을 수긍한 사례.","cite":"대법원 2017도5769","badge":"","topic":"","from":"GY-2022-2-X-14","seq":null},{"id":"X-OX-077","subject":"형사법","unit":"형법 총론","stmt":"｢형사소송법｣ 제314조에서 ‘특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 증명’은 단지 그러할 개연성이 있다는 정도 로는 부족하고, 법정에서의 반대신문 등을 통한 검증을 굳이 거치지 않더라도 진술의 신빙성을 충분히 담보할 수 있어 실질적 직접 심리주의와 전문법칙에 대한 예외로 평가할 수 있는 정도에 이르러야 한다. (24.2차)","answer":true,"quote":"따라서 형사소송법 제314조 에서 ‘특히 신빙할 수 있는 상태하에서 행하여졌음에 대한 증명’은 단지 그러할 개연성이 있다는 정도로는 부족하고, 합리적 의심의 여지를 배제할 정도, 즉 법정에서의 반대신문 등을 통한 검증을 굳이 거치지 않더라도 진술의 신빙성을 충분히 담보할 수 있어 실질적 직접심리주의와 전문법칙에 대한 예외로 평가할 수 있는 정도에 이르러야 한다.","cite":"대법원 2023도13406","badge":"","topic":"","from":"GY-2024-2-X-37","seq":null},{"id":"X-OX-129","subject":"형사법","unit":"형법 총론","stmt":"증거능력이 없는 증거는 유죄의 직접적인 증거로 삼을 수 없으나, 구성요건 사실을 추인하게 하는 간접사실이나 구성요건 사실을 입증하는 직접증거의 증명력을 보강하는 보조사실의 인정자료 로는 사용할 수 있다. (22.1차)","answer":false,"quote":"증거능력 없는 증거를 구성요건 사실을 추인하게 하는 간접사실이나 구성요건 사실을 입증하는 직접증거의 증명력을 보강하는 보조사실의 인정자료로 사용할 수 있는지 여부 (소극)","cite":"대법원 2006도6356","badge":"","topic":"","from":"GY-2022-1-X-35","seq":null},{"id":"X-OX-100","subject":"형사법","unit":"형법 총론","stmt":"가석방된 자는 가석방기간 중 보호관찰을 받지만 가석방을 허가한 행정관청이 필요 없다고 인정한 때에는 그러하지 아니하다. (25.2차)","answer":true,"quote":"②가석방된 자는 가석방기간중 보호관찰을 받는다. 다만, 가석방을 허가한 행정관청이 필요가 없다고 인정한 때에는 그러하지 아니하다.","cite":"형법 제73조의2 제2항","badge":"","topic":"","from":"GY-2025-2-X-13","seq":null},{"id":"X-OX-168","subject":"형사법","unit":"형법 총론","stmt":"한 개의 행위가 서로 다른 둘 이상의 구성요건을 실현하는 경우 에는 상상적 경합이 성립하나, 한 개의 행위가 동일한 구성 요건을 2회 이상 실현하는 경우에는 상상적 경합이 성립하지 않는다. (24.1차)","answer":false,"quote":"한 개의 행위가 같은 구성요건을 여러 번 실현해도 상상적 경합이다 — 한 번의 폭발로 여러 사람을 죽인 경우가 그 예다.","cite":"형법 제40조","badge":"","topic":"","from":"GY-2024-1-X-11","seq":null},{"id":"X-OX-101","subject":"형사법","unit":"형법 총론","stmt":"임대한 방실의 부엌으로 통하는 문과 벽사이에 0.4센티미터 정도의 틈이 있다면 이는 문 전체를 다시 제작하여 붙이지 않더라도 다른 목재로 부착보수하는 정도로서 그 틈을 막을 수 있는 경우, 이는 임차인의 통상의 수선관리의무에 속한 것이라 못할바 아니므로 위 문틈으로 스며든 연탄가스에 중독되는 사고가 발생했다 하더라도 위 사고는 임대인의 과실로 인한 것이라고 볼 수 없다. (25.2차)","answer":true,"quote":"임대한 방실의 부엌으로 통하는 문과 벽사이에 0.4센티미터 정도의 틈이 있다면 이는 문 전체를 다시 제작하여 붙이지 않더라도 다른 목재로 부착보수하는 정도로서 그 틈을 막을 수 있는 것이어서 그 하자가 방실을 사용할 수 없을 정도의 파손상태이거나 임대인에게 수선의무가 있는 대규모의 것이라고는 할 수 없고 임차인의 통상의 수선관리의무에 속한 것이라 못할바 아니므로 위 문틈으로 스며든 연탄가스에 중독되는 사고가 발생했다 하더라도 위 사고는 임대인의 과실로 인한 것이라고 볼 수 없다.","cite":"대법원 84도2034","badge":"","topic":"","from":"GY-2025-2-X-15","seq":null},{"id":"X-OX-073","subject":"형사법","unit":"형법 총론","stmt":"행위자에게 유죄의 재판을 아니할 때에도 몰수의 요건이 있는 때에는 몰수만을 선고할 수 있지만, 우리 법제상 공소의 제기 없이 별도로 몰수만을 선고할 수 있는 제도는 마련되어 있지 않다. (24.2차)","answer":true,"quote":"형법 제49조 단서는 \"행위자에게 유죄의 재판을 아니할 때에도 몰수의 요건이 있는 때에는 몰수만을 선고할 수 있다.\"라고 규정하고 있으나, 우리 법제상 공소의 제기 없이 별도로 몰수만을 선고할 수 있는 제도가 마련되어 있지 않으므로, 위 규정에 근거하여 몰수를 선고하기 위해서는 몰수의 요건이 공소가 제기된 공소사실과 관련되어 있어야 하고, 공소가 제기되지 않은 별개의 범죄사실을 법원이 인정하여 그에 관하여 몰수나 추징을 선고하는 것은 불고불리의 원칙에 위반되어 허용되지 않는다.","cite":"대법원 2022도8662","badge":"","topic":"","from":"GY-2024-2-X-14","seq":null},{"id":"X-OX-150","subject":"형사법","unit":"형법 총론","stmt":"원인에 있어서 자유로운 행위에 관한 ｢형법｣ 제10조 제3항은 원인행위시 심신장애 상태에서 위법행위로 나아갈 예견가능성이 없었던 경우에도 적용된다. (23.2차)","answer":false,"quote":"원인에 있어서 자유로운 행위는 위험 발생을 예견했거나 예견할 수 있었는데도 스스로 심신장애를 일으킨 경우에만 적용된다.","cite":"대법원 92도999 · 형법 제10조","badge":"","topic":"","from":"GY-2023-2-X-07","seq":null},{"id":"X-OX-104","subject":"형사법","unit":"형법 총론","stmt":"｢경찰관직무집행법｣ 제3조 제2항에 따라 임의동행한 경우 같은 조 제6항에 당해인을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정하고 있다고 하여 그 규정이 임의동행한 자를 6시간 동안 경찰관서에 구금하는 것을 허용하는 것은 아니다. (25.2차)","answer":true,"quote":"경찰관직무집행법 제3조 제6항 이 임의동행한 경우 당해인을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정하고 있다고 하여 그 규정이 임의동행한 자를 6시간 동안 경찰관서에 구금하는 것을 허용하는 것은 아니다.","cite":"대법원 97도1240","badge":"","topic":"","from":"GY-2025-2-X-29","seq":null},{"id":"X-OX-153","subject":"형사법","unit":"형법 총론","stmt":"甲이 ‘전달책’으로서의 행위를 한 때부터 비로소 피해자들에 대한 사기죄의 종범에 해당한다. (23.2차)","answer":false,"quote":"접근매체를 넘긴 때부터 이미 사기의 방조가 되므로, 전달책 행위를 한 때에야 비로소 종범이 되는 것이 아니다.","cite":"대법원 2022도649 · 형법 제32조 · 형법 제347조","badge":"","topic":"","from":"GY-2023-2-X-12","seq":null},{"id":"X-OX-098","subject":"형사법","unit":"형법 총론","stmt":"甲이포괄일죄의 관계에 있는범행의 일부를 실행한후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 甲은 다른 공범들의 범죄실행을 저지하지 않은 이상 관여하지 않은 부분에 대하여도 죄책을 부담한다. (25.2차)","answer":true,"quote":"피고인이 포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 피고인이 관여하지 않은 부분에 대하여도 죄책을 부담한다.","cite":"대법원 2010도9927","badge":"","topic":"","from":"GY-2025-2-X-10","seq":null},{"id":"X-OX-201","subject":"형사법","unit":"형법 총론","stmt":"경향범이란 범죄성립에 고의 이외에 행위자의 일정한 내심의 경향이 필요한 범죄를 말하며, 경향범인 강제추행죄의 성립을 위해서는 고의 이외에 성욕을 자극, 흥분, 만족시키려는 주관적 동기나 목적이 필요하다. (25.2차)","answer":false,"quote":"그리고 강제추행죄의 성립에 필요한 주관적 구성요건으로 성욕을 자극·흥분·만족시키려는 주관적 동기나 목적이 있어야 하는 것은 아니다.","cite":"대법원 2013도5856","badge":"","topic":"","from":"GY-2025-2-X-02","seq":null},{"id":"X-OX-072","subject":"형사법","unit":"형법 총론","stmt":"치과의사가 환자의 대량유치를 위해 치과기공사들에게 내원 환자들에게 진료행위를 하도록 지시하여 그들이 각 단독 으로 진료행위를 한 경우 치과의사는 무면허의료행위의 교사범이 성립한다. (24.2차)","answer":true,"quote":"치과의사가 환자의 대량유치를 위해 치과기공사들에게 내원환자들에게 진료행위를 하도록 지시하여 동인들이 각 단독으로 전항과 같은 진료행위를 하였다면 무면허의료행위의 교사범에 해당한다.","cite":"대법원 86도749","badge":"","topic":"","from":"GY-2024-2-X-12","seq":null},{"id":"X-OX-156","subject":"형사법","unit":"형법 총론","stmt":"야간 당직간호사가 담당 환자의 심근경색 증상을 당직의사에게 제대로 보고하지 않음으로써 당직의사가 필요한 조치를 취하지 못한 채 환자가 사망하였다면 병원의 야간당직 운영체계상 당직의사에게도 업무상 과실이 있다. (23.2차)","answer":false,"quote":"야간 당직간호사가 담당 환자의 심근경색 증상을 당직의사에게 제대로 보고하지 않음으로써 당직의사가 필요한 조치를 취하지 못한 채 환자가 사망한 경우, 병원의 야간당직 운영체계상 당직간호사에게 환자의 사망을 예견하거나 회피하지 못한 업무상 과실이 있고, 당직의사에게는 업무상 과실을 인정하기 어렵다고 한 사례","cite":"대법원 2006도294","badge":"","topic":"","from":"GY-2023-2-X-15","seq":null},{"id":"X-OX-224","subject":"형사법","unit":"형법 총론","stmt":"양벌규정의 제도적 취지와 법적 성격, 사업주‧행위자 관계와 공범관계의 차이, ｢형법｣ 등 실체법과의 체계적 조화의 관점 등에 비추어 보면 ｢형사소송법｣ 제253조 제2항의 시효의 정지와 효력에서 규정하고 있는 ‘공범’에는 양벌규정에서 사업주와 행위자 관계에 있는 사람도 포함된다. (26.1차)","answer":false,"quote":"따라서 이러한 양벌규정의 제도적 취지와 법적 성격, 사업주·행위자 관계와 공범관계의 차이, 형법 등 실체법과의 체계적 조화의 관점, 죄형법정주의의 정신 등에 비추어 보면 형사소송법 제253조 제2항 의 ‘공범’에는 양벌규정에서 사업주와 행위자 관계에 있는 사람은 포함되지 않는다고 해석하여야 한다.","cite":"대법원 2024도15290","badge":"","topic":"","from":"GY-2026-1-X-34","seq":null},{"id":"X-OX-069","subject":"형사법","unit":"형법 총론","stmt":"범인도피죄에 있어서 공범자의 범인도피행위 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 경우에는 범인도피죄의 공동정범이 성립한다. (24.2차)","answer":true,"quote":"따라서 공범자의 범인도피행위 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 경우에는 범인도피죄의 공동정범이 성립하고, 이는 공범자의 범행을 방조한 종범의 경우도 마찬가지이다.","cite":"대법원 2012도6027","badge":"","topic":"","from":"GY-2024-2-X-10","seq":null},{"id":"X-OX-109","subject":"형사법","unit":"형법 총론","stmt":"행위자가 대출금 교부를 전후하여 이루어진 일련의 위계행위를 통해 은행의 대출 심사 및 대출금 환수 여부 심사 등에 관한 전반적인 업무를 방해한 경우, 은행의 대출 담당 직원을 기망하여 대출금을 교부받은 사기죄와 위계에 의한 업무방해죄는 법조경합이 아닌 실체적 경합의 관계에 있다. (26.1차)","answer":true,"quote":"사기죄의 성립에 일반적ㆍ전형적으로 위계에 의한 업무방해행위가 수반되는지 여부 (소극) / 행위자가 대출금 교부를 전후하여 이루어진 일련의 위계행위를 통해 은행의 대출 심사 및 대출금 환수 여부 심사 등에 관한 전반적인 업무를 방해한 경우, 은행의 대출 담당 직원을 기망하여 대출금을 교부받은 사기죄와 별개로 위계에 의한 업무방해죄가 성립하는지 여부 (적극)","cite":"대법원 2024도18174","badge":"","topic":"","from":"GY-2026-1-X-11","seq":null},{"id":"X-OX-127","subject":"형사법","unit":"형법 총론","stmt":"민사조정법 상의 조정절차에서 작성되는 조정조서는 공정증서원본 불실기재죄에서의 공정증서원본에 해당한다. (22.1차)","answer":false,"quote":"형법 제228조 제1항 이 규정하는 공정증서원본 불실기재죄는 공무원에 대하여 진실에 반하는 허위신고를 하여 공정증서원본에 그 증명하는 사항에 관하여 실체관계에 부합하지 아니하는 불실의 사실을 기재하게 함으로써 성립하는 범죄로서, 위 죄의 객체인 공정증서원본은 그 성질상 허위신고에 의해 불실한 사실이 그대로 기재될 수 있는 공문서이어야 한다고 할 것인바, 민사조정법상 조정신청에 의한 조정제도는 원칙적으로 조정신청인의 신청 취지에 구애됨이 없이 조정담당판사 등이 제반 사정을 고려하여 당사자들에게 상호 양보하여 합의하도록 권유·주선함으로써 화해에 이르게 하는 제도인 점에 비추어, 그 조정절차에서 작성되는 조정조서는 그 성질상 허위신고에 의해 불실한 사실이 그대로 기재될 수 있는 공문서로 볼 수 없어 공정증서원본에 해당하는 것으로 볼 수 없다.","cite":"대법원 2010도3232","badge":"","topic":"","from":"GY-2022-1-X-25","seq":null},{"id":"X-OX-164","subject":"형사법","unit":"형법 총론","stmt":"위난을 피하지 못할 책임 있는 자에게는 긴급피난이 허용되지 않기에 이들이 감수해야 할 범위를 넘는 위난에 처한 때에도 긴급피난은 허용되지 않는다. (24.1차)","answer":false,"quote":"위난을 피하지 못할 책임이 있는 사람도 감수해야 할 범위를 넘는 위난에 대해서는 긴급피난을 할 수 있다.","cite":"형법 제22조","badge":"","topic":"","from":"GY-2024-1-X-04","seq":null},{"id":"X-OX-151","subject":"형사법","unit":"형법 총론","stmt":"甲이 A의 뒤에 서서 카메라폰으로 치마 속 신체 부위를 일정한 시간 동안 촬영하다가 경찰관에게 발각되어 저장버튼을 누르지 않고 촬영을 종료하였다면 구 ｢성폭력범죄의 처벌 및 피해자보호 등에 관한 법률｣ 제14조의2 제1항에 따른 카메라 등 이용촬영죄의 장애미수에 해당한다. (23.2차)","answer":false,"quote":"피고인이 지하철 환승에스컬레이터 내에서 카메라폰으로 피해자의 치마 속 신체 부위를 동영상 촬영하였다고 하여 구 성폭력범죄의 처벌 및 피해자보호 등에 관한 법률 위반으로 기소된 사안에서, 동영상 촬영 중 저장버튼을 누르지 않고 촬영을 종료하였다는 이유만으로 위 범행이 ‘기수’에 이르지 않았다고 단정한 원심판결에 법리오해로 인한 심리미진 등의 위법이 있다고 한 사례","cite":"대법원 2010도10677","badge":"","topic":"","from":"GY-2023-2-X-09","seq":null},{"id":"X-OX-035","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제40조가 규정하는 한 개의 행위가 여러 개의 죄에 해당하는 경우에 “가장 무거운 죄에 정한 형으로 처벌한다”란, 여러 개의 죄명 중 가장 무거운 형을 규정한 법조에 의하여 처단한다는 취지와 함께 다른 법조의 최하한의 형보다 가볍게 처단할 수 없다는 취지 즉, 각 법조의 상한과 하한을 모두 중한 형의 범위 내에서 처단한다는 것을 포함한다. (23.1차)","answer":true,"quote":"형법 제40조 가 규정하는 1개의 행위가 수개의 죄에 해당하는 경우에 ‘가장 중한 죄에 정한 형으로 처벌한다’란, 수개의 죄명 중 가장 중한 형을 규정한 법조에 의하여 처단한다는 취지와 함께 다른 법조의 최하한의 형보다 가볍게 처단할 수 없다는 취지 즉, 각 법조의 상한과 하한을 모두 중한 형의 범위 내에서 처단한다는 것을 포함한다.","cite":"대법원 2008도9169","badge":"","topic":"","from":"GY-2023-1-X-12","seq":null},{"id":"X-OX-198","subject":"형사법","unit":"형법 총론","stmt":"교통방해를 유발한 집회에 참가한 경우 참가 당시 이미 다른 참가자들에 의해 교통의 흐름이 차단된 상태였다면, 비록 교통 방해를 유발한 다른 참가자들과 암묵적‧순차적으로 공모하여 교통방해의 위법상태를 지속시켰다고 평가할 수 있더라도 일반교통방해죄가 성립하지 않는다. (25.1차)","answer":false,"quote":"따라서 신고 범위를 현저히 벗어나거나 집회 및 시위에 관한 법률 제12조 에 따른 조건을 중대하게 위반함으로써 교통방해를 유발한 집회에 참가한 경우, 참가 당시 이미 다른 참가자들에 의해 교통의 흐름이 차단된 상태였더라도 교통방해를 유발한 다른 참가자들과 암묵적·순차적으로 공모하여 교통방해의 위법상태를 지속시켰다고 평가할 수 있다면 일반교통방해죄가 성립한다.","cite":"대법원 2017도11408","badge":"","topic":"","from":"GY-2025-1-X-24","seq":null},{"id":"X-OX-112","subject":"형사법","unit":"형법 총론","stmt":"도주죄의 범인이 도주행위를 하여 기수에 이르른 이후에 범인의 도피를 도와주는 행위는 범인도피죄에 해당할 수 있을 뿐 도주 원조죄에는 해당하지 아니한다. (26.1차)","answer":true,"quote":"도주죄는 즉시범으로서 범인이 간수자의 실력적 지배를 이탈한 상태에 이르렀을 때에 기수가 되어 도주행위가 종료하는 것이고, 도주원조죄는 도주죄에 있어서의 범인의 도주행위를 야기시키거나 이를 용이하게 하는 등 그와 공범관계에 있는 행위를 독립한 구성요건으로 하는 범죄이므로, 도주죄의 범인이 도주행위를 하여 기수에 이르른 이후에 범인의 도피를 도와 주는 행위는 범인도피죄에 해당할 수 있을 뿐 도주원조죄에는 해당하지 아니한다.","cite":"대법원 91도1656","badge":"","topic":"","from":"GY-2026-1-X-27","seq":null},{"id":"X-OX-226","subject":"형사법","unit":"형법 총론","stmt":"범행에 관한 간접증거만이 존재하고 그 간접증거의 증명력에 한계가 있는 경우, 범인으로 지목되고 있는 자에게 범행을 저지를 만한 동기가 발견되지 않는다면, 만연히 간접증거의 증명력이 그만큼 떨어진다고 평가할 것이 아니라, 무엇인가 동기가 분명히 있는데도 이를 범인이 숨기고 있을 수 있다고 적극적으로 평가하는 것이 형사증거법의 이념에 부합하는 것이다. (26.1차)","answer":false,"quote":"증명력에 한계가 있는 간접증거뿐인데 범행 동기가 발견되지 않으면, 동기를 숨긴다고 단정하지 말고 간접증거의 증명력이 그만큼 떨어진다고 본다.","cite":"대법원 2005도8675","badge":"","topic":"","from":"GY-2026-1-X-35","seq":null},{"id":"X-OX-037","subject":"형사법","unit":"형법 총론","stmt":"행정경찰 목적의 경찰활동으로 행하여지는 ｢경찰관 직무집행법｣ 제3조 제2항 소정의 질문을 위한 동행요구가 ｢형사소송법｣의 규율을 받는 수사로 이어지는 경우에는 ｢형사소송법｣ 제199조 제1항 및 제200조 규정에 의하여야 한다. (23.1차)","answer":true,"quote":"형사소송법 제200조 제1항 에 의하여 검사 또는 사법경찰관이 피의자에 대하여 임의적 출석을 요구할 수는 있겠으나, 그 경우에도 수사관이 단순히 출석을 요구함에 그치지 않고 일정 장소로의 동행을 요구하여 실행한다면 위에서 본 법리가 적용되어야 하고, 한편 행정경찰 목적의 경찰활동으로 행하여지는 경찰관직무집행법 제3조 제2항 소정의 질문을 위한 동행요구도 형사소송법의 규율을 받는 수사로 이어지는 경우에는 역시 위에서 본 법리가 적용되어야 한다.","cite":"대법원 2005도6810","badge":"","topic":"","from":"GY-2023-1-X-28","seq":null},{"id":"X-OX-111","subject":"형사법","unit":"형법 총론","stmt":"사무처리시스템의 프로그램 자체에서 발생하는 오류를 적극적으로 이용하여 그 사무처리의 목적에 비추어 정당하지 아니한 사무처리를 하게 하는 행위는 특별한 사정이 없는 한 ｢형법｣ 제347조의2의 ‘부정한 명령의 입력’에 해당한다고 보아야 한다. (26.1차)","answer":true,"quote":"따라서 설령 ‘허위의 정보’를 입력한 경우가 아니라고 하더라도, 당해 사무처리시스템의 프로그램을 구성하는 개개의 명령을 부정하게 변개·삭제하는 행위는 물론 프로그램 자체에서 발생하는 오류를 적극적으로 이용하여 그 사무처리의 목적에 비추어 정당하지 아니한 사무처리를 하게 하는 행위도 특별한 사정이 없는 한 위 ‘부정한 명령의 입력’에 해당한다고 보아야 한다.","cite":"대법원 2011도4440","badge":"","topic":"","from":"GY-2026-1-X-20","seq":null},{"id":"X-OX-046","subject":"형사법","unit":"형법 총론","stmt":"의사가 환자에 대하여 주된 의사의 지위에서 진료하는 경우라도, 자신은 환자의 수술이나 시술에 전념하고 마취과 의사로 하여금 마취와 환자 감시 등을 담당토록 하는 경우처럼 서로 대등한 지위에서 각자의 의료영역을 나누어 환자 진료의 일부를 분담하였다면, 진료를 분담받은 다른 의사의 전적인 과실로 환자에게 발생한 결과에 대하여는 주된 의사의 책임을 인정 할 수 없다. (23.2차)","answer":true,"quote":"따라서 의사가 환자에 대하여 주된 의사의 지위에서 진료하는 경우라도, 자신은 환자의 수술이나 시술에 전념하고 마취과 의사로 하여금 마취와 환자 감시 등을 담당토록 하거나, 특정 의료영역에 관한 진료 도중 환자에게 나타난 문제점이 자신이 맡은 의료영역 내지 전공과목에 관한 것이 아니라 그에 선행하거나 병행하여 이루어진 다른 의사의 의료영역 내지 전공과목에 속하는 등의 사유로 다른 의사에게 그 관련된 협의진료를 의뢰한 경우처럼 서로 대등한 지위에서 각자의 의료영역을 나누어 환자 진료의 일부를 분담하였다면, 진료를 분담받은 다른 의사의 전적인 과실로 환자에게 발생한 결과에 대하여는 책임을 인정할 수 없다.","cite":"대법원 2022도1499","badge":"","topic":"","from":"GY-2023-2-X-15","seq":null},{"id":"X-OX-145","subject":"형사법","unit":"형법 총론","stmt":"｢경찰관 직무집행법｣ 제3조 제6항은 불심검문에 관하여 임의 동행한 사람을 6시간을 초과하여 경찰관서에 머물게 할 수 없다고 규정하고 있으므로, 대상자를 6시간 동안 경찰관서에 구금하는 것이 허용된다. (23.1차)","answer":false,"quote":"6시간은 임의동행한 사람을 머물게 할 수 있는 상한일 뿐이고, 동행한 사람은 형사소송법에 따르지 않고는 신체를 구속당하지 않는다.","cite":"경찰관 직무집행법 제3조","badge":"","topic":"","from":"GY-2023-1-X-28","seq":null},{"id":"X-OX-081","subject":"형사법","unit":"형법 총론","stmt":"형법이 금지하고 있는 법익침해의 결과발생을 방지할 법적인 작위의무를 지고 있는 자가 그 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음에도 불구하고 그 결과의 발생을 용인하고 이를 방관한 채 그 의무를 이행하지 않은 경우, 그 부작위가 작위에 의한 법익침해와 동등한 형법적 가치가 있는 것이어서 그 범죄의 실행행위로 평가될 만한 것이라면, 작위에 의한 실행 행위와 동일하게 부작위범으로 처벌할 수 있다. (25.1차)","answer":true,"quote":"나아가 살인죄와 같이 일반적으로 작위를 내용으로 하는 범죄를 부작위에 의하여 범하는 이른바 부진정 부작위범의 경우에는 보호법익의 주체가 법익에 대한 침해위협에 대처할 보호능력이 없고, 부작위행위자에게 침해위협으로부터 법익을 보호해 주어야 할 법적 작위의무가 있을 뿐 아니라, 부작위행위자가 그러한 보호적 지위에서 법익침해를 일으키는 사태를 지배하고 있어 작위의무의 이행으로 결과발생을 쉽게 방지할 수 있어야 부작위로 인한 법익침해가 작위에 의한 법익침해와 동등한 형법적 가치가 있는 것으로서 범죄의 실행행위로 평가될 수 있다.","cite":"대법원 2015도6809","badge":"","topic":"","from":"GY-2025-1-X-06","seq":null},{"id":"X-OX-005","subject":"형사법","unit":"형법 총론","stmt":"신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는 형법 제33조 (공범과 신분) 단서가 형법 제31조(교사범) 제1항에 우선하여 적용된다. (22.1차)","answer":true,"quote":"형법 제31조 제1항 은 협의의 공범의 일종인 교사범이 그 성립과 처벌에 있어서 정범에 종속한다는 일반적인 원칙을 선언한 것에 불과하고, 신분관계로 인하여 형의 경중이 있는 경우에 신분이 있는 자가 신분이 없는 자를 교사하여 죄를 범하게 한 때에는","cite":"대법원 93도1002","badge":"","topic":"","from":"GY-2022-1-X-12","seq":null},{"id":"X-OX-154","subject":"형사법","unit":"형법 총론","stmt":"｢폭력행위 등 처벌에 관한 법률｣ 제4조 제1항은 그 법에 규정된 범죄행위를 목적으로 하는 단체를 구성하거나 이에 가입하는 행위(범죄단체구성･가입죄) 또는 구성원으로 활동 하는 행위(범죄단체 활동죄)를 처벌하도록 정하고 있는데, 범죄단체를 구성하거나 이에 가입한 자가 더 나아가 구성원으로 활동하는 경우, 각 행위는 실체적 경합관계에 있다. (23.2차)","answer":false,"quote":"폭력행위 등 처벌에 관한 법률 제4조 제1항 은 그 법에 규정된 범죄행위를 목적으로 하는 단체를 구성하거나 이에 가입하는 행위 또는 구성원으로 활동하는 행위를 처벌하도록 정하고 있는데, 이는 구체적인 범죄행위의 실행 여부를 불문하고 범죄행위에 대한 예비·음모의 성격이 있는 범죄단체의 생성 및 존속 자체를 막으려는 데 입법 취지가 있다.","cite":"대법원 2015도7081","badge":"","topic":"","from":"GY-2023-2-X-13","seq":null},{"id":"X-OX-184","subject":"형사법","unit":"형법 총론","stmt":"업무상의 임무라는 신분관계가 없는 자가 신분관계 있는 자와 공모하여 업무상배임죄를 범한 경우, 신분관계가 없는 공범에 대하여는 ｢형법｣ 제33조 본문에 따라 업무상배임죄의 공동 정범이 성립하고 업무상배임죄에서 정한 형으로 처단한다. (24.2차)","answer":false,"quote":"업무상배임죄는 업무상 타인의 사무를 처리하는 지위에 있는 사람이 그 임무에 위배하는 행위로써 재산상의 이익을 취득하거나 제3자로 하여금 이를 취득하게 하여 본인에게 손해를 가한 때에 성립하는 것으로서, 이는 타인의 사무를 처리하는 지위라는 점에서 보면 신분관계로 인하여 성립될 범죄이고, 업무상 타인의 사무를 처리하는 지위라는 점에서 보면 단순배임죄에 대한 가중규정으로서 신분관계로 인하여 형의 경중이 있는 경우라고 할 것이므로, 그와 같은 신분관계가 없는 자가 그러한 신분관계가 있는 자와 공모하여 업무상배임죄를 저질렀다면 그러한 신분관계가 없는 자에 대하여는 형법 제33조 단서에 의하여 단순배임죄에 정한 형으로 처단하여야 할 것이다.","cite":"대법원 99도883","badge":"","topic":"","from":"GY-2024-2-X-12","seq":null},{"id":"X-OX-146","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제6조 단서에 따라 “행위지의 법률에 의하여 범죄를 구성”하는가 여부는 법원의 직권조사사항이므로 증명의 대상이 될 수 없다. (23.1차)","answer":false,"quote":"형법 제6조 본문에 의하여 외국인이 대한민국 영역 외에서 대한민국 국민에 대하여 범죄를 저지른 경우 우리 형법이 적용되지만, 같은 조 단서에 의하여 행위지 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우에는 우리 형법을 적용하여 처벌할 수 없고, 이 경우 행위지 법률에 의하여 범죄를 구성하는지는 엄격한 증명에 의하여 검사가 이를 증명하여야 한다.","cite":"대법원 2011도6507","badge":"","topic":"","from":"GY-2023-1-X-34","seq":null},{"id":"X-OX-013","subject":"형사법","unit":"형법 총론","stmt":"형법 제12조의 ‘저항할 수 없는 폭력’은 심리적 의미에 있어서 육체적으로 어떤 행위를 절대적으로 할 수 밖에 없게 하는 경우와 윤리적 의미에서 강압된 경우를 의미한다. (22.2차)","answer":true,"quote":"형법 제12조 소정의 저항할 수 없는 폭력은, 심리적인 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 아니할 수 없게 하는 경우와 윤리적 의미에 있어서 강압된 경우를 말하고, 협박이란 자기 또는 친족의 생명, 신체에 대한 위해를 달리 막을 방법이 없는 협박을 말하며, 강요라 함은 피강요자의 자유스런 의사결정을 하지 못하게 하면서 특정한 행위를 하게 하는 것을 말한다.","cite":"대법원 83도2276","badge":"","topic":"","from":"GY-2022-2-X-06","seq":null},{"id":"X-OX-056","subject":"형사법","unit":"형법 총론","stmt":"수표금액의 지급 또는 거래정지처분을 면할 목적으로 금융기관에 허위신고한 자를 처벌하는 구 ｢부정수표 단속법｣ 제4조의 허위 신고죄와 관련하여, 발행인이 아닌 자는 허위신고의 고의가 없는 발행인을 이용하여 간접정범의 형태로 구 ｢부정수표 단속법｣ 제4조의 허위신고죄를 범할 수 없다. (24.1차)","answer":true,"quote":"부정수표단속법의 목적이 부정수표 등의 발행을 단속처벌함에 있고( 제1조 ), 허위신고죄를 규정한 위 법 제4조 가 \"수표금액의 지급 또는 거래정지처분을 면하게 할 목적\"이 아니라 \"수표금액의 지급 또는 거래정지처분을 면할 목적\"을 요건으로 하고 있는데 수표금액의 지급책임을 부담하는 자 또는 거래정지처분을 당하는 자는 오로지 발행인에 국한되는 점에 비추어 볼 때 발행인 아닌 자는 위 법조가 정한 허위신고죄의 주체가 될 수 없고, 허위신고의 고의 없는 발행인을 이용하여 간접정범의 형태로 허위신고죄를 범할 수도 없다.","cite":"대법원 92도1342","badge":"","topic":"","from":"GY-2024-1-X-09","seq":null},{"id":"X-OX-207","subject":"형사법","unit":"형법 총론","stmt":"가석방 기간 중 고의로 지은 죄로 자격상실 이상의 형을 선고 받아 그 판결이 확정된 경우에 가석방 처분은 효력을 잃는다. (25.2차)","answer":false,"quote":"가석방은 가석방 기간 중 고의로 지은 죄로 금고 이상의 형이 확정되어야 효력을 잃는다.","cite":"형법 제74조","badge":"","topic":"","from":"GY-2025-2-X-13","seq":null},{"id":"X-OX-071","subject":"형사법","unit":"형법 총론","stmt":"변호사가 변호사 아닌 자에게 고용되어 법률사무소의 개설· 운영에 관여하여 변호사법위반죄가 문제된 경우, 변호사의 행위가 ｢형법｣ 총칙상의 공모, 교사 또는 방조에 해당된다고 하더라도 변호사를 변호사 아닌 자의 공범으로 처벌할 수 없다. (24.2차)","answer":true,"quote":"변호사 아닌 자가 변호사를 고용하여 법률사무소를 개설·운영하는 행위에 있어서는 변호사 아닌 자는 변호사를 고용하고 변호사는 변호사 아닌 자에게 고용된다는 서로 대향적인 행위의 존재가 반드시 필요하고, 나아가 변호사 아닌 자에게 고용된 변호사가 고용의 취지에 따라 법률사무소의 개설·운영에 어느 정도 관여할 것도 당연히 예상되는바, 이와 같이 변호사가 변호사 아닌 자에게 고용되어 법률사무소의 개설·운영에 관여하는 행위는 위 범죄가 성립하는 데 당연히 예상될 뿐만 아니라 범죄의 성립에 없어서는 아니 되는 것인데도 이를 처벌하는 규정이 없는 이상, 그 입법 취지에 비추어 볼 때 변호사 아닌 자에게 고용되어 법률사무소의 개설·운영에 관여한 변호사의 행위가 일반적인 형법 총칙상의 공모, 교사 또는 방조에 해당된다고 하더라도 변호사를 변호사 아닌 자의 공범으로서 처벌할 수는 없다.","cite":"대법원 2004도3994","badge":"","topic":"","from":"GY-2024-2-X-12","seq":null},{"id":"X-OX-217","subject":"형사법","unit":"형법 총론","stmt":"포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우 이탈자는 나머지 범행에 관하여는 죄책을 부담하지 아니한다. (26.1차)","answer":false,"quote":"피고인이 포괄일죄의 관계에 있는 범행의 일부를 실행한 후 공범관계에서 이탈하였으나 다른 공범자에 의하여 나머지 범행이 이루어진 경우, 피고인이 관여하지 않은 부분에 대하여도 죄책을 부담한다.","cite":"대법원 2010도9927","badge":"","topic":"","from":"GY-2026-1-X-09","seq":null},{"id":"X-OX-160","subject":"형사법","unit":"형법 총론","stmt":"구 ｢공공기관의 운영에 관한 법률｣ 제53조가 공기업의 임직원으로서 공무원이 아닌 사람을 ｢형법｣ 제129조의 적용에서는 공무원으로 본다고 규정하면서도, 구체적인 공기업 지정과 관련하여 하위규범인 기획재정부장관의 고시에 의하도록 규정한 것은 죄형법정주의에 위배된다. (24.1차)","answer":false,"quote":"공공기관의 운영에 관한 법률 제53조 가 공기업의 임직원으로서 공무원이 아닌 사람은 형법 제129조 의 적용에서는 이를 공무원으로 본다고 규정하고 있을 뿐 구체적인 공기업의 지정에 관하여는 하위규범인 기획재정부장관의 고시에 의하도록 규정한 것이 죄형법정주의에 위배되거나 위임입법의 한계를 일탈한 것인지 여부 (소극)","cite":"대법원 2013도1685","badge":"","topic":"","from":"GY-2024-1-X-01","seq":null},{"id":"X-OX-167","subject":"형사법","unit":"형법 총론","stmt":"사채업자 甲이 채권추심을 위하여 채무자 A에게 채무를 변제하지 않으면 A가 숨기고 싶어하는 과거 행적과 사채를 쓴 사실 등을 남편과 시댁에 알리겠다는 문자메시지를 발송한 경우 (24.1차)","answer":false,"quote":"사채업자인 피고인이 채무자 甲에게, 채무를 변제하지 않으면 甲이 숨기고 싶어하는 과거 행적과 사채를 쓴 사실 등을 남편과 시댁에 알리겠다는 등의 문자메시지를 발송한 사안에서, 피고인에게 협박죄를 인정하는 한편 위와 같은 행위가 정당행위에 해당한다는 주장을 배척한 원심판단을 수긍한 사례","cite":"대법원 2011도2412","badge":"","topic":"","from":"GY-2024-1-X-05","seq":null},{"id":"X-OX-043","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제10조에 규정된 심신장애는 생물학적 요소로서 정신병 또는 비정상적 정신상태와 같은 정신적 장애가 있는 외에 심리학적 요소로서 이와 같은 정신적 장애로 말미암아 사물에 대한 변별능력과 그에 따른 행위통제능력이 결여되거나 감소 되었음을 요하므로, 정신적 장애가 있는 자라고 하여도 범행 당시 정상적인 사물변별능력이나 행위통제능력이 있었다면 심신장애로 볼 수 없다. (23.2차)","answer":true,"quote":"형법 제10조 에 규정된 심신장애는 생물학적 요소로서 정신병 또는 비정상적 정신상태와 같은 정신적 장애가 있는 외에 심리학적 요소로서 이와 같은 정신적 장애로 말미암아 사물에 대한 변별능력과 그에 따른 행위통제능력이 결여되거나 감소되었음을 요하므로, 정신적 장애가 있는 자라고 하여도 범행 당시 정상적인 사물변별능력이나 행위통제능력이 있었다면 심신장애로 볼 수 없다.","cite":"대법원 2006도7900","badge":"","topic":"","from":"GY-2023-2-X-07","seq":null},{"id":"X-OX-053","subject":"형사법","unit":"형법 총론","stmt":"캐나다 시민권자인 甲이 투자금을 교부받더라도 선물시장에 투자하여 운용할 의사나 능력이 없음에도 캐나다에서 그곳에 거주하는 대한민국 국민 A를 기망하여 직접 투자금을 수령한 경우, 甲의 행위가 캐나다 법률에 의해 범죄를 구성하고 그에 대한 소추나 형의 집행이 면제되지 않는 경우에만 우리 형법이 적용된다. (24.1차)","answer":true,"quote":"캐나다 시민권자인 피고인이 투자금을 교부받더라도 선물시장에 투자하여 운용할 의사나 능력이 없음에도, 피해자들을 기망하여 투자금 명목의 돈을 편취하였다는 내용으로 기소된 사안에서, 공소사실 중 ‘피고인이 캐나다에 거주하는 대한민국 국민을 기망하여 캐나다에서 직접 또는 현지 은행계좌로 투자금을 수령한 부분’은 외국인이 대한민국 영역 외에서 대한민국 국민에 대하여 범죄를 저지른 경우에 해당하므로, 이 부분이 행위지인 캐나다 법률에 의하여 범죄를 구성하는지 및 소추 또는 형의 집행이 면제되는지를 심리하여 해당 부분이 행위지 법률에 의하여 범죄를 구성하고 그에 대한 소추나 형의 집행이 면제되지 않는 경우에 한하여 우리 형법을 적용하였어야 하는데도, 이에 관하여 아무런 증명이 없는 상황에서 공소사실 전부를 유죄로 인정한 원심판결에 재판권 인정에 관한 법리오해 및 심리미진의 위법이 있다고 한 사례.","cite":"대법원 2011도6507","badge":"","topic":"","from":"GY-2024-1-X-02","seq":null},{"id":"X-OX-018","subject":"형사법","unit":"형법 총론","stmt":"수 개의 등록상표에 대하여 상표법 제230조의 상표권 침해행위가 계속하여 이루어진 경우에는 등록상표마다 포괄하여 1개의 범죄가 성립하나, 하나의 유사상표 사용행위로 수 개의 등록상표를 동시에 침해하였다면 각각의 상표법 위반죄는 상상적 경합의 관계에 있다. (22.2차)","answer":true,"quote":"수 개의 등록상표에 대하여 상표권 침해행위가 계속하여 이루어진 경우의 죄수(罪數)(=등록상표마다 포괄하여 일죄) / 하나의 유사상표 사용행위로 수 개의 등록상표를 동시에 침해한 경우, 각각의 상표법 위반죄의 죄수관계(=상상적 경합범)","cite":"대법원 2019도11688","badge":"","topic":"","from":"GY-2022-2-X-11","seq":null},{"id":"X-OX-183","subject":"형사법","unit":"형법 총론","stmt":"공동가공의 의사는 타인의 범행을 인식하면서도 이를 제지하지 아니하고 용인하는 것만으로도 충분하고, 반드시 공동의 의사로 특정한 범죄행위를 하기 위해 일체가 되어 서로 다른 사람의 행위를 이용하여 자기 의사를 실행에 옮기는 것을 내용으로 할 필요는 없다. (24.2차)","answer":false,"quote":"공동가공의 의사는 타인의 범행을 알고 말리지 않고 용인하는 것만으로는 부족하고, 일체가 되어 서로의 행위를 이용해 자기 의사를 실행하려는 것이어야 한다.","cite":"대법원 2002도7477 · 형법 제30조","badge":"","topic":"","from":"GY-2024-2-X-10","seq":null},{"id":"X-OX-034","subject":"형사법","unit":"형법 총론","stmt":"교사자의 교사행위에도 불구하고 피교사자가 범행을 승낙하지 아니하거나 피교사자의 범행결의가 교사자의 교사행위에 의하여 생긴 것으로 보기 어려운 경우에는 실패한 교사로서 ｢형법｣ 제31조 제3항에 따라 교사자를 예비･음모에 준하여 처벌할 수 있다. (23.1차)","answer":true,"quote":"피교사자가 승낙하지 않았거나 결의가 교사에서 나온 것이 아니면 실패한 교사로, 교사자만 예비·음모에 준해 처벌한다.","cite":"형법 제31조","badge":"","topic":"","from":"GY-2023-1-X-11","seq":null},{"id":"X-OX-045","subject":"형사법","unit":"형법 총론","stmt":"비신분자가 신분관계로 인하여 성립될 범죄에 가공한 경우, 비신분자에게 공동가공의 의사와 이에 기초한 기능적 행위지 배를 통해 범죄의 실행이라는 주관적·객관적 요건이 충족되면 신분자와 공동정범이 성립한다. (23.2차)","answer":true,"quote":"이 경우 신분관계가 없는 사람에게 공동가공의 의사와 이에 기초한 기능적 행위지배를 통한 범죄의 실행이라는 주관적·객관적 요건이 충족되면 공동정범으로 처벌한다.","cite":"대법원 2018도13792","badge":"","topic":"","from":"GY-2023-2-X-11","seq":null},{"id":"X-OX-038","subject":"형사법","unit":"형법 총론","stmt":"형사처벌에 관한 위임입법은 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우에 한하여 수권법률(위임법률)이 구성요건의 점에서는 처벌대상인 행위가 어떠한 것인지 이를 예측할 수 있을 정도로 구체적으로 정하고, 형벌의 점에서는 형벌의 종류 및 그 상한과 폭을 명확히 규정하는 것을 전제로 허용된다. (23.2차)","answer":true,"quote":"사회현상의 복잡다기화와 국회의 전문적·기술적 능력의 한계 및 시간적 적응능력의 한계로 인하여 형사처벌에 관련된 모든 법규를 예외 없이 형식적 의미의 법률에 의하여 규정한다는 것은 사실상 불가능할 뿐만 아니라 실제에 적합하지도 아니하기 때문에, 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우에 한하여 수권법률(위임법률)이 구성요건의 점에서는 처벌대상인 행위가 어떠한 것인지 이를 예측할 수 있을 정도로 구체적으로 정하고, 형벌의 점에서는 형벌의 종류 및 그 상한과 폭을 명확히 규정하는 것을 전제로 위임입법이 허용되며, 이러한 위임입법은 죄형법정주의에 반하지 않는다.","cite":"대법원 2002도2998","badge":"","topic":"","from":"GY-2023-2-X-01","seq":null},{"id":"X-OX-215","subject":"형사법","unit":"형법 총론","stmt":"행정상의 단속을 주안으로 하는 법규는 과실범을 처벌하는 명문 규정이 있는 경우를 제외하고는, 해석상 과실범도 벌할 뜻이 명확한 경우라 하더라도 형법의 원칙에 따라 ‘고의’가 있어야 벌할 수 있다. (26.1차)","answer":false,"quote":"행정상의 단속을 주안으로 하는 법규라 하더라도 ‘명문규정이 있거나 해석상 과실범도 벌할 뜻이 명확한 경우’를 제외하고는 형법의 원칙에 따라 ‘고의’가 있어야 벌할 수 있다.","cite":"대법원 2009도9807","badge":"","topic":"","from":"GY-2026-1-X-05","seq":null},{"id":"X-OX-134","subject":"형사법","unit":"형법 총론","stmt":"甲이 담배제조업 허가 없이 전자장치를 이용해 흡입할 수 있는 니코틴이 포함된 용액을 제조한 경우, 궐련담배제조업의 허가 기준은 존재하나 전자담배제조업에 관한 허가기준이 없는 이상 甲에게 담배제조업 관련 법령의 허가기준을 준수하거나 허가 기준이 새롭게 마련될 때까지 법 준수를 요구하는 것을 기대 할 수 없다. (22.2차)","answer":false,"quote":"피고인들이 공모하여, 고농도 니코틴 용액에 프로필렌글리콜(Propylene Glycol)과 식물성 글리세린(Vegetable Glycerin)과 같은 희석액, 소비자의 기호에 맞는 향료를 일정한 비율로 첨가하여 전자장치를 이용해 흡입할 수 있는 ‘니코틴이 포함된 용액’을 만드는 방법으로 담배제조업 허가 없이 담배를 제조하였다고 하여 담배사업법 위반으로 기소된 사안에서, 담배사업법령에서 담배제조업 허가제 및 허가기준을 둔 취지에 비추어 보면, 담배사업법의 위임을 받은 기획재정부가 전자담배제조업에 관한 허가기준을 마련하지 않고 있으나, 정부는 전자담배제조업의 허가와 관련하여 자본금, 시설, 기술인력, 담배 제조 기술의 연구·개발 및 국민 건강보호를 위한 품질관리 등에 관한 적정한 기준을 마련함에 있어 법률이 위임한 정책적 판단 재량이 존재하고, 궐련담배제조업에 관한 허가기준은 이미 마련되어 있는 상황에서 담배제조업 관련 법령의 허가기준을 준수하거나 허가기준이 새롭게 마련될 때까지 법 준수를 요구하는 것이, 피고인들이 아닌 사회적 평균인의 입장에서도 불가능하거나 현저히 곤란한 것을 요구하여 죄형법정주의 원칙에 위반된다거나 기대가능성이 없는 행위를 처벌하는 것이어서 위법하다고 보기 어렵다고 한 사례.","cite":"대법원 2018도9828","badge":"","topic":"","from":"GY-2022-2-X-06","seq":null},{"id":"X-OX-219","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제30조의 공동정범에는 고의범뿐만 아니라 과실범도 포함되므로, 비록 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없더라도 과실범의 공동정범은 성립할 수 있다. (26.1차)","answer":false,"quote":"형법 제30조 에서 정한 ‘2인 이상이 공동하여 죄를 범한 때’의 ‘죄’에는 고의범뿐만 아니라 과실범도 포함되는 것이므로 과실범의 경우에도 공동정범이 성립할 수 있으나, 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없었다면 ‘공동하여’ 죄를 범하였다고 볼 수 없으므로, 과실범의 공동정범이 성립한다고 볼 수 없다.","cite":"대법원 2024도1856","badge":"","topic":"","from":"GY-2026-1-X-09","seq":null},{"id":"X-OX-049","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제316조 제2항 소정의 전자기록등내용탐지죄는 봉함 기타 비밀장치한 전자기록 등 특수매체기록을 기술적 수단을 이용하여 그 내용을 알아낸 자를 처벌하는 규정인바, 전자기록 등 특수매체기록에 해당하더라도 봉함 기타 비밀장치가 되어 있지 아니한 것은 이를 기술적 수단을 동원해서 알아냈더라도 전자 기록등내용탐지죄가 성립하지 않는다. (23.2차)","answer":true,"quote":"봉함 기타 비밀장치가 되어 있지 아니한 전자기록 등 특수매체기록을 기술적 수단을 동원하여 그 내용을 알아낸 경우, 전자기록등내용탐지죄가 성립하는지 여부 (소극)","cite":"대법원 2021도8900","badge":"","topic":"","from":"GY-2023-2-X-19","seq":null},{"id":"X-OX-187","subject":"형사법","unit":"형법 총론","stmt":"죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상 으로 삼는 경우, 신설된 포괄일죄에 해당하는 행위가 그 법의 시행 이전과 이후에 걸쳐서 이루어졌다면 시행 이전의 행위에 대하여도 신설된 법규를 적용하여 처벌할 수 있다. (25.1차)","answer":false,"quote":"포괄일죄에 관한 기존 처벌법규에 대하여 그 표현이나 형량과 관련한 개정을 하는 경우가 아니라 애초에 죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우에는 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여는 신설된 법규를 적용하여 처벌할 수 없고( 형법 제1조 제1항 ), 이는 신설된 처벌법규가 상습범을 처벌하는 구성요건인 경우에도 마찬가지이다.","cite":"대법원 2022도10660","badge":"","topic":"","from":"GY-2025-1-X-01","seq":null},{"id":"X-OX-173","subject":"형사법","unit":"형법 총론","stmt":"빌라 아래층에 살던 사람이 주변의 생활소음에 대한 불만으로 이웃을 괴롭히기 위해 불상의 도구로 수개월에 걸쳐 늦은 밤부터 새벽 사이에 반복하여 벽 또는 천장을 두드려 ‘쿵쿵’ 소리를 내어 이를 위층에 살던 피해자의 의사에 반하여 피해자에게 도달하게 한 경우, 이는 객관적･일반적으로 상대방에게 불안감 내지 공포심을 일으키기에 충분한 행위라 볼 수 없어 스토킹 범죄를 구성하지 않는다. (24.1차)","answer":false,"quote":"빌라 아래층에 살던 피고인이 불상의 도구로 여러 차례 벽 또는 천장을 두드려 ‘쿵쿵’ 소리를 내어 이를 위층에 살던 피해자의 의사에 반하여 피해자에게 도달하게 하였다는 공소사실로 스토킹범죄의 처벌 등에 관한 법률 위반죄로 기소된 사안에서, 이웃 간 소음 등으로 인한 분쟁과정에서 위와 같은 행위가 발생하였다고 하여 곧바로 정당한 이유 없이 객관적·일반적으로 불안감 또는 공포심을 일으키는 ‘스토킹행위’에 해당한다고 단정할 수는 없으나, 피고인이 층간소음 기타 주변의 생활소음에 불만을 표시하며 수개월에 걸쳐 이웃들이 잠드는 시각인 늦은 밤부터 새벽 사이에 반복하여 도구로 벽을 치거나 음향기기를 트는 등으로 피해자를 비롯한 주변 이웃들에게 큰 소리가 전달되게 하였고, 피고인의 반복되는 행위로 다수의 이웃들은 수개월 내에 이사를 갈 수밖에 없었으며, 피고인은 이웃의 112 신고에 의하여 출동한 경찰관으로부터 주거지 문을 열어 줄 것을 요청받고도 대화 및 출입을 거부하였을 뿐만 아니라 주변 이웃들의 대화 시도를 거부하고 오히려 대화를 시도한 이웃을 스토킹혐의로 고소하는 등 이웃 간의 분쟁을 합리적으로 해결하려 하기보다 이웃을 괴롭힐 의도로 위 행위를 한 것으로 보이는 점 등 피고인과 피해자의 관계, 구체적 행위 태양 및 경위, 피고인의 언동, 행위 전후의 여러 사정들에 비추어 보면, 피고인의 위 행위는 층간소음의 원인 확인이나 해결방안 모색 등을 위한 사회통념상 합리적 범위 내의 정당한 이유 있는 행위라고 볼 수 없고, 객관적·일반적으로 상대방에게 불안감 내지 공포심을 일으키기에 충분하며, 나아가 위와 같은 일련의 행위가 지속되거나 반복되었으므로 ‘스토킹범죄’를 구성한다고 본 원심판단을 정당하다고 한 사례.","cite":"대법원 2023도10313","badge":"","topic":"","from":"GY-2024-1-X-16","seq":null},{"id":"X-OX-006","subject":"형사법","unit":"형법 총론","stmt":"甲이 乙의 돈을 절취한 다음 다른 금전과 섞거나 교환하지 않고 쇼핑백 등에 넣어 자신의 집에 숨겨두었는데, 丙이 乙의 지시로 甲에게 겁을 주어 쇼핑백 등에 들어 있던 절취된 돈을 교부받아 갈취하였다면, 위 돈은 타인인 甲의 재물이라고 볼 수 없다. (22.1차)","answer":true,"quote":"甲이 乙의 돈을 절취한 다음 다른 금전과 섞거나 교환하지 않고 쇼핑백 등에 넣어 자신의 집에 숨겨두었는데, 피고인이 乙의 지시로 폭력조직원 丙과 함께 甲에게 겁을 주어 쇼핑백 등에 들어 있던 절취된 돈을 교부받아 갈취하였다고 하여 폭력행위 등 처벌에 관한 법률 위반(공동공갈)으로 기소된 사안에서, 피고인 등이 甲에게서 되찾은 돈은 절취 대상인 당해 금전이라고 구체적으로 특정할 수 있어 객관적으로 甲의 다른 재산과 구분됨이 명백하므로 이를 타인인 甲의 재물이라고 볼 수 없고, 따라서 비록 피고인 등이 甲을 공갈하여 돈을 교부받았더라도 타인의 재물을 갈취한 행위로서 공갈죄가 성립된다고 볼 수 없는데도, 이와 달리 보아 유죄를 인정한 원심판결에 공갈죄의 대상인 타인의 재물 등에 관한 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2012도6157","badge":"","topic":"","from":"GY-2022-1-X-22","seq":null},{"id":"X-OX-022","subject":"형사법","unit":"형법 총론","stmt":"물품반출 업무담당자 A가 물품을 밀반출하는 甲의 행위를 소속회사에 사전에 알리고 그 정확한 증거를 확보하기 위하여 甲의 밀반출행위를 묵인한 경우, 이는 함정수사에 해당하지 아니한다. (22.2차)","answer":true,"quote":"소위 함정수사라 함은 본래 범의를 가지지 아니한 자에 대하여 수사기관이 사술이나 계략 등을 써서 범죄를 유발케 하여 범죄인을 검거하는 수사방식을 말하는 것이므로 위 물품반출업무담당자가 소속회사에 밀반출행위를 사전에 알리고 그 정확한 증거를 확보하기 위하여 피고인의 밀반출행위를 묵인하였다는 것은 이른바 함정수사에 비유할 수는 없다.","cite":"대법원 87도915","badge":"","topic":"","from":"GY-2022-2-X-31","seq":null},{"id":"X-OX-208","subject":"형사법","unit":"형법 총론","stmt":"건물 소유자가 안전배려나 안전관리 사무에 계속적으로 종사하거나 그러한 계속적 사무를 담당하는 지위를 가지지 않은 채, 단지 건물을 비정기적으로 수리하거나 건물의 일부분을 임대한 경우라도 건물 소유자의 위와 같은 행위가 업무상 과실치상죄의 ‘업무’에 해당한다고 보아야 한다. (25.2차)","answer":false,"quote":"그러나 건물 소유자가 안전배려나 안전관리 사무에 계속적으로 종사하거나 그러한 계속적 사무를 담당하는 지위를 가지지 않은 채 단지 건물을 비정기적으로 수리하거나 건물의 일부분을 임대하였다는 사정만으로는 건물 소유자의 위와 같은 행위가 업무상과실치상죄의 ‘업무’에 해당한다고 보기 어렵다.","cite":"대법원 2016도16738","badge":"","topic":"","from":"GY-2025-2-X-15","seq":null},{"id":"X-OX-047","subject":"형사법","unit":"형법 총론","stmt":"고속도로를 무단횡단하는 보행자를 충격하여 사고를 발생시킨 경우라도 운전자가 상당한 거리에서 보행자의 무단횡단을 미리 예상할 수 있는 사정이 있었고, 그에 따라 즉시 감속하거나 급제동하는 등의 조치를 취하였다면 보행자와의 충돌을 피할 수 있었다는 등의 특별한 사정이 인정되는 경우에는 자동차 운전자의 과실을 인정할 수 있다. (23.2차)","answer":true,"quote":"고속도로를 운행하는 자동차의 운전자로서는 일반적인 경우에 고속도로를 횡단하는 보행자가 있을 것까지 예견하여 보행자와의 충돌사고를 예방하기 위하여 급정차 등의 조치를 취할 수 있도록 대비하면서 운전할 주의의무가 없고, 다만 고속도로를 무단횡단하는 보행자를 충격하여 사고를 발생시킨 경우라도 운전자가 상당한 거리에서 보행자의 무단횡단을 미리 예상할 수 있는 사정이 있었고, 그에 따라 즉시 감속하거나 급제동하는 등의 조치를 취하였다면 보행자와의 충돌을 피할 수 있었다는 등의 특별한 사정이 인정되는 경우에만 자동차 운전자의 과실이 인정될 수 있다.","cite":"대법원 2000도2671","badge":"","topic":"","from":"GY-2023-2-X-15","seq":null},{"id":"X-OX-032","subject":"형사법","unit":"형법 총론","stmt":"교사범이란 타인으로 하여금 범죄실행의 결의를 일으키게 하고, 이 결의에 의하여 범죄를 실행하게 함으로써 성립하는 범죄로서 ｢형법｣ 제31조 제1항에 따라 정범과 동일한 형으로 처벌한다. (23.1차)","answer":true,"quote":"교사범은 없던 범죄 결의를 일으켜 실행하게 한 사람으로 정범과 같은 형으로 벌하고, 이미 결의한 사람을 거든 것은 방조다.","cite":"형법 제31조","badge":"","topic":"","from":"GY-2023-1-X-11","seq":null},{"id":"X-OX-189","subject":"형사법","unit":"형법 총론","stmt":"배임죄에 있어서 타인의 사무를 처리할 의무의 주체가 법인이 되는 경우, 법인은 배임죄의 주체가 될 수 있다. (25.1차)","answer":false,"quote":"형법 제355조 제2항 의 배임죄에 있어서 타인의 사무를 처리할 의무의 주체가 법인이 되는 경우라도 법인은 다만 사법상의 의무주체가 될 뿐 범죄능력이 없는 것이며 그 타인의 사무는 법인을 대표하는 자연인인 대표기관의 의사결정에 따른 대표행위에 의하여 실현될 수 밖에 없어 그 대표기관은 마땅히 법인이 타인에 대하여 부담하고 있는 의무내용 대로 사무를 처리할 임무가 있다 할 것이므로 법인이 처리할 의무를 지는 타인의 사무에 관하여는 법인이 배임죄의 주체가 될 수 없고 그 법인을 대표하여 사무를 처리하는 자연인인 대표기관이 바로 타인의 사무를 처리하는 자 즉 배임죄의 주체가 된다.","cite":"대법원 82도2595","badge":"","topic":"","from":"GY-2025-1-X-03","seq":null},{"id":"X-OX-195","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제27조에서 규정하고 있는 불능미수는 실행의 수단이나 대상의 착오로 처음부터 구성요건이 충족될 가능성이 없는 경우 이므로, 실행의 착수로 볼 수 있는 행위가 있어야 하는 것은 아니다. (25.1차)","answer":false,"quote":"① 형법 제27조 에서 규정하고 있는 불능미수는 행위자에게 범죄의사가 있고 실행의 착수라고 볼 수 있는 행위가 있지만 실행의 수단이나 대상의 착오로 처음부터 구성요건이 충족될 가능성이 없는 경우이다.","cite":"대법원 2018도16002","badge":"","topic":"","from":"GY-2025-1-X-09","seq":null},{"id":"X-OX-225","subject":"형사법","unit":"형법 총론","stmt":"범죄사실에 대한 뚜렷한 확증없이 단지 정황증거 내지 간접증거들 만으로 공소사실을 유죄로 인정하더라도 채증법칙 위반이라고 할 수 없다. (26.1차)","answer":false,"quote":"범죄사실에 대한 뚜렷한 확증없이 단지 정황증거 내지 간접증거들 만으로 공소사실을 유죄로 인정하였다 하여 채증법칙위배를 이유로 원심판결을 파기한 사례","cite":"대법원 87도795","badge":"","topic":"","from":"GY-2026-1-X-35","seq":null},{"id":"X-OX-158","subject":"형사법","unit":"형법 총론","stmt":"공연성은 명예훼손죄의 구성요건으로서, 특정 소수에 대한 사실적시의 경우 공연성이 부정되는 유력한 사정이 될 수 있으므로 전파될 가능성에 관하여는 검사에게 증명의 책임이 있음이 원칙이나, 전파될 가능성은 특정되지 않은 기간과 공간에서 아직 구체화되지 않은 사실이므로 그 증명의 정도는 자유로운 증명으로 족하다. (23.2차)","answer":false,"quote":"공연성은 명예훼손죄와 모욕죄의 구성요건으로서, 명예훼손이나 모욕에 해당하는 표현을 특정 소수에게 한 경우 공연성이 부정되는 유력한 사정이 될 수 있으므로, 전파될 가능성에 관해서는 검사의 엄격한 증명이 필요하다.","cite":"대법원 2020도8336","badge":"","topic":"","from":"GY-2023-2-X-34","seq":null},{"id":"X-OX-093","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제20조의 ‘사회상규에 위배되지 아니하는 행위’는 구성 요건에 해당하는 행위가 형식적으로 위법하더라도 사회가 내리는 공적 평가에 의하여 용인될 수 있다면 그 행위를 실질적으로 위법한 것으로는 평가할 수 없다는 일반적 위법성조각사유이다. (25.2차)","answer":true,"quote":"형법 제20조 의 ‘사회상규에 위배되지 아니하는 행위’는 우리 형법의 독특한 규정으로, 구성요건에 해당하는 행위가 형식적으로 위법하더라도 사회가 내리는 공적 평가에 의하여 용인될 수 있다면 그 행위를 실질적으로 위법한 것으로는 평가할 수 없다는 취지에서 도입된 일반적 위법성조각사유이다.","cite":"대법원 2021도2084","badge":"","topic":"","from":"GY-2025-2-X-07","seq":null},{"id":"X-OX-179","subject":"형사법","unit":"형법 총론","stmt":"오인에 정당한 이유가 있는지 여부를 판단하는 과정에서 위법성 인식에 필요한 노력의 정도는 행위 당시의 구체적 상황에 행위자 대신에 법률가나 관련 분야의 전문가가 아닌 사회 평균인을 두고 이 평균인의 관점에서 판단해야 하며, 행위자가 속한 사회집단에 따라 달리 평가되면 안된다. (24.2차)","answer":false,"quote":"위법성 인식에 필요한 노력의 정도는 구체적 행위 정황과 행위자 개인의 인식능력, 행위자가 속한 사회집단에 따라 달리 평가한다.","cite":"대법원 2005도3717 · 형법 제16조","badge":"","topic":"","from":"GY-2024-2-X-06","seq":null},{"id":"X-OX-051","subject":"형사법","unit":"형법 총론","stmt":"어린이집 대표자를 변경하였음에도 변경인가를 받지 않은 채 어린이집을 운영한 행위에 대해 설치인가를 받지 않고 사실상 어린이집의 형태로 운영하는 행위 등을 처벌하는 규정인 ｢영유아 보육법｣ 제54조 제4항 제1호를 적용하는 것은 죄형법정주의에 위배된다. (24.1차)","answer":true,"quote":"어린이집 대표자를 변경하고도 변경인가를 받지 않은 채 어린이집을 운영한 행위에 대하여 설치인가를 받지 않고 사실상 어린이집의 형태로 운영한 행위 등을 처벌하는 규정인 영유아보육법 제54조 제4항 제1호 를 적용하거나 유추 적용할 수 있는지 여부 (소극)","cite":"대법원 2021도6860","badge":"","topic":"","from":"GY-2024-1-X-01","seq":null},{"id":"X-OX-085","subject":"형사법","unit":"형법 총론","stmt":"몰수‧추징의 대상이 되는지 여부나 추징액의 인정은 범죄구성 요건사실에 관한 것이 아니어서 엄격한 증명은 필요 없지만 역시 증거에 의하여 인정되어야 한다. (25.1차)","answer":true,"quote":"몰수·추징의 대상이 되는지 여부나 추징액의 인정 등이 엄격한 증명을 요하는지 여부 (소극) / 몰수·추징의 대상이 되는 범죄수익을 특정할 수 없는 경우, 추징할 수 있는지 여부 (소극)","cite":"대법원 2014도4708","badge":"","topic":"","from":"GY-2025-1-X-34","seq":null},{"id":"X-OX-074","subject":"형사법","unit":"형법 총론","stmt":"과료는 판결확정일로부터 30일내에 납입하여야 하며, 과료를 납입하지 아니한 자는 1일 이상 30일 미만의 기간 노역장에 유치하여 작업에 복무하게 한다. (24.2차)","answer":true,"quote":"②벌금을 납입하지 아니한 자는 1일 이상 3년 이하, 과료를 납입하지 아니한 자는 1일 이상 30일 미만의 기간 노역장에 유치하여 작업에 복무하게 한다.","cite":"형법 제69조 제2항","badge":"","topic":"","from":"GY-2024-2-X-14","seq":null},{"id":"X-OX-002","subject":"형사법","unit":"형법 총론","stmt":"행정상의 단속을 주안으로 하는 법규라 하더라도 명문규정이 있거나 해석상 과실범도 벌할 뜻이 명확한 경우를 제외하고는 형법의 원칙에 따라 고의가 있어야 벌할 수 있다. (22.1차)","answer":true,"quote":"행정상의 단속을 주안으로 하는 법규라 하더라도 ‘명문규정이 있거나 해석상 과실범도 벌할 뜻이 명확한 경우’를 제외하고는 형법의 원칙에 따라 ‘고의’가 있어야 벌할 수 있다.","cite":"대법원 2009도9807","badge":"","topic":"","from":"GY-2022-1-X-04","seq":null},{"id":"X-OX-012","subject":"형사법","unit":"형법 총론","stmt":"양벌규정에 의해 법인이 처벌되는 경우, 공모한 수인의 사용인 가운데 A, B법인의 사용인은 직접 실행행위에 가담하지 않고 C법인의 사용인만 실행행위를 분담한 경우에도 A, B법인은 C법인과 공동정범이 될 수 있다. (22.2차)","answer":true,"quote":"양벌규정에 의하여 법인이 처벌받는 경우에 법인의 사용인들이 범죄행위를 공모한 후 일방법인의 사용인이 그 실행행위에 직접 가담하지 아니하고 다른 공모자인 타법인의 사용인만이 분담실행한 경우에도 그 법인은 공동정범의 죄책을 면할 수 없다.","cite":"대법원 81도2545","badge":"","topic":"","from":"GY-2022-2-X-02","seq":null},{"id":"X-OX-078","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제7조의 ‘외국에서 형의 전부 또는 일부가 집행된 사람’ 에는 ‘외국 법원의 유죄판결에 의하여 벌금형의 전부 또는 일부가 실제로 집행된 사람’이 포함된다. (25.1차)","answer":true,"quote":"그런데 여기서 ‘외국에서 형의 전부 또는 일부가 집행된 사람’이란 문언과 취지에 비추어 ‘외국 법원의 유죄판결에 의하여 자유형이나 벌금형 등 형의 전부 또는 일부가 실제로 집행된 사람’을 말한다고 해석하여야 한다.","cite":"대법원 2017도5977","badge":"","topic":"","from":"GY-2025-1-X-02","seq":null},{"id":"X-OX-023","subject":"형사법","unit":"형법 총론","stmt":"전문증거라도 당사자가 동의한 경우에는 전문법칙이 적용되지 않으며, 증인의 신용성을 탄핵하기 위한 탄핵증거로 제출된 경우에도 전문법칙이 적용되지 않는다. (22.2차)","answer":true,"quote":"당사자가 동의한 전문증거는 전문법칙이 적용되지 않고, 탄핵증거는 증명력만 다투므로 전문법칙의 제한을 받지 않는다.","cite":"형사소송법 제318조 · 형사소송법 제318조의2","badge":"","topic":"","from":"GY-2022-2-X-37","seq":null},{"id":"X-OX-202","subject":"형사법","unit":"형법 총론","stmt":"구체적 위험범은 법익침해의 위험이 일반적으로 존재함으로써 범죄의 성립을 인정하는 경우이고, 추상적 위험범은 법익침해의 현실적 위험이 발생할 것을 요건으로 하여 범죄의 성립을 인정하는 경우이다. (25.2차)","answer":false,"quote":"현실적 위험이 발생해야 성립하는 것이 구체적 위험범이고 추상적 위험범은 위험 발생을 따지지 않는다 — 구체적 위험범 조문에는 「공공의 위험을 발생하게 한」이 붙는다.","cite":"형법 제166조 · 형법 제167조","badge":"","topic":"","from":"GY-2025-2-X-02","seq":null},{"id":"X-OX-140","subject":"형사법","unit":"형법 총론","stmt":"어떤 사람의 성장교육과정을 통하여 형성된 내재적인 관념 내지 확신으로 인하여 행위자 스스로의 의사결정이 사실상 강제되는 결과를 낳게 하는 경우도 ｢형법｣ 제12조의 강요된 행위에 포함된다. (23.1차)","answer":false,"quote":"형법 제12조 에서 말하는 강요된 행위는 저항할 수 없는 폭력이나 생명, 신체에 위해를 가하겠다는 협박 등 다른 사람의 강요행위에 의하여 이루어진 행위를 의미하는 것이지 어떤 사람의 성장교육과정을 통하여 형성된 내재적인 관념 내지 확신으로 인하여 행위자 스스로의 의사결정이 사실상 강제되는 결과를 낳게 하는 경우까지 의미한다고 볼 수 없다.","cite":"대법원 89도1670","badge":"","topic":"","from":"GY-2023-1-X-08","seq":null},{"id":"X-OX-064","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제62조의2 제1항에 따라 형의 집행유예 시 부과할 수 있는 보호관찰은 형벌이 아니라 보안처분의 성격을 갖는 것 으로서 재판 시의 규정에 의하여 보호관찰을 받을 것을 명할 수 있다고 해석하는 것은 형벌불소급의 원칙에 반하지 않는다. (24.2차)","answer":true,"quote":"제1항 의 규정에 의한 보호관찰의 기간은 집행을 유예한 기간으로 하고, 다만 법원은 유예기간의 범위 내에서 보호관찰의 기간을 정할 수 있다고 규정되어 있는바, 위 조항에서 말하는 보호관찰은 형벌이 아니라 보안처분의 성격을 갖는 것으로서, 과거의 불법에 대한 책임에 기초하고 있는 제재가 아니라 장래의 위험성으로부터 행위자를 보호하고 사회를 방위하기 위한 합목적적인 조치이므로, 그에 관하여 반드시 행위 이전에 규정되어 있어야 하는 것은 아니며, 재판시의 규정에 의하여 보호관찰을 받을 것을 명할 수 있다고 보아야 할 것이고, 이와 같은 해석이 형벌불소급의 원칙 내지 죄형법정주의에 위배되는 것이라고 볼 수 없다.","cite":"대법원 97도703","badge":"","topic":"","from":"GY-2024-2-X-01","seq":null},{"id":"X-OX-138","subject":"형사법","unit":"형법 총론","stmt":"법원은 전과조회서가 변론종결 후에 회보되었다 하더라도 변론재개 없이 전과조회서에 기재된 누범전과의 사실을 근거로 형을 가중할 수 있다. (22.2차)","answer":false,"quote":"형을 가중하는 누범전과는 공판정의 증거조사를 거쳐야 하므로, 변론종결 뒤 회보된 전과조회서로는 변론재개 없이 가중할 수 없다.","cite":"형사소송법 제307조 · 형법 제35조","badge":"","topic":"","from":"GY-2022-2-X-34","seq":null},{"id":"X-OX-102","subject":"형사법","unit":"형법 총론","stmt":"산후조리원의 신생아 집단관리 책임자 甲이 산후조리원에 입소한 신생아가 계속하여 잦은 설사 등의 이상증세를 보임에도 불구하고 의사의 진찰을 받도록 하지 않아 신생아가 사망한 경우, 甲에게 업무상 과실치사죄가 인정된다. (25.2차)","answer":true,"quote":"산후조리원에 입소한 신생아가 출생 후 10일 이상이 경과하도록 계속하여 수유량 및 체중이 지나치게 감소하고 잦은 설사 등의 이상증세를 보임에도 불구하고, 산후조리원의 신생아 집단관리를 맡은 책임자가 의사나 한의사 등의 진찰을 받도록 하지 않아 신생아가 탈수 내지 괴사성 장염으로 사망한 사안에서, 위 집단관리 책임자가 산모에게 신생아의 이상증세를 즉시 알리고 적절한 조치를 구하여 산모의 지시를 따른 것만으로는 업무상 주의의무를 다하였다고 볼 수 없다며 신생아 사망에 대한 업무상 과실치사의 죄책을 인정한 사례.","cite":"대법원 2005도1796","badge":"","topic":"","from":"GY-2025-2-X-15","seq":null},{"id":"X-OX-095","subject":"형사법","unit":"형법 총론","stmt":"공동정범자 중 1인이 자의로 자기가 다른 공범의 범행을 중지하게 하지 아니한 채 자기만의 범의를 철회‧포기한 경우 중지미수에 해당하지 않는다. (25.2차)","answer":true,"quote":"다른 공범의 범행을 중지하게 하지 아니한 채 자기만의 범의를 철회·포기한 경우, 중지미수의 인정 여부 (소극)","cite":"대법원 2004도8259","badge":"","topic":"","from":"GY-2025-2-X-09","seq":null},{"id":"X-OX-121","subject":"형사법","unit":"형법 총론","stmt":"법률의 착오와 관련하여 위법성의 인식에 필요한 노력의 정도는 행위자 개인의 인식능력이 기준이 되는 것이므로, 행위자가 어떤 사회집단에 소속되어 있는가는 고려할 필요가 없다. (22.1차)","answer":false,"quote":"위법성 인식에 필요한 노력의 정도는 구체적 행위정황과 행위자 개인의 인식능력, 그리고 그가 속한 사회집단에 따라 달리 평가한다.","cite":"대법원 2005도3717 · 형법 제16조","badge":"","topic":"","from":"GY-2022-1-X-08","seq":null},{"id":"X-OX-030","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제12조의 ‘저항할 수 없는 폭력’은 심리적인 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 않을 수 없게 하는 행위와 윤리적 의미에 있어서 강압된 경우를 말한다. (23.1차)","answer":true,"quote":"형법 제12조 소정의 저항할 수 없는 폭력은, 심리적인 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 아니할 수 없게 하는 경우와 윤리적 의미에 있어서 강압된 경우를 말하고, 협박이란 자기 또는 친족의 생명, 신체에 대한 위해를 달리 막을 방법이 없는 협박을 말하며, 강요라 함은 피강요자의 자유스런 의사결정을 하지 못하게 하면서 특정한 행위를 하게 하는 것을 말한다.","cite":"대법원 83도2276","badge":"","topic":"","from":"GY-2023-1-X-08","seq":null},{"id":"X-OX-029","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣은 책임능력의 평가방법에 있어서 제9조의 형사미성년자는 생물학적 방법을, 제10조의 심신장애인은 ‘심신장애’라는 생물학적 방법과 ‘사물변별능력･의사결정능력’이라는 심리적 방법의 혼합적 방법을 채택하고 있다. (23.1차)","answer":true,"quote":"형사미성년자는 14세라는 나이만 보는 생물학적 방법, 심신장애는 정신적 장애와 판단·의지 능력을 함께 보는 혼합적 방법이다.","cite":"형법 제9조 · 형법 제10조","badge":"","topic":"","from":"GY-2023-1-X-07","seq":null},{"id":"X-OX-113","subject":"형사법","unit":"형법 총론","stmt":"법인의 직원 또는 사용인이 법규위반행위를 하여 양벌규정에 의하여 법인이 처벌받는 경우, 법인에게 자수감경에 관한 ｢형법｣ 제52조 제1항의 규정을 적용하기 위하여는 법인의 이사 기타 대표자가 수사책임이 있는 관서에 자수한 경우에 한하고, 그 위반행위를 한 직원 또는 사용인이 자수한 것만으로는 위 규정에 의하여 형을 감경할 수 없다. (26.1차)","answer":true,"quote":"법인의 직원 또는 사용인이 위반행위를 하여 양벌규정에 의하여 법인이 처벌받는 경우, 법인에게 자수감경에 관한 형법 제52조 제1항 의 규정을 적용하기 위하여는 법인의 이사 기타 대표자가 수사책임이 있는 관서에 자수한 경우에 한하고, 그 위반행위를 한 직원 또는 사용인이 자수한 것만으로는 위 규정에 의하여 형을 감경할 수 없다.","cite":"대법원 95도391","badge":"","topic":"","from":"GY-2026-1-X-34","seq":null},{"id":"X-OX-174","subject":"형사법","unit":"형법 총론","stmt":"범인 스스로 도피하는 행위는 처벌되지 않으므로, 범인이 도피를 위하여 타인에게 도움을 요청하는 행위 역시 도피행위의 범주에 속하는 한 처벌되지 않고, 범인이 타인으로 하여금 허위의 자백을 하게 하는 등으로 범인도피죄를 범하게 하는 경우와 같이 그것이 방어권의 남용으로 볼 수 있을 때라 하더라도 범인도피교사죄로 처벌할 수 없다. (24.1차)","answer":false,"quote":"범인 스스로 도피하는 행위는 처벌되지 아니하므로, 범인이 도피를 위하여 타인에게 도움을 요청하는 행위 역시 도피행위의 범주에 속하는 한 처벌되지 아니하며, 범인의 요청에 응하여 범인을 도운 타인의 행위가 범인도피죄에 해당한다고 하더라도 마찬가지이다.","cite":"대법원 2013도12079","badge":"","topic":"","from":"GY-2024-1-X-27","seq":null},{"id":"X-OX-010","subject":"형사법","unit":"형법 총론","stmt":"공직선거법 제262조의 ‘자수’를 통상 관용적으로 사용되는 용례에서 갖는 개념 외에 ‘범행 발각 전’이라는 또 다른 개념을 추가하는 것은 형 면제 사유에 대한 제한적 유추를 통해 처벌범위를 실정법 이상으로 확대하게 되어 유추해석 금지의 원칙에 반한다. (22.2차)","answer":true,"quote":"공직선거법 제262조 의 \"자수\"를 '범행발각 전에 자수한 경우'로 한정하는 풀이는 \"자수\"라는 단어가 통상 관용적으로 사용되는 용례에서 갖는 개념 외에 '범행발각 전'이라는 또다른 개념을 추가하는 것으로서 결국은 '언어의 가능한 의미'를 넘어","cite":"대법원 96도1167","badge":"","topic":"","from":"GY-2022-2-X-01","seq":null},{"id":"X-OX-115","subject":"형사법","unit":"형법 총론","stmt":"포괄일죄에 관한 기존 처벌법규에 대하여 그 표현이나 형량과 관련한 개정을 하는 경우가 아니라 애초에 죄가 되지 아니하던 행위를 구성요건의 신설로 포괄일죄의 처벌대상으로 삼는 경우에는 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여도 신설된 법규를 적용하여 처벌할 수 있다. (22.1차)","answer":false,"quote":"죄가 되지 아니하던 행위를 구성요건 신설로 포괄일죄의 처벌대상으로 삼는 경우, 신설된 포괄일죄 처벌법규가 시행되기 이전의 행위에 대하여 신설된 법규를 적용하여 처벌할 수 있는지 여부 (소극) / 구성요건이 신설된 상습강제추행죄가 시행되기 이전의 범행을 상습강제추행죄로 처벌할 수 있는지 여부 (소극) 및 이 경우 소추요건은 강제추행죄에 관한 것이 구비되어야 하는지 여부 (적극)","cite":"대법원 2015도15669","badge":"","topic":"","from":"GY-2022-1-X-02","seq":null},{"id":"X-OX-216","subject":"형사법","unit":"형법 총론","stmt":"행위자에게 적법행위를 기대할 가능성이 있는지 여부의 판단은 행위자가 행위 당시 인식하였던 사정과 행위 당시의 구체적인 상황 하에 행위자 대신 사회적 평균인을 두고 이 평균인의 관점에서 인식할 수 있었던 사정을 종합적으로 고려하여 판단 하여야 한다. (26.1차)","answer":false,"quote":"피고인에게 적법행위를 기대할 가능성이 있는지 여부를 판단하기 위하여는 행위 당시의 구체적인 상황하에 행위자 대신에 사회적 평균인을 두고 이 평균인의 관점에서 그 기대가능성 유무를 판단하여야 한다.","cite":"대법원 2005도10101","badge":"","topic":"","from":"GY-2026-1-X-07","seq":null},{"id":"X-OX-122","subject":"형사법","unit":"형법 총론","stmt":"자신의 행위가 위법함을 인식하지 못한 이유가 단순한 법률의 부지로 인한 경우라 하더라도 그 오인에 정당한 이유가 있는 경우에 한하여 책임이 조각된다. (22.1차)","answer":false,"quote":"제16조는 일반적으로 죄가 되는 행위를 자기 경우에는 법령상 허용된다고 잘못 안 경우이고, 단순한 법률의 부지는 정당한 이유를 따지지 않고 벌한다.","cite":"대법원 2005도8074 · 형법 제16조","badge":"","topic":"","from":"GY-2022-1-X-08","seq":null},{"id":"X-OX-063","subject":"형사법","unit":"형법 총론","stmt":"｢군형법｣ 제64조 제3항 상관명예훼손죄에 대해 ｢형법｣ 제310조 (위법성의 조각)와 같은 규정을 별도로 두지 않았다고 하더라도 법규범의 체계, 입법 의도와 목적 등에 비추어 정당하다고 평가 되는 한도 내에서 그와 유사한 사안에 관한 법규범을 적용할 수 있다고 할 것이므로 ｢형법｣ 제310조는 ｢군형법｣ 제64조 제3항의 행위에 대해 유추적용된다고 보아야 한다. (24.2차)","answer":true,"quote":"그러나 입법에도 불구하고 입법자가 의도하지 않았던 규율의 공백이 있는 사안에 대하여 법규범의 체계, 입법 의도와 목적 등에 비추어 정당하다고 평가되는 한도 내에서 그와 유사한 사안에 관한 법규범을 적용할 수 있다고 할 것인바, 형법 제307조 제1항 의 행위에 대한 위법성조각사유를 규정한 형법 제310조 는 군형법 제64조 제3항 의 행위에 대해 유추적용된다고 보아야 한다.","cite":"대법원 2023도13333","badge":"","topic":"","from":"GY-2024-2-X-01","seq":null},{"id":"X-OX-008","subject":"형사법","unit":"형법 총론","stmt":"형사소송법 은 헌법이 요구하는 적법 절차를 구현하기 위하여 사건의 실체에 대한 심증 형성은 법관의 면전에서 본래증거에 대한 반대신문이 보장된 증거조사를 통하여 이루어져야 한다는 실질적 직접심리주의와 전문법칙을 채택하고 있다. (22.1차)","answer":true,"quote":"형사소송법(이하 ‘법’이라 한다) 제312조 제4항 , 제314조 는 형사소송에서 헌법이 요구하는 적법절차의 원칙을 구현하기 위하여 사건의 실체에 대한 심증 형성은 법관의 면전에서 본래 증거에 대한 반대신문이 보장된 증거조사를 통하여 이루어져야 한다는 실질적 직접심리주의와 전문법칙을 기본원리로서 채택하면서도, 원진술자의 사망 등으로 위 원칙을 관철할 수 없는 특별한 사정이 있는 경우에는 ‘그 진술 또는 작성이 특히 신빙할 수 있는 상태하에서 행하여졌음이 증명된 때’, 즉 그 진술의 내용이나 조서 또는 서류의 작성에 허위 개입의 여지가 거의 없고 그 진술 내용의 신빙성이나 임의성을 담보할 구체적이고 외부적인 정황이 증명된 때에 한하여 예외적으로 증거능력을 인정하고자 하는 취지이다.","cite":"대법원 2011도6035","badge":"","topic":"","from":"GY-2022-1-X-38","seq":null},{"id":"X-OX-193","subject":"형사법","unit":"형법 총론","stmt":"부진정 부작위범의 경우 작위의무는 법령, 법률행위, 선행행위로 부터 도출되며, 신의성실의 원칙이나 사회상규 혹은 조리로부터 작위의무가 도출될 수는 없다. (25.1차)","answer":false,"quote":"다만 여기서의 작위의무는 법령, 법률행위, 선행행위로 인한 경우는 물론, 신의성실의 원칙이나 사회상규 혹은 조리상 작위의무가 기대되는 경우에도 인정된다.","cite":"대법원 2015도6809","badge":"","topic":"","from":"GY-2025-1-X-06","seq":null},{"id":"X-OX-126","subject":"형사법","unit":"형법 총론","stmt":"음주로 인한 특정범죄 가중처벌 등에 관한 법률 위반(위험운전 치사상)죄는 중한 형태의 도로교통법 위반(음주운전)죄를 기본 범죄로 하는 결과적 가중범으로 그 행위유형과 보호법익을 이미 모두 포함하고 있으므로, 특정범죄 가중처벌 등에 관한 법률 위반(위험운전치사상)죄가 성립하면 도로교통법 위반(음주운전) 죄는 이에 흡수되어 따로 성립하지 아니한다. (22.1차)","answer":false,"quote":"음주로 인한 특정범죄가중처벌 등에 관한 법률 위반(위험운전치사상)죄와 도로교통법 위반(음주운전)죄는 입법 취지와 보호법익 및 적용영역을 달리하는 별개의 범죄이므로, 양 죄가 모두 성립하는 경우 두 죄는 실체적 경합관계에 있다.","cite":"대법원 2008도7143","badge":"","topic":"","from":"GY-2022-1-X-13","seq":null},{"id":"X-OX-196","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제30조에서 정한 ‘2인 이상이 공동하여 죄를 범한 때’ 에는 고의범만 포함되고, 과실범은 포함되지 않는다. (25.1차)","answer":false,"quote":"형법 제30조 에 \" 공동하여 죄를 범한 때\" 의 \" 죄\" 라 함은 고의범이고 과실범이고를 불문하므로 두사람 이상이 어떠한 과실행위를 서로의 의사연락하에 이룩하여 범죄가 되는 결과를 발생케 한 것이라면 과실범의 공동정범이 성립된다.","cite":"대법원 79도1249","badge":"","topic":"","from":"GY-2025-1-X-10","seq":null},{"id":"X-OX-040","subject":"형사법","unit":"형법 총론","stmt":"형벌법규가 대통령령, 총리령, 부령과 같은 법규명령이 아닌 고시 등 행정규칙·행정명령, 조례 등에 구성요건의 일부를 수권 내지 위임한 경우에도 이러한 고시 등 규정이 위임입법의 한계를 벗어나지 않는 한 형벌법규와 결합하여 법령을 보충하는 기능을 하는 것이므로, 그 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워졌다면 ｢형법｣ 제1조 제2항이 적용된다. (23.2차)","answer":true,"quote":"형벌법규가 대통령령, 총리령, 부령과 같은 법규명령이 아닌 고시 등 행정규칙·행정명령, 조례 등(이하 ‘고시 등 규정’이라고 한다)에 구성요건의 일부를 수권 내지 위임한 경우에도 이러한 고시 등 규정이 위임입법의 한계를 벗어나지 않는 한 형벌법규와 결합하여 법령을 보충하는 기능을 하는 것이므로, 그 변경에 따라 범죄를 구성하지 아니하게 되거나 형이 가벼워졌다면 마찬가지로 형법 제1조 제2항 과 형사소송법 제326조 제4호 가 적용된다.","cite":"대법원 2020도16420","badge":"","topic":"","from":"GY-2023-2-X-02","seq":null},{"id":"X-OX-135","subject":"형사법","unit":"형법 총론","stmt":"공직선거법 제18조 제3항( 형법 제38조에도 불구하고 제1항 제3호에 규정된 죄와 다른 죄의 경합범에 대하여는 이를 분리 선고하여야 한다)은 선거범이 아닌 다른 죄가 선거범의 양형에 영향을 미치는 것을 최소화하기 위하여 형법 상 경합범 처벌례에 관한 조항의 적용을 배제하고 분리하여 형을 따로 선고하여야 한다는 취지이기에, 선거범과 상상적 경합 관계에 있는 모든 죄는 통틀어 선거범으로 취급하여서는 아니된다. (22.2차)","answer":false,"quote":"‘선거범’과 ‘선거범이 아닌 다른 죄’의 경합범에 대하여 이를 분리하여 형을 따로 선고하도록 규정한 공직선거법 제18조 제3항의 취지 / 이때 선거범과 상상적 경합관계에 있는 모든 죄는 통틀어 선거범으로 취급하여야 하는지 여부 (적극)","cite":"대법원 2018도16587","badge":"","topic":"","from":"GY-2022-2-X-11","seq":null},{"id":"X-OX-087","subject":"형사법","unit":"형법 총론","stmt":"형사재판에 있어서 이와 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이나, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건의 확정판결에서의 사실판단을 그대로 채택하기 어렵다고 인정될 경우에는 이를 배척할 수 있다. (25.1차)","answer":true,"quote":"형사재판에서 이와 관련된 다른 형사사건의 확정판결에서 인정된 사실은 특별한 사정이 없는 한 유력한 증거자료가 되는 것이나, 당해 형사재판에서 제출된 다른 증거 내용에 비추어 관련 형사사건 확정판결의 사실판단을 그대로 채택하기 어렵다고 인정될 경우에는 이를 배척할 수 있다.","cite":"대법원 2011도15653","badge":"","topic":"","from":"GY-2025-1-X-35","seq":null},{"id":"X-OX-162","subject":"형사법","unit":"형법 총론","stmt":"재판이 확정된 후 법률이 변경되어 그 행위가 범죄를 구성하지 아니하게 되거나 형이 구법보다 가벼워진 경우, 형의 집행을 면제한다. (24.1차)","answer":false,"quote":"재판 확정 뒤 형의 집행을 면제하는 것은 범죄가 되지 않게 된 경우뿐이고, 형만 가벼워진 경우는 면제하지 않는다.","cite":"형법 제1조","badge":"","topic":"","from":"GY-2024-1-X-02","seq":null},{"id":"X-OX-120","subject":"형사법","unit":"형법 총론","stmt":"성장교육과정을 통하여 형성된 내재적인 관념 내지 확신으로 인하여 행위자 스스로의 의사결정이 사실상 강제된 상태에서 행한 행위도 형법 제12조에 정한 강요된 행위에 해당한다. (22.1차)","answer":false,"quote":"형법 제12조 에서 말하는 강요된 행위는 저항할 수 없는 폭력이나 생명, 신체에 위해를 가하겠다는 협박 등 다른 사람의 강요행위에 의하여 이루어진 행위를 의미하는 것이지 어떤 사람의 성장교육과정을 통하여 형성된 내재적인 관념 내지 확신으로 인하여 행위자 스스로의 의사결정이 사실상 강제되는 결과를 낳게 하는 경우까지 의미한다고 볼 수 없다.","cite":"대법원 89도1670","badge":"","topic":"","from":"GY-2022-1-X-08","seq":null},{"id":"X-OX-178","subject":"형사법","unit":"형법 총론","stmt":"자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 형을 감경 또는 면제할 수 있다. (24.2차)","answer":false,"quote":"자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다.","cite":"형법 제16조","badge":"","topic":"","from":"GY-2024-2-X-06","seq":null},{"id":"X-OX-009","subject":"형사법","unit":"형법 총론","stmt":"위법성조각사유처럼 피고인에게 유리한 규정의 범위를 제한적 으로 유추적용하게 되면 행위자의 가벌성의 범위가 확대되므로 이는 가능한 문언의 의미를 넘어 범죄구성요건을 유추적용하는 것과 같은 결과가 초래되어 허용될 수 없다. (22.2차)","answer":true,"quote":"그리고 유추해석금지의 원칙은 모든 형벌법규의 구성요건과 가벌성에 관한 규정에 준용되는데, 위법성 및 책임의 조각사유나 소추조건, 또는 처벌조각사유인 형면제 사유에 관하여 그 범위를 제한적으로 유추적용하게 되면 행위자의 가벌성의 범위는 확대되어 행위자에게 불리하게 되는바, 이는 가능한 문언의 의미를 넘어 범죄구성요건을 유추적용하는 것과 같은 결과가 초래되므로 죄형법정주의의 파생원칙인 유추해석금지의 원칙에 위반하여 허용될 수 없다.","cite":"대법원 96도1167","badge":"","topic":"","from":"GY-2022-2-X-01","seq":null},{"id":"X-OX-172","subject":"형사법","unit":"형법 총론","stmt":"구 ｢스토킹범죄의 처벌 등에 관한 법률｣ 제2조 제1호 각 목의 행위가 객관적･일반적으로 볼 때 이를 인식한 상대방으로 하여금 불안감 또는 공포심을 일으키기에 충분한 정도라고 평가되는 경우라도 상대방이 현실적으로 불안감 내지 공포심을 갖게 되어야 스토킹행위에 해당한다. (24.1차)","answer":false,"quote":"구 스토킹범죄의 처벌 등에 관한 법률 제2조 제1호 각 목 의 행위가 객관적·일반적으로 볼 때 이를 인식한 상대방으로 하여금 불안감 또는 공포심을 일으키기에 충분한 정도라고 평가되는 경우, 현실적으로 상대방이 불안감 내지 공포심을 갖게 되었는지 여부와 관계없이 ‘스토킹행위’에 해당하는지 여부 (적극) / 이때 구 스토킹범죄의 처벌 등에 관한 법률 제2조 제1호 각 목 의 행위가 객관적·일반적으로 볼 때 상대방으로 하여금 불안감 또는 공포심을 일으키기에 충분한 정도인지를 판단하는 방법","cite":"대법원 2023도6411","badge":"","topic":"","from":"GY-2024-1-X-16","seq":null},{"id":"X-OX-024","subject":"형사법","unit":"형법 총론","stmt":"형벌법규의 위임은 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우로 한정되어야 하며, 이러한 경우에도 위임법률에서 범죄의 구성요건은 처벌 대상행위가 어떠한 것일 것이라고 예측할 수 있을 정도로 구체적으로 정하여야 하며, 형벌의 종류 및 그 상한과 폭을 명백히 규정하여야 한다. (23.1차)","answer":true,"quote":"사회현상의 복잡다기화와 국회의 전문적·기술적 능력의 한계 및 시간적 적응능력의 한계로 인하여 형사처벌에 관련된 모든 법규를 예외 없이 형식적 의미의 법률에 의하여 규정한다는 것은 사실상 불가능할 뿐만 아니라 실제에 적합하지도 아니하기 때문에, 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우에 한하여 수권법률(위임법률)이 구성요건의 점에서는 처벌대상인 행위가 어떠한 것인지 이를 예측할 수 있을 정도로 구체적으로 정하고, 형벌의 점에서는 형벌의 종류 및 그 상한과 폭을 명확히 규정하는 것을 전제로 위임입법이 허용된다.","cite":"대법원 2000도1007","badge":"","topic":"","from":"GY-2023-1-X-02","seq":null},{"id":"X-OX-092","subject":"형사법","unit":"형법 총론","stmt":"의사가 설명의무를 위반한 채 의료행위를 하였다가 환자에게 상해 또는 사망의 결과가 발생한 경우 의사에게 업무상 과실로 인한 형사책임을 지우기 위해서는 의사의 설명의무 위반과 환자의 상해 또는 사망 사이에 상당인과관계가 존재하여야 한다. (25.2차)","answer":true,"quote":"의사가 설명의무를 위반한 채 의료행위를 하였다가 환자에게 상해 또는 사망의 결과가 발생한 경우, 의사에게 업무상 과실로 인한 형사책임을 지우기 위한 요건","cite":"대법원 2014도11315","badge":"","topic":"","from":"GY-2025-2-X-04","seq":null},{"id":"X-OX-200","subject":"형사법","unit":"형법 총론","stmt":"헌법재판소의 위헌법률심판에 따라 위헌으로 결정된 법률조항은 그 결정이 있는 날부터 효력을 상실하는 것이 원칙이므로 형벌에 관한 법률조항의 위헌결정은 예외적으로도 소급효가 인정되지 않는다. (25.2차)","answer":false,"quote":"헌법재판소의 위헌법률심판에 따라 위헌으로 결정된 법률 또는 법률의 조항은 그 결정이 있는 날부터 효력을 상실하는 것이 원칙이다( 헌법재판소법 제47조 제2항 ).","cite":"대법원 2024도19846","badge":"","topic":"","from":"GY-2025-2-X-01","seq":null},{"id":"X-OX-027","subject":"형사법","unit":"형법 총론","stmt":"자구행위는 사후적 긴급행위이므로 과거의 침해에 대해서만 가능하다. (23.1차)","answer":true,"quote":"정당방위·긴급피난은 현재의 침해나 위난을 막는 것이고, 자구행위는 이미 침해된 청구권을 되찾는 사후적 긴급행위다.","cite":"형법 제23조","badge":"","topic":"","from":"GY-2023-1-X-06","seq":null},{"id":"X-OX-124","subject":"형사법","unit":"형법 총론","stmt":"강도치상죄와는 달리 강도상해죄는 강도가 미수에 그쳤다면 상해가 발생하였어도 강도상해죄의 미수에 해당한다. (22.1차)","answer":false,"quote":"강도상해죄는 강도의 기수·미수와 관계없이 상해가 생기면 기수이고, 상해가 미수에 그친 때에만 강도상해 미수가 된다.","cite":"형법 제337조 · 형법 제342조","badge":"","topic":"","from":"GY-2022-1-X-09","seq":null},{"id":"X-OX-003","subject":"형사법","unit":"형법 총론","stmt":"음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 교통사고를 일으킨 경우는 음주시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 과실에 의한 원인에 있어서 자유로운 행위에 해당한다. (22.1차)","answer":true,"quote":"형법 제10조 제3항 은 “위험의 발생을 예견하고 자의로 심신장애를 야기한 자의 행위에는 전2항의 규정을 적용하지 아니한다”고 규정하고 있는 바, 이 규정은 고의에 의한 원인에 있어서의 자유로운 행위만이 아니라 과실에 의한 원인에 있어서의 자유로운 행위까지도 포함하는 것으로서 위험의 발생을 예견할 수 있었는데도 자의로 심신장애를 야기한 경우도 그 적용 대상이 된다고할 것이어서, 피고인이 음주운전을 할 의사를 가지고 음주만취한 후 운전을 결행하여 교통사고를 일으켰다면 피고인은 음주시에 교통사고를 일으킬 위험성을 예견하였는데도 자의로 심신장애를 야기한 경우에 해당하므로 위 법조항에 의하여 심신장애로 인한 감경 등을 할 수 없다.","cite":"대법원 92도999","badge":"","topic":"","from":"GY-2022-1-X-08","seq":null},{"id":"X-OX-007","subject":"형사법","unit":"형법 총론","stmt":"범의를 가진 자에 대하여 단순히 범행의 기회를 제공하거나 범행을 용이하게 하는 것에 불과한 수사방법도 경우에 따라 허용될 수 있다. (22.1차)","answer":true,"quote":"본래 범의를 가지지 아니한 자에 대하여 수사기관이 사술이나 계략 등을 써서 범의를 유발케 하여 범죄인을 검거하는 함정수사는 위법함을 면할 수 없고, 이러한 함정수사에 기한 공소제기는 그 절차가 법률의 규정에 위반하여 무효인 때에 해당한다 할 것이지만, 범의를 가진 자에 대하여 단순히 범행의 기회를 제공하는 것에 불과한 경우에는 위법한 함정수사라고 단정할 수 없다.","cite":"대법원 2007도1903","badge":"","topic":"","from":"GY-2022-1-X-32","seq":null},{"id":"X-OX-148","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제15조 제1항에 따르면 특별히 무거운 죄가 되는 사실을 인식하지 못한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다. (23.2차)","answer":false,"quote":"무거운 죄가 되는 사실을 몰랐으면 무거운 죄로 벌하지 않을 뿐이고, 「정당한 이유」를 따지는 것은 법률의 착오 조문이다.","cite":"형법 제15조 · 형법 제16조","badge":"","topic":"","from":"GY-2023-2-X-03","seq":null},{"id":"X-OX-119","subject":"형사법","unit":"형법 총론","stmt":"甲과 A가 공모하여 교통사고를 가장해 보험금을 편취할 목적으로 A에게 상해를 입힌 경우 (22.1차)","answer":false,"quote":"보험금을 편취하려고 짜고 상해를 입힌 것은 피해자의 승낙이 있어도 사회상규에 반해 위법성이 조각되지 않는다.","cite":"대법원 2008도9606 · 형법 제24조","badge":"","topic":"","from":"GY-2022-1-X-07","seq":null},{"id":"X-OX-028","subject":"형사법","unit":"형법 총론","stmt":"심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니하고, 심신장애로 인하여 위의 능력이 미약한 자의 행위는 형을 감경할 수 있다. (23.1차)","answer":true,"quote":"①심신장애로 인하여 사물을 변별할 능력이 없거나 의사를 결정할 능력이 없는 자의 행위는 벌하지 아니한다.","cite":"형법 제10조 제1항","badge":"","topic":"","from":"GY-2023-1-X-07","seq":null},{"id":"X-OX-004","subject":"형사법","unit":"형법 총론","stmt":"어느 행위로 인하여 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다. (22.1차)","answer":true,"quote":"①어느 행위로 인하여 처벌되지 아니하는 자 또는 과실범으로 처벌되는 자를 교사 또는 방조하여 범죄행위의 결과를 발생하게 한 자는 교사 또는 방조의 예에 의하여 처벌한다.","cite":"형법 제34조 제1항","badge":"","topic":"","from":"GY-2022-1-X-11","seq":null},{"id":"X-OX-025","subject":"형사법","unit":"형법 총론","stmt":"구 ｢근로기준법｣에서 임금･퇴직금 청산기일의 연장합의의 한도에 관하여 아무런 제한을 두고 있지 아니함에도 불구하고, 같은 법 시행령에서 기일연장을 3월 이내로 제한한 것은 죄형법정주의의 원칙에 위배된다. (23.1차)","answer":true,"quote":"법률 제5309호로 개정되기 전의 것) 제30조 단서에서 임금·퇴직금 청산기일의 연장합의의 한도에 관하여 아무런 제한을 두고 있지 아니함에도 불구하고, 같은법시행령(1997. 3. 27.","cite":"대법원 98도1759","badge":"","topic":"","from":"GY-2023-1-X-02","seq":null},{"id":"X-OX-060","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제48조 제1항 제1호의 ‘범죄행위에 제공하려고 한 물건’은 범죄행위에 사용하려고 준비하였으나 실제 사용하지 못한 물건을 의미하며, 어떠한 물건을 ‘범죄행위에 제공하려고 한 물건’으로서 몰수하기 위해서는 그 물건이 유죄로 인정되는 당해 범죄행위에 제공하려고 한 물건임이 인정되어야 한다. (24.1차)","answer":true,"quote":"형법 제48조 제1항 제1호 는 몰수할 수 있는 물건으로서 ‘범죄행위에 제공하였거나 제공하려고 한 물건’을 규정하고 있는데, 여기서 범죄행위에 제공하려고 한 물건이란 범죄행위에 사용하려고 준비하였으나 실제 사용하지 못한 물건을 의미하는바, 형법상의 몰수가 공소사실에 대하여 형사재판을 받는 피고인에 대한 유죄판결에서 다른 형에 부가하여 선고되는 형인 점에 비추어, 어떠한 물건을 ‘범죄행위에 제공하려고 한 물건’으로서 몰수하기 위하여는 그 물건이 유죄로 인정되는 당해 범죄행위에 제공하려고 한 물건임이 인정되어야 한다.","cite":"대법원 2007도10034","badge":"","topic":"","from":"GY-2024-1-X-12","seq":null},{"id":"X-OX-141","subject":"형사법","unit":"형법 총론","stmt":"甲이 乙로부터 국제우편을 통해 향정신성의약품을 수입하는 경우, 필로폰을 받을 국내 주소를 알려주었으나 乙이 필로폰이 들어 있는 우편물을 발신국의 우체국에 제출하지 않았다고 하더라도 甲의 이러한 행위는 향정신성의약품 수입행위의 실행에 착수하였다고 볼 수 있다. (23.1차)","answer":false,"quote":"국제우편 마약 수입은 국내 수신인 앞 우편물을 발신국 우체국에 낸 때 착수하므로, 주소만 알려 준 것은 예비에 그친다.","cite":"대법원 2019도97","badge":"","topic":"","from":"GY-2023-1-X-09","seq":null},{"id":"X-OX-066","subject":"형사법","unit":"형법 총론","stmt":"거동범에 해당하는 진정부작위범과는 달리 부진정부작위범은 결과범에 해당하므로, 사회적으로 기대되는 작위의무를 다하 였으면 결과가 발생하지 않았을 것이라는 관계가 인정될 때 그 부작위와 결과 사이에 인과관계가 인정된다. (24.2차)","answer":true,"quote":"따라서 선박침몰 등과 같은 조난사고로 승객이나 다른 승무원들이 스스로 생명에 대한 위협에 대처할 수 없는 급박한 상황이 발생한 경우에는 선박의 운항을 지배하고 있는 선장이나 갑판 또는 선내에서 구체적인 구조행위를 지배하고 있는 선원들은 적극적인 구호활동을 통해 보호능력이 없는 승객이나 다른 승무원의 사망 결과를 방지하여야 할 작위의무가 있으므로, 법익침해의 태양과 정도 등에 따라 요구되는 개별적·구체적인 구호의무를 이행함으로써 사망의 결과를 쉽게 방지할 수 있음에도 그에 이르는 사태의 핵심적 경과를 그대로 방관하여 사망의 결과를 초래하였다면, 부작위는 작위에 의한 살인행위와 동등한 형법적 가치를 가지고, 작위의무를 이행하였다면 결과가 발생하지 않았을 것이라는 관계가 인정될 경우에는 작위를 하지 않은 부작위와 사망의 결과 사이에 인과관계가 있다.","cite":"대법원 2015도6809","badge":"","topic":"","from":"GY-2024-2-X-03","seq":null},{"id":"X-OX-177","subject":"형사법","unit":"형법 총론","stmt":"의료과오사건에서 수술을 마친 후 의사가 복막염에 대한 진단과 처치를 지연하는 등의 과실로 환자가 제때 필요한 조치를 받지 못해 사망하였다고 할지라도 환자가 의사의 입원 지시 및 금식 지시를 무시하고 귀가한 사정이 있다면 의사의 과실과 환자 사망 사이의 인과관계는 단절된다. (24.2차)","answer":false,"quote":"의사가 복막염 진단·처치를 늦춘 과실로 환자가 사망했다면, 환자가 입원·금식 지시를 어기고 귀가했더라도 과실과 사망 사이의 인과관계는 끊기지 않는다.","cite":"대법원 2018도2844","badge":"","topic":"","from":"GY-2024-2-X-03","seq":null},{"id":"X-OX-186","subject":"형사법","unit":"형법 총론","stmt":"형벌법규는 문언에 따라 엄격하게 해석‧적용하여야 하므로, 형벌법규의 해석에 있어서 가능한 문언의 의미 내에서 당해 규정의 입법 취지와 목적 등을 고려한 법률체계적 연관성에 따라 그 문언의 논리적 의미를 분명히 밝히는 체계적‧논리적 해석방법은 유추해석에 해당하여 허용되지 않는다. (25.1차)","answer":false,"quote":"형벌법규는 문언에 따라 엄격하게 해석·적용하여야 하고 피고인에게 불리한 방향으로 지나치게 확장해석하거나 유추해석하여서는 아니 되나, 형벌법규의 해석에 있어서도 가능한 문언의 의미 내에서 당해 규정의 입법 취지와 목적 등을 고려한 법률체계적 연관성에 따라 그 문언의 논리적 의미를 분명히 밝히는 체계적·논리적 해석방법은 그 규정의 본질적 내용에 가장 접근한 해석을 위한 것으로서 죄형법정주의의 원칙에 부합한다.","cite":"대법원 2022도10961","badge":"","topic":"","from":"GY-2025-1-X-01","seq":null},{"id":"X-OX-057","subject":"형사법","unit":"형법 총론","stmt":"포괄일죄의 범행 도중에 공동정범으로 범행에 가담한 자는 그 가담 이후의 범행에 대해서만 공동정범으로 책임을 지고, 그 가담 이전에 이미 이루어진 종전의 범행을 인식하고 범행에 가담한 경우라도 그 가담 이전의 범행에 대해서는 공동정범으로 책임을 지지 않는다. (24.1차)","answer":true,"quote":"포괄일죄의 범행 도중에 공동정범으로 범행에 가담한 자의 형사책임 범위(=가담 이후의 범행)","cite":"대법원 2019도8357","badge":"","topic":"","from":"GY-2024-1-X-09","seq":null},{"id":"X-OX-070","subject":"형사법","unit":"형법 총론","stmt":"2인 이상이 상호의사의 연락이 없이 동시에 범죄구성요건에 해당하는 행위를 하였을 때에는 원칙적으로 각인에 대하여 그 죄를 논하여야 하나, 상호의사의 연락이 있어 공동정범이 성립한다면, 독립행위경합 등의 문제는 아예 제기될 여지가 없다. (24.2차)","answer":true,"quote":"2인 이상이 상호의사의 연락이 없이 동시에 범죄구성요건에 해당하는 행위를 하였을 때에는 원칙적으로 각인에 대하여 그 죄를 논하여야 하나, 그 결과발생의 원인이 된 행위가 분명하지 아니한 때에는 각 행위자를 미수범으로 처벌하고(독립행위의 경합), 이 독립행위가 경합하여 특히 상해의 경우에는 공동정범의 예에 따라 처단(동시범)하는 것이므로, 상호의사의 연락이 있어 공동정범이 성립한다면, 독립행위경합 등의 문제는 아예 제기될 여지가 없다.","cite":"대법원 97도1740","badge":"","topic":"","from":"GY-2024-2-X-11","seq":null},{"id":"X-OX-139","subject":"형사법","unit":"형법 총론","stmt":"｢게임산업진흥에 관한 법률｣ 제32조 제1항 제7호의 ‘환전’의 의미를 ‘게임결과물을 수령하고 돈을 교부하는 행위’뿐만 아니라 ‘게임결과물을 교부하고 돈을 수령하는 행위’도 포함되는 것으로 해석하는 것은 죄형법정주의에 위배된다. (23.1차)","answer":false,"quote":"여러 사정을 종합하여 보면, 위 조항이 정한 ‘환전’에는 ‘게임결과물을 수령하고 돈을 교부하는 행위’뿐만 아니라 ‘게임결과물을 교부하고 돈을 수령하는 행위’도 포함되는 것으로 해석함이 상당하고, 이를 지나친 확장해석이나 유추해석이라고 할 수 없다.","cite":"대법원 2012도11505","badge":"","topic":"","from":"GY-2023-1-X-02","seq":null},{"id":"X-OX-079","subject":"형사법","unit":"형법 총론","stmt":"지방자치단체 소속 공무원이 지방자치단체 고유의 자치사무를 수행하던 중 범죄를 저지르고 해당 범죄에 대하여 그 행위자를 벌하는 외에 법인을 처벌하는 양벌규정이 있는 경우, 지방자치 단체는 양벌규정의 적용대상이 되는 법인에 해당한다. (25.1차)","answer":true,"quote":"헌법 제117조 , 지방자치법 제3조 제1항 , 제9조 , 제93조 , 도로법 제54조 , 제83조 , 제86조 의 각 규정을 종합하여 보면, 국가가 본래 그의 사무의 일부를 지방자치단체의 장에게 위임하여 그 사무를 처리하게 하는 기관위임사무의 경우에는 지방자치단체는 국가기관의 일부로 볼 수 있는 것이지만, 지방자치단체가 그 고유의 자치사무를 처리하는 경우에는 지방자치단체는 국가기관의 일부가 아니라 국가기관과는 별도의 독립한 공법인이므로, 지방자치단체 소속 공무원이 지방자치단체 고유의 자치사무를 수행하던 중 도로법 제81조 내지 제85조 의 규정에 의한 위반행위를 한 경우에는 지방자치단체는 도로법 제86조 의 양벌규정에 따라 처벌대상이 되는 법인에 해당한다.","cite":"대법원 2004도2657","badge":"","topic":"","from":"GY-2025-1-X-03","seq":null},{"id":"X-OX-110","subject":"형사법","unit":"형법 총론","stmt":"보안처분은 범죄행위를 한 자에 대한 응보를 주된 목적으로 그 책임을 추궁하는 사후적 처분인 형벌과 구별되어 그 본질을 달리하는 것으로서 형벌에 관한 일사부재리의 원칙이 그대로 적용되지 않는다. (26.1차)","answer":true,"quote":"이러한 전자감시제도의 목적과 성격, 그 운영에 관한 위 법률의 규정 내용 및 취지 등을 종합해 보면, 전자감시제도는 범죄행위를 한 자에 대한 응보를 주된 목적으로 그 책임을 추궁하는 사후적 처분인 형벌과 구별되어 그 본질을 달리하는 것으로서 형벌에 관한 일사부재리의 원칙이 그대로 적용되지 않으므로, 위 법률이 형 집행의 종료 후에 부착명령을 집행하도록 규정하고 있다 하더라도 그것이 일사부재리의 원칙에 반한다고 볼 수 없다.","cite":"대법원 2009도6061","badge":"","topic":"","from":"GY-2026-1-X-13","seq":null},{"id":"X-OX-017","subject":"형사법","unit":"형법 총론","stmt":"甲이 A투자금융회사에 입사하여 다른 공범들과 특정 회사 주식을 허위매수 주문 등의 방법으로 시세조종 주문을 내기로 공모하고 시세조종 행위의 일부를 실행한 후 A회사로부터 해고를 당하여 공범관계에서 이탈한 경우, 甲이 다른 공범들의 범죄실행을 저지하지 않은 이상 그 이후 공범들이 행한 나머지 시세조종 행위에 대해서도 공동정범이 성립한다. (22.2차)","answer":true,"quote":"피고인이 甲 투자금융회사에 입사하여 다른 공범들과 특정 회사 주식의 시세조종 주문을 내기로 공모한 다음 시세조종행위의 일부를 실행한 후 甲 회사로부터 해고를 당하여 공범관계로부터 이탈하였고, 다른 공범들이 그 이후의 나머지 시세조종행위를 계속한 사안에서, 피고인이 다른 공범들의 범죄실행을 저지하지 않은 이상 그 이후 나머지 공범들이 행한 시세조종행위에 대하여도 죄책을 부담함에도, 피고인이 해고되어 甲 회사를 퇴사함으로써 기존의 공모관계에서 이탈하였다는 사정만으로 피고인이 이미 실행한 시세조종행위에 대한 기능적 행위지배가 해소되었다고 보아 그 이후의 각 구 증권거래법(2007. 8. 3.","cite":"대법원 2010도9927","badge":"","topic":"","from":"GY-2022-2-X-08","seq":null},{"id":"X-OX-094","subject":"형사법","unit":"형법 총론","stmt":"불능미수는 행위자에게 범죄의사가 있고 실행의 착수라고 볼 수 있는 행위가 있지만 실행의 수단이나 대상의 착오로 처음부터 구성요건이 충족될 가능성이 없는 경우이다. 다만 결과적으로 구성요건의 충족은 불가능하지만, 그 행위의 위험성이 있으면 불능미수로 처벌한다. (25.2차)","answer":true,"quote":"① 형법 제27조 에서 규정하고 있는 불능미수는 행위자에게 범죄의사가 있고 실행의 착수라고 볼 수 있는 행위가 있지만 실행의 수단이나 대상의 착오로 처음부터 구성요건이 충족될 가능성이 없는 경우이다.","cite":"대법원 2018도16002","badge":"","topic":"","from":"GY-2025-2-X-09","seq":null},{"id":"X-OX-771","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"사기죄는 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자를 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","answer":true,"quote":"① 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 20년 이하의 징역 또는 5천만원 이하의 벌금에 처한다. ② 전항의 방법으로 제삼자로 하여금 재물의 교부를 받게 하거나 재산상의 이익을 취득하게 한 때에도 전항의 형과 같다.","cite":"형법 제347조 (2025. 12. 23. 개정)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-343","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"부사관 교육생 甲이 동기들과 함께 사용하는 단체채팅방에서 지도관 A가 목욕탕 청소 담당에게 과실 지적을 많이 한다는 이유로“도라이ㅋㅋㅋ습기가그렇게많은데”라는글을게시한경우 (22.2차)","answer":false,"quote":"부사관 교육생이던 피고인이 동기들과 함께 사용하는 단체채팅방에서 지도관이던 피해자가 목욕탕 청소 담당 교육생들에게 과실 지적을 많이 한다는 이유로 “도라이 ㅋㅋㅋ 습기가 그렇게 많은데”라는 글을 게시하여 공연히 상관인 피해자를 모욕하였다는 내용으로 기소된 사안에서, ‘도라이’는 상관인 피해자를 경멸적으로 비난한 것으로 모욕적인 언사라고 볼 수 있으나, 위 표현은 피고인의 입장에서 불만을 토로하는 과정에서 즉흥적이고 우발적으로 이루어진 것으로 보이는 점, 위 단체채팅방은 동기생들만 참여대상으로 하는 비공개채팅방으로 교육생 신분에서 가질 수 있는 불평불만을 토로하는 공간으로서의 역할을 하고 있었고, 교육생 상당수가 별다른 거리낌 없이 욕설을 포함한 비속어를 사용하고 대화하고 있었던 점, 당시 목욕탕 청소를 담당했던 다른 교육생들도 위 단체채팅방에서 피고인과 비슷한 불만을 토로하고 있었는데, 피고인의 위 표현은 단 1회에 그쳤고, 그 부분이 전체 대화내용에서 차지하는 비중도 크지 않은 점, 위 표현은 근래 비공개적인 상황에서는 일상생활에서 드물지 않게 사용되고 그 표현이 내포하는 모욕의 정도도 경미한 수준인 점 등에 비추어 볼 때, 피고인의 위 표현은 동기 교육생들끼리 고충을 토로하고 의견을 교환하는 사이버공간에서 상관인 피해자에 대하여 일부 부적절한 표현을 사용하게 된 것에 불과하고 이로 인하여 군의 조직질서와 정당한 지휘체계가 문란하게 되었다고 보이지 않으므로, 이러한 행위는 사회상규에 위배되지 않는다고 보는 것이 타당하다는 이유로, 위 표현이 형법 제20조 의 정당행위에 해당하지 않는다고 본 원심판단에 상관모욕죄의 위법성조각사유에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2020도14576","badge":"","topic":"","from":"GY-2022-2-X-15","seq":null},{"id":"X-OX-350","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"자살의 의미를 이해할 능력이 없고 자신의 말은 무엇이나 복종하는 어린 자식을 권유하여 익사하게 하였다면, 물속에 직접 밀어서 빠뜨린 것이 아니더라도 ｢형법｣ 제253조의 위계에 의한 살인죄가 성립한다. (23.1차)","answer":false,"quote":"피고인이 7세, 3세 남짓된 어린자식들에 대하여 함께 죽자고 권유하여 물속에 따라 들어오게 하여 결국 익사하게 하였다면 비록 피해자들을 물속에 직접 밀어서 빠뜨리지는 않았다고 하더라도 자살의 의미를 이해할 능력이 없고 피고인의 말이라면 무엇이나 복종하는 어린 자식들을 권유하여 익사하게 한 이상 살인죄의 범의는 있었음이 분명하다.","cite":"대법원 86도2395","badge":"","topic":"","from":"GY-2023-1-X-14","seq":null},{"id":"X-OX-383","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"채무자 甲이 자신의 금전채무를 담보하기 위하여 채권자 A와 자신 소유의 자동차에 관한 양도담보설정계약을 체결한 후, A에게 양도 담보설정계약에 따른 의무를 다하지 않고 이를 B에게 처분한 경우, 甲에게는 배임죄의 기수범이 성립한다. (24.1차)","answer":false,"quote":"배임죄의 주체인 ‘타인의 사무를 처리하는 자’의 의미 / 금전채권채무 관계에서 채권자가 채무자의 급부이행에 대한 신뢰를 바탕으로 금전을 대여하고 채무자의 성실한 급부이행에 의해 채권의 만족이라는 이익을 얻게 된다 하더라도, 채무자가 채권자에 대한 관계에서 ‘타인의 사무를 처리하는 자’에 해당하는지 여부 (소극) / 이는 채무자가 금전채무를 담보하기 위하여 자신 소유의 동산을 채권자에게 양도하기로 약정하거나 양도담보로 제공한 경우에도 마찬가지인지 여부 (적극) / 위와 같은 법리는, 권리이전에 등기·등록을 요하는 동산에 관한 양도담보설정계약에도 마찬가지로 적용되는지 여부 (적극) / 자동차 등에 관하여 양도담보설정계약을 체결한 채무자가 채권자에게 양도담보설정계약에 따른 의무를 다하지 아니하고 이를 타에 처분한 경우, 배임죄가 성립하는지 여부 (소극)","cite":"대법원 2020도8682","badge":"","topic":"","from":"GY-2024-1-X-19","seq":null},{"id":"X-OX-367","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢성폭력범죄의 처벌 등에 관한 특례법｣ 제14조 제2항에서 유포 행위의 한 유형으로 열거하고 있는 ‘공공연한 전시’란 불특정 또는 다수인이 촬영물 등을 인식할 수 있는 상태에 두는 것을 의미하고, 따라서 촬영물 등의 ‘공공연한 전시’로 인한 범죄는 불특정 또는 다수인이 전시된 촬영물 등을 실제 인식하지 못하였다면 성립하지 않는다. (23.2차)","answer":false,"quote":"이러한 법률 규정의 내용 및 입법 취지 등에 비추어 볼 때 구 성폭력처벌법 제14조 제2항 에서 유포 행위의 한 유형으로 열거하고 있는 ‘공공연한 전시’란 불특정 또는 다수인이 촬영물 등을 인식할 수 있는 상태에 두는 것을 의미하고, 촬영물 등의 ‘공공연한 전시’로 인한 범죄는 불특정 또는 다수인이 전시된 촬영물 등을 실제 인식하지 못했다고 하더라도 촬영물 등을 위와 같은 상태에 둠으로써 성립한다.","cite":"대법원 2022도1683","badge":"","topic":"","from":"GY-2023-2-X-17","seq":null},{"id":"X-OX-400","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"상해죄의 피해자가 제출하는 상해진단서는 일반적으로 의사가 당해 피해자의 진술을 토대로 상해의 원인을 파악한 후 의학적 전문지식을 동원하여 관찰·판단한 상해의 부위와 정도 등을 기재한 것으로서, 거기에 기재된 상해가 곧 피고인의 범죄행위로 인하여 발생한 것이라는 사실을 직접 증명하는 증거가 되기에 충분하다. (24.2차)","answer":false,"quote":"상해죄의 피해자가 제출하는 상해진단서는 일반적으로 의사가 당해 피해자의 진술을 토대로 상해의 원인을 파악한 후 의학적 전문지식을 동원하여 관찰·판단한 상해의 부위와 정도 등을 기재한 것으로서 거기에 기재된 상해가 곧 피고인의 범죄행위로 인하여 발생한 것이라는 사실을 직접 증명하는 증거가 되기에 부족한 것이지만, 그 상해에 대한 진단일자 및 상해진단서 작성일자가 상해 발생시점과 시간상으로 근접하고 상해진단서 발급 경위에 특별히 신빙성을 의심할 만한 사정이 없으며 거기에 기재된 상해 부위와 정도가 피해자가 주장하는 상해의 원인 내지 경위와 일치하는 경우에는, 그 무렵 피해자가 제3자로부터 폭행을 당하는 등으로 달리 상해를 입을 만한 정황이 발견되거나 의사가 허위로 진단서를 작성한 사실이 밝혀지는 등의 특별한 사정이 없는 한, 그 상해진단서는 피해자의 진술과 더불어 피고인의 상해 사실에 대한 유력한 증거가 되고, 합리적인 근거 없이 그 증명력을 함부로 배척할 수 없다.","cite":"대법원 2010도12728","badge":"","topic":"","from":"GY-2024-2-X-34","seq":null},{"id":"X-OX-310","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"업무시간 중 출입자격 등의 제한 없이 일반적으로 개방되어 있는 장소에 들어간 경우, 관리자의 명시적 출입금지 의사 및 조치가 없었던 이상 그 출입행위가 결과적으로 관리자의 추정적 의사에 반하였다는 사정만으로는 사실상의 평온상태를 해치는 행위 태양으로 출입하였다고 평가할 수 없다. (25.2차)","answer":true,"quote":"한편 업무시간 중 출입자격 등의 제한 없이 일반적으로 개방되어 있는 장소에 들어간 경우, 관리자의 명시적 출입금지 의사 및 조치가 없었던 이상 그 출입행위가 결과적으로 관리자의 추정적 의사에 반하였다는 사정만으로는 사실상의 평온상태를 해치는 행위 태양으로 출입하였다고 평가할 수 없다.","cite":"대법원 2022도15955","badge":"","topic":"","from":"GY-2025-2-X-19","seq":null},{"id":"X-OX-379","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강간범이 강간행위의 계속 중에 강도행위를 한 경우, 이후에 그 자리에서 강간행위를 계속한다 하더라도 ｢형법｣상 강도강간죄가 성립하지 않는다. (24.1차)","answer":false,"quote":"강간범이 강간행위 후에 강도의 범의를 일으켜 그 부녀의 재물을 강취하는 경우에는 강도강간죄가 아니라 강간죄와 강도죄의 경합범이 성립될 수 있을 뿐이지만, 강간행위의 종료 전 즉 그 실행행위의 계속 중에 강도의 행위를 할 경우에는 이때에 바로 강도의 신분을 취득하는 것이므로 이후에 그 자리에서 강간행위를 계속하는 때에는 강도가 부녀를 강간한 때에 해당하여 형법 제339조 에 정한 강도강간죄를 구성하고, 구 성폭력범죄의 처벌 및 피해자보호 등에 관한 법률(2010. 4. 15.","cite":"대법원 2010도9630","badge":"","topic":"","from":"GY-2024-1-X-18","seq":null},{"id":"X-OX-297","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 피해자들을 기망하여 중고차량을 불법으로 판매해 금원을 편취할 목적으로 무등록 중고차 매매상사를 조직‧운영하고, 乙, 丙, 丁 등과 사기범행을 수행한다는 공동목적 아래 정해진 역할분담에 따라 행동하는 등 사기범행을 반복적으로 실행하는 체계를 갖춘 결합체를 이루었다면, 그 결합체는 ｢형법｣ 제114조의 ‘범죄를 목적으로 하는 집단’에 해당한다. (25.1차)","answer":true,"quote":"피고인 甲은 무등록 중고차 매매상사(이하 ‘외부사무실’이라 한다)를 운영하면서 피해자들을 기망하여 중고차량을 불법으로 판매해 금원을 편취할 목적으로 외부사무실 등에서 범죄집단을 조직·활동하고, 피고인 甲, 乙을 제외한 나머지 피고인들은 범죄집단에 가입·활동하였다는 내용으로 기소된 사안에서, 외부사무실에는 회사 조직과 유사하게 대표, 팀장, 팀원(출동조, 전화상담원)으로 직책이나 역할이 분담되어 있었는데, 상담원은 인터넷 허위 광고를 보고 전화를 건 손님들에게 거짓말로 외부사무실에 방문할 것을 유인하는 역할을, 출동조는 외부사무실을 방문한 손님들에게 허위 중고차량을 보여주면서 소위 ‘뜯플’ 또는 ‘쌩플’의 수법으로 중고차량 매매계약을 유도하는 역할을, 팀장은 소속 직원을 채용하고, 손님 방문 시 출동조를 배정하며, 출동조로부터 계약 진행 상황을 보고받고, 출동조가 매매계약 유도를 성공하면 손님들과 정식 계약을 체결하는 역할을, 대표인 피고인 甲은 사무실과 집기, 중고자동차 매매계약에 필요한 자료와 할부금융, 광고 등을 준비해 외부사무실을 운영하면서 팀장을 채용한 뒤 팀장으로 하여금 팀을 꾸려 사기범행을 실행하도록 하고, 할부금융사로부터 할부중개수수료를 받으면 이를 팀별로 배분하는 역할을 수행하였으며, 대표 또는 팀장은 팀장, 출동조, 전화상담원에게 고객을 유인하고 대응하는 법이나 기망하는 방법 등에 대해 교육한 점, 대표는 팀장들이 이용할 할부금융사 및 광고 사이트를 정해 팀장들에게 알려주고 팀장들로부터 상사입금비 및 광고비를 받는 한편, 손님들이 중고차량을 할부로 계약한 경우 할부금융사로부터 받는 할부중개수수료 중 절반을 팀장들에게 나누어 주었으며, 팀장들은 대표로부터 지급받은 위 할부중개수수료와 중고차량 매매에 따른 차익을 출동조 및 상담원에게 각각 나눠주고 나머지를 가져간 점, 피고인 乙을 제외한 나머지 피고인들은 외부사무실 업무와 관련하여 ‘텔레그램’을 이용한 대화방을 여러 개 개설하여 정보를 공유하거나 각종 보고 등을 하였고, 대표와 팀장들은 월 1~2회 회의를 하면서 단속정보 등을 공유하였으며, 팀장들은 공유된 정보를 소속 출동조 및 상담원에게 전파한 점 등을 종합하면, 외부사무실은 특정 다수인이 사기범행을 수행한다는 공동목적 아래 구성원들이 대표, 팀장, 출동조, 전화상담원 등 정해진 역할분담에 따라 행동함으로써 사기범행을 반복적으로 실행하는 체계를 갖춘 결합체, 즉 형법 제114조 의 ‘범죄를 목적으로 하는 집단’에 해당한다는 이유로, 이와 달리 보아 공소사실을 무죄로 판단한 원심판결에 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2019도16263","badge":"","topic":"","from":"GY-2025-1-X-24","seq":null},{"id":"X-OX-407","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 유부녀 A의 옛 애인인 B 행세를 하여 A와 1회 성관계를 가진 후 A에게 전화하여 ‘B와의 성관계 사실을 폭로하겠다, 제3자가 성관계 당시 모텔 사진을 가지고 있다, 사진을 찍은 자가 성관계를 원하고, 그에게는 수명의 부하들이 있다’라는 등 A의 항거를 현저히 곤란하게 할 정도로 협박하여 A를 간음 하였으나 간음 당시에는 일체의 폭행이나 협박이 없었던 경우, 甲의 행위는 강간죄를 구성하지 않는다. (25.1차)","answer":false,"quote":"간음 때 폭행·협박이 없었어도 앞선 협박이 항거를 현저히 곤란하게 할 정도였고 그 협박으로 간음했다면, 시간 간격이 있어도 강간죄가 된다.","cite":"대법원 2006도5979 · 형법 제297조","badge":"","topic":"","from":"GY-2025-1-X-16","seq":null},{"id":"X-OX-363","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"피고인들이 피해자들의 재물을 강취한 후 그들을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 피고인들의 행위는 강도살인죄와 현주건조물방화치사죄에 모두 해당하고 그 두 죄는 실체적 경합관계에 있다. (23.2차)","answer":false,"quote":"피고인들이 피해자들의 재물을 강취한 후 그들을 살해할 목적으로 현주건조물에 방화하여 사망에 이르게 한 경우, 피고인들의 행위는 강도살인죄와 현주건조물방화치사죄에 모두 해당하고 그 두 죄는 상상적 경합범관계에 있다.","cite":"대법원 98도3416","badge":"","topic":"","from":"GY-2023-2-X-13","seq":null},{"id":"X-OX-269","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 A가 술에 만취하여 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 A를 간음하였으나, 실제로는 A가 심신상실 또는 항거불능의 상태에 있지 않았던 경우, 甲에게는 준강간죄의 불능미수가 성립한다. (24.1차)","answer":true,"quote":"피고인이 피해자가 심신상실 또는 항거불능의 상태에 있다고 인식하고 그러한 상태를 이용하여 간음할 의사로 피해자를 간음하였으나 피해자가 실제로는 심신상실 또는 항거불능의 상태에 있지 않은 경우, 준강간죄의 불능미수가 성립하는지 여부 (적극)","cite":"대법원 2018도16002","badge":"","topic":"","from":"GY-2024-1-X-08","seq":null},{"id":"X-OX-349","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"수개의 행위가 여러 개의 구성요건을 충족하는 경우에도 포괄 일죄가 될 수 있으므로 횡령, 배임의 행위와 사기의 행위 사이에는 포괄일죄를 구성할 수 있다. (23.1차)","answer":false,"quote":"포괄1죄라 함은 각기 따로 존재하는 수개의 행위가 한개의 구성요건을 한번 충족하는 경우를 말하므로 구성요건을 달리하고 있는 횡령, 배임 등의 행위와 사기의 행위는 포괄1죄를 구성할 수 없다.","cite":"대법원 87도58","badge":"","topic":"","from":"GY-2023-1-X-12","seq":null},{"id":"X-OX-357","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강도살인죄의 주체인 ‘강도’에는 준강도죄의 강도범인이 포함 되지 않는다. (23.1차)","answer":false,"quote":"준강도는 강도의 예에 따르므로 준강도범도 강도살인죄의 주체인 「강도」에 포함된다.","cite":"대법원 87도1592 · 형법 제338조 · 형법 제335조","badge":"","topic":"","from":"GY-2023-1-X-19","seq":null},{"id":"X-OX-322","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"기망행위를 수단으로 한 권리행사의 경우 그 권리행사에 속하는 행위와 수단에 속하는 기망행위를 전체적으로 관찰하여 그와 같은 기망행위가 사회통념상 권리행사의 수단으로서 용인할 수 없는 정도라면, 권리행사에 속하는 행위는 사기죄를 구성한다. (26.1차)","answer":true,"quote":"권리행사라도 그 수단인 기망행위와 함께 보아 사회통념상 용인할 수 없는 정도라면 권리행사 행위가 사기죄를 구성한다.","cite":"대법원 2024도11951 · 형법 제347조","badge":"","topic":"","from":"GY-2026-1-X-18","seq":null},{"id":"X-OX-346","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"소유권의 취득에 등록이 필요한 차량에 대한 횡령죄에서는 타인의 재물을 보관하는 사람의 지위는 등록에 의하여 차량을 제3자에게 법률상 유효하게 처분할 수 있는 권능 유무에 따라 결정된다. (22.2차)","answer":false,"quote":"등록이 필요한 차량도 보관자의 지위는 등록명의가 아니라 그 차량을 실제로 점유하는지로 정해진다.","cite":"대법원 2015도1944","badge":"","topic":"","from":"GY-2022-2-X-20","seq":null},{"id":"X-OX-337","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"입목을 절취하기 위하여 이를 캐낸 때에는 그 시점에서 아직 소유자의 입목에 대한 점유가 침해되어 범인의 사실적 지배하에 놓였다고는 볼 수 없고 이를 운반하거나 반출하는 등의 행위가 있어야 그 점유를 취득하게 되는 것이므로, 이 때 절도죄는 기수에 이르렀다고 할 것이다. (22.1차)","answer":false,"quote":"입목을 절취하기 위하여 캐낸 때에 소유자의 입목에 대한 점유가 침해되어 범인의 사실적 지배하에 놓이게 되므로 범인이 그 점유를 취득하고 절도죄는 기수에 이른다.","cite":"대법원 2008도6080","badge":"","topic":"","from":"GY-2022-1-X-19","seq":null},{"id":"X-OX-323","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"재산상의 손실을 야기한 임무위배행위가 동시에 그 손실을 보상할 만한 재산상의 이익을 준 경우, 예컨대 배임행위로 인한 급부와 반대급부가 상응하고 다른 재산상 손해도 없는 때에는 전체적 재산가치의 감소, 즉 재산상 손해가 있다고 할 수 없다. (26.1차)","answer":true,"quote":"여기서 본인에게 재산상의 손해를 가한다 함은 총체적으로 보아 본인의 재산상태에 손해를 가하는 경우, 즉 본인의 전체적 재산가치의 감소를 가져오는 것을 말하므로, 재산상의 손실을 야기한 임무위배행위가 동시에 그 손실을 보상할 만한 재산상의 이익을 준 경우, 예컨대 배임행위로 인한 급부와 반대급부가 상응하고 다른 재산상 손해(현실적인 손해 또는 재산상 실해 발생의 위험)도 없는 때에는 전체적 재산가치의 감소, 즉 재산상 손해가 있다고 할 수 없다.","cite":"대법원 2024도11353","badge":"","topic":"","from":"GY-2026-1-X-19","seq":null},{"id":"X-OX-332","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"예금주인 현금카드 소유자를 협박하여 그 카드를 갈취한 다음 피해자의 승낙에 의하여 현금카드를 사용할 권한을 부여받아 이를 이용하여 현금자동지급기에서 현금을 인출한 행위는 공갈죄와는 별도로 절도죄를 구성한다. (22.1차)","answer":false,"quote":"예금주인 현금카드 소유자를 협박하여 그 카드를 갈취한 다음 피해자의 승낙에 의하여 현금카드를 사용할 권한을 부여받아 이를 이용하여 현금자동지급기에서 현금을 인출한 행위는 모두 피해자의 예금을 갈취하고자 하는 피고인의 단일하고 계속된 범의 아래에서 이루어진 일련의 행위로서 포괄하여 하나의 공갈죄를 구성하므로, 현금자동지급기에서 피해자의 예금을 인출한 행위를 현금카드 갈취행위와 분리하여 따로 절도죄로 처단할 수는 없다.","cite":"대법원 2007도1375","badge":"","topic":"","from":"GY-2022-1-X-13","seq":null},{"id":"X-OX-370","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲은 연인관계인 A로부터 안방에 TV를 설치하여 달라는 요청을 받고 통상적인 출입방법에 따라 A의 안방에 들어간 후 A가 있는 자리에서 TV를 설치하는 등 달리 A의 사실상 평온상태가 침해되었다고 볼 만한 사정이 없었더라도, 甲의 출입이 실제로는 CCTV 카메라와 동영상 저장장치를 부착한 TV인 사실을 숨기고 이루어졌다면 甲에게는 주거침입죄가 성립한다. (23.2차)","answer":false,"quote":"피고인이 피해자의 안방에 CCTV 카메라와 동영상 저장장치를 부착한 TV인 사실을 숨기고 피해자에게 TV를 설치해주겠다면서 안방까지 들어가 피해자의 주거에 침입하였다는 내용으로 기소된 사안에서, 피해자의 사실상 평온상태가 침해되었다고 볼 만한 사정이 없다는 이유로, 피고인의 출입이 비록 범죄 등의 목적을 숨기고 한 것이라도 주거침입죄가 성립하지 않는다고 한 사례","cite":"대법원 2022도1717","badge":"","topic":"","from":"GY-2023-2-X-19","seq":null},{"id":"X-OX-229","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"강간죄에서의 폭행 협박과 간음 사이에는 인과관계가 있어야 하나, 폭행 협박이 반드시 간음행위보다 선행되어야 하는 것은 아니다. (22.1차)","answer":true,"quote":"또한 강간죄에서의 폭행·협박과 간음 사이에는 인과관계가 있어야 하나, 폭행·협박이 반드시 간음행위보다 선행되어야 하는 것은 아니다.","cite":"대법원 2016도16948","badge":"","topic":"","from":"GY-2022-1-X-16","seq":null},{"id":"X-OX-320","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"甲이 정상적으로 대출금을 반환할 의사나 능력이 없음에도 휴대전화에 설치된 카드회사의 애플리케이션을 통해 카드론 대출을 신청하여 합계 34,500,000원을 자신의 계좌로 송금받았 더라도, 그 대출신청을 처리하는 일련의 과정에 카드회사 직원의 개입‧확인 없이 전산상 자동으로 처리되어 자동으로 송금받았다면 사기죄로 처벌할 수 없다. (26.1차)","answer":true,"quote":"피고인이 정상적으로 대출금을 반환할 의사나 능력이 없음에도 휴대전화에 설치된 카드회사의 애플리케이션을 통해 카드론 대출을 신청하여 대출금을 자신의 계좌로 송금받는 방법으로 총 2회에 걸쳐 카드회사들을 기망하여 카드회사들로부터 합계 34,500,000원을 편취하였다는 공소사실로 기소된 사안에서, 피고인이 카드회사들로부터 카드론 대출을 받기 위하여 휴대전화에 설치된 카드회사들의 애플리케이션을 이용하여 자금용도, 보유자산, 연소득정보, 부채정보, 연소득 대비 고정 지출, 신용점수 등을 입력한 데 따라 대출이 전산상 자동적으로 처리되어 송금받을 계좌로 대출금이 송금되었고, 대출신청을 처리하는 일련의 과정에 카드회사들의 직원이 대출신청을 확인하거나 대출금을 송금하는 등으로 개입하였다고 인정할 만한 사정이 없으므로, 피고인이 대출을 받는 과정에서 카드회사들의 직원 등 사람을 기망하였다고 볼 수 없는 점에 비추어, 피고인의 행위는 사람에 대한 기망행위를 수반하지 않아 사기죄에 해당하지 않는다는 이유로, 이와 달리 보아 공소사실을 유죄로 인정한 원심의 판단에 사기죄에서 기망행위에 관한 법리오해의 위법이 있다고 한 사례.","cite":"대법원 2024도18441","badge":"","topic":"","from":"GY-2026-1-X-18","seq":null},{"id":"X-OX-352","subject":"형사법","unit":"개인적 법익에 대한 죄","stmt":"｢형법｣ 제307조 제1항의 ‘사실’은 제2항의 ‘허위의 사실’과 반대되는 ‘진실한 사실’을 말하며, 가치판단이나 평가를 내용으로 하는 ‘의견’에 대치되는 개념은 아니다. (23.1차)","answer":false,"quote":"형법 제307조 제1항 , 제2항 , 제310조 의 체계와 문언 및 내용에 의하면, 제307조 제1항 의 ‘사실’은 제2항 의
