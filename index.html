따르면, 사실적 주장에 관한 언론보도등으로 인하여 피해를 입은 자는 그 보도 내용에 관한 반론보도를 언론사등에 청구 할 수 있고, 이러한 청구에는 언론사등의 고의 과실이나 위법성을 필요로 하지 아니하며, 보도 내용의 진실 여부와 상관없이 그 청구를 할 수 있다.","언론중재 및 피해구제 등에 관한 법률 제19조 제3항에 따르면, 제2항의 출석요구를 받은 신청인이 2회에 걸쳐 출석하지 아니한 경우에는 조정신청을 취하한 것으로 보며, 피신청 언론사등이 2회에 걸쳐 출석하지 아니한 경우에는 조정신청 취지에 따라 정정보도등을 이행하기로 합의한 것으로 본다.","언론중재위원회는 40명 이상 90명 이내의 중재위원으로 구성 하며, 위원장 1명과 2명 이내의 부위원장 및 2명 이내의 감사를 두는데, 위원장 부위원장 감사 및 중재위원의 임기는 각각 3년 으로 하며, 연임할 수 없다.",3,0,""],["2022-1","경찰학",8,"경찰통제에 관한 설명 중 가장 적절하지 않은 것은?","국회는 입법권과 예산심의권을 통해 경찰을 사전 통제할 수 있다.","부패방지 및 국민권익위원회의 설치와 운영에 관한 법률 및 동법 시행령에 따르면, 18세 이상의 국민은 경찰 등 공공기관의 사무처리가 법령위반 또는 부패행위로 인하여 공익을 현저히 해하는 경우, 100명 이상의 국민의 연서로 감사원에 감사를 청구할 수 있다.","상급자의 하급자에 대한 직무명령권은 내부적 통제의 일환이다.","경찰의 위법한 처분에 대한 행정소송제도는 사법통제로서 외부적 통제 장치이다.",1,0,""],["2022-1","경찰학",9,"경찰 인권보호 규칙 에 관한 설명 중 가장 적절하지 않은 것은?","‘인권침해’란 경찰관등이 직무를 수행하는 과정에서 모든 사람에게 보장된 인권을 침해하는 것을 말한다.","경찰 활동 전반에 걸친 민주적 통제를 구현하여 경찰력 오 남용을 예방하고, 경찰 행정의 인권지향성을 높여 인권을 존중하는 경찰 활동을 정립하기 위해 시 도경찰청장 및 경찰서의 심의 의결기구로서 각각 시 도경찰청 인권위원회, 경찰서 인권위원회를 설치하여 운영한다.","경찰청장은 경찰관등이 근무하는 동안 지속적 체계적으로 교육을 받을 수 있도록 3년 단위로 인권교육종합계획을 수립하여 시행 하여야 한다.","인권보호담당관은 인권침해를 예방하고 제도를 개선하기 위해 연 1회 이상 인권 관련 정책 이행 실태, 인권교육 추진 현황, 경찰청과 소속기관의 청사 및 부속 시설 전반의 인권침해적 요소의 존재 여부를 진단하여야 한다.",1,0,""],["2022-1","경찰학",10,"경찰청 감사 규칙 상 감사결과의 처리기준에 관한 설명 중 옳은 것은 모두 몇 개인가? ㉠ 변상명령:감사결과 경미한 지적사항으로서 현지에서 즉시 시정 개선조치가 필요한 경우 ㉡ 경고 주의 요구:감사결과 위법 또는 부당하다고 인정되는 사실이 있으나 그 정도가 징계 또는 문책사유에 이르지 아니할 정도로 경미하거나, 감사대상기관 또는 부서에 대한 제재가 필요한 경우 ㉢ 시정 요구:감사결과 법령상 제도상 또는 행정상 모순이 있거나 그 밖에 개선할 사항이 있다고 인정되는 경우 ㉣ 개선 요구:감사결과 문제점이 인정되는 사실이 있어 그 대안을 제시하고 감사대상기관의 장 등으로 하여금 개선방안을 마련하도록 할 필요가 있는 경우","0개","1개","2개","3개",1,0,""],["2022-1","경찰학",11,"다음은 전통적 경찰활동과 지역사회 경찰활동에 관한 비교 설명이다(Sparrow, 1988). 질문과 답변의 연결이 가장 적절 하지 않은 것은?","경찰은 누구인가? - 전통적 경찰활동의 관점에서는 법집행을 주로 책임지는 정부기관이라고 답변할 것이며, 지역사회 경찰 활동의 관점에서는 경찰이 시민이고 시민이 경찰이라고 답변 할 것이다.","언론 접촉 부서의 역할은 무엇인가? - 전통적 경찰활동의 관점 에서는 현장경찰관들에 대한 비판적 여론을 차단하는 것이라고 답변할 것이며, 지역사회 경찰활동의 관점에서는 지역사회와의 원활한 소통창구라고 답변할 것이다.","경찰의 효과성은 무엇이 결정하는가? - 전통적 경찰활동의 관점 에서는 경찰의 대응시간이라고 답변할 것이며, 지역사회 경찰 활동의 관점에서는 시민의 협조라고 답변할 것이다.","가장 중요한 정보란 무엇인가? - 전통적 경찰활동의 관점에서는 범죄자 정보(개인 또는 집단의 활동사항 관련 정보)라고 답변할 것이며, 지역사회 경찰활동의 관점에서는 범죄사건 정보(특정 범죄사건 또는 일련의 범죄사건 관련 정보)라고 답변할 것이다.",3,0,""],["2022-1","경찰학",12,"다음 경찰활동 예시의 근거가 되는 범죄원인론으로 가장 관련성이 높은 것은? A경찰서는 관내에서 폭행으로 적발된 청소년을 형사입건하는 대신, 학교전담경찰관이 외부 전문가와 함께 3일 동안 다양한 활동으로 구성된 선도프로그램을 제공함으로써 해당 청소년에게 스스로 잘못을 뉘우치고 장차 지역사회로 다시 통합될 수 있는 기회를 제공하였다.","낙인이론","일반긴장이론","깨진 유리창 이론","일상활동이론",0,0,""],["2022-1","경찰학",13,"뉴먼(1972)은 방어공간의 구성요소를 구분하였다. 이와 관련된 <보기 1>의 설명과 <보기 2>의 구성요소가 가장 적절하게 연결된 것은? <보기 1> (가) 지역의 외관이 다른 지역과 고립되어 있지 않고, 보호 되고 있으며, 주민의 적극적 행동의지를 보여줌 (나) 지역에 대한 소유의식은 일상적이지 않은 일이 있을 때 주민으로 하여금 행동을 취하도록 자극함 (다) 특별한 장치의 도움 없이 실내와 실외의 활동을 관찰할 수 있는 능력임 <보기 2> ㉠ 영역성 ㉡ 자연적 감시 ㉢ 이미지 ㉣ 환경 (가) (나) (다)","㉢ ㉣ ㉠","㉢ ㉠ ㉡","㉣ ㉠ ㉢","㉣ ㉢ ㉡",1,0,""],["2022-1","경찰학",14,"경찰조직편성의 원리에 관한 설명 중 가장 적절하지 않은 것은?","‘통솔의 범위’는 한 사람의 상관이 효과적으로 감독할 수 있는 최대한의 부하의 수를 말한다.","‘계층제’는 권한과 책임의 정도에 따라 직무를 등급화 함으로써 상 하계층 간 직무상 지휘 감독관계에 놓이게 하는 것을 말한다.","‘명령통일의 원리’는 조직구성원들은 한 사람의 상관으로부터만 명령을 받고, 보고도 그 상관에게만 하여야 한다는 것을 의미한다.","‘할거주의’는 타기관 및 타부처에 대한 횡적인 조정과 협조를 용이하게 만드는 대표적인 요인으로 조정 통합의 원리에 필수 적인 요소이다.",3,0,""],["2022-1","경찰학",15,"경찰공무원 승진임용 규정 상 승진에 관한 설명 중 가장 적절하지 않은 것은?","경찰공무원의 승진임용은 심사승진임용 시험승진임용 및 특별 승진임용으로 구분한다.","경찰공무원 승진임용 규정 제6조 제1항 제2호에 따르면 소극 행정으로 감봉에 해당하는 징계처분을 받은 경찰공무원은 징계 처분의 집행이 끝난 날부터 18개월이 지나지 아니하면 심사승진 임용될 수 없다.","임용권자나 임용제청권자는 시험승진후보자 명부에 기록된 사람이 승진임용되기 전에 감봉 이상의 징계처분을 받은 경우에는 시험 승진후보자 명부에서 그 사람을 제외하여야 한다.","총경 이하의 경찰공무원에 대해서는 매년 근무성적을 평정하여야 하나 휴직 직위해제 등의 사유로 해당 연도의 평정기관에서 6개월 이상 근무하지 아니한 경찰공무원에 대해서는 근무성적을 평정 하지 아니한다.",2,0,""],["2022-1","경찰학",16,"경찰공무원법 상 경찰공무원의 직권면직사유 중 직권면직 처분을 위해 징계위원회의 동의가 필요한 사유로 옳은 것은 모두 몇 개인가? ㉠ 해당 경과에서 직무를 수행하는 데 필요한 자격증의 효력이 상실되거나 면허가 취소되어 담당 직무를 수행할 수 없게 되었을 때 ㉡ 직무를 수행하는 데에 위험을 일으킬 우려가 있을 정도의 성격적 또는 도덕적 결함이 있는 사람으로서 대통령령으로 정하는 사유에 해당된다고 인정될 때 ㉢ 경찰공무원으로는 부적합할 정도로 직무 수행능력이나 성실성이 현저하게 결여된 사람으로서 대통령령으로 정하는 사유에 해당된다고 인정될 때 ㉣ 휴직 기간이 끝나거나 휴직 사유가 소멸된 후에도 직무에 복귀하지 아니하거나 직무를 감당할 수 없을 때","1개","2개","3개","4개",1,0,""],["2022-1","경찰학",17,"경찰장비관리규칙 상 무기고 및 탄약고 설치에 관한 설명 중 가장 적절하지 않은 것은?","무기 탄약고 비상벨은 상황실과 숙직실 등 초동조치 가능장소와 연결하고, 외곽에는 철조망 장치와 조명등 및 순찰함을 설치 하여야 한다.","탄약고 내에는 전기시설을 하는 것이 원칙이나, 조명은 건전지 등으로 하고 방화시설을 완비하여야 한다.","무기고와 탄약고의 환기통 등에는 손이 들어가지 않도록 쇠창살 시설을 하고, 출입문은 2중으로 하여 각 1개소 이상씩 자물쇠를 설치하여야 한다.","탄약고는 무기고와 분리되어야 하며 가능한 본 청사와 격리된 독립 건물로 하여야 한다.",1,0,""],["2022-1","경찰학",18,"국가재정법 상 예산 편성 및 집행에 관한 설명 중 가장 적절하지 않은 것은?","각 중앙관서의 장은 제29조의 규정에 따른 예산안편성지침에 따라 그 소관에 속하는 당해 연도의 세입세출예산 계속비 명시 이월비 및 국고채무부담행위 요구서를 작성하여 매년 3월 31일 까지 기획재정부장관에게 제출하여야 한다.","각 중앙관서의 장은 매년 1월 31일까지 해당 회계연도부터 5회계 연도 이상의 기간 동안의 신규사업 및 기획재정부장관이 정하는 주요 계속사업에 대한 중기사업계획서를 기획재정부장관에게 제출하여야 한다.","기획재정부장관은 각 중앙관서의 장에게 예산을 배정한 때에는 감사원에 통지하여야 한다.","정부는 제32조의 규정에 따라 대통령의 승인을 얻은 예산안을 회계연도 개시 120일 전까지 국회에 제출하여야 한다.",0,0,""],["2022-1","경찰학",19,"보안업무규정 상 비밀에 관한 설명 중 가장 적절하지 않은 것은?","Ⅱ급 비밀은 누설될 경우 국가안전보장에 막대한 지장을 끼칠 우려가 있는 비밀을 말한다.","비밀은 적절히 보호할 수 있는 최고등급으로 분류하되, 과도 하거나 과소하게 분류해서는 아니 된다.","비밀은 보관하고 있는 시설 밖으로 반출해서는 아니 된다. 다만, 공무상 반출이 필요할 때에는 소속 기관의 장의 승인을 받아야 한다.","비밀을 휴대하고 출장 중인 사람은 비밀을 안전하게 보호하기 위하여 국내 경찰기관 또는 재외공관에 보관을 위탁할 수 있으며, 위탁받은 기관은 그 비밀을 보관하여야 한다.",1,0,""],["2022-1","경찰학",20,"지역경찰의 조직 및 운영에 관한 규칙 에 관한 설명 중 옳은 것은 모두 몇 개인가? ㉠ 시 도경찰청장은 인구, 면적, 행정구역, 교통 지리적 여건, 각종 사건사고 발생 등을 고려하여 경찰서의 관할구역을 나누어 지역경찰관서를 설치한다. ㉡ 관리팀원 및 순찰팀원에 대한 일일근무 지정 및 지휘 감독과 관내 중요 사건 발생시 현장 지휘는 순찰팀장의 직무이다. ㉢ 직주일체형 치안센터에 배치된 근무자는 근무 종료 후(휴무일 포함)에도 관할구역 내에 위치하며 지역경찰관서와 연락체계를 유지하여야 한다. ㉣ 지역경찰관서장은 관내 치안상황의 분석 및 대책을 수립하고 소속 지역경찰의 근무와 관련된 제반사항에 대해 지휘 및 감독한다. ㉤ 상황근무를 지정받은 지역경찰은 지역경찰관서 및 치안센터 내에서 방문민원 및 각종 신고사건의 접수 및 처리를 수행한다.","5개","4개","3개","2개",1,0,""],["2022-1","경찰학",21,"경비업법 제2조정의에관한설명중가장적절하지않은 것은?","‘시설경비업무’란 경비를 필요로 하는 시설 및 장소(이하 “경비 대상시설” 이라 한다)에서의 도난 화재 그 밖의 혼잡 등으로 인한 위험발생을 방지하는 업무를 말한다.","‘호송경비업무’란 운반중에 있는 현금 유가증권 귀금속 상품 그 밖의 물건에 대하여 도난 화재 등 위험발생을 방지하는 업무를 말한다.","‘신변보호업무’란 사람의 생명 신체 재산에 대한 위해의 발생을 방지하고 그 신변을 보호하는 업무를 말한다.","‘기계경비업무’란 경비대상시설에 설치한 기기에 의하여 감지 송신된 정보를 그 경비대상시설외의 장소에 설치한 관제시설의 기기로 수신하여 도난 화재 등 위험발생을 방지하는 업무를 말한다.",2,0,""],["2022-1","경찰학",22,"범죄피해자 보호법 에 관한 설명 중 가장 적절하지 않은 것은?","‘범죄피해자’란 타인의 범죄행위로 피해를 당한 사람과 그 배우자, 직계친족 및 형제자매를 말한다. 다만, 배우자의 경우 사실상의 혼인관계는 제외한다.","국가는 범죄피해자가 해당 사건과 관련하여 수사담당자와 상담하거나 재판절차에 참여하여 진술하는 등 형사절차상의 권리를 행사할 수 있도록 보장하여야 한다.","국가는 범죄피해자가 요청하면 가해자에 대한 수사 결과, 공판기일, 재판 결과, 형 집행 및 보호관찰 집행 상황 등 형사 절차 관련 정보를 대통령령으로 정하는 바에 따라 제공할 수 있다.","국가 및 지방자치단체는 범죄피해자가 형사소송절차에서 한 진술이나 증언과 관련하여 보복을 당할 우려가 있는 등 범죄 피해자를 보호할 필요가 있을 경우에는 적절한 조치를 마련 하여야 한다.",0,0,""],["2022-1","경찰학",23,"스토킹범죄의 처벌 등에 관한 법률 에 관한 설명 중 가장 적절하지 않은 것은?","‘스토킹범죄’란 지속적 또는 반복적으로 스토킹행위를 하는 것을 말한다.","사법경찰관리는 진행 중인 스토킹행위에 대하여 신고를 받은 경우 즉시 현장에 나가 스토킹 행위의 제지, 스토킹행위자와 피해자 분리, 유치장 또는 구치소에의 유치 등의 조치를 할 수 있다.","스토킹범죄를 저지른 사람은 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.","흉기 또는 그 밖의 위험한 물건을 휴대하거나 이용하여 스토킹 범죄를 저지른 사람은 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.",1,0,""],["2022-1","경찰학",24,"국민보호와 공공안전을 위한 테러방지법 제2조 정의에 관한 설명 중 가장 적절하지 않은 것은?","‘테러위험인물’이란 테러를 실행 계획 준비하거나 테러에 참가할 목적으로 국적국이 아닌 국가의 테러단체에 가입하거나 가입 하기 위하여 이동 또는 이동을 시도하는 외국인을 말한다.","‘대테러활동’이란 제1호의 테러 관련 정보의 수집, 테러위험 인물의 관리, 테러에 이용될 수 있는 위험물질 등 테러수단의 안전관리, 인원 시설 장비의 보호, 국제행사의 안전확보, 테러 위협에의 대응 및 무력진압 등 테러 예방과 대응에 관한 제반 활동을 말한다.","‘테러단체’란 국제연합(UN)이 지정한 테러단체를 말한다.","‘대테러조사’란 대테러활동에 필요한 정보나 자료를 수집하기 위하여 현장조사 문서열람 시료채취 등을 하거나 조사대상자 에게 자료제출 및 진술을 요구하는 활동을 말한다.",0,0,""],["2022-1","경찰학",25,"음주운전 관련 판례에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","술에 취해 자동차 안에서 잠을 자다가 추위를 느껴 히터를 가동 시키기 위하여 시동을 걸었고, 실수로 자동차의 제동장치 등을 건드렸거나 처음 주차할 때 안전조치를 제대로 취하지 아니한 탓으로 원동기의 추진력에 의하여 자동차가 약간 경사진 길을 따라 앞으로 움직여 피해자의 차량 옆면을 충격한 사실은 엿볼 수 있으나 이를 두고 피고인이 자동차를 운전하였다고 할 수는 없다.","운전자가 경찰공무원으로부터 음주측정을 요구받고 호흡측정기에 숨을 내쉬는 시늉만 하는 등 형식적으로 음주측정에 응하였을 뿐 경찰공무원의 거듭된 요구에도 불구하고 호흡측정기에 음주 측정수치가 나타날 정도로 숨을 제대로 불어넣지 아니하였다면 이는 실질적으로 음주측정에 불응한 것과 다를 바 없다.","음주운전과 관련한 도로교통법 위반죄의 범죄수사를 위하여 미성년자인 피의자의 혈액채취가 필요한 경우에도 피의자에게 의사능력이 있다면 피의자 본인만이 혈액채취에 관한 유효한 동의를 할 수 있고, 피의자에게 의사능력이 없는 경우 명문의 규정이 없더라도 법정대리인이 피의자를 대리하여 동의할 수 있다.","특별한 이유 없이 호흡측정기에 의한 측정에 불응하는 운전자 에게 경찰공무원이 혈액채취에 의한 측정방법이 있음을 고지 하고 그 선택 여부를 물어야 할 의무가 있다고는 할 수 없다.",2,0,""],["2022-1","경찰학",26,"범죄인 인도법 제7조에 따른 절대적 인도거절 사유에 해당하지 않는 것은?","대한민국 또는 청구국의 법률에 따라 인도범죄에 관한 공소시효 또는 형의 시효가 완성된 경우","인도범죄에 관하여 대한민국 법원에서 재판이 계속 중이거나 재판이 확정된 경우","인도범죄의 성격과 범죄인이 처한 환경 등에 비추어 범죄인을 인도하는 것이 비인도적이라고 인정되는 경우","범죄인이 인종, 종교, 국적, 성별, 정치적 신념 또는 특정 사회 단체에 속한 것 등을 이유로 처벌되거나 그 밖의 불리한 처분을 받을 염려가 있다고 인정되는 경우",2,0,""],["2022-1","경찰학",27,"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 상 시 도자치경찰위원회의 설명에 관한 내용 중 가장 적절하지 않은 것은?","공무원이 아닌 위원에 대해서는 국가공무원법 제55조 및 제57조를 준용한다.","위원 중 1명은 인권문제에 관하여 전문적인 지식과 경험이 있는 사람이 임명될 수 있도록 노력하여야 한다.","위원은 정치적 중립을 지켜야 하며, 권한을 남용하여서는 아니 된다.","시 도자치경찰위원회는 합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다.",0,0,""],["2022-1","경찰학",28,"행정 효율과 협업 촉진에 관한 규정 상 공문서에 관한 설명 중 가장 적절하지 않은 것은?","‘지시문서’란 훈령 지시 예규 일일명령 등 행정기관이 그 하급 기관이나 소속 공무원에 대하여 일정한 사항을 지시하는 문서를 말한다.","‘공고문서’란 고시 공고 등 행정기관이 일정한 사항을 일반에게 알리는 문서를 말한다.","‘일반문서’란 민원인이 행정기관에 허가, 인가, 그 밖의 처분 등 특정한 행위를 요구하는 문서와 그에 대한 처리문서를 말한다.","‘법규문서’란 헌법 법률 대통령령 총리령 부령 조례 규칙 등에 관한 문서를 말한다.",2,0,""],["2022-1","경찰학",29,"공공기관의 정보공개에 관한 법률 상 정보공개의 절차에 관한 설명 중 가장 적절한 것은?","정보의 공개를 청구하는 자는 해당 정보를 보유하거나 관리하고 있는 공공기관에 정보공개 청구서를 제출하여 정보의 공개를 청구할 수 있으나, 말로써 정보의 공개를 청구할 수 없다.","공공기관은 부득이한 사유로 공공기관의 정보공개에 관한 법률 제11조 제1항에 따른 기간 이내에 공개 여부를 결정할 수 없을 때에는 그 기간이 끝난 날부터 기산하여 10일의 범위에서 공개 여부 결정기간을 연장할 수 있다. 이 경우 공공기관은 연장된 사실과 연장 사유를 청구인에게 지체 없이 구두로 통지하여야 한다.","공공기관은 전자적 형태로 보유 관리하는 정보에 대하여 청구 인이 전자적 형태로 공개하여 줄 것을 요청하는 경우에는 그 정보의 성질상 현저히 곤란한 경우를 제외하고는 청구인의 요 청에 따라야 한다.","정보의 공개 및 우송 등에 드는 비용은 실비의 범위에서 공공 기관이 부담한다.",2,0,""],["2022-1","경찰학",30,"행정절차법 상 행정지도에 관한 설명 중 가장 적절하지 않은 것은?","행정지도는 그 목적 달성에 필요한 최소한도에 그쳐야 하며, 행정지도의 상대방의 의사에 반하여 부당하게 강요하여서는 아니 된다.","행정기관은 행정지도의 상대방이 행정지도에 따르지 아니하였 다는 것을 이유로 불이익한 조치를 하여서는 아니 된다.","행정지도가 말로 이루어지는 경우에 상대방이 행정지도의 취지 및 내용과 신분의 사항을 적은 서면의 교부를 요구하면 그 행정지도를 하는 자는 직무 수행에 특별한 지장이 없으면 이를 교부하여야 한다.","행정지도의 상대방은 해당 행정지도의 방식 내용 등에 관하여 행정기관에 의견제출을 할 수 없다.",3,0,""],["2022-1","경찰학",31,"질서위반행위규제법에관한설명중가장적절하지않은 것은?","행정청의 과태료 처분이나 법원의 과태료 재판이 확정된 후 법률이 변경되어 그 행위가 질서위반행위에 해당하지 아니하게 된 때에는 변경된 법률에 특별한 규정이 없는 한 과태료의 징수 또는 집행을 면제한다.","고의또는과실이없는질서위반행위는과태료를부과하지아니한다.","자신의 행위가 위법하지 아니한 것으로 오인하고 행한 질서 위반행위는 그 오인에 정당한 이유가 있는 때에도 과태료를 부과한다.","과태료는 행정청의 과태료 부과처분이나 법원의 과태료 재판이 확정된 후 5년간 징수하지 아니하거나 집행하지 아니하면 시효로 인하여 소멸한다.",2,0,""],["2022-1","경찰학",32,"행정상 즉시강제에 해당하는 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 경찰관 직무집행법 제6조 범죄의 예방을 위한 제지 ㉡ 경찰관 직무집행법 제4조 제1항 제1호에서 규정하는 술에 취한 상태로 인하여 자기 또는 타인의 생명 신체와 재산에 위해를 미칠 우려가 있는 피구호자에 대한 보호조치 ㉢ 행정대집행법 제2조 대집행 ㉣ 국세징수법 제24조 강제징수","㉠㉢","㉡㉢","㉠㉡","㉡㉣",2,0,""],["2022-1","경찰학",33,"위해성 경찰장비의 사용기준 등에 관한 규정 에 관한 설명 중 가장 적절하지 않은 것은?","권총 소총 기관총 함포 크레모아 수류탄 가스발사총은 무기에 해당한다.","경찰관은 14세 미만의 자 또는 임산부에 대하여 전자충격기 또는 전자방패를 사용하여서는 아니된다.","경찰관은 전극침(電極針) 발사장치가 있는 전자충격기를 사용하는 경우 상대방의 얼굴을 향하여 전극침을 발사하여서는 아니된다.","경찰관(경찰공무원으로 한정한다)은 체포 구속영장을 집행하거나 신체의 자유를 제한하는 판결 또는 처분을 받은 자를 법률이 정한 절차에 따라 호송하거나 수용하기 위하여 필요한 때에는 최소한의 범위안에서 수갑 포승 또는 호송용포승을 사용할 수 있다.",0,0,""],["2022-1","경찰학",34,"경찰관 직무집행법 및 동법 시행령상 손실보상에 관한 내용 중 가장 적절하지 않은 것은?","소속 경찰공무원의 직무집행으로 인하여 발생한 손실보상청구 사건을 심의하기 위하여 경찰청, 해양경찰청, 시 도경찰청 및 지방해양경찰청에 손실보상심의위원회를 설치한다.","손실보상을 청구할 수 있는 권리는 손실이 있음을 안 날부터 3년, 손실이 발생한 날부터 5년간 행사하지 아니하면 시효의 완성으로 소멸한다.","손실보상금 지급 청구서를 받은 경찰청장등은 손실보상심의위 원회의 심의 의결에 따라 손실보상 여부 및 손실보상금액을 결정하되 손실보상 청구가 요건과 절차를 갖추지 못한 경우 (다만, 그 잘못된 부분을 시정할 수 있는 경우는 제외한다) 그 청구를 기각하는 결정을 하여야 한다.","손실보상금은 일시불로 지급하되, 예산 부족 등의 사유로 일시금으로 지급할 수 없는 특별한 사정이 있는 경우에는 청구인의 동의를 받아 분할하여 지급할 수 있다.",2,0,""],["2022-1","경찰학",35,"경찰 물리력 행사의 기준과 방법에 관한 규칙 제2장에 따른 대상자 행위에 대한 설명이다. 각 단계와 내용의 연결이 가장 적절하지 않은 것은?","소극적 저항 - 대상자가 경찰관의 지시, 통제를 따르지 않고 비협조적이지만 경찰관 또는 제3자에 대해 직접적인 위해를 가하지 않는 상태","적극적 저항 - 대상자가 자신에 대한 경찰관의 체포 연행 등 정당한 공무집행을 방해하지만 경찰관 또는 제3자에 대해 위해 수준이 낮은 행위만을 하는 상태","폭력적 공격 - 대상자가 경찰관 또는 제3자에 대해 신체적 위해를 가하는 상태","치명적 공격 - 대상자가 경찰관에게 폭력을 행사하려는 자세를 취하여 그 행사가 임박한 상태, 주먹 발 등을 사용해서 경찰관에 대해 신체적 위해를 초래하고 있는 상태",3,0,""],["2022-1","경찰학",36,"다음 <보기>의 내용 중 공통된 행정의 법 원칙은 무엇인가? <보 기> 행정기본법 제12조제1항“행정청은 공익 또는 제3자의 이익을 현저히 해칠 우려가 있는 경우를 제외하고는 행정에 대한 국민의 정당하고 합리적인 신뢰를 보호하여야 한다.” 행정절차법 제4조 제2항 “행정청은 법령등의 해석 또는 행정청의 관행이 일반적으로 국민들에게 받아들여졌을 때에는 공익 또는 제3자의 정당한 이익을 현저히 해칠 우려가 있는 경우를 제외하고는 새로운 해석 또는 관행에 따라 소급하여 불리하게 처리하여서는 아니 된다.”","비례의 원칙","평등의 원칙","신뢰보호의 원칙","부당결부금지의 원칙",2,0,""],["2022-1","경찰학",37,"경찰관 직무집행법 에 관한 내용 중 가장 적절하지 않은 것은?","경찰관서의 장은 직무 수행에 필요하다고 인정되는 상당한 이유가 있을 때에는 국가기관이나 공사(公私) 단체 등에 직무 수행에 관련된 사실을 조회할 수 있다. 다만, 긴급한 경우에는 소속 경찰관으로 하여금 현장에 나가 해당 기관 또는 단체의 장의 협조를 받아 그 사실을 확인하게 할 수 있다.","국가경찰위원회 위원장은 경찰관이 경찰관 직무집행법 제2조 (직무의 범위) 각 호에 따른 직무의 수행으로 인하여 민 형사상 책임과 관련된 소송을 수행할 경우 변호인 선임 등 소송 수행에 필요한 지원을 하여야 한다.","경찰청장, 시 도경찰청장 또는 경찰서장은 경찰관 직무집행법 제11조의3 제2항에 따른 보상금심사위원회의 심사 의결에 따라 보상금을 지급하고, 거짓 또는 부정한 방법으로 보상금을 받은 사람에 대하여는 해당 보상금을 환수한다.","보상금심사위원회는 위원장 1명을 포함한 5명 이내의 위원으로 구성한다.",1,0,""],["2022-1","경찰학",38,"다음 행정행위 중 강학상 특허에 해당하는 것은? (다툼이 있는 경우 판례에 의함)","자동차운전면허","재단법인의 정관변경 허가","한의사 면허","국유재산 등의 관리청이 행정재산의 사용 수익에 대하여 하는 허가",3,0,""],["2022-1","경찰학",39,"행정소송법 상 항고소송에 해당하지 않는 것은?","국가 또는 공공단체의 기관이 법률에 위반되는 행위를 한 때에 직접 자기의 법률상 이익과 관계없이 그 시정을 구하기 위하여 제기하는 민중소송","행정청의 처분등의 효력 유무 또는 존재여부를 확인하는 무효 등 확인소송","행정청의 부작위가 위법하다는 것을 확인하는 부작위위법확인소송","행정청의 위법한 처분등을 취소 또는 변경하는 취소소송",0,0,""],["2022-1","경찰학",40,"오늘날 우리나라 경찰의 변화에 관한 설명 중 가장 적절 하지 않은 것은?","수사절차 전반에 걸쳐 주관적인 시각으로 사건을 살펴보고 오류를 바로잡을 수 있도록 하기 위하여 일선 지구대 및 파출소에 ‘영장심사관’, ‘수사심사관’ 제도를 도입 운영하고 있다.","집회 시위에 대한 관점을 관리 통제에서 인권존중 소통으로 근본적으로 바꾸기 위해 스웨덴 집회 시위관리 정책을 벤치마킹한 ‘대화경찰관제’를 도입 시행하고 있다.","국경을 초월하는 국제범죄에 능동적으로 대응하고 재외국민 보호를 위해 치안시스템 전수, 외국경찰 초청연수, 치안인프라 구축사업 등을 내용으로 하는 치안한류 사업을 추진하고 있다.","2020년 12월 국가정보원법 개정에 따라 국가정보원의 국가 안보 관련 수사업무가 경찰로 이관될 예정이다.",0,0,""],["2022-2","헌법",1,"신뢰보호원칙에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","신뢰보호의 원칙은 법치국가원리에 근거를 두고 있는 헌법상의 원칙으로서 특정한 법률에 의하여 발생한 법률관계는 그 법에 따라 파악되고 판단되어야 하고, 과거의 사실관계가 그 뒤에 생긴 새로운 법률의 기준에 따라 판단되지 않는다는 국민의 신뢰를 보호하기 위한 것이다.","구 매장 및 묘지 등에 관한 법률 이 장사 등에 관한 법률 로 전부개정되면서 그 부칙에서 종전의 법령에 따라 설치된 봉안 시설을 신법에 의하여 설치된 봉안시설로 보도록 함으로써 구법에 따라 설치허가를 받은 봉안시설 설치 관리인의 기존의 법상태에 대한 신뢰는 이미 보호되었다고 할 것이므로, 더 나아가 신법 시행 후 추가로 설치되는 부분에 대해서까지 기존의 법상태에 대한 보호가치 있는 신뢰가 있다고 보기 어렵다.","부진정소급입법의 경우 입법권자의 입법형성권보다 당사자가 구법질서에 기대했던 신뢰보호의 견지에서 그리고 법적 안정성을 도모하기 위해 특단의 사정이 없는 한 구법에 의하여 이미 얻은 자격 또는 권리를 새 입법을 하는 마당에 그대로 존중할 의무가 있다고 할 것이나, 진정소급입법의 경우에는 구법질서에 대하여 기대했던 당사자의 신뢰보호보다는 광범위한 입법권자의 입법 형성권을 경시해서는 안될 일이므로 특단의 사정이 없는 한 새 입법을 하면서 구법관계 내지 구법상의 기대이익을 존중하여야 할 의무가 발생하지는 않는다.","‘개성공단의 정상화를 위한 합의서’에는 국내법과 동일한 법적 구속력을 인정하기 어렵고, 과거 사례 등에 비추어 개성공단의 중단 가능성은 충분히 예상할 수 있었으므로, 개성공단 전면 중단 조치는 신뢰보호원칙을 위반하여 개성공단 투자기업인 청구인들의 영업의 자유와 재산권을 침해하지 아니한다.",2,0,""],["2022-2","헌법",2,"국적의 취득 등에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 우리나라가 선천적 국적취득에 관하여 부계혈통주의에서 부모양계혈통주의로 개정한 것은 가족생활에 있어서 양성의 평등원칙에 부합한다. ㉡ 외국인이 국적법 상 귀화요건을 갖추었더라도 법무부장관은 그 외국인의 귀화 허가 여부에 대한 재량권을 가진다. ㉢ 외국인이 복수국적을 누릴 자유는 우리 헌법상 행복추구권에 의하여 보호되는 기본권이라고 보기 어렵다. ㉣ “대한민국의 국민으로서 자진하여 외국 국적을 취득한 자는 그 외국 국적을 취득한 때에 대한민국 국적을 상실한다.”는 국적법 조항은 청구인의 거주 이전의 자유 및 행복추구권을 침해하는 것은 아니다. ㉤ 국적회복과 귀화는 모두 외국인이 후천적으로 법무부장관의 허가라는 주권적 행정절차를 통하여 대한민국 국적을 취득 하는 제도라는 점에서 동일하나, 귀화는 대한민국 국적을 취득한 사실이 없는 순수한 외국인이 법무부장관의 허가를 받아 대한민국 국적을 취득할 수 있도록 하는 절차인데 비해, 국적회복허가는 한 때 대한민국 국민이었던 자를 대상으로 한다는 점, 귀화는 일정한 요건을 갖춘 사람에게만 허가할 수 있는 반면, 국적회복허가는 일정한 사유에 해당하는 사람에 대해서만 국적회복을 허가하지 아니한다는 점에서 차이가 있다.","2개","3개","4개","5개",3,0,""],["2022-2","헌법",3,"문화국가원리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","우리 헌법상 문화국가원리는 견해와 사상의 다양성을 그 본질로 하며, 이를 실현하는 국가의 문화정책은 불편부당의 원칙에 따라야 한다.","문화창달을 위하여 문화예술 공연관람자 등에게 예술감상에 의한 정신적 풍요의 대가로 문화예술진흥기금을 납입하게 하는 것은 헌법의 문화국가이념에 반하는 것이 아니다.","국가의 문화육성의 대상에는 원칙적으로 모든 사람에게 문화 창조의 기회를 부여한다는 의미에서 모든 문화가 포함되므로, 엘리트문화, 서민문화, 대중문화 모두 그 가치가 인정되고 정책 적인 배려의 대상이 되어야 한다.","고액 과외교습을 방지하기 위하여 모든 학생으로 하여금 오로지 학원에서만 사적으로 배울 수 있도록 규율한다는 것은 개성과 창의성, 다양성을 지향하는 문화국가원리에 위반된다. 법】(일반공채 101경비단)",1,0,""],["2022-2","헌법",4,"기본권 주체성에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","학교안전사고 예방 및 보상에 관한 법률 에 의하여 설립된 학교안전공제회는 행정관청 또는 그로부터 행정권한을 위임받은 공공단체로 공법인에 해당할 뿐, 사법인적 성격을 갖는 것은 아니므로 기본권의 주체가 될 수 없다.","모든 인간은 헌법상 생명권의 주체가 되나, 자궁에 착상하기 전 또는 원시선이 나타나기 전까지의 ‘초기배아’에게는 기본권 주체성을 인정하기 어렵다.","헌법에 법인의 기본권 향유능력을 인정하는 명문의 규정이 없지만, 언론 출판의 자유, 재산권의 보장 등과 같이 성질상 법인이 누릴 수 있는 기본권은 법인에게 적용된다.","대학 자치의 주체를 기본적으로 대학으로 본다고 하더라도 교수나 교수회의 주체성이 부정된다고 볼 수 없는바, 가령 학문의 자유를 침해하는 대학의 장에 대한 관계에서는 교수나 교수회가 주체가 될 수 있고, 또한 국가에 의한 침해에 있어서는 대학 자체 외에도 대학 전구성원이 자율성을 갖는 경우도 있을 것이므로 문제되는 경우에 따라서 대학, 교수, 교수회 모두가 단독, 혹은 중첩적으로 주체가 될 수 있다고 보아야 할 것이다.",0,0,""],["2022-2","헌법",5,"기본권 보호의무에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국민의 생명 신체의 안전이 질병 등으로부터 위협받거나 받게 될 우려가 있는 경우 국가로서는 그 위험의 원인과 정도에 따라 사회 경제적인 여건 및 재정사정 등을 감안하여 국민의 생명 신체의 안전을 보호하기에 필요한 적절하고 효율적인 입법 행정상의 조치를 취하여 그 침해의 위험을 방지하고 이를 유지할 포괄적인 의무를 진다.","담배사업법 은 담배성분의 표시나 경고문구의 표시, 담배광고의 제한 등 여러 규제들을 통하여 직접흡연으로부터 국민의 생명 신체의 안전을 보호하려고 노력하고 있으므로 담배사업법 이 국가의 보호의무에 관한 과소보호금지 원칙을 위반하여 청구인의 생명·신체의 안전에 관한 권리를 침해하였다고 볼 수 없다.","구 전원개발촉진법 제2조 제1호에서 원전 건설을 내용으로 하는 전원개발사업 실시계획에 대한 승인권한을 다른 전원개발과 마찬가지로 산업통상자원부장관에게 부여하고 있다 하더라도, 국가가 국민의 생명 신체의 안전을 보호하기 위하여 필요한 최소한의 보호조치를 취하지 아니한 것이라고 보기는 어렵다.","대통령은 행정부의 수반으로서 국가가 국민의 생명과 신체의 안전 보호의무를 충실하게 이행할 수 있도록 권한을 행사하고 직책을 수행하여야 하는 의무를 부담하므로, 국민의 생명이 위협받는 재난상황이 발생한 경우 직접 구조 활동에 참여하여야 하는 등 구체적이고 특정한 행위의무까지 발생한다고 볼 수 있다.",3,0,""],["2022-2","헌법",6,"제도적 보장에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","제도적 보장은 주관적 권리가 아닌 객관적 법규범이라는 점에서 기본권과 구별되기는 하지만 헌법에 의하여 일정한 제도가 보장 되면 입법자는 그 제도를 설정하고 유지할 입법의무를 지게 될 뿐만 아니라 헌법에 규정되어 있기 때문에 법률로써 이를 폐지할 수 없고, 비록 내용을 제한하더라도 그 본질적 내용을 침해할 수 없다.","제도적 보장은 객관적 제도를 헌법에 규정하여 당해 제도의 본질을 유지하려는 것으로서 헌법제정권자가 특히 중요하고도 가치가 있다고 인정되고 헌법적으로도 보장할 필요가 있다고 생각하는 국가제도를 헌법에 규정함으로써 장래의 법 발전, 법 형성의 방침과 범주를 미리 규율하려는 데 있다.","재판청구권과 같은 절차적 기본권은 원칙적으로 제도적 보장의 성격이 강하기 때문에, 자유권적 기본권의 경우와 비교하여 볼 때 상대적으로 축소된 입법형성권이 인정된다.","직업공무원제도는 지방자치제도, 복수정당제도, 혼인제도 등과 함께 ‘제도보장’의 하나로서 이는 일반적인 법에 의한 폐지나 제도본질의 침해를 금지한다는 의미의 ‘최소보장’의 원칙이 적용 되는바, 이는 기본권의 경우 헌법 제37조 제2항의 과잉금지의 원칙에 따라 필요한 경우에 한하여 ‘최소한으로 제한’되는 것과 대조되는 것이다.",2,0,""],["2022-2","헌법",7,"헌법상 자기결정권에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","지역 주민의 의사가 반영되지 않은 채 이루어진 미군기지의 이전은 인근 지역에 거주하는 주민들의 삶을 결정함에 있어서 사회적으로 영향을 미치므로 헌법상 보장된 개인의 자기결정권을 제한하는 것이다.","형법 상 자기낙태죄 조항은 모자보건법 이 정한 예외를 제외 하고는 임신기간 전체를 통틀어 모든 낙태를 전면적 일률적으로 금지하고, 이를 위반할 경우 형벌을 부과함으로써 임신의 유지 출산을 강제하고 있으므로, 임신한 여성의 자기결정권을 제한한다.","환자가 장차 죽음에 임박한 상태에 이를 경우에 대비하여 미리 의료인 등에게 연명치료 거부 또는 중단에 관한 의사를 밝히는 등의 방법으로 죽음에 임박한 상태에서 인간으로서의 존엄과 가치를 지키기 위하여 연명치료의 거부 또는 중단을 결정할 수 있다 할 것이고, 위 결정은 헌법상 기본권인 자기결정권의 한 내용으로 보장이 되나, 입법자에게 헌법 해석상 ‘연명치료 중단 등에 관한 법률’을 제정할 입법의무까지 인정된다고 보기는 어렵다.","소주도매업자로 하여금 그 영업장소 소재지에서 생산되는 자도 소주를 의무적으로 총구입액의 100분의 50이상을 구입하도록 하는 자도소주 구입명령제도는 소비자가 자신의 의사에 따라 자유롭게 상품을 선택하는 자기결정권을 제한한다.",0,0,""],["2022-2","헌법",8,"평등권 내지 평등원칙에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 조세를 비롯한 공과금 부과에서의 평등원칙은, 공과금 납부 의무자가 법률에 의하여 법적인 평등 부담뿐만 아니라 사실적 으로도 평등하게 부담을 받을 것을 요청한다. ㉡ 유사한 성격의 규율대상에 대하여 이미 입법이 있다 하더 라도, 평등원칙을 근거로 입법자에게 청구인들에게도 적용될 입법을 하여야 할 헌법상의 의무가 발생한다고 볼 수 없다. ㉢ 국가라 할지라도 국고작용으로 인한 민사관계에 있어서는 일반인과 같이 원칙적으로 대등하게 다루어져야 하며 국가 라고 하여 우대하여야 할 헌법상의 근거가 없다. ㉣ 국가를 상대로 하는 당사자소송의 경우에는 가집행선고를 할 수 없다고 규정한 행정소송법 제43조는 공법상 법률 관계를 전제로 한다는 점에서 일반 사법상 법률관계와 달리 취급할 합리적 이유가 있으므로 평등원칙에 위배되지 아니한다.","1개","2개","3개","4개",2,0,""],["2022-2","헌법",9,"일사부재리 내지 이중처벌금지원칙에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형법 이 누범을 가중처벌하는 것은 전범에 대하여 형벌을 받았음에도 다시 범행을 하였다는 데 있는 것이지, 전범에 대하여 처벌을 받았음에도 다시 범행을 하는 경우 전범도 후범과 일괄 하여 다시 처벌한다는 것은 아님이 명백하므로, 누범에 대하여 형을 가중하는 것이 일사부재리원칙에 위배하는 것은 아니다.","행정법은 의무를 명하거나 금지를 설정함으로써 일정한 행정 목적을 달성하려고 하는데, 그 실효성을 확보하기 위하여 행정 형벌, 과태료, 영업허가의 취소 정지, 과징금 등을 가함으로써 의무위반 당사자로 하여금 더 이상 위반을 하지 않도록 유도 하는 것이 필요하고, 이와 같이 ‘제재를 통한 억지’는 행정규제의 본원적 기능이라 볼 수 있으므로, 어떤 행정제재의 기능이 오로지 제재에 있다고 하여 이를 헌법 제13조 제1항에서 말하는 ‘이중 처벌’에 해당한다고 할 수 없다.","공직선거법위반죄를 범하여 형사처벌을 받은 공무원에 대하여 당선무효라는 불이익을 가하는 것은 공직선거법위반 행위 자체에 대한 국가의 형벌권 실행으로서의 과벌에 해당하므로, 이중처벌 금지원칙에 위배될 가능성이 크다.","형사판결은 국가주권의 일부분인 형벌권 행사에 기초한 것으로서, 외국의 형사판결은 원칙적으로 우리 법원을 기속하지 않으므로 동일한 범죄행위에 관하여 다수의 국가에서 재판 또는 처벌을 받는 것이 배제되지 않는다고 할 것인바, 외국에서 형의 전부 또는 일부의 집행을 받은 자에 대하여 형을 감경 또는 면제할 수 있도록 규정한 형법 제7조는 이중처벌금지원칙에 위반되지 아니한다.",2,0,""],["2022-2","헌법",10,"영장주의에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","형사재판에 계속 중인 사람에 대하여 출국을 금지할 수 있다고 규정한 출입국관리법 조항에 따른 법무부장관의 출국금지결정은 형사재판에 계속 중인 국민의 출국의 자유를 제한하는 행정처분일 뿐이고, 영장주의가 적용되는 신체에 대하여 직접적으로 물리적 강제력을 수반하는 강제처분이라고 할 수는 없다.","영장주의는 법관이 발부한 영장에 의하지 아니하고는 수사에 필요한 강제처분을 하지 못한다는 원칙으로서, 마약류사범인 청구인에게마약류반응검사를위하여소변을받아제출하도록한것은 교도소의 안전과 질서유지를 위한 것으로 수사에 필요한 처분이 아닐 뿐만 아니라 검사대상자들의 협력이 필수적이어서 강제 처분이라고 할 수도 없어 영장주의의 원칙이 적용되지 않는다.","영장주의는 구속개시 시점에 있어서 신체의 자유에 대한 박탈의 허용만이 아니라 그 구속영장의 효력을 계속 유지할 것인지 아니면 정지 또는 실효시킬 것인지 여부의 결정도 오직 법관의 판단에 의하여만 결정되어야 한다는 것을 의미한다.","병(兵)에 대한 징계처분으로 일정기간 부대나 함정(艦艇) 내의 영창에 감금하는 처분이 가능하도록 규정한 구 군인사법 조항은 군(軍)이라는 특수한 신분관계에서 오는 불가피성 및 그 내용과 집행의 실질, 효과 등에 비추어 볼 때, 그 본질이 일반 형사 절차에서 이루어지는 인신구금과 동일하게 취급하기 어렵다는 측면에서 영장주의 원칙이 적용되지 않는다.",3,0,""],["2022-2","헌법",11,"변호인의 조력을 받을 권리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","변호인의 조력을 받을 권리란 국가권력의 일방적인 형벌권 행사에 대항하여 자신에게 부여된 헌법상 소송법상 권리를 효율적이고 독립적으로 행사하기 위하여 변호인의 도움을 얻을 피의자 및 피고인의 권리를 말한다.","교정시설 내 수용자와 변호사 사이의 접견교통권의 보장은 헌법상 보장되는 재판청구권의 한 내용 또는 그로부터 파생되는 권리로 볼 수 있다.","변호인접견실에 CCTV를 설치하여 교도관이 그 CCTV를 통해 미결수용자와 변호인 간의 접견을 관찰한 행위는 변호인의 조력을 받을 권리를 침해한다.","‘변호인이 되려는 자’의 접견교통권은 피의자 등을 조력하기 위한 핵심적인 부분으로서, 피의자 등이 가지는 헌법상의 기본권인 ‘변호인이 되려는 자’와의 접견교통권과 표리의 관계에 있으므로 피의자 등이 가지는 ‘변호인이 되려는 자’의 조력을 받을 권리가 실질적으로 확보되기 위해서는 ‘변호인이 되려는 자’의 접견교통권 역시 헌법상 기본권으로서 보장되어야 한다.",2,0,""],["2022-2","헌법",12,"종교의 자유에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 종교의 자유에는 선교의 자유가 포함되고, 선교의 자유에는 다른 종교를 비판하거나 다른 종교의 신자에 대하여 개종을 권고하는 자유도 포함된다. ㉡ 기독교재단이 설립한 사립대학에서 6학기 동안 대학예배에 참석할 것을 졸업요건으로 하는 학칙은 비록 위 대학예배가 복음 전도나 종교인 양성에 직접적인 목표가 있는 것이 아니고 신앙을 가지지 않을 자유를 침해하지 않는 범위 내에서 학생들 에게 종교교육을 함으로써 진리·사랑에 기초한 보편적 교양인을 양성하는 데 목표를 두고 있다고 하더라도 헌법상 보장된 종교의 자유를 침해하는 것이다. ㉢ 지방자치단체가 유서 깊은 천주교 성당 일대를 문화관광지로 조성하기 위하여 상급단체로부터 문화관광지 조성계획을 승인받은 후 사업부지 내 토지 등을 수용재결한 것은 헌법의 정교분리원칙에 위배되지 않는다. ㉣ 종교시설의 건축행위에만 기반시설부담금을 면제한다면 국가가 종교를 지원하여 종교를 승인하거나 우대하는 것으로 비칠 소지가 있어 헌법 제20조 제2항의 국교금지 정교분리에 위배 될 수도 있다. ㉤ 종교단체의 복지시설 운영에 대한 제한은 종교단체 내 복지 시설을 운영하는 법인의 인격권 및 법인운영의 자유를 제한 하는 것이므로 종교의 자유 침해가 아닌 법인운영의 자유를 침해하는지 여부에 대한 문제로 귀결된다.","㉠㉡㉤","㉠㉢㉣","㉡㉣㉤","㉢㉣㉤",1,0,""],["2022-2","헌법",13,"알권리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국가 또는 지방자치단체의 기관이 보관하고 있는 문서 등에 관하여 이해관계 있는 국민이 공개를 요구함에도 정당한 이유 없이 이에 응하지 아니하거나 거부하는 것은 당해 국민의 알 권리를 침해하는 것이다.","군사기밀의 범위는 국민의 표현의 자유 내지 알권리의 대상영역을 최대한 넓혀줄 수 있도록 필요한 최소한도에 한정되어야 할 것인바, 구 군사기밀보호법 제6조 등은 ‘군사상의 기밀’이 비공지의 사실로서 적법절차에 따라 군사기밀로서의 표지를 갖추고 그 누설이 국가의 안전보장에 명백한 위험을 초래한다고 볼만큼의 실질가치를 지닌 것으로 인정되는 경우에 한하여 적용 된다 할 것이므로 이러한 해석하에 헌법에 위반되지 아니한다.","공판조서의 절대적 증명력을 규정한 형사소송법 조항은 공판 조서의 증명력을 규정하고 있을 뿐 공판조서의 내용에 대한 접근 수집 처리 등에 관한 규정이 아니어서, 정보에의 접근 수집 처리의 자유를 의미하는 알권리에 어떠한 제한이 있다고 보기 어렵다.","개별 교원이 어떤 교원단체나 노동조합에 가입해 있는지에 대한 정보 공개를 제한하는 것은 학부모인 청구인들의 알권리를 제한 하는 것은 아니다.",3,0,""],["2022-2","헌법",14,"집회의 자유에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","집회의 자유는 집권세력에 대한 정치적 반대의사를 공동으로 표명하는 효과적인 수단으로서 현대사회에서 언론매체에 접근 할 수 없는 소수집단에게 그들의 권익과 주장을 옹호하기 위한 적절한 수단을 제공한다.","대한민국을 방문하는 외국의 국가 원수를 경호하기 위하여 지정된 경호구역 안에서 서울종로경찰서장이 안전 활동의 일환으로 청구인들의 삼보일배행진을 제지한 행위는 집회의 자유를 침해한다.","집회 장소의 선택은 집회의 성과를 결정하는 주요 요인이 되므로, 집회 장소를 선택할 자유는 집회의 자유의 실질적 부분을 형성 한다고 볼 수 있다.","옥외집회 시위에 대한 경찰의 촬영행위는 증거보전의 필요성 및 긴급성, 방법의 상당성이 인정되는 때에는 헌법에 위반된다고 할 수 없으나, 경찰이 옥외집회 및 시위 현장을 촬영하여 수집한 자료의 보관 사용 등은 엄격하게 제한하여, 옥외집회 시위 참가자 등의 기본권 제한을 최소화해야 한다.",1,0,""],["2022-2","헌법",15,"예술의 자유에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구 음반에관한법률 제3조 제1항이 비디오물을 포함하는 음반 제작자에 대하여 일정한 시설을 갖추어 문화공보부에 등록할 것을 명하는 것은 예술의 자유를 침해하는 것이다.","극장은 영상물 공연물 등 의사표현의 매개체를 일반 공중에게 표현하는 장소로서의 의미가 있으므로 극장의 자유로운 운영에 대한 제한은 공연물, 영상물이 지니는 표현물, 예술작품으로서의 성격에 기하여 표현의 자유 및 예술의 자유의 제한효과도 가지고 있다.","자신의 미적 감상 등을 문신시술을 통하여 시각적으로 표현할 수 있다는 측면에서 문신시술이 예술의 자유 또는 표현의 자유의 영역에 포함될 수 있다.","헌법 제22조 제2항은 저작자 발명가 과학기술자와 예술가의 권리는 법률로써 보호한다고 하여 학문과 예술의 자유를 제도적 으로 뒷받침해 주고 학문과 예술의 자유에 내포된 문화국가실현의 실효성을 높이기 위하여 저작자 등의 권리보호를 국가의 과제로 규정하고 있다.",0,0,""],["2022-2","헌법",16,"국가배상청구권에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","구 국가배상법 제8조가 “국가 또는 지방자치단체의 손해배상 책임에 관하여는 이 법의 규정에 의한 것을 제외하고는 민법의 규정에 의한다.”고 규정하여, 소멸시효에 관하여 별도의 규정을 두지 아니함으로써 국가배상청구권에도 소멸시효에 관한 일반 민법 제766조가 적용되게 된 것은 입법자의 입법재량 범위를 벗어난 것으로 국가배상청구권의 본질적인 내용을 침해한다고 볼 수 있다.","당초 유효한 법률에 근거한 공무원의 직무집행이 사후에 그 근거가 되는 법률에 대한 헌법재판소의 위헌결정으로 위법하게 된 경우, 이에 이르는 과정에 있어 공무원의 고의, 과실을 어느 정도 인정할 수 있고, 그로써 국가의 청구인들에 대한 손해배상책임이 성립한다고 볼 수 있다.","국가배상법 조항이 국가배상청구권의 성립요건으로서 공무원의 고의 또는 과실을 규정한 것은 법률로 이미 형성된 국가배상 청구권의 행사 및 존속을 제한할 뿐만 아니라, 국가배상청구권의 내용을 새롭게 형성하는 것이라고 할 것이므로, 국가배상법 조항이 국가배상청구권의 성립요건으로서 공무원의 고의 또는 과실을 요구함으로써 무과실책임을 인정하지 않은 것은 입법 형성의 범위를 벗어나 헌법 제29조에서 규정한 국가배상청구권을 침해한다.","특수임무수행자는 보상금등 산정과정에서 국가 행위의 불법성이나 구체적인 손해 항목 등을 주장 입증할 필요가 없고 특수임무 수행자의 과실이 반영되지도 않으며, 국가배상청구에 상당한 시간과 비용이 소요되는 데 반해 보상금등 지급결정은 비교적 간이 신속한 점까지 고려하면, 특수임무수행자 보상에 관한 법률 이 정한 보상금을 지급받는 것이 국가배상을 받는 것에 비해 일률적으로 과소 보상된다고 할 수 없으므로 국가배상청구권 또는 재판청구권을 침해한다고 보기 어렵다.",3,0,""],["2022-2","헌법",17,"인간다운 생활을 할 권리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","인간다운 생활을 할 권리는 자연인의 권리이므로 법인에게는 인정되지 않고, 또한 국민의 권리이므로 원칙적으로 외국인에게는 인정되지 아니한다.","인간다운 생활을 할 권리에 관한 헌법상 규정은 모든 국가기관을 기속하지만, 그 기속의 의미는 적극적 형성적 활동을 하는 입법부 또는 행정부의 경우와 헌법재판에 의한 사법적 통제기능을 하는 헌법재판소에 있어서 동일하지 아니하다.","주거환경개선사업 및 주택재개발사업의 시행으로 철거되는 주택의 소유자에 대해서는 임시수용시설의 설치 등을 사업시행자의 의무로 규정한 반면, 도시환경정비사업의 경우에는 이와 같은 규정을 두지 아니한 것은 청구인의 인간다운 생활을 할 권리를 제한한다.","국가가 인간다운 생활을 보장하기 위한 헌법적 의무를 다하였는 지의 여부가 사법적 심사의 대상이 된 경우에는, 국가가 최저 생활보장에 관한 입법을 전혀 하지 아니하였다든지, 그 내용이 현저히 불합리하여 헌법상 용인될 수 있는 재량의 범위를 명백히 일탈한 경우에 한하여 헌법에 위반된다고 보아야 한다.",2,0,""],["2022-2","헌법",18,"근로의 권리에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법 제32조 및 제33조에 각 규정된 근로기본권은 근로자의 근로조건을 개선함으로써 그들의 경제적 사회적 지위의 향상을 기하기 위한 것으로서 자유권적 기본권으로서의 성격보다는 생존권 내지 사회적 기본권으로서의 측면이 보다 강한 것으로서 그 권리의 실질적 보장을 위해서는 국가의 적극적인 개입과 뒷받침이 요구되는 기본권이다.","근로의 권리는 사회적 기본권으로서 국가에 대하여 직접 일자리를 청구하거나 일자리에 갈음하는 생계비의 지급을 청구할 수 있는 권리를 의미하는 것이 아니라 고용증진을 위한 사회적 경제적 정책을 요구할 수 있는 권리에 그치며, 근로의 권리로부터 국가에 대한 직접적인 직장존속청구권이 도출되는 것도 아니다.","매월 1회 이상 정기적으로 지급하는 상여금 등 및 복리후생비의 일부를 새롭게 최저임금에 산입하도록 한 최저임금법 상 산입 조항은 헌법상 용인될 수 있는 입법재량의 범위를 명백히 일탈 하였다고 볼 수 없으므로 근로자들의 근로의 권리를 침해하지 아니한다.","퇴직급여제도가 갖는 사회보장적 급여의 성격과 근로자의 장기간 복무 및 충실한 근무를 유도하는 기능을 감안하더라도, 소정근로시간이 1주간 15시간 미만인 이른바 ‘초단시간근로자’에 대해 퇴직급여제도 적용대상에서 제외하는 것은 “근로조건의 기준은 인간의 존엄성을 보장하도록 법률로 정하도록 규정”한 헌법 제32조 제3항에 위배된다.",3,0,""],["2022-2","헌법",19,"보건권에 관한 설명 중 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 우리 헌법은 1948년 제헌헌법에서 “가족의 건강은 국가의 특별한 보호를 받는다.”라고 규정한 이래 1962년 제3공화국 헌법에서 “모든 국민은 보건에 관하여 국가의 보호를 받는다.” 라고 정하여 현행 헌법까지 이어져 오고 있다. ㉡ 치료감호 청구권자를 검사로 한정하고, 피고인의 치료감호 청구권을 따로 인정하지 않은 구 치료감호법 조항은 국민의 보건에 관한 권리를 침해하는 것이다. ㉢ 국가의 국민보건에 관한 보호의무를 명시한 헌법 제36조 제3항에 의한 권리를 헌법소원을 통하여 주장할 수 있는 자는 직접 자신의 보건이나 의료문제가 국가에 의해 보호 받지 못하고 있는 의료 수혜자적 지위에 있는 국민이라고 할 것이므로, 의료시술자적 지위에 있는 안과의사가 자기 고유의 업무범위를 주장하여 다투는 경우에는 위 헌법규정을 원용할 수 없다. ㉣ 무면허 의료행위를 일률적, 전면적으로 금지하고 이를 위반한 경우 그 치료결과에 관계없이 형사처벌을 받게 하는 의료법 조항은 헌법 제10조가 규정하는 인간으로서의 존엄과 가치를 보장하고 헌법 제36조 제3항이 규정하는 국민보건에 관한 국가의 보호의무를 다하고자 하는 것으로서, 국민의 생명권, 건강권, 보건권 및 그 신체활동의 자유 등을 보장하는 규정이지, 이를 제한하는 규정이라고 할 수 없다.","1개","2개","3개","4개",0,0,""],["2022-2","헌법",20,"국민의 기본적 의무에 관한 설명 중 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 납세의 의무, 국방의 의무, 근로의 의무는 제헌헌법에서부터 규정되었고, 교육을 받게 할 의무는 1962년 제3공화국 헌법에 서 처음 규정되었다. ㉡ 국방의 의무는 직접적인 병력형성의 의무뿐만 아니라 향토 예비군설치법 , 민방위기본법 등에 의한 간접적인 병력형성 의무 및 병력형성 이후 군작전 명령에 복종하고 협력하여야 할 의무를 포함하는 것이다. ㉢ 향토예비군설치법 에 따라 예비군훈련소집에 응하여 훈련을 받는 것은 국민의 의무를 다하는 것일 뿐만 아니라 국가나 공익목적을위하여특별한희생을하는것이므로보상하여야한다. ㉣ 조세는 국가 또는 지방자치단체가 재정수요를 충족시키거나 경제적 사회적 특수정책의 실현을 위하여 국민 또는 주민에 대하여 아무런 특별한 반대급부 없이 강제적으로 부과징수하는 과징금을 의미한다.","㉠㉡㉢","㉠㉡㉣","㉠㉢㉣","㉡㉢㉣",1,0,""],["2022-2","형사법",1,"유추해석(적용) 금지의 원칙에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","위법성조각사유처럼 피고인에게 유리한 규정의 범위를 제한적 으로 유추적용하게 되면 행위자의 가벌성의 범위가 확대되므로 이는 가능한 문언의 의미를 넘어 범죄구성요건을 유추적용하는 것과 같은 결과가 초래되어 허용될 수 없다.","형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하는 경우, 그 행정법규를 해석함에 있어서는 유추해석 금지의 원칙이 적용되지 아니한다.","유추해석은 피고인에게 유리한 경우에는 가능한 것이나, 문리를 넘어서는 이러한 해석은 그렇게 해석하지 아니하면 그 결과가 현저히 형평과 정의에 반하거나 심각한 불합리가 초래되는 경우에 한하여 가능하다.","공직선거법 제262조의 ‘자수’를 통상 관용적으로 사용되는 용례에서 갖는 개념 외에 ‘범행 발각 전’이라는 또 다른 개념을 추가하는 것은 형 면제 사유에 대한 제한적 유추를 통해 처벌범위를 실정법 이상으로 확대하게 되어 유추해석 금지의 원칙에 반한다.",1,0,""],["2022-2","형사법",2,"법인의 형사책임에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","법인격 없는 사단과 같은 단체는 법인과 마찬가지로 사법상의 권리의무의 주체가 될 수 있음은 별론으로 하더라도 법률에 명문의 규정이 없는 한 그 범죄능력은 없다.","양벌규정에 의해 법인이 처벌되는 경우, 공모한 수인의 사용인 가운데 A, B법인의 사용인은 직접 실행행위에 가담하지 않고 C법인의 사용인만 실행행위를 분담한 경우에도 A, B법인은 C법인과 공동정범이 될 수 있다.","양벌규정에 따라 사용자인 법인 또는 개인을 처벌하기 위해서는 형벌의 자기책임 원칙에 비추어 위반행위가 발생한 그 업무와 관련하여 사용자인 법인 또는 개인이 상당한 주의 또는 감독 의무를 게을리한 과실이 있어야 한다.","판례는 양벌규정의 적용대상자를 업무주가 아니면서 당해 업무를 실제 집행하는 자에게까지 확장하고 있어, 법인격 없는 공공 기관도 개인정보보호법 상 양벌규정에 의해 처벌될 수 있고, 해당 업무를 실제로 담당하는 소속 공무원도 양벌규정에 의해 처벌받을 수 있다.",3,0,""],["2022-2","형사법",3,"범죄의 주관적 요소에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","고의의 본질에 관한 용인설(인용설)에 따르면 구성요건적 결과를 용인하는 의사만으로도 고의가 인정되어 미필적 고의는 고의에 포함되나, 인식 있는 과실은 고의에 포함되지 않는다.","회사의 노동조합 홍보이사가 노조 사무실에서 ‘새벽 6호’라는 책자를 집에 가져와 보관하고 있다가 국가보안법 제7조 제5항의 이적표현물소지죄로 체포된 경우, 그 홍보이사에게 목적범인 이적표현물소지죄가 성립하기 위해서는 이적행위를 하려는 목적의 확정적 인식이 있어야 한다.","살인예비죄가 성립하기 위해서는 살인죄를 범할 목적 외에도 살인준비에 관한 고의가 있어야 한다.","피고인이 범죄구성요건의 주관적 요소인 고의를 부인하는 경우, 그 범의 자체를 객관적으로 증명할 수 없으므로 사물의 성질상 범의와 상당한 관련성 있는 간접사실 또는 정황사실을 증명하는 방법으로 이를 입증할 수 밖에 없다. 사 법】(공 통)",1,0,""],["2022-2","형사법",4,"범죄의 본질에 관한 甲과 乙의 이론에 대한 설명 중 옳은 것은 모두 몇 개인가? 甲: 형법적 평가의 중심은 외부적인 행위와 현실적으로 발생한 결과에 두고 책임과 형벌을 결정해야 한다. 乙: 그렇지 않다. 외부적 행위와 현실적으로 발생한 결과가 아니라, 이를 발생시킨 행위자의 반사회적 성격에 두고 책임과 형벌을 결정해야 한다. ㉠ 甲은 미수범의 처벌근거를 구성요건적 결과 실현에 근접한 위험에 있다고 주장하고, 乙은 행위자의 법적대적(法敵對的) 의사에 있다고 주장한다. ㉡ 甲은 공동정범의 본질을 행위 속에 표현된 의식적인 공동 작용이라고 주장하고, 乙은 공동정범이 각자 최소한 하나의 객관적 구성요건 실현에 스스로 참여한 것이라고 주장한다. ㉢ 甲은 책임의 근거를 행위자의 반사회적 성격에 기인해 행위자가 사회방위처분을 받아야 하는 지위가 책임이라 주장하고, 乙은 행위자가 적법행위를 할 수 있었음에도 불구하고 위법행위를 했기 때문에 가해지는 도의적 비난이라 주장한다. ㉣ 甲은 공범의 종속성에 대해 타인으로 하여금 죄를 범하게 하려는 의사 자체가 외부로 표명되는 이상 정범의 실행행위와 상관없이 독자적으로 가벌성이 인정된다고 주장하고, 乙은 정범의 실행행위가 있어야 그 정범의 실행행위에 종속해서만 공범이 성립할 수 있다고 주장한다.","1개","2개","3개","4개",0,0,""],["2022-2","형사법",5,"피해자의 승낙에 관한 다음 설명 중 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 형법 제24조에 따라 위법성이 조각되는 피해자의 승낙은 개인적 법익을 훼손하는 경우에 법률상 이를 처분할 수 있는 사람의 승낙을 말할 뿐만 아니라 그 승낙이 윤리적, 도덕적 으로 사회상규에 반하는 것이 아니어야 한다. ㉡ 문서명의인이 문서의 작성일자 전에 이미 사망했어도 문서 명의인이 생존하고 있다는 점이 문서의 중요한 내용을 이루거나 그 점을 전제로 문서가 작성되어 공공의 신용을 해할 위험이 있는 경우에는 사문서위조죄가 성립하나, 그 문서에 관하여 사망한 명의자의 승낙이 추정되는 경우에는 피해자의 승낙에 따라 위법성이 조각된다. ㉢ 형법 제24조 피해자의 승낙은 정당방위, 긴급피난, 자구 행위와 같이 ‘상당한 이유’라는 명문의 규정을 두고 있다. ㉣ 의사의 불충분한 설명을 근거로 환자가 수술에 동의하였다면 피해자의 승낙으로 수술의 위법성은 조각되지 않는다.","㉠(X) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(X) ㉣(X)","㉠(O) ㉡(X) ㉢(X) ㉣(O)",3,0,""],["2022-2","형사법",6,"기대가능성에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","기대가능성의 판단기준을 국가에 두면 국가는 국민의 적법행위를 기대하므로 기대가능성이 없다는 이유로 책임이 조각되는 경우가 축소될 수 있다.","甲이 담배제조업 허가 없이 전자장치를 이용해 흡입할 수 있는 니코틴이 포함된 용액을 제조한 경우, 궐련담배제조업의 허가 기준은 존재하나 전자담배제조업에 관한 허가기준이 없는 이상 甲에게 담배제조업 관련 법령의 허가기준을 준수하거나 허가 기준이 새롭게 마련될 때까지 법 준수를 요구하는 것을 기대 할 수 없다.","형법 제12조의 ‘저항할 수 없는 폭력’은 심리적 의미에 있어서 육체적으로 어떤 행위를 절대적으로 할 수 밖에 없게 하는 경우와 윤리적 의미에서 강압된 경우를 의미한다.","영업정지처분에 대한 집행정지 신청이 잠정적으로 받아들여졌다는 사정만으로는 구 음반 비디오물 및 게임물에 관한 법률 위반으로 기소된 피고인에게 적법행위의 기대가능성이 없다고 볼 수 없다.",1,0,""],["2022-2","형사법",7,"간접정범에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","국헌문란의 목적을 달성하기 위해 그러한 목적이 없는 대통령을 이용하여 비상계엄 전국확대조치를 한 것은 간접정범의 방법 으로 내란죄를 실행한 것이다.","처벌되지 아니하는 타인의 행위를 적극적으로 유발하고 이를 이용하여 자신의 범죄를 실현한 자는 간접정범의 죄책을 지게 되고, 그 과정에서 타인의 의사를 부당하게 억압하여야만 간접 정범에 해당하는 것은 아니다.","자기의 지휘 감독을 받는 자를 교사하여 범죄를 실행하게 한 때에는 정범에 정한 형의 장기 또는 다액의 2분의 1까지 가중한다.","간접정범의 실행의 착수시기를 이용자의 이용행위시로 보는 경우, 이용자의 이용의사가 외부로 표현되기만 하면 실행의 착수가 인정되어 미수범의 처벌 범위가 축소될 수 있다.",3,0,""],["2022-2","형사법",8,"공동정범에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 A투자금융회사에 입사하여 다른 공범들과 특정 회사 주식을 허위매수 주문 등의 방법으로 시세조종 주문을 내기로 공모하고 시세조종 행위의 일부를 실행한 후 A회사로부터 해고를 당하여 공범관계에서 이탈한 경우, 甲이 다른 공범들의 범죄실행을 저지하지 않은 이상 그 이후 공범들이 행한 나머지 시세조종 행위에 대해서도 공동정범이 성립한다.","예인선 정기용선자의 현장소장 甲은 사고의 위험성이 높은 시점에 출항을 강행할 것을 지시하였고, 예인선 선장 乙은 甲의 지시에 따라 사고의 위험성이 높은 시점에 출항하는 등 무리 하게 예인선을 운항한 결과 예인되던 선박에 적재된 물건이 해상에 추락하여 선박교통을 방해한 경우, 甲과 乙은 업무상 과실일반교통방해죄의 공동정범이 성립한다.","甲 乙 丙주식회사가 A주식회사의 주식 총수의 5/100 이상을 보유하여 자본시장과 금융투자업에 관한 법률 상 주식 등 변경 보고의무를 공동으로 부담하게 되었고, 동법은 이러한 보고 의무를 이행하지 않는 자를 처벌하는 진정부작위범인 주식 등 변경 보고의무 위반죄를 규정하고 있음에도 불구하고 甲과 乙 주식회사만이 공모하여 보고의무를 이행하지 않은 경우, 보고 의무가 있는 甲주식회사, 乙주식회사, 丙주식회사에게 주식 등 변경 보고의무 위반죄의 공동정범이 성립한다.","강도를 모의한 甲, 乙, 丙이 A에게 칼을 들이댄 후 전화선으로 A의 손발을 묶고 폭행하여 반항을 억압한 후 甲이 다른 방에서 물건을 찾는 사이 乙과 丙이 공동으로 A를 강간하고 다같이 도주한 경우, 甲에게는 강도강간죄의 공동정범이 성립하지 않는다.",2,0,""],["2022-2","형사법",9,"부작위범에 관한 설명 중 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 압류된 골프장 시설을 보관하는 회사의 대표이사 甲이 그 압류시설의 사용 및 봉인의 훼손을 방지할 수 있는 적절한 조치 없이 골프장 개장 및 압류시설 작동을 의도적으로 묵인 또는 방치하여 봉인이 훼손되게 한 경우, 甲에게는 부작위에 의한 공무상표시무효죄가 성립한다. ㉡ 국가연구개발사업의 연구책임자 甲이 처음부터 소속 학생 연구원들에게 학생연구비를 개별 지급할 의사 없이 공동관리 계좌를 관리하면서 사실상 그 처분권을 가질 의도 하에 이를 숨기고 산학협력단에 연구비를 신청하여 지급받은 경우, 甲의 행위는 산학협력단에 대한 관계에 있어서 기망에 의한 편취행위에 해당한다. ㉢ 위치추적 전자장치의 피부착자 甲이 그 장치의 구성 부분인 휴대용 추적장치를 분실한 후 3일이 경과하도록 보호관찰소에 분실신고를 하지 않고 돌아다닌 경우, 분실을 넘어서서 상당한 기간 동안 휴대용 추적장치가 없는 상태를 방치한 부작위는 전자장치 부착 등에 관한 법률 제38조에 따른 전자장치의 효용을 해한 행위에 해당하지 아니한다. ㉣ 甲은 법무사가 아님에도 자신이 법무사로 소개되거나 호칭 되는 상황에서 자신이 법무사가 아니라는 사실을 밝히지 않은 채 법무사 행세를 계속하면서 근저당권설정계약서를 작성해 준 경우, 甲에게는 부작위에 의한 법무사법 위반(법무사가 아닌 자에 대한 금지)죄가 성립한다. ㉤ 대출자금으로 빌딩을 경락받았으나 분양이 저조하여 자금 조달에 실패한 甲과 乙은 수분양자들과 사이에 대출금으로 충당되는 중도금을 제외한 계약금과 잔금의 지급을 유예하고 1년의 위탁기간 후 재매입하기로 하는 등의 비정상적인 이면 약정을 체결하고 점포를 분양하였음에도, 금융기관에 대해서는 그러한 이면약정의 내용을 감춘 채 분양 중도금의 집단적 대출을 교섭하여 중도금 대출 명목으로 금원을 지급받은 경우, 甲과 乙의 행위는 사기죄의 요건으로서의 부작위에 의한 기망에 해당하지 아니한다.","1개","2개","3개","4개",1,0,""],["2022-2","형사법",10,"(가)와 (나) 사례에 관한 죄수의 기초이론에 따른 설명 중 가장 적절하지 않은 것은? (가) 공무원 甲은 직무와 관련하여 乙로부터 매월 1일 100만 원씩 10회에 걸쳐 뇌물을 수수하였다. (나) 甲이 A를 살해하기 위하여 A의 음료수에 치사량의 독약을 한 번 넣고 가버린 후 그 음료수를 나누어 마신 A와 그의 비서가 사망하였다.","자연적 행위표준설에 따르면 (가)는 수죄, (나)는 일죄가 된다.","법익표준설에 따르면 (나)는 전속적 법익인 생명을 침해한 것으로 법익주체마다 1개의 죄가 성립한다.","(가)에서 구성요건표준설로는 甲의 10회에 걸친 뇌물수수 행위가 일죄인지, 수죄인지 명확하게 결정할 수 없다는 비판이 있다.","의사표준설에 따르면 (가)의 경우 甲이 10회의 뇌물수수 과정 에서 단일한 범의를 가졌는지를 불문하고 일죄가 된다.",3,0,""],["2022-2","형사법",11,"죄수에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","주거침입강간죄는 사람의 주거 등을 침입한 자가 피해자를 강간한 경우에 성립하는 것으로서 주거침입죄를 범한 후에 사람을 강간하여야 하는 일종의 신분범이고, 선후가 바뀌어 강간죄를 범한 자가 그 피해자의 주거에 침입한 경우에는 강간죄와 주거침입죄의 실체적 경합범이 된다.","피해견인 로트와일러가 묶여 있던 자신의 진돗개를 공격하자, 진돗개 주인이 피해견을 쫓아버리기 위해 엔진톱으로 위협하다가 피해견의 등 쪽을 절단하여 죽게 한 행위는 구 동물보호법 위반죄 (잔인한 방법으로 죽이는 행위)와 재물손괴죄가 성립하고, 양자는 상상적 경합의 관계에 있다.","공직선거법 제18조 제3항( 형법 제38조에도 불구하고 제1항 제3호에 규정된 죄와 다른 죄의 경합범에 대하여는 이를 분리 선고하여야 한다)은 선거범이 아닌 다른 죄가 선거범의 양형에 영향을 미치는 것을 최소화하기 위하여 형법 상 경합범 처벌례에 관한 조항의 적용을 배제하고 분리하여 형을 따로 선고하여야 한다는 취지이기에, 선거범과 상상적 경합 관계에 있는 모든 죄는 통틀어 선거범으로 취급하여서는 아니된다.","수 개의 등록상표에 대하여 상표법 제230조의 상표권 침해행위가 계속하여 이루어진 경우에는 등록상표마다 포괄하여 1개의 범죄가 성립하나, 하나의 유사상표 사용행위로 수 개의 등록상표를 동시에 침해하였다면 각각의 상표법 위반죄는 상상적 경합의 관계에 있다.",2,0,""],["2022-2","형사법",12,"다음 사례 중 甲에게 업무상 과실이 인정되는 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 지하철 공사구간 현장안전업무 담당자 甲은 공사현장에 인접한 기존의 횡단보도 표시선 안쪽으로 돌출된 강철빔 주위에 라바콘 3개를 설치하고 신호수 1명을 배치하였는데, A가 그 횡단보도를 건너면서 강철빔에 부딪혀 상해를 입은 경우 ㉡ 병원 인턴 甲은 응급실로 이송되어 온 익수환자 A를 담당 의사 乙의 지시(이송 도중 A에 대한 앰부 배깅과 진정제 투여 업무만을 지시)에 따라 구급차에 태워 다른 병원으로 이송하던 중 산소통의 산소잔량을 체크하지 않아 산소 공급이 중단되어 A가 폐부종 등으로 사망한 경우 ㉢ 골프장의 경기보조원 甲은 골프 카트에 A를 태우면서 출발에 앞서 안전 손잡이를 잡도록 고지하지 않고, 이를 잡았는지 확인하지도 않은 채 출발 후 각도 70°가 넘는 우로 굽은 길에서 속도를 줄이지 않고 급하게 우회전하여 A가 골프 카트에서 떨어져 상해를 입은 경우 ㉣ 담당 의사가 췌장 종양 제거수술 직후의 환자 A에 대하여 1시간 간격으로 4회 활력징후를 측정하라고 지시하였는데, 일반병실에 근무하는 간호사 甲이 중환자실이 아닌 일반병실 에서는 그러할 필요가 없다고 생각하여 2회만 측정한 채 3회차 이후 이를 측정하지 않았고, 甲과 근무를 교대한 간호사 乙 역시 자신의 근무시간 내 4회차 측정시각까지 이를 측정 하지 아니하여, A는 그 시각으로부터 약 10분 후 심폐정지 상태에 빠졌다가 이후 약 3시간이 지나 과다출혈로 사망한 경우 ㉤ 건축자재인 철판 수백 장의 운반을 의뢰한 생산자 甲이 절단면이 날카롭고 무거운 철판을 묶기에 매우 부적합한 폴리에스터 끈을 사용하여 철판 묶음 작업을 한 탓에 철판 쏠림 현상이 발생하였고, 이로 인하여 철판을 차에서 내리는 과정에서 철판이 쏟아져 내려 화물차 운전자 A가 사망한 경우","1개","2개","3개","4개",2,0,""],["2022-2","형사법",13,"형벌에 관한 설명 중 가장 적절하지 않은 것은?","징역 10년 형을 선고받은 甲은 그 형의 집행이 종료하거나 면제될 때까지 다른 법률에 특별한 규정이 있는 경우를 제외 하고는 공무원이 되는 자격, 공법상의 선거권과 피선거권, 법률로 요건을 정한 공법상의 업무에 관한 자격이 정지된다.","甲에게 징역 12년 형이 확정된 후 그 집행을 받지 아니하고 15년이 경과했다면, 그 기간 내에 형의 집행을 면할 목적으로 국외에 3년 동안 나가 있던 것이 확인된 경우라도 형의 시효는 완성된다.","법원이 중상해죄(1년 이상 10년 이하의 징역)로 유죄가 인정된 甲에게 형의 가중감경사유 중 형법 제10조 제2항(심신미약)과 제35조(누범)만을 적용하여 형을 선고할 경우, 甲에게 선고할 수 있는 형의 최하한은 징역 6월이다.","법원이 피고인 甲에게 30억 원의 벌금을 선고하는 경우, 이를 납입하지 아니하는 것을 대비하여 500일 이상의 노역장 유치 기간을 정하여 동시에 선고하여야 한다.",1,0,""],["2022-2","형사법",14,"학대의 죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","아동학대범죄의 처벌 등에 관한 특례법 (2014. 1. 28. 제정, 2014. 9. 29. 시행)은 제34조 제1항(공소시효의 정지와 효력)의 소급적용에 관하여 명시적인 경과규정을 두고 있지 않지만, 동법 시행일 당시 범죄행위가 종료되었으나 아직 공소시효가 완성되지 않은 아동학대범죄에 대해서도 적용된다.","아동복지법 제71조 제1항에 따라 처벌되는 동법 제17조 제2호 금지행위(아동에게 음란한 행위를 시키거나 이를 매개하는 행위 또는 아동에게 성적 수치심을 주는 성희롱 등의 성적 학대행위)의 처벌대상은 아동의 복지를 보장하는 동법의 취지에 비추어 성인에게만 한정된다.","친아버지가 자신의 아들(만 1세)을 양육하면서 집안 내부에 먹다 남은 음식물 쓰레기, 소주병, 담배꽁초가 방치된 상태로 청소를 하지 않아 악취가 나는 비위생적인 환경에서 제대로 세탁하지 않아 음식물이 묻어있는 옷을 입히고, 목욕을 주기적 으로 시키지 않아 몸에서 악취를 풍기게 하는 등의 행위를 한 경우, 생존에 필요한 최소한의 보호를 하였거나 아들에게 애정을 표현했다는사정이있더라도이는아들에대한방임행위에해당한다.","어린이집 보육교사가 아동(만 4세)이 창틀에 매달리는 등 위험한 행동을 한다는 이유로 그를 안아 바닥에서 약 78cm 높이의 교구장(110cm×29cm×63cm) 위에 올려둔 후 교구장을 1회 흔 들고, 아동의 몸을 잡고는 교구장 뒤 창 쪽으로 흔들어 보이는 등 약 40분 동안 앉혀둔 경우, 이는 비록 안전을 위한 조치라 할지라도 아동에 대한 학대행위에 해당한다.",1,0,""],["2022-2","형사법",15,"다음 사례 중 甲에게 모욕죄(또는 상관모욕죄)가 성립하는 것은? (다툼이 있는 경우 판례에 의함)","甲이 소속 노동조합 위원장 A를 ‘어용’, ‘앞잡이’ 등으로 지칭 하여 표현한 현수막, 피켓 등을 장기간 반복하여 일반인의 왕래가 잦은 도로변 등에 게시한 경우","부사관 교육생 甲이 동기들과 함께 사용하는 단체채팅방에서 지도관 A가 목욕탕 청소 담당에게 과실 지적을 많이 한다는 이유로“도라이ㅋㅋㅋ습기가그렇게많은데”라는글을게시한경우","A주식회사 해고자 신분으로 노동조합 사무장직을 맡아 노조 활동을 하는 甲이 노사 관계자 140여 명이 있는 가운데 큰 소리로 자신보다 15세 연장자인 A회사 부사장 B를 향해 “야 ○○아, ○○이 여기 있네, 니 이름이 ○○이잖아, ○○아 나오니까 좋지?” 등으로 여러 차례 B의 이름을 부른 경우","甲이 인터넷 포털 사이트의 ‘A추진운동본부’에 접속하여 ‘자칭 타칭 B 하면 떠오르는 키워드!!!’라는 제목의 게시글에 ‘공황 장애 ㅋ’라는 댓글을 게시한 경우",0,0,""],["2022-2","형사법",16,"업무와 경매에 관한 죄의 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 서울특별시 도시철도공사가 발주한 시각장애인용 음성유도기 제작설치 입찰에 관한 담합에 가담하기로 하였다가 자신이 낙찰 받기 위하여 당초의 합의에 따르지 아니한 채 원래 낙찰받기로 한 특정업체보다 저가로 입찰한 경우, 비록 입찰의 공정을 해할 우려가 있었으나 실제 입찰의 공정을 해하지 아니하였기에 甲에게는 입찰방해죄가 성립하지 아니한다.","甲이 일부 입찰참가자들과 가격을 합의하고, 낙찰이 되면 특정 업체가 모든 공사를 하기로 합의하는 등 담합하여 투찰행위를 한 경우, 그 투찰에 참여한 업체의 수가 많아서 실제로 가격형성에 부당한 영향을 주지 않았다면 甲에게는 입찰방해죄가 성립하지 아니한다.","한국토지공사 지역본부가 중고자동차매매단지를 분양하기 위하여 유자격 신청자들을 대상으로 무작위 공개추첨하여 1인의 수분 양자를 선정하는 절차를 진행함에 있어, 신청자격이 없는 甲이 총 12인의 신청자 중 9인과 맺은 합작투자의 약정에 따라 그 신청자의 자격과 명의를 빌려 당첨확률을 약 75%까지 인위적으로 높여 분양을 신청한 경우, 분양업무의 적정성과 공정성 등을 방해하는 행위라고 볼 수 있어 甲에게는 입찰방해죄가 성립한다.","甲과 乙이 공모하여, 甲은 A고등학교의 학생 丙이 약 10개월 동안 총 84시간의 봉사활동을 한 것처럼 허위로 기재된 봉사 활동확인서를 발급받아 乙에게 교부하고, 乙은 이를 丙의 담임 교사를 통하여 A학교에 제출하여 丙이 학교장 명의의 봉사상을 수상하게 한 경우, 甲과 乙에게는 업무방해죄가 성립한다.",3,0,""],["2022-2","형사법",17,"다음 사례에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲은 A(만 10세)를 약취한 후 강간을 목적으로 상해 등을 가하고 나아가 강간 및 살해하고자 하였으나 미수에 그친 경우, 甲에게는 약취한 미성년자에 대한 상해 등으로 인한 특정범죄 가중처벌 등에 관한 법률 위반죄와 미성년자에 대한 강간 및 살인미수행위로 인한 성폭력범죄의 처벌 등에 관한 특례법 위반죄가 성립하고, 양자는 상해의 결과가 피해자에 대한 강간 및 살인미수행위 과정에서 발생한 것이기에 상상적 경합의 관계에 있다.","甲이 상대방에게 성적 수치심을 일으키는 그림 등이 담겨 있는 웹페이지에 대한 인터넷 링크를 A에게 보낸 경우, A가 그 링크를 이용하여 별다른 제한 없이 이에 바로 접할 수 있는 상태가 조성되었는지 여부를 묻지 않고 甲에게는 성폭력범죄의 처벌 등에 관한 특례법 위반(통신매체이용음란)죄가 성립한다.","甲이 용변을 보고 있는 사람을 촬영하기 위해 자신의 휴대전화의 카메라 기능을 켜고 A가 있는 화장실 칸 너머로 휴대전화를 든 손을 넘겼으나, A가 놀라 소리를 질러 실제 촬영은 하지 못한 경우, 甲의 행위는 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)죄의 실행에 착수했다고 볼 수 없다.","군인 甲은 자신의 독신자 숙소에서 군인 A와 서로 키스, 구강 성교나 항문성교를 하는 방법으로 추행하고, 군인 乙은 자신의 독신자 숙소에서 동일한 방법으로 甲과 추행한 경우, 이는 독신자 숙소에서 휴일 또는 근무시간 이후에 성인 남성들의 자유로운 의사에 기초한 합의된 행위로 군형법 제92조의6에서 처벌대상 으로 규정한 ‘항문성교나 그 밖의 추행’에 해당하지 아니한다.",3,0,""],["2022-2","형사법",18,"재산죄에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","절도죄, 강도죄, 공갈죄는 탈취죄에 속한다.","영득죄는 범죄성립에 불법영득의사를 필요로 하고, 손괴죄는 이를 필요로 하지 않는다.","강도죄, 사기죄, 공갈죄는 재물죄인 동시에 이득죄이다.","영득죄는 침해방법에 따라 탈취죄와 편취죄로 나눌 수 있다.",0,0,""],["2022-2","형사법",19,"다음 사례 중 甲의 행위가 동일한 범죄구성요건에 해당하는 것으로만 짝지어진 것은? (다툼이 있는 경우 판례에 의함) ㉠ A는 B가 운영하는 피씨방을 이용하고 나오면서 자신의 핸드폰을 두고 왔는데, 그때 B의 피씨방을 이용하고 있던 甲이 A가 두고 간 핸드폰을 발견하고 그것을 가지고 갔다. ㉡ 甲은 A로부터 그의 오토바이를 타고 심부름을 다녀와 달라 는 부탁을 받고 다녀오던 중, 마음이 변하여 A에게 오토바 이를 돌려주지 않고 그대로 타고 가버렸다. ㉢ A는 지하철 선반 위에 올려둔 가방을 깜빡 잊고 그대로 지 하철에서 내렸고, 이를 본 甲은 A가 가방을 두고 내린 것 을 아무도 알아채지 못한 틈을 타 그 가방을 들고 지하철 에서 내렸다. ㉣ 甲은 자신의 토지를 임차하여 대나무를 식재하고 가꾸어 온 A의 대나무를 그의 의사에 반하여 벌채하여 갔다. ㉤ 甲은 A의 토지 위에 권원 없이 식재한 자신의 감나무에 열린 감을 수확해 갔다.","㉠㉡㉣","㉡㉢㉤","㉠㉢㉣","㉠㉣㉤",3,0,""],["2022-2","형사법",20,"횡령의 죄에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","횡령죄의 본질에 관한 학설 중 월권행위설에 따르면 본죄가 성립하기 위하여는 불법영득의사가 있어야 한다.","횡령죄에 있어서 재물의 보관이란 재물에 대한 사실상 또는 법률상 지배력이 있는 상태를 의미하며, 그것은 반드시 사용 대차, 임대차, 위임 등이 계약에 의해 설정될 필요는 없고, 사무 관리, 관습, 조리, 신의칙에 의해서도 성립한다.","소유권의 취득에 등록이 필요한 차량에 대한 횡령죄에서는 타인의 재물을 보관하는 사람의 지위는 등록에 의하여 차량을 제3자에게 법률상 유효하게 처분할 수 있는 권능 유무에 따라 결정된다.","횡령죄는 타인의 재물에 관한 소유권 등 본권을 보호법익으로 하는 범죄이므로 본권 침해의 결과가 발생하였을 때 성립하는 이른바 침해범이다.",1,0,""],["2022-2","형사법",21,"(가)와 (나) 사례에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) (가) 甲은 A주식회사에 본인 소유 토지를 양도하는 내용의 매 매계약을 체결한 후 A주식회사로부터 계약금, 중도금 및 잔금 중 일부를 교부받았으나, 乙에게 이 사건 토지를 매도 하고 소유권이전등기를 경료해 주었다. 그런데 그 이전에 甲은 A주식회사로부터 계약금 중 3/4만 지급받은 상태에서 A주식회사 명의로 가등기를 경료해 주어 甲의 행위에도 불구하고 A주식회사가 甲의 아무런 협력 없이도 가등기의 순위보전 효력에 의해 자신 명의로 소유권이전등기를 마칠 수 있는 수단을 마련해 주었다. (나) 丙은 B에게 본인 소유 임야를 매도하고 일부 잔금까지 지급받았음에도 다시 그 임야를 丁에게 매도하여 계약금을 지급 받은 후, 丁의 명의로 소유권이전청구권 보전을 위한 가등기를 경료해 주었다. ㉠ 甲과 丙은 각각 A주식회사와 B와의 관계에서 타인의 사무를 처리하는 자에 해당한다. ㉡ 甲과 丙의 행위로 인해 A주식회사와 B에게는 현실적인 손해가 발생하였다. ㉢ 丙에게는 배임죄가 성립하지 않는다. ㉣ 甲과 丙에게는 배임죄의 미수가 성립한다.","1개","2개","3개","4개",0,0,""],["2022-2","형사법",22,"다음 사례 중 재물손괴죄가 성립하지 않는 것은? (다툼이 있는 경우 판례에 의함)","타인 소유의 광고용 간판을 백색페인트로 도색하여 광고문안을 지워버린 행위","자동문을 수동으로만 개폐가 가능하게 하여 자동잠금장치로서 역할을 할 수 없도록 한 행위","甲이 A의 차량 앞에는 철근콘크리트 구조물을, 뒤에는 굴삭기 크러셔를 바짝 붙여 놓아 A의 차량을 17∼18시간 동안 운행 할 수 없게 한 행위","A주식회사 직원인 甲과 乙이 유색 페인트와 래커 스프레이를 이용하여 A회사 소유의 도로바닥에 직접 문구를 기재하거나 도로 위에 놓인 현수막 천에 문구를 기재하여 페인트가 바닥으로 배어나와 도로에 배게 한 행위",3,0,""],["2022-2","형사법",23,"문서의 죄에 관한 설명 중 옳지 않은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 컴퓨터의 기억장치 중 하나인 램(RAM, Random Access Memory)은 기억장치 또는 저장매체이기는 하나 임시적인 기억 또는 저장에 활용되는 매체에 불과하여 램에 올려진 전자기록은 형법 제232조의2의 사전자기록위작·변작죄에서 말하는 전자기록에 해당하지 않는다. ㉡ 공문서를 작성하는 과정에서 법령 등을 잘못 적용하거나 적용하여야 할 법령 등을 적용하지 아니한 잘못이 있는 경우에는 허위공문서작성죄가 성립하며, 그 적용의 전제가 된 사실관계에 관하여 거짓된 기재가 없더라도 그 성립을 부정할 수 없다. ㉢ 형법 제228조 제2항의 공정증서원본 부실기재죄에서 말하는 ‘등록증’은 공무원이 작성한 모든 등록증을 말하는 것이 아니라, 일정한 자격이나 요건을 갖춘 자에게 그 자격이나 요건에 상응한 활동을 할 수 있는 권능 등을 인정하기 위하여 공무원이 작성한 증서를 말하는 것으로서 사업자등록증은 단순한 사업 사실의 등록을 증명하는 증서에 불과하여 동법 제228조 제2항의 등록증에 해당하지 않는다. ㉣ 타인의 주민등록증을 습득한 자가 해당 주민등록증을 본인 가족의 것이라고 제시하면서 그 주민등록증 상의 명의 또는 가명으로 이동전화 가입신청을 한 경우, 형법 제230조 공문서 등부정행사죄가 성립한다. ㉤ 형법 제228조 제1항이 규정하는 공정증서원본 부실기재죄나 공전자기록 등 부실기재죄는 공무원에 대하여 진실에 반하는 허위신고를 하여 공정증서원본 또는 이와 동일한 전자기록 등 특수매체기록에 그 증명하는 사항에 관하여 실체관계에 부합하지 아니하는 ‘부실의 사실’을 기재 또는 기록하게 함으로써 성립 하고, 여기서 ‘부실의 사실’이라 함은 권리의무관계에 중요한 의미를 갖는 사항이 객관적인 진실에 반하는 것을 말한다.","1개","2개","3개","4개",2,0,""],["2022-2","형사법",24,"공연음란죄에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 말다툼 후 항의하는 과정에서 바지와 팬티를 내리고 엉덩이를 노출시킨 행위는 사람에게 부끄러운 느낌이나 불쾌감을 주는 정도에 불과하고, 정상적인 성적 수치심을 해할 정도에 해당 하지 않아 공연음란죄가 성립하지 않는다. ㉡ 음란성을 구체적으로 판단함에 있어서는 행위자의 주관적 의도가 아니라 사회 평균인의 입장에서 그 전체적인 내용을 관찰하여 건전한 사회통념에 따라 객관적이고 규범적으로 평가하여야 한다. ㉢ 공연음란죄에서 정하는 ‘음란한 행위’는 일반인의 성욕을 자극하여 성적 흥분을 유발하고 정상적인 성적 수치심을 해하여 성적 도의관념에 반하는 것을 의미하고, 그 행위의 음란성에 대한 의미의 인식뿐만 아니라 성욕의 흥분, 만족 등의 성적인 목적이 있어야 공연음란죄가 성립한다. ㉣ 공연음란죄에서 정하는 ‘음란한 행위’를 특정한 사람을 상대로 한다고 해서 반드시 강제추행죄가 성립하는 것은 아니다.","1개","2개","3개","4개",2,0,""],["2022-2","형사법",25,"도박의 죄에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 영리의 목적으로 속칭 포커나 고스톱 등의 인터넷 도박게임 사이트를 개설하여 운영하는 경우, 게임이용자들이 그 도박게임 사이트에 접속하여 실제로 도박이 행하여진 때에 도박개장죄는 기수에 이른다. ㉡ 사기도박의 경우 도박에서의 우연성이 결여되어 사기죄만 성립하고, 사기도박에 필요한 준비를 갖추고 그러한 의도로 피해자들에게 도박에 참가하도록 권유한 때 또는 늦어도 그 정을 알지 못하는 피해자들이 도박에 참가한 때 실행의 착수가 인정된다. ㉢ 상습도박죄에 있어서의 상습성이란 반복하여 도박행위를 하는 습벽으로서 행위자의 속성을 말하는데, 이러한 습벽의 유무를 판단함에 있어서는 도박의 전과나 도박횟수 등이 중요한 판단자료가 되나, 도박전과가 없다 하더라도 도박의 성질과 방법, 도금의 규모, 도박에 가담하게 된 태양 등의 제반 사정을 참작하여 도박의 습벽이 인정되는 경우에는 상습성을 인정할 수 있다. ㉣ 도박행위가 공갈죄의 수단이 된 경우, 공갈죄와 도박죄는 그 구성요건과 보호법익을 달리하고 있고, 공갈죄의 성립에 일반적·전형적으로 도박행위를 수반하는 것은 아니기에 공갈죄와 별도로 도박죄가 성립한다.","1개","2개","3개","4개",2,0,""],["2022-2","형사법",26,"공무원의 직무에 관한 죄의 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","지방자치단체의 장이 미리 승진후보자명부상 후보자들 중에서 승진대상자를 실질적으로 결정한 다음, 그 내용을 인사위원회 간사, 서기 등을 통해 인사위원회 위원들에게 ‘승진대상자 추천’이 라는 명목으로 제시하여 인사위원회로 하여금 자신이 특정한 후보자들을 승진대상자로 의결하도록 유도하는 행위는 직권 남용권리행사방해죄의 구성요건인‘직권의남용’ 및‘의무없는일을 하게한경우’로볼수있다.","공무원이 직무상 알게 된 비밀을 그 직무와의 관련성 혹은 필요성에 기하여 해당 직무의 집행과 관련 있는 다른 공무원 에게 직무집행의 일환으로 전달한 경우, 국가기능에 위험이 발생하리라고 볼 만한 특별한 사정이 인정되지 않는 한, 그 행위는 비밀의 누설에 해당하지 아니한다.","직무집행의 의사로 자신의 직무를 수행한 경우에는 그 직무집행의 내용이 위법한 것으로 평가된다는 점만으로 직무유기죄의 성립을 인정할 것은 아니고, 공무원이 태만·분망 또는 착각 등으로 인하여 직무를 성실히 수행하지 아니한 경우나 형식적으로 또는 소홀히 직무를 수행한 탓으로 적절한 직무수행에 이르지 못한 것에 불과한 경우에도 직무유기죄는 성립하지 아니한다.","경찰관들이 현행범으로 체포한 도박혐의자들에게 현행범인체포서 대신에 임의동행동의서를 작성하게 하고, 그나마 제대로 조사도 하지 않은 채 석방하였으며, 압수한 일부 도박자금에 관하여 압수조서 및 목록도 작성하지 않은 채 반환하고, 일부 도박혐의자의 명의도용 사실과 도박 관련 범죄로 수회 처벌받은 전력을 확인 하고서도 아무런 추가조사도 없이 석방한 경우, 그 경찰관들에게는 직무유기죄가 성립한다.",0,0,""],["2022-2","형사법",27,"공무방해에 관한 죄에 대한 다음 설명 중 옳고 그름의 표시 (O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 형법 제136조에서 정한 공무집행방해죄는 직무를 집행 하는 공무원에 대하여 폭행 또는 협박한 경우에 성립하는 범죄로서 여기서의 폭행은 사람에 대한 유형력의 행사로 족하고 반드시 그 신체에 대한 것임을 요하지 아니하며, 또한 추상적 위험범으로서 구체적으로 직무집행의 방해 라는 결과발생을 요하지도 아니한다. ㉡ 甲이 노조원들과 함께 경찰관 P 등이 파업투쟁 중인 공장에 진입할 경우에 대비하여 미리 윤활유나 철판조각을 바닥에 뿌려 놓았고, P 등이 이에 미끄러져 넘어지거나 철판조각에 찔려 다친 경우, 설령 甲 등이 그 윤활유나 철판조각을 P 등의 면전에서 그들의 공무 집행을 방해할 의도로 뿌린 것이 아니라 하더라도 甲의 행위는 특수공무집행방해치상죄에 해당한다. ㉢ 야간 당직 근무 중인 청원경찰이 불법주차 단속요구에 응하여 현장을 확인만 하고 주간 근무자에게 전달하여 단속하겠다고 했다는 이유로 민원인이 청원경찰을 폭행한 경우, 야간 당직 근무자는 불법주차 단속권한이 없기 때문에 민원인의 행위는 공무집행방해죄에 해당하지 않는다. ㉣ 집회를 주최하거나 참가하는 것이 형사처벌의 대상이 되는 위법한 집회·시위가 장차 특정지역에서 개최될 것이 예상 되자, 경찰관 P가 이와 시간적·장소적으로 근접하지 않은 다른 지역에서 그 집회·시위에 참가하기 위하여 출발 또는 이동하는 행위를 제지한 경우, 이는 공무집행방해죄의 보호 대상이 되는 공무원의 적법한 직무집행에 해당하지 않는다.","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)",1,0,""],["2022-2","형사법",28,"체포에 관한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정 제31조에 의하면 사법경찰관은 동일한 범죄사실로 다시 체포영장을 신청하는 경우에 그 취지를 체포영장 신청서에 적어야 한다. ㉡ 다액 50만 원 이하의 벌금, 구류 또는 과료에 해당하는 사건의 경우, 피의자가 일정한 주거가 없는 때에 한하여 사법경찰관은 체포영장을 발부받아 피의자를 체포할 수 있다. ㉢ 긴급체포한 피의자를 구속하고자 할 때 구속영장은 피의자를 체포한 때로부터 24시간 이내에 청구되어야 한다. ㉣ 사법경찰관은 피의자가 죄를 범하였다고 의심할 만한 정황이 있고 형사소송법 제200조에 의한 출석요구에 응하지 아니한 때에는 체포영장을 신청하여 피의자를 체포할 수 있다. ㉤ 甲의 마약 투약 제보를 받은 경찰관 P가 자신의 집에 있던 甲을 밖으로 유인하여 불러내려 하였으나, 이를 실패하자 甲의 집 현관문의 잠금장치를 해제하고 강제로 들어가서 수색한 후 甲을 긴급체포한 경우, P가 이미 甲의 신원, 주거지, 전화번호를 모두 알고 있었고, 마약 투약의 증거가 급속히 소멸될 상황이 아니었다고 하더라도 甲이 마약 관련 범죄를 범했다고 의심할 만한 상당한 이유가 있었다면, 이 긴급체포는 위법하지 아니하다.","1개","2개","3개","4개",0,1,"수사준칙 제31조(체포영장 재신청)를 인용한 문항입니다. 2026.10.2. 수사준칙 개정 반영 여부를 확인해야 합니다."],["2022-2","형사법",29,"고소에 관한 다음 설명 중 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 범죄 당시 고소능력이 없던 피해자가 그 후에 비로소 고소 능력이 생겼다면 고소기간은 고소능력이 생긴 때로부터 기산된다. ㉡ 형사소송법 상 고소의 대리는 허용되나, 고소취소의 대리는 허용되지 아니한다. ㉢ 고소인은 범죄사실을 특정하여 신고하면 족하고 범인이 누구인지 나아가 범인 중 처벌을 구하는 자가 누구인지를 적시할 필요는 없다. ㉣ 형사소송법 제232조에 의하면 고소는 제1심판결 선고 전까지 취소할 수 있고, 고소를 취소한 자는 다시 고소할 수 없으며, 고소권자가 서면 또는 구술로써 수사기관 또는 법원에 고소를 취소하는 의사표시를 하였다면 그 고소는 적법하게 취소된 것이고, 그 후 고소취소를 철회하는 의사 표시를 다시 하였다고 하여도 그것은 효력이 없다. ㉤ 피해자의 친족은 피해자의 법정대리인이 피의자이거나 법정 대리인의 친족이 피의자인 때에는 독립하여 고소할 수 있다.","㉠(O) ㉡(X) ㉢(O) ㉣(O) ㉤(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X) ㉤(O)","㉠(X) ㉡(O) ㉢(X) ㉣(O) ㉤(X)","㉠(O) ㉡(O) ㉢(O) ㉣(O) ㉤(O)",0,0,""],["2022-2","형사법",30,"압수 수색에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","검사 또는 사법경찰관이 피의자를 영장에 의하여 체포하는 경우에 필요한 때에는 영장없이 타인의 주거나 타인이 간수하는 가옥, 건조물, 항공기, 선차 안에서의 피의자 수색이 허용된다.","검사 또는 사법경찰관은 피의자를 현행범인으로 체포하는 경우에 필요한 때에는 영장 없이 체포현장에서 압수 수색을 할 수 있다.","수사기관이 범죄 혐의사실과 관련 있는 정보를 선별하여 압수한 후에도 그와 관련이 없는 나머지 정보를 삭제 폐기 반환하지 아니한 채 그대로 보관하고 있다면, 범죄 혐의사실과 관련이 없는 부분에 대하여는 압수의 대상이 되는 전자정보의 범위를 넘어서는 전자정보를 영장없이 압수 수색하여 취득한 것이어서 위법하고, 사후에 압수 수색영장이 발부되었다거나 피고인이나 변호인이 이를 증거로 함에 동의하였다고 하여 그 위법성이 치유된다고 볼 수 없다.","검사는 사본을 확보한 경우 등 압수를 계속할 필요가 없다고 인정되는 압수물 및 증거에 사용할 압수물에 대하여 공소제기 전이라도 소유자, 소지자, 보관자 또는 제출인의 청구가 있는 때에는 환부 또는 가환부하여야 한다.",0,0,""],["2022-2","형사법",31,"함정수사에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","물품반출 업무담당자 A가 물품을 밀반출하는 甲의 행위를 소속회사에 사전에 알리고 그 정확한 증거를 확보하기 위하여 甲의 밀반출행위를 묵인한 경우, 이는 함정수사에 해당하지 아니한다.","이미 마약류관리에 관한 법률 위반죄를 범한 甲을 검거하기 위하여 수사기관이 정보원을 이용하여 그를 검거장소로 유인 하여 검거한 것에 불과한 경우, 이는 위법한 함정수사에 해당 하지 아니한다.","A가 수사기관에 체포된 동거남의 석방을 위한 공적을 쌓기 위하여 B에게 필로폰 밀수입에 관한 정보제공을 부탁하면서 대가의 지급을 약속하고, 이에 B가 C에게, C가 甲에게 순차적으로 필로폰 밀수입을 권유하여, 이를 승낙하고 필로폰을 받으러 나온 甲이 체포된 경우, B와 C가 각자의 사적인 동기에 기하여 수사기관과 직접적인 관련이 없이 독자적으로 甲을 유인한 것 으로서 위법한 함정수사에 해당하지 아니한다.","함정수사가 위법하다고 평가받는 경우, 공소기각설은 수사기관이 제공한 범죄의 동기나 기회를 일반인이 뿌리칠 수 없었다는 범죄인개인의특수한상황으로인하여가벌적 위법성이 결여된다는 점을 논거로 하여 공소기각의 판결을 선고하여야 한다고 본다.",3,0,""],["2022-2","형사법",32,"구속에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","검사와 사법경찰관의 상호협력과 일반적 수사준칙에 관한 규정 제35조에 의하면 검사 또는 사법경찰관은 구속영장의 유효기간 내에 영장의 집행에 착수하지 못한 경우, 반환사유 등을 적은 영장반환서에 해당 영장을 첨부하여 즉시 법원에 반환하여야 하고, 구속영장이 여러 통 발부된 경우에는 모두 반환하여야 한다.","체포된 피의자에 대하여 구속영장을 청구받은 관할 지방법원 판사는 구속사유의 존부를 심리 판단하기 위하여 지체 없이 피의자를 심문하여야 한다.","구속적부심사절차에서 작성된 조서는 형사소송법 제311조의 법원 또는 법관의 조서에 해당하는 것이 아니라, 동법 제315조 제3호의 ‘기타 특히 신용할 만한 정황에 의하여 작성된 문서’ 로서 당연히 증거능력이 있는 서류에 해당한다.","구속영장을 집행함에는 피의자의 신청이 있는 때에 한하여 피의자에게 그 사본을 교부할 수 있다.",3,1,"수사준칙 제35조(영장 반환)를 인용한 문항입니다. 2026.10.2. 수사준칙 개정 반영 여부를 확인해야 합니다."],["2022-2","형사법",33,"임의동행에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","경찰관이 동행에 앞서 피의자에게 동행을 거부할 수 있음을 알려 주었거나 동행한 피의자가 언제든지 자유로이 동행 과정 에서 이탈 또는 동행 장소로부터 퇴거할 수 있었음이 인정되는 등 오로지 피의자의 자발적인 의사에 의하여 수사관서에의 동행이 이루어졌음이 객관적인 사정에 의하여 명백하게 입증된 경우에 한하여 임의동행의 적법성이 인정된다.","경찰관이 甲을 경찰서로 동행할 당시 甲에게 언제든지 동행을 거부할 수 있음을 고지한 다음 동행에 대한 동의를 구하였고, 이에 甲이 고개를 끄덕이며 동행의 의사표시를 하였으며, 동행 당시 경찰관에게 욕을 하거나 특별한 저항을 하지 않고서 동행에 순순히 응하였으며, 동행 당시 술에 취한 상태이긴 하였으나, 동행 후 경찰서에서 주취운전자 정황진술보고서의 날인을 거부하고 “이번이 3번째 음주운전이다. 난 시청직원이다. 1번만 봐달라.”라고 말한 경우, 甲에 대한 임의동행은 적법하다.","경찰관이 甲의 정신상태, 신체에 있는 주사바늘 자국, 알콜솜 휴대, 전과 등을 근거로 甲의 마약류 투약 혐의가 상당하다고 판단하여 경찰서로 임의동행을 요구하였고, 동행 장소인 경찰서 에서 甲에게 마약류 투약 혐의를 밝힐 수 있는 소변과 모발의 임의제출을 요구하였다면, 이때 임의동행은 형사소송법 제199조 제1항에 따른 임의동행에 해당하지 아니한다.","술에 취한 상태에 있다고 인정할 만한 상당한 이유가 있는 운전자가 경찰관으로부터 언제라도 자유로이 퇴거할 수 있음을 고지받고 파출소까지 자발적으로 동행한 경우, 이 파출소에서의 음주측정요구는 위법한 체포 상태에서 이루어진 것이라고 할 수 없다.",2,0,""],["2022-2","형사법",34,"엄격한 증명과 자유로운 증명에 관한 설명 중 가장 적절 하지 않은 것은? (다툼이 있는 경우 판례에 의함)","양자는 증거능력의 유무와 증거조사방법에 차이가 있을 뿐 심증의 정도에는 차이가 없다.","자유로운 증명은 증거능력 없는 증거나 적법한 증거조사절차를 거치지 아니한 증거에 의한 증명을 의미한다.","법원은 전과조회서가 변론종결 후에 회보되었다 하더라도 변론재개 없이 전과조회서에 기재된 누범전과의 사실을 근거로 형을 가중할 수 있다.","친고죄에서 적법한 고소유무는 자유로운 증명의 대상이다.",2,0,""],["2022-2","형사법",35,"다음 사례에 대한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) A는 2022. 2. 10. 甲의 집에서 자고 있는 사이 甲이 자신의 의사에 반해 나체를 촬영한 범행을 저질렀다며 경찰에 甲을 신고하였다. A는 甲을 신고하면서 甲의 집에서 가지고 나온 甲 소유의 휴대폰 2대(휴대폰1, 휴대폰2)를 사법경찰관 P에게 임의제출하였고, P는 A에게 제출범위에 관한 의사를 따로 확인하지 않았다. P는 휴대폰1에 저장된 동영상 파일을 통해 甲의 A에 대한 범행을 확인한 후, 휴대폰2에서도 甲의 범행의 증거를 찾던 중 2021. 1. 경 A가 아닌 B와 C의 나체를 불법 촬영한 동영상 30개와 사진을 발견하였다. P는 발견한 동영상과 사진을 CD에 복제한 후, 압수 수색 영장을 발부받아 이 CD를 압수하였다.","휴대폰은 임의제출물이기 때문에 2대의 휴대폰에 저장된 전자 정보 전부가 임의제출되어 압수된 것으로 취급할 수 있다.","2021. 1. 경 범행 동영상은 2022. 2. 10. 범행과 동종 유사한 범행이므로 2022. 2. 10. 범행과 구체적 개별적 연관관계가 없다 하더라도 2022. 2. 10. 범행 혐의사실과 관련성이 있다.","A가 제출한 휴대폰이 임의제출물이라 하더라도 휴대폰을 탐색하는 과정에서 甲에게 참여권을 보장하고 압수목록을 교부해야 한다.","압수된 CD에 저장된 동영상과 휴대폰2에 저장된 원본 동영상과의 동일성은 검사가 주장 입증해야 하며, 엄격한 증명의 방법으로 증명되어야 한다.",2,0,""],["2022-2","형사법",36,"다음 사례에 대한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 사법경찰관 P는 甲을 정보통신망 이용촉진 및 정보보호 등에 관한 법률 상 명예훼손 혐의로 수사하면서 압수 수색 영장을 발부받아 甲의 집에서 그의 컴퓨터를 압수 수색 하였다. P는 甲의 컴퓨터 하드디스크를 하드카피 방법으로 복제본을 생성 한 후, 수사기관 사무실로 가지고 나왔다. P는 甲에게 참여권을 고지하지 않은 채 甲의 참여 없이 반출한 복제본을 탐색하는 과정 에서 우연히 성폭력범죄의 처벌 등에 관한 특례법 위반죄에 해당되는 성폭력범죄 동영상 파일을 발견하였다. 이후 P는 압수 수색 영장을 발부받아 이 동영상 파일을 압수하였다.","사법경찰관 P는 압수목록에 컴퓨터 하드디스크 규격과 개수를 기재한 후, 하드카피 방법으로 복제본을 생성한 때 지체 없이 甲에게 교부하여야 한다.","압수 수색 영장집행은 甲의 집에서 하드디스크 복제본을 생성 한 때 종료된 것이므로 탐색과정에서는 甲에게 참여권을 보장 하지 않아도 된다.","甲의 컴퓨터를 압수 수색함에 있어서 압수·수색영장 집행 사실을 미리 알려주면 컴퓨터에 저장된 파일을 삭제할 염려 등이 있더라도 사전에 집행의 일시와 장소를 甲에게 통지하여 참여권을 보장해야 한다.","성폭력범죄 동영상 파일을 우연히 발견하고, 사후에 영장을 발부받았다하더라도이동영상파일은증거능력이인정되지않는다.",3,0,""],["2022-2","형사법",37,"전문증거에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","녹음파일에 담긴 진술 내용의 진실성이 증명의 대상이 되는 때에는 전문법칙이 적용된다고 할 것이나, 녹음파일에 담긴 진술 내용의 진실성이 아닌 그와 같은 진술이 존재하는 것 자체가 증명의 대상이 되는 경우에는 전문법칙이 적용되지 아니한다.","“피해자로부터 ‘피고인이 자신을 추행했다.’는 취지의 말을 들었다.”는 A의 진술을 “피고인이 자신을 추행했다.”는 피해자의 진술내용의 진실성을 증명하는 간접사실로 사용하는 경우에는 전문증거에 해당하지 않는다.","전문증거라도 당사자가 동의한 경우에는 전문법칙이 적용되지 않으며, 증인의 신용성을 탄핵하기 위한 탄핵증거로 제출된 경우에도 전문법칙이 적용되지 않는다.","A에 대한 사기죄로 공소제기된 甲의 공판에서 甲이 자신의 처에게 보낸 “내가 A를 속여 투자금을 받았는데 그 돈을 송금한다.”라는 내용의 문자 메시지가 증거로 제출되었다면 이 메시지는 전문증거에 해당한다.",1,0,""],["2022-2","형사법",38,"전문법칙의 예외에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","사법경찰관이 적법한 절차와 방식에 따라 작성한 검증조서에 피의자 아닌 자의 진술이 기재된 경우, 그 진술이 영상녹화물에 의하여 증명되고 공판기일에서 작성자인 사법경찰관의 진술에 따라 그 성립의 진정함이 증명된 때에는 증거로 할 수 있다.","A는 살인현장을 목격한 친구 B가 “甲이 길가던 여자를 죽였다.”고 말한 내용을 자필 일기장에 작성하였고, 훗날 이 일기장이 甲의 살인죄 공판에 증거로 제출된 경우, 이 일기장은 형사소송법 제313조 제1항의 진술기재서(류)에 해당된다.","자기에게 맡겨진 사무를 처리한 내역을 그때 그때 계속적, 기계적으로 기재한 문서라 하더라도 불법적인 업무과정에서 작성한 문서는 신용성이 없으므로 당연히 증거능력이 인정되지 않는다.","甲이 살인죄로 공소제기된 공판에서 A가 증인으로 출석하여 교통사고로 사망한 B가 생전에 자신에게 “甲이 C를 살해하는 것을 보았다.”는 말을 한 적이 있다고 진술한 경우, B의 진술이 특히 신빙할 수 있는 상태 하에서 행하여졌음이 증명된 때에 한하여 이를 증거로 할 수 있다.",3,0,""],["2022-2","형사법",39,"다음 사례에 대한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) 甲은 A를 인적이 드문 곳으로 유인한 후, 권총으로 살해하였다. 범행장면은 현장 인근의 건물에 적법하게 설치된 CCTV에 녹화되었다. 사법경찰관 P는 CCTV 관리자가 녹화저장장치에서 甲의 범행장면이 복사된 이동식 저장장치(이하 ‘USB’)를 건네 주자 이를 압수하였다. 이후 P는 권총의 구매 경위를 수사하기 위하여 甲의 이메일 계정을 압수하였다. 압수된 이메일에는 B가 甲에게 “권총을 구매하여 택배로 보냈다.”는 내용이 있었다. 검사는 甲을 살인죄로 기소하면서 USB와 이메일 파일을 증거로 제출 하였다. ㉠ USB에 저장된 파일이 복사 과정에서 편집되는 등 인위적 개작 없이 원본 내용을 그대로 복사한 사본이라는 점이 증명되어야 한다. ㉡ CCTV에 녹화된 甲의 얼굴 등은 개인정보에 해당하지만 CCTV 관리자가 정보주체의 동의 없이 임의제출하였더라도 위법수집증거에 해당하지 않는다. ㉢ USB에 저장된 CCTV 영상이 범죄 당시 현장의 영상이라는 사실이 요증사실인 경우에는 전문법칙이 적용되지 않는다. ㉣ 이메일 작성자인 B가 증인으로 출석하여 “甲에게 이메일을 보낸 기억이 없다.”고 진술한 경우에는 과학적 분석결과에 기초한 디지털포렌식 자료, 감정 등 객관적 방법으로 성립의 진정함이 증명되는 때에도 증거로 할 수 없다.","1개","2개","3개","4개",2,0,""],["2022-2","형사법",40,"다음 사례에 대한 설명 중 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) 甲과 乙은 인터넷 채팅을 통하여 알게 된 A와 B를 승용차에 태우고 함께 남산 부근을 드라이브하던 중, A와 B가 잠시 차에서 내린 사이에 甲이 乙에게 A와 B를 한 사람씩 나누어 강간하자고 제의하자 乙은 아무런 대답도 하지 않고 따라 다니다가 자신의 강간 상대방으로 남겨진 B에게 일체의 신체적 접촉도 시도하지 않은 채 B와 이야기만 나눴다. 甲은 A를 숲속에서 강간하려고 하였으나 A가 수술한지 얼마 안되어 배가 아프다면서 애원하자 강간행위를 중지하였다. 며칠 후 乙은 친구 C를 만나 “甲이 A를 강간하려고 하는 동안 나는 그냥 가만히 있었다.”라고 말하였다. 사법경찰관 P는 甲을 수사하는 과정에서 C를 참고인으로 조사 하여 C가 乙로부터 들은 위 진술 내용이 기재된 진술조서를 적법하게 작성하였다. 검사는 甲을 강간미수죄로 기소하면서 C에 대한 진술조서를 증거로 제출하였으나, 甲은 이를 증거로 함에 부동의하였다. ㉠ 乙은 강간 범행에 공동으로 가공할 의사가 있었다고 볼 수 없다. ㉡ 甲은 강간죄의 중지미수에 해당한다. ㉢ 진술조서에 기재된 乙의 진술부분은 재전문증거에 해당한다. ㉣ 진술조서의 실질적 진정성립과 특신상태가 증명이 되고, 변호인이 C를 신문할 수 있었던 때에는 C의 진술조서 전부에 대해 증거능력이 인정된다.","1개","2개","3개","4개",1,0,""],["2022-2","경찰학",1,"경찰개념에 관한 설명 중 가장 적절하지 않은 것은?","경찰의 개념에 대한 정의는 시대 및 역사 그리고 각국의 전통과 사상을배경으로발달하기때문에일률적으로정의를내리기어렵다.","1648년 독일은 베스트팔렌 조약을 계기로 사법이 국가의 특별 작용으로 인정되면서 경찰과 사법이 분리되었다.","독일은 제2차 세계대전 이후 보안경찰 이외의 행정경찰사무, 즉 영업경찰, 건축경찰, 보건경찰 등의 경찰사무를 다른 행정 관청의 분장사무로 이관하는 비경찰화 과정을 거쳤다.","독일 프로이센 고등행정법원의 크로이쯔베르크 판결을 계기로 경찰의 권한은 소극적 위험방지 분야로 한정하게 되었으며, 비로소 이 취지의 규정을 둔 경죄처벌법전 (죄와형벌법전)이 제정되었다.",3,0,""],["2022-2","경찰학",2,"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 상 자치 경찰사무에 관한 내용 중 가장 적절하지 않은 것은?","생활안전을 위한 순찰 및 시설의 운영, 주민참여 방범활동의 지원 및 지도, 주민의 일상생활과 관련된 사회질서의 유지 및 그 위반행위의 지도 단속 등 지역 내 주민의 생활안전 활동에 관한 사무는 자치경찰의 사무에 포함된다.","교통법규 위반에 대한 지도 단속, 교통안전시설 및 무인 교통 단속용 장비의 심의 설치 관리 등 지역 내 교통활동에 관한 사무는 자치경찰사무에 포함된다.","학교폭력 등 소년범죄, 가정폭력, 아동학대 범죄, 형법 제245조에 따른 공연음란 및 성폭력범죄의 처벌 등에 관한 특례법 제11조에 따른 공중밀집 장소에서의 추행행위에 관한 범죄는 자치경찰사무에 포함된다.","지역 내 주민의 생활안전 활동에 관한 사무, 지역 내 교통활동에 관한 사무, 지역 내 다중운집 행사 관련 혼잡 교통 및 안전 관리의 자치경찰사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정하는 기준에 따라 시 도조례로 정한다.",2,0,""],["2022-2","경찰학",3,"국가경찰과 자치경찰의 조직 및 운영에 관한 법률 상 국가 경찰위원회와 시 도자치경찰위원회에 공통적으로 적용되는 규정 중 가장 적절한 것은?","위원장 및 1명의 위원은 상임위원으로 하고 나머지 5명의 위원은 비상임으로 한다.","경찰의 직에서 퇴직한 날로부터 3년이 지나지 아니한 사람은 위원이 될 수 없다.","위원 2명이 회의를 요구하는 경우 임시회의를 개최할 수 있다.","보궐위원은 전임자의 남은 임기가 1년 미만인 경우 한 차례에 한해서 연임할 수 있다.",1,0,""],["2022-2","경찰학",4,"경찰재량에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","도로교통법 상 교통단속임무를 수행하는 경찰공무원을 폭행한 사람의 운전면허를 취소하는 것은 행정청이 재량여지가 없으므로 재량권의 일탈 남용과는 관련이 없다.","재량을 선택재량과 결정재량으로 나눌 경우, 경찰공무원의 비위에 대해 징계처분을 하는 결정과 그 공무원의 건강 등 제반사정을 고려하여 징계처분을 하지 않는 결정 사이에서 선택권을 갖는 것을 결정재량이라 한다.","재량의 일탈 남용뿐만 아니라 단순히 재량권 행사에서 합리성을 결하는 등 재량을 그르친 경우에도 행정심판의 대상이 된다.","재량권의 일탈이란 재량권의 내적 한계(재량권이 부여된 내재적 목적)를 벗어난 것을 말하며, 재량권의 남용이란 재량권의 외적 한계(법적 객관적 한계)를 벗어난 것을 의미한다. 찰 학】(공 통)",3,0,""],["2022-2","경찰학",5,"다음은 경찰활동의 기본이념과 관련된 법적 근거를 제시한 것이다. 이와 관련하여 <보기 1>과 <보기 2>의 내용이 가장 적절하게 연결된 것은? <보기 1> (가) 헌법 제1조 제2항에서는 “대한민국 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다”라고 규정하고 있다. (나) 헌법 제37조 제1항에서는 “국민의 자유와 권리는 헌법에 열거되지아니한이유로경시되지아니한다”라고규정하고있다. (다) 국가공무원법 제65조 제1항에서는 “공무원은 정당이나 그 밖의 정치단체의 결성에 관여하거나 이에 가입할 수 없다” 라고 규정하고 있다. <보기 2> ㉠ 인권존중주의 ㉡ 민주주의 ㉢ 법치주의 ㉣ 정치적 중립주의 (가) (나) (다)","㉡ ㉣ ㉠","㉢ ㉡ ㉣","㉡ ㉠ ㉣","㉢ ㉠ ㉣",2,0,""],["2022-2","경찰학",6,"공직자의 이해충돌 방지법 과 부정청탁 및 금품등 수수의 금지에 관한 법률 에 관한 설명 중 가장 적절한 것은?","공직자의 이해충돌 방지법 상 부동산을 직접 또는 간접으로 취급하는 대통령령으로 정한 공공기관의 공직자가 소속 공공 기관의 업무와 관련된 부동산을 보유하고 있거나 매수하는 경우 소속기관장에게 그 사실을 구두 또는 서면으로 신고하여야 한다.","부정청탁 및 금품등 수수의 금지에 관한 법률 상 ‘공직자등’이 부정청탁을 받았을 때에는 부정청탁을 한 자에게 부정청탁임을 알리고 이를 거절하는 의사를 명확히 표시하여야 하며, 이러한 조치를 하였음에도 불구하고 동일한 부정청탁을 다시 받은 경우에는 이를 소속기관장에게 구두 또는 서면(전자서면을 포함)으로 신고하여야 한다.","부정청탁 및 금품등 수수의 금지에 관한 법률 에 따르면 OO경찰서 소속 경찰관 甲이 모교에서 자신의 직무와 관련된 강의를 요청받아 1시간 동안 강의를 하고 50만 원의 사례금을 받았다면 대통령령이 정하는 바에 따라 소속기관장에게 신고하고 그 초과금액을 소속기관장에게 지체없이 반환하여야 한다.","부정청탁 및 금품등 수수의 금지에 관한 법률 상 국가공무원법 또는 지방공무원법 에 따른 공무원과 그 밖에 다른 법률에 따라 그 자격 임용 교육훈련 복무 보수 신분보장 등에 있어서 공무원으로 인정된 사람은 ‘공직자등’ 개념에 포함된다.",3,0,""],["2022-2","경찰학",7,"다음은 경찰의 부정부패 이론(가설)에 관한 설명이다. 주장한 학자와 이론이 가장 적절하게 연결된 것은? ㉠ 부패의 사회화를 통하여 신임경찰이 기존의 부패한 경찰에게 물들게 된다는 것으로 부패의 원인을 개인적 결함이 아닌 조직의 체계적 원인으로 보고 있다. ㉡ 시카고 경찰의 부패 원인 중 하나로 ‘시카고 시민이 경찰을 부패시켰다’라는 주장이 거론된 것처럼 시민사회가 경찰관의 부패를 묵인하거나 용인할 때 경찰관이 부패 행위에 빠져 들게 된다.","㉠ 델라트르(Delattre)-미끄러지기 쉬운 경사로 이론 ㉡ 니더호퍼(Neiderhoffer), 로벅(Roebuck), 바커(Barker)-구조원인가설","㉠ 셔먼(Sherman)-구조원인가설 ㉡ 델라트르(Delattre)-미끄러지기 쉬운 경사로 이론","㉠ 니더호퍼(Neiderhoffer), 로벅(Roebuck), 바커(Barker)-구조원인가설 ㉡ 윌슨(Wilson)-전체사회가설","㉠ 윌슨(Wilson)-전체사회가설 ㉡ 펠드버그(Feldberg)-구조원인가설",2,0,""],["2022-2","경찰학",8,"다음 사례에서 나타나는 전문직업인으로서 경찰의 윤리적 문제점으로 가장 적절한 것은? OO경찰서 경비과 소속 경찰관 甲은 집회 현장에서 시위대가 질서유지선을 침범해 경찰관을 폭행하자 교통, 정보, 생활안전 등 다른 전체적인 분야에 대한 고려 없이 경비분야만 생각하고 검거 결정을 하였다.","부권주의","소외","차별","사적 이익을 위한 이용",1,0,""],["2022-2","경찰학",9,"환경설계를 통한 범죄예방(CPTED)에 관한 설명이다. 이에 관한 ㉠부터 ㉣까지의 설명 중 옳고 그름의 표시(O, X)가 모두 바르게 된 것은? ㉠ 건축물이나 시설물의 설계 시 가시권의 최대 확보, 외부침입에 대한 감시기능을 확대하여 범죄행위의 발견 가능성은 증가 시키고 범죄기회는 감소시킬 수 있다는 원리를 자연적 감시 라고 하며, 이에 대한 종류로는 조명, 조경, 가시권 확대를 위한 건물의 배치 등이 있다. ㉡ 지역사회의 설계 시 주민들이 모여서 상호의견을 교환하고 유대감을 증대할 수 있는 공공장소를 설치하고 이용하도록 함으로써 ‘거리의 눈’을 활용한 자연적 감시와 접근통제의 기능을 확대하는 원리를 활동의 활성화(활용성의 증대)라고 하며, 이에 대한 종류로는 놀이터 공원의 설치, 벤치 정자의 위치 및 활용성에 대한 설계, 통행로의 설계 등이 있다. ㉢ 사적 공간에 대한 경계를 표시하여 주민들의 책임의식과 소유의식을 증대함으로써 사적 공간에 대한 관리권과 권리를 강화시키고, 외부인들에게는 침입에 대한 불법사실을 인식 시켜 범죄기회를 차단하는 원리를 자연적 접근통제라고 하며, 이에 대한 종류로는 방범창, 출입구의 최소화 등이 있다. ㉣ 처음 설계된 대로 혹은 개선한 의도대로 기능을 지속적으로 유지하도록 관리함으로써 범죄예방을 위한 환경설계의 장기적 이고 지속적인 효과를 유지하는 원리를 유지관리라고 하며, 이에 대한 종류로는 청결유지, 파손의 즉시보수, 조명의 관리 등이 있다.","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(O)","㉠(O) ㉡(O) ㉢(O) ㉣(X)",0,0,""],["2022-2","경찰학",10,"개인의 자유를 침해하거나 의무를 부과하는 행정은 반드시 법률의 근거가 있어야 한다는 원칙을 전제할 때, 법률의 근거 없이도 가능한 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 경찰관의 학교 앞 등교지도 ㉡ 주민을 상대로 한 교통정책홍보 ㉢ 기초생활수급자에 대한 생계비지원 ㉣ 공무원에 대해 특정종교를 금지하는 훈령 ㉤ 자살을 시도하는 사람에 대한 경찰관서 보호 ㉥ 붕괴위험시설에 대한 예방적 출입금지","㉠㉡㉢","㉠㉡㉤","㉠㉢㉤","㉡㉢㉣㉥",0,0,""],["2022-2","경찰학",11,"우리나라경찰의역사에관한설명중가장적절하지않은 것은?","고려시대 중앙에는 형부, 병부, 어사대, 금오위 등이 경찰업무를 수행하였고, 이 중 어사대는 관리의 비리를 규탄하고 풍속교정을 담당하는 등 풍속경찰의 임무를 수행하였다.","이준규 서장은 보도연맹원들에 대한 총살명령이 내려오자 480명의 예비검속자 앞에서 “내가 죽더라도 방면하겠으니 국가를 위해 충성해 달라”라는 연설 후 전원 방면하였다.","정부수립 이후 1991년 이전 경찰의 특징을 살펴보면, 전투경찰 업무가 경찰의 업무 범위에 추가되었고 소방업무가 경찰의 업무 범위에서 배제되는 등 경찰활동의 영역에 변화가 있었다.","구 경찰법 이 국가경찰과 자치경찰의 조직 및 운영에 관한 법률 로 개정됨에 따라 자치경찰사무를 관장하게 하기 위하여 특별시장 광역시장 특별자치시장 도지사 특별자치도지사 소속 으로 시 도자치경찰위원회를 두었다.",1,0,""],["2022-2","경찰학",12,"행정법의 일반원칙에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","폐기물처리업에 대하여 사전에 관할 관청으로부터 적정통보를 받고 막대한 비용을 들여 허가요건을 갖춘 다음 허가신청을 하였음에도 관할 관청으로부터 ‘다수 청소업자의 난립으로 안정적이고 효율적인 청소업무의 수행에 지장이 있다’는 이유로 불허가처분을 받은 경우, 그 처분은 신뢰보호원칙 위반으로 인한 위법한 처분에 해당된다.","지방자치단체장이 사업자에게 주택사업계획승인을 하면서 그 주택사업과는 아무런 관련이 없는 토지를 기부채납하도록 하는 부관을 주택사업계획승인에 붙인 경우, 그 부관은 부당 결부금지 원칙에 위반되어 위법하다.","같은 정도의 비위를 저지른 자들 사이에 있어서도 그 직무의 특성, 비위의 성격 및 정도를 고려하여 징계종류의 선택과 양정을 차별적으로 취급하는 것은 합리적 차별로서 평등원칙에 반하지 아니한다.","적법 및 위법을 불문하고 재량준칙에 따른 행정관행이 성립한 경우라면, 행정의 자기구속 원칙이 적용될 수 있다.",3,0,""],["2022-2","경찰학",13,"경찰공무원관련법령에따를때, 다음설명중가장적절한것은?","OO경찰서 소속 지구대장 경감 甲과 동일한 지구대 소속 순경 乙이 관련된 징계등 사건(甲의 감독상 과실책임만으로 관련된 경우, 관련자에 대한 징계등 사건을 분리하여 심의 의결하는 것이 타당하다고 인정되는 경우는 제외)은 OO경찰서에 설치된 징계 위원회에서 심의 의결한다.","경찰공무원 임용 당시 임용결격사유가 있었더라도 국가의 과실에 의해 임용결격자임을 밝혀내지 못했다면, 그 임용행위는 당연무효로 볼 수 없다.","국가경찰사무를 담당하는 OO경찰서 소속 경사 丙에 대한 정직처분은 소속기관장인 OO경찰서장이 행하지만, 그 처분에 대한 행정소송의 피고는 경찰청장이다.","징계의결이 요구된 경정 丁에게 국무총리 표창을 받은 공적이 있는 경우에 징계위원회는 징계를 감경할 수 있지만, 그 표창이 丁에게 수여된 표창이 아니라 丁이 속한 OO경찰서에 수여된 단체표창이라면 감경할 수 없다.",3,0,""],["2022-2","경찰학",14,"경찰공무원 관련 법령에 따를 때, 승진에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","OO지구대에 근무하는 순경 甲이 승진후보자명부에 등재된 후 경장으로 승진임용되기 전에 정직 3개월의 징계처분을 받아 임용권자가 순경 甲을 승진후보자명부에서 삭제함으로써 순경 甲이 승진임용의 대상에서 제외되었다면, 임용권자의 승진 후보자명부에서의 삭제 행위 그 자체는 행정처분에 해당한다.","만 7세인 초등학교 1학년 외동딸을 양육하기 위하여 1년간 휴직한 경사 乙의 위 휴직기간 1년은 승진소요 최저근무연수에 포함된다.","통상적인 근무시간보다 짧은 시간을 근무하는 시간선택제전환 경찰공무원으로 경위 계급에서 1년간 근무한 경위 丙의 위 근무기간 1년은 승진소요 최저근무연수에 포함된다.","위법 부당한 처분과 직접적 관계없이 50만 원의 향응을 받아 감봉 1개월의 징계처분을 받은 경감 丁이 그 징계처분을 받은 후 해당 계급에서 경찰청장 표창을 받은 경우(그 외 일체의 포상을 받은 사실 없음)에는 징계처분의 집행이 끝난 날부터 18개월이 지나면 승진임용될 수 있다.",0,0,""],["2022-2","경찰학",15,"국가공무원법 및 관련 법령에 따를 때, 소청심사와 관련 하여 아래 사례에 관한 설명 중 가장 적절하지 않은 것은? OO경찰서 소속 지구대에서 근무하는 순경 甲이 법령준수 의무 위반 등 각종 비위행위로 인하여 관련 절차를 거쳐 징계권자로 부터 해임의 징계처분을 받았다. 이에 순경 甲은 소청심사를 제기하고자 한다.","소청심사위원회는 소청심사 결과 甲의 비위행위의 정도에 비해 해임의 징계처분이 경미하다는 판단에 이르더라도 파면의 징계처분으로 변경하는 결정을 할 수 없다.","소청심사위원회에서 해임처분 취소명령결정을 내릴 경우, 그 해임의 징계처분은 소청심사위원회의 결정에 따른 징계나 그 밖의 처분이 있기 전에 당연히 효력을 상실한다.","소청심사위원회에서 해임처분을 취소 또는 변경하고자 할 경우 에는 재적 위원 3분의 2 이상의 출석과 출석 위원 3분의 2 이상의 합의가 있어야 한다.","甲이 징계처분사유 설명서를 받은 날부터 30일 이내(甲에게 책임이 없는 사유로 소청심사를 청구할 수 없는 기간은 없다고 전제한다) 소청심사를 제기하지 않은 경우에는 행정소송을 제기할 수 없다.",1,0,""],["2022-2","경찰학",16,"다음은 경찰관 직무집행법 상 범죄의 예방과 제지에 관한 사례이다. 이와 관련한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함) 甲은 평소 집에서 심한 고성과 욕설, 시끄러운 음악 소리 등으로 이웃 주민들로부터 수 회에 걸쳐 112신고가 있어 왔던 사람이다. 사건 당일에도 甲이 자정에 가까운 한밤중에 집 안에서 음악을 크게 켜놓고 심한 고성을 지른다는 112신고를 받고 경찰관이 출동하였다. 출동한 경찰관이 인터폰으로 甲에게 문을 열어달라고 하였으나, 甲은 심한 욕설을 할 뿐 출입문을 열어주지 않은 채, 소란행위를 멈추지 않았다. 이에 경찰관들이 甲을 만나기 위해 甲의 집으로 통하는 전기를 일시적으로 차단하여 甲이 집 밖으로 나오도록 유도하였다.","경찰관 직무집행법 상 경찰관의 제지에 관한 부분은 눈앞의 급박한 경찰상 장해를 제거하여야 할 필요가 있고 의무를 명할 시간적 여유가 없거나 의무를 명하는 방법으로는 그 목적을 달성하기 어려운 상황에서 의무이행을 전제로 하지 않고 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 비권력적 사실행위에 관한 근거조항이다.","甲의 행위는 경범죄처벌법 상 ‘인근소란 등’에 해당하고 이로 인하여 인근 주민들이 잠을 이루지 못할 수 있으며 출동한 경찰관들을 만나지 않고 소란행위를 지속하고 있으므로, 甲의 행위를제지하는것은경찰관의직무상권한이자의무로볼수있다.","경찰관 직무집행법 상 경찰관의 제지 조치의 위법 여부는 사후적으로 순수한 객관적 기준에서 판단해야 하고 제지 조치 당시의 구체적 상황을 기초로 판단하는 것은 아니다.","경찰관의 조치는 사람의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우로 보기는 어려워 즉시강제가 아니라 직접강제의 요건에 부합한다.",1,0,""],["2022-2","경찰학",17,"행정청이 행하는 구체적 사실에 관한 법 집행으로서 공권력의 행사 또는 그 거부와 그 밖에 이에 준하는 행정작용에 해당하는 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 도로점용허가 ㉡ 주민등록번호 변경신청 거부 ㉢ 교통경찰관의 수신호 ㉣ 교통신호등에 의한 신호 ㉤ 경찰청장의 횡단보도 설치 기본계획 수립","1개","2개","3개","4개",3,0,""],["2022-2","경찰학",18,"행정조사에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","행정조사기본법 상 조사대상자의 자발적 협조를 얻어 조사를 실시하는 경우에는 법령의 근거를 요하지 아니하며 조직법상의 권한 범위 밖에서도 가능하다.","조사대상자의 자발적 협조로 조사가 이루어지는 경우일지라도 행정의 적법성 및 공공성 등을 높이기 위해서 조사목적 등을 반드시 서면으로 통보하여야 한다.","경찰작용은 행정작용의 일환이므로 경찰의 수사에도 행정조사 기본법 이 적용되는 것이 원칙이다.","행정조사는 행정기관이 향후 행정작용에 필요한 자료 및 정보를 얻기 위한 준비적 보조적 작용이다.",3,0,""],["2022-2","경찰학",19,"강학상 경찰허가에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","특별한 규정이 없는 한, 허가를 받게 되면 다른 법령상의 제한들도 모두 해제되는 것이 원칙이다.","특별한 규정이 없는 한, 허가는 법령이 부과한 작위의무, 부작위 의무 및 급부의무를 모두 해제하는 것이다.","강학상 허가와 강학상 특허는 당사자의 신청이 없어도 가능하다는 점에서 공통점이 있다.","일반적으로영업허가를 받지 아니한 상태에서 행한 사법상 법률행위는 유효하다.",3,0,""],["2022-2","경찰학",20,"경찰관 직무집행법 상 즉시강제에 해당하는 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 주택가에서 흉기를 들고 난동을 부리며 경찰관의 중지명령에 항거하는 사람에 대해 전자충격기를 사용하여 강제로 제압 하는 것 ㉡ 음주운전 등 교통법규 위반자에 대해 운전면허를 취소하는 것 ㉢ 불법집회로 인한 공공시설의 안전에 대한 위해를 억제하기 위해 최루탄을 사용하는 것 ㉣ 위험물의 폭발로 인해 매우 긴급한 경우에 위해를 입을 우려가 있는 사람을 억류하거나 피난시키는 것 ㉤ 지정된 기한까지 체납액을 완납하지 않은 국세체납자의 재산을 압류하는 것 ㉥ 무허가건물의 철거 명령을 받고도 이를 불이행하는 사람의 불법건축물을 철거하는 것","3개","4개","5개","6개",0,0,""],["2022-2","경찰학",21,"개인정보 보호법 상 정의 및 개념에 관한 설명 중 가장 적절하지 않은 것은?","살아 있는 개인에 관한 정보로서 해당 정보만으로는 특정 개인을 알아볼 수 없더라도 다른 정보와 쉽게 결합하여 알아볼 수 있는 정보를 “개인정보”라 한다.","개인정보의 일부를 삭제하거나 일부 또는 전부를 대체하는 등의 방법으로 추가 정보가 없이는 특정 개인을 알아볼 수 없도록 처리하는 것을 “가명처리”라 한다.","정보처리 기술을 활용하여 기존의 다양한 정보를 가공해서 만들어 낸 새로운 정보에 관한 독점적 권리를 가지는 사람을 “정보주체”라 한다.","일정한 공간에 지속적으로 설치되어 사람 또는 사물의 영상 등을 촬영하거나 이를 유 무선망을 통하여 전송하는 장치로서 네트워크 카메라와 같은 장치를 “영상정보처리기기”라 한다.",2,0,""],["2022-2","경찰학",22,"경찰관 직무집행법 및 경찰관의 정보수집 및 처리 등에 관한 규정(대통령령) 상 경찰관이 정보활동을 위해 필요한 경우에 한정하여 일시적으로만 출입이 가능한 곳은 모두 몇 개인가? ㉠ 언론기관 ㉡ 종교시설 ㉢ 민간기업 ㉣ 정당의 사무소 ㉤ 시민사회 단체","2개","3개","4개","5개",3,0,""],["2022-2","경찰학",23,"행정의 실효성 확보수단에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","통고처분은 형식적 의미의 행정이며 실질적 의미의 사법이다.","작위의무를 부과한 행정처분의 법적 근거가 있다면 행정대집행은 별도의 법적 근거를 요하지 아니하며, 즉시강제는 법률의 근거가 없더라도 일반긴급권에 기초하여 행사할 수 있다.","행정대집행과 행정상 즉시강제는 제3자에 의해 집행될 수 없고 행정청이 직접 행사해야 한다.","관세법 상 통고처분 여부는 관세청장의 재량에 맡겨져 있지만, 경범죄처벌법 및 도로교통법 상 통고처분은 재량의 여지가 없다.",0,0,""],["2022-2","경찰학",24,"행정심판법 상 사정재결에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","사정재결은 인용재결의 일종이다.","무효등확인심판에서는 사정재결을 할 수 없다.","사정재결을 하는 경우 반드시 재결주문에 그 처분 또는 부작위가 위법하다는 것을 명시해야 한다.","사정재결 이후에도 행정심판의 대상인 처분등의 효력은 유지된다.",0,0,""],["2022-2","경찰학",25,"국가배상에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","일반적으로 공무원이 직무를 집행함에 있어서 법령에 대한 해석이 그 문언 자체만으로는 명백하지 아니하여 여러 견해가 있을 수 있는 데다가 이에 대한 선례나 학설, 판례 등도 귀일된 바 없어 이의(異義)가 없을 수 없는 경우, 관계 국가공무원이 그 나름대로 신중을 다하여 합리적인 근거를 찾아 그 중 어느 한 견해를 따라 내린 해석이 후에 대법원이 내린 입장과 같지 않아 결과적으로 잘못된 해석에 돌아가고, 이에 따른 처리가 역시 결과적으로 위법하게 되어 그 법령의 부당집행이라는 결과를 가져오게 되었다고 하더라도 국가배상법 상 공무원의 과실을 인정 할 수는 없다.","국가공무원이 고의 또는 과실로 직무상 의무를 위반하였을 경우라고 하더라도 국가는 그러한 직무상의 의무 위반과 피해자가 입은 손해 사이에 상당인과관계가 인정되는 범위 내에서만 배상책임을 지는 것이고, 이 경우 상당인과관계가 인정되기 위하여는 공무원에게 부과된 직무상 의무의 내용이 단순히 공공 일반의 이익을 위한 것이거나 행정기관 내부의 질서를 규율하기 위한 것이 아니고 전적으로 또는 부수적으로 사회구성원 개인의 안전과 이익을 보호하기 위하여 설정된 것이어야 한다.","외국인이 피해자인 경우 국가배상청구권은 해당 국가와 상호 보증이 있을 때에만 인정되므로, 그 상호 보증은 외국의 법령, 판례 및 관례 등에 의한 발생요건을 비교하여 인정되는 것이 아니라 반드시 당사국과의 조약이 체결되어 있어야 한다.","국민의 생명, 신체 및 재산의 보호, 범죄의 예방 진압 및 수사, 기타 공공의 안녕과 질서유지 등의 직무를 수행하는 경찰은 경찰관 직무집행법 , 형사소송법 등 관련 법령에서 부여한 여러 권한을 제반 상황에 대응하여 적절하게 행사하여 필요한 조치를 취할 수 있고, 그 권한은 일반적으로 경찰관의 전문적 판단에 기한 합리적인 재량에 위임되어 있지만, 경찰관에게 권한을 부여한 취지와 목적에 비추어 볼 때 구체적인 사정에 따라 경찰관이 그 권한을 행사하여 필요한 조치를 취하지 아니하는 것이 현저하게 불합리하다고 인정되는 경우에는 그러한 권한의 불행사는 직무상의 의무를 위반한 것이 되어 위법하게 된다.",2,0,""],["2022-2","경찰학",26,"경찰청과 그 소속기관 직제 상 경찰청 생활안전국장의 분장사항에 해당하지 않는 것은 모두 몇 개인가? ㉠ 아동 청소년 대상 성매매 사범에 대한 지도 및 단속 ㉡ 경비업에 관한 연구 및 지도 ㉢ 아동학대 수사 및 피해자 보호에 관한 업무 ㉣ 청원경찰의 운영 및 지도 ㉤ 교통사고 교통범죄에 관한 수사 지휘 감독 ㉥ 각종 안전사고의 예방에 관한 사항","2개","3개","4개","5개",2,0,""],["2022-2","경찰학",27,"행정의 법률적합성 원칙(법치행정의 원칙)에 관한 설명 중 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","법치행정의 원칙에 관한 전통적 견해는 ‘법률의 지배’, ‘법률의 우위’, ‘법률의 유보’를 내용으로 한다.","‘법률의 우위’에서의 법률에는 형식적 의미의 법률뿐만 아니라 그 밖에 성문법과 불문법이 포함된다.","법규명령에는 위임명령과 집행명령이 있으며, 모두 국민의 권리 의무에 관한 사항을 규정할 수 있다.","법령의 구체적 위임 없이 최루액의 혼합 살수 방법 등을 규정한 경찰청장의 살수차운용지침 (2014. 4. 3.)은 법률유보의 원칙에 위배되는 측면이 있으나, 그 지침에 따라 살수한 경찰관의 행위는 집회를 해산하기 위한 불가피한 조치라는 점에서 반드시 위헌 위법이라 할 수 없다.",1,0,""],["2022-2","경찰학",28,"경찰관청의 ‘권한의 대리’와 ‘권한의 위임’에 관한 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","권한을 위임받은 수임청은 자기의 이름 및 자기의 책임으로 권한을 행사한다.","수임청 및 피대리관청은 항고소송에서 피고가 된다.","법정대리의 경우 피대리관청이 사고 등으로 인해 공석이므로 대리의 법적 효과는 대리관청에 귀속된다.","국가경찰과 자치경찰의 조직 및 운영에 관한 법률 상 “경찰 청장이 부득이한 사유로 직무를 수행할 수 없을 때에는 경찰청 차장이 그 직무를 대행한다”는 대리방식을 ‘협의의 법정대리’ 라고 한다.",2,0,""],["2022-2","경찰학",29,"동기부여이론에 관한 설명과 학자가 가장 적절하게 연결된 것은? ㉠ 인간은 자신의 욕구를 충족시키기 위해서 노력하며 하위 단계의 욕구가 충족되어야 다음 단계로 발전되는 순차적 특성을 갖는다. ㉡ Y이론적 인간형은 부지런하고, 책임과 자율성 및 창의성을 발휘하기를 좋아하고, 스스로 통제와 발전이 가능하기 때문에 민주적이고 인간적인 동기유발 전략이 필요한 유형이다. ㉢ 인간의 개인적 성격과 성격의 성숙과정을 ‘미성숙에서 성숙 으로’라고 보고, 관리자는 조직 구성원을 최대의 성숙상태로 실현시켜야 한다고 하였다. ㉣ 위생요인을 제거해주는 것은 불만을 줄여주는 소극적 효과일 뿐이기 때문에, 근무태도 변화에 단기적 영향을 주어 사기는 높여줄 수 있으나 생산성을 높여주지는 못한다. 만족요인이 충족되면 자기실현욕구를 자극하여, 적극적 만족을 유발하고 동기유발에 장기적 영향을 준다.","㉠ 매슬로우(Maslow) ㉡ 맥그리거(McGregor) ㉢ 아지리스(Argyris) ㉣ 허즈버그(Herzberg)","㉠ 매슬로우(Maslow) ㉡ 아지리스(Argyris) ㉢ 맥그리거(McGregor) ㉣ 허즈버그(Herzberg)","㉠ 매슬로우(Maslow) ㉡ 맥그리거(McGregor) ㉢ 허즈버그(Herzberg) ㉣ 아지리스(Argyris)","㉠ 맥그리거(McGregor) ㉡ 아지리스(Argyris) ㉢ 허즈버그(Herzberg) ㉣ 매슬로우(Maslow)",0,0,""],["2022-2","경찰학",30,"경찰의 근무성적평정에 관한 설명 중 가장 적절하지 않은 것은?","공무원에 대한 근무성적평정은 현대에 이르러 조직발전의 기초로 작용하는 공무원의 능력개발과 행정제도개선의 수단으로도 활용될 수 있다.","전통적 근무성적평정제도는 생산성과 능률성에 중점을 두어 공무원의 직무수행능력을 측정하고 이를 인사행정의 표준화와 직무수행의 통제를 위한 수단으로 활용하였다.","근무성적평정과정에서 평정자에 의한 집중화 엄격화 등의 오류를 방지하기 위해 경찰서 수사과에서 고소 고발 등에 대한 조사업무를 직접 처리하는 경위 계급의 경찰공무원의 제2 평정요소에 따른 근무성적 평정은 수 20%, 우 40%, 양 30%, 가 10%로 분배해야 한다.","총경에 대한 근무성적평정은 매년 하되, 근무실적, 직무수행능력 및 직무수행태도로만 평정한다.",2,0,""],["2022-2","경찰학",31,"경찰공무원 관련 법령에 따를 때, 경찰공무원의 신분변동에 관한 설명 중 가장 적절한 것은?","중징계 의결이 요구 중인 경찰공무원 甲에 대해 직위해제처분을 할 경우, 임용권자는 3개월의 범위 내에서 대기를 명하고 능력 회복이나 근무성적의 향상을 위한 교육훈련 또는 특별한 연구 과제의 부여 등 필요한 조치를 하여야 한다.","위원장 포함 12명이 출석하여 구성된 징계위원회에서 정직 3월 2명, 정직 1월 2명, 감봉 3월 1명, 감봉 2월 1명, 감봉 1월 3명, 견책 3명으로 의견이 나뉜 경우, 감봉 1월로 의결해야 한다.","자치경찰사무를 담당하는 OO경찰서 소속 경위 乙의 경감으로의 승진임용을 시 도지사가 하므로, 경위 乙에 대한 휴직이나 복직도 시 도지사가 한다.","순경 채용후보자 명부에 등재된 채용후보자 丙이 학업을 계속 하고자 이를 증명할 수 있는 자료를 첨부하여 임용권자가 정하는 기간 내에 원하는 유예기간을 적어 신청할 경우, 임용권자는 채용후보자 명부의 유효기간 범위에서 기간을 정하여 임용을 유예해야 한다.",null,2,"경찰청 공개 정답에 이 문항의 정답이 없는 것으로 표시된 문항입니다(출제 오류 처리)."],["2022-2","경찰학",32,"경찰작용 및 경찰공무원을 통제하는 행정기관의 역할과 기능에 관한 설명 중 옳은 것을 모두 고른 것은? ㉠ 행정심판위원회는 경찰관청의 위법한 처분 및 대통령의 부작위에 대해서 심리하여 침해된 국민의 권리를 구제하고 경찰행정의 적정한 운영을 도모한다. ㉡ 시 도자치경찰위원회는 자치경찰사무 담당 경찰공무원에 대한 징계를 요구할 수 있다. ㉢ 국민권익위원회는 누구든지 경찰공무원 등의 부패행위를 알게 된 때에는 무기명으로 신고할 수 있도록 하고 있다. ㉣ 인사혁신처에 소청심사위원회를 설치하여, 경찰공무원이 징계 처분, 그 밖에 그 의사에 반하는 불리한 처분이나 부작위를 구제받을 수 있도록 하고 있다. ㉤ 국가인권위원회는 경찰기관 및 경찰공무원 등에 의한 인권 침해행위 또는 차별행위에 대해 조사하고 구제할 수 있다. ㉥ 감사원은 국회 법원 및 헌법재판소를 포함한 모든 국가기관 및 그에 소속한 공무원의 사무를 감찰하여 비위를 적발하고 시정한다.","㉠㉢㉤","㉡㉣㉤","㉡㉢㉣","㉢㉣㉥",1,0,""],["2022-2","경찰학",33,"112종합상황실 운영 및 신고처리 규칙 에 관한 설명 중 가장 적절하지 않은 것은?","시 도경찰청장 및 경찰서장이 112요원을 배치할 때에는 관할 구역 내 지리감각, 언어 능력 및 상황 대처능력이 뛰어난 경찰 공무원을 선발 배치하여야 하며, 근무기간은 1년 이상으로 한다.","112요원은 접수한 신고의 내용이 code 3의 유형에 해당하는 경우에는 출동요소에 지령하지 않고 자체 종결하거나 소관기관이나 담당 부서에 신고내용을 통보하여 처리하도록 조치하여야 한다.","112신고 이외 경찰관서별 일반전화 또는 직접 방문 등으로 경찰관의 현장출동을 필요로 하는 사건의 신고를 한 경우 해당 신고를 받은 자가 접수한다. 이때 접수한 자는 112시스템에 신고내용을 입력하여야 한다.","112종합상황실 자료 중 접수처리 입력자료는 1년간 보존하고, 무선지령내용 녹음자료는 24시간 녹음하고 3개월간 보존한다.",0,0,""],["2022-2","경찰학",34,"스토킹범죄의 처벌 등에 관한 법률 상 처리절차에 관한 설명 중 옳은 것은 모두 몇 개인가? ㉠ 사법경찰관은 스토킹행위 신고와 관련하여 스토킹행위가 지속적 또는 반복적으로 행하여질 우려가 있고 스토킹범죄의 예방을 위하여 긴급을 요하는 경우, 스토킹행위자에게 직권 으로 또는 스토킹행위의 상대방이나 그 법정대리인 또는 스토킹행위를 신고한 사람의 요청에 의하여, 스토킹행위의 상대방이나 그 주거등으로부터 100미터 이내의 접근 금지, 전기통신기본법 제2조 제1호의 전기통신을 이용한 접근 금지 등의 조치를 할 수 있다. ㉡ 사법경찰관은 긴급응급조치를 하였을 때에는 지체 없이 검사 에게 해당 긴급응급조치에 대한 사후승인을 지방법원 판사에게 청구하여 줄 것을 신청하여야 하며, 신청을 받은 검사는 긴급 응급조치가 있었던 때부터 48시간 이내에 지방법원 판사에게 해당 긴급응급조치에 대한 사후승인을 청구한다. ㉢ 긴급응급조치기간은 1개월을 초과할 수 없다. ㉣ 법원은 스토킹범죄의 원활한 조사 심리 또는 피해자 보호를 위하여 잠정조치가 필요하다고 인정하는 경우에는 결정으로 스토킹행위자를 경찰관서의 유치장 또는 구치소에 1개월을 초과하지 않는 범위에서 유치할 수 있다. 다만 법원은 피해자의 보호를 위하여 그 기간을 연장할 필요가 있다고 인정하는 경우에는 결정으로 2개월의 범위에서 연장할 수 있다.","1개","2개","3개","4개",2,0,""],["2022-2","경찰학",35,"아동 청소년의 성보호에 관한 법률 에 관한 설명 중 가장 적절하지 않은 것은?","사법경찰관리는 아동 청소년의 성보호에 관한 법률 제11조 및 제15조의2의 죄, 아동 청소년에 대한 성폭력범죄의 처벌 등에 관한 특례법 제14조 제2항 및 제3항의 죄에 해당하는 ‘디지털 성범죄’에 대하여 신분을 비공개하고 범죄현장(정보통신망 포함) 또는 범인으로 추정되는 자들에게 접근하여 범죄행위의 증거 및 자료 등을 수집할 수 있다.","사법경찰관리가 신분비공개수사를 진행하고자 할 때에는 사전에 상급 경찰관서 수사부서의 장의 승인을 받아야 한다. 이 경우 그 수사기간은 1개월을 초과할 수 없다.","사법경찰관리는 신분위장수사를 하려는 경우에는 검사에게 신분위장수사에 대한 허가를 신청하고, 검사는 법원에 그 허가를 청구한다. 다만 신분위장수사 절차를 거칠 수 없는 긴급을 요하는 때에는 동법 제25조의2 제2항의 요건을 구비하고 법원의 허가 없이 신분위장수사를 할 수 있다. 이 경우, 사법경찰관리는 신분위장수사 개시 후 지체 없이 검사에게 허가를 신청하여야 하고, 48시간 이내에 법원의 허가를 받지 못한 때에는 즉시 신분위장수사를 중지하여야 한다.","국가수사본부장은 신분비공개수사가 종료된 즉시 대통령령으로 정하는 바에 따라 국가경찰위원회에 수사 관련 자료를 보고하여야 하며, 국가수사본부장은 대통령령으로 정하는 바에 따라 국회 소관 상임위원회에 신분비공개수사 관련 자료를 반기별로 보고하여야 한다.",1,0,""],["2022-2","경찰학",36,"실종아동등의 보호 및 지원에 관한 법률 과 실종아동등 및 가출인 업무처리 규칙 에 관한 설명 중 옳은 것은 모두 몇 개인가? ㉠ ‘장기실종아동등’이라 함은 보호자로부터 이탈한지 48시간이 경과한 후에도 발견되지 않은 ‘찾는실종아동등’을 말한다. ㉡ 경찰관서의 장은 실종아동등의 발생 신고를 접수하면 24시간 이내에 수색 또는 수사의 실시여부를 결정하여야 한다. ㉢ 발견된 18세 미만 아동 및 가출인의 경우, 실종아동등 프로 파일링시스템에 등록된 자료는 수배 해제 후로부터 10년간 보관한다. ㉣ 실종아동등 프로파일링시스템에 등록된 미발견자의 자료는 소재 발견시까지 보관한다. ㉤ 경찰관서의 장은 실종아동등에 대하여 실종아동등 및 가출인 업무처리 규칙 제18조에 따른 현장 탐문 및 수색 후, 그 결과를 즉시 보호자에게 통보하여야 한다. 이후에는 실종 아동등 프로파일링시스템에 등록한 날로부터 1개월까지는 15일에 1회, 1개월이 경과한 후부터는 분기별 1회 보호자에게 추적 진행사항을 통보한다.","1개","2개","3개","4개",1,0,""],["2022-2","경찰학",37,"성폭력범죄의 수사 및 피해자 보호에 관한 규칙 에 관한 설명 중 가장 적절하지 않은 것은?","경찰관은 성폭력범죄의 피해자가 13세 미만이거나 신체적인 또는 정신적인 장애로 사물을 변별하거나 의사를 결정할 능력이 미약한 경우에는 통합지원센터나 성폭력 전담의료기관과 연계하여 치료, 상담 및 조사를 병행한다. 다만, 피해자가 원하지 않는 경우에는 그러하지 아니하다.","경찰서장은 특별한 사정이 없는 한 성폭력 피해여성을 여성 성폭력범죄 전담조사관이 조사하도록 하여야 한다. 다만, 피해자가 원하는 경우에는 신뢰관계자, 진술조력인 또는 다른 경찰관으로 하여금 입회하게 하고 ‘피해자 조사 동의서’에 서면으로 동의를 받아 남성 성폭력범죄 전담조사관으로 하여금 조사하게 할 수 있다.","경찰관은 영상녹화를 할 때에는 피해자등에게 영상녹화의 취지 등을 설명하고 동의 여부를 확인하여야 하며, 피해자등이 녹화를 원하지 않는 의사를 표시한 때에는 촬영을 하여서는 아니 된다. 다만, 가해자가 친권자 중 일방인 경우에는 그러하지 아니하다.","경찰관은 성폭력범죄의 피해자가 13세 미만이거나 신체적인 또는 정신적인 장애로 의사소통이나 의사표현에 어려움이 있는 경우 진술조력인을 조사과정에 반드시 참여시켜야 한다.",3,0,""],["2022-2","경찰학",38,"행사안전경비에서 군중정리의 원칙에 관한 설명 중 가장 적절하지 않은 것은?","밀도의 희박화 - 제한된 면적의 특정한 지역에 사람이 많이 모이면 상호간에 충돌현상이 나타나고 혼잡이 야기되므로, 차분한 목소리로 안내방송을 진행함으로써 사전에 혼잡상황을 대비하여 사고를 방지할 수 있다.","이동의 일정화 - 군중은 현재의 자기 위치와 갈 곳을 잘 몰라 불안감과 초조감을 갖게 되므로 일정방향과 속도로 이동을 시켜 주위의 상황을 파악할 수 있는 여건을 조성시킴으로써 심리적 안정감을 갖도록 하는 것이다.","경쟁적 사태의 해소 - 다른 사람보다 먼저 가려는 심리상태를 억제시켜 질서 있게 행동하면 모든 일이 잘 될 수 있다는 것을 납득시키는 것이다. 이 경우 질서를 지키면 오히려 손해를 본다는 심리상태가 형성되지 않도록 주의하여야 한다.","지시의 철저 - 분명하고 자세한 안내방송을 계속함으로써 혼잡한 사태를 회피하고 사고를 방지할 수 있다.",0,0,""],["2022-2","경찰학",39,"집회 및 시위에 관한 법률 에 관한 다음 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","집회의 신고가 경합할 경우, 먼저 신고된 집회의 목적, 장소 및 시간, 참여예정인원, 집회 신고인이 기존에 신고한 집회 건수와 실제로 집회를 개최한 비율 등 먼저 신고된 집회의 실제 개최 가능성 여부와 양 집회의 상반 또는 방해가능성 등 제반 사정을 확인하여 먼저 신고된 집회가 다른 집회의 개최를 봉쇄하기 위한 허위 또는 가장 집회신고에 해당함이 객관적으로 분명해 보이는 경우라도 관할 경찰관서장이 뒤에 신고된 집회에 대하여 금지통고를 했다면, 이러한 금지통고에 위반하여 집회를 개최한 행위는 집회 및 시위에 관한 법률 에 위배된다.","질서유지선이 집회 및 시위의 보호와 공공의 질서유지를 위하여 필요하다고 인정되는 최소한의 범위를 정하여 설정되고 집회 및 시위에 관한 법률 시행령 관련 조항에서 정한 사유에 해당한다면, 집회 또는 시위가 이루어지는 장소 외곽의 경계 지역뿐 아니라 집회 또는 시위의 장소 안에도 설정할 수 있다.","경찰관들이 옥외집회 또는 시위 장소에서 줄지어 서는 등의 방법으로 소위 ‘사실상 질서유지선’의 역할을 수행한다고 하더 라도 이를 가리켜 집회 및 시위에 관한 법률 에서 정한 질서 유지선이라고 할 수는 없다.","집회·시위 참가자들이 관할 경찰관서에 신고하지 않고 집회를 개최한 경우, 그 옥외집회 또는 시위로 인하여 타인의 법익이나 공공의 안녕질서에 대한 직접적인 위험이 명백하게 초래되지 않은 상황에서 경찰이 ‘미신고집회’라는 사유로 자진 해산 요청을 한 후, ‘불법적인 행진시도’, ‘불법 도로 점거로 인한 도로교통법 제68조 제3항 제2호 위반’이라는 사유로 3회에 걸쳐 해산명령을 하였더라도 정당한 해산명령에 해당하지 않는다.",0,0,""],["2022-2","경찰학",40,"도로교통법 및 관련 법령에 따를 때, 다음 설명 중 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","운전자가 음주운전으로 교통사고를 야기한 후, 차에서 내려 피해자(진단 3주)에게 ‘왜 와서 들이받냐’라는 말을 하고, 교통 사고 조사를 위해 경찰서에 가자는 경찰관의 지시에 순순히 응하여 순찰차에 스스로 탑승하여 경찰서까지 갔을 뿐 아니라 경찰서에서 조사받으면서 사고 당시 상황에 대한 자신의 주장 을 정확하게 진술하였다면, 비록 경찰관이 작성한 주취운전자 정황진술보고서에는 ‘언행상태’란에 ‘발음 약간 부정확’, ‘보행 상태’란에 ‘비틀거림이 없음’, ‘운전자 혈색’란에 ‘안면 홍조 및 눈 충혈’이라고 기재되어 있다고 하더라도 음주로 인한 특정 범죄 가중처벌 등에 관한 법률 위반(위험운전치사상)이 아니라 도로교통법 위반(음주운전)으로 처벌해야 한다.","도로교통법 및 관련 법령에는 연습운전면허를 발급받은 사람이 본인에게 귀책사유(歸責事由)가 없는 경우 등 대통령령 으로 정하는 경우를 제외하고, 운전 중 고의 또는 과실로 교통사고를 일으키거나 도로교통법 이나 동법에 따른 명령 또는 처분을 위반한 경우에 시 도경찰청장은 연습운전면허를 취소하여야 한다고 규정하고 있으므로, 연습운전면허를 받은 사람이 운전을 함에 있어 주행연습 외의 목적으로 운전하여서는 아니된다는 준수사항을 지키지 않았다고 하더라도 무면허운전 으로 처벌할 수는 없다.","도로교통법 상 도로가 아닌 곳에서 술에 취한 상태에서의 운전은 음주운전으로는 처벌할 수 있지만 운전면허의 정지 또는 취소처분을 부과할 수는 없다.","개인형 이동장치를 타고 신호위반, 중앙선 침범과 진로변경 금지 위반행위를 연달아 하여 다른 사람에게 위협 또는 위해를 가할 뿐 아니라 교통상의 위험을 발생하게 한 운전자에 대해 난폭운전으로 처벌할 수 있다.",3,0,""],["2023-1","헌법",1,"헌법의 개념에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","관습헌법도 성문헌법과 마찬가지로 주권자인 국민의 헌법적 결단의 의사 표현이고 성문헌법과 동등한 효력을 가지며, 관습헌법의 요건들은 그 성립의 요건일 뿐 효력 유지의 요건은 아니다.","관습헌법이 성립하기 위하여서는 관습이 성립하는 사항이 단지 법률로 정할 사항이 아니라 반드시 헌법에 의하여 규율되어 법률에 대하여 효력상 우위를 가져야 할 만큼 헌법적으로 중요한 기본적 사항이 되어야 한다.","일반적인 헌법사항 중 과연 어디까지가 기본적이고 핵심적인 헌법사항에 해당하는지 여부는 일반추상적인 기준을 설정하여 재단할 수는 없고, 개별적 문제사항에서 헌법적 원칙성과 중요성 및 헌법원리를 통하여 평가하는 구체적 판단에 의하여 확정하여야 한다.","성문헌법이라고 하여도 그 속에 모든 헌법사항을 빠짐없이 완전히 규율하는 것은 불가능하고 또한 헌법은 국가의 기본법 으로서 간결성과 함축성을 추구하기 때문에 형식적 헌법전에는 기재되지 아니한 사항이라도 이를 불문헌법 내지 관습헌법으로 인정할 소지가 있다.",0,0,""],["2023-1","헌법",2,"헌법개정절차에 관한 설명으로 가장 적절하지 않은 것은?","헌법개정의 발의는 국회재적의원 과반수 또는 대통령에 의해 행해지며, 대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.","국회는 헌법개정안의 공고기간이 만료된 날로부터 60일 이내에 의결하여야 하며 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다.","헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다.","국민투표의 효력에 관하여 이의가 있는 투표인은 투표인 10만인 이상의 찬성을 얻어 중앙선거관리위원회위원장을 피고로 하여 투표일로부터 20일 이내에 대법원에 제소할 수 있다.",1,0,""],["2023-1","헌법",3,"헌법 전문(前文)과 기본원리에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","우리 헌법의 전문과 본문의 전체에 담겨있는 최고 이념은 국민주권주의와 자유민주주의에 입각한 입헌민주헌법의 본질적 기본원리에 기초하고 있다.","헌법 전문에서 “3.1운동으로 건립된 대한민국임시정부의 법통을 계승”한다고 선언하고 있는데 이는 대한민국이 일제에 항거한 독립운동가의 공헌과 희생을 바탕으로 이룩된 것임을 선언한 것이고, 그렇다면 국가는 일제로부터 조국의 자주독립을 위하여 공헌한 독립유공자와 그 유족에 대하여는 응분의 예우를 하여야 할 헌법적 의무를 지닌다.","통일정신, 국민주권원리 등은 우리나라 헌법의 연혁적･이념적 기초로서 헌법이나 법률해석에서의 해석기준으로 작용할 뿐만 아니라 그에 기하여 곧바로 국민의 개별적 기본권성이 도출된다.","우리 헌법이 제정되기 전의 일이라 할지라도 국가가 국민의 안전과 생명을 보호하여야 할 가장 기본적인 의무를 수행하지 못한 일제강점기에 일본군위안부로 강제 동원되어 인간의 존엄과 가치가 말살된 상태에서 장기간 비극적인 삶을 영위하였던 피해자들의 훼손된 인간의 존엄과 가치를 회복시켜야 할 의무는 대한민국임시정부의 법통을 계승한 지금의 정부가 국민에 대하여 부담하는 가장 근본적인 보호의무에 속한다. (일반공채･101경비단)",2,0,""],["2023-1","헌법",4,"공무원제도에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","선거에서 중립의무가 있는 구 ｢공직선거및선거부정방지법｣ 제9조의 ‘공무원’이란 원칙적으로 국가와 지방자치단체의 모든 공무원 즉, 좁은 의미의 직업공무원은 물론이고, 대통령, 국무총리, 국무위원, 지방자치단체의 장을 포함한다.","국회의원과 지방의회의원은 정당의 대표자이자 선거운동의 주체로서의 지위로 말미암아 선거에서의 정치적 중립성이 요구될 수 없으므로 구 ｢공직선거및선거부정방지법｣ 제9조의 ‘공무원’에 해당하지 않는다.","선거에서 대통령의 중립의무는 헌법 제7조 제2항이 보장하는 직업공무원제도로부터 나오는 헌법적 요청이다.","직업공무원제도는 헌법과 법률에 의하여 공무원의 신분이 보장되는 공직구조에 관한 제도이며, 여기서 말하는 공무원에는 정치적 공무원이라든가 임시적 공무원은 포함되지 않는다.",2,0,""],["2023-1","헌법",5,"기본권 주체에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","법인도 그 성질에 반하지 않는 범위 내에서 인격권의 한 내용인 사회적 신용이나 명예 등의 주체가 될 수 있으나, 방송사업자가 심의규정을 위반한 경우 그 의사에 반하여 ‘시청자에 대한 사과’를 명령할 수 있도록 규정한 구 ｢방송법｣ 조항은 방송 사업자의 인격권을 제한하는 것은 아니다.","외국인에게는 제한적으로 직업의 자유에 대한 기본권주체성을 인정할 수 있는데, 근로관계가 형성되기 전단계인 특정한 직업을 선택할 수 있는 권리는 국가정책에 따라 법률로써 외국인에게 제한적으로 허용되는 것이지 헌법상 기본권에서 유래되는 것은 아니다.","아직 모체에 착상되거나 원시선이 나타나지 않은 초기배아는 독립된 인간과 배아 간 개체적 연속성을 확정하기 어렵고, 배아는 모태 속에서 수용될 때 비로소 독립적인 인간으로의 성장가능성을 기대할 수 있어 기본권 주체성을 인정하기 어렵다.","사자(死者)에 대한 사회적 명예와 평가의 훼손은 사자와의 관계를 통하여 스스로의 인격상을 형성하고 명예를 지켜온 그들 후손의 인격권, 즉 유족의 명예 또는 유족의 사자에 대한 경애추모의 정을 침해한다.",0,0,""],["2023-1","헌법",6,"국가의 기본권보호의무에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","선거운동을 위한 확성장치를 허용할 공익적 필요성이 인정된다고 하더라도 정온한 생활환경이 보장되어야 할 주거지역에서 사용시간과 사용지역에 따른 수인한도 내에서 확성장치의 최고출력 내지 소음 규제기준에 관한 규정을 두지 아니한 ｢공직 선거법｣ 조항은 주거지역 거주자의 건강하고 쾌적한 환경에서 생활할 권리를 침해한다.","｢담배사업법｣은 담배성분의 표시나 경고문구의 표시, 담배광고의 제한 등 여러 규제들을 통하여 직접흡연으로부터 국민의 생명･ 신체의 안전을 보호하려고 노력하고 있어, ｢담배사업법｣이 국가의 보호의무에 관한 과소보호금지 원칙을 위반하여 흡연자의 생명･ 신체의 안전에 관한 권리를 침해하였다고 볼 수 없다.","업무상과실 또는 중대한 과실로 인한 교통사고로 말미암아 피해자로 하여금 상해에 이르게 하였으나 보험 등에 가입한 경우 운전자에 대한 공소를 제기할 수 없도록 한 구 ｢교통사고처리 특례법｣ 조항은 교통사고 피해자의 생명･신체의 안전에 관한 국가의 기본권 보호의무를 명백히 위반한 것이다.","｢민법｣ 조항들이 권리능력의 존재 여부를 출생시를 기준으로 확정하고 태아에 대해서는 살아서 출생할 것을 조건으로 손해 배상청구권을 인정하더라도 태아에 대한 국가의 생명권 보호 의무를 위반한 것이라 볼 수 없다.",2,0,""],["2023-1","헌법",7,"인격권에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 범죄사실에 관한 보도 과정에서 대상자의 실명 공개에 대한 공공의 이익이 대상자의 명예나 사생활의 비밀에 관한 이익보다 우월하다고 인정되어 실명에 의한 보도가 허용되는 경우에는, 비록 대상자의 의사에 반하여 그의 실명이 공개 되었다고 하더라도 그의 성명권이 위법하게 침해되었다고 할 수 없다. ㉡ 입양이나 재혼 등과 같이 가족관계의 변동과 새로운 가족 관계의 형성에 있어서 구체적인 사정들에 따라서는 양부 또는 계부의 성으로의 변경이 개인의 인격적 이익과 매우 밀접한 관계를 가짐에도 부성(父姓)의 사용만을 강요하여 성의 변경을 허용하지 않는 것은 개인의 인격권을 침해한다. ㉢ 사법경찰관이 보험사기범 검거라는 보도자료 배포 직후 기자들의 취재 요청에 응하여 피의자가 경찰서 조사실에서 양손에 수갑을 찬 채 조사받는 모습을 촬영할 수 있도록 허용한 행위는 과잉금지원칙에 위반되어 피의자의 인격권을 침해한다. ㉣ 지역아동센터의 시설별 신고정원의 80% 이상을 돌봄취약 아동으로 구성하도록 한 보건복지부 ‘2019년 지역아동센터 지원 사업안내’ 관련 부분은 돌봄취약아동과 일반아동을 분리함 으로써 아동들의 인격권을 침해한다.","㉠㉣","㉠㉡㉢","㉡㉢㉣","㉠㉡㉢㉣",1,0,""],["2023-1","헌법",8,"평등권에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","재산권의 청구는 공법상의 법률관계를 전제로 하는 당사자소송 이라는 점에서 민사소송과 본질적으로 달라, 국가를 상대로 한 당사자소송에서 가집행선고를 제한하는 ｢행정소송법｣ 조항은 국가만을 차별적으로 우대하는 데 합리적 이유가 있으므로 평등원칙에 위반되지 않는다.","애국지사 본인과 순국선열의 유족은 본질적으로 다른 집단이므로 구 ｢독립유공자예우에 관한 법률 시행령｣ 조항이 순국선열의 유족보다 애국지사 본인에게 높은 보상금 지급액 기준을 두고 있다고 하여 순국선열의 유족의 평등권이 침해되었다고 볼 수 없다.","보상금의 지급을 신청할 수 있는 자의 범위를 ‘내부 공익신고자’로 한정함으로써 ‘외부 공익신고자’를 보상금 지급대상에서 배제 하도록 정한 ｢공익신고자 보호법｣ 조항 중 ‘내부 공익신고자’ 부분은 평등원칙에 위배되지 않는다.","학생 선발시기 구분에 있어 ｢초･중등교육법 시행령｣ 조항이 자사고를 후기학교로 규정함으로써 과학고와 달리 취급하고, 일반고와 같이 취급하는 데에는 합리적인 이유가 있으므로 자사고 학교법인의 평등권을 침해하지 아니한다.",0,0,""],["2023-1","헌법",9,"명확성원칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공익을 해할 목적으로 전기통신설비에 의하여 공연히 허위의 통신을 한 자를 형사 처벌하는 구 ｢전기통신사업법｣ 조항은, 수범자인 국민에 대하여 일반적으로 허용되는 ‘허위의 통신’ 가운데 어떤 목적의 통신이 금지되는 것인지 고지하여 주지 못하므로 표현의 자유에서 요구하는 명확성원칙에 위배된다.","사회복무요원의 정치적 행위를 금지하는 ｢병역법｣ 조항 중 ‘정치적 목적을 지닌 행위’는 ‘특정 정당, 정치인을 지지･반대 하거나 공직선거에 있어서 특정 후보자를 당선･낙선하게 하는 등 그 정파성･당파성에 비추어 정치적 중립성을 훼손할 가능성이 높은 행위’로 한정하여 해석되므로 명확성원칙에 위배되지 않는다.","｢청원경찰법｣상 품위손상행위란 ‘청원경찰이 경찰관에 준하여 경비 및 공안업무를 하는 주체로서 직책을 맡아 수행해 나가기에 손색이 없는 인품에 어울리지 않는 행위를 함으로써 국민이 가지는 청원경찰에 대한 정직성, 공정성, 도덕성에 대한 믿음을 떨어뜨릴 우려가 있는 행위’라고 해석할 수 있으므로 명확성 원칙에 위배되지 않는다.","‘여러 사람의 눈에 뜨이는 곳에서 공공연하게 알몸을 지나치게 내놓거나 가려야 할 곳을 내놓아 다른 사람에게 부끄러운 느낌이나 불쾌감을 준 사람’을 처벌하는 구 ｢경범죄 처벌법｣ 조항은 무엇이 지나친 알몸노출행위인지 판단하기 쉽지 않고, ‘가려야 할 곳’의 의미도 알기 어려우며, ‘부끄러운 느낌이나 불쾌감’을 통하여 ‘지나치게’와 ‘가려야 할 곳’ 의미를 확정하기도 곤란하여 죄형법정주의의 명확성원칙에 위배된다.",1,0,""],["2023-1","헌법",10,"적법절차에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","징계절차를 진행하지 아니함을 통보하지 않은 경우에는 징계시효가 연장되지 않는다는 예외규정을 두지 않은 구 ｢지방공무원법｣ 조항은, 수사 중인 사건에 대하여 징계절차를 진행하지 않음에도 징계시효가 당연히 연장되어 징계혐의자는 징계시효가 연장되는지를 알지 못한 채 불이익을 입을 수 있어 적법절차원칙에 위배된다.","관계행정청이 등급분류를 받지 아니하거나 등급분류를 받은 게임물과 다른 내용의 게임물을 발견한 경우 관계공무원으로 하여금 이를 영장없이 수거･폐기하게 할 수 있도록 한 구 ｢음반･ 비디오물및게임물에관한법률｣ 조항은 그 소유자 또는 점유자에게 수거증을 교부하도록 하는 등 절차적 요건을 규정하고 있어 적법절차원칙에 위배되지 않는다.","검사가 법원의 증인으로 채택된 수감자를 그 증언에 이르기까지
