t":"기초생활수급자 또는 ｢임대차보호법｣상 소액임차인의 청구권을 면책제외채권에 포함시키지 아니한 ｢채무자 회생 및 파산에 관한 법률｣ 제625조 제2항은 개인회생제도의 목적 달성을 위한 불가피한 규율에 해당하므로 과잉금지원칙을 위반하여 청구인의 재산권을 침해하지 않는다. (25.2차)","answer":true,"quote":"개인회생에서 기초생활수급자나 소액임차인의 청구권을 면책제외채권으로 두지 않은 것은 제도 목적상 불가피한 규율로, 재산권을 침해하지 않는다.","cite":"헌재 2020헌마727","badge":"","topic":"","from":"GY-2025-2-H-09","seq":null},{"id":"H-OX-071","subject":"헌법","unit":"기본권론","stmt":"종교시설의 건축행위에만 기반시설부담금을 면제한다면 국가가 종교를 지원하여 종교를 승인하거나 우대하는 것으로 비칠 소지가 있어 헌법 제20조 제2항의 국교금지 정교분리에 위배 될 수도 있다. (22.2차)","answer":true,"quote":"종교시설에만 부담금을 면제하면 국가가 종교를 우대하는 것으로 비칠 수 있어, 오히려 국교금지·정교분리에 어긋날 수 있다.","cite":"헌재 2007헌바131","badge":"","topic":"","from":"GY-2022-2-H-12","seq":null},{"id":"H-OX-340","subject":"헌법","unit":"통치구조론","stmt":"헌법재판소는 현행헌법상 ‘민주적 기본질서’의 주요한 요소로 국민주권의 원리, 기본적 인권의 존중, 권력분립제도, 복수정당 제도 등을 들고 있다. (26.1차)","answer":true,"quote":"민주적 기본질서의 요소는 국민주권·기본적 인권 존중·권력분립·복수정당제 등이고, 정당해산은 이 질서에 실질적 해악을 끼칠 구체적 위험이 있을 때만 한다.","cite":"헌법 제8조","badge":"","topic":"","from":"GY-2026-1-H-01","seq":null},{"id":"H-OX-337","subject":"헌법","unit":"통치구조론","stmt":"명의신탁이 증여로 의제되는 경우 명의신탁의 당사자에게 ‘증여세의 과세가액 및 과세표준을 납세지관할세무서장에게 신고할 의무’를 부과하는 구 ｢상속세 및 증여세법｣ 조항이 형사상 불리한 진술을 강요하는 것이라고 볼 수 없으므로, 이들 조항으로 인하여 헌법 제12조 제2항에 규정된 청구인의 진술거부권이 제한된다고 볼 수 없다. (25.2차)","answer":true,"quote":"명의신탁이 증여로 의제되는 경우 명의신탁의 당사자에게 ‘증여세의 과세가액 및 과세표준을 납세지관할세무서장에게 신고할 의무’(이하 ‘증여세 신고의무’라고 한다)를 부과하는 구 ‘상속세 및 증여세법’ 제68조 제1항 본문의 ‘제4조의 규정에 의하여 증여세납세의무가 있는 자’ 가운데 제4조 제1항 본문 중 제41조의2 제1항 본문에 관한 부분, 같은 법 제68조 제1항 본문의 ‘제4조의 규정에 의하여 증여세납세의무가 있는 자’ 가운데 제4조 제4항 중 제41조의2 제1항 본문에 관한 부분 등(이하 ‘심판대상조항’이라 한다)이 일반적 행동의 자유를 침해하는지 여부(소극)","cite":"헌재 2019헌바225","badge":"","topic":"","from":"GY-2025-2-H-07","seq":null},{"id":"H-OX-304","subject":"헌법","unit":"통치구조론","stmt":"대통령도 국민의 한사람으로서 제한적으로나마 기본권의 주체가 될 수 있는바, 대통령은 소속 정당을 위하여 정당활동을 할 수 있는 사인으로서의 지위와 국민 모두에 대한 봉사자로서 공익 실현의 의무가 있는 헌법기관으로서의 지위를 동시에 갖는데 최소한 전자의 지위와 관련하여는 기본권 주체성을 갖는다고 할 수 있다. (22.1차)","answer":true,"quote":"대통령도 정당활동을 하는 사인의 지위에서는 기본권 주체가 되어 표현의 자유를 주장할 수 있다.","cite":"헌재 2007헌마700","badge":"","topic":"","from":"GY-2022-1-H-05","seq":null},{"id":"H-OX-322","subject":"헌법","unit":"통치구조론","stmt":"법령 등에 의하여 국가 또는 지방자치단체가 그 권한으로 행하는 정책결정에 관한 사항, 임용권의 행사 등 그 기관의 관리･운영에 관한 사항으로서 근무조건과 직접 관련되지 아니하는 사항을 공무원노동조합의 단체교섭 대상에서 제외하고 있는 ｢공무원의 노동조합 설립 및 운영 등에 관한 법률｣조항이 명확성의 원칙에 위반되는 것은 아니다. (23.2차)","answer":true,"quote":"다만, 법령 등에 의하여 국가 또는 지방자치단체가 그 권한으로 행하는 정책결정에 관한 사항, 임용권의 행사 등 그 기관의 관리ㆍ운영에 관한 사항으로서 근무조건과 직접 관련되지 아니하는 사항은 교섭의 대상이 될 수 없다.","cite":"헌재 2005헌마971","badge":"","topic":"","from":"GY-2023-2-H-16","seq":null},{"id":"H-OX-377","subject":"헌법","unit":"통치구조론","stmt":"｢군인사법｣ 제10조 제2항 제6호의4 나목 중 ｢아동복지법｣ 제17조 제2호 가운데 ‘아동에게 성적 수치심을 주는 성희롱 등의 성적 학대 행위로 형을 선고받아 그 형이 확정된 사람은 부사관으로 임용될 수 없도록 한 것’에 관한 부분은 공무담임권을 침해하지 않는다. (25.1차)","answer":false,"quote":"아동 성적 학대행위로 형이 확정된 사람의 부사관 임용을 기간 제한 없이 막는 것은 과잉금지원칙에 위배되어 공무담임권을 침해한다.","cite":"헌재 2020헌마1181","badge":"","topic":"","from":"GY-2025-1-H-16","seq":null},{"id":"H-OX-347","subject":"헌법","unit":"통치구조론","stmt":"지방자치단체의 장 선거에서 후보자 등록 마감시간까지 후보자 1인만이 등록한 경우 투표를 실시하지 않고 그 후보자를 당선인으로 결정하도록 하는 ｢공직선거법｣ 조항은 입법목적 달성에 필요한 범위를 넘은 과도한 제한이라 할 수 없어 청구인의 선거권을 침해하지 않는다. (26.1차)","answer":true,"quote":"지방자치단체장 선거에서 후보자가 1인뿐이면 투표 없이 당선인으로 정하는 것은 선거의 효율을 위한 것으로 선거권을 과도하게 제한하지 않는다.","cite":"헌재 2014헌마797 · 공직선거법 제191조 · 공직선거법 제188조","badge":"","topic":"","from":"GY-2026-1-H-14","seq":null},{"id":"H-OX-369","subject":"헌법","unit":"통치구조론","stmt":"안성시시설관리공단(이하 ‘공단’)의 상근직원이, 당원이 아닌 자에게도 투표권을 부여하는 당내경선에서 경선운동을 할 수 없도록 금지･처벌하는 ｢공직선거법｣ 조항의 해당 부분은 당내 경선의 공정성과 형평성 확보에 기여하여 공단 상근직원의 정치적 표현의 자유를 침해하지 않는다. (24.2차)","answer":false,"quote":"시설관리공단 상근직원은 경영에 실질적 영향력이 없어, 당내경선운동을 일률적으로 금지·처벌하면 정치적 표현의 자유를 침해한다.","cite":"헌재 2021헌가36","badge":"","topic":"","from":"GY-2024-2-H-14","seq":null},{"id":"H-OX-384","subject":"헌법","unit":"통치구조론","stmt":"국가기본도에 표시된 해상경계선은 그 자체로 불문법상 해상 경계선으로 인정될 수 없으므로, 관할 행정청이 국가기본도에 표시된 해상경계선을 기준으로 하여 과거부터 현재에 이르기까지 반복적으로 처분을 내리고, 지방자치단체가 허가, 면허 및 단속 등의 업무를 지속적으로 수행하여 왔더라도, 국가기본도상의 해상경계선은 여전히 지방자치단체 관할 경계에 관하여 불문법 으로서 그 기준이 될 수 없다. (26.1차)","answer":false,"quote":"국가기본도상 해상경계선 자체는 불문법이 아니지만, 그 선을 기준으로 처분과 단속이 오래 반복되었다면 불문법상 관할 경계의 기준이 될 수 있다.","cite":"헌재 2010헌라2","badge":"","topic":"","from":"GY-2026-1-H-03","seq":null},{"id":"H-OX-353","subject":"헌법","unit":"통치구조론","stmt":"국회는 헌법개정안의 공고기간이 만료된 날로부터 60일 이내에 의결하여야 하며 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다. (23.1차)","answer":false,"quote":"① 국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다.","cite":"헌법 제130조 제1항","badge":"","topic":"","from":"GY-2023-1-H-02","seq":null},{"id":"H-OX-302","subject":"헌법","unit":"통치구조론","stmt":"정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 정부는 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법재판소의 심판에 의하여 해산된다. (22.1차)","answer":true,"quote":"④ 정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 정부는 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법재판소의 심판에 의하여 해산된다.","cite":"헌법 제8조 제4항","badge":"","topic":"","from":"GY-2022-1-H-02","seq":null},{"id":"H-OX-365","subject":"헌법","unit":"통치구조론","stmt":"‘시민적 및 정치적 권리에 관한 국제규약’(이하 ‘자유권규약’)은 국내법체계상에서 법률적 효력을 가지므로, 헌법에서 명시적 으로 입법위임을 하고 있거나 우리 헌법의 해석상 입법의무가 발생하는 경우가 아니라도, 자유권규약이 명시적으로 입법을 요구하고 있거나 그 해석상 국가의 기본권보장의무가 인정되는 경우에는 곧바로 국가의 입법의무가 도출된다. (24.2차)","answer":false,"quote":"자유권규약은 법률의 효력만 가지므로, 헌법에 명시적 입법위임이나 해석상 입법의무가 없으면 규약만으로 입법의무가 생기지 않는다.","cite":"헌재 2020헌바475","badge":"","topic":"","from":"GY-2024-2-H-02","seq":null},{"id":"H-OX-356","subject":"헌법","unit":"통치구조론","stmt":"국회에 청원을 하려고 하는 자는 국회의원의 소개를 얻도록 한 ｢국회법｣ 조항은 행정편의적 목적을 위하여 국민의 청원권 행사를 의원 개인의 판단에 맡겨 놓아 사실상 청원권을 박탈하고 본질적인 내용을 침해하는 것이다. (23.1차)","answer":false,"quote":"국회 청원에 의원 소개를 받게 한 것은 무분별한 청원을 걸러 심사를 실효성 있게 하려는 것이라 청원권의 본질 침해가 아니다.","cite":"헌재 2005헌마604","badge":"","topic":"","from":"GY-2023-1-H-19","seq":null},{"id":"H-OX-372","subject":"헌법","unit":"통치구조론","stmt":"당사자 사이에 혼인의사의 합의가 없음을 원인으로 하는 혼인 무효판결에 의한 가족관계등록부 정정신청으로 해당 가족관계 등록부가 정정된 때, ‘그 혼인무효사유가 한쪽 당사자나 제3자의 범죄행위로 인한 경우’에 한정하여 등록부 재작성 신청권을 부여한 ‘가족관계등록부의 재작성에 관한 사무처리지침’ 조항은 혼인과 가족생활을 스스로 결정하고 형성할 수 있는 자유를 제한한다. (24.2차)","answer":false,"quote":"혼인무효 등록부의 재작성 제한은 신분등록 규정일 뿐 혼인·가족생활을 스스로 정할 자유를 제한하지 않고, 개인정보자기결정권 문제로 본다.","cite":"헌재 2020헌마65","badge":"","topic":"","from":"GY-2024-2-H-19","seq":null},{"id":"H-OX-380","subject":"헌법","unit":"통치구조론","stmt":"혼인 종료 후 300일 이내에 출생한 자를 전남편의 친생자로 추정하는 ｢민법｣ 조항은 자녀의 출생과 동시에 안정된 법적 지위를 갖추게 함으로써 법적 보호의 공백을 방지하는 기능을 수행한다는 점에서 합리성이 인정되므로, 입법재량의 한계를 준수한 것으로서 모가 가정생활과 신분관계에서 누려야 할 인격권, 혼인과 가족생활에 관한 기본권을 침해하지 아니한다. (25.2차)","answer":false,"quote":"혼인 종료 후 300일 안에 태어난 자녀를 예외 없이 전남편의 친생자로 추정하면 친생부인의 소로만 바로잡을 수 있어, 모의 가정생활·신분관계에 관한 기본권을 침해한다.","cite":"헌재 2013헌마623","badge":"","topic":"","from":"GY-2025-2-H-11","seq":null},{"id":"H-OX-321","subject":"헌법","unit":"통치구조론","stmt":"공무원이라 하더라도 그 지위를 이용하지 않고 사적인 지위에서 선거운동의 기획행위를 하는 것까지 금지하는 것은 선거의 공정성을 보장하려는 입법목적을 달성하기 위한 합리적인 차별 취급이라고 볼 수 없으므로 위 조항은 청구인 甲의 평등권을 침해한다. (23.2차)","answer":true,"quote":"공무원이 지위를 이용하지 않고 사적으로 하는 기획행위까지 금지하는 것은 선거 공정과 무관한 차별이라 평등권을 침해한다.","cite":"헌재 2006헌마1096","badge":"","topic":"","from":"GY-2023-2-H-06","seq":null},{"id":"H-OX-342","subject":"헌법","unit":"통치구조론","stmt":"주민자치제를 본질로 하는 민주적 지방자치제도가 안정적으로 뿌리내린 현 시점에서 지방자치단체의 장 선거권 역시 다른 선거권과 마찬가지로 헌법 제24조에 의해 보호되는 기본권으로 인정하여야 한다. (26.1차)","answer":true,"quote":"지방자치단체의 장 선거권도 다른 선거권처럼 헌법 제24조가 보호하는 기본권이고, 법률상 권리로 따로 떼어 볼 수 없다.","cite":"헌재 2014헌마797 · 헌법 제24조","badge":"","topic":"","from":"GY-2026-1-H-03","seq":null},{"id":"H-OX-350","subject":"헌법","unit":"통치구조론","stmt":"공직선거법 상 선거일 현재 1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람 및 그 형의 집행유예를 선고 받고 유예기간 중에 있는 사람은 선거권이 없다. (22.1차)","answer":false,"quote":"①선거일 현재 다음 각 호의 어느 하나에 해당하는 사람은 선거권이 없다. <개정 2004. 3. 12., 2005. 8. 4., 2015. 8. 13.> 1. 금치산선고를 받은 자 2. 1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람. 다만, 그 형의 집행유예를 선고받고 유예기간 중에 있는 사람은 제외한다. 3. 선거범, 「정치자금법」 제45조(정치자금부정수수죄) 및 제49조(선거비용관련 위반행위에 관한 벌칙)에 규정된 죄를 범한 자 또는 대통령ㆍ국회의원ㆍ지방의회의원ㆍ지방자치단체의 장으로서 그 재임중의 직무와 관련하여 「형법」(「특정범죄가중처벌 등에 관한 법률」 제2조에 의하여 가중처벌되는 경우를 포함한다) 제129조(수뢰, 사전수뢰) 내지 제132조(알선수뢰)ㆍ「특정범죄가중처벌 등에 관한 법률」 제3조(알선수재)에 규정된 죄를 범한 자로서, 100만원이상의 벌금형의 선고를 받고 그 형이 확정된 후 5년 또는 형의 집행유예의 선고를 받고 그 형이 확정된 후 10년을 경과하지 아니하거나 징역형의 선고를 받고 그 집행을 받지 아니하기로 확정된 후 또는 그 형의 집행이 종료되거나 면제된 후 10년을 경과하지 아니한 자(刑이 失效된 者도 포함한다) 4. 법원의 판결 또는 다른 법률에 의하여 선거권이 정지 또는 상실된 자","cite":"공직선거법 제18조 제1항","badge":"","topic":"","from":"GY-2022-1-H-04","seq":null},{"id":"H-OX-305","subject":"헌법","unit":"통치구조론","stmt":"국가가 인간다운 생활을 보장하기 위한 헌법적 의무를 다하였는 지의 여부가 사법적 심사의 대상이 된 경우에는, 국가가 최저 생활보장에 관한 입법을 전혀 하지 아니하였다든가 그 내용이 현저히 불합리하여 헌법상 용인될 수 있는 재량의 범위를 명백히 일탈한 경우에 한하여 헌법에 위반된다. (22.1차)","answer":true,"quote":"인간다운 생활 보장 의무 위반은 입법을 전혀 안 했거나 내용이 현저히 불합리해 재량을 명백히 벗어난 경우에만 인정된다.","cite":"헌재 94헌마33","badge":"","topic":"","from":"GY-2022-1-H-15","seq":null},{"id":"H-OX-383","subject":"헌법","unit":"통치구조론","stmt":"하나의 사업 또는 사업장에 복수 노동조합이 존재하는 경우 ‘교섭대표노동조합’을 정하여 교섭을 요구하도록 하는 조항인 ｢노동조합 및 노동관계조정법｣ 제29조의2 제1항 본문은 교섭 대표노동조합이 사용자와 잠정적으로 합의한 단체협약안에 대한 확정절차에 소수 노동조합이 참여할 수 있는 규정을 두고 있지 않으므로 과잉금지원칙을 위반하여 청구인들의 단체교섭권을 침해한다. (25.2차)","answer":false,"quote":"하나의 사업 또는 사업장에 복수 노동조합이 존재하는 경우 ‘교섭대표노동조합’을 정하여 교섭을 요구하도록 하는 조항인 2010년 개정 ‘노동조합 및 노동관계조정법’ 제29조 제2항, 구 ‘노동조합 및 노동관계조정법’(이하 ‘구법’이라 한다) 및 ‘노동조합 및 노동관계조정법’(이하 ‘현행법’이라 한다) 제29조의2 제1항 본문(이하 ‘제1조항’이라 한다)과, 자율적으로 교섭창구를 단일화하지 못하거나 사용자가 단일화 절차를 거치지 아니하기로 동의하지 않은 경우 과반수 노동조합이 ‘교섭대표노동조합’이 되도록 하는 조항인 구법 제29조의2 제3항, 현행법 제29조의2 제4항(이하 ‘제2조항’이라 한다)이 과잉금지원칙을 위반하여 청구인들의 단체교섭권을 침해하는지 여부 및 단체교섭권의 본질적 내용을 침해하는지 여부(소극)","cite":"헌재 2020헌마237","badge":"","topic":"","from":"GY-2025-2-H-20","seq":null},{"id":"H-OX-344","subject":"헌법","unit":"통치구조론","stmt":"시각장애인에 한해 안마사의 자격을 인정하는 근거를 직접 법률에 규정하지 않은 ｢의료법｣ 조항은 안마사 자격인정 요건을 정할 수 있는 권한을 행정부에 위임하는 것으로서 의회유보원칙을 위반한 것은 아니다. (26.1차)","answer":true,"quote":"안마사 자격인정은 허가라 기준을 법률로 상세히 정할 필요가 없어, 자격제만 법률에 두고 요건을 행정부에 맡겨도 의회유보원칙 위반이 아니다.","cite":"헌재 2002헌가16","badge":"","topic":"","from":"GY-2026-1-H-09","seq":null},{"id":"H-OX-308","subject":"헌법","unit":"통치구조론","stmt":"국민의 생명 신체의 안전이 질병 등으로부터 위협받거나 받게 될 우려가 있는 경우 국가로서는 그 위험의 원인과 정도에 따라 사회 경제적인 여건 및 재정사정 등을 감안하여 국민의 생명 신체의 안전을 보호하기에 필요한 적절하고 효율적인 입법 행정상의 조치를 취하여 그 침해의 위험을 방지하고 이를 유지할 포괄적인 의무를 진다. (22.2차)","answer":true,"quote":"국가는 질병 등으로부터 생명·신체의 안전을 지킬 적절하고 효율적인 조치를 취할 포괄적 의무를 지되, 수단은 여건과 재정을 보아 정한다.","cite":"헌재 2008헌마419","badge":"","topic":"","from":"GY-2022-2-H-05","seq":null},{"id":"H-OX-370","subject":"헌법","unit":"통치구조론","stmt":"아동･청소년대상 성범죄는 재범 위험성이 높고 시간이 지나도 공무수행을 맡기기에 충분할 만큼 국민의 신뢰가 회복되기 어려우므로, 아동･청소년이용음란물임을 알면서 이를 소지한 죄로 형을 선고받아 그 형이 확정된 사람은 일반직공무원으로 임용될 수 없도록 규정한 ｢국가공무원법｣ 및 ｢지방공무원법｣ 조항은 그 형이 확정된 사람의 공무담임권을 침해하지 않는다. (24.2차)","answer":false,"quote":"또한, 심판대상조항은 아동ㆍ청소년 관련 직무 여부를 불문하고, 기간의 제한을 두지 않고 영구적으로 임용을 제한하지만 아동ㆍ청소년대상 성범죄는 재범 위험성이 높고 시간이 지나도 공무수행을 맡기기에 충분할 만큼 국민의 신뢰가 회복되기 어려우므로 침해의 최소성이 인정된다.","cite":"헌재 2020헌마1605","badge":"","topic":"","from":"GY-2024-2-H-15","seq":null},{"id":"H-OX-338","subject":"헌법","unit":"통치구조론","stmt":"1990년 개정 ｢민법｣의 시행일인 1991. 1. 1.부터 그 이전에 성립된 계모자 사이의 법정혈족관계를 소멸시키도록 한 ｢민법｣ 조항은 개인의 존엄과 양성평등에 반하는 전래의 가족제도를 개선하기 위한 입법이므로 가족제도를 보장하는 헌법 제36조 제1항에 위반된다고 볼 수 없다. (25.2차)","answer":true,"quote":"한편 이 사건 법률조항은 계자의 친부와 계모의 혼인의사를 일률적으로 계자에 대한 입양 또는 그 대리의 의사로 간주하기는 어려우므로, 계자의 친부와 계모의 혼인에 따라 가족생활을 자유롭게 형성할 권리를 침해하지 아니하고, 또한 개인의 존엄과 양성평등에 반하는 전래의 가족제도를 개선하기 위한 입법이므로 가족제도를 보장하는 헌법 제36조 제1항에 위반된다고 볼 수도 없다.","cite":"헌재 2009헌바89","badge":"","topic":"","from":"GY-2025-2-H-11","seq":null},{"id":"H-OX-354","subject":"헌법","unit":"통치구조론","stmt":"사회복무요원의 정치적 행위를 금지하는 ｢병역법｣ 조항 중 ‘정치적 목적을 지닌 행위’는 ‘특정 정당, 정치인을 지지･반대 하거나 공직선거에 있어서 특정 후보자를 당선･낙선하게 하는 등 그 정파성･당파성에 비추어 정치적 중립성을 훼손할 가능성이 높은 행위’로 한정하여 해석되므로 명확성원칙에 위배되지 않는다. (23.1차)","answer":false,"quote":"공무원의 정치적 중립성을 선언한 헌법의 취지, 사회복무요원의 공무원에 준하는 공적 지위, 이 사건 법률조항의 입법목적 등을 종합적으로 고려하면, ‘정치단체’는 ‘특정 정당이나 특정 정치인을 지지ㆍ반대하는 단체로서 이에 가입하는 경우 사회복무요원의 정치적 중립성을 훼손할 가능성이 높은 단체’로, ‘정치적 목적을 지닌 행위’는 ‘특정 정당, 정치인을 지지ㆍ반대하거나 공직선거에 있어서 특정 후보자를 당선ㆍ낙선하게 하는 등 그 정파성ㆍ당파성에 비추어 정치적 중립성을 훼손할 가능성이 높은 행위’로 한정하여 해석된다.","cite":"헌재 2019헌마534","badge":"","topic":"","from":"GY-2023-1-H-09","seq":null},{"id":"H-OX-325","subject":"헌법","unit":"통치구조론","stmt":"법률 또는 법률 조항은 원칙적으로 가능한 범위안에서 합헌적 으로 해석하여야 하나 그 해석은 문의적 한계와 법목적에 따른 한계가 있다. 이러한 한계를 벗어난 합헌적 해석은 그것이 바로 실질적 의미에서의 입법작용을 뜻하게 되어 결과적으로 입법 권자의 입법권을 침해하는 것이 된다. (24.1차)","answer":true,"quote":"합헌적 법률해석은 법문의 뜻과 입법목적의 한계 안에서만 할 수 있고, 이를 넘으면 해석이 아니라 법원이 입법을 하는 것이 된다.","cite":"헌재 88헌가5","badge":"","topic":"","from":"GY-2024-1-H-01","seq":null},{"id":"H-OX-349","subject":"헌법","unit":"통치구조론","stmt":"정당해산 사유로서의 ‘민주적 기본질서의 위배’란, 민주적 기본 질서에 대한 단순한 위반이나 저촉만으로도 족하며, 반드시 민주사회의 불가결한 요소인 정당의 존립을 제약해야 할 만큼 그 정당의 목적이나 활동이 민주적 기본질서에 대하여 실질적인 해악을 끼칠 수 있는 구체적 위험성을 초래하는 경우까지 포함 하는 것은 아니다. (22.1차)","answer":false,"quote":"해산 사유인 「위배」는 단순한 위반·저촉으로는 부족하고, 민주적 기본질서에 실질적 해악을 끼칠 구체적 위험성이 있어야 한다.","cite":"헌법 제8조","badge":"","topic":"","from":"GY-2022-1-H-02","seq":null},{"id":"H-OX-352","subject":"헌법","unit":"통치구조론","stmt":"금고 이상의 형의 선고유예를 받고 그 기간 중에 있는 자를 임용결격사유로 삼고, 위 사유에 해당하는 자가 임용되더라도 이를 당연무효로 하는 구 국가공무원법 조항은 입법자의 재량을 일탈하여 청구인의 공무담임권을 침해한다. (22.1차)","answer":false,"quote":"금고 이상 형의 선고유예 기간 중인 사람을 결격사유로 하고 임용을 당연무효로 한 것은 공직 신뢰를 위한 것이라 공무담임권 침해가 아니다.","cite":"헌재 2014헌바437","badge":"","topic":"","from":"GY-2022-1-H-20","seq":null},{"id":"H-OX-376","subject":"헌법","unit":"통치구조론","stmt":"대통령령에서 정하여질 구체적인 소음 기준의 내용으로 규정한 ‘타인에게 심각한 피해를 주는 소음’의 의미가 명확하지 않으므로 ｢집회 및 시위에 관한 법률｣ 제14조 제1항은 죄형법정주의의 명확성원칙에 위배된다. (25.1차)","answer":false,"quote":"「타인에게 심각한 피해를 주는 소음」은 대통령령이 정할 소음기준의 방향을 보여 주어 예측할 수 있으므로 명확성원칙에 위배되지 않는다.","cite":"헌재 2020헌바586","badge":"","topic":"","from":"GY-2025-1-H-07","seq":null},{"id":"H-OX-381","subject":"헌법","unit":"통치구조론","stmt":"헌법재판소는 권력분립의 관점에서 소위 “과소보호금지원칙”을, 즉 국가가 국민의 기본권 보호를 위하여 적어도 적절하고 효율적인 최소한의 보호조치를 취했는가를 기준으로 국가의 기본권 보호의무 이행을 심사하여야 하지만, 입법부작위나 불완전한 입법에 의한 기본권의 침해는 입법자의 보호의무에 대한 명백한 위반이 있는 경우에만 인정되는 것은 아니다. (25.2차)","answer":false,"quote":"과소보호금지원칙에 따라 심사하므로, 입법부작위나 불완전한 입법에 의한 기본권 침해는 입법자가 보호의무를 명백히 위반한 경우에만 인정된다.","cite":"헌재 90헌마110","badge":"","topic":"","from":"GY-2025-2-H-12","seq":null},{"id":"H-OX-371","subject":"헌법","unit":"통치구조론","stmt":"회계책임자가 ｢공직선거법｣이나 ｢정치자금법｣ 소정의 조항을 위반하여 300만 원 이상의 벌금형을 선고받아 확정된 경우, 후보자의 당선이 무효로 되도록 규정한 ｢공직선거법｣ 조항은 후보자의 관리･감독책임 없음을 입증하여 면책될 가능성조차 부여하지 않아, 책임주의 원칙에 위배되어 국회의원 당선자의 공무담임권을 침해한다. (24.2차)","answer":false,"quote":"회계책임자는 후보자가 고르고 감독하는 사람이라, 그의 300만 원 이상 벌금으로 당선을 무효로 해도 자기책임 원칙에 어긋나지 않는다.","cite":"헌재 2009헌마170","badge":"","topic":"","from":"GY-2024-2-H-15","seq":null},{"id":"H-OX-366","subject":"헌법","unit":"통치구조론","stmt":"18세 이상으로서 선거인명부작성기준일 현재 영주의 체류자격 취득일 후 3년이 지난 외국인으로서 해당 지방자치단체의 외국인 등록대장에 올라 있는 사람에게 그 구역에서 선거하는 지방자치 단체 의회의원과 장의 피선거권을 부여하므로 외국인도 피선거권의 주체가 될 수 있다. (24.2차)","answer":false,"quote":"② 18세 이상으로서 제37조제1항에 따른 선거인명부작성기준일 현재 다음 각 호의 어느 하나에 해당하는 사람은 그 구역에서 선거하는 지방자치단체의 의회의원 및 장의 선거권이 있다. <개정 2009. 2. 12., 2011. 11. 7., 2014. 1. 17., 2015. 8. 13., 2020. 1. 14.> 1. 「주민등록법」 제6조제1항제1호 또는 제2호에 해당하는 사람으로서 해당 지방자치단체의 관할 구역에 주민등록이 되어 있는 사람 2. 「주민등록법」 제6조제1항제3호에 해당하는 사람으로서 주민등록표에 3개월 이상 계속하여 올라 있고 해당 지방자치단체의 관할구역에 주민등록이 되어 있는 사람 3. 「출입국관리법」 제10조에 따른 영주의 체류자격 취득일 후 3년이 경과한 외국인으로서 같은 법 제34조에 따라 해당 지방자치단체의 외국인등록대장에 올라 있는 사람 [2009. 2. 12. 법률 제9466호에 의하여 2007. 6. 28. 헌법재판소에서 헌법불합치결정된 이 조 제2항제1호를 개정함.] [제목개정 2011. 11. 7.]","cite":"공직선거법 제15조 제2항","badge":"","topic":"","from":"GY-2024-2-H-05","seq":null},{"id":"H-OX-355","subject":"헌법","unit":"통치구조론","stmt":"법원이 검사의 열람･등사 거부처분에 정당한 사유가 없다고 판단하고 그러한 거부처분이 피고인의 헌법상 기본권을 침해 한다는 취지에서 수사서류의 열람･등사를 허용하도록 명한 이상 검사로서는 당연히 법원의 그러한 결정에 지체 없이 따라야 하지만, 별건으로 공소제기되어 확정된 관련 형사사건 기록에 관한 경우에는 이를 따르지 않을 수 있다. (23.1차)","answer":false,"quote":"법원이 열람·등사를 명했으면 검사는 지체 없이 따라야 하고, 별건으로 확정된 관련 사건 기록이라도 예외가 아니다.","cite":"헌재 2019헌마356","badge":"","topic":"","from":"GY-2023-1-H-12","seq":null},{"id":"H-OX-385","subject":"헌법","unit":"통치구조론","stmt":"병원, 치과병원, 종합병원과 달리 정신병원에 대하여는 한의사를 두어 한의과 진료과목을 추가로 설치‧운영할 수 있다는 규정을 두지 아니한 ｢의료법｣ 조항은 정신병원과 다른 병원의 차이점을 반영한 것으로 정신병원을 운영하는 청구인의 평등권을 침해 하지 아니한다. (26.1차)","answer":false,"quote":"정신병원만 한의과 진료과목을 둘 수 없게 한 것은 다른 병원과 달리 볼 합리적 이유가 없어 평등권을 침해하고, 헌법불합치 결정이 있었다.","cite":"헌재 2021헌마886","badge":"","topic":"","from":"GY-2026-1-H-10","seq":null},{"id":"H-OX-379","subject":"헌법","unit":"통치구조론","stmt":"강제퇴거명령을 받은 사람을 보호할 수 있도록 하면서 보호기간의 상한을 마련하지 아니한 ｢출입국관리법｣ 조항은 행정의 편의성과 획일성만을 강조한 것으로, 피보호자의 신체의 자유를 과도하게 제한하는 것인 점에서 입법목적의 정당성과 수단의 적합성을 충족하지 못하여 피보호자인 외국인 불법체류자의 신체의 자유를 침해한다. (25.2차)","answer":false,"quote":"보호기간 상한이 없는 보호는 목적의 정당성과 수단의 적합성은 인정되지만, 침해의 최소성과 법익균형성을 갖추지 못해 신체의 자유를 침해한다.","cite":"헌재 2020헌가1","badge":"","topic":"","from":"GY-2025-2-H-04","seq":null},{"id":"H-OX-312","subject":"헌법","unit":"통치구조론","stmt":"국가 또는 지방자치단체의 기관이 보관하고 있는 문서 등에 관하여 이해관계 있는 국민이 공개를 요구함에도 정당한 이유 없이 이에 응하지 아니하거나 거부하는 것은 당해 국민의 알 권리를 침해하는 것이다. (22.2차)","answer":true,"quote":"알 권리에는 정보공개청구권이 포함되어, 이해관계 있는 국민의 공개 요구를 정당한 이유 없이 거부하면 알 권리 침해가 된다.","cite":"헌재 88헌마22","badge":"","topic":"","from":"GY-2022-2-H-13","seq":null},{"id":"H-OX-326","subject":"헌법","unit":"통치구조론","stmt":"변호사시험 성적을 합격자에게 공개하지 않도록 규정한 ｢변호사 시험법｣ 조항은 법학전문대학원 간의 과다경쟁 및 서열화를 방지하고, 교육과정이 충실하게 이행될 수 있도록 하여 다양한 분야의 전문성을 갖춘 양질의 변호사를 양성하기 위한 것으로 그 입법목적은 정당하나 입법목적을 달성하는 적절한 수단이 라고 볼 수는 없다. (24.1차)","answer":true,"quote":"변호사시험 성적 비공개를 통하여 법학전문대학원 간의 과다경쟁 및 서열화를 방지하고, 교육과정이 충실하게 이행될 수 있도록 하여 다양한 분야의 전문성을 갖춘 양질의 변호사를 양성하기 위한 심판대상조항의 입법목적은 정당하다.","cite":"헌재 2011헌마769","badge":"","topic":"","from":"GY-2024-1-H-07","seq":null},{"id":"H-OX-361","subject":"헌법","unit":"통치구조론","stmt":"사회복무요원이 정당 가입을 할 수 없도록 규정한 ｢병역법｣ 조항은 사회복지시설에 근무하는 사회복무요원의 경우에는 민간 영역에서 근무하고 그 직무의 성질상 정치적 중립성을 훼손할 가능성이 거의 없음에도 불구하고 일괄적으로 정당에 가입하는 행위를 금지한다는 점에서 과잉금지원칙에 위배되어 사회복무 요원인 청구인의 정치적 표현의 자유를 침해한다. (24.1차)","answer":false,"quote":"사회복무요원의 정당 가입 금지는 정치적 중립과 업무전념을 위한 것으로 합헌이었고, 위헌은 「그 밖의 정치단체」 등 부분이었다.","cite":"헌재 2019헌마534","badge":"","topic":"","from":"GY-2024-1-H-13","seq":null},{"id":"H-OX-346","subject":"헌법","unit":"통치구조론","stmt":"국회의원보다 지방의회의원에 대하여 지역대표성을 고려할 필요성이 더 크다는 점을 고려하여 하나의 자치구‧시‧군에 최소 1명 이상의 시‧도의원을 보장하겠다는 취지로 인접한 2 이상의 관할구역과 합하지 않아, 도의회의원선거구역의 지역선거구들 평균인구수로부터 선거구의 인구수가 –56.29%의 인구편차를 보인다면 당해 선거구 부분은 당해 선거구 선거권자의 평등권을 침해한다. (26.1차)","answer":true,"quote":"시·도의원 선거구의 인구편차 허용 한계는 상하 50%여서, 최소 1명 보장을 위해 합구하지 않았어도 -56.29%까지 벌어지면 평등권을 침해한다.","cite":"헌재 2022헌마1247","badge":"","topic":"","from":"GY-2026-1-H-10","seq":null},{"id":"H-OX-313","subject":"헌법","unit":"통치구조론","stmt":"조세는 국가 또는 지방자치단체가 재정수요를 충족시키거나 경제적 사회적 특수정책의 실현을 위하여 국민 또는 주민에 대하여 아무런 특별한 반대급부 없이 강제적으로 부과징수하는 과징금을 의미한다. (22.2차)","answer":true,"quote":"조세는 국가·지방자치단체가 재정수요 등을 위해 특별한 반대급부 없이 강제로 걷는 금전이라는 점에서 수수료·사용료와 다르다.","cite":"헌재 89헌가95","badge":"","topic":"","from":"GY-2022-2-H-20","seq":null},{"id":"H-OX-368","subject":"헌법","unit":"통치구조론","stmt":"지방공사 상근직원의 선거운동을 금지하고, 이를 위반한 자를 처벌하는 ｢공직선거법｣ 조항의 해당 부분은 지방공사 상근 직원에 대하여 ‘그 지위를 이용하여’ 또는 ‘그 직무 범위 내 에서’ 하는 선거운동을 금지하는 방법만으로는 선거의 공정성이 충분히 담보될 수 없어 지방공사 상근직원의 선거운동의 자유를 침해하지 아니한다. (24.2차)","answer":false,"quote":"지방공사 상근직원은 경영에 영향력이 없어 지위를 이용한 선거운동만 막아도 되므로, 선거운동 전부를 금지하면 선거운동의 자유를 침해한다.","cite":"헌재 2021헌가14","badge":"","topic":"","from":"GY-2024-2-H-14","seq":null},{"id":"H-OX-362","subject":"헌법","unit":"통치구조론","stmt":"국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결 하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 하는데, 표결은 무기명투표로 한다. (24.2차)","answer":false,"quote":"① 국회는 헌법개정안이 공고된 날로부터 60일 이내에 의결하여야 하며, 국회의 의결은 재적의원 3분의 2 이상의 찬성을 얻어야 한다.","cite":"헌법 제130조 제1항","badge":"","topic":"","from":"GY-2024-2-H-01","seq":null},{"id":"H-OX-334","subject":"헌법","unit":"통치구조론","stmt":"과거 3년 이내의 당원 경력을 법관 임용 결격사유로 정한 ｢법원 조직법｣ 제43조 제1항 제5호 중 ‘당원의 신분을 상실한 날부터 3년이 경과되지 아니한 사람’에 관한 부분은 과잉금지원칙에 반하여 공무담임권을 침해한다. (25.1차)","answer":true,"quote":"과거 3년 안의 당원 경력만으로 법관 임용을 일률적으로 막는 것은 과잉금지원칙에 반해 공무담임권을 침해한다.","cite":"헌재 2021헌마460","badge":"","topic":"","from":"GY-2025-1-H-16","seq":null},{"id":"H-OX-360","subject":"헌법","unit":"통치구조론","stmt":"형사재판에 피고인으로 출석하는 수형자에 대하여 사복착용을 불허하는 ｢형의 집행 및 수용자의 처우에 관한 법률｣ 조항은 형사재판을 받는 수형자의 도주를 방지하기 위한 것으로 목적의 정당성은 인정되나, 재판 과정에서 재소자용 의류를 입게 하는 것이 도주의 방지를 위한 필요하고도 유용한 수단이라고 보기는 어렵다. (24.1차)","answer":false,"quote":"형사재판에 나가는 수형자의 사복 불허는 도주 방지에 필요하고 유용한 수단으로 인정되었고, 침해의 최소성에서 위헌이 되었다.","cite":"헌재 2013헌마712","badge":"","topic":"","from":"GY-2024-1-H-07","seq":null},{"id":"H-OX-329","subject":"헌법","unit":"통치구조론","stmt":"헌법이 특별히 정당설립의 자유와 복수정당제를 보장하고, 정당의 해산을 엄격한 요건 아래 인정하면서 정당을 특별히 보호한다고 하여도, 정당은 국민의 자발적 조직으로서, 그 법적 성격은 일반적으로 사적･정치적 결사 내지는 법인격 없는 사단 이므로, 정당이 공권력의 행사 주체로서 국가기관의 지위가 있는 것은 아니다. (24.2차)","answer":true,"quote":"정당은 국민의 자발적 조직으로, 그 법적 성격은 일반적으로 사적ㆍ정치적 결사 내지는 법인격 없는 사단으로서 공권력의 행사 주체로서 국가기관의 지위를 갖는다고 볼 수 없다.","cite":"헌재 2019헌라6","badge":"","topic":"","from":"GY-2024-2-H-03","seq":null},{"id":"H-OX-358","subject":"헌법","unit":"통치구조론","stmt":"국회의원을 후원회지정권자로 정하면서 ｢지방자치법｣의 ‘도’의회의원, ‘시’의회의원을 후원회지정권자에서 제외하고 있는 ｢정치자금법｣ 제6조 제2호는 국회의원과 지방의회의원의 업무의 특성을 고려한 합리적 차별로 평등권을 침해하지 않는다. (23.2차)","answer":false,"quote":"국회의원을 후원회지정권자로 정하면서 지방자치법 제2조 제1항 제1호의 ‘도’의회의원과 같은 항 제2호의 ‘시’의회의원(이하 ‘지방의회의원’이라 한다)을 후원회지정권자에서 제외하고 있는 정치자금법 제6조 제2호(이하 ‘심판대상조항’이라 한다)가 청구인들의 평등권을 침해하는지 여부(적극)","cite":"헌재 2019헌마528","badge":"","topic":"","from":"GY-2023-2-H-09","seq":null},{"id":"H-OX-333","subject":"헌법","unit":"통치구조론","stmt":"헌법 제16조 후문은 영장주의에 대한 예외를 명문화하고 있지 않지만, 헌법 제16조의 영장주의에 대해서도 그 예외를 인정 하되, 그 장소에 범죄혐의 등을 입증할 자료나 피의자가 존재할 개연성이 소명되고, 사전에 영장을 발부받기 어려운 긴급한 사정이 있는 경우에만 제한적으로 허용될 수 있다고 보는 것이 타당하다. (25.1차)","answer":true,"quote":"주거 압수·수색도 증거나 피의자가 있을 개연성이 소명되고 미리 영장을 받기 어려운 긴급한 사정이 있으면 예외로 영장 없이 할 수 있다.","cite":"헌재 2015헌바370 · 헌법 제16조","badge":"","topic":"","from":"GY-2025-1-H-08","seq":null},{"id":"H-OX-317","subject":"헌법","unit":"통치구조론","stmt":"정당의 명칭은 그 정당의 정책과 정치적 신념을 나타내는 대표적인 표지에 해당하므로, 정당설립의 자유는 자신들이 원하는 명칭을 사용하여 정당을 설립하거나 정당활동을 할 자유도 포함한다. (23.2차)","answer":true,"quote":"한편, 정당의 명칭은 그 정당의 정책과 정치적 신념을 나타내는 대표적인 표지에 해당하므로, 정당설립의 자유는 자신들이 원하는 명칭을 사용하여 정당을 설립하거나 정당활동을 할 자유도 포함한다.","cite":"헌재 2012헌마431","badge":"","topic":"","from":"GY-2023-2-H-01","seq":null},{"id":"H-OX-330","subject":"헌법","unit":"통치구조론","stmt":"수신료 징수업무를 지정받은 자가 수신료를 징수하는 때 그 고유 업무와 관련된 고지행위와 결합하여 이를 행해서는 안 된다고 규정한 ｢방송법 시행령｣ 조항으로 인하여, 한국방송공사가 징수할 수 있는 수신료의 금액이나 범위의 변경은 없고 오로지 그 징수 방법이 기존 전기요금과 통합하여 납부통지하던 것에서 이를 분리 하여 납부통지하는 것으로 변경될 뿐, 위 조항이 신뢰보호원칙에 위배된다고 볼 수 없다. (25.1차)","answer":true,"quote":"개정 전 법령이 전기요금과 수신료를 통합하여 징수하는 방식만을 전제로 하였다거나 그러한 수신료 징수방식에 대한 신뢰를 유도하였다고 볼 수 없으며, 청구인과 한국전력공사 간 TV 방송수신료 징수업무 위ㆍ수탁 계약서도 관련 법률의 개정 등 사유를 예정하고 있는 점, 심판대상조항으로 인하여 청구인이 징수할 수 있는 수신료의 금액이나 범위의 변경은 없고 수신료 납부통지 방법만이 변경되는 점 등을 고려할 때 심판대상조항이 신뢰보호원칙에 위배된다고 볼 수 없다.","cite":"헌재 2023헌마820","badge":"","topic":"","from":"GY-2025-1-H-03","seq":null},{"id":"H-OX-328","subject":"헌법","unit":"통치구조론","stmt":"대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다. (24.2차)","answer":true,"quote":"② 대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.","cite":"헌법 제128조 제2항","badge":"","topic":"","from":"GY-2024-2-H-01","seq":null},{"id":"H-OX-315","subject":"헌법","unit":"통치구조론","stmt":"헌법개정의 발의는 국회재적의원 과반수 또는 대통령에 의해 행해지며, 대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다. (23.1차)","answer":true,"quote":"② 대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.","cite":"헌법 제128조 제2항","badge":"","topic":"","from":"GY-2023-1-H-02","seq":null},{"id":"H-OX-348","subject":"헌법","unit":"통치구조론","stmt":"국회에 청원을 하려는 자는 국회의원의 소개를 받거나 국회규칙으로 정하는 기간 동안 국회규칙으로 정하는 일정한 수 이상의 국민의 동의를 받아 청원서를 제출하여야 한다. (26.1차)","answer":true,"quote":"① 국회에 청원을 하려는 자는 의원의 소개를 받거나 국회규칙으로 정하는 기간 동안 국회규칙으로 정하는 일정한 수 이상의 국민의 동의를 받아 청원서를 제출하여야 한다. <개정 2019. 4. 16.>","cite":"국회법 제123조 제1항","badge":"","topic":"","from":"GY-2026-1-H-15","seq":null},{"id":"H-OX-374","subject":"헌법","unit":"통치구조론","stmt":"주택 임대차와 관련한 임차인의 보호 및 주택의 이용에 관한 정책은 입법자가 정책적으로 결정하여야 할 사항으로 원칙적 으로 광범위한 입법형성의 자유가 인정되므로, 특단의 사정이 없는 한 구법상의 기대이익을 존중하여야 할 입법자의 의무가 있는 것은 아니라고 할 것이어서 신뢰보호원칙에 위배되는지 여부는 문제되지 않는다. (25.1차)","answer":false,"quote":"주택임대차 정책은 입법형성의 자유가 넓어 구법상 기대를 존중할 의무가 원칙적으로 없어도, 신뢰보호원칙 위반 여부는 여전히 따진다.","cite":"헌재 2020헌마1343","badge":"","topic":"","from":"GY-2025-1-H-03","seq":null},{"id":"H-OX-345","subject":"헌법","unit":"통치구조론","stmt":"13세 미만의 사람에 대하여 강제추행죄를 범한 사람을 5년 이상의 유기징역에 처한다고 정한 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 조항은, 13세 미만 미성년자의 특성과 보호의 필요성을 고려하여 장애인강제추행죄, 청소년강제추행죄의 법정형보다 무겁게 규정한 입법자의 판단이 자의적이라 보기 어려워 평등원칙에 반한다고 볼 수 없다. (26.1차)","answer":true,"quote":"13세 미만 강제추행을 5년 이상 징역으로 장애인·청소년 강제추행보다 무겁게 정한 것은 아동 보호 필요성을 고려한 판단이라 평등원칙에 반하지 않는다.","cite":"성폭력범죄의 처벌 등에 관한 특례법 제7조","badge":"","topic":"","from":"GY-2026-1-H-10","seq":null},{"id":"H-OX-314","subject":"헌법","unit":"통치구조론","stmt":"헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다. (23.1차)","answer":true,"quote":"② 헌법개정안은 국회가 의결한 후 30일 이내에 국민투표에 붙여 국회의원선거권자 과반수의 투표와 투표자 과반수의 찬성을 얻어야 한다.","cite":"헌법 제130조 제2항","badge":"","topic":"","from":"GY-2023-1-H-02","seq":null},{"id":"H-OX-309","subject":"헌법","unit":"통치구조론","stmt":"제도적 보장은 주관적 권리가 아닌 객관적 법규범이라는 점에서 기본권과 구별되기는 하지만 헌법에 의하여 일정한 제도가 보장 되면 입법자는 그 제도를 설정하고 유지할 입법의무를 지게 될 뿐만 아니라 헌법에 규정되어 있기 때문에 법률로써 이를 폐지할 수 없고, 비록 내용을 제한하더라도 그 본질적 내용을 침해할 수 없다. (22.2차)","answer":true,"quote":"제도적 보장은 주관적 권리가 아닌 객관적 법규범이지만, 입법자는 그 제도를 만들고 유지해야 하며 법률로 폐지하거나 본질을 침해할 수 없다.","cite":"헌재 95헌바48","badge":"","topic":"","from":"GY-2022-2-H-06","seq":null},{"id":"H-OX-311","subject":"헌법","unit":"통치구조론","stmt":"유사한 성격의 규율대상에 대하여 이미 입법이 있다 하더 라도, 평등원칙을 근거로 입법자에게 청구인들에게도 적용될 입법을 하여야 할 헌법상의 의무가 발생한다고 볼 수 없다. (22.2차)","answer":true,"quote":"비슷한 대상에 이미 입법이 있다는 사정만으로, 평등원칙을 근거로 자기에게도 같은 입법을 해 달라는 헌법상 입법의무가 생기지 않는다.","cite":"헌법 제11조","badge":"","topic":"","from":"GY-2022-2-H-08","seq":null},{"id":"H-OX-310","subject":"헌법","unit":"통치구조론","stmt":"직업공무원제도는 지방자치제도, 복수정당제도, 혼인제도 등과 함께 ‘제도보장’의 하나로서 이는 일반적인 법에 의한 폐지나 제도본질의 침해를 금지한다는 의미의 ‘최소보장’의 원칙이 적용 되는바, 이는 기본권의 경우 헌법 제37조 제2항의 과잉금지의 원칙에 따라 필요한 경우에 한하여 ‘최소한으로 제한’되는 것과 대조되는 것이다. (22.2차)","answer":true,"quote":"제도보장에는 폐지·본질 침해만 막는 「최소보장」이, 기본권에는 필요한 만큼만 줄이는 「최소제한」이 적용되고, 직업공무원제도는 제도보장이다.","cite":"헌재 91헌바15","badge":"","topic":"","from":"GY-2022-2-H-06","seq":null},{"id":"H-OX-319","subject":"헌법","unit":"통치구조론","stmt":"출생이나 그 밖에 ｢국적법｣에 따라 대한민국 국적과 외국 국적을 함께 가지게 된 사람으로서 대통령령으로 정하는 사람은 대한민국의 법령 적용에서 대한민국 국민으로만 처우한다. (23.2차)","answer":true,"quote":"① 출생이나 그 밖에 이 법에 따라 대한민국 국적과 외국 국적을 함께 가지게 된 사람으로서 대통령령으로 정하는 사람[이하 \"복수국적자\"(複數國籍者)라 한다]는 대한민국의 법령 적용에서 대한민국 국민으로만 처우한다. <개정 2016.12.20.>","cite":"국적법 제11조의2 제1항","badge":"","topic":"","from":"GY-2023-2-H-02","seq":null},{"id":"H-OX-320","subject":"헌법","unit":"통치구조론","stmt":"체계정당성의 원리는 동일 규범 내에서 또는 상이한 규범간에 그 규범의 구조나 내용 또는 규범의 근거가 되는 원칙면에서 상호 배치되거나 모순되어서는 안 된다는 하나의 헌법적 요청이고, 이러한 체계정당성 위반은 비례의 원칙이나 평등의 원칙 등 일정한 헌법의 규정이나 원칙을 위반하여야만 비로소 위헌이 된다. (23.2차)","answer":true,"quote":"체계정당성 위반은 그 자체로 위헌이 아니라 위헌성을 시사하는 징후일 뿐이고, 비례원칙·평등원칙 등을 어겨야 위헌이 된다.","cite":"헌재 2002헌바66","badge":"","topic":"","from":"GY-2023-2-H-04","seq":null},{"id":"H-OX-335","subject":"헌법","unit":"통치구조론","stmt":"500만 원 이상 5천만 원 미만 가액의 ｢마약류 관리에 관한 법률｣ 제2조 제3호 나목의 향정신성의약품을 소지한 경우 무기 또는 3년 이상의 징역에 처하도록 규정한 ｢특정범죄 가중처벌 등에 관한 법률｣ 조항이 현저히 형벌체계상의 균형성을 잃은 자의적인 입법이라고 할 수 없으므로 평등원칙에 위배되지 아니한다. (25.2차)","answer":true,"quote":"가.500만 원 이상 5천만 원 이하 가액의 ‘마약류 관리에 관한 법률’(이하 ‘마약류관리법’이라 한다) 제2조 제3호 나목의 향정신성의약품(이하 ‘나목 향정신성의약품’이라 한다)을 소지한 경우 무기 또는 3년 이상의 징역에 처하도록 규정한 ‘특정범죄 가중처벌 등에 관한 법률’ 제11조 제2항 제2호 중 마약류관리법 제60조 제1항 제2호 가운데 ‘제2조 제3호 나목의 향정신성의약품’의 ‘소지’에 관한 부분(이하 ‘심판대상조항’이라 한다)이 죄형법정주의의 명확성 원칙에 위배되는지 여부(소극)","cite":"헌재 2019헌바83","badge":"","topic":"","from":"GY-2025-2-H-06","seq":null},{"id":"H-OX-378","subject":"헌법","unit":"통치구조론","stmt":"헌법전문, 제10조, 제30조의 종합적 해석상 국가는 태평양전쟁 전후 국내 강제동원희생자에 대하여도 그 지원에 관한 법률을 제정하여야 할 헌법상 의무가 인정됨에도 불구하고 이를 위한 입법조치를 취하지 않고 있는 것은 국가책무의 우선순위나 공평의 관점에서도 입법재량의 한계를 넘는 입법의무불이행으로서 헌법에 위반된다. (25.2차)","answer":false,"quote":"헌법전문 등에서 국내 강제동원 희생자 지원 법률을 만들 구체적 입법의무가 나오지 않고, 국외 동원자를 먼저 지원한 것도 입법재량 안의 일이다.","cite":"헌재 2009헌마94","badge":"","topic":"","from":"GY-2025-2-H-02","seq":null},{"id":"H-OX-318","subject":"헌법","unit":"통치구조론","stmt":"정당의 중앙당과 지구당과의 복합적 구조에 비추어 정당의 지구당은 단순한 중앙당의 하부조직이 아니라 어느 정도의 독자성을 가진 단체로서 법인격 없는 사단에 해당한다. (23.2차)","answer":true,"quote":"지구당은 중앙당의 단순한 하부조직이 아니라 어느 정도 독자성을 가진 단체로서 법인격 없는 사단이다.","cite":"헌재 92헌마262","badge":"","topic":"","from":"GY-2023-2-H-01","seq":null},{"id":"H-OX-301","subject":"헌법","unit":"통치구조론","stmt":"헌법개정은 국회재적의원 과반수 또는 대통령의 발의로 제안 되며, 제안된 헌법개정안은 대통령이 20일 이상의 기간 이를 공고하여야 한다. (22.1차)","answer":true,"quote":"개헌안 발의는 국회재적의원 과반수 또는 대통령이 하고, 공고는 국회의장이 아니라 대통령이 20일 이상 한다.","cite":"헌법 제128조 · 헌법 제129조","badge":"","topic":"","from":"GY-2022-1-H-01","seq":null},{"id":"H-OX-343","subject":"헌법","unit":"통치구조론","stmt":"‘재산의 관리‧처분에 관한 사항’을 주민소송의 대상으로 규정 하고 있는 ｢지방자치법｣ 조항은 그 문언, 주민소송의 목적, 관련 법률의 규정 및 법관의 보충적 해석을 통하여 그 의미를 분명하게 파악할 수 있으므로 명확성원칙에 위배되지 아니한다. (26.1차)","answer":true,"quote":"‘재산의 관리ㆍ처분에 관한 사항’을 주민소송의 대상으로 규정하고 있는 지방자치법 제17조 제1항 중 ‘재산의 관리ㆍ처분에 관한 사항’ 부분(이하 ‘심판대상조항’이라 한다)이 명확성원칙에 위배되는지 여부(소극)","cite":"헌재 2019헌바450","badge":"","topic":"","from":"GY-2026-1-H-07","seq":null},{"id":"H-OX-307","subject":"헌법","unit":"통치구조론","stmt":"헌법은 “군인 또는 군무원이 아닌 국민은 대한민국의 영역안에서는 중대한 군사상 기밀 초병 초소 유독음식물공급 포로 군용물에 관한 죄중 법률이 정한 경우와 비상계엄이 선포된 경우를 제외 하고는 군사법원의 재판을 받지 아니한다.”고 규정하고 있다. (22.1차)","answer":true,"quote":"② 군인 또는 군무원이 아닌 국민은 대한민국의 영역안에서는 중대한 군사상 기밀·초병·초소·유독음식물공급·포로·군용물에 관한 죄중 법률이 정한 경우와 비상계엄이 선포된 경우를 제외하고는 군사법원의 재판을 받지 아니한다.","cite":"헌법 제27조 제2항","badge":"","topic":"","from":"GY-2022-1-H-18","seq":null},{"id":"H-OX-331","subject":"헌법","unit":"통치구조론","stmt":"조세에 관한 법규‧제도는 신축적으로 변할 수밖에 없다는 점에서 납세의무자로서는 구법질서에 의거한 신뢰를 바탕으로 적극적 으로 새로운 법률관계를 형성하였다든지 하는 특별한 사정이 없는 한, 현재의 세법이 변함없이 유지되리라고 기대하거나 신뢰할 수는 없다. (25.1차)","answer":true,"quote":"세법은 자주 바뀔 수밖에 없어, 구법을 믿고 적극적으로 법률관계를 맺은 특별한 사정이 없으면 지금 세법이 유지되리라는 기대는 보호되지 않는다.","cite":"헌재 2020헌바240","badge":"","topic":"","from":"GY-2025-1-H-03","seq":null},{"id":"H-OX-375","subject":"헌법","unit":"통치구조론","stmt":"성폭력범죄를 저질러 벌금형이 확정된 체육지도자의 자격을 필요적으로 취소하도록 개정된 ｢국민체육진흥법｣ 조항을 개정법 시행 후 발생하는 자격취소사유부터 적용하도록 한 같은 법 부칙 제4조 중 해당 부분은 개정법 시행일을 기준으로 하여 성폭력범죄로 이미 벌금형이 확정된 체육지도자와 그렇지 않은 체육지도자를 합리적인 이유 없이 달리 취급하는 것이므로 평등 원칙에 위반된다. (25.1차)","answer":false,"quote":"개정 전에 이미 벌금형이 확정된 체육지도자와 아직 확정되지 않은 체육지도자는 처지가 본질적으로 달라, 부칙이 달리 다뤄도 평등원칙 위반이 아니다.","cite":"헌재 2023헌바73","badge":"","topic":"","from":"GY-2025-1-H-06","seq":null},{"id":"H-OX-363","subject":"헌법","unit":"통치구조론","stmt":"제안된 헌법개정안은 국회가 20일 이상의 기간 이를 공고 하여야 한다. (24.2차)","answer":false,"quote":"제안된 헌법개정안은 대통령이 20일 이상의 기간 이를 공고하여야 한다.","cite":"헌법 제129조","badge":"","topic":"","from":"GY-2024-2-H-01","seq":null},{"id":"H-OX-327","subject":"헌법","unit":"통치구조론","stmt":"｢국군포로의 송환 및 대우 등에 관한 법률｣에 따라 대통령은 등록 포로, 등록하기 전에 사망한 귀환포로, 귀환하기 전에 사망한 국군 포로에 대한 예우의 신청, 기준, 방법 등에 필요한 사항을 대통령령 으로 제･개정할 의무가 있음에도 상당한 기간 동안 정당한 사유 없이 그 예우에 관한 사항을 대통령령에 규정하지 않은 행정입법 부작위는 등록포로 등의 가족인 청구인의 명예권을 침해한다. (24.1차)","answer":true,"quote":"국군포로 예우에 필요한 사항을 대통령령으로 정하라는 법률이 있는데도 오래 정하지 않은 행정입법부작위는 가족의 명예권을 침해한다.","cite":"헌재 2016헌마626","badge":"","topic":"","from":"GY-2024-1-H-08","seq":null},{"id":"H-OX-324","subject":"헌법","unit":"통치구조론","stmt":"헌법 제36조 제1항은 혼인과 가족에 관련되는 공법 및 사법의 모든 영역에 영향을 미치는 헌법원리 내지 원칙규범으로서의 성격도 가진다. (23.2차)","answer":true,"quote":"헌법 제36조 제1항은 혼인·가족에 관한 권리를 보장할 뿐 아니라 공법·사법 모든 영역에 미치는 헌법원리 내지 원칙규범이기도 하다.","cite":"헌재 2001헌바82","badge":"","topic":"","from":"GY-2023-2-H-20","seq":null},{"id":"H-OX-367","subject":"헌법","unit":"통치구조론","stmt":"광주광역시 광산구 시설관리공단(이하 ‘공단’)의 상근직원이, 당원이 아닌 자에게도 투표권을 부여하는 당내경선에서 경선 운동을 할 수 없도록 금지･처벌하는 ｢공직선거법｣ 조항의 해당 부분은, 공단의 상근직원은 공단의 경영에 관여하거나 실질적인 영향력을 미칠 수 있는 권한을 가지고 있고, 경선운동으로 인한 부작용과 폐해가 커서 공단 상근직원의 정치적 표현의 자유를 침해하지 아니한다. (24.2차)","answer":false,"quote":"광주광역시 광산구 시설관리공단(이하 ‘이 사건 공단’이라 한다)의 상근직원이 당원이 아닌 자에게도 투표권을 부여하는 당내경선에서 경선운동을 할 수 없도록 금지ㆍ처벌하는 공직선거법 제57조의6 제1항 본문의 ‘제60조 제1항 제5호 중 제53조 제1항 제6호 가운데 지방공기업법 제2조 에 규정된 지방공단인 광주광역시광산구시설관리공단의 상근직원’에 관한 부분 및 같은 법 제255조 제1항 제1호 중 위 해당부분(이하 ‘심판대상조항’이라 한다)이 정치적 표현의 자유를 침해하는지 여부(적극)","cite":"헌재 2019헌가11","badge":"","topic":"","from":"GY-2024-2-H-14","seq":null},{"id":"H-OX-382","subject":"헌법","unit":"통치구조론","stmt":"공무원연금의 재원은 개인이 부담하는 기여금과 국가 등이 부담 하는 부담금 등으로 형성되므로 한정적일 수밖에 없으나, 연금의 안정적 재정 운용을 명목으로 재직기간 합산에 일정한 제한을 둔 것은 입법목적은 정당하다고 해도 그 수단까지 적절한 것은 아니다. (25.2차)","answer":false,"quote":"공무원연금 재원은 기여금과 부담금으로 한정되어 있어, 안정적 재정 운용을 위해 재직기간 합산을 제한한 것은 목적도 정당하고 수단도 적절하다.","cite":"헌재 2015헌바18","badge":"","topic":"","from":"GY-2025-2-H-19","seq":null},{"id":"H-OX-341","subject":"헌법","unit":"통치구조론","stmt":"자치제도의 보장은 지방자치단체에 의한 자치행정을 일반적으로 보장한다는 것뿐이고 특정자치단체의 존속을 보장한다는 것은 아니며, 군 및 도의회의 결의에 반하여 법률로 군을 폐지하고 타시에 병합하여 시를 설치한다 하여 주민들의 자치권을 침해하는 결과가 된다거나 지방자치제도의 본질을 침해하는 것이라고 할 수 없다. (26.1차)","answer":true,"quote":"지방자치의 제도적 보장은 자치행정을 일반적으로 보장할 뿐 특정 지방자치단체의 존속까지 보장하지 않아, 법률로 군을 폐지·통합할 수 있다.","cite":"헌재 94헌마175 · 헌법 제117조","badge":"","topic":"","from":"GY-2026-1-H-03","seq":null},{"id":"H-OX-357","subject":"헌법","unit":"통치구조론","stmt":"정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 법원은 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법 재판소의 심판에 의하여 해산된다. (23.2차)","answer":false,"quote":"④ 정당의 목적이나 활동이 민주적 기본질서에 위배될 때에는 정부는 헌법재판소에 그 해산을 제소할 수 있고, 정당은 헌법재판소의 심판에 의하여 해산된다.","cite":"헌법 제8조 제4항","badge":"","topic":"","from":"GY-2023-2-H-01","seq":null},{"id":"H-OX-359","subject":"헌법","unit":"통치구조론","stmt":"보험사기를 이유로 체포된 공인이 아닌 피의자를 수사기관이 기자들에게 경찰서 내에서 수갑을 차고 얼굴을 드러낸 상태에서 조사받는 모습을 촬영할 수 있도록 허용한 행위는 피의자의 재범방지 및 범죄예방을 위한 것으로 목적의 정당성이 인정된다. (24.1차)","answer":false,"quote":"공인도 아니고 강력범죄도 아닌 보험사기 피의자의 수갑 찬 모습 촬영 허용은 어떤 공익도 없어 목적의 정당성부터 인정되지 않는다.","cite":"헌재 2012헌마652","badge":"","topic":"","from":"GY-2024-1-H-07","seq":null},{"id":"H-OX-316","subject":"헌법","unit":"통치구조론","stmt":"검사가 법원의 증인으로 채택된 수감자를 그 증언에 이르기까지 거의 매일 검사실로 하루 종일 소환하여 피고인측 변호인이 접근하는 것을 차단하고 검찰에서의 진술을 번복하는 증언을 하지 않도록 회유･압박하는 행위는, 증인의 증언 전에 일방 당사자만이 증인과의 접촉을 독점하여 상대방은 증인이 어떠한 내용을 증언할 것인지를 알 수 없어 그에 대한 방어를 준비할 수 없게 되므로 적법절차원칙에 위배된다. (23.1차)","answer":true,"quote":"검사가 증인으로 채택된 수감자를 매일 소환해 변호인 접근을 막고 회유한 것은 한쪽이 증인을 독점한 것이어서 적법절차원칙 위반이다.","cite":"헌재 99헌마496","badge":"","topic":"","from":"GY-2023-1-H-10","seq":null},{"id":"H-OX-332","subject":"헌법","unit":"통치구조론","stmt":"자산유동화계획에 의하지 아니하고 여유자금을 투자한 자를 처벌하는 ｢자산유동화에 관한 법률｣ 제40조 제2호 중 ‘제22조의 규정에 위반하여 자산유동화계획에 의하지 아니하고 여유자금을 투자한 자’ 부분은 죄형법정주의의 명확성원칙에 반하지 않는다. (25.1차)","answer":true,"quote":"자산유동화계획에 의하지 않은 여유자금 투자 처벌은 수범자인 유동화전문회사 등이 금지행위를 충분히 예측할 수 있어 명확성원칙에 반하지 않는다.","cite":"헌재 2023헌가1","badge":"","topic":"","from":"GY-2025-1-H-07","seq":null},{"id":"H-OX-323","subject":"헌법","unit":"통치구조론","stmt":"형사피의자 또는 형사피고인으로서 구금되었던 자가 법률이 정하는 불기소처분을 받거나 무죄판결을 받은 때에는 법률이 정하는 바에 의하여 국가에 정당한 보상을 청구할 수 있다. (23.2차)","answer":true,"quote":"형사피의자 또는 형사피고인으로서 구금되었던 자가 법률이 정하는 불기소처분을 받거나 무죄판결을 받은 때에는 법률이 정하는 바에 의하여 국가에 정당한 보상을 청구할 수 있다.","cite":"헌법 제28조","badge":"","topic":"","from":"GY-2023-2-H-19","seq":null},{"id":"H-OX-306","subject":"헌법","unit":"통치구조론","stmt":"독서실과 같이 정온을 요하는 사업장의 실내소음 규제기준을 만들어야 할 입법의무가 헌법의 해석상 곧바로 도출된다고 보기는 어렵다. (22.1차)","answer":true,"quote":"독서실 같은 사업장의 실내소음 기준을 만들 입법의무는 헌법에서 곧바로 나오지 않는다.","cite":"헌재 2016헌마45","badge":"","topic":"","from":"GY-2022-1-H-17","seq":null},{"id":"H-OX-364","subject":"헌법","unit":"통치구조론","stmt":"헌법개정은 국회재적의원 과반수 또는 대통령을 수반으로 하는 정부의 발의로 제안된다. (24.2차)","answer":false,"quote":"① 헌법개정은 국회재적의원 과반수 또는 대통령의 발의로 제안된다.","cite":"헌법 제128조 제1항","badge":"","topic":"","from":"GY-2024-2-H-01","seq":null},{"id":"H-OX-303","subject":"헌법","unit":"통치구조론","stmt":"대통령선거에서 대통령후보자가 1인일 때에는 그 득표수가 선거권자 총수의 3분의 1 이상이 아니면 대통령으로 당선될 수 없다. (22.1차)","answer":true,"quote":"③ 대통령후보자가 1인일 때에는 그 득표수가 선거권자 총수의 3분의 1 이상이 아니면 대통령으로 당선될 수 없다.","cite":"헌법 제67조 제3항","badge":"","topic":"","from":"GY-2022-1-H-04","seq":null},{"id":"H-OX-336","subject":"헌법","unit":"통치구조론","stmt":"체계정당성 위반은 비례의 원칙이나 평등의 원칙 등 일정한 헌법의 규정이나 원칙을 위반하여야만 비로소 위헌이 되며, 체계정당성의 위반을 정당화할 합리적인 사유의 존재에 대하여는 입법재량이 인정된다. (25.2차)","answer":true,"quote":"체계정당성 위반은 그 자체로 위헌이 아니라 비례원칙·평등원칙 등을 위반해야 위헌이 되고, 위반을 정당화할 합리적 사유에는 입법재량이 인정된다.","cite":"헌재 2002헌바66","badge":"","topic":"","from":"GY-2025-2-H-06","seq":null},{"id":"H-OX-351","subject":"헌법","unit":"통치구조론","stmt":"국가가 국민의 건강하고 쾌적한 환경에서 생활할 권리에 대한 보호의무를 다하지 않았는지 여부를 헌법재판소가 심사할 때에는 국가가 이를 보호하기 위하여 적어도 적절하고 효율적인 최소한의 보호조치를 취하였는가 하는 이른바 ‘과잉입법금지원칙’ 내지 ‘비례의 원칙’의 위반 여부를 기준으로 삼아야 한다. (22.1차)","answer":false,"quote":"국가가 환경권 보호의무를 다했는지는 과잉금지원칙이 아니라 최소한의 보호조치를 했는지 보는 과소보호금지원칙으로 심사한다.","cite":"헌재 2018헌마730","badge":"","topic":"","from":"GY-2022-1-H-17","seq":null},{"id":"H-OX-339","subject":"헌법","unit":"통치구조론","stmt":"헌법 제36조 제1항은 혼인과 가족에 관련되는 공법 및 사법의 모든 영역에 영향을 미치는 헌법원리 내지 원칙규범으로서의 성격도 가지는데, 이는 적극적으로는 적절한 조치를 통해서 혼인과 가족을 지원하고 제삼자에 의한 침해 앞에서 혼인과 가족을 보호해야 할 국가의 과제를 포함하며, 소극적으로는 불이익을 야기하는 제한조치를 통해서 혼인과 가족을 차별하는 것을 금지해야 할 국가의 의무를 포함한다. (25.2차)","answer":true,"quote":"헌법 제36조 제1항은 혼인·가족에 관한 모든 공법·사법 영역에 미치는 원칙규범으로, 적극적으로는 지원·보호할 과제를, 소극적으로는 차별 금지 의무를 담는다.","cite":"헌재 2001헌바82","badge":"","topic":"","from":"GY-2025-2-H-11","seq":null},{"id":"H-OX-373","subject":"헌법","unit":"통치구조론","stmt":"｢정치자금법｣에 따라 회계보고된 자료의 열람기간을 공고일부터 3월간으로 제한한 ｢정치자금법｣ 조항은 정치자금을 둘러싼 분쟁 등의 장기화 방지 및 행정부담의 경감을 위한 것으로서, 열람을 신청한 청구인의 알권리를 침해하지 않는다. (25.1차)","answer":false,"quote":"나.이 사건 열람기간제한 조항이 회계보고된 자료의 열람기간을 3월간으로 제한한 것은, 정치자금을 둘러싼 법률관계 또는 분쟁을 조기에 안정시키고, 선거관리위원회가 방대한 양의 자료를 보관하면서 열람을 허용하는 데 따르는 업무부담을 줄이기 위한 것으로 입법목적이 정당하며, 위 입법목적을 달성하는 데 기여하는 적합한 수단이다.","cite":"헌재 2018헌마1168","badge":"","topic":"","from":"GY-2025-1-H-02","seq":null},{"id":"X-OX-770","subject":"형사법","unit":"형법 총론","stmt":"2026. 9. 29. 형법 개정으로, 형사사건의 재판에 관여하는 법관이나 공소를 제기·유지하는 검사 등이 타인에게 위법 또는 부당하게 이익을 주거나 권익을 해할 목적으로 재판·수사 중인 형사사건에 관하여 법령을 왜곡하여 적용하는 등 행위를 하면 10년 이하의 징역과 10년 이하의 자격정지에 처하는 법왜곡죄가 신설되었다.","answer":true,"quote":"형사사건의 재판에 관여하는 법관, 공소를 제기하거나 유지하는 검사 또는 범죄수사에 관한 직무를 수행하는 자가 타인에게 위법 또는 부당하게 이익을 주거나 권익을 해할 목적으로 재판 또는 수사 중인 형사사건에 관하여 다음 각 호의 어느 하나에 해당하는 행위를 한 경우에는 10년 이하의 징역과 10년 이하의 자격정지에 처한다.","cite":"형법 제123조의2 (2026. 9. 29. 신설, 2026. 10. 2. 시행)","badge":"2026.10.2. 개정","topic":"","from":"AMEND-2026","seq":null},{"id":"X-OX-185","subject":"형사법","unit":"형법 총론","stmt":"탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 할 것이지만, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 할 필요는 없다. (24.2차)","answer":false,"quote":"검사가 유죄의 자료로 제출한 사법경찰리 작성의 피고인에 대한 피의자신문조서는 피고인이 그 내용을 부인하는 이상 증거능력이 없으나, 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로 사용할 수 있으며, 또한 탄핵증거는 범죄사실을 인정하는 증거가 아니므로 엄격한 증거조사를 거쳐야 할 필요가 없음은 형사소송법 제318조의2 의 규정에 따라 명백하나 법정에서 이에 대한 탄핵증거로서의 증거조사는 필요한 것이고, 한편 증거신청의 방식에 관하여 규정한 형사소송규칙 제132조 제1항 의 취지에 비추어 보면 탄핵증거의 제출에 있어서도 상대방에게 이에 대한 공격방어의 수단을 강구할 기회를 사전에 부여하여야 한다는 점에서 그 증거와 증명하고자 하는 사실과의 관계 및 입증취지 등을 미리 구체적으로 명시하여야 할 것이므로, 증명력을 다투고자 하는 증거의 어느 부분에 의하여 진술의 어느 부분을 다투려고 한다는 것을 사전에 상대방에게 알려야 한다.","cite":"대법원 2005도2617","badge":"","topic":"","from":"GY-2024-2-X-39","seq":null},{"id":"X-OX-197","subject":"형사법","unit":"형법 총론","stmt":"휴대전화의 동영상 촬영기능을 이용하여 피해자를 촬영한 행위 자체가 범죄에 해당하는 경우, 휴대전화는 ‘범죄행위에 제공된 물건’이지만, 촬영되어 저장된 동영상은 휴대전화에 저장된 전자 기록으로서 ‘범죄행위로 인하여 생긴 물건’이 아니므로 법원이 휴대전화를 몰수하지 않고 동영상만을 몰수할 수는 없다. (25.1차)","answer":false,"quote":"휴대전화는 범행에 제공된 물건이고 저장된 동영상은 범행으로 생긴 전자기록이어서, 법원은 휴대전화는 두고 동영상만 몰수할 수 있다.","cite":"대법원 2017도5905 · 형법 제48조","badge":"","topic":"","from":"GY-2025-1-X-13","seq":null},{"id":"X-OX-204","subject":"형사법","unit":"형법 총론","stmt":"공모공동정범에 있어서 그 공모자중의 1인이 다른 공모자가 실행행위에 이르기 전에 그 공모관계에서 이탈한 때에는 그 이후의 다른 공모자의 행위에 관하여 공동정범으로서의 책임은 지지 않지만, 이때 그 이탈의 표시는 반드시 명시적이어야 한다. (25.2차)","answer":false,"quote":"공모공동정범에 있어서 그 공모자중의 1인이 다른 공모자가 실행행위에 이르기 전에 그 공모관계에서 이탈한 때에는 그 이후의 다른 공모자의 행위에 관하여 공동정범으로서의 책임은 지지 않는다고 할 것이고 그 이탈의 표시는 반드시 명시적임을 요하지 않는다.","cite":"대법원 85도2371","badge":"","topic":"","from":"GY-2025-2-X-10","seq":null},{"id":"X-OX-181","subject":"형사법","unit":"형법 총론","stmt":"부진정결과적 가중범에서 고의로 중한 결과를 발생하게 한 행위가 별도의 구성요건에 해당하고 그 고의범에 대하여 결과적 가중범에 정한 형보다 더 무겁게 처벌하는 규정이 없는 경우 에는 그 고의범과 결과적 가중범이 상상적 경합관계에 있다. (24.2차)","answer":false,"quote":"기본범죄를 통하여 고의로 중한 결과를 발생하게 한 경우에 가중 처벌하는 부진정결과적가중범에서, 고의로 중한 결과를 발생하게 한 행위가 별도의 구성요건에 해당하고 그 고의범에 대하여 결과적가중범에 정한 형보다 더 무겁게 처벌하는 규정이 있는 경우에는 그 고의범과 결과적가중범이 상상적 경합관계에 있지만, 위와 같이 고의범에 대하여 더 무겁게 처벌하는 규정이 없는 경우에는 결과적가중범이 고의범에 대하여 특별관계에 있으므로 결과적가중범만 성립하고 이와 법조경합의 관계에 있는 고의범에 대하여는 별도로 죄를 구성하지 않는다.","cite":"대법원 2008도7311","badge":"","topic":"","from":"GY-2024-2-X-07","seq":null},{"id":"X-OX-075","subject":"형사법","unit":"형법 총론","stmt":"교사범에 있어서의 교사사실은 범죄사실을 구성하는 것으로서 이를 인정하기 위하여는 엄격한 증명이 요구되지만, 피고인이 교사사실을 부인하고 있는 경우에는 사물의 성질상 그와 상당한 관련성이 있는 간접사실을 증명하는 방법에 의하여 이를 입증할 수 있다. (24.2차)","answer":true,"quote":"교사자의 교사행위는 정범에게 범죄의 결의를 가지게 하는 것을 말하는 것으로서, 그 범죄를 결의하게 할 수 있는 것이면 그 수단에는 아무런 제한이 없고, 반드시 명시적·직접적 방법에 의할 것을 요하지도 않으며, 이와 같은 교사범에 있어서의 교사사실은 범죄사실을 구성하는 것으로서 이를 인정하기 위하여는 엄격한 증명이 요구되지만, 피고인이 교사사실을 부인하고 있는 경우에는 사물의 성질상 그와 상당한 관련성이 있는 간접사실을 증명하는 방법에 의하여 이를 입증할 수도 있고, 이러한 경우 무엇이 상당한 관련성이 있는 간접사실에 해당할 것인가는 정상적인 경험칙에 바탕을 두고 치밀한 관찰력이나 분석력에 의하여 사실의 연결상태를 합리적으로 판단하는 방법에 의하여야 한다.","cite":"대법원 99도1252","badge":"","topic":"","from":"GY-2024-2-X-34","seq":null},{"id":"X-OX-001","subject":"형사법","unit":"형법 총론","stmt":"유추해석금지의 원칙은 형벌법규의 구성요건과 가벌성에 관한 규정에 준용되므로 형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하고 있는 경우에 그 행정법규의 규정을 해석하는 데에도 마찬가지로 적용된다. (22.1차)","answer":true,"quote":"형벌법규의 해석은 엄격하여야 하고 명문규정의 의미를 피고인에게 불리한 방향으로 지나치게 확장 해석하거나 유추 해석하는 것은 죄형법정주의의 원칙에 어긋나는 것으로서 허용되지 않으며, 이러한 법해석의 원리는 그 형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하고 있는 경우에 그 행정법규의 규정을 해석하는 데에도 마찬가지로 적용된다.","cite":"대법원 2006도4582","badge":"","topic":"","from":"GY-2022-1-X-01","seq":null},{"id":"X-OX-212","subject":"형사법","unit":"형법 총론","stmt":"스토킹행위를 전제로 하는 스토킹범죄는 행위자의 어떠한 행위를 매개로 이를 인식한 상대방에게 불안감 또는 공포심을 일으킴으로써 그의 자유로운 의사결정의 자유 및 생활형성의 자유와 평온이 침해되는 것을 막고자 하는 것을 보호법익으로 하는 침해범이다. (26.1차)","answer":false,"quote":"스토킹행위를 전제로 하는 스토킹범죄는 행위자의 어떠한 행위를 매개로 이를 인식한 상대방에게 불안감 또는 공포심을 일으킴으로써 그의 자유로운 의사결정의 자유 및 생활형성의 자유와 평온이 침해되는 것을 막고 이를 보호법익으로 하는 위험범이라고 볼 수 있으므로, 구 스토킹범죄의 처벌 등에 관한 법률(2023. 7. 11.","cite":"대법원 2023도6411","badge":"","topic":"","from":"GY-2026-1-X-02","seq":null},{"id":"X-OX-209","subject":"형사법","unit":"형법 총론","stmt":"｢물가안정에 관한 법률｣ 제7조는 “사업자로 하여금 ‘폭리를 목적’으로 물품을 매점하거나 판매를 기피하는 행위로서 기획 재정부장관이 물가의 안정을 해칠 우려가 있다고 인정하여 매점매석행위로 지정한 행위를 하여서는 아니 된다.”고 규정하고 있고, 여기에서 말하는 ‘폭리의 목적’은 고의와는 별도로 요구 되는 초과주관적 위법요소로서 엄격한 증명의 대상이 아니다. (25.2차)","answer":false,"quote":"물가안정에 관한 법률(이하 ‘물가안정법’이라 한다) 제7조 는 사업자로 하여금 폭리를 목적으로 물품을 매점하거나 판매를 기피하는 행위로서 기획재정부장관이 물가의 안정을 해칠 우려가 있다고 인정하여 매점매석행위로 지정한 행위를 하여서는 아니 된다고 규정하면서 이를 위반한 행위에 대해 물가안정법 제26조 에 따라 처벌하되, 구 ‘마스크 및 손소독제 매점매석 행위 금지 등에 관한 고시’(2020. 9. 28.","cite":"대법원 2023도2836","badge":"","topic":"","from":"GY-2025-2-X-35","seq":null},{"id":"X-OX-222","subject":"형사법","unit":"형법 총론","stmt":"임의적 감경사유의 존재가 인정되고 법관이 그에 따라 징역형에 대해 법률상 감경을 하더라도 ｢형법｣ 제55조 제1항 제3호에 따라 상한과 하한을 모두 2분의 1로 감경할 수는 없다. (26.1차)","answer":false,"quote":"나아가 임의적 감경사유의 존재가 인정되고 법관이 그에 따라 징역형에 대해 법률상 감경을 하는 이상 형법 제55조 제1항 제3호 에 따라 상한과 하한을 모두 2분의 1로 감경한다.","cite":"대법원 2018도5475","badge":"","topic":"","from":"GY-2026-1-X-13","seq":null},{"id":"X-OX-180","subject":"형사법","unit":"형법 총론","stmt":"사인 甲이 현행범을 체포하면서 자신의 집 창고에 24시간 이상 감금하여도 ｢형사소송법｣상 허용된다고 위법성조각사유의 허용 한계를 오인하는 행위는 금지착오의 유형에 해당하지 않는다. (24.2차)","answer":false,"quote":"위법성조각사유의 허용 한계를 넘었는데도 허용된다고 믿은 것은 간접적 금지착오로, 금지착오의 한 유형이다.","cite":"형법 제16조","badge":"","topic":"","from":"GY-2024-2-X-06","seq":null},{"id":"X-OX-206","subject":"형사법","unit":"형법 총론","stmt":"집행유예의 선고를 받은 자가 유예기간 중 고의로 범한 죄로 자격정지 이상의 실형을 선고받아 그 판결이 확정된 때에는 집행유예의 선고는 효력을 잃는다. (25.2차)","answer":false,"quote":"집행유예의 선고를 받은 자가 유예기간 중 고의로 범한 죄로 금고 이상의 실형을 선고받아 그 판결이 확정된 때에는 집행유예의 선고는 효력을 잃는다.","cite":"형법 제63조","badge":"","topic":"","from":"GY-2025-2-X-13","seq":null},{"id":"X-OX-036","subject":"형사법","unit":"형법 총론","stmt":"허위공문서작성죄와 동행사죄가 수뢰후 부정처사죄와 각각 상상적 경합관계에 있는 경우, 허위공문서작성죄와 동행사죄 상호간은 실체적 경합범관계에 있다고 할지라도 상상적 경합 범관계에 있는 수뢰후 부정처사죄와 대비하여 가장 중한 죄에 정한 형으로 처단하면 족하다. (23.1차)","answer":true,"quote":"형법 제131조 제1항 의 수뢰후부정처사죄에 있어서 공무원이 수뢰후 행한 부정행위가 공도화변조 및 동행사죄와 같이 보호법익을 달리하는 별개 범죄의 구성요건을 충족하는 경우에는 수뢰후부정처사죄 외에 별도로 공도화변조 및 동행사죄가 성립하고 이들 죄와 수뢰후부정처사죄는 각각 상상적 경합 관계에 있다고 할 것인바, 이와 같이 공도화변조죄와 동행사죄가 수뢰후부정처사죄와 각각 상상적 경합범 관계에 있을 때에는 공도화변조죄와 동행사죄 상호간은 실체적 경합범 관계에 있다고 할지라도 상상적 경합범 관계에 있는 수뢰후부정처사죄와 대비하여 가장 중한 죄에 정한 형으로 처단하면 족한 것이고 따로이 경합범 가중을 할 필요가 없다.","cite":"대법원 2000도1216","badge":"","topic":"","from":"GY-2023-1-X-12","seq":null},{"id":"X-OX-223","subject":"형사법","unit":"형법 총론","stmt":"인터넷 계정의 아이디 및 비밀번호가 ｢형법｣ 제316조 제2항 소정의 전자기록 등 특수매체기록에 해당하기 위해서는 특정인의 의사가 표시되어야 하나, 아이디 및 비밀번호 자체는 특정인의 의사를 표시한 것으로 보기 어려워 기술적 수단을 이용하여 그 내용을 알아냈더라도 전자기록등내용탐지죄가 성립하지 않는다. (26.1차)","answer":false,"quote":"전자기록은 특정인의 의사가 표시될 필요가 없어 아이디·비밀번호도 여기에 들지만, 봉함·비밀장치가 없으면 알아내도 이 죄는 되지 않는다.","cite":"대법원 2021도8900 · 형법 제316조","badge":"","topic":"","from":"GY-2026-1-X-17","seq":null},{"id":"X-OX-050","subject":"형사법","unit":"형법 총론","stmt":"호흡측정기에 의한 음주측정치와 혈액검사에 의한 음주측정치가 다른 경우에 혈액채취에 의한 검사 결과를 믿지 못할 특별한 사정이 없는 한, 혈액검사에 의한 음주측정치가 호흡측정기에 의한 음주측정치보다 측정 당시의 혈중알코올농도에 더 근접한 음주측정치라고 보는 것이 경험칙에 부합한다. (23.2차)","answer":true,"quote":"도로교통법 제41조 제2항 에서 말하는 '측정'이란, 측정결과에 불복하는 운전자에 대하여 그의 동의를 얻어 혈액채취 등의 방법으로 다시 측정할 수 있음을 규정하고 있는 같은 조 제3항 과의 체계적 해석상, 호흡을 채취하여 그로부터 주취의 정도를 객관적으로 환산하는 측정방법, 즉 호흡측정기에 의한 측정이라고 이해하여야 할 것이고, 호흡측정기에 의한 음주측정치와 혈액검사에 의한 음주측정치가 다른 경우에 어느 음주측정치를 신뢰할 것인지는 법관의 자유심증에 의한 증거취사선택의 문제라고 할 것이나, 호흡측정기에 의한 측정의 경우 그 측정기의 상태, 측정방법, 상대방의 협조정도 등에 의하여 그 측정결과의 정확성과 신뢰성에 문제가 있을 수 있다는 사정을 고려하면, 혈액의 채취 또는 검사과정에서 인위적인 조작이나 관계자의 잘못이 개입되는 등 혈액채취에 의한 검사결과를 믿지 못할 특별한 사정이 없는 한, 혈액검사에 의한 음주측정치가 호흡측정기에 의한 음주측정치보다 측정 당시의 혈중알콜농도에 더 근접한 음주측정치라고 보는 것이 경험칙에 부합한다.","cite":"대법원 2003도6905","badge":"","topic":"","from":"GY-2023-2-X-39","seq":null},{"id":"X-OX-068","subject":"형사법","unit":"형법 총론","stmt":"공사업자 甲이 A의 토지 위에 자신의 공사를 위해 쌓아 두었던 건축자재를 공사 완료 후 단순히 치우지 않은 것에 불과하다면, 이러한 행위가 A의 추가 공사 업무에 대한 적극적인 방해행위와 동등한 형법적 가치를 가진다고 볼 수 없다. (24.2차)","answer":true,"quote":"피고인이 甲과 토지 지상에 창고를 신축하는 데 필요한 형틀공사 계약을 체결한 후 그 공사를 완료하였는데, 甲이 공사대금을 주지 않는다는 이유로 위 토지에 쌓아 둔 건축자재를 치우지 않고 공사현장을 막는 방법으로 위력으로써 甲의 창고 신축 공사 업무를 방해하였다는 내용으로 기소된 사안에서, 피고인이 일부러 건축자재를 甲의 토지 위에 쌓아 두어 공사현장을 막은 것이 아니라 당초 자신의 공사를 위해 쌓아 두었던 건축자재를 공사 완료 후 치우지 않은 것에 불과하므로, 비록 공사대금을 받을 목적으로 건축자재를 치우지 않았더라도, 피고인이 자신의 공사를 위하여 쌓아 두었던 건축자재를 공사 완료 후에 단순히 치우지 않은 행위가 위력으로써 甲의 추가 공사 업무를 방해하는 업무방해죄의 실행행위로서 甲의 업무에 대하여 하는 적극적인 방해행위와 동등한 형법적 가치를 가진다고 볼 수 없는데도, 이와 달리 보아 공소사실을 유죄로 인정한 원심판결에 부작위에 의한 업무방해죄의 성립에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2017도13211","badge":"","topic":"","from":"GY-2024-2-X-08","seq":null},{"id":"X-OX-114","subject":"형사법","unit":"형법 총론","stmt":"법률이념의 변경에 의한 것이 아니라 다른 사정의 변천에 따라 그때 그때의 특수한 필요에 대처하기 위하여 법령이 개폐된 경우라 하더라도 형법 제1조 제2항이 적용된다. (22.1차)","answer":false,"quote":"형법 제1조 제2항의 규정은 형벌법령 제정의 이유가 된 법률이념의 변천에 따라 과거에 범죄로 보던 행위에 대하여 그 평가가 달라져 이를 범죄로 인정하고 처벌한 그 자체가 부당하였다거나 또는 과형이 과중하였다는 반성적 고려에서 법령을 개폐하였을 경우에 적용하여야 할 것이고, 이와 같은 법률이념의 변경에 의한 것이 아닌 다른 사정의 변천에 따라 그때 그때의 특수한 필요에 대처하기 위하여 법령을 개폐하는 경우에는 이미 그 전에 성립한 위법행위를 현재에 관찰하여도 행위 당시의 행위로서는 가벌성이 있는 것이어서 그 법령이 개폐되었다 하더라도 그에 대한 형이 폐지된 것이라고는 할 수 없다.","cite":"대법원 97도2682","badge":"","topic":"","from":"GY-2022-1-X-02","seq":null},{"id":"X-OX-194","subject":"형사법","unit":"형법 총론","stmt":"법률 위반행위 중간에 일시적으로 판례에 따라 그 행위가 처벌 대상이 되지 않는 것으로 해석된 적이 있었다면, 자신의 행위가 처벌되지 않는 것으로 믿은 데에 정당한 이유가 있다고 할 수 있다. (25.1차)","answer":false,"quote":"법률 위반 행위 중간에 일시적으로 판례에 따라 그 행위가 처벌대상이 되지 않는 것으로 해석되었던 적이 있었다고 하더라도 그것만으로 자신의 행위가 처벌되지 않는 것으로 믿은 데에 정당한 이유가 있다고 할 수 없다.","cite":"대법원 2021도10903","badge":"","topic":"","from":"GY-2025-1-X-08","seq":null},{"id":"X-OX-188","subject":"형사법","unit":"형법 총론","stmt":"범죄 후 법률이 변경되어 그 행위가 범죄를 구성하지 않게 된 경우, 입법자가 법률의 변경 이후에도 종전 법률 위반행위에 대한 형사 처벌을 유지한다는 내용의 경과규정을 따로 두더라도 ｢형법｣ 제1조 제2항이 적용된다. (25.1차)","answer":false,"quote":"이러한 형법 제1조 제2항 과 형사소송법 제326조 제4호 의 규정은 입법자가 법령의 변경 이후에도 종전 법령 위반행위에 대한 형사처벌을 유지한다는 내용의 경과규정을 따로 두지 않는 한 그대로 적용되어야 한다.","cite":"대법원 2020도16420","badge":"","topic":"","from":"GY-2025-1-X-02","seq":null},{"id":"X-OX-152","subject":"형사법","unit":"형법 총론","stmt":"공동정범이 성립하기 위하여는 반드시 공범자간에 사전 모의가 있어야 하므로, 우연히 만난 자리에서 서로 협력하여 공동의 범의를 실현하려는 의사가 암묵적으로 상통하여 범행에 공동 가공하더라도 공동정범은 성립되지 않는다. (23.2차)","answer":false,"quote":"공동정범에 사전 모의는 필요 없고, 우연히 만난 자리에서 암묵적으로 뜻이 통해 함께 실행해도 공동정범이 된다.","cite":"대법원 85도1892 · 형법 제30조","badge":"","topic":"","from":"GY-2023-2-X-11","seq":null},{"id":"X-OX-123","subject":"형사법","unit":"형법 총론","stmt":"저작권 침해 게시물을 인터넷 웹사이트 서버 등에 업로드 하여 공중의 구성원이 개별적으로 선택한 시간과 장소에서 접근할 수 있도록 이용에 제공하였더라도 공중에게 침해 게시물을 실제로 송신하지 않았다면 저작권법상 공중송신권 침해는 기수에 이르지 않는다. (22.1차)","answer":false,"quote":"(나) 정범이 침해 게시물을 인터넷 웹사이트 서버 등에 업로드하여 공중의 구성원이 개별적으로 선택한 시간과 장소에서 접근할 수 있도록 이용에 제공하면, 공중에게 침해 게시물을 실제로 송신하지 않더라도 공중송신권 침해는 기수에 이른다.","cite":"대법원 2017도19025","badge":"","topic":"","from":"GY-2022-1-X-09","seq":null},{"id":"X-OX-088","subject":"형사법","unit":"형법 총론","stmt":"즉결심판절차에 있어서는 ｢형사소송법｣ 제310조의 규정은 적용하지 아니한다. (25.1차)","answer":true,"quote":"즉결심판절차에 있어서는 형사소송법 제310조, 제312조제3항 및 제313조의 규정은 적용하지 아니한다.","cite":"즉결심판에 관한 절차법 제10조","badge":"","topic":"","from":"GY-2025-1-X-39","seq":null},{"id":"X-OX-042","subject":"형사법","unit":"형법 총론","stmt":"A 아파트 입주자대표회의 회장인 甲이 자신의 승인 없이 동대표들이 관리소장과 함께 게시한 입주자대표회의의 소집 공고문을 뜯어내 제거한 경우, 해당 공고문을 손괴한 조치가 그에 선행하는 위법한 공고문 작성 및 게시에 따른 위법상태의 구체적 실현이 임박한 상황 하에서 그 위법성을 바로잡기 위한 것이라면 사회통념상 허용되는 범위를 크게 넘어서지 않는 것으로 볼 수 있다. (23.2차)","answer":true,"quote":"甲 아파트 입주자대표회의 회장인 피고인이 자신의 승인 없이 동대표들이 관리소장과 함께 게시한 입주자대표회의 소집공고문을 뜯어내 제거함으로써 그 효용을 해하였다고 하여 재물손괴로 기소된 사안에서, 甲 아파트의 관리규약에 따르면 입주자대표회의는 회장이 소집하도록 규정되어 있으므로 입주자대표회의 소집공고문 역시 입주자대표회의 회장 명의로 게시되어야 하는 점, 위 공고문이 계속 게시되고 방치될 경우 적법한 소집권자가 작성한 진정한 공고문으로 오인될 가능성이 매우 높고, 이를 신뢰한 동대표들이 해당 일시의 입주자대표회의에 참석할 것으로 충분히 예상되는 상황이었던 점, 게시판의 관리주체인 관리소장이 위 공고문을 게시하였더라도 소집절차의 하자가 치유되지 않는 점, 피고인이 위 공고문을 발견한 날은 공휴일 야간이었고 그다음 날이 위 공고문에서 정한 입주자대표회의가 개최되는 당일이어서 시기적으로 달리 적절한 방안을 찾기 어려웠던 점 등을 종합하면, 피고인이 위 공고문을 손괴한 조치는, 그에 선행하는 위법한 공고문 작성 및 게시에 따른 위법상태의 구체적 실현이 임박한 상황하에서 그 위법성을 바로잡기 위한 것으로 사회통념상 허용되는 범위를 크게 넘어서지 않는 행위로 볼 수 있다는 이유로, 이와 달리 본 원심판단에 정당행위에 관한 법리오해의 잘못이 있다고 한 사례.","cite":"대법원 2021도9680","badge":"","topic":"","from":"GY-2023-2-X-06","seq":null},{"id":"X-OX-026","subject":"형사법","unit":"형법 총론","stmt":"현역군인이 국군보안사령부의 민간인에 대한 정치사찰을 폭로 한다는 명목으로 군무를 이탈한 행위는 정당방위나 정당행위에 해당하지 아니한다. (23.1차)","answer":true,"quote":"서면화된 인사발령 없이 국군보안사령부 서빙고분실로 배치되어 이른바 \"혁노맹\"사건 수사에 협력하게 된 사정만으로 군무이탈행위에 군무기피목적이 없었다고 할 수 없고, 국군보안사령부의 민간인에 대한 정치사찰을 폭로한다는 명목으로 군무를 이탈한 행위가 정당방위나 정당행위에 해당하지 아니한다고 한 사례.","cite":"대법원 93도766","badge":"","topic":"","from":"GY-2023-1-X-05","seq":null},{"id":"X-OX-169","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제48조 제1항의 ‘범인’에는 공범자도 포함되므로 피고인의 소유물은 물론 공범자의 소유물도 그 공범자의 소추 여부를 불문하고 몰수할 수 있고, 여기에서의 공범자에는 공동정범, 교사범, 방조범에 해당하는 자는 포함되나 필요적 공범관계에 있는 자는 포함되지 않는다. (24.1차)","answer":false,"quote":"형법 제48조 제1항 의 ‘범인’에는 공범자도 포함되므로 피고인의 소유물은 물론 공범자의 소유물도 그 공범자의 소추 여부를 불문하고 몰수할 수 있고, 여기에서의 공범자에는 공동정범, 교사범, 방조범에 해당하는 자는 물론 필요적 공범관계에 있는 자도 포함된다.","cite":"대법원 2006도5586","badge":"","topic":"","from":"GY-2024-1-X-12","seq":null},{"id":"X-OX-065","subject":"형사법","unit":"형법 총론","stmt":"미합중국 군대의 군속 중 통상적으로 대한민국에 거주하고 있는 자는 SOFA 협정이 적용되는 군속의 개념에서 배제 되므로, 10년 넘게 대한민국에 머물면서 한국인 아내와 결혼 하여 가정을 마련하고 직장 생활을 하는 등 생활근거지를 대한민국에 두고 있었던 미합중국 국적의 甲이 저지른 범죄에 대해 대한민국의 형사재판권을행사할 수 있다. (24.2차)","answer":true,"quote":"미합중국 국적을 가진 미합중국 군대의 군속인 피고인이 범행 당시 10년 넘게 대한민국에 머물면서 한국인 아내와 결혼하여 가정을 마련하고 직장 생활을 하는 등 생활근거지를 대한민국에 두고 있었던 경우, 피고인은 ‘대한민국과 아메리카합중국 간의 상호방위조약 제4조에 의한 시설과 구역 및 대한민국에서의 합중국 군대의 지위에 관한 협정’에서 말하는 ‘통상적으로 대한민국에 거주하는 자’에 해당하므로, 피고인에게는 위 협정에서 정한 미합중국 군대의 군속에 관한 형사재판권 관련 조항이 적용될 수 없다고 한 사례","cite":"대법원 2005도798","badge":"","topic":"","from":"GY-2024-2-X-02","seq":null},{"id":"X-OX-044","subject":"형사법","unit":"형법 총론","stmt":"공범자의 범인도피행위의 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 자에 대하여는 범인도피죄의 공동정범이 성립한다. (23.2차)","answer":true,"quote":"범인도피죄는 범인을 도피하게 함으로써 기수에 이르지만 범인도피행위가 계속되는 동안에는 범죄행위도 계속되고 행위가 끝날 때 비로소 범죄행위가 종료되고, 공범자의 범인도피행위의 도중에 그 범행을 인식하면서 그와 공동의 범의를 가지고 기왕의 범인도피상태를 이용하여 스스로 범인도피행위를 계속한 자에 대하여는 범인도피죄의 공동정범이 성립한다.","cite":"대법원 95도577","badge":"","topic":"","from":"GY-2023-2-X-10","seq":null},{"id":"X-OX-213","subject":"형사법","unit":"형법 총론","stmt":"일반교통방해죄는 교통방해의 결과가 현실적으로 발생하여야 하는 것은 아니나 법익침해의 현실적 위험은 발생하여야 하므로 구체적 위험범이다. (26.1차)","answer":false,"quote":"일반교통방해죄는 이른바 추상적 위험범으로서 교통이 불가능하거나 또는 현저히 곤란한 상태가 발생하면 바로 기수가 되고 교통방해의 결과가 현실적으로 발생하여야 하는 것은 아니다.","cite":"대법원 2017도9146","badge":"","topic":"","from":"GY-2026-1-X-02","seq":null},{"id":"X-OX-161","subject":"형사법","unit":"형법 총론","stmt":"법령 제정 당시부터 또는 폐지 이전에 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우, 그 유효기간 경과 전에 행해진 법령 위반행위의 가벌성은 소멸하므로 더 이상 행위자를 처벌할 수 없게 된다. (24.1차)","answer":false,"quote":"한편 법령이 개정 내지 폐지된 경우가 아니라, 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우도 형법 제1조 제2항 과 형사소송법 제326조 제4호 에서 말하는 법령의 변경에 해당한다고 볼 수 없다.","cite":"대법원 2020도16420","badge":"","topic":"","from":"GY-2024-1-X-02","seq":null},{"id":"X-OX-076","subject":"형사법","unit":"형법 총론","stmt":"공연히 사실을 적시하여 사람의 명예를 훼손한 행위가 ｢형법｣ 제310조의 규정에 따라서 위법성이 조각되어 처벌대상이 되지 않기 위하여는 그것이 진실한 사실로서 오로지 공공의 이익에 관한 때에 해당된다는 점을 행위자가 증명하여야 한다. (24.2차)","answer":true,"quote":"형법 제310조 의 규정에 따라서 위법성이 조각되어 처벌대상이 되지 않기 위하여는 그것이 진실한 사실로서 오로지 공공의 이익에 관한 때에 해당된다는 점을 행위자가 증명하여야 하는 것이나, 그 증명은 유죄의 인정에 있어 요구되는 것과 같이 법관으로 하여금 의심할 여지가 없을 정도의 확신을 가지게 하는 증명력을 가진 엄격한 증거에 의하여야 하는 것은 아니므로, 이 때에는 전문증거에 대한 증거능력의 제한을 규정한","cite":"대법원 95도1473","badge":"","topic":"","from":"GY-2024-2-X-34","seq":null},{"id":"X-OX-039","subject":"형사법","unit":"형법 총론","stmt":"형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우 ｢형법｣ 제1조 제2항을 적용하려면, 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접적으로 관련된 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하여야 한다. (23.2차)","answer":true,"quote":"그러나 해당 형벌법규 자체 또는 그로부터 수권 내지 위임을 받은 법령이 아닌 다른 법령이 변경된 경우 형법 제1조 제2항 과 형사소송법 제326조 제4호 를 적용하려면, 해당 형벌법규에 따른 범죄의 성립 및 처벌과 직접적으로 관련된 형사법적 관점의 변화를 주된 근거로 하는 법령의 변경에 해당하여야 하므로, 이와 관련이 없는 법령의 변경으로 인하여 해당 형벌법규의 가벌성에 영향을 미치게 되는 경우에는 형법 제1조 제2항 과 형사소송법 제326조 제4호 가 적용되지 않는다.","cite":"대법원 2020도16420","badge":"","topic":"","from":"GY-2023-2-X-02","seq":null},{"id":"X-OX-058","subject":"형사법","unit":"형법 총론","stmt":"교사자의 교사행위에 의해 정범이 범죄의 실행을 결의하게 되었다면, 비록 정범에게 범죄의 습벽이 있어 그 습벽과 함께 교사행위가 원인이 되어 정범이 범죄를 실행하게 되었다고 하더라도 교사범이 성립한다. (24.1차)","answer":true,"quote":"교사범의 교사가 정범이 죄를 범한 유일한 조건일 필요는 없으므로, 교사행위에 의하여 정범이 실행을 결의하게 된 이상 비록 정범에게 범죄의 습벽이 있어 그 습벽과 함께 교사행위가 원인이 되어 정범이 범죄를 실행한 경우에도 교사범의 성립에 영향이 없다.","cite":"대법원 91도542","badge":"","topic":"","from":"GY-2024-1-X-10","seq":null},{"id":"X-OX-067","subject":"형사법","unit":"형법 총론","stmt":"행위의 긴급성과 보충성은 수단의 상당성을 판단할 때 고려요소의 하나로 참작하여야 하며, 다른 실효성 있는 적법한 수단이 없는 경우를 의미하는 것이지 일체의 법률적인 적법한 수단이 존재하지 않을 것을 의미하는 것은 아니라고 보아야 한다. (24.2차)","answer":true,"quote":"또한 그 내용 역시 다른 실효성 있는 적법한 수단이 없는 경우를 의미하고 ‘일체의 법률적인 적법한 수단이 존재하지 않을 것’을 의미하는 것은 아니라고 보아야 할 것이나, 정당행위로 인정되기 위하여 요구되는 긴급성이나 보충성의 정도는 개별 사안에 따라 다를 수 있다.","cite":"대법원 2021도2084","badge":"","topic":"","from":"GY-2024-2-X-05","seq":null},{"id":"X-OX-133","subject":"형사법","unit":"형법 총론","stmt":"판례는 양벌규정의 적용대상자를 업무주가 아니면서 당해 업무를 실제 집행하는 자에게까지 확장하고 있어, 법인격 없는 공공 기관도 개인정보보호법 상 양벌규정에 의해 처벌될 수 있고, 해당 업무를 실제로 담당하는 소속 공무원도 양벌규정에 의해 처벌받을 수 있다. (22.2차)","answer":false,"quote":"법인격 없는 공공기관은 양벌규정으로 처벌할 수 없고, 기관을 벌할 수 없으면 업무를 맡은 소속 공무원도 그 양벌규정으로 벌할 수 없다.","cite":"대법원 2020도1942","badge":"","topic":"","from":"GY-2022-2-X-02","seq":null},{"id":"X-OX-052","subject":"형사법","unit":"형법 총론","stmt":"｢아동･청소년의 성보호에 관한 법률｣상 공개명령 제도에 대해서는 소급입법금지의 원칙이 적용되지 않는다. (24.1차)","answer":true,"quote":"법률 제10391호로 개정된 아동·청소년의 성보호에 관한 법률이 공개명령 제도가 시행된 2010. 1. 1.","cite":"대법원 2010도14393","badge":"","topic":"","from":"GY-2024-1-X-01","seq":null},{"id":"X-OX-031","subject":"형사법","unit":"형법 총론","stmt":"행위자의 강요와 피강요자의 강요된 행위 사이에는 인과관계가 요구되며, 피강요자의 강요된 행위는 적법행위의 기대가능성이 없기 때문에 책임이 조각되어 범죄가 성립하지 않는다. (23.1차)","answer":true,"quote":"강요와 행위 사이에 인과관계가 있어야 하고, 적법행위를 기대할 수 없어 책임이 조각될 뿐 위법성은 그대로 남는다.","cite":"형법 제12조","badge":"","topic":"","from":"GY-2023-1-X-08","seq":null},{"id":"X-OX-165","subject":"형사법","unit":"형법 총론","stmt":"甲이 자신의 가옥 앞 도로가 폐기물 운반 차량의 통행로로 이용되어 가옥 일부에 균열 등이 발생하자 위 도로에 트랙터를 세워두거나 철책 펜스를 설치함으로써 위 차량의 통행을 불가능하게 한 경우 (24.1차)","answer":false,"quote":"피고인의 가옥 앞 도로가 폐기물 운반 차량의 통행로로 이용되어 가옥 일부에 균열 등이 발생하자 피고인이 위 도로에 트랙터를 세워두거나 철책 펜스를 설치함으로써 위 차량의 통행을 불가능하게 하거나 위 차량들의 앞을 가로막고 앉아서 통행을 일시적으로 방해한 경우, 전자의 경우에만 일반교통방해죄를 구성한다고 한 사례","cite":"대법원 2008도10560","badge":"","topic":"","from":"GY-2024-1-X-05","seq":null},{"id":"X-OX-097","subject":"형사법","unit":"형법 총론","stmt":"2인 이상이 범죄에 공동 가공하는 공범관계에서 공모는 법률상 어떤 정형을 요구하는 것이 아니고, 2인 이상이 공모하여 어느 범죄에 공동 가공하여 그 범죄를 실현하려는 의사의 결합만 있으면 되는 것으로서, 비록 전체의 모의과정이 없었다고 하더라도 수인 사이에 순차적으로 또는 암묵적으로 상통하여 그 의사의 결합이 이루어지면 공모관계가 성립한다. (25.2차)","answer":true,"quote":"2인 이상이 범죄에 공동가공하는 공범관계에서 공모는 법률상 어떤 정형을 요구하는 것이 아니고 2인 이상이 공모하여 범죄에 공동가공하여 범죄를 실현하려는 의사의 결합만 있으면 되는 것으로서, 비록 전체의 모의과정이 없다고 하더라도 수인 사이에 순차적으로 또는 암묵적으로 상통하여 그 의사의 결합이 이루어지면 공모관계가 성립하고, 이러한 공모가 이루어진 이상 실행행위에 직접 관여하지 아니한 자라도 다른 공범자의 행위에 대하여 공동정범으로서 형사책임을 진다.","cite":"대법원 2024도10141","badge":"","topic":"","from":"GY-2025-2-X-10","seq":null},{"id":"X-OX-214","subject":"형사법","unit":"형법 총론","stmt":"화물차를 주차하고 적재함에 적재된 토마토 상자를 운반하던 중 적재된 상자 일부가 떨어지면서 지나가던 피해자에게 상해를 입힌 경우, ｢교통사고처리 특례법｣에 정한 ‘교통사고’에 해당 하지 않아 ｢형법｣상 업무상과실치상죄가 성립하지 않는다. (26.1차)","answer":false,"quote":"화물차를 주차하고 적재함에 적재된 토마토 상자를 운반하던 중 적재된 상자 일부가 떨어지면서 지나가던 피해자에게 상해를 입힌 경우, 교통사고처리 특례법에 정한 ‘교통사고’에 해당하지 않아 업무상과실치상죄가 성립한다고 한 사례.","cite":"대법원 2009도2390","badge":"","topic":"","from":"GY-2026-1-X-05","seq":null},{"id":"X-OX-015","subject":"형사법","unit":"형법 총론","stmt":"자기의 지휘 감독을 받는 자를 교사하여 범죄를 실행하게 한 때에는 정범에 정한 형의 장기 또는 다액의 2분의 1까지 가중한다. (22.2차)","answer":true,"quote":"②자기의 지휘, 감독을 받는 자를 교사 또는 방조하여 전항의 결과를 발생하게 한 자는 교사인 때에는 정범에 정한 형의 장기 또는 다액에 그 2분의 1까지 가중하고 방조인 때에는 정범의 형으로 처벌한다.","cite":"형법 제34조 제2항","badge":"","topic":"","from":"GY-2022-2-X-07","seq":null},{"id":"X-OX-128","subject":"형사법","unit":"형법 총론","stmt":"범인도피죄는 타인을 도피하게 하는 경우에 성립할 수 있고 여기에서 타인에는 공범도 포함되므로, 공범 중 1인이 그 범행에 관한 수사절차에서 참고인 또는 피의자로 조사받으면서 자기의 범행을 구성하는 사실관계에 관하여 허위로 진술하고 허위 자료를 제출하는 행위가 다른 공범을 도피하게 하는 결과가 되는 경우 범인도피죄가 성립할 수 있다. (22.1차)","answer":false,"quote":"범인도피죄에서 ‘도피하게 하는 행위’의 의미 / 공범을 도피하게 하는 경우에 범인도피죄가 성립할 수 있는지 여부 (적극) 및 범인 스스로 도피하는 행위도 처벌되는지 여부 (소극) / 공범 중 1인이 그 범행에 관한 수사절차에서 참고인 또는 피의자로 조사받으면서 자기의 범행을 구성하는 사실관계에 관하여 허위로 진술하고 허위 자료를 제출하는 경우, 범인도피죄로 처벌할 수 있는지 여부 (소극) 및 이때 공범이 이러한 행위를 교사한 경우, 범인도피교사죄가 성립하는지 여부 (소극)","cite":"대법원 2015도20396","badge":"","topic":"","from":"GY-2022-1-X-27","seq":null},{"id":"X-OX-155","subject":"형사법","unit":"형법 총론","stmt":"범죄단체 등에 소속된 조직원이 저지른 폭력행위 등 처벌에 관한 법률 위반(단체 등의 공동강요)죄 등의 개별적 범행과 동법 위반(단체 등의 활동)죄는 범행의 목적이나 행위 등 측면에서 일부 중첩되는 부분이 있고, 이에 특별한 사정이 없는 한 법률상 1개의 행위로 평가되어 실체적 경합이 아닌 상상적 경합관계에 있다고 보아야 한다. (23.2차)","answer":false,"quote":"조직원의 단체 공동강요 등 개별 범행과 단체 활동죄는 법률상 하나의 행위로 볼 수 없어 상상적 경합이 아니라 실체적 경합이다.","cite":"폭력행위 등 처벌에 관한 법률 제4조 · 형법 제37조","badge":"","topic":"","from":"GY-2023-2-X-13","seq":null},{"id":"X-OX-020","subject":"형사법","unit":"형법 총론","stmt":"아동학대범죄의 처벌 등에 관한 특례법 (2014. 1. 28. 제정, 2014. 9. 29. 시행)은 제34조 제1항(공소시효의 정지와 효력)의 소급적용에 관하여 명시적인 경과규정을 두고 있지 않지만, 동법 시행일 당시 범죄행위가 종료되었으나 아직 공소시효가 완성되지 않은 아동학대범죄에 대해서도 적용된다. (22.2차)","answer":true,"quote":"아동학대범죄의 처벌 등에 관한 특례법 제34조 의 취지 및 같은 법 시행일 당시 범죄행위가 종료되었으나 아직 공소시효가 완성되지 아니한 아동학대범죄에 대하여 같은 법 제34조 제1항 이 적용되는지 여부 (적극)","cite":"대법원 2016도7273","badge":"","topic":"","from":"GY-2022-2-X-14","seq":null},{"id":"X-OX-080","subject":"형사법","unit":"형법 총론","stmt":"수련병원의 전문의 甲과 전공의 乙이 수직적 분업관계에 있는 경우, 乙에게 전적으로 위임된 것이 아닌 이상 甲은 자신이 주로 담당하는 환자에 대하여 乙이 하는 의료행위의 내용이 적절한 것인지 여부를 확인하고 감독하여야 할 업무상 주의의무가 있고, 만약 이와 같은 업무상 주의의무를 소홀히 하여 환자에게 위해가 발생하였다면 甲은 그에 대한 과실 책임을 면할 수 없다. (25.1차)","answer":true,"quote":"수련병원의 전문의와 전공의 등의 관계처럼 의료기관 내의 직책상 주된 의사의 지위에서 지휘·감독 관계에 있는 다른 의사에게 특정 의료행위를 위임하는 수직적 분업의 경우에는, 그 다른 의사에게 전적으로 위임된 것이 아닌 이상 주된 의사는 자신이 주로 담당하는 환자에 대하여 다른 의사가 하는 의료행위의 내용이 적절한 것인지 여부를 확인하고 감독하여야 할 업무상 주의의무가 있고, 만약 의사가 이와 같은 업무상 주의의무를 소홀히 하여 환자에게 위해가 발생하였다면 주된 의사는 그에 대한 과실 책임을 면할 수 없다.","cite":"대법원 2022도1499","badge":"","topic":"","from":"GY-2025-1-X-05","seq":null},{"id":"X-OX-199","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제188조에 규정된 교통방해에 의한 치사상죄는 결과적 가중범이므로, 교통방해 행위가 피해자의 사상이라는 결과를 발생하게 한 유일하거나 직접적인 원인이 된 경우에만 상당 인과관계를 인정할 수 있다. (25.1차)","answer":false,"quote":"그리고 교통방해 행위가 피해자의 사상이라는 결과를 발생하게 한 유일하거나 직접적인 원인이 된 경우만이 아니라, 그 행위와 결과 사이에 피해자나 제3자의 과실 등 다른 사실이 개재된 때에도 그와 같은 사실이 통상 예견될 수 있는 것이라면 상당인과관계를 인정할 수 있다.","cite":"대법원 2014도6206","badge":"","topic":"","from":"GY-2025-1-X-24","seq":null},{"id":"X-OX-136","subject":"형사법","unit":"형법 총론","stmt":"甲에게 징역 12년 형이 확정된 후 그 집행을 받지 아니하고 15년이 경과했다면, 그 기간 내에 형의 집행을 면할 목적으로 국외에 3년 동안 나가 있던 것이 확인된 경우라도 형의 시효는 완성된다. (22.2차)","answer":false,"quote":"10년 이상 징역의 시효는 15년이지만, 형 집행을 면하려고 국외에 있던 3년은 시효가 진행되지 않아 아직 완성되지 않았다.","cite":"형법 제78조 · 형법 제79조","badge":"","topic":"","from":"GY-2022-2-X-13","seq":null},{"id":"X-OX-205","subject":"형사법","unit":"형법 총론","stmt":"형의 선고유예를 받은 자가 유예기간 중 벌금 이상의 형에 처한 판결이 확정되거나 자격정지 이상의 형에 처한 전과가 발견된 때에는 유예한 형을 선고한다. (25.2차)","answer":false,"quote":"①형의 선고유예를 받은 자가 유예기간 중 자격정지 이상의 형에 처한 판결이 확정되거나 자격정지 이상의 형에 처한 전과가 발견된 때에는 유예한 형을 선고한다.","cite":"형법 제61조 제1항","badge":"","topic":"","from":"GY-2025-2-X-13","seq":null},{"id":"X-OX-137","subject":"형사법","unit":"형법 총론","stmt":"甲이 용변을 보고 있는 사람을 촬영하기 위해 자신의 휴대전화의 카메라 기능을 켜고 A가 있는 화장실 칸 너머로 휴대전화를 든 손을 넘겼으나, A가 놀라 소리를 질러 실제 촬영은 하지 못한 경우, 甲의 행위는 성폭력범죄의 처벌 등에 관한 특례법 위반(카메라등이용촬영)죄의 실행에 착수했다고 볼 수 없다. (22.2차)","answer":false,"quote":"카메라를 켜고 화장실 칸 너머로 손을 넘겼다면 촬영 대상을 겨눈 것이라 실제로 찍지 못했어도 실행의 착수가 인정된다.","cite":"대법원 2021도749","badge":"","topic":"","from":"GY-2022-2-X-17","seq":null},{"id":"X-OX-147","subject":"형사법","unit":"형법 총론","stmt":"법령이 개정 내지 폐지된 경우가 아니라, 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우도 ｢형법｣ 제1조 제2항에서 말하는 법령의 변경에 해당한다. (23.2차)","answer":false,"quote":"한편 법령이 개정 내지 폐지된 경우가 아니라, 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우도 형법 제1조 제2항 과 형사소송법 제326조 제4호 에서 말하는 법령의 변경에 해당한다고 볼 수 없다.","cite":"대법원 2020도16420","badge":"","topic":"","from":"GY-2023-2-X-02","seq":null},{"id":"X-OX-083","subject":"형사법","unit":"형법 총론","stmt":"甲이 A에게 위조한 예금통장 사본 등을 보여주면서 외국회사에서 투자금을 받았다고 거짓말하며 자금 대여를 요청하였으나, A와 함께 그 입금 여부를 확인하기 위해 은행에 가던 중 범행이 발각될 것이 두려워 은행 입구에서 차용을 포기하고 돌아간 경우, 이를 자의에 의한 사기죄의 중지미수로 볼 수는 없다. (25.1차)","answer":true,"quote":"피고인이 甲에게 위조한 예금통장 사본 등을 보여주면서 외국회사에서 투자금을 받았다고 거짓말하며 자금 대여를 요청하였으나, 甲과 함께 그 입금 여부를 확인하기 위해 은행에 가던 중 은행 입구에서 차용을 포기하고 돌아가 사기미수로 기소된 사안에서, 피고인이 범행이 발각될 것이 두려워 범행을 중지한 것으로서 일반 사회통념상 범죄를 완수함에 장애가 되는 사정에 해당하여 자의에 의한 중지미수로 볼 수 없다고 한 사례","cite":"대법원 2011도10539","badge":"","topic":"","from":"GY-2025-1-X-09","seq":null},{"id":"X-OX-059","subject":"형사법","unit":"형법 총론","stmt":"같은 날 무면허운전 행위를 여러 차례 반복한 경우, 그 범의의 단일성 내지 계속성이 인정되지 않거나 범행 방법 등이 동일하지 않다면 각 무면허운전 범행은 실체적 경합 관계에 있다. (24.1차)","answer":true,"quote":"한편 같은 날 무면허운전 행위를 여러 차례 반복한 경우라도 그 범의의 단일성 내지 계속성이 인정되지 않거나 범행 방법 등이 동일하지 않은 경우 각 무면허운전 범행은 실체적 경합 관계에 있다고 볼 수 있으나, 그와 같은 특별한 사정이 없다면 각 무면허운전 행위는 동일 죄명에 해당하는 수 개의 동종 행위가 동일한 의사에 의하여 반복되거나 접속·연속하여 행하여진 것으로 봄이 상당하고 그로 인한 피해법익도 동일한 이상, 각 무면허운전 행위를 통틀어 포괄일죄로 처단하여야 한다.","cite":"대법원 2022도8806","badge":"","topic":"","from":"GY-2024-1-X-11","seq":null},{"id":"X-OX-096","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제30조에서 정한 ‘2인 이상이 공동하여 죄를 범한 때’의 ‘죄’에는 고의범뿐만 아니라 과실범도 포함되는 것이므로 과실범의 경우에도 공동정범이 성립할 수 있으나, 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없었다면 ‘공동하여’ 죄를 범하였다고 볼 수 없으므로, 과실범의 공동정범이 성립한다고 볼 수 없다. (25.2차)","answer":true,"quote":"형법 제30조 에서 정한 ‘2인 이상이 공동하여 죄를 범한 때’의 ‘죄’에는 고의범뿐만 아니라 과실범도 포함되는 것이므로 과실범의 경우에도 공동정범이 성립할 수 있으나, 의사의 연락이나 주의의무 위반에 대한 공동의 인식이 없었다면 ‘공동하여’ 죄를 범하였다고 볼 수 없으므로, 과실범의 공동정범이 성립한다고 볼 수 없다.","cite":"대법원 2024도1856","badge":"","topic":"","from":"GY-2025-2-X-10","seq":null},{"id":"X-OX-054","subject":"형사법","unit":"형법 총론","stmt":"실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우, 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 되었다면 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 진다. (24.1차)","answer":true,"quote":"실화죄에 있어서 공동의 과실이 경합되어 화재가 발생한 경우 적어도 각 과실이 화재의 발생에 대하여 하나의 조건이 된 이상은 그 공동적 원인을 제공한 사람들은 각자 실화죄의 책임을 면할 수 없다.","cite":"대법원 2022도16120","badge":"","topic":"","from":"GY-2024-1-X-07","seq":null},{"id":"X-OX-182","subject":"형사법","unit":"형법 총론","stmt":"甲이 타인의 사망을 보험사고로 하는 생명보험계약을 체결 함에 있어 제3자가 피보험자인 것처럼 가장하여 체결하는 과정에서 고의로 보험사고를 일으키려는 의도를 가지고 보험계약을 체결하는 경우 甲의 행위는 보험사기의 예비 행위에 해당한다. (24.2차)","answer":false,"quote":"타인의 사망을 보험사고로 하는 생명보험계약을 체결함에 있어 제3자가 피보험자인 것처럼 가장하여 체결하는 등으로 그 유효요건이 갖추어지지 못한 경우에도, 보험계약 체결 당시에 이미 보험사고가 발생하였음에도 이를 숨겼다거나 보험사고의 구체적 발생 가능성을 예견할 만한 사정을 인식하고 있었던 경우 또는 고의로 보험사고를 일으키려는 의도를 가지고 보험계약을 체결한 경우와 같이 보험사고의 우연성과 같은 보험의 본질을 해칠 정도라고 볼 수 있는 특별한 사정이 없는 한, 그와 같이 하자 있는 보험계약을 체결한 행위만으로는 미필적으로라도 보험금을 편취하려는 의사에 의한 기망행위의 실행에 착수한 것으로 볼 것은 아니다.","cite":"대법원 2013도7494","badge":"","topic":"","from":"GY-2024-2-X-09","seq":null},{"id":"X-OX-132","subject":"형사법","unit":"형법 총론","stmt":"형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하는 경우, 그 행정법규를 해석함에 있어서는 유추해석 금지의 원칙이 적용되지 아니한다. (22.2차)","answer":false,"quote":"형벌법규의 적용대상이 행정법규가 규정한 사항을 내용으로 하는 경우, 행정법규 규정의 해석 원칙","cite":"대법원 2021도10981","badge":"","topic":"","from":"GY-2022-2-X-01","seq":null},{"id":"X-OX-099","subject":"형사법","unit":"형법 총론","stmt":"강제추행죄는 정범 자신이 직접 범죄를 실행하여야 하는 자수범 이라고 볼 수 없으므로 간접정범의 형태로도 범할 수 있다. (25.2차)","answer":true,"quote":"강제추행죄는 사람의 성적 자유 내지 성적 자기결정의 자유를 보호하기 위한 죄로서 정범 자신이 직접 범죄를 실행하여야 성립하는 자수범이라고 볼 수 없으므로, 처벌되지 아니하는 타인을 도구로 삼아 피해자를 강제로 추행하는 간접정범의 형태로도 범할 수 있다.","cite":"대법원 2016도17733","badge":"","topic":"","from":"GY-2025-2-X-11","seq":null},{"id":"X-OX-108","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제15조 제2항이 규정하고 있는 결과적 가중범은 행위자가 행위시에 그 결과의 발생을 예견할 수 없을 때에는 비록 그 행위와 결과 사이에 인과관계가 있다 하더라도 무거운 죄로 벌할 수 없다. (26.1차)","answer":true,"quote":"형법 제15조 제2항 이 규정하고 있는 이른바 결과적 가중범은 행위자가 행위시에 그 결과의 발생을 예견할 수 없을 때에는 비록 그 행위와 결과 사이에 인과관계가 있다 하더라도 중한 죄로 벌할 수 없다.","cite":"대법원 88도178","badge":"","topic":"","from":"GY-2026-1-X-06","seq":null},{"id":"X-OX-055","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제188조의 교통방해치사상죄가 성립하려면 교통방해 행위와 사상의 결과 사이에 상당인과관계가 있어야 하고 행위 시에 결과의 발생을 예견할 수 있어야 한다. 그 행위와 결과 사이에 피해자나 제3자의 과실 등 다른 사실이 개입되었을지 라도 그와 같은 사실이 통상 예견될 수 있는 것이라면 상당인과 관계가인정된다. (24.1차)","answer":true,"quote":"형법 제188조 에 규정된 교통방해에 의한 치사상죄는 결과적 가중범이므로, 위 죄가 성립하려면 교통방해 행위와 사상(死傷)의 결과 사이에 상당인과관계가 있어야 하고 행위 시에 결과의 발생을 예견할 수 있어야 한다.","cite":"대법원 2014도6206","badge":"","topic":"","from":"GY-2024-1-X-07","seq":null},{"id":"X-OX-170","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣은 벌금형의 집행유예는 인정하나, 벌금형의 선고유예는 인정하지 않는다. (24.1차)","answer":false,"quote":"벌금형도 선고유예를 할 수 있고, 집행유예는 500만원 이하의 벌금에 한해 할 수 있다.","cite":"형법 제59조 · 형법 제62조","badge":"","topic":"","from":"GY-2024-1-X-12","seq":null},{"id":"X-OX-116","subject":"형사법","unit":"형법 총론","stmt":"방조범은 2중의 고의를 필요로 하므로 정범이 정하는 범죄의 일시, 장소, 객체 등을 구체적으로 인식하여야 하며, 나아가 정범이 누구인지 확정적으로 인식해야 한다. (22.1차)","answer":false,"quote":"저작권법이 보호하는 복제권의 침해를 방조하는 행위란 정범의 복제권 침해를 용이하게 해주는 직접·간접의 모든 행위로서, 정범의 복제권 침해행위 중에 이를 방조하는 경우는 물론, 복제권 침해행위에 착수하기 전에 장래의 복제권 침해행위를 예상하고 이를 용이하게 해주는 경우도 포함하며, 정범에 의하여 실행되는 복제권 침해행위에 대한 미필적 고의가 있는 것으로 충분하고 정범의 복제권 침해행위가 실행되는 일시, 장소, 객체 등을 구체적으로 인식할 필요가 없으며, 나아가 정범이 누구인지 확정적으로 인식할 필요도 없다.","cite":"대법원 2005도872","badge":"","topic":"","from":"GY-2022-1-X-04","seq":null},{"id":"X-OX-117","subject":"형사법","unit":"형법 총론","stmt":"형법 제167조 제1항의 일반물건방화죄에서 ‘공공의 위험 발생’은 고의의 인식 대상이 아니다. (22.1차)","answer":false,"quote":"일반물건방화죄는 공공의 위험이 생겨야 성립하는 구체적 위험범이라, 그 위험은 구성요건 요소로서 고의로 인식해야 할 대상이다.","cite":"형법 제167조","badge":"","topic":"","from":"GY-2022-1-X-04","seq":null},{"id":"X-OX-192","subject":"형사법","unit":"형법 총론","stmt":"골프경기의 경기보조원은 그 업무의 내용상 골프채의 운반‧ 이동‧취급 및 경기에 관한 조언 등으로 골프경기 참가자를 돕는 역할을 수행하는 데 그치는 것이지, 경기 진행 도중 경기 참가자의 행동으로 다른 사람에게 상해의 결과가 발생할 위험성을 고려하여 사고의 위험을 미연에 방지해야 할 업무상 주의의무까지 부담하는 것은 아니다. (25.1차)","answer":false,"quote":"골프와 같은 개인 운동경기에서, 경기에 참가하는 자는 자신의 행동으로 인해 다른 사람이 다칠 수도 있으므로 경기규칙을 준수하고 주위를 살펴 상해의 결과가 발생하는 것을 미연에 방지해야 할 주의의무가 있고, 경기보조원은 그 업무의 내용상 기본적으로는 골프채의 운반·이동·취급 및 경기에 관한 조언 등으로 골프경기 참가자를 돕는 역할을 수행하면서 아울러 경기 진행 도중 위와 같이 경기 참가자의 행동으로 다른 사람에게 상해의 결과가 발생할 위험성을 고려해 예상할 수 있는 사고의 위험을 미연에 방지하기 위한 조치를 취함으로써 경기 참가자들의 안전을 배려하고 그 생명·신체의 위험을 방지할 업무상 주의의무를 부담한다.","cite":"대법원 2022도11950","badge":"","topic":"","from":"GY-2025-1-X-05","seq":null},{"id":"X-OX-211","subject":"형사법","unit":"형법 총론","stmt":"형벌법규를 해석할 때 법규정의 문언 자체가 비교적 명확한 개념으로 구성되어 있다고 하더라도 체계적·논리적 해석 방법을 제한 없이 사용할 수 있다. (26.1차)","answer":false,"quote":"형벌법규는 문언이 비교적 명확한 개념이면 체계적·논리적 해석을 쓸 필요가 없거나 제한되고, 제한 없이 쓸 수 있는 것이 아니다.","cite":"대법원 2015도8335","badge":"","topic":"","from":"GY-2026-1-X-01","seq":null},{"id":"X-OX-090","subject":"형사법","unit":"형법 총론","stmt":"법규범이 명확한지 여부는 그 법규범이 수범자에게 법규의 의미내용을 알 수 있도록 공정한 고지를 하여 예측가능성을 주고 있는지 여부 및 그 법규범이 법을 해석‧집행하는 기관에게 충분한 의미 내용을 규율하여 자의적인 법해석이나 법집행이 배제되는지 여부에 따라 판단할 수 있다. (25.2차)","answer":true,"quote":"그리고 어떠한 법규범이 명확한지 여부는 그 법규범이 수범자에게 법규의 의미내용을 알 수 있도록 공정한 고지를 하여 예측가능성을 주고 있는지 여부 및 그 법규범이 법을 해석·집행하는 기관으로 하여금 자의적인 해석이나 집행을 하지 못하게 하는지 여부, 다시 말하면 예측가능성 및 자의적 법집행 배제가 확보되는지 여부에 따라 이를 판단할 수 있다.","cite":"대법원 2022도10961","badge":"","topic":"","from":"GY-2025-2-X-01","seq":null},{"id":"X-OX-089","subject":"형사법","unit":"형법 총론","stmt":"법률의 시행령이 형사처벌에 관한 사항을 규정하면서 법률의 명시적인 위임 범위를 벗어나 처벌의 대상을 확장하는 것은 죄형법정주의의 원칙에 어긋나므로, 그러한 시행령은 위임입법의 한계를 벗어난 것으로서 무효이다. (25.2차)","answer":true,"quote":"[다수의견] 법률의 시행령은 모법인 법률의 위임 없이 법률이 규정한 개인의 권리·의무에 관한 내용을 변경·보충하거나 법률에서 규정하지 아니한 새로운 내용을 규정할 수 없고, 특히 법률의 시행령이 형사처벌에 관한 사항을 규정하면서 법률의 명시적인 위임 범위를 벗어나 처벌의 대상을 확장하는 것은 죄형법정주의의 원칙에도 어긋나는 것이므로, 그러한 시행령은 위임입법의 한계를 벗어난 것으로서 무효이다.","cite":"대법원 2015도16014","badge":"","topic":"","from":"GY-2025-2-X-01","seq":null},{"id":"X-OX-118","subject":"형사법","unit":"형법 총론","stmt":"A가 칼을 들고 찌르자 甲이 그 칼을 뺏어 반격을 가한 결과 A에게 상해를 입힌 경우 (22.1차)","answer":false,"quote":"피해자가 칼을 들고 피고인을 찌르자 그 칼을 뺏어 그 칼로 반격을 가한 결과 피해자에게 상해를 입게 하였다 하더라도 그와 같은 사실만으로는 피고인에 대한 현재의 부당한 침해를 방위하기 위한 행위로서 상당한 이유가 있는 경우에 해당한다고 할 수 없다.","cite":"대법원 83도1873","badge":"","topic":"","from":"GY-2022-1-X-07","seq":null},{"id":"X-OX-142","subject":"형사법","unit":"형법 총론","stmt":"방조범은 정범의 실행행위를 방조한다는 ‘방조의 고의’와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 ‘정범의 고의’를 갖추어야 하며, 목적범의 경우 정범의 목적에 대한 구체적 내용까지 인식할 것을 요한다. (23.1차)","answer":false,"quote":"방조범은 방조의 고의와 정범의 고의가 있으면 되고, 목적범이라도 정범에게 목적이 있음을 알면 족하며 목적의 구체적 내용까지 알 필요는 없다.","cite":"대법원 2021도1965 · 형법 제32조","badge":"","topic":"","from":"GY-2023-1-X-11","seq":null},{"id":"X-OX-171","subject":"형사법","unit":"형법 총론","stmt":"지하철 환승에스컬레이터 내에서 카메라폰으로 일정한 시간 동안 피해자의 치마 속 신체 부위를 동영상 촬영하였으나, 경찰관 에게 발각되어 저장버튼을 누르지 않고 촬영을 종료한 경우, 구 ｢성폭력범죄의 처벌 및 피해자보호 등에 관한 법률｣상 카메라 등 이용 촬영죄의 미수범이 성립한다. (24.1차)","answer":false,"quote":"피고인이 지하철 환승에스컬레이터 내에서 카메라폰으로 피해자의 치마 속 신체 부위를 동영상 촬영하였다고 하여 구 성폭력범죄의 처벌 및 피해자보호 등에 관한 법률 위반으로 기소된 사안에서, 동영상 촬영 중 저장버튼을 누르지 않고 촬영을 종료하였다는 이유만으로 위 범행이 ‘기수’에 이르지 않았다고 단정한 원심판결에 법리오해로 인한 심리미진 등의 위법이 있다고 한 사례","cite":"대법원 2010도10677","badge":"","topic":"","from":"GY-2024-1-X-14","seq":null},{"id":"X-OX-086","subject":"형사법","unit":"형법 총론","stmt":"양형의 조건에 관하여 규정한 ｢형법｣ 제51조의 사항은 널리 형의 양정에 관한 법원의 재량사항에 속한다고 해석되므로, 법원은 범죄의 구성요건이나 법률상 규정된 형의 가중‧감면의 사유가 되는 경우를 제외하고는, 법률이 규정한 증거로서의 자격이나 증거조사방식에 구애됨이 없이 상당한 방법으로 조사하여 양형의 조건이 되는 사항을 인정할 수 있다. (25.1차)","answer":true,"quote":"양형 조건은 법원의 재량사항이라, 구성요건이나 법률상 가중·감면 사유가 아니면 증거능력·증거조사 방식에 매이지 않고 상당한 방법으로 조사해 인정할 수 있다.","cite":"대법원 2010도750 · 형법 제51조","badge":"","topic":"","from":"GY-2025-1-X-34","seq":null},{"id":"X-OX-016","subject":"형사법","unit":"형법 총론","stmt":"예인선 정기용선자의 현장소장 甲은 사고의 위험성이 높은 시점에 출항을 강행할 것을 지시하였고, 예인선 선장 乙은 甲의 지시에 따라 사고의 위험성이 높은 시점에 출항하는 등 무리 하게 예인선을 운항한 결과 예인되던 선박에 적재된 물건이 해상에 추락하여 선박교통을 방해한 경우, 甲과 乙은 업무상 과실일반교통방해죄의 공동정범이 성립한다. (22.2차)","answer":true,"quote":"예인선 정기용선자의 현장소장 甲은 사고의 위험성이 높은 시점에 출항을 강행할 것을 지시하였고, 예인선 선장 乙은 甲의 지시에 따라 사고의 위험성이 높은 시점에 출항하는 등 무리하게 예인선을 운항한 결과 예인되던 선박에 적재된 물건이 해상에 추락하여 선박교통을 방해한 사안에서, 甲과 乙을 업무상과실일반교통방해죄의 공동정범으로 처벌한 사례","cite":"대법원 2008도11784","badge":"","topic":"","from":"GY-2022-2-X-08","seq":null},{"id":"X-OX-131","subject":"형사법","unit":"형법 총론","stmt":"정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적 으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음 하는 대체물에 해당하므로 형사소송법 제310조의2에서 정한 전문법칙이 적용된다. (22.1차)","answer":false,"quote":"그런데 정보통신망을 통하여 공포심이나 불안감을 유발하는 글을 반복적으로 상대방에게 도달하게 하는 행위를 하였다는 공소사실에 대하여 휴대전화기에 저장된 문자정보가 그 증거가 되는 경우, 그 문자정보는 범행의 직접적인 수단이고 경험자의 진술에 갈음하는 대체물에 해당하지 않으므로, 형사소송법 제310조의2 에서 정한 전문법칙이 적용되지 않는다.","cite":"대법원 2006도2556","badge":"","topic":"","from":"GY-2022-1-X-38","seq":null},{"id":"X-OX-084","subject":"형사법","unit":"형법 총론","stmt":"교사행위에 의하여 피교사자가 범죄 실행을 결의하게 된 이상 피교사자에게 다른 원인이 있어 범죄를 실행한 경우에도 교사범의 성립에는 영향이 없다. (25.1차)","answer":true,"quote":"정범이 교사자의 교사행위에 의하여 범죄 실행을 결의하게 된 경우, 교사행위 외에 다른 원인이 있어 범죄를 실행한 경우에도 교사범이 성립하는지 여부 (적극)","cite":"대법원 2012도7407","badge":"","topic":"","from":"GY-2025-1-X-11","seq":null},{"id":"X-OX-062","subject":"형사법","unit":"형법 총론","stmt":"｢형법｣ 제151조 제1항의 범인도피죄에서 ‘죄를 범한 자’라 함은 범죄의 혐의를 받아 수사대상이 되어 있는 자를 포함하고, 나아가 벌금 이상의 형에 해당하는 죄를 범한 자라는 것을 인식 하면서도 도피하게 한 경우에는 그 자가 당시에는 아직 수사 대상이 되어 있지 않았다고 하더라도 범인도피죄가 성립한다. (24.1차)","answer":true,"quote":"형법 제151조 에서 규정하는 범인도피죄는 범인은닉 이외의 방법으로 범인에 대한 수사, 재판 및 형의 집행 등 형사사법의 작용을 곤란 또는 불가능하게 하는 행위를 말하는 것으로서 그 방법에는 어떠한 제한이 없고, 또 위 죄는 위험범으로서 현실적으로 형사사법의 작용을 방해하는 결과가 초래될 것이 요구되지 아니하므로, 형법 제151조 제1항 의 이른바, 죄를 범한 자라 함은 범죄의 혐의를 받아 수사대상이 되어 있는 자를 포함하며, 나아가 벌금 이상의 형에 해당하는 죄를 범한 자라는 것을 인식하면서도 도피하게 한 경우에는 그 자가 당시에는 아직 수사대상이 되어 있지 않았다고 하더라도 범인도피죄가 성립한다고 할 것이고, 한편, 증거인멸죄에 관한 형법 제155조 제1항 의 이른바 타인의 형사사건이란 인멸행위시에 아직 수사절차가 개시되기 전이라도 장차 형사사건이 될 수 있는 것까지 포함한다.","cite":"대법원 2003도4533","badge":"","topic":"","from":"GY-2024-1-X-27","seq":null},{"id":"X-OX-210","subject":"형사법","unit":"형법 총론","stmt":"양벌규정에서 ‘행위자가 아닌 법인 또는 개인’은 국가형벌권 행사의 대상으로서 구성요건에서 정한 위반행위의 방지를 위한 주의와 감독의 해태 등을 근거로 별도의 형벌규정에 따라 법인 또는 개인의 직접책임 내지 자기책임에 기초하여 처벌되는 것이나, 양벌규정에서의 사업주와 행위자의 관계는 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와 동일하게 볼 수 있다. (26.1차)","answer":false,"quote":"이때의 ‘행위자가 아닌 법인 또는 개인’은 국가형벌권 행사의 대상으로서 구성요건에서 정한 위반행위의 방지를 위한 주의와 감독의 해태 등을 근거로 별도의 형벌규정에 따라 법인 또는 개인의 직접책임 내지 자기책임에 기초하여 처벌되는 것이므로, 양벌규정에서의 사업주와 행위자의 관계는 2인 이상이 가공하여 공동의 구성요건을 실현하는 공범관계에 있는 자와 동일하게 볼 수 없다.","cite":"대법원 2024도15290","badge":"","topic":"","from":"GY-2026-1-X-01","seq":null},{"id":"X-OX-091","subject":"형사법","unit":"형법 총론","stmt":"부진정부작위범에 있어서 부작위를 실행의 착수로 볼 수 있기 위해서는 구성요건적 결과 발생의 위험이 구체화한 상황에서 부작위가 이루어져야 한다. (25.2차)","answer":true,"quote":"그러한 부작위를 실행의 착수로 볼 수 있기 위해서는 작위의무가 이행되지 않으면 사무처리의 임무를 부여한 사람이 재산권을 행사할 수 없으리라고 객관적으로 예견되는 등으로 구성요건적 결과 발생의 위험이 구체화한 상황에서 부작위가 이루어져야 한다.","cite":"대법원 2020도15529","badge":"","topic":"","from":"GY-2025-2-X-03","seq":null},{"id":"X-OX-130","subject":"형사법","unit":"형법 총론","stmt":"합리적 의심이란 요증사실과 양립할 수 없는 사실의 개연성에 대한 합리성 있는 의문을 의미하는 것으로서, 관념적인 의심 이나 추상적인 가능성에 기초한 의심도 포함된다. (22.1차)","answer":false,"quote":"합리적 의심은 논리와 경험칙에 기초해 요증사실과 양립할 수 없는 사실의 개연성에 대한 합리적 의문이고, 관념적 의심이나 추상적 가능성은 포함되지 않는다.","cite":"대법원 2004도2221 · 형사소송법 제307조","badge":"","topic":"","from":"GY-2022-1-X-35","seq":null},{"id":"X-OX-144","subject":"형사법","unit":"형법 총론","stmt":"｢경찰관 직무집행법｣ 제3조 제4항은 경찰관이 불심검문을 하고자 할 때에는 자신의 신분을 표시하는 증표를 제시하여야 한다고 규정하고 있고, 동법 시행령은 위 법에서 규정한 신분을 표시하는 증표가 경찰관의 공무원증이라고 규정하고 있으므로, 경찰관이 불심검문 과정에서 공무원증을 제시하지 않았다면 어떠한 경우라도 그 불심검문은 위법한 공무집행에 해당한다. (23.1차)","answer":false,"quote":"경찰관직무집행법(이하 ‘법’이라 한다) 제3조 제4항 은 경찰관이 불심검문을 하고자 할 때에는 자신의 신분을 표시하는 증표를 제시하여야 한다고 규정하고, 경찰관직무집행법 시행령 제5조 는 위 법에서 규정한 신분을 표시하는 증표는 경찰관의 공무원증이라고 규정하고 있는데, 불심검문을 하게 된 경위, 불심검문 당시의 현장상황과 검문을 하는 경찰관들의 복장, 피고인이 공무원증 제시나 신분 확인을 요구하였는지 여부 등을 종합적으로 고려하여, 검문하는 사람이 경찰관이고 검문하는 이유가 범죄행위에 관한 것임을 피고인이 충분히 알고 있었다고 보이는 경우에는 신분증을 제시하지 않았다고 하여 그 불심검문이 위법한 공무집행이라고 할 수 없다.","cite":"대법원 2014도7976","badge":"","topic":"","from":"GY-2023-1-X-28","seq":null},{"id":"X-OX-190","subject":"형사법","unit":"형법 총론","stmt":"회사합병이 있는 경우 피합병회사의 권리‧의무는 사법상의 관계나 공법상의 관계를 불문하고 모두 합병으로 인하여 존속하는 회사에 승계되는 것이 원칙이므로, 합병으로 인하여 소멸한 법인이 그 종업원 등의 위법행위에 대해 양벌규정에 따라 부담하던 형사 책임은 합병으로 인하여 존속하는 법인에 승계된다. (25.1차)","answer":false,"quote":"회사합병이 있는 경우 피합병회사의 권리·의무는 사법상의 관계나 공법상의 관계를 불문하고 모두 합병으로 인하여 존속하는 회사에 승계되는 것이 원칙이지만, 그 성질상 이전을 허용하지 않는 것은 승계의 대상에서 제외되어야 할 것인바, 양벌규정에 의한 법인의 처벌은 어디까지나 형벌의 일종으로서 행정적 제재처분이나 민사상 불법행위책임과는 성격을 달리하는 점, 형사소송법 제328조 가 ‘피고인인 법인이 존속하지 아니하게 되었을 때’를 공소기각결정의 사유로 규정하고 있는 것은 형사책임이 승계되지 않음을 전제로 한 것이라고 볼 수 있는 점 등에 비추어 보면, 합병으로 인하여 소멸한 법인이 그 종업원 등의 위법행위에 대해 양벌규정에 따라 부담하던 형사책임은 그 성질상 이전을 허용하지 않는 것으로서 합병으로 인하여 존속하는 법인에 승계되지 않는다.","cite":"대법원 2005도4471","badge":"","topic":"","from":"GY-2025-1-X-03","seq":null},{"id":"X-OX-105","subject":"형사법","unit":"형법 총론","stmt":"행위자가 구호의무를 이행함으로써 사망의 결과를 쉽게 방지 할 수 있음에도 그에 이르는 사태의 핵심적 경과를 그대로 방관하여 사망의 결과를 초래한 경우, 작위의무를 이행하였다면 결과가 발생하지 않았을 것이라는 관계가 인정되어야 부작위와 사망의 결과 사이에 인과관계가 있다. (26.1차)","answer":true,"quote":"따라서 선박침몰 등과 같은 조난사고로 승객이나 다른 승무원들이 스스로 생명에 대한 위협에 대처할 수 없는 급박한 상황이 발생한 경우에는 선박의 운항을 지배하고 있는 선장이나 갑판 또는 선내에서 구체적인 구조행위를 지배하고 있는 선원들은 적극적인 구호활동을 통해 보호능력이 없는 승객이나 다른 승무원의 사망 결과를 방지하여야 할 작위의무가 있으므로, 법익침해의 태양과 정도 등에 따라 요구되는 개별적·구체적인 구호의무를 이행함으로써 사망의 결과를 쉽게 방지할 수 있음에도 그에 이르는 사태의 핵심적 경과를 그대로 방관하여 사망의 결과를 초래하였다면, 부작위는 작위에 의한 살인행위와 동등한 형법적 가치를 가지고, 작위의무를 이행하였다면 결과가 발생하지 않았을 것이라는 관계가 인정될 경우에는 작위를 하지 않은 부작위와 사망의 결과 사이에 인과관계가 있다.","cite":"대법원 2015도6809","badge":"","topic":"","from":"GY-2026-1-X-03","seq":null},{"id":"X-OX-166","subject":"형사법","unit":"형법 총론","stmt":"A주식회사로부터 공립유치원의 놀이시설 제작 및 설치공사를 하도급 받은 甲이 유치원 행정실장 등에게 공사대금의 직접 지급을 요구하였으나 거절당하자, 공사대금 직불청구권이 있는 놀이시설의 정당한 유치권자로서 공사대금 채권을 확보할 필요가 있어 놀이시설의 일부인 보호대를 칼로 뜯어내고 일부 놀이시설은 철거하는 방법으로 공무소에서 사용하는 물건을 손상한 경우 (24.1차)","answer":false,"quote":"甲 주식회사가 피고인에게 공립유치원의 놀이시설 제작 및 설치공사를 하도급주었는데, 피고인이 유치원 행정실장 등에게 공사대금의 직접 지급을 요구하였으나 거절당하자 놀이시설의 일부인 보호대를 칼로 뜯어내고 일부 놀이시설은 철거하는 방법으로 공무소에서 사용하는 물건을 손상하였다는 내용으로 기소된 사안에서, 피고인에게 공사대금 직불청구권이 있고 놀이시설의 정당한 유치권자로서 공사대금 채권을 확보할 필요가 있었다고 하더라도, 위와 같은 피고인의 행위가 수단과 방법의 상당성이 인정된다거나 공사대금 확보를 위한 유치권을 행사하는 데에 긴급하고 불가피한 수단이었다고 볼 수 없는데도, 공용물건손상의 공소사실에 대하여 무죄를 선고한 원심판결에 정당행위에 관한 법리오해의 잘못이 있다고 한 사례","cite":"대법원 2017도2758","badge":"","topic":"","from":"GY-2024-1-X-05","seq":null},{"id":"X-OX-221","subject":"형사법","unit":"형법 총론","stmt":"형의 집행유예를 선고받은 자는 ｢형법｣ 제65조에 의하여 그 선고가 실효 또는 취소됨이 없이 정해진 유예기간을 무사히 경과하여 형의 선고가 효력을 잃게 되었다면, 형의 선고가 있었다는 기왕의 사실 자체까지 없어지는 것이므로, ｢형법｣ 제59조 제1항 단행에서 정한 선고유예 결격사유인 ‘자격정지 이상의 형을 받은 전과가 있는 자’에 해당하지 않는다. (26.1차)","answer":false,"quote":"형법 제59조 제1항 단행에서 정한 \"자격정지 이상의 형을 받은 전과\"라 함은 자격정지 이상의 형을 선고받은 범죄경력 자체를 의미하는 것이고, 그 형의 효력이 상실된 여부는 묻지 않는 것으로 해석함이 상당하다고 할 것이고, 따라서 형의 집행유예를 선고받은 자는 형법 제65조 에 의하여 그 선고가 실효 또는 취소됨이 없이 정해진 유예기간을 무사히 경과하여 형의 선고가 효력을 잃게 되었다고 하더라도 형의 선고의 법률적 효과가 없어진다는 것일 뿐, 형의 선고가 있었다는 기왕의 사실 자체까지 없어지는 것은 아니므로, 형법 제59조 제1항 단행에서 정한 선고유예 결격사유인 \"자격정지 이상의 형을 받은 전과가 있는 자\"에 해당한다고 보아야 한다.","cite":"대법원 2003도3768","badge":"","topic":"","from":"GY-2026-1-X-13","seq":null},{"id":"X-OX-203","subject":"형사법","unit":"형법 총론","stmt":"정당행위의 요건인 긴급성과 보충성은 수단의 상당성을 판단할 때 고려해야 될 하나의 요소로 참작할 뿐 이를 넘어 독립적인 요건으로 요구할 것은 아니며, 그 내용 역시 ‘일체의 법률적인 적법한 수단이 존재하지 않을 것’을 의미한다. (25.2차)","answer":false,"quote":"이에 비하여 행위의 긴급성과 보충성은 수단의 상당성을 판단할 때 고려요소의 하나로 참작하여야 하고 이를 넘어 독립적인 요건으로 요구할 것은 아니다.","cite":"대법원 2017도2760","badge":"","topic":"","from":"GY-2025-2-X-07","seq":null},{"id":"X-OX-163","subject":"형사법","unit":"형법 총론","stmt":"방조범은 정범의 실행을 방조한다는 방조의 고의와 정범의 행위가 구성요건에 해당하는 행위인 점에 대한 정범의 고의가 있어야 하고, 방조범에 있어서 정범의 고의는 정범에 의하여 실현되는 범죄의 구체적 내용까지 인식할 것을 요한다. (24.1차)","answer":false,"quote":"방조범에게 필요한 정범의 고의는 정범이 저지를 범죄의 구체적 내용까지 알 필요 없이 미필적 인식이나 예견이면 된다.","cite":"대법원 2003도6056","badge":"","topic":"","from":"GY-2024-1-X-03","seq":null},{"id":"X-OX-175","subject":"형사법","unit":"형법 총론","stmt":"｢도로교통법｣ 제43조(무면허운전 등의 금지)를 위반하여 운전 면허를 받지 아니하고 자동차를 운전하는 행위를 대상으로 하는 ｢교통사고처리 특례법｣ 제3조 제2항 단서 제7호를 운전면허 취소사실을 알지 못하고 자동차를 운전하는 경우도 포함하는 것으로 해석하는 것은 유추해석금지의 원칙에 반하지 않는다. (24.2차)","answer":false,"quote":"교통사고처리 특례법 제3조 제2항 단서 제7호 는 도로교통법 위반(무면허운전)죄와 동일하게 도로교통법 제43조 를 위반하여 운전면허를 받지 아니하고 자동차를 운전하는 행위를 대상으로 교통사고 처벌 특례를 적용하지 않도록 하고 있다.","cite":"대법원 2021도17733","badge":"","topic":"","from":"GY-2024-2-X-01","seq":null},{"id":"X-OX-107","subject":"형사법","unit":"형법 총론","stmt":"피해자를 강간한 후 피해자가 울면서 자신의 장래를 책임 지라고 이를 추궁하자 피해자를 타이르던 중 피해자가 계속 반항하므로 순간적으로 피해자를 살해할 것을 결의하고 양손으로 피해자의 목을 졸라 그 자리에서 질식 사망케 한 것이라면, 당시 살인의 확정적 범의가 있었음이 분명하여 결과적 가중범의 범의를 논할 여지가 없다. (26.1차)","answer":true,"quote":"피해자를 강간한 후 피해자가 울면서 자신의 장래를 책임지라고 이를 추궁하자 피고인이 피해자를 타이르던 중 피해자가 계속 반항하므로 순간적으로 그녀를 살해할 것을 결의하고 양손으로 피해자의 목을 졸라 그 자리에서 질식 사망케 한 것이라면 피고인에게는 당시 살인의 확정적 범의가 있었음이 분명하여 결과적 가중범의 범의를 논할 여지가 없다.","cite":"대법원 86도1989","badge":"","topic":"","from":"GY-2026-1-X-06","seq":null},{"id":"X-OX-082","subject":"형사법","unit":"형법 총론","stmt":"불능범과 구별되는 불능미수의 성립요건인 ‘위험성’은 행위자가 행위 당시에 인식한 사정을 놓고 일반인이 객관적으로 판단하여 결과 발생의 가능성이 있는지 여부를 따져야 한다. (25.1차)","answer":true,"quote":"한편 불능범과 구별되는 불능미수의 성립요건인 ‘위험성’은 피고인이 행위 당시에 인식한 사정을 놓고 일반인이 객관적으로 판단하여 결과 발생의 가능성이 있는지 여부를 따져야 한다.","cite":"대법원 2018도16002","badge":"","topic":"","from":"GY-2025-1-X-09","seq":null},{"id":"X-OX-125","subject":"형사법","unit":"형법 총론","stmt":"미수범이란 행위를 종료했더라도 결과가 발생하지 아니한 경우를 말하는 것이므로 결과가 발생한 경우에는 미수범이 성립할 여지가 없다. (22.1차)","answer":false,"quote":"결과가 발생했더라도 행위와 결과 사이에 인과관계가 없으면 기수가 되지 않고 미수범이 성립할 수 있다.","cite":"형법 제25조","badge":"","topic":"","from":"GY-2022-1-X-09","seq":null},{"id":"X-OX-061","subject":"형사법","unit":"형법 총론","stmt":"자신의 웹사이트에 아동･청소년성착취물이 저장된 다른 웹사이트로 연결되는 링크를 게시하여 불특정 또는 다수인이 링크를 이용하여 별다른 제한 없이 아동･청소년성착취물에 바로 접할 수 있는 상태를 실제로 조성한 경우, ｢아동･청소년의 성보호에 관한 법률｣ 제11조 제3항에서 정한 아동･청소년성착취물을 배포하거나 공연히 전시한 것으로 평가할 수 있다. (24.1차)
