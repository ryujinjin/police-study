인 부모의 자기결정권이라는 의미에서 보장되는 자유가 아니라, 자녀의 보호와 인격발현을 위하여 부여되는 기본권이다.","헌법 제31조 제1항의 교육을 받을 권리는, 국민이 능력에 따라 균등하게 교육받을 것을 공권력에 의하여 부당하게 침해받지 않을 권리와, 국민이 능력에 따라 균등하게 교육받을 수 있도록 국가가 적극적으로 배려하여 줄 것을 요구할 수 있는 권리로 구성되는바, 전자는 자유권적 기본권의 성격이, 후자는 사회권적 기본권의 성격이 강하다고 할 수 있다.","헌법 제31조 제1항은 취학의 기회에 있어서 고려될 수 있는 차별기준으로 ‘능력’을 제시함으로써, 능력 이외의 다른 요소에 의한 차별을 원칙적으로 제한하고 있는데, 여기서 ‘능력’이란 ‘수학능력’을 의미하고 교육제도에서 ‘수학능력’은 개인의 인격 발현과 밀접한 관계에 있는 인격적 요소가 아니라 학업을 감당할 수 있는 개인의 능력을 말한다.",3,0,""],["2026-2","헌법",18,"근로의 권리에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","6개월 미만 근무한 월급근로자 또한 전직을 위한 시간적 여유를 갖거나 실직으로 인한 경제적 곤란으로부터 보호받아야 할 필요성이 있으므로, 월급근로자로서 6개월이 되지 못한 자를 해고예고제도의 적용예외 사유로 규정하고 있는 ｢근로기준법｣ 조항은 근로의 권리를 침해한다.","현재 우리나라 축산업은 지위가 불안정한 일용직 내지 임시직 근로자가 다수를 차지하는 구조를 가지고 있어 사적 합의를 통하여 합리적인 근로조건을 정하기 어려운 상황이므로, 동물의 사육 사업 근로자에 대하여 ｢근로기준법｣ 제4장에서 정한 근로 시간 및 휴일 규정의 적용을 제외하도록 한 구 ｢근로기준법｣ 조항 중 해당 부분은 근로의 권리를 침해한다.","매월 1회 이상 정기적으로 지급하는 상여금 등이나 복리후생비는 그 성질이나 실질적 기능 면에서 기본급과는 본질적인 차이가 있다고 할 것이므로, 매월 1회 이상 정기적으로 지급하는 상여금 등 및 복리후생비의 일부를 최저임금에 산입하도록 한 ｢최저 임금법｣ 조항은 입법재량의 범위를 일탈하여 근로의 권리를 침해한다.","근로제공 계약기간이 짧은 경우에도 근로자에게 계속하여 근로를 제공할 수 있다는 기대나 신뢰가 전혀 존재하지 않는다고 볼 수는 없으므로, 일용근로자로서 3개월을 계속 근무하지 아니한 자를 해고예고제도의 적용제외사유로 규정하고 있는 ｢근로기준법｣ 조항은 근로의 권리를 침해한다.",0,0,""],["2026-2","헌법",19,"범죄피해자구조청구권에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","｢범죄피해자 보호법｣에 따르면 ‘범죄피해자’란 타인의 범죄행위로 피해를 당한 사람과 그 배우자(사실상의 혼인관계를 포함한다) 및 직계혈족을 말한다.","｢범죄피해자 보호법｣에 따르면 구조대상 범죄피해를 받은 사람 이나 유족이 해당 구조대상 범죄피해를 원인으로 하여 ｢국가 배상법｣이나 그 밖의 법령에 따른 급여 등을 받을 수 있는 경우 에는 대통령령으로 정하는 바에 따라 구조금을 지급하지 아니한다.","｢범죄피해자 보호법｣에 따르면 국가는 구조대상 범죄피해를 받은 사람이 피해의 전부 또는 일부를 배상받지 못하는 경우에만 구조대상 범죄피해를 받은 사람 또는 그 유족에게 범죄피해 구조금을 지급한다.","구조피해자가 가동연한을 넘어 소극적 손해가 발생하지 않는 경우에도 평균임금을 기준으로 유족구조금을 산정하는 것은 그 자체로 불합리함에도 불구하고, 평균임금을 기준으로 유족 구조금을 산정하도록 규정하고 있는 ｢범죄피해자 보호법｣ 조항 중 ‘평균임금’에 관한 부분은 과잉금지원칙에 위배되어 가해자의 재산권을 침해한다.",1,0,""],["2026-2","헌법",20,"인간다운 생활을 할 권리 및 사회보장에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","구 ｢군인연금법｣상 유족연금수급권은 군인 또는 군인이었던 자의 사망 이후 그 유족의 생활안정과 복리향상을 위하여 부양의 원리에 따라 인정되는 제도로서, 자신이 보험료를 납부하여 그에 상응하는 급여를 받는 것이 아니라 군인연금의 적용을 받고 있는 자의 피부양자의 지위에 기초하여 취득하는 이른바 ‘파생수급권’의 일종이다.","육아휴직 급여제도는 고용보험료의 납부를 통하여 육아휴직 급여 수급권자도 그 재원의 형성에 일부 기여한다는 점에서 후불임금의 성격도 가미되어 있으므로, ｢고용보험법｣상 육아휴직 급여수급권은 경제적 가치가 있는 권리로서 헌법 제23조에 의하여 보장되는 재산권의 성격도 가지고 있다.","징계에 의하여 파면된 경우에 해당하여 퇴직연금을 감액받은 사람이 퇴직 후 재임용되어 종전의 재직기간을 재임용 후의 재직기간에 합산하더라도 종전의 재직기간에 대한 퇴직연금을 합산 전과 동일하게 감액하여 지급하도록 정하고 있는 ｢공무원 연금법 시행령｣ 조항 중 해당 부분은 그 시행 이전의 법률관계, 즉 과거에 이행기가 도래한 퇴직연금수급권의 내용을 변경하는 것이므로 진정소급입법에 해당한다.","공무원 재해보상제도는 공무원과 그 가족의 생존권 확보를 목표로 공무상 재해를 입은 공무원의 퇴직 후까지도 보상을 실시하도록 하는 등, 개별 근로관계 안에서 재직 중인 근로자를 전제로 하는 근로조건의 규율 문제보다 더욱 넓은 차원인 사회보장제도 차원의 문제에 속한다.",2,0,""],["2026-2","형사법",1,"죄형법정주의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","위법성 및 책임의 조각사유에 관하여 그 범위를 제한적으로 유추적용하게 되면 행위자의 가벌성의 범위는 확대되어 행위자 에게 불리하게 되는바, 이는 가능한 문언의 의미를 넘어 범죄 구성요건을 유추적용하는 것과 같은 결과가 초래되므로 유추 해석금지의 원칙에 위반된다.","형벌법규의 위임은 특히 긴급한 필요가 있거나 미리 법률로써 자세히 정할 수 없는 부득이한 사정이 있는 경우로 한정되어야 하며, 이러한 경우에도 위임법률에서 범죄의 구성요건은 처벌 대상행위가 어떠한 것일 것이라고 예측할 수 있을 정도로 구체적 으로 정하여야 하며, 형벌의 종류 및 그 상한과 폭을 명확히 규정 하여야 한다.","행위 당시의 판례에 의하면 처벌대상이 되지 아니하는 것으로 해석되었던 행위를 판례의 변경에 따라 확인된 내용의 형법 조항에 근거하여 처벌한다고 하여 그것이 헌법상 평등의 원칙과 형벌불소급의 원칙에 반한다고 할 수는 없다.","대법원 양형위원회가 설정한 ‘양형기준’이 발효하기 전에 공소가 제기된 범죄에 대하여 위 ‘양형기준’을 참고하여 형을 양정한 경우, 소급효금지의 원칙에 위반된다.",3,0,""],["2026-2","형사법",2,"형법의 적용범위에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","내국 법인의 대표자인 외국인이 내국 법인이 외국에 설립한 특수목적법인에 위탁해 둔 자금을 정해진 목적과 용도 외에 임의로 사용하였는데 그 임의 사용 행위가 외국에서 이루어진 경우, 행위지의 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우가 아니라면 그 외국인에 대해서도 우리 형법이 적용된다.","형벌법규의 형을 종전보다 가볍게 개정하면서 그 부칙에서 개정된 법의 시행 전의 범죄에 대하여는 종전의 형벌법규를 적용하도록 규정하는 경우 ｢형법｣ 제1조 제2항의 신법우선주의에 반한다.","죄가 되지 않던 행위를 구성요건의 신설로 포괄일죄의 처벌대상 으로 삼는 경우, 신설된 포괄일죄에 해당하는 행위가 그 법의 시행 이전과 이후에 걸쳐서 이루어졌다면 시행 이전의 행위에 대하여도 신설된 법규를 적용하여 처벌한다.","법령이 개정 내지 폐지된 경우가 아니라 스스로 유효기간을 구체적인 일자나 기간으로 특정하여 효력의 상실을 예정하고 있던 법령이 그 유효기간을 경과함으로써 더 이상 효력을 갖지 않게 된 경우는 ｢형법｣ 제1조 제2항에서 말하는 법령의 변경에 해당한다.",0,0,""],["2026-2","형사법",3,"주관적 구성요건 요소에 관한 설명으로 옳고 그름의 표시 (O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 고의 외에 목적을 요하는 범죄에서 甲이 그 목적을 실현하기 위하여 그러한 목적이 없는 乙을 교사하여 실행행위를 하도록 한 경우, 甲은 해당 범죄의 교사범은 물론이고 간접정범도 될 수 없다. ㉡ 甲이 A를 살해할 의도로 구타하여 A가 실신하자 그가 사망한 것으로 오인하고 죄적을 인멸할 목적으로 매장하였는데 사실은 질식사한 것으로 밝혀진 경우, 甲에게는 객관적 구성요건 요소인 인과관계의 과정에 대한 인식에 착오가 있으나 전 과정을 개괄적으로 보면 A의 사망을 예견할 수 있었으므로 甲은 폭행치사죄의 죄책을 진다. ㉢ 타인의 재물임을 인식하고 그 점유를 침해하려는 의사가 인정되는 이상, 해당 재물을 절취하는 행위는 목적물의 물질을 영득할 의사 또는 물질의 가치를 영득할 의사가 별도로 없더라도 절도죄를 구성한다. ㉣ 부진정 신분범에서 신분은 객관적 처벌조건에 불과하므로 이에 대한 착오는 부진정 신분범의 고의 인정에 영향을 미치지 않는다.","㉠(O) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(X) ㉣(X) (일반공채･101경비단･경찰행정 경채)",3,0,""],["2026-2","형사법",4,"부작위에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","단순히 해야 할 일을 하지 않는 부작위가 피해자의 자유의사를 제압할 만한 정도에 이르러 업무방해죄의 실행행위로서 피해자의 업무에 대하여 하는 적극적인 방해행위와 동등한 형법적 가치를 가지는 경우, 이는 업무방해죄의 ‘위력’으로 인정할 수 있다.","부진정부작위범의 작위의무는 법령, 법률행위, 선행행위로 인한 경우는 물론이고 도덕상 또는 종교상의 의무 및 기타 신의성실의 원칙이나 사회상규 혹은 조리상 작의의무가 기대되는 경우에도 인정된다.","부진정부작위범의 고의는 반드시 구성요건적 결과발생에 대한 목적이나 계획적인 범행 의도가 있어야 하는 것은 아니고 법익 침해의 결과발생을 방지할 법적 작위의무를 가지고 있는 사람이 의무를 이행함으로써 결과발생을 쉽게 방지할 수 있었음을 예견 하고도 결과발생을 용인하고 이를 방관한 채 의무를 이행하지 아니한다는 인식을 하면 족하다.","진정부작위범 사이의 공동정범은 다수의 부작위범에게 공통된 의무가 부여되어 있고 그 의무를 공통으로 이행할 수 있을 때에만 성립한다.",1,0,""],["2026-2","형사법",5,"과실범과 결과적 가중범에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","행정상의 단속을 주안으로 하는 법규에 의한 범죄의 경우에는 ‘고의’가 있어야 벌할 수 있다는 ｢형법｣의 원칙이 적용되지 않으므로, 별도의 명문규정이 있거나 해석상 과실범을 벌할 뜻이 명확한 경우에만 과실범을 처벌할 수 있다고 볼 것은 아니다.","피고인 운전의 차가 이미 정차하였음에도 뒤쫓아오던 차의 충돌로 인하여 앞차를 충격하여 사고가 발생한 경우, 피고인에게 안전 거리를 준수치 않은 위법이 있었다면 앞차의 피해결과에 대하여 인과관계가 인정된다.","｢형법｣과 형사 특별법에 규정되어 있는 결과적 가중범 중 특수 강간치상죄와 같이 별도의 미수범 처벌규정을 두고 있는 것은 ‘형이 무거워지는 요인이 되는 결과가 과실로 생긴 결과적 가중범’과 ‘고의로 그 결과를 일으킨 결합범’을 하나의 조문에서 규정하고 있는 입법형식에서만 찾아볼 수 있는데, 이를 결과적 가중범의 미수범을 인정하기 위한 입법형식이라고 할 수는 없다.","甲과 乙이 A에 대한 상해를 공동으로 할 의사로 함께 A에 대한 신체침해행위를 하는 기회에 甲이 A를 살해한 경우, 乙이 사망의 결과를 예견할 수 있었다면 乙은 상해죄가 아닌 과실치사죄의 죄책을 진다.",2,0,""],["2026-2","형사법",6,"위법성의 인식에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 범죄의 성립에 있어서 위법의 인식은 그 범죄사실이 사회 정의와 조리에 어긋난다는 것을 인식하는 것으로서 족하고 구체적인 해당 법조문까지 인식할 것을 요하는 것은 아니다. ㉡ 일반적으로 범죄가 성립하지만 자신의 특수한 사정에 비추어 법령에 따라 허용된 행위로서 죄가 되지 않는다고 그릇 인식한 경우, 그러한 인식에 정당한 이유가 있다면 형을 감경할 수 있다. ㉢ 위법성조각사유의 전제사실에 관한 착오에서 행위자가 상황을 오인함에 정당한 이유가 있을 때는 심정반가치를 인정할 수 없어 책임고의가 조각되어 과실범으로 처벌된다. ㉣ 사안을 달리하는 사건에 관한 대법원 판례의 취지를 오해 하여 자신의 행위가 범죄의 구성요건에 해당하지 아니하는 것으로 오인한 경우, ｢형법｣ 제16조의 ‘그 오인에 정당한 이유가 있는 때’에 해당한다.","㉠(O) ㉡(X) ㉢(X) ㉣(X)","㉠(O) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(X) ㉣(O)",0,0,""],["2026-2","형사법",7,"위법성조각사유에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","자구행위가 그 정도를 초과한 경우에 야간이나 그 밖의 불안한 상태에서 공포를 느끼거나 경악하거나 흥분하거나 당황하였기 때문에 그 행위를 하였을 때에는 위법성이 조각된다.","위법성조각사유로서의 피해자의 승낙은 언제든지 자유롭게 철회 할 수 있으나, 묵시적인 방법으로는 그 승낙을 철회할 수 없다.","부정확 또는 불충분한 설명을 근거로 이루어진 승낙이더라도 일단 승낙이 있는 이상 위법성을 조각하는 유효한 승낙으로 보아야 한다.","정당방위나 긴급피난이 성립하기 위해서는 방위의사 또는 피난 의사가 있어야 하고, 과잉방위나 과잉피난에 있어서도 그러한 주관적 정당화 요소가 있어야 한다.",3,0,""],["2026-2","형사법",8,"책임에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","피고인이 평소 뇌전증 증세가 있었더라도 범행 당시에는 뇌전증이 발작하지 아니하였다면 그러한 지병을 이유로 책임감면사유인 심신장애 내지는 심신미약에 해당한다고 볼 수 없다.","행위자에게 적법행위를 기대할 가능성이 있는지 여부를 판단하기 위하여는 행위 당시의 구체적인 상황하에 행위자의 관점에서 그 기대가능성 유무를 판단하여야 한다.","｢형법｣ 제10조 제3항은 고의에 의한 원인에 있어서의 자유로운 행위만이 아니라 과실에 의한 원인에 있어서의 자유로운 행위 까지도 포함하는 것으로서, 과실에 의한 원인에 있어서의 자유로운 행위의 경우에도 심신장애로 인한 형을 감경할 수 있다.","｢형법｣ 제12조의 ‘저항할 수 없는 폭력’은 심리적 의미에 있어서 육체적으로 어떤 행위를 절대적으로 하지 아니할 수 없게 하는 경우를 말하고, 윤리적 의미에 있어서 강압된 경우는 이에 해당 하지 않는다.",0,0,""],["2026-2","형사법",9,"범죄실현단계에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","행위자의 행위가 기수에 이른 경우에는 ｢형법｣ 제26조의 중지범이 될 수 없다.","타인의 범죄를 방조하였으나 정범이 실행의 착수에 이르지 않은 경우, 예비죄의 방조가 될 수는 없고 미수의 방조만이 될 수 있을 뿐이다.","불능미수에서 ‘결과의 발생이 불가능’하다는 것은 범죄행위의 성질상 어떠한 경우에도 구성요건의 실현이 불가능하다는 것을 의미한다.","살인예비죄에서의 준비행위는 물적인 것에 한정되지 아니하며 특별한 정형이 있는 것도 아니지만, 단순히 범행의 의사 또는 계획만으로는 그것이 있다고 할 수 없고 객관적으로 보아서 살인죄의실현에실질적으로기여할수있는외적행위를필요로한다.",1,0,""],["2026-2","형사법",10,"정범과 공범에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 2인 이상의 서로 대향된 행위의 존재를 필요로 하는 대향범에 대하여는 공범에 관한 ｢형법｣ 총칙 규정을 적용할 수 없으므로 대향범 사이에는 교사범은 물론이고 공동정범도 성립할 수 없다. ㉡ 구성요건상으로는 단독으로 실행할 수 있는 형식으로 되어 있는데 단지 甲과 乙의 구성요건적 행위가 대향범의 형태로 실행되는 경우, 정범인 甲의 범행사실을 알고 그 실행행위를 가능‧촉진‧용이하게 한 乙에게 방조범의 죄책을 지울 수는 없다. ㉢ 甲이 사물변별능력이 전혀 없는 유아 乙을 이용하여 A를 살해 하도록 한 경우, 제한적 종속형식에 따르면 甲에게 A에 대한 살인죄의 간접정범이 성립할 수 없게 된다. ㉣ 공모공동정범에 있어서 공모자가 공모에 주도적으로 참여 하여 다른 공모자의 실행에 영향을 미친 경우, 범행을 저지 하기 위하여 적극적으로 노력하는 등 실행에 미친 영향력을 제거하지 아니하는 한 실행행위에 이르기 전에 이탈하였다는 이유만으로 공모관계에서 이탈하였다고 할 수 없다.","㉠(X) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(O) ㉢(O) ㉣(O)","㉠(O) ㉡(X) ㉢(O) ㉣(X)",1,0,""],["2026-2","형사법",11,"교사와 방조에 관한 설명으로 옳고 그름의 표시(O, X)가 바르게 된 것은? (다툼이 있는 경우 판례에 의함) ㉠ 방조범이 성립하기 위해서는 정범의 실행을 방조한다는 이른바 ‘방조의 고의’가 있으면 족하고, 정범의 행위가 구성 요건에 해당하는 행위인 점에 대한 ‘정범의 고의’까지 있어야 하는 것은 아니다. ㉡ 신분 때문에 형의 경중이 달라지는 경우에 신분이 있는 사람이 신분이 없는 사람을 교사하여 죄를 범하게 한 경우, 교사범이 그 성립과 처벌에 있어서 정범에 종속한다는 일반적인 원칙을 선언한 ｢형법｣ 제33조 단서가 ｢형법｣ 제31조 제1항에 우선하여 적용된다. ㉢ 교사범이 성립하기 위해서는 교사자의 교사행위와 정범의 실행행위가 있어야 하는 것이므로, 정범의 성립은 교사범의 구성요건의 일부를 형성하고 교사범이 성립함에는 정범의 범죄행위가 인정되는 것이 그 전제요건이 된다. ㉣ 교사를 받은 자가 범죄의 실행을 승낙하고 실행의 착수에 이르지 아니한 때에는 교사자를 음모 또는 예비에 준하여 처벌하고, 예비‧음모죄의 처벌규정이 없는 경우에는 미수에 준하여 처벌한다.","㉠(O) ㉡(O) ㉢(X) ㉣(O)","㉠(O) ㉡(X) ㉢(X) ㉣(O)","㉠(X) ㉡(X) ㉢(O) ㉣(X)","㉠(X) ㉡(O) ㉢(O) ㉣(X)",2,0,""],["2026-2","형사법",12,"죄수에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","선행 처분행위로 인하여 법익침해의 위험이 발생함으로써 횡령죄가 기수에 이른 후 종국적인 법익침해의 결과가 발생하기 전에 새로운 후행 처분행위가 이루어졌을 때, 후행 처분행위가 선행 처분행위에 의하여 발생한 위험을 현실적인 법익침해로 완성하는 수단에 불과하여 새로운 위험을 추가하는 것이 아닌 경우라면, 후행 처분행위는 이미 성립한 횡령죄의 불가벌적 사후행위에 해당한다.","포괄일죄로 되는 개개의 범죄행위가 서로 다른 종류의 죄에 대한 징역형 확정판결의 전후에 걸쳐서 행하여진 경우, 그 죄는 2개의 죄로 분리되므로 판결이 확정된 죄와 그 전에 행하여진 죄는 ｢형법｣ 제37조 후단의 사후적 경합범이 된다.","법조경합의 한 형태인 특별관계에 있어서는 일반법의 구성요건을 충족하는 행위는 특별법의 구성요건을 충족하지만 반대로 특별법의 구성요건을 충족하는 행위는 일반법의 구성요건을 충족하지 못한다.","같은 날 무면허운전 행위를 여러 차례 반복하였다면 그 범의의 단일성 내지 계속성이 인정되지 않거나 범행 방법이 동일하지 않더라도각무면허운전행위를통틀어포괄일죄로처단하여야 한다.",0,0,""],["2026-2","형사법",13,"형사제재에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","하나의 자유형 중 일부에 대해서만 실형을 선고하고 나머지에 대해서는 집행유예를 선고하는 것도 가능하다.","몰수는 반드시 압수되어 있는 물건에 대하여서만 하는 것이 아니므로 몰수대상물건이 압수되어 있을 것을 요하지는 않지만, 일단 압수된 물건을 몰수하기 위해서는 그 대상물건이 적법한 절차에 의하여 압수되었을 것을 필요로 한다.","형의 집행유예를 선고받은 사람이 선고가 실효 또는 취소됨이 없이 정해진 유예기간을 무사히 경과하여 형의 선고가 효력을 잃게 된 경우, ｢형법｣ 제59조 제1항 단서에서 정한 선고유예 결격사유인 ‘자격정지 이상의 형을 받은 전과가 있는 사람’에 해당한다고 볼 수 없다.","몰수나 추징이 공소사실과 관련이 있다 하더라도 그 공소사실에 관하여 이미 공소시효가 완성되어 유죄의 선고를 할 수 없는 경우에는 몰수나 추징을 할 수 없다.",3,0,""],["2026-2","형사법",14,"협박의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","사채업자인 甲이 채무자 A에게 채무를 변제하지 않으면 A가 숨기고 싶어하는 과거 행적과 사채를 쓴 사실 등을 A의 남편과 시댁에 알리겠다는 등의 문자메시지를 발송한 경우, 이는 A에게 공포심을 일으키기에 충분할 만한 해악의 고지로 볼 수 없다.","채권추심 회사의 지사장 甲이 회사로부터 자신의 횡령행위에 대한 민‧형사상 책임을 모면하기 위하여 회사 본사에 ‘회사의 내부비리 등을 금융감독원 등 관계기관에 고발하겠다’는 취지의 서면을 보내는 한편, 위 회사의 경영지원본부장이자 상무이사 A에게 전화를 걸어 위 서면의 내용과 같은 취지로 발언한 경우 A에 대한 협박죄를 구성하지 않는다.","협박죄의 고의는 행위자가 사람으로 하여금 공포심을 일으킬 수 있는 정도의 해악을 고지한다는 것을 인식‧인용하는 것을 그 내용으로 하고 고지한 해악을 실제로 실현할 의도나 욕구는 필요로 하지 아니한다.","상습으로 협박죄, 존속협박죄, 특수협박죄를 범한 때에는 그 죄에 정한 형의 2배까지 가중한다.",2,0,""],["2026-2","형사법",15,"체포‧감금 및 약취‧유인의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","체포죄는 체포의 고의로써 타인의 신체적 활동의 자유를 현실적 으로 침해하는 행위를 개시한 때 기수에 이른다.","감금죄는 사람의 행동의 자유를 그 보호법익으로 하여 사람이 특정한 구역에서 나가는 것을 불가능하게 하거나 또는 심히 곤란하게 하는 죄로서, 이와 같이 사람이 특정한 구역에서 나가는 것을 불가능하게 하거나 심히 곤란하게 하는 그 장애는 물리적‧ 유형적 장애를 말하고 심리적‧무형적 장애는 이에 해당하지 않는다.","｢형법｣ 제288조 제1항의 약취행위는 피해자를 그 의사에 반하여 자유로운 생활관계 또는 보호관계로부터 범인이나 제3자의 사실상 지배하에 옮기는 행위를 말하는 것으로서, 폭행 또는 협박을 수단으로 사용하는 경우에 그 폭행 또는 협박의 정도는 상대방을 실력적 지배하에 둘 수 있을 정도로는 부족하고 상대방의 반항을 억압할 정도의 것임을 요한다.","미성년자와 부모가 거주하는 주거에 침입하여 부모만을 강제로 퇴거시키고 독자적인 생활관계를 형성하기에 이른 경우, 비록 장소적 이전이 없었다 할지라도 ｢형법｣ 제287조의 미성년자 약취죄에 해당한다.",3,0,""],["2026-2","형사법",16,"성폭력범죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 아파트 놀이터의 의자에 앉아 전화통화를 하고 있던 처음 보는 A(女, 18세)의 뒤로 몰래 접근하여 성기를 드러내고 A를 향한 자세에서 A의 등 쪽에 소변을 보았으나 행위 당시 A가 이를 인식하지 못하였다면 甲의 행위는 추행행위에 해당하지 아니한다.","성폭력범죄의 처벌 등에 관한 특례법위반(통신매체이용음란)죄의 ‘성적 욕망’에는 성행위나 성관계를 직접적인 목적이나 전제로 하는 욕망뿐만 아니라 상대방을 성적으로 비하하거나 조롱하는 등 상대방에게 성적 수치심을 줌으로써 자신의 심리적 만족을 얻고자 하는 욕망도 포함되며, 이러한 성적 욕망이 상대방에 대한 분노감과 결합된 경우라도 달리 볼 것은 아니다.","미성년자의제강간‧강제추행죄를 규정한 ｢형법｣ 제305조 제1항은 강간죄와 강제추행죄의 미수범의 처벌에 관한 ｢형법｣ 제300조를 명시적으로 인용하고 있지 아니하므로 미성년자의제강간‧강제 추행죄의 미수범은 처벌할 수 없다.","위계에 의한 간음죄에서 피해자가 오인, 착각, 부지에 빠지게 되는 대상은 간음행위 자체이며, 간음행위에 이르게 된 동기나 간음행위와 결부된 금전적‧비금전적 대가와 같은 요소는 이에 해당하지 아니한다.",1,0,""],["2026-2","형사법",17,"명예에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣ 제307조 제1항의 ‘사실’은 제2항의 ‘허위의 사실’과 반대 되는 ‘진실한 사실’을 말하는 것이 아니라 가치판단이나 평가를 내용으로 하는 ‘의견’에 대치되는 개념이다.","甲이 타인을 비방할 목적으로 허위사실인 기사의 재료를 신문 기자에게 제공하여 편집인이 신문지상에 이를 게재한 경우 기사를 신문지상에 게재하느냐의 여부는 신문 편집인의 권한에 속하므로 甲의 행위는 ｢형법｣ 제309조 제2항의 출판물에 의한 명예훼손죄를 구성하지 않는다.","다른 사람의 말이나 글을 비평하면서 사용한 출판물의 표현이 증거에 의해 입증 가능한 구체적인 사실관계를 서술하는 형태라도, 글의 집필의도, 논리적 흐름, 서술체계 및 전개방식, 해당 글과 비평의 대상이 된 말 또는 글의 전체적인 내용 등을 종합하여 볼 때 평균적인 독자의 관점에서 문제 된 부분이 실제로는 비평자의 주관적 의견이고, 자신의 의견을 강조하기 위한 수단으로 사용한 경우, 이는 ｢형법｣ 제309조 제2항의 출판물에 의한 명예훼손죄에서 말하는 사실의 적시에 해당한다고 볼 수 없다.","｢형법｣ 제310조의 ‘오로지 공공의 이익에 관한 때’란 적시된 사실이 객관적으로 볼 때 공공의 이익에 관한 것으로서 행위자도 주관적으로 공공의 이익을 위하여 그 사실을 적시한 것이어야 하고, 공공의 이익에 관한 것에는 널리 국가‧사회 기타 일반 다수인의 이익에 관한 것뿐만 아니라 특정한 사회집단이나 그 구성원 전체의 관심과 이익에 관한 것도 포함한다.",1,0,""],["2026-2","형사법",18,"사생활의 평온에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","주거침입죄에서 침입행위의 객체인 ‘건조물’은 건조물 그 자체 뿐만이 아니라 그에 부속하는 위요지를 포함한다고 할 것이나, 여기서 위요지라 함은 건조물에 인접한 그 주변의 토지로서 외부와의 경계에 담 등이 설치되어 그 토지가 건조물의 이용에 제공되고 또 외부인이 함부로 출입할 수 없다는 점이 객관적으로 명확하게 드러나야 한다.","｢형법｣ 제316조 제2항 소정의 전자기록등내용탐지죄는 봉함 기타 비밀장치한 전자기록 등 특수매체기록을 기술적 수단을 이용하여 그 내용을 알아낸 자를 처벌하는 규정이므로 전자기록 등 특수매체기록에 해당하더라도 별도의 보안장치가 설정되어 있지 않는 등 봉함 기타 비밀장치가 되어 있지 아니한 것은 이를 기술적 수단을 동원해서 알아냈더라도 전자기록등내용 탐지죄가 성립하지 않는다.","공동거주자 甲이 다른 공동거주자 A로부터 법률적인 근거 기타 정당한 이유 없이 공동생활의 장소에 출입하는 것을 금지당한 경우, 甲이 공동생활의 장소에 출입하기 위하여 출입문의 잠금장치를 손괴하는 등 다소간의 물리력을 행사하여 A의 사실상 평온상태를 해쳤더라도 甲의 행위는 주거침입죄를 구성하지 않는다.","퇴거불응죄는 거주자나 관리자‧점유자로부터 주거나 건조물‧방실 등에서 퇴거요구를 받고도 응하지 아니하면 성립하며, 이때 주거 등에 관하여 거주‧관리‧점유할 법률상 정당한 권한을 가지고 있어야만 그러한 거주자나 관리자‧점유자에 해당한다.",3,0,""],["2026-2","형사법",19,"절도와 강도의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 회사 연구개발실에서 그 곳 노트북 컴퓨터에 저장되어 있는 시스템의 설계도면을 자신이 가져간 용지 2장에 출력하여 가지고 나온 경우 甲의 행위는 절도죄를 구성하지 않는다.","두 사람이 생강 농사를 조합관계로 동업하던 중 불화가 생겨 그 중 1인이 생강 밭에 나오지 않음으로써 묵시적으로 동업 탈퇴의 의사표시를 한 경우, 남은 동업인이 혼자 생강 밭을 경작 및 수확하여 생강을 반출한 행위는 절도죄를 구성한다.","절도범인이 체포를 면탈할 목적으로 경찰관에게 폭행‧협박을 가한 때에는 준강도죄와 공무집행방해죄를 구성하고 양죄는 상상적 경합관계에 있으나, 강도범인이 체포를 면탈할 목적으로 경찰관에게 폭행을 가한 때에는 강도죄와 공무집행방해죄는 실체적 경합관계에 있다.","강도죄는 재물탈취의 방법으로 폭행, 협박을 사용하는 행위를 처벌하는 것이므로 폭행, 협박으로 타인의 재물을 탈취한 이상 피해자가 우연히 재물탈취 사실을 알지 못하였다고 하더라도 강도죄는 성립한다.",1,0,""],["2026-2","형사법",20,"재산죄에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 강도예비‧음모죄가 성립하기 위해서는 예비‧음모 행위자에게 미필적으로라도 ‘강도’를 할 목적이 있음이 인정되어야 하고 그에 이르지 않고 단순히 ‘준강도’할 목적이 있음에 그치는 경우에는 강도예비‧음모죄로 처벌할 수 없다. ㉡ 컴퓨터 등 정보처리장치에 정보를 입력하는 등의 행위가 재산적 처분행위를 하는 사람을 직접적인 대상으로 한 것이 아니라면 그러한 행위로 인한 정보처리의 결과를 통하여 재산적 처분행위를 하는 사람을 착오에 빠뜨렸더라도 사람에 대한 기망행위에 해당하지 아니한다. ㉢ 피해자의 예금을 갈취하고자 하는 단일하고 계속된 범의 아래에서 예금주인 현금카드 소유자를 협박하여 현금카드를 갈취하고 하자 있는 승낙에 의하여 예금을 인출할 권한을 부여받아 이를 사용하여 현금자동지급기에서 예금을 여러 번 인출한 경우, 이는 포괄하여 하나의 공갈죄를 구성하는 것이지, 현금자동지급기에서 피해자의 예금을 취득한 행위를 별도로 분리하여 절도죄를 구성하지 않는다. ㉣ 무효인 경매절차에서 경매목적물을 경락받아 이를 점유하고 있는 낙찰자의 점유는 동시이행항변권이 있더라도 적법한 점유가 아니므로 그 점유자는 권리행사방해죄에 있어서의 타인의 물건을 점유하고 있는 자라고 할 수 없다.","㉠㉡","㉠㉢","㉡㉢","㉢㉣",1,0,""],["2026-2","형사법",21,"사기의 죄에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","甲이 점포에 대한 권리금을 지급한 것처럼 허위의 사용내역서를 작성‧교부하여 동업자들을 기망하고 출자금 지급을 면제받으려 하였으나 미수에 그친 경우, 동업자들이 피고인에 대한 출자 의무를 명시적으로 면제하지 않았더라도 착오에 빠져 이를 면제해 주는 결과에 이를 수 있으므로 이는 부작위에 의한 처분행위에 해당한다.","외관상 재물의 교부에 해당하는 행위가 있었지만 재물이 범인의 사실상의 지배 아래에 들어가 그의 자유로운 처분이 가능한 상태에 놓이지 않고, 여전히 피해자의 지배 아래에 있는 것으로 평가되는 경우, 사기죄의 처분행위가 있었다고 볼 수 있다.","소송사기는 법원을 기망하여 재판이 확정되면 성립하는 것이지 그 재판이 피해자의 처분행위에 갈음하는 내용과 효력이 있어야 하는 것은 아니다.","부동산가압류결정을 받아 부동산에 관한 가압류집행까지 마친 자가 그 가압류를 해제하면 소유자는 가압류의 부담이 없는 부동산을 소유하는 이익을 얻게 되므로 가압류를 해제하는 것은 사기죄에서 말하는 재산적 처분행위에 해당하나, 그 이후 가압류의 피보전 채권이 존재하지 않는 것으로 밝혀진 경우에는 가압류의 해제로 인한 재산상의 이익이 없었다고 할 것이다.",0,0,""],["2026-2","형사법",22,"횡령과 배임의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲은 자신의 명의로 개설된 예금계좌의 접근매체를 보이스피싱 조직원 乙에게 양도함으로써 乙의 A에 대한 전기통신금융사기 범행을 방조하고, 사기피해자 A가 乙에게 속아 甲의 계좌로 송금한 사기피해금 중 일부를 영득할 의사로 별도의 접근매체를 이용하여 임의로 인출한 경우, 甲의 행위는 횡령죄를 구성하지 않는다.","甲이 인쇄기를 A에게 양도하기로 하고 계약금 및 중도금을 수령하였음에도 이를 자신의 채권자 B에게 기존 채무 변제에 갈음하여 양도함으로써 재산상 이익을 취득한 경우, 甲의 행위는 배임죄를 구성하지 않는다.","甲이 乙로부터 공무원인 제3자에게 뇌물로 전달하여 달라는 목적으로 교부받은 금전을 제3자에게 전달하지 않고 임의로 소비한 경우, 甲의 행위는 횡령죄를 구성한다.","건물의 임차인인 甲이 임대인 A에 대한 임대차보증금반환채권을 B에게 양도하는 계약을 체결하고, 이를 A에게 통지하지 않고 A로부터 남아 있던 임대차보증금을 반환받아 개인적 용도로 사용한 경우, 甲의 행위는 횡령죄를 구성하지 않는다.",2,0,""],["2026-2","형사법",23,"방화의 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","｢형법｣상 방화죄의 객체인 건조물은 토지에 정착되고 벽 또는 기둥과 지붕 또는 천장으로 구성되어 사람이 내부에 기거하거나 출입할 수 있는 공작물을 말하고, 반드시 사람의 주거용이어야 하는 것은 아니라도 사람이 사실상 기거‧취침에 사용할 수 있는 정도는 되어야 한다.","甲이 현주건조물 내에 있는 A를 강타하여 실신케 한 후 A를 살해할 의사로 그 건조물에 방화하여 불태워 죽게 한 경우, 현주건조물방화죄와 살인죄가 성립하고 양죄는 상상적 경합 관계에 있다.","매개물을 통한 점화에 의하여 건조물을 불태우는 것을 내용으로 하는 형태의 방화죄의 경우, 범인이 그 매개물에 불을 켜서 붙였거나 또는 범인의 행위로 인하여 매개물에 불이 붙게 됨으로써 연소작용이 계속될 수 있는 상태에 이르렀다면, 그것이 곧바로 진화되는 등의 사정으로 인하여 목적물인 건조물 자체에는 불이 옮겨 붙지 못하였다고 하더라도, 방화죄의 실행의 착수가 인정된다.","불을 놓아 무주물(인형)을 불태워 공공의 위험을 발생하게 한 경우에는 ‘무주물’을 ‘자기 소유의 물건’에 준하는 것으로 보아 ｢형법｣ 제167조 제2항의 자기소유일반물건방화죄를 구성한다.",1,0,""],["2026-2","형사법",24,"문서에 관한 죄에 대한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","행사할 목적으로 작성된 문서가 일반인으로 하여금 당해 명의인의 권한 내에서 작성된 문서라고 믿게 할 수 있는 정도의 형식과 외관을 갖추고 있는 경우, 그 명의인이 실재하지 않는 허무인 이거나 또는 문서의 작성일자 전에 이미 사망하였다고 하더라도 문서위조죄가 성립한다.","가상화폐 거래시스템의 설치‧운영 주체로부터 각자의 직무 범위에서 개개의 단위정보의 입력 권한을 부여받은 사람이 그 권한을 남용하여 허위의 정보를 입력함으로써 시스템 설치‧운영 주체의 의사에 반하는 전자기록을 생성하는 행위는 ｢형법｣ 제 232조의2에서 말하는 전자기록의 ‘위작’에 포함된다고 볼 수 없다.","부검 결과로써확인된 최종적 사인이 이보다 앞선 시점에 작성된 사망진단서에 기재된 사망 원인과 일치하지 않는다면, 사망진단서의 기재 내용이 객관적 진실에 반하는 것이므로, 설령 작성자가 진단서 작성 당시 그 내용이 허위라는 점을 인식하고 있지 못했다 하더라도 ｢형법｣ 제233조의 허위진단서작성죄가 성립한다.","자동차 등의 운전자가 경찰공무원에게 다른 사람의 운전면허증 자체가 아니라 이를 촬영한 이미지파일을 휴대전화 화면을 통하여 보여주는 행위는 공문서부정행사죄를 구성한다.",0,0,""],["2026-2","형사법",25,"사회적 법익에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","교통방해를 유발한 집회에 참가한 경우 참가 당시 이미 다른 참가자들에 의해 교통의 흐름이 차단된 상태였더라도 교통방해를 유발한 다른 참가자들과 암묵적‧순차적으로 공모하여 교통방해의 위법상태를 지속시켰다고 평가할 수 있다면 일반교통방해죄가 성립한다.","위조통화를 행사하여 상대방으로부터 재물을 편취하는 경우, 위조통화행사죄와 사기죄의 양죄가 성립된다.","자기앞수표의 발행인이 수표의뢰인으로부터 수표자금을 입금받지 아니한 채 자기앞수표를 발행한 경우 허위유가증권작성죄가 성립한다.","도박죄에서 도박은 ‘재물을 걸고 우연에 의하여 재물의 득실을 결정하는 것’을 의미하는바, 여기서 ‘우연’이란 주관적으로 ‘당사자에 있어서 확실히 예견 또는 자유로이 지배할 수 없는 사실에 관하여 승패를 결정하는 것’을 말하고, 객관적으로 불확실할 것을 요구하지 아니한다.",2,0,""],["2026-2","형사법",26,"공무원의 직무에 관한 죄에 대한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","직무유기죄에서 공무원이 정당한 이유 없이 직무를 유기한 때라 함은 직무에 관한 의식적인 방임 내지 포기 등 정당한 사유 없이 직무를 수행하지 아니한 경우뿐만 아니라, 태만‧분망‧착각 등으로 인하여 직무를 성실히 수행하지 아니한 경우나 형식적 으로 또는 소홀히 직무를 수행하였기 때문에 성실한 직무수행을 못한 경우를 포함한다.","직권남용권리행사방해죄는 공무원이 그 일반적 직무권한에 속하는 사항에 관하여 직권의 행사에 가탁하여 실질적, 구체적으로 위법‧부당한 행위를 한 경우에 성립하고, 그 일반적 직무권한은 반드시 법률상의 강제력을 수반하는 것임을 요하지 않는다.","공무상비밀누설죄는 비밀 그 자체를 보호하는 것이 아니라 공무원의 비밀엄수의무 침해에 의하여 위험하게 되는 이익, 즉 비밀 누설에 의하여 위협받는 국가의 기능을 보호하기 위한 것이다.","금품이나 이익 전부에 관하여 뇌물수수죄의 공동정범이 성립한 이후에 뇌물이 실제로 공동정범인 공무원 또는 비공무원 중 누구에게 귀속되었는지는 이미 성립한 뇌물수수죄에 영향을 미치지 않는다.",0,0,""],["2026-2","형사법",27,"국가적 법익에 대한 죄에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","증인이 소송사건의 같은 심급에서 변론기일을 달리하여 수차 증인으로 나가 수 개의 허위진술을 하였더라도 최초에 한 선서의 효력을 유지시킨 후 증언하였다면 1개의 위증죄를 구성한다.","사립대학교 교수로 하여금 소속 학교법인에 의한 인사권의 행사로서 징계처분을 받게 할 목적으로 허위의 민원을 제기 하더라도 무고죄는 성립하지 않는다.","경찰관 甲이 A를 구속하기 위하여 진술조서 등을 허위로 작성한 후 이를 기록에 첨부하여 구속영장을 신청하고, 진술조서 등이 허위로 작성된 정을 모르는 검사와 영장전담판사를 기망하여 구속영장을 발부받은 후 그 영장에 의하여 A를 구금하였다면 ｢형법｣ 제124조 제1항의 직권남용감금죄가 성립한다.","혼인외 출생자가 벌금 이상의 형에 해당하는 죄를 범한 자신의 생부(生父)를 도피하게 한 경우, 생부가 혼인외 출생자를 인지 하지 않았더라도 범인도피죄의 친족 간 특례를 규정한 ｢형법｣ 제151조 제2항을 적용할 수 있다.",3,0,""],["2026-2","형사법",28,"고소‧고발에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 고소할 수 있는 자가 수인인 경우에는 1인의 기간의 해태는 타인의 고소에 영향이 없다. ㉡ 법정대리인은 피해자의 고소권 소멸 여부에 관계없이 고소할 수 있고, 이러한 고소권은 피해자의 명시한 의사에 반하여도 행사할 수 있다. ㉢ 친고죄에서 적법한 고소가 있었는지는 엄격한 증명의 대상이 되고, 일죄의 관계에 있는 범죄사실 일부에 대한 고소의 효력은 일죄 전부에 대하여 미친다. ㉣ 고발은 범죄사실에 대한 소추를 요구하는 의사표시로서 그 효력은 고발장에 기재된 범죄사실과 동일성이 인정되는 사실 모두에 미치므로, ｢조세범 처벌절차법｣에 따라 범칙사건에 대한 고발이 있는 경우 고발의 효력은 고발의 대상인 범칙사건에 관련된 범칙사실의 전부에 미치고 한 개의 범칙사실의 일부에 대한 고발은 전부에 대하여 효력이 생긴다. ㉤ 고발에 있어서도 이른바 고소‧고발 불가분의 원칙이 적용 되므로, 양벌규정에 근거하여 피고발인을 법인으로 명시한 다음, 이어서 법인의 등록번호와 대표자의 인적 사항을 기재한 고발장의 표시를 자연인인 개인까지를 피고발자로 표시한 것이라고 볼 수 있다.","2개","3개","4개","5개",1,0,""],["2026-2","형사법",29,"피의자신문에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피의자와 동석한 신뢰관계에 있는 자가 피의자를 대신하여 진술한 부분이 조서에 기재되어 있는 경우, 그 부분은 동석한 사람에 대한 진술조서로서의 증거능력을 취득하기 위한 요건을 충족하지 못하는 한, 이를 피의자에 대한 유죄 인정의 증거로 사용할 수 없다.","수사기관이 변호인의 피의자신문 참여를 부당하게 제한하거나 중단시킨 경우, 준항고를 통해 다툴 수 있다.","피의자에 대한 사법경찰관 작성의 피의자신문조서에는 “피의자는 진술거부권과 변호인의 조력을 받을 권리들이 있음을 고지받았 는가요?”라는 질문에 “예, 고지를 받았습니다.”라는 답변이 기재 되어 있기는 하나 그 답변은 피의자의 자필로 기재된 것이 아니고, 각 답변란에 무인이 되어 있기는 하지만 조서 말미와 간인으로 되어 있는 피의자의 무인과 달리 흐릿하게 찍혀 있더라도 진술의 임의성이 인정되는 경우, 위 피의자신문조서는 증거능력이 인정된다.","피의자진술의 영상녹화가 완료된 후 이를 재생하여 시청한 피의자 또는 변호인이 그 내용에 대하여 이의를 진술하는 경우, 그 진술을 별도로 영상녹화하여 첨부하지 않고 그 취지를 기재한 서면을 첨부하는 것으로 족하다.",2,0,""],["2026-2","형사법",30,"구속 전 피의자심문제도에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","판사는 구속영장이 청구된 피의자를 심문하는 때에는 공범의 분리심문이나 그 밖에 수사상의 비밀보호를 위하여 필요한 조치를 하여야 하고, 법원사무관등은 심문의 요지 등을 조서로 작성하여야 한다.","판사는 구속 여부의 판단을 위하여 필요하다고 인정하는 때에는 피해자 그 밖의 제3자에게 심문장소에 출석을 요구하여 피해자 그 밖의 제3자를 심문하여야 한다.","구속 전 피의자심문을 하는 경우 법원이 구속영장청구서‧수사 관계 서류 및 증거물을 접수한 날부터 구속영장을 발부하여 검찰청에 반환한 날까지의 기간은 구속기간에 산입하지 아니한다.","구속영장 발부 여부를 결정하기 위한 피의자심문절차는 구속 여부를 판단하는 데 필요한 사항에 한하여 신속하고 간결하게 이루어져야 하므로, 특별한 사정이 없는 한 구속 전 피의자 심문절차에서 심문기일을 속행하는 것은 바람직하지 않다.",1,0,""],["2026-2","형사법",31,"압수‧수색에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","수사기관의 압수‧수색절차 과정에서 처분을 받는 자가 미성년자인 경우, 의사능력이 있더라도 미성년자에게 영장이 반드시 제시 되어야 할 필요는 없고, 그 친권자에게 영장을 제시하고 의사 능력이 있는 미성년자나 그 친권자에게 참여의 기회를 보장 하였다면 그러한 압수‧수색은 적법하다.","수사기관이 압수‧수색영장을 제시하고 집행에 착수하여 압수‧ 수색을 실시하고 그 집행을 종료하였더라도 동일한 장소 또는 목적물에 대하여 다시 압수‧수색할 필요가 있는 경우라면 앞서 발부받은 압수‧수색영장의 유효기간이 남아 있는 한 이를 처분을 받았던 사람에게 제시하고 다시 압수‧수색을 할 수 있다.","현행범인 체포 현장에서 소지자가 임의로 제출하는 물건은 ｢형사소송법｣ 제218조에 의하여 영장 없이 압수할 수 있으나, 이 경우에 사법경찰관은 사후에 지체없이 영장을 받아야 한다.","사법경찰관이 보험사기의 피해자인 개별 생명보험회사의 공동 이익 증진 등을 위해 설립된 단체인 생명보험협회 소속 치과 위생사 1명을 임의로 참여시켜 그로 하여금 치과병원 접수대 안쪽에 설치된 간호사 PC를 탐색하고, 그곳에 펼쳐진 환자의 엑스레이 사진이 부착된 진료기록부를 확인한 후 그 진료기록부를 넘겨가며 사법경찰관과 대화하는 방식으로 치과병원에 대한 압수‧수색영장을 집행한 경우, 이는 헌법과 ｢형사소송법｣이 정한 절차에 따르지 아니한 것으로 위법하다.",3,0,""],["2026-2","형사법",32,"전자정보의 압수‧수색에 관한 설명으로 옳지 않은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 수사기관이 압수‧수색 종료 후에도 혐의사실과 무관한 전자 정보를 삭제‧폐기‧반환하지 아니한 채 그대로 보관하고 있다면, 압수 대상이 되는 범위를 넘어서는 전자정보를 영장 없이 압수‧수색하여 취득한 것이어서 위법하다. ㉡ 정보저장매체를 임의제출한 피압수자에 더하여 임의제출자 아닌 피의자에게도 참여권이 보장되어야 하는 ‘피의자의 소유‧ 관리에 속하는 정보저장매체’에 해당하는지 여부는 전자 정보에 의해 식별되는 정보주체의 개인정보자기결정권을 고려할 때 압수‧수색 당시 외형적‧객관적으로 인식 가능한 사실상의 상태가 아니라 민사법상 권리의 귀속에 따른 법률적‧ 사후적 판단을 기준으로 판단하여야 한다. ㉢ 수사기관이 甲을 피의자로 하여 발부받은 압수‧수색영장에 기하여 인터넷서비스업체인 A주식회사를 상대로 A주식회사의 본사 서버에 저장되어 있는 甲의 전자정보인 SNS 대화내용 등에 대하여 압수‧수색을 실시한 경우, 수사기관은 압수‧ 수색 과정에서 甲에게 참여권을 보장하여야 한다. ㉣ 증거은닉범이 본범으로부터 증거은닉을 교사받아 소지‧보관 하고 있던 본범 소유‧관리의 정보저장매체를 피의자의 지위 에서 수사기관에 임의제출하였고, 본범이 그 정보저장매체에 저장된 전자정보의 탐색‧복제‧출력시 사생활의 비밀과 자유 등을 침해받지 않을 실질적인 이익을 갖는다고 평가될 수 있는 경우, 임의제출자이자 피의자인 증거은닉범과 함께 그러한 실질적 이익을 갖는 본범에게도 참여권이 보장되어야 한다. ㉤ 수사기관이 압수‧수색영장에 적힌 ‘수색할 장소’에 있는 컴퓨터 등 정보처리장치에 저장된 전자정보 외에 원격지 클라우드에 저장된 전자정보를 압수‧수색하기 위해서는 압수‧수색영장에 적힌 ‘압수할 물건’에 별도로 원격지 클라우드저장 전자정보가 특정되어 있어야 한다.","㉡㉣","㉠㉡㉢","㉠㉢㉤","㉡㉢㉣",0,0,""],["2026-2","형사법",33,"엄격한 증명과 자유로운 증명의 대상에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 공연성은 명예훼손죄와 모욕죄의 구성요건으로서, 명예훼손이나 모욕에 해당하는 표현을 특정 소수에게 한 경우 공연성이 부정되는 유력한 사정이 될 수 있으므로, 전파될 가능성에 관해서는 검사의 엄격한 증명이 필요하다. ㉡ ｢형법｣상 증거위조죄의 적용대상인 ‘증거’에는 범죄의 성립에 관한 증거 외에 양형의 기초가 되는 정상관계 사실에 관한 증거도 포함되므로, 양형의 기초가 되는 정상관계 사실은 ｢형사소송법｣ 제307조가 규정한 엄격한 증명의 대상에 해당한다. ㉢ 몰수‧추징은 부가형이고 형벌이므로, 그 대상 여부나 추징액의 인정은 엄격한 증명을 필요로 한다. ㉣ 범죄구성요건에 해당하는 사실을 증명하기 위한 근거가 되는 과학적인 연구 결과는 적법한 증거조사를 거친 증거능력 있는 증거에 의하여 엄격한 증명으로 증명되어야 한다. ㉤ 재심의 청구를 받은 법원은 재심청구 이유의 유무를 판단함에 필요한 경우 사실을 조사할 수 있고, 공판절차에 적용되는 엄격한 증거조사 방식에 따라야만 하는 것은 아니다.","2개","3개","4개","5개",1,0,""],["2026-2","형사법",34,"전문증거에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","甲이 A를 협박한 사건의 공판정에서 “내 말 안 듣고 이혼을 요구하면 죽여 버린다”라고 甲이 말하였다고 피해자 A가 증언 하였다면, 이는 전문증거가 아니라 본래증거에 해당한다.","사법경찰관 P가 수사과정에서 절도 피의자 甲으로부터 들은 범행내용에 대해 법정에서 한 진술은 전문증거에 해당한다.","甲이 A에게 행한 진술이 기재된 서류가 甲이 그러한 내용의 진술을 하였다는 사실 자체에 대한 정황증거로 사용될 것이라는 이유로 서류의 증거능력을 인정한 다음 그 사실을 다시 甲이 A에 대한 진술내용이나 그 진실성을 증명하는 간접사실로 사용하는 경우 그 서류는 전문증거에 해당한다.","甲이 A를 살해하는 현장을 B가 목격하고 이를 C에게 전언한 경우, 甲이 A를 살해하는 것을 보았다는 목격자 B의 말을 B로부터 전해 들은 C의 증언은, 甲에 대한 살인 피고사건에서 전문증거가 되고 더 나아가 B에 대한 명예훼손 피고사건에서도 전문증거에 해당한다.",3,0,""],["2026-2","형사법",35,"위법수집증거배제법칙에 관한 설명으로 옳은 것만을 모두 고른 것은? (다툼이 있는 경우 판례에 의함) ㉠ 수사기관이 피의자를 신문함에 있어서 피의자에게 미리 진술 거부권을 고지하지 않은 때에는 그 피의자의 진술은 위법하게 수집된 증거로서 진술의 임의성이 인정되는 경우라도 증거 능력이 부인되어야 한다. ㉡ 범행 현장에서 지문채취 대상물에 대한 지문채취가 먼저 이루어지고, 수사기관이 그 이후에 지문채취 대상물을 적법한 절차에 의하지 아니한 채 압수한 경우, 압수 이전에 채취된 지문은 위법하게 압수한 지문채취 대상물로부터 획득한 2차적 증거에 해당하지 아니함이 분명하여, 이를 가리켜 위법수집 증거라고 할 수 없다. ㉢ 범행 중 또는 범행 직후의 범죄 장소에서 긴급을 요하여 법원 판사의 영장을 받을 수 없는 때에는 영장 없이 압수‧수색 또는 검증을 할 수 있고, 이 경우 사후에 지체없이 영장을 받아야 한다고 규정하고 있는 ｢형사소송법｣ 제216조 제3항의 요건 중 어느 하나라도 갖추지 못한 경우, 그러한 압수‧수색 또는 검증은 위법하며, 이에 대하여 사후에 법원으로부터 영장을 발부받았다고 하여 그 위법성이 치유되지 아니한다. ㉣ 특별사법경찰관리로 지명된 공무원이 범죄수사를 위하여 음식점 등 영업소에 출입하여 증거수집 등 수사를 하면서 행정조사시 요구되는 ｢식품위생법｣ 제22조 제3항이 정한 ‘권한을 표시하는 증표 및 조사기간 등이 기재된 서류를 지니고 제시해야 한다’는 절차를 준수하지 않은 경우, 이때의 수사는 위법하다.","㉠㉣","㉠㉡㉢","㉡㉢㉣","㉠㉡㉢㉣",1,0,""],["2026-2","형사법",36,"전문법칙에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","조세범칙조사를 담당하는 세무공무원이 피고인이 된 혐의자 또는 참고인에 대하여 심문한 내용을 기재한 조서는 수사기관이 작성한 조서와 동일하게 볼 수 없으므로 ｢형사소송법｣ 제312조에 따라 증거능력의 존부를 판단할 수는 없다.","형사조정위원들이 작성한 형사조정조서 중 ‘피의자의 주장’란에 피고인의 진술을 기재한 부분은 수사가 시작된 이후 수사기관의 관여나 영향 아래 작성된 경우로서 실질적으로 고찰할 때 수사 과정 외에서 작성된 것이라고 볼 수 없으므로 ｢형사소송법｣ 제313조 제1항에 따라 증거능력을 인정할 수는 없다.","보호관찰관이 보호관찰 대상자에 대하여 심문한 내용을 기재한 조서는 특별사법경찰관리로서 피부착자의 범죄에 관한 직무를 수행하는 것이 아닌 경우 피고인 또는 피고인이 아닌 자가 작성한 진술서나 그 진술을 기재한 서류에 해당하지 않으므로 ｢형사소송법｣ 제313조 제1항에 따라 증거능력의 존부를 판단할 수 없다.","형사조정위원들이 작성한 형사조정조서 중 ‘피의자의 주장’란에 피고인의 진술을 기재한 부분은 수사기관이 작성한 ‘피의자신문 조서’나 ‘피고인이 아닌 자의 진술을 기재한 조서’가 아니고, ‘피고인 또는 피고인이 아닌 자가 작성한 진술서’라 보기 어려우므로 ｢형사소송법｣ 제312조에 의하여 증거능력을 인정할 수는 없다.",2,0,""],["2026-2","형사법",37,"사진의 증거능력에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","사법경찰관이 작성한 검증조서에 피의자이던 피고인이 사법경찰관 앞에서 자백한 범행내용을 현장에 따라 진술‧재연한 내용이 기재되고 그 재연 과정을 촬영한 사진이 첨부되어 있다면, 그러한 기재나 사진은 피고인이 공판정에서 그 진술내용 및 범행재연의 상황을 모두 부인하는 이상 증거능력이 없다.","｢형사소송법｣ 제218조에 위반하여 소유자, 소지자 또는 보관자가 아닌 자로부터 제출받은 물건을 영장없이 압수한 후 그 ‘압수물을 찍은 사진’은 피고인이 이를 증거로 함에 동의하였다면 유죄 인정의 증거로 사용할 수 있다.","피해자가 피고인으로부터 당한 공갈 등 피해 내용을 담아 남동생 에게 보낸 문자메시지를 촬영한 사진은 그 진정성립이 인정되고 공판기일에 그 기재내용에 대하여 피해자에 대한 반대신문이 이루어져도 증거로 할 수 없다.","수사기관이 참고인을 조사하는 과정에서 ｢형사소송법｣ 제221조 제1항에 따라 제작한 영상녹화물은, 다른 법률에서 달리 규정하고 있는 등의 특별한 사정이 있는 경우에도 공소사실을 직접 증명 할 수 있는 독립적인 증거로 사용될 수는 없다.",0,0,""],["2026-2","형사법",38,"증거동의에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","피고인이 제1심법정에서 사법경찰관 작성 조서에 대해 증거로 함에 동의하였다면, 그 후 항소심에서 범행인정 여부를 다투고 있다고 하더라도 이미 한 증거동의의 효과에 아무런 영향이 없다.","피고인이 공시송달의 방법에 의한 공판기일의 소환을 2회 이상 받고도 출석하지 아니하여 법원이 피고인의 출정 없이 증거조사를 하는 경우에는 ｢형사소송법｣ 제318조 제2항에 따른 피고인의 증거동의가 있는 것으로 간주된다.","피고인이 사법경찰관 작성의 피해자진술조서를 증거로 동의함에 있어서 그 동의가 법률적으로 어떠한 효과가 있는지를 모르고 한 것이었다고 주장하더라도 변호인이 그 동의시 공판정에 재정하고 있으면서 피고인이 하는 동의에 대하여 아무런 이의나 취소를 한 사실이 없다면 그 동의에 무슨 하자가 있다고 할 수 없다.","피고인의 증거동의의 의사표시는 증거조사가 완료된 뒤에도 취소 또는 철회가 가능하나, 그 취소 또는 철회 전에 이미 취득한 증거능력이 상실되는 것은 아니다.",3,0,""],["2026-2","형사법",39,"다음 사례에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) 甲은 자신이 저지른 사기죄로 징역 1년의 실형을 선고받고 2008. 6. 17. 그 형의 집행이 종료되었다. 출소 후 甲은 도박빚에 시달리자 2010. 6. 16. 15:40경 피해자 A가 운영하는 서울 동대문구 소재의 OO모텔에 이르러, 피해자가 평소 비어 있는 객실의 문을 열어둔다는 사실을 알고 그곳 202호 안까지 들어가 침입한 다음, 같은 날 23:50경 그곳에 설치되어 있던 피해자 소유의 게이밍 모니터 1대를 가지고 나와 절취하였다. 甲은 사법경찰관 P로부터 경찰서로 출석하여 조사받을 것을 통지받자, 변호사 乙을 찾아가 다가올 수사에 관하여 자문을 받았다. 이후 甲은 불구속 상태에서 수사기관의 조사를 받았다. ㉠ 사례에서 甲에게는 야간주거침입절도죄가 성립하지 않는다. ㉡ 만일 甲의 사기죄로 선고받았던 형이 ｢형의 실효 등에 관한 법률｣ 제7조에 따라 실효되었다면, 위 2010. 6. 16. 甲의 범행에 대해 법원이 유죄를 인정하고 징역형을 선택한 경우 ｢형법｣ 제35조 제1항에서 정한 누범사유에는 해당하지 않는다. ㉢ 甲과 변호인 사이에 생성된 형사사건에 관한 법률자문 서류 등에 대한 압수는 헌법상 변호인의 조력을 받을 권리 등을 침해할 소지가 있으므로, 원칙적으로 허용되어서는 안 된다. ㉣ 甲이 불구속 상태에서 수사를 받는 경우에도 변호인의 조력을 받을 권리가 인정된다.","1개","2개","3개","4개",2,0,""],["2026-2","형사법",40,"탄핵증거에 관한 설명으로 가장 적절한 것은? (다툼이 있는 경우 판례에 의함)","피고인이 무죄에 관한 자료로 제출한 서증 가운데 도리어 유죄임을 뒷받침하는 내용이 있다 하여도 법원은 상대방의 동의가 없다면 당해 서류의 진정성립 여부 등을 조사하고 아울러 당해 서류에 대한 피고인이나 변호인의 의견과 변명의 기회를 주었다 하더라도 당해 서증을 유죄인정의 증거로 쓸 수 없다.","｢형사소송법｣ 제312조부터 제316조까지의 규정에 따라 증거로 할 수 없는 서류나 진술은 공판준비 또는 공판기일에서의 피고인 또는 피고인이 아닌 자의 진술의 증명력을 다투기 위하여도 증거로 할 수 없다.","탄핵증거는 범죄사실을 인정하는 증거가 아니어서 엄격한 증거 조사를 거칠 필요는 없으므로 공판정에서 탄핵증거로서의 증거 조사도 필요하지 않다.","피고인이 사법경찰관 작성의 피고인에 대한 피의자신문조서의 내용을 부인하는 이상 증거능력이 없으나 그것이 임의로 작성된 것이 아니라고 의심할 만한 사정이 없는 한 피고인의 법정에서의 진술을 탄핵하기 위한 반대증거로는 사용할 수 있다.",3,0,""],["2026-2","경찰학",1,"형식적 의미의 경찰과 실질적 의미의 경찰에 관한 설명으로 가장 적절한 것은?","실질적 의미의 경찰 개념과 형식적 의미의 경찰 개념은 상호 배타적인 개념이다.","｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣에 따른 자치경찰의 교통법규 위반에 대한 지도‧단속 활동은 형식적 의미의 경찰 개념에 해당한다.","사법경찰은 직접적인 목적이 사회공공의 안녕과 질서유지라는 점에서 실질적 의미의 경찰에 해당한다.","실질적 의미의 경찰 개념은 공공복리의 증진과 같은 소극적 목적을 위한 작용을 의미한다.",1,0,""],["2026-2","경찰학",2,"다음에서 설명하는 경찰의 분류에 관한 내용과 가장 관계가 깊은 것은? 다른 행정작용과 결합하여 특별한 사회적 이익의 보호를 목적으로 하면서 사회공공의 안녕과 질서를 유지하기 위하여 위해를 예방하고 제거하는 경찰작용으로 위생경찰, 산림경찰, 보건경찰 등이 이에 해당한다.","협의의 행정경찰","예방경찰","질서경찰","고등경찰",0,0,""],["2026-2","경찰학",3,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣상 자치 경찰사무에 관한 설명으로 가장 적절하지 않은 것은?","자치경찰사무 중 학교폭력 등 소년범죄, 가정폭력, 아동학대 범죄, 교통사고 및 교통 관련 범죄, ｢형법｣ 제245조에 따른 공연음란 및 ｢성폭력범죄의 처벌 등에 관한 특례법｣ 제12조에 따른 성적 목적을 위한 다중이용장소 침입행위에 관한 범죄, 경범죄 및 기초질서 관련 범죄, 가출인 및 ｢실종아동등의 보호 및 지원에 관한 법률｣ 제2조 제2호에 따른 실종아동등 관련 수색 및 범죄에 해당하는 수사사무에 관한 구체적인 사항 및 범위 등은 대통령령으로 정하는 기준에 따라 시‧도조례로 정한다.","자치경찰사무와 관련하여 해당 시‧도의 경찰력으로는 국민의 생명‧신체‧재산의 보호 및 공공의 안녕과 질서유지가 어려워 경찰청장의 지원‧조정이 필요하다고 인정할 만한 충분한 사유가 있는 경우, 경찰청장은 자치경찰사무를 수행하는 경찰공무원 (제주특별자치도의 자치경찰공무원을 포함한다)을 직접 지휘‧ 명령할 수 있다. 다만, 미리 국가경찰위원회의 의결을 거쳐야 하며 긴급한 경우에는 우선 조치 후 지체 없이 국가경찰위원회의 의결을 거쳐야 한다.","시‧도자치경찰위원회는 정기적으로 경찰서장의 자치경찰사무 수행에 관한 평가결과를 경찰청장에게 통보하여야 하며 경찰청장은 이를 반영하여야 한다.","시‧도자치경찰위원회는 합의제 행정기관으로서 그 권한에 속하는 업무를 독립적으로 수행한다.",0,0,""],["2026-2","경찰학",4,"경찰의 관할에 관한 설명으로 가장 적절하지 않은 것은?","｢국회법｣상 경위나 경찰공무원은 국회 안에 현행범인이 있을 때에는 체포한 후 의장의 지시를 받아야 한다. 다만, 회의장 안에서는 의장의 명령 없이 의원을 체포할 수 없다.","｢법원조직법｣상 재판장은 법정에서의 질서유지를 위하여 필요 하다고 인정할 때에는 개정 전후에 상관없이 관할 경찰서장에게 경찰공무원의 파견을 요구할 수 있다. 파견된 경찰공무원은 법정 내외의 질서유지에 관하여 재판장의 지휘를 받는다.","경찰의 사물관할은 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣ 뿐만 아니라 ｢경찰관 직무집행법｣에도 규정되어 있다.","우리나라는 대륙법계 경찰 개념의 영향으로 범죄수사에 관한 임무가 경찰의 사물관할로서 인정되어 있다. (일반공채･101경비단･경찰행정 경채)",3,0,""],["2026-2","경찰학",5,"민주적 경찰활동에 관한 설명으로 가장 적절한 것은?","‘절차적 정의에 기반한 경찰활동’은 시민의 신뢰를 형성하고 경찰의 민주성을 증진하지만, 적법성과는 충돌하여 경찰활동의 정당성을 저해한다.","민주성은 사법경찰이 피의자 등을 대면하는 과정에서 가장 요구 된다고 할 수 있는 경찰이념이다.","경찰의 이념 중 민주성은 ｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣에는 명시되어 있지 않으나, 헌법상 기본권 조항 등을 통하여 당연히 유추된다.","국가경찰위원회와 시‧도자치경찰위원회는 경찰에 대한 민주적 통제를 강화하는 제도로서 영미법계 경찰 개념으로부터 근거를 찾을 수 있는 경찰의 외부통제 장치이다.",3,0,""],["2026-2","경찰학",6,"｢경찰 인권보호 규칙｣상 인권영향평가 및 인권진단에 관한 설명으로 가장 적절하지 않은 것은?","인권보호담당관은 인권침해를 예방하고 제도를 개선하기 위해 연 1회 이상 경찰청과 소속기관의 청사 및 부속 시설 전반의 인권침해적 요소의 존재 여부를 진단하여야 한다.","진단은 대상 경찰관서를 방문하여 관찰, 서류 점검, 면담, 설문 등의 방법으로 실시하되, 방문 진단이 곤란하다고 인정하는 경우에는 서면으로 할 수 있다.","경찰청, 시‧도경찰청 및 경찰서의 인권업무 담당 부서장은 인권 침해 가능성이 높다고 판단되는 집회 및 시위에 대한 인권영향 평가의 원활한 실시를 위하여 집회시위 현장 점검단을 설치하여 운영하여야 한다.","시‧도경찰청의 인권업무 담당 계장은 시‧도경찰청 인권위원회 간사로서 반기 1회 이상 인권영향평가의 이행 여부를 점검하고, 이를 소속 위원회에 제출해야 한다.",2,0,""],["2026-2","경찰학",7,"다음 경찰부패 대응방안들의 근거가 되는 부패원인 가설이 가장 적절하게 짝지어진 것은? ㉠ 경찰관에게 부적절한 청탁을 하는 시민을 강력하게 처벌한다. ㉡ 윤리의식을 갖추지 못한 지원자를 배제할 수 있도록 경찰 채용 절차를 개선한다. ㉢ 다른 경찰관의 비위를 신고하는 내부 공익신고자에 대한 보호를 강화한다. ㉠ ㉡ ㉢","윤리적 냉소주의 가설 전체사회 가설 썩은사과 가설","윤리적 냉소주의 가설 썩은사과 가설 전체사회 가설","전체사회 가설 윤리적 냉소주의 가설 구조원인 가설","전체사회 가설 썩은사과 가설 구조원인 가설",3,0,""],["2026-2","경찰학",8,"｢경찰청 공무원 행동강령｣에 관한 설명으로 가장 적절하지 않은 것은?","공무원은 정치인이나 정당 등으로부터 부당한 직무수행을 강요 받거나 청탁을 받은 경우에는 별지 제9호 서식 또는 전자우편 등의 방법으로 행동강령책임관에게 보고하거나 소속 기관의 장과 상담하여야 한다.","공무원은 자신의 임용‧승진‧전보 등 인사에 부당한 영향을 미치기 위하여 타인으로 하여금 인사업무 담당자에게 청탁을 하도록 해서는 아니 된다.","공무원은 자신의 직위를 직접 이용하여 부당한 이익을 얻거나 타인이 부당한 이익을 얻도록 해서는 아니 된다.","공무원은 직무의 범위를 벗어나 사적 이익을 위하여 소속기관의 명칭이나 직위를 공표‧게시하는 등의 방법으로 이용하거나 이용 하게 하여서는 아니 된다.",0,0,""],["2026-2","경찰학",9,"｢경찰청 적극행정 면책제도 운영규정｣상 사전컨설팅 감사에 관한 설명으로 가장 적절하지 않은 것은?","사전컨설팅 감사는 서면감사를 원칙으로 하되, 현지 확인 등 실지감사를 함께 할 수 있다.","사전컨설팅 대상 기관 및 대상 부서의 장(이하 “사전컨설팅 대상 기관등의 장”이라 한다)은 불합리한 제도 등으로 인하여 공공의 이익이 훼손되는 일이 없도록 사전컨설팅 감사를 적극 활용하여야 한다.","사전컨설팅 대상 기관등의 장은 인가‧허가‧승인 등 규제관련 업무를 수행하기 전에 감사관에게 사전컨설팅 감사를 신청할 수 있다.","사전컨설팅 감사 의견을 반영하여 적극행정을 추진한 결과는 자체감사규정에 따른 감사의 대상이 되지 아니한다.",3,0,""],["2026-2","경찰학",10,"다음 사례에서 제시하는 A경찰서의 범죄예방활동의 근거가 되는 범죄학 이론으로 가장 관계가 깊은 것은? A경찰서는 반복적으로 발생하는 B아파트 단지의 자전거 절도 사건을 분석하여, 범인은 자전거 절도를 목적으로 타지역에서 온 소년들임을 확인하였다. 이들은 B아파트 자전거 거치대 인근을 배회하며 잠금장치가 해제되어 있는 자전거를 훔치고, 이러한 범행 기술을 또래들과 공유하였다. 이에 A경찰서는 인적이 드문 장소에 설치되었던 자전거 거치대를 주민들의 여가활동 거점인 커뮤니티 센터 앞으로 이동하게 하여 상시적인 감시가 가능하게 하였다.","일상활동이론","범죄패턴이론","집합효율성이론","차별적접촉이론",0,0,""],["2026-2","경찰학",11,"지역사회 경찰활동에 관한 평가 및 한계로 가장 적절하지 않은 것은?","범죄 뿐만 아니라 지역사회의 무질서 문제에 대한 적극적인 개입으로 인하여 주민에 대한 사생활 침해 문제가 발생할 수 있다.","지역주민을 활용한 협력치안을 통하여 무질서 문제에 개입함 으로써, 전통적인 경찰활동과 비교할 때 경찰관의 업무 부담이 경감되었다.","일선 경찰관의 재량이 증가하여 지역 단위에서의 경찰국가화 현상이 발생할 수 있다.","이웃감시(Neighborhood Watch) 및 자율방범대 등 다양한 협력 치안활동의 이론적 배경이 되어 왔다.",1,0,""],["2026-2","경찰학",12,"경찰활동의 전략에 관한 설명으로 가장 적절하지 않은 것은?","셔먼(Sherman)은 사법경찰의 기능 강화를 위하여 범죄수사상 과학적 증거수집을 강조하는 증거기반 경찰활동을 제안하였다.","전통적 경찰활동은 경찰을 범죄해결사로 간주하며 범죄의 사후 진압을 강조한다.","문제지향 경찰활동에 따르면 형법의 사용은 문제 해결 수단의 하나에 불과하다.","무관용 경찰활동은 윌슨(Wilson)과 켈링(Kelling)이 주장한 깨진 유리창 이론의 영향을 받았다.",0,0,""],["2026-2","경찰학",13,"미군정기 경찰활동에 해당하지 않는 것은?","비경찰화 작업의 일환으로 경찰의 활동 영역이 축소되었다.","경찰서를 1급(총경배치), 2급(경감배치)으로 분류하여 운영하던 등급제를 폐지하였다.","경찰검이 경찰봉으로 대체되었다.","｢정치범처벌법｣‧｢치안유지법｣‧｢예비검속법｣은 1945년, ｢보안법｣은 1948년에 폐지되었다.",1,0,""],["2026-2","경찰학",14,"광복 이후 한국경찰의 연혁을 미군정, 치안국, 치안본부, 경찰청 시대로 분류할 때, 치안국 시대의 내용에 관한 것은 모두 몇 개인가? ㉠ 최초의 여성경찰관 채용 ㉡ ｢경찰관 직무집행법｣ 제정 ㉢ 경찰관 해외주재관 제도의 신설 ㉣ 경찰윤리헌장 선포 ㉤ 소방업무가 민방위본부로 이관 ㉥ ｢청원경찰법｣ 제정 ㉦ ｢전투경찰대 설치법｣ 제정","3개","4개","5개","6개",2,0,""],["2026-2","경찰학",15,"경찰행정법의 법원에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","헌법에 의하여 체결‧공포된 조약은 국내법과 같은 효력을 가진다.","법령의 위임이 없음에도 법령에 규정된 처분 요건에 해당하는 사항을 부령에서 변경하여 규정한 경우에는 그 부령의 규정은 행정청 내부의 사무처리 기준 등을 정한 것으로서 행정조직 내에서 적용되는 행정명령의 성격을 지닐 뿐 국민에 대한 대외적 구속력은 없다.","지방자치단체가 조례를 제정할 수 있는 사항은 지방자치단체의 고유사무인 자치사무와 개별 법령에 따라 지방자치단체에 위임된 기관위임사무에 한정된다.","관습법이란 사회의 거듭된 관행으로 생성한 사회생활규범이 사회의 법적 확신과 인식에 의하여 법적 규범으로 승인‧강행 되기에 이른 것을 말한다.",2,0,""],["2026-2","경찰학",16,"경찰책임의 원칙에 관한 설명으로 가장 적절한 것은?","행위자의 고의‧과실이 없는 경우에는 경찰책임이 인정되지 않는다.","형사미성년자의 경우에는 본인이 아닌 부모 등 보호의무자가 행위책임을 부담한다.","정당한 권리자의 의사에 반하여 사실상의 지배권을 행사하는 자도 상태책임을 부담한다.","경찰긴급권은 법령상 근거가 없는 경우 예외적으로 인정되는 권한이다.",2,0,""],["2026-2","경찰학",17,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣과 ｢국가경찰위원회 규정｣상 국가경찰위원회에 관한 설명으로 가장 적절하지 않은 것은?","행정안전부장관은 국가경찰위원회에서 심의‧의결된 내용이 적정 하지 아니하다고 판단할 때에는 재의를 요구할 수 있다.","국가경찰위원회 위원장은 위원회의 심의를 위하여 필요한 경우에는 관계공무원 또는 관계전문가의 출석‧발언이나 자료의 제출을 요구할 수 있다.","국가경찰위원회에 출석한 관계공무원 또는 관계전문가에 대하여는 예산의 범위안에서 수당과 여비를 지급할 수 있다. 다만, 공무원이 그 소관업무와 직접적으로 관련되어 출석하는 경우에는 그러하지 아니한다.","국가경찰위원회 위원은 경찰청장의 제청으로 국무총리를 거쳐 대통령이 임명한다.",3,0,""],["2026-2","경찰학",18,"｢국가경찰과 자치경찰의 조직 및 운영에 관한 법률｣에서 명시하고 있는 시･도자치경찰위원회의 소관 사무에 관한 설명으로 가장 적절하지 않은 것은?","자치경찰사무 담당 공무원의 임용, 평가 및 인사위원회 운영","자치경찰사무에 대한 주요 법령‧정책 등에 관한 사항","국가경찰사무‧자치경찰사무의 협력‧조정과 관련하여 경찰청장과 협의","자치경찰사무에 관한 규칙의 제정‧개정 또는 폐지",1,0,""],["2026-2","경찰학",19,"경찰공무원의 의무에 관한 설명으로 가장 적절하지 않은 것은?","경찰공무원은 직위 또는 직권을 이용하여 부당하게 타인의 민사 분쟁에 개입하여서는 아니된다.","경찰공무원은 근무시간중 음주를 하여서는 아니된다. 다만, 특별한 사정이 있는 경우에는 예외로 하되, 이 경우 주기가 있는 상태에서 직무를 수행하여서는 아니된다.","경찰공무원은 휴무일 또는 근무시간외에 2시간 이내에 직무에 복귀하기 어려운 지역으로 여행을 하고자 할 때에는 소속 경찰 기관의 장에게 신고를 하여야 하나, 치안상 특별한 사정이 있어 경찰청장, 해양경찰청장 또는 경찰기관의 장이 지정하는 기간중에는 소속 경찰기관의 장의 허가를 받아야 한다.","경찰공무원으로서 정치 관여 금지를 위반하여 정당이나 정치단체에 가입하거나 정치활동에 관여하는 행위를 한 사람은 5년 이하의 징역과 5년 이하의 자격정지에 처하고, 그 죄에 대한공소시효의 기간은 ｢형사소송법｣ 제249조 제1항에도 불구하고 7년으로 한다.",3,0,""],["2026-2","경찰학",20,"｢경찰관 직무집행법｣상 범죄의 예방과 제지에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","집회장소 사용 승낙을 하지 않은 대학교 측의 집회 저지 협조 요청에 따라 경찰관들이 대학교 출입문에서 신고된 대학교 에서의 집회에 참가하려는 자의 출입을 저지한 것은 ｢경찰관 직무집행법｣ 제6조의 주거침입행위에 대한 사전 제지조치로 볼 수 없다.","경찰관의 경고나 제지는 범죄의 예방을 위하여 범죄행위에 관한 실행의 착수 전에 행하여질 수 있을 뿐만 아니라, 이후 범죄 행위가 계속되는 중에 그 진압을 위하여도 행하여질 수 있다.","경찰관의 제지 조치가 적법한지 여부는 제지 조치 당시의 구체적 상황을 기초로 판단하여야 하고 사후적으로 순수한 객관적 기준에서 판단할 것은 아니다.","경찰관의 제지는 범죄의 예방을 위한 행정상 즉시강제로서 경찰이 직접 실력을 행사하여 경찰상 필요한 상태를 실현하는 권력적 사실행위에 해당한다.",0,0,""],["2026-2","경찰학",21,"｢경찰관 직무집행법｣ 및 동법 시행령상 손실보상에 관한 설명으로 가장 적절하지 않은 것은?","보상금 지급 청구서를 받은 손실보상 결정권자는 특별한 사유가 없으면 보상금 지급 청구서를 받은 날부터 60일 이내에 손실보상 심의위원회의 심의‧의결에 따라 보상 여부 및 보상금액을 결정 해야 한다. 다만, 부득이한 사유로 60일 이내에 결정할 수 없을 때에는 그 기간이 끝나는 날의 다음 날부터 20일의 범위에서 결정기간을 한 차례만 연장할 수 있다.","손실보상 결정권자는 청구인이 같은 청구 원인으로 보상신청을 하여 보상금 지급 여부에 대하여 결정을 받은 경우에는 그 청구를 각하하는 결정을 해야 한다. 다만, 기각 결정을 받은 청구인이 손실을 증명할 수 있는 새로운 증거가 발견되었음을 소명하는 경우는 제외한다.","손실보상 결정권자는 보상 여부 및 보상금액 결정 또는 각하 결정에 대해서는 지체 없이 청구인에게 통지해야 한다.","청구인은 위원에게 공정한 심의‧의결을 기대하기 어려운 사정이 있는 경우에는 손실보상심의위원회에 기피 신청을 할 수 있고, 위원회는 의결로 이를 결정한다.",2,0,""],["2026-2","경찰학",22,"｢행정기본법｣상처분에관한설명으로가장적절하지않은 것은?","행정청은 당사자의 신뢰를 보호할 가치가 있는 등 정당한 사유가 있는 경우에는 위법 또는 부당한 처분의 전부나 일부를 장래를 향하여 철회할 수 있다.","처분은 무효인 경우를 제외하고는 권한이 있는 기관이 취소 또는 철회하거나 기간의 경과 등으로 소멸되기 전까지는 유효한 것으로 통용된다.","당사자의 신청에 따른 처분은 법령등에 특별한 규정이 있거나 처분 당시의 법령등을 적용하기 곤란한 특별한 사정이 있는 경우를 제외하고는 처분 당시의 법령등에 따른다.","행정청은 당사자에게 권리나 이익을 부여하는 처분을 취소하려는 경우에는 취소로 인하여 당사자가 입게 될 불이익을 취소로 달성되는 공익과 비교‧형량하여야 하지만, 당사자가 처분의 위법성을 중대한 과실로 알지 못한 경우에는 그러하지 아니하다.",0,0,""],["2026-2","경찰학",23,"｢행정절차법｣상 행정지도에 관한 설명으로 가장 적절하지 않은 것은?","행정지도란 행정기관이 그 소관 사무의 범위에서 일정한 행정목적을 실현하기 위하여 특정인에게 일정한 행위를 하거나 하지 아니하도록 지도, 권고, 조언 등을 하는 행정작용이다.","행정지도는 국민의 임의적 협력을 전제로 하는 강학상 행정행위에 해당한다.","행정지도의 상대방은 해당 행정지도의 방식‧내용 등에 관하여 행정기관에 의견제출을 할 수 있다.","행정기관이 같은 행정목적을 실현하기 위하여 많은 상대방에게 행정지도를 하려는 경우에는 특별한 사정이 없으면 행정지도에 공통적인 내용이 되는 사항을 공표하여야 한다.",1,0,""],["2026-2","경찰학",24,"｢공공기관의 정보공개에 관한 법률｣상 불복 구제 절차에 관한 설명으로 가장 적절하지 않은 것은?","청구인이 정보공개와 관련한 공공기관의 비공개 결정 또는 부분 공개 결정에 대하여 불복이 있는 때에는 공공기관으로부터 정보 공개 여부의 결정 통지를 받은 날부터 30일 이내에 해당 공공 기관에 문서로 이의신청할 수 있다.","공공기관은 부득이한 사유로 정하여진 기간 이내에 결정할 수 없을 때를 제외하고는 이의신청을 받은 날부터 7일 이내에 그 이의신청에 대하여 결정하고 그 결과를 청구인에게 지체 없이 문서로 통지하여야 한다.","청구인은 ｢공공기관의 정보공개에 관한 법률｣ 제18조에 따른 이의신청 절차를 거치지 아니하고는 행정심판을 청구할 수 없다.","공공기관은 공개 청구된 공개 대상 정보의 전부 또는 일부가 제3자와 관련이 있다고 인정할 때에는 그 사실을 제3자에게 지체없이 통지하여야 하며, 공개 청구된 사실을 통지받은 제3자는 그 통지를 받은 날부터 3일 이내에 해당 공공기관에 대하여 자신과 관련된 정보를 공개하지 아니할 것을 요청할 수 있다.",2,0,""],["2026-2","경찰학",25,"경찰행정의 실효성 확보수단에 관한 설명으로 옳은 것은 모두 몇 개인가? (다툼이 있는 경우 판례에 의함) ㉠ 행정청이 행정대집행의 방법으로 건물철거의무의 이행을 실현할 수 있는 경우에는 건물철거 대집행 과정에서 부수적으로 건물의 점유자들에 대한 퇴거 조치를 할 수 있고, 필요한 경우에는 ｢경찰관 직무집행법｣에 근거한 위험발생 방지조치 또는 ｢형법｣상 공무집행방해죄의 범행방지 내지 현행범 체포의 차원에서 경찰의 도움을 받을 수도 있다. ㉡ ｢행정기본법｣상 직접강제란 의무자가 행정상 의무를 이행하지 아니하는 경우 행정청이 의무자의 신체나 재산에 실력을 행사하여 그 행정상 의무의 이행이 있었던 것과 같은 상태를 실현하는 것이다. ㉢ ｢행정기본법｣상 즉시강제는 다른 수단으로는 행정목적을 달성할 수 없는 경우에만 허용되며, 이 경우에도 최소한으로만 실시하여야 한다. ㉣ ｢경찰관 직무집행법｣상 경찰관은 불법집회‧시위로 인한 경찰관 자신이나 다른 사람의 생명‧신체와 재산 및 공공시설 안전에 대한 현저한 위해의 발생 억제의 직무를 수행하기 위하여 부득이한 경우, 현장책임자가 판단하여 필요한 최소한의 범위 에서 분사기(｢총포‧도검‧화약류 등의 안전관리에 관한 법률｣에 따른 분사기를 말하며, 그에 사용하는 최루 등의 작용제를 포함한다)를 사용할 수 있다. ㉤ ｢행정기본법｣상 행정대집행, 직접강제, 강제징수, 즉시강제는 의무자의 행정상 의무 불이행을 전제로 한다는 점에서 공통점을 갖는다.","2개","3개","4개","5개",2,0,""],["2026-2","경찰학",26,"｢행정조사기본법｣상 행정조사에 관한 설명으로 가장 적절 하지 않은 것은?","행정조사는 법령등의 위반에 대한 처벌보다는 법령등을 준수 하도록 유도하는 데 중점을 두어야 한다.","행정기관은 행정조사를 통하여 알게 된 정보를 다른 법률에 따라 내부에서 이용하거나 다른 기관에 제공하는 경우를 제외하고는 원래의 조사목적 이외의 용도로 이용하거나 타인에게 제공하여서는 아니 된다.","행정기관은 법령등에서 행정조사를 규정하고 있는 경우에 한하여 행정조사를 실시할 수 있으나, 조사대상자의 자발적인 협조를 얻어 실시하는 행정조사의 경우에는 그러하지 아니하다.","조사대상자는 조사원에게 공정한 행정조사를 기대하기 어려운 사정이 있다고 판단되는 경우에는 행정기관의 장에게 서면이나 구두로 당해 조사원의 교체를 신청할 수 있다.",3,0,""],["2026-2","경찰학",27,"국가배상에 관한 설명으로 가장 적절하지 않은 것은? (다툼이 있는 경우 판례에 의함)","공무원이 직무수행 중 불법행위로 타인에게 손해를 입힌 경우, 피해자에게 손해를 직접 배상한 경과실이 있는 공무원은 특별한 사정이 없는 한 국가에 대하여 국가의 피해자에 대한 손해배상 책임의 범위 내에서 자신이 변제한 금액에 관하여 구상권을 취득한다.","불법시위를 진압하는 경찰관들의 직무집행이 법령에 위반한 것 이라고 하기 위하여는 그 시위진압이 불필요하거나 또는 불법 시위의 태양 및 시위 장소의 상황 등에서 예측되는 피해 발생의 구체적 위험성의 내용에 비추어 시위진압의 계속 수행 내지 그 방법 등이 현저히 합리성을 결하여 이를 위법하다고 평가할 수 있는 경우이어야 한다.","교차로 진행방향 신호기의 정지신호가 단선으로 소등되어 있는 상태에서 그대로 진행하다가 다른 방향의 진행신호에 따라 교차로에 진입한 차량과 충돌한 경우, 신호기의 적색신호가 소등된 기능상 결함이 있었다는 사정만으로도 신호기의 설치 또는 관리상의 하자를 인정할 수 있다.","성폭력범죄의 수사를 담당하거나 수사에 관여하는 경찰관이 직무상 의무에 반하여 피해자의 인적사항 등을 공개 또는 누설 하였다면국가는그로인하여피해자가입은손해를배상하여야한다.",2,0,""],["2026-2","경찰학",28,"｢행정심판법｣에 관한 설명으로 가장 적절한 것은?","의무이행심판은 행정청의 위법 또는 부당한 처분을 취소하거나 변경하는 행정심판이다.","경찰청장이 행한 행정처분에 대한 행정심판은 중앙행정심판 위원회가 심리‧재결한다.","행정심판을 청구하면 처분의 효력이나 그 집행 또는 절차의 속행은 정지된다.","행정심판위원회는 당사자가 주장하지 아니한 사실에 대하여 심리할 수 없다.",1,0,""],["2026-2","경찰학",29,"동기부여이론에 관한 설명으로 가장 적절하지 않은 것은?","매슬로우(Maslow)의 욕구단계이론 - 인간의 욕구는 5단계의 계층으로 이루어져 있으며, 하위단계의 욕구가 충족되어야 비로소 다음 단계의 욕구로 진행된다는 점을 전제로 한다.","엘더퍼(Alderfer)의 ERG이론 – 매슬로우(Maslow)의 욕구단계를 3단계로 줄여서 제시한 이론으로, 인간의 욕구는 권력욕구, 친교 욕구, 성취욕구의 순으로 발달된다고 보았다.","허츠버그(Herzberg)의 동기‧위생이론 – 만족과 관련된 요인을 동기요인, 불만족과 관련된 요인을 위생요인으로 분류했다.","아지리스(Argyris)의 성숙‧미성숙이론 – 미성숙한 조직구성원이 성숙한 조직구성원으로 발전하려면 개인의 성격(Personality)에 7가지 변화가 일어나야 한다고 주장하였다.",1,0,""],["2026-2","경찰학",30,"｢경찰공무원임용령｣에관한설명으로가장적절하지않은 것은?","경찰공무원은 임용장이나 임용통지서에 적힌 날짜에 임용된 것으로 본다.","종전의 재직기관에서 경징계 이상의 징계처분을 받은 사람은 경력경쟁채용등의 대상이 될 수 없다.","수사경과, 안보수사경과는 경정 이하 경찰공무원에게만 부여한다.","경위 이상으로 신규채용된 경찰공무원은 관리능력을 배양할 수 있도록 전공 및 적성을 고려하여 합리적으로 보직하여야 한다.",1,0,""],["2026-2","경찰학",31,"경찰징계 중에서 중징계인 동시에 교정징계에 해당하는 것은 모두 몇 개인가? ㉠ 파면 ㉡ 해임 ㉢ 강등 ㉣ 정직 ㉤ 감봉 ㉥ 견책","2개","3개","4개","5개",0,0,""],["2026-2","경찰학",32,"경찰공무원의 근무성적 평정에 관한 설명으로 가장 적절한 것은?","총경의 근무성적은 제1 평정 요소로만 평정한다.","경무관 이하의 경찰공무원에 대해서는 매년 근무성적을 평정 하여야 한다.","제2 평정 요소는 경찰업무 발전에 대한 기여도, 직무수행능력, 직무수행태도로 구성되어 있다.","휴직‧직위해제 등의 사유로 해당 연도의 평정기관에서 6개월 이상 근무하지아니한경찰공무원에대해서는근무성적을평정하지않는다.",3,0,""],["2026-2","경찰학",33,"｢경찰장비관리규칙｣상 무기 소지 적격 심의위원회에 관한 설명으로 가장 적절하지 않은 것은?","각급 경찰기관의 장 소속 하에 심의위원회를 둔다.","심의위원회에는 1명 이상의 민간위원이 참여하여야 한다.","심의위원회의 위원장은 위원중에서 호선한다.","심의위원회의 회의는 재적위원 과반수의 출석으로 개의하며, 출석위원 과반수의 찬성으로 의결한다.",2,0,""],["2026-2","경찰학",34,"보안관리에 관한 설명으로 옳은 것은 모두 몇 개인가? ㉠ 보안업무의 3대 원칙은 부분화의 원칙, 보안과 효율의 조화의 원칙, 독립분류의 원칙이다. ㉡ 각급기관의 장은 비밀 분류를 통일성 있고 적절하게 하기 위하여 세부 분류지침을 작성하여 시행하여야 한다. 이 경우 세부 분류지침은 공개한다. ㉢ 누설될 경우 국가안전보장에 중대한 해를 끼칠 우려가 있는 비밀은 II급비밀이다. ㉣ 비밀을 생산하거나 관리하는 사람은 비밀의 작성을 완료하거나 비밀을접수하는즉시그비밀을분류하거나재분류할책임이있다. ㉤ 통제구역이란 보안상 매우 중요한 구역으로서 비인가자의 출입이 금지되는 구역이다. ㉥ I급비밀은 반드시 금고 또는 잠금장치가 있는 안전한 용기에 보관하여야 한다.","2개","3개","4개","5개",1,0,""],["2026-2","경찰학",35,"｢112치안종합상황실 운영 및 신고처리 규칙｣상 현장보고 및 현장조치에 관한 설명으로 가장 적절하지 않은 것은?","｢112신고의 운영 및 처리에 관한 법률｣ 제8조 제1항에 따라 출동한 경찰관이 112신고에 대한 현장조치를 할 때, 구급차‧ 소방차의 투입 등 112신고 관계 기관의 협력이 필요한 사안은 출동 경찰관이 112신고 관계 기관에 직접 이를 요청할 수 있다.","출동 경찰관은 112치안종합상황실에 최초보고, 수시보고 및 종결보고를 하여야 하지만, 현장 상황이 급박하여 신속한 현장 조치가 필요한 경우 우선 조치 후 보고할 수 있다. 다만 최초 보고의 경우에는 그러하지 아니하다.","｢112신고의 운영 및 처리에 관한 법률｣ 제8조 제1항에 따라 출동한 경찰관이 112신고에 대한 현장조치를 할 때, 다수의 경찰관이 필요하다고 판단되는 경우 인접 경찰관에게 직접 지원요청 할 수 있으며, 이에 따른 지원 요청을 받은 경찰관은 특별한 사유가 없는 한 신속히 현장으로 출동하여 현장조치 중인 출동 경찰관을 지원해야 한다.","종결보고란 현장 초동조치가 종결된 경우 확인된 사건의 진상, 사건의 처리내용 및 결과 등을 상세히 보고하는 것을 말한다.",1,0,""],["2026-2","경찰학",36,"｢아동･청소년의 성보호에 관한 법률｣상 미수범을 처벌하는 경우만을 모두 고른 것은? ㉠ 위계(僞計) 또는 위력으로써 아동‧청소년을 간음하거나 아동‧ 청소년을 추행한 자 ㉡ 아동‧청소년성착취물을 제작‧수입 또는 수출한 자 ㉢ 아동‧청소년을 아동‧청소년성착취물의 제작자에게 알선한 자 ㉣ 아동‧청소년성착취물을 이용한 협박으로 그 아동‧청소년의 권리행사를 방해하거나 의무 없는 일을 하게 한 자 ㉤ 영업으로 아동‧청소년을 아동‧청소년의 성을 사는 행위의 상대방이 되도록 유인‧권유한 자","㉠㉡㉤","㉡㉢㉣","㉠㉡㉣㉤","㉠㉢㉣㉤",2,0,""],["2026-2","경찰학",37,"대테러경찰활동에 관한 설명으로 가장 적절하지 않은 것은?","｢테러취약시설 안전활동에 관한 규칙｣상 A급 다중이용건축물등은 테러에 의하여 파괴되거나 기능 마비시 광범위한 지역의 대테러 진압작전이 요구되고, 국민생활에 결정적인 영향을 미칠 수 있는 건축물 또는 시설을 말한다.","｢테러취약시설 안전활동에 관한 규칙｣에 따라, 경찰서장은 분기 1회 이상 권역별로 대테러 훈련을 실시하여야 한다. 이 경우 연 1회 이상은 관계기관 합동으로 실시한다.","｢국민보호와 공공안전을 위한 테러방지법｣에 따라, 관계기관의 장은 외국인테러전투원으로 출국하려 한다고 의심할 만한 상당한 이유가 있는 외국인에 대하여 일시 출국금지를 법무부장관에게 요청할 수 있다.","｢국민보호와 공공안전을 위한 테러방지법｣에 따르면, 테러에 이용될 수 있는 위험물질 등 테러수단의 안전관리는 “대테러 활동”에 해당한다.",1,0,""],["2026-2","경찰학",38,"｢도로교통법｣ 및 동법 시행규칙상 자율주행자동차 및 운전자에 관한 설명으로 가장 적절하지 않은 것은?","자율주행시스템의 종류는 부분 자율주행시스템, 조건부 완전 자율주행시스템, 완전 자율주행시스템으로 세분할 수 있다.","완전 자율주행시스템은 모든 영역에서 운전자의 개입 없이 자동차를 운행하는 자율주행시스템을 의미한다.","완전 자율주행시스템에 해당하는 자율주행시스템을 갖춘 자동차의 운전자는 자율주행시스템의 직접 운전 요구에 주변 상황과 도로 정보 등을 스스로 인지하고 판단하여 자동차를 운행할 수 있게 하는 자동화 장비, 소프트웨어 및 이와 관련한 일체의 장치를 직접 조작하여 운전하여야 한다.","｢자동차관리법｣ 제27조 제1항에 따른 임시운행허가를 받은 자율 주행자동차를 운전하려는 사람은 자율주행자동차의 안전운행 등에 관한 교육을 받아야 한다.",2,0,""],["2026-2","경찰학",39,"｢집회 및 시위에 관한 법률｣ 및 동법 시행령상 질서유지선에 관한 설명으로 가장 적절하지 않은 것은?","“질서유지선”이란 관할 경찰서장이나 시‧도경찰청장이 집회 및 시위를 효율적으로 지휘‧조정‧통제 및 관리하기 위하여 집회 또는 시위의 장소나 행진 구간을 일정하게 구획하여 설정한 띠, 방책 (防柵), 차선(車線) 등의 경계 표지(標識)를 말한다.","｢집회 및 시위에 관한 법률｣ 제6조 제1항에 따른 신고를 받은 관할 경찰관서장은 집회 및 시위의 보호와 공공의 질서 유지를 위하여 필요하다고 인정하면 최소한의 범위를 정하여 질서유지선을 설정할 수 있다.","관할 경찰관서장은 집회 및 시위의 보호와 공공의 질서 유지를 위하여 집회‧시위의 장소를 한정하거나 집회‧시위의 참가자와 일반인을 구분할 필요가 있을 경우 ｢집회 및 시위에 관한 법률｣ 제13조 제1항에 따라 질서유지선을 설정할 수 있다.","｢집회 및 시위에 관한 법률｣ 제13조 제2항에 따른 질서유지선의 설정 고지는 서면으로 하여야 한다. 다만, 집회 또는 시위 장소의 상황에 따라 질서유지선을 새로 설정하거나 변경하는 경우에는 집회 또는 시위의 장소에 있는 경찰공무원이 구두로 알릴 수 있다.",0,0,""],["2026-2","경찰학",40,"｢범죄피해자보호법｣에관한설명으로가장적절하지않은 것은?","“범죄피해자 보호‧지원”이란 범죄피해자의 손실 복구, 정당한 권리 행사 및 복지 증진에 기여하는 행위를 말한다. 다만, 수사‧ 변호 또는 재판에 부당한 영향을 미치는 행위는 포함되지 아니한다.","구조금은 유족구조금‧장해구조금 및 중상해구조금으로 구분한다.","장해구조금 및 중상해구조금은 해당 구조피해자에게 지급한다. 다만, 장해구조금 또는 중상해구조금의 지급을 신청한 구조피해자가 장해구조금 또는 중상해구조금을 지급받기 전에 해당 구조대상 범죄피해의 원인이 된 범죄행위로 사망한 경우에는 제18조(유족의 범위 및 순위)에 따라 맨 앞의 순위인 유족에게 지급하되, 순위가 같은 유족이 2명 이상이면 똑같이 나누어 지급한다.","유족이 구조피해자가 사망하기 전에 그가 사망하면 유족구조금 등을 받을 수 있는 선순위 또는 같은 순위의 유족이 될 사람을 고의로 사망하게 한 경우에 해당하면 유족구조금등을 받을 수 있는 유족으로 보지 아니한다.",2,0,""]]}}</script>

  ];

  var CARD_LINES = [
    '이번 카드도 가볍게!',
    '조문 하나씩, 10분이면 충분해',
    '모르면 헷갈려요 눌러도 돼',
    '오늘 목표까지 조금씩 가자'
  ];
  var QUIZ_LINES = [
    '천천히 읽고 정답 하나!',
    '선지는 끝까지 읽는 게 포인트',
    '모르면 일단 고르고 해설 보자',
    '집중! 한 문항이면 돼'
  ];

  var FACE = {
    base: './assets/char-base-face.png',
    good: './assets/char-thumbsup-face.png',
    cheer: './assets/char-cheer-face.png'
  };
  var BODY_IMG = {
    base: './assets/char-base.png',
    good: './assets/char-thumbsup.png',

  };

  var SVG_STAR = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 .9l1.95 4.05 4.45.6-3.28 3.1.83 4.4L7 10.9 3.05 13.05l.83-4.4L.6 5.55l4.45-.6z" fill="#ffd479"/></svg>';
  var SVG_FLOWER = '<svg viewBox="0 0 14 14" aria-hidden="true"><g fill="#ffd0dd"><circle cx="7" cy="3.1" r="2.6"/><circle cx="10.5" cy="5.6" r="2.6"/><circle cx="9.2" cy="9.6" r="2.6"/><circle cx="4.8" cy="9.6" r="2.6"/><circle cx="3.5" cy="5.6" r="2.6"/></g><circle cx="7" cy="7" r="2.1" fill="#f7b733"/></svg>';

  /* =========================================================
     1. 저장 상태
     ========================================================= */
  function freshState() {
    return {
      v: 1,
      known: {},     // cardId: ts
      unsure: {},    // cardId: ts
      wrong: {},     // questionId: { n, ts }
      stats: {},     // questionId: { ok, bad }
      pts: 0,        // 보유 포인트
      rankSeen: 0,   // 이미 축하한 최고 계급 index
      day: null,     // { d, cards:{}, quiz:{}, bonus, earn }
      settings: { subject: 'all', order: 'seq' }
    };
  }

  function prune(s) {
    Object.keys(s.known).forEach(function (id) { if (!CARD_BY_ID[id]) delete s.known[id]; });
    Object.keys(s.unsure).forEach(function (id) { if (!CARD_BY_ID[id]) delete s.unsure[id]; });
    Object.keys(s.wrong).forEach(function (id) { if (!Q_BY_ID[id]) delete s.wrong[id]; });
    Object.keys(s.stats).forEach(function (id) { if (!Q_BY_ID[id]) delete s.stats[id]; });
    Object.keys(s.known).forEach(function (id) { if (s.unsure[id]) delete s.unsure[id]; });
  }

  function loadState() {
    var s = freshState();
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          ['known', 'unsure', 'wrong', 'stats'].forEach(function (k) {
            if (p[k] && typeof p[k] === 'object' && !Array.isArray(p[k])) s[k] = p[k];
          });
          if (typeof p.pts === 'number' && isFinite(p.pts) && p.pts >= 0) s.pts = Math.floor(p.pts);
          if (typeof p.rankSeen === 'number' && isFinite(p.rankSeen) && p.rankSeen >= 0) {
            s.rankSeen = Math.min(RANKS.length - 1, Math.floor(p.rankSeen));
          }
          if (p.day && typeof p.day === 'object' && typeof p.day.d === 'string') {
            s.day = {
              d: p.day.d,
              cards: (p.day.cards && typeof p.day.cards === 'object') ? p.day.cards : {},
              quiz: (p.day.quiz && typeof p.day.quiz === 'object') ? p.day.quiz : {},
              bonus: !!p.day.bonus,
              earn: (typeof p.day.earn === 'number' && isFinite(p.day.earn)) ? p.day.earn : 0
            };
          }
          if (p.settings && typeof p.settings === 'object') {
            if (typeof p.settings.subject === 'string') s.settings.subject = p.settings.subject;
            if (p.settings.order === 'shuffle' || p.settings.order === 'seq') s.settings.order = p.settings.order;
          }
        }
      }
    } catch (e) { /* 저장소를 쓸 수 없으면 메모리에서만 동작 */ }
    prune(s);
    return s;
  }

  function saveState() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 쿼터·사생활 모드 무시 */ }
  }

  var state = loadState();
  if (!SUBJ_NAME[state.settings.subject]) state.settings.subject = 'all';

  var ui = {
    tab: 'home',
    subject: state.settings.subject,
    cardFilter: 'all',
    cardIndex: 0,
    flipped: false,
    quiz: null,
    buddy: null,
    src: GQ.length ? 'gyeolchul' : 'core',
    gsel: null,
    gsession: GSESS.length ? GSESS[0][0] : ''
  };

  /* =========================================================
     2. 작은 유틸
     ========================================================= */
  function $(sel) { return document.querySelector(sel); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function btn(cls, label, onClick, attrs) {
    var b = el('button', cls);
    b.type = 'button';
    if (label) b.textContent = label;
    if (onClick) b.addEventListener('click', onClick);
    if (attrs) Object.keys(attrs).forEach(function (k) { b.setAttribute(k, attrs[k]); });
    return b;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  function fmt(n) {
    return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function cardsIn(subjectId) {
    return CARDS.filter(function (c) { return subjectId === 'all' || c.subjectId === subjectId; });
  }
  function questionsIn(subjectId) {
    return QUESTIONS.filter(function (q) { return subjectId === 'all' || q.subjectId === subjectId; });
  }
  function countKnown(subjectId) {
    return cardsIn(subjectId).filter(function (c) { return !!state.known[c.id]; }).length;
  }
  function countUnsure(subjectId) {
    return cardsIn(subjectId).filter(function (c) { return !!state.unsure[c.id]; }).length;
  }
  function wrongIn(subjectId) {
    return QUESTIONS.concat(GQ).filter(function (q) {
      return (subjectId === 'all' || q.subjectId === subjectId) && !!state.wrong[q.id];
    });
  }
  function unsureIn(subjectId) {
    return cardsIn(subjectId).filter(function (c) { return !!state.unsure[c.id]; });
  }
  function solvedCount(subjectId) {
    return questionsIn(subjectId).filter(function (q) { return !!state.stats[q.id]; }).length;
  }
  function answerRate(subjectId) {
    var ok = 0, bad = 0;
    questionsIn(subjectId).forEach(function (q) {
      var st = state.stats[q.id];
      if (st) { ok += st.ok || 0; bad += st.bad || 0; }
    });
    var total = ok + bad;
    return { ok: ok, bad: bad, total: total, rate: total ? Math.round((ok / total) * 100) : 0 };
  }

  function revBadge(card) {
    var tags = card.tags || [];
    for (var i = 0; i < tags.length; i++) {
      if (REV_LABEL[tags[i]]) return REV_LABEL[tags[i]];
    }
    return null;
  }

  function progressBar(ratio, cls) {
    var bar = el('div', 'bar' + (cls ? ' ' + cls : ''));
    var fill = el('i');
    fill.style.width = Math.max(0, Math.min(100, ratio)) + '%';
    bar.appendChild(fill);
    return bar;
  }

  function insigniaHTML(rank) {
    var s = '';
    for (var i = 0; i < (rank.star || 0); i++) s += SVG_STAR;
    for (var j = 0; j < (rank.flower || 0); j++) s += SVG_FLOWER;
    return s;
  }

  function faceImg(kind, size, alt) {
    var img = el('img');
    img.src = FACE[kind] || FACE.base;
    img.alt = alt || '';
    img.width = size;
    img.height = size;
    img.decoding = 'async';
    return img;
  }

  /* 캐릭터 버디 바 */
  function buddyEl(info, opts) {
    var o = opts || {};
    var box = el('div', 'buddy ' + (info.kind || 'base') + (o.pop ? ' pop' : ''));
    var av = el('div', 'buddy-av');
    av.appendChild(faceImg(info.kind, 44));
    box.appendChild(av);
    var tx = el('div', 'buddy-text');
    tx.appendChild(el('p', 'buddy-line', info.line || ''));
    if (info.sub) tx.appendChild(el('p', 'buddy-sub', info.sub));
    box.appendChild(tx);
    if (o.float) {
      var f = el('span', 'float-pt' + (String(o.float).charAt(0) === '-' ? ' minus' : ''), o.float);
      box.appendChild(f);
    }
    return box;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1700);
  }

  /* =========================================================
     3. 포인트 · 계급 · 하루 할당량
     ========================================================= */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function freshDay() {
    return { d: todayKey(), cards: {}, quiz: {}, bonus: false, earn: 0 };
  }

  function ensureDay() {
    if (!state.day || state.day.d !== todayKey()) state.day = freshDay();
    if (!state.day.cards || typeof state.day.cards !== 'object') state.day.cards = {};
    if (!state.day.quiz || typeof state.day.quiz !== 'object') state.day.quiz = {};
    if (typeof state.day.earn !== 'number' || !isFinite(state.day.earn)) state.day.earn = 0;
  }

  function addPoints(n) {
    ensureDay();
    var before = Math.max(0, state.pts || 0);
    var after = Math.max(0, before + n);
    var delta = after - before;
    state.pts = after;
    state.day.earn = (state.day.earn || 0) + delta;
    return delta;
  }

  function rankIndexFor(pts) {
    var i = 0;
    for (var k = 0; k < RANKS.length; k++) {
      if (pts >= RANKS[k].pts) i = k;
    }
    return i;
  }

  function dayStats() {
    ensureDay();
    return {
      cards: Object.keys(state.day.cards).length,
      quiz: Object.keys(state.day.quiz).length,
      bonus: !!state.day.bonus,
      earn: state.day.earn || 0
    };
  }

  function checkMission() {
    var d = dayStats();
    if (d.bonus || d.cards < GOAL_CARDS || d.quiz < GOAL_QUIZ) return false;
    state.day.bonus = true;
    var got = addPoints(P_BONUS);
    saveState();
    toast('오늘 할당량 완료! +' + got + 'P 🎉');
    return true;
  }

  function showPromo(level) {
    var box = $('#promoOverlay');
    if (!box || level < 1) return;
    var rk = RANKS[level];
    var nx = RANKS[level + 1] || null;
    var pts = Math.max(0, state.pts || 0);

    var title = $('#promoTitle');
    if (title) title.textContent = RANKS[level - 1].name + ' → ' + rk.name;

    var ins = $('#promoInsignia');
    if (ins) ins.innerHTML = insigniaHTML(rk);

    var note = $('#promoNote');
    if (note) {
      note.textContent = fmt(rk.pts) + 'P 돌파 — ' + rk.name + ' 승진! ' +
        (nx ? '다음 목표 ' + nx.name + '까지 ' + fmt(nx.pts - pts) + 'P 남았어요.'
            : '이제 최고 계급이에요. 정말 대단해요!');
    }
    box.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closePromo() {
    var box = $('#promoOverlay');
    if (box) box.hidden = true;
    document.body.style.overflow = '';
  }

  function checkPromotion() {
    var i = rankIndexFor(Math.max(0, state.pts || 0));
    if (i > (state.rankSeen || 0)) {
      state.rankSeen = i;
      saveState();
      setTimeout(function () { showPromo(i); }, 420);
    }
  }

  function greetLine() {
    var h = new Date().getHours();
    if (h < 5) return '이 시간까지 공부 중이야? 한 장만 더 하고 자자';
    if (h < 11) return '좋은 아침! 오늘 10분부터 가볍게 시작해';
    if (h < 17) return '점심 먹고 한 장, 딱 좋은 타이밍이야';
    if (h < 22) return '오늘 하루도 수고했어, 10분만 더!';
    return '잠깐의 10분이 합격을 만든다';
  }

  /* =========================================================
     4. 화면 전환 · 과목
     ========================================================= */
  function go(tab) {
    if (['home', 'cards', 'quiz', 'wrong'].indexOf(tab) < 0) tab = 'home';
    ui.tab = tab;
    if (tab === 'quiz' && ui.src === 'core' && (!ui.quiz || ui.quiz.subject !== ui.subject)) startQuiz('normal');
    renderAll();
    window.scrollTo(0, 0);
  }

  function setSubject(id) {
    if (id !== 'all' && !SUBJ_NAME[id]) return;
    ui.subject = id;
    state.settings.subject = id;
    ui.cardIndex = 0;
    ui.flipped = false;
    ui.buddy = null;
    if (ui.quiz && ui.quiz.subject !== id) {
      if (ui.quiz.src === 'gyeolchul') ui.quiz = null;
      else startQuiz(ui.quiz.mode === 'wrong' ? 'wrong' : 'normal');
    }
    saveState();
    renderAll();
  }

  function renderAll() {
    ensureDay();
    renderChips();
    ['home', 'cards', 'quiz', 'wrong'].forEach(function (v) {
      var node = $('#view-' + v);
      if (node) node.hidden = (ui.tab !== v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.setAttribute('aria-selected', String(t.getAttribute('data-tab') === ui.tab));
    });
    if (ui.tab === 'home') renderHome();
    if (ui.tab === 'cards') renderCards();
    if (ui.tab === 'quiz') renderQuiz();
    if (ui.tab === 'wrong') renderWrong();
    renderBadges();
  }

  function renderBadges() {
    var wq = wrongIn('all').length, uc = unsureIn('all').length;
    var wb = $('#wrongBadge');
    if (wb) {
      if (wq + uc > 0) { wb.textContent = String(wq + uc); wb.hidden = false; }
      else wb.hidden = true;
    }
  }

  function renderChips() {
    var bar = $('#subjectChips');
    clear(bar);
    var list = [{ id: 'all', name: '전체' }].concat(SUBJECTS.map(function (s) { return { id: s.id, name: s.name }; }));
    list.forEach(function (s) {
      var b = el('button', 'chip');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(ui.subject === s.id));
      b.appendChild(el('span', 'chip-name', s.name));
      var total = s.id === 'all' ? CARDS.length : cardsIn(s.id).length;
      b.appendChild(el('span', 'chip-count', countKnown(s.id) + '/' + total));
      b.addEventListener('click', function () { setSubject(s.id); });
      bar.appendChild(b);
    });
  }

  /* =========================================================
     5. 홈 (명언 · 계급 · 하루 할당량)
     ========================================================= */
  var quoteIdx = Math.floor(Math.random() * QUOTES.length);
  var quoteTimer = null;

  function nextQuote() {
    quoteIdx = (quoteIdx + 1) % QUOTES.length;
    var t = $('#quoteText');
    if (!t) return;
    t.classList.add('out');
    window.setTimeout(function () {
      t.textContent = QUOTES[quoteIdx];
      t.classList.remove('out');
    }, 230);
  }

  function buildQuote() {
    var wrap = el('div', 'quote');
    var b = el('button', 'quote-btn');
    b.type = 'button';
    b.setAttribute('aria-label', '오늘의 명언. 누르면 다음 명언으로 바뀝니다');
    b.appendChild(el('span', 'quote-ic', '❝'));
    var t = el('span', 'quote-text', QUOTES[quoteIdx]);
    t.id = 'quoteText';
    t.setAttribute('aria-live', 'polite');
    b.appendChild(t);
    b.appendChild(el('span', 'quote-hint', '탭'));
    b.addEventListener('click', nextQuote);
    wrap.appendChild(b);
    return wrap;
  }

  function buildHero() {
    var pts = Math.max(0, state.pts || 0);
    var lvl = rankIndexFor(pts);
    var rk = RANKS[lvl];
    var nx = RANKS[lvl + 1] || null;
    var d = dayStats();

    var hero = el('section', 'card hero');
    var top = el('div', 'hero-top');
    var copy = el('div', 'hero-copy');

    copy.appendChild(el('p', 'eyebrow', '나의 계급'));

    var rl = el('div', 'rank-line');
    rl.appendChild(el('span', 'rank-name', rk.name));
    var ins = el('span', 'insignia');
    ins.innerHTML = insigniaHTML(rk);
    rl.appendChild(ins);
    copy.appendChild(rl);

    copy.appendChild(el('p', 'hero-greet', greetLine()));

    var ps = el('div', 'pscore');
    ps.appendChild(el('b', null, fmt(pts)));
    ps.appendChild(el('span', null, 'P'));
    if (d.earn) {
      ps.appendChild(el('span', 'earn', '오늘 ' + (d.earn > 0 ? '+' : '') + fmt(d.earn) + 'P'));
    }
    copy.appendChild(ps);

    var ratio, nextLabel;
    if (nx) {
      var base = rk.pts, span = nx.pts - base;
      ratio = Math.max(0, Math.min(100, ((pts - base) / span) * 100));
      nextLabel = '다음 ' + nx.name + '까지 ' + fmt(nx.pts - pts) + 'P';
    } else {
      ratio = 100;
      nextLabel = '최고 계급이에요. 이제 실전만 남았어요!';
    }
    var bar = el('div', 'rank-bar');
    var fill = el('i');
    fill.style.width = ratio + '%';
    bar.appendChild(fill);
    copy.appendChild(bar);
    copy.appendChild(el('p', 'rank-next', nextLabel));

    top.appendChild(copy);

    var fig = el('div', 'hero-fig');
    var img = el('img');
    img.src = BODY_IMG.base;
    img.alt = '경찰 제복을 입고 경례하는 캐릭터';
    img.width = 74;
    img.height = 146;
    img.decoding = 'async';
    fig.appendChild(img);
    top.appendChild(fig);

    hero.appendChild(top);
    return hero;
  }

  function buildMission() {
    var d = dayStats();
    var cN = Math.min(GOAL_CARDS, d.cards);
    var qN = Math.min(GOAL_QUIZ, d.quiz);
    var done = d.cards >= GOAL_CARDS && d.quiz >= GOAL_QUIZ;

    var card = el('section', 'card sec mission' + (done ? ' done' : ''));
    var head = el('div', 'mhead');
    head.appendChild(el('h3', null, '오늘의 할당량'));
    head.appendChild(el('span', 'bonus', done ? '완료 +' + P_BONUS + 'P' : '다 채우면 +' + P_BONUS + 'P'));
    card.appendChild(head);

    card.appendChild(progressRow('암기카드', cN + ' / ' + GOAL_CARDS + '장', (cN / GOAL_CARDS) * 100,
      cN >= GOAL_CARDS ? '오늘 몫 완료 ✓' : '남은 ' + (GOAL_CARDS - cN) + '장', cN >= GOAL_CARDS ? 'good' : ''));
    card.appendChild(progressRow('사지선다', qN + ' / ' + GOAL_QUIZ + '문항', (qN / GOAL_QUIZ) * 100,
      qN >= GOAL_QUIZ ? '오늘 몫 완료 ✓' : '남은 ' + (GOAL_QUIZ - qN) + '문항', qN >= GOAL_QUIZ ? 'good' : ''));

    card.appendChild(el('p', 'mission-foot', done
      ? '오늘 할당량 완료! 보너스 ' + P_BONUS + 'P 받았어요 🎉'
      : '둘 다 채우면 +' + P_BONUS + 'P · 지금 ' + fmt(state.pts || 0) + 'P'));
    return card;
  }

  function renderHome() {
    var root = $('#view-home');
    clear(root);

    var knownN = countKnown('all');
    var unsureN = countUnsure('all');
    var wrongN = wrongIn('all').length;
    var solvedN = solvedCount('all');

    if (GQ.length) {
      prog.appendChild(progressRow('실전 기출', '푼 문항 ' + gSolved + ' / ' + GQ.length,

    }
    root.appendChild(prog);

    /* 과목별 진도 */
    var subj = el('section', 'card sec');
    subj.appendChild(el('h3', null, '과목별 진도'));
    SUBJECTS.forEach(function (s) {
      var kn = countKnown(s.id), un = countUnsure(s.id), wq = wrongIn(s.id).length;

      subj.appendChild(row);

  function kv(k, v) {

  /* =========================================================
     6. 암기카드
     ========================================================= */
  function deckCards() {
    return CARDS.filter(function (c) {
      if (ui.subject !== 'all' && c.subjectId !== ui.subject) return false;
      var known = !!state.known[c.id], unsure = !!state.unsure[c.id];
      if (ui.cardFilter === 'todo') return !known;
      if (ui.cardFilter === 'unsure') return unsure;
      if (ui.cardFilter === 'known') return known;
      return true;
    });
  }

  function cardsBuddy() {
    if (ui.buddy) return ui.buddy;
    var d = dayStats();
    return {
      kind: 'base',
      line: CARD_LINES[ui.cardIndex % CARD_LINES.length],
      sub: '오늘 암기 ' + Math.min(d.cards, GOAL_CARDS) + '/' + GOAL_CARDS + ' · 보유 ' + fmt(state.pts || 0) + 'P'
    };
  }

  var buddyTimer = null;
  function setCardBuddy(info) {
    ui.buddy = info;
    if (buddyTimer) { clearTimeout(buddyTimer); buddyTimer = null; }
    buddyTimer = window.setTimeout(function () {
      buddyTimer = null;
      ui.buddy = null;
      if (ui.tab === 'cards') {
        var slot = $('#buddySlot');
        if (slot) {
          clear(slot);
          slot.appendChild(buddyEl(cardsBuddy(), {}));
        }
      }
    }, 3000);
  }

  function renderCards() {
    var root = $('#view-cards');
    clear(root);

    var all = cardsIn(ui.subject);
    var knownN = countKnown(ui.subject);
    var deck = deckCards();
    if (ui.cardIndex >= deck.length) ui.cardIndex = 0;

    /* 캐릭터 버디 */
    var slot = el('div');
    slot.id = 'buddySlot';
    slot.appendChild(buddyEl(cardsBuddy(), { pop: !!ui.buddy && !!ui.buddy.pop, float: ui.buddy && ui.buddy.float }));
    root.appendChild(slot);

    /* 필터 */
    var filters = el('div', 'deckbar');
    FILTERS.forEach(function (f) {
      var n = 0;
      all.forEach(function (c) {
        var known = !!state.known[c.id], unsure = !!state.unsure[c.id];
        if (f.id === 'all') n++;
        else if (f.id === 'todo' && !known) n++;
        else if (f.id === 'unsure' && unsure) n++;
        else if (f.id === 'known' && known) n++;
      });
      var b = el('button', 'fchip', f.name + ' ' + n);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(ui.cardFilter === f.id));
      b.addEventListener('click', function () {
        ui.cardFilter = f.id;
        ui.cardIndex = 0;
        ui.flipped = false;
        renderCards();
      });
      filters.appendChild(b);
    });
    root.appendChild(filters);

    var meta = el('div', 'deck-meta');
    meta.appendChild(el('span', 'dm-l', SUBJ_NAME[ui.subject] + ' · 남은 ' + (all.length - knownN) + '장'));
    meta.appendChild(el('span', 'dm-r', deck.length ? (ui.cardIndex + 1) + ' / ' + deck.length : '0 / 0'));
    root.appendChild(meta);
    root.appendChild(progressBar(all.length ? pct(knownN, all.length) : 0, 'good'));

    if (!deck.length) {
      root.appendChild(emptyBlock(
        ui.cardFilter === 'unsure' ? '헷갈려요로 표시한 카드가 없어요'
          : ui.cardFilter === 'known' ? '아직 외움 표시한 카드가 없어요'
            : ui.cardFilter === 'todo' ? '이 과목 카드를 다 외웠어요 🎉'
              : '표시할 카드가 없어요',
        ui.cardFilter === 'all' ? '과목을 바꾸거나 다른 필터를 눌러 보세요.' : '다른 필터로 바꾸면 카드가 보여요.',
        '전체 카드 보기',
        function () { ui.cardFilter = 'all'; ui.cardIndex = 0; ui.flipped = false; renderCards(); }
      ));
      return;
    }

    var card = deck[ui.cardIndex];
    root.appendChild(buildFlashcard(card));

    /* 표시 버튼 */
    var isKnown = !!state.known[card.id], isUnsure = !!state.unsure[card.id];
    var marks = el('div', 'mark-row');
    var mb = btn('btn btn-warn', '헷갈려요 (다시 보기)', function () { markCard(card.id, 'unsure'); },
      { 'aria-pressed': String(isUnsure) });
    if (isUnsure) mb.textContent = '헷갈려요 ✓ (다시 보기)';
    var kb = btn('btn btn-good', '외웠어요', function () { markCard(card.id, 'known'); },
      { 'aria-pressed': String(isKnown) });
    if (isKnown) kb.textContent = '외웠어요 ✓';
    marks.appendChild(mb);
    marks.appendChild(kb);
    root.appendChild(marks);

    /* 이전 / 다음 */
    var nav = el('div', 'nav-row');
    var prev = btn('btn btn-line', '‹ 이전', function () {
      ui.cardIndex = (ui.cardIndex - 1 + deck.length) % deck.length;
      ui.flipped = false;
      renderCards();
    }, { 'aria-label': '이전 카드' });
    var next = btn('btn btn-line', '다음 ›', function () {
      ui.cardIndex = (ui.cardIndex + 1) % deck.length;
      ui.flipped = false;
      renderCards();
    }, { 'aria-label': '다음 카드' });
    nav.appendChild(prev);
    nav.appendChild(el('div', 'nav-count', (ui.cardIndex + 1) + ' / ' + deck.length));
    nav.appendChild(next);
    root.appendChild(nav);

    if (ui.cardFilter !== 'all' && ui.cardFilter !== 'todo') {
      var tip = el('p', 'tiny');
      tip.style.marginTop = '10px';
      tip.style.textAlign = 'center';
      tip.textContent = ui.cardFilter === 'unsure' ? '「외웠어요」를 누르면 이 목록에서 빠집니다.' : '「헷갈려요」를 누르면 다시 볼 목록에 담깁니다.';
      root.appendChild(tip);
    }
  }

  function buildFlashcard(card) {
    var wrap = el('div', 'flash' + (ui.flipped ? ' flipped' : ''));
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', ui.flipped ? '카드 뒷면, 정답과 출처. 탭하면 앞면' : '카드 앞면, 질문. 탭하면 정답');

    var inner = el('div', 'flash-inner');

    /* 앞면 */
    var front = el('div', 'face front');
    front.setAttribute('aria-hidden', ui.flipped ? 'true' : 'false');
    var fb = el('div', 'badges');
    fb.appendChild(el('span', 'pill', card.subjectName));
    var rev = revBadge(card);
    if (rev) fb.appendChild(el('span', 'pill rev', '🆕 ' + rev));
    if (state.known[card.id]) fb.appendChild(el('span', 'pill known', '✓ 외움'));
    if (state.unsure[card.id]) fb.appendChild(el('span', 'pill unsure', '⚑ 헷갈림'));
    front.appendChild(fb);
    front.appendChild(el('p', 'q', card.front));
    front.appendChild(el('p', 'hint', '카드를 탭하면 정답이 보여요'));
    inner.appendChild(front);

    /* 뒷면 */
    var back = el('div', 'face back');
    back.setAttribute('aria-hidden', ui.flipped ? 'false' : 'true');
    back.appendChild(el('p', 'face-label', '정답 · 조문 / 판례 요지'));
    back.appendChild(el('p', 'answer', card.back));
    var tags = (card.tags || []).filter(function (t) { return !REV_LABEL[t]; });
    if (tags.length) {
      var tb = el('div', 'tagbox');
      tb.appendChild(el('span', 'tg-label', '암기 포인트'));
      tags.forEach(function (t) { tb.appendChild(el('span', 'tag', t)); });
      back.appendChild(tb);
    }
    back.appendChild(el('p', 'src', '출처 · ' + (card.source || '-')));
    if (card.verified_note) back.appendChild(el('p', 'verify', '검증 · ' + card.verified_note));
    inner.appendChild(back);

    wrap.appendChild(inner);

    function flip() {
      ui.flipped = !ui.flipped;
      wrap.classList.toggle('flipped', ui.flipped);
      wrap.setAttribute('aria-label', ui.flipped ? '카드 뒷면, 정답과 출처. 탭하면 앞면' : '카드 앞면, 질문. 탭하면 정답');
      front.setAttribute('aria-hidden', ui.flipped ? 'true' : 'false');
      back.setAttribute('aria-hidden', ui.flipped ? 'false' : 'true');
    }
    wrap.addEventListener('click', flip);
    wrap.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
    return wrap;
  }

  function markCard(id, status) {
    ensureDay();
    var cur = state.known[id] ? 'known' : (state.unsure[id] ? 'unsure' : null);
    var reaction = null;

    if (cur === status) {
      delete state.known[id];
      delete state.unsure[id];
      toast('표시를 해제했어요');
      reaction = { kind: 'base', line: '표시를 해제했어', sub: '다시 정리해도 괜찮아' };
    } else if (status === 'known') {
      state.known[id] = Date.now();
      delete state.unsure[id];
      var first = !state.day.cards[id];
      var delta = 0;
      if (first) {
        state.day.cards[id] = Date.now();
        delta = addPoints(P_CARD);
      }
      saveState();
      var d1 = dayStats();
      reaction = first
        ? { kind: 'good', line: '외웠어요! +' + delta + 'P', pop: true, float: '+' + delta + 'P',
            sub: '오늘 암기 ' + Math.min(d1.cards, GOAL_CARDS) + '/' + GOAL_CARDS + (d1.cards >= GOAL_CARDS ? ' · 오늘 몫 완료!' : '') }
        : { kind: 'good', line: '또 봤네, 좋아!', pop: true,
            sub: '오늘 이미 받은 카드라 포인트는 그대로 · ' + fmt(state.pts || 0) + 'P' };
      toast(first ? '외웠어요 ✓ +' + delta + 'P' : '외웠어요 ✓');
      checkMission();
      saveState();
      checkPromotion();
    } else {
      state.unsure[id] = Date.now();
      delete state.known[id];
      toast('헷갈려요 ⚑ 다시 볼 목록에 담았어요');
      reaction = { kind: 'cheer', line: '괜찮아, 한 번 더 보면 돼', pop: true,
        sub: '헷갈려요 목록에 담아뒀어 · 오늘 암기 ' + Math.min(dayStats().cards, GOAL_CARDS) + '/' + GOAL_CARDS };
      saveState();
    }

    /* 표시 후 다음 카드로 */
    var deck = deckCards();
    if (!deck.length) {
      ui.cardIndex = 0;
    } else {
      var still = deck.some(function (c) { return c.id === id; });
      if (still) {
        ui.cardIndex = (ui.cardIndex + 1) % deck.length;
      } else if (ui.cardIndex >= deck.length) {
        ui.cardIndex = 0;
      }
    }
    ui.flipped = false;
    setCardBuddy(reaction);
    renderChips();
    renderCards();
    renderBadges();
    if (ui.tab === 'wrong') renderWrong();
  }

  /* =========================================================
     7. 사지선다
     ========================================================= */
  function gIds(session, subject) {
    return GQ.filter(function (q) {
      return q.session === session && (subject === '전체' || q.subjectName === subject);
    }).map(function (q) { return q.id; });
  }

  function startGSet(session, subject) {
    ui.src = 'gyeolchul';
    ui.gsession = session;
    ui.gsel = { session: session, subject: subject };
    ui.quiz = null;
    startQuiz('gyeolchul', gIds(session, subject), {
      label: (GSESS_LABEL[session] || session) + ' · ' + subject
    });
    renderQuiz();
    window.scrollTo(0, 0);
  }

  function startQuiz(mode, idList, meta) {
    var m = (mode === 'wrong') ? 'wrong' : (mode === 'gyeolchul' ? 'gyeolchul' : 'normal');
    var pool;
    if (Array.isArray(idList)) {
      pool = idList.map(function (id) { return Q_BY_ID[id]; }).filter(Boolean);
    } else if (m === 'wrong') {
      pool = QUESTIONS.concat(GQ).filter(function (q) {
        return (ui.subject === 'all' || q.subjectId === ui.subject) && !!state.wrong[q.id];
      });
    } else {
      pool = questionsIn(ui.subject);
    }
    var ids = pool.map(function (q) { return q.id; });
    if (state.settings.order === 'shuffle') ids = shuffle(ids);
    ui.quiz = {
      src: (m === 'gyeolchul') ? 'gyeolchul' : 'core',
      label: (meta && meta.label) ? meta.label : '',
      counted: 0,
      subject: ui.subject,
      mode: m,
      order: state.settings.order,
      ids: ids,
      idx: 0,
      responses: {},
      correct: 0,
      done: ids.length === 0,
      sessionWrong: [],
      combo: 0,
      wrongStreak: 0,
      anim: false,
      lastDelta: 0,
      lastPenalty: 0
    };
  }

  function answeredN(q) {
    if (!q || !q.responses) return 0;
    var n = 0;
    q.ids.forEach(function (id) { if (q.responses[id] != null) n += 1; });
    return n;
  }

  function quizBuddy(q, answered, ok) {
    var d = dayStats();
    var qn = Math.min(GOAL_QUIZ, d.quiz);
    if (!answered) {
      return {
        kind: 'base',
        line: QUIZ_LINES[q.idx % QUIZ_LINES.length],
        sub: '정답 +' + P_QUIZ + 'P · 연속 오답 2번부터 ' + P_BAD + 'P'
      };
    }
    if (ok) {
      return {
        kind: 'good',
        line: '좋아, 해설도 확인!',
        sub: (q.combo >= 2 ? q.combo + '콤보 🔥 · ' : '') + '오늘 사지선다 ' + qn + '/' + GOAL_QUIZ
      };
    }
    return {
      kind: 'cheer',
      line: '해설 보면서 정리하자',
      sub: '오늘 사지선다 ' + qn + '/' + GOAL_QUIZ + ' · 오답노트에 담았어'
    };
  }
