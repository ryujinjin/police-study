<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="경찰공채 핵심암기">
<meta name="theme-color" content="#1d3a8f">
<meta name="description" content="경찰공무원 순경 공채 헌법·형사법·경찰학 OX 1,500여 지문과 면접 대비 경찰 뉴스·이슈. 2026.10.2. 시행 형사사법 개편 반영, 판례·조문 원문 해설.">
<title>경찰공채 순찰일지</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3a8f'/%3E%3Cpath d='M32 12l14 5v14c0 9-6 16-14 19-8-3-14-10-14-19V17z' fill='%23fff'/%3E%3Cpath d='M25 31l5 5 10-10' stroke='%231d3a8f' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="./assets/char-base.png">
<style>
  :root{
    --bg:#eef1f7;
    --bg2:#f7f9fd;
    --card:#ffffff;
    --ink:#0f172a;
    --ink2:#46536b;
    --muted:#77839a;
    --line:#e1e6f0;
    --accent:#1d3a8f;
    --accent2:#2f5bd0;
    --tint:#e9eefc;
    --good:#0f7a4e;
    --goodbg:#e6f6ed;
    --bad:#b3261e;
    --badbg:#fdecea;
    --warn:#9a5a06;
    --warnbg:#fff4e1;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 26px -16px rgba(15,23,42,.45);
    --r:18px;
    --tabh:66px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c1017;
      --bg2:#111722;
      --card:#151c27;
      --ink:#e9eef7;
      --ink2:#b8c2d4;
      --muted:#8b97ab;
      --line:#25303f;
      --accent:#9db6ff;
      --accent2:#5f86f7;
      --tint:#1a2440;
      --good:#5fdca2;
      --goodbg:#122a20;
      --bad:#ff948c;
      --badbg:#2c1614;
      --warn:#f0b45f;
      --warnbg:#2a2013;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.9);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
    -webkit-font-smoothing:antialiased;
    overflow-wrap:break-word;
    word-break:keep-all;
  }
  button{font:inherit;color:inherit}
  button:focus-visible,[role="button"]:focus-visible{outline:2.5px solid var(--accent2);outline-offset:2px}
  .app{max-width:620px;margin:0 auto}

  /* ---------- header ---------- */
  .appbar{padding:calc(env(safe-area-inset-top) + 12px) 14px 8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand > div{min-width:0}
  .logo{
    width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(160deg,#2c56c9,#1b3178);color:#fff;font-size:19px;
    box-shadow:0 6px 14px -8px rgba(29,58,143,.9);
  }
  .brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .brand .brand-sub{margin:1px 0 0;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
  .icon-btn{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);display:grid;place-items:center;font-size:16px;color:var(--ink2);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .icon-btn:active{transform:scale(.96)}
  .notice{
    display:flex;align-items:center;gap:6px;margin:9px 0 0;padding:7px 10px;
    background:var(--tint);border-radius:10px;font-size:11.5px;font-weight:600;color:var(--accent);
    line-height:1.35;letter-spacing:-.01em;
  }
  .notice .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);flex:0 0 6px}

  /* ---------- subject chips ---------- */
  .chipbar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:8px 0 8px;
    border-bottom:1px solid transparent;
    transition:border-color .2s;
  }
  .chipbar.stuck{border-bottom-color:var(--line);box-shadow:0 8px 16px -16px rgba(15,23,42,.6)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px;scrollbar-width:none;-ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:baseline;gap:5px;
    min-height:38px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:13.5px;font-weight:700;letter-spacing:-.01em;
    cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .chip .chip-count{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip[aria-selected="true"] .chip-count{color:rgba(255,255,255,.8)}
  html[data-theme="dark"] .chip[aria-selected="true"]{color:#0b1220}
  html[data-theme="dark"] .chip[aria-selected="true"] .chip-count{color:rgba(11,18,32,.62)}

  /* ---------- layout ---------- */
  main{padding:4px 14px 0}
  .view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:15px 15px;
  }
  .card + .card,.card + .row,.row + .card,.sec + .card,.card + .sec,.sec + .sec{margin-top:12px}
  .sec{margin-top:18px}
  h2.sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:0 2px 8px;letter-spacing:-.01em}
  h3{font-size:14px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em}
  p{margin:0}
  .muted{color:var(--ink2);font-size:12.5px;line-height:1.55}
  .tiny{font-size:11.5px;color:var(--muted);line-height:1.5}
  .eyebrow{margin:0 0 3px;font-size:11.5px;font-weight:800;color:var(--accent2);letter-spacing:.02em}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- hero ---------- */
  .hero{padding:16px;background:linear-gradient(155deg,#223f96 0%,#16295f 100%);border:0;color:#fff;box-shadow:0 14px 30px -18px rgba(20,40,100,.95)}
  .hero .eyebrow{color:#b9caff}
  .hero-title{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
  .hero .hero-sub{margin:5px 0 0;font-size:12px;color:rgba(255,255,255,.78);line-height:1.5}
  .hero-stats{display:flex;gap:8px;margin-top:14px}
  .hero-stat{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 9px}
  .hero-stat b{display:block;font-size:17px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
  .hero-stat span{font-size:10.5px;color:rgba(255,255,255,.75);font-weight:600}
  html[data-theme="dark"] .hero{background:linear-gradient(155deg,#1b2e63 0%,#121d3c 100%)}

  /* ---------- progress ---------- */
  .prow + .prow{margin-top:13px}
  .prow-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px}
  .prow-title{font-size:13px;font-weight:800}
  .prow-val{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s ease}
  .bar.good > i{background:linear-gradient(90deg,#19a06a,#0f7a4e)}
  .prow-sub{margin-top:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;min-height:50px;padding:12px 14px;border:0;border-radius:14px;
    font-size:14.5px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:transform .08s,filter .15s;
  }
  .btn:active{transform:scale(.985);filter:brightness(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  html[data-theme="dark"] .btn-primary{background:#2f5bd0;color:#fff}
  .btn-good{background:var(--good);color:#fff}
  html[data-theme="dark"] .btn-good{background:#137a4e;color:#fff}
  .btn-warn{background:var(--warnbg);color:var(--warn);border:1.5px solid var(--warn);box-shadow:inset 0 0 0 1px rgba(154,90,6,.06)}
  .btn-ghost{background:var(--tint);color:var(--accent)}
  .btn-line{background:var(--card);border:1.5px solid var(--line);color:var(--ink2)}
  .btn-sm{min-height:40px;padding:9px 12px;font-size:12.5px;border-radius:11px;width:auto}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .row{display:flex;gap:9px}
  .row > .btn{flex:1}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .quick-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:3px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;
    min-height:74px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;box-shadow:var(--shadow);
  }
  .quick-btn .qi{font-size:16px;line-height:1}
  .quick-btn .qt{font-size:12.5px;font-weight:800;letter-spacing:-.02em}
  .quick-btn .qc{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .quick-btn:active{transform:scale(.98)}

  /* ---------- subject rows ---------- */
  .subj-row{
    display:block;width:100%;text-align:left;background:none;border:0;padding:11px 0;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .subj-row + .subj-row{border-top:1px solid var(--line)}
  .subj-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
  .subj-row-name{font-size:13.5px;font-weight:800}
  .subj-row-val{font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* ---------- flashcard ---------- */
  .deckbar{display:flex;gap:6px;overflow-x:auto;padding:1px 0 2px;scrollbar-width:none}
  .deckbar::-webkit-scrollbar{display:none}
  .fchip{
    flex:0 0 auto;min-height:34px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .fchip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent2);color:var(--accent)}
  .deck-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:11px 1px 7px}
  .deck-meta .dm-l{font-size:12px;font-weight:700;color:var(--ink2)}
  .deck-meta .dm-r{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

  .flash{perspective:1400px;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
  .flash-inner{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.8,.22,1);position:relative}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .face{
    grid-area:1 / 1;
    -webkit-backface-visibility:hidden;backface-visibility:hidden;
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:17px 16px;min-height:246px;
  }
  .face.back{transform:rotateY(180deg)}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .pill{
    display:inline-flex;align-items:center;gap:3px;
    padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:800;letter-spacing:-.01em;
    background:var(--tint);color:var(--accent);line-height:1.4;white-space:nowrap;
  }
  .pill.rev{background:var(--warnbg);color:var(--warn)}
  .pill.known{background:var(--goodbg);color:var(--good)}
  .pill.unsure{background:var(--badbg);color:var(--bad)}
  .pill.diff{background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
  .face .q{
    margin:auto 0;font-size:19px;line-height:1.5;font-weight:800;letter-spacing:-.035em;
    text-align:center;padding:6px 2px;
  }
  .face .hint{margin-top:auto;padding-top:14px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
  .face .face-label{margin:0 0 7px;font-size:10.5px;font-weight:800;color:var(--accent2);letter-spacing:.04em}
  .face .answer{margin:0;font-size:14.5px;line-height:1.72;letter-spacing:-.015em;color:var(--ink)}
  .face .tagbox{display:flex;flex-wrap:wrap;gap:5px;margin:13px 0 0;padding-top:11px;border-top:1px dashed var(--line)}
  .tagbox .tg-label{width:100%;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.03em;margin-bottom:1px}
  .tag{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);padding:2px 7px;border-radius:6px}
  .face .src{margin:11px 0 0;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .face .verify{margin:6px 0 0;font-size:10.5px;color:var(--muted);line-height:1.45}

  .mark-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .nav-row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .nav-row .btn{flex:0 0 auto;width:auto;min-height:44px;padding:8px 15px;font-size:13px}
  .nav-count{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  /* 사지선다 이전·다음 : 스크롤해도 화면 아래에 붙어 자유롭게 이동 */
  .qnav{
    position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 8px);z-index:16;
    display:flex;align-items:center;gap:8px;margin-top:14px;padding:6px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 6px 22px -12px rgba(15,23,42,.55);
  }
  .qnav .btn{flex:0 0 auto;width:auto;min-height:44px;padding:8px 14px;font-size:13.5px;border-radius:11px}
  .qnav .btn-primary{flex:1 1 auto;min-width:0;padding:8px 12px}
  .qnav-count{flex:0 0 auto;min-width:70px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .empty{text-align:center;padding:30px 16px}
  .empty .eico{font-size:30px;margin-bottom:8px}
  .empty h3{font-size:14.5px}
  .empty p{font-size:12.5px;color:var(--ink2);line-height:1.6}
  .empty .btn{margin-top:14px}

  /* ---------- quiz ---------- */
  .quizbar{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    border:0;background:none;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);
    cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:32px;
  }
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.14)}
  .qmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .qmeta .qm-r{font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .qtext{margin:2px 0 13px;font-size:16px;line-height:1.55;font-weight:800;letter-spacing:-.03em}
  .qbox{margin:0 0 13px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-size:13.5px;line-height:1.72;color:var(--ink2);white-space:pre-line}
  .wn-box{margin:0 0 5px;font-size:12px;line-height:1.6;color:var(--ink2);white-space:pre-line}
  .choices{display:flex;flex-direction:column;gap:8px}
  .choice{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
    padding:12px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);
    font-size:13.5px;line-height:1.5;font-weight:600;letter-spacing:-.015em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,opacity .15s;
  }
  .choice .cnum{
    flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
    background:var(--tint);color:var(--accent);font-size:12px;font-weight:800;margin-top:1px;
  }
  .choice:active{background:var(--bg2)}
  .choice.correct{border-color:var(--good);background:var(--goodbg)}
  .choice.correct .cnum{background:var(--good);color:#fff}
  .choice.wrong{border-color:var(--bad);background:var(--badbg)}
  .choice.wrong .cnum{background:var(--bad);color:#fff}
  .choice.dim{opacity:.55}
  .choice[disabled]{cursor:default}

  .explain{margin-top:13px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);scroll-margin-top:74px}
  .verdict{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin-bottom:10px;padding:9px 11px;border-radius:11px}
  .verdict.ok{background:var(--goodbg);color:var(--good)}
  .verdict.no{background:var(--badbg);color:var(--bad)}
  .explain h4{margin:13px 0 6px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em}
  .explain .body{font-size:13.5px;line-height:1.65;color:var(--ink)}
  .notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .notes li{display:flex;gap:7px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .ox{flex:0 0 18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:900;margin-top:1px}
  .ox.o{background:var(--goodbg);color:var(--good)}
  .ox.x{background:var(--badbg);color:var(--bad)}
  .explain .src{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .explain .verify{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.45}
  .after{margin-top:12px}

  .score{text-align:center;padding:8px 4px 4px}
  .score .pct{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
  .score .pct small{font-size:17px;font-weight:800;color:var(--muted)}
  .score .st{margin-top:2px;font-size:12.5px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
  .score .st-sub{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .score .msg{margin-top:9px;font-size:13px;color:var(--ink2);line-height:1.55}

  /* ---------- wrong note ---------- */
  .wn-group + .wn-group{margin-top:14px}
  .wn-group h3{font-size:12px;color:var(--muted);margin:0 0 6px}
  .wn-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .wn-item:first-of-type{border-top:0}
  .wn-main{flex:1;min-width:0}
  .wn-q{font-size:13px;line-height:1.5;font-weight:700;letter-spacing:-.02em}
  .wn-meta{margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .wn-x{
    flex:0 0 32px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);
    color:var(--muted);font-size:13px;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .wn-x:active{background:var(--badbg);color:var(--bad)}
  .wn-card{border:0;background:none;padding:0;text-align:left;width:100%;cursor:pointer;font:inherit}
  .wn-item.wn-stack{display:block;padding:11px 0}
  .wn-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .wn-hint{flex:1;font-size:10px;font-weight:700;color:var(--muted)}
  .wn-acts{display:flex;align-items:center;gap:7px}
  .wn-acts .btn-sm{min-height:36px;padding:7px 13px;font-size:12px}
  .wn-acts .wn-x{width:36px;height:36px;flex:0 0 36px}

  /* ---------- details ---------- */
  details.card{padding:0;overflow:hidden}
  details.card > summary{
    list-style:none;cursor:pointer;padding:14px 15px;font-size:13px;font-weight:800;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  details.card > summary::-webkit-details-marker{display:none}
  details.card > summary::after{content:"+";font-size:17px;color:var(--muted);font-weight:600;line-height:1}
  details.card[open] > summary::after{content:"−"}
  details.card > .dbody{padding:0 15px 15px;font-size:12.5px;line-height:1.65;color:var(--ink2)}
  .kv{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
  .kv:first-child{border-top:0;padding-top:0}
  .kv .k{flex:0 0 74px;font-size:11.5px;font-weight:800;color:var(--muted)}
  .kv .v{flex:1;font-size:12px;line-height:1.55}
  .bullet-list{margin:0;padding-left:17px}
  .bullet-list li{margin:5px 0;font-size:12px;line-height:1.55}
  .lawlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .lawlist li{font-size:11.5px;line-height:1.5;color:var(--ink2);padding-left:15px;position:relative}
  .lawlist li::before{content:"";position:absolute;left:3px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent2);opacity:.6}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -8px 24px -20px rgba(15,23,42,.7);
  }
  .tabbar-inner{max-width:620px;margin:0 auto;display:flex}
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:0;background:none;min-height:var(--tabh);padding:4px 0 2px;
    font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:-.01em;
    cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-selected="true"]{color:var(--accent2)}
  .tab[aria-selected="true"]::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent2)}
  .tab .tbadge{
    position:absolute;top:8px;left:calc(50% + 8px);min-width:15px;height:15px;padding:0 4px;border-radius:99px;
    background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;line-height:1;
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);
    transform:translate(-50%,14px);z-index:80;
    background:rgba(15,23,42,.94);color:#fff;font-size:12.5px;font-weight:700;
    padding:10px 15px;border-radius:99px;max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 10px 24px -12px rgba(0,0,0,.7);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-color-scheme: dark){.toast{background:rgba(235,241,252,.96);color:#0c1017}}

  /* ---------- sheet & modal ---------- */
  .overlay{position:fixed;inset:0;z-index:70;background:rgba(9,14,26,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  @media (min-width:640px){.overlay{align-items:center}}
  .sheet{
    width:100%;max-width:620px;max-height:88vh;background:var(--bg2);
    border-radius:22px 22px 0 0;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);animation:slideup .24s cubic-bezier(.2,.85,.25,1);
  }
  @media (min-width:640px){.sheet{border-radius:22px;max-height:82vh}}
  @keyframes slideup{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
  .sheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}
  .sheet-body{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}
  .sheet-body .card{box-shadow:none;background:var(--card)}
  .sheet-body .sec{margin-top:16px}

  .modal{
    width:calc(100% - 40px);max-width:360px;background:var(--card);border-radius:18px;padding:20px 18px 16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55);animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
  .modal h2{margin:0 0 8px;font-size:16px;font-weight:800;letter-spacing:-.02em}
  .modal p{margin:0;font-size:13px;line-height:1.6;color:var(--ink2)}
  .modal .row{margin-top:16px}
  .btn-danger{background:var(--bad);color:#fff}
  html[data-theme="dark"] .btn-danger{background:#c2382f;color:#fff}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important}
  }

  /* ================= 캐릭터 버디 · 명언 · 포인트/계급 ================= */
  /* 명언 롤링 */
  .quote{margin-top:2px;margin-bottom:12px}
  .quote-btn{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:10px 12px;border-radius:15px;border:1px dashed #c8d6fb;
    background:linear-gradient(135deg,#f1f5ff 0%,#fdf6fb 100%);
    color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;
    box-shadow:0 8px 20px -18px rgba(29,58,143,.8);
  }
  .quote-btn:active{filter:brightness(.985)}
  .quote-ic{flex:0 0 auto;font-size:12px;color:#8fa6e0;line-height:1}
  .quote-text{
    flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.45;letter-spacing:-.02em;
    min-height:2.9em;display:flex;align-items:center;
    transition:opacity .22s ease,transform .22s ease;
  }
  .quote-text.out{opacity:0;transform:translateY(-3px)}
  .quote-hint{
    flex:0 0 auto;font-size:10px;font-weight:800;color:#9aa8c7;background:#fff;
    border:1px solid #e2e9fa;padding:2px 6px;border-radius:99px;line-height:1.5;
  }
  html[data-theme="dark"] .quote-btn{background:linear-gradient(135deg,#18223c 0%,#221a30 100%);border-color:#33415f}
  html[data-theme="dark"] .quote-hint{background:#0f1522;border-color:#2b3550;color:#7f8ba6}

  /* 히어로 · 계급 */
  .hero{position:relative;overflow:hidden;padding:14px 15px 15px}
  .hero::after{
    content:"";position:absolute;right:-46px;top:-58px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 66%);pointer-events:none;
  }
  .hero::before{
    content:"";position:absolute;left:-34px;bottom:-64px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(164,196,255,.3),rgba(164,196,255,0) 70%);pointer-events:none;
  }
  .hero-top{position:relative;display:flex;align-items:flex-start;gap:8px}
  .hero-copy{flex:1 1 auto;min-width:0}
  .hero-fig{flex:0 0 74px;width:74px;position:relative;align-self:flex-end}
  .hero-fig img{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 11px rgba(4,10,30,.45))}
  .rank-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:1px 0 0}
  .rank-name{font-size:23px;font-weight:900;letter-spacing:-.045em;line-height:1.15}
  .insignia{display:inline-flex;align-items:center;gap:2px}
  .insignia svg{width:13px;height:13px;display:block;flex:0 0 auto}
  .hero-greet{margin:6px 0 0;font-size:12px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.45}
  .pscore{display:flex;align-items:baseline;gap:3px;margin-top:9px;flex-wrap:wrap}
  .pscore b{font-size:20px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pscore span{font-size:11px;font-weight:800;color:rgba(255,255,255,.72)}
  .pscore .earn{
    margin-left:4px;align-self:center;font-size:10.5px;font-weight:800;color:#ffe1ab;
    background:rgba(255,255,255,.15);padding:2px 7px;border-radius:99px;
  }
  .rank-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:10px}
  .rank-bar > i{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#ffd98a,#f7b733);
    transition:width .55s cubic-bezier(.2,.8,.2,1);
  }
  .rank-next{margin-top:6px;font-size:11px;font-weight:700;color:rgba(255,255,255,.82);line-height:1.45}

  /* 하루 할당량 */
  .mission .mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .mission .bonus{
    flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warnbg);
    padding:3px 8px;border-radius:99px;line-height:1.5;
  }
  .mission.done{border-color:#bfe8d3}
  .mission.done .bonus{color:var(--good);background:var(--goodbg)}
  .mission-foot{margin-top:12px;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.5}
  .mission.done .mission-foot{color:var(--good)}
  html[data-theme="dark"] .mission.done{border-color:#1f4635}

  /* 캐릭터 버디 바 */
  .buddy{
    display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:15px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    margin-bottom:10px;position:relative;
  }
  .buddy-av{
    position:relative;flex:0 0 44px;width:44px;height:44px;border-radius:50%;overflow:hidden;
    background:linear-gradient(150deg,#e9f0ff,#f7ecff);
  }
  .buddy-av img{display:block;width:100%;height:100%;object-fit:cover}
  .buddy.good .buddy-av{box-shadow:0 0 0 2px rgba(25,160,106,.5)}
  .buddy.cheer .buddy-av{box-shadow:0 0 0 2px rgba(255,138,128,.5)}
  .buddy.pop .buddy-av{animation:buddyPop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes buddyPop{0%{transform:scale(.82) rotate(-7deg)}55%{transform:scale(1.12) rotate(4deg)}100%{transform:none}}
  .buddy-text{flex:1;min-width:0}
  .buddy-line{font-size:12.5px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
  .buddy-sub{margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}
  .float-pt{
    position:absolute;left:22px;top:0;font-size:11px;font-weight:900;color:var(--good);
    white-space:nowrap;pointer-events:none;z-index:3;
    animation:floatUp 1.35s ease-out forwards;
  }
  .float-pt.minus{color:var(--bad)}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,6px) scale(.9)}
    22%{opacity:1;transform:translate(-50%,-8px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-30px) scale(1)}
  }
  html[data-theme="dark"] .buddy-av{background:linear-gradient(150deg,#212c47,#2a2138)}

  /* 응답 영역 리액션 */
  .reaction{
    position:relative;display:flex;align-items:center;gap:9px;margin:0 0 11px;padding:8px 10px;
    border-radius:12px;background:var(--bg2);border:1px solid var(--line);
  }
  .reaction.good{background:var(--goodbg);border-color:rgba(15,122,78,.22)}
  .reaction.cheer{background:var(--warnbg);border-color:rgba(154,90,6,.22)}
  .rx-av{flex:0 0 32px;width:32px;height:32px;border-radius:50%;overflow:hidden;background:#eef3ff}
  .rx-av img{display:block;width:100%;height:100%;object-fit:cover}
  .rx-line{font-size:12px;font-weight:800;line-height:1.4}
  .rx-sub{margin-top:1px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.4}

  /* 결과 화면 캐릭터 */
  .score-fig{display:block;width:76px;height:auto;margin:2px auto 0}

  /* 승진 축하 */
  .overlay.center{align-items:center;padding:20px}
  .modal.promo{text-align:center;padding:18px 18px 15px;border-radius:20px;position:relative;overflow:hidden}
  .promo-fig{display:block;width:92px;height:auto;margin:0 auto 2px;filter:drop-shadow(0 8px 12px rgba(15,23,42,.22))}
  .modal.promo .eyebrow{color:#d99b00}
  .promo-insignia{display:flex;justify-content:center;gap:3px;margin:7px 0 3px}
  .promo-insignia svg{width:14px;height:14px}
  .modal.promo h2{font-size:18px}
  .modal.promo .promo-note{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.6}
  .promo-spark{position:absolute;font-size:15px;opacity:.85;animation:sparkle 1.9s ease-in-out infinite alternate}
  .promo-spark.s1{left:16px;top:22px}
  .promo-spark.s2{right:16px;top:52px;animation-delay:.5s}
  @keyframes sparkle{from{transform:scale(.8);opacity:.35}to{transform:scale(1.15);opacity:.95}}

  @media (max-width:360px){
    .rank-name{font-size:20px}
    .pscore b{font-size:18px}
    .hero-fig{flex-basis:64px;width:64px}
    .hero-greet{font-size:11.5px}
    .quote-text{font-size:12px}
    .quote-hint{display:none}
    .buddy{gap:8px;padding:7px 9px}
    .buddy-av{flex-basis:40px;width:40px;height:40px}
    .buddy-line{font-size:12px}
  }
  /* ================= 실전 기출 모드 ================= */
  .gswitch{margin-bottom:10px}
  .gswitch .seg{width:100%}
  .gswitch .seg button{flex:1}
  .gchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gchips::-webkit-scrollbar{display:none}
  .gchip{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);background:var(--bg2);border-radius:11px;font:inherit;font-size:12px;font-weight:800;color:var(--ink2)}
  .gchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .gchip-c{font-size:10.5px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
  .gsubj{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0 10px}
  .gbtn{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;padding:11px 6px;border:1px solid var(--line);background:var(--card);border-radius:13px;color:var(--ink);font:inherit}
  .gbtn-t{font-size:13px;font-weight:800}
  .gbtn-s{font-size:10.5px;color:var(--muted);font-weight:700}
  .gactive{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
  .gactive-t{font-size:12.5px;font-weight:800;color:var(--ink2)}
  .gnote{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--muted)}
  .pill.law{background:var(--warnbg);color:var(--warn)}
  .pill.law.out{background:var(--badbg);color:var(--bad)}
  .lawbox{margin:0 0 10px;padding:10px 11px;border-radius:11px;background:var(--warnbg)}
  .lawbox.out{background:var(--badbg)}
  .lawbox strong{display:block;font-size:11.5px;font-weight:800;color:var(--warn);margin-bottom:4px}
  .lawbox.out strong{color:var(--bad)}
  .lawbox p{margin:0;font-size:12px;line-height:1.55;color:var(--ink2)}
  .verdict.skip{background:var(--warnbg);color:var(--warn)}
/* ===== 추가 스타일: OX 검문 · 오늘의 순찰 임무 · 보기 박스 ===== */
.qbox{margin:0 0 13px;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg2);font-size:13.5px;line-height:1.72;color:var(--ink2)}
.qbox-t{display:block;margin:0 0 7px;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--accent);background:var(--tint);border-radius:7px;padding:2px 8px;width:fit-content}
.qbox-i{display:block;margin:0 0 6px;padding-left:1.5em;text-indent:-1.5em}
.qbox-i:last-child{margin-bottom:0}
.qbox-i b{font-weight:800;color:var(--ink)}
.qbox .qbox-pre{margin:0 0 7px;color:var(--muted);font-size:12.5px}

.oxcard{padding:16px 15px}
.oxbadges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.oxstmt{margin:0;font-size:16px;line-height:1.78;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.oxbtns{display:flex;gap:11px;margin-top:18px}
.oxbtn{
  flex:1 1 0;min-height:104px;border-radius:20px;border:2px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .12s ease, box-shadow .12s ease;
}
.oxbtn .mark{font-size:42px;font-weight:900;line-height:1;letter-spacing:-.04em}
.oxbtn .lab{font-size:11.5px;font-weight:800;color:var(--muted)}
.oxbtn.o{border-color:#bfe8d3;background:linear-gradient(170deg,#f1fbf6,#fff)}
.oxbtn.o .mark{color:var(--good)}
.oxbtn.x{border-color:#f6cfd0;background:linear-gradient(170deg,#fdf2f2,#fff)}
.oxbtn.x .mark{color:var(--bad)}
.oxbtn:active{transform:scale(.98)}
.oxbtn[disabled]{opacity:.5}
.oxbtn.picked.o{border-color:var(--good);box-shadow:0 0 0 3px rgba(15,122,78,.12)}
.oxbtn.picked.x{border-color:var(--bad);box-shadow:0 0 0 3px rgba(179,38,30,.12)}
.oxbtn.dimmed{opacity:.4}

.oxfb{margin-top:16px;border-radius:16px;padding:0}
.oxverdict{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;letter-spacing:-.02em;padding:12px 14px;border-radius:14px}
.oxverdict.ok{background:var(--goodbg);color:var(--good)}
.oxverdict.no{background:var(--badbg);color:var(--bad)}
.oxverdict .pts{margin-left:auto;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.7);border-radius:99px;padding:2px 9px}
.oxpraise{margin:10px 2px 0;font-size:13.5px;line-height:1.62;font-weight:700;color:var(--ink2);word-break:keep-all}
.oxexplain{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.oxexplain h4{margin:0 0 6px;font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.oxexplain p{margin:0;font-size:13px;line-height:1.66;color:var(--ink2);word-break:keep-all}
.oxexplain .src{margin-top:8px;font-size:11px;color:var(--muted)}
.oxnext{margin-top:14px}
.combobar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.combochip{font-size:11px;font-weight:900;color:#8a4b00;background:#fff4e1;border-radius:99px;padding:3px 9px}
.combochip.fire{color:#b3261e;background:#fdecea}

.mission .mrow + .mrow{margin-top:12px}
.mission .mtask{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.mission .mtask .ic{flex:0 0 26px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--tint);font-size:14px}
.mission .mtask .tx{flex:1;min-width:0}
.mission .mtask .nm{font-size:13px;font-weight:800;letter-spacing:-.02em}
.mission .mtask .sb{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}
.mission .mtask .ok{flex:0 0 auto;font-size:11px;font-weight:900;color:var(--good)}
.mission-hero{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.mission-hero .flag{font-size:18px}
.mission-hero h3{margin:0;font-size:15px;font-weight:900;letter-spacing:-.03em}
.mission-hero .badge{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warnbg);padding:3px 9px;border-radius:99px}

찰행정법 35%, 기초이론 30%, 경찰행정학 15%, 분야별 경찰활동 15%, 역사·비교경찰 5%. 경찰관 직무집행법·경찰법·경찰공무원법·도로교통법·스토킹처벌법의 숫자를 중심으로 정리한다."}],"ox":[{"id":"H-OX-039","subject":"헌법","unit":"헌법총론","stmt":"｢산업재해보상보험법｣ 개정을 통하여 최고보상제도를 신설하고, 개정법 시행 전에 장해사유가 발생하여 이미 장해보상연금을 수령하고 있던 수급권자에게도 감액된 보상연금을 지급하도록 하더라도, 2년 6개월의 경과기간 동안 구법을 적용한 후 일률적이고 전면적으로 최고보상제도를 적용하도록 하였다면 신뢰보호원칙에 위배되지 않는다. (24.1차)","answer":false,"quote":"이미 장해보상연금을 받던 사람에게 2년 6개월 뒤 일률적으로 최고보상제도를 적용해 연금을 깎은 것은 신뢰보호원칙에 위배된다.","cite":"헌재 2005헌바20","badge":"","topic":"","from":"GY-2024-1-H-03","seq":null},{"id":"H-OX-001","subject":"헌법","unit":"헌법총론","stmt":"공소시효제도가 헌법 제12조 제1항 및 제13조 제1항에 정한 죄형법정주의의 보호범위에 바로 속하지 않는다면, 소급입법의 헌법적 한계는 법적 안정성과 신뢰보호원칙을 포함하는 법치 주의의 원칙에 따른 기준으로 판단하여야 한다. (22.1차)","answer":true,"quote":"공소시효는 죄형법정주의의 보호범위에 바로 들지 않으므로, 시효를 소급해 바꾸는 입법은 법적 안정성·신뢰보호 등 법치주의 기준으로 심사한다.","cite":"헌재 96헌가2","badge":"","topic":"","from":"GY-2022-1-H-03","seq":null},{"id":"H-OX-006","subject":"헌법","unit":"헌법총론","stmt":"구 매장 및 묘지 등에 관한 법률 이 장사 등에 관한 법률 로 전부개정되면서 그 부칙에서 종전의 법령에 따라 설치된 봉안 시설을 신법에 의하여 설치된 봉안시설로 보도록 함으로써 구법에 따라 설치허가를 받은 봉안시설 설치 관리인의 기존의 법상태에 대한 신뢰는 이미 보호되었다고 할 것이므로, 더 나아가 신법 시행 후 추가로 설치되는 부분에 대해서까지 기존의 법상태에 대한 보호가치 있는 신뢰가 있다고 보기 어렵다. (22.2차)","answer":true,"quote":"부칙으로 옛 봉안시설을 신법상 시설로 인정해 주었다면 신뢰는 이미 보호된 것이고, 신법 시행 뒤 늘리는 부분까지 보호할 신뢰는 없다.","cite":"헌재 2019헌바453","badge":"","topic":"","from":"GY-2022-2-H-01","seq":null},{"id":"H-OX-022","subject":"헌법","unit":"헌법총론","stmt":"개인정보자기결정권의 보호대상이 되는 개인정보는 개인의 신체, 신념, 사회적 지위, 신분 등과 같이 개인의 인격주체성을 특징짓는 사항으로서 그 개인의 동일성을 식별할 수 있게 하는 일체의 정보이고, 반드시 개인의 내밀한 영역이나 사사(私事)의 영역에 속하는 정보에 국한되지 않고 공적 생활에서 형성되었거나 이미 공개된 개인정보까지 포함한다. (24.1차)","answer":true,"quote":"개인정보는 개인을 식별할 수 있게 하는 일체의 정보로, 내밀한 영역에 한정되지 않고 공적 생활에서 생겼거나 이미 공개된 정보도 포함한다.","cite":"헌재 99헌마513","badge":"","topic":"","from":"GY-2024-1-H-16","seq":null},{"id":"H-OX-014","subject":"헌법","unit":"헌법총론","stmt":"‘여러 사람의 눈에 뜨이는 곳에서 공공연하게 알몸을 지나치게 내놓거나 가려야 할 곳을 내놓아 다른 사람에게 부끄러운 느낌이나 불쾌감을 준 사람’을 처벌하는 구 ｢경범죄 처벌법｣ 조항은 무엇이 지나친 알몸노출행위인지 판단하기 쉽지 않고, ‘가려야 할 곳’의 의미도 알기 어려우며, ‘부끄러운 느낌이나 불쾌감’을 통하여 ‘지나치게’와 ‘가려야 할 곳’ 의미를 확정하기도 곤란하여 죄형법정주의의 명확성원칙에 위배된다. (23.1차)","answer":true,"quote":"「지나치게」와 「가려야 할 곳」은 뜻을 정할 수 없어 알몸 노출 처벌 조항은 죄형법정주의의 명확성원칙에 위배된다.","cite":"헌재 2016헌가3","badge":"","topic":"","from":"GY-2023-1-H-09","seq":null},{"id":"H-OX-036","subject":"헌법","unit":"헌법총론","stmt":"병(兵)에 대한 징계처분으로 일정기간 부대나 함정(艦艇) 내의 영창에 감금하는 처분이 가능하도록 규정한 구 군인사법 조항은 군(軍)이라는 특수한 신분관계에서 오는 불가피성 및 그 내용과 집행의 실질, 효과 등에 비추어 볼 때, 그 본질이 일반 형사 절차에서 이루어지는 인신구금과 동일하게 취급하기 어렵다는 측면에서 영장주의 원칙이 적용되지 않는다. (22.2차)","answer":false,"quote":"영창에 영장주의가 적용되지 않는다는 것은 2인 반대의견이다 — 법정의견은 과잉금지원칙 위반으로 위헌이라 했고, 4인은 영장주의 위반도 보탰다.","cite":"헌재 2017헌바157","badge":"","topic":"","from":"GY-2022-2-H-10","seq":null},{"id":"H-OX-031","subject":"헌법","unit":"헌법총론","stmt":"｢한강수계 상수원수질개선 및 주민지원 등에 관한 법률｣이 규정한 ‘물사용량에 비례한 부담금’은 한강수계관리기금을 조성하는 재원으로서 재정조달목적 부담금에 해당하고, 물사용량에 비례한 부담금의 부과는 공적과제 달성을 위한 적합한 수단에 해당한다. (26.1차)","answer":true,"quote":"한강수계 물이용부담금은 한강수계관리기금 재원을 모으는 재정조달목적 부담금이고, 물사용량에 비례한 부과는 목적 달성에 적합한 수단이다.","cite":"헌재 2018헌바425","badge":"","topic":"","from":"GY-2026-1-H-13","seq":null},{"id":"H-OX-019","subject":"헌법","unit":"헌법총론","stmt":"사회복무요원에게 현역병의 봉급에 해당하는 보수를 지급하도록 정한 구 ｢병역법 시행령｣ 제62조 제1항 본문, 사회복무요원에게 교통비, 중식비의 실비를 지급하도록 정한 구 ｢병역법 시행령｣ 제62조 제2항 전단, 구 ｢사회복무요원 복무관리 규정｣ 제41조 제3항 본문 전단은 사회복무요원을 현역병에 비하여 합리적 이유없이 자의적으로 차별한 것이라 볼 수 없어 사회복무요원인 청구인의 평등권을 침해하지 않는다. (23.2차)","answer":true,"quote":"사회복무요원 보수를 현역병 봉급 기준으로 하고 교통비·중식비만 실비로 주게 한 것은 복무 형태 차이를 반영해 평등권 침해가 아니다.","cite":"헌재 2019헌마535","badge":"","topic":"","from":"GY-2023-2-H-09","seq":null},{"id":"H-OX-018","subject":"헌법","unit":"헌법총론","stmt":"대한민국의 국민이 아닌 자로서 대한민국의 국민인 부 또는 모에 의하여 인지된 자가 대한민국의 ｢민법｣상 미성년자이면서 출생 당시에 부 또는 모가 대한민국의 국민이었을 경우에는 법무부장관에게 신고함으로써 대한민국 국적을 취득할 수 있다. (23.2차)","answer":true,"quote":"① 대한민국의 국민이 아닌 자(이하 \"외국인\"이라 한다)로서 대한민국의 국민인 부 또는 모에 의하여 인지(認知)된 자가 다음 각 호의 요건을 모두 갖추면 법무부장관에게 신고함으로써 대한민국 국적을 취득할 수 있다. 1. 대한민국의 「민법」상 미성년일 것 2. 출생 당시에 부 또는 모가 대한민국의 국민이었을 것","cite":"국적법 제3조 제1항","badge":"","topic":"","from":"GY-2023-2-H-02","seq":null},{"id":"H-OX-045","subject":"헌법","unit":"헌법총론","stmt":"“세계인권선언”은 인권 및 기본적 자유의 보편적인 존중과 준수의 촉진을 위하여 모든 국민과 모든 나라가 달성하여야할 공통의 기준으로 선언하는 의미가 있으므로, 그 선언내용인 각 조항은 바로 보편적인 법적 구속력을 가지거나 국제법적 효력을 갖는다. (25.1차)","answer":false,"quote":"세계인권선언은 각국이 이룰 공통 기준을 밝힌 선언일 뿐, 그 조항이 곧바로 법적 구속력이나 국제법적 효력을 갖지는 않는다.","cite":"헌재 2003헌바51","badge":"","topic":"","from":"GY-2025-1-H-04","seq":null},{"id":"H-OX-038","subject":"헌법","unit":"헌법총론","stmt":"국가보안법위반죄 등 일부 범죄혐의자를 법관의 영장없이 구속, 압수, 수색할 수 있도록 규정하고, 법관에 의한 사후영장제도도 마련하지 않은 구 ｢인신구속 등에 관한 임시 특례법｣ 조항은 국가비상사태에 준하는 상황에서 내려진 특별한 조치임을 감안하면 영장주의의 본질을 침해한다고 볼 수 없다. (23.1차)","answer":false,"quote":"사전영장은 물론 사후영장조차 없이 구속·압수·수색을 허용한 조항은 비상 상황을 고려해도 영장주의의 본질을 침해한다.","cite":"헌재 2011헌가5","badge":"","topic":"","from":"GY-2023-1-H-11","seq":null},{"id":"H-OX-015","subject":"헌법","unit":"헌법총론","stmt":"범칙금 통고처분을 받고도 납부기간 이내에 범칙금을 납부하지 아니한 사람에 대하여 행정청에 대한 이의제기나 의견진술 등의 기회를 주지 않고 경찰서장이 곧바로 즉결심판을 청구하도록 한 구 ｢도로교통법｣ 조항은, 이에 불복하여 범칙금을 납부하지 아니한 자에게는 재판절차라는 완비된 절차적 보장이 주어지므로 적법절차원칙에 위배되지 않는다. (23.1차)","answer":true,"quote":"범칙금 미납자를 의견진술 없이 즉결심판에 넘겨도 그 뒤 재판절차라는 완비된 절차적 보장이 있어 적법절차원칙 위반이 아니다.","cite":"헌재 2012헌바433","badge":"","topic":"","from":"GY-2023-1-H-10","seq":null},{"id":"H-OX-007","subject":"헌법","unit":"헌법총론","stmt":"우리 헌법상 문화국가원리는 견해와 사상의 다양성을 그 본질로 하며, 이를 실현하는 국가의 문화정책은 불편부당의 원칙에 따라야 한다. (22.2차)","answer":true,"quote":"문화국가원리의 본질은 견해와 사상의 다양성이라, 국가는 특정 문화를 우대하지 않는 불편부당의 원칙에 따라 문화풍토를 조성해야 한다.","cite":"헌재 2003헌가1","badge":"","topic":"","from":"GY-2022-2-H-03","seq":null},{"id":"H-OX-030","subject":"헌법","unit":"헌법총론","stmt":"｢기후위기 대응을 위한 탄소중립 녹색성장 기본법｣ 조항에서 2031년부터 2049년까지의 감축목표에 관하여 대강의 정량적 수준도 규정하지 않고 이에 관해 정부가 5년마다 정하도록 한 것은 의회유보원칙을 포함하는 법률유보원칙을 위반한 것이다. (26.1차)","answer":true,"quote":"그러나 중장기적인 온실가스 감축목표와 감축경로를 계획할 때에는 매우 높은 수준의 사회적 합의가 필요하다는 점, 미래세대는 민주적 정치과정에 참여하는 것이 제약되어 있다는 점과 관련하여 입법자에게 더욱 구체적인 입법의무와 책임이 있음을 고려할 때, 2031년부터 2049년까지의 감축목표에 관하여 대강의 정량적 수준도 규정하지 않고 이에 관해 정부가 5년마다 정하도록 한 것은 의회유보원칙을 포함하는 법률유보원칙을 위반한 것이다.","cite":"헌재 2020헌마389","badge":"","topic":"","from":"GY-2026-1-H-09","seq":null},{"id":"H-OX-020","subject":"헌법","unit":"헌법총론","stmt":"정부는 문화국가실현에 관한 과제를 수행함에 있어 문화의 다양성, 자율성, 창조성이 조화롭게 실현될 수 있도록 중립성을 지키면서 문화에 대한 지원 및 육성을 하도록 유의하여야 한다. (24.1차)","answer":true,"quote":"이 사건 지원배제 지시는 특정한 정치적 견해를 표현한 청구인들을, 그러한 정치적 견해를 표현하지 않은 다른 신청자들과 구분하여 정부 지원사업에서 배제하여 차별적으로 취급한 것인데, 헌법상 문화국가원리에 따라 정부는 문화의 다양성ㆍ자율성ㆍ창조성이 조화롭게 실현될 수 있도록 중립성을 지키면서 문화를 육성하여야 함에도, 청구인들의 정치적 견해를 기준으로 이들을 문화예술계 지원사업에서 배제되도록 한 것은 자의적인 차별행위로서 청구인들의 평등권을 침해한다.","cite":"헌재 2017헌마416","badge":"","topic":"","from":"GY-2024-1-H-02","seq":null},{"id":"H-OX-029","subject":"헌법","unit":"헌법총론","stmt":"대법원은 헌법 제3조 영토조항을 근거로 하여 북한지역도 대한민국의 영토에 속하는 한반도의 일부를 이루는 것이어서 대한민국의 주권이 미치고 북한 주민도 대한민국 국적을 취득‧ 유지하는 데 아무런 영향이 없는 것으로 해석하고 있다. (26.1차)","answer":true,"quote":"영토조항상 북한지역도 대한민국 영토라 주권이 미치므로, 북한 국적을 얻은 사람도 대한민국 국민으로 본다.","cite":"대법원 96누1221 · 헌법 제3조","badge":"","topic":"","from":"GY-2026-1-H-05","seq":null},{"id":"H-OX-027","subject":"헌법","unit":"헌법총론","stmt":"‘민주적 기본질서’는, 오늘날의 입헌적 민주주의 체제의 구성 및 운영에 필요한 가장 핵심적인 내용이나 요소를 의미하는 것으로서 민주주의 원리에 입각한 요소들과 법치주의 원리에 입각한 요소들 중에서 필요불가결한 부분을 의미한다. (26.1차)","answer":true,"quote":"정당해산 사유인 민주적 기본질서는 헌법 전체가 아니라, 민주주의·법치주의 요소 가운데 입헌민주체제 유지에 필요불가결한 부분만 가리킨다.","cite":"헌법 제8조","badge":"","topic":"","from":"GY-2026-1-H-01","seq":null},{"id":"H-OX-005","subject":"헌법","unit":"헌법총론","stmt":"서울교통공사는 공익적인 업무를 수행하기 위한 지방공사이나 서울특별시와 독립적인 공법인으로서 경영의 자율성이 보장되고, 서울교통공사의 직원의 신분도 지방공무원법 이 아닌 지방 공기업법 과 정관에서 정한 바에 따르는 등, 서울교통공사의 직원이라는 직위가 헌법 제25조가 보장하는 공무담임권의 보호 영역인 ‘공무’의 범위에는 해당하지 않는다. (22.1차)","answer":true,"quote":"서울교통공사는 공익적인 업무를 수행하기 위한 지방공사이나, 서울특별시와 독립적인 공법인으로서 경영의 자율성이 보장되고, 수행 사업도 국가나 지방자치단체의 독점적 성격을 갖는다고 보기 어려우며, 서울교통공사의 직원의 신분도 지방공무원법 이 아닌 지방공기업법 과 정관에서 정한 바에 따르는 등, 서울교통공사의 직원이라는 직위가 헌법 제25조 가 보장하는 공무담임권의 보호영역인 ‘공무’의 범위에는 해당하지 않는다.","cite":"헌재 2018헌마174","badge":"","topic":"","from":"GY-2022-1-H-20","seq":null},{"id":"H-OX-035","subject":"헌법","unit":"헌법총론","stmt":"지역 주민의 의사가 반영되지 않은 채 이루어진 미군기지의 이전은 인근 지역에 거주하는 주민들의 삶을 결정함에 있어서 사회적으로 영향을 미치므로 헌법상 보장된 개인의 자기결정권을 제한하는 것이다. (22.2차)","answer":false,"quote":"미군기지 이전은 인근 주민의 삶에 사회적 영향을 주더라도 개인의 인격·운명에 관한 결정이 아니어서 자기결정권의 보호범위에 들지 않는다.","cite":"헌재 2005헌마268","badge":"","topic":"","from":"GY-2022-2-H-07","seq":null},{"id":"H-OX-034","subject":"헌법","unit":"헌법총론","stmt":"대학 본연의 기능인 학술의 연구나 교수, 학생선발 지도 등과 관련된 교무 학사행정의 영역에서는 대학구성원의 결정이 우선 한다고 볼 수 있으나, 대학의 재정, 시설 및 인사 등의 영역에서는 학교법인이 기본적인 윤곽을 결정하게 되므로, 대학구성원에게는 이러한 영역에 대한 참여권이 인정될 여지가 없다. (22.1차)","answer":false,"quote":"재정·시설·인사 영역은 학교법인이 기본 윤곽을 정하되, 대학구성원에게도 일정한 참여권을 인정해야 한다.","cite":"헌재 2007헌마1189","badge":"","topic":"","from":"GY-2022-1-H-12","seq":null},{"id":"H-OX-043","subject":"헌법","unit":"헌법총론","stmt":"헌법은 국방의 의무를 국민에게 부과하면서 병역의무의 이행을 이유로 불이익한 처우를 하는 것을 금지하고 있는데, 여기서 ‘불이익한 처우’라 함은 법적인 불이익뿐만이 아니라 사실상, 경제상의 불이익을 모두 포함하는 것으로 이해해야 한다. (24.1차)","answer":false,"quote":"병역의무 이행을 이유로 한 「불이익한 처우」 금지는 법적인 불이익을 막는 것이지 사실상·경제상 불이익까지 포함하지 않는다.","cite":"헌재 98헌마363 · 헌법 제39조","badge":"","topic":"","from":"GY-2024-1-H-20","seq":null},{"id":"H-OX-026","subject":"헌법","unit":"헌법총론","stmt":"헌법전문은 “3‧1운동으로 건립된 대한민국임시정부의 법통을 계승”한다고 선언하고 있다. 이는 대한민국이 일제에 항거한 독립운동가의 공헌과 희생을 바탕으로 이룩된 것임을 선언한 것이고, 그렇다면 국가는 일제로부터 조국의 자주독립을 위하여 공헌한 독립유공자와 그 유족에 대하여는 응분의 예우를 하여야 할 헌법적 의무를 지닌다. (25.2차)","answer":true,"quote":"헌법전문의 임시정부 법통 계승 선언에서 독립유공자와 그 유족을 예우할 국가의 헌법적 의무가 나온다.","cite":"헌재 2004헌마859","badge":"","topic":"","from":"GY-2025-2-H-02","seq":null},{"id":"H-OX-024","subject":"헌법","unit":"헌법총론","stmt":"현행 헌법은 국가가 국민 모두의 생산 및 생활의 기반이 되는 국토의 효율적이고 균형 있는 이용･개발과 보전을 위하여 법률이 정하는 바에 의하여 그에 관한 필요한 제한과 의무를 과할 수 있게 하고 있다. (25.2차)","answer":true,"quote":"국가는 국민 모두의 생산 및 생활의 기반이 되는 국토의 효율적이고 균형있는 이용·개발과 보전을 위하여 법률이 정하는 바에 의하여 그에 관한 필요한 제한과 의무를 과할 수 있다.","cite":"헌법 제122조","badge":"","topic":"","from":"GY-2025-2-H-01","seq":null},{"id":"H-OX-023","subject":"헌법","unit":"헌법총론","stmt":"디엔에이신원확인정보는 개인 식별을 목적으로 디엔에이감식을 통하여 취득한 정보로서 당해 정보만으로는 특정개인을 식별할 수 없더라도 다른 정보와 쉽게 결합하여 당해 개인을 식별할 수 있는 정보에 해당하는 개인정보이다. (24.1차)","answer":true,"quote":"디엔에이신원확인정보는 그것만으로는 누구인지 알 수 없어도 다른 정보와 쉽게 결합해 개인을 식별할 수 있으므로 개인정보다.","cite":"헌재 2011헌마28","badge":"","topic":"","from":"GY-2024-1-H-16","seq":null},{"id":"H-OX-009","subject":"헌법","unit":"헌법총론","stmt":"형법 상 자기낙태죄 조항은 모자보건법 이 정한 예외를 제외 하고는 임신기간 전체를 통틀어 모든 낙태를 전면적 일률적으로 금지하고, 이를 위반할 경우 형벌을 부과함으로써 임신의 유지 출산을 강제하고 있으므로, 임신한 여성의 자기결정권을 제한한다. (22.2차)","answer":true,"quote":"임신기간 전체에 걸쳐 낙태를 일률적으로 금지하고 처벌하면 임신 유지·출산을 강제하게 되어 임신한 여성의 자기결정권을 제한한다.","cite":"헌재 2017헌바127","badge":"","topic":"","from":"GY-2022-2-H-07","seq":null},{"id":"H-OX-017","subject":"헌법","unit":"헌법총론","stmt":"｢형의 집행 및 수용자의 처우에 관한 법률｣에 따라 미결수용자의 접견 내용을 녹음･녹화하는 것은 직접적으로 물리적 강제력을 수반하는 강제처분이 아니므로 영장주의가 적용되지 않는다. (23.1차)","answer":true,"quote":"미결수용자 접견 내용의 녹음·녹화는 물리적 강제력을 쓰는 강제처분이 아니어서 영장주의가 적용되지 않는다.","cite":"헌재 2014헌바401","badge":"","topic":"","from":"GY-2023-1-H-11","seq":null},{"id":"H-OX-013","subject":"헌법","unit":"헌법총론","stmt":"애국지사 본인과 순국선열의 유족은 본질적으로 다른 집단이므로 구 ｢독립유공자예우에 관한 법률 시행령｣ 조항이 순국선열의 유족보다 애국지사 본인에게 높은 보상금 지급액 기준을 두고 있다고 하여 순국선열의 유족의 평등권이 침해되었다고 볼 수 없다. (23.1차)","answer":true,"quote":"직접 공헌한 애국지사 본인과 순국선열의 유족은 본질적으로 다른 집단이라, 보상금 기준에 차이를 두어도 평등권 침해가 아니다.","cite":"헌재 2016헌마319","badge":"","topic":"","from":"GY-2023-1-H-08","seq":null},{"id":"H-OX-010","subject":"헌법","unit":"헌법총론","stmt":"형법 이 누범을 가중처벌하는 것은 전범에 대하여 형벌을 받았음에도 다시 범행을 하였다는 데 있는 것이지, 전범에 대하여 처벌을 받았음에도 다시 범행을 하는 경우 전범도 후범과 일괄 하여 다시 처벌한다는 것은 아님이 명백하므로, 누범에 대하여 형을 가중하는 것이 일사부재리원칙에 위배하는 것은 아니다. (22.2차)","answer":true,"quote":"누범 가중은 앞의 죄를 다시 처벌하는 것이 아니라 형벌을 받고도 또 범행한 점을 뒤의 죄에 반영하는 것이라 일사부재리에 어긋나지 않는다.","cite":"헌재 93헌바43","badge":"","topic":"","from":"GY-2022-2-H-09","seq":null},{"id":"H-OX-012","subject":"헌법","unit":"헌법총론","stmt":"우리 헌법의 전문과 본문의 전체에 담겨있는 최고 이념은 국민주권주의와 자유민주주의에 입각한 입헌민주헌법의 본질적 기본원리에 기초하고 있다. (23.1차)","answer":true,"quote":"헌법 전문과 본문 전체를 관통하는 최고 이념은 국민주권주의와 자유민주주의이고, 선거제도도 이 원리에서 출발한다.","cite":"헌재 88헌가6","badge":"","topic":"","from":"GY-2023-1-H-03","seq":null},{"id":"H-OX-021","subject":"헌법","unit":"헌법총론","stmt":"조세법의 영역에 있어서는 특별한 사정이 없는 한 현재의 세법이 변함없이 유지되리라는 납세자의 기대나 신뢰는 보호될 수 없다. (24.1차)","answer":true,"quote":"조세법규는 재정정책에 따라 바뀔 수밖에 없어, 특별한 사정이 없으면 현재 세법이 그대로 유지되리라는 기대는 보호되지 않는다.","cite":"헌재 2019헌바410","badge":"","topic":"","from":"GY-2024-1-H-03","seq":null},{"id":"H-OX-008","subject":"헌법","unit":"헌법총론","stmt":"제도적 보장은 객관적 제도를 헌법에 규정하여 당해 제도의 본질을 유지하려는 것으로서 헌법제정권자가 특히 중요하고도 가치가 있다고 인정되고 헌법적으로도 보장할 필요가 있다고 생각하는 국가제도를 헌법에 규정함으로써 장래의 법 발전, 법 형성의 방침과 범주를 미리 규율하려는 데 있다. (22.2차)","answer":true,"quote":"제도적 보장은 헌법제정권자가 특히 중요하다고 본 국가제도를 헌법에 두어 앞으로의 법 형성의 방향과 테두리를 미리 정해 둔 것이다.","cite":"헌재 95헌바48","badge":"","topic":"","from":"GY-2022-2-H-06","seq":null},{"id":"H-OX-044","subject":"헌법","unit":"헌법총론","stmt":"국제법존중주의는 국제법과 국내법의 동등한 효력을 인정한다는 취지이므로, ‘유엔 시민적·정치적 권리 규약 위원회’가 ｢국가 보안법｣의 폐지나 개정을 권고하였다는 이유만으로도 이적행위 조항과 이적표현물 소지조항은 국제법존중주의에 위배된다. (24.2차)","answer":false,"quote":"국제법존중주의는 국제법과 국내법이 같은 효력을 갖는다는 뜻일 뿐이라, 유엔 자유권위원회의 권고만으로 국가보안법 조항이 위헌이 되지는 않는다.","cite":"헌재 2023헌바381 · 헌법 제6조","badge":"","topic":"","from":"GY-2024-2-H-02","seq":null},{"id":"H-OX-032","subject":"헌법","unit":"헌법총론","stmt":"선거일 현재 1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람은 선거권이 없으나, 그 형의 집행유예를 선고받고 유예기간 중에 있는 사람은 선거권을 갖는다. (26.1차)","answer":true,"quote":"①선거일 현재 다음 각 호의 어느 하나에 해당하는 사람은 선거권이 없다. <개정 2004. 3. 12., 2005. 8. 4., 2015. 8. 13.> 1. 금치산선고를 받은 자 2. 1년 이상의 징역 또는 금고의 형의 선고를 받고 그 집행이 종료되지 아니하거나 그 집행을 받지 아니하기로 확정되지 아니한 사람. 다만, 그 형의 집행유예를 선고받고 유예기간 중에 있는 사람은 제외한다. 3. 선거범, 「정치자금법」 제45조(정치자금부정수수죄) 및 제49조(선거비용관련 위반행위에 관한 벌칙)에 규정된 죄를 범한 자 또는 대통령ㆍ국회의원ㆍ지방의회의원ㆍ지방자치단체의 장으로서 그 재임중의 직무와 관련하여 「형법」(「특정범죄가중처벌 등에 관한 법률」 제2조에 의하여 가중처벌되는 경우를 포함한다) 제129조(수뢰, 사전수뢰) 내지 제132조(알선수뢰)ㆍ「특정범죄가중처벌 등에 관한 법률」 제3조(알선수재)에 규정된 죄를 범한 자로서, 100만원이상의 벌금형의 선고를 받고 그 형이 확정된 후 5년 또는 형의 집행유예의 선고를 받고 그 형이 확정된 후 10년을 경과하지 아니하거나 징역형의 선고를 받고 그 집행을 받지 아니하기로 확정된 후 또는 그 형의 집행이 종료되거나 면제된 후 10년을 경과하지 아니한 자(刑이 失效된 者도 포함한다) 4. 법원의 판결 또는 다른 법률에 의하여 선거권이 정지 또는 상실된 자","cite":"공직선거법 제18조 제1항","badge":"","topic":"","from":"GY-2026-1-H-14","seq":null},{"id":"H-OX-028","subject":"헌법","unit":"헌법총론","stmt":"‘3‧1운동으로 건립된 대한민국임시정부의 법통을 계승’한다고 선언한 헌법 전문의 의미는 현행헌법이 일본제국주의의 식민 통치를 배격하고 우리 민족의 자주독립을 추구한 대한민국 임시정부의 정신을 헌법의 근간으로 하고 있다는 점을 뜻한다. (26.1차)","answer":true,"quote":"전문의 임시정부 법통 계승은 그 자주독립 정신을 헌법의 근간으로 삼는다는 선언이어서, 국가는 독립유공자와 유족을 예우할 헌법적 의무를 진다.","cite":"헌재 2008헌바141 · 헌재 2004헌마859","badge":"","topic":"","from":"GY-2026-1-H-04","seq":null},{"id":"H-OX-011","subject":"헌법","unit":"헌법총론","stmt":"관습헌법이 성립하기 위하여서는 관습이 성립하는 사항이 단지 법률로 정할 사항이 아니라 반드시 헌법에 의하여 규율되어 법률에 대하여 효력상 우위를 가져야 할 만큼 헌법적으로 중요한 기본적 사항이 되어야 한다. (23.1차)","answer":true,"quote":"관습헌법이 되려면 법률로 정할 일이 아니라 헌법으로 규율해 법률보다 우위에 둘 만큼 기본적이고 중요한 사항이어야 한다.","cite":"헌재 2004헌마554","badge":"","topic":"","from":"GY-2023-1-H-01","seq":null},{"id":"H-OX-002","subject":"헌법","unit":"헌법총론","stmt":"아동 청소년 성매수죄로 유죄가 확정된 자는 신상정보 등록대 상자가 되도록 규정한 성폭력범죄의 처벌 등에 관한 특례법 제42조 제1항 중 “구 아동 청소년의 성보호에 관한 법률 제2조 제2호 가운데 제10조 제1항의 범죄로 유죄판결이 확정된 자는 신상정보 등록대상자가 된다.”는 부분은 청구인의 개인정보자기 결정권을 침해하지 않는다. (22.1차)","answer":true,"quote":"아동·청소년 성매수죄는 죄질이 무거워, 유죄확정자를 모두 신상정보 등록대상으로 해도 개인정보자기결정권 침해가 아니다.","cite":"헌재 2013헌마830","badge":"","topic":"","from":"GY-2022-1-H-11","seq":null},{"id":"H-OX-042","subject":"헌법","unit":"헌법총론","stmt":"디엔에이감식시료의 채취대상자가 사망할 때까지 디엔에이신원 확인정보를 데이터베이스에 수록, 관리할 수 있도록 규정한 ｢디엔에이신원확인정보의 이용 및 보호에 관한 법률｣ 조항은 대상자의 재범위험성을 고려하지 않고 일률적으로 대상자가 사망할 때까지 디엔에이신원확인정보를 보관한다는 점에서 과잉금지원칙에 위배되어 디엔에이신원확인정보 수록 대상자인 청구인의 개인정보자기결정권을 침해한다. (24.1차)","answer":false,"quote":"디엔에이신원확인정보를 사망 때까지 보관하게 한 조항은 재범 수사에 필요하고 정보가 식별 부호에 그쳐 개인정보자기결정권 침해가 아니다.","cite":"헌재 2011헌마28","badge":"","topic":"","from":"GY-2024-1-H-16","seq":null},{"id":"H-OX-004","subject":"헌법","unit":"헌법총론","stmt":"대학의 자율성 즉, 대학의 자치란 대학이 그 본연의 임무인 연구와 교수를 외부의 간섭 없이 수행하기 위하여 인사 학사 시설 재정 등의 사항을 자주적으로 결정하여 운영하는 것을 말한다. 따라서 연구 교수활동의 담당자인 교수가 그 핵심주체라 할 것이나, 연구 교수활동의 범위를 좁게 한정할 이유가 없으므로 학생, 직원 등도 포함될 수 있다. (22.1차)","answer":true,"quote":"대학 자치의 핵심 주체는 교수지만, 연구·교수활동을 좁게 볼 이유가 없어 학생·직원도 주체가 될 수 있다.","cite":"헌재 2007헌마1189","badge":"","topic":"","from":"GY-2022-1-H-12","seq":null},{"id":"H-OX-003","subject":"헌법","unit":"헌법총론","stmt":"이사회와 재경위원회에 일정 비율 이상의 외부인사를 포함하는 내용 등을 담고 있는 구 국립대학법인 서울대학교 설립 운영에 관한 법률 규정의 이른바 ‘외부인사 참여 조항’이 대학의 자율의 본질적인 부분을 침해하였다고 볼 수 없다. (22.1차)","answer":true,"quote":"서울대 법인 이사회·재경위원회에 외부인사를 일정 비율 넣게 한 것은 투명한 의사결정을 위한 것이라 대학 자율의 본질 침해가 아니다.","cite":"헌재 2011헌마612","badge":"","topic":"","from":"GY-2022-1-H-12","seq":null},{"id":"H-OX-040","subject":"헌법","unit":"헌법총론","stmt":"법률에 따른 개인의 행위가 단지 법률이 반사적으로 부여하는 기회의 활용을 넘어서 국가에 의하여 일정 방향으로 유인된 것 이라면, 원칙적으로 국가의 법률개정이익이 개인의 신뢰보호에 우선된다고 볼 여지가 있다. (24.1차)","answer":false,"quote":"국가가 법률로 개인의 행위를 일정 방향으로 유인했다면 그 신뢰는 반사적 기회를 활용한 경우보다 더 강하게 보호된다.","cite":"헌재 2002헌바45","badge":"","topic":"","from":"GY-2024-1-H-03","seq":null},{"id":"H-OX-025","subject":"헌법","unit":"헌법총론","stmt":"대한민국 국적을 갖고 있지 아니한 국외강제동원 희생자의 유족을 위로금 지급 대상에서 제외한 ｢대일항쟁기 강제동원 피해조사 및 국외강제동원 희생자 등 지원에 관한 특별법｣ 조항이 ‘정의·인도와 동포애로써 민족의 단결을 공고히’ 할 것을 규정한 헌법전문의 정신에 위반된다고 볼 수 없다. (25.2차)","answer":true,"quote":"국외강제동원 희생자 위로금은 국민의 세금으로 주는 시혜적 급부라서, 대한민국 국적이 없는 유족을 빼도 합리적 이유가 있어 헌법전문의 정신에 위반되지 않는다.","cite":"헌재 2013헌바11","badge":"","topic":"","from":"GY-2025-2-H-02","seq":null},{"id":"H-OX-041","subject":"헌법","unit":"헌법총론","stmt":"지원에 의하여 현역복무를 마친 여성의 경우 현역복무 과정에서의 훈련과 경험을 통해 예비전력으로서의 자질을 갖추고 있을 것으로 추정할 수 있으므로 지원에 의하여 현역복무를 마친 여성을 예비역 복무의무자의 범위에서 제외한 ｢군인사법｣ 조항은 예비역 복무의무자인 남성인 청구인의 평등권을 침해한다. (24.1차)","answer":false,"quote":"지원해 현역을 마친 여성을 예비역 복무의무자에서 뺀 것은 병역제도 형성에 관한 입법재량 안이라 남성의 평등권 침해가 아니다.","cite":"헌재 2018헌마357","badge":"","topic":"","from":"GY-2024-1-H-10","seq":null},{"id":"H-OX-016","subject":"헌법","unit":"헌법총론","stmt":"헌법에서 규정된 영장신청권자로서의 검사는 검찰권을 행사하는 국가기관인 검사로서 공익의 대표자이자 수사단계에서의 인권 옹호기관으로서의 지위에서 그에 부합하는 직무를 수행하는 자를 의미하는 것이지 ｢검찰청법｣상 검사만을 지칭하는 것은 아니다. (23.1차)","answer":true,"quote":"헌법 에 규정된 영장신청권자로서의 검사는 검찰권을 행사하는 국가기관인 검사로서 공익의 대표자이자 수사단계에서의 인권옹호기관으로서의 지위에서 그에 부합하는 직무를 수행하는 자를 의미하는 것이지, 검찰청법상 검사만을 지칭하는 것으로 보기 어렵다.","cite":"헌재 2020헌마264","badge":"","topic":"","from":"GY-2023-1-H-11","seq":null},{"id":"H-OX-033","subject":"헌법","unit":"헌법총론","stmt":"신뢰보호원칙은 객관적 요소로서 법질서의 신뢰성 항구성 법적 투명성과 법적 평화를 의미하고, 이와 내적인 상호 연관 관계에 있는 법적 안정성은 한번 제정된 법규범은 원칙적으로 존속력을 갖고 자신의 행위기준으로 작용하리라는 개인의 주관적 기대이다. (22.1차)","answer":false,"quote":"법질서의 신뢰성·항구성·투명성이라는 객관적 요소는 법적 안정성이고, 법이 존속하리라는 개인의 주관적 기대가 신뢰보호다 — 지문은 둘을 맞바꿨다.","cite":"헌재 96헌가2","badge":"","topic":"","from":"GY-2022-1-H-03","seq":null},{"id":"H-OX-037","subject":"헌법","unit":"헌법총론","stmt":"관습헌법도 성문헌법과 마찬가지로 주권자인 국민의 헌법적 결단의 의사 표현이고 성문헌법과 동등한 효력을 가지며, 관습헌법의 요건들은 그 성립의 요건일 뿐 효력 유지의 요건은 아니다. (23.1차)","answer":false,"quote":"관습헌법의 요건은 성립요건이자 효력유지요건이라, 국민적 합의가 사라지면 관습헌법도 효력을 잃는다.","cite":"헌재 2004헌마554","badge":"","topic":"","from":"GY-2023-1-H-01","seq":null},{"id":"H-OX-102","subject":"헌법","unit":"기본권론","stmt":"정당은 국민의 정치적 의사형성에 참여하기 위한 조직이지만， 구성원과는 독립하여 그 자체로서 기본권의 주체가 될 수 있다. (23.2차)","answer":true,"quote":"정당은 당원과 별개로 그 자체가 기본권의 주체가 되어, 정당설립·활동의 자유 등을 스스로 주장할 수 있다.","cite":"헌법 제8조","badge":"","topic":"","from":"GY-2023-2-H-05","seq":null},{"id":"H-OX-160","subject":"헌법","unit":"기본권론","stmt":"지역농협 이사 선거의 경우 전화(문자메시지를 포함한다)·컴퓨터 통신(전자우편을 포함한다)을 이용한 지지 호소의 선거운동방법을 금지하고, 이를 위반한 자를 처벌하는 구 ｢농업협동조합법｣ 조항은 과잉금지원칙을 위반하여 청구인들의 결사의 자유, 표현의 자유를 침해하여 헌법에 위반된다. (25.2차)","answer":true,"quote":"지역농협 이사 선거에서 전화·문자·전자우편으로 지지를 호소하는 것까지 금지하고 처벌하면 결사의 자유와 표현의 자유를 침해해 위헌이다.","cite":"헌재 2015헌바62","badge":"","topic":"","from":"GY-2025-2-H-08","seq":null},{"id":"H-OX-229","subject":"헌법","unit":"기본권론","stmt":"구치소･치료감호시설에 수용 중인 자에 대하여 ｢국민기초생활 보장법｣에 의한 중복적인 보장을 피하기 위하여 기초생활보장 제도의 보장단위인 개별가구에서 제외하기로 한 입법자의 판단은 헌법상 용인될 수 있는 재량의 범위를 일탈하여 구치소･치료 감호시설에 수용 중인 자인 청구인의 인간다운 생활을 할 권리를 침해한다. (23.2차)","answer":false,"quote":"구치소·치료감호시설 수용자는 국가가 이미 의식주를 보장하므로, 기초생활보장 개별가구에서 빼도 입법재량 안이다.","cite":"헌재 2011헌마123","badge":"","topic":"","from":"GY-2023-2-H-14","seq":null},{"id":"H-OX-069","subject":"헌법","unit":"기본권론","stmt":"종교의 자유에는 선교의 자유가 포함되고, 선교의 자유에는 다른 종교를 비판하거나 다른 종교의 신자에 대하여 개종을 권고하는 자유도 포함된다. (22.2차)","answer":true,"quote":"우리 헌법 제20조 제1항 은 \"모든 국민은 종교의 자유를 가진다.\"고 규정하고 있는데, 종교의 자유에는 자기가 신봉하는 종교를 선전하고 새로운 신자를 규합하기 위한 선교의 자유가 포함되고, 선교의 자유에는 다른 종교를 비판하거나 다른 종교의 신자에 대하여 개종을 권고하는 자유도 포함되는바, 종교적 선전과 타 종교에 대한 비판 등은 동시에 표현의 자유의 보호대상이 되는 것이나, 그 경우 종교의 자유에 관한 헌법 제20조 제1항 은 표현의 자유에 관한 헌법 제21조 제1항 에 대하여 특별규정의 성격을 갖는다 할 것이므로 종교적 목적을 위한 언론·출판의 경우에는 그 밖의 일반적인 언론·출판에 비하여 고도의 보장을 받게 되고, 특히 그 언론·출판의 목적이 다른 종교나 종교집단에 대한 신앙교리 논쟁으로서 같은 종파에 속하는 신자들에게 비판하고자 하는 내용을 알리고 아울러 다른 종파에 속하는 사람들에게도 자신의 신앙교리 내용과 반대종파에 대한 비판의 내용을 알리기 위한 것이라면 그와 같은 비판할 권리는 최대한 보장받아야 할 것인바, 그로 인하여 타인의 명예 등 인격권을 침해하는 경우에 종교의 자유 보장과 개인의 명예 보호라는 두 법익을 어떻게 조정할 것인지는 그 비판행위로 얻어지는 이익, 가치와 공표가 이루어진 범위의 광협, 그 표현방법 등 그 비판행위 자체에 관한 제반 사정을 감안함과 동시에 그 비판에 의하여 훼손되거나 훼손될 수 있는 타인의 명예 침해의 정도를 비교 고려하여 결정하여야 한다.","cite":"대법원 2006다87903","badge":"","topic":"","from":"GY-2022-2-H-12","seq":null},{"id":"H-OX-199","subject":"헌법","unit":"기본권론","stmt":"인터넷언론사에 대하여 선거일 전 90일부터 선거일까지 후보자 명의의 칼럼이나 저술을 게재하는 보도를 제한하는 구 인터넷 선거보도 심의기준 등에 관한 규정 은 인터넷 선거보도의 공정성과 선거의 공정성을 확보하려는 것이므로 후보자인 청구인의 표현의 자유를 침해하지 않는다. (22.1차)","answer":false,"quote":"선거일 전 90일부터 후보자 명의 칼럼을 공정성 판단 없이 일률적으로 막는 것은 덜 제약적인 수단이 있어 표현의 자유를 침해한다.","cite":"헌재 2016헌마90","badge":"","topic":"","from":"GY-2022-1-H-09","seq":null},{"id":"H-OX-222","subject":"헌법","unit":"기본권론","stmt":"인터넷언론사가 선거운동기간 중 당해 홈페이지 게시판 등에 정당･후보자에 대한 지지･반대 등의 정보를 게시하는 경우 실명을 확인받도록 정한 ｢공직선거법｣ 조항은 인터넷언론사를 통한 정보의 특성과 우리나라 선거문화의 현실 등을 고려하고 선거의 공정성 확보를 위한 것으로, 게시판 이용자의 정치적 익명표현의 자유, 개인정보자기결정권 및 인터넷언론사의 언론의 자유를 침해한다고 볼 수 없다. (23.1차)","answer":false,"quote":"인터넷언론사는 선거운동기간 중 당해 홈페이지 게시판 등에 정당ㆍ후보자에 대한 지지ㆍ반대 등의 정보를 게시하는 경우 실명을 확인받는 기술적 조치를 하도록 정한 공직선거법 조항(이하 ‘실명확인 조항’이라 한다) 중 \"인터넷언론사\" 및 \"지지ㆍ반대\" 부분이 명확성원칙에 위배되는지 여부(소극)","cite":"헌재 2018헌마456","badge":"","topic":"","from":"GY-2023-1-H-17","seq":null},{"id":"H-OX-136","subject":"헌법","unit":"기본권론","stmt":"사생활의 비밀과 자유는 개인의 내밀한 내용의 비밀을 유지할 권리, 개인이 자신의 사생활의 불가침을 보장받을 수 있는 권리, 개인의 양심영역이나 성적 영역과 같은 내밀한 영역에 대한 보호, 인격적인 감정세계의 존중의 권리와 정신적인 내면생활이 침해받지 아니할 권리 등을 보호한다. (24.1차)","answer":true,"quote":"사생활의 비밀과 자유는 내밀한 비밀 유지, 사생활 불가침, 양심·성적 영역 같은 내밀한 영역, 인격적 감정세계와 내면생활을 보호한다.","cite":"헌재 2002헌마518","badge":"","topic":"","from":"GY-2024-1-H-15","seq":null},{"id":"H-OX-290","subject":"헌법","unit":"기본권론","stmt":"위반행위자 등이 ｢개발제한구역의 지정 및 관리에 관한 특별조치법｣ 위반으로 인해 시정명령을 받고도 이를 이행하지 아니한 경우에 이를 상당한 기간까지 이행하지 않으면 이행강제금을 부과‧징수 한다는 뜻을 토지 소유자에게 미리 문서로 계고하도록 하는 동법 조항은, 이행강제금이 부과되는 이행 기간의 대략을 법률로 직접 정하지 않고 ‘상당한 기간’으로만 규정하여 법률유보원칙 및 명확성원칙에 위배된다. (26.1차)","answer":false,"quote":"사전계고의 '상당한 기간'은 시정명령이 먼저 있고 이행강제금이 1년에 2회로 제한되어 대략 예측할 수 있어, 법률유보·명확성원칙에 어긋나지 않는다.","cite":"헌재 2019헌바550","badge":"","topic":"","from":"GY-2026-1-H-07","seq":null},{"id":"H-OX-262","subject":"헌법","unit":"기본권론","stmt":"서울대학교 2023학년도 저소득학생 특별전형의 모집인원을 모두 수능위주전형으로 선발하도록 정한 ‘서울대학교 2023학년도 대학 신입학생 입학전형 시행계획’은 저소득학생 특별전형에 응시하고자 하는 수험생들의 기회를 불합리하게 박탈하였고, 이는 대학의 자율성의 범위 내에 있는 것으로 볼 수 없다. (24.2차)","answer":false,"quote":"저소득학생 특별전형을 수능 성적만으로 뽑기로 한 것은 대학 자율성의 범위 안이라 응시 기회를 불합리하게 빼앗은 것이 아니다.","cite":"헌재 2021헌마929","badge":"","topic":"","from":"GY-2024-2-H-17","seq":null},{"id":"H-OX-186","subject":"헌법","unit":"기본권론","stmt":"순직한 군인의 유족이 다른 법령에 따라 보상을 지급받을 수 있을 때에는 국가에 대하여 손해배상을 청구할 수 없도록 규정한 ｢국가배상법｣ 조항은 헌법 제29조 제2항에 직접 근거 하고, 실질적으로 같은 내용을 규정한 것이므로 헌법 제29조 제2항의 위임범위를 일탈하였다고 볼 수 없다. (26.1차)","answer":true,"quote":"순직한 군인의 유족이 다른 법령에 따라 보상을 지급받을 수 있을 때에는 국가에 대하여 손해배상을 청구할 수 없도록 규정한 국가배상법 제2조 제1항 단서 중 ‘직무 집행과 관련하여 순직한 군인의 유족’에 관한 부분(이하 ‘심판대상조항’이라 한다)이 헌법 제29조 제2항의 위임범위를 일탈하였는지 여부(소극)","cite":"헌재 2021헌바86","badge":"","topic":"","from":"GY-2026-1-H-16","seq":null},{"id":"H-OX-297","subject":"헌법","unit":"기본권론","stmt":"｢국가배상법｣ 제2조 제1항 소정의 ‘직무를 집행함에 당하여’라 함은 직접 공무원의 직무집행행위이거나 그와 밀접한 관계에 있는 행위를 의미하며, 이를 판단함에 있어서는 행위 자체의 외관을 객관적으로 관찰하여 공무원의 직무행위로 보여지고 그것이 실질적으로 직무행위에 속하는 경우에만 공무원이 ‘직무를 집행함에 당하여’ 한 것으로 보아야 한다. (26.1차)","answer":false,"quote":"국가배상법 제2조 제1항 의 '직무를 집행함에 당하여'라 함은 직접 공무원의 직무집행행위이거나 그와 밀접한 관련이 있는 행위를 포함하고, 이를 판단함에 있어서는 행위 자체의 외관을 객관적으로 관찰하여 공무원의 직무행위로 보여질 때에는 비록 그것이 실질적으로 직무행위가 아니거나 또는 행위자로서는 주관적으로 공무집행의 의사가 없었다고 하더라도 그 행위는 공무원이 '직무를 집행함에 당하여' 한 것으로 보아야 한다.","cite":"대법원 2004다26805","badge":"","topic":"","from":"GY-2026-1-H-16","seq":null},{"id":"H-OX-176","subject":"헌법","unit":"기본권론","stmt":"일반적으로 근로자가 노동조합의 조합원이 될 것을 고용조건 으로 하는 단체협약상의 규정을 유니언 샵(Union Shop) 협정 이라고 하는데, 이는 노동조합이 그 조직을 유지·강화하기 위하여 조합원지위의 취득과 유지를 강제하는 단체협약상의 제도로서, 노동조합의 대표적인 조직강제 수단의 하나에 해당한다. (25.2차)","answer":true,"quote":"유니언 샵 협정은 조합원이 될 것을 고용조건으로 하는 단체협약 조항으로, 조합원 지위의 취득·유지를 강제하는 대표적인 조직강제 수단이다.","cite":"헌재 2002헌바95","badge":"","topic":"","from":"GY-2025-2-H-20","seq":null},{"id":"H-OX-219","subject":"헌법","unit":"기본권론","stmt":"법무부령이 정하는 금액 이상의 추징금 미납자에 대해 출국금지를 규정한구 ｢출입국관리법｣ 조항은 기본권에 대한침해가 적은 수단이 마련되어 있음에도 불구하고 추징금 납부를 강제하기 위한 압박 수단으로 출국금지를 하는 것으로, 이는 필요한 정도를 넘는 과도한 출국의 자유를 제한하는 것이어서 과잉금지원칙에 위배된다. (23.1차)","answer":false,"quote":"일정 금액 이상 추징금 미납자의 출국금지는 재산의 해외 도피를 막아 집행을 확보하려는 것으로 과잉금지원칙에 위배되지 않는다.","cite":"헌재 2003헌가18","badge":"","topic":"","from":"GY-2023-1-H-14","seq":null},{"id":"H-OX-131","subject":"헌법","unit":"기본권론","stmt":"남북합의서 위반행위로서 전단등 살포를 하여 국민의 생명･ 신체에 위해를 끼치거나 심각한 위험을 발생시키는 것을 금지하고 이를 위반한 경우 처벌하는 ｢남북관계 발전에 관한 법률｣ 조항은 그 궁극적인 의도가 북한 주민을 상대로 한 북한 체제 비판 등의 내용을 담은 표현을 제한하는 데 있다는 점에서 표현의 내용과 무관한 내용중립적 규제로 보기는 어렵다. (24.1차)","answer":true,"quote":"북합의서 위반행위로서 전단등 살포를 하여 국민의 생명ㆍ신체에 위해를 끼치거나 심각한 위험을 발생시키는 것을 금지하는 남북관계 발전에 관한 법률 제24조 제1항 제3호 및 이에 위반한 경우 처벌하는 같은 법 제25조 중 제24조 제1항 제3호에 관한 부분(이하 이들 조항을 합하여 ‘심판대상조항’이라 한다)이 청구인들의 표현의 자유를 침해하는지 여부(적극)","cite":"헌재 2020헌마1724","badge":"","topic":"","from":"GY-2024-1-H-13","seq":null},{"id":"H-OX-265","subject":"헌법","unit":"기본권론","stmt":"｢공무원연금법｣에 따른 퇴직연금일시금을 받은 사람에게 기초 연금을 지급하지 아니하도록 한 ｢기초연금법｣ 및 동법 시행령 조항은 퇴직연금일시금의 액수 및 수령시점, 현존 여부 등을 고려하지 않은 채 퇴직연금일시금을 받은 사람을 무조건 기초 연금 지급대상에서 제외하고 있으므로, 퇴직연금일시금 수령자의 인간다운 생활을 할 권리를 침해한다. (24.2차)","answer":false,"quote":"퇴직연금일시금을 받은 사람을 기초연금에서 빼는 것은 한정된 재원으로 노인 생활을 돕기 위한 합리적 선택이라 인간다운 생활을 할 권리 침해가 아니다.","cite":"헌재 2017헌바197","badge":"","topic":"","from":"GY-2024-2-H-18","seq":null},{"id":"H-OX-300","subject":"헌법","unit":"기본권론","stmt":"직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자간의 권리행사방해죄는 그 형을 면제하도록 한 ｢형법｣ 조항은 가족 생활의 자유를 직접 제한하는 것이다. (26.1차)","answer":false,"quote":"직계혈족, 배우자, 동거친족, 동거가족 또는 그 배우자간의 권리행사방해죄는 그 형을 면제하도록 한 형법 제328조 제1항(이하 ‘심판대상조항’이라 한다)이 형사피해자의 재판절차진술권을 침해하는지 여부(적극)","cite":"헌재 2020헌마468","badge":"","topic":"","from":"GY-2026-1-H-20","seq":null},{"id":"H-OX-274","subject":"헌법","unit":"기본권론","stmt":"헌법상 근로의 권리에, 열악한 근로환경을 갖춘 사업장을 이탈하여 다른 사업장으로 이직함으로써 사적(私的)으로 근로환경을 개선 하거나 해결하는 방법을 보장하는 것도 포함된다고 할 것이므로, 외국인근로자의 사업장 변경 횟수를 제한하는 ｢외국인근로자의 고용 등에 관한 법률｣ 제25조 제4항은 근로의 권리를 제한한다. (25.1차)","answer":false,"quote":"근로의 권리에 열악한 사업장을 떠나 사적으로 근로환경을 고칠 방법까지 들어 있지는 않아, 사업장 변경 제한은 근로의 권리를 제한하지 않는다.","cite":"헌재 2020헌마395","badge":"","topic":"","from":"GY-2025-1-H-18","seq":null},{"id":"H-OX-109","subject":"헌법","unit":"기본권론","stmt":"변호사의 자격이 있는 자에게 더 이상 세무사 자격을 부여하지 않는 구 ｢세무사법｣ 조항은 시행일 이후 변호사 자격을 취득한 청구인의 직업선택의 자유를 침해한다고 볼 수 없다. (23.2차)","answer":true,"quote":"가.변호사의 자격이 있는 자에게 더 이상 세무사 자격을 부여하지 않는 구 세무사법 제3조 (이하 ‘이 사건 법률조항’이라 한다)가 시행일 이후 변호사 자격을 취득한 청구인들의 직업선택의 자유를 침해하는지 여부(소극)","cite":"헌재 2018헌마279","badge":"","topic":"","from":"GY-2023-2-H-10","seq":null},{"id":"H-OX-098","subject":"헌법","unit":"기본권론","stmt":"헌법 제21조 제4항은 “언론･출판은 타인의 명예나 권리 또는 공중도덕이나 사회윤리를 침해하여서는 아니 된다.”고 규정하고 있는 바, 이는 언론･출판의 자유에 따르는 책임과 의무를 강조하는 동시에 언론･출판의 자유에 대한 제한의 요건을 명시한 규정으로 볼 것이고, 헌법상 표현의 자유의 보호영역 한계를 설정한 것이라고는 볼 수 없다. (23.1차)","answer":true,"quote":"헌법 제21조 제4항은 언론·출판의 책임과 제한 요건을 밝힌 것이지 표현의 자유 보호영역의 한계를 정한 것이 아니다.","cite":"헌재 2006헌바109","badge":"","topic":"","from":"GY-2023-1-H-17","seq":null},{"id":"H-OX-210","subject":"헌법","unit":"기본권론","stmt":"종교단체의 복지시설 운영에 대한 제한은 종교단체 내 복지 시설을 운영하는 법인의 인격권 및 법인운영의 자유를 제한 하는 것이므로 종교의 자유 침해가 아닌 법인운영의 자유를 침해하는지 여부에 대한 문제로 귀결된다. (22.2차)","answer":false,"quote":"종교단체의 복지시설 운영은 종교의 자유의 영역이라, 그 제한은 법인운영의 자유가 아니라 종교의 자유 침해 여부의 문제로 판단한다.","cite":"헌재 2015헌바46","badge":"","topic":"","from":"GY-2022-2-H-12","seq":null},{"id":"H-OX-114","subject":"헌법","unit":"기본권론","stmt":"대학의 자율권은 헌법상의 기본권이므로 기본권제한의 일반적 법률유보의 원칙을 규정한 헌법 제37조 제2항에 따라 제한될 수 있고, 대학의 자율의 구체적인 내용은 법률이 정하는 바에 의하여 보장된다. (23.2차)","answer":true,"quote":"대학의 자율도 헌법상의 기본권이므로 기본권제한의 일반적 법률유보의 원칙을 규정한 헌법 제37조 제2항에 따라 제한될 수 있고, 대학의 자율의 구체적인 내용은 법률이 정하는 바에 의하여 보장되며, 또한 국가는 헌법 제31조 제6항에 따라 모든 학교제도의 조직, 계획, 운영, 감독에 관한 포괄적인 권한 즉, 학교제도에 관한 전반적인 형성권과 규율권을 부여받았다고 할 수 있고, 다만 그 규율의 정도는 그 시대의 사정과 각급 학교에 따라 다를 수 밖에 없는 것이므로 교육의 본질을 침해하지 않는 한 궁극적으로는 입법권자의 형성의 자유에 속하는 것이라 할 수 있다.","cite":"헌재 2005헌마1047","badge":"","topic":"","from":"GY-2023-2-H-12","seq":null},{"id":"H-OX-054","subject":"헌법","unit":"기본권론","stmt":"통신비밀보호법 상 ‘통신’이라 함은 우편물 및 전기통신을 말한다. (22.1차)","answer":true,"quote":"1. \"통신\"이라 함은 우편물 및 전기통신을 말한다.","cite":"통신비밀보호법 제2조","badge":"","topic":"","from":"GY-2022-1-H-14","seq":null},{"id":"H-OX-174","subject":"헌법","unit":"기본권론","stmt":"｢사립학교법｣상 명예퇴직수당은 교원이 정년까지 근무할 경우에 받게 될 장래 임금의 보전이나 퇴직 이후의 생활안정을 보장 하는 사회보장적 급여가 아니라 장기근속 교원의 조기 퇴직을 유도하기 위한 특별장려금이라고 할 것이다. (25.2차)","answer":true,"quote":"사립학교 교원의 명예퇴직수당은 장래 임금 보전이나 퇴직 후 생활 보장을 위한 사회보장적 급여가 아니라, 장기근속 교원의 조기 퇴직을 이끄는 특별장려금이다.","cite":"헌재 2003헌마533","badge":"","topic":"","from":"GY-2025-2-H-19","seq":null},{"id":"H-OX-064","subject":"헌법","unit":"기본권론","stmt":"소주도매업자로 하여금 그 영업장소 소재지에서 생산되는 자도 소주를 의무적으로 총구입액의 100분의 50이상을 구입하도록 하는 자도소주 구입명령제도는 소비자가 자신의 의사에 따라 자유롭게 상품을 선택하는 자기결정권을 제한한다. (22.2차)","answer":true,"quote":"도매업자에게 그 지역 소주를 절반 이상 사게 한 자도소주 구입명령은 소비자가 상품을 고를 자기결정권까지 제한한다.","cite":"헌재 96헌가18","badge":"","topic":"","from":"GY-2022-2-H-07","seq":null},{"id":"H-OX-056","subject":"헌법","unit":"기본권론","stmt":"공무원연금법 에 따른 퇴직연금일시금을 지급받은 사람 및 그 배우자를 기초연금 수급권자의 범위에서 제외하는 것은 한정된 재원으로 노인의 생활안정과 복리향상이라는 기초연금법 의 목적을 달성하기 위한 것으로서 합리성이 인정되므로 인간다운 생활을 할 권리를 침해한다고 볼 수 없다. (22.1차)","answer":true,"quote":"공무원연금 퇴직연금일시금을 받은 사람과 배우자를 기초연금에서 뺀 것은 한정된 재원을 나누는 합리적 기준이라 인간다운 생활권 침해가 아니다.","cite":"헌재 2018헌바398","badge":"","topic":"","from":"GY-2022-1-H-15","seq":null},{"id":"H-OX-184","subject":"헌법","unit":"기본권론","stmt":"금고 이상의 형의 집행유예를 선고받고 일정 기간이 지나지 아니한 사람은 행정사가 될 수 없다고 규정한 ｢행정사법｣ 조항은, 행정사의 공정성 및 신뢰성을 확보하기 위한 것으로 과잉금지원칙에 위배되어 직업선택의 자유를 침해하지 않는다. (26.1차)","answer":true,"quote":"행정사는 국민의 권리·의무에 관한 서류를 다루므로, 금고 이상 형의 집행유예 뒤 일정 기간이 지나지 않은 사람을 배제해도 직업선택의 자유를 침해하지 않는다.","cite":"헌재 2022헌마1045","badge":"","topic":"","from":"GY-2026-1-H-11","seq":null},{"id":"H-OX-180","subject":"헌법","unit":"기본권론","stmt":"헌법 제10조는 모든 국민이 인간으로서의 존엄과 가치를 지닌 주체임을 천명하고, 국가권력이 국민의 기본권을 침해하는 것을 금지함은 물론 이에서 더 나아가 적극적으로 국민의 기본권을 보호하고 이를 실현할 의무가 있음을 선언하고 있다. (26.1차)","answer":true,"quote":"헌법 제10조는 국가에 기본권을 침해하지 말 의무와 함께, 적극적으로 기본권을 보호하고 실현할 의무까지 지운다.","cite":"헌재 2006헌마711 · 헌법 제10조","badge":"","topic":"","from":"GY-2026-1-H-06","seq":null},{"id":"H-OX-079","subject":"헌법","unit":"기본권론","stmt":"헌법 제32조 및 제33조에 각 규정된 근로기본권은 근로자의 근로조건을 개선함으로써 그들의 경제적 사회적 지위의 향상을 기하기 위한 것으로서 자유권적 기본권으로서의 성격보다는 생존권 내지 사회적 기본권으로서의 측면이 보다 강한 것으로서 그 권리의 실질적 보장을 위해서는 국가의 적극적인 개입과 뒷받침이 요구되는 기본권이다. (22.2차)","answer":true,"quote":"근로기본권은 근로자의 지위 향상을 위한 것이라 자유권보다 사회권 성격이 강해 국가의 적극적 개입과 뒷받침이 필요하다.","cite":"헌재 89헌가106","badge":"","topic":"","from":"GY-2022-2-H-18","seq":null},{"id":"H-OX-057","subject":"헌법","unit":"기본권론","stmt":"환경권의 내용과 행사는 법률에 의해 구체적으로 정해지는 것 이기는 하나(헌법 제35조 제2항), 이 헌법조항의 취지는 특별히 명문으로 헌법에서 정한 환경권을 입법자가 그 취지에 부합하도록 법률로써 내용을 구체화하도록 한 것이지 환경권이 완전히 무의미 하게 되는데도 그에 대한 입법을 전혀 하지 아니하거나, 어떠한 내용이든 법률로써 정하기만 하면 된다는 것은 아니다. (22.1차)","answer":true,"quote":"환경권을 법률로 정하게 한 것은 취지에 맞게 구체화하라는 뜻이지 입법을 안 하거나 아무 내용이나 정해도 된다는 뜻이 아니다.","cite":"헌재 2018헌마730 · 헌법 제35조","badge":"","topic":"","from":"GY-2022-1-H-17","seq":null},{"id":"H-OX-247","subject":"헌법","unit":"기본권론","stmt":"법률에서 일부 내용을 하위법령에 위임할 때, 해당 법률에서 사용된 추상적 용어가 하위법령에서 규정될 내용과는 별도로 독자적인 규율 내용을 정하려는 것이라도 포괄위임금지원칙 위반 여부와 별도로 명확성원칙이 문제될 수 없다. (24.2차)","answer":false,"quote":"법률의 추상적 용어가 하위법령 내용과 따로 독자적 규율을 정하려는 것이면 명확성원칙이 별도로 문제 되고, 범위를 정해 주는 역할이면 포괄위임 문제로 흡수된다.","cite":"헌재 2013헌바204","badge":"","topic":"","from":"GY-2024-2-H-06","seq":null},{"id":"H-OX-049","subject":"헌법","unit":"기본권론","stmt":"수용자를 교정시설에 수용할 때마다 전자영상 검사기를 이용하여 수용자의 항문 부위에 대한 신체검사를 하는 것이 수용자의 인격권을 침해하는 것은 아니다. (22.1차)","answer":true,"quote":"입소 때마다 전자영상 검사기로 항문 부위를 살피는 신체검사는 금지물품 반입을 막는 데 필요해 인격권 침해가 아니다.","cite":"헌재 2010헌마775","badge":"","topic":"","from":"GY-2022-1-H-07","seq":null},{"id":"H-OX-235","subject":"헌법","unit":"기본권론","stmt":"거주･이전의 자유는 인간의 권리에 해당하므로 외국인에게 거주･ 이전의 자유의 내용인 출･입국의 자유에 대한 기본권주체성이 인정된다. (24.1차)","answer":false,"quote":"외국인에게 입국의 자유는 기본권으로 인정되지 않는다 — 출국의 자유와 달리 누구를 받아들일지는 국가가 정한다.","cite":"헌재 2011헌마502","badge":"","topic":"","from":"GY-2024-1-H-05","seq":null},{"id":"H-OX-096","subject":"헌법","unit":"기본권론","stmt":"집단적인 폭행･협박･손괴･방화 등으로 공공의 안녕질서에 직접적인 위협을 가할 것이 명백한 집회 또는 시위의 주최를 금지하는 구 ｢집회 및 시위에 관한 법률｣ 조항은 집회의 자유를 침해하지 아니한다. (23.1차)","answer":true,"quote":"집단적 폭행·손괴 등으로 공공의 안녕질서에 직접적 위협을 가할 것이 명백한 집회의 주최 금지는 집회의 자유 침해가 아니다.","cite":"헌재 2008헌바118","badge":"","topic":"","from":"GY-2023-1-H-16","seq":null},{"id":"H-OX-094","subject":"헌법","unit":"기본권론","stmt":"종교전파의 자유는 누구에게나 자신의 종교 또는 종교적 확신을 알리고 선전하는 자유를 말하지만, 이러한 종교전파의 자유에는 국민에게 그가 선택한 임의의 장소에서 자유롭게 행사할 수 있는 권리까지 보장한다고 할 수 없다. (23.1차)","answer":true,"quote":"종교전파의 자유는 자기 종교를 알리고 권할 자유이지, 원하는 아무 장소에서나 행사할 권리까지 보장하지는 않는다.","cite":"헌재 2007헌마1366","badge":"","topic":"","from":"GY-2023-1-H-15","seq":null},{"id":"H-OX-048","subject":"헌법","unit":"기본권론","stmt":"임차인의 계약갱신요구권 행사 기간을 10년으로 규정한 상가 건물 임대차보호법 의 개정법 조항을 개정법 시행 후 갱신되는 임대차에 대하여도 적용하도록 규정한 동법 부칙의 규정은 신뢰 보호원칙에 위배되어 임대인의 재산권을 침해한다고 볼 수 없다. (22.1차)","answer":true,"quote":"가.개정법조항은 구 ‘상가건물 임대차보호법’ 제10조 제2항(이하 ‘구법조항’이라 한다)에서 5년으로 정하고 있던 임차인의 계약갱신요구권 행사 기간을 10년으로 연장하였고, 이 사건 부칙조항은 개정법조항을 개정법 시행 후 갱신되는 임대차에도 적용한다.","cite":"헌재 2019헌마106","badge":"","topic":"","from":"GY-2022-1-H-03","seq":null},{"id":"H-OX-133","subject":"헌법","unit":"기본권론","stmt":"누구든지 선거기간 중 선거에 영향을 미치게 하기 위하여 ‘그 밖의 집회나 모임’을 개최할 수 없고, 이를 위반하는 자를 처벌하는 ｢공직선거법｣ 조항은 선거의 공정이나 평온에 대한 구체적인 위험이 없는 경우에도 해당 목적을 위한 일반 유권자의 집회나 모임을 전면적으로 금지하고 위반 시 처벌한다는 점에서 과잉금지원칙에 위배되어 해당 일반 유권자의 집회의 자유를 침해한다. (24.1차)","answer":true,"quote":"선거기간 중 선거에 영향을 미치게 하기 위한 그 밖의 집회나 모임의 개최를 금지하는 공직선거법 제103조 제3항 중 ‘누구든지 선거기간 중 선거에 영향을 미치게 하기 위하여 그 밖의 집회나 모임을 개최할 수 없다’ 부분 및 이에 위반한 경우 처벌하는 공직선거법 제256조 제3항 제1호 카목 가운데 제103조 제3항 중 ‘누구든지 선거기간 중 선거에 영향을 미치게 하기 위하여 그 밖의 집회나 모임을 개최할 수 없다’ 부분(이하 ‘집회개최 금지조항’이라 한다)이 집회의 자유, 정치적 표현의 자유를 침해하는지 여부(적극)","cite":"헌재 2018헌바357","badge":"","topic":"","from":"GY-2024-1-H-14","seq":null},{"id":"H-OX-111","subject":"헌법","unit":"기본권론","stmt":"인터넷 언론사의 공개된 게시판･대화방에서 스스로의 의사에 의하여 정당･후보자에 대한 지지･반대의 글을 게시하는 행위가 사생활 비밀의 자유에 의하여 보호되는 영역이라고 할 수 없다. (23.2차)","answer":true,"quote":"인터넷언론사의 공개된 게시판ㆍ대화방에서 스스로의 의사에 의하여 정당ㆍ후보자에 대한 지지ㆍ반대의 글을 게시하는 행위가 양심의 자유나 사생활 비밀의 자유에 의하여 보호되는 영역이라고 할 수 없다.","cite":"헌재 2008헌마324","badge":"","topic":"","from":"GY-2023-2-H-11","seq":null},{"id":"H-OX-047","subject":"헌법","unit":"기본권론","stmt":"실종기간이 구법 시행기간 중에 만료되는 때에도 그 실종이 개정 민법 시행일 후에 선고된 때에는 상속에 관하여 개정 민법 의 규정을 적용하도록 한 민법 부칙의 조항은 재산권 보장에 관한 신뢰보호원칙에 위배된다고 볼 수 없다. (22.1차)","answer":true,"quote":"실종기간이 구법 시행기간 중에 만료되는 때에도 그 실종이 개정민법 시행일 후에 선고된 때에는 상속에 관하여 개정민법의 규정을 적용하도록 한 민법 부칙(1990. 1. 13.","cite":"헌재 2015헌바203","badge":"","topic":"","from":"GY-2022-1-H-03","seq":null},{"id":"H-OX-062","subject":"헌법","unit":"기본권론","stmt":"“대한민국의 국민으로서 자진하여 외국 국적을 취득한 자는 그 외국 국적을 취득한 때에 대한민국 국적을 상실한다.”는 국적법 조항은 청구인의 거주 이전의 자유 및 행복추구권을 침해하는 것은 아니다. (22.2차)","answer":true,"quote":"자진해서 외국 국적을 얻은 국민이 우리 국적을 잃게 한 조항은 복수국적을 막기 위한 것이라 거주·이전의 자유 침해가 아니다.","cite":"헌재 2011헌마502","badge":"","topic":"","from":"GY-2022-2-H-02","seq":null},{"id":"H-OX-234","subject":"헌법","unit":"기본권론","stmt":"중소기업중앙회는 ｢중소기업협동조합법｣에 의해 설치되고 국가가 그 육성을 위해 재정을 보조해주는 등 공법인적 성격을 강하게 가지고 있으므로 결사의 자유를 누릴 수 있는 단체에 해당되지는 않는다. (24.1차)","answer":false,"quote":"중소기업중앙회는 공법인적 성격이 있어도 회원들이 자율적으로 만든 사법인적 성격을 함께 가져 결사의 자유를 누린다.","cite":"헌재 2020헌가9","badge":"","topic":"","from":"GY-2024-1-H-05","seq":null},{"id":"H-OX-074","subject":"헌법","unit":"기본권론","stmt":"옥외집회 시위에 대한 경찰의 촬영행위는 증거보전의 필요성 및 긴급성, 방법의 상당성이 인정되는 때에는 헌법에 위반된다고 할 수 없으나, 경찰이 옥외집회 및 시위 현장을 촬영하여 수집한 자료의 보관 사용 등은 엄격하게 제한하여, 옥외집회 시위 참가자 등의 기본권 제한을 최소화해야 한다. (22.2차)","answer":true,"quote":"집회 현장 촬영은 증거보전의 필요성·긴급성과 방법의 상당성이 있으면 허용되나, 촬영 자료의 보관·사용은 엄격히 제한해야 한다.","cite":"헌재 2014헌마843","badge":"","topic":"","from":"GY-2022-2-H-14","seq":null},{"id":"H-OX-212","subject":"헌법","unit":"기본권론","stmt":"구 음반에관한법률 제3조 제1항이 비디오물을 포함하는 음반 제작자에 대하여 일정한 시설을 갖추어 문화공보부에 등록할 것을 명하는 것은 예술의 자유를 침해하는 것이다. (22.2차)","answer":false,"quote":"음반·비디오물 제작자에게 일정 시설을 갖춰 등록하게 한 것은 창작 내용이 아닌 제작 여건을 정한 것이어서 예술의 자유 침해가 아니다.","cite":"헌재 91헌바17","badge":"","topic":"","from":"GY-2022-2-H-15","seq":null},{"id":"H-OX-248","subject":"헌법","unit":"기본권론","stmt":"일반적 행동자유권의 보호영역에는 가치 있는 행동만 포함된다. (24.2차)","answer":false,"quote":"일반적 행동자유권은 가치 있는 행동만이 아니라 위험한 스포츠 같은 위험한 생활방식까지 보호한다.","cite":"헌재 2002헌마518","badge":"","topic":"","from":"GY-2024-2-H-07","seq":null},{"id":"H-OX-284","subject":"헌법","unit":"기본권론","stmt":"국가형벌권의 행사를 형법으로 규정하고자 할 때는 최소한의 행위에 국한되어야 하는 점, 단순한 추상적 판단이나 경멸적 감정의 표현행위에 대하여는 시민사회의 자기 교정기능에 맡기거나 민사적 책임을 지우는 것으로 규제할 수 있는 점 등을 종합하여 볼 때, ｢형법｣ 제311조 모욕죄 조항은 과잉금지원칙에 위반하여 표현의 자유를 침해한다. (25.2차)","answer":false,"quote":"모욕죄는 사람의 인격을 보호하려는 것으로 과잉금지원칙에 위반되지 않아 표현의 자유를 침해하지 않는다 — 지문의 논거는 반대의견이다.","cite":"헌재 2017헌바456","badge":"","topic":"","from":"GY-2025-2-H-18","seq":null},{"id":"H-OX-203","subject":"헌법","unit":"기본권론","stmt":"65세 미만의 일정한 노인성 질병이 있는 사람의 장애인 활동 지원급여 신청자격을 제한하는 장애인활동 지원에 관한 법률 제5조 제2호 본문 중 ‘ 노인장기요양보험법 제2조 제1호에 따른 노인 등’ 가운데 ‘65세 미만의 자로서 치매 뇌혈관성질환 등 대통령령으로 정하는 노인성 질병을 가진 자’에 관한 부분은 합리적 이유가 있다고 할 것이므로 평등원칙에 위반되지 않는다. (22.1차)","answer":false,"quote":"가. 65세 미만의 일정한 노인성 질병이 있는 사람의 장애인 활동지원급여 신청자격을 제한하는 ‘장애인활동 지원에 관한 법률’ 제5조 제2호 본문 중 ‘노인장기요양보험법 제2조 제1호에 따른 노인 등’ 가운데 ‘65세 미만의 자로서 치매ㆍ뇌혈관성질환 등 대통령령으로 정하는 노인성 질병을 가진 자’에 관한 부분(이하 ‘심판대상조항’이라 한다)이 평등원칙에 위반되는지 여부(적극)","cite":"헌재 2017헌가22","badge":"","topic":"","from":"GY-2022-1-H-15","seq":null},{"id":"H-OX-200","subject":"헌법","unit":"기본권론","stmt":"모든 국민은 신체의 자유를 가진다. 누구든지 법률과 적법절차에 의하지 아니하고는 체포 구속 압수 수색을 받지 아니하며, 법률에 의하지 아니하고는 심문 처벌 보안처분 또는 강제노역을 받지 아니한다. (22.1차)","answer":false,"quote":"① 모든 국민은 신체의 자유를 가진다. 누구든지 법률에 의하지 아니하고는 체포·구속·압수·수색 또는 심문을 받지 아니하며, 법률과 적법한 절차에 의하지 아니하고는 처벌·보안처분 또는 강제노역을 받지 아니한다. ② 모든 국민은 고문을 받지 아니하며, 형사상 자기에게 불리한 진술을 강요당하지 아니한다. ③ 체포·구속·압수 또는 수색을 할 때에는 적법한 절차에 따라 검사의 신청에 의하여 법관이 발부한 영장을 제시하여야 한다. 다만, 현행범인인 경우와 장기 3년 이상의 형에 해당하는 죄를 범하고 도피 또는 증거인멸의 염려가 있을 때에는 사후에 영장을 청구할 수 있다. ④ 누구든지 체포 또는 구속을 당한 때에는 즉시 변호인의 조력을 받을 권리를 가진다. 다만, 형사피고인이 스스로 변호인을 구할 수 없을 때에는 법률이 정하는 바에 의하여 국가가 변호인을 붙인다. ⑤ 누구든지 체포 또는 구속의 이유와 변호인의 조력을 받을 권리가 있음을 고지받지 아니하고는 체포 또는 구속을 당하지 아니한다. 체포 또는 구속을 당한 자의 가족등 법률이 정하는 자에게는 그 이유와 일시·장소가 지체없이 통지되어야 한다. ⑥ 누구든지 체포 또는 구속을 당한 때에는 적부의 심사를 법원에 청구할 권리를 가진다. ⑦ 피고인의 자백이 고문·폭행·협박·구속의 부당한 장기화 또는 기망 기타의 방법에 의하여 자의로 진술된 것이 아니라고 인정될 때 또는 정식재판에 있어서 피고인의 자백이 그에게 불리한 유일한 증거일 때에는 이를 유죄의 증거로 삼거나 이를 이유로 처벌할 수 없다.","cite":"헌법 제12조 제1항","badge":"","topic":"","from":"GY-2022-1-H-10","seq":null},{"id":"H-OX-283","subject":"헌법","unit":"기본권론","stmt":"｢식품 등의 표시‧광고에 관한 법률｣ 제8조 제1항 제1호는 ‘질병의 예방·치료에 효능이 있는 것으로 인식할 우려가 있는 표시 또는 광고’를 금지하는데, 이때 ‘질병’의 범위에 비만, 체지방 불균형 등이 포함되는지 여부가 불분명하고, ‘예방· 치료에 효능이 있는 것’의 의미도 불분명하여 금지되는 표시· 광고의 내용이 무엇인지 충분히 알 수 없으므로 명확성원칙에 위배되어 청구인의 직업의 자유를 침해한다. (25.2차)","answer":false,"quote":"「질병」과 「예방·치료에 효능이 있는 것」은 입법목적과 관련 규정으로 뜻을 알 수 있어 명확성원칙 위반이 아니고, 직업의 자유도 침해하지 않는다.","cite":"헌재 2019헌마1328","badge":"","topic":"","from":"GY-2025-2-H-17","seq":null},{"id":"H-OX-189","subject":"헌법","unit":"기본권론","stmt":"‘수학권’은 통상 국가에 대하여 교육조건의 개선‧정비와 교육 기회의 균등한 보장을 적극적으로 요구할 수 있는 권리로 이해되며, 헌법 제31조 제2항 내지 제6항은 수학권의 효율적인 보장을 위한 규정이다. (26.1차)","answer":true,"quote":"수학권은 국가에 교육조건 개선과 교육기회 균등을 적극 요구하는 권리이고, 헌법 제31조 제2항부터 제6항은 이를 효율적으로 보장하기 위한 규정이다.","cite":"헌재 89헌마88 · 헌법 제31조","badge":"","topic":"","from":"GY-2026-1-H-17","seq":null},{"id":"H-OX-172","subject":"헌법","unit":"기본권론","stmt":"｢공인중개사법｣을 위반하여 300만 원 이상의 벌금형을 받고 3년이 지나지 아니한 자가 임원으로 있는 중개법인의 등록을 필요적으로 취소하도록 규정한 ｢공인중개사법｣ 조항은 명확성원칙에 위반되어 중개법인의 직업의 자유를 침해하지 않는다. (25.2차)","answer":true,"quote":"벌금 300만 원 이상·3년 미경과 임원이 있는 중개법인 등록을 반드시 취소하게 한 조항은 명확성원칙·과잉금지원칙에 어긋나지 않아 직업의 자유를 침해하지 않는다.","cite":"헌재 2022헌바109","badge":"","topic":"","from":"GY-2025-2-H-17","seq":null},{"id":"H-OX-125","subject":"헌법","unit":"기본권론","stmt":"국내에 도착한 외국물품을 수입통관절차를 거치지 않고 다시 외국으로 반출하려면, 해당 물품의 품명･규격･수량 및 가격 등을 세관장에게 신고하도록 하는 ｢관세법｣ 조항은 환승 여행객인 청구인의 일반적 행동자유권을 제한한다. (24.1차)","answer":true,"quote":"통관 없이 다시 외국으로 가지고 나가는 물품을 세관에 신고하게 한 반송신고 의무는 환승 여행객의 일반적 행동자유권을 제한한다.","cite":"헌재 2020헌바177","badge":"","topic":"","from":"GY-2024-1-H-09","seq":null},{"id":"H-OX-243","subject":"헌법","unit":"기본권론","stmt":"인터넷 통신망을 통해 송·수신하는 전기통신에 대한 감청을 범죄수사를 위한 통신제한조치의 하나로 정한 ｢통신비밀보호법｣ 조항은 인터넷회선 감청을 위해 법원의 허가를 얻도록 정하고 있으나, 해당 인터넷회선을 통하여 흐르는 모든 정보가 감청 대상이 되므로 개별성, 특정성을 전제로 하는 영장주의를 유명무실하게 함으로써 감청대상자인 청구인의 사생활의 비밀과 자유를 침해한다. (24.1차)","answer":false,"quote":"인터넷회선 감청 조항은 집행·사후 단계에서 취득 자료를 통제할 장치가 없어 과잉금지원칙 위반으로 헌법불합치가 되었고, 영장주의 위반 여부는 따로 판단하지 않았다.","cite":"헌재 2016헌마263","badge":"","topic":"","from":"GY-2024-1-H-15","seq":null},{"id":"H-OX-182","subject":"헌법","unit":"기본권론","stmt":"수형자가 헌법소원 사건의 국선대리인인 변호사를 접견함에 있어서 접견의 목적이나 접견의 상대방 등을 고려할 때 그 접견 내용을 녹음, 기록하는 것이 허용되어서는 아니될 것임에도, 이를 녹음, 기록한 교도소장의 행위는 당해 수형자의 재판을 받을 권리를 침해한다. (26.1차)","answer":true,"quote":"헌법소원 국선대리인인 변호사와의 접견 내용을 녹음·기록한 것은 수형자의 재판을 받을 권리를 침해한다.","cite":"헌재 2011헌마398 · 헌법 제27조","badge":"","topic":"","from":"GY-2026-1-H-08","seq":null},{"id":"H-OX-276","subject":"헌법","unit":"기본권론","stmt":"｢기후위기 대응을 위한 탄소중립‧녹색성장 기본법 시행령｣ 제3조 제1항은 같은 법 제8조 제1항의 위임을 받아 2030년 중장기 감축목표의 구체적인 비율의 수치를 정한 것으로서, 과소보호 금지원칙에 반하여 기본권 보호의무를 위반하였으므로 청구인들의 환경권을 침해하였다. (25.1차)","answer":false,"quote":"탄소중립기본법 시행령 제3조 제1항은 같은 법 제8조 제1항의 위임을 받아 2030년 중장기 감축목표의 구체적인 비율의 수치를 정한 것일 뿐이므로, 과소보호금지원칙에 반하여 기본권 보호의무를 위반하였다고 볼 수 없어 청구인들의 환경권 등 기본권을 침해하지 않는다.","cite":"헌재 2020헌마389","badge":"","topic":"","from":"GY-2025-1-H-20","seq":null},{"id":"H-OX-159","subject":"헌법","unit":"기본권론","stmt":"결사의 자유에는 ‘단체활동의 자유’도 포함되는데, 단체활동의 자유는 단체 외부에 대한 활동뿐만 아니라 단체의 조직, 의사 형성의 절차 등의 단체의 내부적 생활을 스스로 결정하고 형성할 권리인 ‘단체 내부 활동의 자유’를 포함한다. (25.2차)","answer":true,"quote":"결사의 자유에 포함된 단체활동의 자유에는 외부 활동뿐 아니라 조직·의사형성 절차 같은 내부 생활을 스스로 정하는 단체 내부 활동의 자유도 들어 있다.","cite":"헌재 2011헌마562","badge":"","topic":""
